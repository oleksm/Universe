contract: planet-forge f3efbac/c4fe750 docs/registry-rules-contract-2026-10-24.md
duplicates:
- was: planet-pattern.arid.slope.alluvial-fan
  is: planet-pattern.fluvial.fan.alluvial-fan
  retired_source: arid.slope.alluvial_fan
  retained_vocabulary_id: 14
  retired_factors:
  - factor: planet-factor.tect-fault
    weight: 3
    why: Active range-front normal faults create relief and accommodation at the apex
    want: high
  - factor: planet-factor.tect-uplift
    weight: 1
    why: Uplift renews catchment relief and supply; ratio to basin subsidence sets fan entrenchment
    want: high
  - factor: planet-factor.slope-relief
    weight: 1
    why: Abrupt slope drop where confined channel exits; fan slope 1.5-25 deg
    want: high
  - factor: planet-factor.sed-supply
    weight: 3
    why: Coarse, abundant supply; calibre and catchment size set slope and area
    want: high
  - factor: planet-factor.rock-type
    weight: 1
    why: Mudstone or clay-rich saprolite source favours debris-flow fans; coarse permeable regolith gives fluvial
      fans
    want: high
  - factor: planet-factor.clim-storm
    weight: 3
    why: Intense rare storms trigger debris flows and sheetfloods
    want: high
  - factor: planet-factor.clim-arid
    weight: 1
    why: Arid/semi-arid with sparse vegetation; also humid areas with intense rain
    want: high
  - factor: planet-factor.clim-history
    weight: 1
    why: Pluvial-arid shifts cause aggradation/incision phases, fan segmentation
    want: high
  - factor: planet-factor.base-level
    weight: 1
    why: Basin floor or axial river trims toe; base-level fall entrenches fan
    want: high
  - factor: planet-factor.events
    weight: 1
    why: Debris flows and floods build lobes, avulsions
    want: high
  - factor: planet-factor.time
    weight: 1
    why: 1 kyr-1 Myr; desert varnish and pavements age the surfaces
    want: high
- was: planet-pattern.fluvial.piedmont.pediment
  is: planet-pattern.arid.slope.pediment
  retired_source: fluvial.piedmont.pediment
  retained_vocabulary_id: 56
  retired_factors:
  - factor: planet-factor.tect-uplift
    weight: 3
    why: tectonically quiescent front; fault activity favours fans instead
    want: high
  - factor: planet-factor.rock-type
    weight: 3
    why: granitic, grus-forming rock most common
    want: high
  - factor: planet-factor.clim-arid
    weight: 3
    why: arid, sparse vegetation, low bank cohesion
    want: high
  - factor: planet-factor.clim-storm
    weight: 1
    why: episodic floods and sheetwash plane the surface
    want: high
  - factor: planet-factor.rock-perm
    weight: 1
    why: high infiltration of grus favours planation
    want: high
  - factor: planet-factor.base-level
    weight: 1
    why: stable basin base level; slope 0.5-7 deg
    want: low
  - factor: planet-factor.regolith
    weight: 1
    why: thin transient alluvial veneer 0-5 m
    want: high
  - factor: planet-factor.time
    weight: 1
    why: 100 kyr-10 Myr
    want: high
- was: planet-pattern.arid.plateau.mesa-butte
  is: planet-pattern.structural.flat.mesa-butte
  retired_source: arid.plateau.mesa_butte
  retained_vocabulary_id: 12
  retired_factors:
  - factor: planet-factor.rock-layers
    weight: 3
    why: Resistant caprock (sandstone, conglomerate) over weak shale/siltstone (De Chelly over Organ Rock)
    want: high
  - factor: planet-factor.tect-fold
    weight: 1
    why: Near-horizontal strata (dip < ~5 deg); steeper dips give cuestas
    want: high
  - factor: planet-factor.tect-uplift
    weight: 3
    why: Plateau uplift drives river incision and dissection
    want: high
  - factor: planet-factor.rock-fracture
    weight: 1
    why: Joints in caprock localise retreat and set butte/spire outlines
    want: high
  - factor: planet-factor.clim-arid
    weight: 3
    why: 'Arid to semi-arid: sparse vegetation keeps free faces sharp'
    want: high
  - factor: planet-factor.groundwater
    weight: 1
    why: Basal sapping at caprock/shale contact undermines cliffs
    want: high
  - factor: planet-factor.clim-storm
    weight: 1
    why: Flash floods remove talus from weak slopes
    want: high
  - factor: planet-factor.base-level
    weight: 1
    why: River incision sets valley-floor height and remnant relief (up to ~300 m)
    want: high
  - factor: planet-factor.time
    weight: 1
    why: '1-30 Myr of scarp retreat: plateau, mesa, butte, spire'
    want: high
