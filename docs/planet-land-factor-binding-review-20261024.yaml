choices:
- factor: planet-factor.slope-relief
  decision: Conditional land-supplied proxy is appropriate; no active binding yet.
  field: planet-field.local-relief
  requirements:
  - Supply the exact formula, horizontal support/window, terrain revision, units and valid-data mask.
  - Distinguish cell height minus neighbourhood minimum from neighbourhood maximum minus minimum.
  - Specify reduction to the evaluator lattice; maximum, mean and nearest sample are different observations.
  - Record the producer and input hashes, grid spacing and boundary handling in run provenance.
  - Mark the reading as proxy, not a direct observation of slope, elevation and relief together.
  - Keep the coarse checkpoint reading unknown where the land product is absent.
  - Review the old invented 100 to 1500 m ramp against the chosen support; do not transfer it as calibrated.
  reason: >-
    The existing field means sample height above the lowest neighbouring sample.
    refine.py contains a transient neighbourhood maximum-minus-minimum relief and
    a separate height-above-channel computation; these are not automatically that field.
    The inspected gates.py only explicitly adds routed discharge to drivers.
- factor: planet-factor.base-level
  decision: Keep unavailable; do not bind to static local relief or height above channel.
  reason: >-
    The factor explicitly describes base-level history (fall/rise of sea, lake or
    trunk-river level). Static terrain differences do not supply the signed change,
    reference level or event age. A future history reading must name those quantities.
