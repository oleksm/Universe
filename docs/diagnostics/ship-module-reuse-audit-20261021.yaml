consumer_contract:
  revision: f767e0e6056d95ad612fa8e33689ea93738d0281
  source: ships:20261021-explorer-module-placement.yaml
  equipment: One stable modules.<id>, kind equipment, existing equipment.* record, centred position/rotation and
    real envelope; no implicit model scale.
  hull_bound: Each placement must match an actual hull fit slot; arbitrary free-fitting is not implemented.
  hull_free: Existing catalogue equipment can support layout studies with hull:null and no slot, but does not display
    the explorer hull GLB.
  architectural_floors: Editable decks floor/wall polygons are walking architecture, not stocked panel/shoe/clamp
    instances or a qualified load path.
  structural_stock: Explicit structure members/plates retain stock identity. No implemented holder/panel-instance
    layer or generic lining product field.
  ownership: One authoritative floor surface. Exclude module-owned meshes and non-exported reservations from hull
    export. Pilot seat/console replacement remains required.
tests:
  registry_regressions_passed: 47
  project_executable_declaration_cases_passed: 9
  independently_rerun: true
  expected_failures:
  - Unsearched inventory
  - Baked module mesh
  - Duplicate module BOM
  - Reservation promoted to equipment
  - Missing module treated as fabrication permission
  - Unknown record
  - Unresolved floor ownership
  - Unresolved consumer contract
  limits: Synthetic declaration checks do not detect arbitrary duplicate meshes, certify dimensions, prove mounts/services
    or test runtime placement. The actual project remains blocked before allocation.
  manual_check_attribution: Blender reports a live name-based fixture-removal assertion; registry did not independently
    inspect the live scene. This is not a generic mesh-ownership proof.
remaining:
- Module choice remains separate from actual owner mission/endurance decisions.
- Replace provisional pilot seat/console with an existing referenced station, then re-evaluate cockpit route and
  neck sizing.
- Assign floor/lining ownership and exclude withdrawn custom fit-out artifacts from all active exports.
- Validate real instances against the supported consumer and actual geometry/access, mounting and services.
- Do not pass G3 arrangement or G7/G8 while dependent requirements or consumer gaps remain unresolved.
