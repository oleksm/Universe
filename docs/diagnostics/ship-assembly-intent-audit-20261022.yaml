date: '2026-10-22'
subject: Per-assembly design evidence before dependent detail
status: reusable definition review; no project acceptance
problem: >-
  Named objects or mesh slices can be mistaken for designed assemblies. Existing regional ownership
  already rejects arbitrary slices, but did not explicitly require per-assembly intent and assembled
  visual evidence before dependent detailing.
change:
  records:
  - ship-artifact.region-spec
  - ship-rule.region-ownership
  - ship-check.construction
  - ship-check.identity
  - ship-stage.architecture
  - ship-stage.production
  contract:
  - Purpose, visual role, brief links, editable design controls and actual source/object mapping.
  - Adjacent assemblies, shared boundary owner, mating frames, join treatment, support and access obligations.
  - Current local/interface witnesses and independent complete-ship silhouette/clay critique.
  - Separate technical and visual verdicts; concrete defect ownership, preservation constraints and reinspection.
  - Existing candidate checkpoint remains the state authority; no second database or new runtime schema.
  limits:
  - Definitions remain draft; no generic geometric or aesthetic evaluator was implemented.
  - Unknown required criteria hold dependent claims; reversible alternatives and unrelated authorized work continue.
  - One assembly may use many objects; repeated/mirrored instances may share a contract but need placement coverage.
  - A coherent assembly may be one mesh; object count and mesh separation are not aesthetic metrics.
review_cases:
  method: Manual contract review, not an executable test or geometry certificate.
  cases:
  - input: One loft split and renamed with no individual purpose or interfaces.
    expected: Reject parts-designed claim; require missing region contracts and evidence.
  - input: Complete local contracts and attractive isolated renders, but no assembled critique.
    expected: Hold dependent detailing pending independent assembled visual review.
  - input: Interface screen passes while current whole-ship visual critique fails.
    expected: Preserve separate verdicts and return affected form to review; technical pass cannot override visual fail.
  - input: Previous candidate critique reused after geometry, brief or relevant interface changes.
    expected: Reopen affected review and bind fresh witnesses; old evidence remains historical.
  - input: Missing or provisional required mounting/service criteria hidden behind a declared interface pass.
    expected: Keep qualification unresolved and hold dependent claims without blocking unrelated study.
  - input: Several coherent assemblies share a parameterized generator; repeated instances have one contract and current placement/junction witnesses.
    expected: Eligible for scoped review; separate generator files and arbitrary object counts are not required.
  - input: Current contracts and local technical witnesses plus independent assembled critique support the authorized scope; named defects are rechecked.
    expected: May advance only that supported scope through existing checkpoint authority; no production or engineering promotion.
