- factor: planet-factor.rock-type
  status: verified
  note: Raw planet-field.rock codes are rock-unit.sim.index (0-based), never ground vocabulary IDs (+1). Directed
    class intent required; category does not imply hardness or erodibility.
  previous_reads:
    fields:
    - planet-field.rock
    layers:
    - planet-layer.zones
  previous_signal: null
  reads:
    fields:
    - planet-field.rock
  signal:
    field: planet-field.rock
