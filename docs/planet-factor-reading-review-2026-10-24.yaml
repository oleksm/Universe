    fields:
    - planet-field.temperature
    - planet-field.rain
  previous_signal: null
  reads: {}
  signal: null
- factor: planet-factor.clim-storm
  status: unavailable
  note: Mean rain and decaying peak discharge are not storm intensity/frequency; no storm signal.
  previous_reads:
    fields:
    - planet-field.rain
    - planet-field.peak-discharge
  previous_signal: null
  reads: {}
  signal: null
- factor: planet-factor.clim-temp
  status: proxy
  note: Annual mean air temperature, not freeze-thaw frequency or ground thermal history. Retained inverted ramp
    is coldness (high=cold), not heat; provisional calibration.
  previous_reads:
    fields:
    - planet-field.temperature
    layers:
    - planet-layer.climate
  previous_signal: &id004
    field: planet-field.temperature
    from: 283.15
    to: 263.15
  reads:
    fields:
    - planet-field.temperature
  signal: *id004
- factor: planet-factor.clim-wind
  status: unavailable
  note: Saved wind/wind-north are unit-vector direction toward, not speed, transport capacity or a wind rose. No
    scalar-strength signal is available.
  previous_reads:
    fields:
    - planet-field.wind
    - planet-field.wear-wind
    - planet-field.dust
  previous_signal: null
  reads: {}
  signal: null
- factor: planet-factor.events
  status: unavailable
  note: A nearby event landmark alone is not a scalar event magnitude, recurrence or age; explicit event evidence
    remains to be supplied.
  previous_reads:
    landmarks:
    - planet-landmark.river-capture
    - planet-landmark.arc-volcano
    - planet-landmark.hotspot-volcano
    - planet-landmark.flood-basalt-province
  previous_signal: null
  reads: {}
  signal: null
- factor: planet-factor.groundwater
  status: unavailable
  note: runoff is annual surface water depth rate and water-lost is transmission loss discharge; neither is water
    table, head or groundwater recharge.
  previous_reads:
    fields:
    - planet-field.runoff
    - planet-field.water-lost
  previous_signal: null
  reads: {}
  signal: null
- factor: planet-factor.ice-extent
  status: proxy
  note: ice/ice-lgm are current/LGM thickness; cycles counts crossings of 50 m. Positive thickness supports past
    ice presence but not flow, basal temperature or exact outline.
  previous_reads:
    fields:
    - planet-field.ice
    - planet-field.ice-lgm
    - planet-field.ice-cycles
  previous_signal: &id005
    field: planet-field.ice-lgm
    from: 0.0
    to: 500.0
  reads:
    fields:
    - planet-field.ice
    - planet-field.ice-lgm
    - planet-field.ice-cycles
  signal: *id005
- factor: planet-factor.ice-flow
  status: unavailable
  note: No saved velocity or direction. ice-lgm is thickness and is not a flow signal; removed false alias and ramp.
  previous_reads:
    fields:
    - planet-field.ice
    - planet-field.ice-lgm
  previous_signal:
    field: planet-field.ice-lgm
    from: 50.0
    to: 1000.0
  reads: {}
  signal: null
- factor: planet-factor.ice-thermal
  status: unavailable
  note: Air temperature and ice thickness do not establish basal temperature/water pressure; unavailable.
  previous_reads:
