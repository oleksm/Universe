owner_refinements:
- 'Owner scope correction 2026-10-24 (relayed by blender 20261024T175224-blender-1b98; blender docs/spaceship-generation-workflow-spec.md sha256 b34c08ad): 1.1 deliverable is the owner-authorized artifact; 1.1.1 mandatory delivery stop - hull and sockets only, empty fit, modules placed by players in the shipyard; full auto/finish/ready never widen the boundary. Covered by ship-rule.scope (1.1).'
- Feature-first intake; confirmed consolidated brief; derived prompt before whole-ship sketch.
- Rehearsal provenance, exact prompt witnesses, hidden-feature limits and stale-input negative cases.
- Discover existing modules and supported placement consumer before G3 sizing; no custom fit-out substitutes.
- Audit inherited module substitutes and explicit per-instance occupied, attachment/tool, installation/removal,
  user, motion and service clearances with authority/provisional provenance.
- Declare opening/closure, gear/bay, service/support and cockpit interfaces at G2/G3; require complete assembly
  part/state/pair/view evidence at G4/G6 and reject subset-to-whole promotion.
- Plan continuous state-bound crew routes and operable/recovery sequences before G2/G3 acceptance; G4/G6 require
  exact fixture/criterion provenance and row-level current evidence without invented numerical compliance.
- Route/module-envelope conflicts with hull space return QC to affected G2/G3 shaping; preserve required intent/envelopes,
  escalate incompatibilities and invalidate dependent detail/export without discarding unchanged reusable sources.
- Post-clearance reshaping repeats current side/top/front silhouette and clay identity review, original intent/landmark
  witnesses and separate jointly required functional/visual decisions; no shrinking required envelopes or synthetic
  aesthetic pass.
- Aesthetic guidance and QC explicitly review primary/subordinate masses, cockpit/nose/neck/shoulders and deliberate
  curve/plane transitions across comparable variants without universal ratios or mandatory angularity.
