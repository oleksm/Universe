sources_section:
  source_section: '8'
  destination: ship-rule.research-basis plus sources on every definition
refinements:
- Decision definitions describe who may decide and what evidence is required; they are not approvals for any ship.
- Check definitions name method, expected evidence, failure handling and responsible consumer; no pass result may
  be inferred from defining a check.
- Stage prerequisites form a DAG; revision/rework transitions may loop without changing prerequisite graph.
- Sidecar examples are authoring proposals, not changes to the existing runtime ship schema.
- Do not expose local private agent review paths as required runtime dependencies; retain public-safe summaries
  of lessons.
