t"},{"n":"water_recovery","t":"number","u":"1","d":"the share of the water people give off (waste water, breath, wash water) it recovers as drinking and washing water again; the rest is made up from the tanks. The ISS recovers about 0.9."},{"n":"air_recovery","t":"number","u":"1","d":"the share of the oxygen people breathe out as carbon dioxide it wins back; the rest is made up from the air store. The ISS recovers about 0.5."},{"n":"persons","t":"integer","u":"1","d":"how many people it keeps: air, water and warmth for this many"},{"n":"cooling","t":"number","u":"W","d":"W of the cabin's heat it carries away to the ship's heat path: the people's (need.food.heat a head) and their equipment's; it also dries the air"},{"n":"air_store","t":"number","u":"kg","d":"kg of oxygen an open-loop pack carries in its own bottle; counted with the ship's air stores in the budgets"},{"n":"water_store","t":"number","u":"kg","d":"kg of water an open-loop pack carries; counted with the ship's water stores"}]},{"n":"oneOf gun","t":"object","d":"A gun: a mass driver. The game fires it as its record says.","c":[{"n":"kind","r":1,"k":"gun"},{"n":"muzzle_speed","t":"number","u":"m/s","d":"m/s its slug leaves at, against the ship"},{"n":"rate","t":"number","u":"1/s","d":"rounds a second, the trigger held"},{"n":"slug_mass","t":"number","u":"kg","d":"kg, one slug"},{"n":"magazine","t":"integer","d":"rounds in a full magazine"}]},{"n":"oneOf laser","t":"object","d":"A laser. The game fires it as its record says: it heats while it fires, cools when it does not, and once too hot is locked out until it has cooled to its reset.","c":[{"n":"kind","r":1,"k":"laser"},{"n":"beam_power","t":"number","u":"W","d":"W on the target, within its focus"},{"n":"focus","t":"number","u":"m","d":"m within which the beam holds together; past it, its power falls as the square of the distance"},{"n":"range","t":"number","u":"m","d":"m, the farthest it reaches"},{"n":"burn","t":"number","u":"s","d":"s of firing from cold to too hot"},{"n":"cool","t":"number","u":"s","d":"s to cool again"},{"n":"reset","t":"number","u":"1","d":"the share of too hot it must cool to, after overheating, before it fires again"}]},{"n":"oneOf breaker","t":"object","d":"A hydraulic breaker (a hammer): a piston drives a chisel into rock, blow after blow. Each blow pushes back on whatever holds it; in free fall the ship must be clamped to the rock or thrust against it. Not in the game yet.","c":[{"n":"kind","r":1,"k":"breaker"},{"n":"blow_energy","t":"number","u":"J","d":"J delivered to the chisel each blow"},{"n":"blow_rate","t":"number","u":"1/s","d":"blows a second"},{"n":"hydraulic_power","t":"number","u":"W","d":"W of hydraulic power it draws"},{"n":"reach","t":"number","u":"m","d":"m its boom reaches beyond its hatch"},{"n":"feed_force","t":"number","u":"N","d":"N, the average push it needs to keep the chisel on the rock: the push-back the ship takes"}]},{"n":"oneOf mining_rig","t":"object","d":"The anchor and excavator. Their figures are still in the engine's code.","c":[{"n":"kind","r":1,"k":"mining_rig"},{"n":"excavator_power","t":"number","u":"W","d":"W its excavator cuts with"},{"n":"throughput","t":"number","u":"kg/s","d":"kg/s of spoil it can carry off, at most"},{"n":"anchor_reach","t":"number","u":"m","d":"m its anchor reaches from the hull"},{"n":"anchor_speed","t":"number","u":"m/s","d":"m/s: it holds if the ship drifts slower than this against the surface"}]},{"n":"oneOf airlock","t":"object","d":"A way in and out through the hull, keeping the air in: two doors and a chamber between. Not in the game yet.","c":[{"n":"kind","r":1,"k":"airlock"},{"n":"persons","t":"integer","u":"1","d":"how many it cycles at once"},{"n":"cycle","t":"number","u":"s","d":"s for one cycle, in or out"},{"n":"passage","t":"number","u":"m","d":"m, the clear width of its doors"},{"n":"air_lost","t":"number","u":"kg","d":"kg of air lost to space each cycle, with its pumps run"}]},{"n":"oneOf ramp","t":"object","d":"A ramp lowered to the ground for people or cargo. Not in the game yet.","c":[{"n":"kind","r":1,"k":"ramp"},{"n":"load","t":"number","u":"kg","d":"kg it bears"},{"n":"width","t":"number","u":"m","d":"m, clear"},{"n":"reach","t":"number","u":"m","d":"m it lets down to"}]},{"n":"oneOf cargo_lift","t":"object","d":"A platform lift between a bay and the ground, or deck to deck. Not in the game yet.","c":[{"n":"kind","r":1,"k":"cargo_lift"},{"n":"load","t":"number","u":"kg","d":"kg it lifts"},{"n":"travel","t":"number","u":"m","d":"m it moves through"}]},{"n":"oneOf bay_door","t":"object","d":"A door in the hull over a bay. Not in the game yet.","c":[{"n":"kind","r":1,"k":"bay_door"},{"n":"width","t":"number","u":"m","d":"m, the opening"},{"n":"height","t":"number","u":"m","d":"m"},{"n":"opens_in","t":"number","u":"s","d":"s to open or shut"}]},{"n":"oneOf docking","t":"object","d":"A docking collar or clamp: joins the ship to a station or another ship. Not in the game yet.","c":[{"n":"kind","r":1,"k":"docking"},{"n":"passage","t":"number","u":"m","d":"m, the clear way through (a collar); none for a clamp"},{"n":"holds","t":"number","u":"N","d":"N it takes along its axis before it lets go"},{"n":"standard","t":"string","d":"the docking standard it mates to"}]},{"n":"oneOf handling","t":"object","d":"Moves bulk or cargo aboard: a scoop, a conveyor, an arm. Not in the game yet.","c":[{"n":"kind","r":1,"k":"handling"},{"n":"throughput","t":"number","u":"kg/s","d":"kg/s it moves at most"},{"n":"reach","t":"number","u":"m","d":"m, from its mount"},{"n":"moment","t":"number","u":"N m","d":"N m, the most it bends its mount by at work: a boom held out, loaded, at 1 g","m":{"exclusiveMinimum":0}}]},{"n":"oneOf radiator","t":"object","d":"Throws heat into space from a hot surface. Not in the game yet.","c":[{"n":"kind","r":1,"k":"radiator"},{"n":"rejects","t":"number","u":"W","d":"W it throws off at its working temperature, both faces to deep space"},{"n":"temperature","t":"number","u":"K","d":"K, its working surface"},{"n":"area","t":"number","u":"m2","d":"m2 of panel, one face"}]},{"n":"oneOf heat_exchanger","t":"object","d":"Passes heat from one loop to another. Not in the game yet.","c":[{"n":"kind","r":1,"k":"heat_exchanger"},{"n":"transfers","t":"number","u":"W","d":"W it passes at its design temperatures"}]},{"n":"oneOf coolant_loop","t":"object","d":"Pumps and piping that carry heat from what makes it to what throws it off. Not in the game yet.","c":[{"n":"kind","r":1,"k":"coolant_loop"},{"n":"carries","t":"number","u":"W","d":"W it carries"},{"n":"flow","t":"number","u":"kg/s","d":"kg/s of coolant"}]},{"n":"oneOf heat_sink","t":"object","d":"Thermal mass that takes a burst of heat and gives it up slowly. Not in the game yet.","c":[{"n":"kind","r":1,"k":"heat_sink"},{"n":"stores","t":"number","u":"J","d":"J it takes over its working rise"}]},{"n":"oneOf store","t":"object","d":"Holds a liquid or a gas that is not the ship's fuel: water, waste, liquid or gas cargo, air. (A fuel tank is `tank`, which the game runs.) Not in the game yet.","c":[{"n":"kind","r":1,"k":"store"},{"n":"capacity","t":"number","u":"kg","d":"kg it holds"},{"n":"holds","t":"string","d":"What it is built to hold, by its key: a good, an element, or a market category (a food store holds market.food: any food stock)."},{"n":"pressure","t":"number","u":"Pa","d":"Pa it holds its contents at; none for a low-pressure liquid"}]},{"n":"oneOf pump","t":"object","d":"Moves liquid: fuel, water, coolant. Not in the game yet.","c":[{"n":"kind","r":1,"k":"pump"},{"n":"flow","t":"number","u":"kg/s","d":"kg/s"},{"n":"head","t":"number","u":"Pa","d":"Pa it pushes against"}]},{"n":"oneOf compressor","t":"object","d":"Compresses gas into a store or out of one. Not in the game yet.","c":[{"n":"kind","r":1,"k":"compressor"},{"n":"flow","t":"number","u":"kg/s","d":"kg/s"},{"n":"pressure","t":"number","u":"Pa","d":"Pa it delivers"}]},{"n":"oneOf port","t":"object","d":"A connection through the hull for taking fuel, water or air aboard, or giving it out. Not in the game yet.","c":[{"n":"kind","r":1,"k":"port"},{"n":"flow","t":"number","u":"kg/s","d":"kg/s through it"},{"n":"reach","t":"number","u":"m","d":"m a boom extends; none for a flush port"}]},{"n":"oneOf window","t":"object","d":"A viewport in a pressure hull. Not in the game yet.","c":[{"n":"kind","r":1,"k":"window"},{"n":"area","t":"number","u":"m2","d":"m2 of glass"},{"n":"pressure","t":"number","u":"Pa","d":"Pa it holds"}]},{"n":"oneOf battery","t":"object","d":"Stores electric energy chemically: slower than a capacitor, far more of it. Not in the game yet.","c":[{"n":"kind","r":1,"k":"battery"},{"n":"stores","t":"number","u":"J","d":"J"},{"n":"rate","t":"number","u":"W","d":"W it gives or takes at most"},{"n":"cycles","t":"integer","d":"full charge-and-discharge cycles before it is worn to 80% of its store; a high-rate pack fewer than a long-duration one"},{"n":"efficiency","t":"number","u":"1","d":"its discharge efficiency at its rate: the share of what leaves the cells that reaches the bus; the rest is heat in the pack, to be carried off"}]},{"n":"oneOf solar_array","t":"object","d":"Makes power from sunlight. Not in the game yet.","c":[{"n":"kind","r":1,"k":"solar_array"},{"n":"area","t":"number","u":"m2","d":"m2 of cells"},{"n":"output","t":"number","u":"W","d":"W at Earth's sunlight, face on"},{"n":"efficiency","t":"number","u":"1","d":"the share of sunlight it turns to power"}]},{"n":"oneOf switchgear","t":"object","d":"Distributes power from plant to loads, and breaks a fault. Not in the game yet.","c":[{"n":"kind","r":1,"k":"switchgear"},{"n":"carries","t":"number","u":"W","d":"W through it"}]},{"n":"oneOf converter","t":"object","d":"Steps one DC bus's voltage to another's (a ship's 3 kV bus down to its 270 V or 28 V bus). Not in the game yet.","c":[{"n":"kind","r":1,"k":"converter"},{"n":"from_voltage","r":1,"t":"number","u":"V","d":"V of the bus it takes from"},{"n":"to_voltage","r":1,"t":"number","u":"V","d":"V of the bus it feeds"},{"n":"carries","r":1,"t":"number","u":"W","d":"W it delivers at most"},{"n":"efficiency","r":1,"t":"number","u":"1","d":"the share of what it draws that it delivers; the rest is heat to the coolant loop"}]},{"n":"oneOf reaction_wheels","t":"object","d":"Turn the ship by spinning wheels, without fuel. Not in the game yet.","c":[{"n":"kind","r":1,"k":"reaction_wheels"},{"n":"torque","t":"number","u":"N m","d":"N m it can apply"},{"n":"momentum","t":"number","u":"N m s","d":"N m s it stores before it must unload"}]},{"n":"oneOf landing_gear","t":"object","d":"One landing leg: a strut that stops the ship over its stroke and holds it on the ground (SFO 15, Shock). A hull fits several, one to a gear slot. The game reckons legs from a hull's parts today (world::legs); from fitted gear once it reads this.","c":[{"n":"kind","r":1,"k":"landing_gear"},{"n":"holds","r":1,"t":"number","u":"N","d":"N, the most one leg takes before it yields or buckles"},{"n":"stroke","r":1,"t":"number","u":"m","d":"m its strut compresses over, stopping the ship"},{"n":"efficiency","r":1,"t":"number","u":"1","d":"the share of the stroke that does work (an oleo strut: about 0.8)"},{"n":"sink_rate","r":1,"t":"number","u":"m/s","d":"m/s, the touchdown it is designed for, at its design load"},{"n":"extended","t":"number","u":"m","d":"m from its mount to its pad, gear down"},{"n":"spring","t":"number","u":"N/m","d":"N/m, the strut's stiffness as a linear spring (the game's contact model): holds over its stroke","m":{"exclusiveMinimum":0}},{"n":"damper","t":"number","u":"N s/m","d":"N s/m, its damping as a linear damper","m":{"exclusiveMinimum":0}}]},{"n":"oneOf throat_coil","t":"object","d":"Holds a gate's tube: one to a segment of a ring. Not in the game yet.","c":[{"n":"kind","r":1,"k":"throat_coil"}]},{"n":"oneOf engine","t":"object","d":"One engine unit (SFO 22): a jet of a given cycle, pointed where the design points it. Replaces the drive, lift and thruster families as roles a design gives engines. Not in the game yet.","from":["jet"],"c":[{"n":"thrust","r":1,"t":"number","u":"N","d":"N at full throttle, of one nozzle at full share"},{"n":"exhaust","r":1,"t":"number","u":"m/s","d":"m/s, how fast the jet leaves; propellant flow is thrust / exhaust, jet power half their product"},{"n":"efficiency","r":1,"t":"number","u":"1","d":"the share of the energy released (the fuel's) that goes into the jet; the rest leaves as heat and radiation"},{"n":"burns","t":"string","d":"What releases the energy, by its key: the fusion fuel, the fission fuel's stand-in, the chemical propellant blend, or the gas itself.","x":["material"]},{"n":"heat_to_hull","r":1,"t":"number","u":"1","d":"Share of the jet's power that comes aboard as heat (lib.jet_heat): an engine derives it from its isotropic loss, the hull's share of the sphere and its shadow shield (SFO 22); older records carry 1e-6, to be replaced."},{"n":"kind","r":1,"k":"engine"},{"n":"cycle","r":1,"d":"How an engine makes its jet (SFO 22). The cycle sets the exhaust speed's range, and so the jet power a thrust costs and the propellant it burns.","e":["fusion_pulse","fusion_thermal","nuclear_thermal","chemical","cold_gas","ducted_fan"],"s":"dictionary.engine_cycle"},{"n":"propellant","t":"string","d":"The reaction mass thrown, where it is not the fuel: hydrogen for a fusion thermal or nuclear thermal engine.","x":["material"]},{"n":"throttle","r":1,"t":"number","u":"1","d":"the least thrust it holds steadily, as a share of full; 0: on or off only (pulsed)","m":{"minimum":0,"maximum":1}},{"n":"gimbal","r":1,"t":"number","u":"rad","d":"rad either way it can point its jet from its axis on its own gimbal; 0: fixed"},{"n":"isotropic_loss","r":1,"t":"number","u":"1","d":"the share of the energy released that leaves the reaction in every direction (neutrons, X-rays, gamma), not with the jet: what a hull in its way takes"},{"n":"shield_pass","r":1,"t":"number","u":"1","d":"the share of that loss its own shadow shield lets through toward the ship"},{"n":"reaction_offset","t":"number","u":"m","d":"m from the mount's face, aft, to where the loss originates; the hull's share of the sphere is reckoned from there"},{"n":"min_density","t":"number","u":"kg/m3","d":"kg/m3, the thinnest air a ducted fan is rated for; its thrust at full power falls with the cube root of the density (at 0.3 kg/m3, 63% of its thrust at 1.2). A fan burns nothing: `burns` is left out, and its power is `needs.power` at full thrust."},{"n":"chamber","t":"object","d":"A rocket's chamber and nozzle as a design: what a modeller and a structural or thermal check need. Its figures follow from the jet's (thrust, exhaust) and these: throat area = thrust / (thrust coefficient x pressure).","c":[{"n":"feed","d":"How the propellants are pumped: expander, the coolant's heat from the chamber wall drives the turbine (no gas generator, no hot turbine)","e":["expander","gas_generator","staged_combustion","pressure_fed","electric_pump"]},{"n":"pressure","t":"number","u":"Pa","d":"Pa, the chamber's"},{"n":"mixture_ratio","t":"number","u":"1","d":"oxidiser to fuel, by mass"},{"n":"thrust_coefficient","t":"number","u":"1","d":"in vacuum at its expansion ratio"},{"n":"throat_diameter","t":"number","u":"m"},{"n":"exit_diameter","t":"number","u":"m"},{"n":"expansion_ratio","t":"number","u":"1","d":"exit area over throat area"},{"n":"chamber_diameter","t":"number","u":"m"},{"n":"chamber_length","t":"number","u":"m","d":"m, injector face to throat"},{"n":"nozzle_length","t":"number","u":"m","d":"m, throat to exit (a bell's)"},{"n":"cooling","d":"regenerative: the fuel runs through the wall before it burns","e":["regenerative","radiative","ablative","film"]},{"n":"wall","t":"string","d":"The wall's material, by its key.","x":["material"]},{"n":"construction","d":"tubes: the wall is coolant tubes brazed side by side, each tube's wall the hot wall; channels: milled in a liner and closed by a jacket; solid: a plain shell (radiative or ablative only)","e":["tubes","channels","solid"]},{"n":"tubes","t":"integer","d":"how many coolant tubes make the wall"},{"n":"tube_wall","t":"number","u":"m","d":"m, the tubes' wall"},{"n":"hot_wall_temperature","t":"number","u":"K","d":"K, the gas side of the wall at full thrust, by design"},{"n":"coolant_passes","t":"integer","d":"1: the coolant runs the wall once, fed from the exit manifold by a line outside the nozzle; 2: half the tubes carry it down to the exit manifold, where it turns, and half bring it back up, so every line stays at the chamber end","m":{"minimum":1,"maximum":2}},{"n":"tubes_lower","t":"integer","u":"1","d":"Tubes below the splice, where each upper tube branches in two (a wide bell's tubes would grow too wide for their wall)"},{"n":"splice_expansion","t":"number","u":"1","d":"The area ratio at which the tubes branch to tubes_lower"},{"n":"coolant_pressure","t":"number","u":"Pa","d":"Pa, the coolant's pressure in the tubes: the load on their wall"},{"n":"coolant_in","t":"number","u":"K","d":"K, the coolant entering the wall (at the exit manifold for a tube nozzle fed from its end)"},{"n":"coolant_out","t":"number","u":"K","d":"K, the coolant leaving the wall (to the turbine in an expander)"},{"n":"exit_manifold","t":"number","u":"m","d":"m, the outer diameter of the torus tube's section at the nozzle's exit: the rim a modeller draws. It sits outside the exit, so the rim is exit_diameter + 2 x this across"},{"n":"vacuum_only","t":"boolean","d":"true: the bell over-expands in air (its exit pressure far below a sea-level atmosphere): it fires only in vacuum or very thin air"}]}]},{"n":"oneOf swivel","t":"object","d":"A swivel that turns an engine unit through a large angle (vectored thrust): aft in flight, down to land. Far heavier than a gimbal; that is the trade. Not in the game yet.","c":[{"n":"kind","r":1,"k":"swivel"},{"n":"turns","r":1,"t":"number","u":"rad","d":"rad it turns through"},{"n":"bears","r":1,"t":"number","u":"N","d":"N of thrust it carries through its bearing"},{"n":"slew","r":1,"t":"number","u":"rad/s","d":"rad/s it turns at under load"}]},{"n":"oneOf command_station","t":"object","d":"Where the ship is flown from: seats, controls and displays for its pilots. On the bridge, inside the pressurised space. Not in the game yet.","c":[{"n":"kind","r":1,"k":"command_station"},{"n":"persons","r":1,"t":"integer","u":"1","d":"how many it seats, at the controls"},{"n":"g_rating","r":1,"t":"number","u":"m/s2","d":"m/s2, the most acceleration its seats are rated to hold a person through"},{"n":"facing","r":1,"d":"which way the seats face. thrust: backs to the main drive, so thrust pushes eyeballs-in (the usual). forward: along the ship's nose. any: they turn.","e":["thrust","forward","any"]}]},{"n":"oneOf berths","t":"object","d":"Where the crew sleep: bunks, lockers and the partition round them. In a cargo slot, as a cabin is. Not in the game yet.","c":[{"n":"kind","r":1,"k":"berths"},{"n":"persons","r":1,"t":"integer","u":"1","d":"how many it sleeps"}]},{"n":"oneOf galley","t":"object","d":"Where food is kept cold, heated and eaten. Not in the game yet.","c":[{"n":"kind","r":1,"k":"galley"},{"n":"persons","r":1,"t":"integer","u":"1","d":"how many it feeds, in turns"}]},{"n":"oneOf head","t":"object","d":"Toilet and washing. Its water is the people's (need.washing); it sends the waste water to life support or the waste tank. Not in the game yet.","c":[{"n":"kind","r":1,"k":"head"},{"n":"persons","r":1,"t":"integer","u":"1","d":"how many it serves"}]},{"n":"oneOf fire_unit","t":"object","d":"Fire detection and suppression for a pressurised room: detectors and an agent bottle. Not in the game yet.","c":[{"n":"kind","r":1,"k":"fire_unit"},{"n":"protects","r":1,"t":"number","u":"m3","d":"m3 of room one unit covers"}]},{"n":"oneOf pressure_door","t":"object","d":"A hatch that holds cabin pressure across it, so a hole vents one compartment and not the ship. Not in the game yet.","c":[{"n":"kind","r":1,"k":"pressure_door"},{"n":"passage","r":1,"t":"number","u":"m","d":"m, the clear width of its opening"},{"n":"pressure","r":1,"t":"number","u":"Pa","d":"Pa it holds across it, either way"}]},{"n":"oneOf suit_locker","t":"object","d":"Pressure suits and the locker they hang in, with their air. Not in the game yet.","c":[{"n":"kind","r":1,"k":"suit_locker"},{"n":"persons","r":1,"t":"integer","u":"1","d":"how many suits"},{"n":"endurance","r":1,"t":"number","u":"s","d":"s of air and power a suit carries"}]},{"n":"oneOf altimeter","t":"object","d":"A landing sensor: it measures the distance to the ground below. Not in the game yet.","c":[{"n":"kind","r":1,"k":"altimeter"},{"n":"range","r":1,"t":"number","u":"m","d":"m, the farthest ground it reads"},{"n":"accuracy","r":1,"t":"number","u":"m","d":"m, how closely"}]},{"n":"oneOf camera","t":"object","d":"A camera the pilot sees by where there is no window: under the ship for the pads, aft for docking. Not in the game yet.","c":[{"n":"kind","r":1,"k":"camera"},{"n":"field_of_view","r":1,"t":"number","u":"rad","d":"rad across its picture"}]}]},{"n":"nozzles","t":"array","d":"An engine's exits: nodes of its own model, each at a share of its thrust (shares sum to 1). Where and which way each points is the node's (local -Z the exhaust); fitted, they sit where the slot's mount_<slot> frame puts the model.","m":{"minItems":1},"c":[{"n":"[ ]","t":"object","c":[{"n":"node","r":1,"t":"string","d":"The exit node in the product's model, by name (nozzle_<name>)"},{"n":"share","r":1,"t":"number","u":"1","d":"Its share of the product's thrust","m":{"maximum":1,"exclusiveMinimum":0}}]}]},{"n":"ports","t":"array","d":"Its ins and outs and where it bears, each built to an interface (SFO 26): what it takes and gives, at what duty, through which mating face.","c":[{"n":"[ ]","t":"object","d":"Where something goes in or out of a made thing (SFO 25, 26): built to an interface, one half of it, with the duty it needs; a product of that interface rated for the duty fits. The game draws the joint at the port.","c":[{"n":"id","r":1,"t":"string","d":"Its name on the thing, unique there (gas-in, water-out, hv, base)."},{"n":"flow","r":1,"d":"Which way what it carries goes at full rate: in, out, or both (a power port feeding and fed). For a load port: out, the thing's weight going down into what bears it.","e":["in","out","both"]},{"n":"medium","r":1,"d":"What crosses it: gas, liquid or bulk solids; power; signal (control and data); heat (by a heat pipe or a contact); load (weight and working forces into what bears it); carrier (a batch on a car, a crane's hook, a container's lock); people (an airlock, a docking ring).","e":["gas","liquid","bulk","power","signal","heat","load","carrier","people"]},{"n":"interface","r":1,"t":"string","d":"The interface it is built to (SFO 26), by key: its mating face and the envelope a product built to it must meet.","x":["interface"]},{"n":"half","d":"Which half of the interface the thing itself carries; the joining product brings the other (androgynous: both halves are the same).","e":["male","female","androgynous"]},{"n":"make","d":"How the joint is made and broken here: welded once; bolted; by hand (a plug, a quick coupling, a crew's work, a game action); automatically (a clamp, a docking ring, a coupler); open (nothing mates: a belt's head over a hopper, a hood over an outlet).","e":["permanent","bolted","manual","automatic","open"]},{"n":"connector","t":"string","d":"The connection product the registry's own layouts join it with, by key; any other product built to the same interface and rated for the duty fits as well.","x":["connector"]},{"n":"item","t":"string","d":"What it carries, by key; none for power, signal or load.","x":["material","stock","good","package"]},{"n":"rate","t":"number","u":"kg/s","d":"kg/s at the thing's rating: the duty a product must carry","m":{"minimum":0}},{"n":"power","t":"number","u":"W","d":"W through it at the thing's rating (power or heat)","m":{"minimum":0}},{"n":"pressure","t":"number","u":"Pa","d":"Pa inside it in service","m":{"minimum":0}},{"n":"temperature","t":"number","u":"K","d":"K of what it carries","m":{"minimum":0}},{"n":"voltage","t":"number","u":"V","d":"V between phases (a power port)","m":{"minimum":0}},{"n":"current","t":"number","u":"A","d":"A a phase through it at the thing's rating","m":{"minimum":0}},{"n":"mass","t":"number","u":"kg","d":"A load port: kg it bears down through it, the thing and what it holds (its weight is this times the site's gravity). A carrier port: kg a batch weighs.","m":{"minimum":0}},{"n":"force","t":"number","u":"N","d":"A load port: N of working force on top of its weight, at its worst (a crane wheel's reaction, a tilt, a thrust)","m":{"minimum":0}},{"n":"moment","t":"number","u":"N m","d":"A load port: N m of working moment at its worst","m":{"minimum":0}},{"n":"cycle","t":"number","u":"s","d":"A carrier port: s between batches","m":{"exclusiveMinimum":0}},{"n":"moves_with","t":"string","d":"The id of the thing's motion this port moves with (a tilting furnace's outlet): its joint must let it move."},{"n":"at","r":1,"t":"array of number","u":"m","d":"Its face's middle in the thing's frame (x along, y across from its middle, z up from its base).","m":{"minItems":3,"maxItems":3}},{"n":"facing","r":1,"t":"array of number","u":"1","d":"The way out of its face, a unit vector in the thing's frame: a run leaves it this way.","m":{"minItems":3,"maxItems":3}},{"n":"optional","t":"boolean","d":"A spare, blinded when nothing joins it."},{"n":"key","t":"string","d":"The keying its half is cut to, one of its interface's `keys`: halves mate only at the same key (an HV DC pole keyed plus cannot meet one keyed minus)."},{"n":"channel","t":"string","d":"The circuit it belongs to, so a wire may only join ports of the same channel: a power bus by its kind and voltage (dc-28v, dc-270v, dc-3kv, ac-400v), a data link by its protocol and name (can-a, ethernet-1). A DC feed of two single-pole receptacles is two ports of one channel, plus and minus."},{"n":"pins","t":"array","d":"What each contact of its interface carries (the interface's contacts by id): a wire joins two ports contact to contact, and the roles must agree (plus to plus, signal-high to signal-high). Electrical and signal ports only.","c":[{"n":"[ ]","t":"object","c":[{"n":"contact","r":1,"t":"string","d":"The interface's contact id"},{"n":"role","r":1,"d":"What it carries: DC plus or minus; AC line or neutral; protective earth; a cable's screen; a differential pair's high and low; a single-ended signal and its return; spare (no connection).","e":["plus","minus","line","neutral","earth","screen","signal-high","signal-low","signal","return","spare"]},{"n":"line","t":"string","d":"Which line of a multi-line port (L1, L2, L3; a data link's lane)"}]}]},{"n":"note","t":"string"}],"s":"common.port"}]},{"n":"internal","t":"array","d":"How its ports are joined inside it (a bus bar, breakers, a converter's input to its output); ports not listed are joined to nothing.","c":[{"n":"[ ]","t":"object","d":"How a thing's own ports are joined inside it, stated so a wiring graph never infers it from where they lie (ships, 2026-10-18).","c":[{"n":"kind","r":1,"d":"joined: the listed ports' contacts of the same role and line are one conductor inside (a bus bar); switched: the same, each port through its own breaker the game may open; converts: the `to` ports are live only while the `from` ports are fed, at most the thing's function's rating (a converter, a charger).","e":["joined","switched","converts"]},{"n":"ports","t":"array of string","d":"joined or switched: the port ids"},{"n":"from","t":"array of string","d":"converts: the port ids it draws from"},{"n":"to","t":"array of string","d":"converts: the port ids it gives to"},{"n":"note","t":"string"}],"s":"common.internal"}]},{"n":"motion","t":"array","d":"How it, or a part of it, moves in service, within its mount's mating motion.","c":[{"n":"[ ]","t":"object","d":"A way a made thing or a part of it moves in service (SFO 26): a fit check sweeps what moves through its range, and its moving ports need joints that let them.","c":[{"n":"id","r":1,"t":"string"},{"n":"kind","r":1,"d":"tilt or rotate: about an axis; travel or lift: along one; dock: coming to rest against a mating face.","e":["tilt","rotate","travel","lift","dock"]},{"n":"point","t":"array of number","u":"m","d":"A point on its axis, in the thing's frame","m":{"minItems":3,"maxItems":3}},{"n":"direction","t":"array of number","u":"1","d":"Its axis, a unit vector","m":{"minItems":3,"maxItems":3}},{"n":"angle","t":"array of number","u":"rad","d":"rad from rest it turns, least and most (a tilt or a rotation)","m":{"minItems":2,"maxItems":2}},{"n":"distance","t":"array of number","u":"m","d":"m from rest it moves, least and most (a travel or a lift)","m":{"minItems":2,"maxItems":2}},{"n":"interlock","t":"object","d":"While abs(the named axis) is strictly below when_abs_below, this motion stays within angle (inclusive), along the whole trajectory.","c":[{"n":"axis","r":1,"t":"string","d":"Id of another angular motion in this same record."},{"n":"when_abs_below","r":1,"t":"number","u":"rad","m":{"exclusiveMinimum":0}},{"n":"angle","r":1,"t":"array of number","u":"rad","d":"Restricted inclusive interval, contained within this motion's normal angle limits.","m":{"minItems":2,"maxItems":2}}]},{"n":"rate","t":"number","u":"rad/s","d":"How fast a tilt or rotation turns in service; a rotation with no angle turns without end at this rate"},{"n":"speed","t":"number","u":"m/s","d":"How fast a travel or lift moves in service"},{"n":"moves","t":"array of string","d":"What moves: the whole thing, or its named parts"},{"n":"boxes","t":"array of integer","d":"Which of the thing's envelope boxes move with it, by index; none given: all of them; an empty list: none sweeps beyond itself (a drum spinning on its own axis)."},{"n":"note","t":"string"}],"s":"common.motion"}]},{"n":"visual","t":"object","d":"A made thing's model package in the assets store, installed once per version by install_model.py, which checks it against the record. Without one the game draws a translucent box of its size, named on the edges.","c":[{"n":"format","r":1,"k":"freefall-model/1"},{"n":"path","r":1,"t":"string","d":"The version's folder in the assets store, relative to it: models/<key tail>/v<N>."},{"n":"manifest_sha256","r":1,"t":"string","d":"Of the version's manifest.json.","m":{"pattern":"^[0-9a-f]{64}$"}},{"n":"version","r":1,"t":"integer","m":{"minimum":1}},{"n":"triangles","t":"integer","d":"triangles drawn, from the model"},{"n":"note","t":"string"}],"s":"common.visual"},{"n":"model_requests","t":"array","d":"Work asked of its installed model, open until a later version answers it.","c":[{"n":"[ ]","t":"object","d":"Work asked of one installed model version (model_spec.py): rebuild, rig, measure or optimise. A later version answers it; a moved port never needs one.","c":[{"n":"work","r":1,"d":"What is asked of the model; keep: a review found the model shows the record as it is, no work (closes the review for that version).","e":["rebuild","rig","measure","optimise","keep"]},{"n":"because","r":1,"t":"string","d":"What changed or is wrong, and what the new model must do: plainly, so a modeller can act on it."},{"n":"asked","r":1,"t":"string","d":"When it was asked (YYYY-MM-DD)."},{"n":"of_version","r":1,"t":"integer","d":"The installed version it is asked of; a version above it answers it.","m":{"minimum":0}},{"n":"by","t":"string","d":"Who asks: the session or agent."}],"s":"common.model_request"}]},{"n":"life","t":"number","u":"s","d":"s in service before it is worn out and replaced; what it is made of comes back as scrap. Everything made has a life (the user's rule): this is what makes demand steady."},{"n":"revision","t":"object","d":"A record's revision: how firm it is, who decides a change to it, and what another agent does when it does not fit its own work. Read it before balancing against a record or building on it. A kind's schema gives the revision its records have unless they say otherwise (its default).","c":[{"n":"status","r":1,"d":"How firm a record is, for anyone building on it or against it. Only the user makes a record complete, and only the user reopens one.","e":["draft","review","complete","deprecated"],"s":"dictionary.revision_status"},{"n":"owner","d":"Who decides a change to a record.","e":["registry","ships","integration","user"],"s":"dictionary.owner"},{"n":"on_conflict","d":"What another agent does when a record does not fit its own work.","e":["adjust","propose","escalate","conform"],"s":"dictionary.on_conflict"},{"n":"open_to","t":"array of string","d":"The groups or figures (group.property) that may still be proposed for change, where the rest may not."},{"n":"fixed","t":"array of string","d":"The groups or figures that will not change, where the rest may."},{"n":"because","t":"string","d":"Why it stands where it does: what it rests on, or what waits on it."},{"n":"ask","t":"string","d":"Where a proposal to change it goes: a file of the repository."},{"n":"replaced_by","t":"string","d":"What replaces a deprecated record, by key, or the kind that will (layout)."},{"n":"priority","d":"low: its work waits behind everything else (the asset queue puts it last): a hold the user set, said in because","e":["low"]}],"s":"common.record_revision"},{"n":"basis","t":"array","d":"Where a record's figures come from. Each entry covers the groups (or group.property) it names. sourced: from a published source or the game, named. derived: worked out from other figures, by physics or from a model. invented: chosen, to be balanced or replaced. review: a guess put in so the figure is there, to be reviewed.","c":[{"n":"[ ]","t":"object","c":[{"n":"of","r":1,"t":"array of string","m":{"minItems":1}},{"n":"tier","d":"Where a figure comes from.","e":["sourced","derived","invented"],"s":"dictionary.tier"},{"n":"rule","t":"string","d":"A rule stated once (SFO/metadata/rules) that this entry rests on: its tier, source and review are the rule's unless given here (an entry has a tier or a rule; the build checks). The record's note says only what is its own.","x":["rule"]},{"n":"source","t":"string"},{"n":"note","t":"string"},{"n":"review","t":"boolean","d":"A guess put in so the figure is there: to be reviewed."}]}],"s":"common.basis"}]},"area":"SFO","file":"SFO/schema/equipment.schema.yaml","title":"Ship equipment","also":[],"about":"One piece of equipment a hull or a structure is fitted with. A maker's product. What it does is its `function`: the kind of device it is, and only that kind's figures.","fields":["basis","built_of","clocking","fits","function","identity","internal","life","making","model_requests","motion","needs","nozzles","physical","ports","revision","size_class","visual"],"required":["identity","function","physical"],"key":"equipment","root":"physical_object","uses":{"common.basis":["basis","built_of.list[].basis"],"common.internal":["internal[]"],"common.making":["making"],"common.model_request":["model_requests[]"],"common.motion":["motion[]"],"common.physical":["physical"],"common.physical_object":["(record)"],"common.port":["ports[]"],"common.product_identity":["identity"],"common.record_revision":["revision"],"common.slot_kind":["identity.slot"],"common.visual":["visual"],"dictionary.design_stage":["identity.revision"],"dictionary.engine_cycle":["function.cycle"],"dictionary.on_conflict":["revision.on_conflict"],"dictionary.owner":["revision.owner"],"dictionary.revision_status":["revision.status"],"dictionary.slot_kind":["identity.slot"],"dictionary.tier":["basis[].tier","built_of.list[].basis[].tier"],"jet":["function"],"key":["identity.key"],"revision":["identity.revision"]}},{"tree":{"n":"facility","t":"object","d":"standards/LocalAdministration/metadata/administrations/<system>/<settlement>/facilities/<name>.yaml: something built on a parcel, and the work it does. It belongs to the parcel's owner. The parcel's zone must permit it: a foundry, a mill, a yard or a power station needs an industrial zone, a warehouse a port zone.","c":[{"n":"identity","r":1,"t":"object","c":[{"n":"key","r":1,"t":"string","d":"A record's one key, in the whole registry: <kind>.<name>, lower case, words joined by -, the kind being its schema's. The name may have more dotted parts where a record lives under another (body.treistun.treistun-f). Another record refers to it by this string.","m":{"pattern":"^[a-z][a-z-]*(\\.[a-z0-9][a-z0-9-]*)+$"},"s":"common.key"},{"n":"name","r":1,"t":"string"}]},{"n":"kind","r":1,"e":["foundry","mill","yard","power","warehouse","farm","food works","store","utility","mine"]},{"n":"parcel","r":1,"t":"string","d":"The parcel of its settlement it stands on.","x":["parcel"]},{"n":"lines","t":"array","d":"Its production lines: for each, the process it runs and the industrial modules (SFO 10) it is built of. What the line can make at most, and what it then takes in, gives off, draws and covers, are worked out from them. What it does make is the economy's business, not recorded here.","c":[{"n":"[ ]","t":"object","c":[{"n":"makes","t":"string","d":"What the line is built to make, by its key: its modules have the recipes that lead to it. A line of shop modules has none: it makes whatever parts name its modules.","x":["element","good","stock","part","hull","gate"]},{"n":"also","t":"array","d":"What else the same modules can be set to make.","c":[{"n":"[ ]","t":"string","x":["element","good","stock","part","hull","gate"]}]},{"n":"modules","r":1,"t":"array","c":[{"n":"[ ]","t":"object","c":[{"n":"module","r":1,"t":"string","d":"One of the modules of the process's steps.","x":["module"]},{"n":"count","r":1,"t":"integer","m":{"minimum":1}}]}]}]}],"s":"installation.lines"},{"n":"modules","t":"array","d":"The industrial modules (SFO 10) it is built of, where its production does not say: a power station's.","c":[{"n":"[ ]","t":"object","c":[{"n":"module","r":1,"t":"string","x":["module"]},{"n":"count","r":1,"t":"integer","m":{"minimum":1}}]}],"s":"installation.modules"},{"n":"stock","t":"array","d":"What lies in its store at day 0: seed state of the world. What becomes of it after is the economy's.","c":[{"n":"[ ]","t":"object","c":[{"n":"item","r":1,"t":"string","d":"What lies there, by its key.","x":["element","material","good","stock","part","equipment","hull"]},{"n":"quantity","t":"number","u":"kg","d":"kg of it, for what is kept in bulk","m":{"exclusiveMinimum":0}},{"n":"pieces","t":"integer","d":"how many, for what is kept by the piece: parts, equipment, hulls","m":{"minimum":1}},{"n":"serials","t":"array","d":"The marks of the pieces (SFO 21), one each, where they are given at day 0.","c":[{"n":"[ ]","t":"object","d":"A made thing's mark (SFO 21): given once where it is made and never changed. What carries one: hulls, equipment, industrial modules, structures, parts (one serial a unit). Ownership and registration are separate records that point at the serial. The game stamps every unit it produces; the registry carries marks only on day-0 stock.","c":[{"n":"serial","r":1,"t":"string","d":"The maker's ticker, the product's code and a six-figure sequence the maker gives, one series a product: HHI-LIFE-S1-000123. Unique for all time.","m":{"pattern":"^[A-Z]{2,4}-[A-Z0-9]+(-[A-Z0-9]+)*-[0-9]{6}$"}},{"n":"design","r":1,"t":"string","d":"What it is, by the design's key: the record that says its figures.","x":["hull","equipment","module","structure","part"]},{"n":"revision","t":"string","d":"The design's revision it was built to, where the design has had more than one."},{"n":"maker","r":1,"t":"string","d":"Who built it: the organisation whose works it came from. The design's maker where they built it themselves; a yard building another's design is the yard.","x":["org"]},{"n":"made_at","r":1,"t":"string","d":"The works it came from, by its key.","x":["facility","rig"]},{"n":"made_on","r":1,"t":"number","u":"s","d":"s of world time when it was finished: when its life (the design's `life`) began."},{"n":"parts","t":"array of string","d":"The serials of the marked parts built into it, for tracing a failure to its part and its part to its batch."}],"s":"common.mark"}]},{"n":"batch","t":"object","d":"The lot's mark (SFO 21), for what is kept in bulk.","c":[{"n":"lot","r":1,"t":"string","d":"The maker's ticker and a six-figure sequence the works gives: HHI-004471.","m":{"pattern":"^[A-Z]{2,4}-[0-9]{6}$"}},{"n":"heat","t":"string","d":"For mill stock: the melt it came from, the melter's lot number."},{"n":"made_at","r":1,"t":"string","d":"The works, by its key.","x":["facility","rig"]},{"n":"made_on","r":1,"t":"number","u":"s","d":"s of world time when the lot was begun (its first output)."}],"s":"common.batch"}]}],"s":"installation.stock"},{"n":"claim","t":"object","d":"A mine's or well's deposit, by the planet simulation's permanent id in its body's survey or energy package (checked), and its licence. Mining under a jurisdiction without its licence (law.policies.mining_licence) is recorded as a breach, never blocked.","c":[{"n":"deposit","r":1,"t":"string","d":"The deposit's, field's or coalfield's id: <world>-<code>-...; permanent."},{"n":"holder","r":1,"t":"string","d":"Whose claim it is.","x":["org"]},{"n":"licence","t":"string","d":"The administration that licensed it; left out, the mine is unlicensed.","x":["org"]}]},{"n":"exchange","t":"string","d":"For a warehouse: the exchange that has approved it, so that goods lying in it can be traded there.","x":["org"]},{"n":"parts","t":"array","d":"Its site plan: what stands where on the parcel. No two overlap, and each lies inside the parcel.","c":[{"n":"[ ]","t":"object","c":[{"n":"name","r":1,"t":"string"},{"n":"kind","r":1,"d":"module: industrial plant.","e":["module","workshop","warehouse","logistics","parking"]},{"n":"does","t":"string"},{"n eue puts it last): a hold the user set, said in because","e":["low"]}],"s":"common.record_revision"},{"n":"basis","t":"array","d":"Where a record's figures come from. Each entry covers the groups (or group.property) it names. sourced: from a published source or the game, named. derived: worked out from other figures, by physics or from a model. invented: chosen, to be balanced or replaced. review: a guess put in so the figure is there, to be reviewed.","c":[{"n":"[ ]","t":"object","c":[{"n":"of","r":1,"t":"array of string","m":{"minItems":1}},{"n":"tier","d":"Where a figure comes from.","e":["sourced","derived","invented"],"s":"dictionary.tier"},{"n":"rule","t":"string","d":"A rule stated once (SFO/metadata/rules) that this entry rests on: its tier, source and review are the rule's unless given here (an entry has a tier or a rule; the build checks). The record's note says only what is its own.","x":["rule"]},{"n":"source","t":"string"},{"n":"note","t":"string"},{"n":"review","t":"boolean","d":"A guess put in so the figure is there: to be reviewed."}]}],"s":"common.basis"}]},"area":"SFO","file":"SFO/schema/material.schema.yaml","title":"Material","also":[],"about":"One material (what things are made of) and its properties. Any one material uses only some of them.","fields":["basis","electrical_magnetic","environment","fuel","identity","making","mass","mechanical","optical","revision","thermal"],"required":["identity"],"key":"material","root":null,"uses":{"common.basis":["basis"],"common.key":["identity.key"],"common.record_revision":["revision"],"dictionary.joining":["making.joining[]"],"dictionary.level":["environment.flammability","environment.toxicity"],"dictionary.magnetic_ordering":["electrical_magnetic.magnetic"],"dictionary.on_conflict":["revision.on_conflict"],"dictionary.owner":["revision.owner"],"dictionary.revision_status":["revision.status"],"dictionary.tier":["basis[].tier"],"number_or_null":["electrical_magnetic.dielectric_strength","electrical_magnetic.electrical_conductivity","electrical_magnetic.superconducting_temperature","environment.outgassing","mass.density","mechanical.compressive_strength","mechanical.elongation_at_break","mechanical.fatigue_limit","mechanical.fracture_toughness","mechanical.friction_coefficient","mechanical.hardness","mechanical.impact_toughness","mechanical.poissons_ratio","mechanical.shear_modulus","mechanical.shear_strength","mechanical.tensile_strength","mechanical.yield_strength","mechanical.youngs_modulus","optical.reflectivity","optical.refractive_index","optical.transparency","thermal.absorptivity","thermal.emissivity","thermal.max_service_temperature","thermal.melting_point","thermal.min_service_temperature","thermal.specific_heat_capacity","thermal.thermal_conductivity","thermal.thermal_expansion"],"rating":["environment.chemical_resistance","environment.corrosion_resistance","environment.oxidation_resistance","environment.permeability","environment.radiation_resistance","environment.radiation_shielding","environment.uv_resistance","making.castability","making.formability","making.machinability","making.recyclability","making.repairability","making.weldability","mechanical.creep_resistance","mechanical.wear_resistance","thermal.thermal_shock_resistance"]}},{"tree":{"n":"module","t":"object","d":"One standard piece of industrial plant. It performs one step of a process. Any one module uses only some of these properties.","from":["common.physical_object"],"c":[{"n":"physical","r":1,"t":"object","d":"What every physical thing has: what it weighs, the room it takes, what it stands. What a ship hauling it and a warehouse holding it have to know. A record uses those that apply to it.","c":[{"n":"mass","t":"number","u":"kg","d":"kg, the thing as made, with nothing fitted to it or carried in it","m":{"exclusiveMinimum":0}},{"n":"length","t":"number","u":"m","d":"m","m":{"exclusiveMinimum":0}},{"n":"width","t":"number","u":"m","d":"m","m":{"exclusiveMinimum":0}},{"n":"height","t":"number","u":"m","d":"m","m":{"exclusiveMinimum":0}},{"n":"envelope","t":"array of number","u":"m","d":"m, [length, width, height] of the box it ships in, where that differs from its own size","m":{"minItems":3,"maxItems":3}},{"n":"volume","t":"number","u":"m3","d":"m3, the space its shape takes","m":{"exclusiveMinimum":0}},{"n":"bulk_density","t":"number","u":"kg/m3","d":"kg/m3, as stowed broken in a hold, for what is carried in bulk","m":{"exclusiveMinimum":0}},{"n":"operating_min_temperature","t":"number","u":"K","d":"K, the coldest it works at"},{"n":"operating_max_temperature","t":"number","u":"K","d":"K, the hottest it works at"},{"n":"specific_heat","t":"number","u":"J/(kg K)","d":"J/(kg K) of the whole thing, for how fast its own losses warm it (a battery pack, a motor)"},{"n":"storage_min_temperature","t":"number","u":"K","d":"K, the coldest it may be kept or carried at"},{"n":"storage_max_temperature","t":"number","u":"K","d":"K, the hottest it may be kept or carried at"},{"n":"impact_resistance","t":"number","u":"J","d":"J, the blow it takes without damage"},{"n":"shock_limit","t":"number","u":"m/s2","d":"m/s2, the hardest jolt it takes while it is carried"}],"s":"common.physical"},{"n":"identity","r":1,"t":"object","c":[{"n":"key","r":1,"t":"string","d":"A record's one key, in the whole registry: <kind>.<name>, lower case, words joined by -, the kind being its schema's. The name may have more dotted parts where a record lives under another (body.treistun.treistun-f). Another record refers to it by this string.","m":{"pattern":"^[a-z][a-z-]*(\\.[a-z0-9][a-z0-9-]*)+$"},"s":"common.key"},{"n":"name","r":1,"t":"string"},{"n":"step","r":1,"t":"string","d":"The step it performs."},{"n":"description","t":"string"}]},{"n":"capacity","t":"object","d":"For one that stores or handles: what it can hold and move.","c":[{"n":"holds","t":"number","u":"kg","d":"kg it can store"},{"n":"volume","t":"number","u":"m3","d":"m3 it can store"},{"n":"stores","t":"array of string","d":"The kinds of goods it stores, by the game's keys (content/base/goods.ron)."},{"n":"handling","t":"number","u":"kg/s","d":"kg/s it can move in or out"}]},{"n":"cuts","t":"boolean","d":"true: it cuts parts from stock, so a part it makes carries the cutting loss (rule.cut-loss); a module that assembles or forms whole pieces does not. Read by the build and the registry reader when they derive parts."},{"n":"staff","t":"array","d":"Who runs one of it, round the clock: the trades and how many of each (a shift's worth, times the shifts). A settlement's census is summed from these.","c":[{"n":"[ ]","t":"object","c":[{"n":"profession","r":1,"t":"string","d":"The trade, by its key.","x":["profession"]},{"n":"count","r":1,"t":"integer","d":"how many of them","m":{"minimum":0}}]}],"s":"common.staff"},{"n":"site","d":"Where it stands. enclosed (the default): under a roof, or sealed; it runs the same anywhere. open sky: on open ground, under a world's sun and weather, which it lives by.","e":["enclosed","open sky"]},{"n":"climate","t":"object","d":"For a sealed module that must hold its inside at a temperature: what that is. All the power its recipe draws ends as heat inside and has to be got out. Where outside is colder, the heat runs out by itself; where it is hotter, it is pumped uphill, and that takes power on top: heat x (outside - inside) / (inside x efficiency).","c":[{"n":"holds","t":"number","u":"K","d":"K it holds inside"},{"n":"efficiency","t":"number","u":"1","d":"its heat pumps' share of the best physics allows (Carnot's)"}]},{"n":"does","t":"string","d":"What happens in it, for each recipe that says nothing of its own."},{"n":"recipes","t":"array","d":"What it can be set to make: each one thing, with what that takes. A module with one recipe makes one thing and needs no choosing; one with several is set to one of them at a time (its setup, which is the game's state, not written here).","c":[{"n":"[ ]","t":"object","d":"One thing a module (or a plant unit, SFO 24) can be set to make, with what that takes.","c":[{"n":"makes","r":1,"t":"string","d":"What it makes, by its key.","x":["element","material","good","stock","part","hull","gate","equipment","module"]},{"n":"does","t":"string","d":"What happens in it, set to this, when not the module's own does."},{"n":"inputs","r":1,"t":"array","c":[{"n":"[ ]","t":"object","c":[{"n":"item","r":1,"t":"string","d":"What it is, by its key.","x":["element","material","good","stock","part"]},{"n":"quantity","r":1,"t":"number","u":"1","d":"kg of it for each kg of what the recipe makes"},{"n":"from","d":"For what goes in: where it is taken from. stock (the default): the works' store. place: where the module stands, for one under the open sky: the world's own air, rain or ground water. A world that has none of it cannot give it.","e":["stock","place"]}]}],"s":"amounts","d":"What goes in. Nothing is made of nothing: a recipe has at least one."},{"n":"outputs","t":"array","c":[{"n":"[ ]","t":"object","c":[{"n":"item","r":1,"t":"string","d":"What it is, by its key.","x":["element","material","good","stock","part"]},{"n":"quantity","r":1,"t":"number","u":"1","d":"kg of it for each kg of what the recipe makes"},{"n":"from","d":"For what goes in: where it is taken from. stock (the default): the works' store. place: where the module stands, for one under the open sky: the world's own air, rain or ground water. A world that has none of it cannot give it.","e":["stock","place"]}]}],"s":"amounts","d":"What else comes out."},{"n":"rate","r":1,"t":"number","u":"kg/s","d":"kg/s of what it makes, at full rate, set to this"},{"n":"batch","t":"number","u":"kg","d":"kg in one batch"},{"n":"power","r":1,"t":"number","u":"W","d":"W it draws at full rate, set to this"},{"n":"changeover","t":"object","d":"What it costs to set it to this from another of its recipes.","c":[{"n":"time","t":"number","u":"s","d":"s it stands while it is changed over"},{"n":"loss","t":"number","u":"kg","d":"kg of its first output lost"}]}],"s":"module_recipe"}]},{"n":"throughput","t":"object","d":"For a shop module (one that cuts, machines, welds or assembles whatever it is given): how much it can put through. It has no recipes of its own. Its recipes are the parts, hulls and gates that name it as the module that makes them: what goes in is what each is made from.","c":[{"n":"rate","r":1,"t":"number","u":"kg/s","d":"kg/s of what it is making, at full rate"},{"n":"power","t":"number","u":"W","d":"W it draws at full rate"}]},{"n":"generation","t":"object","d":"For one that makes power: what it supplies and what it burns to do it. It makes no item, so it is not a recipe.","c":[{"n":"supplies","r":1,"t":"number","u":"W","d":"W it supplies at full output"},{"n":"burns","t":"array","d":"What it burns at full output.","c":[{"n":"[ ]","t":"object","c":[{"n":"item","r":1,"t":"string","d":"What it burns, by its key.","x":["element","material","good"]},{"n":"rate","r":1,"t":"number","u":"kg/s","d":"kg/s of it at full output"}]}]}]},{"n":"needs","t":"object","d":"For one with no recipe: what it draws all the time.","c":[{"n":"power","t":"number","u":"W","d":"W"}]},{"n":"ports","t":"array","d":"Its ins and outs and where it bears, each built to an interface (SFO 26): what it takes and gives, at what duty, through which mating face.","c":[{"n":"[ ]","t":"object","d":"Where something goes in or out of a made thing (SFO 25, 26): built to an interface, one half of it, with the duty it needs; a product of that interface rated for the duty fits. The game draws the joint at the port.","c":[{"n":"id","r":1,"t":"string","d":"Its name on the thing, unique there (gas-in, water-out, hv, base)."},{"n":"flow","r":1,"d":"Which way what it carries goes at full rate: in, out, or both (a power port feeding and fed). For a load port: out, the thing's weight going down into what bears it.","e":["in","out","both"]},{"n":"medium","r":1,"d":"What crosses it: gas, liquid or bulk solids; power; signal (control and data); heat (by a heat pipe or a contact); load (weight and working forces into what bears it); carrier (a batch on a car, a crane's hook, a container's lock); people (an airlock, a docking ring).","e":["gas","liquid","bulk","power","signal","heat","load","carrier","people"]},{"n":"interface","r":1,"t":"string","d":"The interface it is built to (SFO 26), by key: its mating face and the envelope a product built to it must meet.","x":["interface"]},{"n":"half","d":"Which half of the interface the thing itself carries; the joining product brings the other (androgynous: both halves are the same).","e":["male","female","androgynous"]},{"n":"make","d":"How the joint is made and broken here: welded once; bolted; by hand (a plug, a quick coupling, a crew's work, a game action); automatically (a clamp, a docking ring, a coupler); open (nothing mates: a belt's head over a hopper, a hood over an outlet).","e":["permanent","bolted","manual","automatic","open"]},{"n":"connector","t":"string","d":"The connection product the registry's own layouts join it with, by key; any other product built to the same interface and rated for the duty fits as well.","x":["connector"]},{"n":"item","t":"string","d":"What it carries, by key; none for power, signal or load.","x":["material","stock","good","package"]},{"n":"rate","t":"number","u":"kg/s","d":"kg/s at the thing's rating: the duty a product must carry","m":{"minimum":0}},{"n":"power","t":"number","u":"W","d":"W through it at the thing's rating (power or heat)","m":{"minimum":0}},{"n":"pressure","t":"number","u":"Pa","d":"Pa inside it in service","m":{"minimum":0}},{"n":"temperature","t":"number","u":"K","d":"K of what it carries","m":{"minimum":0}},{"n":"voltage","t":"number","u":"V","d":"V between phases (a power port)","m":{"minimum":0}},{"n":"current","t":"number","u":"A","d":"A a phase through it at the thing's rating","m":{"minimum":0}},{"n":"mass","t":"number","u":"kg","d":"A load port: kg it bears down through it, the thing and what it holds (its weight is this times the site's gravity). A carrier port: kg a batch weighs.","m":{"minimum":0}},{"n":"force","t":"number","u":"N","d":"A load port: N of working force on top of its weight, at its worst (a crane wheel's reaction, a tilt, a thrust)","m":{"minimum":0}},{"n":"moment","t":"number","u":"N m","d":"A load port: N m of working moment at its worst","m":{"minimum":0}},{"n":"cycle","t":"number","u":"s","d":"A carrier port: s between batches","m":{"exclusiveMinimum":0}},{"n":"moves_with","t":"string","d":"The id of the thing's motion this port moves with (a tilting furnace's outlet): its joint must let it move."},{"n":"at","r":1,"t":"array of number","u":"m","d":"Its face's middle in the thing's frame (x along, y across from its middle, z up from its base).","m":{"minItems":3,"maxItems":3}},{"n":"facing","r":1,"t":"array of number","u":"1","d":"The way out of its face, a unit vector in the thing's frame: a run leaves it this way.","m":{"minItems":3,"maxItems":3}},{"n":"optional","t":"boolean","d":"A spare, blinded when nothing joins it."},{"n":"key","t":"string","d":"The keying its half is cut to, one of its interface's `keys`: halves mate only at the same key (an HV DC pole keyed plus cannot meet one keyed minus)."},{"n":"channel","t":"string","d":"The circuit it belongs to, so a wire may only join ports of the same channel: a power bus by its kind and voltage (dc-28v, dc-270v, dc-3kv, ac-400v), a data link by its protocol and name (can-a, ethernet-1). A DC feed of two single-pole receptacles is two ports of one channel, plus and minus."},{"n":"pins","t":"array","d":"What each contact of its interface carries (the interface's contacts by id): a wire joins two ports contact to contact, and the roles must agree (plus to plus, signal-high to signal-high). Electrical and signal ports only.","c":[{"n":"[ ]","t":"object","c":[{"n":"contact","r":1,"t":"string","d":"The interface's contact id"},{"n":"role","r":1,"d":"What it carries: DC plus or minus; AC line or neutral; protective earth; a cable's screen; a differential pair's high and low; a single-ended signal and its return; spare (no connection).","e":["plus","minus","line","neutral","earth","screen","signal-high","signal-low","signal","return","spare"]},{"n":"line","t":"string","d":"Which line of a multi-line port (L1, L2, L3; a data link's lane)"}]}]},{"n":"note","t":"string"}],"s":"common.port"}]},{"n":"motion","t":"array","d":"How it, or a part of it, moves in service.","c":[{"n":"[ ]","t":"object","d":"A way a made thing or a part of it moves in service (SFO 26): a fit check sweeps what moves through its range, and its moving ports need joints that let them.","c":[{"n":"id","r":1,"t":"string"},{"n":"kind","r":1,"d":"tilt or rotate: about an axis; travel or lift: along one; dock: coming to rest against a mating face.","e":["tilt","rotate","travel","lift","dock"]},{"n":"point","t":"array of number","u":"m","d":"A point on its axis, in the thing's frame","m":{"minItems":3,"maxItems":3}},{"n":"direction","t":"array of number","u":"1","d":"Its axis, a unit vector","m":{"minItems":3,"maxItems":3}},{"n":"angle","t":"array of number","u":"rad","d":"rad from rest it turns, least and most (a tilt or a rotation)","m":{"minItems":2,"maxItems":2}},{"n":"distance","t":"array of number","u":"m","d":"m from rest it moves, least and most (a travel or a lift)","m":{"minItems":2,"maxItems":2}},{"n":"interlock","t":"object","d":"While abs(the named axis) is strictly below when_abs_below, this motion stays within angle (inclusive), along the whole trajectory.","c":[{"n":"axis","r":1,"t":"string","d":"Id of another angular motion in this same record."},{"n":"when_abs_below","r":1,"t":"number","u":"rad","m":{"exclusiveMinimum":0}},{"n":"angle","r":1,"t":"array of number","u":"rad","d":"Restricted inclusive interval, contained within this motion's normal angle limits.","m":{"minItems":2,"maxItems":2}}]},{"n":"rate","t":"number","u":"rad/s","d":"How fast a tilt or rotation turns in service; a rotation with no angle turns without end at this rate"},{"n":"speed","t":"number","u":"m/s","d":"How fast a travel or lift moves in service"},{"n":"moves","t":"array of string","d":"What moves: the whole thing, or its named parts"},{"n":"boxes","t":"array of integer","d":"Which of the thing's envelope boxes move with it, by index; none given: all of them; an empty list: none sweeps beyond itself (a drum spinning on its own axis)."},{"n":"note","t":"string"}],"s":"common.motion"}]},{"n":"visual","t":"object","d":"A made thing's model package in the assets store, installed once per version by install_model.py, which checks it against the record. Without one the game draws a translucent box of its size, named on the edges.","c":[{"n":"format","r":1,"k":"freefall-model/1"},{"n":"path","r":1,"t":"string","d":"The version's folder in the assets store, relative to it: models/<key tail>/v<N>."},{"n":"manifest_sha256","r":1,"t":"string","d":"Of the version's manifest.json.","m":{"pattern":"^[0-9a-f]{64}$"}},{"n":"version","r":1,"t":"integer","m":{"minimum":1}},{"n":"triangles","t":"integer","d":"triangles drawn, from the model"},{"n":"note","t":"string"}],"s":"common.visual"},{"n":"model_requests","t":"array","d":"Work asked of its installed model, open until a later version answers it.","c":[{"n":"[ ]","t":"object","d":"Work asked of one installed model version (model_spec.py): rebuild, rig, measure or optimise. A later version answers it; a moved port never needs one.","c":[{"n":"work","r":1,"d":"What is asked of the model; keep: a review found the model shows the record as it is, no work (closes the review for that version).","e":["rebuild","rig","measure","optimise","keep"]},{"n":"because","r":1,"t":"string","d":"What changed or is wrong, and what the new model must do: plainly, so a modeller can act on it."},{"n":"asked","r":1,"t":"string","d":"When it was asked (YYYY-MM-DD)."},{"n":"of_version","r":1,"t":"integer","d":"The installed version it is asked of; a version above it answers it.","m":{"minimum":0}},{"n":"by","t":"string","d":"Who asks: the session or agent."}],"s":"common.model_request"}]},{"n":"life","t":"number","u":"s","d":"s in service before it is worn out and replaced; what it is made of comes back as scrap. Everything made has a life (the user's rule): this is what makes demand steady."},{"n":"revision","t":"object","d":"A record's revision: how firm it is, who decides a change to it, and what another agent does when it does not fit its own work. Read it before balancing against a record or building on it. A kind's schema gives the revision its records have unless they say otherwise (its default).","c":[{"n":"status","r":1,"d":"How firm a record is, for anyone building on it or against it. Only the user makes a record complete, and only the user reopens one.","e":["draft","review","complete","deprecated"],"s":"dictionary.revision_status"},{"n":"owner","d":"Who decides a change to a record.","e":["registry","ships","integration","user"],"s":"dictionary.owner"},{"n":"on_conflict","d":"What another agent does when a record does not fit its own work.","e":["adjust","propose","escalate","conform"],"s":"dictionary.on_conflict"},{"n":"open_to","t":"array of string","d":"The groups or figures (group.property) that may still be proposed for change, where the rest may not."},{"n":"fixed","t":"array of string","d":"The groups or figures that will not change, where the rest may."},{"n":"because","t":"string","d":"Why it stands where it does: what it rests on, or what waits on it."},{"n":"ask","t":"string","d":"Where a proposal to change it goes: a file of the repository."},{"n":"replaced_by","t":"string","d":"What replaces a deprecated record, by key, or the kind that will (layout)."},{"n":"priority","d":"low: its work waits behind everything else (the asset queue puts it last): a hold the user set, said in because","e":["low"]}],"s":"common.record_revision"},{"n":"basis","t":"array","d":"Where a record's figures come from. Each entry covers the groups (or group.property) it names. sourced: from a published source or the game, named. derived: worked out from other figures, by physics or from a model. invented: chosen, to be balanced or replaced. review: a guess put in so the figure is there, to be reviewed.","c":[{"n":"[ ]","t":"object","c":[{"n":"of","r":1,"t":"array of string","m":{"minItems":1}},{"n":"tier","d":"Where a figure comes from.","e":["sourced","derived","invented"],"s":"dictionary.tier"},{"n":"rule","t":"string","d":"A rule stated once (SFO/metadata/rules) that this entry rests on: its tier, source and review are the rule's unless given here (an entry has a tier or a rule; the build checks). The record's note says only what is its own.","x":["rule"]},{"n":"source","t":"string"},{"n":"note","t":"string"},{"n":"review","t":"boolean","d":"A guess put in so the figure is there: to be reviewed."}]}],"s":"common.basis"}]},"area":"SFO","file":"SFO/schema/module.schema.yaml","title":"Industrial module","also":[],"about":"One standard piece of industrial plant. It performs one step of a process. Any one module uses only some of these properties.","fields":["basis","capacity","climate","cuts","does","generation","identity","life","model_requests","motion","needs","physical","ports","recipes","revision","site","staff","throughput","visual"],"required":["identity","physical"],"key":"module","root":"physical_object","uses":{"amounts":["recipes[].inputs","recipes[].outputs"],"common.basis":["basis"],"common.key":["identity.key"],"common.model_request":["model_requests[]"],"common.motion":["motion[]"],"common.physical":["physical"],"common.physical_object":["(record)"],"common.port":["ports[]"],"common.record_revision":["revision"],"common.staff":["staff"],"common.visual":["visual"],"dictionary.on_conflict":["revision.on_conflict"],"dictionary.owner":["revision.owner"],"dictionary.revision_status":["revision.status"],"dictionary.tier":["basis[].tier"],"module_recipe":["recipes[]"]}},{"tree":{"n":"mount","t":"object","d":"standards/SFO/metadata/mounts/<slot>-s<class>.yaml: a hardpoint standard (SFO 19). A hull's slot offers it, equipment fits it; it states the most the hull gives there (room, weight, thrust, power, cooling, fuel, nozzle opening). Makers build to the mount, not the hull.","c":[{"n":"identity","r":1,"t":"object","c":[{"n":"key","r":1,"t":"string","d":"A record's one key, in the whole registry: <kind>.<name>, lower case, words joined by -, the kind being its schema's. The name may have more dotted parts where a record lives under another (body.treistun.treistun-f). Another record refers to it by this string.","m":{"pattern":"^[a-z][a-z-]*(\\.[a-z0-9][a-z0-9-]*)+$"},"s":"common.key"},{"n":"name","r":1,"t":"string"},{"n":"slot","r":1,"d":"A kind of slot a hull has, and so the kind of equipment that fits it.","e":["power","drive","thrusters","lift","tank","cargo","hyperdrive","capacitor","computer","transponder","sensors","comm","life_support","hardpoint","utility","avionics","access","handling","thermal","gear","gate","command","engine"],"s":"common.slot_kind"},{"n":"size_class","r":1,"t":"integer","d":"Its size class, 1 to 4. A slot takes equipment of its class or smaller.","m":{"minimum":1,"maximum":4}},{"n":"description","t":"string"}]},{"n":"envelope","r":1,"t":"object","d":"The most room a piece of equipment may take in it.","c":[{"n":"length","r":1,"t":"number","u":"m","d":"m, along the ship","m":{"exclusiveMinimum":0}},{"n":"width","r":1,"t":"number","u":"m","d":"m, across","m":{"exclusiveMinimum":0}},{"n":"height","r":1,"t":"number","u":"m","d":"m, up from the mating plane","m":{"exclusiveMinimum":0}}]},{"n":"bears","r":1,"t":"object","d":"The most the hull's structure takes at it.","c":[{"n":"mass","r":1,"t":"number","u":"kg","d":"kg, the heaviest equipment it carries","m":{"exclusiveMinimum":0}},{"n":"thrust","t":"number","u":"N","d":"N, the most push one nozzle may put through it (a drive, thrusters or lift)","m":{"exclusiveMinimum":0}},{"n":"recoil","t":"number","u":"N","d":"N, the most a weapon may kick against it, or a breaker push back on it","m":{"exclusiveMinimum":0}},{"n":"hold","t":"number","u":"N","d":"N, the most a clamp or docking gear holds the ship by through it: what it grips with reaches the hull here","m":{"exclusiveMinimum":0}},{"n":"landing","t":"number","u":"N","d":"N, the most a landing leg may put into it","m":{"exclusiveMinimum":0}},{"n":"moment","t":"number","u":"N m","d":"N m, the most a piece held out on it (a boom) may bend it by","m":{"exclusiveMinimum":0}}]},{"n":"attachment","r":1,"t":"object","d":"How what is fitted fastens to the hull: the points the load goes through, so that a frame can be built to the socket and a module strutted to it without a hull.","c":[{"n":"points","r":1,"t":"integer","d":"how many attachment points","m":{"minimum":1}},{"n":"pattern","r":1,"d":"corners: at the envelope's corners (8) or a face's (4). ring: evenly round the nozzle face. saddles: two bands round a tank, at the ends. trunnion: two bearings and a brace, a leg's.","e":["corners","ring","saddles","trunnion"]},{"n":"each","r":1,"t":"object","d":"What one point takes, at most, with the mount's margin.","c":[{"n":"tension","r":1,"t":"number","u":"N","m":{"exclusiveMinimum":0}},{"n":"compression","r":1,"t":"number","u":"N","m":{"exclusiveMinimum":0}},{"n":"shear","r":1,"t":"number","u":"N","m":{"exclusiveMinimum":0}}]}]},{"n":"spec","t":"array","d":"Limits of the standard beyond envelope, bears and feeds, for every slot that offers it.","c":[{"n":"[ ]","t":"object","d":"One parameter of a slot's (or a hull's) spec and its limits: what a fitted product, or the ship it makes, must meet. A slot's spec is its mount's limits (kind, size class, envelope, bears, feeds) plus these; together they are the validation base (tools/standards/ship.py spec, shipyard).","c":[{"n":"of","r":1,"t":"string","d":"The parameter: in a slot's spec, a path into the fitted product (physical.mass, functio ild checks).","x":["system"]},{"n":"note","t":"string","d":"One line"},{"n":"about","t":"array of string","d":"What it is, in paragraphs."},{"n":"story","t":"array of string","d":"Its story, in paragraphs."},{"n":"brand","t":"object","d":"How its products are marked (SFO 21): the name, colours and logo its labels and nameplates carry.","c":[{"n":"name","r":1,"t":"string","d":"The brand as printed: short, often not the company's full name"},{"n":"primary","r":1,"t":"array of number","u":"1","d":"sRGB 0 to 1: the label's band and the logo's ground","m":{"minItems":3,"maxItems":3}},{"n":"accent","r":1,"t":"array of number","u":"1","d":"sRGB 0 to 1: the second colour","m":{"minItems":3,"maxItems":3}},{"n":"logo","t":"string","d":"The logo, an SVG under standards/ (MakerHouse/logos/<name>.svg); absent: the label prints the ticker in the brand's colours"}]},{"n":"ticker","t":"string","d":"A company's short trading name; no two alike.","m":{"pattern":"^[A-Z]{2,4}$"}},{"n":"business","d":"What kind of company it is. food: it grows or makes food. insurance: it covers hulls and cargoes. banking: it lends. hauling: it carries freight. passage: it carries people. Left out: a maker. Only makers go to the game's brands.","e":["maker","warehousing","exchange","food","insurance","banking","hauling","passage"]},{"n":"who","t":"string","d":"Who they are."},{"n":"what","t":"string","d":"What they do."},{"n":"prefix","t":"string","d":"A standards body's letters, before each of its standards' numbers.","m":{"pattern":"^[A-Z]{2,6}$"}},{"n":"seat","t":"string"},{"n":"form","d":"What a standards body is, and so whom it answers to.","e":["consortium","independent","authority","corporation","players"]},{"n":"purpose","t":"string"},{"n":"details","t":"object","c":[{"n":"text","t":"array of string"}]},{"n":"founded_by","t":"array","d":"The companies that founded it.","c":[{"n":"[ ]","t":"string","x":["org"]}]},{"n":"fleet","t":"array","d":"The ships it operates at day 0: hulls, how many, and the settlement they are based at. Finite: a ship lost is one fewer until a yard delivers another. The operator flies these, crewed from the base's census; nothing else flies.","c":[{"n":"[ ]","t":"object","c":[{"n":"hull","r":1,"t":"string","x":["hull"]},{"n":"count","r":1,"t":"integer","m":{"minimum":1}},{"n":"home","r":1,"t":"string","x":["settlement","rig"]},{"n":"work","r":1,"d":"What the fleet does: the program the operator runs for it.","e":["hauling","passage","mining","patrol","raiding"],"s":"dictionary.fleet_job"},{"n":"does","t":"string","d":"What they do: hauling the supply runs, mining a field, patrol, passage, raiding."}]}]},{"n":"banking","t":"object","d":"For a bank: what it lends against and on what terms. Rates are shares a second (a yearly rate over a year's seconds); no sum is ever here.","c":[{"n":"lends_against","r":1,"t":"array","d":"What it takes as security.","c":[{"n":"[ ]","e":["hull","cargo","building","parcel","claim"]}]},{"n":"interest","r":1,"t":"number","u":"1/s","d":"the share of the loan charged each second (a yearly rate over a year's seconds)"},{"n":"longest_term","r":1,"t":"number","u":"s","d":"s, the longest it lends for"},{"n":"advance","t":"number","u":"1","d":"the share of the security's worth it will lend"},{"n":"reserve","t":"number","u":"1","d":"the share of its deposits it keeps unlent"}]},{"n":"exchange","t":"object","d":"For an exchange: its rules of trade. Only stock is sold (the user's rule): what is listed is stock lying in a warehouse it has approved, and a sale settles by the stock changing hands there.","c":[{"n":"lists","r":1,"t":"string","d":"What may be listed: stock items (stock.*, and pieces kept by count) lying in an approved warehouse; nothing else."},{"n":"settles","r":1,"t":"string","d":"How a sale settles: the stock's ownership changes in the warehouse's record at once; the buyer collects or has it hauled."},{"n":"fee","r":1,"t":"number","u":"1","d":"the share of every sale the exchange takes"},{"n":"approves","t":"string","d":"What a warehouse must have to be approved: a dock, a store, a keeper who records what lies there."}]},{"n":"insurance","t":"object","d":"For an insurer: what it covers and on what terms. Rates are shares. A lost hull is replaced at a yard, parked, once the excess is paid: nobody is put back into a fight.","c":[{"n":"covers","r":1,"t":"array","c":[{"n":"[ ]","e":["hull","fit","cargo","crew"]}]},{"n":"premium","r":1,"t":"number","u":"1/s","d":"the share of the insured worth charged each second (a yearly rate over a year's seconds)"},{"n":"excess","r":1,"t":"number","u":"1","d":"the share of the loss the insured pays before a replacement is delivered"},{"n":"delivered_at","r":1,"d":"where a replacement is handed over: a yard that builds it, or any port of the insurer's","e":["yard","port"]},{"n":"yards","t":"array","d":"The yards it takes replacements from: a finished hull in the yard's stock is delivered at once, else the yard builds one to order in its dock's time.","c":[{"n":"[ ]","t":"string","x":["facility"]}]},{"n":"refuses","t":"array","d":"losses it will not pay: those the insured brought on by these offences","c":[{"n":"[ ]","d":"What an administration's law forbids. A breach is recorded against the person and the ship, never hard-blocked: the game lets it happen and the law answers.","e":["piracy","murder","theft","smuggling","zoning breach","unlicensed mining","reckless flying","fraud","evasion"],"s":"dictionary.offence"}]}]},{"n":"trade_bans","t":"array","d":"What may not be traded in its markets: its law, and like its zoning it can be broken.","c":[{"n":"[ ]","t":"object","c":[{"n":"market","r":1,"t":"string","d":"The market category it bans, by its key.","x":["market"]},{"n":"note","t":"string"}]}]},{"n":"law","t":"object","d":"Its code: what it forbids, what it does about a breach, how it enforces, how far it reaches. Like zoning, every part of it can be broken; the game records the breach and the law answers. A system without an administration has no law.","c":[{"n":"jurisdiction","r":1,"d":"How far an administration's law reaches.","e":["system","settlements"],"s":"dictionary.jurisdiction"},{"n":"offences","r":1,"t":"array","c":[{"n":"[ ]","t":"object","c":[{"n":"offence","r":1,"d":"What an administration's law forbids. A breach is recorded against the person and the ship, never hard-blocked: the game lets it happen and the law answers.","e":["piracy","murder","theft","smuggling","zoning breach","unlicensed mining","reckless flying","fraud","evasion"],"s":"dictionary.offence"},{"n":"penalties","r":1,"t":"array","d":"What follows, all of it: a fine and a forfeiture and a bounty may stand together.","c":[{"n":"[ ]","t":"object","c":[{"n":"kind","r":1,"d":"What the law does about a breach. Fines and bounties are shares of what was at stake, never a sum: the registry holds no prices.","e":["warning","fine","forfeiture","gaol","outlawry","bounty"],"s":"dictionary.penalty"},{"n":"share","t":"number","u":"1","d":"for a fine or a bounty: the share of the value at stake (a fine) or of the offender's ship (a bounty)"},{"n":"term","t":"number","u":"s","d":"for gaol or outlawry: how long"}]}]},{"n":"note","t":"string"}]}]},{"n":"enforcement","r":1,"t":"object","d":"Who answers a breach, and with what.","c":[{"n":"constables_per","t":"integer","d":"one constable to this many people, at each settlement"},{"n":"judges_per","t":"integer","d":"one judge to this many people"},{"n":"patrol","t":"array","d":"The craft each settlement keeps armed and crewed to answer piracy and reckless flying in its approaches.","c":[{"n":"[ ]","t":"object","c":[{"n":"hull","r":1,"t":"string","x":["hull"]},{"n":"per_people","r":1,"t":"integer","d":"one craft to this many people, at least one where there is a port"}]}]},{"n":"response","t":"number","u":"s","d":"s from a breach seen to a patrol under way, in its approaches"}]},{"n":"redress","t":"object","d":"The ways back from a breach: a law with no way back is a ban. Appeal,   all.forEach(d => d.classList.add("hidden-by-filter"));
  all.filter(d => d.dataset.name.includes(q)).forEach(d => {
    for (let p = d; p && p.tagName === "DETAILS"; p = p.parentElement.closest("details")) { p.classList.remove("hidden-by-filter"); if (p !== d) p.open = true; }
    d.querySelectorAll("details").forEach(c => c.classList.remove("hidden-by-filter"));
  });
});

/* ---------- State ---------- */
function select(key, redraw = true) {
  if (!byKey[key]) return;
  st.selected = key;
  panel(byKey[key]);
  const opened = showTree(byKey[key]);
  tab("schema");
  if (st.custom && !st.custom.has(key)) { st.custom = null; setMode(st.mode, false); }
  markMatrix(); renderList();
  if (st.view === "focus" && (redraw || opened)) draw();
  if (st.view === "matrix") mx.querySelector(`tr[data-row="${CSS.escape(key)}"] th`)?.scrollIntoView({ block: "nearest", inline: "nearest" });
}
function setView(v) {
  st.view = v; save();
  document.getElementById("v-matrix").setAttribute("aria-pressed", v === "matrix");
  document.getElementById("v-focus").setAttribute("aria-pressed", v === "focus");
  document.getElementById("matrix").hidden = v !== "matrix";
  document.getElementById("focus").hidden = v !== "focus";
  hideTip();
  if (v === "focus") draw();
}
function setMode(m, redraw = true) {
  st.mode = m; st.custom = null; save();
  ["near1", "near2", "down", "up", "area"].forEach(x => document.getElementById("m-" + x).setAttribute("aria-pressed", x === m));
  if (redraw && st.view === "focus") draw();
}
document.getElementById("v-matrix").onclick = () => setView("matrix");
document.getElementById("v-focus").onclick = () => setView("focus");
["near1", "near2", "down", "up", "area"].forEach(x => document.getElementById("m-" + x).onclick = () => { setMode(x, st.view === "focus"); if (st.view !== "focus") setView("focus"); });
const ta = document.getElementById("t-among");
ta.onclick = () => { st.among = !st.among; ta.setAttribute("aria-pressed", st.among); save(); if (st.view === "focus") draw(); };
ta.setAttribute("aria-pressed", st.among);
const tb = document.getElementById("t-book");
tb.onclick = () => { st.book = !st.book; tb.setAttribute("aria-pressed", st.book); save(); matrix(); renderList(); if (st.selected) panel(byKey[st.selected]); if (st.view === "focus") draw(); };
const ar = document.getElementById("areas");
areas.forEach(a => {
  const b = document.createElement("button");
  b.className = "chip"; b.setAttribute("aria-pressed", "true"); b.id = "area-" + a.replace(/\W/g, "");
  b.innerHTML = `<i style="background:var(${areaVar[a]})"></i>${esc(a)} <span>${DATA.kinds.filter(k => k.area === a).length}</span>`;
  b.onclick = () => { shown.has(a) ? shown.delete(a) : shown.add(a); b.setAttribute("aria-pressed", shown.has(a)); matrix(); renderList(); if (st.view === "focus") draw(); };
  ar.appendChild(b);
});
document.getElementById("q").addEventListener("input", e => {
  const q = e.target.value.trim().toLowerCase();
  if (!q) return;
  const hit = DATA.kinds.find(k => k.key === q) || DATA.kinds.find(k => k.key.startsWith(q)) || DATA.kinds.find(k => k.key.includes(q) || k.title.toLowerCase().includes(q));
  if (hit) { if (!shown.has(hit.area)) document.getElementById("area-" + hit.area.replace(/\W/g, "")).click(); select(hit.key); }
});
addEventListener("resize", () => { if (st.view === "focus") fit(); });

tb.setAttribute("aria-pressed", st.book);
matrix(); intro(); setGroup(groupBy); tab("list"); setMode(st.mode, false); setView(st.view);
const hash = location.hash.slice(1);
if (hash && byKey[hash]) select(hash);
</script>
