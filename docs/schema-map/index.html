<title>Freefall Registry Map</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen tool - toolbar; schema tree (left), the view (matrix overview or routed diagram), details (right). Engineering-drawing palette. */
:root {
  --bg: #f3f5f7; --panel: #ffffff; --fg: #17202a; --muted: #5a6775; --line: #d3dae1; --soft: #e9edf1; --grid: #e3e8ed;
  --accent: #1f6feb; --root-fg: #ffffff; --def: #7b8794; --hl: #d9480f; --hl2: #1f6feb;
  --a0: #2f6db5; --a1: #c46a12; --a2: #3f8f4a; --a3: #c23b3b; --a4: #2a8f8a; --a5: #a88a12; --a6: #8b5a9e; --a7: #c9577a; --a8: #7a5a43; --a9: #6b7680;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1418; --panel: #161d23; --fg: #e3e9ef; --muted: #93a1ae; --line: #2a343d; --soft: #1d262e; --grid: #222c35;
  --accent: #5b9dff; --root-fg: #0f1418; --def: #8794a1; --hl: #ff8a4c; --hl2: #5b9dff;
  --a0: #6aa3ea; --a1: #eb9a4b; --a2: #73c27d; --a3: #ef7474; --a4: #5cc5bf; --a5: #d9bd4a; --a6: #bb8dd0; --a7: #ec8db0; --a8: #c09a7d; --a9: #9aa6b1;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1418; --panel: #161d23; --fg: #e3e9ef; --muted: #93a1ae; --line: #2a343d; --soft: #1d262e; --grid: #222c35;
  --accent: #5b9dff; --root-fg: #0f1418; --def: #8794a1; --hl: #ff8a4c; --hl2: #5b9dff;
  --a0: #6aa3ea; --a1: #eb9a4b; --a2: #73c27d; --a3: #ef7474; --a4: #5cc5bf; --a5: #d9bd4a; --a6: #bb8dd0; --a7: #ec8db0; --a8: #c09a7d; --a9: #9aa6b1;
  color-scheme: dark; }
html, body { height: 100%; }
@media (min-width: 761px) { body { overflow: hidden; } }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 14px; display: flex; flex-direction: column; }
header { display: flex; flex-direction: column; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
h1 { font-size: 15px; font-weight: 600; margin: 0; }
h1 small { font-weight: 400; color: var(--muted); font-family: var(--mono); font-size: 12px; margin-left: 6px; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { font: 500 12px var(--sans); background: transparent; color: var(--muted); border: 0; padding: 5px 10px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.lbl { font: 600 10.5px var(--sans); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
input[type=search] { font: 13px var(--mono); padding: 5px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); width: 15rem; max-width: 100%; }
button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.tog { font: 500 12px var(--sans); padding: 4px 9px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--fg); cursor: pointer; }
.tog[aria-pressed="false"] { color: var(--muted); }
.chip { font: 500 11.5px var(--sans); display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border: 1px solid var(--line); border-radius: 999px; background: transparent; color: var(--fg); cursor: pointer; }
.chip i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.chip[aria-pressed="false"] { opacity: .4; }
.chip span { color: var(--muted); font-variant-numeric: tabular-nums; }
main { flex: 1; display: flex; min-height: 0; }
#stage { flex: 1; min-width: 0; position: relative; overflow: hidden; }
#tip { position: fixed; pointer-events: none; background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font: 11.5px var(--mono); max-width: 380px; box-shadow: 0 4px 14px rgb(0 0 0 / .14); z-index: 20; line-height: 1.45; }

/* Matrix: rows name columns. */
#matrix { position: absolute; inset: 0; overflow: auto; }
#matrix[hidden], #focus[hidden] { display: none; }
table.dsm { border-collapse: separate; border-spacing: 0; font: 10.5px var(--mono); }
.dsm th, .dsm td { padding: 0; }
.dsm thead th { position: sticky; top: 0; background: var(--panel); z-index: 2; }
.dsm thead tr.areas th { height: 20px; font: 600 10.5px var(--sans); text-align: left; padding-left: 4px; border-bottom: 2px solid; white-space: nowrap; overflow: hidden; max-width: 0; }
.dsm thead tr.cols th { top: 22px; height: 150px; vertical-align: bottom; border-bottom: 1px solid var(--line); }
.dsm thead tr.cols th div { writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap; padding: 4px 0; width: 20px; text-align: left; cursor: pointer; color: var(--fg); }
.dsm th.corner { position: sticky; left: 0; top: 0; z-index: 4; background: var(--panel); min-width: 210px; max-width: 210px; text-align: left; font: 400 11px/1.45 var(--sans); color: var(--muted); padding: 8px; vertical-align: bottom; white-space: normal; }
.dsm thead tr.areas th.corner { white-space: normal; overflow: visible; max-width: 210px; border-bottom: 1px solid var(--line); }
.dsm tbody th { position: sticky; left: 0; z-index: 1; background: var(--panel); text-align: left; white-space: nowrap; padding: 0 8px 0 6px; height: 20px; border-left: 4px solid; cursor: pointer; font-weight: 400; color: var(--fg); }
.dsm td { width: 20px; height: 20px; min-width: 20px; text-align: center; border-right: 1px solid var(--grid); border-bottom: 1px solid var(--grid); color: var(--fg); font-variant-numeric: tabular-nums; }
.dsm td.n { cursor: pointer; font-weight: 500; }
.dsm td.diag { background: var(--soft); }
.dsm .ab { border-left: 2px solid var(--muted) !important; }
.dsm tr.at td, .dsm tr.at th { border-top: 2px solid var(--muted); }
.dsm tr.sel th { background: var(--soft); font-weight: 600; }
.dsm tr.sel td { box-shadow: inset 0 0 0 999px color-mix(in srgb, var(--hl) 10%, transparent); }
.dsm td.colsel { box-shadow: inset 0 0 0 999px color-mix(in srgb, var(--hl2) 10%, transparent); }
.dsm thead th.colsel div { font-weight: 600; color: var(--hl2); }

/* Routed diagram */
#focus { position: absolute; inset: 0; cursor: grab; touch-action: none; }
#focus.drag { cursor: grabbing; }
#focus svg { width: 100%; height: 100%; display: block; }
.card rect.body { fill: var(--panel); stroke-width: 1.2; }
.card text { font-family: var(--mono); font-size: 11px; fill: var(--fg); }
.card text.title { font-weight: 600; font-size: 12px; fill: var(--root-fg); cursor: pointer; }
.card text.sub { font-size: 9.5px; font-family: var(--sans); fill: var(--root-fg); opacity: .85; }
.card text.to { fill: var(--muted); }
.card text.more { fill: var(--muted); font-family: var(--sans); font-size: 10px; }
.card .frow { cursor: pointer; }
.card .frow rect { fill: transparent; }
.card .frow:hover rect, .card .frow.on rect { fill: var(--soft); }
.card.sel rect.body { stroke: var(--hl); stroke-width: 3; }
.card.dim { opacity: .22; }
path.edge { fill: none; stroke-width: 1.4; opacity: .75; stroke-linejoin: round; }
path.edge.on { stroke: var(--hl) !important; stroke-width: 2.6; opacity: 1; }
path.edge.dim { opacity: .08; }
path.edge.book { stroke-dasharray: 2 3; }
#focus .empty[hidden] { display: none; }
#focus .empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 13px; padding: 24px; text-align: center; }
.zoom { position: absolute; right: 12px; bottom: 12px; display: flex; gap: 4px; }
.zoom button { font: 500 12px var(--sans); width: 30px; height: 28px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--fg); cursor: pointer; }
.zoom button.wide { width: auto; padding: 0 9px; }

/* Left: all kinds (browse) and the schema of the selected one */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: -4px -14px 6px; padding: 0 14px; }
.tabs [role=tab] { font: 600 12px var(--sans); background: none; border: 0; border-bottom: 2px solid transparent; color: var(--muted); padding: 8px 8px 7px; cursor: pointer; }
.tabs [role=tab][aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.tabs [role=tab]:disabled { opacity: .4; cursor: default; }
.tabs .hide { margin-left: auto; font: 500 11.5px var(--sans); background: none; border: 0; color: var(--muted); cursor: pointer; }
#pane-list, #pane-schema { display: flex; flex-direction: column; gap: 8px; }
#pane-list[hidden], #pane-schema[hidden] { display: none; }
.listbar { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--muted); }
.listbar button, .grp summary button { font: 500 11px var(--sans); color: var(--accent); background: none; border: 1px solid var(--line); border-radius: 5px; padding: 2px 7px; cursor: pointer; }
.grp { border-top: 1px solid var(--soft); }
.grp summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 7px 0; font: 600 12px var(--sans); }
.grp summary::-webkit-details-marker { display: none; }
.grp summary::before { content: "▸"; color: var(--muted); width: 10px; }
.grp[open] summary::before { content: "▾"; }
.grp summary .n { color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }
.grp summary button { margin-left: auto; }
.grp summary i, .krow i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.krow { display: grid; grid-template-columns: 10px 1fr auto; gap: 8px; align-items: center; width: 100%; text-align: left; background: none; border: 0; border-radius: 5px; padding: 4px 6px; cursor: pointer; color: var(--fg); font: 12px var(--mono); }
.krow:hover, .krow.sel { background: var(--soft); }
.krow .c { color: var(--muted); font-size: 10.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.krow .m { grid-column: 2 / 4; color: var(--muted); font-size: 10.5px; word-break: break-all; }
.reopen { position: absolute; left: 8px; top: 8px; z-index: 6; font: 500 12px var(--sans); background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
main { position: relative; }

nav#tree { width: 380px; flex: none; border-right: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 14px 14px 24px; display: flex; flex-direction: column; gap: 8px; }
nav#tree[hidden], .reopen[hidden] { display: none; }
.treehead { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.treehead h2 { font: 600 15px var(--mono); margin: 0; word-break: break-word; }
.treehead button, .treetools button { font: 500 11.5px var(--sans); color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 5px; padding: 3px 8px; cursor: pointer; }
.treetools { display: flex; gap: 6px; flex-wrap: wrap; }
.treetools input { flex: 1; min-width: 8rem; font: 12px var(--mono); padding: 4px 8px; border: 1px solid var(--line); border-radius: 5px; background: var(--bg); color: var(--fg); }
#tree-body { font: 12px var(--mono); }
#tree-body details { margin-left: 12px; border-left: 1px solid var(--soft); padding-left: 6px; }
#tree-body > details { margin-left: 0; border-left: 0; padding-left: 0; }
#tree-body summary { cursor: pointer; padding: 2px 0; list-style: none; display: flex; flex-wrap: wrap; gap: 2px 6px; align-items: baseline; }
#tree-body summary::-webkit-details-marker { display: none; }
#tree-body summary::before { content: "▸"; color: var(--muted); width: 10px; flex: none; }
#tree-body details[open] > summary::before { content: "▾"; }
#tree-body details.leaf > summary::before { content: "·"; }
.pn { font-weight: 500; color: var(--fg); }
.pn.req::after { content: "*"; color: var(--hl); margin-left: 1px; }
.pt { color: var(--muted); }
.pu { color: var(--a2); }
.ps { color: var(--def); border: 1px dashed var(--def); border-radius: 4px; padding: 0 4px; font-size: 10.5px; }
.px button { font: inherit; font-size: 11px; color: var(--root-fg); background: var(--accent); border: 0; border-radius: 4px; padding: 0 5px; cursor: pointer; }
.pd { color: var(--muted); font-family: var(--sans); font-size: 12px; line-height: 1.45; margin: 2px 0 4px 16px; }
.pe { margin: 2px 0 4px 16px; color: var(--fg); font-size: 11px; line-height: 1.5; word-break: break-word; }
.pm { color: var(--muted); font-size: 11px; }
.hidden-by-filter { display: none; }

/* Details (right) */
aside { width: 350px; flex: none; border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
aside h2 { font: 600 16px var(--mono); margin: 0; word-break: break-word; }
.meta { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: 12.5px; margin: 0; }
.meta dt { color: var(--muted); }
.meta dd { margin: 0; font-family: var(--mono); font-size: 12px; word-break: break-all; }
.about { color: var(--muted); font-size: 13px; line-height: 1.5; margin: 0; }
h3 { font: 600 11px var(--sans); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 6px; }
.acts { display: flex; gap: 6px; flex-wrap: wrap; }
.acts button { font: 500 11.5px var(--sans); color: var(--accent); background: none; border: 1px solid var(--line); border-radius: 5px; padding: 3px 8px; cursor: pointer; }
table.dep { width: 100%; border-collapse: collapse; font: 12px var(--mono); }
table.dep td { padding: 3px 0; vertical-align: top; border-top: 1px solid var(--soft); }
table.dep td:first-child { width: 42%; padding-right: 8px; }
table.dep td.f { color: var(--muted); word-break: break-all; }
table.dep button { font: inherit; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; text-align: left; word-break: break-all; }
.hint { color: var(--muted); font-size: 13px; line-height: 1.5; margin: 0; }
.none { color: var(--muted); font: 12px var(--mono); margin: 0; }
@media (max-width: 760px) {
  main { flex-direction: column; }
  #stage { min-height: 65vh; }
  nav#tree { width: auto; border-right: 0; border-bottom: 1px solid var(--line); max-height: 60vh; order: 2; }
  aside { width: auto; border-left: 0; border-top: 1px solid var(--line); order: 3; }
}
</style>

<header>
  <div class="row">
    <h1>Freefall Registry Map <small id="count"></small></h1>
    <input type="search" id="q" placeholder="Find a kind: hull, mount, planet-field" aria-label="Find a kind">
    <span class="lbl">View</span>
    <div class="seg" role="group" aria-label="View">
      <button id="v-matrix" aria-pressed="true">Matrix</button>
      <button id="v-focus" aria-pressed="false">Diagram</button>
    </div>
    <span class="lbl">Diagram shows</span>
    <div class="seg" role="group" aria-label="Diagram scope">
      <button id="m-near1" aria-pressed="true">1 step</button>
      <button id="m-near2" aria-pressed="false">2 steps</button>
      <button id="m-down" aria-pressed="false">All it depends on</button>
      <button id="m-up" aria-pressed="false">All that depend on it</button>
      <button id="m-area" aria-pressed="false">Its area</button>
    </div>
    <button class="tog" id="t-among" aria-pressed="false">Links between neighbours</button>
    <button class="tog" id="t-book" aria-pressed="false">Bookkeeping links</button>
  </div>
  <div class="row" id="areas" aria-label="Areas"><span class="lbl">Areas</span></div>
</header>
<main>
  <nav id="tree" aria-label="Kinds and schema">
    <div class="tabs" role="tablist"><button role="tab" id="tab-list" aria-selected="true">All kinds</button><button role="tab" id="tab-schema" aria-selected="false" disabled>Schema</button><button id="tree-close" aria-label="Hide this panel" class="hide">Hide</button></div>
    <section id="pane-list">
      <div class="treetools"><input type="search" id="list-q" placeholder="Filter: name, area, root or field" aria-label="Filter kinds"></div>
      <div class="row"><span class="lbl">Group by</span><div class="seg" role="group" aria-label="Group by"><button id="g-root" aria-pressed="true">Root</button><button id="g-area" aria-pressed="false">Area</button><button id="g-none" aria-pressed="false">None</button></div></div>
      <div class="listbar"><span id="list-count"></span><button id="list-draw">Draw these</button></div>
      <div id="list-body"></div>
    </section>
    <section id="pane-schema" hidden>
      <div class="treehead"><h2 id="tree-title"></h2></div>
      <p class="hint" id="tree-file"></p>
      <div class="treetools"><input type="search" id="tree-q" placeholder="Filter fields" aria-label="Filter fields"><button id="tree-open">Expand all</button><button id="tree-shut">Collapse</button></div>
      <div id="tree-body"></div>
    </section>
  </nav>
  <button id="tree-show" class="reopen" hidden>Kinds</button>
  <div id="stage">
    <div id="matrix"></div>
    <div id="focus" hidden>
      <svg id="svg" aria-label="Diagram of the selected kind and its references"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker></defs><g id="vp"></g></svg>
      <div class="empty" id="focus-empty">Pick a kind (click a row in the matrix, or search) to draw it with its references.</div>
      <div class="zoom"><button id="z-in" aria-label="Zoom in">+</button><button id="z-out" aria-label="Zoom out">−</button><button id="z-fit" class="wide">Fit</button></div>
    </div>
  </div>
  <aside id="panel"></aside>
</main>
<div id="tip" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/elkjs@0.9.3/lib/elk.bundled.js"></script>
<script>

,"d":"The groups or figures that will not change, where the rest may."},{"n":"because","t":"string","d":"Why it stands where it does: what it rests on, or what waits on it."},{"n":"ask","t":"string","d":"Where a proposal to change it goes: a file of the repository."},{"n":"replaced_by","t":"string","d":"What replaces a deprecated record, by key, or the kind that will (layout)."},{"n":"priority","d":"low: its work waits behind everything else (the asset queue puts it last): a hold the user set, said in because","e":["low"]}],"s":"common.record_revision"},{"n":"basis","t":"array","d":"Where a record's figures come from. Each entry covers the groups (or group.property) it names. sourced: from a published source or the game, named. derived: worked out from other figures, by physics or from a model. invented: chosen, to be balanced or replaced. review: a guess put in so the figure is there, to be reviewed.","c":[{"n":"[ ]","t":"object","c":[{"n":"of","r":1,"t":"array of string","m":{"minItems":1}},{"n":"tier","d":"Where a figure comes from.","e":["sourced","derived","invented"],"s":"dictionary.tier"},{"n":"rule","t":"string","d":"A rule stated once (SFO/metadata/rules) that this entry rests on: its tier, source and review are the rule's unless given here (an entry has a tier or a rule; the build checks). The record's note says only what is its own.","x":["rule"]},{"n":"source","t":"string"},{"n":"note","t":"string"},{"n":"review","t":"boolean","d":"A guess put in so the figure is there: to be reviewed."}]}],"s":"common.basis"}]},"area":"SFO","file":"SFO/schema/assembly.schema.yaml","title":"Assembly","also":[],"about":"standards/SFO/metadata/assemblies/<name>.yaml: one built frame (SFO 14): members, nodes and decks in the design's frame, each naming its mill stock, whose form and size give its shape (no model). Fittings, bill of stock and physical figures are derived by frames.py: same-material node ends welded, others bolted through a forged end fitting; members over mill length spliced; decks clipped every 0.5","fields":["basis","bill","decks","fittings","identity","making","members","nodes","physical","revision"],"required":["identity","members","physical"],"key":"assembly","root":"physical_object","uses":{"common.basis":["basis"],"common.key":["identity.key"],"common.making":["making"],"common.physical":["physical"],"common.physical_object":["(record)"],"common.record_revision":["revision"],"common.revision":["identity.revision"],"dictionary.design_stage":["identity.revision"],"dictionary.on_conflict":["revision.on_conflict"],"dictionary.owner":["revision.owner"],"dictionary.revision_status":["revision.status"],"dictionary.tier":["basis[].tier"]}},{"tree":{"n":"body","t":"object","d":"A natural body: star, planet, moon, asteroid, dwarf planet, comet, centaur. Filed under systems/<system>/bodies/ where the game's seed makes it, else under small-bodies/ (in_game: not made). It uses the properties that apply to it.","from":["common.physical_object"],"c":[{"n":"physical","r":1,"t":"object","c":[{"n":"mass","t":"number","u":"kg","d":"kg"},{"n":"radius","t":"number","u":"m","d":"m"},{"n":"density","t":"number","u":"kg/m3","d":"kg/m3, where its mass is worked out from its size and what it is made of"},{"n":"gravity","t":"number","u":"m/s2","d":"m/s2 at its surface"},{"n":"day","t":"number","u":"s","d":"s to turn once"},{"n":"tilt","t":"number","u":"deg","d":"degrees, its axis from upright on the system's plane"},{"n":"albedo","t":"number","u":"1","d":"the share of sunlight it reflects"},{"n":"rings","t":"array of number","u":"m","d":"m, the inner and outer radius of its rings","m":{"minItems":2,"maxItems":2}},{"n":"flattening","t":"number","u":"1","d":"how far its spin flattens it: the share by which its poles are closer in than its equator"},{"n":"age","t":"number","u":"s","d":"s since it formed"}]},{"n":"provenance","r":1,"d":"How a record of the charted world came to be.","e":["seeded","curated","frozen","baked"],"s":"common.provenance"},{"n":"in_game","d":"Whether the game makes it yet.","e":["made","partly","not made"],"s":"common.in_game"},{"n":"identity","r":1,"t":"object","c":[{"n":"key","r":1,"t":"string","d":"The body's ID: body.<system>.<its name as the seed first gave it, slugged>. Given once when the record is written out and never changed; the game matches the seed's body to its record by it, so the name is free to change (identity.also keeps the seed's). Claims, settlements and surveys point at it.","m":{"pattern":"^[a-z][a-z-]*(\\.[a-z0-9][a-z0-9-]*)+$"},"s":"common.key"},{"n":"name","r":1,"t":"string"},{"n":"also","t":"string","d":"What else it is called: a named world keeps the surveyors' letter (Heath)."},{"n":"kind","r":1,"e":["star","rocky planet","gas giant","ice giant","moon","asteroid","dwarf planet","comet","centaur","crossing asteroid","captured moon"]},{"n":"parent","t":"string","d":"What it goes round, by its key: the star, a planet, or (a captured moon) a giant. A star has none.","x":["body"]},{"n":"about","t":"string"},{"n":"story","t":"array of string","d":"Its story, in paragraphs."}]},{"n":"star","t":"object","d":"For a star.","c":[{"n":"class","t":"string","d":"Its spectral class: O, B, A, F, G, K or M."},{"n":"luminosity","t":"number","u":"W","d":"W, all the light it gives off"}]},{"n":"orbit","t":"object","c":[{"n":"semi_major_axis","t":"number","u":"m","d":"m, half the long axis of its orbit"},{"n":"eccentricity","t":"number","u":"1","d":"how far from a circle (0: a circle)"},{"n":"period","t":"number","u":"s","d":"s to go round once"},{"n":"inclination","t":"number","u":"deg","d":"degrees from the system's plane"},{"n":"ascending_node","t":"number","u":"deg","d":"degrees, where its orbit rises through the system's plane"},{"n":"periapsis_argument","t":"number","u":"deg","d":"degrees from that node round to its closest point"},{"n":"mean_anomaly","t":"number","u":"deg","d":"degrees round its orbit at the world's start"}]},{"n":"bulk","t":"object","d":"What the whole body is made of, by mass. The shares add to 1.","c":[{"n":"metal","t":"number","u":"1","d":"iron and nickel"},{"n":"rock","t":"number","u":"1","d":"silicate rock"},{"n":"ice","t":"number","u":"1","d":"water and other ices"},{"n":"gas","t":"number","u":"1","d":"hydrogen and helium"}]},{"n":"interior","t":"object","d":"Its layers, from the centre out, and the heat it gives off.","c":[{"n":"differentiated","t":"boolean","d":"whether it once melted through and sorted itself into core, mantle and crust"},{"n":"core_radius","t":"number","u":"m","d":"m"},{"n":"core_state","d":"A liquid core that turns over can make a magnetic field.","e":["solid","liquid","liquid with a solid centre"]},{"n":"core_made_of","t":"string"},{"n":"mantle_made_of","t":"string"},{"n":"crust_thickness","t":"number","u":"m","d":"m, on average"},{"n":"heat_flow","t":"number","u":"W/m2","d":"W for each m2 of its surface, from its inside (Earth: 0.09)"},{"n":"radiogenic","t":"number","u":"1","d":"its mantle's radioactive heat as a multiple of Earth's (K, Th and U at Earth's abundances = 1); an input to the planet simulation"},{"n":"heat_from","t":"array","d":"Where that heat comes from.","c":[{"n":"[ ]","e":["formation","radioactivity","tides","settling"]}]}]},{"n":"magnetic","t":"object","c":[{"n":"field","t":"number","u":"T","d":"T at its surface, at the equator (Earth: about 0.00003)"},{"n":"tilt","t":"number","u":"deg","d":"degrees between its magnetic axis and its spin axis"},{"n":"from","d":"What makes it.","e":["core dynamo","crust left magnetised","induced","none"]}]},{"n":"crust","t":"object","d":"What its ground is, and what can be dug from it.","c":[{"n":"rocks","t":"array","d":"The rocks its crust is made of, each with its share of the surface.","c":[{"n":"[ ]","t":"object","c":[{"n":"rock","r":1,"t":"string"},{"n":"share","r":1,"t":"number","u":"1"}]}]},{"n":"regolith","t":"number","u":"m","d":"m of loose broken rock over its bedrock"},{"n":"ores","t":"array","d":"What is worth digging: each a rock of the SFO's goods, how much of the crust it is, and how deep it lies.","c":[{"n":"[ ]","t":"object","c":[{"n":"ore","r":1,"t":"string"},{"n":"share","t":"number","u":"1","d":"share of the crust"},{"n":"depth","t":"number","u":"m","d":"m to reach it"},{"n":"where","t":"string"}]}]},{"n":"tectonics","d":"plates: its crust is in pieces that move and are remade. one plate: a single shell, with volcanoes. none: dead.","e":["plates","one plate","none"]},{"n":"volcanism","e":["active","past","none","ice volcanoes"]},{"n":"surface_age","t":"number","u":"s","d":"s since its surface was last remade: old ground is heavily cratered"}]},{"n":"water","t":"object","c":[{"n":"ocean_cover","t":"number","u":"1","d":"the share of its surface under open water"},{"n":"ocean_depth","t":"number","u":"m","d":"m, on average"},{"n":"ice_cover","t":"number","u":"1","d":"the share of its surface under ice"},{"n":"polar_ice","t":"boolean","d":"For an airless world: ice in the craters at its poles that never see the sun."},{"n":"buried_sea","t":"boolean","d":"A sea under its crust, kept liquid by heat from inside."},{"n":"mass_share","t":"number","u":"1","d":"water at the surface (seas and ice) as a share of the body's mass (Earth: 2.3e-4); the planet simulation's lever for how much of it is sea"},{"n":"salinity","t":"number","u":"1","d":"the share of its sea water that is salt, by mass (Earth: 0.035)"}]},{"n":"surface","t":"object","c":[{"n":"terrain","d":"terran: seas, continents, mountains. dry: rock, hills, some craters. cratered: airless and heavily cratered.","e":["terran","dry","cratered"]},{"n":"relief","t":"number","u":"m","d":"m, how far its ground rises and falls"},{"n":"mean_temperature","t":"number","u":"K","d":"K, averaged over its surface"},{"n":"temperature_low","t":"number","u":"K","d":"K, its coldest place and time"},{"n":"temperature_high","t":"number","u":"K","d":"K, its hottest"},{"n":"highest","t":"number","u":"m","d":"m above its mean level, its highest ground"},{"n":"rain","t":"number","u":"m","d":"m of rain a year over its land, on average"},{"n":"lowest","t":"number","u":"m","d":"m below its mean level, its lowest"},{"n":"colour","t":"array of number","u":"1","d":"red, green, blue, each 0 to 1","m":{"minItems":3,"maxItems":3}},{"n":"landscape","t":"string","d":"For a frozen body: the file its made landscape is kept in."}]},{"n":"atmosphere","t":"object","c":[{"n":"surface_density","t":"number","u":"kg/m3","d":"kg/m3 at its surface (Earth: 1.225)"},{"n":"scale_height","t":"number","u":"m","d":"m, the height over which the air thins by 2.7 times"},{"n":"top","t":"number","u":"m","d":"m, where it is taken to end"},{"n":"surface_pressure","t":"number","u":"Pa","d":"Pa at its surface (Earth: 101,300)"},{"n":"made_of","t":"array","d":"Its gases, each with its share by volume.","c":[{"n":"[ ]","t":"object","c":[{"n":"gas","r":1,"t":"string","d":"An element's symbol, or a compound's formula."},{"n":"share","r":1,"t":"number","u":"1"}]}]},{"n":"breathable","t":"boolean","d":"whether a person can breathe it unaided"},{"n":"greenhouse","t":"number","u":"K","d":"K its air warms its surface by"},{"n":"clouds","t":"number","u":"1","d":"the share of its sky under cloud"},{"n":"wind","t":"number","u":"m/s","d":"m/s, typical at its surface"}]},{"n":"survey","t":"object","d":"For a baked body: the planet simulation's survey of it (format planet-sim-survey/1, docs/survey-contract.md), written once at the end of the run and never changed. The record owns the inputs the run was seeded from; the survey owns what the run derived. The game reads the survey's files from the folder, by its path; the hash says which survey.","c":[{"n":"format","r":1,"k":"planet-sim-survey/1"},{"n":"world_id","r":1,"t":"string","d":"The simulation's world ID: a new run is a new world."},{"n":"folder","r":1,"t":"string","d":"Where the survey's files are, relative to the repository root (standards/Celestial/surveys/<world_id>/). The game reads manifest.json, summary.json, deposits.geojson, districts.json, bulk_rock.json and geology.png from it."},{"n":"manifest_sha256","r":1,"t":"string","d":"SHA-256 of manifest.json: names the one survey this record is built on.","m":{"pattern":"^[0-9a-f]{64}$"}},{"n":"simulator_commit","t":"string","d":"The simulator's commit that grew the world."},{"n":"created","t":"string","d":"When the survey was written (ISO 8601)."},{"n":"land_share","t":"number","u":"1","d":"the share of its surface above the sea, as the run made it"},{"n":"deposits","t":"integer","d":"how many deposits the run grew"},{"n":"districts","t":"integer"},{"n":"belts","t":"integer"},{"n":"in_store","t":"array of string","d":"Survey files too large for the registry (over 20 MB: an airless world's impacts.json), left in the worlds store; the manifest beside the survey carries their hashes."},{"n":"contained","t":"array","d":"What the run put in its crust, from summary.json: the whole body's endowment, found or not.","c":[{"n":"[ ]","t":"object","c":[{"n":"commodity","r":1,"t":"string","d":"an element or compound as the simulation names it (Cu, Cr2O3, diamond)"},{"n":"mass","r":1,"t":"number","u":"kg","d":"kg; the survey's tonnes and carats (0.2 g) converted","m":{"exclusiveMinimum":0}}]}]}]},{"n":"energy","t":"object","d":"For a baked body: the planet simulation's energy package (planet-sim-energy/1): its oil and gas fields and coalfields, written once beside the survey. In-place amounts, model estimates calibrated on the simulation's Grown Earth; not recoverable. Fields' and coalfields' IDs are permanent; claims point at them.","c":[{"n":"format","r":1,"k":"planet-sim-energy/1"},{"n":"folder","r":1,"t":"string","d":"Where its files are, relative to the repository root (standards/Celestial/surveys/<world_id>/energy/): manifest.json, summary.json, fields.geojson, basins.json, coalfields.json."},{"n":"manifest_sha256","r":1,"t":"string","m":{"pattern":"^[0-9a-f]{64}$"}},{"n":"basins","t":"integer"},{"n":"oil_fields","t":"integer"},{"n":"gas_fields","t":"integer"},{"n":"coalfields","t":"integer"},{"n":"oil_in_place","t":"number","u":"m3","d":"m3 of oil in the ground (the package's million barrels, at 158.987 m3 a thousand barrels)"},{"n":"gas_in_place","t":"number","u":"m3","d":"m3 of gas at standard conditions (the package's billion cubic feet, at 28.317 million m3 a Bcf)"},{"n":"coal_in_place","t":"number","u":"kg","d":"kg of coal within 1,800 m"}]},{"n":"bake","t":"object","d":"A baked body's flyable surface package (planet-sim-surface/1), written once per version; only its pointer and manifest are kept here, the game fetches the files by hash from its worlds store.","c":[{"n":"format","r":1,"k":"planet-sim-surface/1"},{"n":"version","r":1,"t":"integer","m":{"minimum":1}},{"n":"path","r":1,"t":"string","d":"The version's folder in the worlds store, relative to it: worlds/<world_id>/surface/v<N>."},{"n":"manifest_sha256","r":1,"t":"string","d":"Of the version's manifest.json; a copy of the manifest lies in the registry beside the survey (surveys/<world_id>/surface/manifest.json) so the files and their hashes are known.","m":{"pattern":"^[0-9a-f]{64}$"}},{"n":"files","t":"integer"},{"n":"bytes","t":"number","u":"1","d":"bytes, all its files"},{"n":"note","t":"string","d":"The bake's own note."}]},{"n":"ground","t":"object","d":"A body's ground package (planet-unfold-tiles/1 or planet-land-pyramid/1) in the worlds store, in place of a bake. The game scales it to physical.radius and keeps the body's gravity, climate and lore.","c":[{"n":"format","r":1,"t":"string","m":{"pattern":"^(planet-unfold-tiles/1|planet-land-pyramid/1)$"}},{"n":"path","r":1,"t":"string","d":"The snapshot's folder in the worlds store, relative to it: worlds/<world_id>/ground/<snapshot>; its manifest.json names every file with its size and sha256."},{"n":"manifest_sha256","r":1,"t":"string","d":"Of the snapshot's manifest.json.","m":{"pattern":"^[0-9a-f]{64}$"}},{"n":"radius","t":"number","u":"m","d":"m, the package's own radius (the manifest's radius_m), for the scale the game applies"},{"n":"note","t":"string"}]},{"n":"life","t":"object","c":[{"n":"present","d":"What lives there that people did not bring.","e":["none","microbes","plants and animals"]},{"n":"soil","d":"Whether its ground can grow crops as it is.","e":["none","barren","poor","fertile"]},{"n":"began","t":"number","u":"s","d":"s ago life began there"},{"n":"photosynthesis","t":"number","u":"s","d":"s ago oxygenic photosynthesis began"},{"n":"oxidation","t":"number","u":"s","d":"s ago its air filled with oxygen (its Great Oxidation)"},{"n":"complex","t":"number","u":"s","d":"s ago complex (many-celled) life appeared"},{"n":"land_plants","t":"number","u":"s","d":"s ago plants took the land"},{"n":"forests","t":"number","u":"s","d":"s ago the first forests grew"}]},{"n":"rock","t":"object","d":"For an asteroid.","c":[{"n":"class","t":"string","d":"What it is made of, by its spectrum.","x":["rock-class"]},{"n":"structure","d":"How it holds together: loose rubble, or one solid piece.","e":["rubble pile","monolith"]},{"n":"density","t":"number","u":"kg/m3","d":"kg/m3"}]}]},"area":"Celestial","file":"Celestial/schema/body.schema.yaml","title":"Celestial body","also":[],"about":"A natural body: star, planet, moon, asteroid, dwarf planet, comet, centaur. Filed under systems/<system>/bodies/ where the game's seed makes it, else under small-bodies/ (in_game: not made). It uses the properties that apply to it.","fields":["atmosphere","bake","bulk","crust","energy","ground","identity","in_game","interior","life","magnetic","orbit","physical","provenance","rock","star","surface","survey","water"],"required":["identity","provenance"],"key":"body","root":"physical_object","uses":{"common.in_game":["in_game"],"common.key":["identity.key"],"common.physical_object":["(record)"],"common.provenance":["provenance"],"dictionary.in_game":["in_game"],"dictionary.provenance":["provenance"]}},{"tree":{"n":"building","t":"object","d":"standards/SFO/metadata/buildings/<name>.yaml: a building people live in or are served in, and not a works: a dwelling block, a clinic, a school. What it is, how much floor it gives, which needs of how many people it meets, and who works in it. What it is built of is its weight for now; where one stands is a settlement's to say.","from":["common.physical_object"],"c":[{"n":"physical","r":1,"t":"object","d":"What every physical thing has: what it weighs, the room it takes, what it stands. What a ship hauling it and a warehouse holding it have to know. A record uses those that apply to it.","c":[{"n":"mass","t":"number","u":"kg","d":"kg, the thing as made, with nothing fitted to it or carried in it","m":{"exclusiveMinimum":0}},{"n":"length","t":"number","u":"m","d":"m","m":{"exclusiveMinimum":0}},{"n":"width","t":"number","u":"m","d":"m","m":{"exclusiveMinimum":0}},{"n":"height","t":"number","u":"m","d":"m","m":{"exclusiveMinimum":0}},{"n":"envelope","t":"array of number","u":"m","d":"m, [length, width, height] of the box it ships in, where that differs from its own size","m":{"minItems":3,"maxItems":3}},{"n":"volume","t":"number","u":"m3","d":"m3, the space its shape takes","m":{"exclusiveMinimum":0}},{"n":"bulk_density","t":"number","u":"kg/m3","d":"kg/m3, as stowed broken in a hold, for what is carried in bulk","m":{"exclusiveMinimum":0}},{"n":"operating_min_temperature","t":"number","u":"K","d":"K, the coldest it works at"},{"n":"operating_max_temperature","t":"number","u":"K","d":"K, the hottest it works at"},{"n":"specific_heat","t":"number","u":"J/(kg K)","d":"J/(kg K) of the whole thing, for how fast its own losses warm it (a battery pack, a motor)"},{"n":"storage_min_temperature","t":"number","u":"K","d":"K, the coldest it may be kept or carried at"},{"n":"storage_max_temperature","t":"number","u":"K","d":"K, the hottest it may be kept or carried at"},{"n":"impact_resistance","t":"number","u":"J","d":"J, the blow it takes without damage"},{"n":"shock_limit","t":"number","u":"m/s2","d":"m/s2, the hardest jolt it takes while it is carried"}],"s":"common.physical"},{"n":"identity","r":1,"t":"object","c":[{"n":"key","r":1,"t":"string","d":"A record's one key, in the whole registry: <kind>.<name>, lower case, words joined by -, the kind being its schema's. The name may have more dotted parts where a record lives under another (body.treistun.treistun-f). Another record refers to it by this string.","m":{"pattern":"^[a-z][a-z-]*(\\.[a-z0-9][a-z0-9-]*)+$"},"s":"common.key"},{"n":"name","r":1,"t":"string"},{"n":"description","r":1,"t":"string"}]},{"n":"floor","r":1,"t":"number","u":"m2","d":"m2 of floor, all storeys together"},{"n":"storeys","t":"number","u":"1","d":"how many floors"},{"n":"per_people","r":1,"t":"integer","d":"One of it to this many people of a settlement: a settlement's buildings follow from its population by this (tools/standards/census.py), and its census from their staff. A settlement with fewer than a quarter of this many people has none.","m":{"minimum":1}},{"n":"meets","t":"array","d":"The needs it meets, and of how many people at once. Left out where it meets no one need: a shop, an office, a yard are where people work and buy.","m":{"minItems":1},"c":[{"n":"[ ]","t":"object","c":[{"n":"need","r":1,"t":"string","d":"The need, by its key.","x":["need"]},{"n":"people","r":1,"t":"number","u":"1","d":"how many people's need it meets"}]}]},{"n":"trains","t":"array","d":"For a school or college: the trades it teaches and how many it has places for at once. Its output a year is places over the trade's training time (profession.training.time).","c":[{"n":"[ ]","t":"object","c":[{"n":"profession","r":1,"t":"string","x":["profession"]},{"n":"places","r":1,"t":"integer","m":{"minimum":1}}]}]},{"n":"staff","t":"array","d":"Who works in it.","c":[{"n":"[ ]","t":"object","c":[{"n":"profession","r":1,"t":"string","d":"The trade, by its key.","x":["profession"]},{"n":"count","r":1,"t":"integer","d":"how many of them","m umber","u":"s","d":"s it is built to stand before it must be rebuilt"},{"n":"revision","t":"object","d":"A record's revision: how firm it is, who decides a change to it, and what another agent does when it does not fit its own work. Read it before balancing against a record or building on it. A kind's schema gives the revision its records have unless they say otherwise (its default).","c":[{"n":"status","r":1,"d":"How firm a record is, for anyone building on it or against it. Only the user makes a record complete, and only the user reopens one.","e":["draft","review","complete","deprecated"],"s":"dictionary.revision_status"},{"n":"owner","d":"Who decides a change to a record.","e":["registry","ships","integration","user"],"s":"dictionary.owner"},{"n":"on_conflict","d":"What another agent does when a record does not fit its own work.","e":["adjust","propose","escalate","conform"],"s":"dictionary.on_conflict"},{"n":"open_to","t":"array of string","d":"The groups or figures (group.property) that may still be proposed for change, where the rest may not."},{"n":"fixed","t":"array of string","d":"The groups or figures that will not change, where the rest may."},{"n":"because","t":"string","d":"Why it stands where it does: what it rests on, or what waits on it."},{"n":"ask","t":"string","d":"Where a proposal to change it goes: a file of the repository."},{"n":"replaced_by","t":"string","d":"What replaces a deprecated record, by key, or the kind that will (layout)."},{"n":"priority","d":"low: its work waits behind everything else (the asset queue puts it last): a hold the user set, said in because","e":["low"]}],"s":"common.record_revision"},{"n":"basis","t":"array","d":"Where a record's figures come from. Each entry covers the groups (or group.property) it names. sourced: from a published source or the game, named. derived: worked out from other figures, by physics or from a model. invented: chosen, to be balanced or replaced. review: a guess put in so the figure is there, t takes without damage"},{"n":"shock_limit","t":"number","u":"m/s2","d":"m/s2, the hardest jolt it takes while it is carried"}],"s":"common.physical"},{"n":"identity","r":1,"t":"object","c":[{"n":"key","r":1,"t":"string","d":"A record's one key, in the whole registry: <kind>.<name>, lower case, words joined by -, the kind being its schema's. The name may have more dotted parts where a record lives under another (body.treistun.treistun-f). Another record refers to it by this string.","m":{"pattern":"^[a-z][a-z-]*(\\.[a-z0-9][a-z0-9-]*)+$"},"s":"common.key"},{"n":"name","r":1,"t":"string"},{"n":"description","t":"string"}]},{"n":"kind","r":1,"d":"What sort of joint it is.","e":["flange","lined-flange","chute","belt-transfer","termination","bus-joint","hood","clamp-coupling","quick-coupling","union","plug-socket","collector","cable-reel","valve","expansion-joint","twistlock","strut-clamp","run-clip","support-shoe"]},{"n":"size","r":1,"t":"number","u":"m","d":"Its nominal size: a pipe's or duct's nominal bore (the steel's, for a lined duct), a chute's bore, a belt's width. For a termination, the conductor's cross-section in m2.","m":{"exclusiveMinimum":0}},{"n":"rating","t":"object","d":"What it holds at most.","c":[{"n":"pressure","t":"number","u":"Pa","d":"Pa across it, inside to outside (on airless ground the whole of the inside's pressure)","m":{"minimum":0}},{"n":"temperature","t":"number","u":"K","d":"K at its faces","m":{"minimum":0}},{"n":"voltage","t":"number","u":"V","d":"V between phases","m":{"minimum":0}},{"n":"current","t":"number","u":"A","d":"A per phase (a bus joint: per pole)","m":{"minimum":0}},{"n":"rate","t":"number","u":"kg/s","d":"kg/s of bulk it passes","m":{"minimum":0}},{"n":"force","t":"number","u":"N","d":"N it holds (a container lock)","m":{"minimum":0}},{"n":"tension","t":"number","u":"N","d":"A load joint: N pulled apart, square to the strut","m":{"minimum":0}},{"n":"compression","t":"number","u":"N","d":"A load joint: N pressed together","m":{"minimum":0}},{"n":"shear","t":"number","u":"N","d":"A load joint: N across, slipping along or round the strut","m":{"minimum":0}}]},{"n":"stiffness","t":"object","d":"A load joint's springs, which the load-sharing model uses for this product (overriding its interface's).","c":[{"n":"axial","t":"number","u":"N/m","m":{"exclusiveMinimum":0}},{"n":"shear","t":"number","u":"N/m","m":{"exclusiveMinimum":0}}]},{"n":"sealing","d":"single: one gasket; double: two seals with the space between them watched for leaks (hydrogen, or any line to vacuum where a leak is lost for good); open: no seal (a belt's transfer).","e":["single","double","open"]},{"n":"built_of","r":1,"t":"array","c":[{"n":"[ ]","t":"object","c":[{"n":"what","r":1,"t":"string"},{"n":"item","r":1,"t":"string","x":["material","stock","good"]},{"n":"mass","r":1,"t":"number","u":"kg","m":{"exclusiveMinimum":0}},{"n":"note","t":"string"}]}]},{"n":"triangle_budget","t":"integer","d":"Triangles its model may have, where the kind's default (12,000) is too few: a joint of many tubes and bolts.","m":{"minimum":1000}},{"n":"valve","d":"A valve's type.","e":["ball","butterfly","gate","check","relief"]},{"n":"movement","t":"number","u":"m","d":"m an expansion joint takes each way along its line","m":{"minimum":0}},{"n":"interface","t":"string","d":"The interface it is built to (SFO 26): it fits any port built to the same, its rating covering the port's duty.","x":["interface"]},{"n":"ports","t":"array","d":"Explicit mating faces of a multi-port connector instance. Each face takes one link; optional seats may be unused. Count the connector mass once, not once per link.","c":[{"n":"[ ]","t":"object","d":"Where something goes in or out of a made thing (SFO 25, 26): built to an interface, one half of it, with the duty it needs; a product of that interface rated for the duty fits. The game draws the joint at the port.","c":[{"n":"id","r":1,"t":"string","d":"Its name on the thing, unique there (gas-in, water-out, hv, base)."},{"n":"flow","r":1,"d":"Which way what it carries goes at full rate: in, out, or both (a power port feeding and fed). For a load port: out, the thing's weight going down into what bears it.","e":["in","out","both"]},{"n":"medium","r":1,"d":"What crosses it: gas, liquid or bulk solids; power; signal (control and data); heat (by a heat pipe or a contact); load (weight and working forces into what bears it); carrier (a batch on a car, a crane's hook, a container's lock); people (an airlock, a docking ring).","e":["gas","liquid","bulk","power","signal","heat","load","carrier","people"]},{"n":"interface","r":1,"t":"string","d":"The interface it is built to (SFO 26), by key: its mating face and the envelope a product built to it must meet.","x":["interface"]},{"n":"half","d":"Which half of the interface the thing itself carries; the joining product brings the other (androgynous: both halves are the same).","e":["male","female","androgynous"]},{"n":"make","d":"How the joint is made and broken here: welded once; bolted; by hand (a plug, a quick coupling, a crew's work, a game action); automatically (a clamp, a docking ring, a coupler); open (nothing mates: a belt's head over a hopper, a hood over an outlet).","e":["permanent","bolted","manual","automatic","open"]},{"n":"connector","t":"string","d":"The connection product the registry's own layouts join it with, by key; any other product built to the same interface and rated for the duty fits as well.","x":["connector"]},{"n":"item","t":"string","d":"What it carries, by key; none for power, signal or load.","x":["material","stock","good","package"]},{"n":"rate","t":"number","u":"kg/s","d":"kg/s at the thing's rating: the duty a product must carry","m":{"minimum":0}},{"n":"power","t":"number","u":"W","d":"W through it at the thing's rating (power or heat)","m":{"minimum":0}},{"n":"pressure","t":"number","u":"Pa","d":"Pa inside it in service","m":{"minimum":0}},{"n":"temperature","t":"number","u":"K","d":"K of what it carries","m":{"minimum":0}},{"n":"voltage","t":"number","u":"V","d":"V between phases (a power port)","m":{"minimum":0}},{"n":"current","t":"number","u":"A","d":"A a phase through it at the thing's rating","m":{"minimum":0}},{"n":"mass","t":"number","u":"kg","d":"A load port: kg it bears down through it, the thing and what it holds (its weight is this times the site's gravity). A carrier port: kg a batch weighs.","m":{"minimum":0}},{"n":"force","t":"number","u":"N","d":"A load port: N of working force on top of its weight, at its worst (a crane wheel's reaction, a tilt, a thrust)","m":{"minimum":0}},{"n":"moment","t":"number","u":"N m","d":"A load port: N m of working moment at its worst","m":{"minimum":0}},{"n":"cycle","t":"number","u":"s","d":"A carrier port: s between batches","m":{"exclusiveMinimum":0}},{"n":"moves_with","t":"string","d":"The id of the thing's motion this port moves with (a tilting furnace's outlet): its joint must let it move."},{"n":"at","r":1,"t":"array of number","u":"m","d":"Its face's middle in the thing's frame (x along, y across from its middle, z up from its base).","m":{"minItems":3,"maxItems":3}},{"n":"facing","r":1,"t":"array of number","u":"1","d":"The way out of its face, a unit vector in the thing's frame: a run leaves it this way.","m":{"minItems":3,"maxItems":3}},{"n":"optional","t":"boolean","d":"A spare, blinded when nothing joins it."},{"n":"key","t":"string","d":"The keying its half is cut to, one of its interface's `keys`: halves mate only at the same key (an HV DC pole keyed plus cannot meet one keyed minus)."},{"n":"channel","t":"string","d":"The circuit it belongs to, so a wire may only join ports of the same channel: a power bus by its kind and voltage (dc-28v, dc-270v, dc-3kv, ac-400v), a data link by its protocol and name (can-a, ethernet-1). A DC feed of two single-pole receptacles is two ports of one channel, plus and minus."},{"n":"pins","t":"array","d":"What each contact of its interface carries (the interface's conta
