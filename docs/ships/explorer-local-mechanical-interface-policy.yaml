execution:
- Apply exact named receiver policy only. An aluminium object touched by a steel head is not permission to cut every
  steel overlap on that object. New/unclassified pairs are explicit exceptions.
- Build one representative cover seat, rear hinge pressure recess and gear ankle before replication; preserve before/after
  geometry, coordinates and real contact/gap ownership. Then freeze full edit map and new stock quantities.
- At triple and higher intersections partition the local joint together, including floor/skin and actual new parts.
  Never sum pair overlap volumes to derive removed mass.
- Separate modeled physical material from hidden reserve. Newly modeled hardware replaces the specifically allocated
  reserve amount; do not add both silently or zero an unrelated reserve. Retain unmodeled hardware assumptions explicitly.
- Replay all static material unions and the actual motion/crew-route/ground-contact cases, check positive material
  topology and retained cavity voids. Publish whole candidate mass only after all remaining families and actual
  additions/retirements are reconciled.
limits: Prototype material/geometry choices under owner finish authority, not pressure/structural/bearing/mission
  qualification; no need await those ratings to build/count real parts.
