policies:
  cover_head_seat:
    match: captive fixing or quarter-turn on its own named cover/receiver only
    choice: Preserve steel head and authored outer top. Cut a bounded shallow head seat in the matched aluminium
      cover to the actual head intrusion, with a small measured assembly clearance. Retain a positive backing ligament
      and driver access. No through-hole into a named pressure skin; a cover seat cannot authorize pressure-skin
      removal.
    quantity: Count preserved head steel once; subtract actual aluminium seat only once from the receiver union.
      Hidden shank/thread/nut hardware stays a separately identified mass assumption in the existing reserve until
      actual geometry/stock replaces that reserve. Do not assert a fastened load path from head-only geometry.
    exception: If shallow seat would perforate the cover or consume its support, raise that head locally or add
      a supported seat boss with new stock/volume; do not delete the cover web.
  rear_journal_pressure_recess:
    match: Rear closure fixed journal +/-1 versus Core pressure skin 06-7 and reconstructed Crew access floor |
      round opening
    choice: 'Keep the measured hinge axis and steel journals. Design two stationary sealed inboard blisters/recesses
      around the journals: each journal remains on the exterior/dry side of the new pressure boundary, with a closed
      aluminium back/top and sides continuously joined to the actual surrounding skin. This explicitly replaces
      the intersected local skin patch; no rotating shaft pressure seal or open bored skin is chosen.'
    prototype_stock: 3 mm 6061 formed/welded pocket walls and closed cap from stock.al6061-sh-3, shaped from actual
      journal and pin swept envelope with a 2 mm geometric assembly gap as a draft target; no pressure or load rating.
      Actual bearing-support bracket remains mechanically separate from the thin pressure pocket.
    floor: Create matching bounded local floor reliefs around the fixed pockets, with supported covers/edge transitions
      and recorded raised local profile; do not cut the entire rear floor. Keep the central boarding route clear
      and re-measure feet support, trip/step and headroom. If the cover makes the route fail, revise the local journal
      support/pocket position before adoption.
    motion: Check journal, pin, leaf and new pocket over the full two-leaf sequence, not just closed pose. Rear
      ramp leaf receives a local hinge relief and real attached lug/knuckle around the pin; maintain door perimeter
      sealing continuously outside the hinge pocket. A relief that opens the door seal needs a rebuilt seal path,
      not a collision waiver.
    retirement: Retire exact old skin/floor patch material once in the edit map, add every pocket/cap/support and
      seal quantity. No whole-skin retirement or double subtraction at floor/skin/journal triples.
  gear_ankle_socket:
    match: Three LandingLeg180_slider objects versus clipped trapezoid pads and six ankle ribs
    choice: Preserve titanium slider geometry and exterior sole/pad footprint. Form an aluminium blind socket in
      each pad at its measured slider end and cope the ribs to the actual titanium side surface. Retain a positive
      blind bottom ligament and real bearing shoulder. Treat the foot assembly as mechanically clamped to the slider
      end, not overlapping welded Ti/Al.
    prototype_joint: Add a split 6061 collar tied into both ankle ribs with two separated nominal M6 steel through-fastener
      stations and captive nuts accessible from the sides. Raw 6061 and stock.st4340-fg are draft custom parts.
      Place holes outside the titanium slider; do not drill/thin the hollow slider. Recess/raise the collar if necessary
      to keep the pad sole/ground area unchanged. Count actual clamp and fastener solids separately.
    gap: Use 0.25 mm radial slip-fit clearance as a draft geometric target where no bearing contact is intended;
      identify the actual shoulder/contact surface separately. This is not a manufacturing fit, preload or load
      rating.
    motion: Confirm pad/rib/collar/slider co-move with fixed local relation across folding and compression. If slider
      actually slides relative to these parts, stop treating this as a fixed clamp and rebuild the correct articulated
      foot joint. No sweep subtraction of the titanium travel envelope into a vanished pad.
  PTFE_slide_shoe:
    match: Four crew hatch slide shoes versus corresponding carrier ears
    choice: Preserve finite PTFE shoe thickness and bearing face. Cut a bounded shoulder/dovetail seat in the aluminium
      carrier, retain positive backing and end stop or removable retaining tab; expose actual sliding face. No all-volume
      PTFE subtraction or unretained loose insert. Recheck hatch travel and count retaining hardware.
  EPDM_foot_cap:
    match: Crew ladder foot caps or gear soles versus their aluminium backing
    choice: Preserve ground-contact sole/foot-cap exterior and finite rubber thickness. Recess the aluminium receiver
      locally to support the cap interior, with positive backing and a real lip/retaining strip; count strip/hardware.
      Do not reduce pad area or bury all rubber in metal. No traction or compressive rating.
  pivot_bores:
    match: Rear ramp pivot pins, ladder fold pins and folding hinge output shafts versus named metal leaf/rail/cheek
      receivers
    choice: Keep steel pins/shafts. Bore matching coaxial aluminium receivers and build finite supported knuckles/bearing
      lands and axial retaining shoulders. Draft 0.25 mm radial running clearance for rotating receivers; fixed
      mounting contact is labelled separately. Preserve continuous useful receiver webs, add a counted local boss
      if needed, never cut away an entire thin rail. No inferred bearing life/load rating.
  latch_seat:
    match: Crew hatch quarter turn +/-1 versus its named latch recess
    choice: Make the shallow actual latch-body seat and a supported back receiver/catch. Keep continuous hatch seal
      and non-pierced boundary behind it, with actual operating/tool path; no pressure-boundary through-cut from
      a quarter-turn visual marker.
