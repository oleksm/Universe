status: Selected ground-stage hull volume domain; measured current V3 value, refresh after final edits
domain: Gross closed/rest convex clearance-envelope volume of every installed bare hull vertex, including static
  edited gear and appendages in the exact exported rest pose. A deliberately conservative stowage approximation,
  not actual exterior displacement.
why: The physical field describes how much room the product takes, separately from its material constituents. A
  measured 3Dconvex envelope is usable for this uncommissioned ground stage without claiming enclosed cabin/pressure
  topology; it avoids equating a hollow vehicle to a few cubic metres of metal or blindly multiplying its box dimensions.
measurement: Transform every mesh primitive POSITION vertex through the exact closed scene hierarchy; compute the3Dconvex
  hull in metres and its positive volume. Preserve the source geometry; this envelope is measurement-only and never
  replaces the collision/render mesh. Record source/model/algorithm/input count and pose, compare a centred tetrahedral
  sum, and retain AABB only as an upper bound.
