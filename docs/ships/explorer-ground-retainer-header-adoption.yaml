header_choice:
  choice: Select the supported offset closure, retaining two existing ramp nodes, hinges, toe and walking face.
    Reject the plain extended leaf because it collides with folding tread/ribs; do not cut that tread or introduce
    an extra closure motion to hide the clash.
  geometry: 12mm6061plate at leaflocalX+50..62mm with actual12mmnormal-stock transition below upper-extension startZ1.69,
    per frozen polygon in bound design. Retain full positive connection to original leaf. The~62mmrear profile change
    is explicit local construction, not silent exterior preservation.
  fixed_carrier: Back the matching fixed seal face with a closed structural channel spanning the actual~68mmoffset:3mm6061walls,6mmfrontface
    and finite attachment land onto the actual header. Do not count a floating6mmface as a supported bridge. Exact
    side/rear views inspected; whole appearance/strength not approved.
  seal: Reuse chosen12mmwide silicone upper strip,2mmfree thickness,1.6mmclosed thickness (20%prototype compression).
    Provide20mmcarrier land where geometry permits,4mmedge margins, actual leaf contact and hard closing stops outside
    gasket. Match the actual offset leaf plane; oldX4.9364 coordinates do not apply after offset. Explicitly retain
    free/installed material amount and model closed shape as compressed, not a claim of changed density/material
    capacity.
  joining: Join supported carrier continuously to named fixed header with finite weld/support geometry and bounded
    material union. Leaf transition is a connected stock/weld construction; name actual joint, retain plate thickness
    and build any stop/latch attachments required for compression. Neither gasket nor visual overlap substitutes
    for structural closure.
  quantity: Eight rawdelta meshes checked positive/indexedclosed, volumes match report;6replacements+2additions,
    preserve2negative oriented header cavity shells. New3mmroof/cover facets and12mmleaf transition are explicit
    local new stock design, not mass-only thinning. Same-material frame/skin/carrier contact unions count once;
    no summed gross delta promoted.
  checks: Run actual83leaf/55fold pose sets against the new closure, carrier, seal, support and rear frame; refresh
    native rear board/exit and measured head gap on final combined export. Side/lower historical gaps are separate
    unresolved perimeter issues, so upper contact alone is not a cabin pressure seal.
