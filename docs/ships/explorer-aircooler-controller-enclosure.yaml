status: Chosen prototype controller enclosure, mount and heat path for the air cooler S0; not product release or rating
source_task: 20261024T140016-blender-261b
finding: The air cooler has a motor case, fan, exchanger and rear shroud cap but no controller enclosure. The board
  (docs/ships/explorer-aircooler-internal-termination-choice.yaml, 100x80x30 mm, about 20 W) needs a new case of its
  own; the shroud is not relabelled as one.
enclosure:
  material: material.aluminium-alloy-6061 (T6), anodised
  wall_m: 0.002
  construction: Folded 6061 tray with TIG-welded corners, the connector end plate (shell 25 power, two shell 11 CAN)
    on the face nearest the harness route
  size: Board reservation (worker's trial X 0.175..0.205, Y 0.026..0.106, Z 0.040..0.140) plus the 60 mm wire zone at
    the connector end, 3 mm clearance all round, plus walls. Author measures and reports the outer envelope.
heat_path:
  why: Airless use - no convection; the only sink is conduction
  sink: The exchanger's 6061 header frame, which the coolant loop holds at 273..363 K
  heat_wall: The enclosure wall facing the header, bolted flat to a machined 6061 pad on the header frame through a
    0.5 mm thermal gap pad (about 3 W/m K, invented/review)
  check: 20 W across 100x80 mm of pad is about 0.021 K/W, 0.4 K rise; the board's power devices sit on this wall on
    insulating pads
  not_the_lid: The heat wall is never the lid
mount:
  fasteners: Four M4 A2 stainless through the heat wall into threaded inserts in the header pad, at the corners of the
    100x80 face; the same bolts carry the enclosure (under 1 kg) and press the gap pad
  load_check: Under 1 kg at 20 m/s2 is under 20 N - nominal for four M4
lid:
  face: Opposite the heat wall
  construction: As docs/ships/explorer-coolant-controller-case-construction.yaml - 2 mm 6061 lid on a 1.5 mm backing
    flange, 1 mm conductive silicone (2000 kg/m3), captive M3 at no more than 60 mm along the gasket centreline,
    compression stops
heat_path_revision:
  source_task: 20261024T140321-blender-0dff
  finding: The first trial case sits 103.5 mm from the header front (Y -0.0825); the header front face is only 18 mm
    wide (X) x 279 mm (Z), its side face 70 mm (Y) x 279 mm (Z). No 100x80 wall touches it.
  choice: Reseat the case so its heat wall lies flat on the header SIDE face, board 100 mm along Z, the 80 mm board
    width along Y with at most 10 mm overhang past the 70 mm face. Contact at least 70x100 mm through the 0.5 mm gap pad,
    about 0.024 K/W, 0.5 K at 20 W. Bolts and inserts as above, in the header side face.
  rejected: A bridging bracket over the 103.5 mm gap - 6061 at 80x10 mm section is about 0.82 K/W (16 K at 20 W), at
    40x5 mm about 3.1 K/W (62 K); too hot against a 363 K loop.
  connector_panel: The case end face grows to carry the whole connector panel; the panel is not trimmed.
  if_no_room: Report the free space on and around the side face; registry then revises the board shape (e.g. two
    boards stacked), never a floating or strap-only thermal attachment.
remote_controller:
  source_task: 20261024T163519-blender-ebb3
  packet: /home/alexm/git/blender/ships/explorer-study/crew-hatch-01/functional-current/flight-fit-current-study/air-cooler-electrical-v2/header-side-enclosure-survey.json
  finding: On the header side the gap is 15 mm against the 40.5 mm the case needs; the board could be at most 4.5 mm
    deep with walls unchanged. No room - the no-room clause applies.
  choice: The controller leaves the air cooler. It becomes a separate box on one of the coolant loop's cold plates
    (CLP0-02 lines and cold plates kit), which is the conduction sink the airless site needs.
  box: Same construction as above (2 mm 6061-T6 welded tray, lid opposite the heat wall, coolant-lid gasket rules);
    board 100x80x30 mm with the 60 mm wire zone; the heat wall bolted to the cold plate through the 0.5 mm gap pad
    with four M4.
  place: Within 1.0 m of harness from the cooler's motor, on a cold plate the loop already serves; Ships picks the plate
    and pose, Blender draws it.
  wiring: Ship harness (shell 25, 3x6 mm2) ends at the controller box. Controller to motor - 3 x run.wire-6mm2 phase
    leads (about 12 A rms each at 400 W) and 4 x run.wire-0p5mm2 for sensors, in one sleeve, through a shell 25
    (power) and a shell 11 (sensors) on each end.
  motor_out_pins:                # source_task 20261024T164039-blender-6229; supersedes the wiring line above for the motor lead
    connector: shell 25, box half female (source), motor lead/cooler half male (load)
    A: phase U
    B: phase V
    C: phase W
    D: protective earth - motor case bond, 6 mm2 like the phases, its pin 1.0 mm proud (first make, last break)
    wires: 4 x run.wire-6mm2
  sensor_pins:
    connector: shell 11, box half female, cooler half male; not CAN
    '1': hall supply +5 V
    '2': sensor return 0 V (also the thermistor's return)
    '3': hall A
    '4': hall B
    '5': hall C
    '6': motor winding thermistor
    '7': screen drain (bonded at the box end only)
    wires: 7 x run.wire-0p5mm2 (was 4), hall lines and supply twisted with the return
  no_cross_mating: On the box the ship-in shell 25 is male (the box is the ship's load) and the motor-out shell 25 is
    female (the box is the motor's source), so the two shell 25 plugs cannot be swapped
  invented/review: true
  cooler_side: The air cooler keeps only its motor terminals and a small terminal cover; its retained panel takes
    the two receptacles from the controller, not the ship harness.
  invented/review: true
remaining:
- Measured packing of board, wire zone and enclosure against the motor case, fan, exchanger and shroud
- Header pad and insert placement on the drawn exchanger
- Thermal, EMC and vibration qualification
