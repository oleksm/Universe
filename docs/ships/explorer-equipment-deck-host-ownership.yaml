chosen_holder_host_route:
  route: Use these real deck surfaces as the local supported seating/interface planes for ordinary equipment carriers.
    Choose separate8mm6061load-spreader plates (stock.al6061-pl-8), backed by actual new ribs/pedestals/outriggers
    tied to named current FRAME members. Equipment toe clamps/bolts follow measured holder inputs2acc27150. No load
    capacity inferred from the floor mass or thickness.
  loadpath: For main-floor boxes, locate real load-spreader and backing/rib contacts that reach an actual nearby
    FRAME lowerrail/crossbar. For shoulder-deck boxes, design an explicit outrigger/cross-support back to actual
    FRAME rails/portal crossbars; do not treat the raised wedge deck alone as a qualified cantilever. All support
    members, joints, fasteners and local machining are additional owned parts with current measured quantity.
  frame_targets: Candidate current names include FRAME lowerrail_-1_forward/aft and mirrored1members, portal lower
    crossbars and actual transfer crossbar, subject to measured proximity/clearance in the current candidate. A
    name is a target to locate, not a guaranteed mount face or rated anchor.
  host_geometry: 'Use the actual remaining deck solid, including service apertures and pending hatch cassette/floor-bridge
    edits. Keep walking top/crew/service paths. Never shrink deck volume to a nominal5mmplate target: material schedule
    retains as-drawn actual solid.'
  attachment: Prefer real backed metal seating with an explicit welded/bolted supported connection and visible removal/tool
    route. Pressurepan/servicepanel lids, thin cosmetic gear roofs and loose liners are not substitutes for FRAME
    support. No blanket body intersection or tangency counts as a joint.
  cuts: No automatic new floor/skin holes or pressure seals authorized. If a loadpath needs a through-deck/skin
    penetration, name and draw a bounded host replacement with its pressure/crew ownership before cutting. Support
    below/alongside deck must fit without punching the cassette/pans, gear motion or a removable panel/tool route.
  module_scope: New carriers/supports are hull-owned fabrication under owner authorization, not interior furniture
    or a newly registered equipment product. Command remains deferred; using a real module later does not authorize
    installing it now.
