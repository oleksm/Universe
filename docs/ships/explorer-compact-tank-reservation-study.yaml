acceptance_limits:
- Use nonexported primitive reservations only; do not resize/relabel existing product or model a production tank
  from this arithmetic.
- Check hull containment and intersections in both end poses, all existing equipment/crew/sweep reservations and
  compartment access; failed witness refines or rejects trial.
- A zero-hit primitive does not establish a usable bay or production tank fit. Report boundary, access and crew/motion
  conflicts separately.
- Actual LOX/LH2 split, ullage, common bulkhead, thermal separation, pressure/stock/mass, compact cradle and two-circuit
  service layout remain to be designed.
- Neither100 nor200kg is selected as the mission fuel requirement; full mass/mission/routing still open.
- Do not cut, inflate hull, use crew access space, hide inherited geometry, or publish fit by this study. Escalate
  conflict through existing shape/module allocation workflow.
