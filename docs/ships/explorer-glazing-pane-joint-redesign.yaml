chosen_scope:
  construction: Rebuild the fifteen-pane glazing family as a non-overlapping set of individually retained faceted
    panes. Author common junction lines and fixed mullions first; derive neighboring pane edges and their seats
    from that shared network. Do not keep conflicting solids then subtract them by object iteration order.
  appearance: Preserve cockpit exterior facet planes, front windshield pair, centre divider, roof/header transition
    and triangular side-light pattern. Keep current hull/neck/crew reservations. Edge setbacks and local carrier
    changes are explicit design edits, not an appearance acceptance. No wholesale canopy shrink or changed crown
    to hide conflicts.
  front_roof_junction: The two Visor | windshield objects own the paired forward windshield openings below the visible
    header. Cockpit glazing 03-3 pane 0 must end at the canopy side of that header, rather than continuing into
    the windshield openings. Rebuild its adjacent 03-2/03-4 edge lines on the actual facet/header junction. If its
    source solid covers several visible facets, split it into named replacement panes at those facets rather than
    retaining a thick cross-facet volume.
  side_junctions: For each remaining pair, use the existing visible mullion/facet junction as the shared edge datum;
    where no visible mullion exists, author a symmetric local butt-joint datum halfway across the measured overlap
    strip on the exterior surface. Record the chosen line and both pane owners. Triple corners are one joint design,
    not successive pairwise cuts.
  glass: Keep original non-joint exterior facet locations and measured local thickness away from redesigned edges.
    Rebuild bounded solids from those faces, with explicit edge cuts/chamfers and new edge faces. No density reduction,
    arbitrary thin shell, global glass union, or hidden retirement of either windshield. Keep fifteen source identities
    in the edit map even if replacement pane count changes.
  clearance: Choose 3 mm minimum edge-to-edge assembly clearance at adjacent glass edges as a draft geometric target,
    not a thermal/pressure qualification. At mullions the actual glass separation may be larger to accommodate the
    fixed web and both seal seats; do not force a 3 mm gap through required hardware. Measure final local gap and
    report exceptions.
  retention: Retain the previous 6061 carrier, removable bead and silicone construction family. Use one shared fixed
    mullion at a shared seam, with separate pane seats and continuous finite seals on each side. Draw real corner
    blocks and end supports; keep screws outside glass and seal land. Widen local carrier outward where needed for
    the 4.5 mm bore plus positive edge ligament, not merely enough for its centre point. Resolve all five support
    failures and ten absent patterns against the new joint network.
  work_order: Build the highest-overlap 03-3/03-2/03-4 and front-header junction as a representative complete joint
    first, including adjoining visor edges, seal, bead and support. Replay overlap/contact checks before propagating
    to the full family. Then reconstruct all affected edges and re-fit all carriers; do not continue detailing the
    known failed immutable-pane prototype.
  ownership: Blender owns exact joint coordinates and reversible geometry, within this scope; report coordinates
    and before/after witnesses. A lost visible window, changed hull profile or a required crew-envelope intrusion
    is a design exception to surface explicitly, not an automatic trim.
