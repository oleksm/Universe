decision:
  tank: Keep unchanged equipment.tank.hydrolox.0p5t and exact model SHA. Single centreline roof candidate as owner
    requested; capacity/mission/fit not selected.
  cradle: Develop a separate hull-owned roof cradle against actual four tank saddles/eight bore sites and real named
    hull frames. Treat as owned structure/parts, outside the existing952-object schedule until its own roster/material/mass
    exists.
  identity: Reserve design identity explorer-study.roof-tank-cradle in this ledger only. Do not claim adapter.tank-s1,
    mount.tank-s1 or an insert-M42 mate. Promote to part records after real drawing/stock/mass; a reusable adapter
    product requires a complete independent interface/rating contract.
  generic_record: mount.tank-s1 and the equipment generated M42 feet are geometrically incompatible with this installed
    visual. Nominal class/envelope compatibility is not physical connection evidence. No generic mount bears/attachment
    loads apply to compact feet.
  no_silent_rewrite: Do not patch only generated foot coordinates, declare scale or move the unchanged visual to
    match generic feet. Preserve discrepancy explicitly until a product-specific physical attachment definition
    and generator handling are reviewed together.
  runtime: A future static package/nominal slot draw is not proof of mechanical attachment, fluid connection or
    commissioning. Whole mass and exact source/export remain mandatory for a truthful registered stage.
