    - 0.47122815251350403
    - 0.3969249427318573
    - 0.39693066477775574
    minimum_gap_m: 0.3969249427318573
    maximum_gap_m: 0.47122815251350403
    measured_nearest_objects:
    - Core pressure skin 05-4
    - Core pressure skin 05-2
    - Core pressure skin 06-4
    - Core pressure skin 06-2
    scope: No hull edit. Nearest surfaces and vertical intersections; cannot establish member stock, internal section
      or strength.
    next_design: Replace lower-foot seed with an explicit new load-spreading frame design. Extending decorative
      downstands to nearest pressure skin/cover does not establish a load path. Separate reversible study before
      current hull edits; choose actual frame stock/joints and physical attachment endpoints.
