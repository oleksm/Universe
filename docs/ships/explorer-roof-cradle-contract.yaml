service_contract:
  circuits: H2 and O2 remain independent; each retains outlet, fill/drain, pressurant, vent, relief and gauge. No
    geometric marker is proof of compatible coupling or connected line.
  port_definition_needed:
  - medium and liquid/gas phase for operating state
  - connector standard/nominal bore and mating half/seal material
  - operating/design pressure and temperature ranges
  - allowed mass flow, pressure drop and direction
  - valve/isolation state, pressure sensing and relief setpoint/capacity
  - actual approach/removal vector and hose/pipe bend/support envelope
  pressure_evidence: Tank basis describes provisional0.35MPa shell sizing; not a rated service-port pressure or
    relief setpoint. Engine coolant7MPa is not tank delivery pressure. Preserve these distinctions.
  feed: Separate H2/O2 feeds with defined isolation/filtering and fuel-cell branches. Native combined hydrolox fuel
    pool cannot establish real mixture/feed compatibility, priming/settling, pump inlet conditions or boiloff handling.
  vent: Independent vent and relief paths to separately assessed exterior destinations. Do not join H2 and O2 or
    terminate in crew exits, ladder, radiator/antenna or engine plume envelopes. Size from defined pressure/fill/thermal
    cases, not thrust alone.
  geometry: Both capped faces remain accessible for actual selected connectors/tools/lines; screen added cradle
    and rack, approach/service/removal, engine/radiator interaction and crew escape through relevant states. Current
    tank-only17pose zero-hit screen does not cover these.
  mass: Allocate service hardware/runs/fluids and cradle separately;115kg tank tare already includes its fittings
    allocation. New external manifold/lines/controls are not free and not counted twice.
  delivery_requirements:
    one_engine25kn_full_hydrolox_kg_s: 5.681818181818182
    one_pair50kn_full_h2_kg_s: 1.7482517482517481
    one_pair50kn_full_lox_kg_s: 9.615384615384615
    four100kn_full_h2_kg_s: 3.4965034965034962
    four100kn_full_lox_kg_s: 19.23076923076923
    fuelcell_additional_nominal_hydrolox_kg_h: 2.1297902097902095
    scope: Consumer demand screens, not tank deliverable flow. Fuelcell physical O/F/feed and startup/transient/pressure-drop/inlet
      NPSH data missing. No arbitrary velocity/bore-pressure calculation accepted.
    pressure_temperature_status: 0.35MPa provisional shell sizing is neither service rating nor relief setpoint;
      7MPa engine coolant is not tank feed pressure; no actual delivery pressure/temp bands found.
    mating_half_status: Capped hollow necks, no maintained thread, flange, bayonet, male/female/seal seat contract.
      Half UNKNOWN; marker/cap is not a qualified connector.
  vent_relief_design_cases:
  - case: Nominal parked and powered operation
    inputs: External radiation/conduction, solar/ground/radiator/engine flux, insulation condition, liquid state/ullage
      and pressurant schedule; independent boiloff of each circuit.
  - case: Fill/drain/chilldown and warm restart
    inputs: Supply conditions, displacement gas, chilldown heat load, fill limits, two-phase pressure losses and
      safe purge/vent sequencing.
  - case: Pressurant regulator fail-open / trapped liquid
    inputs: Upstream source maximum pressure/flow, isolation failures, blocked-in warmed liquid expansion and circuit
      relief coverage.
  - case: Abnormal heat / insulation degradation
    inputs: Defined credible exposure/vacuum loss/blanket damage or fire if atmosphere selected; heat transfer,
      fluid properties and pressure boundaries. No fire mission assumed.
  - case: Discharge backpressure / attitude / blocked destination
    inputs: Outlet backpressure, route losses, two-phase/choked flow, thrust/landing attitude, drain/trap/ice exposure
      and isolated path failures. Keep H2/O2 separated.
  vent_sizing_status: No relief setpoints, certified valve flow coefficients, discharge pressure/temp, heat input/enthalpy
    or failure envelope. Cannot derive vent capacity or required bore from thrust demand. Setpoints must coordinate
    supported pressure limits, accumulation and backpressure; no guessed values.
