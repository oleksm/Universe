joint_contract:
  upper: Eight upper washer-bearing axes/faces are recorded as observations; underside mating plane sourceZ4.25
    still needs contact/fastener seating review. Each saddle has two bored foot sites. Cradle upper faces must name
    matching faces without gaps/penetrations; retain tank saddle mass in115kg tare.
  lower: Each foot names actual hull member mesh/part, contact frame/face, stock section and continuous path into
    hull structure. Proposed X3.0211/3.5789,Y+/-1.65,Z3.15 are seeds only; do not create fake sockets at them.
  parts: Cradle beams, braces, pads, downstands, fasteners, thermal isolators and service brackets need separate
    named solids, stock/material, cut size, mass/COM and joined endpoints. Roof skin, trim and tank insulation are
    not substituted for a frame.
  motion_and_thermal: State which joint fixes each degree of freedom and which provides thermal compliance. Avoid
    silently fixing four cold feet rigidly. No stiffness/friction/preload credited without explicit evidence.
  loads: Use Ships reaction convention and full force/moment load path, tank dry+contents+cradle/services and thermal/dynamic
    cases. Four-way equal sharing is a screening assumption, not a capacity. No mission acceleration/rating selected.
  registry_migration: equipment_ports.py:feet currently derives cradle foot ports from mount sockets and with_feet
    replaces all foot-* entries; mounting.py:sockets regenerates generic sockets. A reviewed explicit physical-interface
    source must be consumed by generator before activating compact foot ports. New mount records currently require
    positive bears and per-point tension/compression/shear; do not fill these with zero/guesses to pass schema.
  lower_measured_result:
    source_sha256: 8fc3a7e3ab384395592c35dde78b59a440830bbdae1f4a7ed59e55c07af8927e
    verdict: FAILED proposed lower feet; no structural attachment found
