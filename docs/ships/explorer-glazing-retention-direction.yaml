chosen_construction:
  fixed_carrier: Continuous6061perimeter ring for each pane, mechanically part of a named fixed backbone/cluster.
    Keep representative12mmwidth/5mmdepth as a seed (stock.al6061-pl-5 or raw6061customsection), then explicitly
    report any geometry change required at neighboring visor corners.
  brackets: Use at least two separated bracket stations from carrier to a genuine spanning backbone material region,
    not the present one-corner tangency. Representative12x6mm section is a raw6061prototype choice; draw actual
    contact/union geometry and quantities. Separated stations are a topology choice, not a strength certificate.
  end_supports: New8mm6061plate end tabs at fore/aft backbone ends land on actual named surrounding frame faces.
    For the port representative, candidate neighbor identities are Visor|faceted surround-1 and Canopy aft frame-1
    (mirror starboard), subject to actual face measurement. If a neighbor is itself replaced, name its new counterpart,
    not a retired ghost. Trim tab contacts around preserved glass/crew envelope; no bbox-centre connection or blanket
    intersection waiver.
  bead: Retain removable3mm6061bead from stock.al6061-sh-3. Increase its outer metal carrier-seat overlap from4mm
    to8mm for the M4geometry seed; widen outward only where actual neighbor/visibility/crew checks permit. Current4mm
    metal seat cannot contain4.5mm clearance bore. Keep full pane retention outline and report seat gap/stock intrusion.
  fasteners: Use hull-owned nominalM4through screws and captive nutplates behind carrier as a new4340forging prototype
    (stock.st4340-fg); no existingM4stock product/interface/grade asserted. Nominal4mmshank/4.5mmclearance bores
    are geometric choices only. Locate each screw wholly outside glass and continuous seal land, with real washer/head/nut
    seats, matched stack-dependent length and cabin-side driver path. No drilled pane or hidden trapped nut. Determine
    actual corner/midspan pattern/count from final geometry, without claiming pressure/load capacity.
  seal: Keep finite joined silicone perimeter, representative8mmwidth/2mmthickness seed from stock.chem-silicone-rubber.
    Conform to actual pane facets and carrier land with an explicit assembly gap; planar projection alone cannot
    establish two-sided contact. Join corners as real positive material; no entire-pane rubber, vanished land or
    inferred compression/rating.
  visor_junctions: Resolve each shared frame corner/visor/sill junction in the combined15pane assembly. Identify
    meeting carrier segments, miter/seat surfaces, retainer access and continuous gasket route. Do not copy a single-pane
    pattern over existing neighbors and treat31source intersections as accepted.
  retirement: Classify source intersections into exact replacement targets versus remaining physical neighbors.
    Retire old seal carriers/frame stock only through full-cluster edit map when new replacements exist. Do not
    remove cavity shells as debris or double-count old and new frame mass. No global material priority.
  prototype_scope: This authorizes reversible geometric construction/quantity work, not pressure/load/fatigue or
    mission acceptance. Do not wait for engineering ratings to count actual prototype parts; do not invent those
    ratings.
