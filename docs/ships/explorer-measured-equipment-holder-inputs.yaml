  supports: Chosen prototype6061 from stock.al6061-pl-5 or stock.al6061-pl-8 as stated; actual ribs/braces/anchors
    sized and counted by Ships, not an assumed loadrating.
  fasteners: Nominal shank sizes are draft geometric choices smaller than observed bores; no grade/proof/preload/insert
    capacity inferred. Use an existing matching stock fastener only after checking its exact dimensions; otherwise
    custom stock.st4340-fg geometry with explicit positive bolts/washers/nuts is a hull-owned prototype, not a new
    catalogue product.
  capture: Every clamp needs a supported underside, finite retaining lip/topland, actual hull-side bolt/nut/anchor
    and accessible removal/tool route; no friction-only loose tray or fixed-skin intersection as attachment.
  thermal: Metal support choice alone does not establish heat flow, electrical bonding or galvanic isolation. Preserve
    service/air/optical faces and explicit rear harness/coolant space.
