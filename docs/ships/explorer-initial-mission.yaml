ships_derivation:
- Separate a bounded software freeflight test from the eventual one-person surface-to-surface trip. Retain the selected
  mission in both accounts; no atmospheric scope.
- Choose and document a provisional low-gravity design case for screening if no body is selected; label it an assumption,
  not owner choice. Report admissible gravity interval from actual mass, thrust/throttle floor, control authority
  and margins; do not infer all moons are flyable.
- Budget ascent, translation, braking, descent, hover if supported, abort and return. Include start/chilldown/unusable
  and fuel-cell demand or explicit unresolved bounds. Check minimum throttle as well as maximum lift; no assumed
  pulse-hover workaround.
- Bound nitrogen control authority at mass/COM/fill extremes; include stop/recovery and retained reserve.
- Derive electrical duty cycle from installed sources/storage and all loads; heat rejection/buffer from actual routing
  and exposure. Gross radiator nameplate is not net cooling.
- Include one-person pressure, oxygen, CO2 removal, thermal and emergency consumables using real equipment capacities.
  Missing life-support or command interfaces remain design inputs; no fabricated endurance.
- Include actual gear, ground contact, stability, exit/boarding state and crew control requirements for surface
  operations. Give concrete design changes where the current allocation cannot meet the mission.
- Publish reproducible quantities, assumptions and limiting budget with a conservative proposed sortie limit and
  explicit reserve policy. If data cannot bound duration, report that numerical duration remains unresolved while
  closing supported sub-budgets.
release_policy: Whole current mass, measured fit, current export/record and demonstrated controls remain required.
  Mission choice does not accept the rejected glazing prototype, unbuilt frame interfaces or old static preview.
