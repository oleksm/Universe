    gear sweep, head/tool/removal geometry and seal flange, not a forced420mm square. If current geometry cannot
    fit, report exact contradiction; do not lower floor or shrink gear/crew.
  replacement: Explicit local old-floor patch retirement and new lid object with edge/join. No overlapping double
    material or unreported floor hole. Preserve route surface continuity and hatch/ladder/ramp function.
riser_pressure_path:
  mechanical: Gear fixed face -> proposed adapter plate/riser -> actual new primary-frame member. Pan is not credited
    as primary tank/gear support.
  static_boundary: Continuous pan-lid-to-collar and collar-to-riser closures. Pressure-exposed hollow riser must
    terminate at a genuinely closed, nonpierced base/contact cap; audit connected tube bores, weld seams and every
    fastener hole.
  bolts: V5gear bolt holes/tool access outside sealed riser core are not automatically cabin leaks if wholly in
    exterior well; prove their volumes remain outside boundary. If a bolt crosses the pressure surface, design a
    sealed boss/joint explicitly.
  relative_motion: Gear retraction stays exterior. Lid/riser/frame remain static in nominal state; thermal/structural
    deflection and seam strain still need analysis. No dynamic sealing or pressure/landing load transfer inferred.
sidewall_and_hull_seams:
  must_measure:
  - Full swept gear/cover/head/adapter/tool envelopes in all relevant poses
  - Closed lid perimeter and accessible retaining/join faces
  - Each sidewall bottom/edge landing on actual identified hull pressure skin, including surface normals/area and
    corner transitions
  - Every opening to exterior/cabin, neighboring gearwell/compartment/hatch interface and intended vent/drain
  - Disassembly/bolt insertion and lid removal sequence without trapped hardware
  prohibited:
  - Using nearest walkingfloor or cosmetic cover as pressure skin
  - Blindly extending walls into belly geometry and declaring weld contact
  - Blanket waiver of all skin/gear intersections
  - Silently moving gear, changing floor height or filling access route to close pan
  if_no_skin_seam: Keep boundary OPEN; design a new connected belly/keel pressure patch or revise well/adapter topology
    in separate study, with exact additional parts/stock/mass. Do not declare whole cabin sealed.
