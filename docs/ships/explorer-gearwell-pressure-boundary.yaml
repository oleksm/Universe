decision:
  topology: Each gear well is exterior-vented and excluded from pressurized cabin. A NEW fixed pressure pan (lid
    plus surrounding sidewalls and sealed structural-riser penetration) separates cabin from well. Gear travel does
    not require a sliding pressure seal on the moving leg.
  ownership:
    cabin_boundary: New hull-owned static pan, identified collar/cap, sidewall seams to actual named pressure-skin
      faces.
    outside_boundary: Moving leg, fixed gear assembly/25mm top plate, tool/nut region and cosmetic compact gear
      cover. None is pressure boundary merely by name.
    walking_floor: Existing walkfloor is access/walk geometry. Replace a local patch in the derived study with a
      NEW pressure-owned lid at unchanged top elevation; do not relabel the old floor as qualified pressure structure.
    gear_cover: Retain removable cosmetic/access cover as nonpressure component; vents/drains to exterior deliberately
      designed, no claim from currently open geometry.
  materials:
    lid:
      material: material.aluminium-alloy-6061
      stock: stock.al6061-pl-8
      density_kg_m3: 2700
      thickness_m: 0.008
      basis: New prototype geometry/mass choice, invented/review true. No unsupported plate-span/pressure allowable.
    sidewalls:
      material: material.aluminium-alloy-6061
      stock: stock.al6061-sh-3
      density_kg_m3: 2700
      thickness_m: 0.003
      basis: New prototype geometry/mass choice, invented/review true. Actual formed shape, seam support, stiffeners
        and pressure duty remain design work.
    collar: 'Static6061formed collar/closed riser base: choose actual shape from measured lid/riser/skin contacts;
      retain mass explicitly, no decorative/sealing proxy.'
