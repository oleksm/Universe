acceptance_work:
- Actual support/service body clearance at full mechanism states and existing geometryreservation on all16nozzles.
- Measured whole mass/COM/inertia and net supports.
- Actual nozzle matrices/shares; signed positive/bounded6DOF authority and per-jet duty/flow, not rank6alone.
- Product-specific gas/feed/thermal/plume limitations, with geometric review separated from physical qualification.
