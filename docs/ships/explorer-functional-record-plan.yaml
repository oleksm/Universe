      length (the gas needs the same time to burn), so 0.126 m across: a 0.297 m cylinder and a 0.07 m cone to the
      throat hold 0.0042 m3 (the modeller measured a straight 0.34 m with S2''s taper at only 1.0 m and lengthened
      it). It does not shrink with the throat. 1.14 m with the bell, about 0.156 m of pump, valves and injector
