    note: 'Flag: 2.2 kg of oxygen at 300 bar is about 6 L of gas; a composite bottle of that size with its regulator
      weighs about 5 to 8 kg, not 45 (from memory). The spare mass would cover the case, plumbing and more lithium
      hydroxide (2.5 kg is near the bare 2.4 kg that 2.2 kg of carbon dioxide needs; packed canisters run about
      half as much again). Not changed.'
  - of:
    - life
    rule: rule.life-ship-system
- key: equipment.command.s1
  source: standards/SFO/metadata/equipment/command-s1.yaml
  source_sha256: eb1ba55796f43bfe1ace1eaebee259d564af883a1fc7f5e72229d17fee467f14
  status: catalogue candidate only; not selected, placed or installed
  slot_kind: command
  size_class: 1
  fits: mount.command-s1
  physical:
    mass: 180
    volume: 1.8
    length: 1.2
    width: 1
    height: 1.5
  function:
    kind: command_station
    persons: 1
    g_rating: 88.3
    facing: thrust
  needs:
    power: 1500
  basis:
  - of:
    - physical
    - needs
    - function
    - size_class
    tier: invented
    review: true
    note: 'One pilot: a seat rated to 9 g eyeballs-in (a fighter''s seat and harness, 40 kg), a console of controls
      (60 kg) and its displays, computers and frame (80 kg); 1.5 kW of displays and computers. An airliner''s flight
      deck seat is about 35 kg. From memory; chosen.'
  - of:
    - fits
    tier: derived
    review: true
    note: 'At its 88.3 m/s2 (9 g) rating the station and its pilot of 100 kg, 280 kg, pull 24.7 kN on its mount:
      about 6.2 kN on each of 4 points, against the 1.65 kN they take. Mounts were set at 3 g (rule.mounts-margin);
      seats need the g they are rated to. As the two-seat station; left for review.'
  - of:
    - needs.power
    tier: derived
    review: true
    note: 'Its 1.5 kW all ends as heat. The life support''s cabin cooler is sized for 500 W a head, a person''s
      137 W and the rest for displays, lights and fans (the open-loop pack''s cooler takes 400 W for two), so the
      computers cannot dump it all into the cabin air: they sit on cold plates on a capped coolant pair at the rear,
      to the ship''s coolant loop, and only about a fifth (the screens'' faces and the fans), 300 W, about 300 W
      a seat, reaches the cabin air. It takes power, data and coolant.'
  - of:
    - physical.mass
    tier: invented
    review: true
    note: 'Modelled (candidate-v02: 3 mm aluminium shells as stand-ins, solid fittings, foam and webbing, a cold
      plate and the rear coolant pair; not engineered) the seat, console and frame are about 141 kg. With the listed
      displays and computers (63 kg) and wiring (18 kg), that is about 222 kg against 180, just inside the mount''s
      225 kg; with its pilot, 28.4 kN on the mount at 9 g (7.1 kN a point). Uncertain; left for review.'
  - of:
    - built_of
    - making
    rule: rule.first-design-parts
  - of:
    - life
    rule: rule.life-ship-system
- key: equipment.gear.strut.s0
  source: standards/SFO/metadata/equipment/gear-strut-s0.yaml
  source_sha256: 30183adf75cba61ec21be99e2162c8f3c84e1b55701b13acb4f3a8c808df0fc1
