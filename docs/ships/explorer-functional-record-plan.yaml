record_plan:
- kind: hull
  key: hull.explorer-study
  path: standards/SFO/metadata/hulls/explorer-study.yaml
  status: not created until required geometry volume and truthful installed allocation are available
  populate_when_supported:
  - physical dimensions from current accepted geometric bounds
  - physical volume with explicit definition and derivation; never substitute summed overlapping mesh volumes
  - whole bare mass from current weighed owned parts or separately justified complete measurement
  - model exact canonical path after formal frame/marker export
  - slots,fit,thrusters from selected real products and matching mounts/markers
  - basis and open_questions; draft, no inferred design ratings
  exclusions:
  - No old production-v01 mass
  - No guessed density from paint names
  - No stock_fit or guessed nozzle workaround
  - No operating exit/gear claim from static showcase
- kind: part
  folder: standards/SFO/metadata/parts/explorer-study/
  code_family: EXPL-01 etc.; model-owned assemblies first, explicit children after stock/ownership reconciliation
  status: awaiting stable nonoverlapping ownership and geometry roster
  populate_when_supported:
  - exact source object drawing map and source hash
  - actual per-part length,width,height and surface area
  - material/stock references and mass only when physical material and geometry are justified
  - fit count and actual interface/attachment evidence
  requirements:
  - All954 names now mapped exactly once into17 model-owned assemblies. Corrected edited-180kN-derived gear ownership
    is retained in evidence; exact stock/material/overlap and mass remain open.
  - Separate repaired overlapping meshes, nonmanifold solid ambiguity and visual-only finishes.
  - Count every owned physical object once. Catalogue instances in fit are excluded from bare hull mass; authored
    gear belongs in owned parts unless separately registered as a new product.
  - Preserve physical mesh/component identity rather than treating material colour groups as parts.
- kind: equipment
  status: reuse catalogue; no new product until actual functional gap is specified
  rules:
  - Catalogue candidates below are existing values, not selected installations.
  - Unchanged equipment retains catalogue mass/limits. Modified gear does not inherit S0 or 180kN limits.
  - New gear/ramp/hatch products need geometry ownership, exact mounts, mass, supported function and stated limitations;
    visual pose is not load rating.
  - Per-instance rest is only for an existing motion package and freezes drawing; not a working mechanism.
owners:
  registry: hull/parts/equipment registry semantics, evidence ledger, schema/page validation and integration
