    - size_class
    tier: invented
    review: true
    note: At 1.2 kg a kilonewton (an A320's gear, as the S1 was sized) a 60 kN leg is about 70 kg; 60 kg with titanium.
      Chosen.
  - of:
    - identity.description
    tier: derived
    note: "Recomputed (Blender, 2026-10-11): a leg must take (m/n)(g + v\xB2/2s)/eta, gravity included: 13 t on\
      \ four at 3 m/s on 0.3 m at 0.8 needs 100.8 kN a leg. 60 kN holds 7.74 t on four, 11.6 t on six. The old note\
      \ left out gravity and efficiency. The leg is unchanged; the craft it suits is smaller."
  - of:
    - built_of
    - making
    rule: rule.first-design-parts
  - of:
    - life
    rule: rule.life-ship-system
  - of:
    - function.spring
    - function.damper
    tier: derived
    review: true
    note: 'A linear spring and damper standing for the oleo strut: the spring takes holds at the end of the stroke
      (6e+04 N / 0.3 m); the damper is 0.7 x holds at the design sink rate (3.0 m/s). 0.7 is chosen (invented):
      dropped at 3.0 m/s with the mass whose touchdown fills the stroke at efficiency 0.8 (2 holds stroke eff /
      v^2), it peaks at 1.03 x holds and uses 0.87 of the stroke; at rest under holds/3 (an aircraft-like limit
      load factor of 3, from memory) it settles with a damping ratio about 0.48. A real oleo is nonlinear (gas spring,
      orifice damping).'
