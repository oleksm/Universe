    - function.chamber.tubes_lower
    - function.chamber.vacuum_only
    tier: derived
    review: true
    note: 'Half S2''s tubes keep its tube sizes: 90 at the throat are 2.2 mm wide; 9.9 mm at the splice (area ratio
      20), 180 at the exit 10.1 mm: at 7 MPa over a 0.3 mm wall, 118 MPa at worst, a margin of 1.75 on 304''s yield.
      Expansion 84 leaves about 3.4 kPa at the exit; sea-level air on its 0.263 m2 pushes back 27 kN, more than
      its 25 kN: vacuum or air thinner than about 3 kPa only, like S2. Feeds (invented speed 5 m/s in the pump inlets):
      hydrogen 0.87 kg/s, 12.3 L/s, a 56 mm bore; oxygen 4.8 kg/s, 4.2 L/s, a 33 mm bore.'
