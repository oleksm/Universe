  link_budget: Lambertian regolith albedo 0.12 at 5 km returns rho*A/(pi*R^2) = 2.88e-12 of the pulse. A 1 mJ
    1064 nm pulse gives about 15,400 photons at the aperture, about 2,300 photoelectrons at 0.5 optics x 0.3 APD
    efficiency - far above detection. Airless, so no path loss.
  basis: invented/review; pulse energy, efficiencies and albedo are chosen orders of magnitude, no sun-background
    or filter design
