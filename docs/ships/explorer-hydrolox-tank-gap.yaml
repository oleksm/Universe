screen_limits:
- All capacities here are total hydrolox allocation, not a selected new product or number of tanks.
- Times are ideal fuel-only arithmetic at full nominal thrust, not usable burn duration or mission endurance. They
  exclude cell burn, reserve, unusable fuel, boiloff, steering/braking and pressure/thermal behavior.
- Catalogue320kg/m3 is invented/review fluid-equivalent bookkeeping; these volumes omit insulation, shells, ullage,
  divided LOX/LH2 volumes, bulkhead and services. They are not product envelopes.
- CHS1/S2 are vacuum_only catalogue candidates. Operating environment and loaded mass remain unselected.
- 'Delta-v cannot be selected from tank capacity alone: requires complete nonpropellant mass, duty profile and reserves.'
new_product_definition_requires:
- Actual source-frame bay reservation dimensions and usable geometry after containment, crew/maintenance and services
  allowances.
- Owner mission/environment, destination gravity, loaded mass, delta-v and engine duty/reserve budget; or an explicitly
  conditional catalogue design point with no mission claim.
- Divided LOX/LH2 storage/mix ratio, thermal/pressure limits, fill/vent/drain and insulation/ullage design with
  explicit basis.
- Measured new geometry, material/stock BOM and whole dry mass; existing0.5tpercentage mass or render colours cannot
  supply this.
- Actual compact mount/cradle/adapter interface and port locations; retain traceable fit contract rather than copying
  oversized standard feet.
- New immutable product model/package and registry key if compact design proceeds; independent fit and operation
  evidence before installation.
alternatives_to_compare:
- A new compact hydrolox product with an honest reduced capacity and complete physical design.
- An explicit external tank installation with real supports, altered silhouette, access/ground/plume/service and
  mass review.
- An explicitly redesigned propulsion/power/mission system compatible with another propellant; not a tank-only relabel.
current_limits: Current whole hull mass, installed B equipment, hydrolox tank placement and thermal routing remain
  unresolved. No scaling, silent cuts or gear-rating transfer.
