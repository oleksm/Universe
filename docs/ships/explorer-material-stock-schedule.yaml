    reason: Nonpressure covers, trim and bezels;2mm sheet is a manufacturing target, not permission to thin current
      geometry.
  al_deck:
    material: material.aluminium-alloy-6061
    density_kg_m3: 2700.0
    feedstock: stock.al6061-ingot
    feedstock_kind: stock
    nominal_form_stock: stock.al6061-pl-5
