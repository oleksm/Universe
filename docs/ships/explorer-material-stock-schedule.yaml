    reason: Floors, thresholds, ramp leaves and treads;5mm plate target, current material volume retained.
  al_frame:
    material: material.aluminium-alloy-6061
    density_kg_m3: 2700.0
    feedstock: stock.al6061-ingot
    feedstock_kind: stock
    nominal_form_stock: stock.al6061-pl-8
    basis: 'New prototype material choice: invented, review true. Density is the existing registry value, unchanged.'
    reason: Frames, coamings, ribs, ears, brackets, rails and edited foot pads.8mm plate target where applicable;
