scope: 952 exact current owned mesh names in17 assemblies. Roof tank/cradle study and catalogue equipment are outside
  this source and outside these allowances; command remains deferred.
basis:
  tier: invented
  review: true
  note: Materials/stock lanes and reserve amounts chosen explicitly for this prototype. Registry densities remain
    their own existing basis. No pressure, fatigue, impact, heat, landing or human qualification follows.
research:
- url: https://www.hydro.com/en-CA/global/aluminium/products/extruded-profiles/alloys-for-extruded-aluminium-profiles/6061-alloy/
  supports: 6061 family context only; no weld/temper allowables transferred.
- url: https://www.nasa.gov/missions/artemis/orion/orion-window-testing-brings-artemis-1-closer-into-view/
  supports: Spacecraft window assemblies use distinct pane materials/functions. Supports considering fused silica,
    not declaring an Explorer pressure-window architecture or rating.
- url: https://www.corning.com/media/worldwide/csm/documents/1e624b3034474193b5b00ea6f558dd3d2.pdf
  supports: Fused-silica density order~2200kg/m3. Calculation deliberately retains registry2203kg/m3, not a new
    certified material-grade value.
mass_calculation:
  mode: as-drawn reconciled material-solid volume times assigned registry density, plus separate explicit reserve
  equation: assembly_budget_kg = sum(valid_finished_solid_volume_m3*object_density_kg_m3) + hidden_dry_allowance_kg
  geometry: Blender owns seam/solid and duplicate/overlap reconciliation. Do not sum nonmanifold signed envelopes,
    count the same matter twice or fill intended cabin/access voids. A legitimate material interface is not an overlap
    deduction.
  no_hidden_lightening: Do not reduce density, discard objects, shrink thickness, assume invisible hollow cores,
    substitute selected nominal gauge or subtract guessed overlap to hit a target mass.
  stock_policy: feedstock is the selected existing raw stock (or direct fused-silica material for custom blanks).
    nominal_form_stock is a concrete preferred sheet/plate target, not an assertion a current thick/curved object
    fits that blank. Preserve measured volume and use raw alloy feed when shape/gauge routing is not established.
    Do not charge both raw and nominal stock as installed matter.
  stock_quantity: Finished material mass is geometry*density. Reserve15% input over finished raw-metal material
    mass for manufacturing offcut as a separate procurement estimate; offcut is NOT installed mass. Actual blank
    nesting replaces this estimate. No15% factor on assembled hidden reserves, optics or rubbers.
  hidden_allowances: Fixed additive DRY prototype budget targets below, declared once per assembly. They are not
    installed catalogue modules, stock recipes, geometry, fluids/propellant, power ratings or as-built measured
    mass. If later modeled/selected, replace the corresponding reserve explicitly rather than adding twice.
  housing_envelopes: If a housing is only a solid visual envelope, label that conservative stock-volume charge plus
    separate hardware reserve; do not pretend the interior is a resolved manufactured assembly. Reconcile actual
    material walls and replace budget when designed.
  cg: Report reserves as unlocated assembly mass with assembly bounding region; do not claim a measured COM at bbox
    centre. Whole CG remains a separate calculation.
  outputs: Report geometry-derived mass, hidden allowance, procurement offcut, excluded equipment and unresolved
    geometry separately. A complete draft design budget is not as-built weighed mass.
