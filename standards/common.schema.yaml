$schema: http://json-schema.org/draft-07/schema#
title: Common definitions
description: 'standards/common.schema.yaml: what every schema of the registry shares. A schema refers to one of these with $ref: <path to this file>#/definitions/<name>, and does not write its own.'
# A property that names another record takes that record's key, and says so with `x-ref`: the kinds
# of record it may name (x-ref: [element, material, good]). The build checks the key is a record's,
# and of one of those kinds.
# A property with a dimension says its unit with `x-unit`, and its values are in that unit: SI (kg, m, s,
# K, W, N, J, Pa and what is made of them), never t, km, hours, AU or light years. Angles are the one
# exception: degrees, `x-unit: deg`. A share, a ratio or a count has no x-unit.
definitions:
  physical:
    description: "What every physical thing has: what it weighs, the room it takes, what it stands. What a ship hauling it and a warehouse holding it have to know. A record uses those that apply to it."
    type: object
    additionalProperties: false
    properties:
      mass: { type: number, x-unit: "kg", description: "kg, the thing as made, with nothing fitted to it or carried in it" }
      length: { type: number, x-unit: "m", description: m }
      width: { type: number, x-unit: "m", description: m }
      height: { type: number, x-unit: "m", description: m }
      envelope: { type: array, items: { type: number }, minItems: 3, maxItems: 3, x-unit: "m", description: "m, [length, width, height] of the box it ships in, where that differs from its own size" }
      volume: { type: number, x-unit: "m3", description: "m3, the space its shape takes" }
      bulk_density: { type: number, x-unit: "kg/m3", description: "kg/m3, as stowed broken in a hold, for what is carried in bulk" }
      operating_min_temperature: { type: number, x-unit: "K", description: "K, the coldest it works at" }
      operating_max_temperature: { type: number, x-unit: "K", description: "K, the hottest it works at" }
      storage_min_temperature: { type: number, x-unit: "K", description: "K, the coldest it may be kept or carried at" }
      storage_max_temperature: { type: number, x-unit: "K", description: "K, the hottest it may be kept or carried at" }
      impact_resistance: { type: number, x-unit: "J", description: "J, the blow it takes without damage" }
      shock_limit: { type: number, x-unit: "m/s2", description: "m/s2, the hardest jolt it takes while it is carried" }
  key:
    description: "A record's one key, in the whole registry: <kind>.<name>, lower case, words joined by -, the kind being its schema's. The name may have more dotted parts where a record lives under another (body.treistun.treistun-f). Another record refers to it by this string."
    type: string
    pattern: "^[a-z][a-z-]*(\\.[a-z0-9][a-z0-9-]*)+$"
  basis:
    description: 'Where a record''s figures come from. Each entry covers the groups (or group.property) it names. sourced: from a published source or the game, named. derived: worked out from other figures, by physics or from a model. invented: chosen, to be balanced or replaced. review: a guess put in so the figure is there, to be reviewed.'
    type: array
    items:
      type: object
      additionalProperties: false
      required: [of, tier]
      properties:
        of: { type: array, minItems: 1, items: { type: string } }
        tier: { enum: [sourced, derived, invented] }
        source: { type: string }
        note: { type: string }
        review: { type: boolean, description: "A guess put in so the figure is there: to be reviewed." }
  address:
    description: 'Where something is (SFO 9). at: the settlement, by its key; then the tower, deck, section and unit inside the settlement (its own business, not checked).'
    type: object
    additionalProperties: false
    required: [at]
    properties:
      at: { type: string, x-ref: [settlement] }
      tower: { type: string }
      deck: { type: integer, minimum: 1 }
      section: { type: string }
      unit: { type: integer, minimum: 1 }
  provenance:
    description: "How a record came to be. seeded: made from the galaxy's seed, and may be made again. curated: changed by hand; the record is the truth. frozen: curated and not to be changed (other work is built on it)."
    enum: [seeded, curated, frozen]
  revision:
    description: "Where a designed thing stands. draft: being worked out. released: settled, to be built from. superseded: replaced by a later one. outdated: an early rough guess, kept as a record, not to be balanced against."
    enum: [draft, released, superseded, outdated]
  in_game:
    description: "Whether the game makes it yet."
    enum: [made, partly, not made]
