$schema: http://json-schema.org/draft-07/schema#
title: Common definitions
description: 'standards/common.schema.yaml: what every schema of the registry shares. A schema refers to one of these with $ref: <path to this file>#/definitions/<name>, and does not write its own.'
# A property that names another record takes that record's key, and says so with `x-ref`: the kinds
# of record it may name (x-ref: [element, material, good]). The build checks the key is a record's,
# and of one of those kinds.
# A property with a dimension says its unit with `x-unit`, and its values are in that unit: SI (kg, m, s,
# K, W, N, J, Pa and what is made of them), never t, km, hours, AU or light years. Angles are the one
# exception: degrees, `x-unit: deg`. A share, a ratio or a count has no x-unit.
# A schema says which kind of record it holds with `x-kind`: the first part of those records' keys
# (x-kind: [hull]; a settlement's schema holds two, [settlement, rig]). The build checks each record's
# key against it.
definitions:
  slot_kind: { $ref: "dictionary.schema.yaml#/definitions/slot_kind" }
  made_from:
    description: "What a made thing is made from: each a material, an item of stock, a part or a good, by its key, and how much of it one takes. (A thing put together from parts of its own has none: they are in its folder.)"
    type: array
    items:
      type: object
      additionalProperties: false
      required: [item]
      properties:
        item: { type: string, x-ref: [material, stock, part, good], description: "What it is made from, by its key. A good, for what is bought in whole and built in: a motor, a board, a pump." }
        quantity: { type: number, x-unit: "kg", description: "kg of it one takes: the piece as cut from the stock, before it is shaped. What is cut away is the difference from the thing's own mass, and is scrap." }
        blank: { type: string, description: "The piece cut from the stock before it is shaped: 1.2 x 0.8 m, 400 mm long." }
        grain: { type: string, description: "The direction the stock's grain or fibre runs in it." }
        finish: { type: string, description: "Its surface: bare, anodised, plated, painted." }
  making:
    description: "How a made thing is made."
    type: object
    additionalProperties: false
    properties:
      module: { type: string, x-ref: [module], description: "The industrial module that makes it, by its key. This is a recipe of that module's: what goes in is what the thing is made from, as the works has prepared it (a plate part's stock cut on the cutting table and formed on the panel former, each step's output lying in the works' store until the next takes it), and what is cut away comes out as scrap of its material." }
      fitting_out: { type: string, x-ref: [module], description: "The module that fits it with its equipment, by its key." }
      facility: { type: string, description: The kind of facility that makes it. }
      time: { type: number, x-unit: "s", description: "s to make one" }
      tolerance: { type: number, x-unit: "m", description: "m, on its dimensions" }
      tooling: { type: string, description: "The jig, die or mould it needs." }
      batch_size: { type: integer, minimum: 1, description: How many are made at a time. }
      yield: { type: number, x-unit: "1", minimum: 0, maximum: 1, description: "the share of those made that pass inspection" }
      inspection: { type: string, description: "How it is checked: measured, X-rayed, pressure-tested." }
  physical:
    description: "What every physical thing has: what it weighs, the room it takes, what it stands. What a ship hauling it and a warehouse holding it have to know. A record uses those that apply to it."
    type: object
    additionalProperties: false
    properties:
      mass: { type: number, exclusiveMinimum: 0, x-unit: "kg", description: "kg, the thing as made, with nothing fitted to it or carried in it" }
      length: { type: number, exclusiveMinimum: 0, x-unit: "m", description: m }
      width: { type: number, exclusiveMinimum: 0, x-unit: "m", description: m }
      height: { type: number, exclusiveMinimum: 0, x-unit: "m", description: m }
      envelope: { type: array, items: { type: number }, minItems: 3, maxItems: 3, x-unit: "m", description: "m, [length, width, height] of the box it ships in, where that differs from its own size" }
      volume: { type: number, exclusiveMinimum: 0, x-unit: "m3", description: "m3, the space its shape takes" }
      bulk_density: { type: number, exclusiveMinimum: 0, x-unit: "kg/m3", description: "kg/m3, as stowed broken in a hold, for what is carried in bulk" }
      operating_min_temperature: { type: number, x-unit: "K", description: "K, the coldest it works at" }
      operating_max_temperature: { type: number, x-unit: "K", description: "K, the hottest it works at" }
      specific_heat: { type: number, x-unit: "J/(kg K)", description: "J/(kg K) of the whole thing, for how fast its own losses warm it (a battery pack, a motor)" }
      storage_min_temperature: { type: number, x-unit: "K", description: "K, the coldest it may be kept or carried at" }
      storage_max_temperature: { type: number, x-unit: "K", description: "K, the hottest it may be kept or carried at" }
      impact_resistance: { type: number, x-unit: "J", description: "J, the blow it takes without damage" }
      shock_limit: { type: number, x-unit: "m/s2", description: "m/s2, the hardest jolt it takes while it is carried" }
  key:
    description: "A record's one key, in the whole registry: <kind>.<name>, lower case, words joined by -, the kind being its schema's. The name may have more dotted parts where a record lives under another (body.treistun.treistun-f). Another record refers to it by this string."
    type: string
    pattern: "^[a-z][a-z-]*(\\.[a-z0-9][a-z0-9-]*)+$"
  basis:
    description: 'Where a record''s figures come from. Each entry covers the groups (or group.property) it names. sourced: from a published source or the game, named. derived: worked out from other figures, by physics or from a model. invented: chosen, to be balanced or replaced. review: a guess put in so the figure is there, to be reviewed.'
    type: array
    items:
      type: object
      additionalProperties: false
      required: [of]
      properties:
        of: { type: array, minItems: 1, items: { type: string } }
        tier: { $ref: "dictionary.schema.yaml#/definitions/tier" }
        rule: { type: string, x-ref: [rule], description: "A rule stated once (SFO/metadata/rules) that this entry rests on: its tier, source and review are the rule's unless given here (an entry has a tier or a rule; the build checks). The record's note says only what is its own." }
        source: { type: string }
        note: { type: string }
        review: { type: boolean, description: "A guess put in so the figure is there: to be reviewed." }
  address:
    description: 'Where something is (SFO 9). at: the settlement or rig, by its key; then the tower, deck, section and unit inside the settlement (its own business, not checked).'
    type: object
    additionalProperties: false
    required: [at]
    properties:
      at: { type: string, x-ref: [settlement, rig] }
      tower: { type: string }
      deck: { type: integer, minimum: 1 }
      section: { type: string }
      unit: { type: integer, minimum: 1 }
  provenance: { $ref: "dictionary.schema.yaml#/definitions/provenance" }
  revision: { $ref: "dictionary.schema.yaml#/definitions/design_stage" }
  in_game: { $ref: "dictionary.schema.yaml#/definitions/in_game" }
  record_revision:
    description: "A record's revision: how firm it is, who decides a change to it, and what another agent does when it does not fit its own work. Read it before balancing against a record or building on it. A kind's schema gives the revision its records have unless they say otherwise (its default)."
    type: object
    additionalProperties: false
    required: [status]
    properties:
      status: { $ref: "dictionary.schema.yaml#/definitions/revision_status" }
      owner: { $ref: "dictionary.schema.yaml#/definitions/owner" }
      on_conflict: { $ref: "dictionary.schema.yaml#/definitions/on_conflict" }
      open_to: { type: array, items: { type: string }, description: "The groups or figures (group.property) that may still be proposed for change, where the rest may not." }
      fixed: { type: array, items: { type: string }, description: "The groups or figures that will not change, where the rest may." }
      because: { type: string, description: "Why it stands where it does: what it rests on, or what waits on it." }
      ask: { type: string, description: "Where a proposal to change it goes: a file of the repository." }
      replaced_by: { type: string, description: "What replaces a deprecated record, by key, or the kind that will (layout)." }
      priority: { enum: [low], description: "low: its work waits behind everything else (the asset queue puts it last): a hold the user set, said in because" }
  mark:
    description: "A made thing's mark (SFO 21): given once where it is made and never changed. What carries one: hulls, equipment, industrial modules, structures, parts (one serial a unit). Ownership and registration are separate records that point at the serial. The game stamps every unit it produces; the registry carries marks only on day-0 stock."
    type: object
    additionalProperties: false
    required: [serial, design, maker, made_at, made_on]
    properties:
      serial: { type: string, pattern: '^[A-Z]{2,4}-[A-Z0-9]+(-[A-Z0-9]+)*-[0-9]{6}$', description: "The maker's ticker, the product's code and a six-figure sequence the maker gives, one series a product: HHI-LIFE-S1-000123. Unique for all time." }
      design: { type: string, x-ref: [hull, equipment, module, structure, part], description: "What it is, by the design's key: the record that says its figures." }
      revision: { type: string, description: "The design's revision it was built to, where the design has had more than one." }
      maker: { type: string, x-ref: [org], description: "Who built it: the organisation whose works it came from. The design's maker where they built it themselves; a yard building another's design is the yard." }
      made_at: { type: string, x-ref: [facility, rig], description: "The works it came from, by its key." }
      made_on: { type: number, x-unit: "s", description: "s of world time when it was finished: when its life (the design's `life`) began." }
      parts: { type: array, items: { type: string }, description: "The serials of the marked parts built into it, for tracing a failure to its part and its part to its batch." }
  label:
    description: "A packed unit's label (SFO 21): what a works stamps on each package it fills, read by eye and by barcode: who, what, where, when. Game state, stamped at packing; the registry gives its shape and the layout (docs/formats/freefall-label-1.md). The package's own handling marks come from its template."
    type: object
    additionalProperties: false
    required: [brand, product, lot, serial, made_at, made_on, packed_on, net_mass, gross_mass, package]
    properties:
      brand: { type: string, x-ref: [org], description: "The maker whose brand it carries, by its key" }
      product: { type: string, x-ref: [stock], description: "What is in it, by the stock's key" }
      lot: { type: string, pattern: "^[A-Z]{2,4}-[0-9]{6}$", description: "The batch it came from (batch.lot)" }
      serial: { type: string, pattern: "^[A-Z]{2,4}-[0-9]{6}-[0-9]{4}$", description: "This package: its lot and a four-figure count within the lot, BWD-004471-0007; the barcode carries it" }
      made_at: { type: string, x-ref: [facility, rig], description: "The works, by its key" }
      made_on: { type: number, x-unit: "s", description: "s of world time when its lot was begun (the works' first output into it: docs/packing-contract.md)" }
      packed_on: { type: number, x-unit: "s", description: "s of world time when it was filled and labelled" }
      net_mass: { type: number, x-unit: "kg", description: "kg of contents" }
      gross_mass: { type: number, x-unit: "kg", description: "kg with the package (its tare)" }
      package: { type: string, x-ref: [package], description: "The package template, by its key" }
      barcode: { enum: [code128], description: "The symbology of its barcode, which encodes the serial (Code 128, set B)" }
  batch:
    description: "A lot's mark (SFO 21), for what is kept in bulk: stock, goods. One batch number a lot, from the works that made it; mill stock carries the heat (the melt) it was rolled from, as a mill certificate does."
    type: object
    additionalProperties: false
    required: [lot, made_at, made_on]
    properties:
      lot: { type: string, pattern: '^[A-Z]{2,4}-[0-9]{6}$', description: "The maker's ticker and a six-figure sequence the works gives: HHI-004471." }
      heat: { type: string, description: "For mill stock: the melt it came from, the melter's lot number." }
      made_at: { type: string, x-ref: [facility, rig], description: "The works, by its key." }
      made_on: { type: number, x-unit: "s", description: "s of world time when the lot was begun (its first output)." }
  product_identity:
    description: "What every made product's identity says (a shape: a kind's identity derives from it with allOf and adds its own words). Flattened by the generator and the validators."
    type: object
    additionalProperties: false
    required: [key, name]
    properties:
      key: { $ref: "#/definitions/key" }
      traded_as: { type: string, x-ref: [market], description: "The market category it is traded as, by its key. Anything physical can be traded." }
      name: { type: string }
      maker: { type: string, x-ref: [org], description: "The maker whose product it is, by its key." }
      revision: { $ref: "#/definitions/revision" }
      description: { type: string }
  surface_position:
    description: "Where on a body's surface, in degrees: latitude from the equator, north positive; longitude from the body's zero meridian, east positive."
    type: object
    additionalProperties: false
    required: [latitude, longitude]
    properties:
      latitude: { type: number, minimum: -90, maximum: 90, x-unit: "deg" }
      longitude: { type: number, minimum: -180, maximum: 180, x-unit: "deg" }
  staff:
    description: "Who works somewhere: the trades and how many of each."
    type: array
    items:
      type: object
      additionalProperties: false
      required: [profession, count]
      properties:
        profession: { type: string, x-ref: [profession], description: "The trade, by its key." }
        count: { type: integer, minimum: 0, description: "how many of them" }
  planet_context:
    description: "Where a Planet Simulator word sits in the context tree (standards/PlanetSim): the levels it means something at, and its links, so a tool working at one level takes that level's words and its parent's frozen anchors. A shape: each Planet Simulator kind derives from it (allOf)."
    type: object
    additionalProperties: false
    properties:
      levels: { type: array, items: { type: string, x-ref: [planet-level] }, description: "The levels it is meaningful at." }
      parent: { type: string, x-ref: [planet-line, planet-landmark, planet-layer, planet-field], description: "What it hangs from one level up (a tributary from its trunk river, a peak from its crest spine)." }
      children: { type: array, items: { type: string, x-ref: [planet-line, planet-landmark] }, description: "The kinds it expands into one level down." }
      bounded_by: { type: array, items: { type: string, x-ref: [planet-line] }, description: "The line kinds that bound it (a layer's boundaries)." }
      made_by: { type: array, items: { $ref: "dictionary.schema.yaml#/definitions/geological_event" }, description: "The events that make it." }
      handled_by: { type: array, items: { type: string, x-ref: [planet-handler] }, description: "The mesher handlers that draw it." }
      measured_by: { type: array, items: { type: string, x-ref: [planet-measure] }, description: "The measures that judge it against real ground." }
      source: { type: string, description: "The sim's own word for it, exactly as its code or files write it (a constant, a type string, an array key): what the extractor matches." }
  sim_param:
    description: "One parameter of the planet sim (Planet Simulator): its name in the code, the old environment setting that set it, its value in SI with how the code says it, its range, what it means, where it is set (file:line), and whether it is still open."
    type: object
    additionalProperties: false
    required: [name, meaning]
    properties:
      name: { type: string, description: "Its name in the code (EARTH_SPEED)." }
      env: { type: string, description: "The old environment setting (SIM_*), when one set it." }
      value: { type: number, x-unit-from: unit, description: "In SI (or 1)." }
      values: { type: array, items: { type: number, x-unit-from: unit }, description: "When it is a list or a schedule." }
      setting: { type: string, description: "When it is not a number: a flag, a choice, a name." }
      unit: { type: string, description: "SI, 1, or deg." }
      said_as: { $ref: "#/definitions/said_as" }
      range: { type: array, minItems: 2, maxItems: 2, items: { type: number, x-unit-from: unit } }
      meaning: { type: string }
      source: { type: string, description: "Where the code sets it: file:line." }
      note: { type: string }
      open: { type: boolean, description: "true: a draft, not settled." }
      used: { type: boolean, description: "false: set but read nowhere in the code." }
  feature_quantity:
    description: "A figure every instance of a relief feature kind carries (a dimension, or a layout parameter): its name, its SI unit, what it means, the law that sets it in words, its formula and its parameters."
    type: object
    additionalProperties: false
    required: [name, meaning]
    properties:
      name: { type: string }
      unit: { type: string, description: "SI, 1, or deg." }
      meaning: { type: string }
      rule: { type: string, description: "The scaling law in words, with its source (width grows as the square root of discharge, Leopold and Maddock 1953)." }
      formula: { type: string, description: "The law as a formula in the names of its parameters (a * Q^b)." }
      params: { type: array, items: { $ref: "#/definitions/sim_param" } }
  sim_io:
    description: "A value a planet process reads or writes: the code's name, the Planet Simulator field it is (when there is one), its unit and meaning."
    type: object
    additionalProperties: false
    required: [name]
    properties:
      name: { type: string, description: "The code's name (w.x, h.column('heat_flow_mantle_tw'))." }
      field: { type: string, x-ref: [planet-field], description: "The Planet Simulator field it is." }
      unit: { type: string }
      meaning: { type: string }
  planet_legend:
    description: "A legend as a page draws it: a title, a subtitle, and its rows, each a kind (head, fill, line, dot), a colour and a label (a template may hold {placeholders} the view fills)."
    type: object
    additionalProperties: false
    required: [title, rows]
    properties:
      name: { type: string }
      title: { type: string }
      sub: { type: string }
      source: { type: string }
      rows:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [kind, label]
          properties:
            key: { type: string, description: "What the row stands for, for the tool that draws it (rock:morb, coast): its colour is found by it." }
            kind: { type: string, description: "head, fill, line, dot..." }
            colour: { type: array, items: { type: integer, minimum: 0, maximum: 255, x-unit: "1" }, description: "RGB" }
            label: { type: string }
            shown: { type: boolean }
            style: { type: string, enum: [solid, dashed, dotted, dashdot], description: "A line row's line style." }
            width: { type: number, minimum: 0, x-unit: "1", description: "A line row's width, pixels at 1,000 px a picture." }
            shown_when: { type: string, description: "When the page shows the row (always, ctx...)." }
  said_as:
    description: "How the sim or its people say a figure, beside the registry's SI value: their unit and the factor from it to SI (SI = value x factor)."
    type: object
    additionalProperties: false
    required: [unit, factor]
    properties:
      unit: { type: string, description: "Their unit: m3/yr, km2, Myr, degC." }
      factor: { type: number, x-unit: "1", description: "SI value = their value x this (an offset unit like degC says its offset in a note)." }
      note: { type: string }
  model_request:
    description: "Work the registry asks of a record's model (tools/standards/model_spec.py, docs/asset-contract.md): rebuild (its body changed: a part moved, was added or turned out wrong), rig (its moving parts want pivots, nodes or a motion file), measure (its envelope boxes are to be measured from the installed model), optimise (over its triangle budget). Asked of one installed version: a later version answers it. A port moving is never a request (the game draws the joint at the port)."
    type: object
    additionalProperties: false
    required: [work, because, asked, of_version]
    properties:
      work: { enum: [rebuild, rig, measure, optimise, keep], description: "What is asked of the model; keep: a review found the model shows the record as it is, no work (closes the review for that version)." }
      because: { type: string, description: "What changed or is wrong, and what the new model must do: plainly, so a modeller can act on it." }
      asked: { type: string, format: date, description: "When it was asked (YYYY-MM-DD)." }
      of_version: { type: integer, minimum: 0, description: "The installed version it is asked of; a version above it answers it." }
      by: { type: string, description: "Who asks: the session or agent." }
  visual:
    description: "A made thing's model (the asset contract, docs/asset-contract.md): a package in the assets store (UNIVERSE_ASSETS, else ~/git/freefall-assets) written once per version by tools/standards/install_model.py, which checks the model against this record (its size, its required nodes, its budget) and the package's files against their hashes. Without one the game draws the record as a translucent box of its size with its name on the edges."
    type: object
    additionalProperties: false
    required: [format, path, manifest_sha256, version]
    properties:
      format: { const: "freefall-model/1" }
      path: { type: string, description: "The version's folder in the assets store, relative to it: models/<key tail>/v<N>." }
      manifest_sha256: { type: string, pattern: "^[0-9a-f]{64}$", description: "Of the version's manifest.json." }
      version: { type: integer, minimum: 1 }
      triangles: { type: integer, description: "triangles drawn, from the model" }
      note: { type: string }
  port:
    type: object
    additionalProperties: false
    required: [id, flow, medium, interface, at, facing]
    description: "One place where something goes in or comes out of a made thing (SFO 25, SFO 26): a unit, a piece of equipment, a module or a layout. It is built to an interface (a standard's mating face) and carries one half of it; it states the duty it needs, so any maker's connection product built to that interface and rated for that duty fits it. The game draws the joint at the port, and the thing's own model ends at the mating plane."
    properties:
      id: { type: string, description: "Its name on the thing, unique there (gas-in, water-out, hv, base)." }
      flow: { enum: [in, out, both], description: "Which way what it carries goes at full rate: in, out, or both (a power port feeding and fed). For a load port: out, the thing's weight going down into what bears it." }
      medium: { enum: [gas, liquid, bulk, power, signal, heat, load, carrier, people], description: "What crosses it: gas, liquid or bulk solids; power; signal (control and data); heat (by a heat pipe or a contact); load (weight and working forces into what bears it); carrier (a batch on a car, a crane's hook, a container's lock); people (an airlock, a docking ring)." }
      interface: { type: string, x-ref: [interface], description: "The interface it is built to (SFO 26), by key: its mating face and the envelope a product built to it must meet." }
      half: { enum: [male, female, androgynous], description: "Which half of the interface the thing itself carries; the joining product brings the other (androgynous: both halves are the same)." }
      make: { enum: [permanent, bolted, manual, automatic, open], description: "How the joint is made and broken here: welded once; bolted; by hand (a plug, a quick coupling, a crew's work, a game action); automatically (a clamp, a docking ring, a coupler); open (nothing mates: a belt's head over a hopper, a hood over an outlet)." }
      connector: { type: string, x-ref: [connector], description: "The connection product the registry's own layouts join it with, by key; any other product built to the same interface and rated for the duty fits as well." }
      item: { type: string, x-ref: [material, stock, good, package], description: "What it carries, by key; none for power, signal or load." }
      rate: { type: number, minimum: 0, x-unit: "kg/s", description: "kg/s at the thing's rating: the duty a product must carry" }
      power: { type: number, minimum: 0, x-unit: "W", description: "W through it at the thing's rating (power or heat)" }
      pressure: { type: number, minimum: 0, x-unit: "Pa", description: "Pa inside it in service" }
      temperature: { type: number, minimum: 0, x-unit: "K", description: "K of what it carries" }
      voltage: { type: number, minimum: 0, x-unit: "V", description: "V between phases (a power port)" }
      current: { type: number, minimum: 0, x-unit: "A", description: "A a phase through it at the thing's rating" }
      mass: { type: number, minimum: 0, x-unit: "kg", description: "A load port: kg it bears down through it, the thing and what it holds (its weight is this times the site's gravity). A carrier port: kg a batch weighs." }
      force: { type: number, minimum: 0, x-unit: "N", description: "A load port: N of working force on top of its weight, at its worst (a crane wheel's reaction, a tilt, a thrust)" }
      moment: { type: number, minimum: 0, x-unit: "N m", description: "A load port: N m of working moment at its worst" }
      cycle: { type: number, exclusiveMinimum: 0, x-unit: "s", description: "A carrier port: s between batches" }
      moves_with: { type: string, description: "The id of the thing's motion this port moves with (a tilting furnace's outlet): its joint must let it move." }
      at: { type: array, items: { type: number }, minItems: 3, maxItems: 3, x-unit: "m", description: "Its face's middle in the thing's frame (x along, y across from its middle, z up from its base)." }
      facing: { type: array, items: { type: number }, minItems: 3, maxItems: 3, x-unit: "1", description: "The way out of its face, a unit vector in the thing's frame: a run leaves it this way." }
      optional: { type: boolean, description: "A spare, blinded when nothing joins it." }
      key: { type: string, description: "The keying its half is cut to, one of its interface's `keys`: halves mate only at the same key (an HV DC pole keyed plus cannot meet one keyed minus)." }
      channel: { type: string, description: "The circuit it belongs to, so a wire may only join ports of the same channel: a power bus by its kind and voltage (dc-28v, dc-270v, dc-3kv, ac-400v), a data link by its protocol and name (can-a, ethernet-1). A DC feed of two single-pole receptacles is two ports of one channel, plus and minus." }
      pins:
        type: array
        description: "What each contact of its interface carries (the interface's contacts by id): a wire joins two ports contact to contact, and the roles must agree (plus to plus, signal-high to signal-high). Electrical and signal ports only."
        items:
          type: object
          additionalProperties: false
          required: [contact, role]
          properties:
            contact: { type: string, description: "The interface's contact id" }
            role: { enum: [plus, minus, line, neutral, earth, screen, signal-high, signal-low, signal, return, spare], description: "What it carries: DC plus or minus; AC line or neutral; protective earth; a cable's screen; a differential pair's high and low; a single-ended signal and its return; spare (no connection)." }
            line: { type: string, description: "Which line of a multi-line port (L1, L2, L3; a data link's lane)" }
      note: { type: string }
  internal:
    type: object
    additionalProperties: false
    required: [kind]
    description: "How a thing's own ports are joined inside it, stated so a wiring graph never infers it from where they lie (ships, 2026-10-18)."
    properties:
      kind: { enum: [joined, switched, converts], description: "joined: the listed ports' contacts of the same role and line are one conductor inside (a bus bar); switched: the same, each port through its own breaker the game may open; converts: the `to` ports are live only while the `from` ports are fed, at most the thing's function's rating (a converter, a charger)." }
      ports: { type: array, items: { type: string }, description: "joined or switched: the port ids" }
      from: { type: array, items: { type: string }, description: "converts: the port ids it draws from" }
      to: { type: array, items: { type: string }, description: "converts: the port ids it gives to" }
      note: { type: string }
  motion:
    type: object
    additionalProperties: false
    required: [id, kind]
    description: "A way a made thing or a part of it moves in service (SFO 26): a fit check sweeps what moves through its range, and its moving ports need joints that let them."
    properties:
      id: { type: string }
      kind: { enum: [tilt, rotate, travel, lift, dock], description: "tilt or rotate: about an axis; travel or lift: along one; dock: coming to rest against a mating face." }
      point: { type: array, items: { type: number }, minItems: 3, maxItems: 3, x-unit: "m", description: "A point on its axis, in the thing's frame" }
      direction: { type: array, items: { type: number }, minItems: 3, maxItems: 3, x-unit: "1", description: "Its axis, a unit vector" }
      angle: { type: array, items: { type: number }, minItems: 2, maxItems: 2, x-unit: "rad", description: "rad from rest it turns, least and most (a tilt or a rotation)" }
      distance: { type: array, items: { type: number }, minItems: 2, maxItems: 2, x-unit: "m", description: "m from rest it moves, least and most (a travel or a lift)" }
      moves: { type: array, items: { type: string }, description: "What moves: the whole thing, or its named parts" }
      boxes: { type: array, items: { type: integer, minimum: 0 }, description: "Which of the thing's envelope boxes move with it, by index; none given: all of them; an empty list: none sweeps beyond itself (a drum spinning on its own axis)." }
      note: { type: string }
  physical_object:
    description: "A thing that exists in the world: it has physical figures. A kind of record that is one derives from this (allOf), and adds the figures its kind must have. A company, a law or a need does not."
    required: [physical]
