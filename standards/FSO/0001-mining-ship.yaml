version: 1
title: Mining ship
status: draft
scope: >-
  What a mining ship is, and why it carries what it carries: its purpose, the forces in its way, and the
  systems that answer them. Not how any of them is built (other standards, and makers, do that).
sections:
- title: Purpose
  text:
  - To turn rock somewhere far away into value at a market, and bring its crew home.
- title: The forces, and what answers them
  text:
  - >-
    Every system aboard answers a force the world puts in the way of its purpose.
  table:
    columns:
    - Force (what the world imposes)
    - What it demands
    - Systems that answer it
    rows:
    - - 'Distance: the rock is far from the market'
      - get there and back
      - drive, hyperdrive, propellant, navigation, flight computer
    - - 'Gravity and motion: rocks spin, worlds pull'
      - hold position, land, lift
      - lift and manoeuvring thrusters, gear, anchor clamps
    - - Rock is hard and mixed
      - break it, find the good part
      - prospecting sensors, laser or drill, analyser
    - - 'Mass costs: every tonne hauled costs propellant'
      - carry only what pays
      - collector, crusher, refinery, tailings ejector, holds
    - - 'Energy: cutting and moving takes power'
      - make and store it
      - reactor, capacitors, power distribution
    - - 'Heat: every watt used becomes heat; space barely takes it away'
      - get rid of it
      - radiators, coolant loops
    - - 'Vacuum, time, danger: people die out there'
      - keep them alive, weeks at a time
      - >-
        pressure hull, life support, water, medical, quarters, galley, escape pod, fire and damage control
    - - 'Isolation: help is far'
      - fix things, call out
      - workshop, spares, comms
    - - 'Trade: value is only real where it''s sold'
      - hand over cargo, prove what it is
      - docking, cargo handling, containers, transponder
- title: Roles fall out of the forces
  text:
  - >-
    A mining ship differs from a hauler or a fighter only in which forces it fights hardest: rock, mass
    and heat. That is why it carries the laser, the refinery and the radiators. Nobody declares a role;
    the forces make it.
- title: What follows
  text:
  - >-
    A system earns its place when a force in the world makes it necessary. Where the force is not simulated,
    the system is decoration (a radiator matters only once heat limits what can run). The order: the force,
    then the system, then a standard where makers meet.
  - >-
    A standard exists where two makers' things meet across one of these forces: power into a module, heat
    out of it, ore into a hold, a ship onto a pad. The retractable hardpoint comes first because rock,
    energy, heat and mass all meet there.
  - >-
    The compartments are the rooms inside: cockpit, quarters, galley, medical, life support, workshop,
    airlock, holds, refinery, reactor room.
