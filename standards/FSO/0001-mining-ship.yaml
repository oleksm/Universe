- title: In the game now, and waiting
  text:
  - >-
    Simulated now: distance and propellant, gravity and motion, rock and mining, mass, energy, trade,
    vacuum on foot. Their systems are mostly in.
  - >-
    Not yet: heat (radiators, coolant), life support over time, breakdowns and repair, refining and matter.
    Their systems wait for those forces.
text: >-
  A mining ship exists to turn rock somewhere far away into value at a market, and bring its crew home.
  Everything aboard follows from the forces in the way of that. Defined first so the standards after it
  can say what they are for.
