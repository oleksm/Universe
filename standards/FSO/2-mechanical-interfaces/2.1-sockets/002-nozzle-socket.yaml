# yaml-language-server: $schema=../../../schema/standard.schema.json
version: 1
title: NOZZLE SOCKET
status: published
scope: >-
  WHERE A DRIVE NOZZLE OR THRUSTER MOUNTS: THRUST IT MAY TAKE, FLANGE, FEED, PLUME KEEP-OUT. THE AXIS
  AND THRUST RANGE OF EACH ARE THE HULL VENDOR'S (ITS DATASHEET).
refs:
- FSO/0.1/001
- FSO/6.1/001
params:
- key: 1.thrust_max
  value: 60.0
  unit: kN
  note: A THRUSTER QUAD
- key: 1.flange
  value: 0.5
  unit: m
  note: DIAMETER
- key: 2.thrust_max
  value: 400.0
  unit: kN
- key: 2.flange
  value: 1.2
  unit: m
- key: 3.thrust_max
  value: 1500.0
  unit: kN
  note: A DROVER'S MAIN NOZZLE (1.3 MN)
- key: 3.flange
  value: 2.5
  unit: m
- key: 4.thrust_max
  value: 6000.0
  unit: kN
- key: 4.flange
  value: 5.0
  unit: m
- key: plume_half_angle
  value: 15.0
  unit: deg
  note: 'INVENTED: KEEP-OUT CONE ROUND THE AXIS'
- key: plume_length
  value: 0.035
  unit: m/sqrt(N)
  note: AS THE GAME DRAWS PLUMES
requires:
- subject: module.thrust
  check: at_most
  param: thrust_max
  per: size
- subject: module.flange
  check: equals
  param: flange
  per: size
text: >-
  THE HULL VENDOR CERTIFIES WHERE NOZZLES GO AND HOW HARD EACH MAY PUSH, SO THE VESSEL STAYS CONTROLLABLE
  ABOUT ITS CENTRE OF MASS LOADED OR EMPTY. NOTHING HERE MAKES IT SO: A BAD LAYOUT YAWS UNDER THRUST,
  AND ITS VENDOR'S NAME PAYS.
licence: open
