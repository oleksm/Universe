# yaml-language-server: $schema=../../../schema/standard.schema.json
version: 1
title: UTILITY SOCKET
status: published
scope: >-
  WHERE WORK GEAR MOUNTS: SCOOPS, MINING ARMS, SENSORS, CLAMPS. MASS, LOAD, CLEARANCE, POWER, A HATCH
  OR NOT.
refs:
- FSO/0.1/001
- FSO/6.1/001
params:
- key: 1.mass_max
  value: 1.0
  unit: t
  note: INVENTED
- key: 1.load_max
  value: 30.0
  unit: kN
- key: 1.clearance
  value: 2.0 X 2.0 X 1.5
  unit: m
- key: 1.power
  value: CLASS A
- key: 2.mass_max
  value: 4.0
  unit: t
- key: 2.load_max
  value: 120.0
  unit: kN
- key: 2.clearance
  value: 3.5 X 5.0 X 2.5
  unit: m
- key: 2.power
  value: CLASS B
- key: 3.mass_max
  value: 16.0
  unit: t
- key: 3.load_max
  value: 500.0
  unit: kN
- key: 3.clearance
  value: 6.0 X 9.0 X 4.0
  unit: m
- key: 3.power
  value: CLASS C
- key: hatch
  value: 'OPTIONAL: A RETRACTABLE COVER, THE MODULE LATCHED BENEATH'
requires:
- subject: module.mass
  check: at_most
  param: mass_max
  per: size
- subject: module.load
  check: at_most
  param: load_max
  per: size
- subject: module.envelope
  check: fits_within
  param: clearance
  per: size
- subject: module.power
  check: provides
  param: power
  per: size
text: >-
  THE GENERAL-PURPOSE SOCKET. CLEARANCE INCLUDES WHAT THE GEAR SWEEPS DEPLOYED (A MINING ARM'S REACH).
licence: open
