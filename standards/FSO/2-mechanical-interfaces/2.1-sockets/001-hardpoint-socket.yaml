# yaml-language-server: $schema=../../../schema/standard.schema.json
version: 1
title: HARDPOINT SOCKET
status: published
scope: >-
  WHERE A TURRET, GUN OR LASER MOUNTS: WHAT IT MAY WEIGH, PUSH BACK WITH, DRAW, AND SWEEP. NOT WHAT IT
  FIRES.
refs:
- FSO/0.1/001
- FSO/6.1/001
params:
- key: 1.mass_max
  value: 0.5
  unit: t
  note: 'INVENTED: SIZES AS TODAY''S SLOT SIZES 1-4'
- key: 1.recoil_max
  value: 20.0
  unit: kN
- key: 1.clearance
  value: 1.5 X 2.0 X 1.2
  unit: m
- key: 1.power
  value: CLASS A
- key: 2.mass_max
  value: 2.0
  unit: t
- key: 2.recoil_max
  value: 80.0
  unit: kN
- key: 2.clearance
  value: 2.5 X 4.0 X 2.0
  unit: m
- key: 2.power
  value: CLASS B
- key: 3.mass_max
  value: 8.0
  unit: t
- key: 3.recoil_max
  value: 300.0
  unit: kN
- key: 3.clearance
  value: 4.0 X 6.0 X 3.0
  unit: m
- key: 3.power
  value: CLASS C
- key: 4.mass_max
  value: 30.0
  unit: t
- key: 4.recoil_max
  value: 1200.0
  unit: kN
- key: 4.clearance
  value: 7.0 X 10.0 X 5.0
  unit: m
- key: 4.power
  value: CLASS D
requires:
- subject: module.mass
  check: at_most
  param: mass_max
  per: size
- subject: module.recoil
  check: at_most
  param: recoil_max
  per: size
- subject: module.envelope
  check: fits_within
  param: clearance
  per: size
- subject: module.power
  check: provides
  param: power
  per: size
text: >-
  A HULL VENDOR SAYS WHERE ITS HARDPOINTS ARE AND HOW BIG; A WEAPONS VENDOR BUILDS TO THE SIZE. CLEARANCE
  IS THE WHOLE SWEEP OF A TURNING TURRET, STOWED OR FIRING.
licence: open
