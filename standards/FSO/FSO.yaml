# yaml-language-server: $schema=schema/body.schema.json
key: body.fso
name: Foundry Standards Office
prefix: FSO
seat: home
kind: independent
note: The standards everyone builds to, whoever they answer to. Open to all.
founded_by:
  - brand.tolland
  - brand.vireo
  - brand.kestrel
  - brand.hadley
  - brand.orbital
  - brand.halvard
about:
  - >
    The Foundry Standards Office is independent and international: no government owns it and it
    governs no one. Its members are the standards bodies of the civilisations that take part,
    with the makers who build to its work; the first makers founded it. It is seated at the home
    station, where it keeps its register.
  - >
    Its work is interoperability: that a module from one maker fits a hull from another, that a
    ship of one civilisation can set down at another's port, that a tonne is a tonne and a signal
    is understood. What exists, and how it fits together.
  - >
    Nobody has to follow it; nearly everyone does, because fitting together pays. A government
    adopts its standards, and may mandate them in its own systems ("FSO size classes at our
    ports"): that is the government's law, not the FSO's. A government also keeps its own
    standards body for its own codes, which may go further or go its own way.
  - >
    It can be outdone. Anyone can found a standards body and publish rivals; adoption decides. A
    civilisation that refuses FSO standards can, at the price of fitting with no one else.
  - >
    What it isn't: a government (it has no people, no space, no law), physics (what's true doesn't
    change by agreement), a product (it makes nothing; products conform to it), or a guarantee
    (conformance is claimed by the maker; certifying it is a service someone else performs).
