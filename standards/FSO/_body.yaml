key: body.fso
name: Foundry Standards Office
prefix: FSO
seat: home
kind: consortium
note: The first standards, from the first makers. Open to all, built to by most.
founded_by:
  - brand.tolland
  - brand.vireo
  - brand.kestrel
  - brand.hadley
  - brand.orbital
  - brand.halvard
about:
  - >
    The Foundry Standards Office is a consortium: the first makers of hulls, drives, plants,
    avionics and ports agreeing on how their things fit together, so that a module from one
    fits a hull from another and every ship can set down at every port. It is seated at the home
    station, where it keeps its register.
  - >
    It controls no space. Nobody has to follow its standards; most do because it pays. A module
    built to an FSO socket sells to every FSO hull, and a ship within an FSO size class lands at
    every port with pads of that class. Its power is that most of what exists is built to it.
  - >
    Mandates are not the FSO's. A settled system's authority may require a standard in its space
    (a port that only takes conforming hulls, lights required on approach), and that is the
    authority's rule, recorded as theirs, enforced the way it enforces anything: by refusing
    service. There are no borders in it.
  - >
    It can be outdone. Anyone (a corporation, a group of players, an authority) can found a
    standards body and publish rivals; adoption decides. The FSO plays by the same rules as
    everyone else.
  - >
    What it isn't: physics (what's true doesn't change by agreement), a product (it makes
    nothing; products conform to it), law (it can't make anyone follow it), or a guarantee
    (conformance is claimed by the maker; certifying it is a service someone else performs).
