$schema: http://json-schema.org/draft-07/schema#
title: Dictionary
description: 'standards/dictionary.schema.yaml: the registry''s shared words. Each is a list of values a field may take, with what each value means (x-values). A schema that uses one refers to it and does not write its own list. Read this first when a value in a record is not plain.'
definitions:
  revision_status:
    description: "How firm a record is, for anyone building on it or against it. Only the user makes a record complete, and only the user reopens one."
    enum: [draft, review, complete]
    x-values:
      draft: "A rough guess, there so the record exists. Do not balance against it; expect it to move; propose freely."
      review: "Worked out, and open. Build against it, and propose a change with a reason."
      complete: "A hard limit: other work is built on it. Fit your work to it. Validation fails if its record changes (standards/changes.yaml)."
  on_conflict:
    description: "What another agent does when a record does not fit its own work."
    enum: [adjust, propose, escalate, conform]
    x-values:
      adjust: "Change it yourself, and say why in the record."
      propose: "Leave it. Write the proposal where the record says to ask, and work on a stated assumption meanwhile."
      escalate: "Stop and bring it to the user."
      conform: "It will not change. Fit to it."
  owner:
    description: "Who decides a change to a record."
    enum: [registry, ships, integration, user]
    x-values:
      registry: "The registry session (the facts and their spec), on branch fso."
      ships: "The ships session (hulls and their models), on branch ships."
      integration: "The integrating session (the game's code), on main."
      user: "The user alone."
  design_stage:
    description: "Where a designed thing stands in its life as a product. Not how firm its record is: that is its revision's status."
    enum: [draft, released, superseded, outdated]
    x-values:
      draft: "Being worked out."
      released: "Settled, to be built from."
      superseded: "Replaced by a later one."
      outdated: "An early rough guess, kept as a record, not to be balanced against."
  in_game:
    description: "Whether the game makes it yet."
    enum: [made, partly, not made]
    x-values:
      made: "The game makes it."
      partly: "The game makes some of it."
      not made: "Described here, not yet in the game."
  provenance:
    description: "How a record of the charted world came to be."
    enum: [seeded, curated, frozen, baked]
    x-values:
      seeded: "Made from the galaxy's seed, and may be made again."
      curated: "Changed by hand; the record is the truth."
      frozen: "Curated and not to be changed: other work is built on it."
      baked: "Grown by the planet simulation from this record's inputs: the record owns its identity and inputs, the survey it points at owns what the run derived (temperature, land, terrain, deposits). Never re-seeded."
  tier:
    description: "Where a figure comes from."
    enum: [sourced, derived, invented]
    x-values:
      sourced: "From a published source or the game, named."
      derived: "Worked out from other figures, by physics or from a model."
      invented: "Chosen."
  slot_kind:
    description: "A kind of slot a hull has, and so the kind of equipment that fits it."
    enum: [power, drive, thrusters, lift, tank, cargo, hyperdrive, capacitor, computer, transponder, sensors, comm, life_support, hardpoint, utility, avionics, access, handling, thermal, gear, gate]
    x-values:
      access: "A way in or out: an airlock, a ramp, a lift, a bay door, a docking collar or clamp."
      handling: "Moves bulk or cargo aboard: a scoop, a conveyor, a crane, a transfer arm."
      thermal: "Takes heat away: a radiator, an exchanger, a coolant loop, a heat sink."
      gear: "A landing leg's: one leg to a slot, a hull has several."
      gate: "A gate ring's, not a hull's."
  geological_event:
    description: "What happens to a world's crust that lays down rock and ore, in the planet simulation."
    enum: [ridge, arc, collision, collision front, plume, rift, sea, craton, weathering, coast, salt flat, ocean floor]
    x-values:
      ridge: "A mid-ocean ridge: new ocean floor."
      arc: "A subduction arc: volcanoes over a sinking plate."
      collision: "Continents meeting: mountains, and granite where the crust thickens."
      collision front: "Ocean floor thrust onto land where continents meet."
      plume: "A mantle plume: floods of basalt."
      rift: "A continent pulling apart."
      sea: "A shallow sea or basin laying down sediment."
      craton: "Old, thick, stable crust."
      weathering: "Tropical rain rotting flat ground deep: it needs a climate."
      coast: "Waves on a low coast, sorting sand by its weight."
      salt flat: "A dry, high, closed basin beside volcanoes, where water only leaves by drying."
      ocean floor: "Old, deep ocean floor far from land."
  survey_method:
    description: "A way of looking for ore without digging."
    enum: [geochemistry, radiometrics, electromagnetics, induced polarisation, magnetics, gravity, sonar]
    x-values:
      geochemistry: "Soil and stream samples: finds what all but crops out."
      radiometrics: "The ground's own radiation: the surface only."
      electromagnetics: "Induced currents: finds what conducts."
      induced polarisation: "The ground's slow electrical answer: finds scattered sulphides."
      magnetics: "The ground's magnetism, from the air or orbit."
      gravity: "The ground's pull: finds what is dense."
      sonar: "Sound off the sea bed: finds what lies on it."
  deposit_shape:
    description: "The shape an ore body takes."
    enum: [stock, veins, lens, strata, pipe, blanket]
    x-values:
      stock: "A broad, steep mass."
      veins: "Thin sheets filling cracks."
      lens: "A pod, thick in the middle."
      strata: "A layer among layers."
      pipe: "A steep chimney."
      blanket: "A flat sheet at or near the surface."
  offence:
    description: "What an administration's law forbids. A breach is recorded against the person and the ship, never hard-blocked: the game lets it happen and the law answers."
    enum: [piracy, murder, theft, smuggling, zoning breach, unlicensed mining, reckless flying, fraud, evasion]
    x-values:
      piracy: "Attacking a ship, or taking its cargo by force."
      murder: "Killing people, aboard a ship or on the ground."
      theft: "Taking goods, a ship or a claim that is another's."
      smuggling: "Trading in its markets what its trade bans forbid."
      zoning breach: "Building or working on a parcel what its zone does not permit."
      unlicensed mining: "Digging a deposit in its jurisdiction without its licence."
      reckless flying: "Endangering a port or a gate: too fast through its approaches, a collision at its pads."
      fraud: "Selling what one does not own, or not what one says."
      evasion: "Not paying what it levies."
  penalty:
    description: "What the law does about a breach. Fines and bounties are shares of what was at stake, never a sum: the registry holds no prices."
    enum: [warning, fine, forfeiture, gaol, outlawry, bounty]
    x-values:
      warning: "Recorded; nothing taken."
      fine: "A share of the goods or the value at stake, paid to the administration."
      forfeiture: "The goods, the ship or the claim taken."
      gaol: "Held, for a term."
      outlawry: "Loses the protection of the law and the right to dock wherever the administration reaches, until pardoned."
      bounty: "A reward for whoever brings the offender or the offender's ship in: a share of that ship's worth."
  jurisdiction:
    description: "How far an administration's law reaches."
    enum: [system, settlements]
    x-values:
      system: "Everywhere in its star system: its patrols go where its ships go."
      settlements: "Its settlements and their approaches only; the rest of the system is nobody's."
  fleet_job:
    description: "What an organisation's fleet does, for the operator that flies it."
    enum: [hauling, passage, mining, patrol, raiding]
    x-values:
      hauling: "Freight on the runs between settlements: the supply runs and the works' inputs."
      passage: "People on a timetable, and anyone who books."
      mining: "Prospecting and digging the fields, selling at the home port."
      patrol: "The law's craft: answering breaches in the approaches, escorting when asked."
      raiding: "Sorties from a hold against lone, laden prey; home when a patrol comes out."
