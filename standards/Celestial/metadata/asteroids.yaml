# yaml-language-server: $schema=../schema/asteroids.schema.yaml
# How asteroids lie in a system: the Sun's, as the measure for every other. A system's own belts are
# worked out from these and its planets (see each system's page). The game's fields are a
# simplification of this (see the note on the Celestial Registry's page); the engine is to follow.
key: seeding.asteroids
main_belt:
  inner_resonance: "4:1"
  outer_resonance: "2:1"
  inner_edge: 2.06
  outer_edge: 3.27
  no_giant_inner: 0.8
  no_giant_outer: 1.3
  count_over_1km: 1200000
  count_over_100km: 200
  mass: 2.39e+21
  spacing: 965600
  family_share: 0.34
  families: 25
trojans:
  count_over_1km: 1000000
  spread: 26
  mass_share: 0.2
  giant_mass: 1.898e+27
outer_belt:
  inner_resonance: "3:2"
  outer_resonance: "2:1"
  inner_edge: 39.5
  outer_edge: 48
  count_over_100km: 100000
  mass: 0.0197
  thickness: 10
moons:
  share: 0.02
  share_outer: 0.11
  separation_least: 300
  separation_most: 3000
sizes:
  exponent: 1.89
  smallest: 15
  comet_density: 600
zones:
  warm_to: 0.93
  frost_to: 1.04
basis:
  - { of: [main_belt], tier: sourced, source: "https://en.wikipedia.org/wiki/Asteroid_belt", note: "Mass 2.39e21 kg (3% of the Moon's); 700,000 to 1.7 million over 1 km (the middle taken); over 200 above 100 km; 965,600 km apart on average; edges at the 4:1 and 2:1 resonances with Jupiter." }
  - { of: [main_belt.family_share, main_belt.families], tier: sourced, source: "https://en.wikipedia.org/wiki/Asteroid_family", note: "33 to 35% are family members; 20 to 30 families reliably recognised. A family lasts about a billion years." }
  - { of: [main_belt.no_giant_inner, main_belt.no_giant_outer], tier: invented, source: "the game: crates/world/src/belt.rs", note: "Chosen in the game: with no giant to stir it, a belt stays round the frost line." }
  - { of: [trojans], tier: sourced, source: "https://en.wikipedia.org/wiki/Jupiter_trojan", note: "About a million over 1 km; each swarm stretches about 26 degrees along the orbit; a fifth of the belt's mass." }
  - { of: [outer_belt], tier: sourced, source: "https://en.wikipedia.org/wiki/Kuiper_belt", note: "From the 3:2 resonance with Neptune at 39.5 AU to the 2:1 at about 48; over 100,000 above 100 km; 0.0197 Earth masses; as much as ten degrees off the plane." }
  - { of: [moons], tier: sourced, source: "https://en.wikipedia.org/wiki/Minor-planet_moon", note: "An estimated 2% of asteroids have satellites, and 11% of the objects past Neptune; the two are from a few hundred to over 3,000 km apart." }
  - { of: [sizes.exponent], tier: derived, note: "From the belt's two counts: 1.2 million over 1 km and 200 over 100 km." }
  - { of: [sizes.smallest], tier: sourced, source: "the game: crates/world/src/belt.rs, SMALLEST" }
  - { of: [zones], tier: derived, source: "https://en.wikipedia.org/wiki/Asteroid_belt", note: "The Sun's frost line is at 2.7 AU; stony asteroids are commoner within 2.5 AU; the belt's middle ends at the gap at 2.82 AU." }
  - { of: [sizes.comet_density], tier: sourced, source: "https://en.wikipedia.org/wiki/Comet_nucleus", note: "Known comets average 0.6 g/cm3: Halley 0.6, Tempel 1 0.62, 67P 0.4. Highly porous." }
  - { of: [trojans.giant_mass], tier: invented, review: true, note: "A guess, to be reviewed: that a giant holds trojans in proportion to its mass. Only Jupiter's count is known." }
