# yaml-language-server: $schema=../../schema/seeding.schema.yaml
# What a place does to what is there. Worked out for each moon of a giant, on its page.
identity:
  key: seeding.conditions
  name: Conditions
  about: "What a place does to what is there: a moon kneaded by its planet, the radiation round a giant. Worked out for each moon of a giant."
tidal_heating:
  love_over_q: 0.015
  volcanic_above: 1.0
  sea_above: 0.03
radiation_belt:
  dose: 0.000416666666666667
  at: 5.9
  falls_as: 4.07
  giant_mass: 1.898e+27
  deadly_above: 1.15740740740741e-05
basis:
  - { of: [tidal_heating], tier: invented, review: true, note: "A guess, to be reviewed: a value near what is reported for Io, used for every moon; and the two thresholds, set near Io's heat (about 2 W/m2) and Europa's. No source was fetched for these." }
  - { of: [radiation_belt.dose, radiation_belt.at], tier: sourced, source: "https://en.wikipedia.org/wiki/Magnetosphere_of_Jupiter", note: "3,600 rem a day at Io, which goes round Jupiter at 5.9 of its radii." }
  - { of: [radiation_belt.falls_as], tier: derived, source: "https://en.wikipedia.org/wiki/Magnetosphere_of_Jupiter", note: "From the two doses given: 3,600 rem a day at Io and 540 at Europa (9.4 radii)." }
  - { of: [radiation_belt.giant_mass, radiation_belt.deadly_above], tier: invented, review: true, note: "A guess, to be reviewed: that a giant's belt is as strong as its mass against Jupiter's, and the dose called deadly." }
