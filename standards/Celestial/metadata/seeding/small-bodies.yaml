# yaml-language-server: $schema=../../schema/seeding.schema.yaml
# How a system's small bodies are seeded: the figures the engine's seeder holds (crates/core/world/src/small_bodies.rs, belts.rs),
# moved here so that they are the registry's and not the code's. Where a figure is given as least and most, the seeder draws between.
identity:
  key: seeding.small-bodies
  name: How small bodies are seeded
  about: "A belt's largest body, the asteroids that cross inward, moons caught by giants, centaurs, the outer belt's dwarf planets and the comets: how many of each, how big, and on what orbits."
largest_body:
  share: 0.39
  position: 0.25
  eccentricity: [0.03, 0.12]
  tilt: [1.0, 11.0]
  round_above: 400000.0
crossing:
  count: 5
  nearest: [0.6, 1.25]
  farthest_if_inside: [1.3, 2.2]
  tilt: [1.0, 25.0]
  radius: [100.0, 1500.0]
captured:
  count_gas_giant: [2, 4]
  count_other: [1, 2]
  backward: 0.6
  eccentricity: [0.1, 0.5]
  tilt_forward: [25.0, 55.0]
  tilt_backward: [140.0, 175.0]
  radius: [1000.0, 60000.0]
  nearest: 0.05
  beyond_moons: 1.5
  farthest: 0.47
  primitive: 0.7
centaurs:
  count: 3
  inner: 1.15
  outer: 0.9
  eccentricity: [0.1, 0.5]
  tilt: [2.0, 25.0]
  radius: [10000.0, 120000.0]
outer_dwarfs:
  sun: 200
  most: 3
  eccentricity: [0.03, 0.25]
  tilt: [1.0, 28.0]
  radius: [450000.0, 1200000.0]
returning_comets:
  count: 4
  nearest: [0.3, 2.5]
  farthest: [0.9, 2.2]
  tilt: [2.0, 35.0]
  radius: [750.0, 2500.0]
cloud_comet:
  nearest: [0.3, 2.5]
  orbit: [299195741400000.0, 2991957414000000.0]
  tilt: [0.0, 180.0]
  radius: [2000.0, 10000.0]
spin:
  rock: [8280.0, 108000.0]
  round: [18000.0, 108000.0]
belt_rocks:
  main_tilt: 9.0
  trojan_tilt: 10.0
  trojan_width: 0.05
  per_patch: 64
  largest: 200000.0
  most_eccentric: 0.2
  rubble_above: 100.0
basis:
  - { of: [largest_body, crossing, captured, centaurs, outer_dwarfs, returning_comets, cloud_comet, spin], tier: sourced, review: true, source: "the game: crates/core/world/src/small_bodies.rs", note: "The seeder's own figures, as it draws them, moved here. They were the registry's seeder's first (celestial_seed.py), chosen to follow what is known of the Sun's small bodies." }
  - { of: [belt_rocks], tier: sourced, review: true, source: "the game: crates/core/world/src/belts.rs, small_bodies.rs", note: "The engine's own figures, moved here: the two tilts and the swarm's width as its note of 2026-10-04 gives them." }
