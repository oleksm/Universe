# yaml-language-server: $schema=../../schema/rock-class.schema.yaml
# Not in the game yet. A kind of asteroid there is, recorded as far as sources go: what is not
# written here is not known to the registry, and is not made up.
identity:
  key: rock-class.enstatite
  name: Enstatite
  letter: E-type
  about: "Rock that formed close to the star, with almost no oxygen to spare: its iron is metal or sulphide, not oxide. Bright."
physical:
  density_rubble: 2600
  density_monolith: 3600
  albedo: 0.45
  colour: [0.82, 0.8, 0.76]
composition:
  sulphide: [0.08, 0.15]
  titanium: [0.0004, 0.0006]
found:
  warm: 0.05
  falls: 0.016
basis:
  - { of: [physical.density_rubble, physical.density_monolith], tier: invented, review: true, note: "A guess, to be reviewed. Dry silicate with a good deal of metal: a little heavier than stony." }
  - { of: [found.warm], tier: invented, review: true, source: "https://en.wikipedia.org/wiki/Asteroid_belt", note: "A guess, to be reviewed, made to follow what is known: enstatite asteroids are found in the innermost region of the belt, and are thought to have formed near the centre of the nebula. The shares themselves are chosen." }
  - { of: [found.falls], tier: sourced, source: "https://en.wikipedia.org/wiki/Meteorite_fall_statistics", note: "Enstatite chondrites: 1.6% of classified falls." }
  - { of: [physical.albedo, physical.colour], tier: invented, review: true, note: "Chosen, so the game can draw it: pale grey: the brightest asteroids are of this kind. Its brightness is from memory of such asteroids, not from a source. To be reviewed." }
  - { of: [composition.sulphide, composition.titanium], tier: sourced, review: true, source: "the planet simulation: docs/registry-reply.md of 2026-10-05, 'Composition ranges proposed for the new fields'", note: "Proposed by the planet simulation, from the meteorites that stand for the class. Enstatite chondrites: sulphides 8 to 15% (Keil 1968; Weisberg and Kimura 2012). Its sources are as it cites them: not read by the registry." }
