# yaml-language-server: $schema=../../schema/rock-class.schema.yaml
# Not in the game yet. A kind of asteroid there is, recorded as far as sources go: what is not
# written here is not known to the registry, and is not made up.
identity:
  key: rock-class.primitive
  name: Primitive
  letter: D-type
  about: "Very dark, reddish bodies of the cold outer system, rich in organic compounds and ices. Most of a giant's trojans are these."
physical:
  density_rubble: 900
  density_monolith: 1700
  albedo: 0.056
found:
  cold: 0.0
  trojans: 0.7
basis:
  - { of: [physical.density_rubble, physical.density_monolith], tier: invented, review: true, note: "A guess, to be reviewed. Dark, porous, icy rock: the trojans' measured densities run from 800 to 2,500." }
  - { of: [found.trojans], tier: invented, review: true, source: "https://en.wikipedia.org/wiki/Jupiter_trojan", note: "A guess, to be reviewed, made to follow what is known: the Jupiter trojans mostly are D-type asteroids. The share is chosen." }
  - { of: [physical.albedo], tier: sourced, source: "https://en.wikipedia.org/wiki/Jupiter_trojan", note: "The Jupiter trojans' average, for those over 57 km. Their densities run from 800 to 2,500 kg/m3." }
