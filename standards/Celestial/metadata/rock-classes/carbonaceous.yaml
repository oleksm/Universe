# yaml-language-server: $schema=../../schema/rock-class.schema.yaml
# What it is and what it yields: as the game's code has it (a test holds the two together).
# Where it is found: the spec, from what is known of the Sun's asteroids. The game's own odds differ.
identity:
  key: rock-class.carbonaceous
  label: "C-TYPE CARBONACEOUS"
  name: Carbonaceous
  letter: C-type
  about: "Clays with water bound in, carbon and organics. Coal-dark."
physical:
  density_rubble: 1300
  density_monolith: 2100
  albedo: 0.05
  colour: [0.42, 0.4, 0.38]
composition:
  water: [0.05, 0.2]
  organics: [0.02, 0.06]
  metal: [0.02, 0.02]
  pgm: [2.0e-07, 1.0e-06]
  sulphide: [0.04, 0.12]
  titanium: [0.0004, 0.0009]
found:
  warm: 0.12
  frost_line: 0.7
  cold: 0.9
  trojans: 0.15
  falls: 0.044
mining:
  cut_energy: 30000
  yields: good.carbonaceous-ore
basis:
  - { of: [physical, composition, mining], tier: sourced, source: "the game: crates/world/src/belt.rs, mining.rs", note: "As the game has it. Its own figures were chosen." }
  - { of: [found.warm, found.frost_line, found.cold], tier: invented, review: true, source: "https://en.wikipedia.org/wiki/Asteroid_belt", note: "A guess, to be reviewed, made to follow what is known: carbonaceous asteroids dominate the belt's outer regions and are rare in the inner belt; over 75% of those seen. The shares themselves are chosen." }
  - { of: [found.falls], tier: sourced, source: "https://en.wikipedia.org/wiki/Meteorite_fall_statistics", note: "Carbonaceous chondrites: 4.4% of 1,062 classified falls." }
  - { of: [found.trojans], tier: invented, review: true, note: "A guess, to be reviewed." }
  - { of: [composition.sulphide, composition.titanium], tier: sourced, review: true, source: "the planet simulation: docs/registry-reply.md of 2026-10-05, 'Composition ranges proposed for the new fields'", note: "Proposed by the planet simulation, from the meteorites that stand for the class. CI to CV chondrites: sulphur 2 to 5.4%, as iron sulphide 4 to 12%; titanium 440 to 900 ppm (Lodders 2003; Wasson and Kallemeyn 1988). Its sources are as it cites them: not read by the registry." }
