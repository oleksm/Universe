# yaml-language-server: $schema=../../schema/rock-class.schema.yaml
# What it is and what it yields: as the game's code has it (a test holds the two together).
# Where it is found: the spec, from what is known of the Sun's asteroids. The game's own odds differ.
identity:
  key: rock-class.stony
  label: "S-TYPE STONY"
  name: Stony
  letter: S-type
  about: "Silicates with nickel-iron grains."
physical:
  density_rubble: 2300
  density_monolith: 3300
  albedo: 0.22
  colour: [0.72, 0.6, 0.45]
composition:
  metal: [0.1, 0.3]
  pgm: [1.0e-06, 6.0e-06]
  sulphide: [0.05, 0.06]
  titanium: [0.00055, 0.00065]
found:
  warm: 0.68
  frost_line: 0.15
  cold: 0.02
  falls: 0.8
mining:
  cut_energy: 60000
  yields: good.stony-ore
basis:
  - { of: [physical, composition, mining], tier: sourced, source: "the game: crates/world/src/belt.rs, mining.rs", note: "As the game has it. Its own figures were chosen." }
  - { of: [found.warm, found.frost_line, found.cold], tier: invented, review: true, source: "https://en.wikipedia.org/wiki/Asteroid_belt", note: "A guess, to be reviewed, made to follow what is known: stony asteroids are commoner within 2.5 AU of the Sun; about 17% of all. The shares themselves are chosen." }
  - { of: [found.falls], tier: sourced, source: "https://en.wikipedia.org/wiki/Meteorite_fall_statistics", note: "Ordinary chondrites: 80.0% of classified falls." }
  - { of: [composition.sulphide, composition.titanium], tier: sourced, review: true, source: "the planet simulation: docs/registry-reply.md of 2026-10-05, 'Composition ranges proposed for the new fields'", note: "Proposed by the planet simulation, from the meteorites that stand for the class. Ordinary chondrites: troilite 5 to 6% (Jarosewich 1990); titanium about 600 ppm (Wasson and Kallemeyn 1988). Its sources are as it cites them: not read by the registry." }
