$schema: http://json-schema.org/draft-07/schema#
title: Seeding
x-kind: [seeding]
description: 'standards/Celestial/metadata/seeding/<name>.yaml: one set of the settings the seed makes the world by: the galaxy as a whole, how asteroids lie, what a place does to what is there. Not laws of nature (those are Dogma''s): how this world is made. A record has the groups that are its own.'
type: object
additionalProperties: false
required: [identity]
properties:
  identity:
    type: object
    additionalProperties: false
    required: [key, name]
    properties:
      key: { $ref: "../../common.schema.yaml#/definitions/key" }
      name: { type: string }
      about: { type: string }
  galaxy:
    description: "The seeded world as a whole. The seed makes every star and system by these; a system or body that has a record of its own is taken from the record."
    type: object
    additionalProperties: false
    required: [seed, home]
    properties:
      seed: { type: integer, description: The number the whole world is made from. }
      home: { type: string, x-ref: [system], description: The home system, by its key. }
      region: { type: number, x-unit: "m", description: "m, the side of the charted region (a cube round home)" }
      star_density: { type: number, x-unit: "1/m3", description: "stars for each cubic metre" }
      sector: { type: number, x-unit: "m", description: "m, the side of the cubes the stars are made in" }
      class_mix: { type: object, additionalProperties: false, description: "The share of stars of each spectral class, by number.", properties: { O: { type: number, x-unit: "1" }, B: { type: number, x-unit: "1" }, A: { type: number, x-unit: "1" }, F: { type: number, x-unit: "1" }, G: { type: number, x-unit: "1" }, K: { type: number, x-unit: "1" }, M: { type: number, x-unit: "1" } } }
  main_belt:
    description: "The belt inside the first gas giant, between two of its resonances. As the Sun's."
    type: object
    additionalProperties: false
    properties:
      inner_resonance: { type: string, description: "The resonance with the giant at its inner edge (asteroid's turns to the giant's)." }
      outer_resonance: { type: string, description: "And at its outer edge." }
      inner_edge: { type: number, x-unit: "m", description: "m, the Sun's" }
      outer_edge: { type: number, x-unit: "m", description: "m, the Sun's" }
      no_giant_inner: { type: number, x-unit: "1", description: "with no giant: its inner edge, as a share of the frost line's distance" }
      no_giant_outer: { type: number, x-unit: "1", description: "with no giant: its outer edge, as a share of the frost line's distance" }
      count_over_1km: { type: number, x-unit: "1", description: "asteroids over 1 km across, the Sun's" }
      count_over_100km: { type: number, x-unit: "1", description: "over 100 km across, the Sun's" }
      mass: { type: number, x-unit: "kg", description: "kg, all of it, the Sun's" }
      spacing: { type: number, x-unit: "m", description: "m between one asteroid and the next, on average" }
      family_share: { type: number, x-unit: "1", description: "the share of asteroids that belong to a family (the pieces of one broken body)" }
      families: { type: number, x-unit: "1", description: "families in the belt" }
  trojans:
    description: "The two swarms that share a giant's orbit, 60 degrees ahead of it and behind."
    type: object
    additionalProperties: false
    properties:
      count_over_1km: { type: number, x-unit: "1", description: "asteroids over 1 km across in a giant's two swarms, Jupiter's" }
      spread: { type: number, x-unit: "deg", description: "degrees along the orbit each swarm stretches" }
      mass_share: { type: number, x-unit: "1", description: "their mass as a share of the main belt's" }
      giant_mass: { type: number, x-unit: "kg", description: "kg, Jupiter's: a giant's swarms are taken to hold as many as its mass against this" }
  outer_belt:
    description: "The icy belt past the outermost giant, between two of its resonances."
    type: object
    additionalProperties: false
    properties:
      inner_resonance: { type: string }
      outer_resonance: { type: string }
      inner_edge: { type: number, x-unit: "m", description: "m, the Sun's" }
      outer_edge: { type: number, x-unit: "m", description: "m, the Sun's" }
      count_over_100km: { type: number, x-unit: "1", description: "objects over 100 km across, the Sun's" }
      mass: { type: number, x-unit: "kg", description: "kg, the Sun's" }
      thickness: { type: number, x-unit: "deg", description: "degrees either side of the system's plane" }
  moons:
    description: "Asteroids that have another going round them."
    type: object
    additionalProperties: false
    properties:
      share: { type: number, x-unit: "1", description: "the share of asteroids that have a moon" }
      share_outer: { type: number, x-unit: "1", description: "the share in the outer belt" }
      separation_least: { type: number, x-unit: "m", description: "m between the two, the least known" }
      separation_most: { type: number, x-unit: "m", description: "m, the most" }
  sizes:
    type: object
    additionalProperties: false
    properties:
      exponent: { type: number, x-unit: "1", description: "how fast their number rises as their size falls: the number over a size goes as the size to minus this" }
      smallest: { type: number, x-unit: "m", description: "m, the smallest the game makes" }
      comet_density: { type: number, x-unit: "kg/m3", description: "kg/m3, a comet's solid part: ice full of holes" }
  zones:
    description: "Where a body formed, by its distance against the frost line's. What it is made of goes by this."
    type: object
    additionalProperties: false
    properties:
      warm_to: { type: number, x-unit: "1", description: "the warm zone reaches this share of the frost line's distance" }
      frost_to: { type: number, x-unit: "1", description: "the frost-line zone from there to this share; the cold zone beyond" }
  tidal_heating:
    description: "Heat made inside a moon as its planet kneads it: 21/2 (k2/Q) G M^2 R^5 n e^2 / a^6."
    type: object
    additionalProperties: false
    properties:
      love_over_q: { type: number, x-unit: "1", description: "how readily a moon's inside turns the kneading into heat (k2 over Q)" }
      volcanic_above: { type: number, x-unit: "W/m2", description: "W for each m2 of its surface above which it is volcanic" }
      sea_above: { type: number, x-unit: "W/m2", description: "W/m2 above which an icy one may keep a buried sea" }
  radiation_belt:
    description: "The dose round a gas giant, falling off with distance."
    type: object
    additionalProperties: false
    properties:
      dose: { type: number, x-unit: "Sv/s", description: "Sv/s at the distance below, round a giant of Jupiter's mass" }
      at: { type: number, x-unit: "1", description: "that distance, in the giant's radii" }
      falls_as: { type: number, x-unit: "1", description: "the dose goes as the distance to minus this" }
      giant_mass: { type: number, x-unit: "kg", description: "kg, Jupiter's: the dose is taken to go with the giant's mass" }
      deadly_above: { type: number, x-unit: "Sv/s", description: "Sv/s above which a person unshielded dies within days" }
  largest_body:
    description: "A belt's largest body."
    type: object
    additionalProperties: false
    properties:
      share: { type: number, x-unit: "1", description: "the share of the belt's mass it holds" }
      position: { type: number, x-unit: "1", description: "it lies no nearer either edge of the belt than this share of the belt's width" }
      eccentricity: { type: array, items: { type: number }, minItems: 2, maxItems: 2, x-unit: "1", description: "least and most" }
      tilt: { type: array, items: { type: number }, minItems: 2, maxItems: 2, x-unit: "deg", description: "least and most" }
      round_above: { type: number, x-unit: "m", description: "m of radius above which it is round, a dwarf planet" }
  crossing:
    description: "Asteroids knocked out of the belt onto orbits that come in among the rocky planets."
    type: object
    additionalProperties: false
    properties:
      count: { type: number, x-unit: "1", description: "how many, where there is a rocky planet inside the belt" }
      nearest: { type: array, items: { type: number }, minItems: 2, maxItems: 2, x-unit: "1", description: "its nearest to the star, as a share of a rocky planet's orbit" }
      farthest_if_inside: { type: array, items: { type: number }, minItems: 2, maxItems: 2, x-unit: "1", description: "its farthest, as a multiple of its nearest, where the belt lies inside that" }
      tilt: { type: array, items: { type: number }, minItems: 2, maxItems: 2, x-unit: "deg", description: "least and most" }
      radius: { type: array, items: { type: number }, minItems: 2, maxItems: 2, x-unit: "m", description: "least and most, drawn evenly by its logarithm" }
  captured:
    description: "Moons caught by a giant: far out, tilted, stretched, most going round backward."
    type: object
    additionalProperties: false
    properties:
      count_gas_giant: { type: array, items: { type: number }, minItems: 2, maxItems: 2, x-unit: "1", description: "least and most round a gas giant" }
      count_other: { type: array, items: { type: number }, minItems: 2, maxItems: 2, x-unit: "1", description: "least and most round another giant" }
      backward: { type: number, x-unit: "1", description: "the chance one goes round backward" }
      eccentricity: { type: array, items: { type: number }, minItems: 2, maxItems: 2, x-unit: "1", description: "least and most" }
      tilt_forward: { type: array, items: { type: number }, minItems: 2, maxItems: 2, x-unit: "deg", description: "least and most, going forward" }
      tilt_backward: { type: array, items: { type: number }, minItems: 2, maxItems: 2, x-unit: "deg", description: "least and most, going backward" }
      radius: { type: array, items: { type: number }, minItems: 2, maxItems: 2, x-unit: "m", description: "least and most, drawn evenly by its logarithm" }
      nearest: { type: number, x-unit: "1", description: "no nearer than this share of the giant's reach (its Hill radius)" }
      beyond_moons: { type: number, x-unit: "1", description: "nor nearer than this many times its farthest own moon" }
      farthest: { type: number, x-unit: "1", description: "no farther than this share of the giant's reach" }
      primitive: { type: number, x-unit: "1", description: "the chance one is of the primitive class; the rest are carbonaceous" }
  centaurs:
    description: "Ice bodies wandering among the giants."
    type: object
    additionalProperties: false
    properties:
      count: { type: number, x-unit: "1", description: "how many, where there are two giants or more" }
      inner: { type: number, x-unit: "1", description: "no nearer than this multiple of the first giant's orbit" }
      outer: { type: number, x-unit: "1", description: "no farther than this multiple of the last giant's orbit" }
      eccentricity: { type: array, items: { type: number }, minItems: 2, maxItems: 2, x-unit: "1", description: "least and most" }
      tilt: { type: array, items: { type: number }, minItems: 2, maxItems: 2, x-unit: "deg", description: "least and most" }
      radius: { type: array, items: { type: number }, minItems: 2, maxItems: 2, x-unit: "m", description: "least and most, drawn evenly by its logarithm" }
  outer_dwarfs:
    description: "Dwarf planets of the outer belt."
    type: object
    additionalProperties: false
    properties:
      sun: { type: number, x-unit: "1", description: "how many the Sun's outer belt has; a system's by the ground its own covers" }
      most: { type: number, x-unit: "1", description: "the most that are made" }
      eccentricity: { type: array, items: { type: number }, minItems: 2, maxItems: 2, x-unit: "1", description: "least and most" }
      tilt: { type: array, items: { type: number }, minItems: 2, maxItems: 2, x-unit: "deg", description: "least and most" }
      radius: { type: array, items: { type: number }, minItems: 2, maxItems: 2, x-unit: "m", description: "least and most" }
  returning_comets:
    description: "Comets thrown in by the giants, that come back."
    type: object
    additionalProperties: false
    properties:
      count: { type: number, x-unit: "1", description: "how many, where there is a giant" }
      nearest: { type: array, items: { type: number }, minItems: 2, maxItems: 2, x-unit: "1", description: "its nearest to the star, as a multiple of the warm zone's edge" }
      farthest: { type: array, items: { type: number }, minItems: 2, maxItems: 2, x-unit: "1", description: "its farthest, as a multiple of the last giant's orbit" }
      tilt: { type: array, items: { type: number }, minItems: 2, maxItems: 2, x-unit: "deg", description: "least and most" }
      radius: { type: array, items: { type: number }, minItems: 2, maxItems: 2, x-unit: "m", description: "least and most" }
  cloud_comet:
    description: "The one comet from the far cloud."
    type: object
    additionalProperties: false
    properties:
      nearest: { type: array, items: { type: number }, minItems: 2, maxItems: 2, x-unit: "1", description: "its nearest to the star, as a multiple of the warm zone's edge" }
      orbit: { type: array, items: { type: number }, minItems: 2, maxItems: 2, x-unit: "m", description: "its orbit's half-width for a star of the Sun's mass, least and most; it goes with the cube root of the star's mass" }
      tilt: { type: array, items: { type: number }, minItems: 2, maxItems: 2, x-unit: "deg", description: "least and most: from any side" }
      radius: { type: array, items: { type: number }, minItems: 2, maxItems: 2, x-unit: "m", description: "least and most" }
  spin:
    description: "How long a small body's day is."
    type: object
    additionalProperties: false
    properties:
      rock: { type: array, items: { type: number }, minItems: 2, maxItems: 2, x-unit: "s", description: "least and most for a rock, drawn evenly by its logarithm" }
      round: { type: array, items: { type: number }, minItems: 2, maxItems: 2, x-unit: "s", description: "least and most for a round one" }
  belt_rocks:
    description: "How the engine lays out a belt's rocks."
    type: object
    additionalProperties: false
    properties:
      main_tilt: { type: number, x-unit: "deg", description: "the main belt's rocks' typical tilt" }
      trojan_tilt: { type: number, x-unit: "deg", description: "a trojan swarm's" }
      trojan_width: { type: number, x-unit: "1", description: "a swarm's rings lie within this share of its giant's orbit" }
      per_patch: { type: number, x-unit: "1", description: "about how many rocks a patch holds" }
      largest: { type: number, x-unit: "m", description: "m across, the largest rock a belt's size classes run to" }
      most_eccentric: { type: number, x-unit: "1", description: "the most any belt rock's orbit is stretched" }
      rubble_above: { type: number, x-unit: "m", description: "m of radius above which a rock is a rubble pile, not one piece" }
  traffic:
    description: "How many ships fly in a settled system at day 0, and whose. The supply and industrial runs, the passage line, the miners, the patrol and the raiders are derived from the records (tools/standards/census.py); the rest of the target are independents, owner-operators based at the ports by population: couriers, small traders, prospectors."
    type: object
    additionalProperties: false
    required: [ships, independents]
    properties:
      ships: { type: integer, minimum: 1, description: "the total the system is seeded with, fleets and independents together" }
      independents:
        description: "The hull mix of the independents, shares adding to 1."
        type: array
        items:
          type: object
          additionalProperties: false
          required: [hull, share]
          properties:
            hull: { type: string, x-ref: [hull] }
            share: { type: number, x-unit: "1" }
  trade_bans:
    description: "For a seeded settlement's market: what it may refuse to trade, and how likely it is to. Rolled in this order."
    type: array
    items:
      type: object
      additionalProperties: false
      required: [market, chance]
      properties:
        market: { type: string, x-ref: [market], description: "The market category, by its key." }
        chance: { type: number, x-unit: "1", minimum: 0, maximum: 1, description: "the chance a market bans it" }
  basis: { $ref: "../../common.schema.yaml#/definitions/basis" }
