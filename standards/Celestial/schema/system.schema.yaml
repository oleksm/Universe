$schema: http://json-schema.org/draft-07/schema#
title: System
description: 'standards/Celestial/metadata/systems/<name>.yaml: one star system. Its star, its bodies and its populations of small bodies are in the folder of the same name.'
type: object
additionalProperties: false
required: [identity, provenance]
properties:
  provenance: { $ref: "../../common.schema.yaml#/definitions/provenance" }
  identity:
    type: object
    additionalProperties: false
    required: [key, name]
    properties:
      key: { $ref: "../../common.schema.yaml#/definitions/key" }
      name: { type: string }
      index: { type: integer, description: "Its number among the seed's stars." }
      about: { type: string }
  position:
    type: object
    additionalProperties: false
    properties:
      from_home: { type: array, items: { type: number }, minItems: 3, maxItems: 3, description: "light years from the home star, [x, y, z] in the galaxy's frame" }
      distance: { type: number, description: "light years from the home star" }
