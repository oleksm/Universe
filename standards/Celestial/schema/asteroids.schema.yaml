$schema: http://json-schema.org/draft-07/schema#
title: Asteroids
description: 'standards/Celestial/metadata/asteroids.yaml: how asteroids lie in a system, from what is known of the Sun''s. Each system''s belts are worked out from these and from its own planets. Every asteroid is on an orbit of its own: round the star, or (a few) round a larger asteroid.'
type: object
additionalProperties: false
properties:
  main_belt:
    description: "The belt inside the first gas giant, between two of its resonances. As the Sun's."
    type: object
    additionalProperties: false
    properties:
      inner_resonance: { type: string, description: "The resonance with the giant at its inner edge (asteroid's turns to the giant's)." }
      outer_resonance: { type: string, description: "And at its outer edge." }
      inner_edge: { type: number, description: "AU, the Sun's" }
      outer_edge: { type: number, description: "AU, the Sun's" }
      no_giant_inner: { type: number, description: "with no giant: its inner edge, as a share of the frost line's distance" }
      no_giant_outer: { type: number, description: "with no giant: its outer edge, as a share of the frost line's distance" }
      count_over_1km: { type: number, description: "asteroids over 1 km across, the Sun's" }
      count_over_100km: { type: number, description: "over 100 km across, the Sun's" }
      mass: { type: number, description: "kg, all of it, the Sun's" }
      spacing: { type: number, description: "km between one asteroid and the next, on average" }
      family_share: { type: number, description: "the share of asteroids that belong to a family (the pieces of one broken body)" }
      families: { type: number, description: "families in the belt" }
  trojans:
    description: "The two swarms that share a giant's orbit, 60 degrees ahead of it and behind."
    type: object
    additionalProperties: false
    properties:
      count_over_1km: { type: number, description: "asteroids over 1 km across in a giant's two swarms, Jupiter's" }
      spread: { type: number, description: "degrees along the orbit each swarm stretches" }
      mass_share: { type: number, description: "their mass as a share of the main belt's" }
      giant_mass: { type: number, description: "kg, Jupiter's: a giant's swarms are taken to hold as many as its mass against this" }
  outer_belt:
    description: "The icy belt past the outermost giant, between two of its resonances."
    type: object
    additionalProperties: false
    properties:
      inner_resonance: { type: string }
      outer_resonance: { type: string }
      inner_edge: { type: number, description: "AU, the Sun's" }
      outer_edge: { type: number, description: "AU, the Sun's" }
      count_over_100km: { type: number, description: "objects over 100 km across, the Sun's" }
      mass: { type: number, description: "Earth masses, the Sun's" }
      thickness: { type: number, description: "degrees either side of the system's plane" }
  moons:
    description: "Asteroids that have another going round them."
    type: object
    additionalProperties: false
    properties:
      share: { type: number, description: "the share of asteroids that have a moon" }
      share_outer: { type: number, description: "the share in the outer belt" }
      separation_least: { type: number, description: "km between the two, the least known" }
      separation_most: { type: number, description: "km, the most" }
  sizes:
    type: object
    additionalProperties: false
    properties:
      exponent: { type: number, description: "how fast their number rises as their size falls: the number over a size goes as the size to minus this" }
      smallest: { type: number, description: "m, the smallest the game makes" }
      comet_density: { type: number, description: "kg/m3, a comet's solid part: ice full of holes" }
  zones:
    description: "Where a body formed, by its distance against the frost line's. What it is made of goes by this."
    type: object
    additionalProperties: false
    properties:
      warm_to: { type: number, description: "the warm zone reaches this share of the frost line's distance" }
      frost_to: { type: number, description: "the frost-line zone from there to this share; the cold zone beyond" }
  basis: { $ref: "../../common.schema.yaml#/definitions/basis" }
