$schema: http://json-schema.org/draft-07/schema#
title: Deposit type
x-kind: [deposit-type]
description: "standards/Celestial/metadata/deposit-types/<name>.yaml: one kind of ore deposit, as the planet simulation makes it: what event forms it, what it carries and how rich, how big, how its deposits cluster, and what a survey sees of it. The shared word: each deposit on a world (where, how much) is the simulation's, not the registry's."
type: object
additionalProperties: false
required: [identity, formed_by, carries]
properties:
  identity:
    type: object
    additionalProperties: false
    required: [key, name]
    properties:
      key: { $ref: "../../common.schema.yaml#/definitions/key" }
      name: { type: string }
      about: { type: string }
  sim:
    description: "The planet simulation's own words for it: they are added to, never renamed."
    type: object
    additionalProperties: false
    properties:
      key: { type: string, description: "Its key there." }
      code: { type: string, description: "Its short code there, as in a deposit's id (PCU)." }
  formed_by: { $ref: "../../dictionary.schema.yaml#/definitions/geological_event" }
  carries:
    description: "What it is mined for, and a typical grade of each."
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [item, grade]
      properties:
        item: { type: string, x-ref: [element, good], description: "What is won from it, by its key." }
        grade: { type: number, x-unit: "1", description: "kg of it in each kg of ore, typically" }
        said_as: { type: string, description: "The simulation's own name and unit for it (Cu %, Au g/t), where ours differs." }
        split:
          description: "How the item divides by mass into the elements it stands for (platinum-group metals, rare-earth oxides): shares summing to 1."
          type: array
          items:
            type: object
            additionalProperties: false
            required: [share]
            properties:
              item: { type: string, x-ref: [element, good], description: "The element (or good), by its key; left out for the rest ('others')." }
              share: { type: number, minimum: 0, maximum: 1, x-unit: "1", description: "its share by mass" }
              said_as: { type: string, description: "The simulation's name for it (Pt, Ce, others)." }
  offshore: { type: boolean, description: "It lies under the sea." }
  ore: { type: string, x-ref: [good], description: "The good its ore is, as dug, by its key." }
  size:
    type: object
    additionalProperties: false
    properties:
      median: { type: number, x-unit: "kg", description: "kg of ore in a deposit of middling size" }
      spread: { type: number, x-unit: "1", description: "how widely sizes spread about that: the standard deviation of the natural logarithm of size" }
      cap: { type: number, x-unit: "kg", description: "kg, the most a deposit of the type holds: about the largest known on Earth" }
  shape: { $ref: "../../dictionary.schema.yaml#/definitions/deposit_shape" }
  footprint:
    description: "How big a middling one is on the ground."
    type: object
    additionalProperties: false
    properties:
      length: { type: number, x-unit: "m", description: "m along its strike" }
      width: { type: number, x-unit: "m", description: "m across it" }
  forms_at: { type: number, x-unit: "m", description: "m below the ground it forms at; erosion brings it up" }
  body_height: { type: number, x-unit: "m", description: "m, the ore body's vertical extent" }
  rate: { type: number, minimum: 0, x-unit: "1", description: "deposits the simulation places per unit of ore chance (its own scale)" }
  host_units: { type: array, items: { type: string, x-ref: [rock-unit] }, description: "The rock units it forms on (a weathering, setting or impact type); empty or left out: any land." }
  setting: { type: string, description: "The setting it forms in, in the simulation's words (old crust, young basins and climate...)." }
  impact:
    description: "For an impact type: which craters make it, and where in them."
    type: object
    additionalProperties: false
    properties:
      min_diameter: { type: number, exclusiveMinimum: 0, x-unit: "m", description: "m, the smallest crater that can hold one" }
      chance: { type: number, minimum: 0, maximum: 1, x-unit: "1", description: "the chance a qualifying crater holds any" }
      depth: { type: number, minimum: 0, x-unit: "1", description: "the ore's depth as a share of the crater's diameter" }
      per_crater: { type: number, minimum: 0, x-unit: "1", description: "deposits in a crater that holds any (a Poisson mean)" }
      radial_range: { type: array, minItems: 2, maxItems: 2, items: { type: number, minimum: 0, x-unit: "1" }, description: "where they lie, as shares of the crater's radius from its centre" }
      dry_world: { type: number, minimum: 0, x-unit: "1", description: "its chance multiplied by this on a world without water" }
  cluster:
    description: "How its deposits group into a district, stretched along the grain of the belt."
    type: object
    additionalProperties: false
    properties:
      deposits: { type: number, x-unit: "1", description: "deposits in a district, typically" }
      along: { type: number, x-unit: "m", description: "m they spread along the grain" }
      across: { type: number, x-unit: "m", description: "m they spread across it" }
  seen_by:
    description: "The survey methods that respond to it, each down to its reach."
    type: array
    items:
      type: object
      additionalProperties: false
      required: [method, reach]
      properties:
        method: { $ref: "../../dictionary.schema.yaml#/definitions/survey_method" }
        reach: { type: number, x-unit: "m", description: "m below the ground it still shows" }
  counted:
    description: "How many the simulation's test world has, against how many are known on Earth: a check on the simulation, not a rule."
    type: object
    additionalProperties: false
    properties:
      test_world: { type: number, x-unit: "1", description: "deposits in test world 4" }
      earth: { type: number, x-unit: "1", description: "about how many are known on Earth" }
  revision:
    $ref: "../../common.schema.yaml#/definitions/record_revision"
    default: { status: draft, owner: registry, on_conflict: propose, because: "The simulation's deposit types as of its first brief: the kinds and the record's fields are stable, the counts and sizes are from one test world and will move.", ask: docs/geology-registry-note.md }
  basis: { $ref: "../../common.schema.yaml#/definitions/basis" }
