$schema: http://json-schema.org/draft-07/schema#
title: Galaxy
description: 'standards/Celestial/metadata/galaxy.yaml: the seeded world as a whole. The seed makes every star and system by the laws below; a system or body that has a record of its own here is taken as written instead.'
type: object
additionalProperties: false
required: [seed, home]
properties:
  seed: { type: integer, description: The number the whole world is made from. }
  home: { type: string, description: The home system, by name. }
  region: { type: number, description: "light years, the side of the charted region (a cube round home)" }
  star_density: { type: number, description: "stars for each cubic light year" }
  sector: { type: number, description: "light years, the side of the cubes the stars are made in" }
  class_mix: { type: object, description: "The share of stars of each class, by number.", additionalProperties: { type: number } }
  note: { type: string }
