$schema: http://json-schema.org/draft-07/schema#
title: Region
description: 'standards/Celestial/metadata/systems/<system>/regions/<name>.yaml: a part of a system where many small bodies lie, that the game does not make yet: its scattered disc, its far cloud, a comet''s meteoroid stream.'
type: object
additionalProperties: false
required: [identity, provenance]
properties:
  provenance: { $ref: "../../common.schema.yaml#/definitions/provenance" }
  identity:
    type: object
    additionalProperties: false
    required: [key, name, kind]
    properties:
      key: { $ref: "../../common.schema.yaml#/definitions/key" }
      name: { type: string }
      kind: { enum: [scattered disc, far cloud, meteoroid stream] }
      parent: { type: string, description: "For a meteoroid stream: the comet that sheds it." }
      about: { type: string }
  extent:
    type: object
    additionalProperties: false
    properties:
      inner: { type: number, description: "AU from the star, its nearest" }
      outer: { type: number, description: "AU, its farthest" }
