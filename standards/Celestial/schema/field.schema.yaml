$schema: http://json-schema.org/draft-07/schema#
title: Asteroid field
description: 'standards/Celestial/metadata/systems/<system>/fields/<name>.yaml: one field of asteroids: a family round a named rock.'
type: object
additionalProperties: false
required: [identity, provenance]
properties:
  provenance: { $ref: "../../common.schema.yaml#/definitions/provenance" }
  identity:
    type: object
    additionalProperties: false
    required: [key, name]
    properties:
      key: { $ref: "../../common.schema.yaml#/definitions/key" }
      name: { type: string }
      kind: { enum: [family, trojan, outer], description: "family: a collisional family in the main belt. trojan: a group sharing a giant's orbit, ahead of it or behind. outer: a family in the icy belt past the giants." }
      anchor: { type: string, description: "The named asteroid it gathers round." }
      about: { type: string }
  rocks:
    type: object
    additionalProperties: false
    properties:
      class: { type: string, description: "What its rocks are made of, by their spectrum." }
      count: { type: integer, description: How many rocks it has. }
      extent: { type: number, description: "km, how far it spreads round its anchor" }
