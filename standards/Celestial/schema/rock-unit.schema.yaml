$schema: http://json-schema.org/draft-07/schema#
title: Rock unit
x-kind: [rock-unit]
description: "standards/Celestial/metadata/rock-units/<name>.yaml: one kind of rock a world's crust is mapped in, as the planet simulation makes it. The shared word for it: where each lies on a world is the simulation's to say, not the registry's."
type: object
additionalProperties: false
required: [identity]
properties:
  identity:
    type: object
    additionalProperties: false
    required: [key, name]
    properties:
      key: { $ref: "../../common.schema.yaml#/definitions/key" }
      name: { type: string }
      about: { type: string }
  sim:
    description: "The planet simulation's own word for it."
    type: object
    additionalProperties: false
    properties:
      key: { type: string, description: "Its key there." }
      index: { type: integer, minimum: 0, description: "Its index in the sim's unit table (geology.UNITS): the number the rock arrays hold. Frozen." }
      colour: { type: array, minItems: 3, maxItems: 3, items: { type: integer, minimum: 0, maximum: 255, x-unit: "1" }, description: "RGB on the sim's maps." }
      erodibility: { type: number, x-unit: "1", description: "The sim's relative erodibility (x MEAN_ERODIBILITY 0.9 is Earth's continental mean)." }
      written_by: { type: string, description: "Where the code lays it down (file:line)." }
  made_by: { type: array, items: { $ref: "../../dictionary.schema.yaml#/definitions/geological_event" }, description: "The events that lay it down." }
  physical:
    type: object
    additionalProperties: false
    properties:
      density: { type: number, x-unit: "kg/m3", description: "kg/m3" }
      magnetic_susceptibility: { type: number, x-unit: "1", description: "how strongly it is magnetised by a field (SI, a pure number): what a magnetic survey reads" }
      erodibility: { type: number, x-unit: "1", description: "how fast it wears away, against limestone as 1" }
  yields:
    description: "What is quarried from it in bulk: the whole unit is the resource, not a deposit in it."
    type: array
    items:
      type: object
      additionalProperties: false
      required: [item]
      properties:
        item: { type: string, x-ref: [good], description: "The good it yields, by its key." }
        quality: { type: string, description: "How good, as the simulation gives its range." }
  also: { type: array, items: { type: string }, description: "What else the simulation says it yields, for which the registry has no good yet." }
  revision:
    $ref: "../../common.schema.yaml#/definitions/record_revision"
    default: { status: draft, owner: registry, on_conflict: propose, because: "The simulation's rock units as of its first brief: the list is stable, the figures are from one test world.", ask: docs/geology-registry-note.md }
  basis: { $ref: "../../common.schema.yaml#/definitions/basis" }
