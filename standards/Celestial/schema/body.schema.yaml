$schema: http://json-schema.org/draft-07/schema#
title: Celestial body
x-kind: [body]
description: 'One natural body of a system: its star, a planet, a moon, an asteroid, a dwarf planet, a comet, a centaur, a crossing asteroid, a captured moon. Filed in standards/Celestial/metadata/systems/<system>/bodies/<name>.yaml where the game''s seed makes it, and in small-bodies/ where the registry seeds it and the game does not make it yet (in_game: not made). What people have built there is in Local Administration. A body uses the properties that apply to it.'
type: object
additionalProperties: false
required: [identity, provenance]
allOf:
  - { $ref: "../../common.schema.yaml#/definitions/physical_object" }
  - { properties: { physical: { required: [mass, radius] } } }
properties:
  provenance: { $ref: "../../common.schema.yaml#/definitions/provenance" }
  in_game: { $ref: "../../common.schema.yaml#/definitions/in_game" }
  identity:
    type: object
    additionalProperties: false
    required: [key, name, kind]
    properties:
      key: { $ref: "../../common.schema.yaml#/definitions/key", description: "The body's ID: body.<system>.<its name as the seed first gave it, slugged>. Given once when the record is written out and never changed; the game matches the seed's body to its record by it, so the name is free to change (identity.also keeps the seed's). Claims, settlements and surveys point at it." }
      name: { type: string }
      also: { type: string, description: "What else it is called: a named world keeps the surveyors' letter (Harvest)." }
      kind: { enum: [star, rocky planet, gas giant, ice giant, moon, asteroid, dwarf planet, comet, centaur, crossing asteroid, captured moon] }
      parent: { type: string, x-ref: [body], description: "What it goes round, by its key: the star, a planet, or (a captured moon) a giant. A star has none." }
      about: { type: string }
      story: { type: array, items: { type: string }, description: 'Its story, in paragraphs.' }
  star:
    description: For a star.
    type: object
    additionalProperties: false
    properties:
      class: { type: string, description: "Its spectral class: O, B, A, F, G, K or M." }
      luminosity: { type: number, x-unit: "W", description: "W, all the light it gives off" }
  orbit:
    type: object
    additionalProperties: false
    properties:
      semi_major_axis: { type: number, x-unit: "m", description: "m, half the long axis of its orbit" }
      eccentricity: { type: number, x-unit: "1", description: "how far from a circle (0: a circle)" }
      period: { type: number, x-unit: "s", description: "s to go round once" }
      inclination: { type: number, x-unit: "deg", description: "degrees from the system's plane" }
      ascending_node: { type: number, x-unit: "deg", description: "degrees, where its orbit rises through the system's plane" }
      periapsis_argument: { type: number, x-unit: "deg", description: "degrees from that node round to its closest point" }
      mean_anomaly: { type: number, x-unit: "deg", description: "degrees round its orbit at the world's start" }
  physical:
    type: object
    additionalProperties: false
    properties:
      mass: { type: number, x-unit: "kg", description: kg }
      radius: { type: number, x-unit: "m", description: m }
      density: { type: number, x-unit: "kg/m3", description: "kg/m3, where its mass is worked out from its size and what it is made of" }
      gravity: { type: number, x-unit: "m/s2", description: "m/s2 at its surface" }
      day: { type: number, x-unit: "s", description: "s to turn once" }
      tilt: { type: number, x-unit: "deg", description: "degrees, its axis from upright on the system's plane" }
      albedo: { type: number, x-unit: "1", description: "the share of sunlight it reflects" }
      rings: { type: array, items: { type: number }, minItems: 2, maxItems: 2, x-unit: "m", description: "m, the inner and outer radius of its rings" }
      flattening: { type: number, x-unit: "1", description: "how far its spin flattens it: the share by which its poles are closer in than its equator" }
      age: { type: number, x-unit: "s", description: "s since it formed" }
  bulk:
    description: "What the whole body is made of, by mass. The shares add to 1."
    type: object
    additionalProperties: false
    properties:
      metal: { type: number, x-unit: "1", description: "iron and nickel" }
      rock: { type: number, x-unit: "1", description: "silicate rock" }
      ice: { type: number, x-unit: "1", description: "water and other ices" }
      gas: { type: number, x-unit: "1", description: "hydrogen and helium" }
  interior:
    description: "Its layers, from the centre out, and the heat it gives off."
    type: object
    additionalProperties: false
    properties:
      differentiated: { type: boolean, description: "whether it once melted through and sorted itself into core, mantle and crust" }
      core_radius: { type: number, x-unit: "m", description: "m" }
      core_state: { enum: [solid, liquid, liquid with a solid centre], description: "A liquid core that turns over can make a magnetic field." }
      core_made_of: { type: string }
      mantle_made_of: { type: string }
      crust_thickness: { type: number, x-unit: "m", description: "m, on average" }
      heat_flow: { type: number, x-unit: "W/m2", description: "W for each m2 of its surface, from its inside (Earth: 0.09)" }
      radiogenic: { type: number, x-unit: "1", description: "its mantle's radioactive heat as a multiple of Earth's (K, Th and U at Earth's abundances = 1); an input to the planet simulation" }
      heat_from: { type: array, items: { enum: [formation, radioactivity, tides, settling] }, description: "Where that heat comes from." }
  magnetic:
    type: object
    additionalProperties: false
    properties:
      field: { type: number, x-unit: "T", description: "T at its surface, at the equator (Earth: about 0.00003)" }
      tilt: { type: number, x-unit: "deg", description: "degrees between its magnetic axis and its spin axis" }
      from: { enum: [core dynamo, crust left magnetised, induced, none], description: "What makes it." }
  crust:
    description: "What its ground is, and what can be dug from it."
    type: object
    additionalProperties: false
    properties:
      rocks: { type: array, description: "The rocks its crust is made of, each with its share of the surface.", items: { type: object, additionalProperties: false, required: [rock, share], properties: { rock: { type: string }, share: { type: number, x-unit: "1" } } } }
      regolith: { type: number, x-unit: "m", description: "m of loose broken rock over its bedrock" }
      ores: { type: array, description: "What is worth digging: each a rock of the SFO's goods, how much of the crust it is, and how deep it lies.", items: { type: object, additionalProperties: false, required: [ore], properties: { ore: { type: string }, share: { type: number, x-unit: "1", description: "share of the crust" }, depth: { type: number, x-unit: "m", description: "m to reach it" }, where: { type: string } } } }
      tectonics: { enum: [plates, one plate, none], description: "plates: its crust is in pieces that move and are remade. one plate: a single shell, with volcanoes. none: dead." }
      volcanism: { enum: [active, past, none, ice volcanoes] }
      surface_age: { type: number, x-unit: "s", description: "s since its surface was last remade: old ground is heavily cratered" }
  water:
    type: object
    additionalProperties: false
    properties:
      ocean_cover: { type: number, x-unit: "1", description: "the share of its surface under open water" }
      ocean_depth: { type: number, x-unit: "m", description: "m, on average" }
      ice_cover: { type: number, x-unit: "1", description: "the share of its surface under ice" }
      polar_ice: { type: boolean, description: "For an airless world: ice in the craters at its poles that never see the sun." }
      buried_sea: { type: boolean, description: "A sea under its crust, kept liquid by heat from inside." }
      mass_share: { type: number, x-unit: "1", description: "water at the surface (seas and ice) as a share of the body's mass (Earth: 2.3e-4); the planet simulation's lever for how much of it is sea" }
      salinity: { type: number, x-unit: "1", description: "the share of its sea water that is salt, by mass (Earth: 0.035)" }
  surface:
    type: object
    additionalProperties: false
    properties:
      terrain: { enum: [terran, dry, cratered], description: "terran: seas, continents, mountains. dry: rock, hills, some craters. cratered: airless and heavily cratered." }
      relief: { type: number, x-unit: "m", description: "m, how far its ground rises and falls" }
      mean_temperature: { type: number, x-unit: "K", description: "K, averaged over its surface" }
      temperature_low: { type: number, x-unit: "K", description: "K, its coldest place and time" }
      temperature_high: { type: number, x-unit: "K", description: "K, its hottest" }
      highest: { type: number, x-unit: "m", description: "m above its mean level, its highest ground" }
      rain: { type: number, x-unit: "m", description: "m of rain a year over its land, on average" }
      lowest: { type: number, x-unit: "m", description: "m below its mean level, its lowest" }
      colour: { type: array, items: { type: number }, x-unit: "1", minItems: 3, maxItems: 3, description: "red, green, blue, each 0 to 1" }
      landscape: { type: string, description: "For a frozen body: the file its made landscape is kept in." }
  atmosphere:
    type: object
    additionalProperties: false
    properties:
      surface_density: { type: number, x-unit: "kg/m3", description: "kg/m3 at its surface (Earth: 1.225)" }
      scale_height: { type: number, x-unit: "m", description: "m, the height over which the air thins by 2.7 times" }
      top: { type: number, x-unit: "m", description: "m, where it is taken to end" }
      surface_pressure: { type: number, x-unit: "Pa", description: "Pa at its surface (Earth: 101,300)" }
      made_of: { type: array, description: "Its gases, each with its share by volume.", items: { type: object, additionalProperties: false, required: [gas, share], properties: { gas: { type: string, description: "An element's symbol, or a compound's formula." }, share: { type: number, x-unit: "1" } } } }
      breathable: { type: boolean, description: "whether a person can breathe it unaided" }
      greenhouse: { type: number, x-unit: "K", description: "K its air warms its surface by" }
      clouds: { type: number, x-unit: "1", description: "the share of its sky under cloud" }
      wind: { type: number, x-unit: "m/s", description: "m/s, typical at its surface" }
  survey:
    description: "For a baked body: the planet simulation's survey of it (format planet-sim-survey/1, docs/survey-contract.md), written once at the end of the run and never changed. The record owns the inputs the run was seeded from; the survey owns what the run derived. The game reads the survey's files from the folder, by its path; the hash says which survey."
    type: object
    additionalProperties: false
    required: [world_id, folder, manifest_sha256, format]
    properties:
      format: { const: "planet-sim-survey/1" }
      world_id: { type: string, description: "The simulation's world ID: a new run is a new world." }
      folder: { type: string, description: "Where the survey's files are, relative to the repository root (standards/Celestial/surveys/<world_id>/). The game reads manifest.json, summary.json, deposits.geojson, districts.json, bulk_rock.json and geology.png from it." }
      manifest_sha256: { type: string, pattern: "^[0-9a-f]{64}$", description: "SHA-256 of manifest.json: names the one survey this record is built on." }
      simulator_commit: { type: string, description: "The simulator's commit that grew the world." }
      created: { type: string, description: "When the survey was written (ISO 8601)." }
      land_share: { type: number, x-unit: "1", description: "the share of its surface above the sea, as the run made it" }
      deposits: { type: integer, description: "how many deposits the run grew" }
      districts: { type: integer }
      belts: { type: integer }
      in_store: { type: array, items: { type: string }, description: "Survey files too large for the registry (over 20 MB: an airless world's impacts.json), left in the worlds store; the manifest beside the survey carries their hashes." }
      contained: { type: array, description: "What the run put in its crust, from summary.json: the whole body's endowment, found or not.", items: { type: object, additionalProperties: false, required: [commodity, mass], properties: { commodity: { type: string, description: "an element or compound as the simulation names it (Cu, Cr2O3, diamond)" }, mass: { type: number, exclusiveMinimum: 0, x-unit: "kg", description: "kg; the survey's tonnes and carats (0.2 g) converted" } } } }
  energy:
    description: "For a baked body: the planet simulation's energy package (planet-sim-energy/1): its oil and gas fields and coalfields, written once beside the survey. In-place amounts, model estimates calibrated on the simulation's Grown Earth; not recoverable. Fields' and coalfields' IDs are permanent; claims point at them."
    type: object
    additionalProperties: false
    required: [format, folder, manifest_sha256]
    properties:
      format: { const: "planet-sim-energy/1" }
      folder: { type: string, description: "Where its files are, relative to the repository root (standards/Celestial/surveys/<world_id>/energy/): manifest.json, summary.json, fields.geojson, basins.json, coalfields.json." }
      manifest_sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
      basins: { type: integer }
      oil_fields: { type: integer }
      gas_fields: { type: integer }
      coalfields: { type: integer }
      oil_in_place: { type: number, x-unit: "m3", description: "m3 of oil in the ground (the package's million barrels, at 158.987 m3 a thousand barrels)" }
      gas_in_place: { type: number, x-unit: "m3", description: "m3 of gas at standard conditions (the package's billion cubic feet, at 28.317 million m3 a Bcf)" }
      coal_in_place: { type: number, x-unit: "kg", description: "kg of coal within 1,800 m" }
  bake:
    description: "For a baked body: the flyable surface package (planet-sim-surface/1): a render bake of the world, versioned and written once; latest.json names the current one. It is large (hundreds of MB) and is not kept in the registry: only its pointer and manifest are. The game fetches the files by hash from a worlds store (a folder the game is configured with, holding worlds/<world_id>/surface/v<N>/)."
    type: object
    additionalProperties: false
    required: [format, version, path, manifest_sha256]
    properties:
      format: { const: "planet-sim-surface/1" }
      version: { type: integer, minimum: 1 }
      path: { type: string, description: "The version's folder in the worlds store, relative to it: worlds/<world_id>/surface/v<N>." }
      manifest_sha256: { type: string, pattern: "^[0-9a-f]{64}$", description: "Of the version's manifest.json; a copy of the manifest lies in the registry beside the survey (surveys/<world_id>/surface/manifest.json) so the files and their hashes are known." }
      files: { type: integer }
      bytes: { type: number, x-unit: "1", description: "bytes, all its files" }
      note: { type: string, description: "The bake's own note." }
  life:
    type: object
    additionalProperties: false
    properties:
      present: { enum: [none, microbes, plants and animals], description: "What lives there that people did not bring." }
      soil: { enum: [none, barren, poor, fertile], description: "Whether its ground can grow crops as it is." }
      began: { type: number, x-unit: "s", description: "s ago life began there" }
      photosynthesis: { type: number, x-unit: "s", description: "s ago oxygenic photosynthesis began" }
      oxidation: { type: number, x-unit: "s", description: "s ago its air filled with oxygen (its Great Oxidation)" }
      complex: { type: number, x-unit: "s", description: "s ago complex (many-celled) life appeared" }
      land_plants: { type: number, x-unit: "s", description: "s ago plants took the land" }
      forests: { type: number, x-unit: "s", description: "s ago the first forests grew" }
  rock:
    description: For an asteroid.
    type: object
    additionalProperties: false
    properties:
      class: { type: string, x-ref: [rock-class], description: "What it is made of, by its spectrum." }
      structure: { enum: [rubble pile, monolith], description: "How it holds together: loose rubble, or one solid piece." }
      density: { type: number, x-unit: "kg/m3", description: kg/m3 }
