$schema: http://json-schema.org/draft-07/schema#
title: Small body
description: 'standards/Celestial/metadata/systems/<system>/small-bodies/<name>.yaml: a small body the game does not make yet: a comet, a centaur, a crossing asteroid, a captured moon, a dwarf planet, a belt''s largest asteroid. Seeded in the registry (tools/standards/celestial_seed.py) or written by hand.'
type: object
additionalProperties: false
required: [identity, provenance]
properties:
  provenance: { $ref: "../../common.schema.yaml#/definitions/provenance" }
  identity:
    type: object
    additionalProperties: false
    required: [key, name, kind]
    properties:
      key: { $ref: "../../common.schema.yaml#/definitions/key" }
      name: { type: string }
      kind: { enum: [comet, centaur, crossing asteroid, captured moon, dwarf planet, asteroid] }
      parent: { type: string, description: "What it goes round, by name: the star, or a giant." }
      about: { type: string }
  orbit:
    type: object
    additionalProperties: false
    properties:
      semi_major_axis: { type: number, description: "km, half the long axis of its orbit" }
      eccentricity: { type: number, description: "how far from a circle (0: a circle; near 1: very stretched)" }
      inclination: { type: number, description: "degrees from the plane (over 90: it goes round backward)" }
      period: { type: number, description: "days to go round once" }
  physical:
    type: object
    additionalProperties: false
    properties:
      radius: { type: number, description: km }
      density: { type: number, description: "kg/m3, its class's as one solid piece" }
      mass: { type: number, description: "kg, from its size and density" }
  rock:
    type: object
    additionalProperties: false
    properties:
      class: { type: string, description: "The rock class it is, by file name." }
