key: org.hadley
kind: company
name: Hadley Heavy Industries
ticker: HHI
address: { at: treistun/treistun-e-station, tower: Works Tower, deck: 1, section: A, unit: 1 }
note: "Plants, tanks and racks: rugged and cheap"
who: "A big, plain industrial company that sells on price and on things not breaking. One of the founders of the SFO."
what: "Builds power plants, tanks and cargo racks: heavy, rugged and cheap."
story:
  - "Hadley is older than most of the stations it supplies. It started by casting pressure tanks for the first settlements, when a tank that leaked meant people died, and it built its name on tanks that didn't."
  - "It grew by buying foundries and mills wherever ore was close, and today it runs more heavy plant than any other maker. Nothing it sells is elegant. Its power plants are heavy, its racks are thick, and its catalogue has barely changed in a generation, which is exactly what its customers want."
  - "Hadley's founders are long gone; it is run by a board that distrusts anything new until somebody else has paid to prove it."
