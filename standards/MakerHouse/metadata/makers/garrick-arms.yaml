  name: Garrick Arms
kind: company
ticker: GAR
address: { at: settlement.treistun.treistun-e-station, tower: Works Tower, deck: 7, section: C, unit: 10 }
note: "Weapons: mass drivers and lasers"
who: "An arms maker that sells to anyone allowed to buy."
what: "Makes ship weapons: mass drivers and lasers."
story:
  - "Garrick started as a maker of mass drivers for moving ore, launching loads from surface mines to orbit. It did not take long for someone to point one at a ship, and the company followed its customers."
  - "Today it makes ship weapons, mass drivers and lasers, and little else. It sells to anyone the law allows and keeps a careful record of who that is. It does not pretend its trade is anything other than what it is."
  - "The family still owns it. It keeps out of politics and out of the SFO's founding, though it builds to the standards like everyone else."
