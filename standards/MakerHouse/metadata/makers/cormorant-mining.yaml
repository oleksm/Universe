# yaml-language-server: $schema=../../../organisation.schema.yaml
identity:
  key: org.cormorant
  name: Cormorant Mining
kind: company
ticker: CMN
address: { at: settlement.treistun.treistun-e-station, tower: Works Tower, deck: 2, section: D, unit: 8 }
note: "Mining gear"
who: "A company of miners that started building its own tools and now sells them."
what: "Makes mining gear for ships."
story:
  - "Cormorant was a mining crew before it was a company. Working the belts with gear built for other jobs, they cut, welded and rebuilt it until it suited the rock, and other crews started asking to buy what they had made."
  - "It still runs its own mining ships, and every new tool goes out on them for a season before it is sold. The gear looks rough, and the manuals read like they were written by people with gloves on."
  - "Miners trust Cormorant because it is one of them, and because it will tell a buyer when a cheaper tool would do."
# fleet: two prospectors to a field (chosen)
fleet:
  - { hull: hull.prospector, count: 16, home: settlement.treistun.port-trethi, work: mining, does: "mining Treistun's 8 asteroid fields for the mill: two prospectors to a field, chosen" }
