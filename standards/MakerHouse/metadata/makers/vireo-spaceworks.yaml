name: Vireo Spaceworks
ticker: VIR
address: { at: settlement.treistun.treistun-e-station, tower: Works Tower, deck: 5, section: D, unit: 4 }
note: "Hulls: fast and light"
who: "A shipyard that builds for speed before capacity. One of the founders of the SFO."
what: "Builds hulls: fast and light."
story:
  - "Vireo was started by pilots who raced, and who thought the yards built ships like warehouses. Their first hull carried almost nothing and outran everything, and they sold it on that."
  - "The company builds fast, light hulls and gives up cargo space to do it. Couriers, scouts and people in a hurry buy them. Its yard is small and its waiting list is long."
  - "Vireo and Tolland agree on very little, but they stood together as founders of the SFO: a light hull is worth nothing if the drives and modules made for it don't fit."
