# yaml-language-server: $schema=../../schema/company.schema.yaml
key: company.orbital
name: Orbital Systems
ticker: ORB
address: { at: treistun/treistun-e-station, tower: Trade Tower, deck: 22, section: C, unit: 5 }
note: "Computers, sensors, navigation"
who: "An electronics company; most ships fly on something of theirs. One of the founders of the SFO."
what: "Makes flight computers, sensors and navigation equipment."
story:
  - "Orbital Systems was started by a group of navigators tired of flying with instruments that disagreed with each other. Their first product was a flight computer that showed one honest answer and said how sure it was."
  - "From there it spread into sensors and navigation aids, and then into nearly every cockpit. It is the quietest of the big makers: it advertises little, and its engineers are rarely seen at the yards."
  - "It argued hardest of all the founders for common signals and data formats in the SFO, and it has profited the most from them."
