$schema: http://json-schema.org/draft-07/schema#
title: Company
description: 'standards/MakerHouse/metadata/makers/<name>.yaml: one company.'
type: object
additionalProperties: false
required: [key, name, ticker, note]
properties:
  key: { type: string, pattern: '^brand\.[a-z0-9_]+$', description: What the game calls it. }
  name: { type: string }
  ticker: { type: string, pattern: '^[A-Z]{2,4}$', description: Its short trading name; no two alike. }
  note: { type: string, description: One line, as the game shows it. }
  who: { type: string, description: Who they are. }
  what: { type: string, description: What they do. }
