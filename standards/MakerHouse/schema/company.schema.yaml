$schema: http://json-schema.org/draft-07/schema#
title: Company
description: 'standards/MakerHouse/metadata/makers/<name>.yaml: one company.'
type: object
additionalProperties: false
required: [key, name, ticker, note]
properties:
  key: { type: string, pattern: '^brand\.[a-z0-9_]+$', description: What the game calls it. }
  name: { type: string }
  ticker: { type: string, pattern: '^[A-Z]{2,4}$', description: Its short trading name; no two alike. }
  address:
    description: 'Where it is (SFO 9). at: <system>/<body>, by their file names in LocalAdministration; then the tower, deck, section and unit, where the settlement has them.'
    type: object
    additionalProperties: false
    required: [at]
    properties:
      at: { type: string }
      tower: { type: string }
      deck: { type: integer, minimum: 1 }
      section: { type: string }
      unit: { type: integer, minimum: 1 }
  note: { type: string, description: One line, as the game shows it. }
  who: { type: string, description: Who they are. }
  what: { type: string, description: What they do. }
  story: { type: array, items: { type: string }, description: Their story, in paragraphs. }
