$schema: http://json-schema.org/draft-07/schema#
title: Organisation
x-kind: [org]
description: 'One organisation: a company (standards/MakerHouse/metadata/makers/<name>.yaml), a standards body (standards/SFO/metadata/SFO.yaml) or a system''s administration (standards/LocalAdministration/metadata/administrations/<name>.yaml). One kind of thing: it has a name and an address, owns things, and is referred to by its key.'
type: object
additionalProperties: false
required: [identity, kind]
properties:
  identity:
    type: object
    additionalProperties: false
    required: [key, name]
    properties:
      key: { $ref: "common.schema.yaml#/definitions/key" }
      name: { type: string }
  kind: { enum: [company, standards_body, administration, band], description: "company: it makes, stores or trades. standards_body: it publishes standards. administration: it manages the land of a settled system. band: an outfit outside the law, with a hold of its own." }
  address: { $ref: "common.schema.yaml#/definitions/address" }
  note: { type: string, description: One line, as the game shows it. }
  about: { type: array, items: { type: string }, description: 'What it is, in paragraphs.' }
  story: { type: array, items: { type: string }, description: 'Its story, in paragraphs.' }
  # A company.
  ticker: { type: string, pattern: '^[A-Z]{2,4}$', description: "A company's short trading name; no two alike." }
  business: { enum: [maker, warehousing, exchange, food, insurance, banking], description: "What kind of company it is. food: it grows or makes food. insurance: it covers hulls and cargoes. banking: it lends. Left out: a maker. Only makers go to the game's brands." }
  who: { type: string, description: Who they are. }
  what: { type: string, description: What they do. }
  # A standards body.
  prefix: { type: string, pattern: '^[A-Z]{2,6}$', description: "A standards body's letters, before each of its standards' numbers." }
  seat: { type: string }
  form: { enum: [consortium, independent, authority, corporation, players], description: "What a standards body is, and so whom it answers to." }
  purpose: { type: string }
  details:
    type: object
    additionalProperties: false
    properties:
      text: { type: array, items: { type: string } }
  founded_by: { type: array, items: { type: string, x-ref: [org] }, description: "The companies that founded it." }
  # An administration.
  insurance:
    description: "For an insurer: what it covers and on what terms. Rates are shares. A lost hull is replaced at a yard, parked, once the excess is paid: nobody is put back into a fight."
    type: object
    additionalProperties: false
    required: [covers, premium, excess, delivered_at]
    properties:
      covers: { type: array, items: { enum: [hull, fit, cargo, crew] } }
      premium: { type: number, x-unit: "1/s", description: "the share of the insured worth charged each second (a yearly rate over a year's seconds)" }
      excess: { type: number, x-unit: "1", description: "the share of the loss the insured pays before a replacement is delivered" }
      delivered_at: { enum: [yard, port], description: "where a replacement is handed over: a yard that builds it, or any port of the insurer's" }
      refuses: { type: array, items: { $ref: "dictionary.schema.yaml#/definitions/offence" }, description: "losses it will not pay: those the insured brought on by these offences" }
  trade_bans:
    description: "What may not be traded in its markets: its law, and like its zoning it can be broken."
    type: array
    items:
      type: object
      additionalProperties: false
      required: [market]
      properties:
        market: { type: string, x-ref: [market], description: "The market category it bans, by its key." }
        note: { type: string }
  law:
    description: "Its code: what it forbids, what it does about a breach, how it enforces, how far it reaches. Like zoning, every part of it can be broken; the game records the breach and the law answers. A system without an administration has no law."
    type: object
    additionalProperties: false
    required: [jurisdiction, offences, enforcement]
    properties:
      jurisdiction: { $ref: "dictionary.schema.yaml#/definitions/jurisdiction" }
      offences:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [offence, penalties]
          properties:
            offence: { $ref: "dictionary.schema.yaml#/definitions/offence" }
            penalties:
              description: "What follows, all of it: a fine and a forfeiture and a bounty may stand together."
              type: array
              items:
                type: object
                additionalProperties: false
                required: [kind]
                properties:
                  kind: { $ref: "dictionary.schema.yaml#/definitions/penalty" }
                  share: { type: number, x-unit: "1", description: "for a fine or a bounty: the share of the value at stake (a fine) or of the offender's ship (a bounty)" }
                  term: { type: number, x-unit: "s", description: "for gaol or outlawry: how long" }
            note: { type: string }
      enforcement:
        description: "Who answers a breach, and with what."
        type: object
        additionalProperties: false
        properties:
          constables_per: { type: integer, description: "one constable to this many people, at each settlement" }
          judges_per: { type: integer, description: "one judge to this many people" }
          patrol:
            description: "The craft each settlement keeps armed and crewed to answer piracy and reckless flying in its approaches."
            type: array
            items:
              type: object
              additionalProperties: false
              required: [hull, per_people]
              properties:
                hull: { type: string, x-ref: [hull] }
                per_people: { type: integer, description: "one craft to this many people, at least one where there is a port" }
          response: { type: number, x-unit: "s", description: "s from a breach seen to a patrol under way, in its approaches" }
      redress:
        description: "The ways back from a breach: a law with no way back is a ban. Appeal, restitution, settlement and service are the game's procedures reading these figures; a pardon is the administration's to give."
        type: object
        additionalProperties: false
        properties:
          appeal_within: { type: number, x-unit: "s", description: "s after a breach is recorded in which it may be appealed to the court; upheld, the record is struck and any fine returned" }
          restitution_first: { type: boolean, description: "whether a case with a victim (theft, piracy) can settle only once the victim is made whole; an insurer that paid stands in the victim's place" }
          settles: { type: array, items: { $ref: "dictionary.schema.yaml#/definitions/offence" }, description: "Offences that close on paying the fine and the forfeiture." }
          surrender_share: { type: number, x-unit: "1", description: "the share of a term left after surrendering before the bounty is collected" }
          service_rate: { type: number, x-unit: "1", description: "s of outlawry worked off for each s served under the administration (patrol escort, hauling the reserve, salvage: a letter of marque)" }
          expires_after: { type: number, x-unit: "s", description: "s after which an unpaid, unprosecuted warning or fine lapses; forfeiture and outlawry do not" }
          pardon: { type: boolean, description: "whether the administration may pardon at its discretion" }
      recognises: { type: array, items: { type: string, x-ref: [org] }, description: "Other administrations whose outlawry this one honours at its ports. Empty: an outlaw elsewhere is nobody here." }
      policies:
        description: "What it levies and licenses: rates are shares, never sums."
        type: object
        additionalProperties: false
        properties:
          duty: { type: number, x-unit: "1", description: "the share of every sale in its markets it takes" }
          land_rate: { type: number, x-unit: "1/s", description: "the share of a parcel's worth it levies each second (a yearly rate over a year's seconds)" }
          mining_licence: { type: boolean, description: "whether digging in its jurisdiction needs its licence" }
          insurance_to_dock: { type: boolean, description: "whether a ship must be insured to use its ports" }
  compulsory_stock:
    description: "Its law on reserves: for each need people die without, how long the whole administration's people must be able to live on what is held in store, and where that reserve lies. Like zoning, it can be broken; the record of a breach is the administration's. Beside it, the registry's convention for the other two layers: a works keeps three days of its inputs, a store a week, a farm a season; a settlement's warehouse keeps `warehouse_cover` resupply cycles of what its people take."
    type: object
    additionalProperties: false
    required: [reserves]
    properties:
      warehouse_cover: { type: number, x-unit: "1", description: "how many of its resupply cycles (settlement.resupply.interval) a settlement's warehouse holds of what its people take: one delivery late must not empty it", default: 1.5 }
      reserves:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [need, lasts, held_at]
          properties:
            need: { type: string, x-ref: [need], description: "The need the reserve is for, by its key." }
            lasts: { type: number, x-unit: "s", description: "s the whole administration's people could live on the reserve alone" }
            held_at:
              description: "Where it lies, and each place's share; the shares add to 1."
              type: array
              items:
                type: object
                additionalProperties: false
                required: [settlement, share]
                properties:
                  settlement: { type: string, x-ref: [settlement] }
                  share: { type: number, x-unit: "1" }
            note: { type: string }
  zoning:
    description: Its zoning code, what each kind of zone permits.
    type: array
    items:
      type: object
      additionalProperties: false
      required: [use, permits]
      properties:
        use: { enum: [port, industrial, commercial, civic, residential, agricultural] }
        permits: { type: string }
