$schema: http://json-schema.org/draft-07/schema#
title: Organisation
x-kind: [org]
description: 'One organisation: a company (standards/MakerHouse/metadata/makers/<name>.yaml), a standards body (standards/SFO/metadata/SFO.yaml) or a system''s administration (standards/LocalAdministration/metadata/administrations/<name>.yaml). One kind of thing: it has a name and an address, owns things, and is referred to by its key.'
type: object
additionalProperties: false
required: [identity, kind]
properties:
  identity:
    type: object
    additionalProperties: false
    required: [key, name]
    properties:
      key: { $ref: "common.schema.yaml#/definitions/key" }
      name: { type: string }
  kind: { enum: [company, standards_body, administration], description: "company: it makes, stores or trades. standards_body: it publishes standards. administration: it manages the land of a settled system." }
  address: { $ref: "common.schema.yaml#/definitions/address" }
  note: { type: string, description: One line, as the game shows it. }
  about: { type: array, items: { type: string }, description: 'What it is, in paragraphs.' }
  story: { type: array, items: { type: string }, description: 'Its story, in paragraphs.' }
  # A company.
  ticker: { type: string, pattern: '^[A-Z]{2,4}$', description: "A company's short trading name; no two alike." }
  business: { enum: [maker, warehousing, exchange, food], description: "What kind of company it is. food: it grows or makes food. Left out: a maker. Only makers go to the game's brands." }
  who: { type: string, description: Who they are. }
  what: { type: string, description: What they do. }
  # A standards body.
  prefix: { type: string, pattern: '^[A-Z]{2,6}$', description: "A standards body's letters, before each of its standards' numbers." }
  seat: { type: string }
  form: { enum: [consortium, independent, authority, corporation, players], description: "What a standards body is, and so whom it answers to." }
  purpose: { type: string }
  details:
    type: object
    additionalProperties: false
    properties:
      text: { type: array, items: { type: string } }
  founded_by: { type: array, items: { type: string, x-ref: [org] }, description: "The companies that founded it." }
  # An administration.
  trade_bans:
    description: "What may not be traded in its markets: its law, and like its zoning it can be broken."
    type: array
    items:
      type: object
      additionalProperties: false
      required: [market]
      properties:
        market: { type: string, x-ref: [market], description: "The market category it bans, by its key." }
        note: { type: string }
  compulsory_stock:
    description: "Its law on reserves: for each need people die without, how long the whole administration's people must be able to live on what is held in store, and where that reserve lies. Like zoning, it can be broken; the record of a breach is the administration's. Beside it, the registry's convention for the other two layers: a works keeps three days of its inputs, a store a week, a farm a season; a settlement's warehouse keeps `warehouse_cover` resupply cycles of what its people take."
    type: object
    additionalProperties: false
    required: [reserves]
    properties:
      warehouse_cover: { type: number, x-unit: "1", description: "how many of its resupply cycles (settlement.resupply.interval) a settlement's warehouse holds of what its people take: one delivery late must not empty it", default: 1.5 }
      reserves:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [need, lasts, held_at]
          properties:
            need: { type: string, x-ref: [need], description: "The need the reserve is for, by its key." }
            lasts: { type: number, x-unit: "s", description: "s the whole administration's people could live on the reserve alone" }
            held_at:
              description: "Where it lies, and each place's share; the shares add to 1."
              type: array
              items:
                type: object
                additionalProperties: false
                required: [settlement, share]
                properties:
                  settlement: { type: string, x-ref: [settlement] }
                  share: { type: number, x-unit: "1" }
            note: { type: string }
  zoning:
    description: Its zoning code, what each kind of zone permits.
    type: array
    items:
      type: object
      additionalProperties: false
      required: [use, permits]
      properties:
        use: { enum: [port, industrial, commercial, civic, residential, agricultural] }
        permits: { type: string }
