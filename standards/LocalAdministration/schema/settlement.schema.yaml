$schema: http://json-schema.org/draft-07/schema#
title: Settlement
x-kind: [settlement, rig]
description: 'standards/LocalAdministration/metadata/administrations/<system>/<name>.yaml: a settlement (a permanent place with people and an administration), or a rig (equipment stationed in the system, not a place). The planet or moon it is at is a celestial body, in standards/Celestial.'
type: object
additionalProperties: false
required: [identity, kind]
properties:
  identity:
    type: object
    additionalProperties: false
    required: [key, name]
    properties:
      key: { $ref: "../../common.schema.yaml#/definitions/key" }
      name: { type: string }
  kind: { enum: [settlement, rig], description: "settlement: a permanent place with people and an administration (a port, a station, a gate). rig: a movable works (as an oil rig is), brought to a job and moved on; no ground, zoning or administration of its own." }
  at: { type: string, x-ref: [body], description: "The planet or moon it is at, by its key." }
  position:
    description: "Where on the surface of the body it is at, in degrees. Latitude from the equator toward the spin axis (north positive); longitude round the spin axis from the body frame's x axis (our convention: the game has no prime meridian)."
    type: object
    additionalProperties: false
    required: [latitude, longitude]
    properties:
      latitude: { type: number, minimum: -90, maximum: 90, x-unit: "deg" }
      longitude: { type: number, minimum: -180, maximum: 180, x-unit: "deg" }
  gate:
    description: "For a settlement that is a gate. How far it reaches is worked out from where the two stars are."
    type: object
    additionalProperties: false
    required: [ring, to]
    properties:
      ring: { type: string, x-ref: [gate], description: "The gate ring it is (SFO 17), by its key." }
      to: { type: string, x-ref: [system], description: The star it leads to. }
  spin:
    description: "For a rig: the part of it that turns, to give weight to what needs it."
    type: object
    additionalProperties: false
    properties:
      radius: { type: number, x-unit: "m", description: "m, from its axis to its floor" }
      gravity: { type: number, x-unit: "m/s2", description: "m/s2 at its floor. How fast it turns is worked out." }
  owner: { type: string, x-ref: [org], description: "For a rig: the company whose it is." }
  lines: { $ref: "installation.schema.yaml#/definitions/lines" }
  modules: { $ref: "installation.schema.yaml#/definitions/modules" }
  stock: { $ref: "installation.schema.yaml#/definitions/stock", description: "For a rig: what lies in its store at day 0; its owner trades it at its dock." }
  structure: { type: string, x-ref: [structure], description: "The built thing it is, by its key: a spaceport, an outpost, a platform." }
  resupply:
    description: "How it is kept supplied with what it does not make: where its ships come from and how often. Sets its warehouse's distribution stock (the administration's compulsory_stock.warehouse_cover)."
    type: object
    additionalProperties: false
    required: [from, interval]
    properties:
      from: { type: string, x-ref: [settlement], description: "The settlement its supplies are hauled from, by its key." }
      interval: { type: number, x-unit: "s", description: "s between deliveries, on the usual run" }
  buildings:
    description: "What stands in it at day 0 for its people to live in, buy from, be served in and work at: each building and how many, by its per_people and the population (tools/standards/census.py)."
    type: array
    items:
      type: object
      additionalProperties: false
      required: [building, count]
      properties:
        building: { type: string, x-ref: [building] }
        count: { type: integer, minimum: 1 }
  census:
    description: "Its people by trade at day 0, summed by tools/standards/census.py from its works' staff and the trades its needs are served by; the rest dependants. What the operator hires from: finite."
    type: array
    items:
      type: object
      additionalProperties: false
      required: [profession, count]
      properties:
        profession: { type: string, x-ref: [profession] }
        count: { type: integer, minimum: 0 }
  independents:
    description: "Owner-operators based here at day 0: hull and count (seeding.traffic fills the system's target by population; tools/standards/census.py). Finite, like the fleets."
    type: array
    items:
      type: object
      additionalProperties: false
      required: [hull, count]
      properties:
        hull: { type: string, x-ref: [hull] }
        count: { type: integer, minimum: 1 }
  population: { type: integer, minimum: 0, description: "How many people live there at day 0: seed state of the world. What becomes of them after is the game's." }
  about: { type: string, description: What it is. }
  story: { type: array, items: { type: string }, description: 'Its story, in paragraphs.' }
