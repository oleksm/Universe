$schema: http://json-schema.org/draft-07/schema#
title: Body
description: 'standards/LocalAdministration/metadata/administrations/<system>/<name>.yaml: one body in a system that has something to administer: a settlement, or a body with recorded land.'
type: object
additionalProperties: false
required: [name, kind]
properties:
  name: { type: string }
  kind: { enum: [planet, moon, belt, settlement] }
  at: { type: string, description: "The planet or moon it is at, by name." }
