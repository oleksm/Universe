$schema: http://json-schema.org/draft-07/schema#
title: Body
description: 'standards/LocalAdministration/metadata/administrations/<system>/<name>.yaml: one body in a system where people can live.'
type: object
additionalProperties: false
required: [name, kind]
properties:
  name: { type: string }
  kind: { enum: [planet, moon, settlement] }
  at: { type: string, description: "The planet or moon it is at, by name." }
  position:
    description: "Where on the surface of the body it is at, in degrees. Latitude from the equator toward the spin axis (north positive); longitude round the spin axis from the body frame's x axis (our convention: the game has no prime meridian)."
    type: object
    additionalProperties: false
    required: [latitude, longitude]
    properties:
      latitude: { type: number, minimum: -90, maximum: 90 }
      longitude: { type: number, minimum: -180, maximum: 180 }
  about: { type: string, description: What it is. }
  story: { type: array, items: { type: string }, description: 'Its story, in paragraphs.' }
