$schema: http://json-schema.org/draft-07/schema#
title: Body
description: 'standards/LocalAdministration/metadata/administrations/<system>/<name>.yaml: one body in a system where people can live (a planet, a moon, a settlement), or a rig: equipment stationed in the system, not a place.'
type: object
additionalProperties: false
required: [name, kind]
properties:
  name: { type: string }
  kind: { enum: [planet, moon, settlement, rig], description: "settlement: a permanent place with people and an administration (a port, a station, a gate). rig: a movable works (as an oil rig is), brought to a job and moved on; no ground, zoning or administration of its own." }
  at: { type: string, description: "The planet or moon it is at, by name." }
  gravity: { type: number, description: "m/s2 at its surface, as the game makes it" }
  position:
    description: "Where on the surface of the body it is at, in degrees. Latitude from the equator toward the spin axis (north positive); longitude round the spin axis from the body frame's x axis (our convention: the game has no prime meridian)."
    type: object
    additionalProperties: false
    required: [latitude, longitude]
    properties:
      latitude: { type: number, minimum: -90, maximum: 90 }
      longitude: { type: number, minimum: -180, maximum: 180 }
  gate:
    description: "For a settlement that is a gate."
    type: object
    additionalProperties: false
    required: [ring, to, distance]
    properties:
      ring: { type: string, description: "The gate ring it is (SFO 17), by file name." }
      to: { type: string, description: The star it leads to. }
      distance: { type: number, description: "light years to that star" }
  owner: { type: string, pattern: '^brand\.[a-z0-9_]+$', description: "For a rig: the company whose it is." }
  processes: { type: array, items: { type: string }, description: "For a rig: the SFO processes it runs, by file name." }
  lines: { type: array, description: "For a rig: its production lines, as a facility's (facility.schema.yaml)." }
  modules: { type: array, description: "For a rig: the industrial modules it carries besides its lines' (its power plant), as a facility's." }
  about: { type: string, description: What it is. }
  story: { type: array, items: { type: string }, description: 'Its story, in paragraphs.' }
