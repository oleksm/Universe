$schema: http://json-schema.org/draft-07/schema#
title: Parcel
x-kind: [parcel]
description: 'standards/LocalAdministration/metadata/administrations/<system>/<settlement>/parcels/parcel-<number>.yaml: one surveyed lot of a settlement''s land, and who owns it. Its zone is the one it lies in.'
type: object
additionalProperties: false
required: [identity, number, outline]
properties:
  identity:
    type: object
    additionalProperties: false
    required: [key]
    properties:
      key: { $ref: "../../common.schema.yaml#/definitions/key" }
  number: { type: integer, minimum: 1, description: Its number in its settlement. }
  owner: { type: string, x-ref: [org], description: 'Who owns it (a company in Maker House, or a standards body). Left out: vacant, the land office''s to sell.' }
  address:
    description: 'Its address (SFO 9): a number on one of its settlement''s streets, by the street''s key. The parcel number is the land office''s, not an address.'
    type: object
    additionalProperties: false
    required: [street, number]
    properties:
      street: { type: string, x-ref: [street] }
      number: { type: integer, minimum: 1 }
  outline:
    description: "Its corners, in order: metres [east, north] of the settlement's position, on the ground."
    type: array
    minItems: 3
    items: { type: array, items: { type: number }, minItems: 2, maxItems: 2, x-unit: "m" }
