$schema: http://json-schema.org/draft-07/schema#
title: Street
description: 'standards/LocalAdministration/metadata/administrations/<system>/<settlement>/streets/<name>.yaml: a street of a settlement, its administration''s. Addresses are numbers along it.'
type: object
additionalProperties: false
required: [key, name, line]
properties:
  key: { $ref: "../../common.schema.yaml#/definitions/key" }
  name: { type: string }
  line:
    description: "Its centre line, point by point: metres [east, north] of the settlement's position, on the ground."
    type: array
    minItems: 2
    items: { type: array, items: { type: number }, minItems: 2, maxItems: 2 }
