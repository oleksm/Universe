$schema: http://json-schema.org/draft-07/schema#
title: Zone
description: 'standards/LocalAdministration/metadata/administrations/<system>/<settlement>/<name>.yaml: a part of a settlement its administration has set aside for one use. Its parcels are the records in the folder beside it, <name>/.'
type: object
additionalProperties: false
required: [name, use]
properties:
  name: { type: string }
  use: { enum: [port, industrial, commercial, civic, residential] }
