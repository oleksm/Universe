$schema: http://json-schema.org/draft-07/schema#
title: Facility
x-kind: [facility]
description: 'standards/LocalAdministration/metadata/administrations/<system>/<settlement>/facilities/<name>.yaml: something built on a parcel, and the work it does. It belongs to the parcel''s owner. The parcel''s zone must permit it: a foundry, a mill, a yard or a power station needs an industrial zone, a warehouse a port zone.'
type: object
additionalProperties: false
required: [identity, kind, parcel]
definitions:
  point: { type: array, items: { type: number }, minItems: 2, maxItems: 2, x-unit: "m" }
properties:
  identity:
    type: object
    additionalProperties: false
    required: [key, name]
    properties:
      key: { $ref: "../../common.schema.yaml#/definitions/key" }
      name: { type: string }
  kind: { enum: [foundry, mill, yard, power, warehouse, farm, food works, store, utility, mine] }
  parcel: { type: string, x-ref: [parcel], description: The parcel of its settlement it stands on. }
  processes: { $ref: "installation.schema.yaml#/definitions/processes" }
  lines: { $ref: "installation.schema.yaml#/definitions/lines" }
  modules: { $ref: "installation.schema.yaml#/definitions/modules" }
  stock: { $ref: "installation.schema.yaml#/definitions/stock" }
  claim:
    description: "For a mine or a well: the deposit it works, by the planet simulation's permanent id in the body's survey (deposits.geojson) or energy package (fields, coalfields), and under whose licence. The id is checked against the survey of the body the settlement is at. Mining under an administration's jurisdiction needs its licence (law.policies.mining_licence); without one, the breach is recorded (offence: unlicensed mining), never blocked."
    type: object
    additionalProperties: false
    required: [deposit, holder]
    properties:
      deposit: { type: string, description: "The deposit's, field's or coalfield's id: <world>-<code>-...; permanent." }
      holder: { type: string, x-ref: [org], description: "Whose claim it is." }
      licence: { type: string, x-ref: [org], description: "The administration that licensed it; left out, the mine is unlicensed." }
  exchange: { type: string, x-ref: [org], description: 'For a warehouse: the exchange that has approved it, so that goods lying in it can be traded there.' }
  parts:
    description: 'Its site plan: what stands where on the parcel. No two overlap, and each lies inside the parcel.'
    type: array
    items:
      type: object
      additionalProperties: false
      required: [name, kind, outline]
      properties:
        name: { type: string }
        kind: { enum: [module, workshop, warehouse, logistics, parking], description: 'module: industrial plant.' }
        does: { type: string }
        processes: { type: array, items: { type: string, x-ref: [process] }, description: 'The facility''s processes run here. Each of the facility''s processes is run in exactly one part.' }
        outline: { type: array, minItems: 3, items: { $ref: '#/definitions/point' }, description: "Its corners, in order: metres [east, north] of the settlement's position." }
  pipelines:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [name, carries, from, to, line]
      properties:
        name: { type: string }
        carries: { type: string }
        from: { type: string, description: The part it starts at, by name. }
        to: { type: string, description: The part it ends at, by name. }
        line: { type: array, minItems: 2, items: { $ref: '#/definitions/point' }, description: "Its run, point by point: metres [east, north] of the settlement's position." }
