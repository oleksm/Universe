# yaml-language-server: $schema=../../../schema/settlement.schema.yaml
# Invented (2026-10-06). A rig, not a settlement: Biraidim has no administration, so there is no land, no register and no law here.
identity:
  key: rig.biraidim.shikra-hold
  name: "Shikra Hold"
kind: rig
at: body.biraidim.shikra
owner: org.shikra-hold
population: 300
# The dock: cut into the rock on the asteroid's sunward face, with the hold's stores behind it. Its market is the band's own
# (the rig's owner trades, as at Hadley Orbital Works): no exchange approves it, no administration's bans reach it, no
# outlawry is recognised. It asks no questions. Position chosen; the asteroid is 1.6 km across.
position: { latitude: 0.0, longitude: 0.0 }
modules:
  - { module: module.loading-dock, count: 2 }
  - { module: module.general-warehouse, count: 1 }
  - { module: module.tank-farm, count: 1 }
  - { module: module.fusion-power-station, count: 1 }
# What lies in the hold at day 0: fuel for its craft, food for its people (90 days: raiders stock deep), and the last
# haul's loot, which is what it sells.
stock:
  - { item: stock.deuterium-liq, quantity: 20000.0 }
  - { item: stock.flour-bulk, quantity: 10000.0 }
  - { item: stock.beef-bulk, quantity: 4000.0 }
  - { item: stock.potatoes-bulk, quantity: 8000.0 }
  - { item: stock.medicines-bulk, quantity: 200.0 }
  - { item: stock.al6061-ingot, quantity: 150000.0 }
  - { item: stock.cu-ingot, quantity: 40000.0 }
  - { item: stock.electronics-bulk, quantity: 5000.0 }
# census: its 300 people by trade: the staff of its works (module.staff) and the trades its needs are served by (need.served_by), the rest dependants (children, the old, the unassigned)
census:
  - { profession: profession.pilot, count: 24 }
  - { profession: profession.teacher, count: 4 }
  - { profession: profession.nurse, count: 3 }
  - { profession: profession.innkeeper, count: 2 }
  - { profession: profession.doctor, count: 2 }
  - { profession: profession.reporter, count: 1 }
  - { profession: profession.artist, count: 1 }
  - { profession: profession.performer, count: 1 }
  - { profession: profession.constable, count: 1 }
  - { profession: profession.judge, count: 1 }
  - { profession: profession.dependant, count: 260 }
about: "A pirates' hold dug into a 1.6 km asteroid in a system nobody administers, one jump from Treistun."
story:
  - "Nobody built Shikra Hold; it was dug, by people who had lost ships or licences in Treistun and found that an asteroid nobody owned asked no questions. It has a dock cut into the rock, a few hundred people, and a dozen armed craft."
  - "It lives on the Treistun run: haulers between the gate and the inner ports. It takes cargo when it can and ships when it must, sells at ports that do not ask, and goes home when a patrol comes out. If Treistun ever administers Biraidim, the hold is the first thing its law will reach."
