# yaml-language-server: $schema=../../schema/administration.schema.yaml
# The home system, as the game makes it from its seed (1984). Its bodies: the folder treistun/.
name: Treistun
address: { at: treistun/treistun-e-station, tower: Civic Tower, deck: 1, section: A, unit: 1 }
about: "Treistun is a K-type star, cooler than most and giving 0.29 of the Sun's light. It has nine planets: five rocky ones close in, then two gas giants and two ice giants, with fifteen moons between them. Two of the rocky worlds, d and e, have air. It is the only settled system so far: one station and ten ports, with gates to Liham, Driumum and Biraidim."
story:
  - "Treistun was settled from its fourth planet outward. The first port was Nacaubun on Treistun e, and the station was raised above it once there were more ships than one field could take."
  - "From there the ports went both ways: inward to the hot, heavy worlds, and outward to the moons of the giants. The administration grew out of the port office at Nacaubun and moved up to the station with everything else."
zoning:
  - { use: port, permits: "Landing pads, hangars, fuel and the port's own buildings." }
  - { use: industrial, permits: "Foundries, mills, workshops and yards." }
  - { use: commercial, permits: "Markets, shops and company offices." }
  - { use: civic, permits: "The administration and offices of record." }
  - { use: residential, permits: "Homes." }
