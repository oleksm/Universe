# yaml-language-server: $schema=../../../organisation.schema.yaml
# The home system, as the game makes it from its seed (1984). Its bodies: the folder treistun/.
identity:
  key: org.treistun
  name: Treistun
kind: administration
address: { at: settlement.treistun.treistun-e-station, tower: Civic Tower, deck: 1, section: A, unit: 1 }
about:
  - "Treistun is a K-type star, cooler than most and giving 0.29 of the Sun's light. It has nine planets: five rocky ones close in, then two gas giants and two ice giants, with fifteen moons between them. Two of the rocky worlds, d and e, have air. It is the only settled system so far: one station and ten ports, with gates to Liham, Driumum and Biraidim."
story:
  - "Treistun was settled from its fourth planet outward. The first port was Nacaubun on Hearth, and the station was raised above it once there were more ships than one field could take."
  - "From there the ports went both ways: inward to the hot, heavy worlds, and outward to the moons of the giants. The administration grew out of the port office at Nacaubun and moved up to the station with everything else."
# The code (2026-10-06): a frontier administration's, written plainly. Piracy and murder are what it fears most, so they carry
# outlawry and a bounty; fines are shares, since the registry holds no prices. One constable to 333 and one judge to 11,000
# are the world's medians (need.safety). One patrol craft to 10,000 people, and at least one at every port, is chosen.
law:
  jurisdiction: system
  offences:
    - { offence: piracy, penalties: [{ kind: outlawry, term: 315576000 }, { kind: forfeiture }, { kind: bounty, share: 0.5 }], note: "Ten years outside the law; the ship forfeit; half its worth to whoever brings it in." }
    - { offence: murder, penalties: [{ kind: outlawry, term: 946728000 }, { kind: bounty, share: 1.0 }], note: "Thirty years; the whole ship's worth as bounty." }
    - { offence: theft, penalties: [{ kind: forfeiture }, { kind: fine, share: 1.0 }], note: "What was taken is returned and as much again paid." }
    - { offence: smuggling, penalties: [{ kind: forfeiture }, { kind: fine, share: 0.5 }] }
    - { offence: zoning breach, penalties: [{ kind: warning }, { kind: fine, share: 0.1 }], note: "A warning first; then a tenth of the parcel's worth a year it stands." }
    - { offence: unlicensed mining, penalties: [{ kind: forfeiture }, { kind: fine, share: 0.5 }], note: "The ore forfeit and half its worth again." }
    - { offence: reckless flying, penalties: [{ kind: fine, share: 0.05 }], note: "A twentieth of the ship's worth; the damage done is the insurer's business." }
    - { offence: fraud, penalties: [{ kind: fine, share: 1.0 }, { kind: gaol, term: 31557600 }] }
    - { offence: evasion, penalties: [{ kind: fine, share: 0.2 }] }
  enforcement:
    constables_per: 333
    judges_per: 11000
    patrol:
      - { hull: hull.interceptor, per_people: 10000 }
    response: 600
  policies:
    duty: 0.02
    land_rate: 3.17e-10
    mining_licence: true
    insurance_to_dock: false
# The reserve law (2026-10-06): the needs people die without, as a cautious state keeps them. Four months of food and three of
# medicine are Switzerland's compulsory stocks (from memory; review); held at the two big ports under open sky, half each.
compulsory_stock:
  warehouse_cover: 1.5
  reserves:
    - { need: need.food, lasts: 10368000, held_at: [{ settlement: settlement.treistun.port-eikir, share: 0.5 }, { settlement: settlement.treistun.port-nacaubun, share: 0.5 }], note: "120 days of food for everyone in Treistun." }
    - { need: need.medicine, lasts: 7776000, held_at: [{ settlement: settlement.treistun.port-eikir, share: 0.5 }, { settlement: settlement.treistun.port-nacaubun, share: 0.5 }], note: "90 days of medicine for everyone in Treistun." }
zoning:
  - { use: port, permits: "Landing pads, hangars, fuel, warehouses and the port's own buildings." }
  - { use: industrial, permits: "Foundries, mills, workshops and yards." }
  - { use: commercial, permits: "Markets, shops and company offices." }
  - { use: civic, permits: "The administration and offices of record." }
  - { use: residential, permits: "Homes." }
