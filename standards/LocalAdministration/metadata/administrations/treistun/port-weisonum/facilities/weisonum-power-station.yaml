# yaml-language-server: $schema=../../../../../schema/facility.schema.yaml
# Invented: the port's power station. One fusion station is the smallest there is a record of, and far
# more than the warehouse draws; what the port itself draws (its pads, its hangar, its people) is not
# described yet.
identity:
  key: facility.treistun.port-weisonum.weisonum-power-station
  name: Weisonum Power Station
kind: power
parcel: parcel.treistun.port-weisonum.2
modules:
  - { module: module.fusion-power-station, count: 1 }
# What lies in its store at day 0 (seed state: what happens to it after is the economy's). A year of deuterium at full output.
stock:
  - { item: stock.deuterium-liq, quantity: 73.3 }
