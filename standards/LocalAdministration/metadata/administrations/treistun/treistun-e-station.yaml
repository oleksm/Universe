# yaml-language-server: $schema=../../../schema/settlement.schema.yaml
identity:
  key: settlement.treistun.treistun-e-station
  name: "Treistun e Station"
kind: settlement
at: body.treistun.treistun-e
structure: structure.platform
population: 25000
# Supplied from Port Eikir: 41.0 t a day of what its people take; 8.2 days each way at a torchship's cruise (1 m/s2) over the two orbits' typical separation; 6 hauler(s) on the run, so a delivery every 3.1 days (tools/standards/census.py).
resupply: { from: settlement.treistun.port-eikir, interval: 265753 }
# census: its 25,000 people by trade: the staff of its works (module.staff) and the trades its needs are served by (need.served_by), the rest dependants (children, the old, the unassigned)
census:
  - { profession: profession.teacher, count: 272 }
  - { profession: profession.nurse, count: 236 }
  - { profession: profession.innkeeper, count: 100 }
  - { profession: profession.doctor, count: 87 }
  - { profession: profession.constable, count: 76 }
  - { profession: profession.pilot, count: 48 }
  - { profession: profession.artist, count: 25 }
  - { profession: profession.performer, count: 25 }
  - { profession: profession.reporter, count: 5 }
  - { profession: profession.judge, count: 3 }
  - { profession: profession.dependant, count: 24123 }
# independents: owner-operators based here, its share by population of the 793 that fill the system's 1000 (seeding.traffic) beside the fleets
independents:
  - { hull: hull.drover, count: 36 }
  - { hull: hull.sprint, count: 27 }
  - { hull: hull.prospector, count: 18 }
  - { hull: hull.hauler, count: 9 }
about: "The system's station, in orbit round Hearth. It is a landing deck of 16 pads with the main structure standing along one edge and a hangar inside. It turns once an orbit, keeping the same side to the planet."
story:
  - "Raised above Nacaubun when the port ran out of room. The yards, the makers' offices, the Standards Foundry Office and the administration all followed the ships up, and it has been the centre of the system since."
