# yaml-language-server: $schema=../../../../../schema/facility.schema.yaml
# Invented: the port's warehouse, built as Port Trethi's is. What lies on the market here lies in it.
identity:
  key: facility.treistun.port-sirnendis.sirnendis-warehouse
  name: Sirnendis Warehouse
kind: warehouse
parcel: parcel.treistun.port-sirnendis.1
exchange: org.treistun-exchange
modules:
  - { module: module.cold-store, count: 1 }
  - { module: module.general-warehouse, count: 2 }
  - { module: module.tank-farm, count: 2 }
  - { module: module.ore-yard, count: 1 }
  - { module: module.loading-dock, count: 2 }
# What lies in its store at day 0 (seed state: what happens to it after is the economy's). 100 t of deuterium, for the ships that call: twenty-five fills of a 4 t tank. Chosen.
stock:
  - { item: stock.deuterium-liq, quantity: 100000.0 }
# Thirty days of food for its people at 1.5 kg a head a day, in a plain basket of what keeps and what the temperate farms grow. Chosen.
  - { item: stock.flour-bulk, quantity: 33800.0 }
  - { item: stock.potatoes-bulk, quantity: 27000.0 }
  - { item: stock.cabbage-bulk, quantity: 6750.0 }
  - { item: stock.carrots-bulk, quantity: 6750.0 }
  - { item: stock.onions-bulk, quantity: 6750.0 }
  - { item: stock.apples-bulk, quantity: 13500.0 }
  - { item: stock.cheese-bulk, quantity: 6750.0 }
  - { item: stock.beef-bulk, quantity: 6750.0 }
  - { item: stock.pork-bulk, quantity: 6750.0 }
  - { item: stock.chicken-bulk, quantity: 6750.0 }
  - { item: stock.sugar-bulk, quantity: 6750.0 }
  - { item: stock.vegetable-oil-bulk, quantity: 6750.0 }
# Ninety days of medicine and thirty of clothes, tools, beer and wine for its 3,000 people (seed state).
  - { item: stock.medicines-bulk, quantity: 1350.0 }
  - { item: stock.clothes-bulk, quantity: 3520.0 }
  - { item: stock.tools-bulk, quantity: 900.0 }
  - { item: stock.beer-bulk, quantity: 7200.0 }
  - { item: stock.wine-bulk, quantity: 648.0 }
