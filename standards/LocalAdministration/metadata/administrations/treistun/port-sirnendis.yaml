# yaml-language-server: $schema=../../../schema/settlement.schema.yaml
identity:
  key: settlement.treistun.port-sirnendis
  name: "Port Sirnendis"
kind: settlement
at: body.treistun.treistun-d-i
position: { latitude: -32.137, longitude: -88.842 }
structure: structure.outpost
population: 3000
# Supplied from Port Eikir: 4.9 t a day of what its people take; 0.1 days each way at a torchship's cruise (1 m/s2) over the two orbits' typical separation; 1 hauler(s) on the run, so a delivery every 2.2 days (tools/standards/census.py).
resupply: { from: settlement.treistun.port-eikir, interval: 194137 }
# census: its 3,000 people by trade: the staff of its works (module.staff) and the trades its needs are served by (need.served_by), the rest dependants (children, the old, the unassigned)
census:
  - { profession: profession.teacher, count: 33 }
  - { profession: profession.docker, count: 30 }
  - { profession: profession.nurse, count: 29 }
  - { profession: profession.plant-operator, count: 20 }
  - { profession: profession.innkeeper, count: 12 }
  - { profession: profession.doctor, count: 11 }
  - { profession: profession.clerk, count: 10 }
  - { profession: profession.constable, count: 10 }
  - { profession: profession.chemist, count: 6 }
  - { profession: profession.technician, count: 3 }
  - { profession: profession.artist, count: 3 }
  - { profession: profession.performer, count: 3 }
  - { profession: profession.engineer, count: 2 }
  - { profession: profession.electrician, count: 2 }
  - { profession: profession.farmer, count: 2 }
  - { profession: profession.pilot, count: 2 }
  - { profession: profession.reporter, count: 1 }
  - { profession: profession.judge, count: 1 }
  - { profession: profession.dependant, count: 2820 }
# independents: owner-operators based here, its share by population of the 793 that fill the system's 1000 (seeding.traffic) beside the fleets
independents:
  - { hull: hull.drover, count: 4 }
  - { hull: hull.sprint, count: 3 }
  - { hull: hull.prospector, count: 2 }
  - { hull: hull.hauler, count: 2 }
about: "The port on Harvest I, the moon of d, at 32° south. Gravity 0.13 g, no air."
story:
  - "Eikir's yard. Ships that have no business in d's air wait here, and those that do make the short drop from it."
