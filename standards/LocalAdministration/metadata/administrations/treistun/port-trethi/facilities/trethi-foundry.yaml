# yaml-language-server: $schema=../../../../../schema/facility.schema.yaml
name: Trethi Foundry
kind: foundry
parcel: 1
processes:
  - steelmaking
  - alloying-4340
  - alloying-304
  - alloying-6061
  - ingot-casting
  - quenching-and-tempering
  - annealing
  - solution-treating-and-ageing
# What it is to make: 1,800 t of steel ingot a day. Chosen so that one of each steelmaking module
# is enough, all but the hydrogen plant.
production:
  - { process: steelmaking, output: 75 }
power: trethi-power-station
# Where each thing it takes comes from, and where each thing it gives goes. Through the port:
# brought or taken by ship.
flows:
  - { item: iron-ore, from: port }
  - { item: lime, from: port }
  - { item: C, from: port }
  - { item: graphite-electrode, from: port }
  - { item: Ar, from: port }
  - { item: water, from: port }
  - { item: ingot, to: port }
  - { item: O, to: port }
