# yaml-language-server: $schema=../../../../../schema/facility.schema.yaml
identity:
  key: facility.treistun.port-trethi.trethi-foundry
  name: Trethi Foundry
kind: foundry
parcel: parcel.treistun.port-trethi.1
processes:
  - process.alloying-304
  - process.ingot-casting
  - process.quenching-and-tempering
  - process.annealing
  - process.solution-treating-and-ageing
# What it is built of. What it can make at most follows from this; what it does make is the
# economy's business.
lines:
  - makes: stock.sta36-ingot
    also: [stock.st4340-ingot, stock.st304-ingot]
    modules:
      - { module: module.ore-yard, count: 1 }
      - { module: module.pellet-plant, count: 1 }
      - { module: module.hydrogen-plant, count: 3 }
      - { module: module.shaft-furnace, count: 1 }
      - { module: module.arc-furnace, count: 1 }
      - { module: module.ladle-station, count: 1 }
      - { module: module.casting-bay, count: 1 }
      - { module: module.ingot-yard, count: 1 }
  - makes: stock.ti64-ingot
    modules:
      - { module: module.vacuum-furnace, count: 1 }
  - makes: stock.cu-ingot
    also: [stock.brz932-bar-50]
    modules:
      - { module: module.foundry, count: 1 }
  - makes: stock.sic-tl-10
    modules:
      - { module: module.carbide-furnace, count: 1 }
