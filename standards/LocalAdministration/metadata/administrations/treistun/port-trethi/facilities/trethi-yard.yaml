# yaml-language-server: $schema=../../../../../schema/facility.schema.yaml
identity:
  key: facility.treistun.port-trethi.trethi-yard
  name: Trethi Yard
kind: yard
parcel: parcel.treistun.port-trethi.4
# What it is built of. What it can make at most follows from this; what it does make is the
# economy's business.
lines:
  - makes: stock.al6061-sh-2-panel
    also: [stock.al6061-pl-5-panel, stock.sta36-pl-20-panel]
    modules:
      - { module: module.cutting-table, count: 1 }
      - { module: module.panel-former, count: 1 }
  - modules:
      - { module: module.welding-bay, count: 2 }
  - modules:
      - { module: module.machining-centre, count: 2 }
  - modules:
      - { module: module.electronics-works, count: 1 }
  - modules:
      - { module: module.assembly-shop, count: 1 }
  - modules:
      - { module: module.building-dock, count: 1 }
# Where its stock is kept.
modules:
  - { module: module.stock-yard, count: 1 }
# What lies in its store at day 0 (seed state: what happens to it after is the economy's). The stock and bought-in goods for two MC-07s and their equipment, by their parts' bills.
stock:
  - { item: good.carbon, quantity: 3720.0 }
  - { item: good.computers, quantity: 512.0 }
  - { item: good.electric-motors, quantity: 2490.0 }
  - { item: good.electronics, quantity: 2240.0 }
  - { item: good.heat-pumps, quantity: 720.0 }
  - { item: good.pumps, quantity: 542.0 }
  - { item: good.tools, quantity: 600.0 }
  - { item: stock.al6061-pl-5, quantity: 212000.0 }
  - { item: stock.al6061-sh-2, quantity: 131000.0 }
  - { item: stock.cfc-pl-3, quantity: 115.0 }
  - { item: stock.cu-wire-2, quantity: 299.0 }
  - { item: stock.mli-fl, quantity: 46.0 }
  - { item: stock.sic-tl-10, quantity: 662.0 }
  - { item: stock.st304-pl-3, quantity: 1240.0 }
  - { item: stock.st4340-bar-120, quantity: 3530.0 }
  - { item: stock.st4340-fg, quantity: 4550.0 }
  - { item: stock.st4340-tb-120x10, quantity: 838.0 }
  - { item: stock.st4340-tb-150x10, quantity: 1380.0 }
  - { item: stock.st4340-tb-200x15, quantity: 7460.0 }
  - { item: stock.ti64-pl-5, quantity: 12600.0 }
# Finished hulls in the yard at day 0 (seed state), each with its mark (SFO 21: the yard's serial, the design, the yard, finished a month apart before day 0): what a company or the insurer takes delivery of at once; past these,
# a hull is built to order in the dock's time (the game reckons it from the chain: the MC-07 in about 21 days).
  - item: hull.hauler
    pieces: 2
    serials:
      - { serial: TOL-HAULER-000001, design: hull.hauler, maker: org.tolland, made_at: facility.treistun.port-trethi.trethi-yard, made_on: -2592000 }
      - { serial: TOL-HAULER-000002, design: hull.hauler, maker: org.tolland, made_at: facility.treistun.port-trethi.trethi-yard, made_on: -5184000 }
  - item: hull.drover
    pieces: 3
    serials:
      - { serial: TOL-DROVER-000001, design: hull.drover, maker: org.tolland, made_at: facility.treistun.port-trethi.trethi-yard, made_on: -2592000 }
      - { serial: TOL-DROVER-000002, design: hull.drover, maker: org.tolland, made_at: facility.treistun.port-trethi.trethi-yard, made_on: -5184000 }
      - { serial: TOL-DROVER-000003, design: hull.drover, maker: org.tolland, made_at: facility.treistun.port-trethi.trethi-yard, made_on: -7776000 }
  - item: hull.sprint
    pieces: 2
    serials:
      - { serial: TOL-SPRINT-000001, design: hull.sprint, maker: org.tolland, made_at: facility.treistun.port-trethi.trethi-yard, made_on: -2592000 }
      - { serial: TOL-SPRINT-000002, design: hull.sprint, maker: org.tolland, made_at: facility.treistun.port-trethi.trethi-yard, made_on: -5184000 }
  - item: hull.prospector
    pieces: 1
    serials:
      - { serial: TOL-PROSPECTOR-000001, design: hull.prospector, maker: org.tolland, made_at: facility.treistun.port-trethi.trethi-yard, made_on: -2592000 }
  - item: hull.interceptor
    pieces: 1
