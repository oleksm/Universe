# yaml-language-server: $schema=../../../../../schema/facility.schema.yaml
key: facility.treistun.port-trethi.trethi-yard
name: Trethi Yard
kind: yard
parcel: 4
processes:
  - plate-work
  - machining
  - fitting
  - hull-assembly
  - fitting-out
# What it is built of. What it can make at most follows from this; what it does make is the
# economy's business.
lines:
  - process: plate-work
    modules:
      - { module: cutting-table, count: 1 }
      - { module: panel-former, count: 1 }
      - { module: welding-bay, count: 2 }
  - process: machining
    modules:
      - { module: machining-centre, count: 2 }
  - process: fitting
    modules:
      - { module: assembly-shop, count: 1 }
  - process: hull-assembly
    also: [fitting-out]
    modules:
      - { module: building-dock, count: 1 }
