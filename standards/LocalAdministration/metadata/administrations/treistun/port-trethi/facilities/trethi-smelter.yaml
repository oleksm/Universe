name: Trethi Smelter
kind: foundry
parcel: 7
processes:
  - alloying-6061
# What it is built of. What it can make at most follows from this; what it does make is the
# economy's business.
lines:
  - process: alloying-6061
    modules:
      - { module: ore-yard, count: 1 }
      - { module: alumina-refinery, count: 1 }
      - { module: potline, count: 1 }
      - { module: casthouse, count: 1 }
      - { module: ingot-yard, count: 1 }
