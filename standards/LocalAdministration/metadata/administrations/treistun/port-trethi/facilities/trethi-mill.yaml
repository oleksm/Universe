  - { item: stock.al6061-ingot, quantity: 6270000.0 }
  - { item: stock.al6061-sh-2, quantity: 402.0 }
  - { item: stock.cu-ingot, quantity: 529000.0 }
  - { item: stock.st304-ingot, quantity: 8640000.0 }
  - { item: stock.st4340-ingot, quantity: 6350000.0 }
