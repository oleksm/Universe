# yaml-language-server: $schema=../../../../../schema/facility.schema.yaml
key: facility.treistun.port-trethi.trethi-mill
name: Trethi Mill
kind: mill
parcel: 1
processes:
  - rolling
  - bar-rolling-4340
  - tube-making-4340
  - forging-4340
# What it is built of. What it can make at most follows from this; what it does make is the
# economy's business.
lines:
  - process: rolling
    modules:
      - { module: reheat-furnace, count: 1 }
      - { module: hot-rolling-mill, count: 1 }
      - { module: cold-rolling-mill, count: 1 }
      - { module: finishing-line, count: 1 }
  - process: bar-rolling-4340
    modules:
      - { module: reheat-furnace, count: 1 }
      - { module: bar-mill, count: 1 }
  - process: tube-making-4340
    modules:
      - { module: reheat-furnace, count: 1 }
      - { module: piercing-mill, count: 1 }
  - process: forging-4340
    modules:
      - { module: reheat-furnace, count: 1 }
      - { module: forging-press, count: 1 }
