# yaml-language-server: $schema=../../../../../schema/facility.schema.yaml
# Invented: the port's warehouse, built as Port Trethi's is. What lies on the market here lies in it.
identity:
  key: facility.treistun.port-nacaubun.nacaubun-warehouse
  name: Nacaubun Warehouse
kind: warehouse
parcel: parcel.treistun.port-nacaubun.1
exchange: org.treistun-exchange
modules:
  - { module: module.general-warehouse, count: 2 }
  - { module: module.tank-farm, count: 2 }
  - { module: module.ore-yard, count: 1 }
  - { module: module.loading-dock, count: 2 }
# What lies in its store at day 0 (seed state: what happens to it after is the economy's). 100 t of deuterium, for the ships that call: twenty-five fills of a 4 t tank. Chosen.
stock:
  - { item: stock.deuterium-liq, quantity: 100000.0 }
