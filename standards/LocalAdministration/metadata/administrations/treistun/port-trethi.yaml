  - { profession: profession.teacher, count: 218 }
  - { profession: profession.nurse, count: 189 }
  - { profession: profession.innkeeper, count: 80 }
  - { profession: profession.doctor, count: 69 }
  - { profession: profession.constable, count: 61 }
  - { profession: profession.machinist, count: 52 }
  - { profession: profession.docker, count: 48 }
  - { profession: profession.technician, count: 47 }
  - { profession: profession.metalworker, count: 40 }
  - { profession: profession.pilot, count: 36 }
  - { profession: profession.engineer, count: 29 }
  - { profession: profession.chemist, count: 20 }
  - { profession: profession.artist, count: 20 }
  - { profession: profession.performer, count: 20 }
  - { profession: profession.clerk, count: 16 }
  - { profession: profession.fitter, count: 16 }
  - { profession: profession.welder, count: 12 }
