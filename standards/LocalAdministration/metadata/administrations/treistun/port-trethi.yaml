# yaml-language-server: $schema=../../../schema/settlement.schema.yaml
identity:
  key: settlement.treistun.port-trethi
  name: "Port Trethi"
kind: settlement
at: body.treistun.treistun-f
position: { latitude: 6.331, longitude: 52.014 }
structure: structure.spaceport
population: 20000
# Supplied from Port Eikir: 32.8 t a day of what its people take; 10.0 days each way at a torchship's cruise (1 m/s2) over the two orbits' typical separation; 5 hauler(s) on the run, so a delivery every 4.4 days (tools/standards/census.py).
resupply: { from: settlement.treistun.port-eikir, interval: 380439 }
# census: its 20,000 people by trade: the staff of its works (module.staff) and the trades its needs are served by (need.served_by), the rest dependants (children, the old, the unassigned)
