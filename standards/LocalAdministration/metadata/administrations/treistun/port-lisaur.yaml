# yaml-language-server: $schema=../../../schema/settlement.schema.yaml
identity:
  key: settlement.treistun.port-lisaur
  name: "Port Lisaur"
kind: settlement
at: body.treistun.treistun-c
position: { latitude: -6.649, longitude: -44.994 }
structure: structure.spaceport
population: 20000
# Supplied from Port Eikir: 32.8 t a day of what its people take; 6.7 days each way at a torchship's cruise (1 m/s2) over the two orbits' typical separation; 4 hauler(s) on the run, so a delivery every 3.9 days (tools/standards/census.py).
resupply: { from: settlement.treistun.port-eikir, interval: 334756 }
# census: its 20,000 people by trade: the staff of its works (module.staff) and the trades its needs are served by (need.served_by), the rest dependants (children, the old, the unassigned)
census:
  - { profession: profession.teacher, count: 218 }
  - { profession: profession.nurse, count: 189 }
  - { profession: profession.innkeeper, count: 80 }
  - { profession: profession.doctor, count: 69 }
  - { profession: profession.constable, count: 61 }
  - { profession: profession.docker, count: 30 }
  - { profession: profession.plant-operator, count: 28 }
  - { profession: profession.artist, count: 20 }
  - { profession: profession.performer, count: 20 }
  - { profession: profession.chemist, count: 10 }
  - { profession: profession.clerk, count: 10 }
  - { profession: profession.technician, count: 5 }
  - { profession: profession.farmer, count: 4 }
  - { profession: profession.reporter, count: 4 }
  - { profession: profession.pilot, count: 4 }
  - { profession: profession.engineer, count: 2 }
  - { profession: profession.electrician, count: 2 }
  - { profession: profession.judge, count: 2 }
  - { profession: profession.dependant, count: 19242 }
about: "The port on Anvil, close to the equator at 7° south. Gravity 1.67 g, the highest of any port, and no air."
story:
  - "Pilots treat Lisaur as a test. A ship that can lift loaded from here can lift from anywhere in the system, and a ship that can't finds out on the pad."
