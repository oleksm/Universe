# yaml-language-server: $schema=../../../schema/settlement.schema.yaml
identity:
  key: settlement.treistun.port-zaudalein
  name: "Port Zaudalein"
kind: settlement
at: body.treistun.treistun-b
position: { latitude: -8.849, longitude: 58.156 }
structure: structure.spaceport
population: 20000
# Supplied from Port Eikir every 20 days: chosen by how far it lies (the inner worlds three weeks, Rime a month, the giants' moons two); a haul reckoned from the orbits is owed.
resupply: { from: settlement.treistun.port-eikir, interval: 1.728e+06 }
about: "The port on Cinder, the innermost planet, at 9° south. Gravity 0.96 g, no air, and about 560 K."
story:
  - "The hottest port in the system. Its crews keep to b's long night and go under cover for the day. Few stay longer than a contract."
