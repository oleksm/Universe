# yaml-language-server: $schema=../../../schema/settlement.schema.yaml
identity:
  key: settlement.treistun.port-nacaubun
  name: "Port Nacaubun"
kind: settlement
at: body.treistun.treistun-e
position: { latitude: 23.813, longitude: -79.362 }
structure: structure.spaceport
population: 60000
# Supplied from Port Eikir: 98.5 t a day of what its people take; 8.2 days each way at a torchship's cruise (1 m/s2) over the two orbits' typical separation; 13 hauler(s) on the run, so a delivery every 1.4 days (tools/standards/census.py).
resupply: { from: settlement.treistun.port-eikir, interval: 122655 }
# census: its 60,000 people by trade: the staff of its works (module.staff) and the trades its needs are served by (need.served_by), the rest dependants (children, the old, the unassigned)
census:
  - { profession: profession.teacher, count: 653 }
  - { profession: profession.nurse, count: 567 }
  - { profession: profession.innkeeper, count: 240 }
  - { profession: profession.doctor, count: 207 }
  - { profession: profession.constable, count: 181 }
  - { profession: profession.artist, count: 60 }
  - { profession: profession.performer, count: 60 }
  - { profession: profession.docker, count: 30 }
  - { profession: profession.plant-operator, count: 12 }
  - { profession: profession.reporter, count: 12 }
  - { profession: profession.pilot, count: 12 }
  - { profession: profession.clerk, count: 10 }
  - { profession: profession.farmer, count: 10 }
  - { profession: profession.judge, count: 6 }
  - { profession: profession.engineer, count: 2 }
  - { profession: profession.electrician, count: 2 }
  - { profession: profession.chemist, count: 2 }
  - { profession: profession.technician, count: 1 }
  - { profession: profession.dependant, count: 57933 }
# independents: owner-operators based here, its share by population of the 793 that fill the system's 1000 (seeding.traffic) beside the fleets
independents:
  - { hull: hull.drover, count: 86 }
  - { hull: hull.sprint, count: 65 }
  - { hull: hull.prospector, count: 43 }
  - { hull: hull.hauler, count: 22 }
about: "The port on Hearth, the home world, at 24° north. Gravity 0.98 g, with air, and cold."
story:
  - "The first port in the system. It was built where the first ship came down, and nobody saw a reason to move it. The station overhead took most of its trade; Nacaubun keeps the ground traffic."
  - "It stands on frozen ground at 19 below. Nothing is grown outside; its halls raise salad under lamps and the rest of what it eats comes up from Harvest."
