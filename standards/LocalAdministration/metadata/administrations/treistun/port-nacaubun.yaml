# yaml-language-server: $schema=../../../schema/settlement.schema.yaml
identity:
  key: settlement.treistun.port-nacaubun
  name: "Port Nacaubun"
kind: settlement
at: body.treistun.treistun-e
position: { latitude: 23.813, longitude: -79.362 }
structure: structure.spaceport
population: 60000
about: "The port on Hearth, the home world, at 24° north. Gravity 0.98 g, with air, and cold."
story:
  - "The first port in the system. It was built where the first ship came down, and nobody saw a reason to move it. The station overhead took most of its trade; Nacaubun keeps the ground traffic."
  - "It stands on frozen ground at 19 below. Nothing is grown outside; its halls raise salad under lamps and the rest of what it eats comes up from Harvest."
