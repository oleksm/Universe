at: body.treistun.treistun-c-i
position: { latitude: -43.742, longitude: -87.965 }
structure: structure.outpost
population: 3000
# Supplied from Port Eikir: 4.9 t a day of what its people take; 6.7 days each way at a torchship's cruise (1 m/s2) over the two orbits' typical separation; 1 hauler(s) on the run, so a delivery every 15.5 days (tools/standards/census.py).
