$schema: http://json-schema.org/draft-07/schema#
title: Parcel
description: 'standards/LandRegister/metadata/parcels/<name>.yaml: one piece of land and who owns it.'
type: object
additionalProperties: false
required: [name, administration, body, owner]
properties:
  name: { type: string }
  administration: { type: string, description: The administration that manages it (its file name in LocalAdministration). }
  body: { type: string, description: The body it is on or at (one of its administration's bodies). }
  place: { type: string, description: Where on the body. }
  owner: { type: string, pattern: '^(brand|body)\.[a-z0-9_]+$', description: Who owns it (a company in Maker House, or a standards body). }
