sources:
- document: docs/spaceship-building-workflow-proposal.md
  section: 4.4 Maintain separate representations
  note: Owner-authorized workflow definition; project values and results are not instantiated.
statement: 'Keep editable, evaluated, render, collision, accounting and envelope representations distinct and
  traceable.


  | Representation | Purpose | Must preserve |

  |---|---|---|

  | Editable master | Profiles, custom surfaces and design decisions | Semantic controls and manual intent
  |

  | Evaluated construction | Actual modifiers, solids/sheets and attachments | Source design and declared construction
  |

  | Render/export meshes | Materials, hierarchy, visibility and animation ownership | Identity, required nodes
  and interface frames |

  | Collision/interaction | Exterior physics, walking, selection and use | Open passages and operational states
  |

  | Mass/engineering | Registry parts, measured solids and explicit allowances | Ownership and accounting provenance
  |

  | Envelopes | Placement, service and motion exclusions | Conservative coverage and meaningful open space
  |


  Evaluated Blender geometry includes modifier results; checks against an unevaluated cage can miss what is
  exported. Export can also change triangulation and vertex counts at normal or UV discontinuities, so source
  totals are not final runtime totals. ([Blender dependency graph API](https://docs.blender.org/api/5.2/bpy.types.Depsgraph.html),
  [Blender glTF exporter](https://docs.blender.org/manual/en/3.6/addons/import_export/scene_gltf2.html))


  Collision is not automatically the visible hull. A convex approximation around the whole vessel can close
  its ramp and aisle. Interior walking, moving passengers and ship motion require explicit engine support.
  External engine documentation illustrates why visual and physics representations differ, but its restrictions
  must not be imported as FREEFALL rules. ([Godot collision representation example](https://docs.godotengine.org/en/4.4/tutorials/physics/collision_shapes_3d.html))


  A conservative functional envelope and a designed outer skin are different representations. Passing headroom/module
  probes does not select the visible exterior. Keep applicable crew/module/access/motion envelopes intact while
  designing regional cockpit, neck, crown, shoulder and belly controls around actual tasks/allocations; do
  not extrude standing height through every region or declare unallocated volume wasted. After clearance-driven
  reshaping, use current side/top/front silhouettes and clay views for ship-check.identity, with original intent/landmark
  witnesses and separate visual/functional decisions. Panels or smoothing cannot supply a missing primary-form
  decision.'
applies_to:
- Maintain separate representations
verification:
- Walking openings remain open in collision representation.
- Use evaluated geometry for export comparison and registry ownership for mass accounting.
- 'Review counterexamples: headroom fix erases cockpit identity, broad generic-ring expansion claimed approved
  without allocation, omitted canopy marked accepted, panels replace silhouette decision, or old views pass
  new shape. Keep these manual visual findings separate from synthetic declaration tests.'
limitations:
- This is a reusable workflow definition, not a ship approval or evidence that a proposed tool exists.
