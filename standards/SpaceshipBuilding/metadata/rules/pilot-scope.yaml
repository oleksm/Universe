statement: 'Prove a deliberately small cockpit, neck and belly-ramp study before generalizing.


  The illustrative pilot is a small single-pilot utility hull with a hawk-like cockpit, a narrow neck widening
  into a central body, and a belly ramp deploying forward toward the cockpit. These traits derive from the
  earlier discussion but are **not a binding ship design or authorization to start modelling**. The owner would
  first confirm the mission, scale, crew fixture, cargo and landing assumptions.


  The pilot includes three actively authored regions—cockpit, neck and widening belly—within a deliberately
  simple complete exterior. It includes one pilot fixture, one access/cargo fixture, one demonstrated ramp
  mechanism and reused static equipment placeholders. It excludes new propulsion design, new clamp qualification,
  procedural fleet generation, elaborate habitation, damage systems and complete thermal/structural certification.


  Its purpose is to demonstrate that an approved silhouette survives useful interior space, local regeneration
  and an exported moving opening. A decorative finished ship that cannot rebuild cleanly fails this pilot.
  A perfectly reproducible shape that loses the cockpit character also fails.'
applies_to:
- Proposed pilot scope
verification:
- Pilot is illustrative until a concrete mission and fixtures are selected.
- No fleet, propulsion redesign or held mount work is implicitly authorized.
limitations:
- This is a reusable workflow definition, not a ship approval or evidence that a proposed tool exists.
