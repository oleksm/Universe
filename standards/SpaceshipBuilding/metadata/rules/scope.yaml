  section: 1.1 Scope and intended outcome
  note: Owner-authorized workflow definition; project values and results are not instantiated.
statement: 'Apply this workflow to original inhabitable ship designs; keep the registry definitions separate
  from concrete ship instances.


  The target is a distinctive ship with the visual ambition associated with Star Citizen: recognizable proportions,
  a convincing cockpit, inhabitable spaces, readable mechanisms and consistent construction detail. This is
  not a reproduction of CIG''s current private pipeline or a request to copy a particular vessel. The workflow
  must support original small ships first and larger, multi-zone vessels later, without turning each into an
  unrelated procedural script or a single unmanageable prompt.


  The deliverable is a coordinated design: custom hull geometry where identity requires it; referenced equipment
  where the registry already supplies it; an assembly document defining placement; explicit access and motion
  data; and evidence showing what has actually been checked. An attractive exterior alone is insufficient.
  A populated box with a vaguely pointed nose is also insufficient, even when its dimensions pass.


  The existing short guidelines (external repository `blender:docs/spaceship-building-guidelines.md`) remain
  the quick working agreement. This detailed proposal adds requirements, artifacts, authority, state transitions
  and failure handling. “Must” below describes the proposed acceptance contract, not a claim that the relevant
  tool already exists.'
applies_to:
- Scope and intended outcome
verification:
- Check type/instance and workflow-definition files are separate.
- Verify modelling holds are not released by workflow publication.
limitations:
