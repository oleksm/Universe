sources:
- document: docs/spaceship-building-workflow-proposal.md
  section: 3.4 Author stations, profiles and guide curves
  note: Owner-authorized workflow definition; project values and results are not instantiated.
statement: "Place semantic stations at shape events and preserve profile correspondence through each loft.\n\
  \nPlace stations at shape events: nose, pilot eye, canopy apex, canopy rear, neck minimum, shoulder onset,\
  \ maximum beam, ramp corners, equipment bulkheads and stern interface. Each station specifies its local plane,\
  \ centerline offset, profile control points and semantic correspondence. Longitudinal dorsal, keel and shoulder\
  \ curves guide transitions between sections. Port/starboard symmetry is explicit and can be intentionally\
  \ broken.\n\nStation order and section orientation must be checked before lofting. A profile's vertex correspondence\
  \ cannot change accidentally between sections: an upper chine must not connect to a lower shoulder because\
  \ an array was reordered. Changes in topology\u2014window openings, branching nacelles, a split stern\u2014\
  require an explicit transition region or manual patch with its own boundary contract. They are not ordinary\
  \ parameter edits.\n\nA local MC-07 helper already lofts X-ordered sections with matching vertex counts;\
  \ Blender also documents bridging loops with twist and interpolation controls. Neither provides an automatic\
  \ general-purpose ship designer. The proposed tool should retain profile editing and purpose-built surfaces\
  \ instead of forcing every cockpit into one fixed polygon ring. (MC-07 helper (external repository `blender:build_mining_ship.py:361`),\
  \ [Blender Bridge Edge Loops](https://docs.blender.org/manual/en/4.4/modeling/meshes/editing/edge/bridge_edge_loops.html))\n\
  \nReview section overlays on evaluated geometry, not only control curves. For each edited station, compare\
  \ local interior clearance, skin/service allowance, neighboring tangents and registered silhouette. Choose\
  \ per-region tolerances from the actual design scale and output purpose; there is no universal station spacing\
  \ or millimetre tolerance in this proposal.\n\nUse region-specific crown, shoulder, belly and cockpit controls\
  \ to express the intended mass hierarchy while preserving actual functional envelopes and shared boundaries.\
  \ Review nose termination, canopy/brow and cockpit-to-neck-to-body transitions in registered silhouette and\
  \ clay alternatives. Intentional curves and supporting planes can coexist; do not prescribe universal ratios\
  \ or add facets to disguise a proportion problem. A narrower-looking shoulder is not justified until module,\
  \ structure and service allocations permit the change."
applies_to:
- Author stations, profiles and guide curves
verification:
- Check ordering, winding and semantic vertex correspondence.
- Branching or changed topology uses an explicit transition region; inspect evaluated section overlays.
- Compare current silhouette and clay hierarchy and curve/plane transitions through ship-check.identity after
  profile/clearance edits; verify actual envelopes separately.
limitations:
- This is a reusable workflow definition, not a ship approval or evidence that a proposed tool exists.
