identity:
  key: ship-rule.attachment-qualification
  name: Attachment and qualification boundaries
  about: Separate visible contact from compatible attachment, actual frame allocation and engineering qualification.
status: draft
implementation: proposed
owner: registry
sources:
- document: docs/spaceship-building-workflow-proposal.md
  section: 4.3 Keep physical attachment and visual adjacency separate
  note: Owner-authorized workflow definition; project values and results are not instantiated.
statement: 'Separate visible contact from compatible attachment, actual frame allocation and engineering qualification.


  A reusable module should appear once in the assembly/BOM and retain its own model reference. Shared holders
  count once. A mesh touching a frame does not establish load transfer. Structural attachment requires compatible
  interfaces and a complete path through equipment, holder and frame, with the qualification status of every
  link visible.


  The parked clamp/bridge studies remain parked. This proposal does not authorize new holder geometry or treat
  provisional friction, equal shares or bolt capacities as qualification. Missing actual frame allocation,
  stiffness or joint data blocks a qualified-load claim without necessarily blocking a clearly labelled visual
  prototype. (Physical mount proposal (registry repository `docs/proposals/physical-mounts.md`))'
applies_to:
- Keep physical attachment and visual adjacency separate
verification:
- Count shared holders once.
- Do not promote reaction closure, bolt size or assumed equal sharing to qualified stiffness/strength.
limitations:
- This is a reusable workflow definition, not a ship approval or evidence that a proposed tool exists.
