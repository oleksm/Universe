# yaml-language-server: $schema=../../schema/ship-rule.schema.yaml
identity:
  key: ship-rule.module-reuse
  name: Discover modules before architecture
  about: Use the existing modular inventory and supported placement consumer before sizing interior or cockpit
    spaces.
status: draft
implementation: mixed
owner: ships
sources:
- document: docs/spaceship-building-workflow-proposal.md
  section: 3.5 Co-design cockpit, routes and hull
  note: 'Owner correction, 2026-10-21: discover and reuse existing modules before interior sizing; no custom
    fit-out substitutes.'
statement: 'Before G3 aisle, cabin or cockpit sizing, discover reusable modules for the agreed functions. Search
  the current registry and the actual Studio/runtime catalogue; inspect installed model availability and the
  supported placement consumer. Record candidate keys, record revision/hash, real envelope, mass, mount/port
  frames, service and removal clearances, model manifest/version/hash and consumer revision. Discovery is not
  selection: draft, outdated, held or missing models remain explicit limitations. Do not infer an endurance
  or habitation requirement from the existence of a module.


  For each selected product, keep one stable instance ID linked to its existing equipment record and installed
  model, with its supported transform and one BOM entry. Pilot seats and command consoles are included in this
  reuse rule. Do not author furniture substitutes, bake model copies into the hull, shrink modules to fit,
  or count the same physical instance in both hull and module BOMs. A displayed copy for authoring is a reference
  instance with retained provenance, not newly owned hull geometry. Use the actual consumer origin/bounds-centre
  and mount frame; an editor envelope does not rescale or qualify the model.


  Declare ownership before modelling: hull shell, ribs, apertures and hull mechanisms remain hull geometry;
  equipment remains reusable product instances. Floors, linings, doors and fixtures require an explicit ownership
  and consumer decision. Current editable deck floor/wall polygons are walking architecture, not proof of stocked
  panel, shoe, clamp or lining installation. Stock-built structure and modular deck products keep their own
  identities and quantities. Avoid coincident hull/deck floors, double collision surfaces and duplicated BOM
  items. Do not rename a built-in module as hull lining to bypass reuse.


  If selection is unresolved, use clearly labelled non-exported space and motion reservations only. A proxy
  cannot count as installed equipment, satisfy its function or supply mass, power, service or capacity ratings.
  If no suitable product, installed model or consumer placement exists, record a gap, affected requirement
  and owner; escalate to Registry/Ships for reuse alternatives or a separately authorized new-module proposal.
  A missing module is not permission to fabricate one. Continue independent hull/access work without passing
  dependent arrangement or release gates.


  Before G3 acceptance, validate the selected instance inventory against the actual consumer: registry equipment
  keys, poses, slot/fit restrictions, model frames, mounts, ports, services, access and removal paths. A hull-free
  layout study and a hull-bound fit have different consumer prerequisites. The maintained ship schema is unchanged;
  schema success does not prove catalogue lookup, physical installation or load transfer. Test rejection of
  unsearched inventory, duplicate baked mesh/BOM ownership, a reservation promoted to installed equipment and
  a missing-module gap used to justify fabrication. Label declaration tests separately from actual geometry,
  placement and runtime checks.'
applies_to:
- G3 arrangement, cockpit and interior fit-out, and material revisions affecting module allocation.
verification:
- Pin the inventory search, candidate records/models and actual consumer contract before arrangement sizing.
- Reconcile selected instance IDs, geometry ownership, transforms and single-count BOM against export and runtime
  layout.
- Exercise the four declaration failure cases, then verify actual mesh and consumer evidence separately.
limitations:
- A definition or declaration check does not allocate a module, prove geometric fit or implement an unsupported
  placement/holder layer.
related:
- ship-artifact.module-inventory
- ship-artifact.spatial-layout
- ship-check.assembly
- ship-stage.architecture
