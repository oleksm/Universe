statement: 'Use source-backed methods within their stated historical and technical scope.


  Historical CIG accounts support resolving mission and identity before expensive surface work. Ryan Church''s
  2012 Constellation discussion connects crew, purpose, emotional character, silhouette exploration and functional
  resolution in 3D. The useful lesson is to preserve an explicit design choice through subsequent construction,
  rather than expecting detail to rescue weak proportions. This is evidence from one historical project. ([RSI
  interview, 2012](https://robertsspaceindustries.com/en/comm-link/transmission/12783-Introducing-The-RSI-Constellation-Mk3))


  The 2015 Cutlass account describes revisions spanning gameplay role, thruster placement, interior organization
  and concept paintovers. Its relevance is the coupling of exterior, behavior and occupied space: a change
  that improves one can invalidate another. It does not establish a universal set of spacecraft dimensions.
  ([CIG Cutlass design history, 2015](https://robertsspaceindustries.com/en/comm-link/engineering/15056-Design-Notes-Sharpening-The-Cutlass))


  CIG''s historical pipeline separated concept, hangar and flight readiness, while its May 2015 report discussed
  a common manufacturer language for details. We adopt separate readiness claims and a reusable visual grammar;
  we do not adopt undocumented present-day staffing, schedules or polygon budgets. ([CIG pipeline, 2014](https://robertsspaceindustries.com/en/comm-link/transmission/14244-How-Ideas-Take-Flight-The-Star-Citizen-Ship-Pipeline),
  [CIG studio report, 2015](https://robertsspaceindustries.com/en/comm-link/transmission/14758-Monthly-Studio-Report-May-2015))


  Local experience makes interface discipline particularly important. Cradle v1 had correct port positions
  but incorrect facing directions; a raw-GLB test exposed what a position-only check missed. Bridge studies
  achieved algebraic reaction closure yet lacked feasible actual frame allocations. These are different failures
  and require different checks: representation correctness, assembly feasibility and engineering qualification
  cannot substitute for one another. (Cradle diagnostic (external repository `blender:physical-mounts/cradle-v1-port-diagnostic.json`),
  bridge allocation review (private historical review; not a required registry dependency))


  External sources below supplied specific methods or historical examples. The workflow rules, schema examples
  and pilot are proposed synthesis. No source establishes a universal spacecraft budget, safe mechanism or
  qualified FREEFALL ship.


  | Source | Scope used |

  |---|---|

  | [RSI Constellation interview, 2012](https://robertsspaceindustries.com/en/comm-link/transmission/12783-Introducing-The-RSI-Constellation-Mk3)
  | Historical artist account of identity and functional design |

  | [CIG ship pipeline, 2014](https://robertsspaceindustries.com/en/comm-link/transmission/14244-How-Ideas-Take-Flight-The-Star-Citizen-Ship-Pipeline)
  | Historical staged readiness and reuse |

  | [CIG Cutlass history, 2015](https://robertsspaceindustries.com/en/comm-link/engineering/15056-Design-Notes-Sharpening-The-Cutlass)
  | Coupled role, arrangement and visual revision |

  | [CIG May 2015 report](https://robertsspaceindustries.com/en/comm-link/transmission/14758-Monthly-Studio-Report-May-2015)
  | Historical manufacturer design language |

  | [NASA physical characteristics](https://www.nasa.gov/reference/4-0-physical-characteristics-and-capabilities-vol-2/)
  and [crew interfaces](https://www.nasa.gov/reference/10-0-crew-interfaces-vol-2/) | Tailored fit/reach/view/task
  evaluation, no certification claim |

  | [NASA/TP-2014-218556](https://ntrs.nasa.gov/api/citations/20140009559/downloads/20140009559.pdf) | Iterative
  human integration evaluation |

  | [Blender Bridge Edge Loops 4.4](https://docs.blender.org/manual/en/4.4/modeling/meshes/editing/edge/bridge_edge_loops.html),
  [Depsgraph 5.2](https://docs.blender.org/api/5.2/bpy.types.Depsgraph.html) | Profile construction and evaluated
  geometry |

  | [Blender CLI 3.6](https://docs.blender.org/manual/en/3.6/advanced/command_line/arguments.html), [Boolean
  documentation](https://docs.blender.org/manual/en/dev/modeling/modifiers/generate/booleans.html), [glTF exporter
  3.6](https://docs.blender.org/manual/en/3.6/addons/import_export/scene_gltf2.html) | Build/export foundations;
  installed-version behavior must be rechecked |

  | [Khronos glTF 2.0](https://registry.khronos.org/glTF/specs/2.0/glTF-2.0.html), [validator](https://github.com/KhronosGroup/glTF-Validator/blob/main/README.md)
  | Interchange frames, hierarchy and format validation |

  | [Godot collision](https://docs.godotengine.org/en/4.4/tutorials/physics/collision_shapes_3d.html), [LOD](https://docs.godotengine.org/en/4.7/tutorials/3d/mesh_lod.html),
  [performance](https://docs.godotengine.org/en/stable/tutorials/performance/optimizing_3d_performance.html)
  | Illustrative methods only; not the FREEFALL engine contract |


  Local sources were read through research notes dated 2026-10-20. Registry and ships snapshot revisions are
  recorded in section 1.3; Blender sources and skills are working-tree files with no revision asserted here.
  Earlier proposals may lag implementation and must not override maintained schemas.


