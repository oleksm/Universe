  | `registry repository/docs/formats/freefall-motion-1.schema.yaml` | Motion interchange schema |

  | `external repository blender/build_mining_ship.py` | Existing profile/loft helpers, not a generic compiler
  |

  | `external repository blender/physical-mounts/check_ports.py` | Raw-GLB port-check pattern |

  | `external repository blender/physical-mounts/cradle-v1-port-diagnostic.json` | Concrete orientation regression
  evidence |

  | `private historical bridge-contract review (2026-10-19; not bundled)` | Actual-frame allocation limitations
  |

  | `external installed workflow: shipbuilding/SKILL.md` | Live Blender inspection and localized repair practices
  |

  | `external installed workflow: freefall-asset-delivery/SKILL.md` | Existing asset state machine and acceptance
  |

  | `external installed workflow: freefall-asset-delivery/references/execution-loop.md` | Evidence invalidation
  and recovery practices |

  | `external repository blender/docs/spaceship-building-guidelines.md` | Short owner-facing workflow agreement
  |


  The research notes are retained at `external repository blender/research_notes/Spaceship generation workflow
  specification/design.md`, `production.md` and `local-contracts.md`. The canonical proposal is `external repository
  blender/docs/spaceship-generation-workflow-spec.md`; the complete report copy is `external repository blender/reports/Spaceship
  generation workflow specification.md`. Both copies should remain identical until one is explicitly retired
  or replaced by a versioned publication process.'
