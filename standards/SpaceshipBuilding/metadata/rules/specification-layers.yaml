  section: 2.2 Keep three complementary specification layers
  note: Owner-authorized workflow definition; project values and results are not instantiated.
statement: 'Maintain separate functional, visual-identity and construction requirements with explicit verification.


  | Layer | Defines | Typical acceptance |

  |---|---|---|

  | Functional requirements | Crew tasks, cargo, access, equipment, operating modes, service routes | Measured
  fit, task demonstration and consumer tests |

  | Visual grammar | Proportions, silhouette, landmarks, curvature, glazing and detail hierarchy | Registered
  views and owner decision |

  | Construction interpretation | Regions, seams, structures, joints, openings and source ownership | Geometry,
  connection and assembly checks, with qualification labels |


  A requirement record has a stable ID, statement, rationale, owner, source, severity, status and verification
  method. Hard functional constraints, identity constraints and preferences remain distinguishable. Passing
  a beautiful render cannot waive a blocked escape path. Conversely, fitting a pilot volume cannot accept a
  cockpit that lost the selected character.


  Assumptions use their own IDs and statuses: proposed, approved-for-prototype, superseded or resolved. Each
  assumption names the decision that would replace it and the artifacts it affects. “Small utility ship” is
  not enough to infer crew anthropometry, gravity, cargo dimensions or endurance. Those remain named inputs
  or visible unknowns.'
applies_to:
- Keep three complementary specification layers
verification:
- Every hard requirement names its owner and check.
- Do not trade away access to satisfy appearance or accept visual drift because dimensions pass.
limitations:
- This is a reusable workflow definition, not a ship approval or evidence that a proposed tool exists.
