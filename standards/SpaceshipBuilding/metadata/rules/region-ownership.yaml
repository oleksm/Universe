sources:
- document: docs/spaceship-building-workflow-proposal.md
  section: 3.3 Define named regions and shared boundaries
  note: Owner-authorized workflow definition; project values and results are not instantiated.
statement: 'Give each region and shared boundary one authoritative source and controlled consumers.


  Regions follow meaningful shape and construction changes: cockpit pod, canopy, neck, shoulder, belly, stern,
  nacelles or fins. They are not arbitrary equal-length slices. Each has one authoritative source: procedural
  generator, editable manual surface, referenced component or derived output. A generator may replace only
  its owned output collections.


  ```yaml

  id: REG-COCKPIT

  source_kind: editable_sections

  source: source/cockpit-profiles.yaml

  requirements: [REQ-COCKPIT-01, REQ-PILOT-VIEW-01]

  references: [REF-COCKPIT-SIDE-02]

  owned_collections: [Hull_Cockpit, Canopy_Frame]

  interfaces: [IF-COCKPIT-NECK-01]

  read_only_neighbors: [REG-NECK]

  acceptance_views: [CAM-TOP, CAM-SIDE, CAM-FRONT, CAM-PILOT]

  checks: [CHECK-PILOT-CLEARANCE, CHECK-CANOPY-PROFILE]

  allowed_auto_changes: [repair_normals, remove_duplicate_faces]

  ```


  The region record also carries editable parameters, permitted ranges, keep-in/out volumes, mass ownership,
  protected landmarks, material roles and downstream dependencies. Boundary curves are owned once and consumed
  by both sides. An intentional crease, tangent-continuous join and curvature-continuous join are different
  contracts; coincident vertices alone do not satisfy all three.'
applies_to:
- Define named regions and shared boundaries
verification:
- Generated collections are the only allowed mutation targets.
- Manual inputs and read-only neighbors retain their hashes unless a recorded design change reopens them.
- Reconcile the intended assembly roster with actual objects and region contracts before claiming parts-designed.
  Separating a monolithic surface into named objects, materials or collections cannot satisfy missing assembly
  purpose, design controls or interfaces.
- Review each assembly in the complete ship as well as locally. Repeated or mirrored assemblies may share a
  design contract, but every placement and junction remains covered; one assembly may use several objects and
  a coherent assembly may be a single mesh.
- Before dependent detailing, record separate current construction/interface and independent assembled visual
  verdicts in the existing candidate checkpoint. Missing, failed, stale or unresolved required evidence holds
  that scope; continue reversible alternatives and unrelated authorized work.
- After repair, regenerate affected assembly and whole-ship witnesses and have the relevant reviewer close
  the named defect. A local visual pass, a builder declaration, a synthetic test pass or object splitting alone
  cannot close an assembled visual failure.
limitations:
- This is a reusable workflow definition, not a ship approval or evidence that a proposed tool exists.
