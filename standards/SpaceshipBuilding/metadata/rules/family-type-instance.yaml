  section: 2.1 Separate family, type and instance
  note: Owner-authorized workflow definition; project values and results are not instantiated.
statement: 'Separate reusable visual grammar, one ship design and a configured instance.


  A **family** defines shared visual grammar and compatible module practices: characteristic section shapes,
  canopy treatment, edge vocabulary, materials and service-panel conventions. It does not determine every hull.
  A **type** defines one ship design: mission, capacity, arrangement, hull regions, equipment allocation and
  supported operating states. An **instance** selects a type revision and permitted options, placements, finish
  or damage state without silently rewriting the type.


  A generation seed is an instance input, not design authority. Randomization may vary approved secondary details
  within declared bounds. It must not move the pilot seat, alter a ramp mechanism or change the ship''s recognized
  silhouette unless that variation is an explicitly approved type option. Different seed streams for finish
  and layout prevent a paint adjustment from changing geometry.'
applies_to:
- Separate family, type and instance
verification:
- Seed variation cannot silently alter protected silhouette, equipment allocation or mechanism.
- Instance options resolve to a pinned type revision.
limitations:
- This is a reusable workflow definition, not a ship approval or evidence that a proposed tool exists.
