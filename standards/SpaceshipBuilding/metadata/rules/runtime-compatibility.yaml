  section: 2.4 Add an authoring sidecar, not another runtime format
  note: Owner-authorized workflow definition; project values and results are not instantiated.
statement: "Author references and regional intent outside the maintained .ship.yaml runtime schema.\n\nThe\
  \ maintained ship schema accepts a defined set of fields and rejects unknown ones. Proposed references, region\
  \ generators and review decisions therefore belong in an authoring sidecar. A future adapter projects only\
  \ supported assembly information into `.ship.yaml`; unsupported requirements remain explicit in the sidecar.\
  \ Registry equipment facts stay upstream. (Maintained ship schema (external repository `universe-ships:crates/core/ship-design/ship.schema.json`))\n\
  \nThe following YAML is an **illustrative proposed authoring format**, not an implemented parser contract.\
  \ IDs, file paths and seed values are examples; the pilot design is not approved by this document.\n\n```yaml\n\
  format: freefall-ship-workflow/0-proposal\nid: ship.pilot-01\nrevision: 1\nstatus: proposed\nfamily: family.example-utility\n\
  runtime_document: assembly/pilot-01.ship.yaml\nframes:\n  authoring:\n    units: m\n    handedness: right\n\
  \    right: '+X'\n    up: '+Z'\n    forward: '+Y'\n  runtime:\n    units: m\n    handedness: right\n    right:\
  \ '+X'\n    up: '+Y'\n    forward: '-Z'\n  authoring_to_runtime: [[1, 0, 0], [0, 0, 1], [0, -1, 0]]\nauthorities:\n\
  \  identity: owner\n  hull_design: ships\n  geometry: blender\n  equipment_facts: registry\n  consumer: engine\n\
  intent:\n  role: small_single_pilot_utility\n  identity_requirements: [REQ-COCKPIT-01, REQ-NECK-01, REQ-RAMP-01]\n\
  requirements: requirements.yaml\nassumptions: assumptions.yaml\nreferences: references/index.yaml\nregions:\
  \ [regions/cockpit.yaml, regions/neck.yaml, regions/belly.yaml]\ninterfaces: interfaces.yaml\nbuild:\n  entry:\
  \ build.py\n  toolchain_lock: toolchain.lock.yaml\n  dependency_lock: dependencies.lock.yaml\n  seed_streams:\
  \ {layout: 41, finish: 92}\n  manual_inputs: [source/canopy-approved.blend]\nreview:\n  cameras: review/cameras.yaml\n\
  \  decisions: review/decisions.yaml\n  active_candidate: candidate-004\nrelease: candidate-004/delivery.yaml\n\
  ```\n\nThe sidecar owns design intent and input references. Existing `delivery.yaml` owns package workflow\
  \ and evidence state; the installer owns release manifests. The adapter should fail on unsupported required\
  \ output rather than dropping it. Its proposed roundtrip test preserves stable author IDs, intended placements,\
  \ access and decks through the current Studio representation."
applies_to:
- Add an authoring sidecar, not another runtime format
verification:
- Proposed adapter rejects unsupported required output.
- No authoring-only field enters runtime data without schema and consumer support.
limitations:
- This is a reusable workflow definition, not a ship approval or evidence that a proposed tool exists.
