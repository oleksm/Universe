statement: 'Build owned regions from pinned inputs through an acyclic dependency graph; promote only checked candidates.


  Design exploration can alternate hull and interior decisions, but an individual build requires an acyclic dependency
  graph. Freeze a coherent arrangement revision, then derive geometry from that revision. The proposed graph runs
  from brief/reference selections through profiles and shared boundaries to region geometry, mechanisms, detail,
  collision/LOD, export and evidence.


  A change identifies its owned region and affected dependencies before mutation. Build into a candidate collection
  or clean file, validate, compare with accepted neighbors, then promote the candidate. Unaffected equipment and
  manually authored sources retain their hashes. Shared boundary changes notify both consumers; the system must
  not silently repair the neighbor by regenerating it.


  Manual geometry is first-class source. Its file, object IDs, revision and input hash are pinned. Editing generated
  output is either temporary and discarded or explicitly promoted into a manual input with ownership changed. Never
  rely on a hidden live-session adjustment that disappears during a clean build.


  Pin Blender, exporter settings, scripts, registry dependency versions, source files and seed streams. A clean
  background build must not depend on selection or active-object state. Blender provides command-line execution
  mechanisms; determinism across arbitrary versions is not guaranteed. Compare canonical geometry/attribute/transform
  signatures, documenting nondeterministic metadata rather than demanding unexplained byte identity. ([Blender command-line
  documentation](https://docs.blender.org/manual/en/3.6/advanced/command_line/arguments.html))


  Viewport-directed correction: For viewport-directed corrections, capture the current camera/state, identify the
  actual object and feature by picking geometry, and bind the proposed operation to that feature. Show an annotated
  target or selected outline when ambiguous. After an owner correction reveals a misunderstanding, resolve the target
  before any further speculative cut. Do not demand confirmation for every routine edit.


  Profile operation and baseline: Establish assembled nose, glazing, belly and shoulder profiles before detail.
  Record accepted and rejected examples as project preferences, not universal style laws. For prolong/shorten/raise
  edits, identify axis, fixed landmarks, preserved slopes or tangencies, intersection and percentage baseline. Incremental
  percentages use the stated current or selected baseline; never silently change it.


  Assembly symmetry and exceptions: Declare symmetry by assembly and exceptions by intent. A symmetric feature correction
  includes its counterpart, closures and dependent trim. Check mirrored world geometry and both visible sides; legitimate
  asymmetric equipment must not be mirrored merely because the hull is symmetric.


  Separate intent, geometry and presentation: Report intent, geometry and presentation separately. Intent asks whether
  the requested feature changed in the specified direction; geometry checks the affected closures, contacts and
  applicable motion; presentation judges the close view and assembled ship. A technical pass cannot substitute for
  either intent or visual judgment. Unknown or failed required outcomes prevent an overall completion claim.


  Removing or replacing a support is a dependency change, even if every surviving part is static. Inventory its
  dependent covers, closures, trim, markings, fasteners and service attachments by actual owner and function, including
  mirrored, duplicate, hidden, linked and generated/source copies. Retire obsolete dependents from current source,
  build and export, or explicitly rebind them to a current supported host with geometric witnesses. Prevent regeneration
  from stale scripts. Preserve required closure/function through a replacement where needed; do not remove a pressure
  closure merely to hide an orphan. Invalidate affected construction, views and exports until current attachment
  and deletion-dependency evidence is reconciled.'
applies_to:
- Compile a dependency DAG for local regeneration
verification:
- Clean build does not depend on selection or hidden session edits.
- Manual source is pinned; unrelated geometry remains unchanged.
- Same-camera before/after plus target object/feature and measured change.
- Construction-line profile and before/after landmark coordinates.
- Named counterpart roster, declared plane and paired before/after inspection.
- Verify separate intent, geometry and presentation against the current declared source, scope, required states
  and applicable evidence; unknowns do not establish the dependent claim.
- 'Required rejection example: Percentage adjustment uses an unstated or stale baseline. This is a review case specification,
  not an executed result.'
- 'Required rejection example: Repeated wrong-target edits proceed after owner correction without target disambiguation.
  This is a review case specification, not an executed result.'
- 'Permitted scoped example: Scoped routine change with unambiguous target, paired counterpart and current local
  evidence. This is a review case specification, not an executed result.'
- Reject support removal that leaves or regenerates a floating cover/marking on either side, including duplicated
  or hidden/source objects, even when moving-versus-fixed clearance remains zero-hit. Verify actual current source/build/export
  disposition and affected functional closure.
- Resolve retained versus genuinely obsolete dependents from current owner intent and delivery scope. Removing a
  support does not authorize deleting a required inspection panel; rebind it to the intended current wall/support
  and preserve access/purpose. Reject deletion offered as completion of a requested seating repair.
limitations:
- This is a reusable workflow definition, not a ship approval or evidence that a proposed tool exists.
