purpose: Declare closure and installation ownership early, then bind complete assembly QC to actual parts,
  states, pairs and views.
contents:
- Stable actual component IDs and ownership, including inherited/hidden/export geometry, modules, closures,
  gear/bays, ramp/actuators and service runs/supports.
- 'Opening register: boundary, owner, intended open/closed state, closure/mating/support geometry, designed
  seams, crew/pressure implications and unresolved decisions.'
- Gear deployed/stowed/transition and bay/door envelopes; supports/contacts, actuator anchors, service routes
  and permitted combinations/interlocks.
- Cockpit command-module/canopy/sill/roof-neck/floor interfaces, access and module mounts; deliberate gaps
  distinguished from defects.
- Independent required component/state/interaction-pair/view matrix, measured coverage, exclusions with authority,
  aggregate status and retained partial results.
- Closed/open/intermediate/combined-state stern, underside, cockpit and interior witnesses, exact source/export
  hashes, sampling limits and consumer status.
- Integrated early hull/gear/bay/support blockout, deployed/stowed/transition side/front/underside silhouettes
  and clay, declared ground plane, extension/compression contact heights and ramp relationship; current whole-ship
  visual verdict and shape-feedback disposition before detail.
- 'Volume-purpose map and longitudinal/transverse sections for gear-driven hull changes: actual cabin, referenced
  products, folded/deployed sweeps, support/closure depth, required clearance and deliberate aesthetic mass.
  Mark unsupported or undecided blank volumes; do not turn them into fictional equipment or cabin requirements.'
- 'Access location and complete opening finish: Compare access locations with plans and open/closed sections before
  mechanism detail. Identify landing, loading route, branch/turn, operating space, ground connection and neighboring
  compartments. Treat each opening as clear passage plus sill, jambs, header, thickness return and exterior closure.
  Inspect at crew eye level for leftover strips, knife-like converging walls, abrupt steps and unfinished edges;
  manifold meshes and zero collision samples alone do not establish usable or finished access.'
- 'Required evidence for access location and complete opening finish: Opening sections, inside/outside eye-level
  views and applicable geometry/route checks.'
- 'Actual gear-derived local bays: Derive local bay candidates from actual unscaled deployed/stowed/swept gear with
  explicit clearance allowances. Review belly continuity, protrusion and ground height in the assembled hull before
  detail. Existing gear-state and volume-purpose rules remain authoritative; do not inflate the whole cabin or treat
  a compressed demonstration pose as qualified powered stowage.'
boundary: An early plan may contain bounded unknowns; it does not pass architecture, mechanism, pressure, assembly
  or runtime acceptance.
consumers:
- blender
- ships
- registry
- engine
