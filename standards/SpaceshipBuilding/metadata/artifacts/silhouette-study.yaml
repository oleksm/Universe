identity:
  key: ship-artifact.silhouette-study
  name: Silhouette alternatives and selection
  about: Which coherent whole-ship identity is selected?
status: draft
implementation: proposed
owner: blender
sources:
- document: docs/spaceship-building-workflow-proposal.md
  section: 3.2 Compare a small set of coherent silhouettes
  note: Owner-authorized workflow definition; project values and results are not instantiated.
purpose: Which coherent whole-ship identity is selected?
contents:
- Comparable top, side, front, underside and three-quarter views with fixed cameras/light/scale.
- Small set of rough alternatives; three is a proposed adjustable default.
- Protected landmarks and selected candidate hash, trade-off and decision reference.
- 'Detailed authored information and examples:

  The proposed default is three inexpensive directions, adjustable when the design problem warrants fewer or
  more. Use identical camera positions, orthographic framing, lighting and flat materials. Show top, side,
  front, underside and two three-quarter views. Include one scale fixture and a minimal cockpit/interior occupancy
  outline; omit panel lines and small hardware.


  Evaluate first-read character, volume distribution, important negative spaces, cockpit-to-body relation and
  recognizability at thumbnail size. Select one coherent candidate rather than mixing every appealing feature
  across alternatives. Record the selected proportions and distinctive landmarks. Numeric image differences
  are review triggers, not a substitute for aesthetic judgment.


  The owner packet states one decision, a recommended direction and its main trade-off. It includes the chosen
  candidate''s input hash and camera set. After approval, a geometry repair that changes the beak, canopy slope,
  neck constriction or maximum beam location returns to this visual gate if it exceeds agreed guardrails. A
  normal correction does not.'
- 'Prompt revision and per-feature review: met, missed, ambiguous or intentionally varied, with visual witnesses
  and unseen-feature limitations.'
boundary: A metric flags visual drift; owner or delegate judges identity.
consumers:
- blender
- ships
rules:
- ship-rule.family-type-instance
- ship-rule.feature-intake
checks:
- ship-check.identity
