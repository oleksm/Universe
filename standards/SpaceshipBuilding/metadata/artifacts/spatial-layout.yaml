  note: Owner-authorized workflow definition; project values and results are not instantiated.
purpose: Can crew, cargo and service tasks use the arrangement?
contents:
- Pre-sizing module discovery/selection and ownership map, using actual product envelopes and consumer frames;
  reservations remain non-exported.
- Separate space adjacency and actual traversal graphs; declared crew/suit/cargo fixtures.
- Pilot ingress, eye/reach/knee/pedal space and direct/sensor-view distinction.
- Useful volume, structure, skin, service/insulation and armour allowances.
- Emergency-route scope and equipment removal paths, with concrete witnesses.
- 'Detailed authored information and examples:

  Maintain a spatial adjacency graph and a separate task-route graph. The first states which spaces touch;
  the second demonstrates that a person or cargo can actually move between them. Maintain service-removal routes
  as well: a fitted engine or battery is not serviceable if its removal path passes through permanent structure.


  The volume model separates useful occupied space, structural depth, pressure skin where applicable, services/insulation
  and external armour. Accepted aisle space cannot be consumed silently by a later rib or hose. Fixtures include
  standing, seated, turning, reaching, carrying and ingress poses appropriate to the intended crew and worn
  equipment.


  NASA''s human-system guidance emphasizes task-specific fit, reach, view and operation across the intended
  population rather than one nominal body. We borrow that evaluation approach, not a claim of NASA compliance.
  The project must select its own character and suit fixtures and state their limitations. ([NASA physical
  characteristics guidance](https://www.nasa.gov/reference/4-0-physical-characteristics-and-capabilities-vol-2/),
  [NASA human integration process](https://ntrs.nasa.gov/api/citations/20140009559/downloads/20140009559.pdf))


  The cockpit fixture includes seat travel, eye points, head/helmet rotation, knee and pedal space, control
  reaches and the transition into the seat. Render actual pilot views. Report direct visibility separately
  from sensor-assisted visibility; a camera feed does not improve a physical window''s field of view. Control
  availability should be evaluated during the intended task, not from a third-person beauty view. ([NASA crew-interface
  guidance](https://www.nasa.gov/reference/10-0-crew-interfaces-vol-2/))


  When packaging conflicts arise, compare local alternatives: move equipment, adjust a bulkhead, change the
  seat approach or modify one profile. Each alternative reports silhouette impact, useful-space change and
  access consequences. Global enlargement is a major design decision because it changes mass assumptions, equipment
  fit, mechanisms and the selected visual proportions.'
- Actual selected module clearance/access matrix and inherited geometry ownership; boxes alone do not prove
  containment, traversal, assembly or serviceability.
boundary: Provisional fixtures do not certify population coverage or safety; actual gameplay routes need consumer
  checks.
