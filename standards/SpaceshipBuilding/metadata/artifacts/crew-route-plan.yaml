# yaml-language-server: $schema=../../schema/ship-artifact.schema.yaml
identity:
  key: ship-artifact.crew-route-plan
  name: Crew routes and operating sequence plan
  about: Can crew move, operate and recover through the declared ship states?
status: draft
implementation: proposed
owner: ships
sources:
- document: docs/spaceship-building-workflow-proposal.md
  section: 3.5 Co-design cockpit, routes and hull
  note: Owner crew-pathway correction, 2026-10-21; state-bound traversal and operation, with requirement and
    fixture provenance.
purpose: Plan continuous task routes and safe operating positions before hull and mechanism arrangement acceptance.
contents:
- 'Independent required origin/destination, task, actor/envelope and state roster: cockpit, cabin and exterior/exit;
  nominal, suited, carrying and emergency/recovery tasks only as required by the confirmed brief. Separate
  adjacency from actual traversability.'
- Continuous supported path geometry, floor/landing transitions and slopes/steps, turning and staging space,
  headroom, handholds where required, door/ramp thresholds and cockpit ingress. Identify any path surface owned
  by a moving mechanism and what remains usable when it moves.
- Closed, open, intermediate and combined ramp/gear/door states; route availability in each state and an operable
  transition sequence from both sides. A closed exit need not be traversable if opening is a reachable validated
  operation; do not silently omit required states.
- Operator standing/seated/control reach and waiting/refuge positions outside moving swept volumes, including
  the position before actuation, throughout movement and after movement. No sequence may require standing on
  the moving ramp or crossing its sweep without an explicit supported task and measured evidence.
- 'Recovery from the declared jam, power-loss or blocked-route cases: accessible controls/manual release, escape/refuge
  path, assistance assumptions and interlock/consumer dependencies. Record missing recovery scope as undecided
  rather than assert all failures covered.'
- Exact requirement/allowance source, revision, units, authority and applicability; derived values retain inputs/method.
  Human, suit, carry/load and equipment fixtures retain key/source/hash, dimensions, posture/range and intended
  population/task scope. Project proxies remain explicitly provisional.
- Expected versus actual route/state/task rows with current source, fixture, module, mechanism and export hashes;
  measured bottleneck/pose, evidence, exclusions and result. Separate geometric measurement, requirement comparison,
  human/task review and runtime walking/operation status.
- When required route space conflicts with hull shape, retain a region-bound G2/G3 reshape action, protected
  intent, unchanged envelope and stale downstream claims; unresolved criteria remain unknown.
boundary: Planning may retain unknowns; no numerical compliance, population coverage, continuous motion or
  runtime route acceptance follows from this definition. Required unknowns block dependent acceptance.
consumers:
- ships
- blender
- engine
- registry
depends_on:
- ship-artifact.requirements
- ship-artifact.module-inventory
- ship-artifact.assembly-state-plan
rules:
- ship-rule.claim-boundaries
- ship-rule.evidence-invalidation
- ship-rule.module-reuse
checks:
- ship-check.crew-routes
