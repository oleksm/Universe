# yaml-language-server: $schema=../../schema/ship-artifact.schema.yaml
identity:
  key: ship-artifact.interfaces
  name: Interface and frame contracts
  about: How do two regions, components or mechanisms meet?
status: draft
implementation: mixed
owner: ships
sources:
- document: docs/spaceship-building-workflow-proposal.md
  section: 4.1 Use explicit local and global frames
  note: Owner-authorized workflow definition; project values and results are not instantiated.
purpose: How do two regions, components or mechanisms meet?
contents:
- Stable ID, interface kind, owning rigid part and parent frame.
- Origin, complete orientation including roll, mating role and registry key if applicable.
- Permitted transform, occupied volume, tool/insertion/service access and shared boundary continuity intent.
- Source-to-runtime profile and unique exported marker name mapping.
boundary: Registry interface facts stay upstream; full primary mount transforms cannot be replaced by bounds
  centering.
consumers:
- ships
- blender
rules:
- ship-rule.attachment-qualification
- ship-rule.coordinate-profiles
checks:
- ship-check.hull-geometry
- ship-check.construction
- ship-check.raw-port-frames
- ship-check.assembly
