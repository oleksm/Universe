# yaml-language-server: $schema=../../schema/ship-artifact.schema.yaml
identity:
  key: ship-artifact.release-package
  name: Immutable candidate release
  about: What exact content and consumer claims were accepted?
status: draft
implementation: mixed
owner: installer
sources:
- document: docs/spaceship-building-workflow-proposal.md
  section: 6.4 Freeze releases and retain their provenance
  note: Owner-authorized workflow definition; project values and results are not instantiated.
purpose: What exact content and consumer claims were accepted?
contents:
- Editable source, pinned inputs/toolchain, export and supported motion/collision definitions.
- Previews, source/export/runtime reports, hashes and accepted limitations.
- Installer-owned manifest/pointer, version and tested consumer revision/feature list.
boundary: Never hand-edit a released package; changes require a new candidate and version.
consumers:
- installer
- ships
- blender
rules:
- ship-rule.immutable-release
checks:
- ship-check.raw-port-frames
- ship-check.runtime
- ship-check.release
