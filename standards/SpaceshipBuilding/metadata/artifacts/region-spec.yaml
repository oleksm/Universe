identity:
  key: ship-artifact.region-spec
  name: Region source contract
  about: What can a local build change and what must it preserve?
status: draft
implementation: proposed
owner: blender
sources:
- document: docs/spaceship-building-workflow-proposal.md
  section: 3.3 Define named regions and shared boundaries
  note: Owner-authorized workflow definition; project values and results are not instantiated.
- document: docs/spaceship-building-workflow-proposal.md
  section: 3.4 Author stations, profiles and guide curves
  note: Owner-authorized workflow definition; project values and results are not instantiated.
purpose: What can a local build change and what must it preserve?
contents:
- Stable region ID, source kind/path, owned collections, manual inputs and pinned hashes.
- Semantic stations, profile correspondence, guide curves, protected landmarks and permitted ranges.
- Shared boundary owners, read-only neighbors, interfaces and keep-in/out volumes.
- Requirements, material roles, cost/accounting ownership and acceptance views/checks.
- 'Route/module failure feedback: owning hull/arrangement region, immutable applicable envelopes, protected
  intent/landmarks, alternatives, conflict owner and downstream invalidation/recheck list.'
- For every claimed designed assembly, record its functional purpose and visual role in the complete ship,
  linked brief IDs, authoritative source and editable design controls. Map actual generated/referenced objects
  to this intent; an object count or renamed mesh slice is not design evidence.
- Record adjacent assembly IDs, the shared interface owner, mating frames/boundaries, deliberate join treatment,
  support/attachment and access/service obligations with criterion sources and unresolved items. Reuse pinned
  product contracts instead of inventing or scaling equipment.
- Bind per-assembly intent and interface evidence to the frozen candidate, brief and applicable module/envelope
  inputs. Include isolated construction witnesses and assembled silhouette/clay views, independent reviewer
  observations, scoped verdict, defect owner and recheck method before dependent detail.
boundary: A generator may mutate only its owned output. A topology transition requires explicit design treatment.
consumers:
- blender
- ships
rules:
- ship-rule.hull-sections
