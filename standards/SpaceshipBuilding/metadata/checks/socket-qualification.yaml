# yaml-language-server: $schema=../../schema/ship-check.schema.yaml
identity:
  key: ship-check.socket-qualification
  name: Socket and fit qualification
  about: The criteria every hull record's sockets, fit and nozzle bindings must meet, run by tools/standards/ship_qualify.py
    on any hull or candidate; this record defines the check, not a result.
status: draft
implementation: existing
owner: registry
sources:
- document: docs/spaceship-building-workflow-proposal.md
  section: 6.1 Use a complete evidence checklist
  note: 'Owner, 2026-10-24: qualification criteria live in the registry so any ship can run them; the game reads the
    registry. F3 and T1-T3 mirror the game''s mount_fit (crates/core/world/src/ship.rs) and bind_engines (import.rs).'
method:
- 'H1 whole mass: physical.mass, or a parts folder the mass is worked out from.'
- 'S1 slot names unique.'
- 'S2 a slot''s mount exists, is of the slot''s kind, and its size class is no bigger than the slot''s.'
- 'S3 each slot''s mount envelope fits inside the hull (sorted sides against sorted hull sides).'
- 'S4 all slot mount envelopes together fit inside the hull''s box volume.'
- 'S5 the hull model has a node mount_<slot> for every slot.'
- 'F1 each fit entry names a declared slot, each slot fitted once; F2 the item is a registry equipment record.'
- 'F3 the game''s fit rule: the item names a mount of the slot''s kind and no bigger class; its size within the mount envelope;
  mass within what the mount bears; power within what it feeds (plants exempt); an engine''s thrust within what it bears;
  a slot with no mount by size class.'
- 'F4 the fitted item itself fits inside the hull.'
- 'T1 each nozzle binding names a declared slot; T2 the model has the nozzle node; T3 engine slots only - each share over 0
  and up to 1, each nozzle bound once, an engine slot''s shares summing to 1.'
evidence:
- Per hull the faults by criterion and what could not be judged (no model to read is unchecked, never a pass).
failure: A fault blocks the hull's adoption of those slots or that fit. Records marked outdated are reported, not gated.
scope: export
artifacts:
- ship-artifact.interfaces
coverage: Geometric containment uses bounding sides and box volume, not exact shapes; overlap between sockets, load paths
  and receiver bearing (rule.joint-bearing-evidence) are separate evidence.
