# yaml-language-server: $schema=../../schema/ship-check.schema.yaml
identity:
  key: ship-check.motion-coverage
  name: Mechanism motion screening
  about: Mechanism motion screening for an exact candidate; this record defines the check, not its result.
status: draft
implementation: mixed
owner: blender
sources:
- document: docs/spaceship-building-workflow-proposal.md
  section: 4.2 Resolve the complete ramp and landing mechanism
  note: Owner-authorized workflow definition; project values and results are not instantiated.
- document: docs/spaceship-building-workflow-proposal.md
  section: 6.1 Use a complete evidence checklist
  note: Owner-authorized workflow definition; project values and results are not instantiated.
method:
- Exercise rest, extrema, intermediate and permitted combined states; refine near contact.
- Measure anchor continuity, actuator reach/overlap, cable seating and supported pose hierarchy.
- Test interlocks in consumer separately; sampled poses alone do not prove continuous clearance.
- State all tested and omitted parts/pairs; include actuators, services, gear/bays, floors and cockpit boundaries
  for full-assembly claims. Aggregate only through complete required coverage.
evidence:
- Sampling schedule, worst pose/pair, measured margins, excluded states and runtime status.
failure: Retain the failing witness and last passing candidate. Block only dependent claims/stages; repair
  or obtain the missing decision, then rerun affected checks.
scope: motion
artifacts:
- ship-artifact.mechanism-spec
- ship-artifact.evidence
- ship-artifact.assembly-state-plan
coverage: Scope is the declared candidate, inputs, methods and consumer features. No engineering or unsampled/runtime
  claim is inferred.
rules:
- ship-rule.claim-boundaries
