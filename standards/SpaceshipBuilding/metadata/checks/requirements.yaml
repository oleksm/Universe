# yaml-language-server: $schema=../../schema/ship-check.schema.yaml
identity:
  key: ship-check.requirements
  name: Requirements coverage
  about: Requirements coverage for an exact candidate; this record defines the check, not its result.
status: draft
implementation: mixed
owner: ships
sources:
- document: docs/spaceship-building-workflow-proposal.md
  section: 2.2 Keep three complementary specification layers
  note: Owner-authorized workflow definition; project values and results are not instantiated.
- document: docs/spaceship-building-workflow-proposal.md
  section: 6.1 Use a complete evidence checklist
  note: Owner-authorized workflow definition; project values and results are not instantiated.
method:
- Trace every must requirement and assumption to an owner, current artifact and check.
- Confirm hard function and visual identity are separately verified.
- At intake, verify six feature areas, carried-forward answers, required/preferred/undecided labels and
  confirmed brief revision.
- Before sketching, trace every required feature and exclusion to the current prompt; verify remaining
  unknowns are permitted variation rather than silent choices.
- Compare inherited answers against the frozen actual-owner baseline by stable ID and meaning; simulated
  inputs and proposed interpretations cannot replace or confirm actual answers.
- Check confirmation authority and real-design or rehearsal-only scope against the exact current brief
  hash. Permission to rehearse does not grant real design approval.
- Check coverage witnesses in the actual prompt text for every required feature and exclusion; independently
  review meaning, not just IDs or checklist status.
- Exercise missing-feature, simulated-authority-as-real and changed-input negative cases; stale dependent
  evidence cannot pass a later gate.
evidence:
- Requirement-to-check matrix with unresolved conflicts and candidate input hashes.
- Confirmed brief, feature-to-prompt checklist and bounded unresolved decisions.
failure: Retain the failing witness and last passing candidate. Block only dependent claims/stages; repair
  or obtain the missing decision, then rerun affected checks.
scope: requirements
artifacts:
- ship-artifact.requirements
- ship-artifact.assumptions
- ship-artifact.sketch-prompt
coverage: Scope is the declared candidate, inputs, methods and consumer features. No engineering or unsampled/runtime
  claim is inferred.
rules:
- ship-rule.claim-boundaries
- ship-rule.feature-intake
