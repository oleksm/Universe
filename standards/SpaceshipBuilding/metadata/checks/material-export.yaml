# yaml-language-server: $schema=../../schema/ship-check.schema.yaml
identity:
  key: ship-check.material-export
  name: Source export and runtime materials
  about: Source export and runtime materials for an exact candidate; this record defines the check, not its
    result.
status: draft
implementation: mixed
owner: blender
sources:
- document: docs/spaceship-building-workflow-proposal.md
  section: 4.6 Build surfaces from material roles and readable scale
  note: Owner-authorized workflow definition; project values and results are not instantiated.
- document: docs/spaceship-building-workflow-proposal.md
  section: 6.1 Use a complete evidence checklist
  note: Owner-authorized workflow definition; project values and results are not instantiated.
method:
- Compare shared material roles in neutral source and reimported export views.
- Verify texture paths, color space, transparency/normals and actual consumer substitutions.
evidence:
- Matched views, exported bindings/costs and separately reported target-renderer evidence.
failure: Retain the failing witness and last passing candidate. Block only dependent claims/stages; repair
  or obtain the missing decision, then rerun affected checks.
scope: materials
artifacts:
- ship-artifact.region-spec
- ship-artifact.performance-budget
coverage: Scope is the declared candidate, inputs, methods and consumer features. No engineering or unsampled/runtime
  claim is inferred.
rules:
- ship-rule.claim-boundaries
