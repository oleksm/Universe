# yaml-language-server: $schema=../../schema/ship-check.schema.yaml
identity:
  key: ship-check.pilot-16
  name: P16 Release traceability
  about: Pilot acceptance definition; no pilot ship or passing result is created.
status: draft
implementation: proposed
owner: blender
sources:
- document: docs/spaceship-building-workflow-proposal.md
  section: 7.2 Pilot acceptance tests
  note: Owner-authorized workflow definition; project values and results are not instantiated.
method:
- Trace each accepted claim to exact candidate/input/script/export hashes and responsible evidence.
evidence:
- Every accepted claim points to exact candidate, tool and evidence hashes
- Exact candidate inputs, method, expected/observed result and retained failure witness.
failure: Do not declare the pilot complete while this required test fails or lacks evidence. Preserve the candidate
  and correct only its affected scope.
scope: release
coverage: A proposed test definition, not evidence of implemented tooling. Sampling limits and held engineering
  work remain explicit.
artifacts:
- ship-artifact.evidence
rules:
- ship-rule.pilot-scope
- ship-rule.claim-boundaries
