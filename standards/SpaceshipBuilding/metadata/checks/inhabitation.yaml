method:
- Exercise actual fixture ingress, movement, seated reach/view and equipment removal routes.
- Check declared emergency-route scope, narrow obstacles and service-volume preservation.
evidence:
- Pose/route witnesses, pilot views and minimum clearances with fixture limitations.
failure: Retain the failing witness and last passing candidate. Block only dependent claims/stages; repair
  or obtain the missing decision, then rerun affected checks.
