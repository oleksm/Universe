# yaml-language-server: $schema=../../schema/ship-check.schema.yaml
identity:
  key: ship-check.runtime
  name: Consumer feature verification
  about: Consumer feature verification for an exact candidate; this record defines the check, not its result.
status: draft
implementation: mixed
owner: engine
sources:
- document: docs/spaceship-building-workflow-proposal.md
  section: 6.1 Use a complete evidence checklist
  note: Owner-authorized workflow definition; project values and results are not instantiated.
- document: docs/spaceship-building-workflow-proposal.md
  section: 6.2 Store enough evidence to reproduce a result
  note: Owner-authorized workflow definition; project values and results are not instantiated.
method:
- Load the exact package in the named consumer revision.
- Test placement/scale, collision/walking, interaction, playback/interlocks and GPU visuals independently.
evidence:
- Consumer logs/captures, pose/route witnesses, workload/settings and per-feature outcomes.
failure: Retain the failing witness and last passing candidate. Block only dependent claims/stages; repair
  or obtain the missing decision, then rerun affected checks.
scope: runtime
artifacts:
- ship-artifact.release-package
- ship-artifact.performance-budget
- ship-artifact.mechanism-spec
coverage: Scope is the declared candidate, inputs, methods and consumer features. No engineering or unsampled/runtime
  claim is inferred.
rules:
- ship-rule.claim-boundaries
