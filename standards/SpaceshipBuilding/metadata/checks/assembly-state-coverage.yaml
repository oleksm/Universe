method:
- Reconcile expected versus actual component, state, interaction-pair and view rosters independently of checker
  name/parent filters; preserve hashes and classify every exclusion with a bounded reason.
- Cover shell and closures, cockpit/command interfaces, floors/products, gear/bays/doors, ramp, both sides
  of actuators, services and supports. Include inherited/hidden/export parts relevant to the claim.
- Inspect complete closed/rest, open/deployed, intermediate and permitted combined configurations, including
  gear/ramp/access/service interactions. Validate forbidden-state interlocks separately in the consumer.
- 'Check opening boundaries and intended closure/mating/support geometry independently of collisions. An unclosed
  stern/cockpit or missing gear bay cannot pass because no meshes intersect. Material-mesh manifoldness alone
  is insufficient: an annular shell end can leave the occupied enclosure open.'
- Check actuator/pipe/hose routing through floors, structure and crew paths, endpoint/joint seating and supports;
  require actual gear stow/transition and bay clearance for retractability claims.
- Review state-bound stern, underside, cockpit/interface and interior witnesses as well as side/top/hero views.
  Sparse rays or a beauty render do not prove complete closure or internal assembly.
- Record measured subset and worst pair/pose. Reject any promotion of a ramp-only or component-only sweep to
  full assembly, even when all its sampled poses have zero hits.
- 'Aggregate required rows fail-closed: missing, failed, stale, unresolved or unjustifiably excluded parts/states/pairs/views
  prevent acceptance. Preserve independent valid subset results and invalidate affected rows after changes.
  Require actual current outcomes for required pair, state and view rows, not just labels saying they were
  tested.'
- Apply ship-check.crew-routes to continuous support and actor/task/state traversal, reachable operating positions
  outside mechanism sweeps and declared recovery sequences; collision-only results cannot pass inhabitation.
- Confirm early integrated gear/bay/support silhouette and ground-height review in the whole assembly before
  dependent detail. Recheck actual deployed, stowed and transition ground contacts, support junctions and ramp
  relation after arrangement changes; keep visual, clearance and load results separately required.
- 'Assembly symmetry and exceptions: Declare symmetry by assembly and exceptions by intent. A symmetric feature
  correction includes its counterpart, closures and dependent trim. Check mirrored world geometry and both visible
  sides; legitimate asymmetric equipment must not be mirrored merely because the hull is symmetric.'
- 'Separate intent, geometry and presentation: Report intent, geometry and presentation separately. Intent asks
  whether the requested feature changed in the specified direction; geometry checks the affected closures, contacts
  and applicable motion; presentation judges the close view and assembled ship. A technical pass cannot substitute
  for either intent or visual judgment. Unknown or failed required outcomes prevent an overall completion claim.'
- 'Required rejection example: One side repaired while declared symmetric counterpart and closure remain unchanged.
  This is a review case specification, not an executed result.'
- 'Required rejection example: Manifold knife-like opening edge accepted without passage-eye-level review. This
  is a review case specification, not an executed result.'
- 'Permitted scoped example: Explicit asymmetric feature retained while symmetric hull opening is repaired on both
  sides. This is a review case specification, not an executed result.'
- Audit static attachment and deletion dependencies independently of the moving-part clash roster. When a support/host
  is removed or replaced, trace surviving covers, closures, trim, markings, fasteners and services to a current
  purpose and supported host; object parenting, names or lack of collision are not physical attachment evidence.
- Reconcile mirrored, duplicate, hidden, linked, generated/source and exported dependents. Each obsolete object
  is retired with build regeneration prevented, or explicitly rebound with current world-space seating/support/interface
  witnesses. An intentionally offset marking still needs a real host and purpose; this review does not invent a
  universal offset or load qualification.
- 'Required rejection case: a bridge support is removed while covers and duplicated markings remain floating, but
  a zero-hit moving-versus-fixed sweep is promoted to complete assembly acceptance. Reject the unsupported static/deletion-dependency
  claim. This is a case specification, not an executed result.'
evidence:
- Assembly-state plan with independent expected/actual component/state/pair/view reconciliation and reasoned
  exclusions.
- Source/export hashes, complete state-view witnesses, closure/interface/support findings, collision/clearance
  measurements and worst-case poses.
- Aggregate result explicitly bounded to measured coverage; partial results and unresolved consumer/continuous-motion
  claims retained.
- Named counterpart roster, declared plane and paired before/after inspection.
- Separate current intent/geometry/presentation outcomes with exact target, source, camera/state, measured change,
  applicable scope and reviewer authority. Manual visual judgments are not synthetic beauty scores.
- Before/after support-host dependency roster, current source/build/export object dispositions including both sides
  and duplicate/hidden copies, replacement closure/function ownership and current static attachment witnesses. Keep
  moving-clash, static attachment and complete-assembly verdicts distinct.
failure: Keep the candidate in failed or incomplete assembly review for the affected scope; retain witnesses and
  repair the owning geometry or missing coverage before dependent G4/G6 and release acceptance. Required failed
  or unknown intent, geometry or presentation prevents an overall completion claim. A correctly annotated target
  whose actual changed/exported geometry affects another feature remains an intent failure. Preserve authorized
  limited-study scope and existing owner/delegate authority. Missing, stale or unsupported required static attachments
  after support removal block the affected construction/assembly claim even when moving-part clearance passes. Preserve
  valid measured subsets and repair or rebind the orphaned dependency before claiming completion.
scope: assembly
artifacts:
- ship-artifact.assembly-state-plan
- ship-artifact.mechanism-spec
- ship-artifact.interfaces
- ship-artifact.module-inventory
- ship-artifact.evidence
- ship-artifact.crew-route-plan
coverage: Full assembly only for the reconciled declared scope and exact inputs. Subset sweeps, declaration
  tests and sparse rays cannot establish whole geometry, continuous motion, pressure, structural or runtime
  qualification.
rules:
- ship-rule.claim-boundaries
- ship-rule.construction-and-detail
- ship-rule.evidence-invalidation
limitations:
- This definition is a review/check contract, not an implemented generic whole-assembly geometry engine.
