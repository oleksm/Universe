method:
- Compare registered full-ship views and protected landmarks against the selected candidate.
- Inspect thumbnail silhouette and declared camera distances; expose inferred reference regions.
- Review each sketch against brief feature IDs and prompt variation limits; record met, missed, ambiguous or
  intentionally varied without treating hidden geometry as observed.
- Identify candidate image hash, current prompt hash and view/region witnesses for visual findings. Record
  hidden features as not observable; separate exterior identity from occupancy and engineering.
- Review the current iteration independently and retain previous candidates, misses and bounded limitations;
  a passing text-coverage check is not visual acceptance.
- Compare component counts, fore/aft positions, camera projection and mechanism poses across every labelled
  view and the rough occupancy diagram. Labels and image captions cannot override visible contradictions; a
  closed ramp witness must depict its closed pose.
- After clearance-driven hull reshaping, review the current exterior again before dependent G3/G4/G6 acceptance;
  retain functional clearance as a separate jointly required result. An envelope passing a probe is not a selected
  exterior.
- Use registered side/top/front black silhouettes and plain-clay orthographic before/after views, fixed camera/scale/projection/light
  and declared mechanism state; include underside/three-quarter witnesses. Review thumbnail readability and
  cockpit/neck/body hierarchy before panel detail.
- Trace original brief/reference feature IDs and protected cockpit/brow/beak/neck/shoulder/beam/belly/ramp
  landmarks relevant to this design. Distinguish observed current features, changed interpretation and omitted/unobservable
  landmarks; no universal ratio or missing canopy accepted by proxy.
- Bind current source/evaluated candidate, render hashes, camera/state set and comparison baseline. A prior
  shape decision or old view cannot pass a changed hull; record owner/delegate judgment and current authority,
  not merely a coverage count.
- If fit and identity conflict, compare regional form/arrangement alternatives with applicable crew/module/access
  envelopes unchanged. Retain failed witnesses and escalate incompatible requirements; do not shrink products/fixtures,
  silently discard intent or decorate an unresolved silhouette.
- 'Review primary and subordinate mass hierarchy in silhouette and clay: cockpit/nose/neck/shoulder/body relationships,
  deliberate crown/shoulder/keel profiles, negative spaces and major chine continuity. Assess intentional curved-to-planar
  transitions and shading consistency; more facets or sharper edges alone do not repair an unwanted proportion.
  Use the actual brief, not universal beauty ratios.'
- 'Before detailing a claimed designed assembly, independently critique its contribution in assembled silhouette/clay
  views: primary/subordinate mass hierarchy, junction transitions, negative space and consistency with current
  brief. Include local views but do not infer whole-ship success from isolated parts.'
- Bind reviewer identity, actual view observations, candidate/brief/assembly-intent hashes and scoped verdict
  to the existing checkpoint. Give failed findings an owning assembly or shared interface, concrete correction
  and preservation constraints; re-inspect current assembled views after repair. Object counts, separated mesh
  regions and synthetic integrity checks are not aesthetic judgments.
- Before detailing gear bays or support fairings, inspect them within the complete hull in deployed, stowed
  and transition states using registered side/front/underside silhouette and clay plus a declared ground plane
  and height. Evaluate hanging masses, bay protrusion, belly continuity, support junctions, landing stance
  and ramp-to-ground relationship against the current brief; a colour change cannot repair rejected geometry.
- After a clearance-driven reshape, inspect side/top/front/underside silhouette and clay plus longitudinal/transverse
  sections annotated with actual cabin, gear and support reservations. Identify blank bulk, oversized closure
  faces and needless repetition of a full section; distinguish required functional volume, deliberate aesthetic
  mass and unsupported padding. A local gear fit does not pass whole-body hierarchy.
- 'Viewport-directed correction: For viewport-directed corrections, capture the current camera/state, identify the
  actual object and feature by picking geometry, and bind the proposed operation to that feature. Show an annotated
  target or selected outline when ambiguous. After an owner correction reveals a misunderstanding, resolve the target
  before any further speculative cut. Do not demand confirmation for every routine edit.'
- 'Profile operation and baseline: Establish assembled nose, glazing, belly and shoulder profiles before detail.
  Record accepted and rejected examples as project preferences, not universal style laws. For prolong/shorten/raise
  edits, identify axis, fixed landmarks, preserved slopes or tangencies, intersection and percentage baseline. Incremental
  percentages use the stated current or selected baseline; never silently change it.'
- 'Actual gear-derived local bays: Derive local bay candidates from actual unscaled deployed/stowed/swept gear with
  explicit clearance allowances. Review belly continuity, protrusion and ground height in the assembled hull before
  detail. Existing gear-state and volume-purpose rules remain authoritative; do not inflate the whole cabin or treat
  a compressed demonstration pose as qualified powered stowage.'
- 'Early assembled finish sample: Before design lock and repeated surface detail, show a small coherent sample on
  the current assembled hull covering glazing, paint blocks, lights, seams and edge treatment. Carry accepted choices
  into production. A finish sample is not permission to polish a rejected primary shape. No mandatory angularity,
  headlight ratio or universal colour scheme is implied.'
- 'Separate intent, geometry and presentation: Report intent, geometry and presentation separately. Intent asks
  whether the requested feature changed in the specified direction; geometry checks the affected closures, contacts
  and applicable motion; presentation judges the close view and assembled ship. A technical pass cannot substitute
  for either intent or visual judgment. Unknown or failed required outcomes prevent an overall completion claim.'
- 'Required rejection example: Correctly capped floor sill offered as completion of a vertical-jamb trim. This is
  a review case specification, not an executed result.'
- 'Required rejection example: Target annotation identifies the jamb but measured/exported edits affect only the
  sill. This is a review case specification, not an executed result.'
- 'Required rejection example: Geometry matches but before/after camera changed enough to hide the untouched target.
  This is a review case specification, not an executed result.'
- 'Required rejection example: Prolong nose by changing the protected windshield slope instead of extending it.
  This is a review case specification, not an executed result.'
- 'Required rejection example: Bay sized from compressed demo gear while retraction authority remains unresolved.
  This is a review case specification, not an executed result.'
- 'Required rejection example: Finish judged on an isolated light while its complete-ship proportions remain unreviewed.
  This is a review case specification, not an executed result.'
- 'Required rejection example: Intent failed or presentation unknown but summary declares all-clear from geometry
  checks. This is a review case specification, not an executed result.'
- 'Permitted scoped example: Owner-authorized limited visual study with technical qualifications explicitly unresolved.
  This is a review case specification, not an executed result.'
evidence:
- Decision packet, views, reference provenance and owner/delegate decision bound to candidate.
- Post-reshape side/top/front silhouette and clay comparison packet, original intent witnesses, current landmark
  identity card, candidate/view/camera/state hashes and scoped visual decision.
- Separate current functional and visual results; explicit unresolved omitted features and invalidation/recheck
  status.
- Comparable coherent variants around the same applicable envelopes and real module references, with an annotated
  hierarchy/transition critique and specific visual reasons. No variant is selected merely because it was generated
  first.
- Early integrated gear/bay/support blockout packet with state/camera/scale/ground-height bindings, whole-ship
  observations and current authorized verdict. Isolated parts, clearance-only sweeps or recoloured old geometry
  cannot substitute.
- Before/after section and assembled-view packet with changed volumes traced to independent requirements or
  explicit aesthetic intent, alternatives considered and scoped reviewer judgment. No universal fill fraction
  or minimum occupied-volume ratio substitutes for that review.
- Same-camera before/after plus target object/feature and measured change.
- Construction-line profile and before/after landmark coordinates.
- Separate current intent/geometry/presentation outcomes with exact target, source, camera/state, measured change,
  applicable scope and reviewer authority. Manual visual judgments are not synthetic beauty scores.
failure: Retain the visual witness and prior candidates. Identity lost or unresolved after clearance-driven reshaping
  returns the affected G2/G3 form/arrangement to review and blocks dependent architecture/detail/export acceptance
  even if clearance passes. Preserve applicable required envelopes and original intent; escalate genuine incompatibilities.
  A missing required feature, stale view or synthetic coverage pass cannot close visual identity. Existing owner/delegate
  authority persists. Rejected integrated gear/bay/support shape or ground-height appearance returns affected G2/G3
  packaging; recolour does not close it. Required failed or unknown intent, geometry or presentation prevents an
  overall completion claim. A correctly annotated target whose actual changed/exported geometry affects another
  feature remains an intent failure. Preserve authorized limited-study scope and existing owner/delegate authority.
