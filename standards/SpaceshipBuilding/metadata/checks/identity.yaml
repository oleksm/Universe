# yaml-language-server: $schema=../../schema/ship-check.schema.yaml
identity:
  key: ship-check.identity
  name: Reference and identity review
  about: Reference and identity review for an exact candidate; this record defines the check, not its
    result.
status: draft
implementation: mixed
owner: owner
sources:
- document: docs/spaceship-building-workflow-proposal.md
  section: 3.1 Build a reference atlas with confidence labels
  note: Owner-authorized workflow definition; project values and results are not instantiated.
- document: docs/spaceship-building-workflow-proposal.md
  section: 3.2 Compare a small set of coherent silhouettes
  note: Owner-authorized workflow definition; project values and results are not instantiated.
- document: docs/spaceship-building-workflow-proposal.md
  section: 6.1 Use a complete evidence checklist
  note: Owner-authorized workflow definition; project values and results are not instantiated.
method:
- Compare registered full-ship views and protected landmarks against the selected candidate.
- Inspect thumbnail silhouette and declared camera distances; expose inferred reference regions.
- Review each sketch against brief feature IDs and prompt variation limits; record met, missed, ambiguous
  or intentionally varied without treating hidden geometry as observed.
- Identify candidate image hash, current prompt hash and view/region witnesses for visual findings. Record
  hidden features as not observable; separate exterior identity from occupancy and engineering.
- Review the current iteration independently and retain previous candidates, misses and bounded limitations;
  a passing text-coverage check is not visual acceptance.
- Compare component counts, fore/aft positions, camera projection and mechanism poses across every labelled
  view and the rough occupancy diagram. Labels and image captions cannot override visible contradictions;
  a closed ramp witness must depict its closed pose.
evidence:
- Decision packet, views, reference provenance and owner/delegate decision bound to candidate.
failure: Retain the failing witness and last passing candidate. Block only dependent claims/stages; repair
  or obtain the missing decision, then rerun affected checks.
scope: visual
artifacts:
- ship-artifact.reference-atlas
- ship-artifact.silhouette-study
- ship-artifact.sketch-prompt
coverage: Scope is the declared candidate, inputs, methods and consumer features. No engineering or unsampled/runtime
  claim is inferred.
rules:
- ship-rule.claim-boundaries
- ship-rule.feature-intake
