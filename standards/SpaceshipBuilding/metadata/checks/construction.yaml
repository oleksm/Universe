method:
- Trace each component to a support and compatible interface.
- Verify intended contact at joint surfaces separately from collision; check actual frame allocation and accounting
  ownership.
- Check stern/cockpit closure, gear bays, service penetrations and supports in the actual state plan. Zero
  collision hits cannot prove missing closure geometry or a supported installation.
- 'Reconcile each claimed designed assembly against ship-artifact.region-spec: purpose, design controls, brief
  links, actual source/object ownership and adjacent interface owners. Reject an object split presented as
  completed design without these records and current geometric witnesses.'
- Inspect declared junctions, mating frames, attachment/support and access obligations on the actual candidate;
  label unmeasured or unavailable criteria unresolved. Keep this technical verdict separate from ship-check.identity
  and block only detail/claims dependent on failed or missing required evidence.
- Audit static attachment and deletion dependencies independently of the moving-part clash roster. When a support/host
  is removed or replaced, trace surviving covers, closures, trim, markings, fasteners and services to a current
  purpose and supported host; object parenting, names or lack of collision are not physical attachment evidence.
- Reconcile mirrored, duplicate, hidden, linked, generated/source and exported dependents. Each obsolete object
  is retired with build regeneration prevented, or explicitly rebound with current world-space seating/support/interface
  witnesses. An intentionally offset marking still needs a real host and purpose; this review does not invent a
  universal offset or load qualification.
- 'Required rejection case: a bridge support is removed while covers and duplicated markings remain floating, but
  a zero-hit moving-versus-fixed sweep is promoted to complete assembly acceptance. Reject the unsupported static/deletion-dependency
  claim. This is a case specification, not an executed result.'
- 'Required intent-rejection case: an inspection panel is still required, but the repair deletes it to eliminate
  an orphan. Retain and seat the intended panel and markings on each side against the current host; remove only
  genuinely unwanted duplicates. Support disappearance alone does not make the panel obsolete. This is a review
  specification, not an executed result.'
evidence:
- Contact/access witnesses, interface references, BOM ownership and qualified/unqualified links.
- Per-assembly intent/interface roster, current source/input hashes, actual local and assembled interface witnesses,
  scoped observations and defect closure after repair. A valid declaration establishes coverage only, not geometric
  qualification.
- Before/after support-host dependency roster, current source/build/export object dispositions including both sides
  and duplicate/hidden copies, replacement closure/function ownership and current static attachment witnesses. Keep
  moving-clash, static attachment and complete-assembly verdicts distinct.
- Current owner/delivery retention intent and disposition per panel/marking, with replacement-host attachment/access
  witnesses. Historical removal reports are explicitly withdrawn where superseded by a retained-and-seated repair;
  no project seating/load acceptance follows from this definition.
failure: Retain the failing witness and last passing candidate. Block only dependent claims/stages; repair or obtain
  the missing decision, then rerun affected checks. Missing, stale or unsupported required static attachments after
  support removal block the affected construction/assembly claim even when moving-part clearance passes. Preserve
  valid measured subsets and repair or rebind the orphaned dependency before claiming completion.
scope: construction
artifacts:
- ship-artifact.interfaces
- ship-artifact.region-spec
- ship-artifact.assembly-state-plan
coverage: Scope is the declared candidate, inputs, methods and consumer features. No engineering or unsampled/runtime
  claim is inferred.
rules:
- ship-rule.claim-boundaries
