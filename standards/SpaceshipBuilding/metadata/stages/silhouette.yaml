# yaml-language-server: $schema=../../schema/ship-stage.schema.yaml
identity:
  key: ship-stage.silhouette
  name: G2 Silhouette
  about: Reusable G2 Silhouette gate; prerequisite order does not pre-approve any ship.
status: draft
implementation: mixed
owner: owner
sources:
- document: docs/spaceship-building-workflow-proposal.md
  section: 5.1 Use the existing release state machine
  note: Owner-authorized workflow definition; project values and results are not instantiated.
order: 2
depends_on:
- ship-stage.references
entry:
- Coherent reference interpretation and rough functional occupancy available.
- Current sketch prompt traces to a confirmed feature brief; no unresolved blocker concealed as an image-generation
  choice.
exit:
- One coherent alternative selected with registered views and protected landmarks.
- Sketches reviewed feature by feature; misses and ambiguities resolved or explicitly retained before selection.
- A rehearsal selection and a real design selection are distinct. Exterior-only feedback cannot close the gate
  while its rough functional occupancy prerequisite or required observable identity features remain unresolved.
- Direction includes an opening/closure, gear/bay, service/support and cockpit interface plan; unresolved installation
  or state requirements remain explicit before selection.
failure:
- Keep alternatives; do not erase prior source or mix incompatible features silently.
inputs:
- ship-artifact.reference-atlas
- ship-artifact.requirements
- ship-artifact.sketch-prompt
outputs:
- ship-artifact.silhouette-study
- ship-artifact.assembly-state-plan
checks:
- ship-check.identity
rules:
- ship-rule.lifecycle
- ship-rule.authority
- ship-rule.claim-boundaries
- ship-rule.feature-intake
- ship-rule.construction-and-detail
decision: Carry existing authorization/delegation forward. Owner resolves identity and major aesthetic/scope
  forks; technical roles resolve routine repairs within those constraints.
