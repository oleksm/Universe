# yaml-language-server: $schema=../../schema/ship-stage.schema.yaml
identity:
  key: ship-stage.silhouette
  name: G2 Silhouette
  about: Reusable G2 Silhouette gate; prerequisite order does not pre-approve any ship.
status: draft
implementation: mixed
owner: owner
sources:
- document: docs/spaceship-building-workflow-proposal.md
  section: 5.1 Use the existing release state machine
  note: Owner-authorized workflow definition; project values and results are not instantiated.
- document: docs/spaceship-building-workflow-proposal.md
  section: 6.1 Use a complete evidence checklist
  note: 'Owner gear-integration correction, 2026-10-22: review whole-ship deployed/stowed bay/support silhouette
    and ground height before detail; rejected packaging returns to G2/G3.'
- document: docs/spaceship-building-workflow-proposal.md
  section: 6.1 Use a complete evidence checklist
  note: 'Owner gear-shape correction,2026-10-22: review unsupported volume/blank bulk so local gear packaging
    cannot pass by inflating the whole hull.'
order: 2
depends_on:
- ship-stage.references
entry:
- Coherent reference interpretation and rough functional occupancy available.
- Current sketch prompt traces to a confirmed feature brief; no unresolved blocker concealed as an image-generation
  choice.
exit:
- One coherent alternative selected with registered views and protected landmarks.
- Sketches reviewed feature by feature; misses and ambiguities resolved or explicitly retained before selection.
- A rehearsal selection and a real design selection are distinct. Exterior-only feedback cannot close the gate
  while its rough functional occupancy prerequisite or required observable identity features remain unresolved.
- Direction includes an opening/closure, gear/bay, service/support and cockpit interface plan; unresolved installation
  or state requirements remain explicit before selection.
- Direction includes connected crew routes and operating/staging space across intended ramp/door states before
  shape selection; unresolved human/suit/carry fixtures and recovery scope remain explicit.
- Before gear or bay detail, review the integrated hull with deployed, stowed and transition gear/support/bay
  reservations in registered side/front/underside silhouette and clay views at declared ground height. Explicitly
  judge bay protrusion, belly continuity and mass hierarchy; isolated clearance envelopes cannot establish
  whole-ship appearance.
- Before selecting a gear-driven hull reshape, compare longitudinal/cross sections and whole-ship clay/silhouettes
  showing required cabin, folded gear, support and ground envelopes separately. Review unsupported blank stern/crown/body
  bulk and unnecessary continuation of full cabin sections; fitting a local gear reservation by inflating the
  entire hull does not close identity review.
failure:
- Keep alternatives; do not erase prior source or mix incompatible features silently.
- Required route/module envelope conflict with hull space returns affected G2/G3 shape and arrangement; preserve
  design intent and applicable envelopes, escalate incompatible constraints, and invalidate dependent detail/export
  evidence before resuming.
- If clearance-driven shape changes erase protected identity, return affected G2/G3 alternatives with unchanged
  applicable envelopes; no detail, shrink-to-fit or stale visual packet closes the conflict.
inputs:
- ship-artifact.reference-atlas
- ship-artifact.requirements
- ship-artifact.sketch-prompt
outputs:
- ship-artifact.silhouette-study
- ship-artifact.assembly-state-plan
- ship-artifact.crew-route-plan
checks:
- ship-check.identity
rules:
- ship-rule.lifecycle
- ship-rule.authority
- ship-rule.claim-boundaries
- ship-rule.feature-intake
- ship-rule.construction-and-detail
decision: Carry existing authorization/delegation forward. Owner resolves identity and major aesthetic/scope
  forks; technical roles resolve routine repairs within those constraints.
