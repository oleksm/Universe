# yaml-language-server: $schema=../../schema/ship-stage.schema.yaml
identity:
  key: ship-stage.architecture
  name: G3 Architecture
  about: Reusable G3 Architecture gate; prerequisite order does not pre-approve any ship.
status: draft
implementation: mixed
owner: ships
sources:
- document: docs/spaceship-building-workflow-proposal.md
  section: 5.1 Use the existing release state machine
  note: Owner-authorized workflow definition; project values and results are not instantiated.
- document: docs/spaceship-building-workflow-proposal.md
  section: 6.1 Use a complete evidence checklist
  note: 'Owner gear-integration correction, 2026-10-22: review whole-ship deployed/stowed bay/support silhouette
    and ground height before detail; rejected packaging returns to G2/G3.'
- document: docs/spaceship-building-workflow-proposal.md
  section: 6.1 Use a complete evidence checklist
  note: 'Owner gear-shape correction,2026-10-22: review unsupported volume/blank bulk so local gear packaging
    cannot pass by inflating the whole hull.'
order: 3
depends_on:
- ship-stage.silhouette
entry:
- Selected silhouette, declared fixtures and reusable-equipment choices.
- Module discovery and consumer contract lookup completed before aisle/cabin/cockpit sizing; candidate versus
  selected equipment and geometry ownership recorded.
- Opening/closure owners, gear states and bay reservations, services/supports and cockpit/module interfaces
  are identified before detailed arrangement.
exit:
- Sections, task routes, pilot space and equipment allocation satisfy the declared scope.
- Actual reusable module allocations, supported poses, mounts/services and access paths are validated; no custom
  fit-out substitute or exported reservation proxy fills a gap.
- Inherited product substitutes are retired and all required module occupied, attachment/tool, install/removal,
  user, motion and service clearances have current scoped evidence; missing data remains unresolved.
- Assembly direction resolves required closures and installations; unknown gear bays, service penetrations
  or cockpit boundaries cannot be hidden as later surface detail.
- Required cockpit/cabin/exit routes, support/landing/turn/headroom and operating/recovery sequences have current
  state-bound evidence and applicable fixture/criterion provenance; missing or provisional criteria cannot
  become compliance.
- After a route/module-driven reshape, dependent form, fit, mechanisms, detail and export evidence is regenerated
  for current hashes; preserved history or unchanged module packages do not pass changed hull geometry.
- After clearance-driven reshaping, current silhouette/clay and protected-landmark identity review passes within
  actual authority as well as functional checks; no old silhouette approval or provisional envelope supplies
  visual acceptance.
- Each claimed designed assembly has a current region-spec intent/interface contract, actual object mapping
  and scoped construction evidence plus independent assembled visual critique. Mesh separation alone does not
  establish parts-designed; unresolved required interfaces or whole-ship visual failures hold dependent detail.
- Integrated gear bays, doors and supports have current whole-ship deployed/stowed/transition silhouette and
  clay review, with actual ground plane, extended/compressed contact heights and ramp relation. A clearance
  reservation is not final exterior geometry; unresolved load, mount or mechanism data stays explicit.
- Map changed external volume to actual occupied cabin, referenced equipment, required access/motion, pressure/structure
  or explicitly declared aesthetic intent. Compare local bay/support alternatives before extending a full cabin
  cross-section along the hull; invented future equipment, relabelled empty boxes and unsupported space reservations
  cannot justify arrangement acceptance.
failure:
- Reopen the affected shape/arrangement only; keep approved unrelated regions.
- Missing inventory, product, model or consumer support blocks dependent arrangement/release; record the gap
  with Registry/Ships rather than fabricate a module.
- Required route/module envelope conflict with hull space returns affected G2/G3 shape and arrangement; preserve
  design intent and applicable envelopes, escalate incompatible constraints, and invalidate dependent detail/export
  evidence before resuming.
- If clearance-driven shape changes erase protected identity, return affected G2/G3 alternatives with unchanged
  applicable envelopes; no detail, shrink-to-fit or stale visual packet closes the conflict.
- Rejected bay/support silhouette or ground-height integration returns the affected hull/bay/gear arrangement
  to G2/G3 blockout before detail. Invalidate dependent views, fit, mechanism and export results for changed
  inputs; recolour alone cannot close a shape or packaging rejection. Preserve applicable unscaled products,
  crew routes and ground/load requirements.
- A packaging fix that introduces rejected unsupported bulk returns the affected hull sections and gear interfaces
  to G2/G3. Preserve required unscaled products and crew/ground/load envelopes, test local placement/support/profile
  alternatives and rerun dependent fit and visual evidence; do not shrink necessities to recover appearance.
inputs:
- ship-artifact.silhouette-study
- ship-artifact.requirements
- ship-artifact.module-inventory
- ship-artifact.assembly-state-plan
- ship-artifact.crew-route-plan
outputs:
