# yaml-language-server: $schema=../../schema/ship-stage.schema.yaml
identity:
  key: ship-stage.production
  name: G6 Production
  about: Reusable G6 Production gate; prerequisite order does not pre-approve any ship.
status: draft
implementation: mixed
owner: blender
sources:
- document: docs/spaceship-building-workflow-proposal.md
  section: 5.1 Use the existing release state machine
  note: Owner-authorized workflow definition; project values and results are not instantiated.
order: 6
depends_on:
- ship-stage.design-lock
entry:
- Stable form, ownership, interfaces and agreed detail budget.
- For the assembly to be detailed, current per-assembly intent/interfaces and both technical and independent
  complete-ship visual reviews support that scope. Use the existing checkpoint and defect records; fresh object
  names or isolated renders do not pass this gate.
exit:
- Evaluated geometry, materials, export/collision representations and measured costs have current evidence.
- Inherited product substitutes are retired and all required module occupied, attachment/tool, install/removal,
  user, motion and service clearances have current scoped evidence; missing data remains unresolved.
- Complete assembly closed/open/intermediate and permitted combined-state coverage includes stern, underside,
  cockpit and interior witnesses; no partial sweep substitutes for required rows.
- Required crew routes and reachable controls, staging and recovery remain usable through declared mechanism
  states; zero mechanism collisions alone cannot establish operation or escape.
- After a route/module-driven reshape, dependent form, fit, mechanisms, detail and export evidence is regenerated
  for current hashes; preserved history or unchanged module packages do not pass changed hull geometry.
- After clearance-driven reshaping, current silhouette/clay and protected-landmark identity review passes within
  actual authority as well as functional checks; no old silhouette approval or provisional envelope supplies
  visual acceptance.
failure:
- Repair only the owning region and invalidate downstream evidence by dependency.
- Required route/module envelope conflict with hull space returns affected G2/G3 shape and arrangement; preserve
  design intent and applicable envelopes, escalate incompatible constraints, and invalidate dependent detail/export
  evidence before resuming.
- If clearance-driven shape changes erase protected identity, return affected G2/G3 alternatives with unchanged
  applicable envelopes; no detail, shrink-to-fit or stale visual packet closes the conflict.
inputs:
- ship-artifact.region-spec
- ship-artifact.build-inputs
- ship-artifact.mechanism-spec
- ship-artifact.assembly-state-plan
- ship-artifact.crew-route-plan
outputs:
- ship-artifact.region-spec
- ship-artifact.performance-budget
- ship-artifact.evidence
- ship-artifact.release-package
checks:
- ship-check.mesh-integrity
- ship-check.hull-geometry
- ship-check.material-export
- ship-check.raw-port-frames
- ship-check.construction
- ship-check.module-clearance
- ship-check.assembly-state-coverage
- ship-check.crew-routes
- ship-check.identity
rules:
- ship-rule.lifecycle
- ship-rule.authority
- ship-rule.claim-boundaries
- ship-rule.module-reuse
- ship-rule.construction-and-detail
decision: Carry existing authorization/delegation forward. Owner resolves identity and major aesthetic/scope
  forks; technical roles resolve routine repairs within those constraints.
