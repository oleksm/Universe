# yaml-language-server: $schema=../../schema/ship-stage.schema.yaml
identity:
  key: ship-stage.references
  name: G1 References
  about: Reusable G1 References gate; prerequisite order does not pre-approve any ship.
status: draft
implementation: mixed
owner: blender
sources:
- document: docs/spaceship-building-workflow-proposal.md
  section: 5.1 Use the existing release state machine
  note: Owner-authorized workflow definition; project values and results are not instantiated.
order: 1
depends_on:
- ship-stage.brief
entry:
- Brief accepted or covered by recorded delegation.
exit:
- Atlas identifies controlled features, conflicting views and inferred geometry.
- Sketch prompt derived from the confirmed brief and atlas; required features, exclusions and variation limits
  checked.
failure:
- Return disputed interpretation to the owner; preserve reference provenance.
inputs:
- ship-artifact.requirements
- ship-artifact.assumptions
outputs:
- ship-artifact.reference-atlas
- ship-artifact.sketch-prompt
checks:
- ship-check.identity
- ship-check.requirements
rules:
- ship-rule.lifecycle
- ship-rule.authority
- ship-rule.claim-boundaries
- ship-rule.feature-intake
decision: Carry existing authorization/delegation forward. Owner resolves identity and major aesthetic/scope
  forks; technical roles resolve routine repairs within those constraints.
