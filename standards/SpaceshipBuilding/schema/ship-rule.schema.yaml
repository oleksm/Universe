$schema: http://json-schema.org/draft-07/schema#
title: Ship Workflow Rule
x-kind:
- ship-rule
description: 'standards/SpaceshipBuilding/metadata/rules/<name>.yaml: reusable workflow definitions, never ship
  instances or runtime state.'
type: object
additionalProperties: false
required:
- identity
- status
- implementation
- owner
- sources
- statement
- applies_to
- verification
properties:
  identity:
    type: object
    additionalProperties: false
    required:
    - key
    - name
    - about
    properties:
      key:
        $ref: ../../common.schema.yaml#/definitions/key
      name:
        type: string
        minLength: 1
        description: Name of the workflow definition.
      about:
        type: string
        minLength: 1
        description: What this definition means; not a ship instance.
  status:
    enum:
    - draft
    - published
    - retired
  implementation:
    enum:
    - proposed
    - existing
    - mixed
    description: Whether the described capability exists; publishing a definition does not implement it.
  owner:
    enum:
    - owner
    - ships
    - registry
    - blender
    - engine
    - installer
    description: Responsible role; existing delegation still applies.
  sources:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required:
      - document
      - section
      properties:
        document:
          type: string
          minLength: 1
          description: Source URL or repository path.
        section:
          type: string
          minLength: 1
          description: Source section or anchor.
        note:
          type: string
          minLength: 1
          description: Scope, historical context or limits of the source.
  limitations:
    type: array
    minItems: 1
    items:
      type: string
      minLength: 1
    description: What this definition does not establish.
  rules:
    type: array
    items:
      type: string
      x-ref:
      - ship-rule
  statement:
    type: string
    minLength: 1
    description: Normative workflow requirement, within existing authorization.
  applies_to:
    type: array
    minItems: 1
    items:
      type: string
      minLength: 1
    description: Which authoring operations and artifacts this rule governs.
  verification:
    type: array
    minItems: 1
    items:
      type: string
      minLength: 1
    description: How compliance is established.
  related:
    type: array
    items:
      type: string
      x-ref:
      - ship-rule
      - ship-stage
      - ship-artifact
      - ship-check
      - ship-decision
  blocks:
    type: array
    description: 'Structured requirements a tool reads: one need each, the slot kinds that meet it, whether a ship
      must carry it.'
    items:
      type: object
      additionalProperties: false
      required:
      - need
      - kinds
      - required
      properties:
        need:
          type: string
          minLength: 1
        kinds:
          type: array
          minItems: 1
          items:
            $ref: ../../dictionary.schema.yaml#/definitions/slot_kind
        also_by:
          enum:
          - main_engine
          - cold_gas_engine
          - lift_engine
          description: 'An engine-kind slot that stands in, by its role: main_engine (role main; not pressure-fed) for
            the drive, cold_gas_engine (role attitude; pressure-fed) for the thrusters, lift_engine (role lift) for
            lift.'
        required:
          type: boolean
          description: 'true: every ship must carry it to be commissioned (fly); false: optional.'
        note:
          type: string
