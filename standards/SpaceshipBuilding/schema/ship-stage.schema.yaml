$schema: http://json-schema.org/draft-07/schema#
title: Ship Workflow Stage
x-kind:
- ship-stage
description: 'standards/SpaceshipBuilding/metadata/stages/<name>.yaml: reusable workflow
  definitions, never ship instances or runtime state.'
type: object
additionalProperties: false
required:
- identity
- status
- implementation
- owner
- sources
- entry
- exit
- failure
- inputs
- outputs
- checks
properties:
  identity:
    type: object
    additionalProperties: false
    required:
    - key
    - name
    - about
    properties:
      key:
        $ref: ../../common.schema.yaml#/definitions/key
      name:
        type: string
        minLength: 1
        description: Name of the workflow definition.
      about:
        type: string
        minLength: 1
        description: What this definition means; not a ship instance.
  status:
    enum:
    - draft
    - published
    - retired
  implementation:
    enum:
    - proposed
    - existing
    - mixed
    description: Whether the described capability exists; publishing a definition
      does not implement it.
  owner:
    enum:
    - owner
    - ships
    - registry
    - blender
    - engine
    - installer
    description: Responsible role; existing delegation still applies.
  sources:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required:
      - document
      - section
      properties:
        document:
          type: string
          minLength: 1
          description: Source URL or repository path.
        section:
          type: string
          minLength: 1
          description: Source section or anchor.
        note:
          type: string
          minLength: 1
          description: Scope, historical context or limits of the source.
  limitations:
    type: array
    minItems: 1
    items:
      type: string
      minLength: 1
    description: What this definition does not establish.
  rules:
    type: array
    items:
      type: string
      x-ref:
      - ship-rule
  order:
    type: integer
    minimum: 0
    description: Display order; depends_on defines prerequisites.
  depends_on:
    type: array
    items:
      type: string
      x-ref:
      - ship-stage
  entry:
    type: array
    minItems: 1
    items:
      type: string
      minLength: 1
    description: Conditions before starting; carry existing authorization forward.
  exit:
    type: array
    minItems: 1
    items:
      type: string
      minLength: 1
    description: Evidence and decision required to leave this gate.
  failure:
    type: array
    minItems: 1
    items:
      type: string
      minLength: 1
    description: Rollback and recovery; preserve the last good candidate.
  inputs:
    type: array
    items:
      type: string
      x-ref:
      - ship-artifact
  outputs:
    type: array
    items:
      type: string
      x-ref:
      - ship-artifact
  checks:
    type: array
    items:
      type: string
      x-ref:
      - ship-check
  decision:
    type: string
    minLength: 1
    description: Decision authority and when an identity or scope change reopens review.
