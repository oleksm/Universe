$schema: http://json-schema.org/draft-07/schema#
title: Ship Workflow Decision
x-kind:
- ship-decision
description: 'standards/SpaceshipBuilding/metadata/decisions/<name>.yaml: reusable
  workflow definitions, never ship instances or runtime state.'
type: object
additionalProperties: false
required:
- identity
- status
- implementation
- owner
- sources
- question
- proposed_default
- affects
- resolution
properties:
  identity:
    type: object
    additionalProperties: false
    required:
    - key
    - name
    - about
    properties:
      key:
        $ref: ../../common.schema.yaml#/definitions/key
      name:
        type: string
        minLength: 1
        description: Name of the workflow definition.
      about:
        type: string
        minLength: 1
        description: What this definition means; not a ship instance.
  status:
    enum:
    - draft
    - published
    - retired
  implementation:
    enum:
    - proposed
    - existing
    - mixed
    description: Whether the described capability exists; publishing a definition
      does not implement it.
  owner:
    enum:
    - owner
    - ships
    - registry
    - blender
    - engine
    - installer
    description: Responsible role; existing delegation still applies.
  sources:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required:
      - document
      - section
      properties:
        document:
          type: string
          minLength: 1
          description: Source URL or repository path.
        section:
          type: string
          minLength: 1
          description: Source section or anchor.
        note:
          type: string
          minLength: 1
          description: Scope, historical context or limits of the source.
  limitations:
    type: array
    minItems: 1
    items:
      type: string
      minLength: 1
    description: What this definition does not establish.
  rules:
    type: array
    items:
      type: string
      x-ref:
      - ship-rule
  question:
    type: string
    minLength: 1
    description: Open design input or workflow choice; no project decision is made
      here.
  proposed_default:
    type: string
    minLength: 1
    description: Proposal for review, not an approved ship specification.
  affects:
    type: array
    minItems: 1
    items:
      type: string
      minLength: 1
    description: Artifacts and claims depending on this input.
  resolution:
    type: string
    minLength: 1
    description: Who resolves this and what records that decision.
