$schema: http://json-schema.org/draft-07/schema#
title: Renames
description: "standards/renames.yaml: every record key the registry has renamed, old to new, with the date and the reason. The game's aliases (content/base/aliases.ron) carry the ones the game has entries for; anything else that saved a key reads this."
type: object
additionalProperties: false
required: [renames]
properties:
  renames:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [was, is, date]
      properties:
        was: { type: string, description: "The old key." }
        is: { type: string, description: "The key it is now (a record the registry has)." }
        date: { type: string, description: "The date, YYYY-MM-DD." }
        why: { type: string }
