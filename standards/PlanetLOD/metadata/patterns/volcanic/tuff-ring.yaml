identity:
  key: planet-pattern.volcanic.edifice.tuff-ring
  name: Tuff ring
  about: Tuff ring.
family: volcanic
factors:
- factor: planet-factor.groundwater
  weight: 3
  why: abundant shallow groundwater, marsh, coast or lake at vent drives explosions
- factor: planet-factor.other-water-magma-ratio
  weight: 3
  why: 'water/magma ratio and explosion depth: surge-built low ring vs fallout tuff cone vs scoria cone'
- factor: planet-factor.volc-magma
  weight: 3
  why: small-volume basaltic magma
- factor: planet-factor.sea-level
  weight: 1
  why: shallow sea or coastal vents produce rings and tuff cones (Diamond Head)
- factor: planet-factor.clim-wind
  weight: 1
  why: wind skews rim height downwind
- factor: planet-factor.waves-tides
  weight: 1
  why: wave erosion breaches seaward rim of coastal rings
- factor: planet-factor.time
  weight: 1
  why: weak tephra erodes fast unless palagonitised
