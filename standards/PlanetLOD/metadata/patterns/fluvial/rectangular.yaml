identity:
  key: planet-pattern.fluvial.network.rectangular
  name: Rectangular drainage pattern
  about: Rectangular drainage pattern.
family: fluvial
factors:
- factor: planet-factor.rock-fracture
  weight: 3
  why: orthogonal joints/faults at ~90 deg; channels follow them, right-angle bends
- factor: planet-factor.rock-type
  weight: 3
  why: uniformly resistant crystalline or massive sedimentary rock
- factor: planet-factor.tect-fault
  weight: 3
  why: fault sets supply the weak zones; non-orthogonal sets give angular pattern
- factor: planet-factor.rock-soluble
  weight: 1
  why: solution along joints in limestone accentuates grid
- factor: planet-factor.regolith
  weight: 1
  why: thin cover so fractures control incision
- factor: planet-factor.time
  weight: 1
  why: 10 kyr-100 Myr exploitation of fractures
