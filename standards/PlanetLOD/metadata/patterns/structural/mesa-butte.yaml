identity:
  key: planet-pattern.structural.flat.mesa-butte
  name: Mesa and butte (structural, caprock-controlled)
  about: Mesa and butte (structural, caprock-controlled).
family: structural
factors:
- factor: planet-factor.rock-layers
  weight: 3
  why: Horizontal resistant caprock (sandstone, basalt flow) over weak shale/siltstone
- factor: planet-factor.tect-fold
  weight: 1
  why: Near-horizontal strata
- factor: planet-factor.tect-uplift
  weight: 3
  why: Uplift drives incision dissecting plateau
- factor: planet-factor.volc-vent
  weight: 1
  why: Lava flow caps (flood basalts) can form caprock and inverted relief
- factor: planet-factor.rock-fracture
  weight: 1
  why: Caprock joints control block fall and remnant outline
- factor: planet-factor.groundwater
  weight: 1
  why: Basal sapping undermines caprock
- factor: planet-factor.clim-arid
  weight: 3
  why: Arid/semi-arid preserves free faces
- factor: planet-factor.base-level
  weight: 1
  why: Valley-floor level sets relief (to ~300 m)
- factor: planet-factor.time
  weight: 1
  why: 0.1-10 Myr; mesa to butte to pinnacle
