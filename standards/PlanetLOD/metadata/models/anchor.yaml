# yaml-language-server: $schema=../../schema/planet-model.schema.yaml
identity:
  key: planet-model.anchor
  name: Anchor model
  about: 'A planet''s ground as anchors and the contour rings woven round them: the coast, exact at every level, and each enclosed ring''s peak or dip, with rings at an exponential height step from each anchor. Nothing else
    is in it; everything else is refinement on top. The same principles mesh the planet.'
  words: 'The owner, 17 Oct 2026: "The coast is exact at every level, is one anchor. The peak / dip is another anchor. Around those we weave the detail of contour lines with an exponential step. Nothing else is there. The
    same principles are used when meshing planets."'
purpose: 'To describe and mesh a planet''s ground from its sim with the fewest exact things: anchors kept true at every level, and detail that is dense next to each anchor and sparse halfway between them.'
anchors:
- name: coast
  kind: line
  found_by: The 0 m line of the source field.
  exact: true
  line: planet-line.coast
  field: planet-field.height
- name: peak or dip
  kind: point
  found_by: 'The field''s extremum inside each enclosed contour ring: a maximum (peak) or a minimum (dip); each a real sim sample with its real height.'
  exact: true
  field: planet-field.height
detail:
  rule: 'Contour rings round each anchor at an exponentially growing height step: down from a peak, up from a dip, up from the coast on land and down from it at sea. Detail is dense next to each anchor and sparse halfway between
    anchors.'
  formula: ring_k = h_anchor -/+ d0 (r^k - 1), k = 1, 2, 3, ...; r = 2 (the ring ratio), so the first ring is d0 from its anchor
  nearest: 'A point takes its rings from its nearest anchor in height: the peak above it reached by steepest ascent, or the coast or dip below it reached by steepest descent.'
source_field:
- planet-field.height
- planet-field.recent-height
params:
- name: d0
  value: 50.0
  unit: m
  note: 'The first step: the first ring 50 m from its anchor; on earth_s30 rings k = 1 to 6 (anchor_mesher.py at pgs2 cf14939, draft).'
- name: ring ratio
  value: 2.0
  unit: '1'
  note: 'r: each step twice the last.'
- name: source field
  open: true
  note: 'height (z) for now, provisional: which height is present is open until planets have checked r_z.'
- name: sample smoothing
  note: 'The sample mesh subdivided twice (butterfly positions, linear heights), then one relaxation pass at lambda 0.5: planet_trees.graph.smooth_field(levels=2, passes=1, lam=0.5), as planet_anchors.py.'
- name: fill distance
  value: 60000.0
  unit: m
  said_as:
    unit: km
    factor: 1000.0
  note: 'FILL_KM: between rings, a field vertex where no ring, coast or anchor vertex lies within this.'
- name: flat-triangle rounds
  value: 3.0
  unit: '1'
  note: Inside a triangle whose three corners lie on one ring, a vertex at the field's height, for up to this many rounds.
guarantees:
- 'The coast exact at every level: 0 m on the 0 m line.'
- 'Every anchor exact: its own sample''s height, at its own place.'
- 'Every mesh vertex''s height exact: its ring''s level, 0 at the coast, or its anchor''s height.'
leaves_out:
- 'Separate rivers, ridges or reducers: refinements on top, never part of the base.'
- Anything between rings but the interpolation between neighbouring rings.
rules:
- One graph, refined in depth.
- A refinement only adds, as residuals over its parent.
- Parent anchors stay exact.
- 'The graph is rendered exactly: interpolated between neighbouring rings, anchors as apexes.'
- No rasters inside construction.
mesh: The anchors plus vertices on the rings, triangulated on the sphere; between rings, field vertices where no ring, coast or anchor vertex lies within the fill distance; inside flat triangles (all three corners on one ring)
  a vertex at the field's height, for up to three rounds. Those added vertices take their heights by interpolation between neighbouring rings.
implementations:
- where: planet-trees-pgs2 tools/planet_anchors.py
  state: predecessor
  note: the contour model of 9 Oct 2026, a uniform 200 m step
- where: planet-trees-pgs2 tools/anchor_mesher.py
  state: current
  note: 'at cf14939: on earth_s30 against the smoothed field, rms 66 m (land 32 m, p95 128 m), watertight, 5 % flat triangles, 426k vertices and 851k triangles, about 20 s for the whole planet'
levels:
- planet-level.planet
- planet-level.cluster
- planet-level.pattern
- planet-level.square
- planet-level.detail
measured_by:
- planet-measure.rms-against-samples
- planet-measure.coast-fidelity
status: draft
basis:
- of:
  - identity
  - anchors
  - detail
  - rules
  - mesh
  tier: derived
  note: The owner's words and planets' principles, 17 Oct 2026.
- of:
  - params
  - mesh
  - implementations
  tier: derived
  review: true
  note: 'planets, 17 Oct 2026: as built in anchor_mesher.py (pgs2 cf14939), all draft; the source field provisional.'
