$schema: http://json-schema.org/draft-07/schema#
title: Planet file
x-kind: [planet-file]
description: "standards/PlanetLOD/metadata/files/<name>.yaml: a file the planet sim or its tools write: where it lies, who writes it, and the arrays in it that are bookkeeping (indexes, caches, run metadata) rather than words. Its words are planet-field records naming it as their producer's file."
type: object
additionalProperties: false
required: [identity, path, written_by]
allOf:
  - { $ref: "../../common.schema.yaml#/definitions/planet_context" }
properties:
  identity:
    type: object
    additionalProperties: false
    required: [key, name, about]
    properties:
      key: { $ref: "../../common.schema.yaml#/definitions/key" }
      name: { type: string }
      about: { type: string }
  path: { type: string, description: "Where it lies, with <run>, <seg>, NN and <kyr> standing for the parts that vary." }
  written_by: { type: string, description: "The code that writes it." }
  bookkeeping:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [key, meaning]
      properties:
        key: { type: string }
        meaning: { type: string }
  status: { enum: [draft, published, retired] }
  basis: { $ref: "../../common.schema.yaml#/definitions/basis" }
