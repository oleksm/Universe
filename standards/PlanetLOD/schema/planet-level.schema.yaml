$schema: http://json-schema.org/draft-07/schema#
title: Planet level
x-kind: [planet-level]
description: "standards/PlanetLOD/metadata/levels/<name>.yaml: one level of context the planet is described at, from the whole planet down to detail: its span, its spacing, what exists at it, what its parent hands down frozen."
type: object
additionalProperties: false
required: [identity, span, spacing]
allOf:
  - { $ref: "../../common.schema.yaml#/definitions/planet_context" }
properties:
  identity:
    type: object
    additionalProperties: false
    required: [key, name, about]
    properties:
      key: { $ref: "../../common.schema.yaml#/definitions/key" }
      name: { type: string }
      about: { type: string, description: "What it is, in a sentence or two: the word's meaning." }
  span: { type: number, exclusiveMinimum: 0, x-unit: m, description: "How far one view at this level reaches." }
  span_said: { $ref: "../../common.schema.yaml#/definitions/said_as" }
  spacing: { type: array, minItems: 2, maxItems: 2, items: { type: number, exclusiveMinimum: 0, x-unit: m }, description: "Between neighbouring samples or nodes, least and most." }
  goal: { type: boolean, description: "true: the spacing is a goal not yet reached." }
  segment_n: { type: integer, minimum: 1, description: "The cube-sphere segments a face is cut into at this level (Segment(face, i, j, n))." }
  segment_id: { type: string, description: "How a segment at this level is named (f<face>_<i>_<j>, n<n>_f<face>_<i>_<j>)." }
  exists: { type: array, items: { type: string }, description: "What exists at it, in the sim's words." }
  from_parent: { type: array, items: { type: string }, description: "The anchors its parent hands down, frozen: this level adds, never moves them." }
  status: { enum: [draft, published, retired], description: "draft: the sim builds against the word, not yet the figures" }
  basis: { $ref: "../../common.schema.yaml#/definitions/basis" }
