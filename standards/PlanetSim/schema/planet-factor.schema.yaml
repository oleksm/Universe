$schema: http://json-schema.org/draft-07/schema#
title: Planet deciding factor
x-kind:
- planet-factor
description: 'standards/PlanetSim/metadata/factors/<name>.yaml: a deciding factor of landforms (the landform library''s
  vocabulary: TECT_UPLIFT, CLIM_ARID...): what it means, and what of the sim''s it reads, so a place''s signature
  gives it a strength from 0 to 1.'
type: object
additionalProperties: false
required:
- identity
- source
- kind
- reading
allOf:
- $ref: ../../common.schema.yaml#/definitions/planet_context
properties:
  identity:
    type: object
    additionalProperties: false
    required:
    - key
    - name
    - about
    properties:
      key:
        $ref: ../../common.schema.yaml#/definitions/key
      name:
        type: string
      about:
        type: string
  reads:
    type: object
    additionalProperties: false
    properties:
      fields:
        type: array
        items:
          type: string
          x-ref:
          - planet-field
      layers:
        type: array
        items:
          type: string
          x-ref:
          - planet-layer
      landmarks:
        type: array
        items:
          type: string
          x-ref:
          - planet-landmark
      lines:
        type: array
        items:
          type: string
          x-ref:
          - planet-line
  signal:
    $ref: '#/definitions/factor_signal'
  status:
    enum:
    - draft
    - published
    - retired
  basis:
    $ref: ../../common.schema.yaml#/definitions/basis
  kind:
    enum:
    - numeric
    - categorical
    description: Categorical values have explicit directed membership, never ordered high/low.
  unit:
    type: string
    description: SI unit of raw numeric reading, or 1 for category/strength.
  class_map:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
      - key
      - codes
      properties:
        key:
          type: string
        codes:
          type: array
          uniqueItems: true
          items:
            type: integer
            minimum: 0
            x-unit: '1'
        unresolved:
          type: boolean
          description: Codes are possible/ambiguous membership only (empty means unavailable everywhere). A match
            is unknown, never a confirmed class or absence.
  reading:
    type: object
    additionalProperties: false
    required:
    - status
    - source
    - note
    properties:
      status:
        enum:
        - verified
        - proxy
        - unavailable
      source:
        type: string
      note:
        type: string
definitions:
  factor_signal:
    description: 'How its strength (0 to 1) comes from a signature when none is given: a field''s value ramped from
      `from` (0) to `to` (1), or a class among `classes`, or a landmark present nearby.'
    type: object
    additionalProperties: false
    properties:
      field:
        type: string
        x-ref:
        - planet-field
      from:
        type: number
        x-unit-from: field
      to:
        type: number
        x-unit-from: field
      layer:
        type: string
        x-ref:
        - planet-layer
      classes:
        type: array
        items:
          type: integer
          minimum: 1
          x-unit: '1'
      landmarks:
        type: array
        items:
          type: string
          x-ref:
          - planet-landmark
      features:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
          x-ref:
          - planet-feature
      radius_m:
        type: number
        exclusiveMinimum: 0
        x-unit: m
      falloff:
        enum:
        - step
        - linear
        description: Feature proximity only. step gives1at distance<=radius_m,0outside; linear gives max(0,1-distance/radius_m).
          Missing geometry remains unknown; actual resolved-scale policy is separate.
    dependencies:
      features:
      - radius_m
      radius_m:
      - features
    allOf:
    - if:
        required:
        - features
      then:
        not:
          anyOf:
          - required:
            - field
          - required:
            - layer
          - required:
            - landmarks
