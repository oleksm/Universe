$schema: http://json-schema.org/draft-07/schema#
title: Planet mesher handler
x-kind: [planet-handler]
description: "standards/PlanetSim/metadata/handlers/<name>.yaml: a law or rule the mesher draws ground by: its form, its parameters with units, when it applies."
type: object
additionalProperties: false
required: [identity, law]
allOf:
  - { $ref: "../../common.schema.yaml#/definitions/planet_context" }
properties:
  identity:
    type: object
    additionalProperties: false
    required: [key, name, about]
    properties:
      key: { $ref: "../../common.schema.yaml#/definitions/key" }
      name: { type: string }
      about: { type: string, description: "What it is, in a sentence or two: the word's meaning." }
  law: { type: string, description: "Its form: S = k_s A^-theta." }
  params:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string }
        value: { type: number, x-unit-from: unit, description: "In its unit." }
        range: { type: array, minItems: 2, maxItems: 2, items: { type: number, x-unit-from: unit } }
        by: { type: string, description: "What it is looked up by (relief class, rock hardness)." }
        table: { type: array, items: { type: array, minItems: 2, maxItems: 2, items: { type: number, x-unit-from: unit } }, description: "[key, value] pairs when it is looked up." }
        unit: { type: string, description: "SI, or 1." }
        said_as: { $ref: "../../common.schema.yaml#/definitions/said_as" }
        source: { type: string, description: "The sim's constant for it (KS, THRESH_DEG)." }
        note: { type: string }
  applies_when: { type: string, description: "When it runs, in words (cold climate, big channels)." }
  where: { type: string, description: "Its code (tools/anchored_mesh.py)." }
  status: { enum: [draft, published, retired], description: "draft: the sim builds against the word, not yet the figures" }
  basis: { $ref: "../../common.schema.yaml#/definitions/basis" }
