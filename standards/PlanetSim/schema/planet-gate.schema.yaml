$schema: http://json-schema.org/draft-07/schema#
title: Planet gate
x-kind: [planet-gate]
description: "standards/PlanetSim/metadata/gates/<name>.yaml: a run gate: which targets it checks, from when, how many failing checkpoints stop the run, and what it does."
type: object
additionalProperties: false
required: [identity, checks, action]
allOf:
  - { $ref: "../../common.schema.yaml#/definitions/planet_context" }
properties:
  identity:
    type: object
    additionalProperties: false
    required: [key, name, about]
    properties:
      key: { $ref: "../../common.schema.yaml#/definitions/key" }
      name: { type: string }
      about: { type: string }
  checks: { type: array, items: { type: string, x-ref: [planet-target] } }
  from: { type: number, x-unit: s, description: "Before present: the gate checks from this time on." }
  from_said: { $ref: "../../common.schema.yaml#/definitions/said_as" }
  failures: { type: integer, minimum: 1, description: "Failing checkpoints in a row that trip it." }
  action: { type: string, description: "What it does when tripped (stop the run)." }
  params: { type: array, items: { $ref: "../../common.schema.yaml#/definitions/sim_param" } }
  implementations:
    type: array
    items: { type: object, additionalProperties: false, required: [where, state], properties: { where: { type: string, description: "repository and file:function, or a forge module" }, state: { enum: [reference, current, building, retired] }, note: { type: string } } }
  cautions: { type: array, items: { type: string }, description: "Findings on it: bugs, comments that disagree with the code, what trips a reader up." }
  status: { enum: [draft, published, retired] }
  basis: { $ref: "../../common.schema.yaml#/definitions/basis" }
