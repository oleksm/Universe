$schema: http://json-schema.org/draft-07/schema#
title: Planet model
x-kind: [planet-model]
description: "standards/PlanetSim/metadata/models/<name>.yaml: a model used to describe or mesh a planet (the owner, 17 Oct 2026): its anchors and how they are found, the rule that weaves detail around them, its parameters, what it guarantees and what it leaves out, the rules it carries, the levels it serves, its implementations and the measures that judge it."
type: object
additionalProperties: false
required: [identity, purpose, detail]
allOf:
  - { $ref: "../../common.schema.yaml#/definitions/planet_context" }
properties:
  identity:
    type: object
    additionalProperties: false
    required: [key, name, about]
    properties:
      key: { $ref: "../../common.schema.yaml#/definitions/key" }
      name: { type: string }
      about: { type: string }
      words: { type: string, description: "The owner's own words for it, verbatim, with the date." }
  purpose: { type: string, description: "What it is for." }
  anchors:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [name, kind, found_by]
      properties:
        name: { type: string }
        kind: { enum: [line, point], description: "line: a curve (the coast); point: a vertex (a peak, a dip)." }
        found_by: { type: string, description: "How it is found from the sim's data." }
        exact: { type: boolean, description: "true: kept exactly at every level (never smoothed, never moved by a refinement)." }
        line: { type: string, x-ref: [planet-line], description: "The line kind it is, when a line." }
        field: { type: string, x-ref: [planet-field], description: "The field it is an extremum or level of." }
  detail:
    type: object
    additionalProperties: false
    required: [rule]
    properties:
      rule: { type: string, description: "How detail is woven around the anchors, in words." }
      formula: { type: string, description: "The rule as a formula: a ring's height from its anchor's." }
      nearest: { type: string, description: "Which anchor a point takes its detail from." }
  source_field: { type: array, items: { type: string, x-ref: [planet-field] }, description: "The field it is built from; several while the choice is open." }
  params:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string }
        value: { type: number, x-unit-from: unit }
        unit: { type: string, description: "SI, or 1." }
        said_as: { $ref: "../../common.schema.yaml#/definitions/said_as" }
        open: { type: boolean, description: "true: not yet chosen; the value is a draft." }
        note: { type: string }
  guarantees: { type: array, items: { type: string }, description: "What a result of it always holds." }
  leaves_out: { type: array, items: { type: string }, description: "What it does not hold: refinements on top." }
  rules: { type: array, items: { type: string }, description: "The rules it carries (the depth graph's)." }
  mesh: { type: string, description: "How a mesh is made from it, when it meshes." }
  implementations:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [where, state]
      properties:
        where: { type: string, description: "Repository and file." }
        state: { enum: [predecessor, current, building, retired] }
        note: { type: string }
  inputs:
    type: array
    description: "What it reads, per sample: each input's unit and where it comes from."
    items:
      type: object
      additionalProperties: false
      required: [name, unit]
      properties:
        name: { type: string }
        unit: { type: string, description: "SI, 1 for a 0-1 index or a count, or class." }
        field: { type: string, x-ref: [planet-field], description: "The Planet Simulator field it is, where there is one." }
        source: { type: string, description: "The file and key, or how it is made." }
        meaning: { type: string }
  steps:
    type: array
    description: "Its approach, in order."
    items:
      type: object
      additionalProperties: false
      required: [name, rule]
      properties:
        name: { type: string }
        rule: { type: string }
        formula: { type: string }
  legend: { type: string, x-ref: [planet-layer], description: "The layer whose classes are its legend (ids, rules, colours there)." }
  references:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [name, used_for]
      properties:
        name: { type: string }
        by: { type: string, description: "Who publishes it." }
        used_for: { type: string }
        path: { type: string, description: "Where a copy lies, when one does." }
        url: { type: string }
  registers:
    type: array
    description: "The registers of what it generates."
    items: { type: object, additionalProperties: false, required: [name, what], properties: { name: { type: string }, what: { type: string }, geometry: { type: string }, example: { type: string } } }
  feature_kinds: { type: array, items: { type: string, x-ref: [planet-feature] }, description: "The relief feature kinds it generates or will (the Relief features register)." }
  record_fields:
    type: array
    description: "The fields every generated feature's record carries."
    items: { type: object, additionalProperties: false, required: [name, meaning], properties: { name: { type: string }, meaning: { type: string }, unit: { type: string } } }
  trace:
    type: object
    additionalProperties: false
    description: "How what it generates is traced: what, why, where, when."
    properties:
      row: { type: string, description: "What one trace row holds." }
      saved: { type: string, description: "Where the rows are kept." }
      log: { type: string, description: "What the run log prints." }
  overrides:
    type: array
    description: "What happens to a generated feature after it is born."
    items: { type: object, additionalProperties: false, required: [name, trigger, effect], properties: { name: { type: string }, trigger: { type: string }, effect: { type: string } } }
  erosion:
    type: object
    additionalProperties: false
    properties:
      formula: { type: string }
      params:
        type: array
        items: { type: object, additionalProperties: false, required: [name], properties: { name: { type: string }, source: { type: string }, value: { type: number, x-unit-from: unit }, unit: { type: string }, note: { type: string } } }
  tools:
    type: array
    items: { type: object, additionalProperties: false, required: [name, does], properties: { name: { type: string }, does: { type: string } } }
  legends:
    type: array
    description: "The planet page's legends for it, as the page shows them."
    items: { $ref: "../../common.schema.yaml#/definitions/planet_legend" }
  feeds: { type: array, items: { type: string, x-ref: [planet-model, lod-model] }, description: "The models it is to feed." }
  not_yet: { type: array, items: { type: string }, description: "What it does not say yet." }
  results:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [what, value, unit]
      properties:
        what: { type: string }
        value: { type: number, x-unit-from: unit }
        unit: { type: string }
        run: { type: string }
        note: { type: string }
  status: { enum: [draft, published, retired] }
  basis: { $ref: "../../common.schema.yaml#/definitions/basis" }
