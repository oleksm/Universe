$schema: http://json-schema.org/draft-07/schema#
title: Relief feature kind
x-kind: [planet-feature]
description: "standards/PlanetSim/metadata/features/<name>.yaml: a kind of relief feature the planet sim generates as vectors with metadata (the owner, 17 Oct 2026: the relief layer is the feature store, the skeleton the mesher meshes round): its register and family, the levels it appears at, its geometry, the metadata each feature of it carries, the sim's trigger, its geometry generator, what overrides it later, its wave and whether the sim builds it yet."
type: object
additionalProperties: false
required: [identity, register, family, trigger]
allOf:
  - { $ref: "../../common.schema.yaml#/definitions/planet_context" }
properties:
  identity:
    type: object
    additionalProperties: false
    required: [key, name, about]
    properties:
      key: { $ref: "../../common.schema.yaml#/definitions/key" }
      name: { type: string }
      about: { type: string }
  register: { enum: [province, feature, landmark], description: "province: an area where a kind of relief holds, bounded by lines; feature: a land-forming line, area or point inside provinces (the skeleton); landmark: a single dated event (a volcano, an impact)." }
  family: { enum: [tectonic, volcanic, fluvial, glacial, coastal, karst-arid-aeolian, landmark] }
  level: { type: array, minItems: 1, maxItems: 2, items: { type: integer, minimum: 0, maximum: 3, x-unit: "1" }, description: "The coarsest and finest levels it appears at: 1 10 to 50 km, 2 2 to 10 km, 3 under 2 km (0: the coast, exact at every level)." }
  geometry: { type: string, description: "polyline, polygon, point, ring, network, or a set of them." }
  metadata: { type: string, description: "The metadata its features carry beyond every feature's (relief-features.md), with units." }
  trigger: { type: string, description: "What in the sim makes one." }
  generator: { type: string, description: "How its geometry is made." }
  metadata_from: { type: string, description: "Where its metadata come from." }
  overrides: { type: string, description: "What changes it after it is born." }
  wave: { type: integer, minimum: 1, maximum: 3, x-unit: "1", description: "1: signals at existing hooks; 2: needs a new hook or field; 3: level 2-3 detail generated by the mesher from its parent feature." }
  built: { type: boolean, description: "true: the sim generates it now (its KINDS)." }
  sim_kinds: { type: array, items: { type: string }, description: "The sim's own kind names for it (stages/relief.py KINDS)." }
  landmark: { type: string, x-ref: [planet-landmark], description: "The landmark type it is or comes from, when one." }
  status: { enum: [draft, published, retired] }
  basis: { $ref: "../../common.schema.yaml#/definitions/basis" }
