# yaml-language-server: $schema=../../schema/planet-layer.schema.yaml
identity:
  key: planet-layer.coast
  name: Coast
  about: Land and sea; the 0 m line exact at every level.
version: 1
classes:
- id: 1
  name: land
  when:
  - field: planet-field.height
    op: '>'
    value: 0.0
- id: 2
  name: sea
  when:
  - field: planet-field.height
    op: <=
    value: 0.0
lines:
- name: coast
  field: planet-field.height
  value: 0.0
bounded_by:
- planet-line.coast
levels:
- planet-level.10000-km
- planet-level.1000-km
- planet-level.100-km
- planet-level.10-km
- planet-level.1-km
basis:
- of:
  - identity
  rule: rule.sim-architecture
status: draft
