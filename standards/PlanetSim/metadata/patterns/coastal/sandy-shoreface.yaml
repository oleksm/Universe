# yaml-language-server: $schema=../../../schema/planet-pattern.schema.yaml
identity:
  key: planet-pattern.coastal.beach.sandy-shoreface
  name: Sandy beach and shoreface (equilibrium profile)
  about: Sandy beach and shoreface (equilibrium profile).
family: coastal
factors:
- factor: planet-factor.sed-supply
  weight: 3
  why: sand must be supplied (rivers, cliffs, shelf); grain size sets Dean A 0.06-0.20 and foreshore slope
  want: high
- factor: planet-factor.waves-tides
  weight: 3
  why: wave height/period set closure depth 6-20 m, bars, dissipative vs reflective state; tides widen intertidal
    zone
  want: high
- factor: planet-factor.clim-storm
  weight: 1
  why: 'storms cut berm and move bars offshore; calm seasons rebuild: seasonal summer/winter profiles'
  want: high
- factor: planet-factor.sea-level
  weight: 1
  why: stable or slowly rising sea level since ~7 ka lets profile equilibrate; rise drives landward retreat
  want: low
- factor: planet-factor.slope-relief
  weight: 3
  why: needs gentle shelf/coastal plain or embayment; steep rocky coasts give pocket beaches only
  want: low
- factor: planet-factor.relief-inherited
  weight: 1
  why: 'headlands control plan shape: log-spiral headland-bay beaches between fixed points'
  want: high
- factor: planet-factor.clim-temp
  weight: 1
  why: sea ice and frozen beaches shorten wave season, reduce profile activity at high latitude
  want: low
- factor: planet-factor.rock-type
  weight: 1
  why: sediment mineralogy (quartz, carbonate, volcanic) sets grain density, colour and sorting
  want: high
- factor: planet-factor.time
  weight: 1
  why: profile adjusts in days-years; Holocene beach bodies 1-7 kyr old
  want: high
vocabulary_id: 17
sources:
- https://www.nps.gov/articles/sandy-coast-landforms.htm
- https://www.nps.gov/subjects/geology/coastal-landforms.htm
- https://www.coastalwiki.org/wiki/Dune_development
library_status: written
source: coastal.beach.sandy_shoreface
levels:
- planet-level.100-km
- planet-level.10-km
basis:
- of:
  - factors
  - sources
  tier: derived
  note: 'planet-trees-pgs2 docs/landforms/deciding_factors.json: its factors in its words, its top three weighted
    3.'
- of:
  - when
  tier: invented
  review: true
  note: 'No hard conditions yet: planets to add them where a factor is a must (ice, sea, a volcano).'
- of:
  - factors.want
  - look
  tier: invented
  review: true
  source: planet-forge 3c40281 crates/viewer/src/rings/formations.rs factor_scores; crates/viewer/src/layers/features.rs
    arch_of
  note: Draft migration of viewer archetype mapping (including dendritic fallback) and preference-word inference,
    corrected to whole-word tokens and reviewed against supplied why text and existing signal direction. Ambiguous
    categorical, compound or nonmonotonic factors remain review-required; no band bounds invented. Consumers
    use explicit fields, never repeat prose/key inference.
- of:
  - factors.want
  tier: derived
  review: true
  source: Supplied factor why text and PlanetSim factor signal records; semantic correction 2026-10-22
  note: 'planet-factor.clim-temp: The why text says sea ice/cold limits wave activity; low cold-strength favors
    that activity.'
status: draft
look: coastal
