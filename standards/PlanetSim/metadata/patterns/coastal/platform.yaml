# yaml-language-server: $schema=../../../schema/planet-pattern.schema.yaml
identity:
  key: planet-pattern.coastal.carbonate.platform
  name: Isolated carbonate platform (bank)
  about: Isolated carbonate platform (bank).
family: coastal
factors:
- factor: planet-factor.tect-setting
  weight: 1
  why: rifted passive margin with fault-block highs; isolated from siliciclastic sources
- factor: planet-factor.tect-uplift
  weight: 3
  why: steady subsidence matched by carbonate production builds km-thick stack
- factor: planet-factor.clim-temp
  weight: 3
  why: tropical factory gives rimmed flat-topped platform; cool-water factory gives ramps
- factor: planet-factor.bio-veg
  weight: 1
  why: carbonate factory type (corals/algae, heterotrophs, microbes) sets geometry
- factor: planet-factor.sed-supply
  weight: 3
  why: low siliciclastic input and turbidity required
- factor: planet-factor.sea-level
  weight: 1
  why: lowstands expose and karstify top; fast rise drowns platform
- factor: planet-factor.clim-wind
  weight: 1
  why: trade-wind exposure shapes windward rims and sand shoals
- factor: planet-factor.relief-inherited
  weight: 1
  why: inherited fault-block topography sets platform outline
- factor: planet-factor.other-ocean-chemistry
  weight: 1
  why: light, transparency, pH and low nutrients
- factor: planet-factor.time
  weight: 1
  why: 10-150 Myr
vocabulary_id: 18
sources:
- https://en.wikipedia.org/wiki/Carbonate_platform
- https://www.coastalwiki.org/wiki/Coral_reefs
library_status: written
source: coastal.carbonate.platform
levels:
- planet-level.region
- planet-level.landscape
basis:
- of:
  - factors
  - sources
  tier: derived
  note: 'planet-trees-pgs2 docs/landforms/deciding_factors.json: its factors in its words, its top three weighted 3.'
- of:
