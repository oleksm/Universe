# yaml-language-server: $schema=../../../schema/planet-pattern.schema.yaml
identity:
  key: planet-pattern.coastal.tidal.tidal-flat
  name: Tidal flat (sand/mixed/mud flat) with tidal channels
  about: Tidal flat (sand/mixed/mud flat) with tidal channels.
family: coastal
factors:
- factor: planet-factor.waves-tides
  weight: 3
  why: meso-macrotidal; flats where relative tidal range (spring range / wave height) >15
  want: high
- factor: planet-factor.sed-supply
  weight: 3
  why: fine sediment supply; grain size grades mud landward, sand seaward
  want: high
- factor: planet-factor.slope-relief
  weight: 3
  why: low gradient 0.0005-0.002 in sheltered bays, estuaries, behind barriers
  want: low
- factor: planet-factor.sea-level
  weight: 1
  why: stable or slow rise lets flats accrete; fast rise drowns
  want: low
- factor: planet-factor.clim-temp
  weight: 1
  why: 'sets vegetated upper fringe: salt marsh temperate, mangrove tropics'
  want: high
- factor: planet-factor.bio-veg
  weight: 1
  why: biofilms, worms, seagrass stabilise or bioturbate sediment
  want: in
  unresolved: true
  source: planet-forge 18ef137 docs/research/category-intentions-2026-10-24.json
- factor: planet-factor.clim-storm
  weight: 1
  why: storms rework flat surfaces, deposit shell/sand layers
  want: high
- factor: planet-factor.time
  weight: 1
  why: 1-7 kyr
  want: high
  unresolved: true
  source: planet-forge docs/research/process-geomorphology-2026-10-24.md section 3.2 (unverified order-of-magnitude
    table; not a decay constant)
vocabulary_id: 33
sources:
- https://www.coastalwiki.org/wiki/Tidal_flat
- https://en.wikipedia.org/wiki/Tidal_flat
- https://www.coastalwiki.org/wiki/Morphology_of_estuaries
