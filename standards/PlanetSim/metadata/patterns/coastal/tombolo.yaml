identity:
  key: planet-pattern.coastal.depositional.tombolo
  name: Tombolo and barrier beach tied to island
  about: Tombolo and barrier beach tied to island.
family: coastal
factors:
- factor: planet-factor.relief-inherited
  weight: 3
  why: offshore island or rock near shore; island length/distance ratio decides tombolo vs salient
  want: high
- factor: planet-factor.waves-tides
  weight: 3
  why: wave refraction/diffraction behind island converges drift into shadow zone; high tidal range favours
    salients
  want: high
- factor: planet-factor.sed-supply
  weight: 3
  why: enough sand/shingle in littoral cell to fill gap
  want: high
- factor: planet-factor.rock-type
  weight: 1
  why: island of resistant rock that survives as anchor
  want: high
- factor: planet-factor.slope-relief
  weight: 1
  why: shallow gap between island and mainland
  want: high
- factor: planet-factor.sea-level
  weight: 1
  why: Holocene rise can roll gravel barriers landward onto islands (Chesil type)
  want: high
- factor: planet-factor.time
  weight: 1
  why: 0.1-7 kyr to connect
  want: high
vocabulary_id: 20
sources:
- https://www.coastalwiki.org/wiki/Tombolo
- https://www.nps.gov/articles/sandy-coast-landforms.htm
library_status: written
source: coastal.depositional.tombolo
