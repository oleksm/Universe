# yaml-language-server: $schema=../../../schema/planet-pattern.schema.yaml
identity:
  key: planet-pattern.coastal.barrier.barrier-island
  name: Barrier island and back-barrier lagoon
  about: Barrier island and back-barrier lagoon.
family: coastal
factors:
- factor: planet-factor.sed-supply
  weight: 3
  why: abundant sand from shelf, rivers or deltas; starved supply gives thin, washover-dominated barriers
  want: high
- factor: planet-factor.waves-tides
  weight: 3
  why: microtidal <2 m long continuous barriers; mesotidal 2-4 m short drumstick islands; macrotidal >4 m rarely
  want: high
- factor: planet-factor.sea-level
  weight: 3
  why: Holocene transgression drove onshore sand; slow rise sustains rollover, fast rise drowns barrier
  want: low
- factor: planet-factor.slope-relief
  weight: 1
  why: gentle shelf and low coastal plain needed; steep coasts lack barriers
  want: low
- factor: planet-factor.tect-setting
  weight: 1
  why: mostly passive trailing margins and deltaic coasts (wide low-gradient shelves)
  want: low
- factor: planet-factor.clim-storm
  weight: 1
  why: storm overwash and breaching build washover fans, open inlets, drive landward migration
  want: high
- factor: planet-factor.bio-veg
  weight: 1
  why: dune grasses trap sand, build dunes; height controls overwash frequency
  want: high
- factor: planet-factor.clim-wind
  weight: 1
  why: onshore winds build dune ridge on barrier crest
  want: high
- factor: planet-factor.clim-temp
  weight: 1
  why: 'Arctic sea ice limits fetch: barriers shorter (~5 km mean vs 10 km)'
  want: low
- factor: planet-factor.time
  weight: 1
  why: modern barriers formed within ~6-7 kyr of sea-level stillstand
  want: high
vocabulary_id: 16
sources:
- https://www.nps.gov/articles/sandy-coast-landforms.htm
- https://www.coastalwiki.org/wiki/Barrier_islands
- https://www.coastalwiki.org/wiki/Estuaries
- https://www.nps.gov/subjects/geology/coastal-landforms.htm
library_status: written
source: coastal.barrier.barrier_island
levels:
- planet-level.100-km
- planet-level.10-km
basis:
- of:
  - factors
  - sources
  tier: derived
  note: 'planet-trees-pgs2 docs/landforms/deciding_factors.json: its factors in its words, its top three weighted
    3.'
- of:
  - when
  tier: invented
  review: true
  note: 'No hard conditions yet: planets to add them where a factor is a must (ice, sea, a volcano).'
- of:
  - factors.want
  - look
  tier: invented
  review: true
  source: planet-forge 3c40281 crates/viewer/src/rings/formations.rs factor_scores; crates/viewer/src/layers/features.rs
    arch_of
  note: Draft migration of viewer archetype mapping (including dendritic fallback) and preference-word inference,
    corrected to whole-word tokens and reviewed against supplied why text and existing signal direction. Ambiguous
    categorical, compound or nonmonotonic factors remain review-required; no band bounds invented. Consumers
    use explicit fields, never repeat prose/key inference.
- of:
  - factors.want
  tier: derived
  review: true
  source: Supplied factor why text and PlanetSim factor signal records; semantic correction 2026-10-22
  note: 'planet-factor.clim-temp: The why text says sea ice/cold limits wave activity; low cold-strength favors
    that activity.'
status: draft
look: coastal
