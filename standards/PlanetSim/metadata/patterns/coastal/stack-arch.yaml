identity:
  key: planet-pattern.coastal.rocky.stack-arch
  name: Sea stacks, arches, caves, blowholes
  about: Sea stacks, arches, caves, blowholes.
family: coastal
factors:
- factor: planet-factor.rock-fracture
  weight: 3
  why: 'joints, bedding planes, faults are exploited: cave -> arch -> stack -> stump'
- factor: planet-factor.rock-type
  weight: 3
  why: medium-hard rock (limestone, chalk, sandstone, basalt); claystone too weak, granite too strong
- factor: planet-factor.rock-layers
  weight: 1
  why: harder capstone layer preserves vertical pillars
- factor: planet-factor.waves-tides
  weight: 3
  why: refraction concentrates wave energy on headlands
- factor: planet-factor.relief-inherited
  weight: 1
  why: headland protruding into wave field
- factor: planet-factor.sea-level
  weight: 1
  why: stable sea level to cut caves at one level
- factor: planet-factor.time
  weight: 1
  why: short-lived features, 0.1-10 kyr
vocabulary_id: 30
sources:
