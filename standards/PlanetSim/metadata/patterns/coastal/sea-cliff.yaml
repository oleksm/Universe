# yaml-language-server: $schema=../../../schema/planet-pattern.schema.yaml
identity:
  key: planet-pattern.coastal.rocky.sea-cliff
  name: Sea cliff with basal notch
  about: Sea cliff with basal notch.
family: coastal
factors:
- factor: planet-factor.rock-type
  weight: 3
  why: strong rock gives vertical cliffs; weak rock/till sloping landslide cliffs; retreat ~0.5 cm/yr chalk
    to 25 cm/yr till
  want: low
- factor: planet-factor.rock-fracture
  weight: 3
  why: joints and faults set block size, collapse style and notch depth
  want: high
- factor: planet-factor.rock-layers
  weight: 1
  why: weak beds at base undercut fast; hard caps give overhangs
  want: high
- factor: planet-factor.waves-tides
  weight: 3
  why: wave attack at toe cuts notch; tidal range sets notch height band
  want: high
- factor: planet-factor.sed-supply
  weight: 1
  why: protective beach at toe slows erosion; thin beach supplies abrasive tools
  want: high
- factor: planet-factor.slope-relief
  weight: 1
  why: high land at coast sets cliff height (up to ~1000 m)
  want: high
- factor: planet-factor.groundwater
  weight: 1
  why: seepage and pore pressure trigger face failures
  want: high
- factor: planet-factor.clim-precip
  weight: 1
  why: rainfall wets face, drives subaerial mass wasting
  want: high
- factor: planet-factor.clim-temp
  weight: 1
  why: freeze-thaw loosens face blocks at high latitude
  want: high
- factor: planet-factor.sea-level
  weight: 1
  why: stable level focuses notch; rise reactivates dead cliffs
  want: low
- factor: planet-factor.tect-uplift
  weight: 1
  why: uplift raises cliff and abandons notches
  want: high
- factor: planet-factor.events
  weight: 1
  why: storms, earthquakes trigger collapses
  want: high
- factor: planet-factor.time
  weight: 1
  why: 1-1000 kyr
  want: high
vocabulary_id: 28
sources:
- https://en.wikipedia.org/wiki/Cliffed_coast
- https://www.coastalwiki.org/wiki/Cliff_erosion
- https://www.nps.gov/articles/rocky-coast-landforms.htm
library_status: written
source: coastal.rocky.sea_cliff
levels:
- planet-level.100-km
- planet-level.10-km
basis:
- of:
  - factors
  - sources
  tier: derived
  note: 'planet-trees-pgs2 docs/landforms/deciding_factors.json: its factors in its words, its top three weighted
    3.'
- of:
  - when
  tier: invented
  review: true
  note: 'No hard conditions yet: planets to add them where a factor is a must (ice, sea, a volcano).'
- of:
  - factors.want
  - look
  tier: invented
  review: true
  source: planet-forge 3c40281 crates/viewer/src/rings/formations.rs factor_scores; crates/viewer/src/layers/features.rs
    arch_of
  note: Draft migration of viewer archetype mapping (including dendritic fallback) and preference-word inference,
    corrected to whole-word tokens and reviewed against supplied why text and existing signal direction. Ambiguous
    categorical, compound or nonmonotonic factors remain review-required; no band bounds invented. Consumers
    use explicit fields, never repeat prose/key inference.
- of:
  - factors.want
  tier: derived
  review: true
  source: Supplied factor why text and PlanetSim factor signal records; semantic correction 2026-10-22
  note: 'planet-factor.rock-layers: Alternating strong/weak beds or caprock require layering contrast; flat/weak
    does not request absence of layering.'
status: draft
look: coastal
