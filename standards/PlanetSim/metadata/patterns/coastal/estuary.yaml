# yaml-language-server: $schema=../../../schema/planet-pattern.schema.yaml
identity:
  key: planet-pattern.coastal.drowned.estuary
  name: Estuary (wave- or tide-dominated)
  about: Estuary (wave- or tide-dominated).
family: coastal
factors:
- factor: planet-factor.sea-level
  weight: 3
  why: Holocene transgression flooded incised valleys; estuaries fill and are short-lived
  want: high
- factor: planet-factor.waves-tides
  weight: 3
  why: microtidal <2 m wave-dominated barrier/lagoon; macrotidal >4 m funnel with sand bars, flats
  want: high
- factor: planet-factor.water-discharge
  weight: 1
  why: river discharge sets salinity, stratification, fluvial delta at head
  want: high
- factor: planet-factor.sed-supply
  weight: 3
  why: river + marine sediment rate decides infilling to delta
  want: high
- factor: planet-factor.relief-inherited
  weight: 1
  why: incised valley at coast from lowstand incision
  want: high
- factor: planet-factor.base-level
  weight: 1
  why: lowstand base-level fall cut the valley first
  want: high
- factor: planet-factor.bio-veg
  weight: 1
  why: salt marsh or mangrove stabilises margins
  want: high
- factor: planet-factor.time
  weight: 1
  why: 7-20 kyr since flooding
  want: high
vocabulary_id: 21
sources:
- https://www.nps.gov/articles/estuary-landforms.htm
- https://www.coastalwiki.org/wiki/Estuaries
- https://www.coastalwiki.org/wiki/Morphology_of_estuaries
library_status: written
source: coastal.drowned.estuary
levels:
- planet-level.100-km
- planet-level.10-km
basis:
- of:
  - factors
  - sources
  tier: derived
  note: 'planet-trees-pgs2 docs/landforms/deciding_factors.json: its factors in its words, its top three weighted
    3.'
- of:
  - when
  tier: invented
  review: true
  note: 'No hard conditions yet: planets to add them where a factor is a must (ice, sea, a volcano).'
- of:
  - factors.want
  - look
  tier: invented
  review: true
  source: planet-forge 3c40281 crates/viewer/src/rings/formations.rs factor_scores; crates/viewer/src/layers/features.rs
    arch_of
  note: Draft migration of viewer archetype mapping (including dendritic fallback) and preference-word inference,
    corrected to whole-word tokens and reviewed against supplied why text and existing signal direction. Ambiguous
    categorical, compound or nonmonotonic factors remain review-required; no band bounds invented. Consumers
    use explicit fields, never repeat prose/key inference.
status: draft
look: coastal
