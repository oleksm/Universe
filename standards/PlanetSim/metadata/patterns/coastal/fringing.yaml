# yaml-language-server: $schema=../../../schema/planet-pattern.schema.yaml
identity:
  key: planet-pattern.coastal.reef.fringing
  name: Fringing coral reef
  about: Fringing coral reef.
family: coastal
factors:
- factor: planet-factor.clim-temp
  weight: 3
  why: sea surface >~18 C, optimum 26-27 C; roughly 30N-30S
  want: low
- factor: planet-factor.bio-veg
  weight: 1
  why: coral and coralline algae framework growth 1-25 cm/yr
  want: high
- factor: planet-factor.sed-supply
  weight: 3
  why: clear water; river mud and freshwater block reefs (gaps at river mouths)
  want: high
- factor: planet-factor.slope-relief
  weight: 1
  why: hard substrate at shallow depth near shore (light to ~60 m)
  want: high
- factor: planet-factor.sea-level
  weight: 3
  why: 'accommodation space: keep-up, catch-up or give-up reefs'
  want: high
- factor: planet-factor.tect-uplift
  weight: 1
  why: uplift strands reef terraces; subsidence moves toward barrier reef
  want: high
- factor: planet-factor.waves-tides
  weight: 1
  why: wave exposure sets zonation and reef-flat width
  want: low
- factor: planet-factor.other-ocean-chemistry
  weight: 1
  why: aragonite saturation and low nutrients needed
  want: low
- factor: planet-factor.time
  weight: 1
  why: 1-10 kyr for Holocene reef flats
  want: high
vocabulary_id: 26
sources:
- https://www.coastalwiki.org/wiki/Coral_reefs
- https://en.wikipedia.org/wiki/Fringing_reef
- https://www.nps.gov/articles/tropical-coast-landforms.htm
library_status: written
source: coastal.reef.fringing
levels:
- planet-level.100-km
- planet-level.10-km
basis:
- of:
  - factors
  - sources
  tier: derived
  note: 'planet-trees-pgs2 docs/landforms/deciding_factors.json: its factors in its words, its top three weighted
    3.'
- of:
  - when
  tier: invented
  review: true
  note: 'No hard conditions yet: planets to add them where a factor is a must (ice, sea, a volcano).'
- of:
  - factors.want
  - look
  tier: invented
  review: true
  source: planet-forge 3c40281 crates/viewer/src/rings/formations.rs factor_scores; crates/viewer/src/layers/features.rs
    arch_of
  note: Draft migration of viewer archetype mapping (including dendritic fallback) and preference-word inference,
    corrected to whole-word tokens and reviewed against supplied why text and existing signal direction. Ambiguous
    categorical, compound or nonmonotonic factors remain review-required; no band bounds invented. Consumers
    use explicit fields, never repeat prose/key inference.
- of:
