# yaml-language-server: $schema=../../../schema/planet-pattern.schema.yaml
identity:
  key: planet-pattern.coastal.reef.atoll
  name: Atoll
  about: Atoll.
family: coastal
factors:
- factor: planet-factor.tect-uplift
  weight: 3
  why: thermal subsidence of volcanic island on cooling plate; reef growth must match it
  want: high
- factor: planet-factor.tect-setting
  weight: 3
  why: intraplate hotspot volcano on oceanic plate moving away from ridge/hotspot
  want: in
  source: planet-forge 18ef137 docs/research/category-intentions-2026-10-24.json
  classes:
  - hotspot
  required: true
- factor: planet-factor.volc-vent
  weight: 1
  why: extinct volcanic edifice as foundation
  want: high
- factor: planet-factor.clim-temp
  weight: 3
  why: tropical; poleward of Darwin point growth fails and atoll drowns (guyot)
  want: low
- factor: planet-factor.bio-veg
  weight: 1
  why: coral/algal reef growth on rim
  want: in
  source: planet-forge 18ef137 docs/research/category-intentions-2026-10-24.json
  classes:
  - reef
  required: true
- factor: planet-factor.sea-level
  weight: 1
  why: glacial lowstands karstify rim (antecedent saucer); highstands regrow reef
  want: high
- factor: planet-factor.rock-soluble
  weight: 1
  why: lowstand dissolution of carbonate cap deepens lagoon
  want: in
  classes:
  - rock-unit.limestone
  source: https://www.usgs.gov/publications/subsidence-hazards-due-evaporite-dissolution-united-states
- factor: planet-factor.waves-tides
  weight: 1
  why: storms pile motu islands on rim; windward rim wider
  want: high
- factor: planet-factor.time
  weight: 1
  why: 1-60 Myr; caps 1.3-1.4 km thick
  want: high
  unresolved: true
  source: planet-forge docs/research/process-geomorphology-2026-10-24.md section 3.2 (unverified order-of-magnitude
    table; not a decay constant)
vocabulary_id: 24
sources:
- https://en.wikipedia.org/wiki/Atoll
- https://www.coastalwiki.org/wiki/Coral_reefs
- https://www.nps.gov/articles/tropical-coast-landforms.htm
library_status: written
source: coastal.reef.atoll
levels:
- planet-level.100-km
- planet-level.10-km
basis:
- of:
  - factors
  - sources
  tier: derived
  note: 'planet-trees-pgs2 docs/landforms/deciding_factors.json: its factors in its words, its top three weighted
    3.'
- of:
  - when
  tier: invented
  review: true
  note: 'No hard conditions yet: planets to add them where a factor is a must (ice, sea, a volcano).'
- of:
  - factors.want
  - look
  tier: invented
  review: true
  source: planet-forge 3c40281 crates/viewer/src/rings/formations.rs factor_scores; crates/viewer/src/layers/features.rs
    arch_of
  note: Draft migration of viewer archetype mapping (including dendritic fallback) and preference-word inference,
    corrected to whole-word tokens and reviewed against supplied why text and existing signal direction. Ambiguous
    categorical, compound or nonmonotonic factors remain review-required; no band bounds invented. Consumers use
    explicit fields, never repeat prose/key inference.
- of:
  - factors.want
  tier: derived
  review: true
  source: Supplied factor why text and PlanetSim factor signal records; semantic correction 2026-10-22
  note: 'planet-factor.clim-temp: The record asks for warmth; existing clim-temp strength rises toward cold (283.15
    to 263.15 K).'
- of:
  - factors.classes
  - factors.required
  - factors.unresolved
  tier: derived
  source: planet-forge 18ef137 docs/research/category-intentions-2026-10-24.json
  note: Reviewed directed categorical intentions, with prerequisites separated from modifiers. Missing/proxy class
    evidence is not a verified physical classification; unresolved classes remain unknown.
- of:
  - factors.classes
  - factors.required
  tier: derived
  source: https://www.usgs.gov/publications/subsidence-hazards-due-evaporite-dissolution-united-states
  note: Soluble lithology is necessary for the named solutional-karst forms; limestone purity, thickness, groundwater
    and dissolution history still require separate evidence. Elsewhere it remains a modifier. Unknown evaporites
    cannot become absence.
status: draft
look: coastal
kinds:
- atoll
