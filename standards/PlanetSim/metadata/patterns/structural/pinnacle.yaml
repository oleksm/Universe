  name: Pinnacle / spire / hoodoo (caprock remnant)
  about: Pinnacle / spire / hoodoo (caprock remnant).
family: structural
factors:
- factor: planet-factor.rock-layers
  weight: 3
  why: Thin hard cap over thick soft rock; cap shields column
  want: high
- factor: planet-factor.rock-fracture
  weight: 3
  why: Joint grid sets fins then spires; spacing sets width
  want: high
- factor: planet-factor.clim-temp
  weight: 3
  why: Frost wedging; Bryce Canyon >200 freeze-thaw cycles/yr
  want: high
- factor: planet-factor.clim-storm
  weight: 1
  why: Monsoon-type storms wash soft rock
  want: high
- factor: planet-factor.clim-arid
  weight: 1
  why: Semi-arid; sparse vegetation leaves rock bare
  want: high
- factor: planet-factor.rock-soluble
  weight: 1
  why: Carbonate cement dissolves grain by grain, rounding forms
  want: high
- factor: planet-factor.tect-uplift
  weight: 1
  why: Uplift and rim retreat expose layers
  want: high
- factor: planet-factor.time
  weight: 1
  why: Short-lived (kyr-100 kyr) final stage of scarp retreat
  want: high
