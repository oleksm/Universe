# yaml-language-server: $schema=../../../schema/planet-pattern.schema.yaml
identity:
  key: planet-pattern.structural.flat.mesa-butte
  name: Mesa and butte (structural, caprock-controlled)
  about: Mesa and butte (structural, caprock-controlled).
family: structural
factors:
- factor: planet-factor.rock-layers
  weight: 3
  why: 'Horizontal resistant caprock (sandstone, basalt flow) over weak shale/siltstone Duplicate library context:
    Resistant caprock (sandstone, conglomerate) over weak shale/siltstone (De Chelly over Organ Rock)'
  want: high
- factor: planet-factor.tect-fold
  weight: 1
  why: 'Near-horizontal strata Duplicate library context: Near-horizontal strata (dip < ~5 deg); steeper dips give
    cuestas'
  want: high
- factor: planet-factor.tect-uplift
  weight: 3
  why: 'Uplift drives incision dissecting plateau Duplicate library context: Plateau uplift drives river incision
    and dissection'
  want: high
- factor: planet-factor.volc-vent
  weight: 1
  why: Lava flow caps (flood basalts) can form caprock and inverted relief
  want: high
- factor: planet-factor.rock-fracture
  weight: 1
  why: 'Caprock joints control block fall and remnant outline Duplicate library context: Joints in caprock localise
    retreat and set butte/spire outlines'
  want: high
- factor: planet-factor.groundwater
  weight: 1
  why: 'Basal sapping undermines caprock Duplicate library context: Basal sapping at caprock/shale contact undermines
    cliffs'
  want: high
- factor: planet-factor.clim-arid
  weight: 3
  why: 'Arid/semi-arid preserves free faces Duplicate library context: Arid to semi-arid: sparse vegetation keeps
    free faces sharp'
  want: high
- factor: planet-factor.base-level
  weight: 1
  why: 'Valley-floor level sets relief (to ~300 m) Duplicate library context: River incision sets valley-floor height
    and remnant relief (up to ~300 m)'
  want: high
- factor: planet-factor.time
  weight: 1
  why: '0.1-10 Myr; mesa to butte to pinnacle Duplicate library context: 1-30 Myr of scarp retreat: plateau, mesa,
    butte, spire'
  want: high
  unresolved: true
  source: planet-forge docs/research/process-geomorphology-2026-10-24.md section 3.2 (unverified order-of-magnitude
    table; not a decay constant)
- factor: planet-factor.clim-storm
  weight: 1
  why: Flash floods remove talus from weak slopes
  want: high
