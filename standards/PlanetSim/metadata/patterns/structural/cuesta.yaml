# yaml-language-server: $schema=../../../schema/planet-pattern.schema.yaml
identity:
  key: planet-pattern.structural.homocline.cuesta
  name: Cuesta (escarpment plus dip slope)
  about: Cuesta (escarpment plus dip slope).
family: structural
factors:
- factor: planet-factor.tect-fold
  weight: 3
  why: Gentle dip (< ~10-25 deg); dip sets backslope and scarp migration distance
  want: low
- factor: planet-factor.rock-layers
  weight: 3
  why: Resistant caprock over weak shale; strength contrast and thickness set scarp height
  want: high
- factor: planet-factor.rock-type
  weight: 1
  why: Limestone, dolostone, sandstone caps; clay/shale below
  want: high
- factor: planet-factor.tect-setting
  weight: 1
  why: Platform/basin margins, domes and basins
  want: high
- factor: planet-factor.tect-uplift
  weight: 1
  why: Uplift/base-level fall drives erosion stripping weak beds
  want: high
- factor: planet-factor.water-discharge
  weight: 1
  why: Subsequent/obsequent streams cause lobate front and outliers
  want: high
- factor: planet-factor.groundwater
  weight: 1
  why: Spring sapping at caprock base drives retreat
  want: high
- factor: planet-factor.clim-arid
  weight: 1
  why: Any; aridity sharpens free face
  want: high
- factor: planet-factor.time
  weight: 3
  why: 1-100 Myr; scarp retreats down-dip km
  want: high
vocabulary_id: 116
sources:
- https://en.wikipedia.org/wiki/Cuesta
- https://en.wikipedia.org/wiki/Hogback_(geology)
library_status: written
source: structural.homocline.cuesta
levels:
- planet-level.100-km
- planet-level.10-km
basis:
- of:
  - factors
  - sources
  tier: derived
  note: 'planet-trees-pgs2 docs/landforms/deciding_factors.json: its factors in its words, its top three weighted
    3.'
- of:
  - when
  tier: invented
  review: true
  note: 'No hard conditions yet: planets to add them where a factor is a must (ice, sea, a volcano).'
- of:
  - factors.want
  - look
  tier: invented
  review: true
  source: planet-forge 3c40281 crates/viewer/src/rings/formations.rs factor_scores; crates/viewer/src/layers/features.rs
    arch_of
  note: Draft migration of viewer archetype mapping (including dendritic fallback) and preference-word inference,
    corrected to whole-word tokens and reviewed against supplied why text and existing signal direction. Ambiguous
    categorical, compound or nonmonotonic factors remain review-required; no band bounds invented. Consumers
    use explicit fields, never repeat prose/key inference.
- of:
  - factors.want
  tier: derived
  review: true
  source: Supplied factor why text and PlanetSim factor signal records; semantic correction 2026-10-22
  note: 'planet-factor.rock-layers: Alternating strong/weak beds or caprock require layering contrast; flat/weak
    does not request absence of layering. planet-factor.tect-uplift: Uplift drives stripping; weak describes
    beds.'
status: draft
look: trellis
