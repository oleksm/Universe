identity:
  key: planet-pattern.glacial.valley.trough
  name: Glacial trough (U-shaped valley)
  about: Glacial trough (U-shaped valley).
family: glacial
factors:
- factor: planet-factor.relief-inherited
  weight: 3
  why: pre-existing fluvial valley is widened and deepened into the trough
  want: high
- factor: planet-factor.ice-flow
  weight: 3
  why: ice discharge sets cross-section area; ~80% larger than fluvial of same drainage
  want: high
- factor: planet-factor.ice-thermal
  weight: 1
  why: warm-based sliding needed for abrasion/quarrying
  want: high
- factor: planet-factor.ice-extent
  weight: 3
  why: ELA below valley heads; duration and cycle count set U-shape maturity (b 1.5-2)
  want: high
- factor: planet-factor.rock-type
  weight: 1
  why: crystalline rock holds steep walls; weak rock gives wider gentler troughs
  want: in
  source: planet-forge 18ef137 docs/research/category-intentions-2026-10-24.json
  classes:
  - crystalline
- factor: planet-factor.rock-fracture
  weight: 1
  why: fracture zones guide trough path and steps
  want: high
- factor: planet-factor.time
  weight: 1
  why: 10-1000 kyr; parabolic shape develops over ~100 kyr of ice occupation
  want: high
  unresolved: true
  source: planet-forge docs/research/process-geomorphology-2026-10-24.md section 3.2 (unverified order-of-magnitude
    table; not a decay constant)
- factor: planet-factor.sed-supply
  weight: 1
  why: post-glacial fill (0-300 m) flattens floor
  want: high
- factor: planet-factor.tect-uplift
  weight: 1
  why: uplift sustains relief and ice catchment height
  want: high
