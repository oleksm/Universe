# yaml-language-server: $schema=../../../schema/planet-pattern.schema.yaml
identity:
  key: planet-pattern.glacial.erosion.cirque
  name: Cirque
  about: Cirque.
family: glacial
factors:
- factor: planet-factor.ice-extent
  weight: 3
  why: cirque floors sit near former ELA; repeated marginal glaciation over many cycles
  want: high
- factor: planet-factor.aspect
  weight: 3
  why: 'poleward/east-facing in N hemisphere: less insolation, less melt'
  want: high
- factor: planet-factor.clim-wind
  weight: 3
  why: prevailing wind drifts snow into lee hollows; can override aspect (Antarctica)
  want: high
- factor: planet-factor.clim-temp
  weight: 1
  why: freeze-thaw nivation starts hollows; near-0 C seasonal cycling
  want: high
- factor: planet-factor.clim-precip
  weight: 1
  why: snowfall sets ELA and glacier size
  want: high
- factor: planet-factor.relief-inherited
  weight: 1
  why: starts in fluvial valley heads, landslide scars or volcanic hollows
  want: high
- factor: planet-factor.rock-type
  weight: 1
  why: jointed crystalline/volcanic best; size median ~650 m
  want: high
- factor: planet-factor.rock-fracture
  weight: 1
  why: joint density controls headwall quarrying and steepness
  want: high
- factor: planet-factor.slope-relief
  weight: 1
  why: mountain flank must exceed ~300 m relief above floor
  want: high
- factor: planet-factor.ice-thermal
  weight: 1
  why: warm-based rotational sliding deepens floor; tarn overdeepening
  want: high
- factor: planet-factor.time
  weight: 1
  why: 100-2600 kyr; enlarges over several glaciations
  want: high
vocabulary_id: 72
sources:
- https://www.antarcticglaciers.org/glacial-geology/glacial-landforms/glacial-erosional-landforms/cirques/
