# yaml-language-server: $schema=../../../schema/planet-pattern.schema.yaml
identity:
  key: planet-pattern.glacial.valley.overdeepening
  name: Overdeepening and riegel
  about: Overdeepening and riegel.
family: glacial
factors:
- factor: planet-factor.ice-flow
  weight: 3
  why: convergence at confluences, below icefalls, at narrowings raises erosion; depths 10-100s m
  want: high
- factor: planet-factor.ice-thermal
  weight: 3
  why: warm-based ice and pressurised meltwater for quarrying
  want: high
- factor: planet-factor.rock-fracture
  weight: 3
  why: weak or fractured zones become basins; massive rock forms riegels
  want: high
- factor: planet-factor.rock-type
  weight: 1
  why: lithologic contrasts set basin/bar alternation
  want: in
  unresolved: true
  source: planet-forge 18ef137 docs/research/category-intentions-2026-10-24.json
- factor: planet-factor.slope-relief
  weight: 1
  why: valley steps and constrictions localise basins
  want: high
- factor: planet-factor.ice-extent
  weight: 1
  why: repeat glaciations deepen basins; Loch Morar ~310 m
  want: high
- factor: planet-factor.sea-level
  weight: 1
  why: tidewater termini allow basins far below sea level
  want: high
- factor: planet-factor.time
  weight: 1
  why: 10-1000 kyr
  want: high
  unresolved: true
  source: planet-forge docs/research/process-geomorphology-2026-10-24.md section 3.2 (unverified order-of-magnitude
    table; not a decay constant)
- factor: planet-factor.sed-supply
  weight: 1
  why: post-glacial fill and deltas infill the basin
  want: high
vocabulary_id: 84
