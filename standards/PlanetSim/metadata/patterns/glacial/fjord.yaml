identity:
  key: planet-pattern.glacial.erosion.fjord
  name: Fjord
  about: Fjord.
family: glacial
factors:
- factor: planet-factor.sea-level
  weight: 3
  why: glacially overdeepened trough flooded by postglacial sea-level rise
  want: high
- factor: planet-factor.ice-flow
  weight: 3
  why: outlet glaciers/ice streams concentrate flow; selective linear erosion below sea level
  want: high
- factor: planet-factor.ice-extent
  weight: 1
  why: ice must reach the coast at lowered glacial sea level; repeated cycles
  want: high
- factor: planet-factor.rock-fracture
  weight: 3
  why: fracture and fault zones guide fjord path (e.g. Hardangerfjord Caledonian structures)
  want: high
- factor: planet-factor.rock-type
  weight: 1
  why: resistant crystalline rock keeps steep walls
  want: in
  source: planet-forge 18ef137 docs/research/category-intentions-2026-10-24.json
  classes:
  - crystalline
- factor: planet-factor.clim-precip
  weight: 1
  why: high-latitude westerly coasts with orographic snowfall feed big outlet glaciers
  want: high
- factor: planet-factor.tect-uplift
  weight: 1
  why: uplifted passive-margin/orogen coastal mountains give ice catchments
  want: high
- factor: planet-factor.relief-inherited
  weight: 1
  why: pre-glacial coastal valleys localise fjords
  want: high
- factor: planet-factor.time
  weight: 1
  why: 100-2600 kyr; depths up to ~1300 m
  want: high
  unresolved: true
  source: planet-forge docs/research/process-geomorphology-2026-10-24.md section 3.2 (unverified order-of-magnitude
    table; not a decay constant)
- factor: planet-factor.waves-tides
  weight: 1
  why: tidal exchange over sill; sill depth ~100 m sets basin circulation
  want: high
- factor: planet-factor.ice-thermal
  weight: 1
  why: warm-based outlets erode; cold-based interfluves preserved
  want: high
vocabulary_id: 74
