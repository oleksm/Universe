identity:
  key: planet-pattern.glacial.valley.hanging-valley
  name: Hanging valley
  about: Hanging valley.
family: glacial
factors:
- factor: planet-factor.ice-flow
  weight: 3
  why: tributary/trunk ice discharge ratio sets incision difference and step height (100-1000 m)
  want: high
- factor: planet-factor.ice-extent
  weight: 3
  why: needs valley glaciation; duration grows the step
  want: high
- factor: planet-factor.relief-inherited
  weight: 3
  why: tributary junction of a fluvial network
  want: high
- factor: planet-factor.rock-type
  weight: 1
  why: resistant tributary rock enhances step; also forms by differential erosion
  want: high
- factor: planet-factor.ice-thermal
  weight: 1
  why: warm-based trunk glacier needed for deep trunk incision
  want: high
- factor: planet-factor.time
  weight: 1
  why: post-glacial fluvial incision slowly cuts gorge into lip
  want: high
- factor: planet-factor.water-discharge
  weight: 1
  why: tributary stream forms waterfall over step; low discharge preserves the hang
  want: low
- factor: planet-factor.sea-level
  weight: 1
  why: in fjords, tributary hangs below or above sea level
  want: high
