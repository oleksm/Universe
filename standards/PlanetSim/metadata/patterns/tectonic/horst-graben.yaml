identity:
  key: planet-pattern.tectonic.extension.horst-graben
  name: Horst-and-graben (tilted fault-block) terrain
  about: Horst-and-graben (tilted fault-block) terrain.
family: tectonic
factors:
- factor: planet-factor.tect-setting
  weight: 3
  why: extension of thickened/thermally weakened continental lithosphere (crust 30-35 km)
  want: high
- factor: planet-factor.tect-fault
  weight: 3
  why: normal fault spacing ~24-32 km set by brittle layer thickness; tilt gives half-grabens
  want: high
- factor: planet-factor.tect-uplift
  weight: 1
  why: footwall uplift/hanging-wall subsidence rate sets 1-3 km relief
  want: high
- factor: planet-factor.other-extension-amount
  weight: 1
  why: total strain (e.g. ~100% Basin and Range) decides block tilt and core complexes
  want: high
- factor: planet-factor.clim-arid
  weight: 3
  why: arid climate gives closed basins, playas, bajadas; humid gives through-drainage
  want: high
- factor: planet-factor.sed-supply
  weight: 1
  why: basin fill 0.5-3 km buries graben floor, reduces relief
  want: high
- factor: planet-factor.base-level
  weight: 1
  why: internal drainage vs integrated drainage decides basin floor level
  want: high
- factor: planet-factor.time
  weight: 1
  why: 1-20 Myr extension duration
  want: high
