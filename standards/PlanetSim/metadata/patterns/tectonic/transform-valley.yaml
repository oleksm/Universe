identity:
  key: planet-pattern.tectonic.strike-slip.transform-valley
  name: Strike-slip / transform fault valley with offset streams
  about: Strike-slip / transform fault valley with offset streams.
family: tectonic
factors:
- factor: planet-factor.tect-setting
  weight: 3
  why: transform plate boundary or major transcurrent fault
  want: high
- factor: planet-factor.tect-fault
  weight: 3
  why: slip rate (e.g. ~34 mm/yr San Andreas), bends/stepovers make pull-aparts and pressure ridges
  want: high
- factor: planet-factor.rock-fracture
  weight: 3
  why: crushed gouge zone (1-1000 m) eroded preferentially into linear valley
  want: high
- factor: planet-factor.events
  weight: 1
  why: great earthquakes, ~10 m slip per event
  want: high
- factor: planet-factor.tect-uplift
  weight: 1
  why: vertical component (transpression/transtension) sets valley vs ridge
  want: high
- factor: planet-factor.relief-inherited
  weight: 1
  why: ridge-valley grain across fault creates offset streams, shutter ridges
  want: high
- factor: planet-factor.clim-arid
  weight: 1
  why: arid climates preserve offsets
  want: high
- factor: planet-factor.time
  weight: 1
  why: 1 kyr-10 Myr; cumulative offset grows with age
  want: high
