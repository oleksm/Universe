# yaml-language-server: $schema=../../../schema/planet-pattern.schema.yaml
identity:
  key: planet-pattern.tectonic.margin.passive
  name: Passive (rifted) continental margin
  about: Passive (rifted) continental margin.
family: tectonic
factors:
- factor: planet-factor.tect-setting
  weight: 3
  why: post-rift trailing edge, no plate boundary; volcanic vs non-volcanic rifting
  want: low
- factor: planet-factor.tect-uplift
  weight: 3
  why: thermal subsidence decaying with age; rift-flank uplift makes escarpment
  want: high
- factor: planet-factor.sed-supply
  weight: 3
  why: fluvial supply (deltas) or carbonate builds shelf, progrades shelf break
  want: high
- factor: planet-factor.sea-level
  weight: 1
  why: sea-level history sets shelf flooding, coastal plain width
  want: high
- factor: planet-factor.bio-veg
  weight: 1
  why: reefs/carbonate factories build rimmed shelves in warm water
  want: high
- factor: planet-factor.other-salt-tectonics
  weight: 1
  why: rift salt forms diapirs, minibasins on slope (Gulf of Mexico)
  want: high
- factor: planet-factor.clim-precip
  weight: 1
  why: onshore rain drives escarpment retreat and supply
  want: high
- factor: planet-factor.time
  weight: 1
  why: heat flow and subsidence decline with age since breakup (10-200 Myr)
  want: high
vocabulary_id: 171
sources:
- https://en.wikipedia.org/wiki/Passive_margin
- https://esurf.copernicus.org/articles/9/1301/2021/
library_status: planned
source: tectonic.margin.passive
levels:
- planet-level.100-km
- planet-level.10-km
basis:
- of:
  - factors
  - sources
  tier: derived
  note: 'planet-trees-pgs2 docs/landforms/deciding_factors.json: its factors in its words, its top three weighted
    3.'
- of:
  - when
  tier: invented
  review: true
  note: 'No hard conditions yet: planets to add them where a factor is a must (ice, sea, a volcano).'
- of:
  - factors.want
  - look
  tier: invented
  review: true
  source: planet-forge 3c40281 crates/viewer/src/rings/formations.rs factor_scores; crates/viewer/src/layers/features.rs
    arch_of
  note: Draft migration of viewer archetype mapping (including dendritic fallback) and preference-word inference,
    corrected to whole-word tokens and reviewed against supplied why text and existing signal direction. Ambiguous
    categorical, compound or nonmonotonic factors remain review-required; no band bounds invented. Consumers
    use explicit fields, never repeat prose/key inference.
