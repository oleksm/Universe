identity:
  key: planet-pattern.tectonic.fold.anticlinal-ridge
  name: Anticlinal ridge (incl. whaleback anticline)
  about: Anticlinal ridge (incl. whaleback anticline).
family: tectonic
factors:
- factor: planet-factor.tect-fold
  weight: 3
  why: fold growth rate, amplitude, plunge; doubly plunging, wavelength 3.5-7.5 km, length 20-50 km
  want: high
- factor: planet-factor.tect-uplift
  weight: 1
  why: crest uplift must outpace erosion for relief to mirror structure
  want: high
- factor: planet-factor.rock-layers
  weight: 3
  why: resistant carapace (limestone/quartzite 50-500 m) over weak core keeps ridge intact
  want: high
- factor: planet-factor.rock-type
  weight: 1
  why: carapace hardness decides whaleback vs early breaching
  want: in
  unresolved: true
  source: planet-forge 18ef137 docs/research/category-intentions-2026-10-24.json
- factor: planet-factor.rock-fracture
  weight: 1
  why: extension fractures at hinge weaken crest, promote breaching
  want: high
- factor: planet-factor.clim-arid
  weight: 1
  why: arid climate preserves carapace; humid speeds breaching
  want: high
- factor: planet-factor.water-discharge
  weight: 1
  why: antecedent rivers cut water gaps; weak streams diverted around nose (wind gaps)
  want: high
- factor: planet-factor.time
  weight: 3
  why: 0.1-5 Myr; age decides intact ridge vs breached anticline
  want: high
  unresolved: true
  source: planet-forge docs/research/process-geomorphology-2026-10-24.md section 3.2 (unverified order-of-magnitude
    table; not a decay constant)
