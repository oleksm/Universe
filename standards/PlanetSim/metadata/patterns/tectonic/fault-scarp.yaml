# yaml-language-server: $schema=../../../schema/planet-pattern.schema.yaml
identity:
  key: planet-pattern.tectonic.fault.fault-scarp
  name: Fault scarp
  about: Fault scarp.
family: tectonic
factors:
- factor: planet-factor.tect-fault
  weight: 3
  why: fault type and dip set initial face; per-event slip 1-10 m, recurrence builds cumulative height
- factor: planet-factor.events
  weight: 3
  why: surface-rupturing earthquakes (roughly M>6) create and reset free face
- factor: planet-factor.tect-uplift
  weight: 1
  why: slip rate vs degradation rate decides scarp height and steepness
- factor: planet-factor.rock-type
  weight: 1
  why: alluvial scarps diffuse (kappa ~1 m2/kyr); bedrock scarps persist, form facets
- factor: planet-factor.regolith
  weight: 1
  why: loose cohesionless cover degrades to angle of repose then rounds
- factor: planet-factor.clim-arid
  weight: 1
  why: arid preserves scarps longest; free face lasts 0.1-3 kyr
- factor: planet-factor.clim-precip
  weight: 1
  why: wetter climate raises diffusivity, faster rounding
- factor: planet-factor.bio-veg
  weight: 1
  why: vegetation cover slows wash, alters diffusivity
- factor: planet-factor.time
  weight: 3
  why: 'time since rupture sets profile: free face, debris slope, then erf rounding'
vocabulary_id: 121
sources:
- https://WWW.ISPRS.org/proceedings/2011/ISRSE-34/211104015Final00629.pdf
library_status: written
source: tectonic.fault.fault_scarp
levels:
- planet-level.pattern
- planet-level.square
basis:
- of:
  - factors
  - sources
  tier: derived
  note: 'planet-trees-pgs2 docs/landforms/deciding_factors.json: its factors in its words, its top three weighted 3.'
- of:
