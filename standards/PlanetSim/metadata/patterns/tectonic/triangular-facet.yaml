identity:
  key: planet-pattern.tectonic.fault.triangular-facet
  name: Triangular facet (faulted spur end)
  about: Triangular facet (faulted spur end).
family: tectonic
factors:
- factor: planet-factor.tect-fault
  weight: 3
  why: normal fault footwall truncates spurs; facet slope near fault dip when fresh
  want: high
- factor: planet-factor.tect-uplift
  weight: 3
  why: high slip rate (>~0.1 mm/yr) keeps facets steep, tall, multi-tiered
  want: high
- factor: planet-factor.relief-inherited
  weight: 1
  why: range-front catchment spacing sets spur, hence facet, width
  want: high
- factor: planet-factor.rock-type
  weight: 3
  why: resistant bedrock footwall needed; weak rock degrades facets quickly
  want: not-in
  source: planet-forge 18ef137 docs/research/category-intentions-2026-10-24.json
  classes:
  - unconsolidated
  - clastic-fine
  - evaporite
  required: true
- factor: planet-factor.rock-fracture
  weight: 1
  why: jointing controls facet planarity and degradation
  want: high
- factor: planet-factor.clim-precip
  weight: 1
  why: erosion rate relative to slip decides facet slope 20-45 deg
  want: high
- factor: planet-factor.time
  weight: 1
  why: 0.1-3 Myr; facets lower and round with age once slip stops
  want: high
  unresolved: true
  source: planet-forge docs/research/process-geomorphology-2026-10-24.md section 3.2 (unverified order-of-magnitude
    table; not a decay constant)
vocabulary_id: 122
sources:
- https://WWW.ISPRS.org/proceedings/2011/ISRSE-34/211104015Final00629.pdf
library_status: written
source: tectonic.fault.triangular_facet
