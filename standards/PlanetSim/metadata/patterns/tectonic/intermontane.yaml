  key: planet-pattern.tectonic.basin.intermontane
  name: Intermontane valley (alluvial basin fill)
  about: Intermontane valley (alluvial basin fill).
family: tectonic
factors:
- factor: planet-factor.tect-setting
  weight: 3
  why: 'a structural trough between ranges: forearc (California''s Central Valley), foreland, or between thrust
    sheets'
  want: in
  source: planet-forge 18ef137 docs/research/category-intentions-2026-10-24.json
  classes:
  - intermontane-basin
  - foreland-basin
  required: true
- factor: planet-factor.sed-supply
  weight: 3
  why: 'filled by the sediment the ranges shed: alluvial fans at the margins, fine floodplain and lake beds in the
    axis; fill several km thick'
  want: high
- factor: planet-factor.base-level
  weight: 3
  why: '(the library writes HYDRO_BASIN, which its vocabulary lacks: mapped here by the registry, to confirm) an
    axial river gathers the fans'' streams; closed or poorly drained floors hold lakes in wet periods (Tulare, Corcoran)'
  want: high
- factor: planet-factor.clim-arid
  weight: 1
  why: '(the library writes CLIM, which its vocabulary lacks: mapped here by the registry, to confirm) rain shadow
    of the seaward range sets fan size and lake persistence'
  want: high
