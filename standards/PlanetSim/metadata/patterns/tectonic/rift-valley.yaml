identity:
  key: planet-pattern.tectonic.extension.rift-valley
  name: Continental rift valley
  about: Continental rift valley.
family: tectonic
factors:
- factor: planet-factor.tect-setting
  weight: 3
  why: continental rift, often above mantle plume/dome; lithosphere strength sets width 40-75 km
- factor: planet-factor.tect-fault
  weight: 3
  why: ~100 km border-fault segments, throw 2-5 km, polarity flips at accommodation zones
- factor: planet-factor.tect-uplift
  weight: 1
  why: flank uplift 1-2 km (thermal + flexural footwall)
- factor: planet-factor.volc-magma
  weight: 3
  why: 'magmatic vs amagmatic rift: volcanoes, calderas on floor'
- factor: planet-factor.volc-vent
  weight: 1
  why: volcanic centres along axis split basins
- factor: planet-factor.clim-precip
  weight: 1
  why: wet climate fills rift with deep lakes (Tanganyika); dry gives saline lakes
- factor: planet-factor.lake-level
  weight: 1
  why: rift lake level history drives shorelines and fill
- factor: planet-factor.sed-supply
  weight: 1
  why: fill 1-7 km; supply vs subsidence decides underfilled deep lake vs filled plain
- factor: planet-factor.time
  weight: 1
  why: 1-30 Myr; maturity grades to sea-floor spreading
