  want: high
- factor: planet-factor.clim-wind
  weight: 1
  why: windward rain vs rain-shadow plateau asymmetry
  want: high
- factor: planet-factor.ice-extent
  weight: 1
  why: glacial buzzsaw caps peaks near snowline
  want: high
- factor: planet-factor.other-gravitational-collapse
  weight: 1
  why: thick hot crust collapses into extension/plateau
  want: high
- factor: planet-factor.time
  weight: 1
  why: active orogens high, steep; dead orogens decay over 100s Myr
  want: high
