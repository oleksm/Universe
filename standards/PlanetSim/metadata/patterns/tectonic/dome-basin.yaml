# yaml-language-server: $schema=../../../schema/planet-pattern.schema.yaml
identity:
  key: planet-pattern.tectonic.fold.dome-basin
  name: Structural dome / structural basin
  about: Structural dome / structural basin.
family: tectonic
factors:
- factor: planet-factor.tect-uplift
  weight: 3
  why: radial uplift (intrusion, basement uplift, salt) or subsidence; 50-2000 m structural relief
  want: high
- factor: planet-factor.tect-setting
  weight: 1
  why: cratonic platform or foreland; intracratonic basins from slow long-lived subsidence
  want: low
- factor: planet-factor.volc-magma
  weight: 1
  why: magmatic doming (laccolith, alkaline complex) cores some domes (Richat)
  want: high
- factor: planet-factor.rock-layers
  weight: 3
  why: alternating hard/soft cover beds give concentric cuestas/hogbacks
  want: high
- factor: planet-factor.rock-type
  weight: 1
  why: crystalline/intrusive core vs layered cover; core hardness decides peak or central hollow
  want: high
- factor: planet-factor.tect-fold
  weight: 1
  why: dip of flanks decides cuesta (<~10 deg) vs hogback (steep)
  want: high
- factor: planet-factor.clim-arid
  weight: 1
  why: arid climate displays ring ridges most sharply
  want: high
- factor: planet-factor.time
  weight: 3
  why: 1-500 Myr; erosion depth decides breached dome with central depression
  want: high
vocabulary_id: 124
sources:
- https://en.wikipedia.org/wiki/Craton
library_status: written
source: tectonic.fold.dome_basin
levels:
- planet-level.100-km
- planet-level.10-km
basis:
- of:
  - factors
  - sources
  tier: derived
