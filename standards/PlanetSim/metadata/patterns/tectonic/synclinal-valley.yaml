identity:
  key: planet-pattern.tectonic.fold.synclinal-valley
  name: Synclinal valley (and inverted synclinal ridge)
  about: Synclinal valley (and inverted synclinal ridge).
family: tectonic
factors:
- factor: planet-factor.tect-fold
  weight: 3
  why: syncline between growing anticlines; young folding gives valley along axis
  want: high
- factor: planet-factor.rock-layers
  weight: 3
  why: resistant bed preserved in trough after erosion inverts relief into synclinal ridge
  want: high
- factor: planet-factor.rock-type
  weight: 1
  why: weak trough strata keep valley; hard trough caprock gives inverted ridge
  want: in
  source: planet-forge 18ef137 docs/research/category-intentions-2026-10-24.json
  classes:
  - clastic-fine
- factor: planet-factor.tect-uplift
  weight: 1
  why: active fold growth keeps structural relief = topographic relief
  want: high
- factor: planet-factor.water-discharge
  weight: 1
  why: axial subsequent stream drains to water gaps; ponds where outlet blocked (lake)
  want: high
- factor: planet-factor.sed-supply
  weight: 1
  why: 'fill from limbs: alluvium/lake sediment 0-100 m'
  want: high
- factor: planet-factor.time
  weight: 3
  why: 0.1-50 Myr; long erosion inverts valley to ridge (Sideling Hill)
  want: high
  unresolved: true
  source: planet-forge docs/research/process-geomorphology-2026-10-24.md section 3.2 (unverified order-of-magnitude
    table; not a decay constant)
