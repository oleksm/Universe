- factor: planet-factor.tect-uplift
  weight: 3
  why: convergence rate (>7 cm/yr fast) and crustal thickening set elevation
  want: high
- factor: planet-factor.volc-magma
  weight: 3
  why: slab dehydration melting builds arc volcanoes ~100 km above slab
  want: high
- factor: planet-factor.sed-supply
  weight: 1
  why: trench sediment builds accretionary wedge vs erosive margin
  want: high
- factor: planet-factor.other-slab-age
  weight: 1
  why: older denser lithosphere gives deeper trench, steeper slab, back-arc extension
  want: high
- factor: planet-factor.clim-precip
  weight: 1
  why: erosion/rain asymmetry controls wedge width and uplift
  want: high
- factor: planet-factor.events
  weight: 1
  why: megathrust earthquakes, coseismic coastal uplift/subsidence
  want: high
- factor: planet-factor.time
  weight: 1
  why: Myr to 100s of Myr
  want: high
  unresolved: true
