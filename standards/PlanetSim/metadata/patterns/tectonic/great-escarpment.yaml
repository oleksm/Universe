identity:
  key: planet-pattern.tectonic.margin.great-escarpment
  name: Great escarpment (passive margin)
  about: Great escarpment (passive margin).
family: tectonic
factors:
- factor: planet-factor.tect-setting
  weight: 3
  why: rifted passive margin with high interior plateau
  want: high
- factor: planet-factor.tect-uplift
  weight: 1
  why: rift-flank and flexural isostatic uplift from denudation keep scarp high
  want: high
- factor: planet-factor.base-level
  weight: 3
  why: rift-generated low coastal base level drives headward erosion
  want: low
- factor: planet-factor.relief-inherited
  weight: 3
  why: inland drainage divide position pins or allows retreat
  want: high
- factor: planet-factor.rock-type
  weight: 1
  why: flood-basalt cap (up to 2.5 km) or hard shield gives sharp scarp
  want: high
- factor: planet-factor.rock-layers
  weight: 1
  why: flat-lying hard caprock over weaker rock gives steep face
  want: high
- factor: planet-factor.clim-precip
  weight: 1
  why: windward orographic rain speeds retreat; retreat 0.17-2.4 km/Myr
  want: high
- factor: planet-factor.time
  weight: 1
  why: 10-200 Myr since breakup; total retreat <25 km to >100 km
  want: high
