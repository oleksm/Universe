# yaml-language-server: $schema=../../../schema/planet-pattern.schema.yaml
identity:
  key: planet-pattern.tectonic.uplift.plateau
  name: Plateau (tectonic/epeirogenic)
  about: Plateau (tectonic/epeirogenic).
family: tectonic
factors:
- factor: planet-factor.tect-setting
  weight: 3
  why: craton epeirogeny, mantle upwelling, or orogenic crustal thickening (Tibet ~4.5-5 km)
  want: high
- factor: planet-factor.tect-uplift
  weight: 3
  why: broad uplift amount and rate with little internal deformation
  want: high
- factor: planet-factor.volc-magma
  weight: 1
  why: flood basalt stacks build volcanic plateaus
  want: high
- factor: planet-factor.rock-layers
  weight: 3
  why: flat-lying hard cover keeps flat top, makes cliffs and mesas
  want: high
- factor: planet-factor.clim-arid
  weight: 1
  why: arid/internally drained plateaus keep low relief; rain-shadowed by bounding ranges
  want: high
- factor: planet-factor.base-level
  weight: 1
  why: drop of external base level drives canyon incision at edges
  want: high
- factor: planet-factor.water-discharge
  weight: 1
  why: through-flowing rivers dissect into canyons
  want: high
- factor: planet-factor.time
  weight: 1
  why: 1-70 Myr; dissection grows with time since uplift
  want: high
vocabulary_id: 130
sources:
- https://en.wikipedia.org/wiki/Plateau
- https://earthweb.ess.washington.edu/roe/Publications/RoeEtal_ClimateWedge_08.pdf
library_status: written
source: tectonic.uplift.plateau
levels:
- planet-level.100-km
- planet-level.10-km
basis:
- of:
  - factors
  - sources
  tier: derived
  note: 'planet-trees-pgs2 docs/landforms/deciding_factors.json: its factors in its words, its top three weighted
    3.'
- of:
  - when
  tier: invented
  review: true
  note: 'No hard conditions yet: planets to add them where a factor is a must (ice, sea, a volcano).'
- of:
  - factors.want
  - look
  tier: invented
  review: true
  source: planet-forge 3c40281 crates/viewer/src/rings/formations.rs factor_scores; crates/viewer/src/layers/features.rs
    arch_of
  note: Draft migration of viewer archetype mapping (including dendritic fallback) and preference-word inference,
    corrected to whole-word tokens and reviewed against supplied why text and existing signal direction. Ambiguous
    categorical, compound or nonmonotonic factors remain review-required; no band bounds invented. Consumers
    use explicit fields, never repeat prose/key inference.
- of:
  - factors.want
  tier: derived
  review: true
  source: Supplied factor why text and PlanetSim factor signal records; semantic correction 2026-10-22
  note: 'planet-factor.tect-uplift: Broad uplift drives the plateau; little refers to internal deformation.
    planet-factor.rock-layers: Alternating strong/weak beds or caprock require layering contrast; flat/weak
    does not request absence of layering. planet-factor.clim-arid: The why text favors arid conditions; sparse
    vegetation, low rain/relief or weak soil are effects or other quantities.'
status: draft
look: tableland
