identity:
  key: planet-pattern.fluvial.channel.knickpoint-waterfall
  name: Knickpoint / waterfall
  about: Knickpoint / waterfall.
family: fluvial
factors:
- factor: planet-factor.base-level
  weight: 3
  why: base-level fall magnitude sets knickpoint height (Waipaoa 50-100 m)
  want: high
- factor: planet-factor.rock-layers
  weight: 3
  why: caprock over weak rock gives vertical falls and undercut
  want: high
- factor: planet-factor.rock-type
  weight: 1
  why: homogeneous rock gives diffuse knickzones
  want: in
  unresolved: true
  source: planet-forge 18ef137 docs/research/category-intentions-2026-10-24.json
- factor: planet-factor.tect-fault
  weight: 1
  why: fault slip creates knickzones
  want: high
- factor: planet-factor.tect-uplift
  weight: 1
  why: uplift rate change launches transient knickpoints
  want: high
- factor: planet-factor.ice-extent
  weight: 1
  why: glacial overdeepening leaves hanging valleys with falls
  want: high
- factor: planet-factor.water-discharge
  weight: 3
  why: drainage area sets retreat rate (1 mm-10 cm/yr typical)
  want: high
- factor: planet-factor.time
  weight: 1
  why: 0.1 kyr-10 Myr while transient persists
  want: high
  unresolved: true
  source: planet-forge docs/research/process-geomorphology-2026-10-24.md section 3.2 (unverified order-of-magnitude
    table; not a decay constant)
