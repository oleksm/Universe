identity:
  key: planet-pattern.fluvial.network.trellis
  name: Trellis drainage pattern
  about: Trellis drainage pattern.
family: fluvial
factors:
- factor: planet-factor.rock-layers
  weight: 3
  why: alternating hard/soft beds; subsequents follow soft beds, ridges on hard
  want: high
- factor: planet-factor.tect-fold
  weight: 3
  why: tilted or folded strata, strike-parallel outcrop belts; dip sets ridge asymmetry
  want: high
- factor: planet-factor.tect-setting
  weight: 1
  why: fold-thrust belts, eroded orogens (Valley and Ridge)
  want: high
- factor: planet-factor.rock-type
  weight: 1
  why: erodibility contrast sandstone vs shale/limestone sets valley-ridge relief
  want: high
- factor: planet-factor.relief-inherited
  weight: 1
  why: consequent streams on original surface become cross-strike trunks/water gaps
  want: high
- factor: planet-factor.tect-uplift
  weight: 1
  why: renewed uplift/base-level fall deepens strike valleys and drives captures
  want: high
- factor: planet-factor.time
  weight: 3
  why: structural adjustment needs ~1-300 Myr of differential erosion
  want: high
vocabulary_id: 55
sources:
- https://ebooks.inflibnet.ac.in/geop11/chapter/drainage-pattern
- https://en.wikipedia.org/wiki/Drainage_system_(geomorphology)
