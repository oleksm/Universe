identity:
  key: planet-pattern.fluvial.channel.bedrock-long-profile
  name: River longitudinal profile (bedrock)
  about: River longitudinal profile (bedrock).
family: fluvial
factors:
- factor: planet-factor.tect-uplift
  weight: 3
  why: rock uplift rate sets steepness ksn (20-600 m^0.9) at steady state
  want: high
- factor: planet-factor.rock-type
  weight: 3
  why: erodibility sets ksn and knickzones at contacts
  want: in
  unresolved: true
  source: planet-forge 18ef137 docs/research/category-intentions-2026-10-24.json
- factor: planet-factor.rock-fracture
  weight: 1
  why: jointing controls plucking vs abrasion efficiency
  want: high
- factor: planet-factor.water-discharge
  weight: 1
  why: discharge scales with area; concavity theta 0.4-0.6
  want: high
- factor: planet-factor.clim-precip
  weight: 1
  why: runoff sets erosional efficiency
  want: high
- factor: planet-factor.clim-storm
  weight: 1
  why: flood variability and incision thresholds set rate-steepness nonlinearity
  want: high
- factor: planet-factor.sed-supply
  weight: 1
  why: sediment acts as tools vs cover; high supply raises concavity/alluvial reaches
  want: high
- factor: planet-factor.base-level
  weight: 3
  why: base-level falls launch knickpoints; profile grades to outlet
  want: high
- factor: planet-factor.time
  weight: 1
  why: response time 10 kyr-10 Myr to reach steady state
  want: high
  unresolved: true
  source: planet-forge docs/research/process-geomorphology-2026-10-24.md section 3.2 (unverified order-of-magnitude
    table; not a decay constant)
