identity:
  key: planet-pattern.fluvial.valley.floodplain
  name: Floodplain
  about: Floodplain.
family: fluvial
factors:
- factor: planet-factor.sed-supply
  weight: 3
  why: suspended vs bed load sets vertical vs lateral accretion
- factor: planet-factor.water-discharge
  weight: 3
  why: 'specific stream power: <10 W/m2 low, 10-300 medium, 300-1000 high energy'
- factor: planet-factor.clim-storm
  weight: 1
  why: overbank floods every 1-2 yr deposit levees, splays
- factor: planet-factor.slope-relief
  weight: 3
  why: low gradient below bedrock-alluvial transition
- factor: planet-factor.relief-inherited
  weight: 1
  why: valley width confines floodplain width
- factor: planet-factor.bio-veg
  weight: 1
  why: vegetation stabilizes banks, traps fines
- factor: planet-factor.base-level
  weight: 1
  why: rising base level aggrades; fall incises into terraces
- factor: planet-factor.tect-uplift
  weight: 1
  why: subsidence widens and thickens alluvium
- factor: planet-factor.time
  weight: 1
  why: 0.1 kyr-1 Myr
