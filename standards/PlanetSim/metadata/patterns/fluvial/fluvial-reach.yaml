factors:
- factor: planet-factor.sea-level
  weight: 3
  why: Holocene rise (~10-12 ka) drowns incised valley
- factor: planet-factor.relief-inherited
  weight: 3
  why: lowstand incised valley (or glacial trough) sets shape
- factor: planet-factor.waves-tides
  weight: 1
  why: wave vs tide dominance sets barrier vs funnel form, mixing class
- factor: planet-factor.water-discharge
  weight: 1
  why: river discharge vs tidal prism sets salt wedge vs well mixed
- factor: planet-factor.sed-supply
  weight: 3
  why: supply rate sets infill and bay-head delta progradation
- factor: planet-factor.tect-uplift
  weight: 1
  why: tectonic subsidence/faulting can create estuaries
- factor: planet-factor.time
  weight: 1
  why: 1-10 kyr until infilled to delta
