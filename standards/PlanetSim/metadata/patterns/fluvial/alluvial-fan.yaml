# yaml-language-server: $schema=../../../schema/planet-pattern.schema.yaml
identity:
  key: planet-pattern.fluvial.fan.alluvial-fan
  name: Alluvial fan
  about: Alluvial fan.
family: fluvial
factors:
- factor: planet-factor.tect-fault
  weight: 3
  why: active range-front fault keeps relief and accommodation
  want: high
- factor: planet-factor.tect-uplift
  weight: 1
  why: range uplift vs basin subsidence; slow uplift causes fan-head trenching
  want: high
- factor: planet-factor.slope-relief
  weight: 3
  why: steep catchment debouches onto low gradient; fan slope 1.5-25 deg
  want: low
- factor: planet-factor.rock-type
  weight: 1
  why: mudstone basins give larger steeper fans (Af=2.4Ad^0.88 vs 1.3 sandstone)
  want: high
- factor: planet-factor.sed-supply
  weight: 3
  why: abundant weathered debris; fine regolith favours debris-flow fans
  want: high
- factor: planet-factor.clim-arid
  weight: 1
  why: arid/semi-arid sparse cover favours fans and debris flows
  want: high
- factor: planet-factor.clim-storm
  weight: 1
  why: flash floods and debris flows build lobes, avulse channels
  want: high
- factor: planet-factor.base-level
  weight: 1
  why: axial river erosion trims toe, entrenches fan
  want: high
- factor: planet-factor.clim-history
  weight: 1
  why: wetter/glacial phases shift aggradation/incision
  want: high
- factor: planet-factor.ice-extent
  weight: 1
  why: paraglacial sediment supply builds fans
  want: high
- factor: planet-factor.time
  weight: 1
  why: 1 kyr-2 Myr
  want: high
vocabulary_id: 47
sources:
