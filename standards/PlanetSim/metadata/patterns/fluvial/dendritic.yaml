identity:
  key: planet-pattern.fluvial.network.dendritic
  name: Dendritic drainage pattern
  about: Dendritic drainage pattern.
family: fluvial
factors:
- factor: planet-factor.rock-type
  weight: 3
  why: homogeneous resistance (flat sediments, massive crystalline, fill) required
  want: in
  unresolved: true
  source: planet-forge 18ef137 docs/research/category-intentions-2026-10-24.json
- factor: planet-factor.rock-fracture
  weight: 1
  why: absence of strong joint/fault fabric; otherwise rectangular/angular
  want: high
- factor: planet-factor.tect-fold
  weight: 3
  why: flat-lying or gently dipping strata; folding yields trellis
  want: low
- factor: planet-factor.slope-relief
  weight: 1
  why: gentle uniform regional slope; steep uniform slope gives parallel
  want: low
- factor: planet-factor.clim-arid
  weight: 3
  why: junction angle ~45 deg in arid, ~72 deg in humid landscapes
  want: high
- factor: planet-factor.groundwater
  weight: 1
  why: groundwater-fed channel growth widens junction angles in humid areas
  want: high
- factor: planet-factor.time
  weight: 1
  why: headward growth and branching over 1 kyr to 100 Myr
  want: high
  unresolved: true
  source: planet-forge docs/research/process-geomorphology-2026-10-24.md section 3.2 (unverified order-of-magnitude
    table; not a decay constant)
vocabulary_id: 50
sources:
- https://ebooks.inflibnet.ac.in/geop11/chapter/drainage-pattern
- https://en.wikipedia.org/wiki/Drainage_system_(geomorphology)
- https://eos.org/research-spotlights/stream-network-geometry-correlates-with-climate
library_status: written
source: fluvial.network.dendritic
levels:
