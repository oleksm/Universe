identity:
  key: planet-pattern.fluvial.valley.v-shaped
  name: V-shaped (fluvial) valley
  about: V-shaped (fluvial) valley.
family: fluvial
factors:
- factor: planet-factor.tect-uplift
  weight: 3
  why: active uplift with incision faster than widening (Indus 2-12 mm/yr)
  want: high
- factor: planet-factor.base-level
  weight: 1
  why: falling base level keeps channel incising
  want: high
- factor: planet-factor.rock-type
  weight: 3
  why: rock strength caps side slopes; threshold hillslopes 30-35 deg
  want: in
  unresolved: true
  source: planet-forge 18ef137 docs/research/category-intentions-2026-10-24.json
- factor: planet-factor.rock-fracture
  weight: 1
  why: fracturing lowers threshold slope, landslide-dominated walls
  want: high
- factor: planet-factor.ice-extent
  weight: 3
  why: must be unglaciated; glaciation converts to U-shape
  want: high
- factor: planet-factor.clim-precip
  weight: 1
  why: runoff drives incision; humid climates favour V gorges
  want: high
- factor: planet-factor.events
  weight: 1
  why: landslides set wall slopes at threshold
  want: high
- factor: planet-factor.slope-relief
  weight: 1
  why: high local relief; depth grows with uplift
  want: high
- factor: planet-factor.time
  weight: 1
  why: 10 kyr-10 Myr
  want: high
  unresolved: true
  source: planet-forge docs/research/process-geomorphology-2026-10-24.md section 3.2 (unverified order-of-magnitude
    table; not a decay constant)
