identity:
  key: planet-pattern.fluvial.channel.braided
  name: Braided river
  about: Braided river.
family: fluvial
factors:
- factor: planet-factor.sed-supply
  weight: 3
  why: abundant coarse bedload; flume braids at >3110 ppm bedload
  want: high
- factor: planet-factor.slope-relief
  weight: 3
  why: slope above threshold S=0.06 Q^-0.44 (flume S>=0.016)
  want: high
- factor: planet-factor.water-discharge
  weight: 1
  why: flashy, variable discharge reworks bars
  want: high
- factor: planet-factor.bio-veg
  weight: 3
  why: sparse bank vegetation; vegetation turns bars into islands
  want: in
  source: planet-forge 18ef137 docs/research/category-intentions-2026-10-24.json
  classes:
  - barren
  - sparse
  - tundra
- factor: planet-factor.regolith
  weight: 1
  why: non-cohesive gravel banks give wide shallow channels
  want: high
- factor: planet-factor.ice-extent
  weight: 1
  why: proglacial outwash supplies sediment and meltwater
  want: high
- factor: planet-factor.clim-season
  weight: 1
  why: snowmelt/monsoon peaks drive braiding
  want: high
- factor: planet-factor.time
  weight: 1
  why: 10 yr-1 Myr
  want: high
  unresolved: true
  source: planet-forge docs/research/process-geomorphology-2026-10-24.md section 3.2 (unverified order-of-magnitude
    table; not a decay constant)
