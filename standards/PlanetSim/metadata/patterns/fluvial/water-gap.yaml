- factor: planet-factor.rock-layers
  weight: 3
  why: resistant bed between weak beds forms the cut ridge
- factor: planet-factor.rock-fracture
  weight: 1
  why: gaps often sited on faults/fracture zones
- factor: planet-factor.tect-fold
  weight: 1
  why: fold-thrust ridges (Valley and Ridge)
- factor: planet-factor.other-stream-capture
  weight: 1
  why: headward erosion from both sides can breach ridge
- factor: planet-factor.time
  weight: 1
  why: Myr of incision
