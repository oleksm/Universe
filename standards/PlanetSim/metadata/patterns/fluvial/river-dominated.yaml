  - passive-margin
- factor: planet-factor.slope-relief
  weight: 1
  why: shallow receiving basin; deep water gives birdfoot
  want: high
- factor: planet-factor.tect-uplift
  weight: 1
  why: subsidence of mud load sets lobe abandonment
  want: high
- factor: planet-factor.sea-level
  weight: 1
  why: stable post-glacial sea level allows progradation
  want: low
- factor: planet-factor.events
  weight: 1
  why: avulsions switch lobes (~1 kyr)
  want: high
- factor: planet-factor.bio-veg
  weight: 1
  why: marsh vegetation stabilizes levees
  want: in
  source: planet-forge 18ef137 docs/research/category-intentions-2026-10-24.json
