  name: River-dominated (birdfoot / lobate) delta
  about: River-dominated (birdfoot / lobate) delta.
family: fluvial
factors:
- factor: planet-factor.sed-supply
  weight: 3
  why: high fine suspended supply exceeds marine reworking
- factor: planet-factor.waves-tides
  weight: 3
  why: low wave energy and small tidal range
- factor: planet-factor.water-discharge
  weight: 3
  why: large discharge builds levee-bound distributaries
- factor: planet-factor.tect-setting
  weight: 1
  why: passive margin, broad shelf
- factor: planet-factor.slope-relief
  weight: 1
  why: shallow receiving basin; deep water gives birdfoot
- factor: planet-factor.tect-uplift
  weight: 1
  why: subsidence of mud load sets lobe abandonment
- factor: planet-factor.sea-level
  weight: 1
  why: stable post-glacial sea level allows progradation
- factor: planet-factor.events
  weight: 1
  why: avulsions switch lobes (~1 kyr)
- factor: planet-factor.bio-veg
  weight: 1
  why: marsh vegetation stabilizes levees
- factor: planet-factor.time
  weight: 1
  why: 1-10 kyr per delta complex
