- factor: planet-factor.permafrost
  weight: 1
  why: Permafrost in talus can turn it into rock glaciers
- factor: planet-factor.events
  weight: 1
  why: Avalanches and debris flows rework the slope
- factor: planet-factor.time
  weight: 1
  why: 1-15 kyr since deglaciation
