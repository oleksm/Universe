# yaml-language-server: $schema=../../../schema/planet-pattern.schema.yaml
identity:
  key: planet-pattern.periglacial.lake.thermokarst
  name: Thermokarst lakes and alases
  about: Thermokarst lakes and alases.
family: periglacial
factors:
- factor: planet-factor.permafrost
  weight: 3
  why: Ice-rich permafrost, ground ice >30 vol% (yedoma, marine silt)
  want: high
- factor: planet-factor.clim-temp
  weight: 3
  why: Warming or bottom water >0 C keeps a talik and continuous thaw
  want: low
- factor: planet-factor.bio-veg
  weight: 3
  why: Surface disturbance (fire, vegetation loss) starts thaw
  want: high
- factor: planet-factor.clim-wind
  weight: 1
  why: Prevailing winds orient and elongate lakes
  want: high
- factor: planet-factor.slope-relief
  weight: 1
  why: Flat coastal plains and lowlands
  want: low
- factor: planet-factor.base-level
  weight: 1
  why: Drainage by stream capture or coastal erosion leaves drained basins
  want: high
- factor: planet-factor.events
  weight: 1
  why: Fires and drainage events reset the cycle
  want: high
- factor: planet-factor.time
  weight: 1
  why: Cyclic form-expand-drain, 0.1-12 kyr
  want: high
vocabulary_id: 107
sources:
- https://en.wikipedia.org/wiki/Thermokarst
- https://www.antarcticglaciers.org/glacial-geology/glacial-landforms/periglaciation/periglacial-landforms/
library_status: written
source: periglacial.lake.thermokarst
levels:
- planet-level.100-km
- planet-level.10-km
basis:
- of:
  - factors
  - sources
  tier: derived
  note: 'planet-trees-pgs2 docs/landforms/deciding_factors.json: its factors in its words, its top three weighted
    3.'
- of:
  - when
  tier: invented
  review: true
  note: 'No hard conditions yet: planets to add them where a factor is a must (ice, sea, a volcano).'
- of:
  - factors.want
  - look
  tier: invented
  review: true
  source: planet-forge 3c40281 crates/viewer/src/rings/formations.rs factor_scores; crates/viewer/src/layers/features.rs
    arch_of
  note: Draft migration of viewer archetype mapping (including dendritic fallback) and preference-word inference,
    corrected to whole-word tokens and reviewed against supplied why text and existing signal direction. Ambiguous
    categorical, compound or nonmonotonic factors remain review-required; no band bounds invented. Consumers
    use explicit fields, never repeat prose/key inference.
- of:
  - factors.want
  tier: derived
  review: true
  source: Supplied factor why text and PlanetSim factor signal records; semantic correction 2026-10-22
  note: 'planet-factor.clim-temp: The why text calls for ablation or warming/thaw; low cold-strength represents
    warmer conditions.'
status: draft
look: periglacial
