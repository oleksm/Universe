# yaml-language-server: $schema=../../../schema/planet-pattern.schema.yaml
identity:
  key: planet-pattern.periglacial.creep.rock-glacier
  name: Rock glacier
  about: Rock glacier.
family: periglacial
factors:
- factor: planet-factor.permafrost
  weight: 3
  why: Mountain permafrost essential; ice-supersaturated debris ~40-60 vol% ice
  want: high
- factor: planet-factor.clim-temp
  weight: 3
  why: MAAT about -1 to -2 C at front or colder; occurs -8 to +8 C locally
  want: high
- factor: planet-factor.clim-precip
  weight: 1
  why: Continental, low precipitation favoured (too dry for glaciers)
  want: low
- factor: planet-factor.sed-supply
  weight: 3
  why: Abundant coarse talus from jointed walls; ~83% talus-derived
  want: high
- factor: planet-factor.rock-fracture
  weight: 1
  why: Jointed walls yield blocks up to 8 m
  want: high
- factor: planet-factor.ice-extent
  weight: 1
  why: Glacier-origin type from debris-covered retreating glacier; glacier-steepened valleys
  want: high
- factor: planet-factor.slope-relief
  weight: 1
  why: Below cirque headwalls and talus; moderate slope for creep
  want: high
- factor: planet-factor.aspect
  weight: 1
  why: Shaded aspects favour permafrost
  want: high
- factor: planet-factor.time
  weight: 1
  why: 1-10 kyr; flows <2 m/yr, up to ~3 km long
  want: high
  unresolved: true
  source: planet-forge docs/research/process-geomorphology-2026-10-24.md section 3.2 (unverified order-of-magnitude
    table; not a decay constant)
vocabulary_id: 104
sources:
- https://en.wikipedia.org/wiki/Rock_glacier
- https://research.fs.usda.gov/treesearch/44709
library_status: written
source: periglacial.creep.rock_glacier
levels:
- planet-level.100-km
- planet-level.10-km
basis:
- of:
  - factors
  - sources
  tier: derived
  note: 'planet-trees-pgs2 docs/landforms/deciding_factors.json: its factors in its words, its top three weighted
    3.'
- of:
  - when
  tier: invented
  review: true
  note: 'No hard conditions yet: planets to add them where a factor is a must (ice, sea, a volcano).'
- of:
  - factors.want
  - look
  tier: invented
  review: true
  source: planet-forge 3c40281 crates/viewer/src/rings/formations.rs factor_scores; crates/viewer/src/layers/features.rs
    arch_of
  note: Draft migration of viewer archetype mapping (including dendritic fallback) and preference-word inference,
    corrected to whole-word tokens and reviewed against supplied why text and existing signal direction. Ambiguous
    categorical, compound or nonmonotonic factors remain review-required; no band bounds invented. Consumers use
    explicit fields, never repeat prose/key inference.
status: draft
look: periglacial
kinds:
- rock-glacier
