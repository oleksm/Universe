  weight: 3
  why: Slopes roughly 5-20 deg
- factor: planet-factor.bio-veg
  weight: 1
  why: Turf-banked vs stone-banked lobes; vegetation stabilises fronts
- factor: planet-factor.time
  weight: 1
  why: cm/yr; lobes develop over 0.1-10 kyr
