identity:
  key: planet-pattern.hillslope.fan.debris-flow
  name: Debris-flow fan / cone
  about: Debris-flow fan / cone.
family: hillslope
factors:
- factor: planet-factor.slope-relief
  weight: 3
  why: Small steep basins, Melton ratio >0.6 gives debris flow; 0.3-0.6 debris flood; channel >25 deg
  want: high
- factor: planet-factor.sed-supply
  weight: 3
  why: Abundant loose debris (fractured rock, till, volcaniclastics) needed in source basin
  want: high
- factor: planet-factor.clim-storm
  weight: 3
  why: Intense rainfall bursts or rapid snowmelt mobilise saturated debris
  want: high
- factor: planet-factor.bio-veg
  weight: 1
  why: Wildfire removing cover sharply raises debris-flow frequency
  want: in
  unresolved: true
  source: planet-forge 18ef137 docs/research/category-intentions-2026-10-24.json
- factor: planet-factor.ice-extent
  weight: 1
  why: 'Paraglacial: recently deglaciated valleys supply till; glacial outbursts trigger flows'
  want: high
- factor: planet-factor.volc-vent
  weight: 1
  why: Volcanoes supply lahars onto cones
  want: high
- factor: planet-factor.events
  weight: 1
  why: Earthquakes, landslides and outbursts trigger flows
  want: high
- factor: planet-factor.base-level
  weight: 1
  why: Trunk river trims fan toe; sets fan extent
  want: high
- factor: planet-factor.time
  weight: 1
  why: Fans build 0.1-15 kyr; slope 4-15 deg
  want: high
  unresolved: true
  source: planet-forge docs/research/process-geomorphology-2026-10-24.md section 3.2 (unverified order-of-magnitude
    table; not a decay constant)
vocabulary_id: 86
sources:
- https://en.wikipedia.org/wiki/Debris_flow
