identity:
  key: planet-pattern.hillslope.landslide.translational
  name: Translational slide (planar / soil slip / rockslide)
  about: Translational slide (planar / soil slip / rockslide).
family: hillslope
factors:
- factor: planet-factor.tect-fold
  weight: 3
  why: Bedding dipping out of slope (dip slope) gives sliding planes; dip near slope angle
  want: high
- factor: planet-factor.rock-fracture
  weight: 3
  why: Joints, foliation, sheared zones define planar failure surfaces
  want: high
- factor: planet-factor.regolith
  weight: 1
  why: Thin soil on bedrock fails at the soil-rock contact
  want: high
- factor: planet-factor.slope-relief
  weight: 1
  why: Threshold slopes ~30-45 deg; depth/length < 0.1
  want: high
- factor: planet-factor.clim-storm
  weight: 3
  why: Intense rain or snowmelt raises pore pressure; triggers shallow slips
  want: high
- factor: planet-factor.groundwater
  weight: 1
  why: Perched water at the contact lowers effective stress
  want: high
- factor: planet-factor.events
  weight: 1
  why: Earthquakes trigger rockslides in active ranges
  want: high
- factor: planet-factor.tect-uplift
  weight: 1
  why: Fast uplift keeps slopes at threshold, raising slide frequency
  want: high
- factor: planet-factor.bio-veg
  weight: 1
  why: Root loss (fire, logging) raises shallow-slip frequency
  want: in
  unresolved: true
  source: planet-forge 18ef137 docs/research/category-intentions-2026-10-24.json
