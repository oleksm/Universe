# yaml-language-server: $schema=../../../schema/planet-pattern.schema.yaml
identity:
  key: planet-pattern.hillslope.flatiron
  name: Flatiron (triangular dip-slope facet)
  about: Flatiron (triangular dip-slope facet).
family: hillslope
factors:
- factor: planet-factor.tect-fold
  weight: 3
  why: Steep dip of strata (roughly >30-40 deg), e.g. range-flank monocline
- factor: planet-factor.rock-layers
  weight: 3
  why: Resistant bed (sandstone, conglomerate) over weak shale; strong contrast needed
- factor: planet-factor.rock-type
  weight: 1
  why: Cap bed must resist weathering; underlying shale erodes faster
- factor: planet-factor.water-discharge
  weight: 3
  why: Regularly spaced cross-strike streams cut hogback into a row of triangles
- factor: planet-factor.tect-uplift
  weight: 1
  why: Uplift of range exposes and tilts beds, sets incision
- factor: planet-factor.slope-relief
  weight: 1
  why: Sits on mountain flank; facet steeper than flank
- factor: planet-factor.clim-arid
  weight: 1
  why: Semi-arid climates preserve bare facets
- factor: planet-factor.time
  weight: 1
  why: Facets degrade as streams lower base; age of exposure sets height
vocabulary_id: 160
sources:
- https://en.wikipedia.org/wiki/Flatiron_(geomorphology)
- https://en.wikipedia.org/wiki/Hogback_(geology)
library_status: planned
source: hillslope.flatiron
levels:
- planet-level.pattern
- planet-level.square
basis:
- of:
  - factors
  - sources
  tier: derived
  note: 'planet-trees-pgs2 docs/landforms/deciding_factors.json: its factors in its words, its top three weighted 3.'
- of:
  - when
  tier: invented
  review: true
  note: 'No hard conditions yet: planets to add them where a factor is a must (ice, sea, a volcano).'
status: draft
