identity:
  key: planet-pattern.hillslope.ridge.interfluve
  name: Interfluve / ridge crest
  about: Interfluve / ridge crest.
family: hillslope
factors:
- factor: planet-factor.tect-uplift
  weight: 3
  why: 'Uplift/incision rate vs creep sets ridge sharpness: sharp under fast incision, rounded when slow'
  want: high
- factor: planet-factor.clim-precip
  weight: 3
  why: Sets fluvial incision vs soil diffusion ratio, hence ridge-valley spacing (~30-320 m)
  want: high
- factor: planet-factor.regolith
  weight: 3
  why: Soil-mantled crests round by creep; bare rock crests stay sharp
  want: high
- factor: planet-factor.rock-type
  weight: 1
  why: Resistant rock holds narrow crests; weak rock gives broad low interfluves
  want: in
  unresolved: true
  source: planet-forge 18ef137 docs/research/category-intentions-2026-10-24.json
- factor: planet-factor.rock-fracture
  weight: 1
  why: Joint and structural trends orient ridges and set spacing in places
  want: high
- factor: planet-factor.relief-inherited
  weight: 1
  why: Initial surface and drainage network decide divide positions
  want: high
- factor: planet-factor.bio-veg
  weight: 1
  why: Bioturbation sets diffusivity, rounding crests
  want: in
  unresolved: true
  source: planet-forge 18ef137 docs/research/category-intentions-2026-10-24.json
- factor: planet-factor.time
  weight: 1
  why: 10 kyr-10 Myr; divides migrate toward the slower-eroding side over time
  want: high
  unresolved: true
  source: planet-forge docs/research/process-geomorphology-2026-10-24.md section 3.2 (unverified order-of-magnitude
    table; not a decay constant)
