# yaml-language-server: $schema=../../../schema/planet-pattern.schema.yaml
identity:
  key: planet-pattern.hillslope.profile.soil-mantled
  name: Soil-mantled hillslope (convex-concave profile)
  about: Soil-mantled hillslope (convex-concave profile).
family: hillslope
factors:
- factor: planet-factor.tect-uplift
  weight: 3
  why: Low-moderate uplift/erosion keeps soil; high rates push slopes to threshold Sc ~1.2 m/m, planar profiles
  want: low
- factor: planet-factor.rock-type
  weight: 1
  why: Rock must weather to soil faster than erosion strips it; soil production falls exponentially with depth
  want: high
- factor: planet-factor.regolith
  weight: 3
  why: Continuous mobile soil 0.3-1.5 m over saprolite needed; thickness sets creep flux and profile
  want: high
- factor: planet-factor.clim-precip
  weight: 1
  why: Humid to semi-arid; moisture drives weathering, creep diffusivity D and footslope wash
  want: high
- factor: planet-factor.clim-temp
  weight: 1
  why: Frost heave adds to creep in cold climates; raises diffusivity
  want: high
- factor: planet-factor.bio-veg
  weight: 3
  why: Bioturbation (roots, burrowers, tree throw) is main transport; cover limits wash, keeps convex form
  want: high
- factor: planet-factor.slope-relief
  weight: 1
  why: Hilltop curvature records erosion rate; hillslope length ~90-120 m set by channel spacing
  want: high
- factor: planet-factor.base-level
  weight: 1
  why: Channel incision rate at slope foot sets gradient and curvature
  want: high
- factor: planet-factor.time
  weight: 1
  why: 10-1000 kyr to reach steady convex form after base-level change
  want: high
vocabulary_id: 90
sources:
