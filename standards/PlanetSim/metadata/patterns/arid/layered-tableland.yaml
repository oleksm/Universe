identity:
  key: planet-pattern.arid.plateau.layered-tableland
  name: Layered tableland (arid dissected plateau of flat strata)
  about: Layered tableland (arid dissected plateau of flat strata).
family: arid
factors:
- factor: planet-factor.rock-layers
  weight: 3
  why: 'Flat alternating strong/weak strata: cliff-and-bench stairs'
  want: high
- factor: planet-factor.tect-fold
  weight: 1
  why: Near-horizontal beds
  want: high
- factor: planet-factor.tect-uplift
  weight: 3
  why: Epeirogenic plateau uplift (Colorado Plateau) drives canyon incision
  want: high
- factor: planet-factor.tect-setting
  weight: 1
  why: Stable block beside orogens or rifts
  want: low
- factor: planet-factor.base-level
  weight: 3
  why: Trunk-river incision sets canyon depth
  want: high
- factor: planet-factor.clim-arid
  weight: 1
  why: 'Arid: sharp cliffs, little soil'
  want: high
- factor: planet-factor.rock-fracture
  weight: 1
  why: Joints guide canyons, fins, scarp outlines
  want: high
- factor: planet-factor.water-discharge
  weight: 1
  why: Exotic rivers from wetter highlands cut through
  want: high
- factor: planet-factor.time
  weight: 1
  why: Myr
  want: high
vocabulary_id: 149
sources:
- https://en.wikipedia.org/wiki/Mesa
- https://en.wikipedia.org/wiki/Monument_Valley
- https://www.nps.gov/subjects/geology/arid-landforms.htm
library_status: planned
source: arid.plateau.layered_tableland
levels:
- planet-level.100-km
- planet-level.10-km
basis:
- of:
  - factors
  - sources
  tier: derived
  note: 'planet-trees-pgs2 docs/landforms/deciding_factors.json: its factors in its words, its top three weighted
    3.'
- of:
  - when
  tier: invented
  review: true
  note: 'No hard conditions yet: planets to add them where a factor is a must (ice, sea, a volcano).'
- of:
  - factors.want
  - look
  tier: invented
  review: true
  source: planet-forge 3c40281 crates/viewer/src/rings/formations.rs factor_scores; crates/viewer/src/layers/features.rs
    arch_of
  note: Draft migration of viewer archetype mapping (including dendritic fallback) and preference-word inference,
    corrected to whole-word tokens and reviewed against supplied why text and existing signal direction. Ambiguous
    categorical, compound or nonmonotonic factors remain review-required; no band bounds invented. Consumers
    use explicit fields, never repeat prose/key inference.
- of:
  - factors.want
  tier: derived
  review: true
  source: Supplied factor why text and PlanetSim factor signal records; semantic correction 2026-10-22
  note: 'planet-factor.rock-layers: Alternating strong/weak beds or caprock require layering contrast; flat/weak
    does not request absence of layering. planet-factor.clim-arid: The why text favors arid conditions; sparse
    vegetation, low rain/relief or weak soil are effects or other quantities.'
status: draft
look: tableland
