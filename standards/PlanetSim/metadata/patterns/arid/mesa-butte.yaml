# yaml-language-server: $schema=../../../schema/planet-pattern.schema.yaml
identity:
  key: planet-pattern.arid.plateau.mesa-butte
  name: Mesa-and-butte desert (layered plateau remnants)
  about: Mesa-and-butte desert (layered plateau remnants).
family: arid
factors:
- factor: planet-factor.rock-layers
  weight: 3
  why: Resistant caprock (sandstone, conglomerate) over weak shale/siltstone (De Chelly over Organ Rock)
  want: high
- factor: planet-factor.tect-fold
  weight: 1
  why: Near-horizontal strata (dip < ~5 deg); steeper dips give cuestas
  want: high
- factor: planet-factor.tect-uplift
  weight: 3
  why: Plateau uplift drives river incision and dissection
  want: high
- factor: planet-factor.rock-fracture
  weight: 1
  why: Joints in caprock localise retreat and set butte/spire outlines
  want: high
- factor: planet-factor.clim-arid
  weight: 3
  why: 'Arid to semi-arid: sparse vegetation keeps free faces sharp'
  want: high
- factor: planet-factor.groundwater
  weight: 1
  why: Basal sapping at caprock/shale contact undermines cliffs
  want: high
- factor: planet-factor.clim-storm
  weight: 1
  why: Flash floods remove talus from weak slopes
  want: high
- factor: planet-factor.base-level
  weight: 1
  why: River incision sets valley-floor height and remnant relief (up to ~300 m)
  want: high
- factor: planet-factor.time
  weight: 1
  why: '1-30 Myr of scarp retreat: plateau, mesa, butte, spire'
  want: high
vocabulary_id: 12
sources:
- https://en.wikipedia.org/wiki/Mesa
- https://en.wikipedia.org/wiki/Monument_Valley
- https://www.nps.gov/subjects/geology/arid-landforms.htm
library_status: written
source: arid.plateau.mesa_butte
levels:
- planet-level.100-km
- planet-level.10-km
basis:
- of:
  - factors
  - sources
  tier: derived
  note: 'planet-trees-pgs2 docs/landforms/deciding_factors.json: its factors in its words, its top three weighted
    3.'
- of:
  - when
  tier: invented
  review: true
  note: 'No hard conditions yet: planets to add them where a factor is a must (ice, sea, a volcano).'
- of:
  - factors.want
  - look
  tier: invented
  review: true
  source: planet-forge 3c40281 crates/viewer/src/rings/formations.rs factor_scores; crates/viewer/src/layers/features.rs
    arch_of
  note: Draft migration of viewer archetype mapping (including dendritic fallback) and preference-word inference,
    corrected to whole-word tokens and reviewed against supplied why text and existing signal direction. Ambiguous
    categorical, compound or nonmonotonic factors remain review-required; no band bounds invented. Consumers
    use explicit fields, never repeat prose/key inference.
- of:
  - factors.want
  tier: derived
  review: true
  source: Supplied factor why text and PlanetSim factor signal records; semantic correction 2026-10-22
  note: 'planet-factor.rock-layers: Alternating strong/weak beds or caprock require layering contrast; flat/weak
    does not request absence of layering. planet-factor.clim-arid: The why text favors arid conditions; sparse
    vegetation, low rain/relief or weak soil are effects or other quantities. planet-factor.clim-storm: Flash
    floods remove talus; weak describes the slopes.'
status: draft
look: tableland
