# yaml-language-server: $schema=../../../schema/planet-pattern.schema.yaml
identity:
  key: planet-pattern.arid.landscape.desert-margin
  name: Desert margin (semi-arid transition zone)
  about: Desert margin (semi-arid transition zone).
family: arid
factors:
- factor: planet-factor.clim-precip
  weight: 3
  why: Semi-arid ~250-500 mm/yr between desert (<250) and subhumid
  want: high
- factor: planet-factor.clim-arid
  weight: 1
  why: Aridity index ~0.2-0.5; evaporation and temperature move the line
  want: high
- factor: planet-factor.clim-history
  weight: 3
  why: Wetter/drier phases shifted margins; stabilised fossil dunes and relict channels
  want: high
- factor: planet-factor.bio-veg
  weight: 3
  why: Grass/shrub cover (steppe) stabilises dunes and slows runoff; cover threshold controls erosion
  want: high
- factor: planet-factor.clim-season
  weight: 1
  why: Seasonal rainfall (monsoon edge) controls vegetation cycle
  want: high
- factor: planet-factor.clim-storm
  weight: 1
  why: Intense storms on partial cover give peak erosion rates
  want: high
- factor: planet-factor.clim-wind
  weight: 1
  why: Wind remobilises sand when cover drops
  want: high
- factor: planet-factor.regolith
  weight: 1
  why: Loess, calcrete and soil development
  want: high
- factor: planet-factor.time
  weight: 1
  why: Responds in kyr to climate shifts
  want: high
vocabulary_id: 147
sources:
- https://en.wikipedia.org/wiki/Desert
- https://www.nps.gov/subjects/geology/arid-landforms.htm
library_status: planned
source: arid.landscape.desert_margin
levels:
- planet-level.100-km
- planet-level.10-km
basis:
- of:
  - factors
  - sources
  tier: derived
  note: 'planet-trees-pgs2 docs/landforms/deciding_factors.json: its factors in its words, its top three weighted
    3.'
- of:
  - when
  tier: invented
  review: true
  note: 'No hard conditions yet: planets to add them where a factor is a must (ice, sea, a volcano).'
- of:
  - factors.want
  - look
  tier: invented
  review: true
  source: planet-forge 3c40281 crates/viewer/src/rings/formations.rs factor_scores; crates/viewer/src/layers/features.rs
    arch_of
  note: Draft migration of viewer archetype mapping (including dendritic fallback) and preference-word inference,
    corrected to whole-word tokens and reviewed against supplied why text and existing signal direction. Ambiguous
    categorical, compound or nonmonotonic factors remain review-required; no band bounds invented. Consumers
    use explicit fields, never repeat prose/key inference.
status: draft
look: tableland
