# yaml-language-server: $schema=../../../schema/planet-pattern.schema.yaml
identity:
  key: planet-pattern.arid.channel.wadi
  name: Wadi (arroyo, ephemeral desert valley)
  about: Wadi (arroyo, ephemeral desert valley).
family: arid
factors:
- factor: planet-factor.clim-arid
  weight: 1
  why: Arid; channel dry most of year
  want: high
- factor: planet-factor.clim-storm
  weight: 3
  why: Rare flash floods carry most work; few flow days per year
  want: high
- factor: planet-factor.clim-history
  weight: 3
  why: Large wadi systems inherited from wetter (pluvial) phases
  want: high
- factor: planet-factor.rock-perm
  weight: 3
  why: Porous bed causes transmission losses; flows shrink downstream and deposit
  want: high
- factor: planet-factor.rock-type
  weight: 1
  why: Strong rock gives box canyons; weak rock gives wide shallow wadis
  want: in
  unresolved: true
  source: planet-forge 18ef137 docs/research/category-intentions-2026-10-24.json
- factor: planet-factor.sed-supply
  weight: 1
  why: Abundant coarse sediment gives flat braided gravel/sand floors
  want: high
- factor: planet-factor.base-level
  weight: 1
  why: Ends in playa, sabkha or sand sea (endorheic) or the sea
  want: high
- factor: planet-factor.clim-wind
  weight: 1
  why: Dunes block and disrupt networks
  want: high
- factor: planet-factor.bio-veg
  weight: 1
  why: Sparse cover gives flashy runoff; arroyo cut-and-fill tied to vegetation change
  want: in
  source: planet-forge 18ef137 docs/research/category-intentions-2026-10-24.json
  classes:
  - barren
  - sparse
- factor: planet-factor.time
  weight: 1
  why: 10 kyr-10 Myr
  want: high
  unresolved: true
  source: planet-forge docs/research/process-geomorphology-2026-10-24.md section 3.2 (unverified order-of-magnitude
    table; not a decay constant)
vocabulary_id: 11
sources:
- https://en.wikipedia.org/wiki/Wadi
- https://www.nps.gov/subjects/geology/arid-landforms.htm
library_status: written
source: arid.channel.wadi
