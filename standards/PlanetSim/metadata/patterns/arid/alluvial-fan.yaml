# yaml-language-server: $schema=../../../schema/planet-pattern.schema.yaml
identity:
  key: planet-pattern.arid.slope.alluvial-fan
  name: Alluvial fan / bajada (arid)
  about: Alluvial fan / bajada (arid).
family: arid
factors:
- factor: planet-factor.tect-fault
  weight: 3
  why: Active range-front normal faults create relief and accommodation at the apex
  want: high
- factor: planet-factor.tect-uplift
  weight: 1
  why: Uplift renews catchment relief and supply; ratio to basin subsidence sets fan entrenchment
  want: high
- factor: planet-factor.slope-relief
  weight: 1
  why: Abrupt slope drop where confined channel exits; fan slope 1.5-25 deg
  want: high
- factor: planet-factor.sed-supply
  weight: 3
  why: Coarse, abundant supply; calibre and catchment size set slope and area
  want: high
- factor: planet-factor.rock-type
  weight: 1
  why: Mudstone or clay-rich saprolite source favours debris-flow fans; coarse permeable regolith gives fluvial
    fans
  want: high
- factor: planet-factor.clim-storm
  weight: 3
  why: Intense rare storms trigger debris flows and sheetfloods
  want: high
- factor: planet-factor.clim-arid
  weight: 1
  why: Arid/semi-arid with sparse vegetation; also humid areas with intense rain
  want: high
- factor: planet-factor.clim-history
  weight: 1
  why: Pluvial-arid shifts cause aggradation/incision phases, fan segmentation
  want: high
- factor: planet-factor.base-level
  weight: 1
  why: Basin floor or axial river trims toe; base-level fall entrenches fan
  want: high
- factor: planet-factor.events
  weight: 1
  why: Debris flows and floods build lobes, avulsions
  want: high
- factor: planet-factor.time
  weight: 1
  why: 1 kyr-1 Myr; desert varnish and pavements age the surfaces
  want: high
vocabulary_id: 14
sources:
- https://en.wikipedia.org/wiki/Alluvial_fan
- https://en.wikipedia.org/wiki/Basin_and_Range_Province
- https://www.nps.gov/subjects/geology/arid-landforms.htm
library_status: written
source: arid.slope.alluvial_fan
levels:
- planet-level.100-km
- planet-level.10-km
basis:
- of:
  - factors
  - sources
  tier: derived
  note: 'planet-trees-pgs2 docs/landforms/deciding_factors.json: its factors in its words, its top three weighted
    3.'
- of:
  - when
  tier: invented
  review: true
  note: 'No hard conditions yet: planets to add them where a factor is a must (ice, sea, a volcano).'
- of:
  - factors.want
  - look
  tier: invented
  review: true
  source: planet-forge 3c40281 crates/viewer/src/rings/formations.rs factor_scores; crates/viewer/src/layers/features.rs
    arch_of
  note: Draft migration of viewer archetype mapping (including dendritic fallback) and preference-word inference,
    corrected to whole-word tokens and reviewed against supplied why text and existing signal direction. Ambiguous
    categorical, compound or nonmonotonic factors remain review-required; no band bounds invented. Consumers
    use explicit fields, never repeat prose/key inference.
- of:
  - factors.want
  tier: derived
  review: true
  source: Supplied factor why text and PlanetSim factor signal records; semantic correction 2026-10-22
  note: 'planet-factor.clim-arid: The why text favors arid conditions; sparse vegetation, low rain/relief or
    weak soil are effects or other quantities.'
status: draft
look: fan
