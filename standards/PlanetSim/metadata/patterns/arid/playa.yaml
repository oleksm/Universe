# yaml-language-server: $schema=../../../schema/planet-pattern.schema.yaml
identity:
  key: planet-pattern.arid.basin.playa
  name: Playa / salt pan (salar, sabkha inland)
  about: Playa / salt pan (salar, sabkha inland).
family: arid
factors:
- factor: planet-factor.clim-arid
  weight: 3
  why: Evaporation exceeds inflow (potential evaporation several times precipitation)
  want: high
- factor: planet-factor.tect-setting
  weight: 1
  why: 'Endorheic basins: grabens, foreland/intermontane basins, deflation hollows'
  want: high
- factor: planet-factor.relief-inherited
  weight: 3
  why: Lowest point of a closed basin; no outlet to sea
  want: low
- factor: planet-factor.groundwater
  weight: 3
  why: Shallow water table gives wet (discharge) playa with salt crust; deep gives dry clay playa
  want: high
- factor: planet-factor.sed-supply
  weight: 1
  why: Fine silt/clay and solute inflow; supply versus subsidence sets fill
  want: high
- factor: planet-factor.other-solute-chemistry
  weight: 1
  why: Inflow brine chemistry sets crust minerals (halite, gypsum, carbonates) and crust thickness
  want: high
- factor: planet-factor.clim-storm
  weight: 1
  why: Occasional floods form shallow ephemeral lakes that re-level the surface
  want: high
- factor: planet-factor.clim-wind
  weight: 1
  why: Wind spreads thin water films making smooth surfaces; deflation and lunette dunes
  want: high
- factor: planet-factor.lake-level
  weight: 1
  why: Many are desiccated pluvial lake floors
  want: high
- factor: planet-factor.clim-history
  weight: 1
  why: Pluvial lake phases leave shorelines and thick lacustrine fill
  want: high
- factor: planet-factor.time
  weight: 1
  why: 1 kyr-1 Myr
  want: high
vocabulary_id: 10
sources:
- https://en.wikipedia.org/wiki/Dry_lake
- https://www.nps.gov/subjects/geology/arid-landforms.htm
- https://en.wikipedia.org/wiki/Basin_and_Range_Province
library_status: written
source: arid.basin.playa
levels:
- planet-level.100-km
- planet-level.10-km
basis:
- of:
  - factors
  - sources
  tier: derived
  note: 'planet-trees-pgs2 docs/landforms/deciding_factors.json: its factors in its words, its top three weighted
    3.'
- of:
  - when
  tier: invented
  review: true
  note: 'No hard conditions yet: planets to add them where a factor is a must (ice, sea, a volcano).'
- of:
  - factors.want
  - look
  tier: invented
  review: true
  source: planet-forge 3c40281 crates/viewer/src/rings/formations.rs factor_scores; crates/viewer/src/layers/features.rs
    arch_of
  note: Draft migration of viewer archetype mapping (including dendritic fallback) and preference-word inference,
    corrected to whole-word tokens and reviewed against supplied why text and existing signal direction. Ambiguous
    categorical, compound or nonmonotonic factors remain review-required; no band bounds invented. Consumers
    use explicit fields, never repeat prose/key inference.
status: draft
look: playa
