# yaml-language-server: $schema=../../../schema/planet-pattern.schema.yaml
identity:
  key: planet-pattern.arid.slope.pediment
  name: Pediment and piedmont plain
  about: Pediment and piedmont plain.
family: arid
factors:
- factor: planet-factor.clim-arid
  weight: 3
  why: 'Arid/semi-arid best: sparse vegetation, weak soils and unstable banks promote planation Duplicate library
    context: arid, sparse vegetation, low bank cohesion'
  want: high
- factor: planet-factor.bio-veg
  weight: 1
  why: Little vegetation lets sheetwash and channels migrate laterally
  want: in
  source: planet-forge 18ef137 docs/research/category-intentions-2026-10-24.json
  classes:
  - barren
  - sparse
  - grassland-steppe
  - shrubland
- factor: planet-factor.clim-storm
  weight: 1
  why: 'Sheetfloods and flash floods do lateral planation Duplicate library context: episodic floods and sheetwash
    plane the surface'
  want: high
- factor: planet-factor.rock-type
  weight: 1
  why: 'Granite and grus-forming crystalline rock most common, though lithology not essential Duplicate library
    context: granitic, grus-forming rock most common'
  want: in
  source: planet-forge 18ef137 docs/research/category-intentions-2026-10-24.json
  classes:
  - crystalline
- factor: planet-factor.tect-uplift
  weight: 3
  why: 'Stable or slowly uplifting mountain front; fast uplift makes fans instead Duplicate library context: tectonically
    quiescent front; fault activity favours fans instead'
  want: low
- factor: planet-factor.base-level
  weight: 3
  why: 'Stable or slowly falling; more common in hydrologically open basins Duplicate library context: stable basin
    base level; slope 0.5-7 deg'
  want: low
- factor: planet-factor.sed-supply
  weight: 1
  why: Supply balanced by transport keeps thin veneer, not aggrading fan
  want: high
- factor: planet-factor.regolith
  weight: 1
  why: 'Weathering front lowering beneath thin mantle; high-infiltration ground Duplicate library context: thin
    transient alluvial veneer 0-5 m'
  want: high
- factor: planet-factor.slope-relief
  weight: 1
  why: 0.5-7 deg (typ 3-4) with sharp piedmont angle
  want: high
- factor: planet-factor.time
  weight: 1
  why: '100 kyr-10 Myr of scarp retreat Duplicate library context: 100 kyr-10 Myr'
  want: high
  unresolved: true
  source: planet-forge docs/research/process-geomorphology-2026-10-24.md section 3.2 (unverified order-of-magnitude
    table; not a decay constant)
- factor: planet-factor.rock-perm
  weight: 1
  why: high infiltration of grus favours planation
  want: high
vocabulary_id: 15
sources:
- https://en.wikipedia.org/wiki/Pediment_(geology)
