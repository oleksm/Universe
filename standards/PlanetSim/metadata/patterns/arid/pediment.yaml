# yaml-language-server: $schema=../../../schema/planet-pattern.schema.yaml
identity:
  key: planet-pattern.arid.slope.pediment
  name: Pediment and piedmont plain
  about: Pediment and piedmont plain.
family: arid
factors:
- factor: planet-factor.clim-arid
  weight: 3
  why: 'Arid/semi-arid best: sparse vegetation, weak soils and unstable banks promote planation'
  want: high
- factor: planet-factor.bio-veg
  weight: 1
  why: Little vegetation lets sheetwash and channels migrate laterally
  want: low
- factor: planet-factor.clim-storm
  weight: 1
  why: Sheetfloods and flash floods do lateral planation
  want: high
- factor: planet-factor.rock-type
  weight: 1
  why: Granite and grus-forming crystalline rock most common, though lithology not essential
  want: high
- factor: planet-factor.tect-uplift
  weight: 3
  why: Stable or slowly uplifting mountain front; fast uplift makes fans instead
  want: low
- factor: planet-factor.base-level
  weight: 3
  why: Stable or slowly falling; more common in hydrologically open basins
  want: low
- factor: planet-factor.sed-supply
  weight: 1
  why: Supply balanced by transport keeps thin veneer, not aggrading fan
  want: high
- factor: planet-factor.regolith
  weight: 1
  why: Weathering front lowering beneath thin mantle; high-infiltration ground
  want: high
- factor: planet-factor.slope-relief
  weight: 1
  why: 0.5-7 deg (typ 3-4) with sharp piedmont angle
  want: high
- factor: planet-factor.time
  weight: 1
  why: 100 kyr-10 Myr of scarp retreat
  want: high
vocabulary_id: 15
sources:
- https://en.wikipedia.org/wiki/Pediment_(geology)
- https://www.nps.gov/subjects/geology/arid-landforms.htm
library_status: written
source: arid.slope.pediment
levels:
- planet-level.100-km
- planet-level.10-km
basis:
- of:
  - factors
  - sources
  tier: derived
  note: 'planet-trees-pgs2 docs/landforms/deciding_factors.json: its factors in its words, its top three weighted
    3.'
- of:
  - when
  tier: invented
  review: true
  note: 'No hard conditions yet: planets to add them where a factor is a must (ice, sea, a volcano).'
- of:
  - factors.want
  - look
  tier: invented
  review: true
  source: planet-forge 3c40281 crates/viewer/src/rings/formations.rs factor_scores; crates/viewer/src/layers/features.rs
    arch_of
  note: Draft migration of viewer archetype mapping (including dendritic fallback) and preference-word inference,
    corrected to whole-word tokens and reviewed against supplied why text and existing signal direction. Ambiguous
    categorical, compound or nonmonotonic factors remain review-required; no band bounds invented. Consumers
    use explicit fields, never repeat prose/key inference.
- of:
  - factors.want
  tier: derived
  review: true
  source: Supplied factor why text and PlanetSim factor signal records; semantic correction 2026-10-22
  note: 'planet-factor.clim-arid: The why text favors arid conditions; sparse vegetation, low rain/relief or
    weak soil are effects or other quantities.'
status: draft
look: fan
