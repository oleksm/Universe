# yaml-language-server: $schema=../../../schema/planet-pattern.schema.yaml
identity:
  key: planet-pattern.arid.landscape.desert-basin
  name: Desert basin (bolson; basin-and-range style)
  about: Desert basin (bolson; basin-and-range style).
family: arid
factors:
- factor: planet-factor.tect-setting
  weight: 1
  why: Extensional provinces (horst/graben) or intermontane/foreland basins
  want: in
  source: planet-forge 18ef137 docs/research/category-intentions-2026-10-24.json
  classes:
  - rift-extensional
  - intermontane-basin
  - foreland-basin
- factor: planet-factor.tect-fault
  weight: 3
  why: Listric/normal faults create alternating ranges and basins at ~20-40 km spacing
  want: high
- factor: planet-factor.tect-uplift
  weight: 1
  why: Range uplift vs basin subsidence sets relief and fill thickness
  want: high
- factor: planet-factor.clim-arid
  weight: 3
  why: 'Arid (<250 mm/yr) closes drainage: endorheic basins'
  want: high
- factor: planet-factor.sed-supply
  weight: 3
  why: 'Range erosion fills basin: fans, bajadas, basin floor'
  want: high
- factor: planet-factor.base-level
  weight: 1
  why: Closed (bolson + playa) vs open (through river) drainage
  want: high
- factor: planet-factor.clim-history
  weight: 1
  why: Pluvial lakes left shorelines, lake beds
  want: high
- factor: planet-factor.clim-storm
  weight: 1
  why: Flash floods move sediment
  want: high
- factor: planet-factor.time
  weight: 1
  why: Myr since extension began (Basin and Range ~17 Myr)
  want: high
  unresolved: true
  source: planet-forge docs/research/process-geomorphology-2026-10-24.md section 3.2 (unverified order-of-magnitude
    table; not a decay constant)
vocabulary_id: 146
sources:
- https://en.wikipedia.org/wiki/Basin_and_Range_Province
- https://www.nps.gov/subjects/geology/arid-landforms.htm
- https://en.wikipedia.org/wiki/Dry_lake
library_status: planned
source: arid.landscape.desert_basin
levels:
- planet-level.100-km
- planet-level.10-km
basis:
- of:
  - factors
  - sources
  tier: derived
  note: 'planet-trees-pgs2 docs/landforms/deciding_factors.json: its factors in its words, its top three weighted
    3.'
- of:
  - when
  tier: invented
  review: true
  note: 'No hard conditions yet: planets to add them where a factor is a must (ice, sea, a volcano).'
- of:
  - factors.want
  - look
  tier: invented
  review: true
  source: planet-forge 3c40281 crates/viewer/src/rings/formations.rs factor_scores; crates/viewer/src/layers/features.rs
    arch_of
  note: Draft migration of viewer archetype mapping (including dendritic fallback) and preference-word inference,
    corrected to whole-word tokens and reviewed against supplied why text and existing signal direction. Ambiguous
    categorical, compound or nonmonotonic factors remain review-required; no band bounds invented. Consumers use
    explicit fields, never repeat prose/key inference.
- of:
  - factors.classes
  - factors.required
  - factors.unresolved
  tier: derived
  source: planet-forge 18ef137 docs/research/category-intentions-2026-10-24.json
  note: Reviewed directed categorical intentions, with prerequisites separated from modifiers. Missing/proxy class
    evidence is not a verified physical classification; unresolved classes remain unknown.
status: draft
look: tableland
kinds:
- desert-basin-bolson
