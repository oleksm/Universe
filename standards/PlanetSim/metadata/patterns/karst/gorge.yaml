identity:
  key: planet-pattern.karst.collapse.gorge
  name: Collapse doline, tiankeng and cave-collapse gorge
  about: Collapse doline, tiankeng and cave-collapse gorge.
family: karst
factors:
- factor: planet-factor.rock-soluble
  weight: 3
  why: Thick limestone (hundreds of m) holding large chambers; tiankeng occur in cone/tower karst
  want: high
- factor: planet-factor.water-discharge
  weight: 3
  why: Large, fluctuating underground-river discharge removes fallen blocks; most volume removed by streams
  want: high
- factor: planet-factor.rock-fracture
  weight: 1
  why: Vertical fractures give collapse weakness; stress release opens new fractures
  want: high
- factor: planet-factor.tect-uplift
  weight: 3
  why: Uplift gives deep vadose zone and steep hydraulic gradient
  want: high
- factor: planet-factor.slope-relief
  weight: 1
  why: 'High relief between sinking point and resurgence: steep gradient, more erosion'
  want: high
- factor: planet-factor.clim-precip
  weight: 1
  why: Humid (monsoon) recharge supplies the cave river
  want: high
- factor: planet-factor.events
  weight: 1
  why: Discrete roof collapses enlarge chamber stepwise; blockage diverts streams
  want: high
- factor: planet-factor.time
  weight: 1
  why: 10 kyr-1 Myr; sequence river-chamber-tiankeng-degradation-gorge with natural bridges
  want: high
vocabulary_id: 93
sources:
- https://digitalcommons.usf.edu/kip_articles/2580
- https://en.wikipedia.org/wiki/Sinkhole
library_status: written
source: karst.collapse.gorge
levels:
