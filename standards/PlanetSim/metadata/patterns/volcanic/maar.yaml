# yaml-language-server: $schema=../../../schema/planet-pattern.schema.yaml
identity:
  key: planet-pattern.volcanic.depression.maar
  name: Maar (maar-diatreme volcano)
  about: Maar (maar-diatreme volcano).
family: volcanic
factors:
- factor: planet-factor.groundwater
  weight: 3
  why: magma meeting aquifer water drives explosions; steady water supply deepens crater
  want: high
- factor: planet-factor.rock-perm
  weight: 3
  why: water-bearing permeable country rock or soft sediment needed; tight rock gives scoria cone
  want: high
- factor: planet-factor.volc-magma
  weight: 3
  why: low-volume basaltic to kimberlitic magma
  want: low
- factor: planet-factor.permafrost
  weight: 1
  why: 'melting ground ice supplies slow water, low water/magma ratio: largest maars (Alaska)'
  want: high
- factor: planet-factor.slope-relief
  weight: 1
  why: low ground, valley floors and plains where water table is shallow
  want: low
- factor: planet-factor.rock-type
  weight: 1
  why: country-rock lithics form ring; soft host widens crater
  want: in
  unresolved: true
  source: planet-forge 18ef137 docs/research/category-intentions-2026-10-24.json
- factor: planet-factor.clim-precip
  weight: 1
  why: post-eruption rain/groundwater fills crater with lake unless floor too porous
  want: high
- factor: planet-factor.time
  weight: 1
  why: crater infilled by lake sediment over kyr; eroded to diatreme over Myr
  want: high
  unresolved: true
  source: planet-forge docs/research/process-geomorphology-2026-10-24.md section 3.2 (unverified order-of-magnitude
    table; not a decay constant)
vocabulary_id: 133
sources:
- https://en.wikipedia.org/wiki/Maar
- https://en.wikipedia.org/wiki/Phreatomagmatic_eruption
library_status: written
source: volcanic.depression.maar
