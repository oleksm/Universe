factors:
- factor: planet-factor.tect-setting
  weight: 3
  why: 'subduction: oceanic under oceanic gives island arc, under continent gives continental arc'
  want: high
- factor: planet-factor.volc-magma
  weight: 3
  why: 'slab water flux melting: calc-alkaline andesite-dacite, explosive stratovolcanoes'
  want: high
- factor: planet-factor.tect-uplift
  weight: 1
  why: crustal thickening raises continental arcs into high plateaus
  want: high
- factor: planet-factor.tect-fault
  weight: 1
  why: arc-parallel and strike-slip faults segment arc and align vents
  want: high
- factor: planet-factor.time
  weight: 1
  why: arc age decides edifice density and caldera/ignimbrite development
  want: high
- factor: planet-factor.other-plate-kinematics
  weight: 3
  why: slab reaching ~100-120 km depth under arc; dip, convergence rate and obliquity set arc-trench gap, flux
  want: high
