identity:
  key: planet-pattern.volcanic.province.flood-basalt
  name: Flood basalt province / lava plateau (traps)
  about: Flood basalt province / lava plateau (traps).
family: volcanic
factors:
- factor: planet-factor.tect-setting
  weight: 3
  why: mantle plume head under continent, often at incipient rifting/breakup
  want: high
- factor: planet-factor.other-magma-supply
  weight: 3
  why: huge pulses, >75% of 10^5-10^6 km3 in 1-5 Myr
  want: high
- factor: planet-factor.volc-vent
  weight: 1
  why: fissure eruptions fed by giant dike swarms >300 km
  want: high
- factor: planet-factor.volc-magma
  weight: 1
  why: 'tholeiitic basalt, very fluid: flows 10-100 m thick spread hundreds of km'
  want: high
- factor: planet-factor.rock-layers
  weight: 3
  why: stacked flows with interbeds/boles give stepped trap topography on erosion
  want: high
- factor: planet-factor.tect-uplift
  weight: 1
  why: plume uplift and later rift-flank uplift tilt plateau, make great escarpment
  want: high
- factor: planet-factor.clim-precip
  weight: 1
  why: humid tropical weathering gives laterite caps and deep dissection
  want: high
- factor: planet-factor.time
  weight: 1
  why: post-eruption erosion turns plateau into mesas, buttes and escarpments over Myr
  want: high
