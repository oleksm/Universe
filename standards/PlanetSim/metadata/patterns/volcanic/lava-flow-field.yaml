identity:
  key: planet-pattern.volcanic.flow.lava-flow-field
  name: Lava flow field (pahoehoe / aa)
  about: Lava flow field (pahoehoe / aa).
family: volcanic
factors:
- factor: planet-factor.volc-magma
  weight: 3
  why: basalt; viscosity and temperature (~1170-1200 C) decide pahoehoe vs aa
  want: high
  signal:
    features:
    - planet-feature.lava-flow-field
    radius_m: 50000
- factor: planet-factor.other-effusion-rate
  weight: 3
  why: low effusion gives inflated tube-fed pahoehoe; high gives channelised aa
  want: low
- factor: planet-factor.slope-relief
  weight: 3
  why: <~2 deg favours inflation and pahoehoe; steep slopes turn flows to aa
  want: high
- factor: planet-factor.volc-vent
  weight: 1
  why: point vent vs fissure decides sheet vs lobate plan; eruption duration sets area
  want: high
- factor: planet-factor.relief-inherited
  weight: 1
  why: pre-existing valleys channel flows; high ground left as kipukas
  want: high
- factor: planet-factor.sea-level
  weight: 1
  why: ocean entry builds lava deltas and pillow fronts
  want: high
- factor: planet-factor.time
  weight: 1
  why: weathering and soil cover with age; fresh flows barren
  want: high
- factor: planet-factor.bio-veg
  weight: 1
  why: vegetation colonisation rate marks flow age, tree moulds in forest
  want: high
vocabulary_id: 138
