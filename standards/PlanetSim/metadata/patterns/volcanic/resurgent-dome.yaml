  name: Resurgent dome
  about: Resurgent dome.
family: volcanic
factors:
- factor: planet-factor.other-magma-recharge
  weight: 3
  why: renewed magma pressure after collapse uplifts the caldera floor block
  want: high
- factor: planet-factor.tect-setting
  weight: 1
  why: large silicic calderas (Yellowstone, Valles, Long Valley, Toba)
  want: in
  unresolved: true
  source: planet-forge 18ef137 docs/research/category-intentions-2026-10-24.json
- factor: planet-factor.volc-magma
  weight: 1
  why: 'silicic, viscous: uplift rather than eruption; post-resurgence lava domes on ring fracture'
  want: high
- factor: planet-factor.tect-fault
  weight: 3
  why: ring faults and apical graben fault the dome
  want: high
- factor: planet-factor.lake-level
  weight: 1
  why: caldera lake may surround dome, giving island (Samosir) and raised lake beds
  want: high
- factor: planet-factor.time
  weight: 1
  why: forms within ~10s-100s kyr after collapse
  want: high
  unresolved: true
  source: planet-forge docs/research/process-geomorphology-2026-10-24.md section 3.2 (unverified order-of-magnitude
    table; not a decay constant)
- factor: planet-factor.other-magma-supply
  weight: 3
  why: only large calderas (>~10 km) above big silicic chambers resurge
  want: high
