# yaml-language-server: $schema=../../../schema/planet-pattern.schema.yaml
identity:
  key: planet-pattern.volcanic.province.hotspot
  name: Hotspot province / volcanic chain
  about: Hotspot province / volcanic chain.
family: volcanic
factors:
- factor: planet-factor.tect-setting
  weight: 3
  why: mantle plume under oceanic or continental plate
  want: in
  source: planet-forge 18ef137 docs/research/category-intentions-2026-10-24.json
  classes:
  - hotspot
  required: true
- factor: planet-factor.other-magma-supply
  weight: 3
  why: plume flux sets edifice size and swell height
  want: high
- factor: planet-factor.tect-uplift
  weight: 1
  why: swell uplift near plume, subsidence and flexure as plate moves away
  want: high
- factor: planet-factor.sea-level
  weight: 1
  why: subsidence drowns old islands into atolls and guyots
  want: high
- factor: planet-factor.bio-veg
  weight: 1
  why: tropical reef growth on subsiding islands makes atolls
  want: in
  source: planet-forge 18ef137 docs/research/category-intentions-2026-10-24.json
  classes:
  - reef
- factor: planet-factor.time
  weight: 1
  why: 'age along chain: active shields to eroded, drowned seamounts (Myr)'
  want: high
  unresolved: true
  source: planet-forge docs/research/process-geomorphology-2026-10-24.md section 3.2 (unverified order-of-magnitude
    table; not a decay constant)
- factor: planet-factor.other-plate-kinematics
  weight: 3
  why: plate velocity and direction set chain line, volcano spacing and age progression
  want: high
vocabulary_id: 183
sources:
- https://pubs.usgs.gov/gip/dynamic/hotspots.html
- https://en.wikipedia.org/wiki/Shield_volcano
library_status: planned
source: volcanic.province.hotspot
levels:
- planet-level.100-km
- planet-level.10-km
basis:
- of:
  - factors
  - sources
  tier: derived
  note: 'planet-trees-pgs2 docs/landforms/deciding_factors.json: its factors in its words, its top three weighted
    3.'
- of:
  - when
  tier: invented
  review: true
  note: 'No hard conditions yet: planets to add them where a factor is a must (ice, sea, a volcano).'
- of:
  - factors.want
  - look
  tier: invented
  review: true
  source: planet-forge 3c40281 crates/viewer/src/rings/formations.rs factor_scores; crates/viewer/src/layers/features.rs
    arch_of
  note: Draft migration of viewer archetype mapping (including dendritic fallback) and preference-word inference,
    corrected to whole-word tokens and reviewed against supplied why text and existing signal direction. Ambiguous
    categorical, compound or nonmonotonic factors remain review-required; no band bounds invented. Consumers use
    explicit fields, never repeat prose/key inference.
- of:
  - factors.classes
  - factors.required
  - factors.unresolved
  tier: derived
  source: planet-forge 18ef137 docs/research/category-intentions-2026-10-24.json
  note: Reviewed directed categorical intentions, with prerequisites separated from modifiers. Missing/proxy class
    evidence is not a verified physical classification; unresolved classes remain unknown.
status: draft
look: volcanic
kinds:
- hotspot-chain
- hotspot-volcano-centre
