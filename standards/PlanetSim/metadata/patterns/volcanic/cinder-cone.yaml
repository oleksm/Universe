identity:
  key: planet-pattern.volcanic.edifice.cinder-cone
  name: Cinder (scoria) cone
  about: Cinder (scoria) cone.
family: volcanic
factors:
- factor: planet-factor.volc-magma
  weight: 3
  why: 'gas-rich basalt/basaltic andesite, Strombolian: ballistic scoria piles at repose 30-40 deg'
  want: high
- factor: planet-factor.volc-vent
  weight: 3
  why: single short eruption (days-years); fissure vents give elongate cones or chains
  want: high
- factor: planet-factor.clim-wind
  weight: 1
  why: prevailing wind during eruption skews cone and tephra blanket downwind
  want: high
- factor: planet-factor.slope-relief
  weight: 1
  why: cone on slope is elongated and breached downslope
  want: high
- factor: planet-factor.events
  weight: 1
  why: 'waning lava flow from base rafts away cone sector: horseshoe breach'
  want: high
- factor: planet-factor.groundwater
  weight: 1
  why: 'abundant water turns eruption phreatomagmatic: maar/tuff ring instead of cone'
  want: high
- factor: planet-factor.time
  weight: 3
  why: age lowers H/W from 0.18 and slope 26 to 20 deg over ~0.7 Myr
  want: high
- factor: planet-factor.clim-precip
  weight: 1
  why: wetter climate degrades cone faster and gullies flanks; arid preserves form
  want: high
- factor: planet-factor.other-gravity-atmosphere
  weight: 1
  why: 'lower gravity/air pressure widens ballistic range: wider, lower cones (Mars)'
  want: high
