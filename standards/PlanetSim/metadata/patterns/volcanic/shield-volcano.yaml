# yaml-language-server: $schema=../../../schema/planet-pattern.schema.yaml
identity:
  key: planet-pattern.volcanic.edifice.shield-volcano
  name: Shield volcano
  about: Shield volcano.
family: volcanic
factors:
- factor: planet-factor.volc-magma
  weight: 3
  why: 'low-viscosity basalt, effusive Hawaiian style: slopes 2-12 deg, H/W 0.01-0.1'
  want: low
- factor: planet-factor.tect-setting
  weight: 1
  why: oceanic hotspot (giant shields), rift or monogenetic field (small lava shields)
  want: high
- factor: planet-factor.volc-vent
  weight: 3
  why: 'summit vs rift-zone feeding: central gives circular, rift zones give elongate plan'
  want: high
- factor: planet-factor.other-magma-supply
  weight: 3
  why: long-term magma flux sets size, 0.1 to >75,000 km3 (Mauna Loa)
  want: high
- factor: planet-factor.sea-level
  weight: 1
  why: submarine growth steeper (10-14 deg); subaerial above sea gives low slopes; breaking surface changes
    style
  want: low
- factor: planet-factor.tect-uplift
  weight: 1
  why: lithospheric flexure subsides the edifice km-scale as it grows and drifts off hotspot
  want: high
- factor: planet-factor.events
  weight: 1
  why: summit caldera collapse truncates top; giant flank landslides remove sectors
  want: high
- factor: planet-factor.time
  weight: 1
  why: 'growth stage: shield stage ~95% volume, then post-shield capping, erosion'
  want: high
- factor: planet-factor.clim-precip
  weight: 1
  why: windward rain carves deep valleys on old shields, dry side stays smooth
  want: high
vocabulary_id: 135
sources:
- https://en.wikipedia.org/wiki/Shield_volcano
- https://www.usgs.gov/volcanoes/mauna-loa/geology-and-history
- https://pubs.usgs.gov/gip/dynamic/hotspots.html
library_status: written
source: volcanic.edifice.shield_volcano
levels:
- planet-level.100-km
- planet-level.10-km
basis:
- of:
  - factors
  - sources
  tier: derived
  note: 'planet-trees-pgs2 docs/landforms/deciding_factors.json: its factors in its words, its top three weighted
    3.'
- of:
  - when
  tier: invented
  review: true
  note: 'No hard conditions yet: planets to add them where a factor is a must (ice, sea, a volcano).'
- of:
  - factors.want
  - look
  tier: invented
  review: true
  source: planet-forge 3c40281 crates/viewer/src/rings/formations.rs factor_scores; crates/viewer/src/layers/features.rs
    arch_of
  note: Draft migration of viewer archetype mapping (including dendritic fallback) and preference-word inference,
    corrected to whole-word tokens and reviewed against supplied why text and existing signal direction. Ambiguous
    categorical, compound or nonmonotonic factors remain review-required; no band bounds invented. Consumers
    use explicit fields, never repeat prose/key inference.
status: draft
look: volcanic
