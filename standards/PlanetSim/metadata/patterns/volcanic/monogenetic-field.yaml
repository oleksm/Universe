# yaml-language-server: $schema=../../../schema/planet-pattern.schema.yaml
identity:
  key: planet-pattern.volcanic.field.monogenetic-field
  name: Monogenetic volcanic field
  about: Monogenetic volcanic field.
family: volcanic
factors:
- factor: planet-factor.tect-setting
  weight: 3
  why: extension, rift flanks, arc back-areas, intraplate; rare on cratons
  want: not-in
  source: planet-forge 18ef137 docs/research/category-intentions-2026-10-24.json
  classes:
  - craton-shield
- factor: planet-factor.other-magma-supply
  weight: 3
  why: 'low basaltic flux: magma never builds a central system, vents scatter'
  want: low
- factor: planet-factor.tect-fault
  weight: 3
  why: faults and crustal fractures align vents and set field elongation
  want: high
- factor: planet-factor.volc-magma
  weight: 1
  why: basalt mostly; composition decides cones vs lava shields
  want: high
- factor: planet-factor.groundwater
  weight: 1
  why: high water table or wet sediment favours maars and tuff rings over cinder cones
  want: high
- factor: planet-factor.volc-vent
  weight: 1
  why: vent count, clustering and nearest-neighbour spacing ~1-3 km set field texture
  want: high
- factor: planet-factor.time
  weight: 1
  why: field life 0.1-5 Myr; mix of fresh and degraded cones
  want: high
  unresolved: true
  source: planet-forge docs/research/process-geomorphology-2026-10-24.md section 3.2 (unverified order-of-magnitude
    table; not a decay constant)
- factor: planet-factor.relief-inherited
  weight: 1
  why: lava flows fill valleys of pre-existing drainage
  want: high
