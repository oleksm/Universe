- factor: planet-factor.clim-wind
  weight: 1
  why: strong unidirectional wind on soft tuff carves yardangs
- factor: planet-factor.time
  weight: 1
  why: later canyon incision through welded caprock
- factor: planet-factor.other-magma-supply
  weight: 3
  why: eruption volume (100s-1000s km3) sets sheet extent and thickness
