- factor: planet-factor.tect-setting
  weight: 1
  why: continental arcs over thick crust and plateaus (Altiplano-Puna, Taupo)
  want: in
  source: planet-forge 18ef137 docs/research/category-intentions-2026-10-24.json
  classes:
  - magmatic-arc
  - back-arc
- factor: planet-factor.other-welding
  weight: 3
  why: 'emplacement temperature and thickness decide welding: cliff-forming welded zone vs soft tuff'
  want: high
- factor: planet-factor.relief-inherited
  weight: 1
  why: flows fill valleys and level landscape; thick ponding in lows
  want: high
- factor: planet-factor.clim-arid
  weight: 1
  why: aridity preserves flat sheets; humid climate dissects them
  want: high
- factor: planet-factor.clim-wind
  weight: 1
  why: strong unidirectional wind on soft tuff carves yardangs
  want: high
- factor: planet-factor.time
  weight: 1
  why: later canyon incision through welded caprock
  want: high
  unresolved: true
  source: planet-forge docs/research/process-geomorphology-2026-10-24.md section 3.2 (unverified order-of-magnitude
    table; not a decay constant)
- factor: planet-factor.other-magma-supply
  weight: 3
  why: eruption volume (100s-1000s km3) sets sheet extent and thickness
  want: high
