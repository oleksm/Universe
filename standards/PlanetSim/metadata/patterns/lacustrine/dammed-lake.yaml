identity:
  key: planet-pattern.lacustrine.lake.dammed-lake
  name: Dammed lake
  about: Dammed lake.
family: lacustrine
factors:
- factor: planet-factor.events
  weight: 3
  why: Landslides from rain and earthquakes (84%)
- factor: planet-factor.slope-relief
  weight: 3
  why: Narrow steep valleys favour dams
- factor: planet-factor.rock-type
  weight: 1
  why: Clay-rich low-porosity dam lasts longer
- factor: planet-factor.water-discharge
  weight: 3
  why: Inflow rate sets overtopping time
- factor: planet-factor.ice-extent
  weight: 1
  why: Ice and moraine dams in glaciated valleys
- factor: planet-factor.volc-vent
  weight: 1
  why: Lava or volcanic debris dams
- factor: planet-factor.time
  weight: 1
  why: Half fail in 10 days; some last 10 kyr
