factors:
- factor: planet-factor.clim-history
  weight: 3
  why: Pluvial phases raised levels (Bonneville 30-13 ka)
  want: high
- factor: planet-factor.lake-level
  weight: 3
  why: Stillstands of ~1 kyr cut terraces; Provo ~1000 yr
  want: high
- factor: planet-factor.tect-setting
  weight: 1
  why: Closed basins (basin and range)
  want: in
  source: planet-forge 18ef137 docs/research/category-intentions-2026-10-24.json
  classes:
  - rift-extensional
  - intermontane-basin
- factor: planet-factor.events
  weight: 3
  why: Outlet failure drop of ~125 m (Bonneville flood)
  want: high
- factor: planet-factor.waves-tides
  weight: 1
  why: Wave energy builds beach ridges
  want: high
- factor: planet-factor.sed-supply
  weight: 1
  why: Supply decides depositional vs erosional terraces
  want: high
- factor: planet-factor.other-isostatic-rebound
  weight: 1
  why: Rebound warps shorelines by ~74 m
  want: high
- factor: planet-factor.time
  weight: 1
  why: 5-100 kyr
  want: high
  unresolved: true
  source: planet-forge docs/research/process-geomorphology-2026-10-24.md section 3.2 (unverified order-of-magnitude
    table; not a decay constant)
