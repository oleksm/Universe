identity:
  key: planet-pattern.aeolian.dune.linear
  name: Linear (longitudinal / seif) dune
  about: Linear (longitudinal / seif) dune.
family: aeolian
factors:
- factor: planet-factor.clim-wind
  weight: 3
  why: bimodal wide-angle wind; ridge along resultant drift; lengths to >160 km
  want: high
- factor: planet-factor.sed-supply
  weight: 3
  why: moderate sand; elongating mode on sand-poor floors
  want: high
- factor: planet-factor.clim-arid
  weight: 3
  why: arid sharp seifs; semi-arid vegetated linear dunes (Kalahari, Australia)
  want: high
- factor: planet-factor.bio-veg
  weight: 1
  why: vegetation stabilises flanks, keeps them straight and long-lived
  want: high
- factor: planet-factor.slope-relief
  weight: 1
  why: flat; obstacles anchor dune heads
  want: low
- factor: planet-factor.clim-history
  weight: 1
  why: many are relict from drier glacial phases
  want: high
- factor: planet-factor.time
  weight: 1
  why: 1-1000 kyr; complex forms to 200 m high
  want: high
vocabulary_id: 2
sources:
- https://en.wikipedia.org/wiki/Seif_dune
- https://pubs.usgs.gov/gip/deserts/dunes/
library_status: written
source: aeolian.dune.linear
levels:
- planet-level.100-km
- planet-level.10-km
basis:
- of:
  - factors
  - sources
  tier: derived
  note: 'planet-trees-pgs2 docs/landforms/deciding_factors.json: its factors in its words, its top three weighted
    3.'
- of:
  - when
  tier: invented
  review: true
  note: 'No hard conditions yet: planets to add them where a factor is a must (ice, sea, a volcano).'
- of:
  - factors.want
  - look
  tier: invented
  review: true
  source: planet-forge 3c40281 crates/viewer/src/rings/formations.rs factor_scores; crates/viewer/src/layers/features.rs
    arch_of
  note: Draft migration of viewer archetype mapping (including dendritic fallback) and preference-word inference,
    corrected to whole-word tokens and reviewed against supplied why text and existing signal direction. Ambiguous
    categorical, compound or nonmonotonic factors remain review-required; no band bounds invented. Consumers
    use explicit fields, never repeat prose/key inference.
status: draft
look: dunes
