# yaml-language-server: $schema=../../../schema/planet-pattern.schema.yaml
identity:
  key: planet-pattern.aeolian.landscape.erg
  name: Sand sea (erg)
  about: Sand sea (erg).
family: aeolian
factors:
- factor: planet-factor.sed-supply
  weight: 3
  why: 'large sand source upwind: rivers, deltas, lakes, glacial plains; >125 km2, >20% sand'
  want: high
- factor: planet-factor.clim-arid
  weight: 3
  why: rain < ~150 mm/yr keeps sand active
  want: high
- factor: planet-factor.bio-veg
  weight: 1
  why: sparse vegetation; plant cover fixes dunes
  want: low
- factor: planet-factor.clim-wind
  weight: 3
  why: wind regime convergence; directional variability sets dune types; trade-wind belts 20-40 deg
  want: high
- factor: planet-factor.relief-inherited
  weight: 1
  why: topographic basins and lee of uplands trap sand
  want: high
- factor: planet-factor.tect-setting
  weight: 1
  why: subsiding basins preserve thick sand stacks
  want: high
- factor: planet-factor.clim-history
  weight: 1
  why: glacial-arid phases supply sand; wetter phases stabilise
  want: high
- factor: planet-factor.time
  weight: 1
  why: 10 kyr-10 Myr; dune size grows with age
  want: high
vocabulary_id: 7
sources:
- https://en.wikipedia.org/wiki/Erg_(landform)
- https://pubs.usgs.gov/gip/deserts/dunes/
- https://pubs.usgs.gov/gip/deserts/eolian/
library_status: written
source: aeolian.landscape.erg
levels:
- planet-level.100-km
- planet-level.10-km
basis:
- of:
  - factors
  - sources
  tier: derived
  note: 'planet-trees-pgs2 docs/landforms/deciding_factors.json: its factors in its words, its top three weighted
    3.'
- of:
  - when
  tier: invented
  review: true
  note: 'No hard conditions yet: planets to add them where a factor is a must (ice, sea, a volcano).'
- of:
  - factors.want
  - look
  tier: invented
  review: true
  source: planet-forge 3c40281 crates/viewer/src/rings/formations.rs factor_scores; crates/viewer/src/layers/features.rs
    arch_of
  note: Draft migration of viewer archetype mapping (including dendritic fallback) and preference-word inference,
    corrected to whole-word tokens and reviewed against supplied why text and existing signal direction. Ambiguous
    categorical, compound or nonmonotonic factors remain review-required; no band bounds invented. Consumers
    use explicit fields, never repeat prose/key inference.
