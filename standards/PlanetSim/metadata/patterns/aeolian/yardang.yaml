identity:
  key: planet-pattern.aeolian.erosion.yardang
  name: Yardangs (incl. mega-yardangs)
  about: Yardangs (incl. mega-yardangs).
family: aeolian
factors:
- factor: planet-factor.clim-wind
  weight: 3
  why: strong persistent unidirectional wind; axis parallel; length:width ~3-4:1
  want: high
- factor: planet-factor.clim-arid
  weight: 3
  why: hyper-arid, no vegetation
  want: high
- factor: planet-factor.rock-type
  weight: 3
  why: soft lake beds, siltstone, sandstone, ignimbrite; harder rock for mega-yardangs
  want: high
- factor: planet-factor.rock-fracture
  weight: 1
  why: joints aligned with wind guide corridors
  want: high
- factor: planet-factor.sed-supply
  weight: 1
  why: some sand/dust as abrasive but little sand cover
  want: low
- factor: planet-factor.lake-level
  weight: 1
  why: dried lake beds (former wetter phases) provide erodible sediment
  want: high
- factor: planet-factor.time
  weight: 1
  why: 1-1000 kyr
  want: high
vocabulary_id: 6
sources:
- https://en.wikipedia.org/wiki/Yardang
