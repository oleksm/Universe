identity:
  key: planet-pattern.aeolian.loess.plateau
  name: Loess plateau (with gully dissection)
  about: Loess plateau (with gully dissection).
family: aeolian
factors:
- factor: planet-factor.sed-supply
  weight: 3
  why: 'silt source: glacial outwash or desert/playa dust'
  want: high
- factor: planet-factor.clim-wind
  weight: 3
  why: prevailing winds carry dust downwind; thickness falls with distance; ridges along wind
  want: high
- factor: planet-factor.bio-veg
  weight: 1
  why: steppe grass traps dust
  want: in
  source: planet-forge 18ef137 docs/research/category-intentions-2026-10-24.json
  classes:
  - grassland-steppe
- factor: planet-factor.clim-arid
  weight: 1
  why: semi-arid steppe downwind of deserts
  want: high
- factor: planet-factor.clim-history
  weight: 3
  why: glacial-interglacial cycles alternate loess and palaeosols; 2.6 Myr China record
  want: high
- factor: planet-factor.ice-extent
  weight: 1
  why: glacial grinding supplies periglacial loess
  want: high
- factor: planet-factor.clim-storm
  weight: 1
  why: summer monsoon rain cuts deep gullies in erodible loess
  want: high
- factor: planet-factor.tect-uplift
  weight: 1
  why: uplift and base-level fall drive gully incision
  want: high
- factor: planet-factor.time
  weight: 1
  why: 10-2600 kyr; thickness to ~350 m
  want: high
  unresolved: true
  source: planet-forge docs/research/process-geomorphology-2026-10-24.md section 3.2 (unverified order-of-magnitude
    table; not a decay constant)
