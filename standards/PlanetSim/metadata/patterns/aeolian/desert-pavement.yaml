identity:
  key: planet-pattern.aeolian.surface.desert-pavement
  name: Desert pavement (stone pavement / reg / serir)
  about: Desert pavement (stone pavement / reg / serir).
family: aeolian
factors:
- factor: planet-factor.clim-arid
  weight: 3
  why: arid; little vegetation
- factor: planet-factor.regolith
  weight: 3
  why: gravelly alluvium or weathered basalt supplies clasts
- factor: planet-factor.sed-supply
  weight: 1
  why: dust influx builds accretionary Av mantle (0.1-3 m) under clasts
- factor: planet-factor.slope-relief
  weight: 1
  why: low slopes, stable fan terraces or lava flows
- factor: planet-factor.time
  weight: 3
  why: 5-1000 kyr; older pavements tighter, varnished
- factor: planet-factor.clim-wind
  weight: 1
  why: deflation removes fines
- factor: planet-factor.clim-storm
  weight: 1
  why: sheetwash removes fines
- factor: planet-factor.other-shrink-swell
  weight: 1
  why: clay swelling and salts heave clasts upward
