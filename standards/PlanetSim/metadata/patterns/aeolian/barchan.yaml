identity:
  key: planet-pattern.aeolian.dune.barchan
  name: Barchan dune
  about: Barchan dune.
family: aeolian
factors:
- factor: planet-factor.clim-wind
  weight: 3
  why: unimodal wind; horns downwind; migration 1-100 m/yr inversely with height
  want: high
- factor: planet-factor.sed-supply
  weight: 3
  why: limited sand; more sand merges barchans into barchanoid/transverse ridges
  want: high
- factor: planet-factor.regolith
  weight: 3
  why: hard, deflated, non-sandy substrate between dunes
  want: high
- factor: planet-factor.clim-arid
  weight: 1
  why: arid, little vegetation
  want: high
- factor: planet-factor.slope-relief
  weight: 1
  why: flat surfaces
  want: low
- factor: planet-factor.other-atmosphere-density
  weight: 1
  why: saturation length (min size) scales with air/sand density; Mars barchans larger
  want: high
- factor: planet-factor.time
  weight: 1
  why: years to kyr
  want: high
vocabulary_id: 1
