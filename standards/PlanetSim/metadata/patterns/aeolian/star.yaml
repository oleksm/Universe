  want: high
- factor: planet-factor.groundwater
  weight: 1
  why: moist cores/lake-fed cementation help megadunes (Badain Jaran)
  want: high
- factor: planet-factor.time
  weight: 1
  why: 10-1000 kyr
  want: high
  unresolved: true
