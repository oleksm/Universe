# yaml-language-server: $schema=../../../schema/planet-pattern.schema.yaml
identity:
  key: planet-pattern.aeolian.dune.coastal-foredune
  name: Coastal foredune
  about: Coastal foredune.
family: aeolian
factors:
- factor: planet-factor.clim-wind
  weight: 3
  why: onshore to oblique strong winds; highest flux at moderate oblique incidence
  want: high
- factor: planet-factor.sed-supply
  weight: 3
  why: stable or prograding coast with sand supply; inverse dune volume with grain size
  want: high
- factor: planet-factor.bio-veg
  weight: 3
  why: burial-tolerant grasses trap sand; species set shape (marram high, steep)
  want: not-in
  source: planet-forge 18ef137 docs/research/category-intentions-2026-10-24.json
  classes:
  - barren
  required: true
- factor: planet-factor.waves-tides
  weight: 1
  why: wide dissipative beach gives fetch, ~60% higher transport than reflective
  want: high
- factor: planet-factor.groundwater
  weight: 1
  why: beach moisture from water table reduces transport
  want: high
- factor: planet-factor.clim-storm
  weight: 1
  why: storm scarping and overwash set foredune back
  want: high
- factor: planet-factor.sea-level
  weight: 1
  why: rising sea level erodes; stable allows growth
  want: low
- factor: planet-factor.time
  weight: 1
  why: years to centuries
  want: high
  unresolved: true
  source: planet-forge docs/research/process-geomorphology-2026-10-24.md section 3.2 (unverified order-of-magnitude
    table; not a decay constant)
vocabulary_id: 145
sources:
- https://www.coastalwiki.org/wiki/Dune_development
- https://www.nps.gov/articles/sandy-coast-landforms.htm
- https://en.wikipedia.org/wiki/Dune
library_status: planned
source: aeolian.dune.coastal_foredune
levels:
- planet-level.100-km
- planet-level.10-km
basis:
- of:
  - factors
  - sources
  tier: derived
  note: 'planet-trees-pgs2 docs/landforms/deciding_factors.json: its factors in its words, its top three weighted
    3.'
- of:
  - when
  tier: invented
  review: true
  note: 'No hard conditions yet: planets to add them where a factor is a must (ice, sea, a volcano).'
- of:
  - factors.want
  - look
  tier: invented
  review: true
  source: planet-forge 3c40281 crates/viewer/src/rings/formations.rs factor_scores; crates/viewer/src/layers/features.rs
    arch_of
  note: Draft migration of viewer archetype mapping (including dendritic fallback) and preference-word inference,
    corrected to whole-word tokens and reviewed against supplied why text and existing signal direction. Ambiguous
    categorical, compound or nonmonotonic factors remain review-required; no band bounds invented. Consumers use
    explicit fields, never repeat prose/key inference.
- of:
  - factors.want
  tier: derived
  review: true
  source: Supplied factor why text and PlanetSim factor signal records; semantic correction 2026-10-22
  note: 'planet-factor.sed-supply: Sand supply supports growth; stable describes the coast, not low sediment supply.'
- of:
  - factors.classes
  - factors.required
  - factors.unresolved
  tier: derived
  source: planet-forge 18ef137 docs/research/category-intentions-2026-10-24.json
  note: Reviewed directed categorical intentions, with prerequisites separated from modifiers. Missing/proxy class
    evidence is not a verified physical classification; unresolved classes remain unknown.
status: draft
look: dunes
kinds:
- coastal-foredune
