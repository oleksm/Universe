identity:
  key: planet-pattern.aeolian.dune.transverse
  name: Transverse and barchanoid-ridge dunes
  about: Transverse and barchanoid-ridge dunes.
family: aeolian
factors:
- factor: planet-factor.clim-wind
  weight: 3
  why: unidirectional wind; crest perpendicular to it
- factor: planet-factor.sed-supply
  weight: 3
  why: abundant sand; barchans coalesce into ridges
- factor: planet-factor.clim-arid
  weight: 3
  why: arid inland or coastal with sparse vegetation
- factor: planet-factor.bio-veg
  weight: 1
  why: vegetation turns them into parabolic dunes
- factor: planet-factor.groundwater
  weight: 1
  why: high water table limits deflation, sets interdune floors (White Sands)
- factor: planet-factor.slope-relief
  weight: 1
  why: flat
- factor: planet-factor.time
  weight: 1
  why: 0.01-10 kyr; height-spacing grow with age
