identity:
  key: planet-object.suture
  name: Suture
  about: A piece of the line where two continents met.
scope: generator
about_model: 'Sutures stay in the crust after their collision: orogens, schist and granite cores, ophiolites are laid along them; weak zones where later rifts cut.'
extends: planet-object.record
generator: planet-process.vector-plates
geometry:
  kind: line
  frame: plate
attributes:
- name: plates
  meaning: the pair that met
- name: a, b
  meaning: its ends, the first plate's frame
- name: t
  unit: s
  meaning: when
dynamics:
- what: created
  how: at collision segments with continent on both sides
- what: moves
  how: rides the first plate
persistence:
  how: bytes
  table: vector-plates-world (SUTU)
code:
- type: Suture
  file: crates/tectonics/src/lib.rs
status: draft
basis:
- of:
  - identity
  - about_model
  - attributes
  - dynamics
  - persistence
  - code
  rule: rule.forge-types
