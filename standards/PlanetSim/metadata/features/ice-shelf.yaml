# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.ice-shelf
  name: Ice shelf
  about: Floating ice where a sheet flows out over the sea.
register: water
family: glacial
trigger: Floating thick glacial ice contiguous with a grounded glacier/sheet outlet, satisfying flotation against
  local water depth and ice/seawater densities. Require modeled ice transport or a shelf footprint; sea below an
  annual freezing temperature or sea ice cannot establish a glacial shelf. Apply finite-input, resolved-scale and
  candidate/provenance rules in docs/planet-feature-trigger-rules-2026-10-22.md; missing required evidence stays
  unknown, not a confirmed absence or occurrence.
trigger_params:
- name: ICE_DENSITY_KG_M3
  value: 917.0
  unit: kg/m3
  meaning: Provisional pure ice density for flotation screening; firn and salinity corrections unresolved.
  open: true
  used: false
  source: docs/planet-feature-trigger-rules-2026-10-22.md
  note: Proposed recognition setting, not a physical simulation retune; unused until a detector explicitly consumes
    this feature-local value. Values chosen for review unless the meaning identifies a definitional convention.
- name: SEAWATER_DENSITY_KG_M3
  value: 1025.0
  unit: kg/m3
  meaning: Provisional sea-water density for flotation screening, not a selected planet salinity.
  open: true
  used: false
  source: docs/planet-feature-trigger-rules-2026-10-22.md
  note: Proposed recognition setting, not a physical simulation retune; unused until a detector explicitly consumes
    this feature-local value. Values chosen for review unless the meaning identifies a definitional convention.
built: false
applies_to:
- oceans
status: draft
description: Floating ice where a sheet flows out over the sea.
size:
  across_m:
  - 10000.0
  - 1000000.0
  basis:
  - of:
    - across_m
    tier: invented
    review: true
    source: planet-forge 3c40281 docs/catalogue/kinds.py
    note: Supplied rough Earth size range in the catalogue draft; not a measured or validated range.
ladder:
- planet-level.10000-km
- planet-level.10-km
basis:
- of:
  - identity
  - register
  - family
  - description
  tier: sourced
  source: planet-forge 3c40281 docs/catalogue/kinds.py
  note: Transcribed proposed catalogue definition; not a claim of simulator implementation.
- of:
  - ladder
  tier: derived
  source: planet-forge 3c40281 docs/catalogue/kinds.py
  note: Derived from the proposed size range using the eight numeric bands; inherits size review.
- of:
  - trigger
  - trigger_params
  tier: invented
  review: true
  source: docs/planet-feature-trigger-rules-2026-10-22.md
  note: Owner-authorized detector proposal. Qualitative source definitions and provisional screening constants are
    distinguished in the source; not a built generator or calibrated occurrence rate. Missing support and subcell
    geometry remain unresolved.
