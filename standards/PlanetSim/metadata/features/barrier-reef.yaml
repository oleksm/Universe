# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.barrier-reef
  name: Barrier reef
  about: 'A relief feature of the coastal family: barrier reef.'
register: feature
family: coastal
geometry: polyline
properties:
- field: distance offshore
  unit: m
trigger: warm sea, subsiding margin
generator: offshore line
overrides: drowning
wave: 2
built: false
levels:
- planet-level.10000-km
- planet-level.1000-km
applies_to:
- oceans
status: draft
basis:
- of:
  - identity
  - register
  - family
  - geometry
  - properties
  - trigger
  - generator
  - overrides
  - wave
  - built
  rule: rule.feature-relief-catalogue
- of:
  - layout
  rule: rule.relief-tectonic-port
layout:
- name: frame
  params:
  - name: rides
    value: 0.0
