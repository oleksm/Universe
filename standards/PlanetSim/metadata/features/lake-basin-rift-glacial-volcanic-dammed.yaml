# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.lake-basin-rift-glacial-volcanic-dammed
  name: Lake basin (rift / glacial / volcanic / dammed)
  about: 'A relief feature of the lacustrine family: lake basin (rift / glacial / volcanic / dammed).'
register: feature
family: lacustrine
geometry: polygon + rings
properties:
- field: level
  unit: m
- field: depth
  unit: m
- field: origin
  unit: class
trigger: lake records
generator: outline and rings at each level
overrides: drying -> former lake bed
wave: 1
built: true
levels:
- planet-level.10000-km
- planet-level.1000-km
applies_to:
- liquid_water_now
status: draft
basis:
- of:
  - identity
  - register
  - family
  - geometry
  - properties
  - trigger
  - generator
  - overrides
  - wave
  - built
  rule: rule.feature-relief-catalogue
- of:
  - layout
  rule: rule.relief-tectonic-port
layout:
- name: frame
  unit: '1'
  meaning: '1: its pins sit in its plate''s frame (integer cm) and ride the crust, placed by planet-field.plate-rotation;
    0: a body-frame snapshot, remade from the present state each pass'
  rule: it is the present state of an agent (water, sea, wind, the plates' meeting), remade each pass
  params:
  - name: rides
    value: 0.0
    unit: '1'
    meaning: 1 rides, 0 snapshot
    source: 'planet-forge src/ride.rs (from the Python: stages/lines.py Store vs its rivers and coast)'
    open: true
