# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.glacial-trough-u-valley
  name: Glacial trough (U valley)
  about: 'A relief feature of the glacial family: glacial trough (U valley).'
register: feature
family: glacial
geometry: polyline + width
properties:
- field: depth
  unit: m
- field: floor width
  unit: m
- field: overdeepening
  unit: m
trigger: glacial erosion along a valley
generator: the valley overprinted to U
wave: 1
built: false
levels:
- planet-level.10000-km
- planet-level.1000-km
applies_to:
- any_air
status: draft
basis:
- of:
  - identity
  - register
  - family
  - geometry
  - properties
  - trigger
  - generator
  - overrides
  - wave
  - built
  rule: rule.feature-relief-catalogue
- of:
  - layout
  rule: rule.relief-tectonic-port
layout:
- name: frame
  params:
  - name: rides
    value: 1.0
