trigger: Curved chain of emergent volcanic islands above a coherent ocean-ocean subduction system, tied to one trench/arc
  polarity and active or explicitly relict arc history. Preserve member IDs and gaps; a hotspot island chain or
  arbitrary proximity cluster is not an island arc. Apply finite-input, resolved-scale and candidate/provenance
  rules in docs/planet-feature-trigger-rules-2026-10-22.md; missing required evidence stays unknown, not a confirmed
  absence or occurrence.
trigger_params:
- name: ISLAND_GROUP_GAP_M
