# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.continental-rift-zone
  name: Continental rift zone
  about: 'The area of a continental rift: floors, shoulders, faults and volcanoes together.'
register: province
family: tectonic
trigger: Connected extension belt within continental crust with positive relative divergence, normal-fault/graben/rift-margin
  history and compatible thinning. Trace actual rift geometry; a low valley or young rock without extension evidence
  is not a continental rift. Apply finite-input, resolved-scale and candidate/provenance rules in docs/planet-feature-trigger-rules-2026-10-22.md;
  missing required evidence stays unknown, not a confirmed absence or occurrence.
trigger_params:
- name: BOUNDARY_SPEED_MIN_M_S
  value: 3.168808781402895e-11
  unit: m/s
  meaning: Relative normal/tangential motion screening of1mm/yr, chosen numerical activity threshold.
  open: true
  used: false
  source: docs/planet-feature-trigger-rules-2026-10-22.md
  note: Proposed recognition setting, not a physical simulation retune; unused until a detector explicitly consumes
    this feature-local value. Values chosen for review unless the meaning identifies a definitional convention.
- name: TECTONIC_REACH_M
  value: 250000.0
  unit: m
  meaning: Regional maximum association distance to actual boundary geometry; not a claim of uniform boundary width.
  open: true
  used: false
  source: docs/planet-feature-trigger-rules-2026-10-22.md
  note: Proposed recognition setting, not a physical simulation retune; unused until a detector explicitly consumes
    this feature-local value. Values chosen for review unless the meaning identifies a definitional convention.
built: false
status: draft
description: 'The area of a continental rift: floors, shoulders, faults and volcanoes together.'
size:
  across_m:
  - 50000.0
  - 3000000.0
  basis:
  - of:
    - across_m
    tier: invented
    review: true
    source: planet-forge 3c40281 docs/catalogue/kinds.py
    note: Supplied rough Earth size range in the catalogue draft; not a measured or validated range.
ladder:
- planet-level.10000-km
- planet-level.100-km
basis:
- of:
  - identity
  - register
  - family
  - description
  tier: sourced
  source: planet-forge 3c40281 docs/catalogue/kinds.py
  note: Transcribed proposed catalogue definition; not a claim of simulator implementation.
- of:
  - ladder
  tier: derived
  source: planet-forge 3c40281 docs/catalogue/kinds.py
  note: Derived from the proposed size range using the eight numeric bands; inherits size review.
- of:
  - trigger
  - trigger_params
  tier: invented
  review: true
  source: docs/planet-feature-trigger-rules-2026-10-22.md
