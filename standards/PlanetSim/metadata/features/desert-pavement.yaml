# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.desert-pavement
  name: Desert pavement
  about: 'A relief feature of the arid family: desert pavement.'
register: feature
family: arid
geometry: polygon
properties:
- field: area
  unit: m2
trigger: deflation of fine grains
generator: area
wave: 3
built: false
levels:
- planet-level.10-km
- planet-level.1-km
applies_to:
- any_air
status: draft
basis:
- of:
  - identity
  - register
  - family
  - geometry
  - properties
  - trigger
  - generator
  - overrides
  - wave
  - built
  rule: rule.feature-relief-catalogue
- of:
  - layout
  rule: rule.relief-tectonic-port
layout:
- name: frame
  params:
  - name: rides
    value: 1.0
