# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.abyssal-plain
  name: Abyssal plain
  about: The flat deep ocean floor, 4 to 6 km down, buried by fine sediment.
register: province
family: marine
trigger: Connected deep oceanic floor with depth >= ABYSSAL_DEPTH_MIN_M, local slope <= ABYSSAL_SLOPE_MAX and relief
  <= PLAIN_RELIEF_MAX_M, excluding trench/ridge/seamount footprints. Sediment infill is supporting evidence; depth
  alone never makes a plain. Apply finite-input, resolved-scale and candidate/provenance rules in docs/planet-feature-trigger-rules-2026-10-22.md;
  missing required evidence stays unknown, not a confirmed absence or occurrence.
trigger_params:
- name: ABYSSAL_DEPTH_MIN_M
  value: 3000.0
  unit: m
  meaning: Depth candidate threshold, never sufficient without marine morphology; chosen.
  open: true
  used: false
  source: docs/planet-feature-trigger-rules-2026-10-22.md
  note: Proposed recognition setting, not a physical simulation retune; unused until a detector explicitly consumes
    this feature-local value. Values chosen for review unless the meaning identifies a definitional convention.
- name: ABYSSAL_SLOPE_MAX
  value: 0.005
  unit: '1'
  meaning: Rise/run upper bound for deep-plain screening; chosen.
  open: true
  used: false
  source: docs/planet-feature-trigger-rules-2026-10-22.md
  note: Proposed recognition setting, not a physical simulation retune; unused until a detector explicitly consumes
    this feature-local value. Values chosen for review unless the meaning identifies a definitional convention.
- name: PLAIN_RELIEF_MAX_M
  value: 100.0
  unit: m
  meaning: Maximum relief over resolved context for plain candidates; chosen.
  open: true
  used: false
  source: docs/planet-feature-trigger-rules-2026-10-22.md
  note: Proposed recognition setting, not a physical simulation retune; unused until a detector explicitly consumes
    this feature-local value. Values chosen for review unless the meaning identifies a definitional convention.
built: false
status: draft
description: The flat deep ocean floor, 4 to 6 km down, buried by fine sediment.
size:
  across_m:
  - 100000.0
  - 3000000.0
  basis:
  - of:
    - across_m
    tier: invented
    review: true
    source: planet-forge 3c40281 docs/catalogue/kinds.py
    note: Supplied rough Earth size range in the catalogue draft; not a measured or validated range.
ladder:
- planet-level.10000-km
- planet-level.100-km
basis:
- of:
  - identity
  - register
  - family
  - description
  tier: sourced
  source: planet-forge 3c40281 docs/catalogue/kinds.py
  note: Transcribed proposed catalogue definition; not a claim of simulator implementation.
- of:
  - ladder
  tier: derived
  source: planet-forge 3c40281 docs/catalogue/kinds.py
  note: Derived from the proposed size range using the eight numeric bands; inherits size review.
- of:
  - trigger
  - trigger_params
  tier: invented
  review: true
  source: docs/planet-feature-trigger-rules-2026-10-22.md
  note: Owner-authorized detector proposal. Qualitative source definitions and provisional screening constants are
    distinguished in the source; not a built generator or calibrated occurrence rate. Missing support and subcell
    geometry remain unresolved.
