# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.megaflood-scabland
  name: Megaflood scabland
  about: 'A relief landmark of the fluvial family: megaflood scabland.'
register: landmark
family: fluvial
geometry: polygon + channels
properties:
- field: discharge
  unit: m3/s
- field: scour depth
  unit: m
trigger: ice-dammed lake failure
generator: channels down the routing
wave: 2
built: false
levels:
- planet-level.10000-km
- planet-level.1000-km
applies_to:
- wet_epoch
status: draft
basis:
- of:
  - identity
  - register
  - family
  - geometry
  - properties
  - trigger
  - generator
  - overrides
  - wave
  - built
  rule: rule.feature-relief-catalogue
- of:
  - layout
  rule: rule.relief-tectonic-port
layout:
- name: frame
  params:
  - name: rides
    value: 1.0
