# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.carbonate-platform
  name: Carbonate platform
  about: 'A relief province of the coastal family: carbonate platform.'
register: province
family: coastal
geometry: polygon
properties:
- field: area
  unit: m2
trigger: warm shallow sea, little sediment
generator: area
wave: 2
built: false
levels:
- planet-level.10000-km
- planet-level.1000-km
applies_to:
- oceans
status: draft
basis:
- of:
  - identity
  - register
  - family
  - geometry
  - properties
  - trigger
  - generator
  - overrides
  - wave
  - built
  rule: rule.feature-relief-catalogue
- of:
  - layout
  rule: rule.relief-tectonic-port
layout:
- name: frame
  params:
  - name: rides
    value: 0.0
