# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.offset-stream
  name: Offset stream
  about: 'A relief feature of the tectonic family: offset stream.'
register: feature
family: tectonic
geometry: point + polyline
properties:
- field: offset
  unit: m
trigger: river crossing a transform
generator: bend where the river crosses
wave: 2
built: false
levels:
- planet-level.100-km
status: draft
basis:
- of:
  - identity
  - register
  - family
  - geometry
  - properties
  - trigger
  - generator
  - overrides
  - wave
  - built
  rule: rule.feature-relief-catalogue
- of:
  - layout
  rule: rule.relief-tectonic-port
layout:
- name: frame
  params:
  - name: rides
    value: 1.0
