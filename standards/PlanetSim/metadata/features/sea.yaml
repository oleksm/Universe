# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.sea
  name: Sea
  about: A named part of the ocean, partly enclosed.
register: water
family: marine
trigger: Marine water child region of an ocean, delineated by explicit enclosing coast, sill/strait or named geological
  basin boundaries. Its water stays connected to the ocean; otherwise classify as a lake, and do not assign names
  or split equal-area patches to manufacture seas. Apply finite-input, resolved-scale and candidate/provenance rules
  in docs/planet-feature-trigger-rules-2026-10-22.md; missing required evidence stays unknown, not a confirmed absence
  or occurrence.
trigger_params:
- name: SEA_GATE_WIDTH_MAX_M
  value: 300000.0
  unit: m
  meaning: Gateway width search convention for semi-enclosed sea candidates; explicit enclosure still required.
  open: true
  used: false
  source: docs/planet-feature-trigger-rules-2026-10-22.md
  note: Proposed recognition setting, not a physical simulation retune; unused until a detector explicitly consumes
    this feature-local value. Values chosen for review unless the meaning identifies a definitional convention.
built: false
applies_to:
- oceans
status: draft
description: A named part of the ocean, partly enclosed.
size:
  across_m:
  - 100000.0
  - 3000000.0
  basis:
  - of:
    - across_m
    tier: invented
    review: true
    source: planet-forge 3c40281 docs/catalogue/kinds.py
    note: Supplied rough Earth size range in the catalogue draft; not a measured or validated range.
ladder:
- planet-level.10000-km
- planet-level.100-km
basis:
- of:
  - identity
  - register
  - family
  - description
  tier: sourced
  source: planet-forge 3c40281 docs/catalogue/kinds.py
  note: Transcribed proposed catalogue definition; not a claim of simulator implementation.
- of:
  - ladder
  tier: derived
  source: planet-forge 3c40281 docs/catalogue/kinds.py
  note: Derived from the proposed size range using the eight numeric bands; inherits size review.
- of:
  - trigger
  - trigger_params
  tier: invented
  review: true
  source: docs/planet-feature-trigger-rules-2026-10-22.md
  note: Owner-authorized detector proposal. Qualitative source definitions and provisional screening constants are
    distinguished in the source; not a built generator or calibrated occurrence rate. Missing support and subcell
    geometry remain unresolved.
