# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.peak
  name: Peak
  about: 'A summit: a local high point with its prominence and isolation.'
register: landmark
family: orographic
trigger: Local topographic maximum with prominence >= PEAK_PROMINENCE_MIN_M above its key col within a declared
  regional search, deduplicated by summit basin. Preserve summit and key-col heights, prominence, local spacing
  and boundary uncertainty; one regional maximum is not every unresolved summit on a coarse lattice. Apply finite-input,
  resolved-scale and candidate/provenance rules in docs/planet-feature-trigger-rules-2026-10-22.md; missing required
  evidence stays unknown, not a confirmed absence or occurrence.
trigger_params:
- name: PEAK_PROMINENCE_MIN_M
  value: 300.0
  unit: m
  meaning: Regional summit/key-col prominence catalogue screen; chosen.
  open: true
  used: true
  source: docs/planet-feature-trigger-rules-2026-10-22.md
  note: Proposed recognition setting, not a physical simulation retune; unused until a detector explicitly consumes
    this feature-local value. Values chosen for review unless the meaning identifies a definitional convention.
    Read by planet-forge c20fe5f relief-landscape; consulted does not mean calibrated, sole effective threshold
    or full trigger implementation.
- name: TERRAIN_CONTEXT_RADIUS_M
  value: 200000.0
  unit: m
  meaning: Declared regional terrain context, not resolution of subcell summits or passes; chosen.
  open: true
  used: false
  source: docs/planet-feature-trigger-rules-2026-10-22.md
  note: Proposed recognition setting, not a physical simulation retune; unused until a detector explicitly consumes
    this feature-local value. Values chosen for review unless the meaning identifies a definitional convention.
built: false
status: draft
description: 'A summit: a local high point with its prominence and isolation.'
size:
  across_m:
  - 100
  - 50000.0
  basis:
  - of:
    - across_m
    tier: invented
    review: true
    source: planet-forge 3c40281 docs/catalogue/kinds.py
    note: Supplied rough Earth size range in the catalogue draft; not a measured or validated range.
ladder:
- planet-level.1000-km
- planet-level.100-m
basis:
- of:
  - identity
  - register
  - family
  - description
  tier: sourced
  source: planet-forge 3c40281 docs/catalogue/kinds.py
  note: 'Transcribed proposed catalogue definition; not a claim of simulator implementation. Catalogue note:
    L3 orometry; new family orographic'
- of:
  - ladder
  tier: derived
  source: planet-forge 3c40281 docs/catalogue/kinds.py
  note: Derived from the proposed size range using the eight numeric bands; inherits size review.
- of:
  - trigger
  - trigger_params
  tier: invented
  review: true
  source: docs/planet-feature-trigger-rules-2026-10-22.md
  note: Owner-authorized detector proposal. Qualitative source definitions and provisional screening constants are
    distinguished in the source; not a built generator or calibrated occurrence rate. Missing support and subcell
    geometry remain unresolved.
