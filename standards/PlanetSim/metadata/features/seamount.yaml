# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.seamount
  name: Seamount
  about: An undersea volcano rising 1 km or more from the floor.
register: feature
family: marine
trigger: Isolated submerged volcanic topographic high on oceanic floor, with base-to-summit relief >= SEAMOUNT_RELIEF_MIN_M
  and a closed local base contour, separated from active ridge/continental slope. Require volcanic or edifice-origin
  evidence; preserve lower unresolved highs as candidates instead of changing the threshold with sample spacing.
  Apply finite-input, resolved-scale and candidate/provenance rules in docs/planet-feature-trigger-rules-2026-10-22.md;
  missing required evidence stays unknown, not a confirmed absence or occurrence.
trigger_params:
- name: SEAMOUNT_RELIEF_MIN_M
  value: 1000.0
  unit: m
  meaning: Catalogue screen for a resolved isolated marine volcanic high; smaller knolls remain distinct.
  open: false
  used: true
  source: https://portal.iho.int/iho-ohi/S32/engView.php?page=231
  note: Verified naming/definition convention; not sufficient alone for recognition. Requires full trigger evidence
    and declared area/relief/ground-temperature convention. SI duration uses a Julian year of31557600s.
built: false
status: draft
description: An undersea volcano rising 1 km or more from the floor.
size:
  across_m:
  - 1000.0
  - 100000.0
  basis:
  - of:
    - across_m
    tier: invented
    review: true
    source: planet-forge 3c40281 docs/catalogue/kinds.py
    note: Supplied rough Earth size range in the catalogue draft; not a measured or validated range.
ladder:
- planet-level.10000-km
- planet-level.1-km
basis:
- of:
  - identity
  - register
  - family
  - description
  tier: sourced
  source: planet-forge 3c40281 docs/catalogue/kinds.py
  note: Transcribed proposed catalogue definition; not a claim of simulator implementation.
- of:
  - ladder
  tier: derived
  source: planet-forge 3c40281 docs/catalogue/kinds.py
  note: Derived from the proposed size range using the eight numeric bands; inherits size review.
- of:
  - trigger
  - trigger_params
  tier: invented
  review: true
  source: docs/planet-feature-trigger-rules-2026-10-22.md
  note: Owner-authorized detector proposal. Qualitative source definitions and provisional screening constants are
    distinguished in the source; not a built generator or calibrated occurrence rate. Missing support and subcell
    geometry remain unresolved.
- of:
  - trigger_params.SEAMOUNT_RELIEF_MIN_M
  tier: sourced
  source: https://portal.iho.int/iho-ohi/S32/engView.php?page=231
  note: Verified definition only; does not source unrelated screening parameters, air-temperature proxies, origin
    or morphology.
