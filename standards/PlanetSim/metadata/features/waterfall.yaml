# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.waterfall
  name: Waterfall
  about: A river dropping over a ledge (Victoria Falls).
register: landmark
family: fluvial
trigger: A resolved flowing river reach with abrupt drop >= WATERFALL_DROP_MIN_M over along-channel distance <=
  WATERFALL_LENGTH_MAX_M and discharge >= RIVER_Q_MIN_M3_S, supported by a local channel profile/rock step. A single
  coarse receiver drop is a knickzone candidate, not a resolved waterfall. Apply finite-input, resolved-scale and
  candidate/provenance rules in docs/planet-feature-trigger-rules-2026-10-22.md; missing required evidence stays
  unknown, not a confirmed absence or occurrence.
trigger_params:
- name: WATERFALL_DROP_MIN_M
  value: 10.0
  unit: m
  meaning: Minimum resolved abrupt channel drop for a waterfall candidate; chosen.
  open: true
  used: false
  source: docs/planet-feature-trigger-rules-2026-10-22.md
  note: Proposed recognition setting, not a physical simulation retune; unused until a detector explicitly consumes
    this feature-local value. Values chosen for review unless the meaning identifies a definitional convention.
- name: WATERFALL_LENGTH_MAX_M
  value: 1000.0
  unit: m
  meaning: Maximum along-channel length of a resolved waterfall step; coarse lattice drops remain unresolved.
  open: true
  used: false
  source: docs/planet-feature-trigger-rules-2026-10-22.md
  note: Proposed recognition setting, not a physical simulation retune; unused until a detector explicitly consumes
    this feature-local value. Values chosen for review unless the meaning identifies a definitional convention.
- name: RIVER_Q_MIN_M3_S
  value: 10.0
  unit: m3/s
  meaning: Resolved coarse river-network discharge threshold; chosen, not a physical minimum river flow.
  open: true
  used: false
  source: docs/planet-feature-trigger-rules-2026-10-22.md
  note: Proposed recognition setting, not a physical simulation retune; unused until a detector explicitly consumes
    this feature-local value. Values chosen for review unless the meaning identifies a definitional convention.
built: false
status: draft
description: A river dropping over a ledge (Victoria Falls).
size:
  across_m:
  - 5
  - 2000.0
  basis:
  - of:
    - across_m
    tier: invented
    review: true
    source: planet-forge 3c40281 docs/catalogue/kinds.py
    note: Supplied rough Earth size range in the catalogue draft; not a measured or validated range.
ladder:
- planet-level.100-km
- planet-level.10-m
basis:
- of:
  - identity
  - register
  - family
  - description
  tier: sourced
  source: planet-forge 3c40281 docs/catalogue/kinds.py
  note: 'Transcribed proposed catalogue definition; not a claim of simulator implementation. Catalogue note:
    landmark view of knickpoint-waterfall'
- of:
  - ladder
  tier: derived
  source: planet-forge 3c40281 docs/catalogue/kinds.py
  note: Derived from the proposed size range using the eight numeric bands; inherits size review.
- of:
  - trigger
  - trigger_params
  tier: invented
  review: true
  source: docs/planet-feature-trigger-rules-2026-10-22.md
  note: Owner-authorized detector proposal. Qualitative source definitions and provisional screening constants are
    distinguished in the source; not a built generator or calibrated occurrence rate. Missing support and subcell
    geometry remain unresolved.
