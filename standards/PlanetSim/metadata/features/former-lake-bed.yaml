# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.former-lake-bed
  name: Former lake bed
  about: 'A relief landmark of the lacustrine family: former lake bed.'
register: landmark
family: lacustrine
geometry: polygon
properties:
- field: shore height
  unit: m
trigger: a lake dried
generator: record + floor
wave: 1
built: true
landmark: planet-landmark.former-lake-bed
levels:
- planet-level.10000-km
- planet-level.1000-km
applies_to:
- wet_epoch
status: draft
basis:
- of:
  - identity
  - register
  - family
  - geometry
  - properties
  - trigger
  - generator
  - overrides
  - wave
  - built
  rule: rule.feature-relief-catalogue
- of:
  - layout
  rule: rule.relief-tectonic-port
layout:
- name: frame
  params:
  - name: rides
    value: 1.0
- name: record from
  unit: s
  meaning: 'recorded only while the planet is within this of its present: one older would be worn away by today, never made'
  rule: 'within its decay age (owner, 17 Oct 2026: "start models that make sense within their decay age")'
  formula: record while age_today - t <= RECORD_FROM_MYR
  params:
  - name: RECORD_FROM_MYR
    value: 2.209032e+16
    unit: s
    said_as:
      unit: Myr
      factor: 31557600000000.0
    meaning: its decay age before the present
    source: stages/relief.py:59 RECORD_FROM_MYR['water']
    open: true
