# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.karst-plateau
  name: Karst plateau
  about: 'A relief province of the karst family: karst plateau.'
register: province
family: karst
geometry: polygon
properties:
- field: doline density
  unit: 1/km2
trigger: limestone + rain > 0.8 m/yr
generator: area
wave: 2
built: false
levels:
- planet-level.100-km
applies_to:
- liquid_water_now
status: draft
basis:
- of:
  - identity
  - register
  - family
  - geometry
  - properties
  - trigger
  - generator
  - overrides
  - wave
  - built
  rule: rule.feature-relief-catalogue
- of:
  - layout
  rule: rule.relief-tectonic-port
layout:
- name: frame
  params:
  - name: rides
    value: 1.0
