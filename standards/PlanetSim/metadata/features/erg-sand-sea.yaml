# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.erg-sand-sea
  name: Erg (sand sea)
  about: 'A relief province of the aeolian family: erg (sand sea).'
register: province
family: aeolian
geometry: polygon
properties:
- field: area
  unit: m2
trigger: aridity > 5 + sand supply
generator: area
wave: 2
built: false
levels:
- planet-level.100-km
applies_to:
- any_air
status: draft
basis:
- of:
  - identity
  - register
  - family
  - geometry
  - properties
  - trigger
  - generator
  - overrides
  - wave
  - built
  rule: rule.feature-relief-catalogue
- of:
  - layout
  rule: rule.relief-tectonic-port
layout:
- name: frame
  params:
  - name: rides
    value: 0.0
