# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.desert-margin
  name: Desert margin
  about: The edge where steppe or savanna gives way to desert.
register: cover
family: biotic
trigger: Boundary of adjacent resolved desert and nondesert land cover, with phi crossing DESERT_PHI_MIN. Use the
  actual classified polygons or interpolated shared-edge contour with a bounded transition width; never make an
  arbitrary straight latitude band or a second primary cover over both sides. Apply finite-input, resolved-scale
  and candidate/provenance rules in docs/planet-feature-trigger-rules-2026-10-22.md; missing required evidence stays
  unknown, not a confirmed absence or occurrence.
trigger_params:
- name: DESERT_PHI_MIN
  value: 5.0
  unit: '1'
  meaning: PET/P threshold for a dry-climate desert candidate; chosen, not a universal biome law.
  open: true
  used: false
  source: docs/planet-feature-trigger-rules-2026-10-22.md
  note: Proposed recognition setting, not a physical simulation retune; unused until a detector explicitly consumes
    this feature-local value. Values chosen for review unless the meaning identifies a definitional convention.
- name: EDGE_WIDTH_M
  value: 10000.0
  unit: m
  meaning: Presentation transition width around a resolved edge, not evidence of its positional accuracy; capped
    by feature width.
  open: true
  used: false
  source: docs/planet-feature-trigger-rules-2026-10-22.md
  note: Proposed recognition setting, not a physical simulation retune; unused until a detector explicitly consumes
    this feature-local value. Values chosen for review unless the meaning identifies a definitional convention.
built: false
status: draft
description: The edge where steppe or savanna gives way to desert.
size:
  across_m:
  - 10000.0
  - 10000000.0
  basis:
  - of:
    - across_m
    tier: invented
    review: true
    source: planet-forge 3c40281 docs/catalogue/kinds.py
    note: Supplied rough Earth size range in the catalogue draft; not a measured or validated range.
ladder:
- planet-level.10000-km
- planet-level.10-km
basis:
- of:
  - identity
  - register
  - family
  - description
  tier: sourced
  source: planet-forge 3c40281 docs/catalogue/kinds.py
  note: Transcribed proposed catalogue definition; not a claim of simulator implementation.
- of:
  - ladder
  tier: derived
  source: planet-forge 3c40281 docs/catalogue/kinds.py
  note: Derived from the proposed size range using the eight numeric bands; inherits size review.
- of:
  - trigger
  - trigger_params
  tier: invented
  review: true
  source: docs/planet-feature-trigger-rules-2026-10-22.md
  note: Owner-authorized detector proposal. Qualitative source definitions and provisional screening constants are
    distinguished in the source; not a built generator or calibrated occurrence rate. Missing support and subcell
    geometry remain unresolved.
