# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.mesa
  name: Mesa
  about: 'A relief feature of the structural family: mesa.'
register: feature
family: structural
geometry: polygon
properties:
- field: caprock height
  unit: m
- field: area
  unit: m2
trigger: flat strata + arid + uplift
generator: caprock left between canyons
overrides: shrink
wave: 3
built: false
levels:
- planet-level.100-km
status: draft
basis:
- of:
  - identity
  - register
  - family
  - geometry
  - properties
  - trigger
  - generator
  - overrides
  - wave
  - built
  rule: rule.feature-relief-catalogue
- of:
  - layout
  rule: rule.relief-tectonic-port
layout:
- name: frame
  params:
  - name: rides
    value: 1.0
