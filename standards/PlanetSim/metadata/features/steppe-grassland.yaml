# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.steppe-grassland
  name: Steppe grassland
  about: Treeless grassland, semi-arid.
register: cover
family: biotic
trigger: Non-tropical, non-icy land with moderate moisture deficit and grass-dominated open cover. T < TROPICAL_MEAN_MIN_K
  and phi in [STEPPE_PHI_MIN, DESERT_PHI_MIN) defines a provisional climate-potential mask; exclude supported woody
  forest, wetland and exposed substrate before assigning actual grassland. Apply finite-input, resolved-scale and
  candidate/provenance rules in docs/planet-feature-trigger-rules-2026-10-22.md; missing required evidence stays
  unknown, not a confirmed absence or occurrence.
trigger_params:
- name: TROPICAL_MEAN_MIN_K
  value: 291.15
  unit: K
  meaning: Annual-mean warm-climate proxy only; not the monthly tropical climate criterion.
  open: true
  used: false
  source: docs/planet-feature-trigger-rules-2026-10-22.md
  note: Proposed recognition setting, not a physical simulation retune; unused until a detector explicitly consumes
    this feature-local value. Values chosen for review unless the meaning identifies a definitional convention.
- name: STEPPE_PHI_MIN
  value: 2.0
  unit: '1'
  meaning: Provisional PET/P lower water-limitation bound for non-tropical steppe suitability; chosen.
  open: true
  used: false
  source: docs/planet-feature-trigger-rules-2026-10-22.md
  note: Proposed recognition setting, not a physical simulation retune; unused until a detector explicitly consumes
    this feature-local value. Values chosen for review unless the meaning identifies a definitional convention.
- name: DESERT_PHI_MIN
  value: 5.0
  unit: '1'
  meaning: PET/P threshold for a dry-climate desert candidate; chosen, not a universal biome law.
  open: true
  used: false
  source: docs/planet-feature-trigger-rules-2026-10-22.md
  note: Proposed recognition setting, not a physical simulation retune; unused until a detector explicitly consumes
    this feature-local value. Values chosen for review unless the meaning identifies a definitional convention.
built: false
status: draft
description: Treeless grassland, semi-arid.
size:
  across_m:
  - 10000.0
  - 5000000.0
  basis:
  - of:
    - across_m
    tier: invented
    review: true
    source: planet-forge 3c40281 docs/catalogue/kinds.py
    note: Supplied rough Earth size range in the catalogue draft; not a measured or validated range.
ladder:
- planet-level.10000-km
- planet-level.10-km
basis:
- of:
