  name: Ice-wedge polygons
  about: 'A relief feature of the periglacial family: ice-wedge polygons.'
register: feature
family: periglacial
geometry: polygon
properties:
- field: polygon size
  unit: m
trigger: permafrost
generator: area
wave: 3
built: false
levels:
- planet-level.10-km
- planet-level.1-km
applies_to:
- any_air
status: draft
basis:
- of:
  - identity
  - register
  - family
  - geometry
  - properties
  - trigger
  - generator
  - overrides
  - wave
  - built
  rule: rule.feature-relief-catalogue
- of:
  - layout
  rule: rule.relief-tectonic-port
layout:
- name: frame
  params:
  - name: rides
    value: 1.0
