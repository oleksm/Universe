# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.tributary-network
  name: Tributary network
  about: 'A relief feature of the fluvial family: tributary network.'
register: feature
family: fluvial
geometry: network
properties:
- field: Strahler order
- field: junction angle
  unit: deg
trigger: routing, Q > 100 m3/s
generator: river lines with order
overrides: capture
wave: 1
built: false
levels:
- planet-level.10000-km
- planet-level.1000-km
applies_to:
- liquid_water_now
status: draft
basis:
- of:
  - identity
  - register
  - family
  - geometry
  - properties
  - trigger
  - generator
  - overrides
  - wave
  - built
  rule: rule.feature-relief-catalogue
- of:
  - layout
  rule: rule.relief-tectonic-port
layout:
- name: frame
  params:
  - name: rides
    value: 0.0
