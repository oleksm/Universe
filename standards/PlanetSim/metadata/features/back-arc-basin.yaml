# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.back-arc-basin
  name: Back arc basin
  about: A basin opened behind a volcanic arc by the subducting plate pulling back.
register: province
family: marine
trigger: Marine basin behind an active island/continental volcanic arc on its overriding plate, with extension or
  young oceanic crust tied to that arc. Determine back side from trench/arc polarity and relative plate motion,
  not compass direction or distance to a volcano alone. Apply finite-input, resolved-scale and candidate/provenance
  rules in docs/planet-feature-trigger-rules-2026-10-22.md; missing required evidence stays unknown, not a confirmed
  absence or occurrence.
trigger_params:
- name: TECTONIC_REACH_M
  value: 250000.0
  unit: m
  meaning: Regional maximum association distance to actual boundary geometry; not a claim of uniform boundary width.
  open: true
  used: false
  source: docs/planet-feature-trigger-rules-2026-10-22.md
  note: Proposed recognition setting, not a physical simulation retune; unused until a detector explicitly consumes
    this feature-local value. Values chosen for review unless the meaning identifies a definitional convention.
- name: YOUNG_OCEAN_AGE_MAX_S
  value: 631152000000000.0
  unit: s
  meaning: Young seafloor screening age; active boundary evidence remains required.
  open: true
  used: false
  source: docs/planet-feature-trigger-rules-2026-10-22.md
  note: Proposed recognition setting, not a physical simulation retune; unused until a detector explicitly consumes
    this feature-local value. Values chosen for review unless the meaning identifies a definitional convention.
built: false
status: draft
