# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.wind-gap
  name: Wind gap
  about: 'A relief feature of the fluvial family: wind gap.'
register: feature
family: fluvial
geometry: point
properties:
- field: depth
  unit: m
trigger: capture leaves a gap dry
generator: record
wave: 2
built: false
levels:
- planet-level.10000-km
- planet-level.1000-km
applies_to:
- wet_epoch
status: draft
basis:
- of:
  - identity
  - register
  - family
  - geometry
  - properties
  - trigger
  - generator
  - overrides
  - wave
  - built
  rule: rule.feature-relief-catalogue
- of:
  - layout
  rule: rule.relief-tectonic-port
layout:
- name: frame
  params:
  - name: rides
    value: 0.0
