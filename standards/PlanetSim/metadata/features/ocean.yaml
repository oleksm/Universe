# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.ocean
  name: Ocean
  about: The connected salt water over the ocean basins, its level the sea level.
register: water
family: marine
trigger: Principal marine-connected surface-water component at current sea level, seeded from a declared ocean basin
  and excluding inland lake components. Record connected water area and physical coastline; separate named seas
  by explicit child boundaries, not a global sample-count threshold. Apply finite-input, resolved-scale and candidate/provenance
  rules in docs/planet-feature-trigger-rules-2026-10-22.md; missing required evidence stays unknown, not a confirmed
  absence or occurrence.
trigger_params:
- name: WATER_DEPTH_MIN_M
  value: 0.1
  unit: m
  meaning: Numerical nonzero water-depth threshold for connected water bodies; chosen.
  open: true
  used: false
  source: docs/planet-feature-trigger-rules-2026-10-22.md
  note: Proposed recognition setting, not a physical simulation retune; unused until a detector explicitly consumes
    this feature-local value. Values chosen for review unless the meaning identifies a definitional convention.
built: false
applies_to:
- oceans
status: draft
description: The connected salt water over the ocean basins, its level the sea level.
size:
  across_m:
  - 3000000.0
  - 20000000.0
  basis:
  - of:
    - across_m
    tier: invented
    review: true
    source: planet-forge 3c40281 docs/catalogue/kinds.py
    note: Supplied rough Earth size range in the catalogue draft; not a measured or validated range.
ladder:
- planet-level.10000-km
- planet-level.10000-km
basis:
- of:
  - identity
  - register
  - family
  - description
  tier: sourced
  source: planet-forge 3c40281 docs/catalogue/kinds.py
  note: Transcribed proposed catalogue definition; not a claim of simulator implementation.
- of:
  - ladder
  tier: derived
  source: planet-forge 3c40281 docs/catalogue/kinds.py
  note: Derived from the proposed size range using the eight numeric bands; inherits size review.
- of:
  - trigger
  - trigger_params
  tier: invented
  review: true
  source: docs/planet-feature-trigger-rules-2026-10-22.md
  note: Owner-authorized detector proposal. Qualitative source definitions and provisional screening constants are
