# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.marine-terrace
  name: Marine terrace
  about: 'A relief feature of the coastal family: marine terrace.'
register: feature
family: coastal
geometry: polylines (stepped)
properties:
- field: heights
  unit: m
- field: ages
  unit: kyr
trigger: uplift + sea-level highstands
generator: stepped lines inland
wave: 2
built: false
levels:
- planet-level.100-km
applies_to:
- oceans
status: draft
basis:
- of:
  - identity
  - register
  - family
  - geometry
  - properties
  - trigger
  - generator
  - overrides
  - wave
  - built
  rule: rule.feature-relief-catalogue
- of:
  - layout
  rule: rule.relief-tectonic-port
layout:
- name: frame
  params:
  - name: rides
    value: 0.0
