# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.ridge-axis-valley
  name: Ridge axis valley
  about: The rift valley or crest along a spreading ridge's axis.
register: feature
family: marine
trigger: Resolved axial depression within an active mid-ocean-ridge belt, flanked across strike by two higher ridge
  shoulders and aligned with the divergent boundary. Slow spreading may support the candidate; an unresolved ridge
  centre or generic deep ocean line cannot confirm the valley. Apply finite-input, resolved-scale and candidate/provenance
  rules in docs/planet-feature-trigger-rules-2026-10-22.md; missing required evidence stays unknown, not a confirmed
  absence or occurrence.
trigger_params:
- name: AXIAL_VALLEY_DEPTH_MIN_M
  value: 100.0
  unit: m
  meaning: Resolved cross-axis depression screen; chosen.
  open: true
  used: false
  source: docs/planet-feature-trigger-rules-2026-10-22.md
  note: Proposed recognition setting, not a physical simulation retune; unused until a detector explicitly consumes
    this feature-local value. Values chosen for review unless the meaning identifies a definitional convention.
built: false
applies_to:
- oceans
- plates
status: draft
description: The rift valley or crest along a spreading ridge's axis.
size:
  across_m:
  - 5000.0
  - 4000000.0
  basis:
  - of:
    - across_m
    tier: invented
    review: true
    source: planet-forge 3c40281 docs/catalogue/kinds.py
    note: Supplied rough Earth size range in the catalogue draft; not a measured or validated range.
ladder:
- planet-level.10000-km
- planet-level.10-km
basis:
- of:
  - identity
  - register
  - family
  - description
  tier: sourced
