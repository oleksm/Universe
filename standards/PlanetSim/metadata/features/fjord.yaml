# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.fjord
  name: Fjord
  about: 'A relief feature of the glacial family: fjord.'
register: feature
family: glacial
geometry: polyline
properties:
- field: depth below sea
  unit: m
trigger: trough floor below sea level
generator: drowned trough
wave: 1
built: false
levels:
- planet-level.10000-km
- planet-level.1000-km
applies_to:
- any_air
status: draft
basis:
- of:
  - identity
  - register
  - family
  - geometry
  - properties
  - trigger
  - generator
  - overrides
  - wave
  - built
  rule: rule.feature-relief-catalogue
- of:
  - layout
  rule: rule.relief-tectonic-port
layout:
- name: frame
  params:
  - name: rides
    value: 1.0
