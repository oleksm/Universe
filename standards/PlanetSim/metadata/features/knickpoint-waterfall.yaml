# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.knickpoint-waterfall
  name: Knickpoint / waterfall
  about: 'A relief feature of the fluvial family: knickpoint / waterfall.'
register: feature
family: fluvial
geometry: point
properties:
- field: height
  unit: m
- field: retreat rate
  unit: m/Myr
trigger: uplift or rock contrast on a river
generator: point on the river
overrides: retreats upstream
wave: 2
built: false
levels:
- planet-level.100-km
applies_to:
- liquid_water_now
status: draft
basis:
- of:
  - identity
  - register
  - family
  - geometry
  - properties
  - trigger
  - generator
  - overrides
  - wave
  - built
  rule: rule.feature-relief-catalogue
- of:
  - layout
  rule: rule.relief-tectonic-port
layout:
- name: frame
  params:
  - name: rides
    value: 0.0
