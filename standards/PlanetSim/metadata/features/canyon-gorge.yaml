# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.canyon-gorge
  name: Canyon / gorge
  about: 'A relief feature of the fluvial family: canyon / gorge.'
register: feature
family: fluvial
geometry: polyline
properties:
- field: depth
  unit: m
- field: wall slope
  unit: deg
trigger: incision > 800 m or uplift in hard rock
generator: the reach
wave: 1
built: true
levels:
- planet-level.10000-km
- planet-level.1000-km
applies_to:
- liquid_water_now
status: draft
basis:
- of:
  - identity
  - register
  - family
  - geometry
  - properties
  - trigger
  - generator
  - overrides
  - wave
  - built
  rule: rule.feature-relief-catalogue
- of:
  - layout
  rule: rule.relief-tectonic-port
layout:
- name: frame
  params:
  - name: rides
    value: 0.0
