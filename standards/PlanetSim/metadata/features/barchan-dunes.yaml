# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.barchan-dunes
  name: Barchan dunes
  about: 'A relief feature of the aeolian family: barchan dunes.'
register: feature
family: aeolian
geometry: point set + direction
properties:
- field: wavelength
  unit: m
- field: wind direction
  unit: deg
trigger: little sand, one wind
generator: crests
wave: 2
built: false
levels:
- planet-level.10-km
- planet-level.1-km
applies_to:
- any_air
status: draft
basis:
- of:
  - identity
  - register
  - family
  - geometry
  - properties
  - trigger
  - generator
  - overrides
  - wave
  - built
  rule: rule.feature-relief-catalogue
- of:
  - layout
  rule: rule.relief-tectonic-port
layout:
- name: frame
  params:
  - name: rides
    value: 0.0
