# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.barchan-dunes
  name: Barchan dunes
  about: 'A relief feature of the aeolian family: barchan dunes.'
register: feature
family: aeolian
geometry: point set + direction
properties:
- field: wavelength
  unit: m
- field: wind direction
  unit: deg
trigger: little sand, one wind
generator: crests
wave: 2
built: false
levels:
- planet-level.10-km
- planet-level.1-km
applies_to:
- any_air
status: draft
basis:
- of:
  - identity
  - register
  - family
  - geometry
  - properties
  - trigger
  - generator
  - overrides
  - wave
  - built
  rule: rule.feature-relief-catalogue
- of:
  - layout
  rule: rule.relief-tectonic-port
layout:
- name: frame
  unit: '1'
  meaning: '1: its pins sit in its plate''s frame (integer cm) and ride the crust, placed by planet-field.plate-rotation;
    0: a body-frame snapshot, remade from the present state each pass'
  rule: it is the present state of an agent (water, sea, wind, the plates' meeting), remade each pass
  params:
  - name: rides
    value: 0.0
    unit: '1'
    meaning: 1 rides, 0 snapshot
    source: 'planet-forge src/ride.rs (from the Python: stages/lines.py Store vs its rivers and coast)'
    open: true
