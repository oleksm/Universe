# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.river-terrace
  name: River terrace
  about: 'A relief feature of the fluvial family: river terrace.'
register: feature
family: fluvial
geometry: polylines (stepped)
properties:
- field: height above river
  unit: m
- field: age
  unit: Myr
trigger: base-level fall or uplift
generator: old floor heights along the valley sides
overrides: erosion
wave: 2
built: false
levels:
- planet-level.100-km
applies_to:
- liquid_water_now
status: draft
basis:
- of:
  - identity
  - register
  - family
  - geometry
  - properties
  - trigger
  - generator
  - overrides
  - wave
  - built
  rule: rule.feature-relief-catalogue
- of:
  - layout
  rule: rule.relief-tectonic-port
layout:
- name: frame
  params:
  - name: rides
    value: 0.0
