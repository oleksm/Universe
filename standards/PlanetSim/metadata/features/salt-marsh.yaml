# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.salt-marsh
  name: Salt marsh
  about: 'A relief feature of the coastal family: salt marsh.'
register: feature
family: coastal
geometry: polygon
properties:
- field: width
  unit: m
trigger: tidal flat, temperate
generator: band
wave: 3
built: false
levels:
- planet-level.10-km
- planet-level.1-km
applies_to:
- oceans
status: draft
basis:
- of:
  - identity
  - register
  - family
  - geometry
  - properties
  - trigger
  - generator
  - overrides
  - wave
  - built
  rule: rule.feature-relief-catalogue
- of:
  - layout
  rule: rule.relief-tectonic-port
layout:
- name: frame
  params:
  - name: rides
    value: 0.0
