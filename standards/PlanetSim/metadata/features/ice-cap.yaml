# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.ice-cap
  name: Ice cap
  about: A dome of ice smaller than a sheet, over high ground.
register: water
family: glacial
trigger: Connected grounded perennial ice with area < ICE_SHEET_AREA_MIN_M2, an ice dome/plateau accumulation area
  and thickness >= ICE_THICKNESS_MIN_M. Do not classify every small valley glacier as a cap by area alone; unresolved
  centre geometry remains an unspecified ice body. Apply finite-input, resolved-scale and candidate/provenance rules
  in docs/planet-feature-trigger-rules-2026-10-22.md; missing required evidence stays unknown, not a confirmed absence
  or occurrence.
trigger_params:
- name: ICE_SHEET_AREA_MIN_M2
  value: 50000000000.0
  unit: m2
  meaning: 50,000km2 conventional ice-sheet/cap split (NSIDC); smaller valley-confined glaciers are not automatically
    ice caps.
  open: false
  used: false
  source: https://nsidc.org/sites/default/files/g10037-v001-userguide_1.pdf
  note: Verified naming/definition convention; not sufficient alone for recognition. Requires full trigger evidence
    and declared area/relief/ground-temperature convention. SI duration uses a Julian year of31557600s.
- name: ICE_THICKNESS_MIN_M
  value: 1.0
  unit: m
  meaning: Minimum modeled land-ice thickness for regional ice-body candidates; chosen resolution threshold, not
    permanence proof.
  open: true
  used: false
  source: docs/planet-feature-trigger-rules-2026-10-22.md
  note: Proposed recognition setting, not a physical simulation retune; unused until a detector explicitly consumes
    this feature-local value. Values chosen for review unless the meaning identifies a definitional convention.
built: false
status: draft
description: A dome of ice smaller than a sheet, over high ground.
size:
  across_m:
  - 5000.0
  - 200000.0
  basis:
  - of:
    - across_m
    tier: invented
    review: true
    source: planet-forge 3c40281 docs/catalogue/kinds.py
    note: Supplied rough Earth size range in the catalogue draft; not a measured or validated range.
ladder:
- planet-level.10000-km
- planet-level.10-km
basis:
- of:
  - identity
  - register
  - family
  - description
  tier: sourced
  source: planet-forge 3c40281 docs/catalogue/kinds.py
  note: Transcribed proposed catalogue definition; not a claim of simulator implementation.
- of:
  - ladder
  tier: derived
  source: planet-forge 3c40281 docs/catalogue/kinds.py
  note: Derived from the proposed size range using the eight numeric bands; inherits size review.
- of:
  - trigger
  - trigger_params
  tier: invented
  review: true
  source: docs/planet-feature-trigger-rules-2026-10-22.md
  note: Owner-authorized detector proposal. Qualitative source definitions and provisional screening constants are
    distinguished in the source; not a built generator or calibrated occurrence rate. Missing support and subcell
    geometry remain unresolved.
- of:
  - trigger_params.ICE_SHEET_AREA_MIN_M2
  tier: sourced
  source: https://nsidc.org/sites/default/files/g10037-v001-userguide_1.pdf
  note: Verified definition only; does not source unrelated screening parameters, air-temperature proxies, origin
    or morphology.
