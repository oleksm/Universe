# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.inselberg
  name: Inselberg
  about: 'A relief feature of the arid family: inselberg.'
register: feature
family: arid
geometry: point
properties:
- field: height
  unit: m
- field: footprint
  unit: m
trigger: old shield + arid / savanna
generator: points
wave: 3
built: false
levels:
- planet-level.100-km
applies_to:
- any_air
status: draft
basis:
- of:
  - identity
  - register
  - family
  - geometry
  - properties
  - trigger
  - generator
  - overrides
  - wave
  - built
  rule: rule.feature-relief-catalogue
- of:
  - layout
  rule: rule.relief-tectonic-port
layout:
- name: frame
  params:
  - name: rides
    value: 1.0
