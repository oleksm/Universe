# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.lava-flow-field
  name: Lava flow field
  about: 'A relief feature of the volcanic family: lava flow field.'
register: feature
family: volcanic
geometry: polygons + flow lines
properties:
- field: length
  unit: m
- field: thickness
  unit: m
trigger: eruption
generator: down the routing from the centre
overrides: burial
wave: 2
built: false
levels:
- planet-level.100-km
status: draft
basis:
- of:
  - identity
  - register
  - family
  - geometry
  - properties
  - trigger
  - generator
  - overrides
  - wave
  - built
  rule: rule.feature-relief-catalogue
- of:
  - layout
  rule: rule.relief-tectonic-port
layout:
- name: frame
  params:
  - name: rides
    value: 1.0
