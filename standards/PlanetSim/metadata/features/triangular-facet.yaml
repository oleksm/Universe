# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.triangular-facet
  name: Triangular facet
  about: 'A relief feature of the tectonic family: triangular facet.'
register: feature
family: tectonic
geometry: point set
properties:
- field: facet height
  unit: m
trigger: normal fault front
generator: spur ends along the scarp
overrides: erosion
wave: 3
built: false
levels:
- planet-level.10-km
- planet-level.1-km
status: draft
basis:
- of:
  - identity
  - register
  - family
  - geometry
  - properties
  - trigger
  - generator
  - overrides
  - wave
  - built
  rule: rule.feature-relief-catalogue
- of:
  - layout
  rule: rule.relief-tectonic-port
layout:
- name: frame
  params:
  - name: rides
    value: 1.0
