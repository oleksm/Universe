# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.graben
  name: Graben
  about: 'A relief feature of the tectonic family: graben.'
register: feature
family: tectonic
geometry: polygon
properties:
- field: block width
  unit: m
- field: depth
  unit: m
trigger: wide extension
generator: blocks between scarps, dropped
overrides: basin fill
wave: 1
built: false
levels:
- planet-level.10000-km
- planet-level.1000-km
status: draft
basis:
- of:
  - identity
  - register
  - family
  - geometry
  - properties
  - trigger
  - generator
  - overrides
  - wave
  - built
  rule: rule.feature-relief-catalogue
- of:
  - layout
  rule: rule.relief-tectonic-port
layout:
- name: frame
  params:
  - name: rides
    value: 1.0
