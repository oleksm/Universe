# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.medial-moraine
  name: Medial moraine
  about: 'A relief feature of the glacial family: medial moraine.'
register: feature
family: glacial
geometry: polyline
properties:
- field: height
  unit: m
trigger: glaciers joining
generator: along the trough below a junction
wave: 3
built: false
levels:
- planet-level.10-km
- planet-level.1-km
applies_to:
- any_air
status: draft
basis:
- of:
  - identity
  - register
  - family
  - geometry
  - properties
  - trigger
  - generator
  - overrides
  - wave
  - built
  rule: rule.feature-relief-catalogue
- of:
  - layout
  rule: rule.relief-tectonic-port
layout:
- name: frame
  params:
  - name: rides
    value: 1.0
