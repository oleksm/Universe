# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.horst
  name: Horst
  about: 'A relief feature of the tectonic family: horst.'
register: feature
family: tectonic
geometry: polygon
properties:
- field: block width
  unit: m
- field: tilt
  unit: deg
trigger: wide extension
generator: blocks between scarps, raised
overrides: basin fill
wave: 1
built: false
levels:
- planet-level.10000-km
- planet-level.1000-km
status: draft
basis:
- of:
  - identity
  - register
  - family
  - geometry
  - properties
  - trigger
  - generator
  - overrides
  - wave
  - built
  rule: rule.feature-relief-catalogue
- of:
  - layout
  rule: rule.relief-tectonic-port
layout:
- name: frame
  params:
  - name: rides
    value: 1.0
