# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.structural-basin
  name: Structural basin
  about: 'A relief feature of the structural family: structural basin.'
register: feature
family: structural
geometry: ring set
properties:
- field: diameter
  unit: m
- field: depth
  unit: m
trigger: sag on a quiet craton
generator: rings around the low
overrides: filling
wave: 2
built: false
levels:
- planet-level.10000-km
- planet-level.1000-km
status: draft
basis:
- of:
  - identity
  - register
  - family
  - geometry
  - properties
  - trigger
  - generator
  - overrides
  - wave
  - built
  rule: rule.feature-relief-catalogue
- of:
  - layout
  rule: rule.relief-tectonic-port
layout:
- name: frame
  params:
  - name: rides
    value: 1.0
