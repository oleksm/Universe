# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.yardangs
  name: Yardangs
  about: 'A relief feature of the aeolian family: yardangs.'
register: feature
family: aeolian
geometry: polylines
properties:
- field: length
  unit: m
- field: wind direction
  unit: deg
trigger: wind wear on soft rock
generator: lines along the wind
wave: 2
built: false
levels:
- planet-level.10-km
- planet-level.1-km
applies_to:
- any_air
status: draft
basis:
- of:
  - identity
  - register
  - family
  - geometry
  - properties
  - trigger
  - generator
  - overrides
  - wave
  - built
  rule: rule.feature-relief-catalogue
- of:
  - layout
  rule: rule.relief-tectonic-port
layout:
- name: frame
  params:
  - name: rides
    value: 0.0
