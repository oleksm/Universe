# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.coastal-foredune
  name: Coastal foredune
  about: 'A relief feature of the aeolian family: coastal foredune.'
register: feature
family: aeolian
geometry: polyline
properties:
- field: height
  unit: m
trigger: sandy coast + onshore wind
generator: line behind the beach
wave: 3
built: false
levels:
- planet-level.10-km
- planet-level.1-km
applies_to:
- any_air
- oceans
status: draft
basis:
- of:
  - identity
  - register
  - family
  - geometry
  - properties
  - trigger
  - generator
  - overrides
  - wave
  - built
  rule: rule.feature-relief-catalogue
- of:
  - layout
  rule: rule.relief-tectonic-port
layout:
- name: frame
  params:
  - name: rides
    value: 0.0
