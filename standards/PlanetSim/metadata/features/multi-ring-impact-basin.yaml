# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.multi-ring-impact-basin
  name: Multi-ring impact basin
  about: 'A relief landmark of the impact family: multi-ring impact basin.'
register: landmark
family: impact
geometry: rings
properties:
- field: rings
  unit: count
- field: diameter
  unit: m
trigger: giant impact
generator: concentric rings
overrides: erosion
wave: 2
built: false
levels:
- planet-level.10000-km
- planet-level.1000-km
status: draft
basis:
- of:
  - identity
  - register
  - family
  - geometry
  - properties
  - trigger
  - generator
  - overrides
  - wave
  - built
  rule: rule.feature-relief-catalogue
- of:
  - layout
  rule: rule.relief-tectonic-port
layout:
- name: frame
  params:
  - name: rides
    value: 1.0
