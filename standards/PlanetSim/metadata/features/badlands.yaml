# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.badlands
  name: Badlands
  about: 'A relief feature of the fluvial family: badlands.'
register: feature
family: fluvial
geometry: polygon
properties:
- field: gully density
  unit: 1/km
trigger: soft rock + semi-arid
generator: area
wave: 3
built: false
levels:
- planet-level.10-km
- planet-level.1-km
applies_to:
- liquid_water_now
status: draft
basis:
- of:
  - identity
  - register
  - family
  - geometry
  - properties
  - trigger
  - generator
  - overrides
  - wave
  - built
  rule: rule.feature-relief-catalogue
- of:
  - layout
  rule: rule.relief-tectonic-port
layout:
- name: frame
  params:
  - name: rides
    value: 0.0
