# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.plateau
  name: Plateau
  about: 'A relief province of the tectonic family: plateau.'
register: province
family: tectonic
geometry: polygon
properties:
- field: height
  unit: m
trigger: wide high ground with low relief
generator: the area where z > 600 m and R < 300 m
overrides: dissection
wave: 2
built: false
levels:
- planet-level.10000-km
- planet-level.1000-km
status: draft
basis:
- of:
  - identity
  - register
  - family
  - geometry
  - properties
  - trigger
  - generator
  - overrides
  - wave
  - built
  rule: rule.feature-relief-catalogue
- of:
  - layout
  rule: rule.relief-tectonic-port
layout:
- name: frame
  params:
  - name: rides
    value: 1.0
