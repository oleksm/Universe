# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.orogen-belt
  name: Orogen belt
  about: 'A mountain belt as an area: the collision or subduction belt the orogen axis runs through.'
register: province
family: tectonic
trigger: Connected mountain belt supported by crustal shortening/thickening, folds/thrusts or collision history,
  with regional relief >= OROGEN_RELIEF_MIN_M. Preserve active versus inherited age; an isolated volcano or arbitrary
  high plateau is not a tectonic orogen. Apply finite-input, resolved-scale and candidate/provenance rules in docs/planet-feature-trigger-rules-2026-10-22.md;
  missing required evidence stays unknown, not a confirmed absence or occurrence.
trigger_params:
- name: OROGEN_RELIEF_MIN_M
  value: 500.0
  unit: m
  meaning: Regional relief screen for tectonically supported mountain belt; chosen.
  open: true
  used: true
  source: docs/planet-feature-trigger-rules-2026-10-22.md
  note: Proposed recognition setting, not a physical simulation retune; unused until a detector explicitly consumes
    this feature-local value. Values chosen for review unless the meaning identifies a definitional convention.
    Read by planet-forge c20fe5f relief-landscape; consulted does not mean calibrated, sole effective threshold
    or full trigger implementation.
- name: TECTONIC_REACH_M
  value: 250000.0
  unit: m
  meaning: Regional maximum association distance to actual boundary geometry; not a claim of uniform boundary width.
  open: true
  used: false
  source: docs/planet-feature-trigger-rules-2026-10-22.md
  note: Proposed recognition setting, not a physical simulation retune; unused until a detector explicitly consumes
    this feature-local value. Values chosen for review unless the meaning identifies a definitional convention.
built: false
applies_to:
- plates
status: draft
description: 'A mountain belt as an area: the collision or subduction belt the orogen axis runs through.'
size:
  across_m:
  - 200000.0
  - 3000000.0
  basis:
  - of:
    - across_m
    tier: invented
    review: true
    source: planet-forge 3c40281 docs/catalogue/kinds.py
    note: Supplied rough Earth size range in the catalogue draft; not a measured or validated range.
ladder:
- planet-level.10000-km
- planet-level.1000-km
basis:
- of:
  - identity
  - register
  - family
  - description
  tier: sourced
  source: planet-forge 3c40281 docs/catalogue/kinds.py
  note: 'Transcribed proposed catalogue definition; not a claim of simulator implementation. Catalogue note:
    the area the orogen-axis line has no record of'
- of:
  - ladder
  tier: derived
  source: planet-forge 3c40281 docs/catalogue/kinds.py
  note: Derived from the proposed size range using the eight numeric bands; inherits size review.
- of:
  - trigger
  - trigger_params
  tier: invented
  review: true
  source: docs/planet-feature-trigger-rules-2026-10-22.md
  note: Owner-authorized detector proposal. Qualitative source definitions and provisional screening constants are
    distinguished in the source; not a built generator or calibrated occurrence rate. Missing support and subcell
    geometry remain unresolved.
