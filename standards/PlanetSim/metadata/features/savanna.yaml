# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.savanna
  name: Savanna
  about: Grassland with scattered trees, a long dry season.
register: cover
family: biotic
trigger: Warm land with seasonal water limitation and open tree/grass cover, excluding desert and closed forest.
  T >= TROPICAL_MEAN_MIN_K and phi in [SAVANNA_PHI_MIN, DESERT_PHI_MIN) may seed a climate-potential candidate;
  actual savanna needs dry-season and woody/grass fraction evidence, not just annual totals. Apply finite-input,
  resolved-scale and candidate/provenance rules in docs/planet-feature-trigger-rules-2026-10-22.md; missing required
  evidence stays unknown, not a confirmed absence or occurrence.
trigger_params:
- name: TROPICAL_MEAN_MIN_K
  value: 291.15
  unit: K
  meaning: Annual-mean warm-climate proxy only; not the monthly tropical climate criterion.
  open: true
  used: false
  source: docs/planet-feature-trigger-rules-2026-10-22.md
  note: Proposed recognition setting, not a physical simulation retune; unused until a detector explicitly consumes
    this feature-local value. Values chosen for review unless the meaning identifies a definitional convention.
- name: SAVANNA_PHI_MIN
  value: 1.5
  unit: '1'
  meaning: Provisional PET/P lower water-limitation bound for savanna suitability; chosen.
  open: true
  used: true
  source: docs/planet-feature-trigger-rules-2026-10-22.md
  note: Proposed recognition setting, not a physical simulation retune; unused until a detector explicitly consumes
    this feature-local value. Values chosen for review unless the meaning identifies a definitional convention.
    Read by planet-forge c20fe5f relief-landscape; consulted does not mean calibrated, sole effective threshold
    or full trigger implementation.
- name: DESERT_PHI_MIN
  value: 5.0
  unit: '1'
  meaning: PET/P threshold for a dry-climate desert candidate; chosen, not a universal biome law.
  open: true
  used: false
  source: docs/planet-feature-trigger-rules-2026-10-22.md
  note: Proposed recognition setting, not a physical simulation retune; unused until a detector explicitly consumes
    this feature-local value. Values chosen for review unless the meaning identifies a definitional convention.
built: false
applies_to:
- liquid_water_now
status: draft
description: Grassland with scattered trees, a long dry season.
size:
  across_m:
  - 10000.0
  - 5000000.0
  basis:
  - of:
    - across_m
    tier: invented
    review: true
    source: planet-forge 3c40281 docs/catalogue/kinds.py
    note: Supplied rough Earth size range in the catalogue draft; not a measured or validated range.
ladder:
- planet-level.10000-km
- planet-level.10-km
basis:
- of:
  - identity
  - register
  - family
  - description
  tier: sourced
  source: planet-forge 3c40281 docs/catalogue/kinds.py
  note: Transcribed proposed catalogue definition; not a claim of simulator implementation.
- of:
  - ladder
  tier: derived
  source: planet-forge 3c40281 docs/catalogue/kinds.py
  note: Derived from the proposed size range using the eight numeric bands; inherits size review.
- of:
  - trigger
  - trigger_params
  tier: invented
  review: true
  source: docs/planet-feature-trigger-rules-2026-10-22.md
  note: Owner-authorized detector proposal. Qualitative source definitions and provisional screening constants are
    distinguished in the source; not a built generator or calibrated occurrence rate. Missing support and subcell
    geometry remain unresolved.
