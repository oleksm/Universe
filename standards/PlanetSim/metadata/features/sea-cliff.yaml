# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.sea-cliff
  name: Sea cliff
  about: 'A relief feature of the coastal family: sea cliff.'
register: feature
family: coastal
geometry: polyline
properties:
- field: height
  unit: m
- field: retreat
  unit: m/yr
trigger: hard rock + high coast + waves
generator: coast segments
overrides: retreat
wave: 2
built: false
levels:
- planet-level.100-km
applies_to:
- oceans
status: draft
basis:
- of:
  - identity
  - register
  - family
  - geometry
  - properties
  - trigger
  - generator
  - overrides
  - wave
  - built
  rule: rule.feature-relief-catalogue
- of:
  - layout
  rule: rule.relief-tectonic-port
layout:
- name: frame
  params:
  - name: rides
    value: 0.0
