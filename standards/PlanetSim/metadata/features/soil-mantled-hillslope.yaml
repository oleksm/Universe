# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.soil-mantled-hillslope
  name: Soil-mantled hillslope
  about: 'A relief feature of the hillslope family: soil-mantled hillslope.'
register: feature
family: hillslope
geometry: polygon
properties:
- field: slope
  unit: deg
- field: length
  unit: m
- field: convexity
  unit: 1/m
trigger: everywhere at small scale
generator: level 3 mesher
wave: 3
built: false
levels:
- planet-level.10-km
- planet-level.1-km
status: draft
basis:
- of:
  - identity
  - register
  - family
  - geometry
  - properties
  - trigger
  - generator
  - overrides
  - wave
  - built
  rule: rule.feature-relief-catalogue
- of:
  - layout
  rule: rule.relief-tectonic-port
layout:
- name: frame
  params:
  - name: rides
    value: 1.0
