# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.submarine-canyon
  name: Submarine canyon
  about: A canyon cut into the shelf and slope, often off a river mouth.
register: feature
family: marine
trigger: Resolved incised, connected downslope valley through a continental shelf/slope margin, with cross-section
  lower than both shoulders and a trace toward deep water. River-mouth alignment supports sediment delivery but
  is not required for every canyon; a steep receiver chain alone is not a canyon. Apply finite-input, resolved-scale
  and candidate/provenance rules in docs/planet-feature-trigger-rules-2026-10-22.md; missing required evidence stays
  unknown, not a confirmed absence or occurrence.
trigger_params:
- name: CANYON_INCISE_MIN_M
  value: 100.0
  unit: m
  meaning: Resolved incision below shoulders for submarine-canyon screening; chosen.
  open: true
  used: false
  source: docs/planet-feature-trigger-rules-2026-10-22.md
  note: Proposed recognition setting, not a physical simulation retune; unused until a detector explicitly consumes
    this feature-local value. Values chosen for review unless the meaning identifies a definitional convention.
built: false
applies_to:
- oceans
status: draft
description: A canyon cut into the shelf and slope, often off a river mouth.
size:
