# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.floodplain
  name: Floodplain
  about: 'A relief feature of the fluvial family: floodplain.'
register: feature
family: fluvial
geometry: polygon
properties:
- field: width
  unit: m
trigger: low gradient + big Q + laid sediment
generator: band along the river
overrides: burial, drowning
wave: 1
built: false
levels:
- planet-level.10000-km
- planet-level.1000-km
applies_to:
- liquid_water_now
status: draft
basis:
- of:
  - identity
  - register
  - family
  - geometry
  - properties
  - trigger
  - generator
  - overrides
  - wave
  - built
  rule: rule.feature-relief-catalogue
- of:
  - pinned_to
  - spans
  - dimensions
  - layout
  - parent_kinds
  review: true
  source: 'the laws'' notes: Moody and Troutman 2002; Leopold and Wolman 1957, 1960 (coefficients recalled, to check against
    the papers); figures marked open are invented'
  tier: sourced
- of:
  - layout
  rule: rule.relief-tectonic-port
pinned_to: the downstream end of its reach, on its river's centreline (a child of that river)
spans:
- meaning: 'the reach''s centreline, in cm east/north/up of the pin; profile along it: width (m)'
  name: axis
dimensions:
- formula: m * belt width
  meaning: across the floodplain at each axis vertex
  name: width
  params:
  - meaning: floodplain over meander belt width
    name: m
    note: invented, to review
    open: true
    unit: '1'
    value: 3.0
  rule: a multiple of the meander belt (a placeholder until the sim lays sediment widths)
  unit: m
parent_kinds:
- planet-feature.trunk-river
layout:
- name: frame
  params:
  - name: rides
    value: 0.0
