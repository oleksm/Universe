# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.v-valley
  name: V valley
  about: 'A relief feature of the fluvial family: V valley.'
register: feature
family: fluvial
geometry: polyline + width
properties:
- field: depth
  unit: m
- field: floor width
  unit: m
- field: side slope
  unit: deg
trigger: incision > 50 m
generator: along the river
overrides: widening; U overprint
wave: 1
built: false
levels:
- planet-level.10000-km
- planet-level.1000-km
applies_to:
- liquid_water_now
status: draft
basis:
- of:
  - identity
  - register
  - family
  - geometry
  - properties
  - trigger
  - generator
  - overrides
  - wave
  - built
  rule: rule.feature-relief-catalogue
- of:
  - layout
  rule: rule.relief-tectonic-port
layout:
- name: frame
  params:
  - name: rides
    value: 0.0
