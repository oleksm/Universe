# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.impact-crater-rampart
  name: Impact crater, rampart
  about: A crater whose ejecta flowed as lobes ending in a low rampart (layered ejecta)
register: landmark
family: impact
applies_to:
- ground_ice
geometry: rings
trigger: impact into ice-rich ground
built: false
status: draft
size:
  across_m:
  - 3000.0
  - 111000.0
  basis:
  - of:
    - size
    tier: sourced
    source: 'Barlow 2005, 2014: of 79,723 Mars craters >= 3 km, 18,841 layered; craters 3-111 km'
ladder:
- planet-level.10000-km
- planet-level.10-km
description: 'A crater whose ejecta flowed as lobes ending in a low rampart (layered ejecta): single, double or multiple layers,
  ejecta mobility ~1.4 (single), 2.5 (double outer) to ~6, rising poleward; formed by impacts into ground ice. From orbit
  a crater ringed by petal-shaped lobes.'
basis:
- of:
  - identity
  - register
  - family
  - geometry
  - trigger
  - applies_to
  - description
  rule: rule.planet-types-kinds
- of:
  - ladder
  rule: rule.feature-ladder-derived
