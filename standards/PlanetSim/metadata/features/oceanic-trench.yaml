# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.oceanic-trench
  name: Oceanic trench
  about: The deep narrow trough where an ocean plate dives, to 11 km deep.
register: feature
family: marine
trigger: Elongated bathymetric depression at an active convergent oceanic boundary, on the downgoing side of the
  arc/forearc system. Require relative convergence, consistent subduction polarity and local depth anomaly >= TRENCH_ANOMALY_MIN_M;
  the deepest ocean cell alone is not a trench. Apply finite-input, resolved-scale and candidate/provenance rules
  in docs/planet-feature-trigger-rules-2026-10-22.md; missing required evidence stays unknown, not a confirmed absence
  or occurrence.
trigger_params:
- name: BOUNDARY_SPEED_MIN_M_S
  value: 3.168808781402895e-11
  unit: m/s
  meaning: Relative normal/tangential motion screening of1mm/yr, chosen numerical activity threshold.
  open: true
  used: false
  source: docs/planet-feature-trigger-rules-2026-10-22.md
  note: Proposed recognition setting, not a physical simulation retune; unused until a detector explicitly consumes
    this feature-local value. Values chosen for review unless the meaning identifies a definitional convention.
- name: TRENCH_ANOMALY_MIN_M
  value: 1000.0
  unit: m
  meaning: Local depression anomaly screen near convergence, not absolute ocean depth.
  open: true
  used: true
  source: docs/planet-feature-trigger-rules-2026-10-22.md
  note: Proposed recognition setting, not a physical simulation retune; unused until a detector explicitly consumes
    this feature-local value. Values chosen for review unless the meaning identifies a definitional convention.
    Read by planet-forge c20fe5f relief-landscape; consulted does not mean calibrated, sole effective threshold
    or full trigger implementation.
built: false
applies_to:
- oceans
- plates
status: draft
description: The deep narrow trough where an ocean plate dives, to 11 km deep.
