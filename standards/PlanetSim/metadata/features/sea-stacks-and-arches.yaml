# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.sea-stacks-and-arches
  name: Sea stacks and arches
  about: 'A relief feature of the coastal family: sea stacks and arches.'
register: feature
family: coastal
geometry: point set
properties:
- field: height
  unit: m
trigger: cliff retreat in jointed rock
generator: points
wave: 3
built: false
levels:
- planet-level.10-km
- planet-level.1-km
applies_to:
- oceans
status: draft
basis:
- of:
  - identity
  - register
  - family
  - geometry
  - properties
  - trigger
  - generator
  - overrides
  - wave
  - built
  rule: rule.feature-relief-catalogue
- of:
  - layout
  rule: rule.relief-tectonic-port
layout:
- name: frame
  params:
  - name: rides
    value: 0.0
