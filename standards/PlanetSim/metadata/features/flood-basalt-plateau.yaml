# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.flood-basalt-plateau
  name: Flood basalt plateau
  about: 'A relief province of the volcanic family: flood basalt plateau.'
register: province
family: volcanic
geometry: polygon + step rings
properties:
- field: thickness
  unit: m
- field: ring
  unit: m
trigger: plume head under a continent
generator: lobed polygon, step escarpments
overrides: erosion into terraces
wave: 1
built: true
levels:
- planet-level.10000-km
- planet-level.1000-km
status: draft
basis:
- of:
  - identity
  - register
  - family
  - geometry
  - properties
  - trigger
  - generator
  - overrides
  - wave
  - built
  rule: rule.feature-relief-catalogue
- of:
  - pinned_to
  - spans
  - dimensions
  - layout
  tier: derived
  note: 'planets, 17 Oct 2026: planet-forge relief-tectonic port (models/tectonic, src/ride.rs), read from planet-sim-landform
    9747f0d-c437724. The laws: stages/zones.py hotspots (the Python''s rules, its constants on the processes).'
  review: true
- of:
  - layout
  rule: rule.relief-tectonic-port
pinned_to: the plume where it first stood under a continent
spans:
- name: centre
  meaning: one pin where it stands
dimensions:
- name: ring radius
  unit: m
  meaning: ring_km
- name: relief0
  unit: m
  meaning: relief0_m
- name: relief
  unit: m
  meaning: relief0 (point features are not worn yet, as in the Python)
layout:
- name: frame
  params:
  - name: rides
    value: 1.0
- name: record from
  unit: s
  meaning: 'recorded only while the planet is within this of its present: one older would be worn away by today, never made'
  rule: 'within its decay age (owner, 17 Oct 2026: "start models that make sense within their decay age")'
  formula: record while age_today - t <= RECORD_FROM_MYR
  params:
  - name: RECORD_FROM_MYR
    value: 1.262304e+16
    unit: s
    said_as:
      unit: Myr
      factor: 31557600000000.0
    meaning: its decay age before the present
    source: stages/relief.py:59 RECORD_FROM_MYR['flood basalt province']
    open: true
- name: hotspot
  unit: '1'
  meaning: the plume
