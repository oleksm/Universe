# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.hanging-valley
  name: Hanging valley
  about: 'A relief feature of the glacial family: hanging valley.'
register: feature
family: glacial
geometry: point + polyline
properties:
- field: drop
  unit: m
trigger: tributary trough into a deeper one
generator: junction
wave: 3
built: false
levels:
- planet-level.100-km
applies_to:
- any_air
status: draft
basis:
- of:
  - identity
  - register
  - family
  - geometry
  - properties
  - trigger
  - generator
  - overrides
  - wave
  - built
  rule: rule.feature-relief-catalogue
- of:
  - layout
  rule: rule.relief-tectonic-port
layout:
- name: frame
  params:
  - name: rides
    value: 1.0
