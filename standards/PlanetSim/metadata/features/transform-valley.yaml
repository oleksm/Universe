# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.transform-valley
  name: Transform valley
  about: 'A relief feature of the tectonic family: transform valley.'
register: feature
family: tectonic
geometry: polyline
properties:
- field: offset
  unit: m
- field: sense
trigger: transform on continent
generator: along the boundary
overrides: erosion (relief decays by rock and rain), tear at plate edges, sink with its crust
wave: 2
built: false
levels:
- planet-level.10000-km
- planet-level.1000-km
status: draft
basis:
- of:
  - identity
  - register
  - family
  - geometry
  - properties
  - trigger
  - generator
  - overrides
  - wave
  - built
  rule: rule.feature-relief-catalogue
- of:
  - layout
  rule: rule.relief-tectonic-port
layout:
- name: frame
  params:
  - name: rides
    value: 1.0
