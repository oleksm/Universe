# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.foreland-basin
  name: Foreland basin
  about: 'A relief province of the tectonic family: foreland basin.'
register: province
family: tectonic
geometry: polygon
properties:
- field: depth
  unit: m
- field: fill
  unit: m
trigger: thrust front load
generator: band 100-300 km in front of the front
overrides: filled by sediment
wave: 2
built: false
levels:
- planet-level.10000-km
- planet-level.1000-km
status: draft
basis:
- of:
  - identity
  - register
  - family
  - geometry
  - properties
  - trigger
  - generator
  - overrides
  - wave
  - built
  rule: rule.feature-relief-catalogue
- of:
  - layout
  rule: rule.relief-tectonic-port
layout:
- name: frame
  params:
  - name: rides
    value: 1.0
