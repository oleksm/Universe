trigger: anticline eroded past its cap
generator: core cut along the axis
overrides: erosion
wave: 3
built: false
levels:
- planet-level.100-km
status: draft
basis:
- of:
  - identity
  - register
  - family
  - geometry
  - properties
  - trigger
  - generator
  - overrides
  - wave
  - built
  rule: rule.feature-relief-catalogue
- of:
  - layout
  rule: rule.relief-tectonic-port
layout:
- name: frame
  params:
  - name: rides
    value: 1.0
