# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.arc-front
  name: Arc front
  about: 'A relief feature of the tectonic family: arc front.'
register: feature
family: tectonic
geometry: polyline
properties:
- field: offset from trench
  unit: m
- field: rider plate
  unit: id
trigger: subduction under a continent
generator: 150 km behind the trench, per rider plate
overrides: ends 30 Myr after
wave: 1
built: true
levels:
- planet-level.10000-km
- planet-level.1000-km
applies_to:
- plates
status: draft
basis:
- of:
  - identity
  - register
  - family
  - geometry
  - properties
  - trigger
  - generator
  - overrides
  - wave
  - built
  rule: rule.feature-relief-catalogue
- of:
  - pinned_to
  - spans
  - dimensions
  - layout
  tier: derived
  note: 'planets, 17 Oct 2026: planet-forge relief-tectonic port (models/tectonic, src/ride.rs), read from planet-sim-landform
    9747f0d-c437724. The laws: stages/zones.py arcs, close_stale (the Python''s rules, its constants on the processes).'
  review: true
- of:
  - layout
  rule: rule.relief-tectonic-port
pinned_to: its first front point
spans:
- name: contacts
  meaning: front points as they came (ARC_FRONT_M behind each trench point toward the continental rider; profiles t_myr, plate)
- name: active
  meaning: this step's front points (they keep the arc's volcano centres active)
- name: line
  meaning: its points chained when it ended (as a suture's)
dimensions:
- name: length
  unit: m
  meaning: along its line
  rule: measured on the span
- name: sinuosity
  unit: '1'
  meaning: path over chord
  rule: measured on the span
- name: turn per 100 km
  unit: deg
  meaning: mean turning
  rule: measured on the span
- name: straight share
  unit: '1'
  meaning: share of steps turning under 5 deg
  rule: measured on the span
layout:
- name: frame
  params:
  - name: rides
    value: 1.0
- name: record from
  unit: s
  meaning: 'recorded only while the planet is within this of its present: one older would be worn away by today, never made'
  rule: 'within its decay age (owner, 17 Oct 2026: "start models that make sense within their decay age")'
  formula: record while age_today - t <= RECORD_FROM_MYR
  params:
  - name: RECORD_FROM_MYR
    value: 9467280000000000.0
    unit: s
    said_as:
      unit: Myr
      factor: 31557600000000.0
    meaning: its decay age before the present
    source: stages/relief.py:59 RECORD_FROM_MYR['arc front']
    open: true
- name: forming
  unit: '1'
  meaning: 1 while active, 0 once ended
