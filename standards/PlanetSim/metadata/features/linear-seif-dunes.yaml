# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.linear-seif-dunes
  name: Linear (seif) dunes
  about: 'A relief feature of the aeolian family: linear (seif) dunes.'
register: feature
family: aeolian
geometry: polylines
properties:
- field: spacing
  unit: m
- field: wind direction
  unit: deg
trigger: two winds
generator: crest lines along the mean wind
wave: 2
built: false
levels:
- planet-level.10-km
- planet-level.1-km
applies_to:
- any_air
status: draft
basis:
- of:
  - identity
  - register
  - family
  - geometry
  - properties
  - trigger
  - generator
  - overrides
  - wave
  - built
  rule: rule.feature-relief-catalogue
- of:
  - layout
  rule: rule.relief-tectonic-port
layout:
- name: frame
  params:
  - name: rides
    value: 0.0
