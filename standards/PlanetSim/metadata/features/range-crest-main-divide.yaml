# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.range-crest-main-divide
  name: Range crest (main divide)
  about: 'A relief feature of the tectonic family: range crest (main divide).'
register: feature
family: tectonic
geometry: polyline
properties:
- field: height profile
  unit: m
trigger: orogen axis + routing divides
generator: the divide nearest the orogen axis
overrides: erosion (relief decays by rock and rain), tear at plate edges, sink with its crust
wave: 1
built: false
levels:
- planet-level.10000-km
- planet-level.1000-km
status: draft
basis:
- of:
  - identity
  - register
  - family
  - geometry
  - properties
  - trigger
  - generator
  - overrides
  - wave
  - built
  rule: rule.feature-relief-catalogue
- of:
  - layout
  rule: rule.relief-tectonic-port
layout:
- name: frame
  unit: '1'
  meaning: '1: its pins sit in its plate''s frame (integer cm) and ride the crust, placed by planet-field.plate-rotation;
    0: a body-frame snapshot, remade from the present state each pass'
  rule: it rides its crust (the Python's line store anchored it to crust particles)
  params:
  - name: rides
    value: 1.0
    unit: '1'
    meaning: 1 rides, 0 snapshot
    source: 'planet-forge src/ride.rs (from the Python: stages/lines.py Store vs its rivers and coast)'
    open: true
