# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.overdeepening-and-riegel
  name: Overdeepening and riegel
  about: 'A relief feature of the glacial family: overdeepening and riegel.'
register: feature
family: glacial
geometry: polygon + polyline
properties:
- field: depth
  unit: m
trigger: trough floor
generator: basins and sills along the trough
wave: 3
built: false
levels:
- planet-level.100-km
applies_to:
- any_air
status: draft
basis:
- of:
  - identity
  - register
  - family
  - geometry
  - properties
  - trigger
  - generator
  - overrides
  - wave
  - built
  rule: rule.feature-relief-catalogue
- of:
  - layout
  rule: rule.relief-tectonic-port
layout:
- name: frame
  params:
  - name: rides
    value: 1.0
