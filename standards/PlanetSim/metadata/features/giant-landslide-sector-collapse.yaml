# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.giant-landslide-sector-collapse
  name: Giant landslide / sector collapse
  about: 'A relief landmark of the hillslope family: giant landslide / sector collapse.'
register: landmark
family: hillslope
geometry: polygon
properties:
- field: volume
  unit: m3
- field: runout
  unit: m
trigger: steep volcano flank or range
generator: scar + deposit
wave: 3
built: false
levels:
- planet-level.100-km
status: draft
basis:
- of:
  - identity
  - register
  - family
  - geometry
  - properties
  - trigger
  - generator
  - overrides
  - wave
  - built
  rule: rule.feature-relief-catalogue
- of:
  - layout
  rule: rule.relief-tectonic-port
layout:
- name: frame
  params:
  - name: rides
    value: 1.0
