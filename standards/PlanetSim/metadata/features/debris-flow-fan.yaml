  name: Debris-flow fan
  about: 'A relief feature of the hillslope family: debris-flow fan.'
register: feature
family: hillslope
geometry: polygon
properties:
- field: apex
  unit: point
trigger: steep small catchments
generator: cone
wave: 3
built: false
levels:
- planet-level.10-km
- planet-level.1-km
status: draft
basis:
- of:
  - identity
  - register
  - family
  - geometry
  - properties
  - trigger
  - generator
  - overrides
  - wave
  - built
  rule: rule.feature-relief-catalogue
- of:
  - layout
  rule: rule.relief-tectonic-port
layout:
- name: frame
  params:
  - name: rides
    value: 1.0
