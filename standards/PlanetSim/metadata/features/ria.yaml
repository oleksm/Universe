# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.ria
  name: Ria
  about: 'A relief feature of the coastal family: ria.'
register: feature
family: coastal
geometry: polygon
properties:
- field: length
  unit: m
trigger: drowned unglaciated valley
generator: drowned valley
overrides: infill
wave: 2
built: false
levels:
- planet-level.10000-km
- planet-level.1000-km
applies_to:
- oceans
status: draft
basis:
- of:
  - identity
  - register
  - family
  - geometry
  - properties
  - trigger
  - generator
  - overrides
  - wave
  - built
  rule: rule.feature-relief-catalogue
- of:
  - layout
  rule: rule.relief-tectonic-port
layout:
- name: frame
  params:
  - name: rides
    value: 0.0
