# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.tidal-flat
  name: Tidal flat
  about: 'A relief feature of the coastal family: tidal flat.'
register: feature
family: coastal
geometry: polygon
properties:
- field: width
  unit: m
trigger: low coast + wide shelf (big tides)
generator: band
wave: 2
built: false
levels:
- planet-level.100-km
applies_to:
- oceans
status: draft
basis:
- of:
  - identity
  - register
  - family
  - geometry
  - properties
  - trigger
  - generator
  - overrides
  - wave
  - built
  rule: rule.feature-relief-catalogue
- of:
  - layout
  rule: rule.relief-tectonic-port
layout:
- name: frame
  params:
  - name: rides
    value: 0.0
