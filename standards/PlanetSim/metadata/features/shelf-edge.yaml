  name: Shelf edge
  about: 'A relief feature of the coastal family: shelf edge.'
register: feature
family: coastal
geometry: polyline
properties:
- field: depth
  unit: m
trigger: margin type
generator: the shelf break
wave: 1
built: false
levels:
- planet-level.10000-km
- planet-level.1000-km
applies_to:
- oceans
status: draft
basis:
- of:
  - identity
  - register
  - family
  - geometry
  - properties
  - trigger
  - generator
  - overrides
  - wave
  - built
  rule: rule.feature-relief-catalogue
- of:
  - layout
  rule: rule.relief-tectonic-port
layout:
- name: frame
  params:
  - name: rides
    value: 0.0
