# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.delta-tide-dominated
  name: Delta, tide-dominated
  about: 'A relief feature of the fluvial family: delta, tide-dominated.'
register: feature
family: fluvial
geometry: polygon
properties:
- field: area
  unit: m2
trigger: big mouth, high tides
generator: funnel with bars
overrides: drowning
wave: 2
built: false
levels:
- planet-level.10000-km
- planet-level.1000-km
applies_to:
- liquid_water_now
status: draft
basis:
- of:
  - identity
  - register
  - family
  - geometry
  - properties
  - trigger
  - generator
  - overrides
  - wave
  - built
  rule: rule.feature-relief-catalogue
- of:
  - layout
  rule: rule.relief-tectonic-port
layout:
- name: frame
  params:
  - name: rides
    value: 0.0
