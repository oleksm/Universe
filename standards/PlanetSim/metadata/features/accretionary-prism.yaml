# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.accretionary-prism
  name: Accretionary prism
  about: A wedge of sediment scraped off the diving plate, ridged parallel to the trench.
register: feature
family: tectonic
trigger: Wedge on the overriding side of an active subduction trench with demonstrable sediment accretion/shortening,
  between trench and forearc. Require trench polarity and accreted sediment evidence; an arc or convergence alone
  supports a possible forearc wedge, not a confirmed prism. Apply finite-input, resolved-scale and candidate/provenance
  rules in docs/planet-feature-trigger-rules-2026-10-22.md; missing required evidence stays unknown, not a confirmed
  absence or occurrence.
trigger_params:
- name: TECTONIC_REACH_M
  value: 250000.0
  unit: m
  meaning: Regional maximum association distance to actual boundary geometry; not a claim of uniform boundary width.
  open: true
  used: false
  source: docs/planet-feature-trigger-rules-2026-10-22.md
  note: Proposed recognition setting, not a physical simulation retune; unused until a detector explicitly consumes
    this feature-local value. Values chosen for review unless the meaning identifies a definitional convention.
built: false
applies_to:
- plates
status: draft
description: A wedge of sediment scraped off the diving plate, ridged parallel to the trench.
size:
  across_m:
  - 20000.0
  - 300000.0
  basis:
  - of:
    - across_m
    tier: invented
    review: true
    source: planet-forge 3c40281 docs/catalogue/kinds.py
    note: Supplied rough Earth size range in the catalogue draft; not a measured or validated range.
ladder:
- planet-level.10000-km
- planet-level.100-km
basis:
- of:
  - identity
  - register
  - family
  - description
  tier: sourced
  source: planet-forge 3c40281 docs/catalogue/kinds.py
  note: Transcribed proposed catalogue definition; not a claim of simulator implementation.
- of:
  - ladder
  tier: derived
  source: planet-forge 3c40281 docs/catalogue/kinds.py
  note: Derived from the proposed size range using the eight numeric bands; inherits size review.
- of:
  - trigger
  - trigger_params
  tier: invented
  review: true
  source: docs/planet-feature-trigger-rules-2026-10-22.md
  note: Owner-authorized detector proposal. Qualitative source definitions and provisional screening constants are
    distinguished in the source; not a built generator or calibrated occurrence rate. Missing support and subcell
    geometry remain unresolved.
