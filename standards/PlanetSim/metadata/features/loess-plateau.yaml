register: province
family: aeolian
geometry: polygon
properties:
- field: thickness
  unit: m
trigger: dust downwind of deserts / outwash
generator: area
overrides: gully dissection
wave: 2
built: false
levels:
- planet-level.100-km
applies_to:
- any_air
status: draft
basis:
- of:
  - identity
  - register
  - family
  - geometry
  - properties
  - trigger
  - generator
  - overrides
  - wave
  - built
  rule: rule.feature-relief-catalogue
- of:
  - layout
  rule: rule.relief-tectonic-port
layout:
- name: frame
  params:
  - name: rides
    value: 0.0
