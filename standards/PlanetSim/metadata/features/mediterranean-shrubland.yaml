# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.mediterranean-shrubland
  name: Mediterranean shrubland
  about: Hard-leaved scrub and woodland, dry summers.
register: cover
family: biotic
trigger: Warm-temperate land with winter-wet, summer-dry precipitation seasonality and shrub-dominated cover. Require
  monthly/seasonal rainfall and temperatures with hemispheric summer correctly identified; annual means or coastal
  latitude alone give a candidate, not this biome. Apply finite-input, resolved-scale and candidate/provenance rules
  in docs/planet-feature-trigger-rules-2026-10-22.md; missing required evidence stays unknown, not a confirmed absence
  or occurrence.
trigger_params:
- name: MEDITERRANEAN_DRY_MONTH_RAIN_MAX_M_S
  value: 1.5210282150733896e-08
  unit: m/s
  meaning: 40mm over an average month expressed as rate; seasonal dry-month screening, not annual rainfall.
  open: true
  used: false
  source: docs/planet-feature-trigger-rules-2026-10-22.md
  note: Proposed recognition setting, not a physical simulation retune; unused until a detector explicitly consumes
    this feature-local value. Values chosen for review unless the meaning identifies a definitional convention.
- name: MEDITERRANEAN_DRY_WET_RATIO_MAX
  value: 0.3333333333333333
  unit: '1'
  meaning: Summer driest/winter wettest monthly rainfall ratio for dry-summer candidate; temperature seasonality
    also required.
  open: true
  used: false
  source: docs/planet-feature-trigger-rules-2026-10-22.md
  note: Proposed recognition setting, not a physical simulation retune; unused until a detector explicitly consumes
    this feature-local value. Values chosen for review unless the meaning identifies a definitional convention.
built: false
