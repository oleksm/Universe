# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.esker
  name: Esker
  about: 'A relief feature of the glacial family: esker.'
register: feature
family: glacial
geometry: polyline
properties:
- field: height
  unit: m
- field: sinuosity
trigger: subglacial rivers
generator: down the ice-surface slope
wave: 3
built: false
levels:
- planet-level.100-km
applies_to:
- any_air
status: draft
basis:
- of:
  - identity
  - register
  - family
  - geometry
  - properties
  - trigger
  - generator
  - overrides
  - wave
  - built
  rule: rule.feature-relief-catalogue
- of:
  - layout
  rule: rule.relief-tectonic-port
layout:
- name: frame
  params:
  - name: rides
    value: 1.0
