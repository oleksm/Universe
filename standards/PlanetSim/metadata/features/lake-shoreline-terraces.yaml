# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.lake-shoreline-terraces
  name: Lake shoreline terraces
  about: 'A relief feature of the lacustrine family: lake shoreline terraces.'
register: feature
family: lacustrine
geometry: rings
properties:
- field: levels
  unit: m
- field: ages
  unit: kyr
trigger: lake level falls
generator: rings
wave: 2
built: false
levels:
- planet-level.100-km
applies_to:
- liquid_water_now
status: draft
basis:
- of:
  - identity
  - register
  - family
  - geometry
  - properties
  - trigger
  - generator
  - overrides
  - wave
  - built
  rule: rule.feature-relief-catalogue
- of:
  - layout
  rule: rule.relief-tectonic-port
layout:
- name: frame
  unit: '1'
  meaning: '1: its pins sit in its plate''s frame (integer cm) and ride the crust, placed by planet-field.plate-rotation;
    0: a body-frame snapshot, remade from the present state each pass'
  rule: it is the present state of an agent (water, sea, wind, the plates' meeting), remade each pass
  params:
  - name: rides
    value: 0.0
    unit: '1'
    meaning: 1 rides, 0 snapshot
    source: 'planet-forge src/ride.rs (from the Python: stages/lines.py Store vs its rivers and coast)'
    open: true
