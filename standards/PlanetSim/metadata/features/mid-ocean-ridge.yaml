identity:
  key: planet-feature.mid-ocean-ridge
  name: Mid ocean ridge
  about: The broad swell of young ocean floor along a spreading boundary, its flanks of abyssal hills.
register: province
family: marine
trigger: Connected active divergent boundary on oceanic crust with positive spreading normal velocity and a young/hot
  elevated ridge belt. Trace actual plate boundary and ridge axis; young crust far from active divergence is not
  an active ridge. Apply finite-input, resolved-scale and candidate/provenance rules in docs/planet-feature-trigger-rules-2026-10-22.md;
  missing required evidence stays unknown, not a confirmed absence or occurrence.
trigger_params:
- name: BOUNDARY_SPEED_MIN_M_S
  value: 3.168808781402895e-11
  unit: m/s
  meaning: Relative normal/tangential motion screening of1mm/yr, chosen numerical activity threshold.
  open: true
  used: true
  source: docs/planet-feature-trigger-rules-2026-10-22.md
  note: Proposed recognition setting, not a physical simulation retune; unused until a detector explicitly consumes
    this feature-local value. Values chosen for review unless the meaning identifies a definitional convention.
    Read by planet-forge c20fe5f relief-landscape; consulted does not mean calibrated, sole effective threshold
    or full trigger implementation.
- name: YOUNG_OCEAN_AGE_MAX_S
  value: 631152000000000.0
  unit: s
  meaning: Young seafloor screening age; active boundary evidence remains required.
  open: true
  used: true
  source: docs/planet-feature-trigger-rules-2026-10-22.md
  note: Proposed recognition setting, not a physical simulation retune; unused until a detector explicitly consumes
    this feature-local value. Values chosen for review unless the meaning identifies a definitional convention.
    Read by planet-forge c20fe5f relief-landscape; consulted does not mean calibrated, sole effective threshold
    or full trigger implementation.
