# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.volcanic-rift-zone
  name: Volcanic rift zone
  about: 'A relief feature of the volcanic family: volcanic rift zone.'
register: feature
family: volcanic
geometry: polyline
properties:
- field: length
  unit: m
trigger: hotspot on a rift
generator: through the centre
wave: 2
built: false
levels:
- planet-level.100-km
status: draft
basis:
- of:
  - identity
  - register
  - family
  - geometry
  - properties
  - trigger
  - generator
  - overrides
  - wave
  - built
  rule: rule.feature-relief-catalogue
- of:
  - layout
  rule: rule.relief-tectonic-port
layout:
- name: frame
  params:
  - name: rides
    value: 1.0
