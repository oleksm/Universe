# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.shutter-ridge
  name: Shutter ridge
  about: 'A relief feature of the tectonic family: shutter ridge.'
register: feature
family: tectonic
geometry: polyline
properties:
- field: length
  unit: m
trigger: transform
generator: ridge moved across a valley mouth
wave: 3
built: false
levels:
- planet-level.10-km
- planet-level.1-km
status: draft
basis:
- of:
  - identity
  - register
  - family
  - geometry
  - properties
  - trigger
  - generator
  - overrides
  - wave
  - built
  rule: rule.feature-relief-catalogue
- of:
  - layout
  rule: rule.relief-tectonic-port
layout:
- name: frame
  params:
  - name: rides
    value: 1.0
