  about: 'A relief province of the volcanic family: ignimbrite plateau.'
register: province
family: volcanic
geometry: polygon
properties:
- field: thickness
  unit: m
trigger: large caldera
generator: around the caldera
overrides: dissection
wave: 2
built: false
levels:
- planet-level.10000-km
- planet-level.1000-km
status: draft
basis:
- of:
  - identity
  - register
  - family
  - geometry
  - properties
  - trigger
  - generator
  - overrides
  - wave
  - built
  rule: rule.feature-relief-catalogue
- of:
  - layout
  rule: rule.relief-tectonic-port
layout:
- name: frame
  params:
  - name: rides
    value: 1.0
