# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.monogenetic-volcanic-field
  name: Monogenetic volcanic field
  about: 'A relief province of the volcanic family: monogenetic volcanic field.'
register: province
family: volcanic
geometry: polygon + point set
properties:
- field: cone density
  unit: 1/km2
trigger: rift or back-arc volcanism
generator: cones scattered in the area
overrides: erosion
wave: 2
built: false
levels:
- planet-level.100-km
status: draft
basis:
- of:
  - identity
  - register
  - family
  - geometry
  - properties
  - trigger
  - generator
  - overrides
  - wave
  - built
  rule: rule.feature-relief-catalogue
- of:
  - layout
  rule: rule.relief-tectonic-port
layout:
- name: frame
  params:
  - name: rides
    value: 1.0
