# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.monogenetic-volcanic-field
  name: Monogenetic volcanic field
  about: 'A relief province of the volcanic family: monogenetic volcanic field.'
register: province
family: volcanic
geometry: polygon + point set
properties:
- field: cone density
  unit: 1/km2
trigger: rift or back-arc volcanism
generator: cones scattered in the area
overrides: erosion
wave: 2
built: false
levels:
- planet-level.100-km
status: draft
basis:
- of:
  - identity
  - register
  - family
  - geometry
  - properties
  - trigger
  - generator
  - overrides
  - wave
  - built
  rule: rule.feature-relief-catalogue
- of:
  - layout
  rule: rule.relief-tectonic-port
layout:
- name: frame
  unit: '1'
  meaning: '1: its pins sit in its plate''s frame (integer cm) and ride the crust, placed by planet-field.plate-rotation;
    0: a body-frame snapshot, remade from the present state each pass'
  rule: it rides its crust (the Python's line store anchored it to crust particles)
  params:
  - name: rides
    value: 1.0
    unit: '1'
    meaning: 1 rides, 0 snapshot
    source: 'planet-forge src/ride.rs (from the Python: stages/lines.py Store vs its rivers and coast)'
    open: true
