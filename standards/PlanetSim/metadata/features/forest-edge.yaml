# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.forest-edge
  name: Forest edge
  about: The edge between forest and grassland, set by rain.
register: cover
family: biotic
trigger: Shared boundary of supported forest and nonforest land cover after water/ice masks. Derive from resolved
  connected cover polygons; where only climate suitability exists label the edge climate-potential, and do not infer
  a real forest edge from annual rain alone. Apply finite-input, resolved-scale and candidate/provenance rules in
  docs/planet-feature-trigger-rules-2026-10-22.md; missing required evidence stays unknown, not a confirmed absence
  or occurrence.
trigger_params:
- name: EDGE_WIDTH_M
  value: 10000.0
  unit: m
  meaning: Presentation transition width around a resolved edge, not evidence of its positional accuracy; capped
    by feature width.
  open: true
  used: false
  source: docs/planet-feature-trigger-rules-2026-10-22.md
  note: Proposed recognition setting, not a physical simulation retune; unused until a detector explicitly consumes
    this feature-local value. Values chosen for review unless the meaning identifies a definitional convention.
built: false
status: draft
description: The edge between forest and grassland, set by rain.
size:
  across_m:
  - 1000.0
  - 10000000.0
  basis:
  - of:
    - across_m
    tier: invented
    review: true
    source: planet-forge 3c40281 docs/catalogue/kinds.py
    note: Supplied rough Earth size range in the catalogue draft; not a measured or validated range.
ladder:
- planet-level.10000-km
- planet-level.1-km
basis:
- of:
  - identity
  - register
  - family
  - description
  tier: sourced
  source: planet-forge 3c40281 docs/catalogue/kinds.py
  note: Transcribed proposed catalogue definition; not a claim of simulator implementation.
- of:
  - ladder
  tier: derived
  source: planet-forge 3c40281 docs/catalogue/kinds.py
  note: Derived from the proposed size range using the eight numeric bands; inherits size review.
- of:
  - trigger
  - trigger_params
  tier: invented
  review: true
  source: docs/planet-feature-trigger-rules-2026-10-22.md
  note: Owner-authorized detector proposal. Qualitative source definitions and provisional screening constants are
    distinguished in the source; not a built generator or calibrated occurrence rate. Missing support and subcell
    geometry remain unresolved.
