# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.talus-slope
  name: Talus slope
  about: 'A relief feature of the hillslope family: talus slope.'
register: feature
family: hillslope
geometry: polygon
properties:
- field: slope
  unit: deg
trigger: cliffs
generator: band below cliffs
wave: 3
built: false
levels:
- planet-level.10-km
- planet-level.1-km
status: draft
basis:
- of:
  - identity
  - register
  - family
  - geometry
  - properties
  - trigger
  - generator
  - overrides
  - wave
  - built
  rule: rule.feature-relief-catalogue
- of:
  - layout
  rule: rule.relief-tectonic-port
layout:
- name: frame
  params:
  - name: rides
    value: 1.0
