# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.tree-line
  name: Tree line
  about: The edge above or beyond which trees do not grow.
register: cover
family: biotic
trigger: Local climate-limited boundary between supported upright trees and colder nonforest land; exclude edges
  caused by drought, wetland, fire, clearing or substrate. Use growing-season temperature/duration and elevation
  with tree cover; annual-mean temperature alone supports only a provisional potential tree line. Apply finite-input,
  resolved-scale and candidate/provenance rules in docs/planet-feature-trigger-rules-2026-10-22.md; missing required
  evidence stays unknown, not a confirmed absence or occurrence.
trigger_params:
- name: TREE_WARM_MONTH_MIN_K
  value: 283.15
  unit: K
  meaning: Warmest-month tree-limit screening value; growing-season/cover evidence still required.
  open: true
  used: true
  source: docs/planet-feature-trigger-rules-2026-10-22.md
  note: Proposed recognition setting, not a physical simulation retune; unused until a detector explicitly consumes
    this feature-local value. Values chosen for review unless the meaning identifies a definitional convention.
    Planet-forge042215e now consults this warmest-month value; seasonal provenance still requires independent validation.
- name: EDGE_WIDTH_M
  value: 10000.0
  unit: m
  meaning: Presentation transition width around a resolved edge, not evidence of its positional accuracy; capped
    by feature width.
  open: true
  used: false
  source: docs/planet-feature-trigger-rules-2026-10-22.md
  note: Proposed recognition setting, not a physical simulation retune; unused until a detector explicitly consumes
    this feature-local value. Values chosen for review unless the meaning identifies a definitional convention.
built: false
status: draft
description: The edge above or beyond which trees do not grow.
size:
  across_m:
  - 1000.0
  - 10000000.0
  basis:
  - of:
    - across_m
    tier: invented
    review: true
    source: planet-forge 3c40281 docs/catalogue/kinds.py
    note: Supplied rough Earth size range in the catalogue draft; not a measured or validated range.
ladder:
- planet-level.10000-km
- planet-level.1-km
basis:
- of:
  - identity
  - register
  - family
  - description
  tier: sourced
  source: planet-forge 3c40281 docs/catalogue/kinds.py
  note: Transcribed proposed catalogue definition; not a claim of simulator implementation.
- of:
  - ladder
  tier: derived
  source: planet-forge 3c40281 docs/catalogue/kinds.py
  note: Derived from the proposed size range using the eight numeric bands; inherits size review.
- of:
  - trigger
  - trigger_params
  tier: invented
  review: true
  source: docs/planet-feature-trigger-rules-2026-10-22.md
  note: Owner-authorized detector proposal. Qualitative source definitions and provisional screening constants are
    distinguished in the source; not a built generator or calibrated occurrence rate. Missing support and subcell
    geometry remain unresolved.
