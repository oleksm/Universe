# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.alluvial-fan
  name: Alluvial fan
  about: 'A relief feature of the fluvial family: alluvial fan.'
register: feature
family: fluvial
geometry: polygon (cone)
properties:
- field: apex
  unit: point
- field: radius
  unit: m
- field: slope
  unit: deg
trigger: river leaving a range front, dry
generator: cone at the front
overrides: coalescence
wave: 2
built: false
levels:
- planet-level.100-km
applies_to:
- wet_epoch
status: draft
basis:
- of:
  - identity
  - register
  - family
  - geometry
  - properties
  - trigger
  - generator
  - overrides
  - wave
  - built
  rule: rule.feature-relief-catalogue
- of:
  - layout
  rule: rule.relief-tectonic-port
layout:
- name: frame
  params:
  - name: rides
    value: 0.0
