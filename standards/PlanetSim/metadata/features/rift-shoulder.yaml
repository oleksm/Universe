# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.rift-shoulder
  name: Rift shoulder
  about: 'A relief feature of the tectonic family: rift shoulder.'
register: feature
family: tectonic
geometry: polyline
properties:
- field: uplift
  unit: m
trigger: rift
generator: 40 km outside each margin
overrides: erosion (relief decays by rock and rain), tear at plate edges, sink with its crust
wave: 1
built: true
levels:
- planet-level.planet
- planet-level.continent
status: draft
basis:
- of:
  - identity
  - register
  - family
  - geometry
  - properties
  - trigger
  - generator
  - overrides
  - wave
  - built
  tier: derived
  note: 'planet-trees-pgs2 docs/relief-catalogue.json (tools/relief_catalogue.py, ff4f859), planets, 17 Oct 2026: the canonical
    feature catalogue.'
- of:
  - pinned_to
  - spans
  - dimensions
  - layout
  tier: derived
  note: 'planets, 17 Oct 2026: planet-forge relief-tectonic port (models/tectonic, src/ride.rs), read from planet-sim-landform
    9747f0d-c437724. The laws: stages/relief.py rift_features (the Python''s rules, its constants on the processes).'
  review: true
- of:
  - layout
  tier: derived
  note: 'planets, 17 Oct 2026: planet-forge relief-tectonic port (models/tectonic, src/ride.rs), read from planet-sim-landform
    9747f0d-c437724. frame and record from: proposed (the schema has no fields for them yet).'
  review: true
pinned_to: its line's first pin
spans:
- name: line
  meaning: its margin moved RIFT_SHOULDER_M away from the rift
dimensions:
- name: length
  unit: m
  meaning: along its line
  rule: measured on the span
- name: sinuosity
  unit: '1'
  meaning: path over chord
  rule: measured on the span
- name: turn per 100 km
  unit: deg
  meaning: mean turning
  rule: measured on the span
- name: straight share
  unit: '1'
  meaning: share of steps turning under 5 deg
  rule: measured on the span
- name: uplift
  unit: m
  meaning: uplift_m
- name: relief0
  unit: m
  meaning: its relief when made
- name: relief
  unit: m
  meaning: its relief now, worn by relief-erosion
  rule: relief0 exp(-t / tau), tau = TAU0_MYR / max(erodibility x wetness, rate floor)
layout:
- name: frame
  unit: '1'
  meaning: '1: its pins sit in its plate''s frame (integer cm) and ride the crust, placed by planet-field.plate-rotation;
    0: a body-frame snapshot, remade from the present state each pass'
  rule: it rides its crust (the Python's line store anchored it to crust particles)
  params:
  - name: rides
    value: 1.0
    unit: '1'
    meaning: 1 rides, 0 snapshot
    source: 'planet-forge src/ride.rs (from the Python: stages/lines.py Store vs its rivers and coast)'
    open: true
- name: record from
  unit: s
  meaning: 'recorded only while the planet is within this of its present: one older would be worn away by today, never made'
  rule: 'within its decay age (owner, 17 Oct 2026: "start models that make sense within their decay age")'
  formula: record while age_today - t <= RECORD_FROM_MYR
  params:
  - name: RECORD_FROM_MYR
    value: 9467280000000000.0
    unit: s
    said_as:
      unit: Myr
      factor: 31557600000000.0
    meaning: its decay age before the present
    source: stages/relief.py:59 RECORD_FROM_MYR['rift features']
    open: true
- name: facing
  unit: '1'
  meaning: the rift
