# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.landslide-rotational-translational
  name: Landslide (rotational / translational)
  about: 'A relief feature of the hillslope family: landslide (rotational / translational).'
register: feature
family: hillslope
geometry: polygon
properties:
- field: volume
  unit: m3
- field: runout
  unit: m
trigger: steep + weak rock + wet / quakes
generator: scar + deposit
wave: 3
built: false
levels:
- planet-level.10-km
- planet-level.1-km
status: draft
basis:
- of:
  - identity
  - register
  - family
  - geometry
  - properties
  - trigger
  - generator
  - overrides
  - wave
  - built
  rule: rule.feature-relief-catalogue
- of:
  - layout
  rule: rule.relief-tectonic-port
layout:
- name: frame
  unit: '1'
  meaning: '1: its pins sit in its plate''s frame (integer cm) and ride the crust, placed by planet-field.plate-rotation;
    0: a body-frame snapshot, remade from the present state each pass'
  rule: it rides its crust (the Python's line store anchored it to crust particles)
  params:
  - name: rides
    value: 1.0
    unit: '1'
    meaning: 1 rides, 0 snapshot
    source: 'planet-forge src/ride.rs (from the Python: stages/lines.py Store vs its rivers and coast)'
    open: true
