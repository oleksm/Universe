# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.temperate-broadleaf-forest
  name: Temperate broadleaf forest
  about: Leaf-shedding forest of mild wet climates.
register: cover
family: biotic
trigger: Temperate moist land with broadleaf-dominated woody cover, outside tropical, boreal, ice and dry masks.
  T in [TEMPERATE_MEAN_MIN_K, TROPICAL_MEAN_MIN_K), P >= TEMPERATE_RAIN_MIN_M_S and phi < FOREST_PHI_MAX seed climate
  suitability; phenology/cover evidence distinguishes broadleaf from evergreen needleleaf or cleared land. Apply
  finite-input, resolved-scale and candidate/provenance rules in docs/planet-feature-trigger-rules-2026-10-22.md;
  missing required evidence stays unknown, not a confirmed absence or occurrence.
trigger_params:
- name: TEMPERATE_MEAN_MIN_K
  value: 278.15
  unit: K
  meaning: Annual-mean temperate climate-potential bound; chosen.
  open: true
  used: true
  source: docs/planet-feature-trigger-rules-2026-10-22.md
  note: Proposed recognition setting, not a physical simulation retune; unused until a detector explicitly consumes
    this feature-local value. Values chosen for review unless the meaning identifies a definitional convention.
    Read by planet-forge c20fe5f relief-landscape; consulted does not mean calibrated, sole effective threshold
    or full trigger implementation.
- name: TROPICAL_MEAN_MIN_K
  value: 291.15
  unit: K
  meaning: Annual-mean warm-climate proxy only; not the monthly tropical climate criterion.
  open: true
  used: false
  source: docs/planet-feature-trigger-rules-2026-10-22.md
  note: Proposed recognition setting, not a physical simulation retune; unused until a detector explicitly consumes
    this feature-local value. Values chosen for review unless the meaning identifies a definitional convention.
- name: TEMPERATE_RAIN_MIN_M_S
  value: 1.901285268841737e-08
  unit: m/s
  meaning: 0.6m annual rain as SI rate, provisional forest-suitability threshold.
  open: true
  used: true
  source: docs/planet-feature-trigger-rules-2026-10-22.md
  note: Proposed recognition setting, not a physical simulation retune; unused until a detector explicitly consumes
    this feature-local value. Values chosen for review unless the meaning identifies a definitional convention.
    Read by planet-forge c20fe5f relief-landscape; consulted does not mean calibrated, sole effective threshold
    or full trigger implementation.
- name: FOREST_PHI_MAX
  value: 2.0
  unit: '1'
  meaning: Upper PET/P for provisional forest moisture suitability; chosen.
  open: true
  used: true
  source: docs/planet-feature-trigger-rules-2026-10-22.md
  note: Proposed recognition setting, not a physical simulation retune; unused until a detector explicitly consumes
    this feature-local value. Values chosen for review unless the meaning identifies a definitional convention.
    Read by planet-forge c20fe5f relief-landscape; consulted does not mean calibrated, sole effective threshold
    or full trigger implementation.
