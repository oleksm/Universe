# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.polje
  name: Polje
  about: 'A relief feature of the karst family: polje.'
register: feature
family: karst
geometry: polygon
properties:
- field: area
  unit: m2
- field: depth
  unit: m
trigger: limestone + faults
generator: flat-floored basin
wave: 2
built: false
levels:
- planet-level.100-km
applies_to:
- liquid_water_now
status: draft
basis:
- of:
  - identity
  - register
  - family
  - geometry
  - properties
  - trigger
  - generator
  - overrides
  - wave
  - built
  rule: rule.feature-relief-catalogue
- of:
  - layout
  rule: rule.relief-tectonic-port
layout:
- name: frame
  params:
  - name: rides
    value: 1.0
