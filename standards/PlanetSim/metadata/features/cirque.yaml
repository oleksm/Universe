# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.cirque
  name: Cirque
  about: 'A relief feature of the glacial family: cirque.'
register: feature
family: glacial
geometry: ring / point
properties:
- field: diameter
  unit: m
- field: floor height
  unit: m
- field: facing
  unit: deg
trigger: cold, above the snowline, shaded
generator: valley heads
wave: 2
built: false
levels:
- planet-level.100-km
applies_to:
- any_air
status: draft
basis:
- of:
  - identity
  - register
  - family
  - geometry
  - properties
  - trigger
  - generator
  - overrides
  - wave
  - built
  rule: rule.feature-relief-catalogue
- of:
  - layout
  rule: rule.relief-tectonic-port
layout:
- name: frame
  params:
  - name: rides
    value: 1.0
