# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.oceanic-plateau
  name: Oceanic plateau
  about: A thick raised area of ocean floor built by a plume (Ontong Java).
register: province
family: marine
trigger: Broad coherent positive oceanic-crust bathymetric anomaly with a relatively subdued summit and thickened/large-igneous-province
  crust evidence, distinct from narrow active ridge or isolated cone. Where only height anomaly exists retain elevated-ocean-floor
  candidate; no plateau geology inferred from depth alone. Apply finite-input, resolved-scale and candidate/provenance
  rules in docs/planet-feature-trigger-rules-2026-10-22.md; missing required evidence stays unknown, not a confirmed
  absence or occurrence.
trigger_params:
- name: OCEAN_PLATEAU_RELIEF_MIN_M
  value: 500.0
  unit: m
  meaning: Broad oceanic anomaly height screen; crustal/igneous evidence required.
  open: true
  used: false
  source: docs/planet-feature-trigger-rules-2026-10-22.md
  note: Proposed recognition setting, not a physical simulation retune; unused until a detector explicitly consumes
    this feature-local value. Values chosen for review unless the meaning identifies a definitional convention.
- name: OCEAN_PLATEAU_AREA_MIN_M2
  value: 100000000000.0
  unit: m2
  meaning: 100,000km2 operational large plateau screen; chosen.
  open: true
  used: false
  source: docs/planet-feature-trigger-rules-2026-10-22.md
  note: Proposed recognition setting, not a physical simulation retune; unused until a detector explicitly consumes
    this feature-local value. Values chosen for review unless the meaning identifies a definitional convention.
built: false
status: draft
description: A thick raised area of ocean floor built by a plume (Ontong Java).
size:
