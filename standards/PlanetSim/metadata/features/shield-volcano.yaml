# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.shield-volcano
  name: Shield volcano
  about: 'A relief landmark of the volcanic family: shield volcano.'
register: landmark
family: volcanic
geometry: point + ring
properties:
- field: height
  unit: m
- field: base diameter
  unit: m
- field: slope
  unit: deg
trigger: hotspot centre
generator: shield
overrides: erosion, drowning
wave: 1
built: false
levels:
- planet-level.10000-km
- planet-level.1000-km
status: draft
basis:
- of:
  - identity
  - register
  - family
  - geometry
  - properties
  - trigger
  - generator
  - overrides
  - wave
  - built
  rule: rule.feature-relief-catalogue
- of:
  - layout
  rule: rule.relief-tectonic-port
layout:
- name: frame
  params:
  - name: rides
    value: 1.0
