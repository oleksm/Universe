# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.hotspot-chain
  name: Hotspot chain
  about: 'A relief feature of the volcanic family: hotspot chain.'
register: feature
family: volcanic
geometry: polyline
properties:
- field: progression
  unit: km/Myr
- field: centre spacing
  unit: m
trigger: hotspot volcano records of a plume
generator: recent centres in age order
overrides: old end drowned
wave: 1
built: true
levels:
- planet-level.10000-km
- planet-level.1000-km
status: draft
basis:
- of:
  - identity
  - register
  - family
  - geometry
  - properties
  - trigger
  - generator
  - overrides
  - wave
  - built
  tier: derived
  note: 'planet-trees-pgs2 docs/relief-catalogue.json (tools/relief_catalogue.py, ff4f859), planets, 17 Oct 2026: the canonical
    feature catalogue.'
- of:
  - pinned_to
  - spans
  - dimensions
  - layout
  tier: derived
  note: 'planets, 17 Oct 2026: planet-forge relief-tectonic port (models/tectonic, src/ride.rs), read from planet-sim-landform
    9747f0d-c437724. The laws: stages/relief.py at_checkpoint (the Python''s rules, its constants on the processes).'
  review: true
- of:
  - layout
  tier: derived
  note: 'planets, 17 Oct 2026: planet-forge relief-tectonic port (models/tectonic, src/ride.rs), read from planet-sim-landform
    9747f0d-c437724. frame and record from: proposed (the schema has no fields for them yet).'
  review: true
pinned_to: its line's first pin (its oldest centre)
spans:
- name: line
  meaning: through a plume's recent centres oldest to youngest (the plate's path), cut at gaps
dimensions:
- name: length
  unit: m
  meaning: along its line
  rule: measured on the span
- name: sinuosity
  unit: '1'
  meaning: path over chord
  rule: measured on the span
- name: turn per 100 km
  unit: deg
  meaning: mean turning
  rule: measured on the span
- name: straight share
  unit: '1'
  meaning: share of steps turning under 5 deg
  rule: measured on the span
- name: centres
  unit: '1'
  meaning: how many
- name: spacing
  unit: m
  meaning: median between centres
- name: progression
  unit: m/s
  meaning: the plate's speed over the plume
  formula: path length / age span
layout:
- name: frame
  unit: '1'
  meaning: '1: its pins sit in its plate''s frame (integer cm) and ride the crust, placed by planet-field.plate-rotation;
    0: a body-frame snapshot, remade from the present state each pass'
  rule: it rides its crust (the Python's line store anchored it to crust particles)
  params:
  - name: rides
    value: 1.0
    unit: '1'
    meaning: 1 rides, 0 snapshot
    source: 'planet-forge src/ride.rs (from the Python: stages/lines.py Store vs its rivers and coast)'
    open: true
- name: record from
  unit: s
  meaning: 'recorded only while the planet is within this of its present: one older would be worn away by today, never made'
  rule: 'within its decay age (owner, 17 Oct 2026: "start models that make sense within their decay age")'
  formula: record while age_today - t <= RECORD_FROM_MYR
  params:
  - name: RECORD_FROM_MYR
    value: 3155760000000000.0
    unit: s
    said_as:
      unit: Myr
      factor: 31557600000000.0
    meaning: its decay age before the present
    source: stages/relief.py:59 RECORD_FROM_MYR['hotspot chain']
    open: true
