# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.great-escarpment
  name: Great escarpment
  about: 'A relief feature of the tectonic family: great escarpment.'
register: feature
family: tectonic
geometry: polyline
properties:
- field: height
  unit: m
- field: retreat
  unit: m
trigger: passive margin older than 30 Myr with ocean in front
generator: inland of the margin 80 km + 500 m/Myr (max 300 km), facing the ocean
overrides: erosion (relief decays by rock and rain), tear at plate edges, sink with its crust; retreat
wave: 1
built: true
levels:
- planet-level.10000-km
- planet-level.1000-km
status: draft
basis:
- of:
  - identity
  - register
  - family
  - geometry
  - properties
  - trigger
  - generator
  - overrides
  - wave
  - built
  rule: rule.feature-relief-catalogue
- of:
  - pinned_to
  - spans
  - dimensions
  - layout
  tier: derived
  note: 'planets, 17 Oct 2026: planet-forge relief-tectonic port (models/tectonic, src/ride.rs), read from planet-sim-landform
    9747f0d-c437724. The laws: stages/relief.py at_checkpoint (the Python''s rules, its constants on the processes).'
  review: true
- of:
  - layout
  rule: rule.relief-tectonic-port
pinned_to: its line's first pin
spans:
- name: line
  meaning: its passive margin moved inland by its retreat
dimensions:
- name: length
  unit: m
  meaning: along its line
  rule: measured on the span
- name: sinuosity
  unit: '1'
  meaning: path over chord
  rule: measured on the span
- name: turn per 100 km
  unit: deg
  meaning: mean turning
  rule: measured on the span
- name: straight share
  unit: '1'
  meaning: share of steps turning under 5 deg
  rule: measured on the span
- name: height
  unit: m
  meaning: height_m
- name: retreat
  unit: m
  meaning: how far inland of the margin
  rule: it starts ESCARP_INLAND_M inland and retreats ESCARP_RETREAT_M_MYR, to ESCARP_MAX_M
  formula: min(300 km, 80 km + 500 m/Myr x age)
- name: relief0
  unit: m
  meaning: its relief when made
- name: relief
  unit: m
  meaning: its relief now, worn by relief-erosion
  rule: relief0 exp(-t / tau), tau = TAU0_MYR / max(erodibility x wetness, rate floor)
layout:
- name: frame
  params:
  - name: rides
    value: 1.0
- name: record from
  unit: s
  meaning: 'recorded only while the planet is within this of its present: one older would be worn away by today, never made'
  rule: 'within its decay age (owner, 17 Oct 2026: "start models that make sense within their decay age")'
  formula: record while age_today - t <= RECORD_FROM_MYR
  params:
  - name: RECORD_FROM_MYR
    value: 1.262304e+16
    unit: s
    said_as:
      unit: Myr
      factor: 31557600000000.0
    meaning: its decay age before the present
    source: stages/relief.py:59 RECORD_FROM_MYR['great escarpment']
    open: true
- name: facing
  unit: '1'
  meaning: the ocean
