# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.playa-salt-pan
  name: Playa / salt pan
  about: 'A relief landmark of the arid family: playa / salt pan.'
register: landmark
family: arid
geometry: polygon
properties:
- field: area
  unit: m2
- field: level
  unit: m
trigger: closed lake records
generator: record + outline
wave: 1
built: true
levels:
- planet-level.10000-km
- planet-level.1000-km
applies_to:
- wet_epoch
status: draft
basis:
- of:
  - identity
  - register
  - family
  - geometry
  - properties
  - trigger
  - generator
  - overrides
  - wave
  - built
  rule: rule.feature-relief-catalogue
- of:
  - layout
  rule: rule.relief-tectonic-port
layout:
- name: frame
  params:
  - name: rides
    value: 1.0
