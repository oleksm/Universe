# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.boreal-forest-taiga
  name: Boreal forest taiga
  about: Conifer forest of long cold winters.
register: cover
family: biotic
trigger: Non-dry land in the cold forest climate envelope with warmest-month temperature >= TREE_WARM_MONTH_MIN_K
  and cold annual climate, backed by woody needleleaf cover. Annual mean in [BOREAL_MEAN_MIN_K, BOREAL_MEAN_MAX_K)
  and phi < FOREST_PHI_MAX may seed a climate-potential candidate only; absent growing-season/cover evidence leaves
  biome identity provisional. Apply finite-input, resolved-scale and candidate/provenance rules in docs/planet-feature-trigger-rules-2026-10-22.md;
  missing required evidence stays unknown, not a confirmed absence or occurrence.
trigger_params:
- name: BOREAL_MEAN_MIN_K
  value: 273.15
  unit: K
  meaning: Lower annual-mean boreal climate-potential threshold; chosen.
  open: true
  used: true
  source: docs/planet-feature-trigger-rules-2026-10-22.md
  note: Proposed recognition setting, not a physical simulation retune; unused until a detector explicitly consumes
    this feature-local value. Values chosen for review unless the meaning identifies a definitional convention.
    Read by planet-forge c20fe5f relief-landscape; consulted does not mean calibrated, sole effective threshold
    or full trigger implementation.
- name: BOREAL_MEAN_MAX_K
  value: 278.15
  unit: K
  meaning: Upper annual-mean boreal climate-potential threshold; chosen.
  open: true
  used: false
  source: docs/planet-feature-trigger-rules-2026-10-22.md
  note: Proposed recognition setting, not a physical simulation retune; unused until a detector explicitly consumes
    this feature-local value. Values chosen for review unless the meaning identifies a definitional convention.
- name: TREE_WARM_MONTH_MIN_K
  value: 283.15
  unit: K
  meaning: Warmest-month tree-limit screening value; growing-season/cover evidence still required.
  open: true
  used: false
  source: docs/planet-feature-trigger-rules-2026-10-22.md
  note: Proposed recognition setting, not a physical simulation retune; unused until a detector explicitly consumes
    this feature-local value. Values chosen for review unless the meaning identifies a definitional convention.
- name: FOREST_PHI_MAX
  value: 2.0
  unit: '1'
  meaning: Upper PET/P for provisional forest moisture suitability; chosen.
  open: true
  used: false
  source: docs/planet-feature-trigger-rules-2026-10-22.md
  note: Proposed recognition setting, not a physical simulation retune; unused until a detector explicitly consumes
    this feature-local value. Values chosen for review unless the meaning identifies a definitional convention.
built: false
status: draft
description: Conifer forest of long cold winters.
