  about: 'A relief feature of the coastal family: fringing reef.'
register: feature
family: coastal
geometry: polyline
properties:
- field: width
  unit: m
trigger: warm shallow sea
generator: along the coast
overrides: drowning
wave: 2
built: false
levels:
- planet-level.100-km
applies_to:
- oceans
status: draft
basis:
- of:
  - identity
  - register
  - family
  - geometry
  - properties
  - trigger
  - generator
  - overrides
  - wave
  - built
  rule: rule.feature-relief-catalogue
- of:
  - layout
  rule: rule.relief-tectonic-port
layout:
- name: frame
  params:
  - name: rides
    value: 0.0
