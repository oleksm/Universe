# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.meander-belt
  name: Meander belt
  about: 'A relief feature of the fluvial family: meander belt.'
register: feature
family: fluvial
geometry: polygon + loops
properties:
- field: wavelength
  unit: m
- field: amplitude
  unit: m
trigger: floodplain
generator: loops ~10 channel widths
overrides: migration
wave: 3
built: false
levels:
- planet-level.100-km
status: draft
basis:
- note: 'planet-trees-pgs2 docs/relief-catalogue.json (tools/relief_catalogue.py, ff4f859), planets, 17 Oct 2026: the canonical
    feature catalogue.'
  of:
  - identity
  - register
  - family
  - geometry
  - properties
  - trigger
  - generator
  - overrides
  - wave
  - built
  tier: derived
- of:
  - pinned_to
  - spans
  - dimensions
  - layout
  - parent_kinds
  review: true
  source: 'the laws'' notes: Moody and Troutman 2002; Leopold and Wolman 1957, 1960 (coefficients recalled, to check against
    the papers); figures marked open are invented'
  tier: sourced
- of:
  - layout
  tier: derived
  note: 'planets, 17 Oct 2026: planet-forge relief-tectonic port (models/tectonic, src/ride.rs), read from planet-sim-landform
    9747f0d-c437724. frame and record from: proposed (the schema has no fields for them yet).'
  review: true
pinned_to: the downstream end of its reach, on its river's centreline (a child of the floodplain or the river)
spans:
- meaning: the reach's valley axis, in cm east/north/up of the pin (the loops are drawn from the layout, seeded by the feature's
    seed)
  name: axis
dimensions:
- formula: n * channel width
  meaning: across the swept loops
  name: belt width
  params:
  - meaning: belt over channel width
    name: n
    note: invented, to review against Williams 1986 (Journal of Hydrology 88)
    open: true
    unit: '1'
    value: 6.0
  rule: about six channel widths (twice the loop amplitude)
  unit: m
layout:
- formula: k * channel width
  meaning: loop to loop along the valley
  name: wavelength
  params:
  - meaning: wavelength over width
    name: k
    note: Leopold and Wolman 1960, River meanders, GSA Bulletin 71
    range:
    - 10.0
    - 14.0
    unit: '1'
    value: 11.0
  rule: about 11 channel widths (Leopold and Wolman 1960, River meanders, GSA Bulletin 71)
  unit: m
- formula: r * channel width
  meaning: radius of curvature at the bend apex
  name: bend radius
  params:
  - meaning: radius over width
    name: r
    note: Leopold and Wolman 1960, River meanders, GSA Bulletin 71
    range:
    - 2.0
    - 3.0
    unit: '1'
    value: 2.5
  rule: two to three channel widths (Leopold and Wolman 1960, River meanders, GSA Bulletin 71)
  unit: m
- name: frame
  unit: '1'
  meaning: '1: its pins sit in its plate''s frame (integer cm) and ride the crust, placed by planet-field.plate-rotation;
    0: a body-frame snapshot, remade from the present state each pass'
  rule: it is the present state of an agent (water, sea, wind, the plates' meeting), remade each pass
  params:
  - name: rides
    value: 0.0
    unit: '1'
    meaning: 1 rides, 0 snapshot
    source: 'planet-forge src/ride.rs (from the Python: stages/lines.py Store vs its rivers and coast)'
    open: true
parent_kinds:
- planet-feature.floodplain
- planet-feature.trunk-river
