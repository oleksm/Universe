# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.arete
  name: Arete
  about: 'A relief feature of the glacial family: arete.'
register: feature
family: glacial
geometry: polyline
properties:
- field: height
  unit: m
trigger: cirques both sides of a crest
generator: crest segments between cirques
wave: 3
built: false
levels:
- planet-level.100-km
applies_to:
- any_air
status: draft
basis:
- of:
  - identity
  - register
  - family
  - geometry
  - properties
  - trigger
  - generator
  - overrides
  - wave
  - built
  rule: rule.feature-relief-catalogue
- of:
  - layout
  rule: rule.relief-tectonic-port
layout:
- name: frame
  params:
  - name: rides
    value: 1.0
