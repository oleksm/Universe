# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.rift-margin
  name: Rift margin
  about: 'A relief feature of the tectonic family: rift margin.'
register: feature
family: tectonic
geometry: polyline
properties:
- field: opening age
  unit: Myr
trigger: a plate breaks through continent
generator: continental crust along the cut, both halves
overrides: ages into a passive margin
wave: 1
built: true
levels:
- planet-level.10000-km
- planet-level.1000-km
status: draft
basis:
- of:
  - identity
  - register
  - family
  - geometry
  - properties
  - trigger
  - generator
  - overrides
  - wave
  - built
  rule: rule.feature-relief-catalogue
- of:
  - pinned_to
  - spans
  - dimensions
  - layout
  tier: derived
  note: 'planets, 17 Oct 2026: planet-forge relief-tectonic port (models/tectonic, src/ride.rs), read from planet-sim-landform
    9747f0d-c437724. The laws: stages/zones.py rift (the Python''s rules, its constants on the processes).'
  review: true
- of:
  - layout
  rule: rule.relief-tectonic-port
pinned_to: its line's first pin
spans:
- name: line
  meaning: the continental crust along the cut on one half, chained at once (LINK, smooth); both halves' margins carry the
    rift's key
dimensions:
- name: length
  unit: m
  meaning: along its line
  rule: measured on the span
- name: sinuosity
  unit: '1'
  meaning: path over chord
  rule: measured on the span
- name: turn per 100 km
  unit: deg
  meaning: mean turning
  rule: measured on the span
- name: straight share
  unit: '1'
  meaning: share of steps turning under 5 deg
  rule: measured on the span
layout:
- name: frame
  params:
  - name: rides
    value: 1.0
- name: record from
  unit: s
  meaning: 'recorded only while the planet is within this of its present: one older would be worn away by today, never made'
  rule: 'within its decay age (owner, 17 Oct 2026: "start models that make sense within their decay age")'
  formula: record while age_today - t <= RECORD_FROM_MYR
  params:
  - name: RECORD_FROM_MYR
    value: 1.57788e+16
    unit: s
    said_as:
      unit: Myr
      factor: 31557600000000.0
    meaning: its decay age before the present
    source: stages/relief.py:59 RECORD_FROM_MYR['rift margin']
    open: true
