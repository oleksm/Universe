# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.shore-platform
  name: Shore platform
  about: 'A relief feature of the coastal family: shore platform.'
register: feature
family: coastal
geometry: polygon
properties:
- field: width
  unit: m
trigger: cliffed coast
generator: band at the cliff foot
wave: 2
built: false
levels:
- planet-level.100-km
applies_to:
- oceans
status: draft
basis:
- of:
  - identity
  - register
  - family
  - geometry
  - properties
  - trigger
  - generator
  - overrides
  - wave
  - built
  rule: rule.feature-relief-catalogue
- of:
  - layout
  rule: rule.relief-tectonic-port
layout:
- name: frame
  params:
  - name: rides
    value: 0.0
