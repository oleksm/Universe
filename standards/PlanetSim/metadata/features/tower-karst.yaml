# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.tower-karst
  name: Tower karst
  about: 'A relief feature of the karst family: tower karst.'
register: feature
family: karst
geometry: point set
properties:
- field: height
  unit: m
trigger: tropical limestone, base-levelled
generator: towers
wave: 3
built: false
levels:
- planet-level.10-km
- planet-level.1-km
applies_to:
- liquid_water_now
status: draft
basis:
- of:
  - identity
  - register
  - family
  - geometry
  - properties
  - trigger
  - generator
  - overrides
  - wave
  - built
  rule: rule.feature-relief-catalogue
- of:
  - layout
  rule: rule.relief-tectonic-port
layout:
- name: frame
  params:
  - name: rides
    value: 1.0
