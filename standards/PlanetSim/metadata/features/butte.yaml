# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.butte
  name: Butte
  about: 'A relief feature of the structural family: butte.'
register: feature
family: structural
geometry: polygon
properties:
- field: height
  unit: m
trigger: mesa worn small
generator: remnant
overrides: shrink
wave: 3
built: false
levels:
- planet-level.10-km
- planet-level.1-km
status: draft
basis:
- of:
  - identity
  - register
  - family
  - geometry
  - properties
  - trigger
  - generator
  - overrides
  - wave
  - built
  rule: rule.feature-relief-catalogue
- of:
  - layout
  rule: rule.relief-tectonic-port
layout:
- name: frame
  params:
  - name: rides
    value: 1.0
