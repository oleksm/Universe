# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.ice-sheet-extent
  name: Ice sheet extent
  about: 'A relief province of the glacial family: ice sheet extent.'
register: province
family: glacial
geometry: polygon
properties:
- field: thickness
  unit: m
- field: time
  unit: now/LGM
trigger: ice fields
generator: outline
wave: 1
built: false
levels:
- planet-level.10000-km
- planet-level.1000-km
applies_to:
- any_air
status: draft
basis:
- of:
  - identity
  - register
  - family
  - geometry
  - properties
  - trigger
  - generator
  - overrides
  - wave
  - built
  rule: rule.feature-relief-catalogue
- of:
  - layout
  rule: rule.relief-tectonic-port
layout:
- name: frame
  params:
  - name: rides
    value: 0.0
