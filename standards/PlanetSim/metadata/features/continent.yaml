# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.continent
  name: Continent
  about: A large mass of continental crust standing above the ocean floor, with its shelves.
register: realm
family: tectonic
trigger: Coherent continental-crust realm, including its submerged shelf, with an emergent principal land component
  >= CONTINENT_AREA_MIN_M2 under the declared catalogue convention. Keep crust connectivity distinct from exposed
  coastline and do not count a marine channel as proof of different geological continents. Apply finite-input, resolved-scale
  and candidate/provenance rules in docs/planet-feature-trigger-rules-2026-10-22.md; missing required evidence stays
  unknown, not a confirmed absence or occurrence.
trigger_params:
- name: CONTINENT_AREA_MIN_M2
  value: 1000000000000.0
  unit: m2
  meaning: Operational continent/island size convention of one million km2; geology and topology remain required,
    not a universal definition.
  open: true
  used: true
  source: docs/planet-feature-trigger-rules-2026-10-22.md
  note: Proposed recognition setting, not a physical simulation retune; unused until a detector explicitly consumes
    this feature-local value. Values chosen for review unless the meaning identifies a definitional convention.
    Read by planet-forge c20fe5f relief-landscape; consulted does not mean calibrated, sole effective threshold
    or full trigger implementation.
built: false
status: draft
description: A large mass of continental crust standing above the ocean floor, with its shelves.
size:
  across_m:
  - 1000000.0
  - 10000000.0
  basis:
  - of:
    - across_m
    tier: invented
    review: true
    source: planet-forge 3c40281 docs/catalogue/kinds.py
    note: Supplied rough Earth size range in the catalogue draft; not a measured or validated range.
ladder:
- planet-level.10000-km
- planet-level.1000-km
basis:
- of:
  - identity
  - register
  - family
  - description
  tier: sourced
  source: planet-forge 3c40281 docs/catalogue/kinds.py
  note: Transcribed proposed catalogue definition; not a claim of simulator implementation.
- of:
  - ladder
  tier: derived
  source: planet-forge 3c40281 docs/catalogue/kinds.py
  note: Derived from the proposed size range using the eight numeric bands; inherits size review.
- of:
  - trigger
  - trigger_params
  tier: invented
  review: true
  source: docs/planet-feature-trigger-rules-2026-10-22.md
  note: Owner-authorized detector proposal. Qualitative source definitions and provisional screening constants are
    distinguished in the source; not a built generator or calibrated occurrence rate. Missing support and subcell
    geometry remain unresolved.
