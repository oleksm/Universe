# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.range-front-fault-bounded
  name: Range front (fault-bounded)
  about: 'A relief feature of the tectonic family: range front (fault-bounded).'
register: feature
family: tectonic
geometry: polyline
properties:
- field: throw
  unit: m
trigger: extension or thrusting next to low ground
generator: the scarp where relief drops
overrides: erosion (relief decays by rock and rain), tear at plate edges, sink with its crust
wave: 1
built: false
levels:
- planet-level.10000-km
- planet-level.1000-km
status: draft
basis:
- of:
  - identity
  - register
  - family
  - geometry
  - properties
  - trigger
  - generator
  - overrides
  - wave
  - built
  rule: rule.feature-relief-catalogue
- of:
  - layout
  rule: rule.relief-tectonic-port
layout:
- name: frame
  params:
  - name: rides
    value: 1.0
