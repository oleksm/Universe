# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.wadi
  name: Wadi
  about: 'A relief feature of the arid family: wadi.'
register: feature
family: arid
geometry: polyline
properties:
- field: depth
  unit: m
trigger: ephemeral rivers
generator: river lines in deserts
wave: 2
built: false
levels:
- planet-level.100-km
applies_to:
- any_air
- wet_epoch
status: draft
basis:
- of:
  - identity
  - register
  - family
  - geometry
  - properties
  - trigger
  - generator
  - overrides
  - wave
  - built
  rule: rule.feature-relief-catalogue
- of:
  - layout
  rule: rule.relief-tectonic-port
layout:
- name: frame
  params:
  - name: rides
    value: 1.0
