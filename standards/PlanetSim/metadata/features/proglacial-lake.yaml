# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.proglacial-lake
  name: Proglacial lake
  about: 'A relief feature of the glacial family: proglacial lake.'
register: feature
family: glacial
geometry: polygon + rings
properties:
- field: level
  unit: m
trigger: meltwater dammed by moraine or ice
generator: rings
wave: 2
built: false
levels:
- planet-level.100-km
applies_to:
- any_air
status: draft
basis:
- of:
  - identity
  - register
  - family
  - geometry
  - properties
  - trigger
  - generator
  - overrides
  - wave
  - built
  rule: rule.feature-relief-catalogue
- of:
  - layout
  rule: rule.relief-tectonic-port
layout:
- name: frame
  params:
  - name: rides
    value: 1.0
