# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.coastal-plain
  name: Coastal plain
  about: Low land of young sediment between an upland and the sea.
register: province
family: coastal
trigger: Low-relief emergent coastal region connected to a coastline, within COASTAL_REACH_M and COASTAL_PLAIN_HEIGHT_MAX_M
  above current sea, with local relief <= PLAIN_RELIEF_MAX_M. Depositional origin requires sediment/stratigraphic
  evidence; geometry alone remains a low coastal plain candidate, distinct from an uplifted marine terrace. Apply
  finite-input, resolved-scale and candidate/provenance rules in docs/planet-feature-trigger-rules-2026-10-22.md;
  missing required evidence stays unknown, not a confirmed absence or occurrence.
trigger_params:
- name: COASTAL_REACH_M
  value: 150000.0
  unit: m
  meaning: Regional search inland from a coast for low-plain candidates; chosen.
  open: true
  used: false
  source: docs/planet-feature-trigger-rules-2026-10-22.md
  note: Proposed recognition setting, not a physical simulation retune; unused until a detector explicitly consumes
    this feature-local value. Values chosen for review unless the meaning identifies a definitional convention.
- name: COASTAL_PLAIN_HEIGHT_MAX_M
  value: 200.0
  unit: m
  meaning: Maximum present sea-relative height for coarse coastal-plain candidates; chosen.
  open: true
  used: false
  source: docs/planet-feature-trigger-rules-2026-10-22.md
  note: Proposed recognition setting, not a physical simulation retune; unused until a detector explicitly consumes
    this feature-local value. Values chosen for review unless the meaning identifies a definitional convention.
- name: PLAIN_RELIEF_MAX_M
  value: 100.0
  unit: m
  meaning: Maximum relief over resolved context for plain candidates; chosen.
  open: true
  used: false
  source: docs/planet-feature-trigger-rules-2026-10-22.md
  note: Proposed recognition setting, not a physical simulation retune; unused until a detector explicitly consumes
    this feature-local value. Values chosen for review unless the meaning identifies a definitional convention.
built: false
applies_to:
- oceans
status: draft
description: Low land of young sediment between an upland and the sea.
size:
  across_m:
  - 20000.0
  - 500000.0
  basis:
  - of:
    - across_m
    tier: invented
    review: true
    source: planet-forge 3c40281 docs/catalogue/kinds.py
    note: Supplied rough Earth size range in the catalogue draft; not a measured or validated range.
ladder:
- planet-level.10000-km
- planet-level.100-km
basis:
- of:
  - identity
  - register
  - family
  - description
  tier: sourced
  source: planet-forge 3c40281 docs/catalogue/kinds.py
  note: Transcribed proposed catalogue definition; not a claim of simulator implementation.
- of:
  - ladder
  tier: derived
  source: planet-forge 3c40281 docs/catalogue/kinds.py
  note: Derived from the proposed size range using the eight numeric bands; inherits size review.
- of:
  - trigger
  - trigger_params
  tier: invented
  review: true
  source: docs/planet-feature-trigger-rules-2026-10-22.md
  note: Owner-authorized detector proposal. Qualitative source definitions and provisional screening constants are
    distinguished in the source; not a built generator or calibrated occurrence rate. Missing support and subcell
    geometry remain unresolved.
