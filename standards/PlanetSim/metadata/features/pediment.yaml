# yaml-language-server: $schema=../../schema/planet-feature.schema.yaml
identity:
  key: planet-feature.pediment
  name: Pediment
  about: 'A relief feature of the arid family: pediment.'
register: feature
family: arid
geometry: polygon
properties:
- field: slope
  unit: deg
trigger: arid range-front retreat
generator: band at the range foot
wave: 2
built: false
levels:
- planet-level.100-km
applies_to:
- any_air
status: draft
basis:
- of:
  - identity
  - register
  - family
  - geometry
  - properties
  - trigger
  - generator
  - overrides
  - wave
  - built
  rule: rule.feature-relief-catalogue
- of:
  - layout
  rule: rule.relief-tectonic-port
layout:
- name: frame
  params:
  - name: rides
    value: 1.0
