# yaml-language-server: $schema=../../root.schema.yaml
identity:
  key: root.planet-sim
  name: "Planet Simulator"
note: "The planet simulator's language (the owner, 17 Oct 2026): the levels of context from the whole planet down to detail, the fields with their units, the layers with their frozen class ids, the line kinds, the landmark types and how they age, the events, the mesher's laws, the measures against real ground, the deciding factors and landform patterns, and the sim's files. The models that mesh a planet are Planet LOD's (standards/PlanetLOD). The sim owns instances (where each line, landmark and river is on one planet, and every value); this root owns the words, units and rules, so the sim, the mesher, the LOD app and the agents speak one language. Rock is the Celestial root's (rock units, ground vocabularies). tools/standards/planet_lod_extract.py checks the sim against it; planet_lod_match.py, planet_lod_context.py and the generated module standards/PlanetSim/generated/planet_lod_words.py use it."
