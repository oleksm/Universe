identity:
  key: planet-process.impactor-scaling
  name: Impactor speed, focusing and crater-size scaling
  about: 'From the Moon to this world (Ivanov 2001): impactor speed at infinity v∞ = 17 km/s × sqrt(M_star/a), impact speed
    sqrt(v∞² + v_esc²); flux focusing (1 + (v_esc/v∞)²) against the Moon''s; crater diameter for the same impactor ∝ (g_moon/g)^0.22
    (v/v_moon)^0.43 (gravity-regime π-scaling); simple-complex transition D_t = 15 km × 1.62/g (Pike 1980); smallest crater
    the air lets through = 0.2 km × air_column.'
area: impacts
clock:
  when: once per world
reads:
- name: g
  unit: m/s²
  meaning: surface gravity
- name: v_esc
  unit: 'm/s (code: km/s)'
  meaning: escape speed
- name: a
  unit: 'm (code: AU)'
  meaning: semi-major axis
- name: star.mass
  unit: 'kg (code: M_sun)'
  meaning: star mass
- name: planet.air_column
  unit: '1'
  meaning: air screening vs Earth (0 airless)
writes:
- name: v_imp
  unit: 'm/s (code: km/s)'
  meaning: impact speed
- name: focus
  unit: '1'
  meaning: flux per area vs Moon
- name: size
  unit: '1'
  meaning: crater diameter vs Moon, same impactor
- name: d_t
  unit: 'm (code: km)'
  meaning: simple-complex transition
- name: d_screen
  unit: 'm (code: km)'
  meaning: air screening diameter
params:
- name: G_MOON
  value: 1.62
  unit: m/s2
  meaning: lunar gravity
  source: src/planet_sim/stages/impacts.py:40
- name: V_INF_1AU
  value: 17.0
  unit: '1'
  said_as:
    unit: km/s (1.7e4 m/s)
    factor: 1.0
  open: true
  meaning: impactor speed far away at 1 AU (Ivanov 2001)
  source: src/planet_sim/stages/impacts.py:41
  note: 'unit as the code says it: ''km/s (1.7e4 m/s)''; SI conversion unverified'
- name: V_ESC_MOON
  value: 2.38
  unit: '1'
  said_as:
    unit: km/s (2380 m/s)
    factor: 1.0
  open: true
  meaning: lunar escape speed
  source: src/planet_sim/stages/impacts.py:42
  note: 'unit as the code says it: ''km/s (2380 m/s)''; SI conversion unverified'
- name: D_SCREEN_KM
  value: 200.0
  unit: m
  said_as:
    unit: km
    factor: 1000.0
  meaning: craters smaller than this rare under Earth's air
  source: src/planet_sim/stages/impacts.py:43
- name: gravity exponent
  value: 0.22
  unit: '1'
  meaning: D ∝ g^−0.22
  source: src/planet_sim/stages/impacts.py:77
- name: velocity exponent
  value: 0.43
  unit: '1'
  meaning: D ∝ v^0.43
  source: src/planet_sim/stages/impacts.py:77
- name: transition base
  value: 15000.0
  unit: m
  said_as:
    unit: km
    factor: 1000.0
  meaning: D_t on Earth-scaled gravity (Pike 1980)
  source: src/planet_sim/stages/impacts.py:78
