identity:
  key: planet-process.lake-sea-beds
  name: Lake and sea bed shapes at tile resolution (Dean profile, deltas)
  about: 'The beds of lakes and seas at the fine tiles'' resolution: what lies under the water, so the water''s optics (water_optics.py)
    has a real floor to show. The coarse (5 km) heights know a basin''s depth; its shape near the shore, where the water is
    shallow enough to see through, they don''t. From the processes that make it (each approximate, documented): NOT INVENTORIED
    IN DETAIL: neither plates.py nor coupled.py imports bed.py (directly or through another module); it is used by tools/landcover_tiles.py.'
area: hydrology
clock:
  when: not part of the coupled planet run (offline tools / bakes)
