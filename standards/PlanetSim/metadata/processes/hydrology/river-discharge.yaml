# yaml-language-server: $schema=../../../schema/planet-process.schema.yaml
identity:
  key: planet-process.river-discharge
  name: River discharge with transmission losses (evaporation and seepage) and lake balance
  about: 'Runoff x cell is the source per sample (m3/yr). Samples are visited highest-first and pass their water to the receiver.
    Outside lakes, on land where PET > P, a river loses loss = min(q, (PET-P) x (WET_WIDTH + SEEP_WIDTH/(1 + Qs/SEEP_Q)) x
    w x spacing), channel width w = 2.7 Qs^0.5 m (Qs in m3/s), spacing = sqrt(cell): evaporation off the wetted channel/floodplain
    plus seepage into a dry bed that fades as flow grows (Nile ~1 % per 130 km; wadis soak away in one or two samples). Lake
    exits apply the lake balance (see planet-process.lakes). A closed lake passes nothing on. Q (m3/yr) is what leaves each
    sample; water_lost records losses.'
area: hydrology
clock:
  when: each coupled step; each 10-kyr recent-epoch step
reads:
- name: runoff
  unit: m/yr
  meaning: 'from climate (recent: mixed with melt)'
  field: planet-field.runoff
- name: down, order
  unit: index
  meaning: routing
  field: planet-field.receiver
- name: lid
  unit: index
  meaning: lakes
  field: planet-field.lake-id
- name: land
  unit: bool
  meaning: z > sea
  field: planet-field.height
- name: cell
  unit: m^2
- name: spacing
  unit: m
  meaning: sqrt(cell)
- name: PET
  field: planet-field.potential-evaporation
  unit: m/yr
  meaning: climate
- name: P
  field: planet-field.rain
  unit: m/yr
  meaning: climate
- name: zr_
  field: planet-field.routing-surface
  unit: m
  meaning: routing surface
- name: zf
  field: planet-field.filled-surface
  unit: m
  meaning: filled surface
- name: lakes
  field: planet-field.lake-budget
  unit: per lake
  meaning: each depression's area and capacity (from planet-process.lakes)
- name: lake_mem
  field: planet-field.lake-mark
  unit: 0-1
  meaning: the lake mark before the step
writes:
- name: Q
  unit: m3/yr (SI m3/s = /3.156e7)
  meaning: discharge leaving each sample
  field: planet-field.discharge
- name: water_lost
  unit: m3/yr
  meaning: water lost at each sample
  field: planet-field.water-lost
- name: lakes (lk)
  unit: per lake
  meaning: see lakes
  field: planet-field.lake-budget
- name: lake
  field: planet-field.lake
  meaning: the lakes' cover, laid in this pass with planet-process.lakes' rules (open or closed is decided here)
- name: lake_share
  field: planet-field.lake-share
  meaning: the lakes' cover, laid in this pass with planet-process.lakes' rules (open or closed is decided here)
- name: lake_level
  field: planet-field.lake-level
  meaning: the lakes' cover, laid in this pass with planet-process.lakes' rules (open or closed is decided here)
- name: lake_mem
  field: planet-field.lake-mark
  meaning: the lakes' cover, laid in this pass with planet-process.lakes' rules (open or closed is decided here)
params:
- name: WET_WIDTH
  value: 20.0
  unit: '1'
  said_as:
    unit: channel widths
    factor: 1.0
  open: true
  meaning: evaporating width (channel, floodplain, wetland)
  source: stages/coupled.py:49
  note: 'unit as the code says it: ''channel widths''; SI conversion unverified'
- name: SEEP_WIDTH
  value: 300.0
  unit: '1'
  said_as:
    unit: channel widths
    factor: 1.0
  open: true
  meaning: seepage width into a dry bed at low flow
  source: stages/coupled.py:50
  note: 'transmission losses; unit as the code says it: ''channel widths''; SI conversion unverified'
- name: SEEP_Q
  value: 5.0
  unit: m3/s
  meaning: flow at which seepage halves
  source: stages/coupled.py:51
- name: 'inline: year'
  value: 31560000.0
  unit: s
  meaning: seconds per year used for m3/yr -> m3/s
  source: stages/coupled.py:176
- name: 'inline: width coefficient'
  value: 2.7
  unit: s^0.5/m^0.5
  meaning: channel width w = a Q^b (Q in m3/s)
  source: stages/coupled.py:176
  note: w in m for Q in m3/s
- name: 'inline: width exponent'
  value: 0.5
  unit: '1'
  meaning: b in w = a Q^b
  source: stages/coupled.py:176
- name: 'inline: lake deficit floor'
  value: 3.168808781402895e-17
  unit: m/s
  said_as:
    unit: m/yr
    factor: 3.168808781402895e-08
  meaning: a closed lake's mean deficit (capacity / area) is floored at this in its area = inflow / deficit
  source: stages/coupled.py:173
random_draws:
- none
invariants:
- 'water balance: sum(runoff*cell) = sum(Q into the sea) + sum(water_lost) (closed-lake inflow counted in water_lost)'
- 0 <= loss <= q at every sample
- Q >= 0
depends_on:
- planet-process.coupled-climate
- planet-process.flow-routing
- planet-process.lakes
note: 'coupled.route_discharge (lines 61-67) is a plain accumulation without losses: defined, never called.'
backends:
- cpu
implementations:
- where: planet-sim-landform stages/coupled.py:route_water (lines 150-181)
  state: reference
- where: planet-forge crates/forge-core/src/models/surface/discharge.rs
  state: current
  note: planet-forge port (surface line, merged in forge main 370ab83)
applies_to:
- liquid_water_now
status: draft
basis:
- of:
  - params
  - clock
  - reads
  - writes
  tier: derived
  note: 'planets, 17 Oct 2026: inventory of the Python sim (planet-forge docs/registry-migration/surface.json), read from
    the code at planet-sim-landform 9747f0d-c437724.'
- of:
  - reads
  - writes
  - params
  tier: derived
  note: 'planets, 17 Oct 2026: planet-forge surface port (models/surface), read from planet-sim-landform 9747f0d-c437724.'
