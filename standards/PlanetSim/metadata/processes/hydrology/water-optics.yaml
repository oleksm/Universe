# yaml-language-server: $schema=../../../schema/planet-process.schema.yaml
identity:
  key: planet-process.water-optics
  name: Water column and bed optics for the renderer
  about: 'Light through water onto the bed and back: what water looks like from above, from what''s in it, how deep it is,
    and what lies on the bed. The reference (truth) for the renderer''s water, as world::ground_detail is for its ground:
    one set of physics for a tile''s colour (looking straight down) and the renderer''s per-pixel view (any angle). NOT INVENTORIED
    IN DETAIL: neither plates.py nor coupled.py imports water_optics.py (directly or through another module); it is used by
    tools/landcover_tiles.py, iss_view.py, water_test.py.'
area: hydrology
clock:
  when: not part of the coupled planet run (offline tools / bakes)
