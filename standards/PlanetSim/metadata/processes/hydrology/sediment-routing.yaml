# yaml-language-server: $schema=../../../schema/planet-process.schema.yaml
identity:
  key: planet-process.sediment-routing
  name: River sediment transport and deposition (lakes, alluvial fans, slow reaches, deltas)
  about: Routes the actual post-rock, bounded continental loss from the current denudation receipt. River and wind shares follow potential erosion fractions; their combined volume equals measured particle loss. River-mouth delta share
    is requested at the submerged receiver. Continental sedimentation applies receiver support and accommodation, adds physical volume, and sends only the unretained remainder to shelves or export.
area: hydrology
clock:
  when: each coupled step
reads:
- name: order, down
  unit: index
  field: planet-field.receiver
- name: lake
  unit: code
  field: planet-field.lake
- name: slope
  unit: m/m
  field: planet-field.routing-slope
- name: wear
  field: planet-field.wear-total
  unit: m
  meaning: all wear
- name: wear_wind
  field: planet-field.wear-wind
  unit: m
  meaning: wind wear (not water-borne)
- name: water_lost
  field: planet-field.water-lost
  unit: m3/yr
  meaning: losses
- name: Q
  field: planet-field.discharge
  unit: m3/yr
  meaning: discharge
- name: dust
  field: planet-field.dust
  unit: m
  meaning: dust laid this step (part of laid)
- name: land
  field: planet-field.height
  unit: m
  meaning: z > sea
- name: denuded
  field: planet-field.denuded
  unit: m
- name: crust-kind
  field: planet-field.crust-kind
  unit: '1'
writes:
- name: laid
  unit: m per step
  meaning: sediment + dust laid on land (returned and in hydro)
  field: planet-field.laid
params:
- name: SLOW_SLOPE
  value: 0.0002
  unit: '1'
  said_as:
    unit: m/m
    factor: 1.0
  open: true
  meaning: rivers this flat drop at least half their load
  source: stages/coupled.py:26
  note: 'unit as the code says it: ''m/m''; SI conversion unverified'
- name: 'inline: open-lake trap'
  value: 0.9
  unit: '1'
  said_as:
    unit: share
    factor: 1.0
  meaning: 'unverified: the code names it inline: open-lake trap without saying what it is'
  source: stages/coupled.py:340
- name: 'inline: closed-lake trap'
  value: 1.0
  unit: '1'
  said_as:
    unit: share
    factor: 1.0
  meaning: 'unverified: the code names it inline: closed-lake trap without saying what it is'
  source: stages/coupled.py:340
- name: 'inline: delta share'
  value: 0.5
  unit: '1'
  said_as:
    unit: share
    factor: 1.0
  meaning: laid at a river mouth
  source: stages/coupled.py:344
- name: 'inline: slow-reach drop'
  value: 0.5
  unit: '1'
  said_as:
    unit: share
    factor: 1.0
  meaning: minimum drop where slope < SLOW_SLOPE
  source: stages/coupled.py:348
- name: 'inline: lost-share floor'
  value: 3.168808781402895e-17
  unit: m3/s
  said_as:
    unit: m3/yr
    factor: 3.168808781402895e-08
  meaning: share of water lost = lost / max(Q + lost, this)
  source: stages/coupled.py:333
random_draws:
- none
invariants:
- river deposits + river outflow = actual river source volume
- river source + wind source = actual denuded continental volume
- laid >= 0
depends_on:
- planet-process.coupled-erosion
- planet-process.river-discharge
- planet-process.lakes
- planet-process.dust
- planet-process.denudation-and-rivers
note: 'Restored Rust pipeline: coupled erosion -> bounded denudation -> dust and sediment routing -> physical deposition. Existing transport rates retained. Deposits rejected by receiver type or capacity stay in the unretained budget.'
backends:
- cpu
implementations:
- where: planet-sim-landform stages/coupled.py:step (lines 329-352)
  state: reference
- where: planet-forge crates/forge-core/src/models/surface/sediment.rs
  state: current
  note: planet-forge port (surface line, merged in forge main 370ab83)
applies_to:
- liquid_water_now
status: draft
basis:
- of:
  - params
  - clock
  - reads
  - writes
  tier: derived
  note: 'planets, 17 Oct 2026: inventory of the Python sim (planet-forge docs/registry-migration/surface.json), read from the code at planet-sim-landform 9747f0d-c437724.'
- of:
  - reads
  - writes
  - params
  tier: derived
  note: 'planets, 17 Oct 2026: planet-forge surface port (models/surface), read from planet-sim-landform 9747f0d-c437724.'
events_emitted:
- event: planet-event.ledger-row
  where: Current-step erosion interval and conserved actual transport/deposition budget.
