# yaml-language-server: $schema=../../../schema/planet-process.schema.yaml
identity:
  key: planet-process.arcs-and-margin-erosion
  name: Arc growth behind trenches and subduction erosion of continental margins
  about: 'Particles within ARC_WIDTH (as ARC_WIDTH/R on the unit sphere) of any sunk particle, not themselves sunk, and on the same plate as the rider of their nearest trench point form the arc band. The volume ARC_PER_AREA * (#sunk
    * cell) is spread evenly: each band particle gains ARC_PER_AREA*#sunk/#band metres (floor thickness on ocean particles, volume*cell on continental ones). This is per step, scaled by consumed area, not by dt. New volcanic rock: greenstone
    while mantle T > G.KOMATIITE_MANTLE_K else arc_volcanic; arc_plutonic basement; cover grows to G.ARC_COVER; ore fertility (porphyry, epithermal, volcanic sulphur on continent; VMS, porphyry on island arcs) with gain e-fold G.ARC_FERTILE_M;
    grain along the trench. Where a continent rides over the trench, continental particles within ARC_WIDTH of a continent-ridden trench on the rider''s plate lose MARGIN_LOSS_PER_AREA*(#sunk under continent)/#margin*cell of volume
    (clamped at 0). Arc additions also go to the per-sample volcano record w.volc[''arc''] (metres and last time).'
area: plates
clock:
  when: every step with sunk particles
reads:
- name: sunk_at
  field: planet-field.trench-position
  unit: '1'
- name: w.sunk_plate
  field: planet-field.trench-plate
  unit: '1'
- name: w.xplate[over]
  field: planet-field.trench-rider-plate
  unit: '1'
- name: w.xcont[over]
  field: planet-field.trench-rider-continental
  unit: '1'
- name: (substep)
  field: planet-field.trench-time
  unit: s
- name: w.x
  field: planet-field.particle-position
  unit: '1'
- name: w.xcont
  field: planet-field.particle-continental
  unit: '1'
- name: w.xplate
  field: planet-field.particle-plate
  unit: '1'
- name: sank
  field: planet-field.particle-sunk
  unit: '1'
- name: h.column('t_mantle_k')
  meaning: 'geology: new crust''s rock (not ported)'
- name: w.xtop
  field: planet-field.particle-rock-top
  unit: '1'
- name: w.xbase
  field: planet-field.particle-rock-base
  unit: '1'
- name: w.xcover
  field: planet-field.particle-rock-cover
  unit: m
- name: h.column('t_mantle_k')
  field: planet-field.mantle-temperature
  unit: K
  meaning: new crust greenstone while the mantle is hot
writes:
- name: w.xfloor
  field: planet-field.particle-floor-thickness
  unit: m
  meaning: island arcs thicken the floor
- name: w.xvol
  field: planet-field.particle-volume
  unit: m3
  meaning: continental arcs grow, margins are eaten
- name: w.xtop, w.xbase, w.xcover, w.xfert, w.xdep, w.xgrain
  meaning: geology (not ported)
- name: w.volc['arc_last']
  field: planet-field.arc-last-active
  unit: s
- name: w.xtop
  field: planet-field.particle-rock-top
  unit: '1'
- name: w.xbase
  field: planet-field.particle-rock-base
  unit: '1'
- name: w.xcover
  field: planet-field.particle-rock-cover
  unit: m
params:
- name: ARC_WIDTH
  value: 250000.0
  unit: m
  meaning: arc band / margin-erosion reach behind the trench (used as ARC_WIDTH/R chord radius on the unit sphere)
  source: stages/plates.py:146
  note: 'real: arc-trench gaps 100-300 km'
- name: ARC_PER_AREA
  value: 1646.6666666666667
  unit: m
  meaning: 'Arc crust added per area of subducted floor (m3/m2), spread evenly over the arc band: base 3.8 km3/yr of arcs over 3.0 km2/yr of floor consumed, without the historical Python calibration multiplier.'
  source: 'Scholl & von Huene 2009 (arc addition 3.8 km3/yr); Parsons 1981 (3.0 km2/yr consumed): 1.27 km per km2; x1.75 = 2.22 km is the Python calibration to Earth crust volume (planet-sim-landform d7442bb, made together with its
    re-lay). planets, 20 Oct 2026: retried as experiment e55 once the continent outline is held by the processes alone (forge e53: 1.27 km gave 5.0e18 m3 on 29% of the planet, Earth 7.2e18 on 40%); e38 had rejected it under the leaky
    representation. Acceptance: volume 6.5-8e18 at 35-45% area, thickness kept, ocean age and texture unchanged; land reported, not targeted. Roll back to 1266.67 if it fails.'
  note: The owner-authorized forge_e38 comparison restored the historical Python multiplier 1.75 with corrected speeds. It raised final continental area from 36.06% to 59.17% and reduced exposed land from 24.68% to 17.56% at the same
    water inventory. Rejected and reverted on 19 Oct 2026; see planet-forge/docs/terrain-canvas-recovery.md. No forced land fraction.
- name: MARGIN_LOSS_PER_AREA
  value: 900.0
  unit: m
  meaning: 'subduction erosion: continental volume removed from the riding margin band per area of floor sunk under a continent'
  source: stages/plates.py:114
  note: Clift et al. 2009 (1.3-1.7 km3/yr over ~55% of trench)
- name: G.KOMATIITE_MANTLE_K
  value: 1648.0
  unit: K
  meaning: mantle temperature above which new crust is greenstone (geology.py:112)
  source: stages/plates.py:860
- name: G.ARC_FERTILE_M
  value: 6000.0
  unit: m
  meaning: arc crust per e-fold of ore fertility (geology.py:122)
  source: stages/plates.py:1144
- name: G.ARC_COVER
  value: 2500.0
  unit: m
  meaning: max arc cover (geology.py:155)
  source: stages/plates.py:1151
random_draws:
- none
invariants:
- 'arc gain total per step = ARC_PER_AREA * #sunk * cell (exact, split evenly)'
- margin volume never negative
depends_on:
- planet-process.subduction
backends:
- cpu
implementations:
- where: planet-sim-landform stages/plates.py:run (lines 1125-1170), volc() (lines 879-887)
  state: reference
status: draft
basis:
- of:
  - params
  - clock
  - reads
  - writes
  tier: derived
  note: 'planets, 17 Oct 2026: inventory of the Python sim (planet-forge docs/registry-migration/plates.json), read from the code at planet-sim-landform 9747f0d-c437724.'
- of:
  - params.ARC_PER_AREA
  tier: derived
  source: Scholl & von Huene 2009; Parsons 1981
  note: Base ratio 3.8 km3/yr divided by 3.0 km2/yr, converted to metres. The original Python multiplier 1.75 was a chosen volume calibration; the isolated forge_e38 comparison rejected restoring it with the corrected speed law. The
    default returns to the unmultiplied base ratio.
- of:
  - params
  tier: calibrated
  note: 'planets, 20 Oct 2026: ARC_PER_AREA x1.75 as experiment e55 (see params.1.source); the 20 Oct e54 launch wrote a stray key and ran at 1.27 km (aborted, a duplicate of e53).'
- of:
  - params
  tier: derived
  note: 'planets, 20 Oct 2026: e55 with x1.75 under the held outline: 1.6e19 m3 on 80% of the planet by 3850 Myr, sea level 4800 m, land 10% (continents hold 40 km and drown under the rising sea). Rejected; back to the sourced 1.27
    km. The gross crust budget is set by the floor consumed (10 km2/yr against Earth 3.0-3.4): the boundary length is the lever, not the rate per km2.'
- of:
  - params
  tier: calibrated
  note: 'planets, 20 Oct 2026 (owner: looks right for the game, try tweaks): ARC_PER_AREA x1.4 = 1.77 km as e56, between the sourced 1.27 (e53: 5.0e18 m3 on 29%) and x1.75 (e55: 1.7e19 on 80%).'
events_emitted:
- event: planet-event.arc
  where: 'forge: one per substep with arcs (volumes added and eaten)'
