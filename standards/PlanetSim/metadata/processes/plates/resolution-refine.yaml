  unit: '1'
- name: w.xmem
  field: planet-field.particle-river-change-time
  unit: s
- name: w.xmem
  field: planet-field.particle-lake-mark
  unit: '1'
- name: pts, stree, gap, cell, nbr
  meaning: the samples (every per-sample field resampled from the nearest old sample)
- name: (forge) next id
  field: planet-field.particle-id-next
  unit: '1'
events_emitted:
- event: planet-event.resolution-change
  where: stages/plates.py:937 (log)
- event: planet-event.relief-reanchor
  where: stages/plates.py:934
params:
- name: min samples
  value: 10000.0
  unit: '1'
  meaning: never coarser than this
  source: stages/plates.py:723
- name: deep past fraction
  value: 0.5
  unit: '1'
  meaning: 'unverified: the code names it deep past fraction without saying what it is'
  source: stages/plates.py:723
- name: last Gyr fraction
  value: 0.5
  unit: '1'
  meaning: 'unverified: the code names it last Gyr fraction without saying what it is'
  source: stages/plates.py:723
- name: schedule times
  values:
  - 3.15576e+16
  - 9467280000000000.0
  unit: '1'
  said_as:
    unit: 's before the end (code: Gyr)'
    factor: 1.0
  open: true
  meaning: 'unverified: the code names it schedule times without saying what it is'
  source: stages/plates.py:724
  note: 'unit as the code says it: ''s before the end (code: Gyr)''; SI conversion unverified'
- name: n
  value: 40000.0
  unit: '1'
  meaning: run() default samples
  source: stages/plates.py:776
- name: adaptive
  value: 0.0
  unit: '1'
  tier: invented
  meaning: '1: the lattice is adaptive (the ladder, 20 Oct 2026): at each stage, and every refine every of time, the Fibonacci lattice of n / fine fraction^2 points thinned to the density the record asks for: finer within refine reach
    of the active lines (sutures, arc fronts, orogen axes, thrust fronts, arc chains, folds, rift margins, shoulders, floors, scarps, typed coasts, escarpments) and the coast; 0: the Fibonacci lattice of the stage count'
  source: planets, 20 Oct 2026 (chosen); forge models/plates/refine.rs
- name: fine fraction
  value: 0.5
  unit: '1'
  tier: invented
  meaning: 'the fine spacing as a fraction of the stage spacing (0.5: four times the density on the lines)'
  source: planets, 20 Oct 2026 (chosen); forge models/plates/refine.rs
- name: refine reach
  value: 300000.0
  unit: m
  tier: invented
  meaning: the spacing ramps from the fine fraction at an active line to the stage spacing this far from it
  source: 'planets, 20 Oct 2026 (chosen: the entropy map zones belts and margins by 300 km); forge models/plates/refine.rs'
- name: refine every
  value: 1.57788e15
  unit: s
  tier: invented
  said_as:
    unit: Myr
    factor: 3.15576e13
  meaning: 'an adaptive lattice is laid again this often (the lines move with their plates; the crust re-lays on it); 0: only at the stages'
  source: 'planets, 20 Oct 2026 (chosen: the re-lay cadence, 50 Myr); forge models/plates/refine.rs'
random_draws:
- _refine takes rng but draws nothing.
invariants:
- continental volume conserved
- every old particle's volume lands somewhere
backends:
- cpu
implementations:
- where: planet-sim-landform stages/plates.py:progressive (716-724), _refine (727-744), run (929-937, 793-797)
  state: reference
status: draft
basis:
- of:
  - params
  - clock
  - reads
  - writes
  tier: derived
  note: 'planets, 17 Oct 2026: inventory of the Python sim (planet-forge docs/registry-migration/plates.json), read from the code at planet-sim-landform 9747f0d-c437724.'
- of:
  - params
  tier: invented
  note: 'planets, 20 Oct 2026: deep past and last-Gyr fractions 0.0625 and 0.25 -> 0.5 (30,000 of the manifest 60,000 through the history, 60,000 for the last 300 Myr). At 10,000 and 15,000 the crust reached the fine era with 190 km
    resolution and the fine lattice only rendered it smoothly (forge e76 at 60k: small bays 0.7% of the land, Earth at 60k 3.7%), and the two resolution changes dipped the land (late minimum 17.9%). e78.'
