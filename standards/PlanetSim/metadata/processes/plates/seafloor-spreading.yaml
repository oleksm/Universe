# yaml-language-server: $schema=../../../schema/planet-process.schema.yaml
identity:
  key: planet-process.seafloor-spreading
  name: 'Gaps: new ridge floor and continental stretching'
  about: Coverage gaps are classified by local plate kinematics. New ocean floor or rift stretching and ridge push require distinct plates bracketing the gap with positive normal separation. Nondivergent gaps already covered by continental
    thickness need no new marker; other gaps inherit the crust-read ocean source age, floor and geology. Numerical repair creates no newborn thermal floor, ridge force, ridge ores or continental stretching. The ledger separates physical
    births, ocean repairs and already-covered continental samples.
area: plates
clock:
  when: every step
reads:
- name: w.x
  field: planet-field.particle-position
  unit: '1'
- name: w.xcont
  field: planet-field.particle-continental
  unit: '1'
- name: w.xvol
  field: planet-field.particle-volume
  unit: m3
- name: w.xplate
  field: planet-field.particle-plate
  unit: '1'
- name: w.xage
  field: planet-field.particle-age
  unit: s
- name: (forge) next particle id
  field: planet-field.particle-id-next
  unit: '1'
- name: pts
  unit: unit vec
  meaning: samples
- name: sank
  field: planet-field.particle-sunk
  unit: '1'
- name: w.xtop
  field: planet-field.particle-rock-top
  unit: '1'
- name: w.xbase
  field: planet-field.particle-rock-base
  unit: '1'
- name: w.xcover
  field: planet-field.particle-rock-cover
  unit: m
- name: plate-spin
  field: planet-field.plate-spin
  unit: 1/s
- name: particle-floor-thickness
  field: planet-field.particle-floor-thickness
  unit: m
writes:
- name: w.x
  field: planet-field.particle-position
  unit: '1'
- name: w.xplate
  field: planet-field.particle-plate
  unit: '1'
- name: w.xcont
  field: planet-field.particle-continental
  unit: '1'
- name: w.xvol
  field: planet-field.particle-volume
  unit: m3
- name: w.xfloor
  field: planet-field.particle-floor-thickness
  unit: m
- name: w.xage
  field: planet-field.particle-age
  unit: s
- name: w.xsuture
  field: planet-field.particle-suture
  unit: s
- name: (forge) particle id
  field: planet-field.particle-id
  unit: '1'
- name: fronts (by particle)
  field: planet-field.particle-front-low
  unit: '1'
- name: fronts (by particle)
  field: planet-field.particle-front-high
  unit: '1'
- name: fronts (by particle)
  field: planet-field.particle-front-time
  unit: s
- name: force
  field: planet-field.plate-force
  unit: '1'
  meaning: ridge push
- name: (forge) next particle id
  field: planet-field.particle-id-next
  unit: '1'
- name: sank (cleared)
  field: planet-field.particle-sunk
  unit: '1'
- name: w.xtop
  field: planet-field.particle-rock-top
  unit: '1'
- name: w.xbase
  field: planet-field.particle-rock-base
  unit: '1'
- name: w.xcover
  field: planet-field.particle-rock-cover
  unit: m
- name: origin
  field: planet-field.particle-origin
  unit: '1'
params:
- name: GAP
  value: 0.75
  unit: '1'
  meaning: 'a sample farther than GAP*gap from every particle is an opening: new particle there (ridge floor or stretched continent)'
  source: stages/plates.py:46
  note: 'lattice''s own points lie within ~0.62 of one anywhere: chosen clear of that'
- name: STRETCH_MIN
  value: 20000.0
  unit: m
  meaning: a continental source particle thicker than 2*STRETCH_MIN stretches into an opening gap (gives half its volume) instead of the ocean opening
  source: stages/plates.py:175
  note: 'real: rifted margins 10-30 km before breakup; Whitmarsh et al. 2001; McKenzie 1978'
- name: OCEAN_CRUST
  value: 7000.0
  unit: m
  meaning: new ocean floor thickness (also reference thickness in elevation, and read() fallback)
  source: stages/plates.py:76
  note: m, (real) White et al. 1992
- name: RIDGE_PUSH
  value: 0.15
  unit: '1'
  meaning: 'weight of ridge push: at each opened sample, a unit tangent force from the new point toward the source particle, on the source plate'
  source: stages/plates.py:55
  note: Forsyth & Uyeda 1975
- name: stretch share
  value: 0.35
  unit: '1'
  meaning: share of the source's volume given to the stretched new particle
  source: stages/plates.py:1224
  note: 0.5 to e89; 0.35 from e90 with stretch threshold factor 1.2 (the margin taper)
- name: stretch threshold factor
  value: 1.2
  unit: '1'
  meaning: source must exceed 2*STRETCH_MIN to stretch
  source: stages/plates.py:1221
  note: '2.0 to e89: a 41 km source gave half and both halves (20 km) fell below 2 x STRETCH_MIN, so a rifted margin was one 20 km particle wide (the coast fell 13 km of crust in one sample). 1.2 from e90 with stretch share 0.35: the
    source keeps 65% (27 km), still above 1.2 x 20 km, and stretches again at the next opening: a tapered margin over 2-3 particles (Earth: 100-300 km)'
- name: new xsuture
  value: -3.15576e+22
  unit: s
  said_as:
    unit: Myr
    factor: -1000000000.0
  meaning: 'a new particle''s suture time: never sutured (w.add)'
  source: stages/plates.py:392
- name: new floor age
  value: 0.0
  unit: s
  meaning: new ridge floor's age
  source: stages/plates.py:1230
- name: worn-out continent
  value: 0.05
  unit: '1'
  meaning: continental particles with xvol <= 0.05*OCEAN_CRUST*cell (350 m equivalent) are dropped
  source: stages/plates.py:1210
  note: 'forge: the removal (the Python''s keep) runs here, just before the gaps; subduction marks the sunk'
- name: boundary search reach
  value: 3.0
  unit: '1'
  meaning: Local search radius in sample spacings for an opposite-side, different-plate neighbor bracketing a coverage gap. Positive relative normal separation is required for physical spreading.
  note: Chosen numerical search radius; not a geological rate or land-share calibration.
- name: vacated floor age
  value: 1893600000000000.0
  unit: s
  said_as:
    unit: Myr
    factor: 31560000000000.0
  meaning: 'the age of the floor laid where old floor foundered this substep (a vacated opening, not a ridge): 60 Myr sits at 5.2 km, near the foundered floor, where age 0 made a 2.6 km bright spot (a bubble) in every foundered site;
    the ridge keeps new floor age'
  source: 'planets, 20 Oct 2026 (chosen; e85: 36 local highs per 1000 ocean samples, a third young floor inside old); forge models/plates/spreading.rs'
  note: 0 before e86 (e51-e85)
random_draws:
- none
invariants:
- continental volume conserved across stretching and marker repair
- only positive normal plate divergence creates newborn floor
- repair markers inherit source thermal history and geology
depends_on:
- planet-process.subduction
- planet-process.crust-read
backends:
- cpu
implementations:
- where: planet-sim-landform stages/plates.py:run (lines 1213-1255)
  state: reference
applies_to:
- plates
status: draft
basis:
- of:
  - params
  - clock
  - reads
  - writes
  rule: rule.inventory-plates
events_emitted:
- event: planet-event.ledger-row
  where: 'forge: the continental volume this process made or removed this step (the Python''s ledger rows)'
