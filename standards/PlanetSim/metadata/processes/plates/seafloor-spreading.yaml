# yaml-language-server: $schema=../../../schema/planet-process.schema.yaml
# Migrated from the Python sim by planet-forge tools/migration/to_registry.py (planets, 17 Oct 2026); hand-kept from here.
identity:
  key: planet-process.seafloor-spreading
  name: 'Gaps: new ridge floor and continental stretching'
  about: 'After removal of sunk particles, every sample whose nearest particle is farther than GAP*gap is an opening. If the
    nearest (source) particle is continental and thicker than 2*STRETCH_MIN (xvol/cell), it stretches: half its volume goes
    to a new continental particle at the sample (age copied, rift geology, rift ores and evaporites in the arid band). Otherwise
    a new ocean floor particle (OCEAN_CRUST, age 0, MORB, VMS) is added at the sample on the source''s plate. Ridge push force
    from the new point toward the source is added to the source''s plate.'
area: plates
clock:
  when: every step
reads:
- name: w.x, w.xcont, w.xvol, w.xplate, w.xage
- name: pts
  unit: unit vec
  meaning: samples
writes:
- name: new particles (w.add)
  meaning: ridge floor or stretched continent
- name: w.xvol (source)
  unit: m3
  meaning: halved when stretched
- name: force
  meaning: ridge push
params:
- name: GAP
  value: 0.75
  unit: '1'
  meaning: 'a sample farther than GAP*gap from every particle is an opening: new particle there (ridge floor or stretched
    continent)'
  source: stages/plates.py:46
  note: 'lattice''s own points lie within ~0.62 of one anywhere: chosen clear of that'
- name: STRETCH_MIN
  value: 20000.0
  unit: m
  meaning: a continental source particle thicker than 2*STRETCH_MIN stretches into an opening gap (gives half its volume)
    instead of the ocean opening
  source: stages/plates.py:175
  note: 'real: rifted margins 10-30 km before breakup; Whitmarsh et al. 2001; McKenzie 1978'
- name: OCEAN_CRUST
  value: 7000.0
  unit: m
  meaning: new ocean floor thickness (also reference thickness in elevation, and read() fallback)
  source: stages/plates.py:76
  note: m, (real) White et al. 1992
- name: RIDGE_PUSH
  value: 0.15
  unit: '1'
  meaning: 'weight of ridge push: at each opened sample, a unit tangent force from the new point toward the source particle,
    on the source plate'
  source: stages/plates.py:55
  note: Forsyth & Uyeda 1975
- name: stretch share
  value: 0.5
  unit: '1'
  meaning: share of the source's volume given to the stretched new particle
  source: stages/plates.py:1224
- name: stretch threshold factor
  value: 2.0
  unit: '1'
  meaning: source must exceed 2*STRETCH_MIN to stretch
  source: stages/plates.py:1221
random_draws:
- none
invariants:
- stretching conserves continental volume
- after this step no sample is farther than GAP*gap from a particle
depends_on:
- planet-process.subduction
backends:
- cpu
implementations:
- where: planet-sim-landform stages/plates.py:run (lines 1213-1255)
  state: reference
status: draft
basis:
- of:
  - params
  - clock
  - reads
  - writes
  tier: derived
  note: 'planets, 17 Oct 2026: inventory of the Python sim (planet-forge docs/registry-migration/plates.json), read from the
    code at planet-sim-landform 9747f0d-c437724.'
