# Migrated from the Python sim by planet-forge tools/migration/to_registry.py (planets, 17 Oct 2026); hand-kept from here.
identity:
  key: planet-process.collision-and-docking
  name: 'Buoyant-buoyant contact: terrane docking, continental collision, obduction, stalling'
  about: 'For converging pairs where both are buoyant: an ocean particle (thick floor) docks: becomes continental with volume
    xfloor*cell; plain MORB becomes ophiolite with chromite. Between continental pairs the winner is the particle with the
    larger volume; ''fresh'' losers are those not sutured within SUTURE_MYR. For fresh pairs both sides get collisional metamorphism
    (schist top, cover >= G.SCHIST_COVER, orogenic gold, granite base and tin-tungsten where the last-read thickness >= G.TIN_THICK),
    grain along the contact, and ocean floor within OBDUCT*gap of a fresh winner is obducted as ophiolite continent (chromite,
    VMS x4, magnesite). Fresh losers lose COLLISION_LOSS of their volume. Every loser''s xsuture = now, and every loser joins
    the winner''s plate (the smaller continent sutures to the larger''s plate). A plate whose particles among winners+losers,
    x cell, reach STALL_AREA is stalled: rate <- max(STALL_FLOOR, rate*exp(-dt/STALL_MYR)). Continental pairs across different
    plates are recorded per plate pair as collision fronts (loser particle -> time) for welding.'
area: plates
clock:
  when: every step with buoyant-buoyant converging pairs
reads:
- name: converging pairs a,b
  unit: particle idx
  meaning: from subduction's overlap test
- name: w.xvol, w.xcont, w.xfloor, w.xsuture, w.xtop
- name: w.thick
  field: planet-field.crust-thickness
  unit: m per sample
  meaning: LAST read() thickness (stale by up to SEA_EVERY steps), for the granite test
writes:
- name: w.xcont, w.xvol
  unit: bool, m3
  meaning: docking, obduction, collision loss
- name: w.xsuture
  unit: Myr (code)
  meaning: time of last suture
- name: w.xplate
  unit: id
  meaning: losers transferred to winner's plate
- name: w.plates[pid].rate
  unit: '1'
  meaning: stall
- name: fronts[(u,v)]
  unit: dict particle->Myr
  meaning: collision fronts by plate pair
- name: geology fields
  meaning: ophiolite, schist, granite, ores
events_emitted:
- event: planet-event.relief-collision
  where: stages/plates.py:1107
params:
- name: BUOYANT
  value: 17000.0
  unit: m
  meaning: 'ocean floor at or above this does not subduct (buoyant like continent: docks)'
  source: stages/plates.py:92
  note: 'real: Cloos 1993, about 17 km'
- name: SUTURE_MYR
  value: 1577880000000000.0
  unit: s
  said_as:
    unit: Myr
    factor: 50.0
  meaning: a losing particle pays COLLISION_LOSS and gets metamorphic overprint only if last sutured more than this ago ('fresh')
  source: stages/plates.py:234
  note: a collision's main phase lasts some 50 Myr
- name: COLLISION_LOSS
  value: 0.1
  unit: '1'
  meaning: share of a losing continental particle's volume lost to the mantle at a fresh collision contact
  source: stages/plates.py:223
  note: 'code comment says ''chosen: a quarter'' but the value is 0.1 (stale comment); Scholl & von Huene 2009'
- name: OBDUCT
  value: 0.5
  unit: '1'
  meaning: ocean floor particles within OBDUCT*gap of a fresh winner become ophiolite continent
  source: stages/plates.py:237
  note: ophiolite sheets tens of km wide (chosen)
- name: STALL_AREA
  value: 75000000000.0
  unit: m2
  meaning: a plate is stalled this step only if (its particles among win+lose of collision pairs)*cell >= this
  source: stages/plates.py:231
  note: a few cells of 160 km
- name: STALL_MYR
  value: 1262304000000000.0
  unit: s
  said_as:
    unit: Myr
    factor: 40.0
  meaning: e-folding time of a colliding plate's rate decay
  source: stages/plates.py:226
  note: India slowed by ~3 over tens of Myr; Molnar & Stock 2009
- name: STALL_FLOOR
  value: 0.3
  unit: '1'
  meaning: a colliding plate's rate never falls below this
  source: stages/plates.py:229
  note: DeMets et al. 2010
- name: G.TIN_THICK
  value: 48000.0
  unit: m
  meaning: thickness for S-type granite under collision (geology.py:125)
  source: stages/plates.py:1074
- name: G.SCHIST_COVER
  value: 6000.0
  unit: m
  meaning: min cover after collision (geology.py:156)
  source: stages/plates.py:1078
random_draws:
- none
invariants:
- docking and obduction create continental volume = xfloor*cell (counted in budget 'collisions and docking')
- a loser pays COLLISION_LOSS at most once per SUTURE_MYR
depends_on:
- planet-process.subduction
- planet-process.crust-read
backends:
- cpu
implementations:
- where: planet-sim-landform stages/plates.py:run (lines 1046-1110)
  state: reference
status: draft
basis:
- of:
  - params
  - clock
  - reads
  - writes
  tier: derived
  note: 'planets, 17 Oct 2026: inventory of the Python sim (planet-forge docs/registry-migration/plates.json), read from the
    code at planet-sim-landform 9747f0d-c437724.'
