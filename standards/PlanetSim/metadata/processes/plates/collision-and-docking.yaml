# yaml-language-server: $schema=../../../schema/planet-process.schema.yaml
identity:
  key: planet-process.collision-and-docking
  name: 'Buoyant-buoyant contact: terrane docking, continental collision, obduction, stalling'
  about: 'For converging pairs where both are buoyant: an ocean particle (thick floor) docks: becomes continental with volume xfloor*cell; plain MORB becomes ophiolite with chromite. Between continental pairs the winner is the particle
    with the larger volume; ''fresh'' losers are those not sutured within SUTURE_MYR. For fresh pairs both sides get collisional metamorphism (schist top, cover >= G.SCHIST_COVER, orogenic gold, granite base and tin-tungsten where the
    last-read thickness >= G.TIN_THICK), grain along the contact, and ocean floor within OBDUCT*gap of a fresh winner is obducted as ophiolite continent (chromite, VMS x4, magnesite). Fresh losers lose COLLISION_LOSS of their volume.
    Every loser''s xsuture = now, and every loser joins the winner''s plate (the smaller continent sutures to the larger''s plate). A plate whose particles among winners+losers, x cell, reach STALL_AREA is stalled: rate <- max(STALL_FLOOR,
    rate*exp(-dt/STALL_MYR)). Continental pairs across different plates are recorded per plate pair as collision fronts (loser particle -> time) for welding.'
area: plates
clock:
  when: every step with buoyant-buoyant converging pairs
reads:
- name: w.x
  field: planet-field.particle-position
  unit: '1'
- name: w.xplate
  field: planet-field.particle-plate
  unit: '1'
- name: w.xcont
  field: planet-field.particle-continental
  unit: '1'
- name: w.xvol
  field: planet-field.particle-volume
  unit: m3
- name: w.xfloor
  field: planet-field.particle-floor-thickness
  unit: m
- name: w.xsuture
  field: planet-field.particle-suture
  unit: s
- name: spin
  field: planet-field.plate-spin
  unit: rad/s
- name: w.plates keys
  field: planet-field.plate-id
  unit: '1'
- name: w.plates[pid].rate
  field: planet-field.plate-rate
  unit: '1'
- name: w.xtop
  meaning: geology (not ported)
- name: w.thick
  field: planet-field.crust-thickness
  unit: m
  meaning: 'geology: tin granite (not ported)'
- name: sank
  field: planet-field.particle-sunk
  unit: '1'
  meaning: obduction leaves the sunk out
- name: w.xtop
  field: planet-field.particle-rock-top
  unit: '1'
- name: w.xbase
  field: planet-field.particle-rock-base
  unit: '1'
- name: w.xcover
  field: planet-field.particle-rock-cover
  unit: m
- name: w.xage
  field: planet-field.particle-age
  unit: s
- name: kind
  field: planet-field.crust-kind
  unit: '1'
- name: crust age
  field: planet-field.crust-age
  unit: s
writes:
- name: w.xcont
  field: planet-field.particle-continental
  unit: '1'
- name: w.xvol
  field: planet-field.particle-volume
  unit: m3
- name: w.xsuture
  field: planet-field.particle-suture
  unit: s
- name: w.xplate
  field: planet-field.particle-plate
  unit: '1'
- name: w.plates[pid].rate
  field: planet-field.plate-rate
  unit: '1'
- name: collided
  field: planet-field.plate-collided
  unit: '1'
- name: fronts[(u,v)]
  field: planet-field.particle-front-low
  unit: '1'
- name: fronts[(u,v)]
  field: planet-field.particle-front-high
  unit: '1'
- name: fronts[(u,v)]
  field: planet-field.particle-front-time
  unit: s
- name: geology fields
  meaning: not ported
- name: w.xtop
  field: planet-field.particle-rock-top
  unit: '1'
- name: w.xbase
  field: planet-field.particle-rock-base
  unit: '1'
- name: w.xcover
  field: planet-field.particle-rock-cover
  unit: m
- name: origin
  field: planet-field.particle-origin
  unit: '1'
events_emitted:
- event: planet-event.relief-collision
  where: stages/plates.py:1107
- event: planet-event.collision
  where: stages/plates.py:1104 (Z.collision)
params:
- name: BUOYANT
  value: 17000.0
  unit: m
  meaning: 'ocean floor at or above this does not subduct (buoyant like continent: docks)'
  source: stages/plates.py:92
  note: 'real: Cloos 1993, about 17 km'
- name: SUTURE_MYR
  value: 1577880000000000.0
  unit: s
  said_as:
    unit: Myr
    factor: 50.0
  meaning: a losing particle pays COLLISION_LOSS and gets metamorphic overprint only if last sutured more than this ago ('fresh')
  source: stages/plates.py:234
  note: a collision's main phase lasts some 50 Myr
- name: COLLISION_LOSS
  value: 0.1
  unit: '1'
  meaning: share of a losing continental particle's volume lost to the mantle at a fresh collision contact
  source: stages/plates.py:223
  note: 'code comment says ''chosen: a quarter'' but the value is 0.1 (stale comment); Scholl & von Huene 2009'
- name: OBDUCT
  value: 0.5
  unit: '1'
  meaning: ocean floor particles within OBDUCT*gap of a fresh winner become ophiolite continent
  source: stages/plates.py:237
  note: ophiolite sheets tens of km wide (chosen)
- name: STALL_AREA
  value: 75000000000.0
  unit: m2
  meaning: a plate is stalled this step only if (its particles among win+lose of collision pairs)*cell >= this
  source: stages/plates.py:231
  note: a few cells of 160 km
- name: STALL_MYR
  value: 1262304000000000.0
  unit: s
  said_as:
    unit: Myr
    factor: 40.0
  meaning: e-folding time of a colliding plate's rate decay
  source: stages/plates.py:226
  note: India slowed by ~3 over tens of Myr; Molnar & Stock 2009
- name: STALL_FLOOR
  value: 0.3
  unit: '1'
  meaning: a colliding plate's rate never falls below this
  source: stages/plates.py:229
  note: DeMets et al. 2010
- name: G.TIN_THICK
  value: 48000.0
  unit: m
  meaning: thickness for S-type granite under collision (geology.py:125)
  source: stages/plates.py:1074
- name: G.SCHIST_COVER
  value: 6000.0
  unit: m
  meaning: min cover after collision (geology.py:156)
  source: stages/plates.py:1078
- name: OVERLAP
  value: 0.5
  unit: '1'
  meaning: particles of two plates closer than OVERLAP*gap overlap (candidate convergence pair)
  source: stages/plates.py:43
  note: 'chosen (also subduction''s: one pair search in the Python)'
- name: SLIP
  value: 0.35
  unit: '1'
  meaning: two overlapping particles of different plates count as converging only if their closing speed exceeds SLIP x |relative velocity|; below it they slide past (transform)
  source: stages/plates.py:41
  note: 'chosen: transform-like within about 70 deg (also subduction''s: one pair search in the Python)'
- name: COLLISION_RESISTANCE
  value: 5000000000000.0
  unit: N/m
  meaning: 'vector plates: the force per metre of continental contact a collision belt holds against (its crust''s excess potential energy); a plate stalls when its contact length times this reaches its driving force (the sum of its
    boundary forces this substep)'
  source: 'Molnar & Lyon-Caen 1988 (GSA Special Paper 218): Tibet''s excess potential energy, a few 10^12 N/m'
  note: sourced (order of magnitude); replaces STALL_AREA (a count of sample cells) for the vector plates
- name: COLLISION_COUPLING
  value: 4.0e+22
  unit: Pa s
  meaning: 'vector plates: colliding plates resist each other with force per metre of contact = COLLISION_COUPLING x their closing speed: 2 x viscosity x thickness / width of the collision zone (2 x 1e23 Pa s x 100 km / 500 km: strong
    continental lithosphere across the belt, 2 x OROGEN_HALF_WIDTH)'
  source: England & Molnar 1997 (Tibet's weak crust ~1e22 Pa s; continental lithosphere 1e22-1e23); Molnar & Lyon-Caen 1988
  note: '19 Oct 2026: was 2e21 (Tibet''s crust over 1000 km); continents in contact are near-solid at plate scale; figures from memory: verify'
- name: OROGEN_HALF_WIDTH
  value: 250000.0
  unit: m
  said_as:
    unit: km
    factor: 0.001
  meaning: 'vector plates: the shortened crust of a continental collision thickens a belt this wide on each side of the suture (the colliding continents keep their outlines); the belt widens further by lower-crust flow'
  source: 'collisional orogen widths: Alps ~200 km, Zagros and Himalaya ~250-350 km across the thrust belt (e.g. Dewey & Burke 1973; Molnar & Lyon-Caen 1988)'
  note: '19 Oct 2026, replaces the 125 km strip (ARC_WIDTH/2); from memory: verify'
- name: pocket max area
  value: 680000000000.0
  unit: m2
  meaning: 'a connected patch of ocean-kind samples with at most this area, every sample older than pocket min age, is a trapped pocket (the remnant of a closed ocean, which on Earth is filled and thrust up): its ocean particles dock
    as continent (ophiolite); 0 = off'
  source: 'planets, 20 Oct 2026 (chosen; e82: an 8-sample sea 6.6 km deep inside a continent); forge models/plates/collision.rs'
  note: '6.8e11 (40 cells at 30,000) e83-e86 and from e88; 2.0e12 in e87 docked the 100-160-sample trapped seas but as 7 km floor volume the read puts below the sea (interiors 11% drowned, land 28.6%): the dock needs the sea-level thickness
    or a sediment fill before the larger seas are taken'
- name: pocket link
  value: 1.5
  unit: '1'
  meaning: the ocean particles within this many sample gaps of a pocket sample dock (the pocket rule)
  source: planets, 20 Oct 2026 (chosen); forge models/plates/collision.rs
- name: pocket min age
  value: 3156000000000000.0
  unit: s
  said_as:
    unit: Myr
    factor: 31560000000000.0
  meaning: 'a patch docks as a pocket only when all its floor is older than this (100 Myr): a young rift strait keeps opening, a basin that sat shut for 100 Myr is filled'
  source: planets, 20 Oct 2026 (chosen); forge models/plates/collision.rs
- name: pocket surround
  value: 1.0
  unit: '1'
  meaning: 'a patch docks as a pocket only when the distinct continental particles within pocket link of its members number at least this times the patch (shut inside continent, not cut off by the empty space subduction leaves: e83
    docked 4,500 such particles)'
  source: planets, 20 Oct 2026 (chosen); forge models/plates/collision.rs
  note: 'unused since e85: the pocket test moved to the sample graph (a maximal patch of ocean-kind samples is shut in by construction); the particle-level test (e83, e84) saw single old particles at a margin as shut in because the
    particle field is sparse at sea'
random_draws:
- none
invariants:
- docking and obduction create continental volume = xfloor*cell (counted in budget 'collisions and docking')
- a loser pays COLLISION_LOSS at most once per SUTURE_MYR
depends_on:
- planet-process.subduction
- planet-process.crust-read
backends:
- cpu
implementations:
- where: planet-sim-landform stages/plates.py:run (lines 1046-1110)
  state: reference
status: draft
basis:
- of:
  - params
  - clock
  - reads
  - writes
  tier: derived
  note: 'planets, 17 Oct 2026: inventory of the Python sim (planet-forge docs/registry-migration/plates.json), read from the code at planet-sim-landform 9747f0d-c437724.'
- of:
  - params.COLLISION_RESISTANCE
  tier: sourced
  note: 'planets, 18 Oct 2026: the vector plates (planet-forge vector-core) take physical boundary forces per metre; no sample weights.'
  source: Molnar & Lyon-Caen 1988
- of:
  - params.COLLISION_COUPLING
  tier: derived
  review: true
  note: '2 x 1e22 Pa s (England & Molnar 1997) x 100 km / 1000 km; checked against Molnar & Lyon-Caen 1988 (~5e12 N/m). Figures from memory, 18 Oct 2026: check.'
- of:
  - params.OROGEN_HALF_WIDTH
  tier: sourced
  source: Dewey & Burke 1973; Molnar & Lyon-Caen 1988
  review: true
  note: 'From memory, 19 Oct 2026: check.'
