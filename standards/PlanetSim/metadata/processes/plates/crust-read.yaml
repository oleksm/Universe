# yaml-language-server: $schema=../../../schema/planet-process.schema.yaml
identity:
  key: planet-process.crust-read
  name: Reading the particle crust onto the samples
  about: 'read(): continental thickness = Gaussian (h = KERNEL*gap, cut 3h, weights normalised per particle so each particle''s volume is spread exactly) sum / cell; kind = continent where >= CONTINENT_EDGE. Plate from the nearest particle;
    age by inverse-distance weighting over the 4 nearest, replaced on ocean samples by the nearest ocean particle''s age; floor thickness from the nearest ocean particle. Geology from the nearest continental particle on continent, nearest
    ocean particle elsewhere; arc_plutonic older than G.SHIELD_MYR shows as basement; rock unit by majority vote of each sample and its 6 neighbours (own vote counted twice), two passes. Note: read() writes World fields used later in
    the step (thick, kind), so snapshot cadence changes the run (docstring).'
area: plates
clock:
  when: every denudation pass, every snapshot/history call, final; _continental also in spread passes and remesh
reads:
- name: w.x
  field: planet-field.particle-position
  unit: '1'
- name: w.xcont
  field: planet-field.particle-continental
  unit: '1'
- name: w.xvol
  field: planet-field.particle-volume
  unit: m3
- name: w.xplate
  field: planet-field.particle-plate
  unit: '1'
- name: w.xage
  field: planet-field.particle-age
  unit: s
- name: w.xfloor
  field: planet-field.particle-floor-thickness
  unit: m
- name: w.xtop, w.xbase, w.xcover, w.xgrain, w.xfert, w.xdep
  meaning: particle geology (rock, grain, ores)
- name: w.xmem
  field: planet-field.particle-peak-discharge
  unit: m3/s
- name: w.xmem
  field: planet-field.particle-incision
  unit: m
- name: w.xmem
  field: planet-field.particle-river-state
  unit: '1'
- name: w.xmem
  field: planet-field.particle-river-change-time
  unit: s
- name: w.xmem
  field: planet-field.particle-lake-mark
  unit: '1'
- name: origin
  field: planet-field.particle-origin
  unit: '1'
- name: sea level
  field: planet-field.sea-level
  unit: m
writes:
- name: w.thick
  field: planet-field.crust-thickness
  unit: m
- name: w.kind
  field: planet-field.crust-kind
  unit: code
- name: w.plate
  field: planet-field.plate
  unit: id
- name: w.age
  field: planet-field.crust-age
  unit: Myr
- name: w.floor
  field: planet-field.ocean-floor-thickness
  unit: m
- name: w.rock, w.grain, w.fert, w.dep
  field: planet-field.rock
- name: cs[...] = xmem[nearest particle]
  field: planet-field.peak-discharge
- name: cs[...] = xmem[nearest particle]
  field: planet-field.incision
- name: cs[...] = xmem[nearest particle]
  field: planet-field.river-state
- name: cs[...] = xmem[nearest particle]
  field: planet-field.river-change-time
- name: cs[...] = xmem[nearest particle]
  field: planet-field.lake-mark
- name: crust origin
  field: planet-field.crust-origin
  unit: '1'
params:
- name: KERNEL
  value: 0.8
  unit: '1'
  meaning: Gaussian width h = KERNEL*gap for spreading continental particle volume onto samples (cut at 3h)
  source: stages/plates.py:215
- name: CONTINENT_EDGE
  value: 15000.0
  unit: m
  meaning: a sample whose spread continental thickness is below this reads as ocean
  source: stages/plates.py:213
  note: 'Continental crust is thinner than this (m) where only a particle''s edge reaches: ocean'
- name: OCEAN_CRUST
  value: 7000.0
  unit: m
  meaning: new ocean floor thickness (also reference thickness in elevation, and read() fallback)
  source: stages/plates.py:76
  note: m, (real) White et al. 1992
- name: OCEAN
  value: 0.0
  unit: '1'
  meaning: kind code of ocean floor (w.kind, OCEAN/CONTINENT)
  source: stages/plates.py:38
  note: OCEAN, CONTINENT = 0, 1
- name: CONTINENT
  value: 1.0
  unit: '1'
  meaning: kind code of continental crust
  source: stages/plates.py:38
  note: OCEAN, CONTINENT = 0, 1
- name: kernel cutoff
  value: 3.0
  unit: '1'
  meaning: 'unverified: the code names it kernel cutoff without saying what it is'
  source: stages/plates.py:483
- name: age IDW neighbours
  value: 4.0
  unit: '1'
  meaning: 'unverified: the code names it age IDW neighbours without saying what it is'
  source: stages/plates.py:503
- name: vote neighbours
  value: 7.0
  unit: '1'
  meaning: 'unverified: the code names it vote neighbours without saying what it is'
  source: stages/plates.py:533
- name: vote passes
  value: 2.0
  unit: '1'
  meaning: 'unverified: the code names it vote passes without saying what it is'
  source: stages/plates.py:534
- name: G.SHIELD_MYR
  value: 4.73364e+16
  unit: s
  said_as:
    unit: Myr
    factor: 1500.0
  meaning: geology.py:730
  source: stages/plates.py:529
- name: coast kernel
  value: 0.5
  unit: '1'
  meaning: 'the kind (continent or ocean) is read with a Gaussian this many sample spacings wide (0: off, the KERNEL read); where that read and the KERNEL read disagree on the kind, the narrow thickness stands, so the coast carries
    the sub-500 km features the particles hold (forge shape audit: the 0.8-gap read left one-ring bays at 1% of the land against Earth 5%; the 0.5-gap re-read of the same particles gave 6%) while the interior keeps the wide smooth read'
  source: planets, 20 Oct 2026 (chosen); docs/shape-audit-2026-10-20.md section 2.2; forge models/plates/read.rs; e74
random_draws:
- none
invariants:
- sum(thick*cell) == continental volume (kernel normalised per particle)
backends:
- cpu
implementations:
- where: planet-sim-landform stages/plates.py:read (lines 493-540), _continental (477-490)
  state: reference
status: draft
basis:
- of:
  - params
  - clock
  - reads
  - writes
  tier: derived
  note: 'planets, 17 Oct 2026: inventory of the Python sim (planet-forge docs/registry-migration/plates.json), read from the code at planet-sim-landform 9747f0d-c437724.'
depends_on:
  +: planet-process.isostatic-elevation
