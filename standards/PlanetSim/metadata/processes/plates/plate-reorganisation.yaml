# yaml-language-server: $schema=../../../schema/planet-process.schema.yaml
identity:
  key: planet-process.plate-reorganisation
  name: Reorganisation clock, supercontinent insulation and plate count keeping
  about: 'After each step: a plate whose continental particle share (counts from the start of the step, over the current total) exceeds BIG_SHARE starts/keeps big_since; past INSULATE_MYR it is ''insulated''. If plates < 0.75*PLATES
    the reorganisation is brought forward to now. At reorganisation time (next_reorg, redrawn uniform in REORGANISE_MYR, counted) or if any plate is insulated: empty plates are deleted; insulated plates are rifted (any cut). Only when
    none is insulated, extra top-up rifts = int(uniform < RIFT_CHANCE) + max(0, PLATES - #plates - 2), each on the plate with most ocean particles (RIFT_TOPUP_OCEAN) or most particles, rifted ocean-only if RIFT_TOPUP_OCEAN.'
area: plates
clock:
  when: every step check; reorganisations every 100-250 Myr (uniform), or immediately when plates < 0.75*PLATES, or when a plate is insulated
reads:
- name: w.xplate
  field: planet-field.particle-plate
  unit: '1'
- name: w.xcont
  field: planet-field.particle-continental
  unit: '1'
- name: w.plates keys
  field: planet-field.plate-id
  unit: '1'
- name: w.plates[pid].big_since
  field: planet-field.plate-big-since
  unit: s
- name: next_reorg
  field: planet-field.next-reorganisation
  unit: s
- name: w.xage
  field: planet-field.particle-age
  unit: s
writes:
- name: next_reorg
  field: planet-field.next-reorganisation
  unit: s
- name: w.plates[pid].big_since
  field: planet-field.plate-big-since
  unit: s
- name: w.plates (empty deleted)
  field: planet-field.plate-id
  unit: '1'
- name: w.plates (empty deleted)
  field: planet-field.plate-axis
  unit: '1'
- name: w.plates (empty deleted)
  field: planet-field.plate-rate
  unit: '1'
- name: w.plates (empty deleted)
  field: planet-field.plate-base
  unit: '1'
- name: w.plates (empty deleted)
  field: planet-field.plate-torque
  unit: '1'
- name: w.plates (empty deleted)
  field: planet-field.plate-force
  unit: '1'
- name: w.plates (empty deleted)
  field: planet-field.plate-spin
  unit: rad/s
- name: w.plates (empty deleted)
  field: planet-field.plate-collided
  unit: '1'
- name: targets, topup
  field: planet-field.plate-rift-request
  unit: '1'
  meaning: 1 any cut, 2 ocean-only
- name: (forge) plate rotation
  field: planet-field.plate-rotation
  unit: '1'
  meaning: unit quaternion since the run's start
events_emitted:
- event: planet-event.reorganisation
  where: stages/plates.py:1438
params:
- name: BIG_SHARE
  value: 0.25
  unit: '1'
  meaning: a plate carrying more than this share of the world's continental particles (by count, not volume) is 'big' (insulating)
  source: stages/plates.py:67
  note: Gurnis 1988 (chosen)
- name: INSULATE_MYR
  value: 4733640000000000.0
  unit: s
  said_as:
    unit: Myr
    factor: 200.0
  meaning: a big plate that stays big this long is rifted (supercontinent breakup)
  source: stages/plates.py:68
  note: Gurnis 1988 (chosen)
- name: REORGANISE_MYR
  values:
  - 3155760000000000.0
  - 7889400000000000.0
  unit: s
  meaning: interval to the next reorganisation, drawn uniform in this range
  source: stages/plates.py:186
  note: reorganisations every ~100-200 Myr; Nance et al. 2014 (chosen)
- name: PLATES
  env: SIM_PLATES
  value: 12.0
  unit: '1'
  meaning: initial plate count and target count for reorganisation top-ups; < 0.75*PLATES forces an immediate reorganisation
  source: stages/plates.py:185
  note: Earth has 7 large plates and some dozen more
- name: RIFT_CHANCE
  env: SIM_RIFT_CHANCE
  value: 0.35
  unit: '1'
  meaning: at each reorganisation (if no insulated plate), probability of one extra top-up rift
  source: stages/plates.py:187
  note: (override for A/B grows, 2026-10-09)
- name: RIFT_TOPUP_OCEAN
  env: SIM_RIFT_TOPUP_OCEAN
  setting: 'True'
  meaning: top-up rifts (count keeping) cut the plate with the most ocean-floor particles, through ocean floor only; falls back to any cut if none found
  source: stages/plates.py:197
  note: 'env ''1'' default; 17 Oct: top-ups cut continents ~8 times in 160 Myr after 700 Ma; unit: bool'
- name: min plate fraction
  value: 0.75
  unit: '1'
  meaning: below this many plates a reorganisation happens now
  source: stages/plates.py:1433
- name: topup slack
  value: 2.0
  unit: '1'
  meaning: 'top-ups = PLATES - #plates - 2 (plus chance)'
  source: stages/plates.py:1442
- name: old floor share
  value: 0.3
  unit: '1'
  meaning: 'at a reorganisation a plate whose ocean floor older than FOUNDER_AGE_MYR is at least this share of its ocean gets a convergent ocean-only cut through that floor (subduction initiation, Stern 2004): an interior ocean closes
    instead of foundering in place forever (forge e60: a continental rim round a 139 Myr interior ocean on a third of the planet)'
  source: planets, 20 Oct 2026 (chosen); forge models/plates/reorganisation.rs; e61
- name: old floor min particles
  value: 400.0
  unit: '1'
  meaning: a plate needs at least this many ocean particles for a subduction-initiation cut
  source: planets, 20 Oct 2026 (chosen)
- name: insulation cooling
  value: 0.5
  unit: '1'
  meaning: 'the insulation clock is a leaky integrator: a plate carrying more than BIG_SHARE of the continent gains the step time as heat; below that share it loses this fraction of the step; past INSULATE_MYR of heat it is insulated
    and rifts (any cut). The clock that reset at every dip of the share never ran 150 Myr in 4 Gyr (forge e73 tracker)'
  source: planets, 20 Oct 2026 (chosen); forge models/plates/reorganisation.rs; e77
random_draws:
- 'next_reorg = t + rng.uniform(100,250)/1e3 at each scheduled reorganisation; rng.uniform() for RIFT_CHANCE drawn only when no plate is insulated (conditional expression evaluated lazily); then each rift''s draws in order: insulated
  targets first, then top-ups.'
invariants:
- plate count is kept near PLATES (soft floor 0.75*PLATES)
- an insulated reorganisation adds no top-ups
depends_on:
- planet-process.plate-rifting
- planet-process.subduction
backends:
- cpu
implementations:
- where: planet-sim-landform stages/plates.py:run (lines 1423-1454)
  state: reference
status: draft
basis:
- of:
  - params
  - clock
  - reads
  - writes
  tier: derived
  note: 'planets, 17 Oct 2026: inventory of the Python sim (planet-forge docs/registry-migration/plates.json), read from the code at planet-sim-landform 9747f0d-c437724.'
- of:
  - params
  tier: invented
  note: 'planets, 20 Oct 2026 (the shape audit): BIG_SHARE 0.35 -> 0.25 and INSULATE_MYR 200 -> 150 Myr so the supercontinent rift (the only cut through continent) fires: in e71 it never did in 4 Gyr (the largest plate held over 35%
    of the continent in 15 of 83 checkpoints, never 200 Myr running), 85 of 87 rifts were ocean-only, and 0% of the coast was a rifted margin (Earth ~50%). The cut follows old sutures (SUTURE_STRENGTH) and the halves stretch before
    parting. e73.'
