- name: ocean readout thermal age
  field: planet-field.particle-age
  unit: s
  meaning: New ocean particles preserve the nearest old ocean particle age used by crust-read, even where the geometric nearest particle is continental.
- name: ocean readout floor thickness
  field: planet-field.particle-floor-thickness
  unit: m
  meaning: New ocean particles preserve crust-read floor thickness from the nearest old ocean particle.
events_emitted:
- event: planet-event.relief-reanchor
  where: stages/plates.py:941
- event: planet-event.ledger-row
  where: 'forge: the continental volume this process made or removed this step (the Python''s ledger rows)'
params:
- name: REMESH_MYR
  value: 1577880000000000.0
  unit: s
  said_as:
    unit: Myr
    factor: 50.0
  meaning: interval between remeshes (particles re-laid on the sample lattice)
  source: stages/plates.py:217
- name: CONTINENT_EDGE
  value: 15000.0
  unit: m
  meaning: a sample whose spread continental thickness is below this reads as ocean
  source: stages/plates.py:213
  note: 'Continental crust is thinner than this (m) where only a particle''s edge reaches: ocean'
- name: KERNEL
  value: 0.8
  unit: '1'
  meaning: Gaussian width h = KERNEL*gap for spreading continental particle volume onto samples (cut at 3h)
  source: stages/plates.py:215
  note: the continents' spread (_continental), as crust-read's
- name: kernel cutoff
  value: 3.0
  unit: '1'
  meaning: 'unverified: the code names it kernel cutoff without saying what it is'
  source: stages/plates.py:483
  note: the continents' spread (_continental), as crust-read's
- name: fringe floor
  value: 150.0
  unit: m
  meaning: a sample reading at least this much continental crust is re-laid as a continental particle whatever its kind (the fringe below CONTINENT_EDGE keeps its material); thinner crust, the kernel tail, is added to the nearest kept
    sample, so nothing is dropped
  source: 'planets, 20 Oct 2026: 1% of CONTINENT_EDGE; forge models/plates/remesh.rs'
random_draws:
- none
invariants:
- continental volume conserved exactly (relative 1e-9)
- 'no crust dropped: thickness under the fringe floor is merged into the nearest kept sample'
- the sampled untrenched land share moves by less than 0.01 per re-lay (asserted); the exact move, the basin level move, kind flips and fit error are in the ledger row
- ocean rows keep the nearest old ocean particle thermal age and floor used by crust-read
depends_on:
- planet-process.crust-read
- planet-process.crust-fit
backends:
- cpu
implementations:
- where: planet-sim-landform stages/plates.py:_remesh (747-773), run (938-942)
  state: reference
status: draft
basis:
- of:
  - params
  - clock
  - reads
  - writes
  tier: derived
  note: 'planets, 17 Oct 2026: inventory of the Python sim (planet-forge docs/registry-migration/plates.json), read from the code at planet-sim-landform 9747f0d-c437724.'
- of:
  - identity.about
  - writes
  tier: derived
  note: '19 Oct 2026: remeshing ocean rows now preserves the same old ocean source used by crust-read for age, floor and geology. Before/after basin receipts are read-only diagnostics. See planet-forge models/plates/remesh.rs and basins.rs;
    no numerical parameter changed.'
- of:
  - identity.about
  - params
  - invariants
  tier: derived
  note: 'planets, 20 Oct 2026: conservative lattice re-lay restored after the e43-e48 ocean-only refresh let sample-scale texture accumulate (e45 134 interior minima per 1000 against e42 12). Offline check on e45 final state: 6 rounds
    cut minima to 106, 108 kind flips of 30000, land +0.2 points, volume exact. See planet-forge docs/terrain-canvas-recovery.md (e49).'
params[4]:
  value: 15000.0
  meaning: 'a sample is re-laid as a continental particle where the read continental thickness is at least this (set to CONTINENT_EDGE: the Python rule); the crust the kernel smears below it is not laid as particles but folded back
    over the whole continent by the exact total (the Python global rescale), and the folded volume and the rescale factor go into the ledger receipt'
  source: 'planets, 20 Oct 2026: = CONTINENT_EDGE after e49 (150 m: continents spread to half the planet at 24 km, land 6.8%); planet-forge docs/tectonics-audit-2026-10-20.md; forge models/plates/remesh.rs'
invariants[1]: 'continental volume conserved: the crust read below the fringe floor is folded back over the continent by the exact total; the folded volume and the rescale factor are recorded per re-lay'
provenance:
  note: 'planets, 20 Oct 2026: fringe floor raised from 150 m to CONTINENT_EDGE after e49 (texture 7.5 minima per 1000 but land 6.8%: the kept fringe spread the continents and shattered the plates). The Python truncating re-lay is restored,
    now booked. See planet-forge docs/tectonics-audit-2026-10-20.md.'
invariants[4]: 'the re-lay fit holds the old read at every sample the old kernel reached (the sub-edge tail included): the outline is reproduced, not only the continental samples'
