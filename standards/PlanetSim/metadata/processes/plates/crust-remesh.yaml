# yaml-language-server: $schema=../../../schema/planet-process.schema.yaml
identity:
  key: planet-process.crust-remesh
  name: 'Remesh: re-laying particles on the sample lattice'
  about: 'Every REMESH_MYR the crust is re-laid on the sample lattice, the Python rule: one continental particle per sample reading at least fringe floor (= CONTINENT_EDGE) of continental crust, its volume fitted to the read thickness
    (crust-fit, PROJECT_ROUNDS rounds) and the continental total made exact, which folds the crust the kernel smears below the line back over the whole continent. One ocean particle per ocean-class sample with the nearest old ocean
    thermal age, floor and geology and the geometric readout owner. Why: between re-lays the fits adjust particle volumes multiplicatively until neighbours differ by an order of magnitude and the crust holds sample-scale noise (pits,
    scalloped shores; e45 134 interior minima per 1000); and the truncation at the edge is the anti-diffusion that keeps continents compact against the kernel smearing (e49 kept a 150 m fringe: continents on half the planet at 24 km,
    land 6.8%). Kind flips, fit error, folded volume, rescale, land share and basin level before and after are recorded in the ledger row; a land-share move of 0.01 or more stops the run.'
area: plates
clock:
  when: every REMESH_MYR (50 Myr), checked at the step start
reads:
- name: w.x
  field: planet-field.particle-position
  unit: '1'
- name: w.xplate
  field: planet-field.particle-plate
  unit: '1'
- name: w.xcont
  field: planet-field.particle-continental
  unit: '1'
- name: w.xvol
  field: planet-field.particle-volume
  unit: m3
- name: w.xfloor
  field: planet-field.particle-floor-thickness
  unit: m
- name: w.xage
  field: planet-field.particle-age
  unit: s
- name: w.xsuture
  field: planet-field.particle-suture
  unit: s
- name: (forge) id
  field: planet-field.particle-id
  unit: '1'
- name: fronts
  field: planet-field.particle-front-low
  unit: '1'
- name: fronts
  field: planet-field.particle-front-high
  unit: '1'
- name: fronts
  field: planet-field.particle-front-time
  unit: s
- name: sank
  field: planet-field.particle-sunk
  unit: '1'
- name: w.xmem
  field: planet-field.particle-peak-discharge
  unit: m3/s
- name: w.xmem
  field: planet-field.particle-incision
  unit: m
- name: w.xmem
  field: planet-field.particle-river-state
  unit: '1'
- name: w.xmem
  field: planet-field.particle-river-change-time
  unit: s
- name: w.xmem
  field: planet-field.particle-lake-mark
  unit: '1'
- name: next_remesh
  field: planet-field.next-remesh
  unit: s
- name: (forge) next id
  field: planet-field.particle-id-next
  unit: '1'
