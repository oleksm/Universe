# yaml-language-server: $schema=../../../schema/planet-process.schema.yaml
identity:
  key: planet-process.crust-remesh
  name: 'Remesh: re-laying particles on the sample lattice'
  about: 'Every REMESH_MYR the crust is re-laid on the sample lattice: one continental particle per sample reading at least fringe floor of continental crust (150 m: the fringe below CONTINENT_EDGE kept), its volume fitted to the read
    thickness at every sample the old kernel reached (crust-fit, PROJECT_ROUNDS rounds; the outline reproduced) and the continental total made exact (the kernel tail below the floor folded back over the continent). One ocean particle
    per ocean-class sample with the nearest old ocean thermal age, floor and geology and the geometric readout owner. Why: between re-lays the fits adjust particle volumes multiplicatively until neighbours differ by an order of magnitude
    and the crust holds sample-scale noise (pits, scalloped shores; e45 134 interior minima per 1000, e53 5.8). Kind flips, fit error, folded volume, rescale, land share and basin level before and after are recorded in the ledger row;
    a land-share move of 0.01 or more stops the run.'
area: plates
clock:
  when: every REMESH_MYR (50 Myr), checked at the step start
reads:
- name: w.x
  field: planet-field.particle-position
  unit: '1'
- name: w.xplate
  field: planet-field.particle-plate
  unit: '1'
- name: w.xcont
  field: planet-field.particle-continental
  unit: '1'
- name: w.xvol
  field: planet-field.particle-volume
  unit: m3
- name: w.xfloor
  field: planet-field.particle-floor-thickness
  unit: m
- name: w.xage
  field: planet-field.particle-age
  unit: s
- name: w.xsuture
  field: planet-field.particle-suture
  unit: s
- name: (forge) id
  field: planet-field.particle-id
  unit: '1'
- name: fronts
  field: planet-field.particle-front-low
  unit: '1'
- name: fronts
  field: planet-field.particle-front-high
  unit: '1'
- name: fronts
  field: planet-field.particle-front-time
  unit: s
- name: sank
  field: planet-field.particle-sunk
  unit: '1'
- name: w.xmem
  field: planet-field.particle-peak-discharge
  unit: m3/s
- name: w.xmem
  field: planet-field.particle-incision
  unit: m
- name: w.xmem
  field: planet-field.particle-river-state
  unit: '1'
- name: w.xmem
  field: planet-field.particle-river-change-time
  unit: s
- name: w.xmem
  field: planet-field.particle-lake-mark
  unit: '1'
- name: next_remesh
  field: planet-field.next-remesh
  unit: s
- name: (forge) next id
  field: planet-field.particle-id-next
  unit: '1'
writes:
- name: w.x
  field: planet-field.particle-position
  unit: '1'
- name: w.xplate
  field: planet-field.particle-plate
  unit: '1'
- name: w.xcont
  field: planet-field.particle-continental
  unit: '1'
- name: w.xvol
  field: planet-field.particle-volume
  unit: m3
- name: w.xfloor
  field: planet-field.particle-floor-thickness
  unit: m
- name: w.xage
  field: planet-field.particle-age
  unit: s
- name: w.xsuture
  field: planet-field.particle-suture
  unit: s
- name: (forge) id
  field: planet-field.particle-id
  unit: '1'
- name: fronts
  field: planet-field.particle-front-low
  unit: '1'
- name: fronts
  field: planet-field.particle-front-high
  unit: '1'
- name: fronts
  field: planet-field.particle-front-time
  unit: s
- name: sank
  field: planet-field.particle-sunk
  unit: '1'
- name: w.xmem
  field: planet-field.particle-peak-discharge
  unit: m3/s
- name: w.xmem
  field: planet-field.particle-incision
  unit: m
- name: w.xmem
  field: planet-field.particle-river-state
  unit: '1'
- name: w.xmem
  field: planet-field.particle-river-change-time
  unit: s
- name: w.xmem
  field: planet-field.particle-lake-mark
  unit: '1'
- name: next_remesh
  field: planet-field.next-remesh
  unit: s
- name: (forge) next id
  field: planet-field.particle-id-next
  unit: '1'
- name: ocean readout thermal age
  field: planet-field.particle-age
  unit: s
  meaning: New ocean particles preserve the nearest old ocean particle age used by crust-read, even where the geometric nearest particle is continental.
- name: ocean readout floor thickness
  field: planet-field.particle-floor-thickness
  unit: m
  meaning: New ocean particles preserve crust-read floor thickness from the nearest old ocean particle.
events_emitted:
- event: planet-event.relief-reanchor
  where: stages/plates.py:941
- event: planet-event.ledger-row
  where: 'forge: the continental volume this process made or removed this step (the Python''s ledger rows)'
params:
- name: REMESH_MYR
  value: 1577880000000000.0
  unit: s
  said_as:
    unit: Myr
    factor: 50.0
  meaning: interval between remeshes (particles re-laid on the sample lattice)
  source: stages/plates.py:217
- name: CONTINENT_EDGE
  value: 15000.0
  unit: m
  meaning: a sample whose spread continental thickness is below this reads as ocean
  source: stages/plates.py:213
  note: 'Continental crust is thinner than this (m) where only a particle''s edge reaches: ocean'
- name: KERNEL
  value: 0.8
  unit: '1'
  meaning: Gaussian width h = KERNEL*gap for spreading continental particle volume onto samples (cut at 3h)
  source: stages/plates.py:215
  note: the continents' spread (_continental), as crust-read's
- name: kernel cutoff
  value: 3.0
  unit: '1'
  meaning: 'unverified: the code names it kernel cutoff without saying what it is'
  source: stages/plates.py:483
  note: the continents' spread (_continental), as crust-read's
- name: fringe floor
  value: 150.0
  unit: m
  meaning: 'a sample reading at least this much continental crust is re-laid as a continental particle whatever its kind (the fringe below CONTINENT_EDGE keeps its material); thinner crust, the kernel tail, is folded back over the continent
    by the exact total (the Python global rescale). At 150 m the fringe is kept; the Python truncation (= CONTINENT_EDGE) has not been run: the 20 Oct attempt to set it (e50) wrote a stray key instead and e50-e53 ran at 150 m'
  source: 'planets, 20 Oct 2026: 1% of CONTINENT_EDGE; forge models/plates/remesh.rs. e50-e53 ran at this value (the set to CONTINENT_EDGE on 20 Oct did not apply); e53 is the reference'
random_draws:
- none
invariants:
- continental volume conserved exactly (relative 1e-9)
- 'continental volume conserved: the crust read below the fringe floor is folded back over the continent by the exact total; the folded volume and the rescale factor are recorded per re-lay'
- the sampled untrenched land share moves by less than 0.01 per re-lay (asserted); the exact move, the basin level move, kind flips and fit error are in the ledger row
- ocean rows keep the nearest old ocean particle thermal age and floor used by crust-read
- 'the re-lay fit holds the old read at every sample the old kernel reached (the sub-edge tail included): the outline is reproduced, not only the continental samples (forge e52 on)'
depends_on:
- planet-process.crust-read
- planet-process.crust-fit
backends:
- cpu
implementations:
- where: planet-sim-landform stages/plates.py:_remesh (747-773), run (938-942)
  state: reference
status: draft
basis:
- of:
  - params
  - clock
  - reads
