# yaml-language-server: $schema=../../../schema/planet-process.schema.yaml
identity:
  key: planet-process.crust-remesh
  name: 'Remesh: re-laying particles on the sample lattice'
  about: Every REMESH_MYR particles are replaced by one per sample; continent where spread thickness >= CONTINENT_EDGE, continental volumes fitted and rescaled to the previous total. Plate, suture and memory follow the geometric nearest
    particle. Ocean age and floor thickness follow the nearest old ocean particle, matching crust-read. Geology follows the material class when the geometric source has the opposite class. Detailed terrain features keep their plate
    frames and independent geometry. Phase receipts record untrenched basin capacity before and after this representation change.
area: plates
clock:
  when: every REMESH_MYR (50 Myr), checked at the step start
reads:
- name: w.x
  field: planet-field.particle-position
  unit: '1'
- name: w.xplate
  field: planet-field.particle-plate
  unit: '1'
- name: w.xcont
  field: planet-field.particle-continental
  unit: '1'
- name: w.xvol
  field: planet-field.particle-volume
  unit: m3
- name: w.xfloor
  field: planet-field.particle-floor-thickness
  unit: m
- name: w.xage
  field: planet-field.particle-age
  unit: s
- name: w.xsuture
  field: planet-field.particle-suture
  unit: s
- name: (forge) id
  field: planet-field.particle-id
  unit: '1'
- name: fronts
  field: planet-field.particle-front-low
  unit: '1'
- name: fronts
  field: planet-field.particle-front-high
  unit: '1'
- name: fronts
  field: planet-field.particle-front-time
  unit: s
- name: sank
  field: planet-field.particle-sunk
  unit: '1'
- name: w.xmem
  field: planet-field.particle-peak-discharge
  unit: m3/s
- name: w.xmem
  field: planet-field.particle-incision
  unit: m
- name: w.xmem
  field: planet-field.particle-river-state
  unit: '1'
- name: w.xmem
  field: planet-field.particle-river-change-time
  unit: s
- name: w.xmem
  field: planet-field.particle-lake-mark
  unit: '1'
- name: next_remesh
  field: planet-field.next-remesh
  unit: s
- name: (forge) next id
  field: planet-field.particle-id-next
  unit: '1'
writes:
- name: w.x
  field: planet-field.particle-position
  unit: '1'
- name: w.xplate
  field: planet-field.particle-plate
  unit: '1'
- name: w.xcont
  field: planet-field.particle-continental
  unit: '1'
- name: w.xvol
  field: planet-field.particle-volume
  unit: m3
- name: w.xfloor
  field: planet-field.particle-floor-thickness
  unit: m
- name: w.xage
  field: planet-field.particle-age
  unit: s
- name: w.xsuture
  field: planet-field.particle-suture
  unit: s
- name: (forge) id
  field: planet-field.particle-id
  unit: '1'
- name: fronts
  field: planet-field.particle-front-low
  unit: '1'
- name: fronts
  field: planet-field.particle-front-high
  unit: '1'
- name: fronts
  field: planet-field.particle-front-time
  unit: s
- name: sank
  field: planet-field.particle-sunk
  unit: '1'
- name: w.xmem
  field: planet-field.particle-peak-discharge
  unit: m3/s
- name: w.xmem
  field: planet-field.particle-incision
  unit: m
- name: w.xmem
  field: planet-field.particle-river-state
  unit: '1'
- name: w.xmem
  field: planet-field.particle-river-change-time
  unit: s
- name: w.xmem
  field: planet-field.particle-lake-mark
  unit: '1'
- name: next_remesh
  field: planet-field.next-remesh
  unit: s
- name: (forge) next id
  field: planet-field.particle-id-next
  unit: '1'
- name: ocean readout thermal age
  field: planet-field.particle-age
  unit: s
  meaning: New ocean particles preserve the nearest old ocean particle age used by crust-read, even where the geometric nearest particle is continental.
- name: ocean readout floor thickness
  field: planet-field.particle-floor-thickness
  unit: m
  meaning: New ocean particles preserve crust-read floor thickness from the nearest old ocean particle.
events_emitted:
- event: planet-event.relief-reanchor
  where: stages/plates.py:941
- event: planet-event.ledger-row
  where: 'forge: the continental volume this process made or removed this step (the Python''s ledger rows)'
params:
- name: REMESH_MYR
  value: 1577880000000000.0
  unit: s
  said_as:
    unit: Myr
    factor: 50.0
  meaning: interval between remeshes (particles re-laid on the sample lattice)
  source: stages/plates.py:217
- name: CONTINENT_EDGE
  value: 15000.0
  unit: m
  meaning: a sample whose spread continental thickness is below this reads as ocean
  source: stages/plates.py:213
  note: 'Continental crust is thinner than this (m) where only a particle''s edge reaches: ocean'
- name: KERNEL
  value: 0.8
  unit: '1'
  meaning: Gaussian width h = KERNEL*gap for spreading continental particle volume onto samples (cut at 3h)
  source: stages/plates.py:215
  note: the continents' spread (_continental), as crust-read's
- name: kernel cutoff
  value: 3.0
  unit: '1'
  meaning: 'unverified: the code names it kernel cutoff without saying what it is'
  source: stages/plates.py:483
  note: the continents' spread (_continental), as crust-read's
random_draws:
- none
invariants:
- continental volume conserved exactly
- particle count == sample count after remesh
- continental crust thinner than CONTINENT_EDGE as read is turned to ocean (its volume redistributed to the rest by the rescale)
depends_on:
- planet-process.crust-read
- planet-process.crust-fit
backends:
- cpu
implementations:
- where: planet-sim-landform stages/plates.py:_remesh (747-773), run (938-942)
  state: reference
status: draft
basis:
- of:
  - params
  - clock
  - reads
  - writes
  tier: derived
  note: 'planets, 17 Oct 2026: inventory of the Python sim (planet-forge docs/registry-migration/plates.json), read from the code at planet-sim-landform 9747f0d-c437724.'
- of:
  - identity.about
  - writes
  tier: derived
  note: '19 Oct 2026: remeshing ocean rows now preserves the same old ocean source used by crust-read for age, floor and geology. Before/after basin receipts are read-only diagnostics. See planet-forge models/plates/remesh.rs and basins.rs;
    no numerical parameter changed.'
