  - params
  - clock
  - reads
  - writes
  tier: derived
  note: 'planets, 17 Oct 2026: inventory of the Python sim (planet-forge docs/registry-migration/plates.json), read from the code at planet-sim-landform 9747f0d-c437724.'
- of:
  - params.DENUDATION_PER_RELIEF
  - params.MARGIN_WEDGE
  tier: sourced
  source: Ahnert 1970; Shepard 1963; Kennett 1982
  review: true
  note: 'Figures from memory, 18 Oct 2026: check.'
- of:
  - params.WEDGE_EFOLD
  tier: invented
  review: true
  note: The Python chose WEDGE 0.35 spacings; carried over in metres 18 Oct 2026.
- of:
  - params.SUBDUCTED_SEDIMENT
  tier: sourced
  source: Rea & Ruff 1996; Plank & Langmuir 1998; Scholl & von Huene 2009
  review: true
  note: 'From memory, 18 Oct 2026: check.'
- of:
  - params.EARTH_SEDIMENT_SUPPLY
  tier: sourced
  source: Milliman & Syvitski 1992
  review: true
  note: 'From memory, 18 Oct 2026: check.'
- of:
  - identity.about
  tier: derived
  note: 'planets, 20 Oct 2026: the fit after the wear holds the read at every sample the kernel reaches (fd2b178, e52 on): the outline is not the fit to change.'
- of:
  - params
  tier: invented
  note: 'planets, 20 Oct 2026 (owner: mountains for the game look): ERODE_MYR 150 -> 300 Myr and COUPLED_ERODE_MYR 250 -> 400 Myr with CRUST_MAX 80 -> 65 km (crust-flow), experiment e62 on the e61 default: ranges should last longer
    and peaks stop near 6 km (e61: highest 9.4 km from stacks near 88 km).'
- of:
  - params
  tier: invented
  note: 'planets, 20 Oct 2026: ERODE_ABOVE and COUPLED_ERODE_ABOVE 38 -> 35 km for e68: with the growth curve holding Earth volume (e67: 6.5e18 m3) the continents stood on 32% of the planet at 40 km; Earth holds 7.2e18 on 40% at ~35
    km with the extra area in thinned, sediment-built margins. The wear above 35 km thins the continents toward that mean and lays the debris on the shelves.'
events_emitted:
- event: planet-event.ledger-row
  where: 'forge: the step''s volume moved, shed, worn, denuded or laid on the shelf (the Python''s ledger rows)'
