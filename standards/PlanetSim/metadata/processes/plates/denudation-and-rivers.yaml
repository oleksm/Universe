# yaml-language-server: $schema=../../../schema/planet-process.schema.yaml
identity:
  key: planet-process.denudation-and-rivers
  name: Denudation of land above sea, with stream-power redistribution
  about: Every SEA_EVERY steps (CP.COUPLE_EVERY in the coupled era), the crust is read, elevation and sea level found; land above sea loses above*(1-exp(-every*dt/DENUDE_MYR)). Outside the coupled era a FLUVIAL share of this is redistributed
    by stream power sqrt(A/cell)*S from drain() (D8 steepest descent on the 6-neighbour graph after Planchon-Darboux depression filling, with seeded roughness), total kept, capped at the height above sea. The loss is passed through
    _wear (erodibility) and exhumed, then continental volume is scaled down by (H-lost)/H. Outside the coupled era the lost volume leaves the system (sediment subducted); in the coupled era it goes to the shelf. Zone statistics (land
    share, sea, flooded, mean height, share above 3 km) are recorded. Physical sediment budget uses actual removed particle volume. A later scheduled continental-sedimentation pass partitions it between inland retention, shelf transfer
    and export; without that pass denudation sends the measured volume directly to the shelf in the coupled era.
area: plates
clock:
  when: every SEA_EVERY (20) steps; in the coupled era every CP.COUPLE_EVERY (default 1, env SIM_COUPLE_EVERY) steps
reads:
- name: z_ (elevation)
  field: planet-field.height-above-ridge
  unit: m
- name: sea_
  field: planet-field.sea-level
  unit: m
- name: w.kind
  field: planet-field.crust-kind
  unit: '1'
- name: w.thick
  field: planet-field.crust-thickness
  unit: m
- name: (coupled era) the coupled erosion's wear
  field: planet-field.wear-total
  unit: m
- name: w.x
  field: planet-field.particle-position
  unit: '1'
- name: w.xcont
  field: planet-field.particle-continental
  unit: '1'
- name: w.xvol
  field: planet-field.particle-volume
  unit: m3
- name: w.xplate
  field: planet-field.particle-plate
  unit: '1'
- name: w.xfloor
  field: planet-field.particle-floor-thickness
  unit: m
- name: w.xsuture
  field: planet-field.particle-suture
  unit: s
- name: w.plate
  field: planet-field.plate
  unit: '1'
- name: cs[...] (the memory on the samples)
  field: planet-field.peak-discharge
- name: cs[...] (the memory on the samples)
  field: planet-field.incision
- name: cs[...] (the memory on the samples)
  field: planet-field.river-state
- name: cs[...] (the memory on the samples)
  field: planet-field.river-change-time
- name: cs[...] (the memory on the samples)
  field: planet-field.lake-mark
- name: w.xtop
  field: planet-field.particle-rock-top
  unit: '1'
- name: w.xbase
  field: planet-field.particle-rock-base
  unit: '1'
- name: w.xcover
  field: planet-field.particle-rock-cover
  unit: m
- name: basin diagnostic ocean age
  field: planet-field.particle-age
  unit: s
  meaning: Read-only before/after basin receipt; does not drive denudation.
writes:
- name: w.xvol
  field: planet-field.particle-volume
  unit: m3
  meaning: the continents thinned by the loss
- name: _to_shelf (coupled era)
  field: planet-field.particle-floor-thickness
  unit: m
  meaning: the eroded volume laid on the shelves
- name: struct fold
  field: planet-field.fold
  unit: '1'
  meaning: 'fold belts: thick'' exp(-since suture / 300 Myr), at least 0.5 thick'''
- name: struct fault
  field: planet-field.fault
  unit: '1'
  meaning: plate boundary 1, next to one 0.5
- name: w._zstats
  meaning: land, sea, flooded ... (forge stats)
- name: w.xmem (each particle takes its sample's)
  field: planet-field.particle-peak-discharge
  unit: m3/s
- name: w.xmem (each particle takes its sample's)
  field: planet-field.particle-incision
  unit: m
- name: w.xmem (each particle takes its sample's)
  field: planet-field.particle-river-state
  unit: '1'
- name: w.xmem (each particle takes its sample's)
  field: planet-field.particle-river-change-time
  unit: s
- name: w.xmem (each particle takes its sample's)
  field: planet-field.particle-lake-mark
  unit: '1'
- name: w.xtop
  field: planet-field.particle-rock-top
  unit: '1'
- name: w.xbase
  field: planet-field.particle-rock-base
  unit: '1'
- name: w.xcover
  field: planet-field.particle-rock-cover
  unit: m
- name: lost
  field: planet-field.denuded
  unit: m
  meaning: for the basins (continental-sedimentation)
params:
- name: SEA_EVERY
  value: 20.0
  unit: '1'
  meaning: steps between denudation passes (and sea-level re-find) outside the coupled era
  source: stages/plates.py:130
  note: Sea level is re-found this often (steps) for the denudation
- name: DENUDE_MYR
  env: SIM_DENUDE_MYR
  value: 2524608000000000.0
  unit: s
  said_as:
    unit: Myr
    factor: 80.0
  meaning: 'e-folding turnover of land above sea: base removal = above*(1-exp(-every*dt/DENUDE_MYR))'
  source: stages/plates.py:119, stages/plates.py:120
  note: Ahnert 1970; Clift et al. 2009; override for A/B grows, 2026-10-09
- name: FLUVIAL
  env: SIM_FLUVIAL
  value: 0.5
  unit: '1'
  meaning: share of the (non-coupled) denudation redistributed by stream power sqrt(A/cell)*S; total kept
  source: stages/plates.py:135
  note: Howard 1994 E ~ A^m S^n, m=0.5, n=1; owner 2026-10-09
- name: FILL_ROUNDS
  value: 400.0
  unit: '1'
  meaning: max Planchon-Darboux iterations in fill_depressions
  source: stages/plates.py:145
- name: ROUGH_M
  env: SIM_ROUGH_M
  value: 30.0
  unit: m
  meaning: std of seeded Gaussian roughness added to land heights before routing in drain()
  source: stages/plates.py:1474
  note: courses over a plain don't follow the sample lattice
- name: 'OFF'
  env: SIM_OFF
  values: []
  unit: '1'
  said_as:
    unit: set of process names
    factor: 1.0
  open: true
  meaning: 'ablation switches, comma separated: flow, cap, roots, crustwear, climate, shelf'
  source: stages/plates.py:143
  note: '16 Oct tooling (comment also lists ''shelf''; ''climate'' and ''shelf'' only matter in coupled era); unit as the code says it: ''set of process names''; SI conversion unverified'
- name: fill epsilon
  value: 0.1
  unit: m
  meaning: min drop enforced by fill_depressions
  source: stages/plates.py:1482
- name: CP.COUPLE_EVERY
  env: SIM_COUPLE_EVERY
  value: 1.0
  unit: '1'
  meaning: coupled.py:22, env SIM_COUPLE_EVERY
  source: stages/plates.py:1311
- name: SHELF
  value: 1.6
  unit: '1'
  meaning: eroded crust is laid on ocean floor particles within SHELF*gap of a continental particle of the same plate
  source: stages/plates.py:167
  note: no comment in code
- name: WEDGE
  env: SIM_WEDGE
  value: 0.35
  unit: '1'
  meaning: e-folding distance of the shelf wedge weight exp(-d/(WEDGE*gap))
  source: stages/plates.py:168
  note: spacings over which a shelf wedge thins away from the coast (16 Oct, s22)
- name: COUPLED
  env: SIM_COUPLED
  setting: 'False'
  meaning: 'landform line: run the coupled surface step (stages/coupled.py) in the last COUPLE_FROM_MYR'
  source: stages/plates.py:136
  note: 'env ''1'' -> True; default ''0''; unit: bool'
- name: COUPLE_FROM_MYR
  env: SIM_COUPLE_FROM_MYR
  value: 2.209032e+16
  unit: s
  said_as:
    unit: Myr before the end
    factor: 700.0
  meaning: the coupled era starts when (end - t) <= this; also gates SIM_LAND_SHARE (late) and the snapshot save
  source: stages/plates.py:139
  note: 'owner 16 Oct: weathering, rivers and history from the fifth checkpoint (700 Ma) on'
- name: KERNEL
  value: 0.8
  unit: '1'
  meaning: Gaussian width h = KERNEL*gap for spreading continental particle volume onto samples (cut at 3h)
  source: stages/plates.py:215
  note: the continents' spread (_continental), as crust-read's
- name: kernel cutoff
  value: 3.0
  unit: '1'
  meaning: 'unverified: the code names it kernel cutoff without saying what it is'
  source: stages/plates.py:483
  note: the continents' spread (_continental), as crust-read's
- name: fold thickness ramp
  value: 15000.0
  unit: m
  meaning: thick' = clip((thick - CONTINENT_MEAN) / this, 0, 1)
  source: stages/plates.py:1339
- name: fold suture e-fold
  value: 9467280000000000.0
  unit: s
  said_as:
    unit: Myr
    factor: 300.0
  meaning: fold = max(thick' exp(-since suture / this), 0.5 thick')
  source: stages/plates.py:1340
- name: fold floor share
  value: 0.5
  unit: '1'
  meaning: fold never below this share of thick'
  source: stages/plates.py:1340
- name: fault neighbour share
  value: 0.5
  unit: '1'
  meaning: fault next to a plate boundary
  source: stages/plates.py:1342
- name: CONTINENT_MEAN
  value: 39000.0
  unit: m
  meaning: reference continental thickness for isostasy; also fold-belt index base in coupled struct
  source: stages/plates.py:86
  note: Christensen & Mooney 1995 (real)
- name: base level
  value: 300.0
  unit: m
  meaning: 'land wears down to this height above the sea, not to the sea: the continental freeboard (Earth median land ~500 m; Wise 1974). A plain worn to the sea drowned at the next rise of the sea: the inland seas of forge e56/e57
    (drowned interiors 15%, their crust 33 km = the sea-level thickness) once the growing continents lifted the sea 450 m. The coupled era wear is capped the same way'
  source: 'planets, 20 Oct 2026 (owner: the cheesy look); forge models/plates/denudation.rs; e58'
random_draws:
- 'drain(): roughness from np.random.default_rng(n) (n = sample count), a fresh generator each call, independent of the run''s seed; same roughness every call at a resolution.'
invariants:
- redistribution keeps the total denudation
- removal never exceeds height above sea per sample
depends_on:
- planet-process.crust-read
- planet-process.isostatic-elevation
- planet-process.sea-level
backends:
- cpu
implementations:
- where: planet-sim-landform stages/plates.py:run (lines 1307-1372, 1403-1405), drain (1490-1511), fill_depressions (1477-1487)
  state: reference
status: draft
basis:
- of:
  - params
  - clock
  - reads
  - writes
  tier: derived
  note: 'planets, 17 Oct 2026: inventory of the Python sim (planet-forge docs/registry-migration/plates.json), read from the code at planet-sim-landform 9747f0d-c437724.'
- note: 'planets, 19 Oct 2026: defer the measured erosion budget to a later continental-sedimentation pass when scheduled this step. Otherwise transfer actual removed volume to the shelf in the coupled era. Record deferred status, shelf
    eligibility and export; never use the uncapped requested sediment sum as the physical budget.'
  of:
  - writes
  - invariants
  tier: derived
events_emitted:
- event: planet-event.ledger-row
  where: 'forge: the step''s volume moved, shed, worn, denuded or laid on the shelf (the Python''s ledger rows)'
