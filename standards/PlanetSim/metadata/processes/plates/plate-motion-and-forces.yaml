# yaml-language-server: $schema=../../../schema/planet-process.schema.yaml
identity:
  key: planet-process.plate-motion-and-forces
  name: Plate motion (Euler rotation) driven by remembered boundary forces
  about: 'Each step the reference speed follows the mantle heat flux from the interior history: speed = min(EARTH_SPEED*(q/EARTH_MANTLE_FLUX)^SPEED_POWER,
    MAX_SPEED). Each plate''s torque vector (decaying memory of slab pull, trench suction and ridge push forces, each a unit
    tangent force at a particle, crossed with position) sets its axis (torque direction) and a speed multiplier |torque|/particle_count
    relative to the median over driven plates, clipped to 0.15-2.0; a plate with zero torque keeps its axis and gets DRIFT.
    The multiplier is then times the plate''s rate (collision stall) and (1 - CONTINENT_DRAG*continental particle share).
    dt = min(step_myr, STEP*gap*R/(speed*fastest), time left). Every plate rotates its particles exactly by Rodrigues rotation
    about its axis by speed*mult/R*dt, and its particles'' structural grain vectors too, and the relief layer''s anchored
    vectors. After the step: torque <- torque*exp(-dt/FORCE_MYR) + force (this step''s force sum is NOT scaled by dt), and
    plates not stalled this step recover rate toward base on RECOVER_MYR. w.spin records each plate''s angular velocity vector
    (rad/yr). The multipliers are then scaled so their particle-weighted mean is 1: the mean plate speed is the reference
    speed (EARTH_SPEED at Earth''s flux).'
area: plates
clock:
  when: every step; dt <= step_myr (default 5 Myr) and <= STEP spacing for the fastest plate
reads:
- name: h.column('heat_flow_mantle_tw')
  field: planet-field.mantle-heat-flux
  unit: W/m2
  meaning: interior history, flux = TW*1e12/area
- name: w.plates[pid].torque
  field: planet-field.plate-torque
  unit: '1'
- name: w.plates[pid].rate
  field: planet-field.plate-rate
  unit: '1'
- name: w.plates[pid].base
  field: planet-field.plate-base
  unit: '1'
- name: w.plates[pid].axis
  field: planet-field.plate-axis
  unit: '1'
- name: w.plates keys
  field: planet-field.plate-id
  unit: '1'
- name: w.xplate
  field: planet-field.particle-plate
  unit: '1'
- name: w.xcont
  field: planet-field.particle-continental
  unit: '1'
- name: w.xvol
  field: planet-field.particle-volume
  unit: m3
  meaning: continental volume total (diagnostic)
- name: force (per-step accumulator)
  field: planet-field.plate-force
  unit: '1'
  meaning: slab pull, suction, ridge push from subduction and gap processes
- name: collided
  field: planet-field.plate-collided
  unit: '1'
  meaning: plates stalled by a collision in the last substep do not recover
- name: (forge) plate rotation
  field: planet-field.plate-rotation
  unit: '1'
writes:
- name: w.x
  field: planet-field.particle-position
  unit: '1'
  meaning: rotated particle positions
- name: w.xgrain
  unit: unit tangent
  meaning: rotated grain
- name: w.xage
  field: planet-field.particle-age
  unit: s
  meaning: ages grow by dt
- name: w.plates[pid].axis
  field: planet-field.plate-axis
  unit: '1'
- name: w.plates[pid].torque
  field: planet-field.plate-torque
  unit: '1'
- name: w.plates[pid].rate
  field: planet-field.plate-rate
  unit: '1'
- name: force
  field: planet-field.plate-force
  unit: '1'
  meaning: cleared once added to the torque
- name: w.spin
  field: planet-field.plate-spin
  unit: rad/s
  meaning: angular velocity vector
- name: speed
  unit: m/yr (code)
  meaning: reference plate speed, w.speed at end
- name: dt
  unit: Myr (code)
  meaning: this step's length
- name: collided
  field: planet-field.plate-collided
  unit: '1'
  meaning: cleared once read
- name: (forge) plate rotation
  field: planet-field.plate-rotation
  unit: '1'
  meaning: unit quaternion since the run's start
events_emitted:
- event: planet-event.relief-move
  where: stages/plates.py:997
params:
- name: EARTH_SPEED
  value: 1.5844043907014477e-09
  unit: m/s
  said_as:
    unit: m/yr
    factor: 0.05
  meaning: 'the particle-weighted mean plate speed at EARTH_MANTLE_FLUX: the multipliers (torque per area, rate, continental
    drag) are scaled so their particle-weighted mean is 1'
  source: stages/plates.py:95
  note: m/yr, (real) DeMets et al. 2010; the mean enforced since 18 Oct 2026 (the Python ran at 0.35 of it)
- name: EARTH_MANTLE_FLUX
  value: 0.04745098039215686
  unit: W/m2
  meaning: Earth's mantle heat flux per area today in the interior model (24.2 TW / 5.10e14 m2 = 0.04745)
  source: stages/plates.py:96
  note: W/m2, the interior model's Earth today
- name: SPEED_POWER
  value: 1.0
  unit: '1'
  meaning: speed = EARTH_SPEED*(q/EARTH_MANTLE_FLUX)^SPEED_POWER
  source: stages/plates.py:100
  note: 'boundary-layer theory gives q^2 (Turcotte & Schubert 6.10); Korenaga 2006 argues no faster; chosen between: linear'
- name: MAX_SPEED
  value: 4.753213172104343e-09
  unit: m/s
  said_as:
    unit: m/yr
    factor: 0.15
  meaning: cap on the reference plate speed
  source: stages/plates.py:102
  note: fastest measured ~0.2 m/yr, India; Kumar et al. 2007 (chosen cap)
- name: SLAB_PULL
  value: 1.0
  unit: '1'
  meaning: 'weight of slab pull: unit tangent force at each sinking particle toward its rider, added to the sinking plate''s
    torque'
  source: stages/plates.py:53
  note: Forsyth & Uyeda 1975; Conrad & Lithgow-Bertelloni 2002
- name: TRENCH_SUCTION
  value: 0.3
  unit: '1'
  meaning: weight of trench suction on the riding plate, toward the sinking particle
  source: stages/plates.py:54
  note: Forsyth & Uyeda 1975; Conrad & Lithgow-Bertelloni 2002 (an order smaller than slab pull)
- name: RIDGE_PUSH
  value: 0.15
  unit: '1'
  meaning: 'weight of ridge push: at each opened sample, a unit tangent force from the new point toward the source particle,
    on the source plate'
  source: stages/plates.py:55
  note: Forsyth & Uyeda 1975
- name: FORCE_MYR
  value: 631152000000000.0
  unit: s
  said_as:
    unit: Myr
    factor: 20.0
  meaning: 'e-folding memory of the plate torque: torque <- torque*exp(-dt/FORCE_MYR) + this step''s force'
  source: stages/plates.py:56
  note: chosen
- name: DRIFT
  value: 0.3
  unit: '1'
  meaning: speed multiplier of a plate with zero torque (no forces on it)
  source: stages/plates.py:57
  note: A plate with no forces on it drifts slowly (chosen)
- name: CONTINENT_DRAG
  value: 0.5
  unit: '1'
  meaning: plate speed multiplier x (1 - CONTINENT_DRAG * continental particle share of the plate)
  source: stages/plates.py:104
  note: Forsyth & Uyeda 1975
- name: STEP
  value: 0.5
  unit: '1'
  meaning: 'the fastest plate moves at most STEP*gap per substep (CFL-like bound on dt): at most the overlap reach (OVERLAP
    0.5), so no particle passes through the other plate unseen'
  source: stages/plates.py:48
  note: 'numerical: STEP <= OVERLAP (subduction); at 1.0 the floor sunk was 0.56-1.07 of the convergence x trench length,
    at 0.5 1.00 (planets, 18 Oct 2026)'
- name: RECOVER_MYR
  value: 946728000000000.0
  unit: s
  said_as:
    unit: Myr
    factor: 30.0
  meaning: e-folding time for a plate not in collision this step to regain rate -> base
  source: stages/plates.py:70
  note: chosen
- name: mult clip
  values:
  - 0.15
  - 2.0
  unit: '1'
  meaning: range of torque-per-area multiplier relative to the median driven plate
  source: stages/plates.py:977
- name: step_myr
  value: 157788000000000.0
  unit: s
  said_as:
    unit: Myr
    factor: 5.0
  meaning: 'run() argument: max step length'
  source: stages/plates.py:776
random_draws:
- none
invariants:
- particle positions stay unit vectors (rigid rotation)
- particles never created or destroyed by motion; continental volume unchanged by motion
- dt > 0 and t never passes the world's age
depends_on:
- planet-process.plates-init
- planet-process.subduction
- planet-process.seafloor-spreading
backends:
- cpu
implementations:
- where: planet-sim-landform stages/plates.py:run (lines 963-999 speed/axis/dt/rotation, 1000-1008 tangent_torque, 1044-1045
    slab pull and suction, 1227 ridge push, 1410-1416 torque memory and recovery); sphere.py:rotate (lines 29-32)
  state: reference
status: draft
basis:
- of:
  - params
  - clock
  - reads
  - writes
  tier: derived
  note: 'planets, 17 Oct 2026: inventory of the Python sim (planet-forge docs/registry-migration/plates.json), read from the
    code at planet-sim-landform 9747f0d-c437724.'
- of:
  - params.STEP
  - params.EARTH_SPEED
  tier: derived
  note: 'planets, 18 Oct 2026: the plates variant the owner chose (planet-forge plates-foundation), measured on plates_earth,
    3 seeds.'
