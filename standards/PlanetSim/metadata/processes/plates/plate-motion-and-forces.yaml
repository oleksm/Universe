# yaml-language-server: $schema=../../../schema/planet-process.schema.yaml
identity:
  key: planet-process.plate-motion-and-forces
  name: Plate motion (Euler rotation) driven by remembered boundary forces
  about: Rust particle plates retain Euler rotation away from collisions. Continental material near a continental contact blends its convergent normal velocity toward the opposing plate within collision-and-docking.OROGEN_HALF_WIDTH;
    tangential slip remains. This continuous kinematic approximation preserves each particle volume and compresses its footprint, rather than adding uplift volume. The same deformation carries feature pins, curve endpoints and independently
    riding contacts. The material CFL uses a bound of twice the fastest rigid speed. This is not a stress/rheology solver; the existing 250 km width is a provisional model scale, not calibrated to a land target.
area: plates
clock:
  when: every step; dt <= step_myr (default 5 Myr) and <= STEP spacing for the fastest plate
reads:
- name: h.column('heat_flow_mantle_tw')
  field: planet-field.mantle-heat-flux
  unit: W/m2
  meaning: interior history, flux = TW*1e12/area
- name: w.plates[pid].torque
  field: planet-field.plate-torque
  unit: '1'
- name: w.plates[pid].rate
  field: planet-field.plate-rate
  unit: '1'
- name: w.plates[pid].base
  field: planet-field.plate-base
  unit: '1'
- name: w.plates[pid].axis
  field: planet-field.plate-axis
  unit: '1'
- name: w.plates keys
  field: planet-field.plate-id
  unit: '1'
- name: w.xplate
  field: planet-field.particle-plate
  unit: '1'
- name: w.xcont
  field: planet-field.particle-continental
  unit: '1'
- name: w.xvol
  field: planet-field.particle-volume
  unit: m3
  meaning: continental volume total (diagnostic)
- name: force (per-step accumulator)
  field: planet-field.plate-force
  unit: '1'
  meaning: slab pull, suction, ridge push from subduction and gap processes
- name: collided
  field: planet-field.plate-collided
  unit: '1'
  meaning: plates stalled by a collision in the last substep do not recover
- name: (forge) plate rotation
  field: planet-field.plate-rotation
  unit: '1'
writes:
- name: w.x
  field: planet-field.particle-position
  unit: '1'
  meaning: rotated particle positions
- name: w.xgrain
  unit: unit tangent
  meaning: rotated grain
- name: w.xage
  field: planet-field.particle-age
  unit: s
  meaning: ages grow by dt
- name: w.plates[pid].axis
  field: planet-field.plate-axis
  unit: '1'
- name: w.plates[pid].torque
  field: planet-field.plate-torque
  unit: '1'
- name: w.plates[pid].rate
  field: planet-field.plate-rate
  unit: '1'
- name: force
  field: planet-field.plate-force
  unit: '1'
  meaning: cleared once added to the torque
- name: w.spin
  field: planet-field.plate-spin
  unit: rad/s
  meaning: angular velocity vector
- name: speed
  unit: m/yr (code)
  meaning: reference plate speed, w.speed at end
- name: dt
  unit: Myr (code)
  meaning: this step's length
- name: collided
  field: planet-field.plate-collided
  unit: '1'
  meaning: cleared once read
- name: (forge) plate rotation
  field: planet-field.plate-rotation
  unit: '1'
  meaning: unit quaternion since the run's start
events_emitted:
- event: planet-event.relief-move
  where: stages/plates.py:997
- event: planet-event.ledger-row
  where: 'Rust particle motion: deformed particle/feature counts, maximum nonrigid displacement and unchanged continental volume'
params:
- name: EARTH_SPEED
  value: 1.5844043907014477e-09
  unit: m/s
  said_as:
    unit: m/yr
    factor: 0.05
  meaning: reference speed at EARTH_MANTLE_FLUX, before each plate's torque multiplier, collision slowing and continental drag; the actual mean is not forced
  source: stages/plates.py:95
  note: 'm/yr; the Earth speed figure supplies the reference scale. Restored to the Python rule on 20 Oct 2026: the 18 Oct Rust mean-speed normalization cancelled collective slowing and could accelerate other plates.'
- name: EARTH_MANTLE_FLUX
  value: 0.04745098039215686
  unit: W/m2
  meaning: Earth's mantle heat flux per area today in the interior model (24.2 TW / 5.10e14 m2 = 0.04745)
  source: stages/plates.py:96
  note: W/m2, the interior model's Earth today
- name: SPEED_POWER
  value: 1.0
  unit: '1'
  meaning: speed = EARTH_SPEED*(q/EARTH_MANTLE_FLUX)^SPEED_POWER
  source: stages/plates.py:100
  note: 'boundary-layer theory gives q^2 (Turcotte & Schubert 6.10); Korenaga 2006 argues no faster; chosen between: linear'
- name: MAX_SPEED
  value: 4.753213172104343e-09
  unit: m/s
  said_as:
    unit: m/yr
    factor: 0.15
  meaning: cap on the reference plate speed
  source: stages/plates.py:102
  note: fastest measured ~0.2 m/yr, India; Kumar et al. 2007 (chosen cap)
- name: SLAB_PULL
  value: 1.0
  unit: '1'
  meaning: 'weight of slab pull: unit tangent force at each sinking particle toward its rider, added to the sinking plate''s torque'
  source: stages/plates.py:53
  note: Forsyth & Uyeda 1975; Conrad & Lithgow-Bertelloni 2002
- name: TRENCH_SUCTION
  value: 0.3
  unit: '1'
  meaning: weight of trench suction on the riding plate, toward the sinking particle
  source: stages/plates.py:54
  note: Forsyth & Uyeda 1975; Conrad & Lithgow-Bertelloni 2002 (an order smaller than slab pull)
- name: RIDGE_PUSH
  value: 0.15
  unit: '1'
  meaning: 'weight of ridge push: at each opened sample, a unit tangent force from the new point toward the source particle, on the source plate'
  source: stages/plates.py:55
  note: Forsyth & Uyeda 1975
- name: FORCE_MYR
  value: 631152000000000.0
  unit: s
  said_as:
    unit: Myr
    factor: 20.0
  meaning: 'e-folding memory of the plate torque: torque <- torque*exp(-dt/FORCE_MYR) + this step''s force'
  source: stages/plates.py:56
  note: chosen
- name: DRIFT
  value: 0.3
  unit: '1'
  meaning: speed multiplier of a plate with zero torque (no forces on it)
  source: stages/plates.py:57
  note: A plate with no forces on it drifts slowly (chosen)
- name: CONTINENT_DRAG
  value: 0.5
  unit: '1'
  meaning: plate speed multiplier x (1 - CONTINENT_DRAG * continental particle share of the plate)
  source: stages/plates.py:104
  note: Forsyth & Uyeda 1975
- name: STEP
  value: 0.5
  unit: '1'
  meaning: 'the fastest plate moves at most STEP*gap per substep (CFL-like bound on dt): at most the overlap reach (OVERLAP 0.5), so no particle passes through the other plate unseen'
  source: stages/plates.py:48
  note: 'numerical: STEP <= OVERLAP (subduction); at 1.0 the floor sunk was 0.56-1.07 of the convergence x trench length, at 0.5 1.00 (planets, 18 Oct 2026)'
- name: RECOVER_MYR
  value: 946728000000000.0
  unit: s
  said_as:
    unit: Myr
    factor: 30.0
  meaning: e-folding time for a plate not in collision this step to regain rate -> base
  source: stages/plates.py:70
  note: chosen
- name: mult clip
  values:
  - 0.15
  - 2.0
  unit: '1'
  meaning: range of torque-per-area multiplier relative to the median driven plate
  source: stages/plates.py:977
- name: step_myr
  value: 157788000000000.0
  unit: s
  said_as:
    unit: Myr
    factor: 5.0
  meaning: 'run() argument: max step length'
  source: stages/plates.py:776
- name: SLAB_PULL_FORCE
  value: 54200000000000.0
  unit: N/m
  meaning: 'vector plates: slab pull per metre of trench on the plate going down, toward the trench; the slab''s negative buoyancy, excess density rho_m*alpha*(Tm-T0)/2 over a lithosphere 2.32*sqrt(kappa*t) thick (t = 100 Myr) down
    to 660 km'
  source: Turcotte & Schubert, Geodynamics (2014), gravitational body forces on the lithosphere (slab pull)
  note: 'derived: rho_m 3300 kg/m3, alpha 3e-5 /K, Tm-T0 1300 K, kappa 1e-6 m2/s, g 9.8 m/s2: 5.42e+13 N/m'
- name: RIDGE_PUSH_FORCE
  value: 4120000000000.0
  unit: N/m
  meaning: 'vector plates: ridge push per metre of ridge on each spreading plate, away from the ridge: g*rho_m*alpha*(Tm-T0)*(1 + 2*rho_m*alpha*(Tm-T0)/(pi*(rho_m-rho_w)))*kappa*t at t = 100 Myr'
  source: Turcotte & Schubert, Geodynamics (2014), ridge push
  note: 'derived from the same constants, rho_w 1000 kg/m3: 4.12e+12 N/m (an order below slab pull, as Forsyth & Uyeda 1975 found)'
- name: TRENCH_SUCTION_FORCE
  value: 16300000000000.0
  unit: N/m
  meaning: 'vector plates: trench suction per metre of trench on the overriding plate, toward the trench'
  source: Forsyth & Uyeda 1975 (suction on the overriding plate, smaller than slab pull)
  note: 'chosen: 0.3 of SLAB_PULL_FORCE, the ratio the particle plates used (TRENCH_SUCTION 0.3)'
- name: SLAB_PULL_TRANSMITTED
  value: 0.1
  unit: '1'
  meaning: 'vector plates: the share of a slab''s negative buoyancy (SLAB_PULL_FORCE) passed to its plate as slab pull; the rest drives mantle flow (slab suction, rollback); trench suction scales with it'
  source: Schellart 2004, Geophys. Res. Lett. 31 L07611 (net slab pull)
  note: '8-12 % of the slab''s negative buoyancy reaches the plate (figure from memory, 18 Oct 2026: verify against the paper)'
- name: SLAB_PULL_AGE
  value: 3155760000000000.0
  unit: s
  said_as:
    unit: Myr
    factor: 100.0
  meaning: 'vector plates: the floor age SLAB_PULL_FORCE and TRENCH_SUCTION_FORCE are given at; younger slabs pull by sqrt(age / SLAB_PULL_AGE) (thickness 2.32 sqrt(kappa t)), older as at it'
  source: Turcotte & Schubert 2014 (half-space cooling); Parsons & Sclater 1977 (the lithosphere stops thickening near 100 Myr)
  note: derived
- name: ASTHENOSPHERE_VISCOSITY
  value: 1.0e+20
  unit: Pa s
  meaning: 'vector plates: viscosity of the weak channel under the plates; basal drag per area = viscosity / ASTHENOSPHERE_THICKNESS x the plate''s speed'
  source: 'post-glacial rebound and plate-motion models: 1e19-1e21 Pa s (Hager 1991; Mitrovica 1996)'
  note: 'middle of the published range (from memory, 18 Oct 2026: verify); the emergent mean plate speed is checked against DeMets et al. 2010, never fitted'
- name: ASTHENOSPHERE_THICKNESS
  value: 200000.0
  unit: m
  meaning: 'vector plates: thickness of the weak channel the plates shear (from the oceanic lithosphere''s base near 100 km to about 300 km)'
  source: seismic low-velocity zone, Gutenberg; Richards et al. 2001 (asthenosphere channel 100-200 km)
  note: 'from memory, 18 Oct 2026: verify'
- name: CONTINENT_DRAG_RATIO
  value: 2.0
  unit: '1'
  meaning: 'vector plates: basal drag per area under continental crust over that under ocean floor: the keel (~200 km, Jordan 1978) halves the channel under it (to ~100 km) and drag goes as 1/thickness'
  source: Jordan 1978 (continental tectosphere); Forsyth & Uyeda 1975 (continental plates slower)
  note: 'derived from the channel thickness, figures from memory (18 Oct 2026: verify)'
- name: SLAB_DEPTH
  value: 660000.0
  unit: m
  meaning: 'vector plates: the slab length that pulls its plate (the upper mantle, down to the 660 km transition where slabs stall); a plate''s slab torque follows its trenches over SLAB_DEPTH / its speed (the time to feed a new slab
    down, or to lose an old one)'
  source: Conrad & Lithgow-Bertelloni 2002 (upper-mantle slabs pull plates; lower-mantle slabs act by suction)
  note: 'derived: at 3-5 cm/yr it is 13-22 Myr, the memory the Python chose as FORCE_MYR 20 Myr'
- name: SLAB_BREAKOFF
  value: 473364000000000.0
  unit: s
  said_as:
    unit: Myr
    factor: 15.0
  meaning: 'vector plates: the longest a slab keeps pulling once its plate stops (its trench dead or in collision): slab breakoff'
  source: Davies & von Blanckenburg 1995 (slab breakoff some 10-20 Myr after collision begins)
  note: 'middle of the range (from memory, 18 Oct 2026: verify)'
- name: SLAB_RESISTANCE
  value: 2.0e+21
  unit: Pa s
  meaning: 'vector plates: the upper mantle resisting a sinking slab: force per metre of trench = SLAB_RESISTANCE x the down plate''s speed toward the trench, against it; with the transmitted pull it sets the slab''s terminal speed
    (5.4e12 N/m / 2e21 Pa s = 8.5 cm/yr at 100 Myr)'
  source: 'Stokes drag of a slab through the upper mantle, about 2 x its viscosity (1e21 Pa s: Haskell 1935; Mitrovica 1996); checked against Forsyth & Uyeda 1975 (plates attached to slabs move 6-9 cm/yr whatever their size)'
  note: 'derived (figures from memory, 18 Oct 2026: verify)'
- name: LITHOSPHERE_BEND_RADIUS
  value: 250000.0
  unit: m
  meaning: 'vector plates: the tightest a plate boundary bends in plan view; a line bent tighter (between junctions) is eased toward the chord of its neighbours'
  source: the tightest subduction arcs (Calabria, Gibraltar, Scotia) curve at a few hundred km; the lithosphere's flexural wavelength is some 400 km (Turcotte & Schubert 2014)
  note: 'figures from memory, 18 Oct 2026: verify; it stands in for slab rollback and ridge segmentation shaping the lines, to be replaced by those processes'
random_draws:
- none
invariants:
- particle positions stay unit vectors (rigid rotation)
- particles never created or destroyed by motion; continental volume unchanged by motion
- dt > 0 and t never passes the world's age
depends_on:
- planet-process.plates-init
- planet-process.subduction
- planet-process.seafloor-spreading
- planet-process.collision-and-docking
backends:
- cpu
implementations:
- where: planet-sim-landform stages/plates.py:run (lines 963-999 speed/axis/dt/rotation, 1000-1008 tangent_torque, 1044-1045 slab pull and suction, 1227 ridge push, 1410-1416 torque memory and recovery); sphere.py:rotate (lines 29-32)
  state: reference
status: draft
basis:
- of:
  - params
  - clock
  - reads
  - writes
  tier: derived
  note: 'planets, 17 Oct 2026: inventory of the Python sim (planet-forge docs/registry-migration/plates.json), read from the code at planet-sim-landform 9747f0d-c437724.'
- of:
  - params.STEP
  - params.EARTH_SPEED
  tier: derived
  note: 'planets, 18 Oct 2026: the plates variant the owner chose (planet-forge plates-foundation), measured on plates_earth, 3 seeds.'
- of:
  - params.SLAB_PULL_FORCE
  - params.RIDGE_PUSH_FORCE
  tier: derived
  note: 'planets, 18 Oct 2026: the vector plates (planet-forge vector-core) take physical boundary forces per metre; no sample weights.'
  source: Turcotte & Schubert 2014
- of:
  - params.TRENCH_SUCTION_FORCE
  tier: invented
  note: 'planets, 18 Oct 2026: the vector plates (planet-forge vector-core) take physical boundary forces per metre; no sample weights. Suction: 0.3 of slab pull, the particle plates'' ratio.'
- of:
  - params.SLAB_PULL_TRANSMITTED
  - params.ASTHENOSPHERE_VISCOSITY
  - params.ASTHENOSPHERE_THICKNESS
  tier: sourced
  source: Schellart 2004 (GRL 31 L07611); Hager 1991; Mitrovica 1996; Richards et al. 2001
  review: true
  note: 'Written from memory on 18 Oct 2026 (web search unavailable that session): check each figure against the paper.'
- of:
  - params.CONTINENT_DRAG_RATIO
  - params.SLAB_PULL_AGE
  tier: derived
  review: true
  note: 'Drag ratio from the channel thickness under keels (Jordan 1978); slab age from half-space cooling and the plate model (Parsons & Sclater 1977). Figures from memory, 18 Oct 2026: check.'
- of:
  - params.SLAB_DEPTH
  - params.SLAB_BREAKOFF
  tier: sourced
  source: Conrad & Lithgow-Bertelloni 2002; Davies & von Blanckenburg 1995
  review: true
  note: 'Figures from memory, 18 Oct 2026: check.'
- of:
  - params.SLAB_RESISTANCE
  tier: derived
  review: true
  note: '2 x 1e21 Pa s (upper mantle, Haskell 1935; Mitrovica 1996); terminal speed checked against Forsyth & Uyeda 1975. Figures from memory, 18 Oct 2026: check.'
- of:
  - params.LITHOSPHERE_BEND_RADIUS
  tier: sourced
  source: arc curvatures (Calabria, Gibraltar, Scotia); Turcotte & Schubert 2014 flexure
  review: true
  note: 'From memory, 18 Oct 2026: check; a stand-in for rollback and ridge segmentation.'
- of:
  - params.EARTH_SPEED
  - identity.about
  tier: derived
  note: 'Planets, 20 Oct 2026: restore the algorithm in planet-sim/src/planet_sim/stages/plates.py, run() lines 778-797. Retain torque/median clipping, then rate and continental-drag factors without normalizing the particle-weighted
    mean. Recovery comparison against forge_e36 is required; no numerical parameter was retuned.'
