# yaml-language-server: $schema=../../../schema/planet-process.schema.yaml
# Migrated from the Python sim by planet-forge tools/migration/to_registry.py (planets, 17 Oct 2026); hand-kept from here.
identity:
  key: planet-process.plate-welding
  name: Welding of colliding plates into one
  about: For each plate pair with a collision front, the loser particles seen within the last WELD_MYR are kept; if their
    count*cell >= WELD_AREA and both plates exist, the higher plate id is merged into the lower (all its particles relabelled,
    plate deleted) and a weld is counted. Fronts with nothing recent are dropped.
area: plates
clock:
  when: every step, after collisions
reads:
- name: fronts
  unit: 'dict (u,v)->{particle: Myr}'
  meaning: collision fronts
writes:
- name: w.xplate, w.plates
  meaning: merged plate
- name: w.events['welds']
  unit: count
events_emitted:
- event: planet-event.weld
  where: stages/plates.py:1117
params:
- name: WELD_AREA
  value: 3000000000000.0
  unit: m2
  meaning: two plates weld when the distinct losing continental particles of their collision within WELD_MYR, x cell, reach
    this
  source: stages/plates.py:241
  note: about 120 cells of 160 km (chosen)
- name: WELD_MYR
  value: 1577880000000000.0
  unit: s
  said_as:
    unit: Myr
    factor: 50.0
  meaning: window over which collision front particles are counted for welding
  source: stages/plates.py:242
random_draws:
- none
invariants:
- after a weld the merged plate keeps the lower id and its own axis/torque/rate
- particle indices in fronts are NOT updated on keep/remesh (unverified whether they then point at other particles; they are
  only counted, so only the count matters)
depends_on:
- planet-process.collision-and-docking
backends:
- cpu
implementations:
- where: planet-sim-landform stages/plates.py:run (lines 1102-1122)
  state: reference
status: draft
basis:
- of:
  - params
  - clock
  - reads
  - writes
  tier: derived
  note: 'planets, 17 Oct 2026: inventory of the Python sim (planet-forge docs/registry-migration/plates.json), read from the
    code at planet-sim-landform 9747f0d-c437724.'
