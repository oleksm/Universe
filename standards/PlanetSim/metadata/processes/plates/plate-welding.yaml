# yaml-language-server: $schema=../../../schema/planet-process.schema.yaml
identity:
  key: planet-process.plate-welding
  name: Welding of colliding plates into one
  about: Recent continental collision fronts are grouped by plate pair. Their current occupied footprint is counted once per nearest equal-area readout cell; compressed markers sharing a cell do not multiply its area. Weld when this
    footprint reaches WELD_AREA and both plates exist, retaining the lower id. Stale fronts clear after WELD_MYR. This remains a resolution-limited area criterion; marker multiplicity and occupied cells are reported separately.
area: plates
clock:
  when: every step, after collisions
reads:
- name: fronts
  field: planet-field.particle-front-low
  unit: '1'
- name: fronts
  field: planet-field.particle-front-high
  unit: '1'
- name: fronts
  field: planet-field.particle-front-time
  unit: s
- name: w.plates keys
  field: planet-field.plate-id
  unit: '1'
- name: w.xplate
  field: planet-field.particle-plate
  unit: '1'
- name: collision marker position
  field: planet-field.particle-position
  unit: '1'
writes:
- name: w.xplate
  field: planet-field.particle-plate
  unit: '1'
- name: w.plates
  meaning: the higher plate removed
- name: w.plates[v] removed
  field: planet-field.plate-id
  unit: '1'
- name: w.plates[v] removed
  field: planet-field.plate-axis
  unit: '1'
- name: w.plates[v] removed
  field: planet-field.plate-rate
  unit: '1'
- name: w.plates[v] removed
  field: planet-field.plate-base
  unit: '1'
- name: w.plates[v] removed
  field: planet-field.plate-torque
  unit: '1'
- name: w.plates[v] removed
  field: planet-field.plate-force
  unit: '1'
- name: w.plates[v] removed
  field: planet-field.plate-spin
  unit: rad/s
- name: w.plates[v] removed
  field: planet-field.plate-big-since
  unit: s
- name: w.plates[v] removed
  field: planet-field.plate-collided
  unit: '1'
- name: fronts popped
  field: planet-field.particle-front-low
  unit: '1'
- name: fronts popped
  field: planet-field.particle-front-high
  unit: '1'
- name: fronts popped
  field: planet-field.particle-front-time
  unit: s
- name: (forge) plate rotation
  field: planet-field.plate-rotation
  unit: '1'
  meaning: unit quaternion since the run's start
events_emitted:
- event: planet-event.weld
  where: stages/plates.py:1117
- event: planet-event.ledger-row
  where: Rust collision footprint and marker multiplicity audit
params:
- name: WELD_AREA
  value: 3000000000000.0
  unit: m2
  meaning: two plates weld when the distinct losing continental particles of their collision within WELD_MYR, x cell, reach this
  source: stages/plates.py:241
  note: about 120 cells of 160 km (chosen)
- name: WELD_MYR
  value: 1577880000000000.0
  unit: s
  said_as:
    unit: Myr
    factor: 50.0
  meaning: window over which collision front particles are counted for welding
  source: stages/plates.py:242
- name: WELD_CONTACT_MYR
  value: 946728000000000.0
  unit: s
  said_as:
    unit: Myr
    factor: 30.0
  meaning: 'vector plates: two plates whose continents have stayed in contact (a continent-continent collision on their boundary at every step, gaps under two steps) this long weld into one: the suture locks and the convergence moves
    elsewhere'
  source: 'collisional orogens run a few tens of Myr from first contact to the end of convergence across the suture (e.g. Caledonian-Scandian ~40 Myr, Alpine ~30-50 Myr); figures from memory: verify'
  note: '19 Oct 2026: alongside WELD_AREA; with stiff collision coupling the area brought in is small, so stalled contacts did not weld and kept trading crust'
- name: WELD_CONTACT_LENGTH
  value: 500000.0
  unit: m
  said_as:
    unit: km
    factor: 0.001
  meaning: 'vector plates: a continental contact welds two plates (WELD_CONTACT_MYR) only once it is at least this long: a promontory touching another continent indents it; a wide front locks the suture'
  source: 'derived from collision fronts that ended convergence (hundreds to thousands of km: Arabia ~1,000 km; India ~2,500 km); chosen at the small end for small Archean continents'
  note: '19 Oct 2026: e15 welded 45 times by 3.5 Ga with plates holding at 9-10 (weld-rift churn) on any brief touch'
- name: WELD_LOCK_SPEED
  value: 1.584e-10
  unit: m/s
  said_as:
    unit: cm/yr
    factor: 3155760000.0
  meaning: 'vector plates: a continental contact counts toward welding (WELD_CONTACT_MYR over WELD_CONTACT_LENGTH) only while the two plates close across it slower than this: the collision has locked; a faster contact restarts the count.
    The WELD_AREA rule is no longer used by the vector plates'
  source: 'derived: shortening across mature, stalling orogens is a few mm/yr (e.g. the Zagros and the Alps today, ~0.5 cm/yr); figures from memory: verify'
  note: '19 Oct 2026: e31 welded 48 times by 3.0 Ga and ended as one plate; welds came from contacts still converging'
random_draws:
- none
invariants:
- after a weld the merged plate keeps the lower id and its own axis/torque/rate
- particle indices in fronts are NOT updated on keep/remesh (unverified whether they then point at other particles; they are only counted, so only the count matters)
depends_on:
- planet-process.collision-and-docking
backends:
- cpu
implementations:
- where: planet-sim-landform stages/plates.py:run (lines 1102-1122)
  state: reference
status: draft
basis:
- of:
  - params
  - clock
  - reads
  - writes
  tier: derived
  note: 'planets, 17 Oct 2026: inventory of the Python sim (planet-forge docs/registry-migration/plates.json), read from the code at planet-sim-landform 9747f0d-c437724.'
