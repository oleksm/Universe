# yaml-language-server: $schema=../../../schema/planet-process.schema.yaml
identity:
  key: planet-process.deposit-contents
  name: Contained metal and district summaries
  about: 'Reporting: tonnes of each commodity in a deposit from tonnage × grade (% → /100, g/t → /1e6, ct/t → carats), and
    per district its centre (mean of unit vectors), extent (max great-circle distance), deposit list, ore Mt, summed contained,
    blind count.'
area: geology
clock:
  when: once per world (after deposit draw)
reads:
- name: deposits[]
  unit: dict
  meaning: drawn deposits
writes:
- name: districts[]
  unit: dict
  meaning: id, kind, belt_id, lat, lon, extent_km, deposits, ore_mt, contained, blind
random_draws:
- none
depends_on:
- planet-process.deposit-draw
- planet-process.impact-ore-deposits
backends:
- cpu
implementations:
- where: planet-sim-landform src/planet_sim/stages/geology.py:contained (688-700), districts (703-726)
  state: reference
- where: planet-forge crates/forge-core/src/models/geology/contents.rs
  state: current
  note: planet-forge port (geology line, merged in forge main 338c9ce)
status: draft
basis:
- of:
  - params
  - clock
  - reads
  - writes
  rule: rule.inventory-interior-geology
