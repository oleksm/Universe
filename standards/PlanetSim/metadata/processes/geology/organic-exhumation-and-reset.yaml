identity:
  key: planet-process.organic-exhumation-and-reset
  name: Organic carbon exhumed, oxidised or destroyed
  about: When erosion removes rock, every cohort comes that much nearer the surface; a cohort that reaches the surface is
    oxidised (carbon 0; Petsch et al. 2000), depth floored at 0. Where crust is remade (new ridge floor, ophiolite docking
    or obduction), all organics on the particle are reset to zero.
area: geology
clock:
  when: every plate step with denudation or crust renewal
reads:
- name: removed
  unit: m
  meaning: rock removed
writes:
- name: xorg, xodep, xotti
  unit: kg C/m², m, Myr
  meaning: updated or zeroed
  field: planet-field.organic-carbon
random_draws:
- none
invariants:
- depth ≥ 0
- carbon reaching the surface is gone
depends_on:
- planet-process.organic-burial
backends:
- cpu
implementations:
- where: planet-sim-landform src/planet_sim/stages/organics.py:exhume (56-66), reset (69-75); called from stages/plates.py:_exhume
    (713), 1058, 1089, 1237
  state: reference
status: draft
basis:
- of:
  - params
  - clock
  - reads
  - writes
  tier: derived
