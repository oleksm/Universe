# yaml-language-server: $schema=../../../schema/planet-process.schema.yaml
identity:
  key: planet-process.rock-unit-stack
  name: Rock unit stack on crust particles (lay, strip, surface)
  about: 'Each crust particle carries a top unit, a basement unit and the top''s thickness (cover, m). `bury` lays a new top
    unit of thickness `laid` over chosen particles (the new unit replaces the top; cover = old cover (if any) + laid) and
    deepens every ore body by `laid`. `erode` takes `removed` m off: cover thins (floored at 0) and ore rises; ore eroded
    past its own body height is gone (fertility 0). `surface` reads the unit at the ground: the top while cover > 0, else
    the basement. At read-out (plates.read), arc batholiths older than SHIELD_MYR show as gneiss basement, and the per-sample
    unit map is a twice-repeated 7-neighbour majority vote. Erodibility for plate-scale denudation goes through the top at
    its rate, then the basement at its own (plates._wear), both divided by MEAN_ERODIBILITY.'
area: geology
clock:
  when: every plate step (plates.run, step_myr default 5 Myr) on deposition/denudation; read-out at snapshots and the end
reads:
- name: xtop, xbase
  unit: index into geology.UNITS
  meaning: per-particle units
- name: xcover
  unit: m
  meaning: top unit thickness
- name: xdep
  unit: m below surface
  meaning: ore-top depth per system
- name: laid / removed
  unit: m
  meaning: sediment laid / rock removed
- name: xage
  unit: 's (code: Myr)'
  meaning: crust age
writes:
- name: xtop, xcover, xdep, xfert
  unit: index, m, m, 1
  meaning: updated stack
- name: rock
  field: planet-field.rock
  unit: unit index
  meaning: surface unit per sample (after shield relabel and majority vote)
params:
- name: MEAN_ERODIBILITY
  value: 0.9
  unit: '1'
  meaning: mean erodibility of continental surface rock (measured on grown Earth); erodibility is used as ERODIBILITY[u]/MEAN_ERODIBILITY
  source: src/planet_sim/stages/geology.py:214
- name: SHIELD_MYR
  value: 4.73364e+16
  unit: s
  said_as:
    unit: Myr
    factor: 31557600000000.0
  meaning: batholiths older than this display as basement gneiss (chosen)
  source: src/planet_sim/stages/geology.py:730
  note: 'unit as the code says it: ''s: 4.73364e+16 (code: Myr)''; SI conversion unverified In s (was 1500.0 Myr with unit
    1).'
- name: ARC_COVER
  value: 2500.0
  unit: m
  meaning: max arc volcanic cover over its batholith
  source: src/planet_sim/stages/geology.py:155
- name: SCHIST_COVER
  value: 6000.0
  unit: m
  meaning: schist cover laid by a collision over its granite core (minimum after collision)
  source: src/planet_sim/stages/geology.py:156
- name: FLOOD_COVER
  value: 1500.0
  unit: m
  meaning: flood basalt cover (defined; plates.py adds HOTSPOT_RATE·dt instead; FLOOD_COVER is referenced nowhere (dead constant))
  source: src/planet_sim/stages/geology.py:157
- name: RIFT_COVER
  value: 2000.0
  unit: m
  meaning: rift fill (minimum cover after rifting)
  source: src/planet_sim/stages/geology.py:158
