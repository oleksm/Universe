# yaml-language-server: $schema=../../../schema/planet-process.schema.yaml
identity:
  key: planet-process.coupled-erosion
  name: 'Coupled erosion: river incision by unit stream power, hillslope wear (Langbein-Schumm, frost, relief), landslides, wind deflation, base level'
  about: 'Each sample''s own wear rate, no global budget. River: unit stream power omega = rho g Qs S / w (W/m2), Qs = Q x flash / yr, flash = clip(1 + 0.5 (aridity - 1), 1, 3) (rarer, bigger floods in dry land), w = max(2.7 Qs^0.5,
    1); rate = K_RIVER max(omega - OMEGA_C, 0) (1 + FAULT_SOFT fault) off lakes. Hillslope: local relief = height above the neighbours'' mean + 0.5 drop to the lowest (sea floored at sea level); rate = ((1-hs) K_HILL relief (1 + RELIEF_NONLIN
    (relief/1 km)^2) + hs K_HILL_H height) x (0.3 + LangbeinSchumm(P)) x (1 + frost), frost = clip(1 - |T + 2|/12, 0, 1) (freeze-thaw near 0 degC). Landslides: relief above RELIEF_MAX goes at half per step. Wind: K_WIND x dry x (1 -
    V), dry = clip((aridity - 2)/4, 0, 1), plant cover V = 1 - exp(-P/0.4). River and hill rates fade to 0 toward sea level over BASE_M (base level); all three scaled by WEAR_SCALE. Wear = min(sum x dt, height above sea); the per-process
    parts are scaled by the same share.'
area: surface
clock:
  when: each coupled step; wear integrated over dt = plate step (Myr x 1e6 yr)
reads:
- name: z, sea
  unit: m
  field: planet-field.height
- name: Q
  unit: m3/yr
  field: planet-field.discharge
- name: slope
  unit: m/m
  meaning: on the routing surface
  field: planet-field.routing-slope
- name: lake
  unit: code
  field: planet-field.lake
- name: fault
  unit: 0-1
  field: planet-field.fault
- name: cl.aridity
  field: planet-field.aridity
  unit: '1'
  meaning: climate
- name: cl.P
  field: planet-field.rain
  unit: m/yr
  meaning: climate
- name: cl.T
  field: planet-field.temperature
  unit: degC
  meaning: climate
writes:
- name: wear (returned)
  unit: m per step
  meaning: total rock removed, <= height above sea
  field: planet-field.wear-total
- name: wear_river
  unit: m per step
  field: planet-field.wear-river
- name: wear_hill
  unit: m per step
  meaning: includes landslides
  field: planet-field.wear-hill
- name: wear_wind
  unit: m per step
  meaning: deflation (its rock becomes dust)
  field: planet-field.wear-wind
params:
- name: RHO_G
  value: 9810.0
  unit: N/m3
  open: true
  meaning: water density x gravity (1000 kg/m3 x 9.81 m/s2)
  source: stages/coupled.py:38
- name: K_RIVER
  env: SIM_K_RIVER
  value: 1.5842839036755385e-15
  unit: m/s per W/m2
  said_as:
    unit: m/yr per W/m2
    factor: 3.1685678073510773e-08
  meaning: river incision per unit stream power above threshold
  source: stages/coupled.py:39
  note: 'calibrated once against the old height rule on S15 at 50 Ma: planet total 0.013-0.020 mm/yr over land, 60 % by rivers (comment 33-37)'
- name: OMEGA_C
  value: 5.0
  unit: W/m2
  meaning: threshold unit stream power (coarse-slope scale)
  source: stages/coupled.py:40
- name: K_HILL
  env: SIM_K_HILL
  value: 6.337135614702155e-16
  unit: 1/s
  said_as:
    unit: 1/yr
    factor: 3.1685678073510773e-08
  meaning: hillslope wear per metre of local relief
  source: stages/coupled.py:41
- name: K_HILL_H
  value: 1.4258555133079846e-16
  unit: 1/s
  said_as:
    unit: 1/yr
    factor: 3.1685678073510773e-08
  meaning: height-driven weathering (the earlier rule)
  source: stages/coupled.py:46
- name: HILL_HEIGHT_SHARE
  env: SIM_HILL_HEIGHT_SHARE
  value: 0.5
  unit: '1'
  said_as:
    unit: dimensionless
    factor: 1.0
  open: true
  meaning: 'mix: share of the height rule vs the relief rule'
  source: stages/coupled.py:47
  note: 'unit as the code says it: ''dimensionless''; SI conversion unverified'
- name: RELIEF_NONLIN
  env: SIM_RELIEF_NONLIN
  value: 2.0
  unit: '1'
  said_as:
    unit: dimensionless (per km^2 of relief)
    factor: 1.0
  open: true
  meaning: steepen = 1 + RELIEF_NONLIN (relief/1000 m)^2
  source: stages/coupled.py:44
  note: 'Montgomery & Brandon 2002, Ahnert 1970; test t5; unit as the code says it: ''dimensionless (per km^2 of relief)''; SI conversion unverified'
- name: RELIEF_MAX
  value: 3500.0
  unit: m
  meaning: local relief a sample can hold; excess fails in landslides
  source: stages/coupled.py:45
  note: 'Himalayan front ~5 km over ~100 km; s19 audit: single samples stacked to 10-15 km'
- name: K_WIND
  env: SIM_K_WIND
  value: 3.1685678073510777e-13
  unit: m/s
  said_as:
    unit: m/yr
    factor: 3.1685678073510773e-08
  meaning: deflation on fully dry bare ground
  source: stages/coupled.py:48
- name: BASE_M
  env: SIM_BASE_M
  value: 400.0
  unit: m
  meaning: height above sea over which wear fades in from 0
  source: stages/coupled.py:42
  note: Davis peneplain; before, lowlands under 300 m wore 0.01-0.015 mm/yr and continents sank
- name: WEAR_SCALE
  env: SIM_WEAR_SCALE
  value: 0.4
  unit: '1'
  said_as:
    unit: dimensionless
    factor: 1.0
  open: true
  meaning: global multiplier on all three rates
  source: stages/coupled.py:43
  note: 'owner 16 Oct: kept at 0.4; 0.6 sank s23 at 30k (land 24 %); 0.4 holds land 28-30 % from s23''s 700 Ma state; 0 rises to 32 %; unit as the code says it: ''dimensionless''; SI conversion unverified'
- name: FAULT_SOFT
  value: 1.0
  unit: '1'
  said_as:
    unit: dimensionless
    factor: 1.0
  open: true
  meaning: rock in a fault zone cuts up to 1 + this times faster
  source: stages/coupled.py:31
  note: 'unit as the code says it: ''dimensionless''; SI conversion unverified'
- name: 'inline: min channel width'
  value: 1.0
  unit: m
  meaning: omega denominator floor
  source: stages/coupled.py:293
- name: 'inline: hillslope gravity floor'
  value: 0.3
  unit: '1'
  said_as:
    unit: dimensionless
    factor: 1.0
  open: true
  meaning: added to LS (gravity wear without rain)
  source: stages/coupled.py:305
  note: 'unit as the code says it: ''dimensionless''; SI conversion unverified'
- name: 'inline: landslide share'
  value: 0.5
  unit: '1'
  said_as:
    unit: per step
    factor: 1.0
  open: true
  meaning: half the relief excess over RELIEF_MAX removed each step
  source: stages/coupled.py:314
  note: 'unit as the code says it: ''per step''; SI conversion unverified'
- name: 'inline: flash gain'
  value: 0.5
  unit: '1'
  meaning: 'flood factor = clip(1 + gain (aridity - offset), range): rarer, bigger floods in dry land'
  source: stages/coupled.py:291
- name: 'inline: flash aridity offset'
  value: 1.0
  unit: '1'
  meaning: the aridity at which the flood factor starts to grow
  source: stages/coupled.py:291
- name: 'inline: flash range'
  values:
  - 1.0
  - 3.0
  unit: '1'
  meaning: the flood factor's clip
  source: stages/coupled.py:291
- name: 'inline: width coefficient'
  value: 2.7
  unit: s^0.5/m^0.5
  meaning: channel width w = max(a Q^b, min channel width) (Q in m3/s)
  source: stages/coupled.py:293
  note: w in m for Q in m3/s
- name: 'inline: width exponent'
  value: 0.5
  unit: '1'
  meaning: b in w = a Q^b
  source: stages/coupled.py:293
- name: 'inline: Langbein-Schumm rain scale'
  value: 7.922021953507237e-09
  unit: m/s
  said_as:
    unit: m/yr
    factor: 3.168808781402895e-08
  meaning: x = P / this; yield LS = (x^2 / (1 + x^3)) / norm, peak 1 near 0.315 m/yr (Langbein & Schumm 1958)
  source: stages/coupled.py:187
- name: 'inline: Langbein-Schumm norm'
  value: 0.5291
  unit: '1'
  meaning: the curve's peak value, so that LS peaks at 1
  source: stages/coupled.py:188
- name: 'inline: frost peak'
  value: 271.15
  unit: K
  said_as:
    unit: degC
    factor: 1.0
  meaning: freeze-thaw is strongest at this temperature (-2 degC)
  source: stages/coupled.py:296
  note: said as -2 degC (plus 273.15)
- name: 'inline: frost half-width'
  value: 12.0
  unit: K
  meaning: 'frost = clip(1 - |T - peak| / this, 0, 1): none beyond -14 / +10 degC'
  source: stages/coupled.py:296
- name: 'inline: plant cover rain scale'
  value: 1.2675235125611581e-08
  unit: m/s
  said_as:
    unit: m/yr
    factor: 3.168808781402895e-08
  meaning: plant cover V = 1 - exp(-P / this)
  source: stages/coupled.py:307
- name: 'inline: wind dryness from'
  value: 2.0
  unit: '1'
  meaning: 'dryness = clip((aridity - from) / span, 0, 1): deflation starts here'
  source: stages/coupled.py:308
- name: 'inline: wind dryness span'
  value: 4.0
  unit: '1'
  meaning: full deflation at from + span (aridity 6)
  source: stages/coupled.py:308
- name: 'inline: relief drop share'
  value: 0.5
  unit: '1'
  meaning: local relief = max(z - mean(z_nbr), 0) + this x max(z - min(z_nbr), 0) (the sea floored at its level)
  source: stages/coupled.py:300
random_draws:
- none
invariants:
- 0 <= wear <= max(z - sea, 0)
- wear_river + wear_hill + wear_wind = wear
- no wear at or below sea level
depends_on:
- planet-process.coupled-climate
- planet-process.river-discharge
- planet-process.flow-routing
- planet-process.lakes
note: There is no ice/glacial erosion in the deep-time coupled step; it exists only in the recent epoch.
backends:
- cpu
implementations:
- where: planet-sim-landform stages/coupled.py:step (lines 288-327), stages/coupled.py:langbein_schumm (184-188)
  state: reference
- where: planet-forge crates/forge-core/src/models/surface/erosion.rs
  state: current
  note: planet-forge port (surface line, merged in forge main 370ab83)
applies_to:
- liquid_water_now
status: draft
basis:
- of:
  - params
  - clock
  - reads
  - writes
  tier: derived
  note: 'planets, 17 Oct 2026: inventory of the Python sim (planet-forge docs/registry-migration/surface.json), read from the code at planet-sim-landform 9747f0d-c437724.'
- of:
  - reads
  - writes
  - params
  tier: derived
  note: 'planets, 17 Oct 2026: planet-forge surface port (models/surface), read from planet-sim-landform 9747f0d-c437724.'
events_emitted:
- event: planet-event.ledger-row
  where: Current-step erosion interval and conserved actual transport/deposition budget.
