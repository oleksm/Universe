identity:
  key: planet-process.biosphere-box
  name: Life timeline and atmosphere box model (10 Myr steps, CO2/O2)
  about: 'Life (stage 11), first part: its timeline and the air it makes, as a box model in 10 Myr steps, driven by the other
    stages: the interior''s heat flow (5), the plates'' land and shelves (7), the star''s brightening (1). Nothing about Earth''s
    dates is written in: Earth is the test. NOT INVENTORIED IN DETAIL: neither plates.py nor coupled.py imports biosphere.py
    (directly or through another module); it is used by stages/paleo.py, tools/life.py.'
area: surface
clock:
  when: not part of the coupled planet run (offline tools / bakes)
params:
- name: STEP_GYR
  value: 315576000000000.0
  unit: s
  said_as:
    unit: Gyr
    factor: 3.15576e+16
  meaning: unverified (no comment)
  source: stages/biosphere.py:36
- name: T_ORIGIN
  values:
  - 0.05
  - 0.3
  unit: '1'
  said_as:
    unit: unverified
    factor: 1.0
  open: true
  meaning: 'Waits (Gyr, exponential means; with a floor), chosen so that Earth''s dates are typical draws: life within ~0.3
    Gyr of lasting seas (Earth: by ~3.8–4.1 Ga, seas by ~4.4 Ga); oxygenic photosynthesis ~1 Gyr after (Earth: ~3.0–2.7 Ga);
    complex life ~0.3 Gyr after the oxygen allows it; land plants ~0.15 Gyr after complex life; forests ~0.05 Gyr after plants.'
  source: stages/biosphere.py:41
  note: 'unit as the code says it: ''unverified''; SI conversion unverified'
- name: T_OXYGENIC
  values:
  - 0.3
  - 0.8
  unit: '1'
  said_as:
    unit: unverified
