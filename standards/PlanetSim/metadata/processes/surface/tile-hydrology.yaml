identity:
  key: planet-process.tile-hydrology
  name: 'Fine-tile water: Budyko runoff, priority-flood basins, lakes, wetlands, playas, floodplains'
  about: 'Water on the land at the fine tiles'' resolution: what runs off, where it gathers, how long it stays. Lakes, wetlands,
    playas and floodplains all from the water''s balance, nothing from the look of the ground (flat ≠ marsh: a flat is wet
    only if water reaches it faster than it dries). NOT INVENTORIED IN DETAIL: neither plates.py nor coupled.py imports hydrology.py
    (directly or through another module); it is used by tools/landcover_tiles.py.'
