# Migrated from the Python sim by planet-forge tools/migration/to_registry.py (planets, 17 Oct 2026); hand-kept from here.
identity:
  key: planet-process.glacial-cycles
  name: 'Recent epoch climate cycles: glaciality, temperature shift and sea level'
  about: 'A prescribed orbital forcing. glaciality g(t) in [0,1]: before 1,000 kyr ago 41-kyr cycles g = 0.55 (0.5 - 0.5 cos(2
    pi f)), f = (-t mod 41)/41; after (Mid-Pleistocene Transition) 100-kyr sawtooth cycles that build over 85 % and terminate
    over 15 %, f = ((HOLO_KYR - t) mod 100)/100, g = f/0.85 or (1-f)/0.15, and 0 in the last HOLO_KYR. Sea level = sea0 -
    SEA_DROP g (Lambeck et al. 2014). Temperature shift dT = -(GLACIAL_DT + POLAR_GAIN 6 sin^2(lat)) g, applied after CC.run
    (which runs with dT = 0 on z + H/8: the ice surface''s height feedback at 1/8).'
area: ice
clock:
  when: 'recent epoch: once, after the plates reach the present, 260 steps of DT_KYR = 10 kyr from 2,600 kyr to 10 kyr ago
    on the final relief zr with sea0 = 0; run by planet-trees-pgs2/tools/planet_form.py:561-574 when SIM_RECENT=1 (default:
    SIM_COUPLED); outputs written as r_<key> into the last ck_??_*kyr_ctx.npz (needs CONTEXT=1)'
reads:
- name: t_kyr
  unit: kyr before present
- name: lat
  unit: rad
writes:
- name: g
  unit: 0-1
  meaning: glaciality
- name: sea
  unit: m
  meaning: shifted sea level
- name: T
  unit: degC
  meaning: climate + dT
- name: sea_curve (r_sea_curve)
  unit: rows [kyr ago, g, m]
  meaning: sea-level curve
params:
- name: DT_KYR
  value: 315600000000.0
  unit: s
  said_as:
    unit: kyr
    factor: 31560000000.0
  meaning: recent step
  source: stages/recent.py:22
  note: 'docstring says ~20,000-year steps: stale'
- name: SPAN_KYR
  value: 82056000000000.0
  unit: s
  said_as:
    unit: kyr
    factor: 31560000000.0
  meaning: recent epoch span (Quaternary)
  source: stages/recent.py:23
- name: SEA_DROP
  value: 120.0
  unit: m
  meaning: sea-level fall at full glacial
  source: stages/recent.py:24
  note: Lambeck et al. 2014
- name: GLACIAL_DT
  value: 6.0
  unit: K
  meaning: global cooling at full glacial
  source: stages/recent.py:25
- name: POLAR_GAIN
  value: 1.0
  unit: '1'
  said_as:
    unit: dimensionless
    factor: 1.0
  open: true
  meaning: extra cooling factor x 6 K x sin^2(lat)
  source: stages/recent.py:26
  note: 'unit as the code says it: ''dimensionless''; SI conversion unverified'
- name: HOLO_KYR
  value: 315600000000.0
  unit: s
  said_as:
    unit: kyr
    factor: 31560000000.0
  meaning: warm present since the last termination
  source: stages/recent.py:29
- name: 'inline: MPT'
  value: 1000.0
  unit: '1'
  said_as:
    unit: kyr before present
    factor: 1.0
  open: true
  meaning: switch from 41-kyr to 100-kyr cycles
  source: stages/recent.py:44
  note: 'unit as the code says it: ''kyr before present''; SI conversion unverified'
- name: 'inline: cycle periods'
  values:
  - 1293861600000.0
  - 3155760000000.0
  unit: s
  said_as:
    unit: kyr
    factor: 31557600000.0
  meaning: obliquity-like and eccentricity-like periods
  source: stages/recent.py:48,50
- name: 'inline: build share'
  value: 0.85
  unit: '1'
  said_as:
    unit: dimensionless
    factor: 1.0
  open: true
  meaning: '100-kyr cycle: build 85 %, terminate 15 %'
  source: stages/recent.py:49
  note: 'unit as the code says it: ''dimensionless''; SI conversion unverified'
- name: 'inline: 41-kyr amplitude'
  value: 0.55
  unit: '1'
  said_as:
    unit: glaciality
    factor: 1.0
  open: true
  meaning: peak g of the early cycles
  source: stages/recent.py:51
  note: 'unit as the code says it: ''glaciality''; SI conversion unverified'
- name: 'inline: polar factor'
  value: 6.0
  unit: K
  meaning: multiplied by POLAR_GAIN sin^2(lat)
  source: stages/recent.py:64
- name: 'inline: ice height feedback'
  value: 0.125
  unit: '1'
  said_as:
    unit: dimensionless
    factor: 1.0
  open: true
  meaning: climate run on z + H/8
  source: stages/recent.py:68
  note: 'comment says ''at a third'': mismatch with /8; unit as the code says it: ''dimensionless''; SI conversion unverified'
