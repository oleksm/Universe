  - 2.5
  unit: '1'
  said_as:
    unit: unverified
    factor: 1.0
  open: true
  meaning: unverified (no comment)
  source: stages/snow.py:28
  note: 'unit as the code says it: ''unverified''; SI conversion unverified'
- name: CANOPY_HIDES
  value: 0.85
  unit: '1'
  said_as:
    unit: unverified
    factor: 1.0
  open: true
  meaning: unverified (no comment)
  source: stages/snow.py:29
  note: 'unit as the code says it: ''unverified''; SI conversion unverified'
- name: DAYS
  value: 30.4
  unit: '1'
  said_as:
    unit: days per month
    factor: 1.0
  open: true
  meaning: unverified (no comment)
  source: stages/snow.py:30
  note: 'unit as the code says it: ''days per month''; SI conversion unverified'
random_draws:
- not inventoried
used: false
