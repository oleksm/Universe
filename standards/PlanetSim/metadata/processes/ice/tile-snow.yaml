# yaml-language-server: $schema=../../../schema/planet-process.schema.yaml
identity:
  key: planet-process.tile-snow
  name: 'Monthly snow at tile resolution: accumulation, wind drift (Winstral Sx), degree-day melt, cover'
  about: 'Snow on the ground at the fine tiles'' resolution, through the year: where it falls, where the wind puts it, how
    fast it melts, how much of each place it still covers at a given month; and the glaciers, the snow that outlasts every
    summer. NOT INVENTORIED IN DETAIL: neither plates.py nor coupled.py imports snow.py (directly or through another module);
    it is used by tools/landcover_tiles.py.'
area: ice
clock:
  when: not part of the coupled planet run (offline tools / bakes)
params:
- name: T_SNOW_LO
  value: 0.0
  unit: '1'
  said_as:
    unit: °C (from the code comment; SI conversion not done, unverified)
    factor: 1.0
  open: true
  meaning: '°C: all snow below, all rain above'
  source: stages/snow.py:23
  note: 'unit as the code says it: ''°C (from the code comment; SI conversion not done, unverified)''; SI conversion unverified'
- name: T_SNOW_HI
  value: 2.0
  unit: '1'
  said_as:
    unit: °C (from the code comment; SI conversion not done, unverified)
    factor: 1.0
  open: true
  meaning: '°C: all snow below, all rain above'
  source: stages/snow.py:23
  note: 'unit as the code says it: ''°C (from the code comment; SI conversion not done, unverified)''; SI conversion unverified'
- name: DDF
  value: 3.0
  unit: '1'
  said_as:
    unit: mm w.e. per degC per day
    factor: 1.0
  open: true
  meaning: mm w.e. per °C per day
  source: stages/snow.py:24
  note: 'unit as the code says it: ''mm w.e. per degC per day''; SI conversion unverified'
- name: SUN_MELT
  value: 0.5
  unit: '1'
  said_as:
    unit: unverified
    factor: 1.0
  open: true
  meaning: melt's share from the sun's facing (±50%)
  source: stages/snow.py:25
  note: 'unit as the code says it: ''unverified''; SI conversion unverified'
- name: SWE_HALF
  value: 60.0
  unit: '1'
  said_as:
    unit: mm w.e.
    factor: 1.0
  open: true
  meaning: 'mm: cover tanh(SWE/SWE_HALF)'
  source: stages/snow.py:26
  note: 'unit as the code says it: ''mm w.e.''; SI conversion unverified'
- name: WIND_GAIN
  value: 2.0
  unit: '1'
  said_as:
    unit: unverified
    factor: 1.0
  open: true
  meaning: unverified (no comment)
  source: stages/snow.py:27
  note: 'unit as the code says it: ''unverified''; SI conversion unverified'
- name: WIND_RANGE
  values:
