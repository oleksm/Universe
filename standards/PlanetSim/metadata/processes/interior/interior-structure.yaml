# yaml-language-server: $schema=../../../schema/planet-process.schema.yaml
identity:
  key: planet-process.interior-structure
  name: Two-layer interior structure
  about: 'Builds the world''s interior as an iron core and a rock mantle, each of uniform density: core mass from the core
    mass fraction, densities from the masses and radii, the pressure at the core-mantle boundary by integrating ρm·g(r) over
    400 radial steps through the mantle, the centre pressure adding the core''s self-compression (2/3 π G ρc² Rc²), gravity
    at surface and CMB, the core adiabat''s length scale D = sqrt(3 c_core / (2π α_core,mean ρc G)) (Labrosse 2003), the mantle
    adiabat (T_base = T_top·exp(α_mean·ḡ·(R−Rc)/c_mantle)) and the mass-weighted mean-temperature factors of mantle and core.'
area: interior
clock:
  when: once per world (before the thermal ODE)
reads:
- name: planet.mass
  unit: kg
  meaning: mass
- name: planet.radius
  unit: m
  meaning: radius
- name: planet.core_radius
  unit: m
  meaning: core radius (spec)
- name: planet.core_mass_fraction
  unit: '1'
  meaning: core share
- name: planet.core_light
  unit: 1 (mass fraction)
  meaning: light elements in the core
writes:
- name: R, Rc
  unit: m
  meaning: radii
- name: Mc, Mm
  unit: kg
  meaning: core, mantle masses
- name: rho_c, rho_m
  unit: kg/m³
  meaning: densities
- name: g_surface, g_cmb
  unit: m/s²
  meaning: gravity
- name: p_cmb, p_centre
  unit: Pa
  meaning: pressures
- name: adiabat_scale D
  unit: m
  meaning: core adiabat T(r)=T_cmb·exp((Rc²−r²)/D²)
- name: eps_m
  unit: '1'
  meaning: mantle mean T / top T = 0.5(1 + mantle_base(1))
- name: eps_c
  unit: '1'
  meaning: core mass-weighted mean T / T_cmb
params:
- name: C_MANTLE
  value: 1250.0
  unit: '1'
  said_as:
    unit: J/(kg K)
    factor: 1.0
  open: true
  meaning: mantle heat capacity (real, Turcotte & Schubert)
  source: src/planet_sim/stages/interior.py:42
  note: 'unit as the code says it: ''J/(kg K)''; SI conversion unverified'
- name: ALPHA_MEAN
  value: 2.0e-05
  unit: '1'
  said_as:
    unit: 1/K
    factor: 1.0
  meaning: whole-mantle thermal expansion (real, Katsura et al. 2010)
  source: src/planet_sim/stages/interior.py:41
- name: C_CORE
  value: 800.0
  unit: '1'
  said_as:
    unit: J/(kg K)
    factor: 1.0
  open: true
  meaning: core heat capacity (real, Stacey & Davis 2008)
  source: src/planet_sim/stages/interior.py:59
  note: 'unit as the code says it: ''J/(kg K)''; SI conversion unverified'
- name: ALPHA_CORE_MEAN
  value: 1.0e-05
  unit: '1'
  said_as:
    unit: 1/K
    factor: 1.0
  meaning: mean core thermal expansion; shapes the core adiabat (real, Gubbins et al. 2003)
  source: src/planet_sim/stages/interior.py:63
- name: mantle pressure integration steps
  value: 400.0
  unit: '1'
  said_as:
    unit: count
    factor: 1.0
  meaning: radial samples for p_cmb (trapezoid)
  source: src/planet_sim/stages/interior.py:121
- name: core mean-factor steps
  value: 200.0
  unit: '1'
  said_as:
    unit: count
    factor: 1.0
  meaning: radial samples for eps_c
  source: src/planet_sim/stages/interior.py:235
