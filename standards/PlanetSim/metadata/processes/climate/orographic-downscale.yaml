# yaml-language-server: $schema=../../../schema/planet-process.schema.yaml
identity:
  key: planet-process.orographic-downscale
  name: Smith-Barstad linear orographic precipitation downscaling
  about: 'Rain over the terrain at the fine tiles'' resolution: the climate''s rain (on its ~2° grid, ~230 km) shared out
    by the slopes the wind meets, so the windward faces of ranges are wet and their lees dry at the scale of single ridges
    and valleys. NOT INVENTORIED IN DETAIL: neither plates.py nor coupled.py imports orographic.py (directly or through another
    module); it is used by tools/landcover_tiles.py.'
area: climate
clock:
  when: not part of the coupled planet run (offline tools / bakes)
params:
- name: NM
  value: 0.005
  unit: 1/s
  meaning: s⁻¹, moist buoyancy frequency (Smith & Barstad 2004's ~0.003-0.01)
  source: stages/orographic.py:22
- name: HW
  value: 2500.0
  unit: m
  meaning: m, water vapour's scale height
  source: stages/orographic.py:23
- name: TAU_C
  value: 1000.0
  unit: s
  meaning: s, condensation and fallout
  source: stages/orographic.py:24
- name: TAU_F
  value: 1000.0
  unit: s
  meaning: s, condensation and fallout
  source: stages/orographic.py:24
- name: CW
  value: 0.004
  unit: '1'
  said_as:
    unit: kg/m^3
    factor: 1.0
  open: true
  meaning: kg m⁻³, the uplift's sensitivity (ρ_ws Γm / γ at ~10 °C)
  source: stages/orographic.py:25
  note: 'unit as the code says it: ''kg/m^3''; SI conversion unverified'
- name: RATIO
  values:
  - 0.15
  - 6.0
  unit: '1'
  said_as:
    unit: unverified
    factor: 1.0
  open: true
  meaning: unverified (no comment)
  source: stages/orographic.py:26
  note: 'unit as the code says it: ''unverified''; SI conversion unverified'
random_draws:
- not inventoried
used: false
note: 'unused by plates.py / coupled.py; users: tools/landcover_tiles.py'
backends:
- cpu
implementations:
- where: 'planet-sim-landform stages/orographic.py: lt_precip (29-46), downscale (49-56)'
  state: reference
applies_to:
- liquid_water_now
status: draft
basis:
- of:
  - params
  - clock
  - reads
  - writes
  tier: derived
  note: 'planets, 17 Oct 2026: inventory of the Python sim (planet-forge docs/registry-migration/surface.json), read from
    the code at planet-sim-landform 9747f0d-c437724.'
