  - 550.0
  - 440.0
  unit: '1'
  said_as:
    unit: nm
    factor: 1.0
  open: true
  meaning: red, green, blue
  source: stages/optics.py:34
  note: 'unit as the code says it: ''nm''; SI conversion unverified'
- name: AEROSOL_DEPTH
