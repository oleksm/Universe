identity:
  key: planet-process.air-optics
  name: Rayleigh/Mie/ozone scattering coefficients for the renderer
  about: 'How the air scatters light: the coefficients a renderer needs for the sky, the limb and the haze over the ground,
    derived from the air''s makeup and state. NOT INVENTORIED IN DETAIL: neither plates.py nor coupled.py imports optics.py
    (directly or through another module); it is used by tools/atmosphere.py.'
area: climate
clock:
  when: not part of the coupled planet run (offline tools / bakes)
params:
- name: K_B
  value: 1.380649e-23
  unit: '1'
  said_as:
    unit: J/K
    factor: 1.0
  open: true
  meaning: unverified (no comment)
  source: stages/optics.py:21
  note: 'unit as the code says it: ''J/K''; SI conversion unverified'
- name: AMU
  value: 1.66053907e-27
  unit: kg
  meaning: unverified (no comment)
  source: stages/optics.py:22
- name: LOSCHMIDT
  value: 2.6867811e+25
  unit: '1'
  said_as:
    unit: 1/m^3
    factor: 1.0
  meaning: m⁻³ at 0 °C and 1 atm, where the refractivities below are measured
  source: stages/optics.py:23
- name: GASES
  setting: '{"N2": [28.013, 0.000298, 1.034], "O2": [31.999, 0.000271, 1.096], "Ar": [39.948, 0.000281, 1.0], "CO2": [44.01,
    0.000449, 1.15], "H2O": [18.015, 0.000256, 1.0], "CH4": [16.04, 0.000441, 1.0], "He": [4.0026, 3.5e-05, 1.0], "H2": [2.016,
    0.000139, 1.0]}'
  meaning: 'Gas: (molar mass g/mol, refractivity n − 1 at STP and 550 nm, King factor). Refractivities: Peck & Khanna 1966
    (N2), Peck & Fisher 1964 (O2), Peck & Fisher (Ar), Old et al. 1971 (CO2), Leonard 1974 (He, H2), Sneep & Ubachs 2005 for
    King factors (approximate).'
  source: stages/optics.py:28
  note: 'unit: unverified'
- name: EARTH_AIR
  setting: '{"N2": 0.7808, "O2": 0.2095, "Ar": 0.0093, "CO2": 0.0004}'
  meaning: unverified (no comment)
  source: stages/optics.py:33
  note: 'unit: unverified'
- name: WAVELENGTHS_NM
  values:
