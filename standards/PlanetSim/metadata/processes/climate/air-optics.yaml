  source: stages/optics.py:36
  note: 'unit as the code says it: ''unverified''; SI conversion unverified'
- name: AEROSOL_SSA
  value: 0.92
  unit: '1'
  said_as:
    unit: unverified
    factor: 1.0
  open: true
  meaning: unverified (no comment)
  source: stages/optics.py:37
  note: 'unit as the code says it: ''unverified''; SI conversion unverified'
- name: AEROSOL_SCALE_M
