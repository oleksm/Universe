# yaml-language-server: $schema=../../../schema/planet-process.schema.yaml
identity:
  key: planet-process.relief-field
  name: Relief field
  about: 'Each feature as a profile across its line: a height at any point from its distance and side to the line, by its
    kind''s cross-section law (planet-process.relief-field), its relief worn by relief-erosion since its cause ended. The
    relief Field is their sum, asked at any point (only the lines within a profile''s reach are asked).  The cross-sections
    (d: distance from the line, + toward the side the law names; bump(u) = cos^2(pi u / 2) for |u| < 1, S a smoothstep): -
    orogen axis: relief bump(d / half width), its half widths from the axis to the belt''s edges on each side; - subsidiary
    ridge: relief bump(d / (spacing / 2)); - anticline / syncline axis: +/- amplitude bump(d / wavelength) (the alternate
    axes sum to a sine of period twice the spacing); - thrust front: a ridge on its hinterland side: throw S(d / ramp) exp(-(d
    - ramp) / back); - rift floor axis: -(depth - the scarps'' throws) bump(d / (width / 2)); - normal fault scarp: -throw
    S(d / scarp width + 1/2) toward the axis, faded across the axis (the scarp opposite takes over: the two fades sum to one);
    - rift shoulder: uplift bump(d / RIFT_SHOULDER_M); - great escarpment: inland, height S(d / face + 1/2) exp(-(d - face/2)
    / plateau decay); - suture, arc front, rift margin: no profile of their own (lines the others are laid from).'
area: relief
clock:
  when: evaluated on demand at any point (a Field over the relief features' lines); the features are made each step from the
    plates' boundaries
reads:
- name: features
  meaning: the relief features' lines (pins in their plates' frames), dimensions, profiles and states
- name: plate rotations
  field: planet-field.plate-rotation
  unit: '1'
  meaning: 'each plate''s rotation: the features'' lines placed in the body frame'
- name: crust thickness
  meaning: 'the plates'' crust (a Field): isostasy, and the belts the orogen laws measure'
- name: floor age
  meaning: 'the ocean floor''s age (a Field): its depth, and where a feature''s profile may stand'
writes:
- name: height
  meaning: 'a Field: isostasy plus the sum of the features'' profiles (m above the sea)'
params:
- name: station spacing
  value: 10000.0
  unit: m
  meaning: 'the orogen''s stations along its suture: the belt measured across the line at each'
  source: planet-forge crates/relief/src/laws.rs FIELD_DEFAULTS
  note: 'chosen: the Python measured at half a sample gap (~65 km); a vector line can be asked anywhere'
  open: true
- name: along smoothing
  value: 30000.0
  unit: m
  meaning: 'an orogen''s measures (crest offset, belt edges) smoothed along its line by a Gaussian this wide: lines, not station
    by station'
  source: planet-forge crates/relief/src/laws.rs FIELD_DEFAULTS
  note: 'chosen: as the suture''s chain is smoothed (its `smooth` law)'
  open: true
- name: probe step
  value: 1000.0
  unit: m
  meaning: 'the step of a probe across a line (thickest crust, belt edges): where the crust Field is asked'
  source: planet-forge crates/relief/src/laws.rs FIELD_DEFAULTS
  note: chosen
  open: true
- name: line step
  value: 2000.0
  unit: m
  meaning: the vertex spacing of a laid line at most (finer when its law's wavelength / 8 is finer)
  source: planet-forge crates/relief/src/laws.rs FIELD_DEFAULTS
  note: chosen
  open: true
- name: thrust ramp
  value: 5000.0
  unit: m
  meaning: 'a thrust front''s frontal ramp: its throw rises over this width from the foreland'
  source: planet-forge crates/relief/src/laws.rs FIELD_DEFAULTS
  note: 'chosen: frontal ramps dip 20-30 degrees over 2-3 km of throw'
  open: true
- name: thrust back
  value: 20000.0
  unit: m
  meaning: behind the ramp the front's step fades into the belt over this
  source: planet-forge crates/relief/src/laws.rs FIELD_DEFAULTS
  note: chosen
  open: true
- name: scarp width
  value: 2000.0
  unit: m
  meaning: a normal-fault scarp's drop spread over this
  source: planet-forge crates/relief/src/laws.rs FIELD_DEFAULTS
  note: 'chosen: scarps of 600 m at 30-60 degrees, with their footwall degradation'
  open: true
- name: escarpment width
  value: 10000.0
  unit: m
  meaning: 'a great escarpment''s face: its height rises over this from the coastal side'
  source: planet-forge crates/relief/src/laws.rs FIELD_DEFAULTS
  note: 'chosen: the Drakensberg face 5-15 km'
  open: true
- name: plateau decay
  value: 300000.0
  unit: m
  meaning: behind a great escarpment its plateau falls back to the continent's level over this
  source: planet-forge crates/relief/src/laws.rs FIELD_DEFAULTS
  note: chosen
  open: true
- name: trench width
  value: 60000.0
  unit: m
  meaning: a trench's half width on the subducting side (isostatic-elevation's trench reach of 3 gaps, as metres)
  source: planet-forge crates/relief/src/laws.rs FIELD_DEFAULTS
  note: 'chosen: trenches 50-100 km wide'
  open: true
- name: wetness
  value: 1.0
  unit: '1'
  meaning: the climate's wetness in the erosion law until the climate's fields are evaluated on the vectors
  source: planet-forge crates/relief/src/laws.rs FIELD_DEFAULTS
  note: 'placeholder: relief-erosion''s wetness clip holds it'
  open: true
random_draws:
- 'none: the profiles are functions of the lines and the laws'
invariants:
- 'no feature segment spans a plate gap: a line meeting a rift is split at the cut, each piece riding its own plate'
- no profile stands on ocean floor younger than its feature
- a line turns within four times its boundary's turning per km, and never zigzags (turning over 4 km at most twice that over
  40 km)
depends_on:
- planet-process.isostatic-elevation
- planet-process.relief-orogen-axis
- planet-process.relief-erosion
backends:
- cpu
implementations:
- where: planet-forge crates/relief (profile.rs, height.rs)
  state: building
status: draft
basis:
- of:
  - identity
  - clock
  - reads
  - writes
  - invariants
  tier: derived
  note: 'planets, 18 Oct 2026: planet-forge crates/relief (relief features on the vector planet, step 3 of docs/vector-planet.md).'
- of:
  - params
  tier: derived
  note: 'planets, 18 Oct 2026: planet-forge crates/relief (relief features on the vector planet, step 3 of docs/vector-planet.md).
    Chosen values open.'
  review: true
