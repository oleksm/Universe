invariants:
- landmarks (marks) are never eroded here
- worn lines are skipped thereafter
- No feature with dims.relief0 is in state forming or has an immediate parent in state forming (planet-forge904dd95 ReliefErosion::check).
backends:
- cpu
implementations:
- where: planet-sim-landform ~/git/planet-sim-landform/src/planet_sim/stages/relief.py:at_checkpoint (353-380)
  state: reference
- where: planet-forge crates/forge-core/src/models/tectonic/erosion.rs
  state: current
  note: planet-forge port (relief-tectonic line, merged in forge main fc8f460)
status: draft
basis:
- of:
  - params
  - clock
  - reads
  - writes
  rule: rule.inventory-relief-run-views
- of:
  - reads
  - writes
  - params
  rule: rule.relief-tectonic-port-2
- of:
  - params
  tier: invented
  review: true
  note: Four persistence.<kind> settings from planet-forge b6ba0a2 (e125), chosen to retain rift-relief features. Not calibrated to Earth lifetimes; other existing parameters unchanged. Planets reports terrain-identical e125/e124 and
    retained s44relief; Registry reviewed the source formula but did not rerun those experiments.
- of:
  - identity
  - invariants
  - cautions
  tier: derived
  note: Registry source review of planet-forge904dd95 erosion.rs and scheduler.rs; orogen_axis.rs selects ENDED sutures, rift_margins.rs creates ENDED margins. Planets reports no forming relief or forming parents in all e125checkpoints
    across3seeds and an identical92checkpoint s43rerun; not independently regenerated by Registry.
cautions:
- 'the Python''s reads were its line store''s internals: geology.ERODIBILITY (per unit); w.hydro[''P''] (rain, m/yr); line meta relief0_m/relief_m'
- 'Active-suture exclusion audit closed for the source invariant in planet-forge904dd95: producers create relief from ended lines and the post-step check rejects relief0 on forming features or their immediate children. This is not a
  physical erosion qualification or an arbitrary ancestry exclusion.'
