# yaml-language-server: $schema=../../../schema/planet-process.schema.yaml
identity:
  key: planet-process.relief-erosion
  name: Feature relief eroded by rock and rain
  about: 'Passive line-feature relief decays by its recorded rock/rain-dependent e-fold and optional kind persistence. Relief producers use ended lines: forming features and immediate children of forming features must not carry relief0.
    Planet-forge904dd95 checks this invariant after scheduled steps and rejects violations; it does not silently skip or repair malformed active-relief state.'
area: relief
clock:
  when: every EVERY_MYR (25 Myr)
reads:
- name: rock
  field: planet-field.rock
  unit: '1'
  meaning: 'erodibility: the ERODIBILITY params in this record''s order are the rock unit index'
- name: rain
  field: planet-field.rain
  unit: m/s
  meaning: wetness
- name: plate rotation
  field: planet-field.plate-rotation
  unit: '1'
  meaning: 'each plate''s rotation: where the features'' pins stand'
writes:
- name: 'features: dims relief, relief traced; state worn; history rows'
note: 'Emits: trace ''worn'' rule ''relief.erosion'' {relief_m, tau_myr, erodibility, wetness}'
events_emitted:
- event: planet-event.trace-eroded
params:
- name: TAU0_MYR
  value: 1893456000000000.0
  unit: s
  said_as:
    unit: Myr
    factor: 31557600000000.0
  meaning: relief's e-folding time on mean rock and mean rain (Earth's ranges mostly gone in 100-300 Myr)
  source: ~/git/planet-sim-landform/src/planet_sim/stages/relief.py:51
- name: WORN_SHARE
  value: 0.25
  unit: '1'
  said_as:
    unit: share of relief0
    factor: 1.0
  open: true
  meaning: below this the feature is worn
  source: ~/git/planet-sim-landform/src/planet_sim/stages/relief.py:52
  note: 'unit as the code says it: ''share of relief0''; SI conversion unverified'
- name: rain reference
  value: 3.168808781402895e-08
  unit: m/s
  said_as:
    unit: m/yr
    factor: 3.168808781402895e-08
  meaning: wetness = mean rain / this
  source: ~/git/planet-sim-landform/src/planet_sim/stages/relief.py:371
  note: unverified whether 1.0 m/yr is meant as the mean land rain (scorecard Earth 0.75)
- name: wetness clip
  values:
  - 0.2
  - 3.0
  unit: '1'
  said_as:
    unit: ratio
    factor: 1.0
  meaning: wetness bounds
  source: ~/git/planet-sim-landform/src/planet_sim/stages/relief.py:371
- name: rate floor
  value: 0.05
  unit: '1'
  said_as:
    unit: ratio
    factor: 1.0
  meaning: min er*wet
  source: ~/git/planet-sim-landform/src/planet_sim/stages/relief.py:372
- name: trace step
  value: 0.9
  unit: '1'
  said_as:
    unit: share
    factor: 1.0
  meaning: trace an 'eroded' row per 10 % drop
  source: ~/git/planet-sim-landform/src/planet_sim/stages/relief.py:377
- name: ERODIBILITY.morb
  value: 0.6
  unit: '1'
  said_as:
    unit: relative
    factor: 1.0
  open: true
  meaning: ocean-floor basalt
  source: ~/git/planet-sim-landform/src/planet_sim/stages/geology.py:23-51
  note: 'unit as the code says it: ''relative''; SI conversion unverified'
