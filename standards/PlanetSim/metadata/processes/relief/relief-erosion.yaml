  meaning: 'Provisional dimensionless multiplier on the passive relief e-folding time for planet-feature.great-escarpment: tau = TAU0_MYR * persistence / max(erodibility * wetness, rate floor). Other kinds default to1; this is slower
    modeled feature-relief decay, not a measured erosion law, active renewal or terrain feedback.'
  source: 'planets, 22 Oct 2026: plan part C2 (e124 s44: 14 shoulders, 28 scarps, 8 escarpments made, all worn before today)'
  open: true
  note: Invented recognition/persistence setting from planet-forge b6ba0a2; review required. Does not itself prove active-suture passive-decay exclusion.
