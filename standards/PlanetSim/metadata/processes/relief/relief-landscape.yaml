# yaml-language-server: $schema=../../../schema/planet-process.schema.yaml
identity:
  key: planet-process.relief-landscape
  name: The present landscape from the state the simulation holds
  about: 'Each feature kind below as a rule over the samples'' fields and the record: a region (one feature a connected
    group of samples meeting the rule), a line (the rule''s samples chained) or a point (its best samples a spacing
    apart). The kinds describe the planet now: each run drops what it wrote before and writes again. A kind whose
    inputs a checkpoint lacks is skipped.'
area: relief
clock:
  when: every 10 steps (as coast-features)
reads:
- name: height
  field: planet-field.height
- name: crust-kind
  field: planet-field.crust-kind
