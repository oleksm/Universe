- where: planet-forge crates/forge-core/src/models/tectonic/landscape.rs
  state: current
status: draft
basis:
- of:
  - params
  - clock
  - reads
  - writes
  tier: invented
  note: 'planets, 22 Oct 2026: docs/full-landscape-plan-2026-10-22.md phase 1'
  review: true
unverified:
- First coarse-lattice recognition rules do not establish all proposed feature.trigger predicates, origin or fine
  geometry. Preserve proxy/candidate provenance and missing required evidence; raw emitted counts are not a confirmed-type
  census.
- Region areas currently use uniform cell area from sample count; adaptive-cell area and subcell morphology require
  separate validation.
- Some feature-local thresholds are consulted together with process limits or fallbacks. Ice-sheet area is max(feature
  ICE_SHEET_AREA_MIN_M2=5e10m2, process ice sheet area=1e12m2) in the reviewed snapshot, so used:true does not mean
  the feature value alone determines output.
- Seasonality, groundwater, glacial flow/flotation and marine sea-ice evidence remain incomplete where the state
  lacks those signals. Confirming those kinds from annual-climate/volcano proximity alone is not accepted by the
  proposed catalogue trigger.
