- name: plates table (plate-id, plate-spin)
  meaning: boundary types from the plates' relative motion
- name: features (arc fronts, orogen axes, thrust fronts, scarps, anticlines, rift margins, river mouths, deltas,
    captures, meander belts, flood basalts, volcano centres)
  meaning: what the derived kinds sit on
- name: craters table (diameter, sample)
