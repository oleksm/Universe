# yaml-language-server: $schema=../../../schema/planet-process.schema.yaml
identity:
  key: planet-process.zones-rift-margins
  name: Rift margins when a plate breaks
  about: 'When a plate is cut in two: the continental particles within 0.6 gap of the cut (|f| < 0.6 gap); if at least 3,
    one ''rift'' event and, for each half with >= 3 such particles, one ''rift margin'' line (sides [this half''s plate, the
    other]) made from them and finished at once (Store.finish, LINK, smooth 0.7 gap); then relief.rift_features on the finished
    margins.'
area: relief
clock:
  when: on each plate break, plates.py:457-458 (rift()); t is sim time in Gyr since formation (code converts with *1e3 to
    Myr)
reads:
- name: 'rift events (planet-event.rift: plate, new)'
- name: particle positions
  field: planet-field.particle-position
  unit: '1'
- name: particle plates
  field: planet-field.particle-plate
  unit: '1'
- name: particle continental
  field: planet-field.particle-continental
  unit: '1'
- name: plate rotation
  field: planet-field.plate-rotation
  unit: '1'
  meaning: 'each plate''s rotation: where the features'' pins stand'
writes:
- name: features (planet-feature.rift-margin)
  meaning: one per half (and linked group), ended at once, the rift's key in the trigger
note: 'Emits: trace spawn rule ''zones.rift'' trigger {event, plates, continental_points}'
events_emitted:
- event: planet-event.store-event-rift-plates-pid-new
- event: planet-event.calls-relief-rift-features
params:
- name: near cut
  value: 0.6
  unit: '1'
  said_as:
    unit: x gap (rad)
    factor: 1.0
  meaning: particles this close to the cut make the margins
  source: ~/git/planet-sim-landform/src/planet_sim/stages/zones.py:138
- name: min points
  value: 3.0
  unit: '1'
  said_as:
    unit: count
    factor: 1.0
  meaning: 'fewer continental points: no rift event / no margin for that half'
  source: ~/git/planet-sim-landform/src/planet_sim/stages/zones.py:139
- name: POINT_SEP
  value: 0.6
  unit: '1'
  said_as:
    unit: x gap
    factor: 1.0
  meaning: point merge distance (no reach)
  source: ~/git/planet-sim-landform/src/planet_sim/stages/zones.py:147
- name: LINK
  value: 2.5
  unit: '1'
  said_as:
    unit: x gap
    factor: 1.0
  meaning: chaining radius
  source: ~/git/planet-sim-landform/src/planet_sim/stages/zones.py:148
- name: smooth
  value: 0.7
  unit: '1'
  said_as:
    unit: x gap
    factor: 1.0
  meaning: smoothing sigma
  source: ~/git/planet-sim-landform/src/planet_sim/stages/zones.py:148
- name: cut reach
  value: 2.0
  unit: '1'
  meaning: 'the event has no cut: a half''s particle is near it when within this x `near cut` gaps of the other half'
  source: planet-forge models/tectonic/rift_margins.rs
  note: the Python had the cut (|f| < near cut gaps)
invariants:
- one rift event per break with continental crust on the cut
- margin lines finished immediately (never forming)
depends_on:
- planet-process.line-store-finish
- planet-process.relief-rift-floor-axis
backends:
- cpu
implementations:
- where: planet-sim-landform ~/git/planet-sim-landform/src/planet_sim/stages/zones.py:rift (134-151)
  state: reference
- where: planet-forge crates/forge-core/src/models/tectonic/rift_margins.rs
  state: current
  note: planet-forge port (relief-tectonic line, merged in forge main fc8f460)
status: draft
basis:
- of:
  - params
  - clock
  - reads
  - writes
  tier: derived
  note: 'planets, 17 Oct 2026: inventory of the Python sim (planet-forge docs/registry-migration/relief_run_views.json), read
    from the code at planet-sim-landform 9747f0d-c437724.'
- of:
  - reads
  - writes
  - params
  tier: derived
  note: 'planets, 17 Oct 2026: planet-forge relief-tectonic port (models/tectonic, src/ride.rs), read from planet-sim-landform
    9747f0d-c437724.'
cautions:
- 'the Python''s reads were its line store''s internals: f (signed distance of each sel particle to the cut, rad); w.xcont;
  gap = sphere.spacing(n) of the current lattice, radians on the unit sphere (x R = metres); refined as the present nears'
