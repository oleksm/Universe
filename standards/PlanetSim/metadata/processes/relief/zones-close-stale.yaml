# yaml-language-server: $schema=../../../schema/planet-process.schema.yaml
identity:
  key: planet-process.zones-close-stale
  name: Forming sutures and arc fronts ended and chained
  about: 'End of every plate step, after Store.settle: each forming line with no new points for CLOSE_MYR is finished (chained into polylines by Store.finish with LINK and smoothing 0.7 gap); for sutures relief.orogen is called on the
    resulting lines; the line and its children are marked state ''ended''.'
area: relief
clock:
  when: end of every plate step, plates.py:1408-1409 (after lines.settle); t is sim time in Gyr since formation (code converts with *1e3 to Myr)
reads:
- name: features (planet-feature.suture)
  meaning: forming, with their contacts
- name: features (planet-feature.arc-front)
  meaning: forming
- name: plate rotation
  field: planet-field.plate-rotation
  unit: '1'
  meaning: 'each plate''s rotation: where the features'' pins stand'
writes:
- name: features (planet-feature.suture)
  meaning: 'ended: span line, layout forming 0'
- name: features (planet-feature.arc-front)
  meaning: ended
note: 'Emits: calls relief.orogen for finished sutures (spawns its features)'
params:
- name: CLOSE_MYR
  value: 946728000000000.0
  unit: s
  said_as:
    unit: Myr
    factor: 31557600000000.0
  meaning: a suture or arc with no new points for this long is ended and chained
  source: ~/git/planet-sim-landform/src/planet_sim/stages/zones.py:18
- name: LINK
  value: 325980.7
  unit: m
  said_as:
    unit: km
    factor: 0.001
  meaning: points of a forming line linked when chaining (spanning tree radius)
  source: ~/git/planet-sim-landform/src/planet_sim/stages/zones.py:22
  note: '19 Oct 2026: was 2.5 sample spacings (30,000 samples, 130.4 km on Earth): the same distance in metres, no samples'
- name: smooth
  value: 91274.6
  unit: m
  said_as:
    unit: km
    factor: 0.001
  meaning: Gaussian smoothing sigma along the chained line (ends kept)
  source: ~/git/planet-sim-landform/src/planet_sim/stages/zones.py:163
  note: '19 Oct 2026: was 0.7 sample spacings (30,000 samples, 130.4 km on Earth): the same distance in metres, no samples'
- name: final
  setting: 'False'
  meaning: close every forming line regardless of age
  source: ~/git/planet-sim-landform/src/planet_sim/stages/zones.py:154
  note: 'no caller passes final=True (grep, 17 Oct): lines still forming at a checkpoint are not chained; Store.arrays is called without link in planet_form.py:232 so forming lines are NOT written to <ck>_store.npz (unverified intent);
    unit: bool'
- name: min points
  value: 3.0
  unit: '1'
  meaning: a linked group of fewer contacts is left out
  source: stages/lines.py finish min_pts
invariants:
- only non-forming lines are drawn/saved (polylines without link)
- chaining keeps the longest path of each linked group; the rest of the group is dropped; groups < 3 points dropped
depends_on:
- planet-process.zones-suture-forming
- planet-process.zones-arc-front
- planet-process.line-store-finish
- planet-process.relief-orogen-axis
backends:
- cpu
implementations:
- where: planet-sim-landform ~/git/planet-sim-landform/src/planet_sim/stages/zones.py:close_stale (154-170)
  state: reference
- where: planet-forge crates/forge-core/src/models/tectonic/close_stale.rs
  state: current
  note: planet-forge port (relief-tectonic line, merged in forge main fc8f460)
status: draft
basis:
- of:
  - params
  - clock
  - reads
  - writes
  tier: derived
  note: 'planets, 17 Oct 2026: inventory of the Python sim (planet-forge docs/registry-migration/relief_run_views.json), read from the code at planet-sim-landform 9747f0d-c437724.'
- of:
  - reads
  - writes
  - params
  tier: derived
  note: 'planets, 17 Oct 2026: planet-forge relief-tectonic port (models/tectonic, src/ride.rs), read from planet-sim-landform 9747f0d-c437724.'
cautions:
- 'the Python''s reads were its line store''s internals: S.open; line[''last''], line[''forming'']; gap = sphere.spacing(n) of the current lattice, radians on the unit sphere (x R = metres); refined as the present nears; w.x (re-anchoring
  after smoothing)'
