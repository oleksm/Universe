# yaml-language-server: $schema=../../../schema/planet-process.schema.yaml
# Migrated from the Python sim by planet-forge tools/migration/to_registry.py (planets, 17 Oct 2026); hand-kept from here.
identity:
  key: planet-process.zones-flood-basalt
  name: Flood basalt province record
  about: 'The first time a plume stands under a continent: a ''flood basalt'' event and a ''flood basalt province'' record
    (ring 500 km, size 1.0) at the plume.'
area: relief
clock:
  when: every plate step, from hotspots(); once per plume for the whole run (S.plume_flood)
reads:
- name: on_continent of plume k
writes:
- name: landmark 'flood basalt province' size 1.0 ring_km 500, causes {activity:0.7, crust:0.3}
- name: S.plume_flood
note: 'Emits: store event ''flood basalt'' (hotspot=k) Emits: trace spawn rule ''zones.flood_basalt'' trigger {hotspot, first_under_continent:
  True} meta {ring_km: 500, relief0_m: 500}'
params:
- name: ring_km
  value: 500000.0
  unit: m
  said_as:
    unit: km
    factor: 1000.0
  meaning: province radius
  source: ~/git/planet-sim-landform/src/planet_sim/stages/zones.py:130
- name: relief0_m
  value: 500.0
  unit: m
  meaning: initial relief in the trace meta
  source: ~/git/planet-sim-landform/src/planet_sim/stages/zones.py:131
  note: landmarks are not in the erosion loop (relief.at_checkpoint erodes polylines only), so this relief never decays (unverified
    intent)
invariants:
- one flood basalt per plume
depends_on:
- planet-process.zones-hotspot-volcano
backends:
- cpu
implementations:
- where: planet-sim-landform ~/git/planet-sim-landform/src/planet_sim/stages/zones.py:hotspots (127-131)
  state: reference
status: draft
basis:
- of:
  - params
  - clock
  - reads
  - writes
  tier: derived
  note: 'planets, 17 Oct 2026: inventory of the Python sim (planet-forge docs/registry-migration/relief_run_views.json), read
    from the code at planet-sim-landform 9747f0d-c437724.'
