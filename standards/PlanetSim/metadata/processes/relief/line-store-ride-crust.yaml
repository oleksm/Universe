# yaml-language-server: $schema=../../../schema/planet-process.schema.yaml
identity:
  key: planet-process.line-store-ride-crust
  name: Store vertices and landmarks ride the plates
  about: 'Every feature of a crust-riding kind (its kind''s layout `frame` 1) keeps its pins in its plate''s frame (integer
    cm), placed by planet-field.plate-rotation: a step moves nothing. Each step, after the plates and before the features''
    models: a weld moves the removed plate''s features to the kept plate (re-expressed: the removed plate''s rotation now
    is its last seen turned by the kept plate''s turn since), a rift moves the parent plate''s features whose pins lie mostly
    on the new plate to it (pins unchanged: it starts with its parent''s rotation); then each plate''s rotation is remembered.'
area: relief
clock:
  when: every step, after plate-welding and plate-rifting, before the features' models
reads:
- name: plate
  field: planet-field.plate
  unit: '1'
  meaning: which plate a rift's features now lie on
- name: plate rotation
  field: planet-field.plate-rotation
  unit: '1'
  meaning: 'each plate''s rotation: where the features'' pins stand'
- name: rift and weld events (planet-event.rift, planet-event.weld)
writes:
- name: 'features: plate (and contacts.plate), pins re-expressed at a weld; table ride-plate-frames (each plate''s rotation
    as last seen)'
invariants:
- a vertex moves exactly as its anchor particle
backends:
- cpu
implementations:
- where: planet-sim-landform ~/git/planet-sim-landform/src/planet_sim/stages/lines.py:Store.move (178-186)
  state: reference
- where: planet-forge crates/forge-core/src/ride.rs, models/ride.rs
  state: current
  note: planet-forge port (relief-tectonic line, merged in forge main fc8f460)
status: draft
basis:
- of:
  - params
  - clock
  - reads
  - writes
  rule: rule.inventory-relief-run-views
- of:
  - reads
  - writes
  - params
  rule: rule.relief-tectonic-port-2
params: []
cautions:
- 'the Python''s reads were its line store''s internals: w.xplate'
