# yaml-language-server: $schema=../../../schema/planet-process.schema.yaml
identity:
  key: planet-process.relief-volcanic-arc-chain
  name: Volcanic arc lines from arc volcano records
  about: Alive 'arc volcano' records born within CHAIN_MYR, grouped by their event; groups of >= 3 ordered by a greedy nearest-neighbour
    walk from the record with the largest summed distance; broken where the next centre is farther than 3 x the median spacing;
    runs of >= 2 become 'volcanic arc' lines. When the group's count changes the old lines are marked 'replaced' and their
    vertices dropped.
area: relief
clock:
  when: every EVERY_MYR (25 Myr), as relief-great-escarpment
reads:
- name: features (planet-feature.arc-volcano-centre)
  meaning: recent, by arc front
- name: plate rotation
  field: planet-field.plate-rotation
  unit: '1'
  meaning: 'each plate''s rotation: where the features'' pins stand'
writes:
- name: features (planet-feature.volcanic-arc-chain)
  meaning: regrown in place as centres come
note: 'Emits: trace spawn rule ''relief.chains'' trigger {records, key, pieces}'
events_emitted:
- event: planet-event.trace-replaced-rule-relief-chains
params:
- name: CHAIN_MYR
  value: 3155760000000000.0
  unit: s
  said_as:
    unit: Myr
    factor: 31557600000000.0
  meaning: chains join the volcano centres of the last this many Myr
  source: ~/git/planet-sim-landform/src/planet_sim/stages/relief.py:42
  note: tested on 'born', not on 'last' activity
- name: min records
  value: 3.0
  unit: '1'
  said_as:
    unit: count
    factor: 1.0
  meaning: smaller groups give no chain
  source: ~/git/planet-sim-landform/src/planet_sim/stages/relief.py:324
- name: break factor
  value: 3.0
  unit: '1'
  said_as:
    unit: x median spacing
    factor: 1.0
  open: true
  meaning: chain cut where the gap exceeds this
  source: ~/git/planet-sim-landform/src/planet_sim/stages/relief.py:349
  note: 'unit as the code says it: ''x median spacing''; SI conversion unverified'
invariants:
- chain lines have no event (spawn_line event=None)
depends_on:
- planet-process.zones-arc-volcanoes
backends:
- cpu
implementations:
- where: planet-sim-landform ~/git/planet-sim-landform/src/planet_sim/stages/relief.py:at_checkpoint (314-352), Relief.drop_line
    (156-160)
  state: reference
- where: planet-forge crates/forge-core/src/models/tectonic/arc_chain.rs
  state: current
  note: planet-forge port (relief-tectonic line, merged in forge main fc8f460)
applies_to:
- plates
status: draft
basis:
- of:
  - params
  - clock
  - reads
  - writes
  tier: derived
  note: 'planets, 17 Oct 2026: inventory of the Python sim (planet-forge docs/registry-migration/relief_run_views.json), read
    from the code at planet-sim-landform 9747f0d-c437724.'
- of:
  - reads
  - writes
  - params
  tier: derived
  note: 'planets, 17 Oct 2026: planet-forge relief-tectonic port (models/tectonic, src/ride.rs), read from planet-sim-landform
    9747f0d-c437724.'
cautions:
- 'the Python''s reads were its line store''s internals: S.marks alive, S.P'
