# yaml-language-server: $schema=../../../schema/planet-process.schema.yaml
identity:
  key: planet-process.relief-rift-scarps
  name: Normal fault scarps (tilted blocks)
  about: 'Each margin offset into the rift by each of RIFT_SCARPS_M: one scarp per distance, facing the rift axis.'
area: relief
clock:
  when: with relief-rift-floor-axis
reads:
- name: features (planet-feature.rift-margin)
  meaning: the rift's
- name: crust thickness
  field: planet-field.crust-thickness
  unit: m
  meaning: the belt, the sides of a margin
- name: plate rotation
  field: planet-field.plate-rotation
  unit: '1'
  meaning: 'each plate''s rotation: where the features'' pins stand'
writes:
- name: features (planet-feature.normal-fault-scarp)
  meaning: child of its margin
note: 'Emits: trace spawn rule ''relief.rift.scarps'' trigger + {margin, block}'
params:
- name: RIFT_SCARPS_M
  values:
  - 12000.0
  - 25000.0
  unit: m
  meaning: normal fault scarps this far inside the margins
  source: ~/git/planet-sim-landform/src/planet_sim/stages/relief.py:48
- name: throw_m
  value: 600.0
  unit: m
  meaning: scarp throw and relief0
  source: ~/git/planet-sim-landform/src/planet_sim/stages/relief.py:293
- name: side probe
  value: 30000.0
  unit: m
  said_as:
    unit: km
    factor: 1000.0
  meaning: offset where the two sides are compared (which side is the rift)
  source: stages/relief.py:281
  note: as relief-rift-shoulders' (the Python computes the side once for both)
depends_on:
- planet-process.zones-rift-margins
- planet-process.relief-rift-shoulders
backends:
- cpu
implementations:
- where: planet-sim-landform ~/git/planet-sim-landform/src/planet_sim/stages/relief.py:rift_features (291-293)
  state: reference
- where: planet-forge crates/forge-core/src/models/tectonic/rift_scarps.rs
  state: current
  note: planet-forge port (relief-tectonic line, merged in forge main fc8f460)
applies_to:
- plates
status: draft
basis:
- of:
  - params
  - clock
  - reads
  - writes
  rule: rule.inventory-relief-run-views
- of:
  - reads
  - writes
  - params
  rule: rule.relief-tectonic-port-2
cautions:
- 'the Python''s reads were its line store''s internals: margin lines'
