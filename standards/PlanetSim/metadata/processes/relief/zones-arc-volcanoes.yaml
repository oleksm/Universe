# yaml-language-server: $schema=../../../schema/planet-process.schema.yaml
# Migrated from the Python sim by planet-forge tools/migration/to_registry.py (planets, 17 Oct 2026); hand-kept from here.
identity:
  key: planet-process.zones-arc-volcanoes
  name: Arc volcano records
  about: 'For points newly added to an arc front: a record ''arc volcano'' wherever no volcano record (arc or hotspot) is
    within VOLC_SEP*gap and none already made this step is that close; every front point keeps volcano records within VOLC_SEP*gap
    active (last=t). begin_step caches the alive volcano rows and a k-d tree once per store step.'
area: relief
clock:
  when: every plate step, from arcs(); the cache is rebuilt when S._step_no changes; t is sim time in Gyr since formation
    (code converts with *1e3 to Myr)
reads:
- name: S.marks (alive, type endswith 'volcano')
- name: S.P landmark positions
- name: accepted front points
- name: gap = sphere.spacing(n) of the current lattice, radians on the unit sphere (x R = metres); refined as the present
    nears
writes:
- name: landmark type 'arc volcano', size 0, event = the arc's subduction event, causes {activity:0.7, crust:0.2, land:0.1}
- name: marks[*]['last'] for near records
- name: S._vnew, S._vrows, S._vid, S._rows, S._vtree cache
note: 'Emits: trace spawn rule ''zones.arc_volcano'' trigger {event, front_line: True}'
params:
- name: VOLC_SEP
  value: 0.5
  unit: '1'
  said_as:
    unit: x gap (rad)
    factor: 1.0
  meaning: volcano records closer than this are one centre
  source: ~/git/planet-sim-landform/src/planet_sim/stages/zones.py:19
invariants:
- no two alive volcano records within VOLC_SEP*gap when spawned (arc vs hotspot share the test)
depends_on:
- planet-process.zones-arc-front
- planet-process.line-store-record-aging
backends:
- cpu
implementations:
- where: planet-sim-landform ~/git/planet-sim-landform/src/planet_sim/stages/zones.py:_volcanoes (86-103), begin_step (72-83)
  state: reference
status: draft
basis:
- of:
  - params
  - clock
  - reads
  - writes
  tier: derived
  note: 'planets, 17 Oct 2026: inventory of the Python sim (planet-forge docs/registry-migration/relief_run_views.json), read
    from the code at planet-sim-landform 9747f0d-c437724.'
