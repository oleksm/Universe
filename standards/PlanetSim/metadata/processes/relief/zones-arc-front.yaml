# yaml-language-server: $schema=../../../schema/planet-process.schema.yaml
identity:
  key: planet-process.zones-arc-front
  name: Volcanic arc front on a continent over a trench
  about: 'Each plate step: every trench contact (a sinking particle under a riding continental particle) moved ARC_FRONT_M from the sinker toward the rider''s crust gives one front point; the points join one forming ''arc front'' line
    per riding plate (key (''arc'', plate)), opened with a ''subduction'' event. Newly accepted points spawn arc volcano records; all front points refresh nearby volcano records'' ''last''.'
area: relief
clock:
  when: every plate step in the subduction pass, plates.py:1040; t is sim time in Gyr since formation (code converts with *1e3 to Myr)
reads:
- name: trench points
  field: planet-field.trench-position
  unit: '1'
- name: rider plate
  field: planet-field.trench-rider-plate
  unit: '1'
- name: rider continental
  field: planet-field.trench-rider-continental
  unit: '1'
- name: particle positions
  field: planet-field.particle-position
  unit: '1'
  meaning: 'the rider plate''s nearest particle: which way its crust lies'
- name: particle plates
  field: planet-field.particle-plate
  unit: '1'
- name: plate rotation
  field: planet-field.plate-rotation
  unit: '1'
  meaning: 'each plate''s rotation: where the features'' pins stand'
writes:
- name: features (planet-feature.arc-front)
  meaning: one forming arc front per riding plate, its active points this step
note: 'Emits: store event ''subduction'' (plates=[rider plate])'
events_emitted:
- event: planet-event.trace-spawn-rule-zones-subduction
params:
- name: ARC_FRONT_M
  value: 150000.0
  unit: m
  meaning: the volcanic front behind the trench (Earth's arc-trench gaps 100-300 km)
  source: ~/git/planet-sim-landform/src/planet_sim/stages/zones.py:20
- name: POINT_SEP
  value: 78235.4
  unit: m
  said_as:
    unit: km
    factor: 0.001
  meaning: point merge distance
  source: ~/git/planet-sim-landform/src/planet_sim/stages/zones.py:21
  note: '19 Oct 2026: was 0.6 sample spacings (30,000 samples, 130.4 km on Earth): the same distance in metres, no samples'
- name: REACH
  value: 195588.4
  unit: m
  said_as:
    unit: km
    factor: 0.001
  meaning: grow-along-length gate
  source: ~/git/planet-sim-landform/src/planet_sim/stages/zones.py:23
  note: '19 Oct 2026: was 1.5 sample spacings (30,000 samples, 130.4 km on Earth): the same distance in metres, no samples'
- name: rider search
  value: 24.0
  unit: '1'
  meaning: how many nearest particles are searched for the rider plate's (the trench table has no rider position)
  source: planet-forge models/tectonic/arc_front.rs
  note: 'forge: the trench table names the rider plate, not its particle'
invariants:
- one forming arc per riding plate (sinking plates under it may change)
- front point = cos(a)*s + sin(a)*d, a = ARC_FRONT_M/R, d = direction from sinker toward rider tangent at sinker
depends_on:
- planet-process.zones-arc-volcanoes
- planet-process.zones-close-stale
backends:
- cpu
implementations:
- where: planet-sim-landform ~/git/planet-sim-landform/src/planet_sim/stages/zones.py:arcs (50-69)
  state: reference
- where: planet-forge crates/forge-core/src/models/tectonic/arc_front.rs
  state: current
  note: planet-forge port (relief-tectonic line, merged in forge main fc8f460)
applies_to:
- plates
status: draft
basis:
- of:
  - params
  - clock
  - reads
  - writes
  tier: derived
  note: 'planets, 17 Oct 2026: inventory of the Python sim (planet-forge docs/registry-migration/relief_run_views.json), read from the code at planet-sim-landform 9747f0d-c437724.'
- of:
  - reads
  - writes
  - params
  tier: derived
  note: 'planets, 17 Oct 2026: planet-forge relief-tectonic port (models/tectonic, src/ride.rs), read from planet-sim-landform 9747f0d-c437724.'
cautions:
- 'the Python''s reads were its line store''s internals: sinker positions w.x[sinker]; rider particle ids; w.xcont[rider] (only continental riders); w.xplate[rider]; R (planet radius, m); gap = sphere.spacing(n) of the current lattice,
  radians on the unit sphere (x R = metres); refined as the present nears'
