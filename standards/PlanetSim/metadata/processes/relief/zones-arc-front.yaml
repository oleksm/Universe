# yaml-language-server: $schema=../../../schema/planet-process.schema.yaml
# Migrated from the Python sim by planet-forge tools/migration/to_registry.py (planets, 17 Oct 2026); hand-kept from here.
identity:
  key: planet-process.zones-arc-front
  name: Volcanic arc front on a continent over a trench
  about: 'Each plate step: every trench contact (a sinking particle under a riding continental particle) moved ARC_FRONT_M
    from the sinker toward the rider''s crust gives one front point; the points join one forming ''arc front'' line per riding
    plate (key (''arc'', plate)), opened with a ''subduction'' event. Newly accepted points spawn arc volcano records; all
    front points refresh nearby volcano records'' ''last''.'
area: relief
clock:
  when: every plate step in the subduction pass, plates.py:1040; t is sim time in Gyr since formation (code converts with
    *1e3 to Myr)
reads:
- name: sinker positions w.x[sinker]
- name: rider particle ids
- name: w.xcont[rider] (only continental riders)
- name: w.xplate[rider]
- name: R (planet radius, m)
- name: gap = sphere.spacing(n) of the current lattice, radians on the unit sphere (x R = metres); refined as the present
    nears
writes:
- name: forming line type 'arc front' per riding plate, causes {plates:0.6, history:0.4}
  field: planet-field.plate
- name: S.accepted (points accepted this call)
note: 'Emits: store event ''subduction'' (plates=[rider plate])'
events_emitted:
- event: planet-event.trace-spawn-rule-zones-subduction
params:
- name: ARC_FRONT_M
  value: 150000.0
  unit: m
  meaning: the volcanic front behind the trench (Earth's arc-trench gaps 100-300 km)
  source: ~/git/planet-sim-landform/src/planet_sim/stages/zones.py:20
- name: POINT_SEP
  value: 0.6
  unit: '1'
  said_as:
    unit: x gap
    factor: 1.0
  meaning: point merge distance
  source: ~/git/planet-sim-landform/src/planet_sim/stages/zones.py:21
- name: REACH
  value: 1.5
  unit: '1'
  said_as:
    unit: x gap
    factor: 1.0
  meaning: grow-along-length gate
  source: ~/git/planet-sim-landform/src/planet_sim/stages/zones.py:23
invariants:
- one forming arc per riding plate (sinking plates under it may change)
- front point = cos(a)*s + sin(a)*d, a = ARC_FRONT_M/R, d = direction from sinker toward rider tangent at sinker
depends_on:
- planet-process.zones-arc-volcanoes
- planet-process.zones-close-stale
backends:
- cpu
implementations:
- where: planet-sim-landform ~/git/planet-sim-landform/src/planet_sim/stages/zones.py:arcs (50-69)
  state: reference
status: draft
basis:
- of:
  - params
  - clock
  - reads
  - writes
  tier: derived
  note: 'planets, 17 Oct 2026: inventory of the Python sim (planet-forge docs/registry-migration/relief_run_views.json), read
    from the code at planet-sim-landform 9747f0d-c437724.'
