# yaml-language-server: $schema=../../../schema/planet-process.schema.yaml
# Migrated from the Python sim by planet-forge tools/migration/to_registry.py (planets, 17 Oct 2026); hand-kept from here.
identity:
  key: planet-process.zones-suture-forming
  name: Suture recorded during a continental collision
  about: 'Each plate step with continental contacts: the midpoints of every winner-loser particle pair across the contact
    are added to one forming ''suture'' line per plate pair (key (''suture'', min plate, max plate)); a new forming line and
    a ''collision'' event are opened when none is forming for that pair.'
area: relief
clock:
  when: every plate step (<= 5 Myr) inside the collision pass, plates.py:1107 (only when w.lines is not None, SIM_LINES=1);
    t is sim time in Gyr since formation (code converts with *1e3 to Myr)
reads:
- name: w.x (particle unit vectors)
- name: w.xplate
- name: contact pairs win/lose and continental mask cc (w.xcont[win] & w.xcont[lose] & different plates)
- name: gap = sphere.spacing(n) of the current lattice, radians on the unit sphere (x R = metres); refined as the present
    nears
writes:
- name: 'line store: forming line type ''suture'', sides [plate u, plate v], causes {plates:0.6, history:0.4}'
- name: S.open[('suture',u,v)] -> line id
- name: vertices V/A/L/K/VP (anchored to nearest particle)
- name: line['last'] = t when points accepted
note: 'Emits: store event kind ''collision'' (plates=[u,v]) Emits: trace row what=''spawn'' rule=''zones.collision'' (Relief.tag_line)'
params:
- name: POINT_SEP
  value: 0.6
  unit: '1'
  said_as:
    unit: x gap (rad)
    factor: 1.0
  meaning: points of a forming line closer than this are one
  source: ~/git/planet-sim-landform/src/planet_sim/stages/zones.py:21
- name: REACH
  value: 1.5
  unit: '1'
  said_as:
    unit: x gap (rad)
    factor: 1.0
  meaning: 'once a line has points, only points farther than this from all of them are taken: the line grows along its length,
    never behind itself'
  source: ~/git/planet-sim-landform/src/planet_sim/stages/zones.py:23
- name: causes
  setting: '{"plates": 0.6, "history": 0.4}'
  meaning: provenance weights stored on the line
  source: ~/git/planet-sim-landform/src/planet_sim/stages/zones.py:32
  note: 'unit: weights'
invariants:
- one forming suture per plate pair at a time
- accepted points mutually >= POINT_SEP*gap apart
- each vertex anchored to a crust particle and rides its plate
depends_on:
- planet-process.line-store-ride-crust
backends:
- cpu
implementations:
- where: planet-sim-landform ~/git/planet-sim-landform/src/planet_sim/stages/zones.py:collision (38-47), _open (26-35)
  state: reference
status: draft
basis:
- of:
  - params
  - clock
  - reads
  - writes
  tier: derived
  note: 'planets, 17 Oct 2026: inventory of the Python sim (planet-forge docs/registry-migration/relief_run_views.json), read
    from the code at planet-sim-landform 9747f0d-c437724.'
