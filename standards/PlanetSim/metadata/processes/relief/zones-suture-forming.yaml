# yaml-language-server: $schema=../../../schema/planet-process.schema.yaml
identity:
  key: planet-process.zones-suture-forming
  name: Suture recorded during a continental collision
  about: Continental collision contacts build a forming suture. The latest physical contact updates last_myr even when its point is rejected by spatial deduplication; point spacing controls stored geometry, not collision lifetime. The
    line remains active until contacts genuinely cease and zones-close-stale expires it. Contacts remain attached to their material plates and follow collision deformation.
area: relief
clock:
  when: every plate step (<= 5 Myr) inside the collision pass, plates.py:1107 (only when w.lines is not None, SIM_LINES=1); t is sim time in Gyr since formation (code converts with *1e3 to Myr)
reads:
- name: particle positions
  field: planet-field.particle-position
  unit: '1'
- name: particle plates
  field: planet-field.particle-plate
  unit: '1'
- name: front plate pair
  field: planet-field.particle-front-low
  unit: '1'
  meaning: collision-and-docking's continental contacts (with front-high)
- name: front plate pair (high)
  field: planet-field.particle-front-high
  unit: '1'
- name: front time
  field: planet-field.particle-front-time
  unit: s
  meaning: this step's contacts
- name: plate rotation
  field: planet-field.plate-rotation
  unit: '1'
  meaning: 'each plate''s rotation: where the features'' pins stand'
- name: w.plate
  field: planet-field.plate
  unit: '1'
  meaning: the plate each sample reads (forge main's code reads it)
writes:
- name: features (planet-feature.suture)
  meaning: one forming suture per plate pair, growing along its length
note: 'Emits: store event kind ''collision'' (plates=[u,v]) Emits: trace row what=''spawn'' rule=''zones.collision'' (Relief.tag_line)'
params:
- name: POINT_SEP
  value: 78235.4
  unit: m
  said_as:
    unit: km
    factor: 0.001
  meaning: points of a forming line closer than this are one
  source: ~/git/planet-sim-landform/src/planet_sim/stages/zones.py:21
  note: '19 Oct 2026: was 0.6 sample spacings (30,000 samples, 130.4 km on Earth): the same distance in metres, no samples'
- name: REACH
  value: 195588.4
  unit: m
  said_as:
    unit: km
    factor: 0.001
  meaning: 'once a line has points, only points farther than this from all of them are taken: the line grows along its length, never behind itself'
  source: ~/git/planet-sim-landform/src/planet_sim/stages/zones.py:23
  note: '19 Oct 2026: was 1.5 sample spacings (30,000 samples, 130.4 km on Earth): the same distance in metres, no samples'
- name: causes
  setting: '{"plates": 0.6, "history": 0.4}'
  meaning: provenance weights stored on the line
  source: ~/git/planet-sim-landform/src/planet_sim/stages/zones.py:32
  note: 'unit: weights'
invariants:
- one forming suture per plate pair at a time
- accepted points mutually >= POINT_SEP*gap apart
- each vertex anchored to a crust particle and rides its plate
depends_on:
- planet-process.line-store-ride-crust
backends:
- cpu
implementations:
- where: planet-sim-landform ~/git/planet-sim-landform/src/planet_sim/stages/zones.py:collision (38-47), _open (26-35)
  state: reference
- where: planet-forge crates/forge-core/src/models/tectonic/suture.rs
  state: current
  note: planet-forge port (relief-tectonic line, merged in forge main fc8f460)
applies_to:
- plates
status: draft
basis:
- of:
  - params
  - clock
  - reads
  - writes
  rule: rule.inventory-relief-run-views
- of:
  - reads
  - writes
  - params
  rule: rule.relief-tectonic-port-2
cautions:
- 'the Python''s reads were its line store''s internals: w.x (particle unit vectors); w.xplate; contact pairs win/lose and continental mask cc (w.xcont[win] & w.xcont[lose] & different plates); gap = sphere.spacing(n) of the current
  lattice, radians on the unit sphere (x R = metres); refined as the present nears'
