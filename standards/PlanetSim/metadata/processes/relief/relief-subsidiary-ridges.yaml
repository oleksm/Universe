# yaml-language-server: $schema=../../../schema/planet-process.schema.yaml
identity:
  key: planet-process.relief-subsidiary-ridges
  name: Subsidiary ridges
  about: Two lines parallel to the orogen axis at 25 and 50 km on the thick side, kept where the crust is still >= THICK_BELT_M.
area: relief
clock:
  when: with relief-orogen-axis
reads:
- name: features (planet-feature.orogen-axis)
  meaning: and its belt
- name: crust thickness
  field: planet-field.crust-thickness
  unit: m
  meaning: the belt, the sides of a margin
- name: plate rotation
  field: planet-field.plate-rotation
  unit: '1'
  meaning: 'each plate''s rotation: where the features'' pins stand'
writes:
- name: features (planet-feature.subsidiary-ridge)
  meaning: child of its axis
note: 'Emits: trace spawn rule ''relief.orogen.ridges'' trigger + {offset_km}'
params:
- name: offsets
  values:
  - 25000.0
  - 50000.0
  unit: m
  meaning: ridge distances from the axis
  source: ~/git/planet-sim-landform/src/planet_sim/stages/relief.py:259
- name: relief share
  value: 0.6
  unit: '1'
  said_as:
    unit: x orogen relief
    factor: 1.0
  open: true
  meaning: ridge relief0
  source: ~/git/planet-sim-landform/src/planet_sim/stages/relief.py:264
  note: 'unit as the code says it: ''x orogen relief''; SI conversion unverified'
- name: spacing
  value: 25000.0
  unit: m
  said_as:
    unit: km
    factor: 1000.0
  meaning: between the ridges
  source: stages/relief.py:262 (meta spacing_km=25)
depends_on:
- planet-process.relief-orogen-axis
backends:
- cpu
implementations:
- where: planet-sim-landform ~/git/planet-sim-landform/src/planet_sim/stages/relief.py:orogen (258-264)
  state: reference
- where: planet-forge crates/forge-core/src/models/tectonic/ridges.rs
  state: current
  note: planet-forge port (relief-tectonic line, merged in forge main fc8f460)
applies_to:
- plates
status: draft
basis:
- of:
  - params
  - clock
  - reads
  - writes
  rule: rule.inventory-relief-run-views
- of:
  - reads
  - writes
  - params
  rule: rule.relief-tectonic-port-2
cautions: []
