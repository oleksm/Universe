# yaml-language-server: $schema=../../../schema/planet-process.schema.yaml
identity:
  key: planet-process.line-store-record-aging
  name: 'Landmark state: active, former, worn'
  about: At save time a record's state is 'active' while (t - last) <= ACTIVE_MYR[type] (default 5 Myr), 'former' while <=
    WORN_MYR[type] (default never), else 'worn' (kept in history, not drawn).
area: relief
clock:
  when: each checkpoint save (planet_form.py:232, t = age - ago/1000 Gyr)
reads:
- name: mark['last'], mark['type']
writes:
- name: mark['state']
