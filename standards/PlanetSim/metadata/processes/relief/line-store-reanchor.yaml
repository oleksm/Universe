# yaml-language-server: $schema=../../../schema/planet-process.schema.yaml
identity:
  key: planet-process.line-store-reanchor
  name: Records re-anchored on a new lattice
  about: When the crust is laid again (remesh every REMESH_MYR=50 Myr, refinement as the present nears), every vertex and
    landmark anchors to the nearest new particle.
area: relief
clock:
  when: plates.py:934 (refine), 941 (remesh)
reads:
- name: w.x
writes:
- name: S.A, S.PA
invariants:
- positions unchanged, only anchors
backends:
- cpu
implementations:
- where: planet-sim-landform ~/git/planet-sim-landform/src/planet_sim/stages/lines.py:Store.reanchor (209-213)
  state: reference
status: draft
basis:
- of:
  - params
  - clock
  - reads
  - writes
  rule: rule.inventory-relief-run-views
