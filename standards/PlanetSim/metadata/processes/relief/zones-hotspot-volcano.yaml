# yaml-language-server: $schema=../../../schema/planet-process.schema.yaml
identity:
  key: planet-process.zones-hotspot-volcano
  name: Hotspot volcano records (chains as the plate moves)
  about: 'Each plate step, for every plume k: a ''plume'' event is made once per hotspot; if the plume''s last record is alive and within VOLC_SEP*gap it is kept active, else a new ''hotspot volcano'' record is made where the plume
    stands (the plate carries old ones away: chains older along the plate''s path). on_continent = nearest particle continental and within one gap.'
area: relief
clock:
  when: every plate step, plates.py:1189 (after hotspot fertilisation); t is sim time in Gyr since formation (code converts with *1e3 to Myr)
reads:
- name: plumes
  field: planet-field.hotspot-position
  unit: '1'
- name: plate
  field: planet-field.plate
  unit: '1'
- name: crust kind
  field: planet-field.crust-kind
  unit: '1'
  meaning: on a continent
- name: plate rotation
  field: planet-field.plate-rotation
  unit: '1'
  meaning: 'each plate''s rotation: where the features'' pins stand'
writes:
- name: features (planet-feature.hotspot-volcano-centre)
  meaning: on the plate over the plume
note: 'Emits: store event ''plume'' (hotspot=k) once per plume Emits: trace spawn rule ''zones.hotspot'' trigger {hotspot, on_continent}'
params:
- name: VOLC_SEP
  value: 65196.1
  unit: m
  said_as:
    unit: km
    factor: 0.001
  meaning: a plume's last record within this is kept active instead of a new one
  source: ~/git/planet-sim-landform/src/planet_sim/stages/zones.py:19
  note: '19 Oct 2026: was 0.5 sample spacings (30,000 samples, 130.4 km on Earth): the same distance in metres, no samples'
- name: on_continent distance
  value: 130392.3
  unit: m
  said_as:
    unit: km
    factor: 0.001
  meaning: plume counts as under a continent when its nearest particle is continental and closer than gap
  source: ~/git/planet-sim-landform/src/planet_sim/stages/zones.py:115
  note: '19 Oct 2026: was 1.0 sample spacings (30,000 samples, 130.4 km on Earth): the same distance in metres, no samples'
invariants:
- at most one new hotspot record per plume per step
- the hotspot index k is the record's chain key
depends_on:
- planet-process.relief-hotspot-chain
backends:
- cpu
implementations:
- where: planet-sim-landform ~/git/planet-sim-landform/src/planet_sim/stages/zones.py:hotspots (106-126)
  state: reference
- where: planet-forge crates/forge-core/src/models/tectonic/hotspot_volcano.rs
  state: current
  note: planet-forge port (relief-tectonic line, merged in forge main fc8f460)
status: draft
basis:
- of:
  - params
  - clock
  - reads
  - writes
  rule: rule.inventory-relief-run-views
- of:
  - reads
  - writes
  - params
  rule: rule.relief-tectonic-port-2
cautions:
- 'the Python''s reads were its line store''s internals: hotspot positions (spots, unit vectors); w.x, w.xcont; S.plume_last, S._rows; gap = sphere.spacing(n) of the current lattice, radians on the unit sphere (x R = metres); refined
  as the present nears; cell (area per sample, m2; unused here)'
