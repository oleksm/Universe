# yaml-language-server: $schema=../../../schema/planet-process.schema.yaml
identity:
  key: planet-process.relief-folds
  name: Fold axes (anticline / syncline)
  about: Lines parallel to the suture on the foreland side at multiples of the fold wavelength (median belt width / 6, clipped
    15-50 km), alternating anticline (odd) / syncline (even), kept where inside 0.95 of the front distance, inside FOLD_REACH_M
    and on sedimentary rock (SED_UNITS); the end tenth at each end dropped (folds plunge out); each kept run of >= 3 vertices
    one line.
area: relief
clock:
  when: with relief-orogen-axis
reads:
- name: features (planet-feature.orogen-axis)
  meaning: and its suture's belt
- name: crust thickness
  field: planet-field.crust-thickness
  unit: m
  meaning: the belt, the sides of a margin
- name: rock
  field: planet-field.rock
  unit: '1'
  meaning: sedimentary units fold
- name: plate rotation
  field: planet-field.plate-rotation
  unit: '1'
  meaning: 'each plate''s rotation: where the features'' pins stand'
writes:
- name: features (planet-feature.anticline-axis)
  meaning: child of its axis
- name: features (planet-feature.syncline-axis)
  meaning: child of its axis
note: 'Emits: trace spawn rule ''relief.orogen.folds'' trigger + {offset_km, rock ''sedimentary''}'
params:
- name: FOLD_MIN_M
  value: 5000.0
  unit: m
  meaning: fold wavelength floor
  source: ~/git/planet-sim-landform/src/planet_sim/stages/relief.py:45
  note: 'owner, 18 Oct 2026: 5 km. Natural folds range from about 1 km to 50 km in wavelength (Ramsay and Huber 1987, The
    Techniques of Modern Structural Geology, vol. 2: Folds and Fractures); fold-belt anticlines of the Zagros 5-15 km (Mouthereau
    et al. 2007, Tectonics 26, TC5006)'
  open: true
- name: FOLD_MAX_M
  value: 50000.0
  unit: m
  meaning: fold wavelength ceiling
  source: ~/git/planet-sim-landform/src/planet_sim/stages/relief.py:45
- name: FOLD_REACH_M
  value: 250000.0
  unit: m
  meaning: folds at most this far out
  source: ~/git/planet-sim-landform/src/planet_sim/stages/relief.py:41
- name: SED_UNITS
  values:
  - 8.0
  - 9.0
  - 12.0
  unit: '1'
  said_as:
    unit: geology.UNITS index
    factor: 1.0
  open: true
  meaning: 'carbonate, clastic, iron formation: the rocks that fold into ridges'
  source: ~/git/planet-sim-landform/src/planet_sim/stages/relief.py:46
  note: 'unit as the code says it: ''geology.UNITS index''; SI conversion unverified'
- name: front share
  value: 0.95
  unit: '1'
  said_as:
    unit: share
    factor: 1.0
  meaning: folds inside this share of the front distance
  source: ~/git/planet-sim-landform/src/planet_sim/stages/relief.py:251
- name: end trim
  value: 0.1
  unit: '1'
  said_as:
    unit: share of vertices
    factor: 1.0
  open: true
  meaning: dropped at each end
  source: ~/git/planet-sim-landform/src/planet_sim/stages/relief.py:252
  note: 'unit as the code says it: ''share of vertices''; SI conversion unverified'
- name: amplitude
  value: 0.3
  unit: '1'
  said_as:
    unit: x orogen relief
    factor: 1.0
  open: true
  meaning: fold amplitude and relief0
  source: ~/git/planet-sim-landform/src/planet_sim/stages/relief.py:256
  note: 'unit as the code says it: ''x orogen relief''; SI conversion unverified'
- name: wavelength rule
  value: 6.0
  unit: '1'
  meaning: the fold wavelength is the median belt over this
  source: stages/relief.py:246
  note: was a setting in words ('belt width / 6')
depends_on:
- planet-process.relief-orogen-axis
- planet-process.relief-thrust-front
backends:
- cpu
implementations:
- where: planet-sim-landform ~/git/planet-sim-landform/src/planet_sim/stages/relief.py:orogen (245-257), _cut_runs (192-201)
  state: reference
- where: planet-forge crates/forge-core/src/models/tectonic/folds.rs
  state: current
  note: planet-forge port (relief-tectonic line, merged in forge main fc8f460)
status: draft
basis:
- of:
  - params
  - clock
  - reads
  - writes
  tier: derived
  note: 'planets, 17 Oct 2026: inventory of the Python sim (planet-forge docs/registry-migration/relief_run_views.json), read
    from the code at planet-sim-landform 9747f0d-c437724.'
- of:
  - reads
  - writes
  - params
  tier: derived
  note: 'planets, 17 Oct 2026: planet-forge relief-tectonic port (models/tectonic, src/ride.rs), read from planet-sim-landform
    9747f0d-c437724.'
cautions: []
