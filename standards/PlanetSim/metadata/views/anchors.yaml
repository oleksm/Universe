- where: planet-trees-pgs2 tools/planet_vectors.py / planet_anchors.py sheet() (not inventoried; unverified which writes which)
  state: reference
- where: planet-forge crates/viewer/src/layers/anchors.rs
  state: current
  note: the viewer
