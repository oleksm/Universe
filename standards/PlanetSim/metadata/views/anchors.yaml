identity:
  key: planet-view.anchors
  name: anchor model
  about: 'the planet graph: level loops every 200 m off the samples'' refined mesh (reduced: uniform slopes and clusters dropped),
    the shores (sea and inland water), the rivers with arrows downstream, the peaks and lows inside their rings; header and
    legend in the image'
title: anchor model
row: top (history views)
file_suffix: _anchors.png
draws:
