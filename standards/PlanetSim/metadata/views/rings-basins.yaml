# yaml-language-server: $schema=../../schema/planet-view.schema.yaml
identity:
  key: planet-view.rings-basins
  name: Basins
  about: view_basins with smoothed basin x lake classes
title: Basins and connections
row: line rings
file_suffix: _rings_basins.png (+ .legend.json)
draws:
  words: view_basins with smoothed basin x lake classes
shown: true
implementations:
- where: planet-trees-pgs2 ~/git/planet-trees-pgs2/tools/layer_lines.py:rings (351)
  state: reference
- where: planet-forge crates/planet-layers/src/layers/basins.rs
  state: current
  note: the viewer layer
status: draft
legend:
  title: Basins and connections
  rows:
  - kind: head
    label: Where the water goes
  - key: open
    kind: fill
    colour:
    - 150
    - 180
    - 120
    label: basin draining to the sea, one colour each ({n_basins})
  - key: closed
    kind: fill
    colour:
    - 200
    - 180
    - 150
    label: 'closed basin: ends in a closed lake or playa ({closed_pct} % of land; Earth ~18 %)'
  - kind: head
    label: Water (the sim's water balance)
  - key: river
    kind: line
    colour:
    - 30
    - 90
    - 200
    label: rivers flowing, > 300 m³/s; thicker over 30,000 m³/s ({n_flow} reaches)
  - key: mouth
    kind: dot
    colour:
    - 0
    - 60
    - 160
    label: river mouths at the sea, > 1,000 m³/s ({n_mouths})
  - key: lake:1
    kind: fill
    colour:
    - 60
    - 120
    - 220
    label: 'open lake: fills its basin and overflows on ({n_open} samples)'
  - key: lake:2
    kind: fill
    colour:
    - 70
    - 165
    - 160
    label: 'closed (salt) lake: evaporation takes all it gets ({n_closed})'
  - key: lake:3
    kind: fill
    colour:
    - 232
    - 226
    - 205
    label: 'playa: a closed lake too small to hold water long ({n_playa})'
  - key: river-end
    kind: dot
    colour:
    - 120
    - 80
    - 40
    label: 'river dies out: lost to dry air and its dry bed ({n_ends})'
  - kind: head
    label: Water history (greyed)
  - key: dry-valley
    kind: line
    colour:
    - 140
    - 140
    - 140
    label: 'dry valley: a river ran here, too little water now ({n_dry} reaches)'
  - key: former-lake
    kind: fill
    colour:
    - 175
    - 175
    - 175
    label: 'former lake bed: a lake stood here (fades over ~30 Myr)'
  - key: budget
    kind: head
    label: 'Rain that runs off: {sea_pct} % reaches the sea, {lost_pct} % lost to the air (rivers, lakes)'
  - kind: line
    label: 'divide graph: peaks and passes'
    shown: false
  - kind: line
    label: 'source to sink: sediment routes'
    shown: false
  - kind: line
    label: ice-flow tree
    shown: false
  - kind: line
    label: 'groundwater: recharge to springs'
    shown: false
  - kind: line
    label: longshore drift
    shown: false
styles:
- key: coast
  colour:
  - 0
  - 0
  - 0
- key: base-land
  colour:
  - 200
  - 196
  - 186
- key: base-sea
  colour:
  - 205
  - 220
  - 232
- key: dry-valley-line
  colour:
  - 150
  - 150
  - 150
- key: former-lake-blend
  colour:
  - 150
  - 150
  - 150
- key: sea
  colour:
  - 215
  - 225
  - 235
- key: closed-hatch
  colour:
  - 90
  - 70
  - 50
- key: basin-palette-low
  colour:
  - 90
  - 90
  - 90
- key: basin-palette-high
  colour:
  - 229
  - 229
  - 229
basis:
- of:
  - legend
  - styles
  tier: derived
  note: 'planets, 17 Oct 2026: the viewer layers (planet-forge planet-layers), from planet-trees-pgs2 context_view.py / layer_lines.py.'
