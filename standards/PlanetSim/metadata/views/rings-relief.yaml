# yaml-language-server: $schema=../../schema/planet-view.schema.yaml
identity:
  key: planet-view.rings-relief
  name: 'Relief: classes and features'
  about: 'view_relief on smoothed relief classes, then relief_overlay: every alive relief feature from <ck>_store.npz in its
    family colour (RELIEF_FAM, worn faint), a pin with #id per line, landmark dots; legend adds coverage and every kind with
    counts and id ranges'
title: 'Relief: classes and features'
row: line rings
file_suffix: _rings_relief.png (+ .legend.json)
draws:
  words: 'view_relief on smoothed relief classes, then relief_overlay: every alive relief feature from <ck>_store.npz in its
    family colour (RELIEF_FAM, worn faint), a pin with #id per line, landmark dots; legend adds coverage and every kind with
    counts and id ranges'
shown: true
implementations:
- where: planet-trees-pgs2 ~/git/planet-trees-pgs2/tools/layer_lines.py:rings (355-356 (+ relief_overlay 384-444))
  state: reference
- where: planet-forge crates/planet-layers/src/layers/relief.rs
  state: current
  note: the viewer layer
- where: planet-forge crates/relief src/draw.rs + legend.rs (planet-relief demo)
  state: building
  note: 'the vector relief: every kind its own colour and line style'
status: draft
legend:
  title: 'Relief: classes and features'
  rows:
  - kind: head
    label: Relief inside each sample (Earth's amounts, placed by the sim)
  - key: class:0
    kind: fill
    colour:
    - 205
    - 225
    - 160
    label: 'lowland plain: {class_0} % of land'
  - key: class:1
    kind: fill
    colour:
    - 225
    - 220
    - 170
    label: 'plain: {class_1} % of land'
  - key: class:2
    kind: fill
    colour:
    - 215
    - 190
    - 140
    label: 'plateau: {class_2} % of land'
  - key: class:3
    kind: fill
    colour:
    - 180
    - 160
    - 110
    label: 'hills: {class_3} % of land'
  - key: class:4
    kind: fill
    colour:
    - 140
    - 105
    - 80
    label: 'low mountains: {class_4} % of land'
  - key: class:5
    kind: fill
    colour:
    - 95
    - 70
    - 60
    label: 'high mountains: {class_5} % of land'
  - kind: head
    label: Mountains {mountains} % of land (Earth ~22 %); hills {hills} % (Earth ~30 %)
  - kind: head
    label: 'Patterns on {patterns_pct} % of land, {per_sample} per sample, {patterns_used} patterns in use; labels: leading
      pattern'
  - kind: head
    label: 'Relief features: {n_features} ({n_worn} worn, faint); pins: line refs (#id)'
  - kind: head
    label: 'Coverage: {cover_50} % of land within 50 km, {cover_150} % of land within 150 km'
  - key: each:feature-kind
    kind: line
    label: '{kind}: {n}{worn} · #{first}–#{last}'
  - kind: head
    label: Relief features, each kind its own colour and line style (vector relief)
  - key: kind:suture
