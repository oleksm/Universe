    - 70
    - 60
    label: 'high mountains: {class_5} % of land'
  - kind: head
    label: Mountains {mountains} % of land (Earth ~22 %); hills {hills} % (Earth ~30 %)
  - kind: head
    label: 'Patterns on {patterns_pct} % of land, {per_sample} per sample, {patterns_used} patterns in use; labels: leading
      pattern'
  - kind: head
    label: 'Relief features: {n_features} ({n_worn} worn, faint); pins: line refs (#id)'
  - kind: head
    label: 'Coverage: {cover_50} % of land within 50 km, {cover_150} % of land within 150 km'
  - key: each:feature-kind
