  key: planet-run-profile.standard
  name: Standard run
  about: 'The planet sim''s standard run as the Python run tool (planet_form.py) makes it: checkpoints, settings, gates and
    targets.'
start: 1.420092e+17
end: 0.0
times_said:
  unit: Myr
  factor: 31557600000000.0
checkpoints:
- at: 1.262304e+17
  label: 4000 Myr ago
- at: 7.8894e+16
  label: 2500 Myr ago
