record_fields:
- meaning: stable id (L12 a line, M5 a record)
  name: id
- meaning: the feature kind (this catalogue)
  name: kind
- meaning: polyline / polygon / ring / point / point set / network, on the sphere, riding the crust
  name: geometry
- meaning: '1: 10-50 km, 2: 2-10 km, 3: under 2 km (the coarsest it appears at)'
  name: level
  unit: 1-3
- meaning: along the feature
  name: length
  unit: m
- meaning: its footprint across
  name: width
  unit: m
- meaning: height above (ridge, scarp) or depth below (valley, basin) its surroundings; relief0 at birth
  name: relief
  unit: m
- meaning: 'cross-section: V, U, flat-floored, box, asymmetric, stepped, convex, concave; side slopes deg'
  name: profile
  unit: class
- meaning: 'trend / strike / flow direction; facing: which side is steep or down'
  name: direction
  unit: deg
- meaning: dendritic, trellis, radial, parallel, rectangular, en-echelon, braided, alternating ...
  name: pattern
  unit: class
- meaning: between repeats (ridges, folds, scarps, centres, dunes)
  name: spacing
  unit: m
- meaning: how far its influence reaches
  name: spread
  unit: m
- meaning: turning per 100 km; sinuosity (path / chord); straight share
  name: curvature
  unit: deg/100 km, 1
- meaning: 'and state: active / former / worn / buried / drowned / overprinted / dead'
  name: born, last active
  unit: Myr
- meaning: the sim event id and process
  name: cause
- meaning: the generator that fired and the values that fired it
  name: rule, trigger
- meaning: at forming
  name: rock, climate
  unit: class
- meaning: what it sits in / what it expands into
  name: parent, children
  unit: ids
- meaning: 'every change: grown, segmented, overridden, eroded (rule and values)'
  name: history
- meaning: measured vs inferred
  name: confidence
  unit: 0-1
- meaning: its deterministic detail
  name: seed
- meaning: 'the instance''s anchor point: x, y, z in integer centimetres in the planet''s body-fixed frame (y the spin axis), on its plate''s frame while its crust moves; set once, never re-derived, so the feature renders in the same
    place at every level and on every machine (owner, 17 Oct 2026). Its kind''s pinned_to says what it marks'
  name: pin
  unit: cm
- meaning: east, north, up at the pin, worked out from the pin alone (never stored)
  name: frame
- meaning: 'the kind''s named polylines, each vertex an integer-cm offset (east, north, up) from the pin: exact and reversible; up carries the planet''s curvature'
  name: spans
  unit: cm
- meaning: 'values along a span, one per vertex, SI (named <span>.<what>: centreline.width)'
  name: profiles
- meaning: the kind's dimensions with their values for this instance, SI, each set by the law on the kind
  name: dimensions
- meaning: the kind's layout parameters for this instance (meander wavelength, bend radius), SI
  name: layout
- meaning: the feature it hangs from (one of its kind's parent_kinds) and its pin's offset in the parent's frame, integer cm
  name: parent, parent_offset
  unit: cm
trace:
  row: 'One row for every spawn and every change: step, t (Myr), rule, kind, feature id, lon and lat, the trigger values, the metadata set or changed.'
  saved: <ck>_relief_trace.jsonl beside the store, per checkpoint
  log: 'per checkpoint one line per family: features alive, spawned, segmented and eroded since the last checkpoint, and the busiest rule'
overrides:
- name: move / tear
  trigger: its crust moves; plates part under it
  effect: vertices move; cut at the plate edge; segmented
- name: sink
  trigger: its crust subducts
  effect: dead, its fate kept
- name: crossing
  trigger: a younger feature crosses it (a fault across a fold, a river across a ridge)
  effect: cut, or the younger one bends (by rule); both traced
- name: erosion
  trigger: every coupled step (applied per checkpoint)
  effect: relief decays by the erosion rule; valleys widen, crests round; worn below a quarter of its first relief
- name: burial
  trigger: sediment laid over it (laid) above its relief
  effect: 'buried (kept: it can be exhumed)'
- name: drowning
  trigger: the sea rises over it
  effect: drowned (a ria, a drowned valley)
- name: overprint
  trigger: a younger process reshapes it (ice over a river valley)
  effect: a child of the new kind replaces its shape; the old one overprinted
- name: reactivation
  trigger: its cause fires again (a fault re-used by a later rift)
  effect: active again, new relief added, traced
erosion:
  formula: 'relief(t) = relief0 exp(-(t - born) / tau); tau = tau0 x hardness(rock) / wetness(climate) x glacial factor: hardness from the rock unit''s erodibility (Celestial rock units), wetness from rain and runoff, the glacial factor
    over 1 for cold-based ice and under 1 for wet-based'
  params:
  - name: tau0
    source: TAU0_MYR
    value: 1893456000000000.0
    unit: s
    note: '60 Myr (the code; the design doc fixed to match at pgs2 6374530): Earth''s ranges lose most relief in 100 to 300 Myr (Appalachians, Urals)'
  - name: worn share
    source: WORN_SHARE
    value: 0.25
    unit: '1'
    note: worn below this share of its first relief
  - name: escarpment retreat
    source: ESCARP_RETREAT_M_MYR
    value: 1.5844043907014474e-11
    unit: m/s
    note: '500 m/Myr (the design: 0.5 to 1 km/Myr)'
tools:
- name: tools/relief_trace.py RUN --stats
  does: 'per kind: alive and ever spawned; length, width, relief and spacing distributions; curvature (turning per km, sinuosity, straight share); segments per feature; trigger histograms; spawn times; state shares'
- name: tools/relief_trace.py RUN --why ID
  does: 'a feature''s lineage: event, rule, trigger values, parent, every later change'
- name: tools/relief_trace.py RUN --near LON,LAT,KM
  does: every feature there, with kind, age, rule
- name: tools/relief_trace.py RUN --map, --timeline
  does: a map of the features by family, and their spawns through time
