# yaml-language-server: $schema=../../schema/planet-model.schema.yaml
identity:
  key: planet-model.relief
  name: Relief model
  about: 'The planet''s relief layer, on a continuous planet: first the local relief R, a continuous field the sim samples at points about 130 km apart and read anywhere between them as the heights are, Earth''s amounts placed by the
    sim''s causes, with its classes and summits; then every land-forming feature the sim generates as vectors with metadata, pinned to the crust (the relief store, the former line store), each with its own scale (spacing, wavelength,
    width) below the sample spacing, with the trigger and rule that made it, its later overrides and erosion, traced so what, why, where and when can be asked.'
  words: 'The owner, 17 Oct 2026: "Move that stuff [the line store] on the relief layer. Run through every feature and find a way for our sim to generate it. Create tracing and debugging tools and stats so we can later trace what and
    why and where is spawned, what is their trigger, geo pattern, dimensions, length, curvature pattern, segmentation, later overrides, erosion based on zones and formations."'
purpose: 'To give the sim''s land its relief, a continuous local-relief field and, below the sample spacing, the land-forming features that carry that relief at their own scales: the skeleton the mesher meshes round, each feature with
  the history that made it.'
detail:
  rule: Rank the land samples by a weighted score of causes; take Earth's local relief at the same quantile; read R anywhere between the samples as a continuous field; class each place by its relief and height; raise the summits from
    both. Below the sample spacing the relief features carry the relief, each at its scale.
inputs:
- name: z
  unit: m
  field: planet-field.height
  source: checkpoint z
  meaning: height above sea level at the sample
- name: thick
  unit: m
  field: planet-field.crust-thickness
  source: ctx thick
  meaning: crust thickness
- name: hfold
  unit: '1'
  field: planet-field.fold
  source: ctx h_fold
  meaning: the sim's fold belts, 0 to 1
- name: conv, div, trans
  unit: '1'
  source: plate boundaries from plate and the plates' spin axes (ctx axes)
  meaning: 'nearness to a converging, diverging or transform boundary: 1 on it, falling to 0 four samples away'
- name: anyb
  unit: '1'
  source: as above
  meaning: nearness to any boundary (five samples)
- name: relief to neighbours
  unit: m
  field: planet-field.local-relief
  source: z less the lowest neighbour's z
  meaning: the drop to the lowest neighbouring sample
- name: up
  unit: m/s
  source: z change since the previous checkpoint (or thickened crust at converging plates when there is none)
  meaning: uplift, said in m/Myr
- name: rock
  unit: class
  field: planet-field.rock
  source: checkpoint rock
  meaning: 'volcanic units: arc volcanics, flood basalt, rift basalt'
- name: ice cycles
  unit: '1'
  field: planet-field.ice-cycles
  source: ctx r_ice_cycles
  meaning: glaciations in the recent epoch
- name: age
  unit: s
  field: planet-field.crust-age
  source: ctx age
  meaning: crust age since formed, said in Myr
steps:
- name: ranking score g
  rule: A weighted sum of the causes, then two smoothing passes over the land neighbours (g = 0.5 g + 0.5 their mean), so ranges, not single samples, carry relief; ties broken by a fixed seed. ramp(x, a, b) is 0 below a, 1 above b,
    linear between.
  formula: g = 0.35 ramp(thick, 38 km, 60 km) + 0.25 hfold + 0.20 conv + 0.15 ramp(relief to neighbours, 200 m, 2,000 m) + 0.15 ramp(up, 3, 40 m/Myr) + 0.10 volcanic rock + 0.10 ramp(ice cycles, 0.5, 6) + 0.20 ramp(z, 300 m, 3,000 m)
    + 0.05 trans + 0.05 div - 0.15 ramp(age, 500, 2,000 Myr) (1 - anyb)
- name: Earth's amounts
  rule: 'Quantile matching: the land samples ranked by g take Earth''s local relief at the same quantile, so the planet''s relief distribution is Earth''s by construction and the sim decides only where. R is then a continuous field,
    interpolated between the samples, never a value per area. First draft: Earth''s amounts as one statistic, p95 - p5 of the heights within about 130 km of each of 30,000 points (the old per-sample statistic); agreed (17 Oct 2026):
    Earth''s local relief within radii of about 2, 10 and 50 km, per relief class (ETOPO, USGS 3DEP), as the target instead (open until measured).'
  formula: R = Earth[q(g)]
- name: relief classes
  rule: 'Each place''s class from R and z, the first rule that holds from high mountains down (the legend: planet-layer.relief).'
- name: summits
  rule: 'The highest summit near each land sample, u uniform 0 to 1 seeded by the sample index; first draft from Earth at 30,000 points: the summit stands 1.03 x (p95 - p5) over the mean height within about 130 km at the median, 1.69
    x at the 90th percentile (the old per-sample statistic).'
  formula: summit = z + R (1.03 + 0.66 u) PEAK_GAIN
- name: lines
  rule: 'The relief layer as lines (layers as curved lines, never patches): land contours of the smoothed height at 500, 1,000, 2,000, 3,000, 4,000 and 5,000 m, and the boundaries between relief classes, each point''s class the leader
    among its nearest 40 samples (Gaussian weights, sigma 1.4 sample spacings) on its side of the coast.'
legend: planet-layer.relief
source_field:
- planet-field.height
- planet-field.recent-height
params:
- name: weights
  note: as in the ranking score; first drafts, judged only by the class shares against Earth
- name: ramps
  note: thick 38 to 60 km; relief 200 to 2,000 m; up 3 to 40 m/Myr; ice 0.5 to 6 cycles; z 300 to 3,000 m; age 500 to 2,000 Myr; first drafts
- name: smoothing
  note: 2 passes, 0.5 / 0.5
- name: class thresholds
  note: R 300, 900 and 1,500 m; z 200 and 600 m (on planet-layer.relief)
- name: summit ratio
  note: 1.03 + 0.66 u
- name: PEAK_GAIN
  value: 1.1
  unit: '1'
  note: 'the owner, 16 Oct 2026: giants a bit higher than Earth''s'
- name: relief contours
  note: 500, 1,000, 2,000, 3,000, 4,000, 5,000 m
- name: ring smoothing
  value: 40.0
  unit: '1'
  note: K nearest samples, sigma 1.4 sample spacings
- name: local relief targets
  open: true
  note: 'Earth''s local relief within radii of about 2, 10 and 50 km, per relief class (ETOPO, USGS 3DEP): agreed 17 Oct 2026 as the target, not yet measured.'
guarantees:
- 'The planet''s land relief distribution is Earth''s by construction (first draft: against the old per-sample statistic).'
- 'R is a continuous field: read anywhere, never a value per area.'
- 'The check (agreed): the mesh''s local relief at radii of about 2, 10 and 50 km, measured anywhere, against Earth''s for its class and scale.'
references:
- name: ETOPO 2022
  by: NOAA NCEI
  used_for: 'Earth''s local relief. First draft (the old per-sample statistic): p95 - p5 of the heights within about 130 km of each of 30,000 equal-area points, ice sheets left out (7,827 on land): median 320 m; 33 % above 600 m; 22
    % above 900 m; 9 % above 1,500 m. Agreed next: the local relief within radii of about 2, 10 and 50 km, per relief class (open).'
  path: ~/planet-data/scratch/earth_cell_relief_30k.npy
  url: https://www.ncei.noaa.gov/products/etopo-global-relief-model
- name: UNEP-WCMC mountain extent
  by: UN Environment Programme World Conservation Monitoring Centre
  used_for: 'The check on the mountain share: about 24 % of land, against the model''s 22 %'
- name: USGS 3DEP
  by: U.S. Geological Survey
  used_for: 'Earth''s local relief at the small radii (about 2 and 10 km), per relief class: the agreed target, open until measured'
  url: https://www.usgs.gov/3d-elevation-program
registers:
- name: provinces
  what: Where a kind of relief holds; bounded by lines.
  geometry: polygons with boundary lines
  example: fold-and-thrust belt, shield, plateau, rift province
- name: relief features (the skeleton)
  what: The land-forming lines, areas and points inside provinces, at every scale.
  geometry: polylines, polygons, points, rings, networks
  example: crest lines, valley axes, escarpments, terraces, fans, moraines
- name: landmarks (events)
  what: Single, dated events, not the slow work (the Planet Simulator's landmark types).
  geometry: points and small areas with a record
  example: Shasta, Crater Lake caldera, an impact crater, a flood
