# yaml-language-server: $schema=../../schema/planet-field.schema.yaml
identity:
  key: planet-field.sea-level-curve
  name: Sea level curve
  about: 'The recent epoch''s sea level through the glacial cycles: rows of time, ice volume, sea level.'
unit: m
per: global
producer:
  where: tools/recent.py
  file: ctx
  key: r_sea_curve
time_base: before-present
cautions:
- 'rows [kyr before present, ice, m]: not per sample'
- 'forge keeps it as a table of the same name: columns time-before-present (s), glaciality (1), sea-offset (m), a row per
  recent-epoch step.'
status: draft
basis:
- of:
  - identity
  - producer
  - unit
  rule: rule.inventory-surface-python
