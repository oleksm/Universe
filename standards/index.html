<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Freefall Facts</title>
<style>
:root {
  color-scheme: dark;
  /* The game's HUD: near-black panels on dark slate, pale text, amber, cyan, green. */
  --bg: #2b3138; --panel: #20262c; --line: #3a4652; --text: #dcebf2; --dim: #8fa3b0;
  --head: #60ffb0; --id: #ffb040; --link: #5cc8f0; --sel: #1f4a3d; --bad: #ff5a4a; --code: #2e363e;
  --th: #48505a; --tbl: #383e46; --tline: #535c67;
  --nav: #20262c;
  --k-chemical: #60ffb0; --k-thermal: #ffb040; --k-mechanical: #5cc8f0;
  --m-metal: #e6c15a; --m-alloy: #9cc4e6; --m-ceramic: #f09a6a; --m-glass: #9be3e8; --m-polymer: #cfa3f5; --m-composite: #7ed29a; --m-fluid: #6aa8ff;
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #ffffff; --panel: #ffffff; --line: #b9c4cd; --text: #0a1117; --dim: #3d4f5c;
  --head: #04683b; --id: #0a58b8; --link: #0a58b8; --sel: #cdeedd; --bad: #b0281a; --code: #e9eef2;
  --th: #dceaf3; --tbl: #f3f8fb; --tline: #b7cbd8;
  --nav: #f4f6f8;
  --k-chemical: #04683b; --k-thermal: #a85a00; --k-mechanical: #0a58b8;
  --m-metal: #8a6a00; --m-alloy: #2f5f8a; --m-ceramic: #a8481c; --m-glass: #1b7f86; --m-polymer: #7a3fb0; --m-composite: #1f7a3f; --m-fluid: #1f55b8;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; letter-spacing: .06em; }
header { display: flex; gap: 12px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 2; }
header { text-transform: none; }
header h1 { font-size: 15px; margin: 0; color: var(--head); letter-spacing: .05em; white-space: nowrap; }
header input { flex: 1; min-width: 0; max-width: 420px; padding: 6px 10px; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 4px; font: inherit; }
header .count { color: var(--dim); white-space: nowrap; }
header button { margin-left: auto; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 4px 10px; font: inherit; cursor: pointer; }
main { display: grid; grid-template-columns: var(--nav-w, 400px) 6px 1fr; height: calc(100vh - 49px); }
#grip { cursor: col-resize; background: var(--line); opacity: .5; }
#grip:hover, #grip.drag { opacity: 1; background: var(--head); }
nav { overflow: auto; padding: 8px 0; background: var(--nav); }
article { overflow: auto; padding: 16px 24px 48px; }
article > * { max-width: 110ch; }
.row { padding: 2px 12px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row:hover { background: var(--code); }
.row.sel { background: var(--sel); box-shadow: inset 3px 0 0 var(--head); font-weight: 600; }
.row .tw { display: inline-block; width: 1.2em; color: var(--dim); }
.row.body { color: var(--head); font-weight: bold; }
.row.empty { color: var(--dim); }
.row .n { color: var(--dim); }
.row .sid { color: var(--id); }
h2 { color: var(--head); font-size: 17px; margin: 0 0 4px; }
h3 { color: var(--dim); font-weight: 700 !important; font-size: 12px; letter-spacing: .08em; margin: 22px 0 6px; font-weight: normal; text-transform: uppercase; }
.meta { color: var(--dim); }
a { color: var(--link); text-decoration: none; cursor: pointer; }
a:hover { text-decoration: underline; }
table { border-collapse: collapse; margin: 4px 0; }
th, td { text-align: left; padding: 3px 14px 3px 0; vertical-align: top; }
th { color: var(--dim); font-weight: 700; border-bottom: 1px solid var(--line); text-transform: uppercase; font-size: 12px; background: var(--th); color: var(--text); border-bottom-color: var(--tline); }
tr + tr td { border-top: 1px solid var(--tline); }
table { background: var(--tbl); border: 1px solid var(--tline); }
th, td { padding: 4px 14px 4px 8px; }
th:first-child, td:first-child { padding-left: 4px; }
td.num { text-align: right; }
.problems { border: 1px solid var(--bad); color: var(--bad); padding: 8px 12px; margin: 8px 12px; border-radius: 4px; }
.problems li { margin: 2px 0; }
.file { color: var(--dim); font-size: 12px; }
p { margin: 4px 0 8px; max-width: 80ch; }
.ico { display: inline-block; vertical-align: middle; line-height: 0; color: var(--head); }
.ico svg { width: 18px; height: 18px; }
.ico.big svg { width: 44px; height: 44px; }
.ico.mid svg { width: 26px; height: 26px; }
.row .ico { margin-right: 6px; }
.logo { --logo-cut: var(--bg); display: inline-block; vertical-align: middle; line-height: 0; }
.logo svg { width: 18px; height: 18px; }
.logo.big svg { width: 96px; height: 96px; }
.landmap { display: block; width: 100%; max-width: 760px; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; margin: 6px 0 12px; }
.landmap .zone { stroke-width: 6; fill-opacity: .22; }
.landmap .u-port { fill: #4c9bd9; stroke: #4c9bd9; } .landmap .u-industrial { fill: #d98a3d; stroke: #d98a3d; } .landmap .u-commercial { fill: #9b8cf0; stroke: #9b8cf0; }
.landmap .u-civic { fill: #5fbf8f; stroke: #5fbf8f; } .landmap .u-residential { fill: #d9c84a; stroke: #d9c84a; }
.landmap .reach { fill: none; stroke: var(--dim); stroke-width: 3; stroke-dasharray: 14 12; }
.landmap .padc { fill: none; stroke: var(--text); stroke-width: 5; }
.landmap .plot { fill: var(--bg); fill-opacity: .55; stroke: var(--text); stroke-width: 6; cursor: pointer; } .landmap .plot.lit { stroke: var(--head); fill: var(--head); fill-opacity: .25; }
.landmap .zl { fill: var(--dim); letter-spacing: .08em; } .landmap .pl { fill: var(--text); font-weight: 700; cursor: pointer; }
.landmap .scale { fill: none; stroke: var(--text); stroke-width: 6; }
.row .logo { --logo-cut: var(--nav); margin-right: 6px; }
.row.sel .logo { --logo-cut: var(--sel); }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; max-width: none; margin: 6px 0 12px; }
.gallery a { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 6px; background: var(--tbl); border: 1px solid var(--tline); border-radius: 4px; text-align: center; color: var(--text); font-size: 12px; letter-spacing: 0; }
.gallery a:hover { border-color: var(--head); text-decoration: none; }
.ico.k-chemical { color: var(--k-chemical); } .ico.k-thermal { color: var(--k-thermal); } .ico.k-mechanical { color: var(--k-mechanical); }
.ico.m-metal { color: var(--m-metal); } .ico.m-alloy { color: var(--m-alloy); } .ico.m-ceramic { color: var(--m-ceramic); } .ico.m-glass { color: var(--m-glass); }
.ico.m-polymer { color: var(--m-polymer); } .ico.m-composite { color: var(--m-composite); } .ico.m-fluid { color: var(--m-fluid); }
.badges { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 10px; max-width: none; }
.badge { padding: 3px 12px; border: 1px solid var(--tline); border-radius: 12px; cursor: pointer; font-size: 12px; color: var(--dim); background: transparent; user-select: none; }
.badge:hover { color: var(--text); }
.badge.on { color: var(--bg); background: var(--text); border-color: var(--text); font-weight: 700; }
.badge.k-chemical.on { background: var(--k-chemical); border-color: var(--k-chemical); }
.badge.k-thermal.on { background: var(--k-thermal); border-color: var(--k-thermal); }
.badge.k-mechanical.on { background: var(--k-mechanical); border-color: var(--k-mechanical); }
.badge.k-chemical { border-color: var(--k-chemical); } .badge.k-thermal { border-color: var(--k-thermal); } .badge.k-mechanical { border-color: var(--k-mechanical); }
/* The periodic table: 18 groups across (a column of period numbers first), the f-block below. */
.ptable { display: grid; grid-template-columns: 22px repeat(18, 46px); gap: 3px; margin: 8px 0 12px; max-width: none; letter-spacing: 0; }
.ptable .hd { color: var(--dim); font-size: 11px; text-align: center; align-self: center; }
.ptable .el { height: 46px; padding: 2px 4px; border-radius: 3px; cursor: pointer; color: #eef3f6; line-height: 1.15; overflow: hidden; }
.ptable .el:hover { outline: 2px solid var(--head); }
.ptable .el .z { font-size: 10px; opacity: .8; display: block; }
.ptable .el .sy { font-size: 16px; font-weight: 700; }
.ptable .ph { height: 46px; font-size: 10px; color: var(--dim); display: flex; align-items: center; justify-content: center; border: 1px dashed var(--line); border-radius: 3px; }
/* An element's icon: its tile from the periodic table. */
.tile { display: inline-flex; flex-direction: column; justify-content: center; width: 46px; height: 46px; padding: 2px 4px; border-radius: 3px; color: #eef3f6; line-height: 1.15; vertical-align: middle; letter-spacing: 0; margin-right: 10px; }
.tile .z { font-size: 10px; opacity: .8; font-weight: 400; }
.tile .sy { font-size: 16px; font-weight: 700; }
.tile.small { width: 22px; height: 18px; padding: 0; margin-right: 6px; align-items: center; }
.tile.small .sy { font-size: 10px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; max-width: none; font-size: 12px; }
.legend span i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; }
.c-alkali-metal { background: #8a3f3f; } .c-alkaline-earth-metal { background: #8a643a; } .c-transition-metal { background: #3d5f86; }
.c-post-transition-metal { background: #357a70; } .c-metalloid { background: #5f7d35; } .c-non-metal { background: #2f7a48; }
.c-halogen { background: #74408a; } .c-noble-gas { background: #4c4496; } .c-lanthanide { background: #8a3c68; } .c-actinide { background: #8a5236; }
.c-unknown { background: #48505a; }
@media (max-width: 720px) {
  main { grid-template-columns: 1fr; height: auto; }
  #grip { display: none; }
  nav { max-height: 45vh; border-right: 0; border-bottom: 1px solid var(--line); }
  header { flex-wrap: wrap; }
}
</style>
</head>

<header>
  <h1>FREEFALL FACTS</h1>
  <input id="q" type="search" placeholder="Search ids, titles, text, parameters…" autocomplete="off">

  <button id="theme" title="Light or dark">◐</button>

<script>
const DATA = {"bodies": [{"key": "body.sfo", "name": "Standards Foundry Office", "prefix": "SFO", "seat": "home", "address": {"at": "treistun/treistun-e-station", "tower": "Civic Tower", "deck": 12, "section": "A", "unit": 1}, "note": "The standards everyone builds to, whoever they answer to. Open to all.", "kind": "independent", "purpose": "The SFO exists so that what people make fits together, whoever made it and wherever it goes.", "details": {"text": ["- Interoperability: a module from one maker fits a hull from another.", "- Open passage: a ship of any civilisation can set down at any port built to the same standards.", "- Honest measure: a tonne is a tonne and a grade is a grade, so trade can be trusted.", "- Safety: common signals, lights and distress codes, so strangers can avoid harm and help each other.", "- Lower cost: makers build once for everyone instead of for each customer."]}, "founded_by": ["brand.tolland", "brand.vireo", "brand.kestrel", "brand.hadley", "brand.orbital", "brand.halvard"], "about": ["The Standards Foundry Office is independent and international: no government owns it and it governs no one. Its members are the standards bodies of the civilisations that take part, with the makers who build to its work; the first makers founded it. It is seated at the home station, where it keeps its register.\n", "Its work is interoperability: that a module from one maker fits a hull from another, that a ship of one civilisation can set down at another's port, that a tonne is a tonne and a signal is understood. What exists, and how it fits together.\n"]}], "brands": {"brand.aurel": "Aurel Fusion Works", "brand.cormorant": "Cormorant Mining", "brand.garrick": "Garrick Arms", "brand.hadley": "Hadley Heavy Industries", "brand.halcyon": "Halcyon Field Systems", "brand.halvard": "Halvard Construction", "brand.kestrel": "Kestrel Driveworks", "brand.meridian": "Meridian Power", "brand.orbital": "Orbital Systems", "brand.tallis": "Tallis Signal Works", "brand.tolland": "Tolland Yards", "brand.vireo": "Vireo Spaceworks"}, "house": {"name": "Maker House"}, "local": {"name": "Local Administration", "note": "Each settled system's administration manages the land in its system. It zones land, grants building permits and collects property tax. Land is filed by system, then by body: a planet, moon or settlement where people can live. Its zoning code says what each kind of zone permits; a settlement's zones are drawn on its ground, and its land is surveyed into parcels, each with an owner. Asteroids are not land; claiming one is like claiming the ocean. Unsettled systems have none."}, "port": {"grid": 4, "spacing": 150.0, "pad": 45.0, "radius": 400.0}, "administrations": [{"name": "Treistun", "address": {"at": "treistun/treistun-e-station", "tower": "Civic Tower", "deck": 1, "section": "A", "unit": 1}, "about": "Treistun is a K-type star, cooler than most and giving 0.29 of the Sun's light. It has nine planets: five rocky ones close in, then two gas giants and two ice giants, with fifteen moons between them. Two of the rocky worlds, d and e, have air. It is the only settled system so far: one station and ten ports, with gates to Liham, Driumum and Biraidim.", "story": ["Treistun was settled from its fourth planet outward. The first port was Nacaubun on Treistun e, and the station was raised above it once there were more ships than one field could take.", "From there the ports went both ways: inward to the hot, heavy worlds, and outward to the moons of the giants. The administration grew out of the port office at Nacaubun and moved up to the station with everything else."], "zoning": [{"use": "port", "permits": "Landing pads, hangars, fuel and the port's own buildings."}, {"use": "industrial", "permits": "Foundries, mills, workshops and yards."}, {"use": "commercial", "permits": "Markets, shops and company offices."}, {"use": "civic", "permits": "The administration and offices of record."}, {"use": "residential", "permits": "Homes."}], "bodies": [{"name": "Port Aipika", "kind": "settlement", "at": "Treistun i II", "position": {"latitude": -21.118, "longitude": 142.499}, "about": "The port on Treistun i II, a moon of the ice giant i, at 21° south. Gravity 0.11 g, no air, and about 80 K. At 6.2 AU it is the farthest port from the star.", "story": ["The end of the line. From Aipika the star is only the brightest point in the sky, and the next port in any direction is a long way back."], "slug": "port-aipika", "file": "LocalAdministration/metadata/administrations/treistun/port-aipika.yaml"}, {"name": "Port Eikir", "kind": "settlement", "at": "Treistun d", "position": {"latitude": 45.649, "longitude": 165.925}, "about": "The port on Treistun d, at 46° north. Gravity 1.07 g, with air, and warm.", "story": ["Put far to the north on purpose, out of the worst of d's heat. It is the one port besides Nacaubun where people can stand outside under a sky."], "slug": "port-eikir", "file": "LocalAdministration/metadata/administrations/treistun/port-eikir.yaml"}, {"name": "Port Fabindum", "kind": "settlement", "at": "Treistun c I", "position": {"latitude": -43.742, "longitude": -87.965}, "about": "The port on Treistun c I, the moon of c, at 44° south. Gravity 0.11 g, no air.", "story": ["The answer to Lisaur. Heavy lifters bring cargo up from c and ordinary ships collect it here, so that only the ships built for 1.67 g ever have to face it."], "slug": "port-fabindum", "file": "LocalAdministration/metadata/administrations/treistun/port-fabindum.yaml"}, {"name": "Port Lisaur", "kind": "settlement", "at": "Treistun c", "position": {"latitude": -6.649, "longitude": -44.994}, "about": "The port on Treistun c, close to the equator at 7° south. Gravity 1.67 g, the highest of any port, and no air.", "story": ["Pilots treat Lisaur as a test. A ship that can lift loaded from here can lift from anywhere in the system, and a ship that can't finds out on the pad."], "slug": "port-lisaur", "file": "LocalAdministration/metadata/administrations/treistun/port-lisaur.yaml"}, {"name": "Port Nacaubun", "kind": "settlement", "at": "Treistun e", "position": {"latitude": 23.813, "longitude": -79.362}, "about": "The port on Treistun e, the home world, at 24° north. Gravity 0.98 g, with air, and cold.", "story": ["The first port in the system. It was built where the first ship came down, and nobody saw a reason to move it. The station overhead took most of its trade; Nacaubun keeps the ground traffic."], "slug": "port-nacaubun", "file": "LocalAdministration/metadata/administrations/treistun/port-nacaubun.yaml"}, {"name": "Port Seiwiti", "kind": "settlement", "at": "Treistun b I", "position": {"latitude": -27.005, "longitude": -104.409}, "about": "The port on Treistun b I, the moon of the innermost planet, at 27° south. Gravity 0.14 g, no air.", "story": ["Built so that most ships never have to land on b. Loads come up from Zaudalein and change hands here, where lifting off costs almost nothing."], "slug": "port-seiwiti", "file": "LocalAdministration/metadata/administrations/treistun/port-seiwiti.yaml"}, {"name": "Port Sirnendis", "kind": "settlement", "at": "Treistun d I", "position": {"latitude": -32.137, "longitude": -88.842}, "about": "The port on Treistun d I, the moon of d, at 32° south. Gravity 0.13 g, no air.", "story": ["Eikir's yard. Ships that have no business in d's air wait here, and those that do make the short drop from it."], "slug": "port-sirnendis", "file": "LocalAdministration/metadata/administrations/treistun/port-sirnendis.yaml"}, {"name": "Port Trethi", "kind": "settlement", "at": "Treistun f", "position": {"latitude": 6.331, "longitude": 52.014}, "about": "The port on Treistun f, near the equator at 6° north. Gravity 0.41 g, no air, and about 190 K.", "story": ["The last port on solid ground before the giants. Outbound ships top up here because it is the cheapest lift-off of any planet in the system."], "slug": "port-trethi", "file": "LocalAdministration/metadata/administrations/treistun/port-trethi.yaml", "parcels": [{"number": 1, "owner": "brand.hadley", "outline": [[600, -250], [1100, -250], [1100, 250], [600, 250]], "area": 250000.0, "slug": "parcel-1", "file": "LocalAdministration/metadata/administrations/treistun/port-trethi/parcels/parcel-1.yaml", "zone": "industrial"}], "zones": [{"name": "Industrial", "use": "industrial", "outline": [[500, -1000], [2500, -1000], [2500, 1000], [500, 1000]], "area": 4000000.0, "slug": "industrial", "file": "LocalAdministration/metadata/administrations/treistun/port-trethi/zones/industrial.yaml"}, {"name": "Port", "use": "port", "outline": [[-400, -600], [400, -600], [400, 400], [-400, 400]], "area": 800000.0, "slug": "port", "file": "LocalAdministration/metadata/administrations/treistun/port-trethi/zones/port.yaml"}]}, {"name": "Port Weisonum", "kind": "settlement", "at": "Treistun h II", "position": {"latitude": 34.206, "longitude": 125.66}, "about": "The port on Treistun h II, a moon of the ice giant h, at 34° north. Gravity 0.22 g, no air, and about 106 K. It is 3.4 AU from the star.", "story": ["The first port of the outer system. It began as a single pad and a shelter, and grew because every ship going further out passes it."], "slug": "port-weisonum", "file": "LocalAdministration/metadata/administrations/treistun/port-weisonum.yaml"}, {"name": "Port Zaudalein", "kind": "settlement", "at": "Treistun b", "position": {"latitude": -8.849, "longitude": 58.156}, "about": "The port on Treistun b, the innermost planet, at 9° south. Gravity 0.96 g, no air, and about 560 K.", "story": ["The hottest port in the system. Its crews keep to b's long night and go under cover for the day. Few stay longer than a contract."], "slug": "port-zaudalein", "file": "LocalAdministration/metadata/administrations/treistun/port-zaudalein.yaml"}, {"name": "Treistun b I", "kind": "moon", "at": "Treistun b", "about": "A moon of Treistun b. 1,687 km in radius, 0.14 g at the surface, no air, about 567 K on average. Its day lasts 12 hours.", "story": ["A moon as hot as its planet, but with a seventh of the gravity. That difference is the whole reason Port Seiwiti exists."], "slug": "treistun-b-i", "file": "LocalAdministration/metadata/administrations/treistun/treistun-b-i.yaml"}, {"name": "Treistun b", "kind": "planet", "about": "The innermost planet, 0.13 AU from the star. Rocky, 6,194 km in radius, with a surface gravity of 0.96 g and no air. It is hot: about 560 K on average. Its day lasts 32 hours. One moon.", "story": ["Nobody settled b for comfort. Port Zaudalein is there because someone decided the ground was worth the heat, and it has stayed a place people work at rather than live in."], "slug": "treistun-b", "file": "LocalAdministration/metadata/administrations/treistun/treistun-b.yaml"}, {"name": "Treistun c I", "kind": "moon", "at": "Treistun c", "about": "A moon of Treistun c. 1,328 km in radius, 0.11 g at the surface, no air, about 425 K on average. Its day lasts 15 hours.", "story": ["Small, hot and light. It matters because of what it orbits: it is the nearest place to c where a ship can land and lift cheaply."], "slug": "treistun-c-i", "file": "LocalAdministration/metadata/administrations/treistun/treistun-c-i.yaml"}, {"name": "Treistun c", "kind": "planet", "about": "The second planet, 0.22 AU out, and the largest rocky world in the system: 8,815 km in radius, 1.67 g at the surface, no air, about 420 K on average. One moon.", "story": ["The heavy world. Setting down on c is easy and leaving it is expensive, and everything about its one port follows from that."], "slug": "treistun-c", "file": "LocalAdministration/metadata/administrations/treistun/treistun-c.yaml"}, {"name": "Treistun d I", "kind": "moon", "at": "Treistun d", "about": "A moon of Treistun d. 1,527 km in radius, 0.13 g at the surface, no air, about 306 K on average. Its day lasts 12 hours.", "story": ["Airless and a little cooler than d below it. It was settled as d's yard: a place to keep ships without bringing them down through the air."], "slug": "treistun-d-i", "file": "LocalAdministration/metadata/administrations/treistun/treistun-d-i.yaml"}, {"name": "Treistun d", "kind": "planet", "about": "The third planet, 0.41 AU out. 6,654 km in radius, 1.07 g, with air as dense as e's. It is warm: about 320 K on average. Its day lasts 20 hours. One moon.", "story": ["The warm world, and the second with air. It was settled after e, by people who wanted open sky and were willing to take the heat that came with it."], "slug": "treistun-d", "file": "LocalAdministration/metadata/administrations/treistun/treistun-d.yaml"}, {"name": "Treistun e Station", "kind": "settlement", "at": "Treistun e", "about": "The system's station, in orbit round Treistun e. It is a landing deck of 16 pads with the main structure standing along one edge and a hangar inside. It turns once an orbit, keeping the same side to the planet.", "story": ["Raised above Nacaubun when the port ran out of room. The yards, the makers' offices, the Standards Foundry Office and the administration all followed the ships up, and it has been the centre of the system since."], "slug": "treistun-e-station", "file": "LocalAdministration/metadata/administrations/treistun/treistun-e-station.yaml"}, {"name": "Treistun e", "kind": "planet", "about": "The fourth planet, 0.66 AU out, and the home world. 6,281 km in radius, 0.98 g, with air. It is cold: about 264 K on average. Its day lasts under 19 hours. It has no moon; the station orbits it.", "story": ["Where Treistun began. The first landing, the first port and the first station were all here, and the system's administration still sits in orbit above it."], "slug": "treistun-e", "file": "LocalAdministration/metadata/administrations/treistun/treistun-e.yaml"}, {"name": "Treistun f", "kind": "planet", "about": "The fifth planet, 1.13 AU out, and the last rocky one. Small: 3,634 km in radius, 0.41 g, no air, about 190 K on average. Its day lasts under 11 hours. No moon.", "story": ["The easy one to leave. With less than half the gravity of the inner worlds, f became the place to stop on the way to the giants."], "slug": "treistun-f", "file": "LocalAdministration/metadata/administrations/treistun/treistun-f.yaml"}, {"name": "Treistun g I", "kind": "moon", "at": "Treistun g", "about": "A moon of the gas giant Treistun g, 1.78 AU from the star. 2,232 km in radius, 0.19 g at the surface, no air, about 150 K on average. Its day lasts 68 hours.", "slug": "treistun-g-i", "file": "LocalAdministration/metadata/administrations/treistun/treistun-g-i.yaml"}, {"name": "Treistun g II", "kind": "moon", "at": "Treistun g", "about": "A moon of the gas giant Treistun g, 1.78 AU from the star. 1,199 km in radius, 0.10 g at the surface, no air, about 150 K on average. Its day lasts 183 hours.", "slug": "treistun-g-ii", "file": "LocalAdministration/metadata/administrations/treistun/treistun-g-ii.yaml"}, {"name": "Treistun g III", "kind": "moon", "at": "Treistun g", "about": "A moon of the gas giant Treistun g, 1.78 AU from the star. 836 km in radius, 0.07 g at the surface, no air, about 150 K on average. Its day lasts 374 hours.", "slug": "treistun-g-iii", "file": "LocalAdministration/metadata/administrations/treistun/treistun-g-iii.yaml"}, {"name": "Treistun h I", "kind": "moon", "at": "Treistun h", "about": "A moon of the ice giant Treistun h, 3.4 AU from the star. 837 km in radius, 0.07 g at the surface, no air, about 106 K on average. Its day lasts 23 hours.", "slug": "treistun-h-i", "file": "LocalAdministration/metadata/administrations/treistun/treistun-h-i.yaml"}, {"name": "Treistun h II", "kind": "moon", "at": "Treistun h", "about": "A moon of the ice giant Treistun h, 3.4 AU from the star. 2,597 km in radius, 0.22 g at the surface, no air, about 106 K on average. Its day lasts 45 hours.", "story": ["The largest moon of the ice giants, and the first port anyone built beyond the gas giant g."], "slug": "treistun-h-ii", "file": "LocalAdministration/metadata/administrations/treistun/treistun-h-ii.yaml"}, {"name": "Treistun i I", "kind": "moon", "at": "Treistun i", "about": "A moon of the ice giant Treistun i, 6.2 AU from the star. 1,157 km in radius, 0.10 g at the surface, no air, about 80 K on average. Its day lasts 14 hours.", "slug": "treistun-i-i", "file": "LocalAdministration/metadata/administrations/treistun/treistun-i-i.yaml"}, {"name": "Treistun i II", "kind": "moon", "at": "Treistun i", "about": "A moon of the ice giant Treistun i, 6.2 AU from the star. 1,307 km in radius, 0.11 g at the surface, no air, about 80 K on average. Its day lasts 32 hours.", "story": ["Far out and very cold. For a long time it was only a name on a chart, until someone needed a port that far from the star."], "slug": "treistun-i-ii", "file": "LocalAdministration/metadata/administrations/treistun/treistun-i-ii.yaml"}, {"name": "Treistun i III", "kind": "moon", "at": "Treistun i", "about": "A moon of the ice giant Treistun i, 6.2 AU from the star. 561 km in radius, 0.05 g at the surface, no air, about 80 K on average. Its day lasts 76 hours.", "slug": "treistun-i-iii", "file": "LocalAdministration/metadata/administrations/treistun/treistun-i-iii.yaml"}, {"name": "Treistun j I", "kind": "moon", "at": "Treistun j", "about": "A moon of the gas giant Treistun j, 10.5 AU from the star, the outermost planet. 1,496 km in radius, 0.13 g at the surface, no air, about 60 K on average. Its day lasts 23 hours.", "slug": "treistun-j-i", "file": "LocalAdministration/metadata/administrations/treistun/treistun-j-i.yaml"}, {"name": "Treistun j II", "kind": "moon", "at": "Treistun j", "about": "A moon of the gas giant Treistun j, 10.5 AU from the star, the outermost planet. 720 km in radius, 0.06 g at the surface, no air, about 60 K on average. Its day lasts 38 hours.", "slug": "treistun-j-ii", "file": "LocalAdministration/metadata/administrations/treistun/treistun-j-ii.yaml"}, {"name": "Treistun j III", "kind": "moon", "at": "Treistun j", "abou h=\"1\"/>\n<circle cx=\"20\" cy=\"26\" r=\"2.5\" fill=\"#c29c54\"/><path d=\"M70 78l1.500 3.500L75 83l-3.500 1.500L70 88l-1.500-3.500L65 83l3.500-1.500z\" fill=\"#6ebdcc\"/><\/svg>", "tallis-signal-works": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 96 96\"><defs><linearGradient id=\"ta-a\" x1=\"0\" y1=\"1\" x2=\"0\" y2=\"0\"><stop offset=\"0\" stop-color=\"#486092\"/><stop offset=\"1\" stop-color=\"#78b8d8\"/><\/linearGradient><\/defs>\n<g fill=\"none\" stroke=\"url(#ta-a)\" stroke-linecap=\"round\"><path d=\"M62 10a20 20 0 0 1 0 28\" stroke-width=\"4\"/><path d=\"M72 2a34 34 0 0 1 0 44\" stroke-width=\"3\"/>\n<path d=\"M34 10a20 20 0 0 0 0 28\" stroke-width=\"4\"/><path d=\"M24 2a34 34 0 0 0 0 44\" stroke-width=\"3\"/><\/g>\n<path d=\"M48 24 L66 88 H30 Z\" fill=\"none\" stroke=\"#778ba5\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M43.500 40h9M39 56h18M34.500 72h27M43.500 40l13.500 16M52.500 40L39 56M39 56l22.500 16M57 56L34.500 72\" stroke=\"#617082\" stroke-width=\"1.600\" fill=\"none\"/>\n<path d=\"M20 88h56\" stroke=\"#778ba5\" stroke-width=\"3\" stroke-linecap=\"round\"/><circle cx=\"48\" cy=\"24\" r=\"6\" fill=\"#cd5f54\"/><circle cx=\"48\" cy=\"24\" r=\"2.500\" fill=\"#eac0b5\"/><\/svg>", "tolland-yards": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 96 96\"><defs><linearGradient id=\"to-a\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\"><stop offset=\"0\" stop-color=\"#c5935f\"/><stop offset=\"1\" stop-color=\"#835838\"/><\/linearGradient><\/defs>\n<path d=\"M48 3 L87 25.500 V70.500 L48 93 L9 70.500 V25.500 Z\" fill=\"url(#to-a)\"/><path d=\"M48 11 L80 29.500 V66.500 L48 85 L16 66.500 V29.500 Z\" fill=\"#1f1914\"/>\n<g fill=\"#c5935f\"><circle cx=\"48\" cy=\"7\" r=\"1.800\"/><circle cx=\"83.500\" cy=\"27.500\" r=\"1.800\"/><circle cx=\"83.500\" cy=\"68.500\" r=\"1.800\"/><circle cx=\"48\" cy=\"89\" r=\"1.800\"/><circle cx=\"12.500\" cy=\"68.500\" r=\"1.800\"/><circle cx=\"12.500\" cy=\"27.500\" r=\"1.800\"/><\/g>\n<path d=\"M24 28h48v11H54.500v22h-13V39H24z\" fill=\"#ddd1c2\"/><path d=\"M48 28h24v11H54.500v22H48z\" fill=\"#bdae9c\"/>\n<path d=\"M24 33.500h48M48 39v22\" stroke=\"#1f1914\" stroke-width=\"1\" opacity=\".6\"/>\n<path d=\"M26 66h44l-7 9H33z\" fill=\"url(#to-a)\"/><path d=\"M36 69.500h24\" stroke=\"#1f1914\" stroke-width=\"2\" stroke-dasharray=\"4 3\"/><\/svg>", "vireo-spaceworks": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 96 96\"><defs><linearGradient id=\"vi-a\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#adcb75\"/><stop offset=\"1\" stop-color=\"#54824a\"/><\/linearGradient><\/defs>\n<g stroke=\"#b8af53\" stroke-linecap=\"round\" stroke-width=\"2.500\"><path d=\"M4 30h12M8 40h13M13 50h13\"/><\/g>\n<path d=\"M18 12 L48 88 L58 62 L38 12 Z\" fill=\"url(#vi-a)\"/><path d=\"M90 12 L48 88 L58 62 L72 12 Z\" fill=\"#385f36\"/>\n<path d=\"M72 12 L58 62 L52 47 L64 12 Z\" fill=\"#b8af53\"/><path d=\"M44 12 L52 30 L58 12 Z\" fill=\"url(#vi-a)\"/>\n<circle cx=\"80\" cy=\"72\" r=\"3\" fill=\"#b8af53\"/><circle cx=\"80\" cy=\"72\" r=\"6.500\" fill=\"none\" stroke=\"#54824a\" stroke-width=\"1.200\"/><\/svg>"}, "makers": [{"key": "brand.aurel", "name": "Aurel Fusion Works", "ticker": "AFW", "address": {"at": "treistun/treistun-e-station", "tower": "Works Tower", "deck": 11, "section": "A", "unit": 6}, "note": "Fusion plants: light, efficient, dear", "who": "A small, exacting builder of reactors for buyers who count every kilogram.", "what": "Builds fusion plants: light, efficient and expensive.", "story": ["Aurel is named after its founder, a reactor designer who believed a fusion plant could weigh half what the big makers said it must. She spent years proving it on a single prototype before selling one.", "The company builds few plants and builds them slowly. Each is light, efficient and costs several times what a Hadley unit does. Racers, couriers and long-range explorers buy them; haulers mostly don't.", "Aurel has refused more than one offer to be bought, and keeps its design office and its workshop under one roof so the people who draw a plant also have to build it."], "file": "MakerHouse/metadata/makers/aurel-fusion-works.yaml", "slug": "aurel-fusion-works"}, {"key": "brand.cormorant", "name": "Cormorant Mining", "ticker": "CMN", "address": {"at": "treistun/treistun-e-station", "tower": "Works Tower", "deck": 2, "section": "D", "unit": 8}, "note": "Mining gear", "who": "A company of miners that started building its own tools and now sells them.", "what": "Makes mining gear for ships.", "story": ["Cormorant was a mining crew before it was a company. Working the belts with gear built for other jobs, they cut, welded and rebuilt it until it suited the rock, and other crews started asking to buy what they had made.", "It still runs its own mining ships, and every new tool goes out on them for a season before it is sold. The gear looks rough, and the manuals read like they were written by people with gloves on.", "Miners trust Cormorant because it is one of them, and because it will tell a buyer when a cheaper tool would do."], "file": "MakerHouse/metadata/makers/cormorant-mining.yaml", "slug": "cormorant-mining"}, {"key": "brand.garrick", "name": "Garrick Arms", "ticker": "GAR", "address": {"at": "treistun/treistun-e-station", "tower": "Works Tower", "deck": 7, "section": "C", "unit": 10}, "note": "Weapons: mass drivers and lasers", "who": "An arms maker that sells to anyone allowed to buy.", "what": "Makes ship weapons: mass drivers and lasers.", "story": ["Garrick started as a maker of mass drivers for moving ore, launching loads from surface mines to orbit. It did not take long for someone to point one at a ship, and the company followed its customers.", "Today it makes ship weapons, mass drivers and lasers, and little else. It sells to anyone the law allows and keeps a careful record of who that is. It does not pretend its trade is anything other than what it is.", "The family still owns it. It keeps out of politics and out of the SFO's founding, though it builds to the standards like everyone else."], "file": "MakerHouse/metadata/makers/garrick-arms.yaml", "slug": "garrick-arms"}, {"key": "brand.hadley", "name": "Hadley Heavy Industries", "ticker": "HHI", "address": {"at": "treistun/treistun-e-station", "tower": "Works Tower", "deck": 1, "section": "A", "unit": 1}, "note": "Plants, tanks and racks: rugged and cheap", "who": "A big, plain industrial company that sells on price and on things not breaking. One of the founders of the SFO.", "what": "Builds power plants, tanks and cargo racks: heavy, rugged and cheap.", "story": ["Hadley is older than most of the stations it supplies. It started by casting pressure tanks for the first settlements, when a tank that leaked meant people died, and it built its name on tanks that didn't.", "It grew by buying foundries and mills wherever ore was close, and today it runs more heavy plant than any other maker. Nothing it sells is elegant. Its power plants are heavy, its racks are thick, and its catalogue has barely changed in a generation, which is exactly what its customers want.", "Hadley's founders are long gone; it is run by a board that distrusts anything new until somebody else has paid to prove it."], "file": "MakerHouse/metadata/makers/hadley-heavy-industries.yaml", "slug": "hadley-heavy-industries"}, {"key": "brand.halcyon", "name": "Halcyon Field Systems", "ticker": "HFS", "address": {"at": "treistun/treistun-e-station", "tower": "Trade Tower", "deck": 31, "section": "A", "unit": 1}, "note": "Hyperdrives and gate rings: clean fields, dear", "who": "A field-engineering company working on the hardest part of travel: the jump.", "what": "Builds hyperdrives and gate rings, known for clean fields and high prices.", "story": ["Halcyon grew out of a research group that studied jump fields long before anyone sold them. When the group's funding ended, its members formed a company rather than scatter, and took their measurements with them.", "It builds hyperdrives and the rings for gates. Its fields are known for being clean: ships arrive where they meant to, and their other systems are left undisturbed. That takes care in the making, and Halcyon charges for it.", "It is still run like a laboratory. It publishes more than its rivals think wise, on the view that nobody can copy the patience."], "file": "MakerHouse/metadata/makers/halcyon-field-systems.yaml", "slug": "halcyon-field-systems"}, {"key": "brand.halvard", "name": "Halvard Construction", "ticker": "HVC", "address": {"at": "treistun/treistun-e-station", "tower": "Trade Tower", "deck": 15, "section": "D", "unit": 7}, "note": "Stations, spaceports and outposts", "who": "A construction company that builds the places ships go to. One of the founders of the SFO.", "what": "Builds stations, spaceports and outposts.", "story": ["Halvard built its first outpost for a mining company that could find nobody else willing to work that far out. It finished late and over cost, and the outpost is still standing.", "Since then it has built stations, spaceports and outposts across the settled systems. It works slowly, with its own crews, and it stays on after the opening to see how the place holds up.", "Halvard joined the founding of the SFO because a port is only useful if every ship can land at it, and it was tired of being told a pad was the wrong size."], "file": "MakerHouse/metadata/makers/halvard-construction.yaml", "slug": "halvard-construction"}, {"key": "brand.kestrel", "name": "Kestrel Driveworks", "ticker": "KDW", "address": {"at": "treistun/treistun-e-station", "tower": "Works Tower", "deck": 4, "section": "B", "unit": 3}, "note": "Drives and thrusters: light, strong, dear", "who": "A propulsion house run by engineers, known for finish and for charging for it. One of the founders of the SFO.", "what": "Designs and builds main drives and manoeuvring thrusters. Its units are lighter and stronger than most, and priced to match.", "story": ["Kestrel began as a repair shop on the home station, three engineers rebuilding other makers' thrusters for pilots who couldn't wait for parts. They kept notes on every unit that came in broken, and after a few years they knew better than the makers themselves where drives failed. Their first own design was built from that notebook.", "The company has never been large and has never tried to be cheap. Every drive is test-fired before it ships and carries the name of the person who signed it off. Pilots complain about the price and then buy a second one.", "Kestrel pushed for the SFO early: a small maker lives or dies on whether its drive bolts onto somebody else's hull."], "file": "MakerHouse/metadata/makers/kestrel-driveworks.yaml", "slug": "kestrel-driveworks"}, {"key": "brand.meridian", "name": "Meridian Power", "ticker": "MPW", "address": {"at": "treistun/treistun-e-station", "tower": "Trade Tower", "deck": 9, "section": "B", "unit": 2}, "note": "Capacitor banks and power storage", "who": "A power-storage specialist that makes one kind of thing and little else.", "what": "Makes capacitor banks and power storage.", "story": ["Meridian was founded by two people who left a reactor maker over one argument: they held that most ships don't need a bigger plant, they need somewhere to keep the power they already make.", "It has built capacitor banks and power storage ever since and has turned down every chance to build anything else. That narrowness is its whole pitch. Its banks are sized to sit beside any maker's plant, and it publishes how they age.", "Meridian is small, steady and privately held, and seems content to stay that way."], "file": "MakerHouse/metadata/makers/meridian-power.yaml", "slug": "meridian-power"}, {"key": "brand.orbital", "name": "Orbital Systems", "ticker": "ORB", "address": {"at": "treistun/treistun-e-station", "tower": "Trade Tower", "deck": 22, "section": "C", "unit": 5}, "note": "Computers, sensors, navigation", "who": "An electronics company; most ships fly on something of theirs. One of the founders of the SFO.", "what": "Makes flight computers, sensors and navigation equipment.", "story": ["Orbital Systems was started by a group of navigators tired of flying with instruments that disagreed with each other. Their first product was a flight computer that showed one honest answer and said how sure it was.", "From there it spread into sensors and navigation aids, and then into nearly every cockpit. It is the quietest of the big makers: it advertises little, and its engineers are rarely seen at the yards.", "It argued hardest of all the founders for common signals and data formats in the SFO, and it has profited the most from them."], "file": "MakerHouse/metadata/makers/orbital-systems.yaml", "slug": "orbital-systems"}, {"key": "brand.tallis", "name": "Tallis Signal Works", "ticker": "TSW", "address": {"at": "treistun/treistun-e-station", "tower": "Trade Tower", "deck": 38, "section": "B", "unit": 3}, "note": "Comms and relays: far-reaching, power-hungry", "who": "A communications company whose equipment reaches further than anyone's and draws the power to do it.", "what": "Makes comms equipment and relays.", "story": ["Tallis began with one long-range relay, built by a station's communications officer who was tired of losing ships the moment they left the system. It reached further than anything on sale, and other stations asked for one.", "The company makes comms equipment and relays. Its gear is known for range and for the power it draws to get it; fitting a Tallis set often means fitting a bigger plant too.", "It remains close to the stations that were its first customers, and much of the traffic between settled systems passes through something it built."], "file": "MakerHouse/metadata/makers/tallis-signal-works.yaml", "slug": "tallis-signal-works"}, {"key": "brand.tolland", "name": "Tolland Yards", "ticker": "TOL", "address": {"at": "treistun/treistun-e-station", "tower": "Works Tower", "deck": 3, "section": "A", "unit": 2}, "note": "Hulls: workhorses and haulers", "who": "A shipyard for working ships, built for people who earn a living with them. One of the founders of the SFO.", "what": "Builds hulls: workhorses and haulers.", "story": ["Tolland Yards began by converting worn-out tugs into haulers for crews who couldn't afford a new ship. It learned what working pilots needed by listening to them complain in its own docks.", "Its hulls are plain, roomy and easy to repair with whatever is to hand. A Tolland is seldom anyone's dream ship, but it is very often their first, and many are still flying under their third or fourth owner.", "Tolland was a founder of the SFO for a simple reason: its customers fit their ships with whatever they can find, and it wanted all of it to fit."], "file": "MakerHouse/metadata/makers/tolland-yards.yaml", "slug": "tolland-yards"}, {"key": "brand.vireo", "name": "Vireo Spaceworks", "ticker": "VIR", "address": {"at": "treistun/treistun-e-station", "tower": "Works Tower", "deck": 5, "section": "D", "unit": 4}, "note": "Hulls: fast and light", "who": "A shipyard that builds for speed before capacity. One of the founders of the SFO.", "what": "Builds hulls: fast and light.", "story": ["Vireo was started by pilots who raced, and who thought the yards built ships like warehouses. Their first hull carried almost nothing and outran everything, and they sold it on that.", "The company builds fast, light hulls and gives up cargo space to do it. Couriers, scouts and people in a hurry buy them. Its yard is small and its waiting list is long.", "Vireo and Tolland agree on very little, but they stood together as founders of the SFO: a light hull is worth nothing if the drives and modules made for it don't fit."], "file": "MakerHouse/metadata/makers/vireo-spaceworks.yaml", "slug": "vireo-spaceworks"}], "elements": [{"identity": {"name": "Hydrogen", "symbol": "H", "atomic_number": 1, "atomic_mass": 1.008, "group": 1, "period": 1, "block": "s", "cat nlight it soaks up"}, "electrical_magnetic": {"electrical_conductivity": "S/m", "dielectric_strength": "MV/m; the field an insulator withstands", "magnetic": "", "superconducting_temperature": "K; null if none"}, "optical": {"transparency": "0 to 1; the share of visible light passed", "refractive_index": "", "reflectivity": "0 to 1, of visible light", "colour": ""}, "environment": {"corrosion_resistance": "", "oxidation_resistance": "Hot, in air.", "chemical_resistance": "To fuels and acids.", "outgassing": "share of its mass lost in vacuum (total mass loss, 0 to 1)", "radiation_resistance": "Against damage from radiation over time.", "radiation_shielding": "How well it stops radiation.", "uv_resistance": "", "flammability": "", "permeability": "How well it holds gas in (excellent: nothing leaks through).", "toxicity": ""}, "making": {"formability": "Rolled, bent, forged.", "machinability": "", "weldability": "", "joining": "How it's joined.", "castability": "Cast or printed.", "repairability": "", "recyclability": ""}}, "standards": [{"title": "Mining ship", "parent": "SFO 2", "purpose": "To turn rock somewhere far away into value at a market, and bring its crew home.", "sections": [{"text": "a mining ship exists to turn rock somewhere far away into value at a market, and bring its crew home. Every system on that list answers one of a few forces that stand in the way:", "table": {"columns": ["Force (what the world imposes)", "What it demands", "Systems that answer it"], "rows": [["Distance: the rock is far from the market", "get there and back", "drive, hyperdrive, propellant, navigation, flight computer"], ["Gravity and motion: rocks spin, worlds pull", "hold position, land, lift", "lift and manoeuvring thrusters, gear, anchor clamps"], ["Rock is hard and mixed", "break it, find the good part", "prospecting sensors, laser or drill, analyser"], ["Mass costs: every tonne hauled costs propellant", "carry only what pays", "collector, crusher, refinery, tailings ejector, holds"], ["Energy: cutting and moving takes power", "make and store it", "reactor, capacitors, power distribution"], ["Heat: every watt used becomes heat, and space barely takes it away", "get rid of it", "radiators, coolant loops"], ["Vacuum, time and danger: people die out there", "keep them alive, weeks at a time", "pressure hull, life support, water, medical, quarters, galley, escape pod, fire and damage control"], ["Isolation: help is far", "fix things, call out", "workshop, spares, comms"], ["Trade: value is only real where it's sold", "hand over cargo, prove what it is", "docking, cargo handling, containers, transponder"]]}, "title": ""}], "number": 1, "id": "SFO 1", "body": "body.sfo", "file": "SFO/metadata/0001-mining-ship.yaml"}, {"title": "Spaceships", "purpose": "Ships exist because what people need and where it is are in different places, and space is in between.", "details": {"text": ["From that come a few reasons to cross it:", "- To move things: goods, ore and fuel from where they are to where they're wanted.", "- To move people: to work, settle, trade or come home.", "- To reach what can't be had at home: resources, land, knowledge.", "- To do work out there: mining, building, repairing, rescuing.", "- To protect or take: defend what's yours, take what isn't.", "Everything a ship carries follows from crossing that space and surviving it: distance, gravity, energy, heat, vacuum, isolation. A specific ship (miner, hauler, transport) is just which reason it's built for, and which of those forces it fights hardest."], "title": ""}, "number": 2, "id": "SFO 2", "body": "body.sfo", "file": "SFO/metadata/0002-spaceships.yaml"}, {"title": "Spaceport", "purpose": "Ships exist because what people need is somewhere else, and a spaceport is where \"somewhere else\" meets the ground. A world's goods and people are on its surface, and the port is the door.", "details": {"text": ["The forces it answers:", "- Gravity: landing and lifting are the hardest, most dangerous moments. The port gives flat, prepared, known ground, and guidance down.", "- Traffic: many ships, one sky. Pads and clearance keep them apart.", "- Trade: cargo changes hands here, so goods leave and enter the world.", "- Distance: ships arrive low on fuel and leave needing a full tank.", "- People: crew and passengers step out into the world.", "- Law: the world's authority meets every ship that comes and goes.", "A station plays the same role in orbit. A spaceport does it on the surface, where the world's people and industry actually are."], "title": ""}, "number": 3, "id": "SFO 3", "body": "body.sfo", "file": "SFO/metadata/0003-spaceport.yaml"}, {"title": "Standing", "purpose": "Standing is a place's memory of how you've behaved there. Its purpose is to let strangers deal with each other safely in a big, open space where nobody can watch everyone.", "details": {"text": ["Why a civilisation needs it:", "- Trust between strangers: a port can't vet every arriving ship, but it can remember what that pilot did before. Good conduct earns access; harm closes doors.", "- Consequences without walls: nobody stops you from going anywhere or doing anything, but what you do follows you. Freedom stays, and so does accountability.", "- Law that scales: an authority can't police every corner of a system, but it can refuse service, refuse docking, and in the end defend itself. Standing tells it when to.", "- Protection for the innocent: it makes attacking peaceful ships costly, so honest traders and miners can work.", "- Room to redeem: standing is earned and lost through deeds, so people can change.", "It's local: each settled system's authority keeps its own record, from what it hears of. Information travels physically, so news of what you did reaches a place only as fast as it can. That leaves room for a fresh start far away, and for a bad name that hasn't caught up with you yet."], "title": ""}, "number": 4, "id": "SFO 4", "body": "body.sfo", "file": "SFO/metadata/0004-standing.yaml"}, {"title": "Materials", "records": "materials", "purpose": "Materials are what everything is made of (hulls, engines, stations, tools, fuel). Every made thing starts as matter taken from somewhere and changed into something useful.", "details": {"text": ["Why a civilisation needs them, and needs them named and graded:", "- Building: nothing gets made without them. Hulls need strong, light metals; reactors need fuel; radiators need conductive metals; windows need glass.", "- Fitness for purpose: different jobs need different properties: strength, weight, heat tolerance, conductivity, radiation shielding. The right material decides whether a thing works or fails.", "- Trade: materials are what miners sell and makers buy. A common name and grade means a buyer far away knows what they're getting.", "- Value from rock: raw ore is a mix. Refining turns it into materials, and the difference in value is what makes mining worth doing.", "- Scarcity and place: some materials are common everywhere, others only in certain rocks or worlds. That's what sends ships far away, and why trade routes exist.", "Materials are the link between the rock a mining ship cuts and everything else people build."], "title": ""}, "number": 5, "id": "SFO 5", "body": "body.sfo", "file": "SFO/metadata/0005-materials.yaml"}, {"title": "Chemical Elements", "records": "elements", "purpose": "A chemical element is one kind of atom, set by the number of protons in it. Elements are what all matter is made of; every material is one element or a combination of them.", "details": {"text": ["Why a civilisation needs them named and described:", "- A common language for matter: iron is iron everywhere. Anyone, anywhere, can say exactly what a thing is made of.", "- Knowing what a rock holds: prospecting and assaying report elements. That tells a miner what a rock is worth before cutting it.", "- Making materials: a material's properties come from its elements and how they're combined. To make steel, glass or fuel, you start from the right elements.", "- Predicting behaviour: an element's properties (melting point, density, reactivity, conductivity) say what it can and can't do, before anything is built.", "- Honest trade: purity and composition can be stated and checked, so a buyer knows what they're getting.", "Elements sit one level below materials: an element is a kind of atom; a material is stuff you build with, made of elements."], "title": ""}, "number": 6, "id": "SFO 6", "body": "body.sfo", "file": "SFO/metadata/0006-chemical-elements.yaml"}, {"title": "Material Processing", "records": "processes", "purpose": "Material Processing is the first stage of making materials (turning raw matter into materials and stock that things can be built from). It takes elements in and gives out named, graded materials in usable forms like sheet, bar and wire.", "details": {"text": ["Why a civilisation needs it:", "- Elements aren't buildable: almost nothing is made from a raw element. Iron becomes useful as steel, and silicon and oxygen as glass. Processing is where matter gets the properties a builder needs.", "- Properties are made, not found: the same composition can be weak or strong depending on how it was treated. Heat treatment and forming set a material's strength, hardness and toughness.", "- Form matters: a builder needs sheet, bar, tube or wire, not a lump. Processing delivers material in shapes the next stage can work with.", "- Consistency: a grade made to a standard is the same from every producer, so a part designed on one world can be built from stock made on another.", "- Value: each step adds worth. Stock sells for more than ingot, and ingot for more than elements. That margin is what pays for the industry, and gives miners a market.", "It sits between mining and refining below it, and fabrication of parts above it."], "title": ""}, "number": 7, "id": "SFO 7", "body": "body.sfo", "file": "SFO/metadata/0007-material-processing.yaml"}, {"title": "Stock", "purpose": "Stock is a material in a standard, usable form (sheet, plate, bar, tube, wire, fibre or film, in set sizes). It's what material processing delivers and what part-making starts from, the form a material is stored, traded and shipped in.", "details": {"text": ["Why a civilisation needs it:", "- A starting point for parts: nobody machines a hinge pin from an ingot. A maker picks the stock closest to the part's shape (bar for a pin, sheet for a skin panel, tube for a duct) and removes or bends the least.", "- Standard sizes: when sheet comes in set thicknesses and bar in set diameters, a part designed on one world can be cut from stock made on another, and tools, racks and machines fit everywhere.", "- Trade and transport: stock is what crosses space. It's dense, stackable, countable and gradable (so many tonnes of 6061 sheet at 3 mm). It's the unit that markets price and haulers carry.", "- A buffer: stock keeps. A yard holding sheet and bar can build without waiting for a foundry, and a foundry can run steadily without knowing what will be built. It decouples making materials from making things.", "- Known properties: stock carries its grade with it. A bar of 4340, quenched and tempered, has a certified strength, so a designer can trust the part before it's made.", "How it's counted: a stock item is a material in a form (6061 sheet, 4340 bar, copper wire), traded in tonnes. Sizes aren't standardised for now: nothing yet cuts a part to a dimension, and the material's grade already carries its properties.", "It sits between material processing below it, and the fabrication of parts above it."], "title": ""}, "number": 8, "id": "SFO 8", "body": "body.sfo", "file": "SFO/metadata/0008-stock.yaml"}, {"title": "Address", "purpose": "An address says where a place is, so that anyone can find it, deliver to it and record who is there. It follows how the place is physically built, from the largest part down to the single unit.", "details": {"text": ["An address reads from the smallest part to the largest, and uses only the levels the place has."], "table": {"columns": ["Level", "What it is", "Example"], "rows": [["Unit", "The single space someone occupies.", "Unit 14"], ["Section", "A named or lettered area of a deck.", "Section C"], ["Deck", "A numbered level.", "Deck 7"], ["Tower", "A major part of the structure (a tower, a ring, an arm), usually with one main purpose.", "Habitation Tower"], ["Parcel", "A numbered lot of a settlement's land.", "Parcel 1"], ["Settlement", "The station, port or outpost.", "Treistun e Station"], ["Body", "The planet or moon the settlement is at. On a surface, with latitude and longitude.", "Treistun e"], ["System", "The star system.", "Treistun"]]}, "title": ""}, "sections": [{"title": "Rules", "text": ["A small outpost uses fewer levels: a few modules with units in them have no towers or decks.", "An address never changes: when a structure grows, the new part gets new addresses and nothing is renumbered.", "The settlement is the unit of administration. Inside it, tower, deck, section and unit are the settlement's own business."]}], "number": 9, "id": "SFO 9", "body": "body.sfo", "file": "SFO/metadata/0009-address.yaml"}], "cited": {}, "problems": []};

// The elements under a record (its `records`), those matching `q`.

const processesUnder = (id, q) => DATA.processes.filter(p => p.under === id && procMatches(p, q));
const procBySlug = Object.fromEntries(DATA.processes.map(p => [p.slug, p]));
const recordsUnder = id => elementsUnder(id, "").length + materialsUnder(id, "").length + processesUnder(id, "").length;
// An element or material named in a process: a link to it.
const elTile = (e, small) => { const i = e.identity; const c = "c-" + (i.category || "unknown").replace(/[^a-z]+/g, "-"); return small ? `<span class="tile small ${c}"><span class="sy">${esc(i.symbol)}</span></span>` : `<span class="tile ${c}"><span class="z">${i.atomic_number}</span><span class="sy">${esc(i.symbol)}</span></span>`; };
const logo = (slug, cls) => DATA.logos[slug] ? `<span class="logo ${cls || ""}">${DATA.logos[slug]}</span>` : "";
const icon = (slug, cls) => DATA.icons[slug] ? `<span class="ico ${cls || ""} ${procBySlug[slug] ? "k-" + procBySlug[slug].identity.kind : matBySlug[slug] ? "m-" + matBySlug[slug].identity.class : ""}">${DATA.icons[slug]}</span>` : "";

let kindShown = "all";
const itemLink = x => {

function matches(s, q) {

  return q.split(/\s+/).every(w => hay.includes(w));
}

// Everyone with an address (SFO 9): standards bodies and makers.

const ORGS = [...DATA.bodies.map(o => ({ key: o.key, name: o.name, tag: o.prefix, to: "b:" + o.key, address: o.address })), ...DATA.makers.map(m => ({ key: m.key, name: m.name, tag: m.ticker, to: "mk:" + m.key, address: m.address, slug: m.slug })), ...DATA.administrations.map(a => ({ key: "adm." + a.slug, name: `Administration of ${a.name}`, tag: "", to: "ad:" + a.slug, address: a.address }))].filter(o => o.address && o.address.at);
const placeOf = o => { const [sy, at] = o.address.at.split("/"); const a = DATA.administrations.find(x => x.slug === sy); const x = a && a.bodies.find(y => y.slug === at); return x ? { sy, at, a, x } : null; };
const inside = ad => [ad.unit && `Unit ${ad.unit}`, ad.section && `Section ${ad.section}`, ad.deck && `Deck ${ad.deck}`, ad.tower].filter(Boolean);

const orgsAt = (sy, at) => ORGS.filter(o => o.address.at === `${sy}/${at}`).sort((p, r) => String(p.address.tower || "").localeCompare(String(r.address.tower || "")) || (p.address.deck || 0) - (r.address.deck || 0) || String(p.address.section || "").localeCompare(String(r.address.section || "")) || (p.address.unit || 0) - (r.address.unit || 0));

// The tree as shown: each body, its standards under it.
function rows(q) {
  const out = [];
  for (const body of DATA.bodies) {
    const bk = "b:" + body.key;
    out.push({ k: bk, depth: 0, kind: "body", label: `${body.name} (${body.prefix})`, title: body.name });
    if (!open.has(bk) && !q) continue;
    // (Records under their parent: a record with none sits under the body.)
    const all = ofBody(body, "");

    const kids = id => all.filter(s => (s.parent || null) === id);
    const visible = s => shown.has(s.id) || kids(s.id).some(visible) || (q && (elementsUnder(s.id, q).length > 0 || materialsUnder(s.id, q).length > 0 || processesUnder(s.id, q).length > 0));
    const walk = (id, depth) => {

          for (const m of materialsUnder(s.id, q)) out.push({ k: "mat:" + m.slug, depth: depth + 1, kind: "mat", mat: m });

  // Maker House: the makers under it.

  out.push({ k: "mh", depth: 0, kind: "body", label: DATA.house.name, n: DATA.makers.length });
  if (open.has("mh") || q) for (const m of DATA.makers.filter(mq)) out.push({ k: "mk:" + m.key, depth: 1, kind: "maker", label: m.name, ticker: m.ticker, slug: m.slug });
  // Local Administration: the administrations under it.

function reveal(k) {

  }
  if (k.startsWith("mk:")) { open.add("mh"); keepOpen(); return; }
  if (k.startsWith("ra:") || k.startsWith("rp:")) { open.add("ar"); keepOpen(); return; }
  if (k.startsWith("ad:")) { open.add("la"); keepOpen(); return; }
  if (k.startsWith("bd:") || k.startsWith("at:") || k.startsWith("pc:")) {
    const org = k.startsWith("at:") ? ORGS.find(o => o.key === k.slice(3)) : null;
    const [sy, slug] = org ? org.address.at.split("/") : k.split(":").slice(1);
    const a = DATA.administrations.find(x => x.slug === sy); if (!a) return;
    open.add("la"); open.add("ad:" + sy);
    // (Open the bodies above it; and itself and its tower, for what has its address there.)
    let x = a.bodies.find(y => y.slug === slug);
    if (x && (org || k.startsWith("pc:"))) open.add(`bd:${sy}:${x.slug}`);
    for (x = x && a.bodies.find(y => y.name === x.at); x; x = a.bodies.find(y => y.name === x.at)) open.add(`bd:${sy}:${x.slug}`);
    keepOpen(); return;
  }
  const s = stdOf(k); if (!s) return;
  open.add("b:" + s.body);
  for (let u = s; u && u.parent; u = byId[u.parent]) open.add("x:" + u.parent);
  keepOpen();
}

// The periodic table: groups 1-18 across, periods 1-7 down; the lanthanides (57-71) and
// actinides (89-103) in two rows below, under where they belong (group 3).
function periodicTable(els) {
  const slug = c => "c-" + (c || "unknown").replace(/[^a-z]+/g, "-");
  let h = `<h3>The periodic table</h3><div class="ptable">`;
  h += `<div class="hd" style="grid-row:1;grid-column:1"></div>`;
  for (let g = 1; g <= 18; g++) h += `<div class="hd" style="grid-row:1;grid-column:${g + 1}">${g}</div>`;
  for (let p = 1; p <= 7; p++) h += `<div class="hd" style="grid-row:${p + 1};grid-column:1">${p}</div>`;
  h += `<div class="ph" style="grid-row:7;grid-column:4">57-71</div><div class="ph" style="grid-row:8;grid-column:4">89-103</div>`;
  h += `<div class="hd" style="grid-row:9;grid-column:1 / span 19;height:10px"></div>`;
  for (const e of els) {
    const i = e.identity, z = i.atomic_number;
    let row, col;
    if (z >= 57 && z <= 71) { row = 10; col = z - 57 + 4; }
    else if (z >= 89 && z <= 103) { row = 11; col = z - 89 + 4; }
    else { row = i.period + 1; col = i.group + 1; }
    h += `<div class="el ${slug(i.category)}" style="grid-row:${row};grid-column:${col}" data-k="${esc("el:" + i.symbol)}" title="${esc(`${i.name} (${i.category || ""})`)}"><span class="z">${z}</span><span class="sy">${esc(i.symbol)}</span></div>`;
  }
  h += `</div><div class="legend">`;
  for (const c of [...new Set(els.map(e => e.identity.category).filter(Boolean))]) h += `<span><i class="${slug(c)}"></i>${esc(c)}</span>`;
  return h + `</div>`;
}

    // (A line starting "- " is a list item.)
    h += paras.map(p => p.startsWith("- ") ? `<li>${esc(p.slice(2))}</li>` : `<p>${esc(p)}</p>`).join("").replace(/((?:<li>.*?<\/li>)+)/g, "<ul>$1</ul>");
    if (s.details.table) h += `<table><tr>${s.details.table.columns.map(c => `<th>${esc(c)}</th>`).join("")}</tr>${s.details.table.rows.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</table>`;
  }
  const els = elementsUnder(s.id, "");
  if (els.length) h += periodicTable(els);
  const mats = materialsUnder(s.id, "");
  if (mats.length) h += `<h3>Materials</h3><table><tr><th>Material</th><th>Class</th><th>Density (kg/m3)</th><th>Made of</th></tr>${mats.map(m => `<tr><td>${icon(m.slug)} <a data-k="${esc("mat:" + m.slug)}">${esc(m.identity.name)}</a></td><td>${esc(m.identity.class)}</td><td class="num">${(m.mass || {}).density ?? ""}</td><td>${esc((m.identity.composition || []).slice(0, 3).map(x => x.part).join(", "))}</td></tr>`).join("")}</table>`;
  const allProcs = processesUnder(s.id, "");
  const procs = allProcs.filter(p => kindShown === "all" || p.identity.kind === kindShown);
  if (allProcs.length) {
    const kinds = [...new Set(allProcs.map(p => p.identity.kind))];
    h += `<h3>Processes</h3><div class="badges"><span class="badge${kindShown === "all" ? " on" : ""}" data-kind="all">all (${allProcs.length})</span>${kinds.map(k => `<span class="badge k-${esc(k)}${kindShown === k ? " on" : ""}" data-kind="${esc(k)}">${esc(k)} (${allProcs.filter(p => p.identity.kind === k).length})</span>`).join("")}</div>`;
  }
  if (allProcs.length) h += `<div class="gallery">${procs.map(p => `<a data-k="${esc("proc:" + p.slug)}">${icon(p.slug, "big")}<span>${esc(p.identity.name)}</span></a>`).join("")}</div><table><tr><th>Process</th><th>Kind</th><th>Goes in</th><th>Comes out</th></tr>${procs.map(p => `<tr><td>${icon(p.slug)} <a data-k="${esc("proc:" + p.slug)}">${esc(p.identity.name)}</a></td><td>${esc(p.identity.kind)}</td><td>${(((p.inputs || {}).materials) || []).map(x => esc((elBySymbol[x.item] || matBySlug[x.item] || {identity: {name: x.name || x.item}}).identity.name)).join(", ")}</td><td>${(((p.outputs || {}).products) || []).map(x => esc((matBySlug[x.item] || {identity: {name: x.name || x.item}}).identity.name) + (x.form ? ` (${esc(x.form)})` : x.grade ? ` (${esc(x.grade)})` : "")).join(", ")}</td></tr>`).join("")}</table>`;
  if (s.scope) h += `<h3>Scope</h3><p>${esc(s.scope)}</p>`;
  for (const sec of s.sections || []) {
    if (sec.title) h += `<h3>${esc(sec.title)}</h3>`;
    const paras = Array.isArray(sec.text) ? sec.text : (sec.text ? [sec.text] : []);
    h += paras.map(p => `<p>${esc(p)}</p>`).join("");
    if (sec.table) h += `<table><tr>${sec.table.columns.map(c => `<th>${esc(c)}</th>`).join("")}</tr>${sec.table.rows.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</table>`;
  }
  if ((s.refs || []).length) h += `<h3>Builds on</h3>` + s.refs.map(r => `<div><a data-k="s:${r}">${esc(r)}</a> ${esc(byId[r] ? byId[r].title : "?")}</div>`).join("");
  const cited = DATA.cited[s.id] || [];
  if (cited.length) h += `<h3>Built on by</h3>` + cited.map(r => `<div><a data-k="s:${r}">${esc(r)}</a> ${esc(byId[r] ? byId[r].title : "?")}</div>`).join("");
  const params = s.params || [];
  const table = params.filter(p => String(p.key).includes("."));
  const plain = params.filter(p => !String(p.key).includes("."));
  if (table.length) {
    const rowsK = [...new Set(table.map(p => String(p.key).split(".")[0]))];
    const cols = [...new Set(table.map(p => String(p.key).split(".")[1]))];
    const unit = c => (table.find(p => String(p.key).endsWith("." + c)) || {}).unit;
    h += `<h3>Parameters by class or size</h3><table><tr><th></th>${cols.map(c => `<th>${esc(c)}${unit(c) ? ` (${esc(unit(c))})` : ""}</th>`).join("")}</tr>`;
    for (const r of rowsK) h += `<tr><td><b>${esc(r)}</b></td>${cols.map(c => { const p = table.find(x => x.key === `${r}.${c}`); return `<td class="${p && typeof p.value === "number" ? "num" : ""}">${p ? value(p.value) : "–"}</td>`; }).join("")}</tr>`;
    h += `</table>`;
  }
  if (plain.length) h += `<h3>Parameters</h3><table><tr><th>Parameter</th><th>Value</th><th>Unit</th></tr>${plain.map(p => `<tr><td>${esc(p.key)}</td><td>${value(p.value)}</td><td>${esc(p.unit || "")}</td></tr>`).join("")}</table>`;
  const notes = params.filter(p => p.note);
  if (notes.length) h += `<h3>Notes</h3><table><tr><th>Parameter</th><th>Note</th></tr>${notes.map(p => `<tr><td>${esc(p.key)}</td><td>${esc(p.note)}</td></tr>`).join("")}</table>`;
  if ((s.requires || []).length) h += `<h3>Requires</h3><table><tr><th>Subject</th><th>Check</th><th>Against</th><th>Per</th></tr>${s.requires.map(r => `<tr><td>${esc(r.subject)}</td><td>${esc(String(r.check).replace(/_/g, " "))}</td><td>${esc(r.param)}</td><td>${esc(r.per || "")}</td></tr>`).join("")}</table>`;
  if (s.text) h += `<h3>Why</h3><p>${esc(s.text)}</p>`;
  h += `<div class="file" style="margin-top:24px">standards/${esc(s.file)}</div>`;
  return h;
}

document.addEventListener("click", e => {
  const badge = e.target.closest("[data-kind]");
  if (badge) { kindShown = badge.dataset.kind; render(); return; }
  const el = e.target.closest("[data-k]"); if (!el) return;
  const k = el.dataset.k;
  if (el.classList.contains("row") && !k.startsWith("s:") && !k.startsWith("el:") && !k.startsWith("mat:") && !k.startsWith("proc:")) {
    if (open.has(k) && k === current) open.delete(k); else open.add(k);
    keepOpen();
  }
  // (A record with elements under it: its list opens, and closes on a second click.)
  if (el.classList.contains("row") && k.startsWith("s:") && (recordsUnder(k.slice(2)) || DATA.standards.some(x => x.parent === k.slice(2)))) {
    const x = "x:" + k.slice(2);
    if (open.has(x) && k === current) open.delete(x); else open.add(x);
    keepOpen();
  }
  reveal(k);
  select(k);
});
document.getElementById("q").addEventListener("input", render);
// The tree's width: dragged, and kept.
{
  const main = document.querySelector("main"), grip = document.getElementById("grip");
  const setW = w => main.style.setProperty("--nav-w", Math.max(180, Math.min(w, window.innerWidth - 300)) + "px");
  try { const w = +localStorage.getItem("standards-nav-w"); if (w) setW(w); } catch (e) {}
  grip.addEventListener("pointerdown", e => {
    grip.classList.add("drag"); grip.setPointerCapture(e.pointerId);
    const move = ev => setW(ev.clientX);
    const up = ev => {
      grip.classList.remove("drag"); grip.removeEventListener("pointermove", move); grip.removeEventListener("pointerup", up);
      try { localStorage.setItem("standards-nav-w", Math.round(ev.clientX)); } catch (e2) {}
    };
    grip.addEventListener("pointermove", move); grip.addEventListener("pointerup", up);
  });
}
window.addEventListener("hashchange", () => { current = decodeURIComponent(location.hash.slice(1)); reveal(current); render(); });
render();
</script>
</body>
</html>
