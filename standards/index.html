<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Freefall Facts</title>
<style>
:root {
  color-scheme: dark;
  /* The game's HUD: near-black panels on dark slate, pale text, amber, cyan, green. */
  --bg: #2b3138; --panel: #20262c; --line: #3a4652; --text: #dcebf2; --dim: #8fa3b0;
  --head: #60ffb0; --id: #ffb040; --link: #5cc8f0; --sel: #1f4a3d; --bad: #ff5a4a; --code: #2e363e;
  --th: #48505a; --tbl: #383e46; --tline: #535c67;
  --nav: #20262c;
  --k-chemical: #60ffb0; --k-thermal: #ffb040; --k-mechanical: #5cc8f0;
  --m-metal: #e6c15a; --m-alloy: #9cc4e6; --m-ceramic: #f09a6a; --m-glass: #9be3e8; --m-polymer: #cfa3f5; --m-composite: #7ed29a; --m-fluid: #6aa8ff;
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #ffffff; --panel: #ffffff; --line: #b9c4cd; --text: #0a1117; --dim: #3d4f5c;
  --head: #04683b; --id: #0a58b8; --link: #0a58b8; --sel: #cdeedd; --bad: #b0281a; --code: #e9eef2;
  --th: #dceaf3; --tbl: #f3f8fb; --tline: #b7cbd8;
  --nav: #f4f6f8;
  --k-chemical: #04683b; --k-thermal: #a85a00; --k-mechanical: #0a58b8;
  --m-metal: #8a6a00; --m-alloy: #2f5f8a; --m-ceramic: #a8481c; --m-glass: #1b7f86; --m-polymer: #7a3fb0; --m-composite: #1f7a3f; --m-fluid: #1f55b8;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; letter-spacing: .06em; }
header { display: flex; gap: 12px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 2; }
header { text-transform: none; }
header h1 { font-size: 15px; margin: 0; color: var(--head); letter-spacing: .05em; white-space: nowrap; }
header input { flex: 1; min-width: 0; max-width: 420px; padding: 6px 10px; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 4px; font: inherit; }
header .count { color: var(--dim); white-space: nowrap; }
header button { margin-left: auto; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 4px 10px; font: inherit; cursor: pointer; }
main { display: grid; grid-template-columns: var(--nav-w, 400px) 6px 1fr; height: calc(100vh - 49px); }
#grip { cursor: col-resize; background: var(--line); opacity: .5; }
#grip:hover, #grip.drag { opacity: 1; background: var(--head); }
nav { overflow: auto; padding: 8px 0; background: var(--nav); }
article { overflow: auto; padding: 16px 24px 48px; }
article > * { max-width: 110ch; }
.row { padding: 2px 12px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row:hover { background: var(--code); }
.row.sel { background: var(--sel); box-shadow: inset 3px 0 0 var(--head); font-weight: 600; }
.row .tw { display: inline-block; width: 1.2em; color: var(--dim); }
.row.body { color: var(--head); font-weight: bold; }
.row.empty { color: var(--dim); }
.row .n { color: var(--dim); }
.row .sid { color: var(--id); }
h2 { color: var(--head); font-size: 17px; margin: 0 0 4px; }
h3 { color: var(--dim); font-weight: 700 !important; font-size: 12px; letter-spacing: .08em; margin: 22px 0 6px; font-weight: normal; text-transform: uppercase; }
.meta { color: var(--dim); }
a { color: var(--link); text-decoration: none; cursor: pointer; }
a:hover { text-decoration: underline; }
table { border-collapse: collapse; margin: 4px 0; }
th, td { text-align: left; padding: 3px 14px 3px 0; vertical-align: top; }
th { color: var(--dim); font-weight: 700; border-bottom: 1px solid var(--line); text-transform: uppercase; font-size: 12px; background: var(--th); color: var(--text); border-bottom-color: var(--tline); }
tr + tr td { border-top: 1px solid var(--tline); }
table { background: var(--tbl); border: 1px solid var(--tline); }
th, td { padding: 4px 14px 4px 8px; }
th:first-child, td:first-child { padding-left: 4px; }
td.num { text-align: right; }
.problems { border: 1px solid var(--bad); color: var(--bad); padding: 8px 12px; margin: 8px 12px; border-radius: 4px; }
.problems li { margin: 2px 0; }
tr.gap td:last-child { color: var(--bad); font-weight: 600; } tr.gap td:first-child { box-shadow: inset 3px 0 0 var(--bad); }
tr.okr td:last-child { color: var(--head); }
.chain { display: flex; flex-direction: column; align-items: stretch; max-width: 760px; margin: 10px 0 18px; }
.chain .node { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 10px 14px; display: flex; gap: 14px; align-items: baseline; }
.chain .node b { color: var(--head); min-width: 150px; } .chain .node .num { font-size: 20px; font-weight: 700; min-width: 64px; text-align: right; } .chain .node .say { color: var(--dim); }
.chain .node.empty { border-style: dashed; border-color: var(--bad); } .chain .node.empty .num { color: var(--bad); }
.chain .link { display: flex; align-items: center; gap: 12px; padding: 2px 0 2px 60px; min-height: 44px; }
.chain .link .pipe { width: 6px; align-self: stretch; border-radius: 3px; background: var(--head); }
.chain .link.none .pipe { background: repeating-linear-gradient(var(--bad) 0 6px, transparent 6px 12px); } .chain .link.some .pipe { background: #e0a030; }
.chain .link .bar { width: 160px; height: 10px; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; background: var(--bg); } .chain .link .bar i { display: block; height: 100%; background: var(--head); }
.chain .link.none .bar i { background: var(--bad); } .chain .link.some .bar i { background: #e0a030; }
.chain .link .what { flex: 1; } .chain .link.none .what { color: var(--bad); font-weight: 600; }
.chain .side { color: var(--dim); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; padding: 8px 0 4px; }
.file { color: var(--dim); font-size: 12px; }
p { margin: 4px 0 8px; max-width: 80ch; }
.ico { display: inline-block; vertical-align: middle; line-height: 0; color: var(--head); }
.ico svg { width: 18px; height: 18px; }
.ico.big svg { width: 44px; height: 44px; }
.ico.mid svg { width: 26px; height: 26px; }
.row .ico { margin-right: 6px; }
.logo { --logo-cut: var(--bg); display: inline-block; vertical-align: middle; line-height: 0; }
.logo svg { width: 18px; height: 18px; }
.logo.big svg { width: 96px; height: 96px; }
.landmap { display: block; width: 100%; max-width: 760px; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; margin: 6px 0 12px; }
.landmap .zone { stroke-width: 6; fill-opacity: .22; }
.landmap .u-port { fill: #4c9bd9; stroke: #4c9bd9; } .landmap .u-industrial { fill: #d98a3d; stroke: #d98a3d; } .landmap .u-commercial { fill: #9b8cf0; stroke: #9b8cf0; }
.landmap .u-civic { fill: #5fbf8f; stroke: #5fbf8f; } .landmap .u-residential { fill: #d9c84a; stroke: #d9c84a; }
.landmap .reach { fill: none; stroke: var(--dim); stroke-width: 3; stroke-dasharray: 14 12; }
.landmap .padc { fill: none; stroke: var(--text); stroke-width: 5; }
.landmap .plot { fill: var(--bg); fill-opacity: .55; stroke: var(--text); stroke-width: 6; cursor: pointer; } .landmap .plot.lit { stroke: var(--head); fill: var(--head); fill-opacity: .25; }
.landmap .zl { fill: var(--dim); letter-spacing: .08em; } .landmap .pl { fill: var(--text); font-weight: 700; cursor: pointer; }
.landmap .street { fill: none; stroke: var(--text); stroke-opacity: .7; stroke-width: 22; stroke-linecap: round; cursor: pointer; }
.landmap .part { stroke: var(--text); stroke-width: 1.5; fill-opacity: .45; }
.landmap .k-module { fill: #d98a3d; } .landmap .k-workshop { fill: #9b8cf0; } .landmap .k-warehouse { fill: #5fbf8f; } .landmap .k-logistics { fill: #4c9bd9; } .landmap .k-parking { fill: #8fa3b0; }
.landmap .pipe { fill: none; stroke: #ff6a5a; stroke-width: 3; stroke-linejoin: round; }
.landmap .lot { fill: none; stroke: var(--head); stroke-width: 2.5; }
.landmap .tl { fill: var(--text); }
.swatch { display: inline-block; width: 10px; height: 10px; margin-right: 6px; border: 1px solid var(--text); opacity: .8; }
.swatch.k-module { background: #d98a3d; } .swatch.k-workshop { background: #9b8cf0; } .swatch.k-warehouse { background: #5fbf8f; } .swatch.k-logistics { background: #4c9bd9; } .swatch.k-parking { background: #8fa3b0; } .swatch.pipe { background: #ff6a5a; height: 3px; vertical-align: middle; border: 0; }
.landmap .wire { fill: none; stroke: #ffd24a; stroke-width: 6; stroke-linejoin: round; cursor: pointer; }
.landmap .scale { fill: none; stroke: var(--text); stroke-width: 6; }
.row .logo { --logo-cut: var(--nav); margin-right: 6px; }
.row.sel .logo { --logo-cut: var(--sel); }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; max-width: none; margin: 6px 0 12px; }
.gallery a { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 6px; background: var(--tbl); border: 1px solid var(--tline); border-radius: 4px; text-align: center; color: var(--text); font-size: 12px; letter-spacing: 0; }
.gallery a:hover { border-color: var(--head); text-decoration: none; }
.ico.k-chemical { color: var(--k-chemical); } .ico.k-thermal { color: var(--k-thermal); } .ico.k-mechanical { color: var(--k-mechanical); }
.ico.m-metal { color: var(--m-metal); } .ico.m-alloy { color: var(--m-alloy); } .ico.m-ceramic { color: var(--m-ceramic); } .ico.m-glass { color: var(--m-glass); }
.ico.m-polymer { color: var(--m-polymer); } .ico.m-composite { color: var(--m-composite); } .ico.m-fluid { color: var(--m-fluid); }
.badges { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 10px; max-width: none; }
.badge { padding: 3px 12px; border: 1px solid var(--tline); border-radius: 12px; cursor: pointer; font-size: 12px; color: var(--dim); background: transparent; user-select: none; }
.badge:hover { color: var(--text); }
.badge.on { color: var(--bg); background: var(--text); border-color: var(--text); font-weight: 700; }
.badge.k-chemical.on { background: var(--k-chemical); border-color: var(--k-chemical); }
.badge.k-thermal.on { background: var(--k-thermal); border-color: var(--k-thermal); }
.badge.k-mechanical.on { background: var(--k-mechanical); border-color: var(--k-mechanical); }
.badge.k-chemical { border-color: var(--k-chemical); } .badge.k-thermal { border-color: var(--k-thermal); } .badge.k-mechanical { border-color: var(--k-mechanical); }
/* The periodic table: 18 groups across (a column of period numbers first), the f-block below. */
.ptable { display: grid; grid-template-columns: 22px repeat(18, 46px); gap: 3px; margin: 8px 0 12px; max-width: none; letter-spacing: 0; }
.ptable .hd { color: var(--dim); font-size: 11px; text-align: center; align-self: center; }
.ptable .el { height: 46px; padding: 2px 4px; border-radius: 3px; cursor: pointer; color: #eef3f6; line-height: 1.15; overflow: hidden; }
.ptable .el:hover { outline: 2px solid var(--head); }
.ptable .el .z { font-size: 10px; opacity: .8; display: block; }
.ptable .el .sy { font-size: 16px; font-weight: 700; }
.ptable .ph { height: 46px; font-size: 10px; color: var(--dim); display: flex; align-items: center; justify-content: center; border: 1px dashed var(--line); border-radius: 3px; }
/* An element's icon: its tile from the periodic table. */
.tile { display: inline-flex; flex-direction: column; justify-content: center; width: 46px; height: 46px; padding: 2px 4px; border-radius: 3px; color: #eef3f6; line-height: 1.15; vertical-align: middle; letter-spacing: 0; margin-right: 10px; }
.tile .z { font-size: 10px; opacity: .8; font-weight: 400; }
.tile .sy { font-size: 16px; font-weight: 700; }
.tile.small { width: 22px; height: 18px; padding: 0; margin-right: 6px; align-items: center; }
.tile.small .sy { font-size: 10px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; max-width: none; font-size: 12px; }
.legend span i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; }
.c-alkali-metal { background: #8a3f3f; } .c-alkaline-earth-metal { background: #8a643a; } .c-transition-metal { background: #3d5f86; }
.c-post-transition-metal { background: #357a70; } .c-metalloid { background: #5f7d35; } .c-non-metal { background: #2f7a48; }
.c-halogen { background: #74408a; } .c-noble-gas { background: #4c4496; } .c-lanthanide { background: #8a3c68; } .c-actinide { background: #8a5236; }
.c-unknown { background: #48505a; }
@media (max-width: 720px) {
  main { grid-template-columns: 1fr; height: auto; }
  #grip { display: none; }
  nav { max-height: 45vh; border-right: 0; border-bottom: 1px solid var(--line); }
  header { flex-wrap: wrap; }
}
</style>

istun:treistun-b-i"}, {"name": "Treistun b", "kind": "planet", "gravity": 9.4, "about": "The innermost planet, 0.13 AU from the star. Rocky, 6,194 km in radius, with a surface gravity of 0.96 g and no air. It is hot: about 560 K on average. Its day lasts 32 hours. One moon.", "story": ["Nobody settled b for comfort. Port Zaudalein is there because someone decided the ground was worth the heat, and it has stayed a place people work at rather than live in."], "slug": "treistun-b", "file": "LocalAdministration/metadata/administrations/treistun/treistun-b.yaml", "celestial": "cb:treistun:treistun-b"}, {"name": "Treistun c I", "kind": "moon", "at": "Treistun c", "gravity": 1.11, "about": "A moon of Treistun c. 1,328 km in radius, 0.11 g at the surface, no air, about 425 K on average. Its day lasts 15 hours.", "story": ["Small, hot and light. It matters because of what it orbits: it is the nearest place to c where a ship can land and lift cheaply."], "slug": "treistun-c-i", "file": "LocalAdministration/metadata/administrations/treistun/treistun-c-i.yaml", "celestial": "cb:treistun:treistun-c-i"}, {"name": "Treistun c", "kind": "planet", "gravity": 16.36, "about": "The second planet, 0.22 AU out, and the largest rocky world in the system: 8,815 km in radius, 1.67 g at the surface, no air, about 420 K on average. One moon.", "story": ["The heavy world. Setting down on c is easy and leaving it is expensive, and everything about its one port follows from that."], "slug": "treistun-c", "file": "LocalAdministration/metadata/administrations/treistun/treistun-c.yaml", "celestial": "cb:treistun:treistun-c"}, {"name": "Treistun d I", "kind": "moon", "at": "Treistun d", "gravity": 1.28, "about": "A moon of Treistun d. 1,527 km in radius, 0.13 g at the surface, no air, about 306 K on average. Its day lasts 12 hours.", "story": ["Airless and a little cooler than d below it. It was settled as d's yard: a place to keep ships without bringing them down through the air."], "slug": "treistun-d-i", "file": "LocalAdministration/metadata/administrations/treistun/treistun-d-i.yaml", "celestial": "cb:treistun:treistun-d-i"}, {"name": "Treistun d", "kind": "planet", "gravity": 10.51, "about": "The third planet, 0.41 AU out. 6,654 km in radius, 1.07 g, with air as dense as e's. It is warm: about 320 K on average. Its day lasts 20 hours. One moon.", "story": ["The warm world, and the second with air. It was settled after e, by people who wanted open sky and were willing to take the heat that came with it."], "slug": "treistun-d", "file": "LocalAdministration/metadata/administrations/treistun/treistun-d.yaml", "celestial": "cb:treistun:treistun-d"}, {"name": "Treistun e Station", "kind": "settlement", "at": "Treistun e", "about": "The system's station, in orbit round Treistun e. It is a landing deck of 16 pads with the main structure standing along one edge and a hangar inside. It turns once an orbit, keeping the same side to the planet.", "story": ["Raised above Nacaubun when the port ran out of room. The yards, the makers' offices, the Standards Foundry Office and the administration all followed the ships up, and it has been the centre of the system since."], "slug": "treistun-e-station", "file": "LocalAdministration/metadata/administrations/treistun/treistun-e-station.yaml"}, {"name": "Treistun e", "kind": "planet", "gravity": 9.6, "about": "The fourth planet, 0.66 AU out, and the home world. 6,281 km in radius, 0.98 g, with air. It is cold: about 264 K on average. Its day lasts under 19 hours. It has no moon; the station orbits it.", "story": ["Where Treistun began. The first landing, the first port and the first station were all here, and the system's administration still sits in orbit above it."], "slug": "treistun-e", "file": "LocalAdministration/metadata/administrations/treistun/treistun-e.yaml", "celestial": "cb:treistun:treistun-e"}, {"name": "Treistun f", "kind": "planet", "gravity": 4.06, "about": "The fifth planet, 1.13 AU out, and the last rocky  0 86.850 27.340\" fill=\"none\" stroke=\"#6ebdcc\" stroke-width=\"3\" stroke-linecap=\"round\"/>\n<circle cx=\"82\" cy=\"33\" r=\"5.5\" fill=\"#c29c54\"/><circle cx=\"82\" cy=\"33\" r=\"9\" fill=\"none\" stroke=\"#c29c54\" stroke-width=\"1\"/>\n<circle cx=\"20\" cy=\"26\" r=\"2.5\" fill=\"#c29c54\"/><path d=\"M70 78l1.500 3.500L75 83l-3.500 1.500L70 88l-1.500-3.500L65 83l3.500-1.500z\" fill=\"#6ebdcc\"/><\/svg>", "tallis-signal-works": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 96 96\"><defs><linearGradient id=\"ta-a\" x1=\"0\" y1=\"1\" x2=\"0\" y2=\"0\"><stop offset=\"0\" stop-color=\"#486092\"/><stop offset=\"1\" stop-color=\"#78b8d8\"/><\/linearGradient><\/defs>\n<g fill=\"none\" stroke=\"url(#ta-a)\" stroke-linecap=\"round\"><path d=\"M62 10a20 20 0 0 1 0 28\" stroke-width=\"4\"/><path d=\"M72 2a34 34 0 0 1 0 44\" stroke-width=\"3\"/>\n<path d=\"M34 10a20 20 0 0 0 0 28\" stroke-width=\"4\"/><path d=\"M24 2a34 34 0 0 0 0 44\" stroke-width=\"3\"/><\/g>\n<path d=\"M48 24 L66 88 H30 Z\" fill=\"none\" stroke=\"#778ba5\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M43.500 40h9M39 56h18M34.500 72h27M43.500 40l13.500 16M52.500 40L39 56M39 56l22.500 16M57 56L34.500 72\" stroke=\"#617082\" stroke-width=\"1.600\" fill=\"none\"/>\n<path d=\"M20 88h56\" stroke=\"#778ba5\" stroke-width=\"3\" stroke-linecap=\"round\"/><circle cx=\"48\" cy=\"24\" r=\"6\" fill=\"#cd5f54\"/><circle cx=\"48\" cy=\"24\" r=\"2.500\" fill=\"#eac0b5\"/><\/svg>", "tolland-yards": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 96 96\"><defs><linearGradient id=\"to-a\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\"><stop offset=\"0\" stop-color=\"#c5935f\"/><stop offset=\"1\" stop-color=\"#835838\"/><\/linearGradient><\/defs>\n<path d=\"M48 3 L87 25.500 V70.500 L48 93 L9 70.500 V25.500 Z\" fill=\"url(#to-a)\"/><path d=\"M48 11 L80 29.500 V66.500 L48 85 L16 66.500 V29.500 Z\" fill=\"#1f1914\"/>\n<g fill=\"#c5935f\"><circle cx=\"48\" cy=\"7\" r=\"1.800\"/><circle cx=\"83.500\" cy=\"27.500\" r=\"1.800\"/><circle cx=\"83.500\" cy=\"68.500\" r=\"1.800\"/><circle cx=\"48\" cy=\"89\" r=\"1.800\"/><circle cx=\"12.500\" cy=\"68.500\" r=\"1.800\"/><circle cx=\"12.500\" cy=\"27.500\" r=\"1.800\"/><\/g>\n<path d=\"M24 28h48v11H54.500v22h-13V39H24z\" fill=\"#ddd1c2\"/><path d=\"M48 28h24v11H54.500v22H48z\" fill=\"#bdae9c\"/>\n<path d=\"M24 33.500h48M48 39v22\" stroke=\"#1f1914\" stroke-width=\"1\" opacity=\".6\"/>\n<path d=\"M26 66h44l-7 9H33z\" fill=\"url(#to-a)\"/><path d=\"M36 69.500h24\" stroke=\"#1f1914\" stroke-width=\"2\" stroke-dasharray=\"4 3\"/><\/svg>", "vireo-spaceworks": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 96 96\"><defs><linearGradient id=\"vi-a\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#adcb75\"/><stop offset=\"1\" stop-color=\"#54824a\"/><\/linearGradient><\/defs>\n<g stroke=\"#b8af53\" stroke-linecap=\"round\" stroke-width=\"2.500\"><path d=\"M4 30h12M8 40h13M13 50h13\"/><\/g>\n<path d=\"M18 12 L48 88 L58 62 L38 12 Z\" fill=\"url(#vi-a)\"/><path d=\"M90 12 L48 88 L58 62 L72 12 Z\" fill=\"#385f36\"/>\n<path d=\"M72 12 L58 62 L52 47 L64 12 Z\" fill=\"#b8af53\"/><path d=\"M44 12 L52 30 L58 12 Z\" fill=\"url(#vi-a)\"/>\n<circle cx=\"80\" cy=\"72\" r=\"3\" fill=\"#b8af53\"/><circle cx=\"80\" cy=\"72\" r=\"6.500\" fill=\"none\" stroke=\"#54824a\" stroke-width=\"1.200\"/><\/svg>"}, "makers": [{"key": "brand.aurel", "name": "Aurel Fusion Works", "ticker": "AFW", "address": {"at": "treistun/treistun-e-station", "tower": "Works Tower", "deck": 11, "section": "A", "unit": 6}, "note": "Fusion plants: light, efficient, dear", "who": "A small, exacting builder of reactors for buyers who count every kilogram.", "what": "Builds fusion plants: light, efficient and expensive.", "story": ["Aurel is named after its founder, a reactor designer who believed a fusion plant could weigh half what the big makers said it must. She spent years proving it on a single prototype before selling one.", "The company builds few plants and builds them slowly. Each is light, efficient and costs several times what a Hadley unit does. Racers, couriers and long-range explorers buy them; haulers mostly don't.", "Aurel has refused more than one offer to be bought, and keeps its design office and its workshop under one roof so the people who draw a plant also have to build it."], "file": "MakerHouse/metadata/makers/aurel-fusion-works.yaml", "slug": "aurel-fusion-works"}, {"key": "brand.castellan", "name": "Castellan Storage", "ticker": "CST", "business": "warehousing", "note": "Port warehouses, yards and tanks", "who": "A warehouse company. It owns the buildings goods sit in between a ship and a buyer, and earns from storing and handling them.", "what": "Builds and runs warehouses, bulk yards and tank farms at ports.", "file": "MakerHouse/metadata/makers/castellan-storage.yaml", "slug": "castellan-storage"}, {"key": "brand.cormorant", "name": "Cormorant Mining", "ticker": "CMN", "address": {"at": "treistun/treistun-e-station", "tower": "Works Tower", "deck": 2, "section": "D", "unit": 8}, "note": "Mining gear", "who": "A company of miners that started building its own tools and now sells them.", "what": "Makes mining gear for ships.", "story": ["Cormorant was a mining crew before it was a company. Working the belts with gear built for other jobs, they cut, welded and rebuilt it until it suited the rock, and other crews started asking to buy what they had made.", "It still runs its own mining ships, and every new tool goes out on them for a season before it is sold. The gear looks rough, and the manuals read like they were written by people with gloves on.", "Miners trust Cormorant because it is one of them, and because it will tell a buyer when a cheaper tool would do."], "file": "MakerHouse/metadata/makers/cormorant-mining.yaml", "slug": "cormorant-mining"}, {"key": "brand.garrick", "name": "Garrick Arms", "ticker": "GAR", "address": {"at": "treistun/treistun-e-station", "tower": "Works Tower", "deck": 7, "section": "C", "unit": 10}, "note": "Weapons: mass drivers and lasers", "who": "An arms maker that sells to anyone allowed to buy.", "what": "Makes ship weapons: mass drivers and lasers.", "story": ["Garrick started as a maker of mass drivers for moving ore, launching loads from surface mines to orbit. It did not take long for someone to point one at a ship, and the company followed its customers.", "Today it makes ship weapons, mass drivers and lasers, and little else. It sells to anyone the law allows and keeps a careful record of who that is. It does not pretend its trade is anything other than what it is.", "The family still owns it. It keeps out of politics and out of the SFO's founding, though it builds to the standards like everyone else."], "file": "MakerHouse/metadata/makers/garrick-arms.yaml", "slug": "garrick-arms"}, {"key": "brand.hadley", "name": "Hadley Heavy Industries", "ticker": "HHI", "address": {"at": "treistun/treistun-e-station", "tower": "Works Tower", "deck": 1, "section": "A", "unit": 1}, "note": "Plants, tanks and racks: rugged and cheap", "who": "A big, plain industrial company that sells on price and on things not breaking. One of the founders of the SFO.", "what": "Builds power plants, tanks and cargo racks: heavy, rugged and cheap.", "story": ["Hadley is older than most of the stations it supplies. It started by casting pressure tanks for the first settlements, when a tank that leaked meant people died, and it built its name on tanks that didn't.", "It grew by buying foundries and mills wherever ore was close, and today it runs more heavy plant than any other maker. Nothing it sells is elegant. Its power plants are heavy, its racks are thick, and its catalogue has barely changed in a generation, which is exactly what its customers want.", "Hadley's founders are long gone; it is run by a board that distrusts anything new until somebody else has paid to prove it."], "file": "MakerHouse/metadata/makers/hadley-heavy-industries.yaml", "slug": "hadley-heavy-industries"}, {"key": "brand.halcyon", "name": "Halcyon Field Systems", "ticker": "HFS", "address": {"at": "treistun/treistun-e-station", "tower": "Trade Tower", "deck": 31, "section": "A", "unit": 1}, "note": "Hyperdrives and gate rings: clean fields, dear", "who": "A field-engineering company working on the hardest part of travel: the jump.", "what": "Builds hyperdrives and gate rings, known for clean fields and high prices.", "story": ["Halcyon grew out of a research group that studied jump fields long before anyone sold them. When the group's funding ended, its members formed a company rather than scatter, and took their measurements with them.", "It builds hyperdrives and the rings for gates. Its fields are known for being clean: ships arrive where they meant to, and their other systems are left undisturbed. That takes care in the making, and Halcyon charges for it.", "It is still run like a laboratory. It publishes more than its rivals think wise, on the view that nobody can copy the patience."], "file": "MakerHouse/metadata/makers/halcyon-field-systems.yaml", "slug": "halcyon-field-systems"}, {"key": "brand.halvard", "name": "Halvard Construction", "ticker": "HVC", "address": {"at": "treistun/treistun-e-station", "tower": "Trade Tower", "deck": 15, "section": "D", "unit": 7}, "note": "Stations, spaceports and outposts", "who": "A construction company that builds the places ships go to. One of the founders of the SFO.", "what": "Builds stations, spaceports and outposts.", "story": ["Halvard built its first outpost for a mining company that could find nobody else willing to work that far out. It finished late and over cost, and the outpost is still standing.", "Since then it has built stations, spaceports and outposts across the settled systems. It works slowly, with its own crews, and it stays on after the opening to see how the place holds up.", "Halvard joined the founding of the SFO because a port is only useful if every ship can land at it, and it was tired of being told a pad was the wrong size."], "file": "MakerHouse/metadata/makers/halvard-construction.yaml", "slug": "halvard-construction"}, {"key": "brand.kestrel", "name": "Kestrel Driveworks", "ticker": "KDW", "address": {"at": "treistun/treistun-e-station", "tower": "Works Tower", "deck": 4, "section": "B", "unit": 3}, "note": "Drives and thrusters: light, strong, dear", "who": "A propulsion house run by engineers, known for finish and for charging for it. One of the founders of the SFO.", "what": "Designs and builds main drives and manoeuvring thrusters. Its units are lighter and stronger than most, and priced to match.", "story": ["Kestrel began as a repair shop on the home station, three engineers rebuilding other makers' thrusters for pilots who couldn't wait for parts. They kept notes on every unit that came in broken, and after a few years they knew better than the makers themselves where drives failed. Their first own design was built from that notebook.", "The company has never been large and has never tried to be cheap. Every drive is test-fired before it ships and carries the name of the person who signed it off. Pilots complain about the price and then buy a second one.", "Kestrel pushed for the SFO early: a small maker lives or dies on whether its drive bolts onto somebody else's hull."], "file": "MakerHouse/metadata/makers/kestrel-driveworks.yaml", "slug": "kestrel-driveworks"}, {"key": "brand.meridian", "name": "Meridian Power", "ticker": "MPW", "address": {"at": "treistun/treistun-e-station", "tower": "Trade Tower", "deck": 9, "section": "B", "unit": 2}, "note": "Capacitor banks and power storage", "who": "A power-storage specialist that makes one kind of thing and little else.", "what": "Makes capacitor banks and power storage.", "story": ["Meridian was founded by two people who left a reactor maker over one argument: they held that most ships don't need a bigger plant, they need somewhere to keep the power they already make.", "It has built capacitor banks and power storage ever since and has turned down every chance to build anything else. That narrowness is its whole pitch. Its banks are sized to sit beside any maker's plant, and it publishes how they age.", "Meridian is small, steady and privately held, and seems content to stay that way."], "file": "MakerHouse/metadata/makers/meridian-power.yaml", "slug": "meridian-power"}, {"key": "brand.orbital", "name": "Orbital Systems", "ticker": "ORB", "address": {"at": "treistun/treistun-e-station", "tower": "Trade Tower", "deck": 22, "section": "C", "unit": 5}, "note": "Computers, sensors, navigation", "who": "An electronics company; most ships fly on something of theirs. One of the founders of the SFO.", "what": "Makes flight computers, sensors and navigation equipment.", "story": ["Orbital Systems was started by a group of navigators tired of flying with instruments that disagreed with each other. Their first product was a flight computer that showed one honest answer and said how sure it was.", "From there it spread into sensors and navigation aids, and then into nearly every cockpit. It is the quietest of the big makers: it advertises little, and its engineers are rarely seen at the yards.", "It argued hardest of all the founders for common signals and data formats in the SFO, and it has profited the most from them."], "file": "MakerHouse/metadata/makers/orbital-systems.yaml", "slug": "orbital-systems"}, {"key": "brand.tallis", "name": "Tallis Signal Works", "ticker": "TSW", "address": {"at": "treistun/treistun-e-station", "tower": "Trade Tower", "deck": 38, "section": "B", "unit": 3}, "note": "Comms and relays: far-reaching, power-hungry", "who": "A communications company whose equipment reaches further than anyone's and draws the power to do it.", "what": "Makes comms equipment and relays.", "story": ["Tallis began with one long-range relay, built by a station's communications officer who was tired of losing ships the moment they left the system. It reached further than anything on sale, and other stations asked for one.", "The company makes comms equipment and relays. Its gear is known for range and for the power it draws to get it; fitting a Tallis set often means fitting a bigger plant too.", "It remains close to the stations that were its first customers, and much of the traffic between settled systems passes through something it built."], "file": "MakerHouse/metadata/makers/tallis-signal-works.yaml", "slug": "tallis-signal-works"}, {"key": "brand.tolland", "name": "Tolland Yards", "ticker": "TOL", "address": {"at": "treistun/treistun-e-station", "tower": "Works Tower", "deck": 3, "section": "A", "unit": 2}, "note": "Hulls: workhorses and haulers", "who": "A shipyard for working ships, built for people who earn a living with them. One of the founders of the SFO.", "what": "Builds hulls: workhorses and haulers.", "story": ["Tolland Yards began by converting worn-out tugs into haulers for crews who couldn't afford a new ship. It learned what working pilots needed by listening to them complain in its own docks.", "Its hulls are plain, roomy and easy to repair with whatever is to hand. A Tolland is seldom anyone's dream ship, but it is very often their first, and many are still flying under their third or fourth owner.", "Tolland was a founder of the SFO for a simple reason: its customers fit their ships with whatever they can find, and it wanted all of it to fit."], "file": "MakerHouse/metadata/makers/tolland-yards.yaml", "slug": "tolland-yards"}, {"key": "brand.treistun_exchange", "name": "Treistun Exchange", "ticker": "TEX", "business": "exchange", "note": "The market: where goods in store change hands", "who": "The company that runs the market. It owns no goods and no warehouses: it sets the rules of trade and keeps the record of who owns what lies in the warehouses it has approved.", "what": "Runs trading in goods held at approved warehouses.", "file": "MakerHouse/metadata/makers/treistun-exchange.yaml", "slug": "treistun-exchange"}, {"key": "brand.vireo", "name": "Vireo Spaceworks", "ticker": "VIR", "address": {"at": "treistun/treistun-e-station", "tower": "Works Tower", "deck": 5, "section": "D", "unit": 4}, "note": "Hulls: fast and light", "who": "A shipyard that builds for speed before capacity. One of the founders of the SFO.", "what": "Builds hulls: fast and light.", "story": ["Vireo was started by pilots who raced, and who thought the yards built ships like warehouses. Their first hull carried almost nothing and outran everything, and they sold it on that.", "The company builds fast, light hulls and gives up cargo space to do it. Couriers, scouts and people in a hurry buy them. Its yard is small and its waiting list is long.", "Vireo and Tolland agree on very little, but they stood together as founders of the SFO: a light hull is worth nothing if the drives and modules made for it don't fit."], "file": "MakerHouse/metadata/makers/vireo-spaceworks.yaml", "slug": "vireo-spaceworks"}], "elements": [{"identity": {"name": "Hydrogen", "symbol": "H", "atomic_number": 1, "atomic_mass": 1.008, "group": 1, "period": 1, "block": "s", "category": "non-metal"}, "atomic_structure": {"electron_configuration": "1s1", "valence_electrons": 1, "atomic_radius": 53.0, "covalent_radius": 31.0, "van_der_waals_radius": 120.0, "stable_isotopes": 2, "isotope_abundances": [{"mass_number": 1, "abundance": 0.999855}, {"mass_number": 2, "abundance": 0.000145}]}, "chemical": {"electronegativity": 2.2, "first_ionisation_energy": 1312, "electron_affinity": 72.769, "oxidation_states": [1, -1], "reactivity": {"air": "none", "water": "none", "acids": "none"}, "bond_type": "covalent", "standard_electrode_potential": 0.0, "flammable": true}, "physical": {"phase": "gas", "melting_point": 13.81, "boiling_point": 20.28, "density": 0.08988, "crystal_structure": "simple hexagonal", "allotropes": ["dihydrogen"], "heat_of_fusion": 0.0585, "heat_of_vaporisation": 0.452}, "the trength": "MPa; where it breaks, pressed", "shear_strength": "MPa", "elongation_at_break": "share of its length (0.2: 20%); ductility", "hardness": "Mohs scale", "fracture_toughness": "MPa m^0.5; resistance to cracks growing", "impact_toughness": "J (Charpy); resistance to sudden blows", "fatigue_limit": "MPa; the load it survives over many cycles", "creep_resistance": "Against slow sagging under long load, hot above all.", "wear_resistance": "", "friction_coefficient": "against steel, dry"}, "thermal": {"melting_point": "K; or where it softens or decomposes", "max_service_temperature": "K", "min_service_temperature": "K; below it, brittle", "thermal_conductivity": "W/(m K)", "specific_heat_capacity": "J/(kg K)", "thermal_expansion": "1/K, linear", "thermal_shock_resistance": "", "emissivity": "0 to 1; how well it radiates heat", "absorptivity": "0 to 1; how much sunlight it soaks up"}, "electrical_magnetic": {"electrical_conductivity": "S/m", "dielectric_strength": "MV/m; the field an insulator withstands", "magnetic": "", "superconducting_temperature": "K; null if none"}, "optical": {"transparency": "0 to 1; the share of visible light passed", "refractive_index": "", "reflectivity": "0 to 1, of visible light", "colour": ""}, "environment": {"corrosion_resistance": "", "oxidation_resistance": "Hot, in air.", "chemical_resistance": "To fuels and acids.", "outgassing": "share of its mass lost in vacuum (total mass loss, 0 to 1)", "radiation_resistance": "Against damage from radiation over time.", "radiation_shielding": "How well it stops radiation.", "uv_resistance": "", "flammability": "", "permeability": "How well it holds gas in (excellent: nothing leaks through).", "toxicity": ""}, "making": {"formability": "Rolled, bent, forged.", "machinability": "", "weldability": "", "joining": "How it's joined.", "castability": "Cast or printed.", "repairability": "", "recyclability": ""}}, "standards": [{"title": "Mining ship", "parent": "SFO 2", "purpose": "To turn rock somewhere far away into value at a market, and bring its crew home.", "sections": [{"text": "a mining ship exists to turn rock somewhere far away into value at a market, and bring its crew home. Every system on that list answers one of a few forces that stand in the way:", "table": {"columns": ["Force (what the world imposes)", "What it demands", "Systems that answer it"], "rows": [["Distance: the rock is far from the market", "get there and back", "drive, hyperdrive, propellant, navigation, flight computer"], ["Gravity and motion: rocks spin, worlds pull", "hold position, land, lift", "lift and manoeuvring thrusters, gear, anchor clamps"], ["Rock is hard and mixed", "break it, find the good part", "prospecting sensors, laser or drill, analyser"], ["Mass costs: every tonne hauled costs propellant", "carry only what pays", "collector, crusher, refinery, tailings ejector, holds"], ["Energy: cutting and moving takes power", "make and store it", "reactor, capacitors, power distribution"], ["Heat: every watt used becomes heat, and space barely takes it away", "get rid of it", "radiators, coolant loops"], ["Vacuum, time and danger: people die out there", "keep them alive, weeks at a time", "pressure hull, life support, water, medical, quarters, galley, escape pod, fire and damage control"], ["Isolation: help is far", "fix things, call out", "workshop, spares, comms"], ["Trade: value is only real where it's sold", "hand over cargo, prove what it is", "docking, cargo handling, containers, transponder"]]}, "title": ""}], "number": 1, "id": "SFO 1", "body": "body.sfo", "file": "SFO/metadata/0001-mining-ship.yaml"}, {"title": "Spaceships", "records": "hulls", "purpose": "Ships exist because what people need and where it is are in different places, and space is in between.", "details": {"text": ["From that come a few reasons to cross it:", "- To move things: goods, ore and fuel from where they are to where they're wanted.", "- To move people: to work, settle, trade or come home.", "- To reach what can't be had at home: resources, land, knowledge.", "- To do work out there: mining, building, repairing, rescuing.", "- To protect or take: defend what's yours, take what isn't.", "Everything a ship carries follows from crossing that space and surviving it: distance, gravity, energy, heat, vacuum, isolation. A specific ship (miner, hauler, transport) is just which reason it's built for, and which of those forces it fights hardest."], "title": ""}, "number": 2, "id": "SFO 2", "body": "body.sfo", "file": "SFO/metadata/0002-spaceships.yaml"}, {"title": "Spaceport", "purpose": "Ships exist because what people need is somewhere else, and a spaceport is where \"somewhere else\" meets the ground. A world's goods and people are on its surface, and the port is the door.", "details": {"text": ["The forces it answers:", "- Gravity: landing and lifting are the hardest, most dangerous moments. The port gives flat, prepared, known ground, and guidance down.", "- Traffic: many ships, one sky. Pads and clearance keep them apart.", "- Trade: cargo changes hands here, so goods leave and enter the world.", "- Distance: ships arrive low on fuel and leave needing a full tank.", "- People: crew and passengers step out into the world.", "- Law: the world's authority meets every ship that comes and goes.", "A station plays the same role in orbit. A spaceport does it on the surface, where the world's people and industry actually are."], "title": ""}, "number": 3, "id": "SFO 3", "body": "body.sfo", "file": "SFO/metadata/0003-spaceport.yaml"}, {"title": "Standing", "purpose": "Standing is a place's memory of how you've behaved there. Its purpose is to let strangers deal with each other safely in a big, open space where nobody can watch everyone.", "details": {"text": ["Why a civilisation needs it:", "- Trust between strangers: a port can't vet every arriving ship, but it can remember what that pilot did before. Good conduct earns access; harm closes doors.", "- Consequences without walls: nobody stops you from going anywhere or doing anything, but what you do follows you. Freedom stays, and so does accountability.", "- Law that scales: an authority can't police every corner of a system, but it can refuse service, refuse docking, and in the end defend itself. Standing tells it when to.", "- Protection for the innocent: it makes attacking peaceful ships costly, so honest traders and miners can work.", "- Room to redeem: standing is earned and lost through deeds, so people can change.", "It's local: each settled system's authority keeps its own record, from what it hears of. Information travels physically, so news of what you did reaches a place only as fast as it can. That leaves room for a fresh start far away, and for a bad name that hasn't caught up with you yet."], "title": ""}, "number": 4, "id": "SFO 4", "body": "body.sfo", "file": "SFO/metadata/0004-standing.yaml"}, {"title": "Materials", "records": "materials", "purpose": "Materials are what everything is made of (hulls, engines, stations, tools, fuel). Every made thing starts as matter taken from somewhere and changed into something useful.", "details": {"text": ["Why a civilisation needs them, and needs them named and graded:", "- Building: nothing gets made without them. Hulls need strong, light metals; reactors need fuel; radiators need conductive metals; windows need glass.", "- Fitness for purpose: different jobs need different properties: strength, weight, heat tolerance, conductivity, radiation shielding. The right material decides whether a thing works or fails.", "- Trade: materials are what miners sell and makers buy. A common name and grade means a buyer far away knows what they're getting.", "- Value from rock: raw ore is a mix. Refining turns it into materials, and the difference in value is what makes mining worth doing.", "- Scarcity and place: some materials are common everywhere, others only in certain rocks or worlds. That's what sends ships far away, and why trade routes exist.", "Materials are the link between the rock a mining ship cuts and everything else people build."], "title": ""}, "number": 5, "id": "SFO 5", "body": "body.sfo", "file": "SFO/metadata/0005-materials.yaml"}, {"title": "Chemical Elements", "records": "elements", "purpose": "A chemical element is one kind of atom, set by the number of protons in it. Elements are what all matter is made of; every material is one element or a combination of them.", "details": {"text": ["Why a civilisation needs them named and described:", "- A common language for matter: iron is iron everywhere. Anyone, anywhere, can say exactly what a thing is made of.", "- Knowing what a rock holds: prospecting and assaying report elements. That tells a miner what a rock is worth before cutting it.", "- Making materials: a material's properties come from its elements and how they're combined. To make steel, glass or fuel, you start from the right elements.", "- Predicting behaviour: an element's properties (melting point, density, reactivity, conductivity) say what it can and can't do, before anything is built.", "- Honest trade: purity and composition can be stated and checked, so a buyer knows what they're getting.", "Elements sit one level below materials: an element is a kind of atom; a material is stuff you build with, made of elements."], "title": ""}, "number": 6, "id": "SFO 6", "body": "body.sfo", "file": "SFO/metadata/0006-chemical-elements.yaml"}, {"title": "Material Processing", "records": "processes", "purpose": "Material Processing is the first stage of making materials (turning raw matter into materials and stock that things can be built from). It takes elements in and gives out named, graded materials in usable forms like sheet, bar and wire.", "details": {"text": ["Why a civilisation needs it:", "- Elements aren't buildable: almost nothing is made from a raw element. Iron becomes useful as steel, and silicon and oxygen as glass. Processing is where matter gets the properties a builder needs.", "- Properties are made, not found: the same composition can be weak or strong depending on how it was treated. Heat treatment and forming set a material's strength, hardness and toughness.", "- Form matters: a builder needs sheet, bar, tube or wire, not a lump. Processing delivers material in shapes the next stage can work with.", "- Consistency: a grade made to a standard is the same from every producer, so a part designed on one world can be built from stock made on another.", "- Value: each step adds worth. Stock sells for more than ingot, and ingot for more than elements. That margin is what pays for the industry, and gives miners a market.", "It sits between mining and refining below it, and fabrication of parts above it."], "title": ""}, "number": 7, "id": "SFO 7", "body": "body.sfo", "file": "SFO/metadata/0007-material-processing.yaml"}, {"title": "Stock", "purpose": "Stock is anything made, given a code and held to be used or sold. Every item of stock is made from items of the level below it, and can sit on a shelf, be counted and change hands.", "details": {"table": {"columns": ["Level", "An item", "Is made from", "Counted in"], "rows": [["Mill stock", "6061 sheet 3 mm", "a material", "m2, metres or kilograms"], ["Part", "MC07-04-001", "mill stock", "pieces"], ["Assembly", "MC07-04 Landing leg", "parts", "pieces"], ["Hull", "MC-07", "assemblies", "pieces"]]}, "title": ""}, "sections": [{"title": "One idea at every level", "text": ["Mill stock is sold by measure and cut up; a part or an assembly is counted in pieces and used whole. In everything else they are alike: a code, a specification, what it is made from, how it is made."]}], "number": 8, "id": "SFO 8", "body": "body.sfo", "file": "SFO/metadata/0008-stock.yaml"}, {"title": "Address", "purpose": "An address says where a place is, so that anyone can find it, deliver to it and record who is there. It follows how the place is physically built, from the largest part down to the single unit.", "details": {"text": ["An address reads from the smallest part to the largest, and uses only the levels the place has."], "table": {"columns": ["Level", "What it is", "Example"], "rows": [["Unit", "The single space someone occupies.", "Unit 14"], ["Section", "A named or lettered area of a deck.", "Section C"], ["Deck", "A numbered level.", "Deck 7"], ["Tower", "A major part of the structure (a tower, a ring, an arm), usually with one main purpose.", "Habitation Tower"], ["Number", "On the ground: its number along its street.", "1"], ["Street", "On the ground: a named street of the settlement.", "East Road"], ["Settlement", "The station, port or outpost.", "Treistun e Station"], ["Body", "The planet or moon the settlement is at. On a surface, with latitude and longitude.", "Treistun e"], ["System", "The star system.", "Treistun"]]}, "title": ""}, "sections": [{"title": "Rules", "text": ["A small outpost uses fewer levels: a few modules with units in them have no towers or decks.", "An address never changes: when a structure grows, the new part gets new addresses and nothing is renumbered.", "On the ground an address is a number on a street. In a structure it is unit, section, deck and tower.", "A parcel number is not an address: it is the land office's name for a lot. Nor is a zone: it says what may be done there.", "The settlement is the unit of administration. Inside a structure, tower, deck, section and unit are the settlement's own business."]}], "number": 9, "id": "SFO 9", "body": "body.sfo", "file": "SFO/metadata/0009-address.yaml"}, {"title": "Industrial Modules", "records": "modules", "purpose": "An industrial module is one standard piece of plant that performs one step of a process (a furnace, a casting bay, a yard). A process is a line of modules, and a factory is built by setting modules on its land.", "details": {"text": ["What a module's record gives:", "- Its size: the ground it takes and how tall it stands, so a factory can be laid out and its land worked out.", "- Its rate: how much it puts through in an hour, so the number of each needed follows from what the factory is to make.", "- What goes in and comes out for each tonne of its product, so the modules of a line can be matched to each other.", "- What it needs to run, so the power and supplies behind a factory can be sized."], "title": ""}, "number": 10, "id": "SFO 10", "body": "body.sfo", "file": "SFO/metadata/0010-industrial-modules.yaml"}, {"title": "Goods", "records": "goods", "purpose": "A good is something that moves in bulk through industry and is neither an element nor a finished material (ore, lime, sponge iron, slag). Naming them lets every tonne that goes into a factory or comes out of it be followed to where it came from and where it goes.", "number": 11, "id": "SFO 11", "body": "body.sfo", "file": "SFO/metadata/0011-goods.yaml"}, {"title": "Parts", "parent": "SFO 8", "records": "parts", "purpose": "A part is one made thing that a hull is built of. A simple part is cut from mill stock; a larger one is made of other parts. Parts are filed by the hull they belong to.", "number": 12, "id": "SFO 12", "body": "body.sfo", "file": "SFO/metadata/0012-parts.yaml"}, {"title": "Mill stock", "parent": "SFO 8", "records": "mill-stock", "purpose": "Mill stock is a material in a standard, usable form and size (sheet, plate, bar, tube, wire, fibre or film). It's what material processing delivers and what part-making starts from, the form a material is stored, traded and shipped in.", "details": {"text": ["Why a civilisation needs it:", "- A starting point for parts: nobody machines a hinge pin from an ingot. A maker picks the stock closest to the part's shape (bar for a pin, sheet for a skin panel, tube for a duct) and removes or bends the least.", "- Standard sizes: when sheet comes in set thicknesses and bar in set diameters, a part designed on one world can be cut from stock made on another, and tools, racks and machines fit everywhere.", "- Trade and transport: stock is what crosses space. It's dense, stackable, countable and gradable (so many tonnes of 6061 sheet at 3 mm). It's the unit that markets price and haulers carry.", "- A buffer: stock keeps. A yard holding sheet and bar can build without waiting for a foundry, and a foundry can run steadily without knowing what will be built. It decouples making materials from making things.", "- Known properties: stock carries its grade with it. A bar of 4340, quenched and tempered, has a certified strength, so a designer can trust the part before it's made.", "An item of mill stock is a material, a form and a size. What a unit of it weighs follows from the material's density."], "title": ""}, "number": 13, "id": "SFO 13", "body": "body.sfo", "file": "SFO/metadata/0013-mill-stock.yaml"}, {"title": "Assemblies", "parent": "SFO 8", "purpose": "An assembly is a part made of other parts, fitted to a hull whole (a landing leg, a ramp, a hull section).", "number": 14, "id": "SFO 14", "body": "body.sfo", "file": "SFO/metadata/0014-assemblies.yaml"}, {"title": "Shock", "purpose": "A shock is a sudden change of speed (a hard landing, a collision, a blow). What it does to a thing depends on how hard it is, measured in g, and on what the thing is made of. This is what breaking is worked out from.", "details": {"text": ["How the registry carries it:", "- A hull: the landing its legs are designed for, the hardest landing they take, and the jolt each puts on everything aboard (worked out in its structure report).", "- A part and an item of mill stock: its shock limit, the hardest jolt it takes while it is carried, and its impact resistance, the blow it takes without damage.", "- A material: its fracture toughness, how well it resists a crack running through it. Glass and steel differ by a hundred times."], "title": ""}, "sections": [{"title": "What a jolt does to a person", "text": ["From Wikipedia, g-force (https://en.wikipedia.org/wiki/G-force)."], "table": {"columns": ["Jolt", "What happens"], "rows": [["5 g, sustained, head to foot", "A typical person loses consciousness."], ["9 g, sustained", "What trained pilots can handle."], ["16 g for a minute", "May be deadly."], ["20 g for under 10 seconds", "Tolerated in early experiments, lying across the push."], ["46.2 g, a peak", "Survived once, strapped in, by John Stapp."], ["Over 100 g, a brief instant", "A car crash that was survived."]]}}], "number": 15, "id": "SFO 15", "body": "body.sfo", "file": "SFO/metadata/0015-shock.yaml"}, {"title": "Ship equipment", "parent": "SFO 2", "records": "equipment", "purpose": "Ship equipment is what a hull is fitted with to make it a ship that flies (a drive, lift jets, a power plant, tanks, a flight computer). Each is a maker's product. A hull says which it is fitted with.", "number": 16, "id": "SFO 16", "body": "body.sfo", "file": "SFO/metadata/0016-ship-equipment.yaml"}, {"title": "Stargates", "records": "gates", "purpose": "A stargate is a pair of rings, one at each of two stars, holding a tube open between them. Inside the tube a ship crosses light years in minutes. Nothing is shortened. The tube is as long as the span; the speed inside is what is extraordinary.", "details": {"text": ["Why a gate is large, and costly:", "- The tube weighs by its diameter cubed. A ring twice as wide costs eight times as much to open and to hold, so a ring is as wide as the largest ship it must pass, and no wider.", "- Opening a tube is paid once; holding it open is paid for as long as it stands, about 0.5% of the opening each month. Letting it lapse means paying the opening again.", "- Both go with the span: twice as far costs twice as much.", "- A ship pays to cross by its mass and the span, and steeply more to cross faster than its natural time.", "The laws and their constants are in config/dogma.ron (Tube); each constant is invented, with the target it was chosen for. What follows for each ring is worked out on its page."], "title": ""}, "number": 17, "id": "SFO 17", "body": "body.sfo", "file": "SFO/metadata/0017-stargates.yaml"}, {"title": "Hauler", "parent": "SFO 2", "purpose": "To move bulk from where it is dug or made to where it is used, cheaply, again and again.", "sections": [{"text": "A hauler exists because what is dug in one place is used in another, by the thousand tonnes. Its forces are the miner's with the digging taken out and the load put first:", "table": {"columns": ["Force (what the world imposes)", "What it demands", "What answers it"], "rows": [["Mass: the load is most of the ship", "a hold that is most of the hull, and a frame that carries it", "holds, racks, a spine"], ["Distance: the same run, over and over", "cheap propellant for each tonne moved, not speed", "an efficient drive, big tanks"], ["Gravity: bulk is loaded where it is and landed where it is wanted", "lift for its full weight, or a tender that lifts for it", "lift jets sized for the load, or none and a dock"], ["Time: a ship earning nothing while it loads", "load and unload fast", "wide doors, conveyors, standard containers"], ["Size: what must be carried in one piece", "a hold as long and wide as its largest load", "the hold's clear opening"]]}, "title": ""}, {"title": "What the registry asks of one", "text": ["Worked out from what is recorded. These are the loads; the economy decides how many ships carry them.", "The figures are on the Hulls report: what a rig eats flat out, what a gate ring weighs, and how many loads of each hull's hold that is."]}], "number": 18, "id": "SFO 18", "body": "body.sfo", "file": "SFO/metadata/0018-hauler.yaml"}], "cited": {}, "problems": [], "reports": [{"key": "chain-mc-07", "title": "Chain: MC-07 down to a factory", "about": "The thing itself and each part made of parts: is it said how it is put together, and is somewhere built to do it. Each part that is not made of other parts: does it have a mass, say what it is cut from, does a process make that stock, has the process real steps, is a facility b   if (k.startsWith("pg:") || k.startsWith("part:")) {

    const org = k.startsWith("at:") ? ORGS.find(o => o.key === k.slice(3)) : null;
    const [sy, slug] = org ? org.address.at.split("/") : k.split(":").slice(1);
    const a = DATA.administrations.find(x => x.slug === sy); if (!a) return;
    open.add("la"); open.add("ad:" + sy);
    // (Open the bodies above it; and itself and its tower, for what has its address there.)
    let x = a.bodies.find(y => y.slug === slug);
    if (x && (org || k.startsWith("pc:") || k.startsWith("fc:") || k.startsWith("zn:") || k.startsWith("st:") || k.startsWith("pw:"))) open.add(`bd:${sy}:${x.slug}`);
    if (x && k.startsWith("fc:")) { const f = (x.facilities || []).find(y => y.slug === k.split(":")[3]); if (f) open.add(`pc:${sy}:${x.slug}:${f.parcel}`); }

  }
  const s = stdOf(k); if (!s) return;

}

// The periodic table: groups 1-18 across, periods 1-7 down; the lanthanides (57-71) and
// actinides (89-103) in two rows below, under where they belong (group 3).
function periodicTable(els) {
  const slug = c => "c-" + (c || "unknown").replace(/[^a-z]+/g, "-");
  let h = `<h3>The periodic table</h3><div class="ptable">`;
  h += `<div class="hd" style="grid-row:1;grid-column:1"></div>`;
  for (let g = 1; g <= 18; g++) h += `<div class="hd" style="grid-row:1;grid-column:${g + 1}">${g}</div>`;
  for (let p = 1; p <= 7; p++) h += `<div class="hd" style="grid-row:${p + 1};grid-column:1">${p}</div>`;
  h += `<div class="ph" style="grid-row:7;grid-column:4">57-71</div><div class="ph" style="grid-row:8;grid-column:4">89-103</div>`;
  h += `<div class="hd" style="grid-row:9;grid-column:1 / span 19;height:10px"></div>`;
  for (const e of els) {
    const i = e.identity, z = i.atomic_number;
    let row, col;
    if (z >= 57 && z <= 71) { row = 10; col = z - 57 + 4; }
    else if (z >= 89 && z <= 103) { row = 11; col = z - 89 + 4; }
    else { row = i.period + 1; col = i.group + 1; }
    h += `<div class="el ${slug(i.category)}" style="grid-row:${row};grid-column:${col}" data-k="${esc("el:" + i.symbol)}" title="${esc(`${i.name} (${i.category || ""})`)}"><span class="z">${z}</span><span class="sy">${esc(i.symbol)}</span></div>`;
  }
  h += `</div><div class="legend">`;
  for (const c of [...new Set(els.map(e => e.identity.category).filter(Boolean))]) h += `<span><i class="${slug(c)}"></i>${esc(c)}</span>`;
  return h + `</div>`;
}

function detail(k) {

  const area = o => Math.abs(o.reduce((s, c, i) => s + c[0] * o[(i + 1) % o.length][1] - o[(i + 1) % o.length][0] * c[1], 0)) / 2;

  // The chain as a picture: from the hull down, each level a box with how many it holds, and between

  if ((s.requires || []).length) h += `<h3>Requires</h3><table><tr><th>Subject</th><th>Check</th><th>Against</th><th>Per</th></tr>${s.requires.map(r => `<tr><td>${esc(r.subject)}</td><td>${esc(String(r.check).replace(/_/g, " "))}</td><td>${esc(r.param)}</td><td>${esc(r.per || "")}</td></tr>`).join("")}</table>`;
  if (s.text) h += `<h3>Why</h3><p>${esc(s.text)}</p>`;
  h += `<div class="file" style="margin-top:24px">standards/${esc(s.file)}</div>`;
  return h;
}

document.addEventListener("click", e => {
  const badge = e.target.closest("[data-kind]");
  if (badge) { kindShown = badge.dataset.kind; render(); return; }
  const el = e.target.closest("[data-k]"); if (!el) return;
  const k = el.dataset.k;
  if (el.classList.contains("row") && !k.startsWith("s:") && !k.startsWith("el:") && !k.startsWith("mat:") && !k.startsWith("proc:") && !k.startsWith("mod:") && !k.startsWith("good:") && !k.startsWith("hull:") && !k.startsWith("stock:") && !k.startsWith("eq:") && !k.startsWith("gate:")) {
    if (open.has(k) && k === current) open.delete(k); else open.add(k);
    keepOpen();
  }
  // (A record with elements under it: its list opens, and closes on a second click.)
  if (el.classList.contains("row") && k.startsWith("s:") && (recordsUnder(k.slice(2)) || DATA.standards.some(x => x.parent === k.slice(2)))) {
    const x = "x:" + k.slice(2);
    if (open.has(x) && k === current) open.delete(x); else open.add(x);
    keepOpen();
  }
  reveal(k);
  select(k);
});
document.getElementById("q").addEventListener("input", render);
// The tree's width: dragged, and kept.
{
  const main = document.querySelector("main"), grip = document.getElementById("grip");
  const setW = w => main.style.setProperty("--nav-w", Math.max(180, Math.min(w, window.innerWidth - 300)) + "px");
  try { const w = +localStorage.getItem("standards-nav-w"); if (w) setW(w); } catch (e) {}
  grip.addEventListener("pointerdown", e => {
    grip.classList.add("drag"); grip.setPointerCapture(e.pointerId);
    const move = ev => setW(ev.clientX);
    const up = ev => {
      grip.classList.remove("drag"); grip.removeEventListener("pointermove", move); grip.removeEventListener("pointerup", up);
      try { localStorage.setItem("standards-nav-w", Math.round(ev.clientX)); } catch (e2) {}
    };
    grip.addEventListener("pointermove", move); grip.addEventListener("pointerup", up);
  });
}
window.addEventListener("hashchange", () => { current = decodeURIComponent(location.hash.slice(1)); reveal(current); render(); });
render();
</script>
