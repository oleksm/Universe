$schema: http://json-schema.org/draft-07/schema#
title: Clock
x-kind: [clock]
description: "standards/Engine/metadata/scheduling/<name>.yaml: one clock of the engine's tree. A clock steps when its trigger says (a period, an event, or never for a group), reads the last published state of the clocks it names in `reads`, and posts operations stamped with a tick to the clocks in `posts`. Its coupling decides where it runs (dictionary coupling); its scope says how many of it there are (one per body, per settlement, per bubble). The tree: a clock's parent is the clock whose due time makes it step. Every period is a whole number of the realtime tick (the build checks). Periods are the user's design and are configuration: the engine reads them here and nowhere else. No other record names a clock: the hierarchy derives it. A clock's scope says what kind of thing it belongs to, so the engine builds its lists at runtime from the world it has (every settlement gets an economy and a market clock, every body a planetary one, every craft its machinery and rails, every bubble its realtime step); the clock's `runs` is the work it binds in code, not a tag on registry items."
type: object
additionalProperties: false
required: [identity, scope, coupling, trigger, runs]
properties:
  identity:
    type: object
    additionalProperties: false
    required: [key, name, about]
    properties:
      key: { $ref: "../../common.schema.yaml#/definitions/key" }
      name: { type: string }
      about: { type: string, description: "What this clock is for, in a sentence." }
  parent: { type: string, x-ref: [clock], description: "The clock whose due time makes this one step; absent for the root clock." }
  scope: { $ref: "../../dictionary.schema.yaml#/definitions/clock_scope" }
  coupling: { $ref: "../../dictionary.schema.yaml#/definitions/coupling" }
  trigger:
    type: object
    additionalProperties: false
    required: [kind]
    properties:
      kind: { $ref: "../../dictionary.schema.yaml#/definitions/trigger_kind" }
      every: { type: number, x-unit: "s", exclusiveMinimum: 0, description: "s of game time between steps (kind period): a whole number of the realtime tick." }
      fires_on: { type: array, items: { type: string }, description: "What fires it (kind event): named plainly." }
  runs:
    type: array
    minItems: 1
    items: { type: string }
    description: "What work steps on this clock, one line each: the engine binds a handler to each clock by key, and this is the list it is bound to."
  reads: { type: array, items: { type: string, x-ref: [clock] }, description: "Clocks whose last published state this one reads (stale by at most their period)." }
  posts: { type: array, items: { type: string, x-ref: [clock] }, description: "Clocks this one posts stamped operations to (due at a tick)." }
  rule: { type: string, description: "The constraint that keeps this clock lean: what belongs here and what must leave." }
  revision:
    $ref: "../../common.schema.yaml#/definitions/record_revision"
    default: { status: review, owner: user, on_conflict: propose, because: "The user's design of the engine's time, 2026-10-06; periods are configuration and may be tuned with a reason.", ask: docs/registry-ssot-request.md }
  basis: { $ref: "../../common.schema.yaml#/definitions/basis" }
