# yaml-language-server: $schema=../../schema/clock.schema.yaml
identity:
  key: clock.administration
  name: Administration
  about: 'A settlement''s administration: what it records, charges and checks, stepped as its economy is.'
parent: clock.planetary
scope: settlement
coupling: slow_loose
trigger:
  kind: period
  every: 10.0
runs:
- the land levy, accruing at its rate a second (so much a m2 a second), charged as it accrues
- zoning breaches recorded against what was built since the last step
- compulsory-stock checks against the stocking law
- insurers' premiums accruing and claims as they come
- 'law''s slow side: records aging, appeals heard, statutes'' periods'
- 'the census: who lives and works here, births, deaths, moves; fleet replacements ordered'
reads:
- clock.economy
- clock.market
rule: 'The same step as the economy, by the user''s word: everything is a rate a second integrated over the step, so a daily
  charge is its rate times ten seconds, and nothing waits a day to be seen. Nothing a player waits for is here; a fine or
  a claim is answered as an event when it is made.'
basis:
- of:
  - trigger
  - runs
  tier: invented
  review: true
  note: 'Added 2026-10-06 when the integrator found the land levy (86,400 s) with no clock to own it; the user set it like
    the economy (10 s): the levy accrues by rate rather than falling due by the day.'
