identity:
  key: clock.field
  name: Field
  about: A craft's look-up of the belt patch or rock field around it.
parent: clock.system
scope: craft
coupling: fast_loose
trigger:
  kind: period
  every: 0.1
runs:
- belt-patch and rock-field look-up around a craft, or on 2 km moved
