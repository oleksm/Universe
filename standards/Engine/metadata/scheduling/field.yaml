- clock.celestial
posts:
- clock.realtime
defer: true
basis:
- of:
  - trigger
  - coupling
  - runs
  - defer
  tier: invented
  review: true
  note: 'planet-lod and engine, 25 Oct 2026: tick tiers (planet-data land/evidence/tick-tiers-design.md); the period is a
    proposal for the owner to set'
