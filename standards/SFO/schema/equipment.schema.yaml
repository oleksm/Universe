$schema: http://json-schema.org/draft-07/schema#
title: Ship equipment
description: One piece of equipment a hull is fitted with. A maker's product. Any one uses only some of these properties; one that does not apply is left out.
type: object
additionalProperties: false
required: [identity]
properties:
  identity:
    type: object
    additionalProperties: false
    required: [key, name]
    properties:
      key: { $ref: "../../common.schema.yaml#/definitions/key" }
      name: { type: string }
      maker: { type: string, x-ref: [org], description: "The maker whose product it is, by its key in Maker House." }
      slot: { type: string, description: "The kind of slot it fits." }
      description: { type: string }
  physical:
    type: object
    additionalProperties: false
    properties:
      mass: { type: number, description: kg }
      volume: { type: number, description: m3 }
  performance:
    type: object
    additionalProperties: false
    properties:
      power_draw: { type: number, description: "kW, working" }
      output: { type: number, description: "MW it supplies" }
      efficiency: { type: number, description: "the share of its fuel's or its draw's energy it turns to use" }
      thrust: { type: number, description: "kN, of one nozzle at full share" }
      exhaust_speed: { type: number, description: km/s }
      burns: { type: string, x-ref: [good], description: What it burns. }
      capacity: { type: number, description: "kg it holds" }
      holds: { type: string, x-ref: [good], description: What it holds. }
      top_speed: { type: number, description: "times the speed of light" }
      turn_rate: { type: number, description: "rad/s it can turn the ship at" }
      roll_rate: { type: number, description: "rad/s it can roll the ship at" }
      range: { type: number, description: km }
      capture: { type: number, description: "km, how far it hears" }
      link: { type: number, description: "km, how far it reaches another" }
      lag: { type: number, description: "s to pass a message on" }
      messages: { type: number, description: "messages an hour" }
      features: { type: array, items: { type: string }, description: What it can do. }
      cadence: { type: number, description: "s between its throws" }
  basis: { $ref: "../../common.schema.yaml#/definitions/basis" }
