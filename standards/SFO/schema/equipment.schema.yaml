$schema: http://json-schema.org/draft-07/schema#
title: Ship equipment
x-kind: [equipment]
description: One piece of equipment a hull is fitted with. A maker's product. Any one uses only some of these properties; one that does not apply is left out.
type: object
additionalProperties: false
required: [identity]
properties:
  identity:
    type: object
    additionalProperties: false
    required: [key, name]
    properties:
      key: { $ref: "../../common.schema.yaml#/definitions/key" }
      name: { type: string }
      maker: { type: string, x-ref: [org], description: "The maker whose product it is, by its key." }
      slot: { type: string, description: "The kind of slot it fits." }
      description: { type: string }
  physical: { $ref: "../../common.schema.yaml#/definitions/physical" }
  performance:
    type: object
    additionalProperties: false
    properties:
      power_draw: { type: number, x-unit: "W", description: "W, working" }
      output: { type: number, x-unit: "W", description: "W it supplies" }
      efficiency: { type: number, description: "the share of its fuel's or its draw's energy it turns to use" }
      thrust: { type: number, x-unit: "N", description: "N, of one nozzle at full share" }
      exhaust_speed: { type: number, x-unit: "m/s", description: m/s }
      burns: { type: string, x-ref: [good], description: What it burns. }
      capacity: { type: number, x-unit: "kg", description: "kg it holds" }
      holds: { type: string, x-ref: [good], description: What it holds. }
      top_speed: { type: number, x-unit: "m/s", description: "m/s" }
      turn_rate: { type: number, x-unit: "rad/s", description: "rad/s it can turn the ship at" }
      roll_rate: { type: number, x-unit: "rad/s", description: "rad/s it can roll the ship at" }
      range: { type: number, x-unit: "m", description: m }
      capture: { type: number, x-unit: "m", description: "m, how far it hears" }
      link: { type: number, x-unit: "m", description: "m, how far it reaches another" }
      lag: { type: number, x-unit: "s", description: "s to pass a message on" }
      messages: { type: number, x-unit: "1/s", description: "messages a second" }
      features: { type: array, items: { type: string }, description: What it can do. }
      cadence: { type: number, x-unit: "s", description: "s between its throws" }
  basis: { $ref: "../../common.schema.yaml#/definitions/basis" }
