$schema: http://json-schema.org/draft-07/schema#
title: Ship equipment
x-kind: [equipment]
description: "One piece of equipment a hull or a structure is fitted with. A maker's product. What it does is its `function`: the kind of device it is, and only that kind's figures."
type: object
additionalProperties: false
required: [identity, function, physical]
allOf:
  - { $ref: "../../common.schema.yaml#/definitions/physical_object" }
  - { properties: { physical: { required: [mass, volume, length, width, height] } } }
properties:
  identity:
    type: object
    additionalProperties: false
    required: [key, name, maker]
    properties:
      key: { $ref: "../../common.schema.yaml#/definitions/key" }
      traded_as: { type: string, x-ref: [market], description: "The market category it is traded as, by its key. Anything physical can be traded." }
      name: { type: string }
      maker: { type: string, x-ref: [org], description: "The maker whose product it is, by its key." }
      revision: { $ref: "../../common.schema.yaml#/definitions/revision" }
      slot: { $ref: "../../common.schema.yaml#/definitions/slot_kind" }
      description: { type: string }
  size_class: { type: integer, minimum: 1, maximum: 4, description: "Its size class, 1 to 4: it fits a slot at least as big." }
  fits: { type: string, x-ref: [mount], description: "The mount it is built to (SFO 19), by its key: any hull that offers it takes this." }
  physical: { $ref: "../../common.schema.yaml#/definitions/physical" }
  needs:
    type: object
    additionalProperties: false
    properties:
      power: { type: number, x-unit: "W", description: "W it draws, working" }
  built_of:
    description: "What it is built of."
    type: object
    additionalProperties: false
    properties:
      parts: { type: string, description: "The folder of parts (SFO 12) it is built of: SFO/metadata/parts/<folder>." }
      shares: { type: string, x-ref: [rule], description: "The rule its listed parts' shares of its weight rest on (rule.discovery-ii-engine-shares, rule.shares-chosen...), where it is not the record's own built_of basis; a part may still say its own." }
      whole: { type: boolean, description: "true: its listed parts are built in whole, as bought (rule.built-in-whole), even where a cutting module makes them; a part may still say its own." }
      list:
        description: "Its parts as a rule (SFO 12): one line each, from which the build and the registry reader derive the part records (key part.<code>, revision draft, basis by rules) so nothing is filed twice. A part that was measured from a model keeps its own file in the folder instead."
        type: array
        items:
          type: object
          additionalProperties: false
          required: [code, name, mass, length, width, height]
          properties:
            code: { type: string, pattern: '^[A-Z0-9]+-[0-9]{2}$', description: "The part's code (SFO 12): the product's and its number." }
            name: { type: string }
            description: { type: string }
            mass: { type: number, x-unit: "kg" }
            length: { type: number, x-unit: "m" }
            width: { type: number, x-unit: "m" }
            height: { type: number, x-unit: "m" }
            item: { type: string, x-ref: [material, stock, part, good], description: "What it is cut from or bought as, by its key." }
            quantity: { type: number, x-unit: "kg", description: "kg of that item one takes (the cutting loss in, rule.cut-loss)." }
            module: { type: string, x-ref: [module], description: "The industrial module that makes it, by its key." }
            count: { type: integer, minimum: 1, description: "how many go into the whole; one if left out" }
            basis: { $ref: "../../common.schema.yaml#/definitions/basis", description: "The part's own basis where the derived one (its share as the equipment's built_of says; cut with the loss where a cutting module makes it, else bought; the box by rule) does not fit." }
  making: { $ref: "../../common.schema.yaml#/definitions/making" }
  function:
    description: "What it does: one kind of device, with that kind's figures. All in SI."
    oneOf:
      - description: "Makes power from the fuel it burns."
        type: object
        additionalProperties: false
        required: [kind, output, efficiency, burns]
        properties:
          kind: { const: power_plant }
          output: { type: number, x-unit: "W", description: "W it supplies" }
          efficiency: { type: number, x-unit: "1", description: "the share of its fuel's energy it turns to power; the rest is heat" }
          burns: { type: string, x-ref: [material], description: "The fuel it burns, by its key." }
      - description: "The main drive."
        type: object
        additionalProperties: false
        required: [kind, thrust, exhaust, efficiency, burns]
        properties:
          kind: { const: drive }
          thrust: { type: number, x-unit: "N", description: "N, of one nozzle at full share" }
          exhaust: { type: number, x-unit: "m/s", description: "m/s, how fast its exhaust leaves" }
          efficiency: { type: number, x-unit: "1", description: "the share of its fuel's energy that goes into the exhaust; the rest is heat" }
          burns: { type: string, x-ref: [material], description: "The fuel it burns, by its key." }
          heat_to_hull: { type: number, x-unit: "1", description: "the share of the jet's power (half the thrust times the exhaust speed) that reaches the hull as heat and must be radiated: a product figure. A deuterium torch burning D-D puts a third of its energy into neutrons, which no hull survives at terawatts; so the drives of this world burn aneutronic or carry their reaction far behind a magnetic nozzle, and makers compete on this share. Today's value, a millionth, is the registry's first guess (docs/ships/equipment-review.md)." }
      - description: "Translation and attitude thrusters."
        type: object
        additionalProperties: false
        required: [kind, thrust, exhaust, efficiency, burns]
        properties:
          kind: { const: thrusters }
          thrust: { type: number, x-unit: "N", description: "N, of one nozzle at full share" }
          exhaust: { type: number, x-unit: "m/s", description: "m/s, how fast its exhaust leaves" }
          efficiency: { type: number, x-unit: "1", description: "the share of its fuel's energy that goes into the exhaust; the rest is heat" }
          burns: { type: string, x-ref: [material], description: "The fuel it burns, by its key." }
          heat_to_hull: { type: number, x-unit: "1", description: "the share of the jet's power (half the thrust times the exhaust speed) that reaches the hull as heat and must be radiated: a product figure. A deuterium torch burning D-D puts a third of its energy into neutrons, which no hull survives at terawatts; so the drives of this world burn aneutronic or carry their reaction far behind a magnetic nozzle, and makers compete on this share. Today's value, a millionth, is the registry's first guess (docs/ships/equipment-review.md)." }
      - description: "The belly lift."
        type: object
        additionalProperties: false
        required: [kind, thrust, exhaust, efficiency, burns]
        properties:
          kind: { const: lift }
          thrust: { type: number, x-unit: "N", description: "N, of one nozzle at full share" }
          exhaust: { type: number, x-unit: "m/s", description: "m/s, how fast its exhaust leaves" }
          efficiency: { type: number, x-unit: "1", description: "the share of its fuel's energy that goes into the exhaust; the rest is heat" }
          burns: { type: string, x-ref: [material], description: "The fuel it burns, by its key." }
          heat_to_hull: { type: number, x-unit: "1", description: "the share of the jet's power (half the thrust times the exhaust speed) that reaches the hull as heat and must be radiated: a product figure. A deuterium torch burning D-D puts a third of its energy into neutrons, which no hull survives at terawatts; so the drives of this world burn aneutronic or carry their reaction far behind a magnetic nozzle, and makers compete on this share. Today's value, a millionth, is the registry's first guess (docs/ships/equipment-review.md)." }
      - description: "Holds fuel."
        type: object
        additionalProperties: false
        required: [kind, capacity, holds]
        properties:
          kind: { const: tank }
          capacity: { type: number, x-unit: "kg", description: "kg it holds" }
          holds: { type: string, x-ref: [material], description: "What it holds, by its key." }
      - description: "Stores energy for bursts."
        type: object
        additionalProperties: false
        required: [kind, capacity, rate]
        properties:
          kind: { const: capacitor }
          capacity: { type: number, x-unit: "J", description: "J it stores" }
          rate: { type: number, x-unit: "W", description: "W it can take in or give out at most" }
      - description: "Holds cargo."
        type: object
        additionalProperties: false
        required: [kind, capacity]
        properties:
          kind: { const: rack }
          capacity: { type: number, x-unit: "kg", description: "kg it holds" }
      - description: "A hopper for loose rock: dug ore falls in through its top doors and is let out through its gate. It goes in a cargo slot. The game's ore bay is still the hull's own (hull.hold); from fitted bays once it reads this."
        type: object
        additionalProperties: false
        required: [kind, capacity, volume, fill_density]
        properties:
          kind: { const: ore_bay, x-in-game: "not made" }
          capacity: { type: number, x-unit: "kg", description: "kg of ore it is built to carry" }
          volume: { type: number, x-unit: "m3", description: "m3 it holds, heaped" }
          fill_density: { type: number, x-unit: "kg/m3", description: "kg/m3 of broken rock its capacity is reckoned at: fuller with denser ore, it is the mass that limits" }
      - description: "Seats for passengers, with their life support. It goes in a cargo slot."
        type: object
        additionalProperties: false
        required: [kind, seats]
        properties:
          kind: { const: cabin }
          seats: { type: integer, description: "how many it seats" }
      - description: "Holds a hyper-field round the ship."
        type: object
        additionalProperties: false
        required: [kind, efficiency, top_speed]
        properties:
          kind: { const: hyperdrive }
          efficiency: { type: number, x-unit: "1", description: "the share of its draw that goes into the field; the rest is heat" }
          top_speed: { type: number, x-unit: "m/s", description: "m/s, the fastest it can go" }
      - description: "Flies the ship by wire."
        type: object
        additionalProperties: false
        required: [kind, turn_rate, roll_rate]
        properties:
          kind: { const: flight_computer }
          turn_rate: { type: number, x-unit: "rad/s", description: "rad/s it lets the ship pitch and yaw at" }
          roll_rate: { type: number, x-unit: "rad/s", description: "rad/s it lets the ship roll at" }
      - description: "Sees other ships."
        type: object
        additionalProperties: false
        required: [kind, range]
        properties:
          kind: { const: sensors }
          resolves: { type: number, x-unit: "1", description: "for a survey: it makes out a rock at this many times the rock's size" }
          survey_range: { type: number, x-unit: "m", description: "m, the farthest a survey reaches" }
          range: { type: number, x-unit: "m", description: "m, how far it sees a ship" }
      - description: "A comm of the hypernet: a ship's, or a transceiver or terminal others connect to."
        type: object
        additionalProperties: false
        required: [kind, capture, link, lag, capacity]
        properties:
          kind: { const: comm }
          capture: { type: number, x-unit: "m", description: "m, how far it hears what happens" }
          link: { type: number, x-unit: "m", description: "m, how far it reaches another (the shorter of the two decides)" }
          lag: { type: number, x-unit: "s", description: "s to pass a message on" }
          capacity: { type: number, x-unit: "1/s", description: "messages a second" }
      - description: "Fitted to a gate ring: links its system's net to its twin's through the tube."
        type: object
        additionalProperties: false
        required: [kind, lag, capacity, cadence]
        properties:
          kind: { const: gate_relay }
          lag: { type: number, x-unit: "s", description: "s to handle a message" }
          capacity: { type: number, x-unit: "1/s", description: "messages a second" }
          cadence: { type: number, x-unit: "s", description: "s between its throws: capsules go by turns" }
      - description: "Links its site to others through hyperspace."
        type: object
        additionalProperties: false
        required: [kind, lag, capacity, cadence]
        properties:
          kind: { const: hyper_relay }
          lag: { type: number, x-unit: "s", description: "s to handle a message" }
          capacity: { type: number, x-unit: "1/s", description: "messages a second" }
          cadence: { type: number, x-unit: "s", description: "s between its throws: capsules go by turns" }
      - description: "Runs autopilots."
        type: object
        additionalProperties: false
        required: [kind, features, interlock, governor]
        properties:
          kind: { const: nav_computer }
          features: { type: array, items: { enum: [docking, landing, gate, follow, hyperdrive, route] }, description: "The autopilots it runs." }
          interlock: { type: number, x-unit: "m", description: "m: its hyperdrive interlock holds the ship no closer than this to a body's highest ground (0: none)" }
          governor: { type: number, x-unit: "1/s", description: "its hyperdrive governor: the ship's speed is held to this times the distance to the nearest surface (0: none)" }
      - description: "Says who the ship is."
        type: object
        additionalProperties: false
        required: [kind]
        properties:
          kind: { const: transponder }
      - description: "Air, water and warmth for the crew."
        type: object
        additionalProperties: false
        required: [kind]
        properties:
          kind: { const: life_support }
          water_recovery: { type: number, x-unit: "1", description: "the share of the water people give off (waste water, breath, wash water) it recovers as drinking and washing water again; the rest is made up from the tanks. The ISS recovers about 0.9." }
          air_recovery: { type: number, x-unit: "1", description: "the share of the oxygen people breathe out as carbon dioxide it wins back; the rest is made up from the air store. The ISS recovers about 0.5." }
          persons: { type: integer, x-unit: "1", description: "how many people it keeps: air, water and warmth for this many" }
          cooling: { type: number, x-unit: "W", description: "W of the cabin's heat it carries away to the ship's heat path: the people's (need.food.heat a head) and their equipment's; it also dries the air" }
      - description: "A gun: a mass driver. The game fires it as its record says."
        type: object
        additionalProperties: false
        required: [kind]
        properties:
          kind: { const: gun }
          muzzle_speed: { type: number, x-unit: "m/s", description: "m/s its slug leaves at, against the ship" }
          rate: { type: number, x-unit: "1/s", description: "rounds a second, the trigger held" }
          slug_mass: { type: number, x-unit: "kg", description: "kg, one slug" }
          magazine: { type: integer, description: "rounds in a full magazine" }
      - description: "A laser. The game fires it as its record says: it heats while it fires, cools when it does not, and once too hot is locked out until it has cooled to its reset."
        type: object
        additionalProperties: false
        required: [kind]
        properties:
          kind: { const: laser }
          beam_power: { type: number, x-unit: "W", description: "W on the target, within its focus" }
          focus: { type: number, x-unit: "m", description: "m within which the beam holds together; past it, its power falls as the square of the distance" }
          range: { type: number, x-unit: "m", description: "m, the farthest it reaches" }
          burn: { type: number, x-unit: "s", description: "s of firing from cold to too hot" }
          cool: { type: number, x-unit: "s", description: "s to cool again" }
          reset: { type: number, x-unit: "1", description: "the share of too hot it must cool to, after overheating, before it fires again" }
      - description: "The anchor and excavator. Their figures are still in the engine's code."
        type: object
        additionalProperties: false
        required: [kind]
        properties:
          kind: { const: mining_rig }
          excavator_power: { type: number, x-unit: "W", description: "W its excavator cuts with" }
          throughput: { type: number, x-unit: "kg/s", description: "kg/s of spoil it can carry off, at most" }
          anchor_reach: { type: number, x-unit: "m", description: "m its anchor reaches from the hull" }
          anchor_speed: { type: number, x-unit: "m/s", description: "m/s: it holds if the ship drifts slower than this against the surface" }
      - description: "A way in and out through the hull, keeping the air in: two doors and a chamber between. Not in the game yet."
        type: object
        additionalProperties: false
        required: [kind]
        properties:
          kind: { const: airlock, x-in-game: "not made" }
          persons: { type: integer, x-unit: "1", description: "how many it cycles at once" }
          cycle: { type: number, x-unit: "s", description: "s for one cycle, in or out" }
          passage: { type: number, x-unit: "m", description: "m, the clear width of its doors" }
          air_lost: { type: number, x-unit: "kg", description: "kg of air lost to space each cycle, with its pumps run" }
      - description: "A ramp lowered to the ground for people or cargo. Not in the game yet."
        type: object
        additionalProperties: false
        required: [kind]
        properties:
          kind: { const: ramp, x-in-game: "not made" }
          load: { type: number, x-unit: "kg", description: "kg it bears" }
          width: { type: number, x-unit: "m", description: "m, clear" }
          reach: { type: number, x-unit: "m", description: "m it lets down to" }
      - description: "A platform lift between a bay and the ground, or deck to deck. Not in the game yet."
        type: object
        additionalProperties: false
        required: [kind]
        properties:
          kind: { const: cargo_lift, x-in-game: "not made" }
          load: { type: number, x-unit: "kg", description: "kg it lifts" }
          travel: { type: number, x-unit: "m", description: "m it moves through" }
      - description: "A door in the hull over a bay. Not in the game yet."
        type: object
        additionalProperties: false
        required: [kind]
        properties:
          kind: { const: bay_door, x-in-game: "not made" }
          width: { type: number, x-unit: "m", description: "m, the opening" }
          height: { type: number, x-unit: "m", description: "m" }
          opens_in: { type: number, x-unit: "s", description: "s to open or shut" }
      - description: "A docking collar or clamp: joins the ship to a station or another ship. Not in the game yet."
        type: object
        additionalProperties: false
        required: [kind]
        properties:
          kind: { const: docking, x-in-game: "not made" }
          passage: { type: number, x-unit: "m", description: "m, the clear way through (a collar); none for a clamp" }
          holds: { type: number, x-unit: "N", description: "N it takes along its axis before it lets go" }
          standard: { type: string, description: "the docking standard it mates to" }
      - description: "Moves bulk or cargo aboard: a scoop, a conveyor, an arm. Not in the game yet."
        type: object
        additionalProperties: false
        required: [kind]
        properties:
          kind: { const: handling, x-in-game: "not made" }
          throughput: { type: number, x-unit: "kg/s", description: "kg/s it moves at most" }
          reach: { type: number, x-unit: "m", description: "m, from its mount" }
      - description: "Throws heat into space from a hot surface. Not in the game yet."
        type: object
        additionalProperties: false
        required: [kind]
        properties:
          kind: { const: radiator, x-in-game: "not made" }
          rejects: { type: number, x-unit: "W", description: "W it throws off at its working temperature, both faces to deep space" }
          temperature: { type: number, x-unit: "K", description: "K, its working surface" }
          area: { type: number, x-unit: "m2", description: "m2 of panel, one face" }
      - description: "Passes heat from one loop to another. Not in the game yet."
        type: object
        additionalProperties: false
        required: [kind]
        properties:
          kind: { const: heat_exchanger, x-in-game: "not made" }
          transfers: { type: number, x-unit: "W", description: "W it passes at its design temperatures" }
      - description: "Pumps and piping that carry heat from what makes it to what throws it off. Not in the game yet."
        type: object
        additionalProperties: false
        required: [kind]
        properties:
          kind: { const: coolant_loop, x-in-game: "not made" }
          carries: { type: number, x-unit: "W", description: "W it carries" }
          flow: { type: number, x-unit: "kg/s", description: "kg/s of coolant" }
      - description: "Thermal mass that takes a burst of heat and gives it up slowly. Not in the game yet."
        type: object
        additionalProperties: false
        required: [kind]
        properties:
          kind: { const: heat_sink, x-in-game: "not made" }
          stores: { type: number, x-unit: "J", description: "J it takes over its working rise" }
      - description: "Holds a liquid or a gas that is not the ship's fuel: water, waste, liquid or gas cargo, air. (A fuel tank is `tank`, which the game runs.) Not in the game yet."
        type: object
        additionalProperties: false
        required: [kind]
        properties:
          kind: { const: store, x-in-game: "not made" }
          capacity: { type: number, x-unit: "kg", description: "kg it holds" }
          holds: { type: string, description: "What it is built to hold, by its key: a good, an element, or a market category (a food store holds market.food: any food stock)." }
          pressure: { type: number, x-unit: "Pa", description: "Pa it holds its contents at; none for a low-pressure liquid" }
      - description: "Moves liquid: fuel, water, coolant. Not in the game yet."
        type: object
        additionalProperties: false
        required: [kind]
        properties:
          kind: { const: pump, x-in-game: "not made" }
          flow: { type: number, x-unit: "kg/s", description: "kg/s" }
          head: { type: number, x-unit: "Pa", description: "Pa it pushes against" }
      - description: "Compresses gas into a store or out of one. Not in the game yet."
        type: object
        additionalProperties: false
        required: [kind]
        properties:
          kind: { const: compressor, x-in-game: "not made" }
          flow: { type: number, x-unit: "kg/s", description: "kg/s" }
          pressure: { type: number, x-unit: "Pa", description: "Pa it delivers" }
      - description: "A connection through the hull for taking fuel, water or air aboard, or giving it out. Not in the game yet."
        type: object
        additionalProperties: false
        required: [kind]
        properties:
          kind: { const: port, x-in-game: "not made" }
          flow: { type: number, x-unit: "kg/s", description: "kg/s through it" }
          reach: { type: number, x-unit: "m", description: "m a boom extends; none for a flush port" }
      - description: "A viewport in a pressure hull. Not in the game yet."
        type: object
        additionalProperties: false
        required: [kind]
        properties:
          kind: { const: window, x-in-game: "not made" }
          area: { type: number, x-unit: "m2", description: "m2 of glass" }
          pressure: { type: number, x-unit: "Pa", description: "Pa it holds" }
      - description: "Stores electric energy chemically: slower than a capacitor, far more of it. Not in the game yet."
        type: object
        additionalProperties: false
        required: [kind]
        properties:
          kind: { const: battery, x-in-game: "not made" }
          stores: { type: number, x-unit: "J", description: "J" }
          rate: { type: number, x-unit: "W", description: "W it gives or takes at most" }
      - description: "Makes power from sunlight. Not in the game yet."
        type: object
        additionalProperties: false
        required: [kind]
        properties:
          kind: { const: solar_array, x-in-game: "not made" }
          area: { type: number, x-unit: "m2", description: "m2 of cells" }
          output: { type: number, x-unit: "W", description: "W at Earth's sunlight, face on" }
          efficiency: { type: number, x-unit: "1", description: "the share of sunlight it turns to power" }
      - description: "Distributes power from plant to loads, and breaks a fault. Not in the game yet."
        type: object
        additionalProperties: false
        required: [kind]
        properties:
          kind: { const: switchgear, x-in-game: "not made" }
          carries: { type: number, x-unit: "W", description: "W through it" }
      - description: "Turn the ship by spinning wheels, without fuel. Not in the game yet."
        type: object
        additionalProperties: false
        required: [kind]
        properties:
          kind: { const: reaction_wheels, x-in-game: "not made" }
          torque: { type: number, x-unit: "N m", description: "N m it can apply" }
          momentum: { type: number, x-unit: "N m s", description: "N m s it stores before it must unload" }
      - description: "One landing leg: a strut that stops the ship over its stroke and holds it on the ground (SFO 15, Shock). A hull fits several, one to a gear slot. The game reckons legs from a hull's parts today (world::legs); from fitted gear once it reads this."
        type: object
        additionalProperties: false
        required: [kind, holds, stroke, efficiency, sink_rate]
        properties:
          kind: { const: landing_gear, x-in-game: "not made" }
          holds: { type: number, x-unit: "N", description: "N, the most one leg takes before it yields or buckles" }
          stroke: { type: number, x-unit: "m", description: "m its strut compresses over, stopping the ship" }
          efficiency: { type: number, x-unit: "1", description: "the share of the stroke that does work (an oleo strut: about 0.8)" }
          sink_rate: { type: number, x-unit: "m/s", description: "m/s, the touchdown it is designed for, at its design load" }
          extended: { type: number, x-unit: "m", description: "m from its mount to its pad, gear down" }
      - description: "Holds a gate's tube: one to a segment of a ring. Not in the game yet."
        type: object
        additionalProperties: false
        required: [kind]
        properties:
          kind: { const: throat_coil, x-in-game: "not made" }
      - description: "One engine unit (SFO 22): a jet of a given cycle, pointed where the design points it. Replaces the drive, lift and thruster families as roles a design gives engines. Not in the game yet."
        type: object
        additionalProperties: false
        required: [kind, cycle, thrust, exhaust, efficiency, burns, throttle, gimbal, isotropic_loss, shield_pass, heat_to_hull]
        properties:
          kind: { const: engine, x-in-game: "not made" }
          cycle: { $ref: "../../dictionary.schema.yaml#/definitions/engine_cycle" }
          thrust: { type: number, x-unit: "N", description: "N at full throttle" }
          exhaust: { type: number, x-unit: "m/s", description: "m/s, how fast the jet leaves; propellant flow is thrust / exhaust, jet power half their product" }
          efficiency: { type: number, x-unit: "1", description: "the share of the energy released (the fuel's) that goes into the jet; the rest leaves as heat and radiation" }
          burns: { type: string, x-ref: [material], description: "What releases the energy, by its key: the fusion fuel, the fission fuel's stand-in, the chemical propellant blend, or the gas itself." }
          propellant: { type: string, x-ref: [material], description: "The reaction mass thrown, where it is not the fuel: hydrogen for a fusion thermal or nuclear thermal engine." }
          throttle: { type: number, x-unit: "1", minimum: 0, maximum: 1, description: "the least thrust it holds steadily, as a share of full; 0: on or off only (pulsed)" }
          gimbal: { type: number, x-unit: "rad", description: "rad either way it can point its jet from its axis on its own gimbal; 0: fixed" }
          isotropic_loss: { type: number, x-unit: "1", description: "the share of the energy released that leaves the reaction in every direction (neutrons, X-rays, gamma), not with the jet: what a hull in its way takes" }
          shield_pass: { type: number, x-unit: "1", description: "the share of that loss its own shadow shield lets through toward the ship" }
          reaction_offset: { type: number, x-unit: "m", description: "m from the mount's face, aft, to where the loss originates; the hull's share of the sphere is reckoned from there" }
          heat_to_hull: { type: number, x-unit: "1", description: "the share of the jet's power that comes aboard as heat, for the budgets: isotropic_loss / efficiency x the hull's share of the sphere x shield_pass, plus the engine's own soak-back. The record's figure takes the hull's share as 0.05 (a hull-mounted engine); a design computes its own from its geometry and uses that instead." }
      - description: "A swivel that turns an engine unit through a large angle (vectored thrust): aft in flight, down to land. Far heavier than a gimbal; that is the trade. Not in the game yet."
        type: object
        additionalProperties: false
        required: [kind, turns, bears, slew]
        properties:
          kind: { const: swivel, x-in-game: "not made" }
          turns: { type: number, x-unit: "rad", description: "rad it turns through" }
          bears: { type: number, x-unit: "N", description: "N of thrust it carries through its bearing" }
          slew: { type: number, x-unit: "rad/s", description: "rad/s it turns at under load" }
      - description: "Where the ship is flown from: seats, controls and displays for its pilots. On the bridge, inside the pressurised space. Not in the game yet."
        type: object
        additionalProperties: false
        required: [kind, persons, g_rating, facing]
        properties:
          kind: { const: command_station, x-in-game: "not made" }
          persons: { type: integer, x-unit: "1", description: "how many it seats, at the controls" }
          g_rating: { type: number, x-unit: "m/s2", description: "m/s2, the most acceleration its seats are rated to hold a person through" }
          facing: { enum: [thrust, forward, any], description: "which way the seats face. thrust: backs to the main drive, so thrust pushes eyeballs-in (the usual). forward: along the ship's nose. any: they turn." }
      - description: "Where the crew sleep: bunks, lockers and the partition round them. In a cargo slot, as a cabin is. Not in the game yet."
        type: object
        additionalProperties: false
        required: [kind, persons]
        properties:
          kind: { const: berths, x-in-game: "not made" }
          persons: { type: integer, x-unit: "1", description: "how many it sleeps" }
      - description: "Where food is kept cold, heated and eaten. Not in the game yet."
        type: object
        additionalProperties: false
        required: [kind, persons]
        properties:
          kind: { const: galley, x-in-game: "not made" }
          persons: { type: integer, x-unit: "1", description: "how many it feeds, in turns" }
      - description: "Toilet and washing. Its water is the people's (need.washing); it sends the waste water to life support or the waste tank. Not in the game yet."
        type: object
        additionalProperties: false
        required: [kind, persons]
        properties:
          kind: { const: head, x-in-game: "not made" }
          persons: { type: integer, x-unit: "1", description: "how many it serves" }
      - description: "Fire detection and suppression for a pressurised room: detectors and an agent bottle. Not in the game yet."
        type: object
        additionalProperties: false
        required: [kind, protects]
        properties:
          kind: { const: fire_unit, x-in-game: "not made" }
          protects: { type: number, x-unit: "m3", description: "m3 of room one unit covers" }
      - description: "A hatch that holds cabin pressure across it, so a hole vents one compartment and not the ship. Not in the game yet."
        type: object
        additionalProperties: false
        required: [kind, passage, pressure]
        properties:
          kind: { const: pressure_door, x-in-game: "not made" }
          passage: { type: number, x-unit: "m", description: "m, the clear width of its opening" }
          pressure: { type: number, x-unit: "Pa", description: "Pa it holds across it, either way" }
      - description: "Pressure suits and the locker they hang in, with their air. Not in the game yet."
        type: object
        additionalProperties: false
        required: [kind, persons, endurance]
        properties:
          kind: { const: suit_locker, x-in-game: "not made" }
          persons: { type: integer, x-unit: "1", description: "how many suits" }
          endurance: { type: number, x-unit: "s", description: "s of air and power a suit carries" }
      - description: "A landing sensor: it measures the distance to the ground below. Not in the game yet."
        type: object
        additionalProperties: false
        required: [kind, range, accuracy]
        properties:
          kind: { const: altimeter, x-in-game: "not made" }
          range: { type: number, x-unit: "m", description: "m, the farthest ground it reads" }
          accuracy: { type: number, x-unit: "m", description: "m, how closely" }
      - description: "A camera the pilot sees by where there is no window: under the ship for the pads, aft for docking. Not in the game yet."
        type: object
        additionalProperties: false
        required: [kind, field_of_view]
        properties:
          kind: { const: camera, x-in-game: "not made" }
          field_of_view: { type: number, x-unit: "rad", description: "rad across its picture" }
  life: { type: number, x-unit: "s", description: "s in service before it is worn out and replaced; what it is made of comes back as scrap. Everything made has a life (the user's rule): this is what makes demand steady." }
  revision:
    $ref: "../../common.schema.yaml#/definitions/record_revision"
    default: { status: draft, owner: registry, on_conflict: propose, because: "First designs: weights from the game's early list, parts by the shares of one real design or chosen. Nothing is yet sized from what it must do.", ask: docs/registry-ssot-request.md }
  basis: { $ref: "../../common.schema.yaml#/definitions/basis" }
