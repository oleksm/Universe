$schema: http://json-schema.org/draft-07/schema#
title: Ship equipment
x-kind: [equipment]
description: "One piece of equipment a hull or a structure is fitted with. A maker's product. What it does is its `function`: the kind of device it is, and only that kind's figures."
type: object
additionalProperties: false
required: [identity, function, physical]
allOf:
  - { $ref: "../../common.schema.yaml#/definitions/physical_object" }
  - { properties: { physical: { required: [mass, volume] } } }
properties:
  identity:
    type: object
    additionalProperties: false
    required: [key, name, maker]
    properties:
      key: { $ref: "../../common.schema.yaml#/definitions/key" }
      traded_as: { type: string, x-ref: [market], description: "The market category it is traded as, by its key. Anything physical can be traded." }
      name: { type: string }
      maker: { type: string, x-ref: [org], description: "The maker whose product it is, by its key." }
      revision: { $ref: "../../common.schema.yaml#/definitions/revision" }
      slot: { $ref: "../../common.schema.yaml#/definitions/slot_kind" }
      description: { type: string }
  size_class: { type: integer, minimum: 1, maximum: 4, description: "Its size class, 1 to 4: it fits a slot at least as big." }
  physical: { $ref: "../../common.schema.yaml#/definitions/physical" }
  needs:
    type: object
    additionalProperties: false
    properties:
      power: { type: number, x-unit: "W", description: "W it draws, working" }
  built_of:
    description: "What it is built of."
    type: object
    additionalProperties: false
    properties:
      parts: { type: string, description: "The folder of parts (SFO 12) it is built of: SFO/metadata/parts/<folder>." }
  making: { $ref: "../../common.schema.yaml#/definitions/making" }
  function:
    description: "What it does: one kind of device, with that kind's figures. All in SI."
    oneOf:
      - description: "Makes power from the fuel it burns."
        type: object
        additionalProperties: false
        required: [kind, output, efficiency, burns]
        properties:
          kind: { const: power_plant }
          output: { type: number, x-unit: "W", description: "W it supplies" }
          efficiency: { type: number, x-unit: "1", description: "the share of its fuel's energy it turns to power; the rest is heat" }
          burns: { type: string, x-ref: [material], description: "The fuel it burns, by its key." }
      - description: "The main drive."
        type: object
        additionalProperties: false
        required: [kind, thrust, exhaust, efficiency, burns]
        properties:
          kind: { const: drive }
          thrust: { type: number, x-unit: "N", description: "N, of one nozzle at full share" }
          exhaust: { type: number, x-unit: "m/s", description: "m/s, how fast its exhaust leaves" }
          efficiency: { type: number, x-unit: "1", description: "the share of its fuel's energy that goes into the exhaust; the rest is heat" }
          burns: { type: string, x-ref: [material], description: "The fuel it burns, by its key." }
      - description: "Translation and attitude thrusters."
        type: object
        additionalProperties: false
        required: [kind, thrust, exhaust, efficiency, burns]
        properties:
          kind: { const: thrusters }
          thrust: { type: number, x-unit: "N", description: "N, of one nozzle at full share" }
          exhaust: { type: number, x-unit: "m/s", description: "m/s, how fast its exhaust leaves" }
          efficiency: { type: number, x-unit: "1", description: "the share of its fuel's energy that goes into the exhaust; the rest is heat" }
          burns: { type: string, x-ref: [material], description: "The fuel it burns, by its key." }
      - description: "The belly lift."
        type: object
        additionalProperties: false
        required: [kind, thrust, exhaust, efficiency, burns]
        properties:
          kind: { const: lift }
          thrust: { type: number, x-unit: "N", description: "N, of one nozzle at full share" }
          exhaust: { type: number, x-unit: "m/s", description: "m/s, how fast its exhaust leaves" }
          efficiency: { type: number, x-unit: "1", description: "the share of its fuel's energy that goes into the exhaust; the rest is heat" }
          burns: { type: string, x-ref: [material], description: "The fuel it burns, by its key." }
      - description: "Holds fuel."
        type: object
        additionalProperties: false
        required: [kind, capacity, holds]
        properties:
          kind: { const: tank }
          capacity: { type: number, x-unit: "kg", description: "kg it holds" }
          holds: { type: string, x-ref: [material], description: "What it holds, by its key." }
      - description: "Stores energy for bursts."
        type: object
        additionalProperties: false
        required: [kind, capacity, rate]
        properties:
          kind: { const: capacitor }
          capacity: { type: number, x-unit: "J", description: "J it stores" }
          rate: { type: number, x-unit: "W", description: "W it can take in or give out at most" }
      - description: "Holds cargo."
        type: object
        additionalProperties: false
        required: [kind, capacity]
        properties:
          kind: { const: rack }
          capacity: { type: number, x-unit: "kg", description: "kg it holds" }
      - description: "Seats for passengers, with their life support. It goes in a cargo slot."
        type: object
        additionalProperties: false
        required: [kind, seats]
        properties:
          kind: { const: cabin }
          seats: { type: integer, description: "how many it seats" }
      - description: "Holds a hyper-field round the ship."
        type: object
        additionalProperties: false
        required: [kind, efficiency, top_speed]
        properties:
          kind: { const: hyperdrive }
          efficiency: { type: number, x-unit: "1", description: "the share of its draw that goes into the field; the rest is heat" }
          top_speed: { type: number, x-unit: "m/s", description: "m/s, the fastest it can go" }
      - description: "Flies the ship by wire."
        type: object
        additionalProperties: false
        required: [kind, turn_rate, roll_rate]
        properties:
          kind: { const: flight_computer }
          turn_rate: { type: number, x-unit: "rad/s", description: "rad/s it lets the ship pitch and yaw at" }
          roll_rate: { type: number, x-unit: "rad/s", description: "rad/s it lets the ship roll at" }
      - description: "Sees other ships."
        type: object
        additionalProperties: false
        required: [kind, range]
        properties:
          kind: { const: sensors }
          resolves: { type: number, x-unit: "1", description: "for a survey: it makes out a rock at this many times the rock's size" }
          survey_range: { type: number, x-unit: "m", description: "m, the farthest a survey reaches" }
          range: { type: number, x-unit: "m", description: "m, how far it sees a ship" }
      - description: "A comm of the hypernet: a ship's, or a transceiver or terminal others connect to."
        type: object
        additionalProperties: false
        required: [kind, capture, link, lag, capacity]
        properties:
          kind: { const: comm }
          capture: { type: number, x-unit: "m", description: "m, how far it hears what happens" }
          link: { type: number, x-unit: "m", description: "m, how far it reaches another (the shorter of the two decides)" }
          lag: { type: number, x-unit: "s", description: "s to pass a message on" }
          capacity: { type: number, x-unit: "1/s", description: "messages a second" }
      - description: "Fitted to a gate ring: links its system's net to its twin's through the tube."
        type: object
        additionalProperties: false
        required: [kind, lag, capacity, cadence]
        properties:
          kind: { const: gate_relay }
          lag: { type: number, x-unit: "s", description: "s to handle a message" }
          capacity: { type: number, x-unit: "1/s", description: "messages a second" }
          cadence: { type: number, x-unit: "s", description: "s between its throws: capsules go by turns" }
      - description: "Links its site to others through hyperspace."
        type: object
        additionalProperties: false
        required: [kind, lag, capacity, cadence]
        properties:
          kind: { const: hyper_relay }
          lag: { type: number, x-unit: "s", description: "s to handle a message" }
          capacity: { type: number, x-unit: "1/s", description: "messages a second" }
          cadence: { type: number, x-unit: "s", description: "s between its throws: capsules go by turns" }
      - description: "Runs autopilots."
        type: object
        additionalProperties: false
        required: [kind, features, interlock, governor]
        properties:
          kind: { const: nav_computer }
          features: { type: array, items: { enum: [docking, landing, gate, follow, hyperdrive, route] }, description: "The autopilots it runs." }
          interlock: { type: number, x-unit: "m", description: "m: its hyperdrive interlock holds the ship no closer than this to a body's highest ground (0: none)" }
          governor: { type: number, x-unit: "1/s", description: "its hyperdrive governor: the ship's speed is held to this times the distance to the nearest surface (0: none)" }
      - description: "Says who the ship is."
        type: object
        additionalProperties: false
        required: [kind]
        properties:
          kind: { const: transponder }
      - description: "Air, water and warmth for the crew."
        type: object
        additionalProperties: false
        required: [kind]
        properties:
          kind: { const: life_support }
      - description: "A gun. Its figures are still in the engine's code."
        type: object
        additionalProperties: false
        required: [kind]
        properties:
          kind: { const: gun }
          muzzle_speed: { type: number, x-unit: "m/s", description: "m/s its slug leaves at, against the ship" }
          rate: { type: number, x-unit: "1/s", description: "rounds a second, the trigger held" }
          slug_mass: { type: number, x-unit: "kg", description: "kg, one slug" }
          magazine: { type: integer, description: "rounds in a full magazine" }
      - description: "A laser. Its figures are still in the engine's code."
        type: object
        additionalProperties: false
        required: [kind]
        properties:
          kind: { const: laser }
          beam_power: { type: number, x-unit: "W", description: "W on the target, within its focus" }
          focus: { type: number, x-unit: "m", description: "m within which the beam holds together; past it, its power falls as the square of the distance" }
          range: { type: number, x-unit: "m", description: "m, the farthest it reaches" }
          burn: { type: number, x-unit: "s", description: "s of firing from cold to too hot" }
          cool: { type: number, x-unit: "s", description: "s to cool again" }
      - description: "The anchor and excavator. Their figures are still in the engine's code."
        type: object
        additionalProperties: false
        required: [kind]
        properties:
          kind: { const: mining_rig }
          excavator_power: { type: number, x-unit: "W", description: "W its excavator cuts with" }
          throughput: { type: number, x-unit: "kg/s", description: "kg/s of spoil it can carry off, at most" }
          anchor_reach: { type: number, x-unit: "m", description: "m its anchor reaches from the hull" }
          anchor_speed: { type: number, x-unit: "m/s", description: "m/s: it holds if the ship drifts slower than this against the surface" }
      - description: "Holds a gate's tube: one to a segment of a ring. Not in the game yet."
        type: object
        additionalProperties: false
        required: [kind]
        properties:
          kind: { const: throat_coil, x-in-game: "not made" }
  revision:
    $ref: "../../common.schema.yaml#/definitions/record_revision"
    default: { status: draft, owner: registry, on_conflict: propose, because: "First designs: weights from the game's early list, parts by the shares of one real design or chosen. Nothing is yet sized from what it must do.", ask: docs/registry-ssot-request.md }
  basis: { $ref: "../../common.schema.yaml#/definitions/basis" }
