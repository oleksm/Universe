$schema: http://json-schema.org/draft-07/schema#
title: Interface
x-kind: [interface]
description: "standards/SFO/metadata/interfaces/<name>.yaml: a mating face as a standard (SFO 26). A port names the interface and its duty; a connection product names it and its rating. A product fits a port of the same interface that it brings the other half of, when its rating covers the duty."
type: object
additionalProperties: false
required: [identity, domain, kind, halves, make]
properties:
  identity:
    type: object
    additionalProperties: false
    required: [key, name]
    properties:
      key: { type: string, pattern: "^interface\\.[a-z0-9-]+$" }
      name: { type: string }
      description: { type: string }
  domain: { enum: [fluid, vacuum, bulk, molten, power, signal, heat, load, carrier, people], description: "What crosses it, broadly." }
  kind: { type: string, description: "Its family: flange, lined-flange, chute, belt-transfer, termination, bus-joint, hood, clamp-coupling, plug-socket, quick-coupling, bayonet, refuelling, docking-ring, coupler, twistlock, mount ..." }
  size: { type: number, exclusiveMinimum: 0, x-unit: "m", description: "Its nominal size: a bore, a belt's width, a mount's side" }
  area: { type: number, exclusiveMinimum: 0, x-unit: "m2", description: "A conductor's cross-section (a cable termination)" }
  envelope:
    type: object
    additionalProperties: false
    description: "The most a product built to it is made for: a port's duty must lie within it."
    properties:
      pressure: { type: number, minimum: 0, x-unit: "Pa" }
      temperature: { type: number, minimum: 0, x-unit: "K" }
      voltage: { type: number, minimum: 0, x-unit: "V" }
      current: { type: number, minimum: 0, x-unit: "A" }
      rate: { type: number, minimum: 0, x-unit: "kg/s" }
      mass: { type: number, minimum: 0, x-unit: "kg", description: "kg it bears (a mount) or carries (a carrier)" }
      force: { type: number, minimum: 0, x-unit: "N" }
      moment: { type: number, minimum: 0, x-unit: "N m" }
      tension: { type: number, minimum: 0, x-unit: "N", description: "A load joint: N it holds pulled apart along its axis" }
      compression: { type: number, minimum: 0, x-unit: "N", description: "A load joint: N it holds pressed together" }
      shear: { type: number, minimum: 0, x-unit: "N", description: "A load joint: N it holds across its axis" }
  stiffness:
    type: object
    additionalProperties: false
    description: "A load joint's springs, for sharing a load between redundant joints (docs/proposals/physical-mounts.md): a holder is a rigid body on joints of these stiffnesses."
    properties:
      axial: { type: number, exclusiveMinimum: 0, x-unit: "N/m", description: "Along its axis (the port's facing)" }
      shear: { type: number, exclusiveMinimum: 0, x-unit: "N/m", description: "Across its axis" }
  pitch: { type: number, exclusiveMinimum: 0, x-unit: "m", description: "A track's: the spacing of its stud holes along it; a link names a stud by its index from the port's `at`." }
  media: { type: array, items: { enum: [gas, liquid, bulk, power, signal, heat, load, carrier, people] }, description: "What may cross it." }
  sealing: { enum: [open, air, double, vacuum, cryogenic], description: "How tight it is: open (nothing held), air, double (two seals, the space between watched, for airless ground), vacuum, cryogenic." }
  halves: { enum: [male-female, androgynous], description: "Its two halves differ (a plug and its socket) or are the same (a flange pair, a docking ring)." }
  make: { enum: [permanent, bolted, manual, automatic, open], description: "How a joint to it is made and broken." }
  contacts:
    type: array
    description: "The contacts in its mating face (a plug's pins), by id, as the standard or the registry numbers them: what a port's pins map to. Electrical and signal interfaces only."
    items:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id: { type: string, description: "The contact's name in the face (A, B, 1, PE)" }
        size: { type: number, exclusiveMinimum: 0, x-unit: "m2", description: "The largest conductor it takes" }
        note: { type: string }
  keys: { type: array, items: { type: string }, description: "The keyings its halves are cut to, where one face is made in variants that must not meet (an HV DC pole: plus and minus; a single-pole connector: L1, L2, L3, N, PE): a port names its key, and two halves mate only at the same key." }
  face: { type: object, additionalProperties: false, properties: { length: { type: number, x-unit: "m" }, width: { type: number, x-unit: "m" }, height: { type: number, x-unit: "m" } }, description: "The mated joint's outside, its axis along height: what a port must leave room for." }
  standard: { type: string, description: "The real standard it follows, if any (EN 1092-1, IEC 60309, ISO 1161)." }
  basis: { $ref: "../../common.schema.yaml#/definitions/basis" }
