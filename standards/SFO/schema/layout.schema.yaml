$schema: http://json-schema.org/draft-07/schema#
title: Ship layout
description: "How a hull's inside is divided: its decks, its compartments and the openings between them. Positions are metres back from the nose, above the keel and from the centre line (starboard positive), as for parts. A box is [aft from, aft to, up from, up to, side from, side to]."
type: object
additionalProperties: false
required: [identity, compartments]
properties:
  identity:
    type: object
    additionalProperties: false
    required: [hull]
    properties:
      hull: { type: string, description: "The hull it lays out (its file name under hulls)." }
      description: { type: string }
  decks:
    description: "Its levels, numbered from the bottom."
    type: array
    items:
      type: object
      additionalProperties: false
      required: [number]
      properties:
        number: { type: integer }
        name: { type: string }
  compartments:
    description: "Its spaces. Each has a purpose and an address, and is sealed (pressurised) or not. Its volume and floor area are worked out from its boxes."
    type: array
    items:
      type: object
      additionalProperties: false
      required: [name, function, address, boxes]
      properties:
        name: { type: string }
        function: { enum: [cockpit, quarters, galley, restroom, corridor, shaft, airlock, cargo, ore, stores, workshop, avionics, life-support, tanks, reactor, hyperdrive, engines, machinery] }
        address:
          description: "Its address in the ship (SFO 9): deck, section, unit."
          type: object
          additionalProperties: false
          required: [deck, section, unit]
          properties:
            deck: { type: integer }
            section: { type: string }
            unit: { type: integer }
        pressurised: { type: boolean, description: "Held at cabin pressure." }
        boxes:
          type: array
          items: { type: array, items: { type: number }, minItems: 6, maxItems: 6 }
  openings:
    description: "The ways between compartments (or to the outside), each on a face the two share: its kind, the middle of its sill, its clear width and height (m), and whether it seals. Doors are in walls; hatches, chutes, ramps and windows (up to the hull's glass) in floors and ceilings, where `at` is the opening's middle, `width` is across the ship and `height` along it."
    type: array
    items:
      type: object
      additionalProperties: false
      required: [kind, between, at, width, height]
      properties:
        kind: { enum: [door, pressure-door, hatch, cargo-hatch, chute, ramp, window] }
        between: { type: array, items: { type: string }, minItems: 2, maxItems: 2, description: "The two compartments it joins (or outside)." }
        at: { type: array, items: { type: number }, minItems: 3, maxItems: 3 }
        width: { type: number, description: m }
        height: { type: number, description: m }
        seals: { type: boolean, description: "It closes airtight." }
  basis:
    description: 'Where its figures come from. Each entry covers the groups (or group.property) it names. sourced: from a published source or the game, named. derived: worked out from other figures. invented: chosen, to be balanced or replaced.'
    type: array
    items:
      type: object
      additionalProperties: false
      required: [of, tier]
      properties:
        of: { type: array, items: { type: string } }
        tier: { enum: [sourced, derived, invented] }
        source: { type: string }
        note: { type: string }
        review: { type: boolean, description: "A guess put in so the figure is there: to be reviewed." }
