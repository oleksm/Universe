$schema: http://json-schema.org/draft-07/schema#
title: Hull
description: 'One hull. What it is made of: its parts, in parts/<its file name>/.'
type: object
additionalProperties: false
required: [identity]
properties:
  identity:
    type: object
    additionalProperties: false
    required: [key, name]
    properties:
      key: { $ref: "../../common.schema.yaml#/definitions/key" }
      name: { type: string }
      maker: { type: string, x-ref: [org], description: "The maker whose product it is, by its key." }
      class: { type: string, description: "What it is built for: mining ship, hauler, courier..." }
      revision: { $ref: "../../common.schema.yaml#/definitions/revision" }
      description: { type: string }
  physical: { $ref: "../../common.schema.yaml#/definitions/physical" }
  capacity:
    description: What it can take aboard.
    type: object
    additionalProperties: false
    properties:
      hold_volume: { type: number, x-unit: "m3", description: "m3, the space of its hold" }
      hold: { type: number, x-unit: "kg", description: "kg, the most cargo it is rated to carry" }
      fuel: { type: number, x-unit: "kg", description: "kg of fuel its tanks hold, as fitted" }
  fit:
    description: The equipment it is fitted with when it is built.
    type: array
    items:
      type: object
      additionalProperties: false
      required: [slot, item]
      properties:
        slot: { type: string, description: The slot of the hull it sits in. }
        item: { type: string, x-ref: [equipment], description: "The equipment (SFO 16), by its key." }
        nozzles: { type: integer, minimum: 1, description: "For a drive or lift: how many nozzles of the hull it feeds, each at full share." }
  making:
    type: object
    additionalProperties: false
    properties:
      process: { type: string, x-ref: [process], description: "The process that assembles it from its parts, by its key." }
      fitting_out: { type: string, x-ref: [process], description: "The process that fits it with its equipment, by its key." }
  design:
    description: What it is designed to stand. Its parts' gauges are checked against these.
    type: object
    additionalProperties: false
    properties:
      lands: { enum: [empty, loaded], description: "Whether it sets down with its hold full. empty: it unloads in orbit, and its legs and lift are for the ship without its cargo." }
      loaded_mass: { type: number, x-unit: "kg", description: "kg, the ship loaded, in the game: hull, fitted modules, fuel and cargo" }
      main_thrust: { type: number, x-unit: "N", description: "N, of its main drive in the game" }
      lift_thrust: { type: number, x-unit: "N", description: "N, of its lift nozzles in the game" }
      thrust_path: { type: array, items: { type: string, x-ref: [part] }, description: "The parts its main drive's push passes through, from the engine forward, by key. Each is checked against it." }
      landing_speed: { type: number, x-unit: "m/s", description: "m/s, the touchdown its legs are designed for. What they take at most is worked out." }
      cabin_pressure: { type: number, x-unit: "Pa", description: "Pa, of the air its pressurised parts hold against vacuum" }
      safety_factor: { type: number, description: "how many times its load a part must take before it yields" }
      pressure_factor: { type: number, description: "a further factor on cabin pressure" }
      strut_efficiency: { type: number, description: "the share of a landing leg's stroke that does work" }
      minimum_gauge: { type: number, x-unit: "m", description: "m, the thinnest skin used where no load says more" }
  open_questions:
    description: What is not settled about it. Kept with the hull so it is not forgotten.
    type: array
    items: { type: string }
  basis: { $ref: "../../common.schema.yaml#/definitions/basis" }
