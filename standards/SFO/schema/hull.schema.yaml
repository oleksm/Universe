$schema: http://json-schema.org/draft-07/schema#
title: Hull
x-kind: [hull]
description: 'One hull. What it is made of: its parts, in parts/<its file name>/.'
type: object
additionalProperties: false
required: [identity, slots, flight]
allOf:
  - { $ref: "../../common.schema.yaml#/definitions/physical_object" }
  - { properties: { physical: { required: [volume, length, width, height] } } }
properties:
  identity:
    type: object
    additionalProperties: false
    allOf: [{ $ref: "../../common.schema.yaml#/definitions/product_identity" }]
    required: [key, name]
    properties:
      class: { type: string, description: "What it is built for: mining ship, hauler, courier..." }
  physical: { $ref: "../../common.schema.yaml#/definitions/physical" }
  capacity:
    description: What it can take aboard.
    type: object
    additionalProperties: false
    properties:
      hold_volume: { type: number, x-unit: "m3", description: "m3, the space of its hold" }
      hold: { type: number, x-unit: "kg", description: "kg, the most cargo it is rated to carry" }
      fuel: { type: number, x-unit: "kg", description: "kg of fuel its tanks hold, as fitted" }
  model: { type: string, description: "Its model: a file of the game's (assets/models/<name>.glb). Its nozzles, mounts, gear and hatch are named nodes in it." }
  model_sha256: { type: string, pattern: '^[a-f0-9]{64}$', description: "Exact model bytes to which authored mechanism poses and exit markers bind; required with mechanisms or exits. Import refuses a mismatch." }
  mechanisms:
    type: array
    description: "Hull-owned rigid node states, in the exact exported model frame. Discrete poses only; no swept-motion or load qualification."
    items: { $ref: "#/definitions/mechanism" }
  exits:
    type: array
    description: "Explicit crew exits. Requirements are opened in order and closed in reverse. No legacy teleport fallback when explicit exits exist but none is usable."
    items: { $ref: "#/definitions/exit" }
  visual: { $ref: "../../common.schema.yaml#/definitions/visual" }
  model_requests: { type: array, items: { $ref: "../../common.schema.yaml#/definitions/model_request" }, description: "Work asked of its installed model, open until a later version answers it." }
  shape: { type: string, description: "For a hull with no model file: its shape, a key in the game's shapes.ron." }
  slots:
    description: "Its slots: what can be fitted to it, and how big."
    type: array
    items:
      type: object
      additionalProperties: false
      required: [name, kind, size]
      properties:
        name: { type: string, description: "The slot's name on this hull (hardpoint_1). A fit and a thruster name it." }
        kind: { $ref: "../../common.schema.yaml#/definitions/slot_kind" }
        size: { type: integer, minimum: 1, maximum: 4, description: "Its size class: it takes equipment of this class or smaller." }
        mount: { type: string, x-ref: [mount], description: "The mount the slot offers (SFO 19), by its key: what fits it, fits here." }
        clocking: { type: array, items: { type: number, x-unit: rad }, description: "The turns of its mount's clocking this slot allows, about its mount_<slot> node's z (absent: all of them)." }
        role: { enum: [main, lift, attitude], description: "For an engine slot: what the engine fitted here does for the ship. Its spec says how it must point." }
        spec: { type: array, items: { $ref: "../../common.schema.yaml#/definitions/spec_limit" }, description: "This slot's limits beyond its mount's: what a product fitted here, at this place on this hull, must meet." }
  thrusters:
    description: "Nozzles built into the hull itself, each driven by the equipment in one of its slots at a share of its thrust: the early stock hulls only. A slot hull has none: a fitted engine's nozzles are its own (equipment nozzles)."
    type: array
    items:
      type: object
      additionalProperties: false
      required: [nozzle, slot, share]
      properties:
        nozzle: { type: string, description: "The nozzle: a node of its model, by name." }
        slot: { type: string, description: "The slot whose equipment drives it, by the slot's name." }
        share: { type: number, x-unit: "1", minimum: 0, maximum: 1, description: "the share of that equipment's thrust it gives" }
  spec:
    description: "What the ship as fitted must meet (ship.* parameters): the hull's own limits on top of its slots' specs."
    type: array
    items: { $ref: "../../common.schema.yaml#/definitions/spec_limit" }
  flight:
    description: "What the engine flies and breaks it by, that its parts do not say yet."
    type: object
    additionalProperties: false
    properties:
      radius: { type: number, x-unit: "m", description: "m, the sphere it is taken as when things are checked for hitting it" }
      drag_area: { type: number, x-unit: "m2", description: "m2, its drag coefficient times its frontal area" }
      hull_strength: { type: number, x-unit: "J", description: "J that wreck it" }
      frame_material: { type: string, x-ref: [material], description: "What its frame is made of, by its key: what its strength is to be worked out from, where no figure is given." }
  built_of:
    description: "What it is built of."
    type: object
    additionalProperties: false
    properties:
      parts: { type: string, description: "The folder of parts (SFO 12) it is built of: SFO/metadata/parts/<folder>." }
  fit:
    description: The equipment it is fitted with when it is built.
    type: array
    items:
      type: object
      additionalProperties: false
      required: [slot, item]
      properties:
        slot: { type: string, description: The slot of the hull it sits in. }
        item: { type: string, x-ref: [equipment], description: "The equipment (SFO 16), by its key." }
        nozzles: { type: integer, minimum: 1, description: "For a drive or lift: how many nozzles of the hull it feeds, each at full share." }
        pose: { type: string, enum: [rest], description: "Explicitly draw this fitted instance at its motion package default-scene rest pose, with motion held. Only valid for equipment whose installed visual package declares motion. No gimbal, articulation or physical qualification is implied; absent retains consumer refusal." }
        clock: { type: number, x-unit: rad, description: "Its turn about the slot's mating normal: one the mount, slot and product all allow (SFO 19 mating; absent: 0)." }
  making: { $ref: "../../common.schema.yaml#/definitions/making" }
  design:
    description: What it is designed to stand. Its parts' gauges are checked against these.
    type: object
    additionalProperties: false
    properties:
      lands: { enum: [empty, loaded], description: "Whether it sets down with its hold full. empty: it unloads in orbit, and its legs and lift are for the ship without its cargo." }
      loaded_mass: { type: number, x-unit: "kg", description: "kg, the ship loaded, in the game: hull, fitted modules, fuel and cargo" }
      main_thrust: { type: number, x-unit: "N", description: "N, of its main drive in the game" }
      lift_thrust: { type: number, x-unit: "N", description: "N, of its lift nozzles in the game" }
      thrust_path: { type: array, items: { type: string, x-ref: [part] }, description: "The parts its main drive's push passes through, from the engine forward, by key. Each is checked against it." }
      landing_speed: { type: number, x-unit: "m/s", description: "m/s, the touchdown its legs are designed for. What they take at most is worked out." }
      cabin_pressure: { type: number, x-unit: "Pa", description: "Pa, of the air its pressurised parts hold against vacuum" }
      leak_rate: { type: number, x-unit: "kg/s/m3", description: "kg/s of air lost for each m3 of pressurised volume, through seals and the wall, by design. The space station leaks about 0.27 kg a day over its 916 m3: 3.4e-9 kg/s/m3 (from memory of NASA's figures; its 2019 onward Zvezda leak was several times that). Review." }
      safety_factor: { type: number, x-unit: "1", description: "how many times its load a part must take before it yields" }
      pressure_factor: { type: number, x-unit: "1", description: "a further factor on cabin pressure" }
      strut_efficiency: { type: number, x-unit: "1", description: "the share of a landing leg's stroke that does work" }
      minimum_gauge: { type: number, x-unit: "m", description: "m, the thinnest skin used where no load says more" }
  open_questions:
    description: What is not settled about it. Kept with the hull so it is not forgotten.
    type: array
    items: { type: string }
  life: { type: number, x-unit: "s", description: "s in service before it is worn out and replaced; what it is made of comes back as scrap. Everything made has a life (the user's rule): this is what makes demand steady." }
  revision:
    $ref: "../../common.schema.yaml#/definitions/record_revision"
    default: { status: draft, owner: registry, on_conflict: propose, because: "An early rough hull, unless its record says otherwise.", ask: docs/registry-ssot-request.md }
  basis: { $ref: "../../common.schema.yaml#/definitions/basis" }
definitions:
  local_key:
    type: string
    pattern: '^[a-z][a-z0-9_]*$'
  node_name:
    type: string
    minLength: 1
    description: Exact unique node name in the selected exported scene.
  node_pose:
    oneOf:
    - type: object
      additionalProperties: false
      required: [node, kind]
      properties:
        node: { $ref: "#/definitions/node_name" }
        kind: { const: rest }
    - type: object
      additionalProperties: false
      required: [node, kind, translation_m, rotation_xyzw]
      properties:
        node: { $ref: "#/definitions/node_name" }
        kind: { const: rigid }
        translation_m: { type: array, minItems: 3, maxItems: 3, items: { type: number }, x-unit: m, description: "Absolute parent-local target translation, replacing exported local translation; not a delta or world position." }
        rotation_xyzw: { type: array, minItems: 4, maxItems: 4, items: { type: number }, x-unit: "1", description: "Absolute parent-local unit quaternion [x,y,z,w], replacing exported local rotation. Norm tolerance 1e-6 is representation tolerance only; no silent normalization. No scale or shear." }
  mechanism:
    type: object
    additionalProperties: false
    required: [key, kind, nodes, states, default, deploys_when]
    properties:
      key: { $ref: "#/definitions/local_key" }
      kind: { type: string, enum: [ramp, hatch, ladder, gear, door] }
      nodes:
        type: array
        minItems: 1
        items: { $ref: "#/definitions/node_name" }
        description: "Owned nodes; no node belongs to two mechanisms. Each state poses each node once; hierarchy evaluates once after all local targets are applied."
      states:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required: [key, poses]
          properties:
            key: { $ref: "#/definitions/local_key" }
            poses:
              type: array
              minItems: 1
              items: { $ref: "#/definitions/node_pose" }
      default: { $ref: "#/definitions/local_key" }
      deploys_when: { type: string, enum: [landed, always, pilot], description: "Automatic policies target deployed. Gear uses deployed on landed placement and stowed in flight. A refused contact keeps the preceding state." }
      contact:
        type: object
        additionalProperties: false
        required: [node, ground]
        properties:
          node: { $ref: "#/definitions/node_name" }
          ground: { type: string, enum: [required], description: "Engine checks this marker in the candidate deployed pose against standable terrain at current attitude before committing state. Engine gap/slope rules are gameplay limits, not engineering compliance." }
  exit:
    type: object
    additionalProperties: false
    required: [key, kind, requires, top]
    properties:
      key: { $ref: "#/definitions/local_key" }
      kind: { type: string, enum: [walk, climb, step] }
      requires:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required: [mechanism, state]
          properties:
            mechanism: { $ref: "#/definitions/local_key" }
            state: { $ref: "#/definitions/local_key" }
      top: { $ref: "#/definitions/node_name" }
      foot: { $ref: "#/definitions/node_name" }
