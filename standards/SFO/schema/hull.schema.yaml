$schema: http://json-schema.org/draft-07/schema#
title: Hull
description: 'One hull. What it is made of: its parts, in parts/<its file name>/.'
type: object
additionalProperties: false
required: [identity]
properties:
  identity:
    type: object
    additionalProperties: false
    required: [name]
    properties:
      name: { type: string }
      description: { type: string }
  size:
    type: object
    additionalProperties: false
    properties:
      length: { type: number, description: m }
      width: { type: number, description: m }
      height: { type: number, description: m }
      volume: { type: number, description: "m3, the space its shape takes" }
  mass:
    type: object
    additionalProperties: false
    properties:
      frame: { type: number, description: "t, the bare hull with nothing fitted" }
  design:
    description: What it is designed to stand. Its parts' gauges are checked against these.
    type: object
    additionalProperties: false
    properties:
      loaded_mass: { type: number, description: "t, the ship loaded, in the game: hull, fitted modules, fuel and cargo" }
      main_thrust: { type: number, description: "MN, of its main drive in the game" }
      lift_thrust: { type: number, description: "MN, of its lift nozzles in the game" }
      landing_speed: { type: number, description: "m/s, the touchdown its legs are designed for. What they take at most is worked out." }
      cabin_pressure: { type: number, description: "kPa, of the air its pressurised parts hold against vacuum" }
      safety_factor: { type: number, description: "how many times its load a part must take before it yields" }
      pressure_factor: { type: number, description: "a further factor on cabin pressure" }
      strut_efficiency: { type: number, description: "the share of a landing leg's stroke that does work" }
      minimum_gauge: { type: number, description: "mm, the thinnest skin used where no load says more" }
  basis:
    description: 'Where its figures come from. Each entry covers the groups (or group.property) it names. sourced: from a published source or the game, named. derived: worked out from other figures, by physics or from the model. invented: chosen, to be balanced or replaced.'
    type: array
    items:
      type: object
      additionalProperties: false
      required: [of, tier]
      properties:
        of: { type: array, items: { type: string } }
        tier: { enum: [sourced, derived, invented] }
        source: { type: string }
        note: { type: string }
        review: { type: boolean, description: "A guess put in so the figure is there: to be reviewed." }
