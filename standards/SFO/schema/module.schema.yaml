$schema: http://json-schema.org/draft-07/schema#
title: Industrial module
description: One standard piece of industrial plant. It performs one step of a process. Any one module uses only some of these properties.
type: object
additionalProperties: false
required: [identity]
definitions:
  amounts:
    type: array
    items:
      type: object
      additionalProperties: false
      properties:
        item: { type: string, description: "An element's symbol or a material's file name." }
        name: { type: string, description: What it is, where the registry has no record of it. }
        amount: { type: number, description: "t per t of its product" }
properties:
  identity:
    type: object
    additionalProperties: false
    required: [name, step]
    properties:
      name: { type: string }
      step: { type: string, description: The step it performs. }
      description: { type: string }
  size:
    type: object
    additionalProperties: false
    properties:
      length: { type: number, description: m }
      width: { type: number, description: m }
      height: { type: number, description: m }
  rate:
    type: object
    additionalProperties: false
    properties:
      throughput: { type: number, description: "t/h of its product, at full rate" }
      batch: { type: number, description: "t in one batch" }
      holds: { type: number, description: "t it can store" }
      product: { type: string, description: What its throughput counts. }
  inputs:
    type: object
    additionalProperties: false
    properties:
      materials: { $ref: "#/definitions/amounts", description: "What goes in, t per t of its product." }
  outputs:
    type: object
    additionalProperties: false
    properties:
      by_products: { $ref: "#/definitions/amounts", description: "What else comes out, t per t of its product." }
  needs:
    type: object
    additionalProperties: false
    properties:
      power: { type: number, description: "MW, at full rate" }
  basis:
    type: object
    additionalProperties: false
    properties:
      note: { type: string, description: Where its figures come from. }
