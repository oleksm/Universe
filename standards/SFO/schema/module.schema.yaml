$schema: http://json-schema.org/draft-07/schema#
title: Industrial module
x-kind: [module]
description: One standard piece of industrial plant. It performs one step of a process. Any one module uses only some of these properties.
type: object
additionalProperties: false
required: [identity, physical]
definitions:
  amounts:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [item, quantity]
      properties:
        item: { type: string, x-ref: [element, material, good, stock, part], description: "What it is, by its key." }
        quantity: { type: number, x-unit: "1", description: "kg of it for each kg of what the recipe makes" }
        from: { enum: [stock, place], description: "For what goes in: where it is taken from. stock (the default): the works' store. place: where the module stands, for one under the open sky: the world's own air, rain or ground water. A world that has none of it cannot give it." }
properties:
  identity:
    type: object
    additionalProperties: false
    required: [key, name, step]
    properties:
      key: { $ref: "../../common.schema.yaml#/definitions/key" }
      name: { type: string }
      step: { type: string, description: The step it performs. }
      description: { type: string }
  physical: { $ref: "../../common.schema.yaml#/definitions/physical" }
  capacity:
    description: "For one that stores or handles: what it can hold and move."
    type: object
    additionalProperties: false
    properties:
      holds: { type: number, x-unit: "kg", description: "kg it can store" }
      volume: { type: number, x-unit: "m3", description: "m3 it can store" }
      stores: { type: array, items: { type: string }, description: "The kinds of goods it stores, by the game's keys (content/base/goods.ron)." }
      handling: { type: number, x-unit: "kg/s", description: "kg/s it can move in or out" }
  site: { enum: [enclosed, open sky], description: "Where it stands. enclosed (the default): under a roof, or sealed; it runs the same anywhere. open sky: on open ground, under a world's sun and weather, which it lives by." }
  climate:
    description: "For a sealed module that must hold its inside at a temperature: what that is. All the power its recipe draws ends as heat inside and has to be got out. Where outside is colder, the heat runs out by itself; where it is hotter, it is pumped uphill, and that takes power on top: heat x (outside - inside) / (inside x efficiency)."
    type: object
    additionalProperties: false
    properties:
      holds: { type: number, x-unit: "K", description: "K it holds inside" }
      efficiency: { type: number, x-unit: "1", description: "its heat pumps' share of the best physics allows (Carnot's)" }
  recipes:
    description: "What it can be set to make: each one thing, with what that takes. A module with one recipe makes one thing and needs no choosing; one with several is set to one of them at a time (its setup, which is the game's state, not written here)."
    type: array
    items:
      type: object
      additionalProperties: false
      required: [makes, inputs, rate, power]
      properties:
        makes: { type: string, x-ref: [element, material, good, stock, part, hull, gate, equipment, module], description: "What it makes, by its key." }
        does: { type: string, description: "What happens in it, set to this." }
        inputs: { $ref: "#/definitions/amounts", description: "What goes in. Nothing is made of nothing: a recipe has at least one." }
        outputs: { $ref: "#/definitions/amounts", description: "What else comes out." }
        rate: { type: number, x-unit: "kg/s", description: "kg/s of what it makes, at full rate, set to this" }
        batch: { type: number, x-unit: "kg", description: "kg in one batch" }
        power: { type: number, x-unit: "W", description: "W it draws at full rate, set to this" }
        changeover:
          description: "What it costs to set it to this from another of its recipes."
          type: object
          additionalProperties: false
          properties:
            time: { type: number, x-unit: "s", description: "s it stands while it is changed over" }
            loss: { type: number, x-unit: "kg", description: "kg of its first output lost" }
  throughput:
    description: "For a shop module (one that cuts, machines, welds or assembles whatever it is given): how much it can put through. It has no recipes of its own. Its recipes are the parts, hulls and gates that name it as the module that makes them: what goes in is what each is made from."
    type: object
    additionalProperties: false
    required: [rate]
    properties:
      rate: { type: number, x-unit: "kg/s", description: "kg/s of what it is making, at full rate" }
      power: { type: number, x-unit: "W", description: "W it draws at full rate" }
  generation:
    description: "For one that makes power: what it supplies and what it burns to do it. It makes no item, so it is not a recipe."
    type: object
    additionalProperties: false
    required: [supplies]
    properties:
      supplies: { type: number, x-unit: "W", description: "W it supplies at full output" }
      burns:
        description: "What it burns at full output."
        type: array
        items:
          type: object
          additionalProperties: false
          required: [item, rate]
          properties:
            item: { type: string, x-ref: [element, material, good], description: "What it burns, by its key." }
            rate: { type: number, x-unit: "kg/s", description: "kg/s of it at full output" }
  needs:
    description: "For one with no recipe: what it draws all the time."
    type: object
    additionalProperties: false
    properties:
      power: { type: number, x-unit: "W", description: "W" }
  revision:
    $ref: "../../common.schema.yaml#/definitions/record_revision"
    default: { status: review, owner: registry, on_conflict: propose, because: "Recipes balance by mass and rest on sourced figures where its basis says so; sizes and rates are mostly chosen.", ask: docs/registry-ssot-request.md }
  basis: { $ref: "../../common.schema.yaml#/definitions/basis" }
