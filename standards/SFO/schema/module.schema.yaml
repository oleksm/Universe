$schema: http://json-schema.org/draft-07/schema#
title: Industrial module
description: One standard piece of industrial plant. It performs one step of a process. Any one module uses only some of these properties.
type: object
additionalProperties: false
required: [identity]
definitions:
  amounts:
    type: array
    items:
      type: object
      additionalProperties: false
      properties:
        item: { type: string, x-ref: [element, material, good], description: "An element, a material or a good, by its key." }
        amount: { type: number, description: "t per t of its product (per MWh, for one that makes power)" }
properties:
  identity:
    type: object
    additionalProperties: false
    required: [key, name, step]
    properties:
      key: { $ref: "../../common.schema.yaml#/definitions/key" }
      name: { type: string }
      step: { type: string, description: The step it performs. }
      description: { type: string }
  size:
    type: object
    additionalProperties: false
    properties:
      length: { type: number, x-unit: "m", description: m }
      width: { type: number, x-unit: "m", description: m }
      height: { type: number, x-unit: "m", description: m }
  rate:
    type: object
    additionalProperties: false
    properties:
      throughput: { type: number, x-unit: "kg/s", description: "kg/s of its product, at full rate" }
      batch: { type: number, x-unit: "kg", description: "kg in one batch" }
      holds: { type: number, x-unit: "kg", description: "kg it can store" }
      volume: { type: number, x-unit: "m3", description: "m3 it can store" }
      stores: { type: array, items: { type: string }, description: "The kinds of goods it stores, by the game's keys (content/base/goods.ron)." }
      handling: { type: number, x-unit: "kg/s", description: "kg/s it can move in or out" }
      product: { type: string, x-ref: [element, material, good], description: "What its throughput counts: an element, a material or a good, by its key." }
      power: { type: number, x-unit: "W", description: "W it supplies, for one that makes power" }
  inputs:
    type: object
    additionalProperties: false
    properties:
      materials: { $ref: "#/definitions/amounts", description: "What goes in, t per t of its product." }
  outputs:
    type: object
    additionalProperties: false
    properties:
      by_products: { $ref: "#/definitions/amounts", description: "What else comes out, t per t of its product." }
  needs:
    type: object
    additionalProperties: false
    properties:
      power: { type: number, x-unit: "W", description: "W, at full rate" }
  basis: { $ref: "../../common.schema.yaml#/definitions/basis" }
