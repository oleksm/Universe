$schema: http://json-schema.org/draft-07/schema#
title: Good
x-kind: [good]
description: A good is not sold. What is sold is stock, an item made from it (SFO/metadata/stock), which names its market category; a good that names one does not fit. Something that moves in bulk through industry and is neither an element nor a finished material. Rock as it is dug, raw matter won from it, what is used up, what one step hands to the next, what comes out besides the product.
type: object
additionalProperties: false
required: [identity]
allOf:
  - { $ref: "../../common.schema.yaml#/definitions/physical_object" }
  - { properties: { physical: { required: [bulk_density] } } }
properties:
  identity:
    type: object
    additionalProperties: false
    required: [key, name, kind]
    properties:
      key: { $ref: "../../common.schema.yaml#/definitions/key" }
      name: { type: string }
      kind: { enum: [rock, raw, consumable, fuel, intermediate, product, by-product], description: 'rock: dug as it lies. raw: won from a rock, what industry starts from.' }
      description: { type: string }
  physical: { $ref: "../../common.schema.yaml#/definitions/physical" }
  composition:
    description: What a rock is made of, each part's share by mass. A part is an element or a good, by its key.
    type: array
    items:
      type: object
      additionalProperties: false
      required: [part, share]
      properties:
        part: { type: string, x-ref: [element, good] }
        share: { type: number, x-unit: "1", minimum: 0, maximum: 1 }
  source:
    description: Where a rock is found, or what a raw good is won from.
    type: object
    additionalProperties: false
    properties:
      occurs: { enum: [asteroids, rocky planets and moons, temperate planets], description: "For a rock: where in the universe it is found. Temperate planets: rocky, with air and liquid water." }
      won_from: { type: string, x-ref: [good], description: "For a raw good: the rock it is won from, by its key." }
      yield: { type: number, x-unit: "1", minimum: 0, maximum: 1, description: "t of it won from each t of that rock" }
      note: { type: string }
  game:
    type: object
    additionalProperties: false
    properties:
      ore: { type: string, description: "For a rock: the game's ore it is (content/base/ores.ron), dug from asteroids by mining ships." }
  life: { type: number, x-unit: "s", description: "s a made thing lasts in use before it is worn out and must be made again" }
  revision:
    $ref: "../../common.schema.yaml#/definitions/record_revision"
    default: { status: review, owner: registry, on_conflict: propose, because: "What it is is settled by the recipes that make and use it; its figures are as its basis says.", ask: docs/registry-ssot-request.md }
  waste: { type: boolean, description: "True of what comes out of a works as a by-product nobody has asked for: slag, red mud, tailings, waste water, carbon dioxide. A market may refuse it and a place charge to take it; a recipe that takes it in is a taker (the Takers report). Left out: not waste." }
  basis: { $ref: "../../common.schema.yaml#/definitions/basis" }
