$schema: http://json-schema.org/draft-07/schema#
title: Good
description: Something that moves in bulk through industry and is neither an element nor a finished material. Rock as it is dug, raw matter won from it, what is used up, what one step hands to the next, what comes out besides the product.
type: object
additionalProperties: false
required: [identity]
properties:
  identity:
    type: object
    additionalProperties: false
    required: [name, kind]
    properties:
      name: { type: string }
      kind: { enum: [rock, raw, consumable, fuel, intermediate, product, by-product], description: 'rock: dug as it lies. raw: won from a rock, what industry starts from.' }
      description: { type: string }
  physical:
    type: object
    additionalProperties: false
    properties:
      bulk_density: { type: number, description: "t/m3, as stowed broken in a hold" }
  source:
    description: Where a rock is found, or what a raw good is won from.
    type: object
    additionalProperties: false
    properties:
      occurs: { enum: [asteroids, temperate planets], description: "For a rock: where in the universe it is found. Temperate planets: rocky, with air and liquid water." }
      won_from: { type: string, description: "For a raw good: the rock it is won from, by file name." }
      note: { type: string }
  game:
    type: object
    additionalProperties: false
    properties:
      goods: { type: string, description: "The kind of goods it is in the game's markets (content/base/goods.ron)." }
      ore: { type: string, description: "For a rock: the game's ore it is (content/base/ores.ron), dug from asteroids by mining ships." }
  basis:
    description: 'Where its figures come from. Each entry covers the groups (or group.property) it names. sourced: from a published source or the game, named. derived: worked out from other figures, by physics or from the model. invented: chosen, to be balanced or replaced.'
    type: array
    items:
      type: object
      additionalProperties: false
      required: [of, tier]
      properties:
        of: { type: array, items: { type: string } }
        tier: { enum: [sourced, derived, invented] }
        source: { type: string }
        note: { type: string }
