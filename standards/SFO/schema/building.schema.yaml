$schema: http://json-schema.org/draft-07/schema#
title: Building
x-kind: [building]
description: "standards/SFO/metadata/buildings/<name>.yaml: a building people live in or are served in, and not a works: a dwelling block, a clinic, a school. What it is, how much floor it gives, which needs of how many people it meets, and who works in it. What it is built of is its weight for now; where one stands is a settlement's to say."
type: object
additionalProperties: false
required: [identity, floor, per_people]
allOf:
  - { $ref: "../../common.schema.yaml#/definitions/physical_object" }
  - { properties: { physical: { required: [mass, length, width, height] } } }
properties:
  identity:
    type: object
    additionalProperties: false
    required: [key, name, description]
    properties:
      key: { $ref: "../../common.schema.yaml#/definitions/key" }
      name: { type: string }
      description: { type: string }
  physical: { $ref: "../../common.schema.yaml#/definitions/physical" }
  floor: { type: number, x-unit: "m2", description: "m2 of floor, all storeys together" }
  storeys: { type: number, x-unit: "1", description: "how many floors" }
  per_people: { type: integer, minimum: 1, description: "One of it to this many people of a settlement: a settlement's buildings follow from its population by this (tools/standards/census.py), and its census from their staff. A settlement with fewer than a quarter of this many people has none." }
  meets:
    description: "The needs it meets, and of how many people at once. Left out where it meets no one need: a shop, an office, a yard are where people work and buy."
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [need, people]
      properties:
        need: { type: string, x-ref: [need], description: "The need, by its key." }
        people: { type: number, x-unit: "1", description: "how many people's need it meets" }
  trains:
    description: "For a school or college: the trades it teaches and how many it has places for at once. Its output a year is places over the trade's training time (profession.training.time)."
    type: array
    items:
      type: object
      additionalProperties: false
      required: [profession, places]
      properties:
        profession: { type: string, x-ref: [profession] }
        places: { type: integer, minimum: 1 }
  staff:
    description: "Who works in it."
    type: array
    items:
      type: object
      additionalProperties: false
      required: [profession, count]
      properties:
        profession: { type: string, x-ref: [profession], description: "The trade, by its key." }
        count: { type: number, x-unit: "1", description: "how many of that trade" }
  built_of:
    description: "What it is built of, as far as is known."
    type: array
    items:
      type: object
      additionalProperties: false
      required: [item, quantity]
      properties:
        item: { type: string, x-ref: [good, stock, material], description: "What goes into it, by its key." }
        quantity: { type: number, x-unit: "kg", description: "kg of it in the whole building" }
  life: { type: number, x-unit: "s", description: "s it is built to stand before it must be rebuilt" }
  revision:
    $ref: "../../common.schema.yaml#/definitions/record_revision"
    default: { status: draft, owner: registry, on_conflict: propose, because: "A first building of its kind, sized from one real example.", ask: docs/registry-ssot-request.md }
  basis: { $ref: "../../common.schema.yaml#/definitions/basis" }
