$schema: http://json-schema.org/draft-07/schema#
title: Part
x-kind: [part]
description: 'standards/SFO/metadata/parts/<hull>/<code>.yaml: the full specification of one part of a hull. A part made of other parts has them in the folder named after its code: parts/<hull>/<code>/<code>-NNN.yaml. Any one part uses only some of these properties.'
type: object
additionalProperties: false
required: [identity]
allOf:
  - { $ref: "../../common.schema.yaml#/definitions/physical_object" }
properties:
  identity:
    type: object
    additionalProperties: false
    required: [key, code, name]
    properties:
      key: { $ref: "../../common.schema.yaml#/definitions/key" }
      traded_as: { type: string, x-ref: [market], description: "The market category it is traded as, by its key. Anything physical can be traded." }
      code: { type: string, pattern: '^[A-Z0-9]+-[0-9]{2}(-[0-9]{3})?$', description: "The hull's code and its number among the hull's parts (MC07-04); for a part of a part, that part's code and its number in it (MC07-04-001). No two alike." }
      name: { type: string }
      description: { type: string }
      revision: { $ref: "../../common.schema.yaml#/definitions/revision" }
      designer: { type: string, pattern: '^brand\.[a-z0-9_]+$', description: The company that designed it. }
      standards: { type: array, items: { type: string }, description: "The standards it is built to, by id (SFO 9)." }
      interchangeable_with: { type: array, items: { type: string }, description: Other parts' codes that fit in its place. }
      drawing: { type: string, description: The drawing or model file that defines it. }

  physical: { $ref: "../../common.schema.yaml#/definitions/physical" }

  made_from: { $ref: "../../common.schema.yaml#/definitions/made_from" }

  shape:
    type: object
    additionalProperties: false
    properties:
      thickness: { type: number, x-unit: "m", description: "m, its wall or gauge" }
      surface_area: { type: number, x-unit: "m2", description: m2 }
      volume: { type: number, x-unit: "m3", description: "m3 of material" }
      centre_of_mass: { type: array, items: { type: number }, minItems: 3, maxItems: 3, x-unit: "m", description: "m, [x, y, z] in the part's own frame" }
      moment_of_inertia: { type: array, items: { type: number }, minItems: 3, maxItems: 3, x-unit: "kg m2", description: "kg m2, about its own x, y and z axes" }
      handed: { enum: [left, right, neither] }

  making: { $ref: "../../common.schema.yaml#/definitions/making" }

  fit:
    description: How it goes into the hull, or into the part it is a part of.
    type: object
    additionalProperties: false
    properties:
      count: { type: integer, minimum: 1, description: "How many of it there are: in one hull, or in the part it is a part of." }
      position: { type: string, description: Where in the assembly it sits. }
      order: { type: integer, minimum: 1, description: When it goes on, as the assembly is built. }
      joins_to: { type: array, items: { type: string }, description: The codes of the parts it is joined to. }
      joining: { type: array, items: { enum: [welded, brazed, bonded, bolted, riveted, sewn] }, description: How it is joined. }
      fasteners:
        description: What holds it, and how many.
        type: array
        items:
          type: object
          additionalProperties: false
          required: [kind, count]
          properties:
            kind: { type: string }
            count: { type: integer, minimum: 1 }
      connections: { type: array, items: { enum: [power, signal, fluid, air] }, description: What it carries across its joints. }

  limits:
    type: object
    additionalProperties: false
    properties:
      load_case: { enum: [pressure, landing], description: "The load its gauge is checked against: holding the cabin's air, or taking the landing." }
      design_load: { type: number, x-unit: "N", description: "N, the load it is built to carry" }
      safety_factor: { type: number, x-unit: "1", description: "how many times its design load it takes before it breaks" }
      pressure: { type: number, x-unit: "Pa", description: "Pa it holds" }
      fatigue_life: { type: number, x-unit: "1", description: "cycles of its design load" }
      failure: { enum: [critical, degraded, cosmetic], description: "What its failing means for the ship." }

  life:
    type: object
    additionalProperties: false
    properties:
      service_life: { type: number, x-unit: "s", description: "s in use before it is replaced" }
      inspection_interval: { type: number, x-unit: "s", description: "s of flight between inspections" }
      field_replaceable: { type: boolean, description: Can be changed without a yard. }
      repairable: { type: boolean, description: Can be mended, not only replaced. }
      recoverable: { type: number, x-unit: "1", minimum: 0, maximum: 1, description: "the share of its mass got back as material when it is scrapped" }
  revision:
    $ref: "../../common.schema.yaml#/definitions/record_revision"
    default: { status: draft, owner: registry, on_conflict: propose, because: "A first breakdown: weights by share, materials fitted to what the registry can make.", ask: docs/registry-ssot-request.md }
  basis: { $ref: "../../common.schema.yaml#/definitions/basis" }
