$schema: http://json-schema.org/draft-07/schema#
title: Plant unit
x-kind: [unit]
description: "standards/SFO/metadata/units/<name>.yaml: one piece of plant built to a plant mount (SFO 24), the works' counterpart of a ship's equipment. Its size and mass come from what it is built of; what it needs says what a layout must bring to it; the unit that does a process's work carries the recipe."
type: object
additionalProperties: false
required: [identity, size_class, physical, built_of]
allOf:
  - { $ref: "../../common.schema.yaml#/definitions/physical_object" }
  - { properties: { physical: { required: [length, width, height, mass] } } }
definitions:
  port:
    type: object
    additionalProperties: false
    required: [id, flow, medium, connector, at, facing]
    description: "One place where something goes in or comes out (SFO 25): a run's end joins it when both are built to the same connector."
    properties:
      id: { type: string, description: "Its name on the unit, unique there (gas-in, water-out, hv)." }
      flow: { enum: [in, out, both], description: "Which way what it carries goes at full rate: in, out, or both (a power port feeding and fed)." }
      medium: { enum: [gas, liquid, bulk, power] }
      item: { type: string, x-ref: [material, stock, good], description: "What it carries, by key; none for power." }
      rate: { type: number, minimum: 0, x-unit: "kg/s", description: "kg/s at the unit's rating" }
      power: { type: number, minimum: 0, x-unit: "W", description: "W through it at the unit's rating (a power port)" }
      pressure: { type: number, minimum: 0, x-unit: "Pa", description: "Pa inside it in service" }
      temperature: { type: number, minimum: 0, x-unit: "K", description: "K of what it carries" }
      voltage: { type: number, minimum: 0, x-unit: "V", description: "V between phases (a power port)" }
      connector: { type: string, x-ref: [connector], description: "The connector it is built to, by key." }
      at: { type: array, items: { type: number }, minItems: 3, maxItems: 3, x-unit: "m", description: "Its face's middle in the unit's frame (x along, y across from its middle, z up from its bay's floor)." }
      facing: { type: array, items: { type: number }, minItems: 3, maxItems: 3, x-unit: "1", description: "The way out of its face, a unit vector in the unit's frame: a run leaves it this way." }
      optional: { type: boolean, description: "A spare, blinded when nothing joins it: a pass-through a layout may leave unused." }
      note: { type: string }
properties:
  identity:
    type: object
    additionalProperties: false
    required: [key, name]
    properties:
      key: { $ref: "../../common.schema.yaml#/definitions/key" }
      name: { type: string }
      description: { type: string }
  size_class: { type: integer, minimum: 1, maximum: 4 }
  fits: { type: string, x-ref: [plant-mount], description: "The plant mount it is built to, by its key. A unit that rides a rail or hangs on a frame names none." }
  physical: { $ref: "../../common.schema.yaml#/definitions/physical", description: "Its size (length along the layout, width across, height above its bay) and its mass empty. mass is the sum of built_of." }
  built_of:
    description: "What it is made of: one line each, its mass worked out from the material and the dimensions the note gives."
    type: array
    items:
      type: object
      additionalProperties: false
      required: [what, item, mass]
      properties:
        what: { type: string }
        item: { type: string, x-ref: [material, stock, good], description: "What it is made of, by its key." }
        mass: { type: number, exclusiveMinimum: 0, x-unit: "kg" }
        note: { type: string, description: "How the mass was worked out." }
  holds: { type: number, minimum: 0, x-unit: "kg", description: "kg it holds in service (a charge, a bin's fill, water), on top of its mass; its bay bears both." }
  needs:
    type: object
    additionalProperties: false
    properties:
      power: { type: number, minimum: 0, x-unit: "W", description: "W it draws at full rate" }
      heat: { type: number, minimum: 0, x-unit: "W", description: "W of heat the layout's cooling loop must carry away from it" }
      water: { type: number, minimum: 0, x-unit: "kg/s", description: "kg/s of water it uses up" }
      gravity: { type: number, minimum: 0, x-unit: "m/s2", description: "m/s2, the least gravity it works in" }
      atmosphere: { enum: [any, air, vacuum], description: "What it needs round it. any (the default)." }
  rejects:
    type: object
    additionalProperties: false
    description: "What a cooling unit (a tower, a radiator field) can take off the layout's loop at full rate."
    properties:
      heat: { type: number, minimum: 0, x-unit: "W" }
      temperature: { type: number, minimum: 0, x-unit: "K", description: "The loop's temperature it is sized for." }
  recipes: { type: array, items: { $ref: "module.schema.yaml#/definitions/module_recipe" }, description: "What it can be set to make, as a module's recipes (SFO 10)." }
  envelope: { type: array, items: { type: array, items: { type: number }, minItems: 6, maxItems: 6 }, x-unit: "m", description: "Boxes [x0, y0, z0, x1, y1, z1] in its frame that hold its solid parts, measured on its model: what a fit check keeps runs out of (its whole box is coarser)." }
  shells:
    type: array
    description: "For a hollow unit whose inside runs pass through (a hall's section or head): its walls as shells, which a fit check keeps runs out of as it does the envelope's boxes."
    items:
      type: object
      additionalProperties: false
      required: [kind, at]
      properties:
        kind: { enum: [tube, dome], description: "tube: a shell along x, at [x0, x1, yc, zc, r_in, r_out]; dome: a head bulging toward +x from x0, at [x0, depth, yc, zc, r_in, r_out], `depth` deep on its axis." }
        at: { type: array, items: { type: number }, minItems: 6, maxItems: 6, x-unit: "m" }
  ports: { type: array, items: { $ref: "#/definitions/port" }, description: "Where what it takes comes in and what it gives goes out, each built to a connector (SFO 25)." }
  life: { type: number, x-unit: "s" }
  product: { type: string, x-ref: [product], description: "The product this unit is, as fitted: its model is the product's (or its family's generator's), sized as this unit is, with these options." }
  options: { type: array, items: { type: string }, description: "The product's option kits this unit carries, by their ids." }
  visual: { $ref: "../../common.schema.yaml#/definitions/visual" }
  revision:
    $ref: "../../common.schema.yaml#/definitions/record_revision"
    default: { status: draft, owner: registry, on_conflict: propose, because: "A trial unit (SFO 24): sized from material and dimensions, many of them from memory, marked in its basis.", ask: docs/proposals/modular-factories.md }
  basis: { $ref: "../../common.schema.yaml#/definitions/basis" }
