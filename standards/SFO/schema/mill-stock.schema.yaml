$schema: http://json-schema.org/draft-07/schema#
title: Mill stock
x-kind: [stock]
description: 'Stock: what lies in a store and is sold. Only stock, and the made things kept by the piece (parts, equipment, hulls), names a market category: a material or a good does not. standards/SFO/metadata/mill-stock/<code>.yaml: one item of mill stock: a material in a form and a size. standards/SFO/metadata/stock/<code>.yaml: a good in the form it is stocked and sold in. What a unit of it weighs is worked out from its material''s density. Its shape follows from its form and size, and the game draws it from them, with no model: a tube is round, its diameter outside and its wall; a bar is a solid round of its diameter; a box is a rectangular hollow section, width by height outside, and its wall; a forging named NODE is a ball of its diameter, hollow where a wall is given; an END forging is a cone as long as the tube it ends is wide, from the tube''s diameter to its bolt''s; a fastener is a hex bolt and nut, the bolt''s diameter by its length under the head; plate, sheet and panel are slabs of their thickness; a strut is its section (kit.section) between two END cones, node surface to node surface. Length, and a plate''s width, are as sold (mill lengths, sheet sizes).'
type: object
additionalProperties: false
required: [identity, made_from]
properties:
  identity:
    type: object
    additionalProperties: false
    required: [key, code, name, form]
    properties:
      key: { $ref: "../../common.schema.yaml#/definitions/key" }
      traded_as: { type: string, x-ref: [market], description: "The market category it is traded as, by its key. Anything physical can be traded." }
      code: { type: string, pattern: '^[A-Z0-9]+(-[A-Z0-9]+)+$', description: "Its code. No two alike." }
      name: { type: string }
      form: { type: string, description: "The form it comes in: one of its material's; for a good, how it is stocked (bulk)." }
      temper: { type: string, description: "Its heat treatment or temper (T6, quenched and tempered, annealed)." }
  tint: { type: array, items: { type: number, minimum: 0, maximum: 1 }, minItems: 3, maxItems: 3, x-unit: "1", description: "sRGB 0 to 1: the colour its package's contents are tinted (artistic, tools/standards/tints.py)" }
  package: { type: string, x-ref: [package], description: "The package it travels and lies in, by its key (tools/standards/packages.py assigns it): what the game draws where it lies, and what logistics counts." }
  made_from: { $ref: "../../common.schema.yaml#/definitions/made_from" }
  size:
    type: object
    additionalProperties: false
    properties:
      thickness: { type: number, x-unit: "m", description: "m, of sheet, plate or film" }
      length: { type: number, x-unit: "m", description: "m, as sold: a tube, bar or box sections mill length, a plates or sheets length, a bolts length under its head" }
      diameter: { type: number, x-unit: "m", description: "m, of bar, wire or tube (a tube's outside)" }
      wall: { type: number, x-unit: "m", description: "m, of a tube or a box section" }
      width: { type: number, x-unit: "m", description: "m, of a box section (outside), or a plates or sheets width as sold" }
      height: { type: number, x-unit: "m", description: "m, of a box section (outside)" }
  sandwich:
    description: "For a sandwich panel (form sandwich): two faces held apart by a core. The panel bends as a sandwich: stiffness from the faces apart (E_face * t_face * d^2 / 2 a metre of width, d the faces' centre spacing = core depth + face thickness), the face stress M / (t_face * d), the core in shear (V / (b * d) against its shear strength). Faces take their stiffness and strength from their material's record; the core's shear figures are on its own material record and repeated here, in the ribbon (weaker) direction. Mass a m2 = 2 faces + core + the bond."
    type: object
    additionalProperties: false
    required: [faces, core, bond]
    properties:
      faces:
        type: object
        additionalProperties: false
        required: [material, thickness]
        properties:
          material: { type: string, x-ref: [material], description: "The faces' material, by its key." }
          thickness: { type: number, x-unit: "m", description: "m, each face" }
      core:
        type: object
        additionalProperties: false
        required: [material, depth, density, shear_strength, shear_modulus]
        properties:
          material: { type: string, x-ref: [material], description: "The core, by its key (a honeycomb material)." }
          depth: { type: number, x-unit: "m", description: "m, the core's depth between the faces" }
          density: { type: number, x-unit: "kg/m3", description: "kg/m3 of the core as a block" }
          shear_strength: { type: number, x-unit: "Pa", description: "Pa, the core's shear strength in its weaker (W) direction" }
          shear_modulus: { type: number, x-unit: "Pa", description: "Pa, the core's shear modulus in its weaker (W) direction" }
      bond: { type: number, x-unit: "kg/m2", description: "kg/m2 of adhesive film, both faces" }
      mass_per_area: { type: number, x-unit: "kg/m2", description: "kg/m2 of the whole panel: 2 * face density * face thickness + core density * depth + bond" }
  kit:
    type: object
    description: "For a strut (form strut): a standard frame member sold whole, a length of its section with an END fitting fixed in each end and a bolt in each, ready to bolt to two nodes (the MERO joint; SFO 13). Its standard length is the module, node centre to node centre; the studio places it only where its two nodes are that far apart (tools/standards/frames.py)."
    additionalProperties: false
    required: [section, node, end, bolt, module, cut]
    properties:
      section: { type: string, x-ref: [stock], description: "The tube or bar it is cut from, by its key." }
      node: { type: string, x-ref: [stock], description: "The node it is made to meet at each end, by its key: the nearest it is drawn and checked against." }
      end: { type: string, x-ref: [stock], description: "The END fitting fixed in each end, by its key." }
      bolt: { type: string, x-ref: [stock], description: "The bolt in each END, by its key." }
      module: { type: number, x-unit: "m", description: "m, node centre to node centre: its standard length." }
      cut: { type: number, x-unit: "m", description: "m of its section: the module less the node's diameter and the two ENDs." }
  supplies:
    type: object
    additionalProperties: false
    required: [item]
    description: "The kit or empty package it supplies. Empty packaging is stock in its own right; it is not packed inside another copy of itself."
    properties:
      item: { type: string, x-ref: [run, connector, panel, adapter, package] }
      length: { type: number, exclusiveMinimum: 0, x-unit: "m", description: "m of the run in one" }
  physical: { $ref: "../../common.schema.yaml#/definitions/physical" }
  revision:
    $ref: "../../common.schema.yaml#/definitions/record_revision"
    default: { status: review, owner: registry, on_conflict: propose, because: "One gauge standing for all of its form: more gauges may be asked for.", ask: docs/registry-ssot-request.md }
  basis: { $ref: "../../common.schema.yaml#/definitions/basis" }
