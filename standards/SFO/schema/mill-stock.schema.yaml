$schema: http://json-schema.org/draft-07/schema#
title: Mill stock
description: 'standards/SFO/metadata/mill-stock/<code>.yaml: one item of mill stock: a material in a form and a size. What a unit of it weighs is worked out from its material''s density.'
type: object
additionalProperties: false
required: [identity, made_from]
properties:
  identity:
    type: object
    additionalProperties: false
    required: [key, code, name, form]
    properties:
      key: { $ref: "../../common.schema.yaml#/definitions/key" }
      code: { type: string, pattern: '^[A-Z0-9]+(-[A-Z0-9]+)+$', description: "Its code. No two alike." }
      name: { type: string }
      form: { type: string, description: "The form it comes in: one of its material's." }
      temper: { type: string, description: "Its heat treatment or temper (T6, quenched and tempered, annealed)." }
  made_from: { $ref: "../../common.schema.yaml#/definitions/made_from" }
  size:
    type: object
    additionalProperties: false
    properties:
      thickness: { type: number, x-unit: "m", description: "m, of sheet, plate or film" }
      diameter: { type: number, x-unit: "m", description: "m, of bar, wire or tube (a tube's outside)" }
      wall: { type: number, x-unit: "m", description: "m, of a tube" }
  physical: { $ref: "../../common.schema.yaml#/definitions/physical" }
  making: { $ref: "../../common.schema.yaml#/definitions/making" }
  basis: { $ref: "../../common.schema.yaml#/definitions/basis" }
