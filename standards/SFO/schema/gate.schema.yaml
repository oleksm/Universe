$schema: http://json-schema.org/draft-07/schema#
title: Stargate
description: One gate ring, a maker's product. A pair of them holds a tube open between two stars. What opening and holding the tube costs is worked out from the laws (config/dogma.ron, Tube).
type: object
additionalProperties: false
required: [identity]
properties:
  identity:
    type: object
    additionalProperties: false
    required: [name, key]
    properties:
      name: { type: string }
      key: { type: string, description: "Its key in the game (content/base/structures.ron)." }
      maker: { type: string, description: "The maker whose product it is, by its key in Maker House." }
      class: { type: integer, description: "Its class: a higher one spans further." }
      description: { type: string }
  size:
    type: object
    additionalProperties: false
    properties:
      opening: { type: number, description: "m, the diameter of the ring, and of the tube it holds" }
      thickness: { type: number, description: "m, how thick the ring's structure is" }
  performance:
    type: object
    additionalProperties: false
    properties:
      span: { type: number, description: "light years, the longest tube it can hold" }
      capture_speed: { type: number, description: "m/s, the fastest a ship may enter it" }
  built_of:
    type: object
    additionalProperties: false
    properties:
      parts: { type: string, description: "The folder of parts (SFO 12) its structure is built of." }
  fit:
    description: The equipment mounted on it.
    type: array
    items:
      type: object
      additionalProperties: false
      required: [item, count]
      properties:
        item: { type: string, description: "The equipment (SFO 16), by file name." }
        count: { type: integer, minimum: 1 }
  power:
    type: object
    additionalProperties: false
    properties:
      station: { type: string, description: "The industrial module (SFO 10) that powers it. How many it takes to hold its tube is worked out." }
  making:
    type: object
    additionalProperties: false
    properties:
      process: { type: string, description: "The process that assembles it where it is to stand, by file name." }
  basis: { $ref: "../../common.schema.yaml#/definitions/basis" }
