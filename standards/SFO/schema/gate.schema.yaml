$schema: http://json-schema.org/draft-07/schema#
title: Stargate
description: One gate ring, a maker's product. A pair of them holds a tube open between two stars. What opening and holding the tube costs is worked out from the laws (config/dogma.ron, Tube).
type: object
additionalProperties: false
required: [identity]
properties:
  identity:
    type: object
    additionalProperties: false
    required: [name, key]
    properties:
      name: { type: string }
      key: { type: string, description: "Its key in the game (content/base/structures.ron)." }
      maker: { type: string, description: "The maker whose product it is, by its key in Maker House." }
      class: { type: integer, description: "Its class: a higher one spans further." }
      description: { type: string }
  size:
    type: object
    additionalProperties: false
    properties:
      opening: { type: number, description: "m, the diameter of the ring, and of the tube it holds" }
      thickness: { type: number, description: "m, how thick the ring's structure is" }
  performance:
    type: object
    additionalProperties: false
    properties:
      span: { type: number, description: "light years, the longest tube it can hold" }
      capture_speed: { type: number, description: "m/s, the fastest a ship may enter it" }
  basis:
    description: 'Where its figures come from. Each entry covers the groups (or group.property) it names. sourced: from a published source or the game, named. derived: worked out from other figures. invented: chosen, to be balanced or replaced.'
    type: array
    items:
      type: object
      additionalProperties: false
      required: [of, tier]
      properties:
        of: { type: array, items: { type: string } }
        tier: { enum: [sourced, derived, invented] }
        source: { type: string }
        note: { type: string }
        review: { type: boolean, description: "A guess put in so the figure is there: to be reviewed." }
