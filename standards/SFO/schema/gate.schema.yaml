$schema: http://json-schema.org/draft-07/schema#
title: Stargate
x-kind: [gate]
description: One gate ring, a maker's product. A pair of them holds a tube open between two stars. What opening and holding the tube costs is worked out from the laws (config/dogma.ron, Tube).
type: object
additionalProperties: false
required: [identity]
properties:
  identity:
    type: object
    additionalProperties: false
    required: [name, key]
    properties:
      key: { $ref: "../../common.schema.yaml#/definitions/key" }
      traded_as: { type: string, x-ref: [market], description: "The market category it is traded as, by its key. Anything physical can be traded." }
      name: { type: string }
      maker: { type: string, x-ref: [org], description: "The maker whose product it is, by its key." }
      class: { type: integer, description: "Its class: a higher one spans further." }
      description: { type: string }
  size:
    type: object
    additionalProperties: false
    properties:
      opening: { type: number, x-unit: "m", description: "m, the diameter of the ring, and of the tube it holds" }
      thickness: { type: number, x-unit: "m", description: "m, how thick the ring's structure is" }
  performance:
    type: object
    additionalProperties: false
    properties:
      span: { type: number, x-unit: "m", description: "m, the longest tube it can hold" }
      capture_speed: { type: number, x-unit: "m/s", description: "m/s, the fastest a ship may enter it" }
  built_of:
    type: object
    additionalProperties: false
    properties:
      parts: { type: string, description: "The folder of parts (SFO 12) its structure is built of." }
  fit:
    description: The equipment mounted on it.
    type: array
    items:
      type: object
      additionalProperties: false
      required: [item, count]
      properties:
        item: { type: string, x-ref: [equipment], description: "The equipment (SFO 16), by its key." }
        count: { type: integer, minimum: 1 }
  power:
    type: object
    additionalProperties: false
    properties:
      station: { type: string, x-ref: [module], description: "The industrial module (SFO 10) that powers it. How many it takes to hold its tube is worked out." }
  making: { $ref: "../../common.schema.yaml#/definitions/making" }
  revision:
    $ref: "../../common.schema.yaml#/definitions/record_revision"
    default: { status: review, owner: registry, on_conflict: propose, because: "By Dogma's tube laws, which are invented.", ask: docs/registry-ssot-request.md }
  basis: { $ref: "../../common.schema.yaml#/definitions/basis" }
