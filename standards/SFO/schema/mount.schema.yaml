$schema: http://json-schema.org/draft-07/schema#
title: Mount
x-kind: [mount]
description: "standards/SFO/metadata/mounts/<slot>-s<class>.yaml: one mount, a standard between a hull and what is fitted to it (SFO 19). A hull's slot offers a mount; a piece of equipment fits one. The mount says the most the hull gives and bears there: the room, the weight, the thrust, the power and the cooling, the fuel, a nozzle's opening. Any equipment within those figures fits any hull that offers the mount: a maker builds to the mount, not to a hull."
type: object
additionalProperties: false
required: [identity, envelope, bears, attachment]
properties:
  identity:
    type: object
    additionalProperties: false
    required: [key, name, slot, size_class]
    properties:
      key: { $ref: "../../common.schema.yaml#/definitions/key" }
      name: { type: string }
      slot: { $ref: "../../common.schema.yaml#/definitions/slot_kind" }
      size_class: { type: integer, minimum: 1, maximum: 4, description: "Its size class, 1 to 4. A slot takes equipment of its class or smaller." }
      description: { type: string }
  envelope:
    description: "The most room a piece of equipment may take in it."
    type: object
    additionalProperties: false
    required: [length, width, height]
    properties:
      length: { type: number, exclusiveMinimum: 0, x-unit: "m", description: "m, along the ship" }
      width: { type: number, exclusiveMinimum: 0, x-unit: "m", description: "m, across" }
      height: { type: number, exclusiveMinimum: 0, x-unit: "m", description: "m, up" }
  bears:
    description: "The most the hull's structure takes at it."
    type: object
    additionalProperties: false
    required: [mass]
    properties:
      mass: { type: number, exclusiveMinimum: 0, x-unit: "kg", description: "kg, the heaviest equipment it carries" }
      thrust: { type: number, exclusiveMinimum: 0, x-unit: "N", description: "N, the most push one nozzle may put through it (a drive, thrusters or lift)" }
      recoil: { type: number, exclusiveMinimum: 0, x-unit: "N", description: "N, the most a weapon may kick against it, or a breaker push back on it" }
      hold: { type: number, exclusiveMinimum: 0, x-unit: "N", description: "N, the most a clamp or docking gear holds the ship by through it: what it grips with reaches the hull here" }
      landing: { type: number, exclusiveMinimum: 0, x-unit: "N", description: "N, the most a landing leg may put into it" }
      moment: { type: number, exclusiveMinimum: 0, x-unit: "N m", description: "N m, the most a piece held out on it (a boom) may bend it by" }
  attachment:
    description: "How what is fitted fastens to the hull: the points the load goes through, so that a frame can be built to the socket and a module strutted to it without a hull."
    type: object
    additionalProperties: false
    required: [points, pattern, each]
    properties:
      points: { type: integer, minimum: 1, description: "how many attachment points" }
      pattern: { enum: [corners, ring, saddles, trunnion], description: "corners: at the envelope's corners (8) or a face's (4). ring: evenly round the nozzle face. saddles: two bands round a tank, at the ends. trunnion: two bearings and a brace, a leg's." }
      each:
        description: "What one point takes, at most, with the mount's margin."
        type: object
        additionalProperties: false
        required: [tension, compression, shear]
        properties:
          tension: { type: number, exclusiveMinimum: 0, x-unit: "N" }
          compression: { type: number, exclusiveMinimum: 0, x-unit: "N" }
          shear: { type: number, exclusiveMinimum: 0, x-unit: "N" }
  holder: { enum: [deck, adapter], description: "What holds its equipment (docs/proposals/physical-mounts.md): a deck panel's track (small and light), or the mount's own cradle (adapter.<slot>-s<class>)." }
  sockets:
    description: "One per attachment point, written by tools/standards/mounting.py from the pattern, the envelope and the per-point loads: the female faces a holder offers and the equipment's feet meet. Mount frame: x along, y across, z up from the contact face, origin its middle."
    type: array
    items:
      type: object
      additionalProperties: false
      required: [id, at, facing, interface]
      properties:
        id: { type: string }
        at: { type: array, items: { type: number }, minItems: 3, maxItems: 3, x-unit: "m" }
        facing: { type: array, items: { type: number }, minItems: 3, maxItems: 3, x-unit: "1", description: "Out of the holder's face, toward the equipment" }
        interface: { type: string, x-ref: [interface] }
        connector: { type: string, x-ref: [stock, connector], description: "The fastener the registry joins it with (a bolt), by key" }
        key: { enum: [index], description: "The index socket: the equipment's index foot lands here, so only poses that keep it so are allowed." }
  feeds:
    description: "What the hull can bring near it, at most: a capacity for the ship's wiring and piping to plan by, never a connection. Fastening equipment to a mount joins nothing; power, data and fluids reach it only through its ports, joined by laid runs (SFO 26)."
    type: object
    additionalProperties: false
    properties:
      power: { type: number, exclusiveMinimum: 0, x-unit: "W", description: "W of electric power its line carries" }
      cooling: { type: number, exclusiveMinimum: 0, x-unit: "W", description: "W of heat the hull's loop carries away from it" }
      fuel: { type: number, exclusiveMinimum: 0, x-unit: "kg/s", description: "kg/s its fuel line carries" }
  nozzle:
    description: "For a drive, thrusters or lift: the opening in the hull a nozzle fires through."
    type: object
    additionalProperties: false
    properties:
      diameter: { type: number, exclusiveMinimum: 0, x-unit: "m", description: "m across, the most" }
  revision:
    $ref: "../../common.schema.yaml#/definitions/record_revision"
    default: { status: draft, owner: registry, on_conflict: propose, because: "A first standard, set so that today's equipment fits with a margin. Sized from the equipment list, not from a hull or a need.", ask: docs/registry-ssot-request.md }
  basis: { $ref: "../../common.schema.yaml#/definitions/basis" }
