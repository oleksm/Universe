$schema: http://json-schema.org/draft-07/schema#
title: Ship check
x-kind:
- ship-check
description: "standards/SFO/metadata/ship-checks/<name>.yaml: a check a hull or ship must pass (socket qualification, shipyard fit), its method and what it covers."
type: object
additionalProperties: false
required:
- identity
- status
- implementation
- owner
- sources
- method
- evidence
- failure
- scope
properties:
  identity:
    type: object
    additionalProperties: false
    required:
    - key
    - name
    - about
    properties:
      key:
        $ref: ../../common.schema.yaml#/definitions/key
      name:
        type: string
        minLength: 1
        description: Name of the workflow definition.
      about:
        type: string
        minLength: 1
        description: What this definition means; not a ship instance.
  status:
    enum:
    - draft
    - published
    - retired
  implementation:
    enum:
    - proposed
    - existing
    - mixed
    description: Whether the described capability exists; publishing a definition
      does not implement it.
  owner:
    enum:
    - owner
    - ships
    - registry
    - blender
    - engine
    - installer
    description: Responsible role; existing delegation still applies.
  sources:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required:
      - document
      - section
      properties:
        document:
          type: string
          minLength: 1
          description: Source URL or repository path.
        section:
          type: string
          minLength: 1
          description: Source section or anchor.
        note:
          type: string
          minLength: 1
          description: Scope, historical context or limits of the source.
  limitations:
    type: array
    minItems: 1
    items:
      type: string
      minLength: 1
    description: What this definition does not establish.
  rules:
    type: array
    items:
      type: string
      x-ref:
      - ship-rule
  method:
    type: array
    minItems: 1
    items:
      type: string
      minLength: 1
    description: How to perform the check; implementation may remain proposed.
  evidence:
    type: array
    minItems: 1
    items:
      type: string
      minLength: 1
    description: What proves the result for exact candidate inputs.
  failure:
    type: string
    minLength: 1
    description: What a failing or unavailable check blocks; how to retain witnesses.
  scope:
    enum:
    - requirements
    - visual
    - geometry
    - inhabitation
    - construction
    - motion
    - materials
    - export
    - assembly
    - runtime
    - release
    - recovery
    - dependencies
  coverage:
    type: string
    minLength: 1
    description: Coverage, sampling and qualification limits; never infer a stronger
      claim.
