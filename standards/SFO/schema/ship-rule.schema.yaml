$schema: http://json-schema.org/draft-07/schema#
title: Ship rule
x-kind:
- ship-rule
description: "standards/SFO/metadata/ship-rules/<name>.yaml: a rule every ship is held to or computed by (its blocks, its mass properties, its flight allocation), with its figures and conformance cases."
type: object
additionalProperties: false
required:
- identity
- status
- implementation
- owner
- sources
- statement
- applies_to
- verification
properties:
  identity:
    type: object
    additionalProperties: false
    required:
    - key
    - name
    - about
    properties:
      key:
        $ref: ../../common.schema.yaml#/definitions/key
      name:
        type: string
        minLength: 1
        description: Name of the workflow definition.
      about:
        type: string
        minLength: 1
        description: What this definition means; not a ship instance.
  status:
    enum:
    - draft
    - published
    - retired
  implementation:
    enum:
    - proposed
    - existing
    - mixed
    description: Whether the described capability exists; publishing a definition does not implement it.
  owner:
    enum:
    - owner
    - ships
    - registry
    - blender
    - engine
    - installer
    description: Responsible role; existing delegation still applies.
  sources:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required:
      - document
      - section
      properties:
        document:
          type: string
          minLength: 1
          description: Source URL or repository path.
        section:
          type: string
          minLength: 1
          description: Source section or anchor.
        note:
          type: string
          minLength: 1
          description: Scope, historical context or limits of the source.
  limitations:
    type: array
    minItems: 1
    items:
      type: string
      minLength: 1
    description: What this definition does not establish.
  rules:
    type: array
    items:
      type: string
      x-ref:
      - ship-rule
  statement:
    type: string
    minLength: 1
    description: Normative workflow requirement, within existing authorization.
  applies_to:
    type: array
    minItems: 1
    items:
      type: string
      minLength: 1
    description: Which authoring operations and artifacts this rule governs.
  verification:
    type: array
    minItems: 1
    items:
      type: string
      minLength: 1
    description: How compliance is established.
  related:
    type: array
    items:
      type: string
      x-ref:
      - ship-rule
      - ship-check
  blocks:
    type: array
    description: 'Structured requirements a tool reads: one need each, the slot kinds that meet it, whether a ship
      must carry it.'
    items:
      type: object
      additionalProperties: false
      required:
      - need
      - kinds
      - required
      properties:
        need:
          type: string
          minLength: 1
        kinds:
          type: array
          minItems: 1
          items:
            $ref: ../../dictionary.schema.yaml#/definitions/slot_kind
        also_by:
          enum:
          - main_engine
          - cold_gas_engine
          - lift_engine
          description: 'An engine-kind slot that stands in, by its role: main_engine (role main; not pressure-fed) for
            the drive, cold_gas_engine (role attitude; pressure-fed) for the thrusters, lift_engine (role lift) for
            lift.'
        required:
          type: boolean
          description: 'true: every ship must carry it to be commissioned (fly); false: optional.'
        note:
          type: string
  figures:
    type: array
    description: 'Named figures a computation the rule defines uses (constants), so no implementation holds its own copy.'
    items:
      type: object
      additionalProperties: false
      required:
      - name
      - value
      - unit
      properties:
        name:
          type: string
          minLength: 1
        value:
          type: number
          x-unit-from: unit
        unit:
          type: string
          minLength: 1
        note:
          type: string
  cases:
    type: array
    description: 'Conformance cases: a ship record (a hull and its fit) and the values the rule gives for it. Every implementation
      (the game, tools/standards) must reproduce each within its tolerance; a test on each side reads these.'
    items:
      type: object
      additionalProperties: false
      required:
      - ship
      - expect
      properties:
        ship:
          type: string
          x-ref:
          - ship
        note:
          type: string
        expect:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required:
            - of
            - value
            - tolerance
            properties:
              of:
                type: string
                minLength: 1
                description: A ship parameter (common.schema.yaml spec_limit), a vector one as .x/.y/.z.
              value:
                type: number
                x-unit-from: of
              tolerance:
                type: number
                minimum: 0
                x-unit-from: of
                description: How far an implementation may differ, absolute.
