$schema: http://json-schema.org/draft-07/schema#
title: Plant connector
x-kind: [connector]
description: "standards/SFO/metadata/connectors/<name>.yaml: a standard joint (SFO 25) between a port and a run's end, or two runs; it fixes the mating faces so any vendor's part fits. Its mass is the whole joint's, both halves."
type: object
additionalProperties: false
required: [identity, kind, size, physical, built_of]
allOf:
  - { $ref: "../../common.schema.yaml#/definitions/physical_object" }
  - { properties: { physical: { required: [length, width, height, mass], description: "The mated pair, both halves (a plug and its receptacle, two flanges): what a routed run counts at each of its ends. Equipment it plugs into counts none of it; its own looms and terminal hardware inside are the equipment's." } } }
properties:
  identity:
    type: object
    additionalProperties: false
    required: [key, name]
    properties:
      key: { $ref: "../../common.schema.yaml#/definitions/key" }
      name: { type: string }
      description: { type: string }
  kind:
    enum: [flange, lined-flange, chute, belt-transfer, termination, bus-joint, hood, clamp-coupling, quick-coupling, union, plug-socket, collector, cable-reel, valve, expansion-joint, twistlock, strut-clamp, run-clip, support-shoe]
    description: "What sort of joint it is."
    x-values:
      flange: "a bolted pipe or duct flange pair"
      lined-flange: "the same on a refractory-lined duct, the lining's joint packed"
      chute: "a sealed bolted chute flange for bulk solids (a lock's outlet into a closed conveyor)"
      belt-transfer: "a receiving chute and skirt where a belt's head discharges into a hopper or onto another belt"
      termination: "a power cable's end into a terminal box (lugs, stress cones, gland)"
      clamp-coupling: "a sealed clamped joint whose duct side draws back to let its outlet move"
      hood: "a fixed water-cooled catch hood over a moving outlet, a gap between them (no contact, no pressure)"
      bus-joint: "a bus's bolted joint to a unit's terminals, both poles, with the joint's water couplings"
      quick-coupling: "a hose coupling made and broken by hand (cam-lock, flat-face)"
      union: "a screwed hose union"
      plug-socket: "a power plug and its receiver, made and broken by hand"
      collector: "a moving machine's sliding shoes on a conductor rail"
      cable-reel: "a motor-driven reel paying out a machine's cable"
      valve: "a flanged valve set in a line between two flange joints"
      expansion-joint: "a flanged bellows taking a line's growth"
      twistlock: "a container corner's casting (female) or its twistlock (male)"
      strut-clamp: "a split collar clamped round a kit strut, joining a holder's fixing to the frame (docs/proposals/physical-mounts.md)"
      run-clip: "a cushioned loop holding one run, its tab bolted to a strut clamp's lug."
  size: { type: number, exclusiveMinimum: 0, x-unit: "m", description: "Its nominal size: a pipe's or duct's nominal bore (the steel's, for a lined duct), a chute's bore, a belt's width. For a termination, the conductor's cross-section in m2." }
  rating:
    type: object
    additionalProperties: false
    description: "What it holds at most."
    properties:
      pressure: { type: number, minimum: 0, x-unit: "Pa", description: "Pa across it, inside to outside (on airless ground the whole of the inside's pressure)" }
      temperature: { type: number, minimum: 0, x-unit: "K", description: "K at its faces" }
      voltage: { type: number, minimum: 0, x-unit: "V", description: "V between phases" }
      current: { type: number, minimum: 0, x-unit: "A", description: "A per phase (a bus joint: per pole)" }
      rate: { type: number, minimum: 0, x-unit: "kg/s", description: "kg/s of bulk it passes" }
      force: { type: number, minimum: 0, x-unit: "N", description: "N it holds (a container lock)" }
      tension: { type: number, minimum: 0, x-unit: "N", description: "A load joint: N pulled apart, square to the strut" }
      compression: { type: number, minimum: 0, x-unit: "N", description: "A load joint: N pressed together" }
      shear: { type: number, minimum: 0, x-unit: "N", description: "A load joint: N across, slipping along or round the strut" }
  stiffness:
    type: object
    additionalProperties: false
    description: "A load joint's springs, which the load-sharing model uses for this product (overriding its interface's)."
    properties:
      axial: { type: number, exclusiveMinimum: 0, x-unit: "N/m" }
      shear: { type: number, exclusiveMinimum: 0, x-unit: "N/m" }
  sealing: { enum: [single, double, open], description: "single: one gasket; double: two seals with the space between them watched for leaks (hydrogen, or any line to vacuum where a leak is lost for good); open: no seal (a belt's transfer)." }
  physical: { $ref: "../../common.schema.yaml#/definitions/physical", description: "The joint as fitted: its outside diameter (length and width) and its length along the run (height); its mass, both halves." }
  built_of:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [what, item, mass]
      properties:
        what: { type: string }
        item: { type: string, x-ref: [material, stock, good] }
        mass: { type: number, exclusiveMinimum: 0, x-unit: "kg" }
        note: { type: string }
  triangle_budget: { type: integer, minimum: 1000, description: "Triangles its model may have, where the kind's default (12,000) is too few: a joint of many tubes and bolts." }
  valve: { enum: [ball, butterfly, gate, check, relief], description: "A valve's type." }
  movement: { type: number, minimum: 0, x-unit: "m", description: "m an expansion joint takes each way along its line" }
  interface: { type: string, x-ref: [interface], description: "The interface it is built to (SFO 26): it fits any port built to the same, its rating covering the port's duty." }
  ports: { type: array, items: { $ref: "../../common.schema.yaml#/definitions/port" }, description: "Explicit mating faces of a multi-port connector instance. Each face takes one link; optional seats may be unused. Count the connector mass once, not once per link." }
  fixing: { type: string, x-ref: [interface], description: "A run clip's own fixing to the frame: the face its tab meets (a strut clamp's lug, interface.kit-clamp)." }
  provides: { enum: [both, male, female, adapter], description: "Which halves it is: both (a flange pair, a termination with its box's gland), one half, or an adapter between two interfaces." }
  template: { type: string, x-ref: [template], description: "The family template that draws it, scaled by its figures (SFO 25, 2026-10-17): it needs no model of its own." }
  visual: { $ref: "../../common.schema.yaml#/definitions/visual" }
  model_requests: { type: array, items: { $ref: "../../common.schema.yaml#/definitions/model_request" }, description: "Work asked of its installed model, open until a later version answers it." }
  looks_as: { type: string, x-ref: [connector], description: "Another connector of the same look (kind, size, material) whose model this one is drawn with; it wants no model of its own. Mass, rating and connector stay this record's." }
  revision:
    $ref: "../../common.schema.yaml#/definitions/record_revision"
    default: { status: draft, owner: registry, on_conflict: propose, because: "A trial standard (SFO 25): connectors sized by simple rules from pressure, size and material, not to a flange code.", ask: docs/proposals/factory-kit-assembly.md }
  basis: { $ref: "../../common.schema.yaml#/definitions/basis" }
