$schema: http://json-schema.org/draft-07/schema#
title: Plant product
x-kind: [product]
description: "standards/SFO/metadata/products/<name>.yaml: a made thing a vendor sells (a cooling tower, a transformer, an arc furnace vessel), with the parameters it is made to (cells, rating, capacity, span, pressure class) and the option kits it takes (sealing, gantry legs, tongs). A plant unit is a product as fitted in a layout, at its params and with its options; the product, or a family's generator and its pieces, is modelled once and every unit of it drawn from that. Written by tools/standards/plants.py."
type: object
additionalProperties: false
required: [identity, kind, units]
properties:
  identity:
    type: object
    additionalProperties: false
    required: [key, name]
    properties:
      key: { type: string, pattern: "^product\\.[a-z0-9-]+$" }
      name: { type: string }
      description: { type: string }
  kind: { enum: [family, product], description: "family: one generator sized by its params, built of pieces; product: one model, its variants set by params or option kits." }
  params:
    type: array
    description: "What a unit of it is made to."
    items:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string }
        unit: { type: string, description: "Its unit, if it has one: SI, or a count" }
        description: { type: string }
  pieces:
    type: array
    description: "A family's model pieces, which its generator repeats and scales by the params (a tower's cell, a crane's girder pair)."
    items:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id: { type: string }
        description: { type: string }
  options:
    type: array
    description: "Option kits a unit may carry, each modelled once and fitted to the product's base."
    items:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
  units: { type: array, items: { type: string, x-ref: [unit] }, description: "The units of it in the registry's layouts." }
  basis: { $ref: "../../common.schema.yaml#/definitions/basis" }
