# yaml-language-server: $schema=../../schema/product.schema.yaml
identity: {key: product.pressure-hall, name: Pressure hall, description: 'A tube hall of welded rings holding a gas at pressure on airless ground, built of sections and two heads.'}
kind: family
params:
- {name: diameter, unit: m}
- {name: sections, unit: count}
pieces:
- {id: section, description: a 30 m section}
- {id: head, description: a domed head with its nozzles and service panel}
units: [unit.pressure-hall-30m, unit.pressure-hall-30m-end]
basis:
- of: [kind, params, pieces, options]
  rule: rule.products-grouped-from-units
