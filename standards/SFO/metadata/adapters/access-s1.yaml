identity:
  key: adapter.access-s1
  name: Access cradle, class 1
  description: 'Holds what fits mount.access-s1 on a ship''s frame: 2 4340 tube 200 x 5 mm beams over the frame''s struts, 1 m or more apart, clamped at the middle of every 1 m, 5 cross tubes, the mount''s 8 sockets on top.'
offers: mount.access-s1
rating:
  tension: 2552000.0
  compression: 2552000.0
  shear: 1280000.0
physical:
  length: 3.22
  width: 3.2
  height: 0.45
  mass: 878.724
built_of:
- what: Beams
  item: material.high-strength-steel-4340
  mass: 143.466
  note: 2 hollow 4340 tubes 200 x 5 mm, 3 m; bottom raised 12 mm over fixing plates; measured from Blender cradle candidate-v01 final 48-segment mesh, 2026-10-19 mass-review.json; joint/load qualification pending
- what: Cross tubes
  item: material.high-strength-steel-4340
  mass: 703.472
  note: 5 hollow 4340 tubes 250 x 8 mm, at x [-1.485, -1.05, 0, 1.05, 1.485], fishmouth seats cut; socket face z 0.45 retained; measured from Blender cradle candidate-v01 final 48-segment mesh, 2026-10-19 mass-review.json; joint/load
    qualification pending
- what: Socket pads and inserts
  item: material.high-strength-steel-4340
  mass: 28.123
  note: 8 4340 pads, 42 mm thick, nominal 42 mm socket bores; detailed threads/inserts unqualified; measured from Blender cradle candidate-v01 final 48-segment mesh, 2026-10-19 mass-review.json; joint/load qualification pending
- what: Fixing lugs
  item: material.aluminium-alloy-6061
  mass: 3.663
  note: 6 6061 saddle lugs, top z 0.055, 12 mm bottom plates, 46 mm clearance bores for provisional M42 fixings; all fixing datums retained; measured from Blender cradle candidate-v01 final 48-segment mesh, 2026-10-19 mass-review.json;
    joint/load qualification pending
