# yaml-language-server: $schema=../../schema/adapter.schema.yaml
identity:
  key: adapter.tank-s2
  name: Tank cradle, class 2
  description: 'Holds what fits mount.tank-s2 on a ship''s frame: 2 4340 tube 250 x 5 mm beams over the frame''s struts, 1 m or more apart, clamped at the middle of every 1 m, 2 cross tubes, the mount''s 4 sockets on top.'
offers: mount.tank-s2
rating:
  tension: 2980000.0
  compression: 2980000.0
  shear: 1488000.0
physical:
  length: 7.0
  width: 7.25
  height: 0.5
  mass: 887.14
built_of:
- what: Beams
  item: material.high-strength-steel-4340
  mass: 422.94
  note: 2 of 4340 tube 250 x 5 mm, 7.0 m each
- what: Cross tubes
  item: material.high-strength-steel-4340
  mass: 422.94
  note: 2 of 4340 tube 250 x 5 mm, 7.0 m each at x [-3.263, 3.263]; untrimmed stock mass, fishmouth deductions pending
- what: Socket pads and inserts
  item: material.high-strength-steel-4340
  mass: 34.46
  note: 4 4340 pads, each an M56 insert; pad thickness 0.056 m, crosses lowered by that thickness with fishmouth seats to retain socket face z 0.5; joints unqualified
- what: Fixing lugs
  item: material.aluminium-alloy-6061
  mass: 6.8
  note: 14 6061 lugs, a strut clamp bolted to each
ports:
- {id: s1, flow: in, medium: load, interface: interface.insert-m56, half: female, make: bolted, at: [-3.2625, -3.2625, 0.5], facing: [0.0, 0.0, 1.0], optional: true}
- {id: s2, flow: in, medium: load, interface: interface.insert-m56, half: female, make: bolted, at: [3.2625, -3.2625, 0.5], facing: [0.0, 0.0, 1.0], optional: true}
- {id: s3, flow: in, medium: load, interface: interface.insert-m56, half: female, make: bolted, at: [3.2625, 3.2625, 0.5], facing: [0.0, 0.0, 1.0], optional: true}
