# yaml-language-server: $schema=../../schema/adapter.schema.yaml
identity:
  key: adapter.engine-s1c
  name: Engine cradle, class 1 compact
  description: 'Holds what fits mount.engine-s1c on a ship''s frame: 2 6061 tube 80 x 2 mm beams over the frame''s struts, 1 m or more apart, clamped at the middle of every 1 m, 7 cross tubes, the mount''s 8 sockets on top.'
offers: mount.engine-s1c
rating:
  tension: 34160.0
  compression: 34160.0
  shear: 17120.0
physical:
  length: 2.1
  width: 2.08
  height: 0.18
  mass: 30.9
built_of:
- what: Beams
  item: material.aluminium-alloy-6061
  mass: 5.29
  note: 2 of 6061 tube 80 x 2 mm, 2.0 m each
- what: Cross tubes
  item: material.aluminium-alloy-6061
  mass: 23.28
  note: 7 of 6061 tube 100 x 2 mm, 2.0 m each at x [-1.0, -0.594, -0.42, 0.0, 0.42, 0.594, 1.0]; untrimmed stock mass, fishmouth deductions pending
- what: Socket pads and inserts
  item: material.high-strength-steel-4340
  mass: 0.39
  note: 8 4340 pads, each an M10 insert; pad thickness 0.01 m, crosses lowered by that thickness with fishmouth seats to retain socket face z 0.18; joints unqualified
- what: Fixing lugs
  item: material.aluminium-alloy-6061
  mass: 1.94
  note: 4 6061 lugs, a strut clamp bolted to each
ports:
- {id: s1, flow: in, medium: load, interface: interface.insert-m10, half: female, make: bolted, at: [0.594, 0.0, 0.18], facing: [0.0, 0.0, 1.0], optional: true}
- {id: s2, flow: in, medium: load, interface: interface.insert-m10, half: female, make: bolted, at: [0.42, 0.42, 0.18], facing: [0.0, 0.0, 1.0], optional: true}
- {id: s3, flow: in, medium: load, interface: interface.insert-m10, half: female, make: bolted, at: [0.0, 0.594, 0.18], facing: [0.0, 0.0, 1.0], optional: true}
- {id: s4, flow: in, medium: load, interface: interface.insert-m10, half: female, make: bolted, at: [-0.42, 0.42, 0.18], facing: [0.0, 0.0, 1.0], optional: true}
- {id: s5, flow: in, medium: load, interface: interface.insert-m10, half: female, make: bolted, at: [-0.594, 0.0, 0.18], facing: [0.0, 0.0, 1.0], optional: true}
- {id: s6, flow: in, medium: load, interface: interface.insert-m10, half: female, make: bolted, at: [-0.42, -0.42, 0.18], facing: [0.0, 0.0, 1.0], optional: true}
- {id: s7, flow: in, medium: load, interface: interface.insert-m10, half: female, make: bolted, at: [-0.0, -0.594, 0.18], facing: [0.0, 0.0, 1.0], optional: true}
- {id: s8, flow: in, medium: load, interface: interface.insert-m10, half: female, make: bolted, at: [0.42, -0.42, 0.18], facing: [0.0, 0.0, 1.0], optional: true}
- {id: fix-1, flow: out, medium: load, interface: interface.kit-clamp, half: male, make: bolted, mass: 32.7, force: 8540.0, at: [-0.5, -1.0, 0.0], facing: [0.0, 0.0, -1.0]}
- {id: fix-2, flow: out, medium: load, interface: interface.kit-clamp, half: male, make: bolted, mass: 32.7, force: 8540.0, at: [0.5, -1.0, 0.0], facing: [0.0, 0.0, -1.0]}
- {id: fix-3, flow: out, medium: load, interface: interface.kit-clamp, half: male, make: bolted, mass: 32.7, force: 8540.0, at: [-0.5, 1.0, 0.0], facing: [0.0, 0.0, -1.0]}
- {id: fix-4, flow: out, medium: load, interface: interface.kit-clamp, half: male, make: bolted, mass: 32.7, force: 8540.0, at: [0.5, 1.0, 0.0], facing: [0.0, 0.0, -1.0]}
template: template.cradle
basis:
- of:
  - built_of
  - physical
  - ports
  tier: derived
  review: true
  note: 'By the cradle rule in tools/standards/mounting.py: tubes chosen for the mount''s points times 1.5 in bending (cross tubes 3.2 kN m, beams 1.6 kN m); fixings'' duty the mount''s mass and points shared evenly, a placeholder:
    a design''s duty comes from the stiffness model. Review-pending (docs/proposals/physical-mounts.md): chosen, not approved.'
- of:
  - rating
  tier: derived
  note: The mount's 8 points (mount.engine-s1c).
