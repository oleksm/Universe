identity:
  key: adapter.hyperdrive-s1
  name: Hyperdrive cradle, class 1
  description: 'Holds what fits mount.hyperdrive-s1 on a ship''s frame: 2 6061 tube 160 x 3 mm beams over the frame''s struts, 1 m or more apart, clamped at the middle of every 1 m, 5 cross tubes, the mount''s 8 sockets on top.'
offers: mount.hyperdrive-s1
