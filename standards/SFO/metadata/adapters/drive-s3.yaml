# yaml-language-server: $schema=../../schema/adapter.schema.yaml
identity:
  key: adapter.drive-s3
  name: Main drive cradle, class 3
  description: 'Holds what fits mount.drive-s3 on a ship''s frame: 13 4340 tube 200 x 5 mm beams over the frame''s struts, 1 m or more apart, clamped at the middle of every 1 m, 5 cross tubes, the mount''s 8 sockets on top.'
offers: mount.drive-s3
rating:
  tension: 3016000.0
  compression: 3016000.0
  shear: 1504000.0
physical:
  length: 12.13
  width: 12.2
  height: 0.45
  mass: 4841.21
built_of:
- what: Beams
  item: material.high-strength-steel-4340
  mass: 3751.01
  note: 13 of 4340 tube 200 x 5 mm, 12.0 m each
- what: Cross tubes
  item: material.aluminium-alloy-6061
  mass: 985.3
  note: 5 of 6061 tube 250 x 8 mm, 12.0 m each at x [-5.94, -4.2, 0.0, 4.2, 5.94]; untrimmed stock mass, fishmouth deductions pending
- what: Socket pads and inserts
  item: material.high-strength-steel-4340
  mass: 29.08
  note: 8 4340 pads, each an M42 insert; pad thickness 0.042 m, crosses lowered by that thickness with fishmouth seats to retain socket face z 0.45; joints unqualified
- what: Fixing lugs
  item: material.aluminium-alloy-6061
  mass: 75.82
  note: 156 6061 lugs, a strut clamp bolted to each
