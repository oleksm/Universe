# yaml-language-server: $schema=../../schema/adapter.schema.yaml
identity:
  key: adapter.utility-s2
  name: Utility cradle, class 2
  description: 'Holds what fits mount.utility-s2 on a ship''s frame: 2 6061 tube 160 x 3 mm beams over the frame''s struts, 1 m or more apart, clamped at the middle of every 1 m, 3 cross tubes, the mount''s 8 sockets on top.'
offers: mount.utility-s2
rating:
  tension: 92000.0
  compression: 92000.0
  shear: 46000.0
physical:
  length: 8.08
  width: 2.16
  height: 0.32
  mass: 96.06
built_of:
- what: Beams
  item: material.aluminium-alloy-6061
  mass: 63.92
  note: 2 of 6061 tube 160 x 3 mm, 8.0 m each
- what: Cross tubes
  item: material.aluminium-alloy-6061
  mass: 23.97
  note: 3 of 6061 tube 160 x 3 mm, 2.0 m each at x [-3.96, 0.0, 3.96]; untrimmed stock mass, fishmouth deductions pending
- what: Socket pads and inserts
  item: material.high-strength-steel-4340
  mass: 0.39
  note: 8 4340 pads, each an M10 insert; pad thickness 0.01 m, crosses lowered by that thickness with fishmouth seats to retain socket face z 0.32; joints unqualified
- what: Fixing lugs
  item: material.aluminium-alloy-6061
  mass: 7.78
  note: 16 6061 lugs, a strut clamp bolted to each
