  item: material.high-strength-steel-4340
  mass: 1731.24
  note: 9 of 4340 tube 200 x 5 mm, 8.0 m each
- what: Cross tubes
  item: material.aluminium-alloy-6061
  mass: 656.87
  note: 5 of 6061 tube 250 x 8 mm, 8.0 m each at x [-3.96, -2.8, 0.0, 2.8, 3.96]; untrimmed stock mass, fishmouth deductions pending
