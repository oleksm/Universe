  name: Access cradle, class 3
  description: 'Holds what fits mount.access-s3 on a ship''s frame: 9 4340 tube 200 x 5 mm beams over the frame''s struts, 1 m or more apart, clamped at the middle of every 1 m, 5 cross tubes, the mount''s 8 sockets on top.'
offers: mount.access-s3
