# yaml-language-server: $schema=../../schema/adapter.schema.yaml
identity:
  key: adapter.gear-s1c
  name: Landing gear cradle, class 1 compact
  description: 'Holds what fits mount.gear-s1c on a ship''s frame: 2 6061 tube 200 x 5 mm beams over the frame''s struts, 1 m or more apart, clamped at the middle of every 1 m, 4 cross tubes, the mount''s 3 sockets on top.'
offers: mount.gear-s1c
rating:
  tension: 231900.0
  compression: 231900.0
  shear: 116100.0
physical:
  length: 2.2
  width: 1.2
  height: 0.4
  mass: 68.7
built_of:
- what: Beams
  item: material.aluminium-alloy-6061
  mass: 33.08
  note: 2 of 6061 tube 200 x 5 mm, 2.0 m each
- what: Cross tubes
  item: material.aluminium-alloy-6061
  mass: 33.08
  note: 4 of 6061 tube 200 x 5 mm, 1.0 m each at x [-1.0, -0.198, 0.099, 1.0]; untrimmed stock mass, fishmouth deductions pending
- what: Socket pads and inserts
  item: material.high-strength-steel-4340
  mass: 0.6
  note: 3 4340 pads, each an M16 insert; pad thickness 0.016 m, crosses lowered by that thickness with fishmouth seats to retain socket face z 0.4; joints unqualified
- what: Fixing lugs
  item: material.aluminium-alloy-6061
  mass: 1.94
  note: 4 6061 lugs, a strut clamp bolted to each
ports:
- {id: s1, flow: in, medium: load, interface: interface.insert-m16, half: female, make: bolted, at: [0.099, -0.198, 0.4], facing: [0.0, 0.0, 1.0], optional: true}
- {id: s2, flow: in, medium: load, interface: interface.insert-m16, half: female, make: bolted, at: [0.099, 0.198, 0.4], facing: [0.0, 0.0, 1.0], optional: true}
- {id: s3, flow: in, medium: load, interface: interface.insert-m16, half: female, make: bolted, at: [-0.198, 0.0, 0.4], facing: [0.0, 0.0, 1.0], optional: true}
- {id: fix-1, flow: out, medium: load, interface: interface.kit-clamp, half: male, make: bolted, mass: 76.7, force: 57975.0, at: [-0.5, -0.5, 0.0], facing: [0.0, 0.0, -1.0]}
- {id: fix-2, flow: out, medium: load, interface: interface.kit-clamp, half: male, make: bolted, mass: 76.7, force: 57975.0, at: [0.5, -0.5, 0.0], facing: [0.0, 0.0, -1.0]}
- {id: fix-3, flow: out, medium: load, interface: interface.kit-clamp, half: male, make: bolted, mass: 76.7, force: 57975.0, at: [-0.5, 0.5, 0.0], facing: [0.0, 0.0, -1.0]}
- {id: fix-4, flow: out, medium: load, interface: interface.kit-clamp, half: male, make: bolted, mass: 76.7, force: 57975.0, at: [0.5, 0.5, 0.0], facing: [0.0, 0.0, -1.0]}
template: template.cradle
basis:
- of:
  - built_of
  - physical
  - ports
  tier: derived
  review: true
  note: 'By the cradle rule in tools/standards/mounting.py: tubes chosen for the mount''s points times 1.5 in bending (cross tubes 29.0 kN m, beams 29.0 kN m); fixings'' duty the mount''s mass and points shared evenly, a placeholder:
    a design''s duty comes from the stiffness model. Review-pending (docs/proposals/physical-mounts.md): chosen, not approved.'
- of:
  - rating
  tier: derived
  note: The mount's 3 points (mount.gear-s1c).
