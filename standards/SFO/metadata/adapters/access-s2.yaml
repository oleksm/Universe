# yaml-language-server: $schema=../../schema/adapter.schema.yaml
identity:
  key: adapter.access-s2
  name: Access cradle, class 2
  description: 'Holds what fits mount.access-s2 on a ship''s frame: 2 4340 tube 200 x 5 mm beams over the frame''s struts, 1 m or more apart, clamped at the middle of every 1 m, 5 cross tubes, the mount''s 8 sockets on top.'
offers: mount.access-s2
rating:
  tension: 2720000.0
  compression: 2720000.0
  shear: 1360000.0
physical:
  length: 5.2
  width: 5.2
  height: 0.45
  mass: 3110.46
built_of:
- what: Beams
  item: material.high-strength-steel-4340
  mass: 240.45
  note: 2 of 4340 tube 200 x 5 mm, 5.0 m each
- what: Cross tubes
  item: material.high-strength-steel-4340
  mass: 2836.07
  note: 5 of 4340 tube 250 x 20 mm, 5.0 m each at x [-2.475, -1.75, 0.0, 1.75, 2.475]; untrimmed stock mass, fishmouth deductions pending
- what: Socket pads and inserts
  item: material.high-strength-steel-4340
  mass: 29.08
  note: 8 4340 pads, each an M42 insert; pad thickness 0.042 m, crosses lowered by that thickness with fishmouth seats to retain socket face z 0.45; joints unqualified
- what: Fixing lugs
  item: material.aluminium-alloy-6061
  mass: 4.86
  note: 10 6061 lugs, a strut clamp bolted to each
ports:
- {id: s1, flow: in, medium: load, interface: interface.insert-m42, half: female, make: bolted, at: [2.475, 0.0, 0.45], facing: [0.0, 0.0, 1.0], optional: true}
- {id: s2, flow: in, medium: load, interface: interface.insert-m42, half: female, make: bolted, at: [1.7501, 1.7501, 0.45], facing: [0.0, 0.0, 1.0], optional: true}
- {id: s3, flow: in, medium: load, interface: interface.insert-m42, half: female, make: bolted, at: [0.0, 2.475, 0.45], facing: [0.0, 0.0, 1.0], optional: true}
- {id: s4, flow: in, medium: load, interface: interface.insert-m42, half: female, make: bolted, at: [-1.7501, 1.7501, 0.45], facing: [0.0, 0.0, 1.0], optional: true}
- {id: s5, flow: in, medium: load, interface: interface.insert-m42, half: female, make: bolted, at: [-2.475, 0.0, 0.45], facing: [0.0, 0.0, 1.0], optional: true}
- {id: s6, flow: in, medium: load, interface: interface.insert-m42, half: female, make: bolted, at: [-1.7501, -1.7501, 0.45], facing: [0.0, 0.0, 1.0], optional: true}
