- {id: s8, flow: in, medium: load, interface: interface.insert-m42, half: female, make: bolted, at: [1.7501, -1.7501, 0.45], facing: [0.0, 0.0, 1.0], optional: true}
- {id: fix-1, flow: out, medium: load, interface: interface.kit-clamp, half: male, make: bolted, mass: 1061.0, force: 272000.0, at: [-2.0, -2.5, 0.0], facing: [0.0, 0.0, -1.0]}
