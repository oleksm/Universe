# yaml-language-server: $schema=../../schema/adapter.schema.yaml
identity:
  key: adapter.life-support-s1
  name: Life support cradle, class 1
  description: 'Holds what fits mount.life-support-s1 on a ship''s frame: 2 6061 tube 100 x 2 mm beams over the frame''s struts, 1 m or more apart, clamped at the middle of every 1 m, 4 cross tubes, the mount''s 4 sockets on top.'
offers: mount.life-support-s1
rating:
  tension: 29400.0
  compression: 29400.0
  shear: 14720.0
physical:
  length: 3.06
  width: 2.1
  height: 0.16
  mass: 20.97
built_of:
- what: Beams
  item: material.aluminium-alloy-6061
  mass: 9.98
  note: 2 of 6061 tube 100 x 2 mm, 3.0 m each
- what: Cross tubes
  item: material.aluminium-alloy-6061
  mass: 7.87
  note: 4 of 6061 tube 60 x 2 mm, 2.0 m each at x [-1.5, -1.04, 1.04, 1.5]; untrimmed stock mass, fishmouth deductions pending
- what: Socket pads and inserts
  item: material.high-strength-steel-4340
  mass: 0.2
  note: 4 4340 pads, each an M10 insert; pad thickness 0.01 m, crosses lowered by that thickness with fishmouth seats to retain socket face z 0.16; joints unqualified
- what: Fixing lugs
  item: material.aluminium-alloy-6061
  mass: 2.92
  note: 6 6061 lugs, a strut clamp bolted to each
