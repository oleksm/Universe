# yaml-language-server: $schema=../../schema/adapter.schema.yaml
identity:
  key: adapter.cargo-s4
  name: Cargo cradle, class 4
  description: 'Holds what fits mount.cargo-s4 on a ship''s frame: 7 4340 tube 250 x 20 mm beams over the frame''s struts, 1 m or more apart, clamped at the middle of every 1 m, 3 cross tubes, the mount''s 8 sockets on top.'
offers: mount.cargo-s4
rating:
  tension: 12160000.0
  compression: 12160000.0
  shear: 6064000.0
physical:
  length: 27.0
  width: 6.25
  height: 0.5
  mass: 23775.49
built_of:
- what: Beams
  item: material.high-strength-steel-4340
  mass: 21440.71
  note: 7 of 4340 tube 250 x 20 mm, 27.0 m each
- what: Cross tubes
  item: material.high-strength-steel-4340
  mass: 2041.97
  note: 3 of 4340 tube 250 x 20 mm, 6.0 m each at x [-13.32, 0.0, 13.32]; untrimmed stock mass, fishmouth deductions pending
- what: Socket pads and inserts
  item: material.high-strength-steel-4340
  mass: 200.96
  note: 8 4340 pads, each an M80 insert; pad thickness 0.08 m, crosses lowered by that thickness with fishmouth seats to retain socket face z 0.5; joints unqualified
- what: Fixing lugs
  item: material.aluminium-alloy-6061
  mass: 91.85
  note: 189 6061 lugs, a strut clamp bolted to each
