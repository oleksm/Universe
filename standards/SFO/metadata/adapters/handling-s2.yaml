# yaml-language-server: $schema=../../schema/adapter.schema.yaml
identity:
  key: adapter.handling-s2
  name: Handling cradle, class 2
  description: 'Holds what fits mount.handling-s2 on a ship''s frame: 2 6061 tube 200 x 5 mm beams over the frame''s struts, 1 m or more apart, clamped at the middle of every 1 m, 4 cross tubes, the mount''s 4 sockets on top.'
offers: mount.handling-s2
rating:
  tension: 270000.0
  compression: 270000.0
  shear: 135200.0
physical:
  length: 17.2
  width: 2.2
  height: 0.4
  mass: 364.67
built_of:
- what: Beams
  item: material.aluminium-alloy-6061
  mass: 281.19
  note: 2 of 6061 tube 200 x 5 mm, 17.0 m each
- what: Cross tubes
  item: material.aluminium-alloy-6061
  mass: 66.16
  note: 4 of 6061 tube 200 x 5 mm, 2.0 m each at x [-8.5, -8.01, 8.01, 8.5]; untrimmed stock mass, fishmouth deductions pending
- what: Socket pads and inserts
  item: material.high-strength-steel-4340
  mass: 0.8
  note: 4 4340 pads, each an M16 insert; pad thickness 0.016 m, crosses lowered by that thickness with fishmouth seats to retain socket face z 0.4; joints unqualified
- what: Fixing lugs
  item: material.aluminium-alloy-6061
  mass: 16.52
  note: 34 6061 lugs, a strut clamp bolted to each
