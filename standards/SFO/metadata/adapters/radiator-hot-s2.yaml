# yaml-language-server: $schema=../../schema/adapter.schema.yaml
identity:
  key: adapter.radiator-hot-s2
  name: Hot radiator cradle, class 2
  description: 'Holds what fits mount.radiator-hot-s2 on a ship''s frame: 2 6061 tube 250 x 8 mm beams over the frame''s struts, 1 m or more apart, clamped at the middle of every 1 m, 4 cross tubes, the mount''s 4 sockets on top.'
offers: mount.radiator-hot-s2
rating:
  tension: 1016400.0
  compression: 1016400.0
  shear: 507200.0
physical:
  length: 36.2
  width: 24.25
  height: 0.45
  mass: 3530.97
built_of:
- what: Beams
  item: material.aluminium-alloy-6061
  mass: 1182.36
  note: 2 of 6061 tube 250 x 8 mm, 36.0 m each
- what: Cross tubes
  item: material.high-strength-steel-4340
  mass: 2308.32
  note: 4 of 4340 tube 200 x 5 mm, 24.0 m each at x [-18.0, -17.784, 17.784, 18.0]; untrimmed stock mass, fishmouth deductions pending
- what: Socket pads and inserts
  item: material.high-strength-steel-4340
  mass: 5.3
  note: 4 4340 pads, each an M30 insert; pad thickness 0.03 m, crosses lowered by that thickness with fishmouth seats to retain socket face z 0.45; joints unqualified
- what: Fixing lugs
  item: material.aluminium-alloy-6061
  mass: 34.99
  note: 72 6061 lugs, a strut clamp bolted to each
