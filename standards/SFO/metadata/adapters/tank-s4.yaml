# yaml-language-server: $schema=../../schema/adapter.schema.yaml
identity:
  key: adapter.tank-s4
  name: Tank cradle, class 4
  description: 'Holds what fits mount.tank-s4 on a ship''s frame: 2 4340 tube 250 x 8 mm beams over the frame''s struts, 1 m or more apart, clamped at the middle of every 1 m, 4 cross tubes, the mount''s 4 sockets on top.'
offers: mount.tank-s4
rating:
  tension: 3860000.0
  compression: 3860000.0
  shear: 1932000.0
physical:
  length: 12.25
  width: 12.25
  height: 0.5
  mass: 3483.73
built_of:
- what: Beams
  item: material.high-strength-steel-4340
  mass: 1145.87
  note: 2 of 4340 tube 250 x 8 mm, 12.0 m each
- what: Cross tubes
  item: material.high-strength-steel-4340
  mass: 2291.74
  note: 4 of 4340 tube 250 x 8 mm, 12.0 m each at x [-6.0, -5.715, 5.715, 6.0]; untrimmed stock mass, fishmouth deductions pending
- what: Socket pads and inserts
  item: material.high-strength-steel-4340
  mass: 34.46
  note: 4 4340 pads, each an M56 insert; pad thickness 0.056 m, crosses lowered by that thickness with fishmouth seats to retain socket face z 0.5; joints unqualified
- what: Fixing lugs
  item: material.aluminium-alloy-6061
  mass: 11.66
  note: 24 6061 lugs, a strut clamp bolted to each
ports:
- {id: s1, flow: in, medium: load, interface: interface.insert-m56, half: female, make: bolted, at: [-5.715, -5.715, 0.5], facing: [0.0, 0.0, 1.0], optional: true}
- {id: s2, flow: in, medium: load, interface: interface.insert-m56, half: female, make: bolted, at: [5.715, -5.715, 0.5], facing: [0.0, 0.0, 1.0], optional: true}
