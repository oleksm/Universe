# yaml-language-server: $schema=../../schema/adapter.schema.yaml
identity:
  key: adapter.radiator-hot-s1
  name: Hot radiator cradle, class 1
  description: 'Holds what fits mount.radiator-hot-s1 on a ship''s frame: 2 6061 tube 160 x 3 mm beams over the frame''s struts, 1 m or more apart, clamped at the middle of every 1 m, 4 cross tubes, the mount''s 4 sockets on top.'
offers: mount.radiator-hot-s1
rating:
  tension: 152800.0
  compression: 152800.0
  shear: 76000.0
physical:
  length: 17.16
  width: 10.16
  height: 0.32
  mass: 312.97
built_of:
- what: Beams
  item: material.aluminium-alloy-6061
  mass: 135.84
  note: 2 of 6061 tube 160 x 3 mm, 17.0 m each
- what: Cross tubes
  item: material.aluminium-alloy-6061
  mass: 159.81
  note: 4 of 6061 tube 160 x 3 mm, 10.0 m each at x [-8.5, -8.298, 8.298, 8.5]; untrimmed stock mass, fishmouth deductions pending
- what: Socket pads and inserts
  item: material.high-strength-steel-4340
  mass: 0.8
  note: 4 4340 pads, each an M16 insert; pad thickness 0.016 m, crosses lowered by that thickness with fishmouth seats to retain socket face z 0.32; joints unqualified
- what: Fixing lugs
  item: material.aluminium-alloy-6061
  mass: 16.52
  note: 34 6061 lugs, a strut clamp bolted to each
ports:
- {id: s1, flow: in, medium: load, interface: interface.insert-m16, half: female, make: bolted, at: [-8.298, -4.77, 0.32], facing: [0.0, 0.0, 1.0], optional: true}
