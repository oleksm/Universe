- {id: fix-5, flow: out, medium: load, interface: interface.kit-clamp, half: male, make: bolted, mass: 1495.6, force: 43200.0, at: [-1.5, 1.5, 0.0], facing: [0.0, 0.0, -1.0]}
- {id: fix-6, flow: out, medium: load, interface: interface.kit-clamp, half: male, make: bolted, mass: 1495.6, force: 43200.0, at: [-0.5, 1.5, 0.0], facing: [0.0, 0.0, -1.0]}
