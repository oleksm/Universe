template: template.cradle
basis:
- of:
  - built_of
  - physical
  - ports
  tier: derived
  review: true
  note: 'By the cradle rule in tools/standards/mounting.py: tubes chosen for the mount''s points times 1.5 in bending (cross tubes 48.6 kN m, beams 32.4 kN m); fixings'' duty the mount''s mass and points shared evenly, a placeholder:
    a design''s duty comes from the stiffness model. Review-pending (docs/proposals/physical-mounts.md): chosen, not approved.'
- of:
  - rating
  tier: derived
  note: The mount's 8 points (mount.hyperdrive-s3).
