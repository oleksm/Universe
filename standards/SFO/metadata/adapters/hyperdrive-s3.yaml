# yaml-language-server: $schema=../../schema/adapter.schema.yaml
identity:
  key: adapter.hyperdrive-s3
  name: Hyperdrive cradle, class 3
  description: 'Holds what fits mount.hyperdrive-s3 on a ship''s frame: 2 6061 tube 200 x 5 mm beams over the frame''s struts, 1 m or more apart, clamped at the middle of every 1 m, 3 cross tubes, the mount''s 8 sockets on top.'
offers: mount.hyperdrive-s3
rating:
  tension: 345600.0
  compression: 345600.0
  shear: 172800.0
physical:
  length: 4.0
  width: 3.2
  height: 0.45
  mass: 165.18
built_of:
- what: Beams
  item: material.aluminium-alloy-6061
  mass: 66.16
  note: 2 of 6061 tube 200 x 5 mm, 4.0 m each
- what: Cross tubes
  item: material.aluminium-alloy-6061
  mass: 93.52
  note: 3 of 6061 tube 250 x 5 mm, 3.0 m each at x [-1.818, 0.0, 1.818]; untrimmed stock mass, fishmouth deductions pending
- what: Socket pads and inserts
  item: material.high-strength-steel-4340
  mass: 1.61
  note: 8 4340 pads, each an M16 insert; pad thickness 0.016 m, crosses lowered by that thickness with fishmouth seats to retain socket face z 0.45; joints unqualified
- what: Fixing lugs
  item: material.aluminium-alloy-6061
  mass: 3.89
  note: 8 6061 lugs, a strut clamp bolted to each
ports:
- {id: s1, flow: in, medium: load, interface: interface.insert-m16, half: female, make: bolted, at: [-1.818, -1.215, 0.45], facing: [0.0, 0.0, 1.0], optional: true}
- {id: s2, flow: in, medium: load, interface: interface.insert-m16, half: female, make: bolted, at: [1.818, -1.215, 0.45], facing: [0.0, 0.0, 1.0], optional: true}
- {id: s3, flow: in, medium: load, interface: interface.insert-m16, half: female, make: bolted, at: [1.818, 1.215, 0.45], facing: [0.0, 0.0, 1.0], optional: true}
- {id: s4, flow: in, medium: load, interface: interface.insert-m16, half: female, make: bolted, at: [-1.818, 1.215, 0.45], facing: [0.0, 0.0, 1.0], optional: true}
- {id: s5, flow: in, medium: load, interface: interface.insert-m16, half: female, make: bolted, at: [0.0, -1.215, 0.45], facing: [0.0, 0.0, 1.0], optional: true}
- {id: s6, flow: in, medium: load, interface: interface.insert-m16, half: female, make: bolted, at: [1.818, 0.0, 0.45], facing: [0.0, 0.0, 1.0], optional: true}
- {id: s7, flow: in, medium: load, interface: interface.insert-m16, half: female, make: bolted, at: [0.0, 1.215, 0.45], facing: [0.0, 0.0, 1.0], optional: true}
- {id: s8, flow: in, medium: load, interface: interface.insert-m16, half: female, make: bolted, at: [-1.818, 0.0, 0.45], facing: [0.0, 0.0, 1.0], optional: true}
- {id: fix-1, flow: out, medium: load, interface: interface.kit-clamp, half: male, make: bolted, mass: 1495.6, force: 43200.0, at: [-1.5, -1.5, 0.0], facing: [0.0, 0.0, -1.0]}
- {id: fix-2, flow: out, medium: load, interface: interface.kit-clamp, half: male, make: bolted, mass: 1495.6, force: 43200.0, at: [-0.5, -1.5, 0.0], facing: [0.0, 0.0, -1.0]}
