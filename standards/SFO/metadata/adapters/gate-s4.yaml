# yaml-language-server: $schema=../../schema/adapter.schema.yaml
identity:
  key: adapter.gate-s4
  name: Gate cradle, class 4
  description: 'Holds what fits mount.gate-s4 on a ship''s frame: 54 6061 tube 250 x 8 mm beams over the frame''s struts, 1 m or more apart, clamped at the middle of every 1 m, 3 cross tubes, the mount''s 8 sockets on top.'
offers: mount.gate-s4
rating:
  tension: 1472000.0
  compression: 1472000.0
  shear: 735200.0
physical:
  length: 53.0
  width: 53.25
  height: 0.5
  mass: 51011.59
built_of:
- what: Beams
  item: material.aluminium-alloy-6061
  mass: 46999.0
  note: 54 of 6061 tube 250 x 8 mm, 53.0 m each
- what: Cross tubes
  item: material.aluminium-alloy-6061
  mass: 2611.06
  note: 3 of 6061 tube 250 x 8 mm, 53.0 m each at x [-26.325, 0.0, 26.325]; untrimmed stock mass, fishmouth deductions pending
- what: Socket pads and inserts
  item: material.high-strength-steel-4340
  mass: 10.6
  note: 8 4340 pads, each an M30 insert; pad thickness 0.03 m, crosses lowered by that thickness with fishmouth seats to retain socket face z 0.5; joints unqualified
- what: Fixing lugs
  item: material.aluminium-alloy-6061
  mass: 1390.93
  note: 2862 6061 lugs, a strut clamp bolted to each
