# yaml-language-server: $schema=../../schema/adapter.schema.yaml
identity:
  key: adapter.comm-s1
  name: Comm cradle, class 1
  description: 'Holds what fits mount.comm-s1 on a ship''s frame: 2 6061 tube 60 x 2 mm beams over the frame''s struts, 1 m or more apart, clamped at the middle of every 1 m, 2 cross tubes, the mount''s 4 sockets on top.'
offers: mount.comm-s1
rating:
  tension: 11040.0
  compression: 11040.0
  shear: 5520.0
physical:
  length: 3.03
  width: 3.06
  height: 0.12
  mass: 14.92
built_of:
- what: Beams
  item: material.aluminium-alloy-6061
  mass: 5.9
  note: 2 of 6061 tube 60 x 2 mm, 3.0 m each
- what: Cross tubes
  item: material.aluminium-alloy-6061
  mass: 5.9
  note: 2 of 6061 tube 60 x 2 mm, 3.0 m each at x [-1.485, 1.485]; untrimmed stock mass, fishmouth deductions pending
- what: Socket pads and inserts
  item: material.high-strength-steel-4340
  mass: 0.2
  note: 4 4340 pads, each an M10 insert; pad thickness 0.01 m, crosses lowered by that thickness with fishmouth seats to retain socket face z 0.12; joints unqualified
- what: Fixing lugs
  item: material.aluminium-alloy-6061
  mass: 2.92
  note: 6 6061 lugs, a strut clamp bolted to each
ports:
- {id: s1, flow: in, medium: load, interface: interface.insert-m10, half: female, make: bolted, at: [-1.485, -1.485, 0.12], facing: [0.0, 0.0, 1.0], optional: true}
- {id: s2, flow: in, medium: load, interface: interface.insert-m10, half: female, make: bolted, at: [1.485, -1.485, 0.12], facing: [0.0, 0.0, 1.0], optional: true}
- {id: s3, flow: in, medium: load, interface: interface.insert-m10, half: female, make: bolted, at: [1.485, 1.485, 0.12], facing: [0.0, 0.0, 1.0], optional: true}
- {id: s4, flow: in, medium: load, interface: interface.insert-m10, half: female, make: bolted, at: [-1.485, 1.485, 0.12], facing: [0.0, 0.0, 1.0], optional: true}
- {id: fix-1, flow: out, medium: load, interface: interface.kit-clamp, half: male, make: bolted, mass: 65.0, force: 1840.0, at: [-1.0, -1.5, 0.0], facing: [0.0, 0.0, -1.0]}
- {id: fix-2, flow: out, medium: load, interface: interface.kit-clamp, half: male, make: bolted, mass: 65.0, force: 1840.0, at: [0.0, -1.5, 0.0], facing: [0.0, 0.0, -1.0]}
- {id: fix-3, flow: out, medium: load, interface: interface.kit-clamp, half: male, make: bolted, mass: 65.0, force: 1840.0, at: [1.0, -1.5, 0.0], facing: [0.0, 0.0, -1.0]}
- {id: fix-4, flow: out, medium: load, interface: interface.kit-clamp, half: male, make: bolted, mass: 65.0, force: 1840.0, at: [-1.0, 1.5, 0.0], facing: [0.0, 0.0, -1.0]}
- {id: fix-5, flow: out, medium: load, interface: interface.kit-clamp, half: male, make: bolted, mass: 65.0, force: 1840.0, at: [0.0, 1.5, 0.0], facing: [0.0, 0.0, -1.0]}
- {id: fix-6, flow: out, medium: load, interface: interface.kit-clamp, half: male, make: bolted, mass: 65.0, force: 1840.0, at: [1.0, 1.5, 0.0], facing: [0.0, 0.0, -1.0]}
template: template.cradle
basis:
- of:
  - built_of
  - physical
  - ports
  tier: derived
  review: true
  note: 'By the cradle rule in tools/standards/mounting.py: tubes chosen for the mount''s points times 1.5 in bending (cross tubes 0.1 kN m, beams 1.0 kN m); fixings'' duty the mount''s mass and points shared evenly, a placeholder:
    a design''s duty comes from the stiffness model. Review-pending (docs/proposals/physical-mounts.md): chosen, not approved.'
- of:
  - rating
  tier: derived
  note: The mount's 4 points (mount.comm-s1).
