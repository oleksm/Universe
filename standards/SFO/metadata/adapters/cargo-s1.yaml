identity:
  key: adapter.cargo-s1
  name: Cargo cradle, class 1
  description: 'Holds what fits mount.cargo-s1 on a ship''s frame: 2 6061 tube 200 x 5 mm beams over the frame''s struts, 1 m or more apart, clamped at the middle of every 1 m, 5 cross tubes, the mount''s 8 sockets on top.'
offers: mount.cargo-s1
rating:
  tension: 404800.0
  compression: 404800.0
  shear: 202400.0
physical:
  length: 4.2
  width: 2.2
  height: 0.4
  mass: 154.36
built_of:
- what: Beams
  item: material.aluminium-alloy-6061
  mass: 66.16
  note: 2 of 6061 tube 200 x 5 mm, 4.0 m each
- what: Cross tubes
  item: material.aluminium-alloy-6061
  mass: 82.7
  note: 5 of 6061 tube 200 x 5 mm, 2.0 m each at x [-2.0, -1.571, 0.0, 1.571, 2.0]; untrimmed stock mass, fishmouth deductions pending
- what: Socket pads and inserts
  item: material.high-strength-steel-4340
  mass: 1.61
  note: 8 4340 pads, each an M16 insert; pad thickness 0.016 m, crosses lowered by that thickness with fishmouth seats to retain socket face z 0.4; joints unqualified
- what: Fixing lugs
  item: material.aluminium-alloy-6061
  mass: 3.89
  note: 8 6061 lugs, a strut clamp bolted to each
