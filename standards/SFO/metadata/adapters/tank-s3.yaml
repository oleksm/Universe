# yaml-language-server: $schema=../../schema/adapter.schema.yaml
identity:
  key: adapter.tank-s3
  name: Tank cradle, class 3
  description: 'Holds what fits mount.tank-s3 on a ship''s frame: 2 4340 tube 200 x 5 mm beams over the frame''s struts, 1 m or more apart, clamped at the middle of every 1 m, 4 cross tubes, the mount''s 4 sockets on top.'
offers: mount.tank-s3
rating:
  tension: 1932000.0
  compression: 1932000.0
  shear: 964000.0
physical:
  length: 9.25
  width: 9.2
  height: 0.45
  mass: 1543.67
built_of:
- what: Beams
  item: material.high-strength-steel-4340
  mass: 432.81
  note: 2 of 4340 tube 200 x 5 mm, 9.0 m each
- what: Cross tubes
  item: material.high-strength-steel-4340
  mass: 1087.57
  note: 4 of 4340 tube 250 x 5 mm, 9.0 m each at x [-4.5, -4.113, 4.113, 4.5]; untrimmed stock mass, fishmouth deductions pending
- what: Socket pads and inserts
  item: material.high-strength-steel-4340
  mass: 14.54
  note: 4 4340 pads, each an M42 insert; pad thickness 0.042 m, crosses lowered by that thickness with fishmouth seats to retain socket face z 0.45; joints unqualified
- what: Fixing lugs
  item: material.aluminium-alloy-6061
  mass: 8.75
  note: 18 6061 lugs, a strut clamp bolted to each
ports:
- {id: s1, flow: in, medium: load, interface: interface.insert-m42, half: female, make: bolted, at: [-4.113, -4.113, 0.45], facing: [0.0, 0.0, 1.0], optional: true}
- {id: s2, flow: in, medium: load, interface: interface.insert-m42, half: female, make: bolted, at: [4.113, -4.113, 0.45], facing: [0.0, 0.0, 1.0], optional: true}
- {id: s3, flow: in, medium: load, interface: interface.insert-m42, half: female, make: bolted, at: [4.113, 4.113, 0.45], facing: [0.0, 0.0, 1.0], optional: true}
- {id: s4, flow: in, medium: load, interface: interface.insert-m42, half: female, make: bolted, at: [-4.113, 4.113, 0.45], facing: [0.0, 0.0, 1.0], optional: true}
- {id: fix-1, flow: out, medium: load, interface: interface.kit-clamp, half: male, make: bolted, mass: 3730.2, force: 107333.0, at: [-4.0, -4.5, 0.0], facing: [0.0, 0.0, -1.0]}
