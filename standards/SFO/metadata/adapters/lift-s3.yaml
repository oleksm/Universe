# yaml-language-server: $schema=../../schema/adapter.schema.yaml
identity:
  key: adapter.lift-s3
  name: Lift cradle, class 3
  description: 'Holds what fits mount.lift-s3 on a ship''s frame: 16 4340 tube 200 x 5 mm beams over the frame''s struts, 1 m or more apart, clamped at the middle of every 1 m, 6 cross tubes, the mount''s 6 sockets on top.'
offers: mount.lift-s3
rating:
  tension: 2256000.0
  compression: 2256000.0
  shear: 1128000.0
physical:
  length: 18.2
  width: 15.2
  height: 0.4
  mass: 9250.78
built_of:
- what: Beams
  item: material.high-strength-steel-4340
  mass: 6924.95
  note: 16 of 4340 tube 200 x 5 mm, 18.0 m each
- what: Cross tubes
  item: material.high-strength-steel-4340
  mass: 2164.05
  note: 6 of 4340 tube 200 x 5 mm, 15.0 m each at x [-9.0, -8.64, -4.32, 4.32, 8.64, 9.0]; untrimmed stock mass, fishmouth deductions pending
- what: Socket pads and inserts
  item: material.high-strength-steel-4340
  mass: 21.81
  note: 6 4340 pads, each an M42 insert; pad thickness 0.042 m, crosses lowered by that thickness with fishmouth seats to retain socket face z 0.4; joints unqualified
- what: Fixing lugs
  item: material.aluminium-alloy-6061
  mass: 139.97
  note: 288 6061 lugs, a strut clamp bolted to each
