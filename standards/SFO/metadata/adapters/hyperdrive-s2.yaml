# yaml-language-server: $schema=../../schema/adapter.schema.yaml
identity:
  key: adapter.hyperdrive-s2
  name: Hyperdrive cradle, class 2
  description: 'Holds what fits mount.hyperdrive-s2 on a ship''s frame: 2 6061 tube 160 x 3 mm beams over the frame''s struts, 1 m or more apart, clamped at the middle of every 1 m, 3 cross tubes, the mount''s 8 sockets on top.'
offers: mount.hyperdrive-s2
rating:
  tension: 154400.0
  compression: 154400.0
  shear: 77200.0
physical:
  length: 3.0
  width: 2.16
  height: 0.32
  mass: 51.25
built_of:
- what: Beams
  item: material.aluminium-alloy-6061
  mass: 23.97
  note: 2 of 6061 tube 160 x 3 mm, 3.0 m each
- what: Cross tubes
  item: material.aluminium-alloy-6061
  mass: 23.97
  note: 3 of 6061 tube 160 x 3 mm, 2.0 m each at x [-1.395, 0.0, 1.395]; untrimmed stock mass, fishmouth deductions pending
- what: Socket pads and inserts
  item: material.high-strength-steel-4340
  mass: 0.39
  note: 8 4340 pads, each an M10 insert; pad thickness 0.01 m, crosses lowered by that thickness with fishmouth seats to retain socket face z 0.32; joints unqualified
- what: Fixing lugs
  item: material.aluminium-alloy-6061
  mass: 2.92
  note: 6 6061 lugs, a strut clamp bolted to each
