# yaml-language-server: $schema=../../schema/adapter.schema.yaml
identity:
  key: adapter.gear-s2
  name: Landing gear cradle, class 2
  description: 'Holds what fits mount.gear-s2 on a ship''s frame: 2 4340 tube 250 x 5 mm beams over the frame''s struts, 1 m or more apart, clamped at the middle of every 1 m, 4 cross tubes, the mount''s 3 sockets on top.'
offers: mount.gear-s2
rating:
  tension: 1554000.0
  compression: 1554000.0
  shear: 777000.0
physical:
  length: 2.25
  width: 2.25
  height: 0.5
  mass: 515.64
built_of:
- what: Beams
  item: material.high-strength-steel-4340
  mass: 120.84
  note: 2 of 4340 tube 250 x 5 mm, 2.0 m each
- what: Cross tubes
  item: material.high-strength-steel-4340
  mass: 381.96
  note: 4 of 4340 tube 250 x 8 mm, 2.0 m each at x [-1.0, -0.693, 0.346, 1.0]; untrimmed stock mass, fishmouth deductions pending
- what: Socket pads and inserts
  item: material.high-strength-steel-4340
  mass: 10.9
  note: 3 4340 pads, each an M42 insert; pad thickness 0.042 m, crosses lowered by that thickness with fishmouth seats to retain socket face z 0.5; joints unqualified
- what: Fixing lugs
  item: material.aluminium-alloy-6061
  mass: 1.94
  note: 4 6061 lugs, a strut clamp bolted to each
ports:
- id: s1
  flow: in
  medium: load
  interface: interface.insert-m42
  half: female
  make: bolted
  at:
  - 0.3465
  - -0.693
  - 0.5
  facing:
  - 0.0
  - 0.0
  - 1.0
  optional: true
  note: the mount's socket, an M42 insert (bolt stock.st4340-bolt-m42); spare when no foot is on it
