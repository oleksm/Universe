  width: 3.2
  height: 0.45
  mass: 877.9
built_of:
- what: Beams
  item: material.high-strength-steel-4340
  mass: 144.27
  note: 2 of 4340 tube 200 x 5 mm, 3.0 m each
- what: Cross tubes
  item: material.high-strength-steel-4340
  mass: 716.17
  note: 5 of 4340 tube 250 x 8 mm, 3.0 m each at x [-1.5, -1.03, 0.0, 1.03, 1.5]; untrimmed stock mass, fishmouth deductions pending
- what: Socket pads and inserts
  item: material.high-strength-steel-4340
  mass: 14.54
  note: 4 4340 pads, each an M42 insert; pad thickness 0.042 m, crosses lowered by that thickness with fishmouth seats to retain socket face z 0.45; joints unqualified
- what: Fixing lugs
  item: material.aluminium-alloy-6061
  mass: 2.92
  note: 6 6061 lugs, a strut clamp bolted to each
