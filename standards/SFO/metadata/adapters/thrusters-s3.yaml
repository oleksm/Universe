identity:
  key: adapter.thrusters-s3
  name: Thruster cradle, class 3
  description: 'Holds what fits mount.thrusters-s3 on a ship''s frame: 2 4340 tube 200 x 5 mm beams over the frame''s struts, 1 m or more apart, clamped at the middle of every 1 m, 5 cross tubes, the mount''s 4 sockets on top.'
offers: mount.thrusters-s3
rating:
