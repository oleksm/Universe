# yaml-language-server: $schema=../../schema/adapter.schema.yaml
identity:
  key: adapter.power-s1
  name: Power plant cradle, class 1
  description: 'Holds what fits mount.power-s1 on a ship''s frame: 2 6061 tube 160 x 3 mm beams over the frame''s struts, 1 m or more apart, clamped at the middle of every 1 m, 5 cross tubes, the mount''s 8 sockets on top.'
offers: mount.power-s1
rating:
  tension: 92000.0
  compression: 92000.0
  shear: 46160.0
physical:
  length: 13.2
  width: 7.16
  height: 0.36
  mass: 406.36
built_of:
- what: Beams
  item: material.aluminium-alloy-6061
  mass: 103.87
  note: 2 of 6061 tube 160 x 3 mm, 13.0 m each
- what: Cross tubes
  item: material.aluminium-alloy-6061
  mass: 289.46
  note: 5 of 6061 tube 200 x 5 mm, 7.0 m each at x [-6.5, -6.21, 0.0, 6.21, 6.5]; untrimmed stock mass, fishmouth deductions pending
- what: Socket pads and inserts
  item: material.high-strength-steel-4340
  mass: 0.39
  note: 8 4340 pads, each an M10 insert; pad thickness 0.01 m, crosses lowered by that thickness with fishmouth seats to retain socket face z 0.36; joints unqualified
- what: Fixing lugs
  item: material.aluminium-alloy-6061
  mass: 12.64
  note: 26 6061 lugs, a strut clamp bolted to each
