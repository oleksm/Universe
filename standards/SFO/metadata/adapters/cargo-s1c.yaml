# yaml-language-server: $schema=../../schema/adapter.schema.yaml
identity:
  key: adapter.cargo-s1c
  name: Cargo cradle, class 1 compact
  description: 'Holds what fits mount.cargo-s1c on a ship''s frame: 2 6061 tube 100 x 2 mm beams over the frame''s struts, 1 m or more apart, clamped at the middle of every 1 m, 4 cross tubes, the mount''s 4 sockets on top.'
offers: mount.cargo-s1c
rating:
  tension: 42400.0
  compression: 42400.0
  shear: 21160.0
physical:
  length: 2.1
  width: 2.1
  height: 0.2
  mass: 28.54
built_of:
- what: Beams
  item: material.aluminium-alloy-6061
  mass: 6.65
  note: 2 of 6061 tube 100 x 2 mm, 2.0 m each
- what: Cross tubes
  item: material.aluminium-alloy-6061
  mass: 19.75
  note: 4 of 6061 tube 100 x 3 mm, 2.0 m each at x [-1.0, -0.743, 0.743, 1.0]; untrimmed stock mass, fishmouth deductions pending
- what: Socket pads and inserts
  item: material.high-strength-steel-4340
  mass: 0.2
  note: 4 4340 pads, each an M10 insert; pad thickness 0.01 m, crosses lowered by that thickness with fishmouth seats to retain socket face z 0.2; joints unqualified
- what: Fixing lugs
  item: material.aluminium-alloy-6061
  mass: 1.94
  note: 4 6061 lugs, a strut clamp bolted to each
