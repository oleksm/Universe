# yaml-language-server: $schema=../../schema/adapter.schema.yaml
identity:
  key: adapter.hardpoint-s3
  name: Hardpoint cradle, class 3
  description: 'Holds what fits mount.hardpoint-s3 on a ship''s frame: 2 6061 tube 120 x 3 mm beams over the frame''s struts, 1 m or more apart, clamped at the middle of every 1 m, 5 cross tubes, the mount''s 4 sockets on top.'
offers: mount.hardpoint-s3
rating:
  tension: 73200.0
  compression: 73200.0
  shear: 36600.0
physical:
  length: 6.25
  width: 6.12
  height: 0.37
  mass: 353.48
built_of:
- what: Beams
  item: material.aluminium-alloy-6061
  mass: 35.73
  note: 2 of 6061 tube 120 x 3 mm, 6.0 m each
- what: Cross tubes
  item: material.aluminium-alloy-6061
  mass: 311.72
  note: 5 of 6061 tube 250 x 5 mm, 6.0 m each at x [-3.0, -2.642, 0.0, 2.642, 3.0]; untrimmed stock mass, fishmouth deductions pending
- what: Socket pads and inserts
  item: material.high-strength-steel-4340
  mass: 0.2
  note: 4 4340 pads, each an M10 insert; pad thickness 0.01 m, crosses lowered by that thickness with fishmouth seats to retain socket face z 0.37; joints unqualified
- what: Fixing lugs
  item: material.aluminium-alloy-6061
  mass: 5.83
  note: 12 6061 lugs, a strut clamp bolted to each
ports:
- {id: s1, flow: in, medium: load, interface: interface.insert-m10, half: female, make: bolted, at: [2.6415, 0.0, 0.37], facing: [0.0, 0.0, 1.0], optional: true}
- {id: s2, flow: in, medium: load, interface: interface.insert-m10, half: female, make: bolted, at: [0.0, 2.6415, 0.37], facing: [0.0, 0.0, 1.0], optional: true}
