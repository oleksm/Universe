# yaml-language-server: $schema=../../schema/adapter.schema.yaml
identity:
  key: adapter.thermal-s1
  name: Thermal cradle, class 1
  description: 'Holds what fits mount.thermal-s1 on a ship''s frame: 2 6061 tube 100 x 2 mm beams over the frame''s struts, 1 m or more apart, clamped at the middle of every 1 m, 4 cross tubes, the mount''s 4 sockets on top.'
offers: mount.thermal-s1
rating:
  tension: 36760.0
  compression: 36760.0
  shear: 18400.0
physical:
  length: 7.1
  width: 4.1
  height: 0.2
  mass: 69.77
built_of:
- what: Beams
  item: material.aluminium-alloy-6061
  mass: 23.28
  note: 2 of 6061 tube 100 x 2 mm, 7.0 m each
- what: Cross tubes
  item: material.aluminium-alloy-6061
  mass: 39.49
  note: 4 of 6061 tube 100 x 3 mm, 4.0 m each at x [-3.5, -3.1, 3.1, 3.5]; untrimmed stock mass, fishmouth deductions pending
- what: Socket pads and inserts
  item: material.high-strength-steel-4340
  mass: 0.2
  note: 4 4340 pads, each an M10 insert; pad thickness 0.01 m, crosses lowered by that thickness with fishmouth seats to retain socket face z 0.2; joints unqualified
- what: Fixing lugs
  item: material.aluminium-alloy-6061
  mass: 6.8
  note: 14 6061 lugs, a strut clamp bolted to each
ports:
- {id: s1, flow: in, medium: load, interface: interface.insert-m10, half: female, make: bolted, at: [-3.1005, -1.548, 0.2], facing: [0.0, 0.0, 1.0], optional: true}
- {id: s2, flow: in, medium: load, interface: interface.insert-m10, half: female, make: bolted, at: [3.1005, -1.548, 0.2], facing: [0.0, 0.0, 1.0], optional: true}
- {id: s3, flow: in, medium: load, interface: interface.insert-m10, half: female, make: bolted, at: [3.1005, 1.548, 0.2], facing: [0.0, 0.0, 1.0], optional: true}
- {id: s4, flow: in, medium: load, interface: interface.insert-m10, half: female, make: bolted, at: [-3.1005, 1.548, 0.2], facing: [0.0, 0.0, 1.0], optional: true}
- {id: fix-1, flow: out, medium: load, interface: interface.kit-clamp, half: male, make: bolted, mass: 94.3, force: 2626.0, at: [-3.0, -2.0, 0.0], facing: [0.0, 0.0, -1.0]}
