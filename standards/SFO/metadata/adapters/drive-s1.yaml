identity:
  key: adapter.drive-s1
  name: Main drive cradle, class 1
  description: 'Holds what fits mount.drive-s1 on a ship''s frame: 2 6061 tube 250 x 5 mm beams over the frame''s struts, 1 m or more apart, clamped at the middle of every 1 m, 5 cross tubes, the mount''s 8 sockets on top.'
offers: mount.drive-s1
rating:
  tension: 1256000.0
  compression: 1256000.0
  shear: 627200.0
physical:
  length: 8.174
  width: 8.25
  height: 0.45
  mass: 2922.06
built_of:
- what: Beams
  item: material.aluminium-alloy-6061
  mass: 166.25
  note: 2 of 6061 tube 250 x 5 mm, 8.0 m each
- what: Cross tubes
  item: material.high-strength-steel-4340
  mass: 2737.43
  note: 5 of 4340 tube 200 x 15 mm, 8.0 m each at x [-3.987, -2.819, 0.0, 2.819, 3.987]; untrimmed stock mass, fishmouth deductions pending
- what: Socket pads and inserts
  item: material.high-strength-steel-4340
  mass: 10.6
  note: 8 4340 pads, each an M30 insert; pad thickness 0.03 m, crosses lowered by that thickness with fishmouth seats to retain socket face z 0.45; joints unqualified
- what: Fixing lugs
  item: material.aluminium-alloy-6061
  mass: 7.78
  note: 16 6061 lugs, a strut clamp bolted to each
