# yaml-language-server: $schema=../../schema/template.schema.yaml
identity:
  key: template.pipe
  name: Pipe
  description: Steel pipe of every bore and class, bare. Its straight is swept along the run's path; every size of the family is this template at the record's figures.
family: pipe
draws: sweep-and-pieces
profile: a tube of the record's outside diameter
scales_by:
- outside
- elbow.radius
- support.spacing
pieces:
- name: elbow
  how: the long-radius elbow scaled to the record's outside and elbow radius
- name: support
  how: the pipe stand, its head scaled to the outside, its legs to the height under the run
model_of: run.pipe-dn200-pn16-ss-double
members: 40
basis:
- of:
  - draws
  - scales_by
  - pieces
  - model_of
  rule: rule.template-a-family-installed
