# yaml-language-server: $schema=../../schema/template.schema.yaml
identity:
  key: template.drag-conveyor
  name: Drag conveyor
  description: En-masse chain conveyor in a closed casing. Its straight is swept along the run's path; every size of the family is this template at the record's figures.
family: drag-conveyor
draws: sweep-and-pieces
profile: the closed steel casing of the record's outside
scales_by:
- outside
- size
pieces:
- name: head and tail
  how: drive and return sprockets' casings
model_of: run.drag-conveyor-800
members: 1
basis:
- of:
  - draws
  - scales_by
  - pieces
  - model_of
  rule: rule.template-a-family-installed
