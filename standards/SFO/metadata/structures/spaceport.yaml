identity: {key: structure.spaceport, name: Halvard spaceport, maker: org.halvard, kind: spaceport, revision: outdated, description: 'A port on the ground of a world with air at about 1 g (Heath''s kind; airless ground has the outpost''s design). Site frame (the game''s, crates/core/world/src/spaceport.rs): x east, y north, z up, from the pad grid''s centre. 16 class 2 pads (SFO 23), 90 m square, in a 4 x 4 grid at 150 m (centres x and y -225, -75, 75, 225): each 0.6 m of reinforced concrete on 0.5 m of crushed stone, a flame trench through its middle along x, the pad''s full 90 m, 6 m wide and 4 m deep clear inside: its walls and floor 0.6 m of concrete lined with 0.3 m of refractory brick, closed at the west end; at the east edge it runs on as a lined outlet 12 m long that rises the 4 m to grade, in the 15 m strip between the pad and the taxiway (the exhaust leaves at the surface, away from the pad). Taxiways 30 m wide, 0.4 m concrete, in the 60 m gaps between the pads (along x and y -150,
    0, 150) and one south from the grid''s edge (y -270) to the hangar''s door; each pad joins its nearest north-south taxiway by a 30 m connector across the 15 m strip (the three western columns to the east, beside the trench outlet on two shoulders and full width beyond it; the eastern column to the west), grated over the ditches, never covering a flame trench. The hangar, its centre at y -450: a strut-lattice hall 96 m across (x) by 156 m deep (y) and 36 m tall, walls one 3 m cell thick, the roof a lattice four cells (12 m) deep spanning the 96 m, 24 m clear under it, clad in 2 mm aluminium, on a 0.4 m concrete slab, its front (north) face at y -372; it holds four ships of the MC-07''s size (66.1 x 30.9 x 19.1 m) two by two, nose in; its door in the north face, 45 m wide and 24 m tall, one ship at a time, closed. The site from y +300 to -560 and x -300 to 300; open drainage ditches 0.5 m wide and 0.3 m deep round the pads and the site, grated where taxiways cross them. Its height, 41
    m, counts the hall''s 36 m above grade and the trenches'' 4.9 m below. The fitted ground terminal stands on the site and is separate; the game''s vending machine is the game''s.'}
