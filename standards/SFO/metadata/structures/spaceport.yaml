basis:
- of: [identity.description, physical]
  tier: invented
  review: true
  note: Scope set 2026-10-14 for the modeller (blender asked). The pad grid and the hangar's place are the game's (spaceport.rs) so play stays as it is; the game's hangar (80 x 60 x 25 m, a 44 x 16 m door) cannot take a 66 m ship, so this one is sized to four MC-07s. Pads class 2 by SFO 23 (refractory concrete, a flame trench); heavy ships at 1 g want class 3 (a deluge), not given here. Thicknesses from memory of airfield and launch-pad practice. Masses to be worked out from the volumes once modelled.
- of: [fit]
  tier: invented
  review: true
  note: 'As the game has it (content/base/structures.ron), an early list: to be reviewed. What it is built of, its size and what it weighs are not said.'
- of: [built_of, ground, physical.mass]
  tier: derived
  review: true
  note: 'tools/standards/spaceport.py. Hangar at 1 g: the roof 2217 Pa (2 mm cladding, the frame 119 kg/m2 as counted, 1000 Pa of snow and wind, invented) over 96 m, 12 m deep, puts 638 kN in a chord of each 3 m strip: st4340-tb-160x5 takes 1144 kN; its web diagonals 113 kN at the ends: st4340-tb-100x3 takes 242 kN; a wall vertical takes the strip''s end, 319 kN: st4340-tb-160x3 takes 695 kN; each the lightest kit section with half again to spare. Not checked: wind on the walls, the door''s own frame, the footings. Ground works at blender''s measured volumes, masses from the goods'' bulk densities; the site''s grading (106,440 m3 moved in place) not counted.'
