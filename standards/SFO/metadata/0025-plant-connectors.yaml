identity:
  key: standard.sfo.25
title: Plant ports, connectors and runs
parent: standard.sfo.24
records: connectors
purpose: A works is snapped together on its ground from made parts, not drawn whole. Each unit says where what it takes comes in and what it gives goes out (its ports), each port built to a connector; runs of standard parts (pipe, lined duct, belt, drag conveyor, cable) are laid from port to port. A layout is then data only, and a layout is itself a unit one level up, with ports at its edge.
details:
  text:
    - "A port (a unit's ports[], a layout's ports[]) says which way it flows (in, out or both), what it carries (gas, liquid, bulk or power, and the item), at what rate, pressure, temperature or voltage, the connector it is built to, and where its face is and which way it faces in the unit's frame."
    - "A connector (connectors/<name>.yaml) is a standard joint: a flange pair by nominal bore and pressure, a lined duct's flange, a sealed chute flange, a belt's transfer chute, a power cable's termination by voltage and current. It fixes the mating faces, so any maker's run fits any maker's port built to it. It is a made thing, with material and mass."
    - "A run (runs/<name>.yaml) is a class of made parts laid between ports: its straight by the metre, its elbow, its tee, its supports and the connector at its ends. A layout's link names its run, its ends (a unit's port, one of the layout's own ports, or a tee on another run) and the corners it turns at; the game lays the straights, elbows, tees and supports along it."
    - "Who draws what: a port's `at` is the joint's mating plane. A unit's model ends at that plane in a plain stub of the run's outside, with no flange ring; a run's model starts there the same way. The connector's model (both flanges, bolts, gaskets; a chute's plates; a termination's lugs and gland) is drawn by the game at the plane, so no ring is drawn twice. A unit holds up its own stubs and terminal boxes; a run's supports hold the run. A power port is one three-phase circuit: the gland plate of the unit's own cable box over its terminals, the phases landing inside the box; never a point between bare bushings."
    - "A run's end joins a port only when both are built to the same connector, one an out and the other an in, carrying the same thing. A port left open, a run whose end is not at its port or does not leave it the way it faces, or a run through a unit or another run, is a fault: tools/standards/fit_layout.py finds them."
    - "Sizes come from one series of nominal bores (EN 1092 DN, 100 to 4000 mm) and pressure classes (PN 10, 16, 25); a run is sized to the next bore up from what its flow needs. On airless ground a joint holds the whole of the line's pressure against vacuum, and a leak is lost for good: hydrogen lines there have double seals with the space between watched, and lines are welded between the units' flanges."
    - "A trial, set 2026-10-15 (docs/proposals/factory-kit-assembly.md): the airless shaft furnace's units and layout. Review."
status: draft
