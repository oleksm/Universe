identity:
  key: equipment.power.converter.270v-10kw
  name: DC converter, 3 kV to 270 V, 10 kW
  maker: org.meridian
  revision: draft
  slot: utility
  description: 'Steps the ship''s 3 kV DC bus down to its 270 V DC bus, up to 10 kW out, isolated: a sealed box on four feet, the 3 kV pair in at its -x end (two connector.hvdc-pole-150a receptacles, 3 A), the 270 V pair out (37 A:
    two connector.circular-shell-25 receptacles) and data (connector.circular-shell-11) at its +x end, the coolant pair under it (connector.flat-face-dn13). The connectors'' mass is the routed harness''s (connector.schema physical),
    not the box''s. 97% efficient: at full load it draws 10.31 kW and gives 0.31 kW to the coolant loop.'
