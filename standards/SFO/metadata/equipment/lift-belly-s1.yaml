    - { code: LBS1-05, name: "Shield", description: "Half a metre of carbon between the plasma and the coils, to stop what would warm and spoil them.", mass: 293, length: 24.8, width: 4.18, height: 1.42, item: good.carbon, quantity: 293, module: module.assembly-shop }
    - { code: LBS1-06, name: "Magnetic nozzle", description: "The coils that open the field astern and turn the plasma's heat into a jet.", mass: 19, length: 9.98, width: 1.68, height: 0.569, item: stock.ti64-pl-5, quantity: 21.8, module: module.welding-bay }
    - { code: LBS1-07, name: "Fuel feed", description: "The injector and its lines from the tank.", mass: 19, length: 9.98, width: 1.68, height: 0.569, item: stock.st304-pl-3, quantity: 21.8, module: module.machining-centre }
    - { code: LBS1-08, name: "Plasma heater", description: "The radio-frequency source that brings the plasma to burning.", mass: 16, length: 9.42, width: 1.59, height: 0.537, item: good.electronics, quantity: 16, module: module.assembly-shop }
    - { code: LBS1-09, name: "Refrigerator", description: "Keeps the windings cold.", mass: 6, length: 6.79, width: 1.14, height: 0.387, item: good.heat-pumps, quantity: 6, module: module.assembly-shop }
    - { code: LBS1-10, name: "Coolant pumps", description: "Drive the coolant through wall and shield.", mass: 13, length: 8.79, width: 1.48, height: 0.501, item: good.pumps, quantity: 13, module: module.assembly-shop }
    - { code: LBS1-11, name: "Coolant lines", description: "Pipes and manifolds.", mass: 23, length: 10.6, width: 1.79, height: 0.606, item: stock.st304-pl-3, quantity: 26.4, module: module.welding-bay }
