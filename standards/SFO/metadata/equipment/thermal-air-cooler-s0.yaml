identity:
  key: equipment.thermal.air-cooler.s0
  name: "Air cooler S0"
  maker: org.hadley
  revision: draft
  slot: thermal
  description: "A finned core with a fan: 20 kW from the coolant loop to the air, where there is air (of 0.3 kg/m3 or more); nothing in vacuum. A commuter on a world with air cools this way and carries a small radiator for the dock. A box housing with the finned core across its front face and one guarded fan at the rear drawing air through it; four bolted feet, two capped coolant ports and a power port at the rear."
size_class: 1
fits: mount.thermal-s1c
