    - { code: ACL0-02, name: "Fan", mass: 4, length: 0.335, width: 0.268, height: 0.201, item: good.electric-motors, quantity: 4, module: module.assembly-shop }
    - { code: ACL0-03, name: "Housing", mass: 2, length: 0.232, width: 0.186, height: 0.139, item: stock.al6061-pl-5, quantity: 2.3, module: module.machining-centre }
making:
  module: module.assembly-shop
function:
  kind: heat_exchanger
  transfers: 20000.0
visual:
  format: "freefall-model/1"
  path: "models/thermal-air-cooler-s0/v1"
  manifest_sha256: "daf36c6fa4d5ba3c44a636eaed58c957ea975e699cd139ec0228d27724df69af"
  version: 1
  triangles: 2450
life: 473364000
basis:
  - { of: [function, physical, needs], tier: invented, review: true, note: "A car's radiator and fan: about 20 kW at a 30 K difference from 15 kg of finned aluminium, 400 W of fan. From memory; review." }
  - { of: [needs.power, function.transfers], tier: derived, review: true, note: "Flag: 20 kW at a 30 K air rise (an upper bound; air leaving at coolant temperature) needs 0.67 kg/s of air: 0.55 m3/s in sea-level air (1.2 kg/m3), 2.2 m3/s at the 0.3 kg/m3 floor. Core pressure drop goes as 1/density at the same mass flow, so fan power goes as 1/density squared: about 400 W at 1.2 kg/m3 becomes about 6 kW at 0.3, and a 0.21 m fan would need about 64 m/s through its disc. The 400 W holds near sea-level air only; in thin air either the rating falls (about 20 kW x density/1.2 at the same fan) or the fan and power grow. Not changed."}
  - { of: [built_of, making], rule: rule.first-design-parts }
  - { of: [life], rule: rule.life-ship-system }
