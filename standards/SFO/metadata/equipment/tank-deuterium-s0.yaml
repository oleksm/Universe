        basis: [{ of: [physical.mass, fit], tier: derived, review: true, source: "standards/sources/research_ship_equipment.json", note: "Chosen to sum to the product's weight. Discovery II's tank is 73% structure, 9% fluid and electrical gear, 9% mountings (and its own thrusters, left out here)." }, { of: [made_from, making], rule: rule.cut-loss }] }
