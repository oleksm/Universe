        basis: [{ of: [physical.mass, fit], tier: derived, review: true, source: "standards/sources/research_ship_equipment.json", note: "Chosen to sum to the product's weight. Discovery II's tank is 73% structure, 9% fluid and electrical gear, 9% mountings (and its own thrusters, left out here)." }] }
    - { code: TKS0-04, name: "Gauging", description: "Sensors and their box: how much is left.", mass: 10, length: 1.3, width: 1.3, height: 1.3, item: good.electronics, quantity: 10, module: module.assembly-shop,
