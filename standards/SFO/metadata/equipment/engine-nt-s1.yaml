    - { code: NTE1-02, name: "Shadow shield", mass: 875, length: 1.89, width: 0.756, height: 0.756, item: good.carbon, quantity: 875, module: module.assembly-shop }
    - { code: NTE1-03, name: "Nozzle", description: "Regeneratively cooled.", mass: 525, length: 1.59, width: 0.638, height: 0.638, item: stock.st304-pl-3, quantity: 603.8, module: module.welding-bay }
