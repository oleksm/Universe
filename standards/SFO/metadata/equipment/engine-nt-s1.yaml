basis:
  - { of: [function.exhaust, function.thrust, physical.mass], tier: invented, review: true, note: "NERVA-class, from memory: the NERVA XE gave about 250 kN at 7 km/s from about 18 t with its shield; 9 km/s is the advanced solid-core figure (Isp about 900 s). The classes scale by thrust. No source looked up. Review." }
  - { of: [function.isotropic_loss, function.shield_pass, function.heat_to_hull], tier: invented, review: true, note: "About a twentieth of the reactor's power leaks as neutrons and gamma in every direction; a shadow shield passes a hundredth toward the ship: 0.000126 of the jet aboard at a twentieth of the sphere. From memory; review." }
  - { of: [function.throttle, function.gimbal], tier: invented, review: true, note: "A solid core throttles to about a third; a gimballed nozzle gives about six degrees. Chosen." }
  - { of: [built_of, making], rule: rule.first-design-parts }
  - { of: [built_of.list, function.gimbal], tier: derived, review: true, note: "Gimbal and feed, as the modeller proposed in v1. Two powered trunnions at right angles, 0.75 m aft of the face and carried by two side brackets (no full fixed ring), swing the reactor, nozzle and pump together. The hydrogen comes in through rotary unions on the trunnion axes, with no flex hose, then down an engine-owned pipe to the pump. The unions sit before the pump, so they see tank pressure, not the 4 MPa. Checked: 2.78 kg/s of liquid hydrogen (71 kg/m3) in a 90 mm bore runs at 6 m/s. The 140 mm pins have 9.0e-3 m2 of section, so 25 kN of thrust shears them at 2.8 MPa, and even 120 kN of side load (2.5 t at 5 g) at 13 MPa. Slewing about 2,000 kg m2 through 0.1 rad in 1 s takes about 800 N m, so the drives fit in the controls' 280 kg. Cryogenic rotary seals leak and want qualifying; seals and loads are provisional. Review." }
  - { of: [function.chamber], tier: derived, review: true, note: "Chamber pressure 4 MPa, NERVA-class (chosen, from memory). The hydrogen is ideal with gamma 1.4: at an expansion of 108 the vacuum thrust coefficient is 1.75, so the throat is 25 kN / (1.75 x 4 MPa) = 3.6e-3 m2, 67 mm across. The exit is 0.7 m. With 2.78 kg/s, c* is 5,140 m/s, which needs about 3,000 K at the core exit, the advanced solid-core figure that the 9 km/s assumes. The nozzle is an 80% bell, about 1 m long. The hydrogen cools the nozzle and core, then drives the turbopump (expander, as NERVA used). Review." }
  - { of: [built_of.list, function.gimbal], tier: derived, review: true, note: "Layout, with the modeller's first blockout (v1). The mount face is at the fore end and the jet aft. The shield is fixed at the face: a graphite disc at 1,800 kg/m3, 1.1 m across and 0.5 m thick, 855 kg, 875 kg with its casing. The reactor and nozzle gimbal together, as NERVA's did, about a pivot 0.75 m aft of the face (moved 50 mm aft in v2 so the drive housings clear the shield). The core is centred 1.2 m aft (reaction_offset) and the nozzle runs aft to 3 m. At 0.1 rad the 0.7 m exit swings 0.225 m, and its edge stays within the 1.2 m width (a 1 m exit would not). The other part boxes are cube-root placeholders, not shapes. Review." }
  - { of: [life], rule: rule.life-ship-system }
