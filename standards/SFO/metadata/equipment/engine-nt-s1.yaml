    - { code: NTE1-02, name: "Shadow shield", description: "A nuclear-graphite disc at the mount face, 1.1 m across and 0.5 m thick; it does not swing with the engine.", mass: 875, length: 1.1, width: 1.1, height: 0.5, item: good.carbon, quantity: 875, module: module.assembly-shop }
