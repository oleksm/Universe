identity:
  key: equipment.cargo.berths.4
  name: "Crew berths 4"
  maker: org.hadley
  revision: draft
  slot: cargo
  description: "Four sleep pods: two stacks of two, back to back, each stack as in Crew berths 2. Each pod is a 1.94 x 0.82 m bunk with a locker over the feet, a reading light and a fan. The two stacks open on opposite long faces, onto two hull corridors, one each side; there is no aisle inside. A narrow fixed ladder at the foot end of each face, 70 mm proud, reaches its upper pod. Between the stacks, behind the back walls, a shared concealed service spine carries power, light and air to all four pods. The walls and sliding screens are for privacy, not pressure. In a cargo slot, as a cabin is."
size_class: 1
fits: mount.cargo-s1
