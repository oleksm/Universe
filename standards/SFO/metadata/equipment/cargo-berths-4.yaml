  list:
    - { code: BRT4-01, name: "Bunks and lockers", description: "Four bunk trays, 1.94 x 0.82 m each, two stacks of two; a mattress 0.1 m thick; above the feet of each, a locker 0.35 m long and 0.35 m high across the bunk; two foot-end ladders.", mass: 234, length: 1.53, width: 1.53, height: 1.53, item: stock.al6061-pl-5, quantity: 269.1, module: module.machining-centre }
    - { code: BRT4-02, name: "Partition, screens and service spine", description: "The shared back wall and service spine, the ends, the shelves between the pods and the tops; on each open face, a sliding privacy screen a pod. No pressure door: each open face is a hull corridor wall.", mass: 208, length: 1.47, width: 1.47, height: 1.47, item: stock.al6061-sh-2-panel, quantity: 239.2, module: module.welding-bay }
    - { code: BRT4-03, name: "Linings, bedding, lights", mass: 78, length: 1.06, width: 1.06, height: 1.06, item: stock.mli-fl, quantity: 78, module: module.assembly-shop }
