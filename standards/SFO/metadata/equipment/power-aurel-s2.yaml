basis:
  - { of: [physical, needs, function, size_class], rule: rule.early-list }
  - { of: [built_of, making], tier: invented, review: true, note: "A first design: a fusion reactor and the turbine set that turns its heat to power, in the shares of NASA's Discovery II, brought to this product's weight. What makes one maker's plant lighter or thriftier than another's is not yet in its parts." }
  - { of: [built_of.list, physical.mass], tier: derived, review: true, note: "Radiator and frame from material, size and load, the rest of the list as before: 3,482 kg (was 2,400). Panel: 8.85 by 8.85 m of 3 mm carbon-carbon at 1,750 kg/m3, 411 kg; 78.3 m2 radiating from both faces sheds 8 MW at 1,000 K and emissivity 0.9, standing up (flat, half), on 10 mm fused-silica stand-offs as the S1. Frame: in 6061 the 17.7 m span at the mount's 3 g came to some 4,100 kg of plant, over the mount's 3,750, so it is carbon composite (1,580 kg/m3, 55 GPa, 700 MPa to first failure taken at 300 MPa allowed for bonded joints; invented knock-down). Two side trusses 1.85 m deep in eight bays of 2.21 m, 120 by 3 mm tube (chords 61 kN, 56 MPa, buckling 140 kN over 1.5; diagonals 40 kN against 82 kN); nine floor beams 160 by 3 tube across 8.85 m (221 MPa); nine top ties and stiffeners 80 by 3; radiator rails 160 by 3 tube (203 MPa standing up at 1 g, stowed flat for more); plus 10% for joints and the hinge; 751 kg. Blender drew it (candidate v01): 770.8 kg with the hinge, 56 silica saddles and eight bored aluminium compression lands, top and bottom, where tubes block the bolt seats; bound at 781, the drawing and 10 kg for bonding; plant 3,512 kg. The mount's eight corner points are the four plan corners, a pad at each end of each truss's top and bottom chord: 25.8 kN a corner against two pads' 27.6. Open: epoxy carbon is good to about 450 K, so the rails' temperature under the stand-offs needs working out, as the S1's; plate stiffness and machinery not worked out. Built for airless places (space, airless moons): carbon-carbon burns in hot air and the panel would shed heat by convection as well, so a plant for a world with air wants a different radiator (a coated or ceramic panel, or an air-cooled exchanger), not this one. Coolant lines and the reactor parts are still in Discovery II's shares." }
  - { of: [physical.length, physical.width, physical.height, physical.volume], tier: derived, review: true, source: "docs/ships/mc-07-equipment-dimensions.md", note: "As the S1 plant: its radiator for 8.0 MW of waste heat at 1,000 K, 78 m2 of panel, with the plant beneath. Width 9.1 m: the 8.85 bay and an outboard hinge as the S1's; height 2.15 m: chords to 1.97 m, then 160 mm rails, stand-offs and plate; as drawn, 17.7 by 9.1 by 2.148 m; within the mount's 26.5 by 13.3 by 2.2." }
  - { of: [built_of.list], tier: derived, review: true, note: "Open (2026-10-13): the panel is taken at one temperature all over, but heat has to reach it. A 3 mm carbon-carbon fin at 1,000 K (k about 60 W/m K in the plane, invented) spreads heat only a few centimetres before radiating it, so the panel needs heat pipes or coolant channels a few centimetres apart, or a high-conductivity pitch-fibre plate. Their mass is not in the panel yet." }
  - { of: [life], rule: rule.life-ship-system }
