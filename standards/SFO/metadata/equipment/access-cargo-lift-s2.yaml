basis:
  - { of: [physical, function, size_class], tier: invented, review: true, note: "A 3 by 3 m platform lifting 20 t through 8 m: a heavy goods lift's figures. Chosen. Four columns cannot fold 8 m into a 1 m box (blender, 2026-10-11): it is a three-stage scissor, as heavy dock and loading lifts are, folded flat in its box and owning its whole mechanism; the hull gives only the opening it rises through." }
  - { of: [physical.mass, built_of], tier: invented, review: true, note: "3 t is light for a scissor that carries 20 t up 8 m: lifts of that duty weigh several times that. And folded to 0.21 m a tier, its rams must push about 18 MN to start 20 t at 1 g (blender, 2026-10-11): a real heavy scissor starts from a steeper least angle (a taller box) or lifts less from the floor. Its model is kinematic only; capacity and drive left for review. Measured (candidate-v01): the drawn steel structure, 12 mm deck, 6 mm walls to arms and frame and its side slider guides, is 3,776 kg before the pump and valves, already over its 3 t; the ideal folded force is 18.234 MN before the mechanism's own weight and losses." }
  - { of: [built_of, making], rule: rule.first-design-parts }
  - { of: [life], rule: rule.life-ship-system }
