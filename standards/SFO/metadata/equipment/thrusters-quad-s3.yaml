  - { of: [built_of, making], tier: invented, review: true, note: "A first design of a thruster block (a small torch of the same kind): the components of a fusion engine, in the shares of the one such engine designed in detail (NASA's Discovery II), brought to this product's weight. That engine makes 8.6 kW of jet for each kg; this one is asked for about a hundred thousand times that: the invented part." }
