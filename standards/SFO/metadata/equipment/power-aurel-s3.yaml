basis:
  - { of: [physical, needs, function, size_class], rule: rule.early-list }
  - { of: [built_of, making], tier: invented, review: true, note: "A first design: a fusion reactor and the turbine set that turns its heat to power, in the shares of NASA's Discovery II, brought to this product's weight. What makes one maker's plant lighter or thriftier than another's is not yet in its parts." }
  - { of: [built_of.list, physical.mass], tier: derived, review: true, note: "Radiator and frame from material, size and load as the S2's, the rest of the list as before: 6,045 kg (was 4,000). Panel: 11.7 by 11.7 m of 3 mm carbon-carbon, 719 kg; 137 m2 radiating from both faces sheds 14 MW at 1,000 K and emissivity 0.9, standing up, on fused-silica stand-offs. Frame in carbon composite at 300 MPa allowed, the plant at the mount's 3 g: two side trusses 1.75 m deep in ten bays of 2.34 m, chords 160 by 3 tube (149 kN, 100 MPa, buckling 301 kN over 1.5), diagonals 120 by 3 (74 kN against 80); eleven floor beams 160 by 5 across 11.7 m (259 MPa); top ties and stiffeners 80 by 3; radiator rails 200 by 5 (190 MPa standing up at 1 g); plus 10% for joints and the hinge; 1,461 kg. Blender drew it (candidate v01): 1,435.5 kg with the hinge, 72 silica saddles and eight bored metal compression lands; the 1,461 kept leaves 25.5 kg for bonding. Eight corner points as the S2's: 44.5 kN a corner against two pads' 46, and 6,045 kg against the mount's 6,250, so little to spare. Open: rail temperature under the stand-offs (epoxy to about 450 K), plate stiffness, machinery. Built for airless places (space, airless moons): carbon-carbon burns in hot air and the panel would shed heat by convection as well, so a plant for a world with air wants a different radiator (a coated or ceramic panel, or an air-cooled exchanger), not this one. Coolant lines and the reactor parts are still in Discovery II's shares." }
  - { of: [physical.length, physical.width, physical.height, physical.volume], tier: derived, review: true, source: "docs/ships/mc-07-equipment-dimensions.md", note: "As the S1 plant: its radiator for 14.0 MW of waste heat at 1,000 K, 137 m2 of panel, with the plant beneath. Width 11.95 m: the 11.7 bay and an outboard hinge; height 2.15 m: chords to 1.91 m, then 200 mm rails, stand-offs and plate; as drawn, 23.4 by 11.95 by 2.138 m; within the mount's 35.1 by 17.6 by 2.2." }
  - { of: [built_of.list], tier: derived, review: true, note: "Open (2026-10-13): the panel is taken at one temperature all over, but heat has to reach it. A 3 mm carbon-carbon fin at 1,000 K (k about 60 W/m K in the plane, invented) spreads heat only a few centimetres before radiating it, so the panel needs heat pipes or coolant channels a few centimetres apart, or a high-conductivity pitch-fibre plate. Their mass is not in the panel yet." }
  - { of: [life], rule: rule.life-ship-system }
