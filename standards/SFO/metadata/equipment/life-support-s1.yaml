making:
  module: module.assembly-shop
function:
  kind: life_support
  water_recovery: 0.9
  air_recovery: 0.5
  persons: 3
  cooling: 1500
life: 473364000
basis:
  - { of: [physical, needs, function, size_class], rule: rule.early-list }
  - { of: [built_of, making], tier: invented, review: true, note: "A first design, by the space station's plant: it cleans water, makes oxygen from it, scrubs the air and carries heat away. By the station's weights (231 kg of water plant and 62 kg of oxygen plant a head) 800 kg keeps about three people." }
  - { of: [physical.length, physical.width, physical.height, physical.volume], tier: derived, review: true, source: "standards/sources/research_people_needs.json", note: "2 racks of the space station's size (a rack is 1.57 m3: about 2.0 by 1.05 by 0.85 m), side by side: the station's water and oxygen plant is 2,061 kg in three racks, this 800 kg is 2. The rack's shape is from memory." }
  - { of: [function.water_recovery, function.air_recovery], tier: sourced, review: true, source: "standards/sources/research_people_needs.json", note: "The space station's figures: about 90% of water recovered, about half the oxygen from carbon dioxide (its Sabatier reactor), from memory of its ECLSS reports; the rest is made up from the tanks." }
  - { of: [life], rule: rule.life-ship-system }
  - { of: [function.persons, function.cooling], tier: derived, review: true, note: "By the space station's weights (231 kg of water plant and 62 kg of oxygen plant a head) 800 kg keeps about three people; it carries their heat and their equipment's, 500 W a head (137 W of a person's heat plus displays, lights and fans), and dries the air." }
