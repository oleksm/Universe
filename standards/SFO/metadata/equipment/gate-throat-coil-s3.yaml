identity:
  key: equipment.gate.throat-coil.s3
  name: "Halcyon throat coil"
  maker: org.halcyon
  revision: draft
  slot: gate
  description: "What holds the tube. One stands in each segment of a ring, about 160 m apart: a closed racetrack coil in a titanium case, its cold plant and switchgear behind it. Together, round the whole ring, they hold its tube open, and all the power that takes goes through them."
size_class: 3
fits: mount.gate-s3
physical:
  volume: 60
  mass: 107300
  length: 9.86
  width: 2.47
  height: 2.47
built_of:
  parts: gate-throat-coil-s3
  list:
    - { code: THCL-01, name: "Coil case", description: "A closed racetrack in the XZ plane, 9.86 m by 2.47 m outside, 1.4 m deep in Y: two straight legs 0.6 m thick (Z) round a 1.27 m bore, joined by round end arcs (0.935 m to the winding's centre); sealed, the winding inside it.", mass: 72600, length: 9.86, width: 1.4, height: 2.47, item: stock.ti64-pl-5, quantity: 83490, module: module.welding-bay }
    - { code: THCL-02, name: "Winding", description: "Superconducting cable, about 0.058 m2 in each leg, round the racetrack inside the case.", mass: 10700, length: 9.5, width: 1.3, height: 2.1, item: stock.cu-wire-2, quantity: 12305, module: module.machining-centre }
    - { code: THCL-03, name: "Refrigerator", description: "Behind the coil (+Y), on one side.", mass: 12000, length: 4.25, width: 1.06, height: 1.06, item: good.heat-pumps, quantity: 12000, module: module.assembly-shop }
    - { code: THCL-04, name: "Current leads and switchgear", description: "Behind the coil (+Y), beside the refrigerator.", mass: 12000, length: 4.25, width: 1.06, height: 1.06, item: good.electronics, quantity: 12000, module: module.assembly-shop }
