basis:
  - { of: [function], tier: invented, review: true, note: "What a tube asks of a coil is invented: here, about 3 T across the coil's bore, the most this case holds. Not in the game yet." }
  - { of: [built_of.list, physical.mass], tier: derived, review: true, note: "Sized from the coil's own magnetic load. 3.1 T is a pressure B2/2mu0 of 3.9 MPa on the inner face of each straight leg: 5.4 MN a metre over 7.4 m, 37 MN m of bending, which a solid Ti-6Al-4V leg 0.6 m thick and 1.4 m deep holds at half yield. Ampere-turns: B x 1.4 m / (mu0 x 0.6) = 5.8 MA, at 100 A/mm2 (a cable's engineering current density) 0.058 m2 a leg, 10.7 t over a 20.65 m mean turn (2 x 7.39 m + 2 pi x 0.935 m; the copper wire stock stands for the cable). Case: 72.6 t, the modeller's measured volume of the racetrack with its supports, less the winding (candidate-v01). The refrigerator and switchgear are kept from the first design (invented)." }
  - { of: [physical.volume, physical.length, physical.width, physical.height], tier: invented, review: true, note: "The first stand-in envelope, kept: the coil fills 1.4 m of its depth and the cold plant and switchgear the 1.07 m behind." }
  - { of: [built_of, making], rule: rule.first-design-parts }
  - { of: [life], rule: rule.life-ship-system }
