basis:
  - { of: [physical, function, size_class], tier: invented, review: true, note: "Hydrolox at 320 kg/m3: 10.9 m3 as a ball 2.75 m across, in a 2.8 m box; insulated for liquid hydrogen and oxygen at 12% of its contents. Sized for the Wren commuter (2026-10-07): a landing and a take-off at 1 g take about 3 t. Chosen." }
  - { of: [built_of.list, physical], tier: derived, review: true, note: "Sized as the 2 t (2026-10-13, from the modeller's blockout v01): 3,500 kg at O/F 5.5, each side with 3% ullage, the 100 mm common bulkhead inside a 1.383 m inner radius. Wall: 0.35 MPa plus the oxygen's full-diameter head at 30 m/s2 (95 kPa), times 1.5 against 165 MPa welded, wants 2.8 mm: 3 mm sheet, 195 kg bare plus 20% for lands and bosses. Insulation 100 mm at 3.3 kg/m2, bulkhead 76 kg, saddles 36.5 kg, fittings 50 kg for two circuits (32 drawn). Total 476 kg, 14% of what it holds (it was 420 kg at an assumed 12%). Box: 3.187 x 2.972 x 3.087 m with saddles and opposed service bosses; it was a 2.8 m box with no room for the insulation. Chosen; review." }
  - { of: [built_of, making], rule: rule.first-design-parts }
  - { of: [life], rule: rule.life-ship-system }
