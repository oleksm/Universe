    - { code: TKHL0-02, name: "Insulation", description: "80 mm of foam on the shell under a multilayer blanket and closeout, 100 mm in all: the sphere is 2.972 m across over it.", mass: 79.7, length: 2.972, width: 2.972, height: 2.972, item: stock.mli-fl, quantity: 79.7, module: module.assembly-shop }
    - { code: TKHL0-03, name: "Fittings and gauging", description: "For each circuit: an outlet with an anti-vortex screen, a pressurant diffuser, fill and drain, vent and relief valves, level gauging. Every port is capped until the hull connects it.", mass: 50, length: 0.8, width: 0.45, height: 0.45, item: stock.st304-pl-3, quantity: 57.5, module: module.machining-centre }
