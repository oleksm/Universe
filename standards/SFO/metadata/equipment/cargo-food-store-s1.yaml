identity:
  key: equipment.cargo.food-store.s1
  name: "Food store"
  maker: org.hadley
  revision: draft
  slot: cargo
  description: "A larder: racks and sealed bins holding a tonne of food of any kind sold as food (market.food), part of it chilled. 1,000 kg is 667 person-days at need.food's 1.5 kg a day. A rack of two columns of four sealed bins, one of the eight chilled; eight corner mount pads, four at the base and four at the top."
size_class: 1
fits: mount.cargo-s1
physical:
  mass: 150
  volume: 3.6
  length: 1.5
  width: 1.2
  height: 2
needs:
  power: 200
built_of:
  parts: cargo-food-store-s1
  list:
    - { code: FST1-01, name: "Racks and bins", description: "Shelving and sealed bins.", mass: 90, length: 1.27, width: 1.01, height: 1.69, item: stock.al6061-pl-5, quantity: 103.5, module: module.machining-centre }
    - { code: FST1-02, name: "Chilled section", description: "A chiller for what must be kept cold.", mass: 45, length: 1, width: 0.803, height: 1.34, item: good.heat-pumps, quantity: 45, module: module.assembly-shop }
    - { code: FST1-03, name: "Fittings", mass: 15, length: 0.696, width: 0.557, height: 0.928, item: stock.st304-pl-3, quantity: 17.25, module: module.machining-centre }
making:
  module: module.assembly-shop
function:
  kind: store
  capacity: 1000
  holds: market.food
visual:
  format: "freefall-model/1"
  path: "models/cargo-food-store-s1/v1"
  manifest_sha256: "e5b54b291678257979e93ede1c9603acbe0d563f29dc3ecac4f7379c16b22fa2"
  version: 1
  triangles: 3624
life: 473364000
basis:
  - { of: [physical, needs, function, size_class], tier: invented, review: true, note: "A tonne of packed food in 3.6 m3 of racks, of which about 2.7 m3 is usable bin space: 370 kg/m3, inside the 300 to 600 kg/m3 of packaged provisions (from memory). One bin of eight chilled (an eighth of the space); the racks and bins 150 kg. Chosen." }
  - { of: [built_of, making], rule: rule.first-design-parts }
  - { of: [physical.mass], tier: derived, review: true, note: "Flag: the Blender candidate (cargo-food-store-s1 v01, 2.72 m3 usable) comes to about 212 kg before wiring and insulation: thin-wall rack and bins 160 kg, chilled liner 7 kg, chiller 45 kg, against 150. Either the mass rises to about 220 to 230 kg or the rack is lightened; not changed." }
