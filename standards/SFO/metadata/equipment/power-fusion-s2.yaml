identity:
  key: equipment.power.fusion.s2
  name: "Fusion Plant S2"
  maker: org.hadley
  revision: outdated
  slot: power
  description: "A ship's power plant: the box is two halves side by side, each 12.08 m square. One is the plant bay, 2 m deep, closed, with the reactor and turbine set inside; the other is its radiator, a 146 m2 panel that sheds 14.9 MW from both faces at 1,000 K, stowed flat beside the bay and swung out on its root hinge along the bay's edge to stand clear. Mount at the base of the bay."
size_class: 2
fits: mount.power-s2
physical:
  mass: 5261
  volume: 620.5
  length: 24.16
  width: 12.33
  height: 2.083
built_of:
  parts: power-fusion-s2
  shares: rule.discovery-ii-reactor-shares
  list:
    - { code: PFS2-01, name: "First wall", description: "The lining that faces the burning plasma.", mass: 117, length: 8.17, width: 4.1, height: 0.678, item: stock.sic-tl-10, quantity: 134.5, module: module.machining-centre }
    - { code: PFS2-02, name: "Field coil cases", description: "Hold the field coils against their own force.", mass: 1065, length: 17.1, width: 8.57, height: 1.42, item: stock.ti64-pl-5, quantity: 1224.8, module: module.welding-bay }
    - { code: PFS2-03, name: "Field coil windings", description: "The superconducting windings.", mass: 13, length: 3.93, width: 1.97, height: 0.326, item: stock.cu-wire-2, quantity: 14.9, module: module.machining-centre }
    - { code: PFS2-04, name: "Shaping coils and bracing", description: "Shape and hold the plasma.", mass: 646, length: 14.4, width: 7.25, height: 1.2, item: stock.ti64-pl-5, quantity: 742.9, module: module.welding-bay }
    - { code: PFS2-05, name: "Shield", description: "Carbon between the plasma and the coils.", mass: 755, length: 15.2, width: 7.64, height: 1.26, item: good.carbon, quantity: 755, module: module.assembly-shop }
    - { code: PFS2-06, name: "Turbine and compressor", description: "The gas turbine that the reactor's heat drives.", mass: 34, length: 5.41, width: 2.72, height: 0.449, item: stock.ti64-pl-5, quantity: 39.1, module: module.machining-centre }
    - { code: PFS2-07, name: "Alternator", description: "Turns the turbine's work to current.", mass: 25, length: 4.89, width: 2.45, height: 0.405, item: good.electric-motors, quantity: 25, module: module.assembly-shop }
    - { code: PFS2-08, name: "Power conditioning", description: "Switchgear and converters.", mass: 50, length: 6.16, width: 3.09, height: 0.511, item: good.electronics, quantity: 50, module: module.assembly-shop }
    - { code: PFS2-09, name: "Radiator panel", description: "Sheds the heat the turbine cannot use: one carbon-carbon plate beside the plant bay, hinged on its long edge to stand up and radiate from both faces.", mass: 766, length: 12.08, width: 12.08, height: 0.003, item: stock.cc-pl-3, quantity: 880.9, module: module.assembly-shop }
    - { code: PFS2-10, name: "Frame", description: "Carries the set to the corner pads: two side trusses, floor beams under the plant, and the radiator's rails, in bonded carbon tube.", mass: 1596, length: 24.16, width: 12.08, height: 1.87, item: stock.cfc-tb-120x5, quantity: 1835.4, module: module.assembly-shop }
    - { code: PFS2-11, name: "Flywheel", description: "Evens the load.", mass: 42, length: 5.81, width: 2.92, height: 0.482, item: stock.st4340-bar-120, quantity: 48.3, module: module.machining-centre }
    - { code: PFS2-12, name: "Coolant pumps", description: "Drive the coolant.", mass: 34, length: 5.41, width: 2.72, height: 0.449, item: good.pumps, quantity: 34, module: module.assembly-shop }
    - { code: PFS2-13, name: "Coolant lines", description: "Pipes and manifolds.", mass: 59, length: 6.51, width: 3.27, height: 0.54, item: stock.st304-pl-3, quantity: 67.8, module: module.welding-bay }
    - { code: PFS2-14, name: "Refrigerator", description: "Keeps the windings cold.", mass: 17, length: 4.3, width: 2.16, height: 0.357, item: good.heat-pumps, quantity: 17, module: module.assembly-shop }
    - { code: PFS2-15, name: "Plasma heater", description: "Brings the plasma to burning.", mass: 42, length: 5.81, width: 2.92, height: 0.482, item: good.electronics, quantity: 42, module: module.assembly-shop }
