basis:
  - { of: [physical, needs, function, size_class], rule: rule.early-list }
  - { of: [built_of, making], tier: invented, review: true, note: "A first design: a fusion reactor and the turbine set that turns its heat to power, in the shares of NASA's Discovery II, brought to this product's weight. What makes one maker's plant lighter or thriftier than another's is not yet in its parts." }
  - { of: [physical.length, physical.width, physical.height, physical.volume], tier: derived, review: true, source: "docs/ships/mc-07-equipment-dimensions.md", note: "As the S1 plant: its radiator for 14.9 MW of waste heat at 1,000 K, 146 m2 of panel, with the plant beneath." }
  - { of: [identity.description], tier: derived, review: true, note: "For the modeller (2026-10-10): 8 MW out at 35% leaves 14.9 MW to shed; at 1,000 K from both faces (102 kW/m2) that is 146 m2, half the 24.16 x 12.33 m box, so the box holds the panel stowed beside the plant bay, not twice the panel. Exterior only; the parts stay mass proxies (the plant's 3 t is far too light for a fusion reactor of this power, as for the torch: open)." }
  - { of: [built_of.list, physical], tier: derived, review: true, note: "Radiator and frame from material, size and load, as the Aurel plants (2026-10-13), the rest of the list as before: 5,261 kg (was 3,000). Built for airless places: the hot carbon plate would burn in air, and air carries heat off besides, so a plant for a world with air wants another radiator. Panel: 12.08 by 12.08 m of 3 mm carbon-carbon at 1,750 kg/m3, 766 kg; 146 m2 from both faces sheds the 14.9 MW the turbine cannot use (8 MW out at 35%) at 1,000 K and emissivity 0.9, standing up, on fused-silica stand-offs; it lies beside the plant bay when stowed. Frame in carbon composite (1,580 kg/m3, 55 GPa, 300 MPa allowed for bonded joints; invented knock-down), the whole plant at the mount's 3 g: two side trusses 1.75 m deep in 10 bays of 2.41 m, chords 120 by 5 mm tube, diagonals 120 by 3; floor beams 160 by 5; top ties and stiffeners 80 by 3; radiator rails 200 by 5; chords 133 kN against 186 kN; diagonals 66 kN against 77 kN; floor beams 233 MPa; rails 211 MPa; plus 10% for joints and the hinge: 1,596 kg. 38.7 kN at each plan corner. Size: the bays, an outboard hinge, chords, rails, stand-offs and plate. Over the old power mounts, which were regenerated from it. Open, as the Aurel plants: the rails' temperature under the stand-offs, and the reactor parts, still mass proxies." }
  - { of: [life], rule: rule.life-ship-system }
