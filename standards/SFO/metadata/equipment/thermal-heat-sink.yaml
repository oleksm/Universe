identity:
  key: equipment.thermal.heat.sink
  name: "Heat sink"
  maker: org.aurel
  revision: draft
  slot: thermal
  description: "Thermal mass that takes a burst of heat and gives it up slowly: an insulated horizontal vessel of 2.7 t of water that the coolant loop runs through, hot in at the top, cold out at the bottom, layered with no mixing."
size_class: 2
fits: mount.thermal-s2
physical:
  mass: 3017.5
  volume: 5.25
  length: 2.55
  width: 1.41
  height: 1.46
built_of:
  parts: thermal-heat-sink
  list:
    - { code: HSK0-01, name: "Water", description: "2.7 m3 of water, filled through the loop; 4% of the vessel left for its expansion, behind a bladder.", mass: 2660, length: 2.37, width: 1.3, height: 1.3, item: good.water, quantity: 2660.0, module: module.assembly-shop }
    - { code: HSK0-02, name: "Shell", description: "A welded aluminium cylinder, 1.3 m across, with 2:1 dished heads, 2.38 m long over the metal: 2.86 m3 inside, 5 mm wall; the saddle hardpoints pass through the insulation to it.", mass: 173, length: 2.38, width: 1.31, height: 1.31, item: stock.al6061-pl-5, quantity: 199.0, module: module.welding-bay }
    - { code: HSK0-03, name: "Insulation", description: "Foam under a multilayer blanket and closeout, 50 mm in all.", mass: 23, length: 2.47, width: 1.41, height: 1.41, item: stock.mli-fl, quantity: 23.0, module: module.assembly-shop }
    - { code: HSK0-04, name: "Diffusers and bladder", description: "Slotted inlet and outlet pipes along the top and bottom that keep the hot layer over the cold, and the expansion bladder.", mass: 40, length: 2.2, width: 1.2, height: 1.2, item: stock.st304-pl-3, quantity: 46.0, module: module.machining-centre }
    - { code: HSK0-05, name: "Nozzles and valves", description: "The coolant pair on the end heads, hot in high at one end and cold out low at the other, feeding the diffusers inside; a drain, a vent and the temperature probes' connector; capped until the hull connects them.", mass: 40, length: 0.4, width: 0.3, height: 0.3, item: stock.st304-pl-3, quantity: 46.0, module: module.machining-centre }
    - { code: HSK0-06, name: "Saddles and feet", description: "Two saddles under the vessel on four feet, one per mount point: contoured seat pads, 8 mm webs, 12 mm cross rails, 10 mm feet (81.5 kg as drawn on the candidate v01).", mass: 81.5, length: 1.6, width: 1.41, height: 0.2, item: stock.st304-pl-3, quantity: 93.7, module: module.welding-bay }
