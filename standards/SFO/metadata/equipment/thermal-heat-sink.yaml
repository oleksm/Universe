basis:
  - { of: [function, size_class], tier: invented, review: true, note: "1 GJ: 200 s of the coolant loop S1's 5 MW. Chosen." }
  - { of: [built_of.list, physical, identity.description], tier: derived, review: true, note: "Worked out 2026-10-13 for the modeller's blockout v01. The 5 t of salt could not hold 1 GJ: rock salt is about 0.9 kJ/kg K (from memory), 0.45 GJ over 100 K, and heat would need coils of hundreds of m2 to get into it in a burst. Water at 4.18 kJ/kg K from 278 to 368 K (kept off freezing and boiling at the loop's 0.6 MPa) holds 376 kJ/kg: 1 GJ in 2,660 kg, 2.7 m3, plus 4% for expansion. The loop runs through it, so no coils: it takes heat as fast as the loop brings it. Shell: 0.6 MPa plus the water's head at 30 m/s2, times 1.5, against 165 MPa welded wants 3.8 mm, so 5 mm plate, 144 kg bare plus 20%. A cylinder, not a box, to hold the pressure; it lies within the mount's 1.65 m height. Full at 30 m/s2 it puts 22 kN on each mount point (50.6 kN allowed). Total 3,017.5 kg with the saddles as drawn (it was 5,500). The loop's coolant is water-glycol, and there is no glycol good yet: the fill is water." }
  - { of: [built_of, making], rule: rule.first-design-parts }
  - { of: [life], rule: rule.life-ship-system }
