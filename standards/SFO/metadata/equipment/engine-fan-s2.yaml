    - { code: FAN2-02, name: "Fan and hub", mass: 38, length: 1.13, width: 1.13, height: 0.63, item: stock.ti64-pl-5, quantity: 43.7, module: module.machining-centre }
    - { code: FAN2-03, name: "Electric motor", mass: 52, length: 1.27, width: 1.27, height: 0.705, item: good.electric-motors, quantity: 52, module: module.assembly-shop }
