  slot: engine
  description: "An electric fan in a 1.6 m duct: 25 kN in air of 1.2 kg/m3 for 2.4 MW, nothing burnt. Its thrust falls with the cube root of the air's density at the same power; below 0.3 kg/m3 it is not rated."
