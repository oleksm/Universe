identity:
  key: equipment.life-support.s0
  name: "Cabin air pack"
  maker: org.hadley
  revision: draft
  slot: life_support
  description: "Open-loop air for two for a day: an oxygen bottle, lithium hydroxide scrubber canisters, fans and a cabin cooler; nothing recovered. For a commuter or a lifeboat, not a voyage. A closed case on four feet with a service lid; two guarded cabin air faces at the front, capped coolant, power and data ports at the rear. It rejects nothing to the cabin: the cooler's hot side and all its own losses go to the ship's coolant loop through the rear ports."
