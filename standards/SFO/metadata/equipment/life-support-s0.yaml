basis:
  - { of: [physical, needs, function, size_class], tier: invented, review: true, note: "Two people breathe 1.8 kg of oxygen a day (need.air) and give off 2.2 kg of carbon dioxide, which 2.5 kg of lithium hydroxide takes up; the bottle, canisters, fans and a 400 W cooler (two people's 137 W each and their displays) come to 150 kg. A capsule's open-loop pack, from memory of Apollo's and the station's figures. Chosen; review." }
  - { of: [built_of, making], rule: rule.first-design-parts }
  - { of: [needs.power], tier: derived, review: true, note: "Flag: 2 kW looks high. A heat pump lifting 400 W at a COP of 2 to 3 takes 130 to 200 W, the fans about 100 W and the controller about 20 W: about 300 to 400 W. All input ends as heat, so the coolant loop takes the input plus the 400 W lifted (2.4 kW as recorded, about 0.8 kW if lowered). Not changed." }
  - { of: [built_of.list], tier: derived, review: true, note: "Flag: 2.2 kg of oxygen at 300 bar is about 6 L of gas; a composite bottle of that size with its regulator weighs about 5 to 8 kg, not 45 (from memory). The spare mass would cover the case, plumbing and more lithium hydroxide (2.5 kg is near the bare 2.4 kg that 2.2 kg of carbon dioxide needs; packed canisters run about half as much again). Not changed." }
  - { of: [life], rule: rule.life-ship-system }
