basis:
  - { of: [physical, function], tier: derived, review: true, note: "Nitrogen at 300 bar and 293 K is about 310 kg/m3 (compressibility about 1.1; ideal gas would give 345), so 100 kg needs 0.323 m3 inside. A cylinder with hemispherical ends, 0.8 m across over a 25 mm wall, is 1.05 m long, and a valve and regulator take 0.1 m more. A type IV composite vessel stores about 100 kJ of pressure-volume per kilogram (from memory of commercial 300 to 700 bar bottles): 30 MPa x 0.323 m3 is 9.7 MJ, so 97 kg of vessel, plus the valve and 8 kg of saddles and bands (the 50 kg bottle's drawn at 4.9 kg in Blender). Recomputed 2026-10-11 from 0.6 kg a kilogram of gas, which did not fit its box." }
  - { of: [built_of.list, physical], tier: derived, review: true, note: "Wall check (2026-10-13, for the modeller's blockout v01): hoop fibre at 1,500 MPa in the laminate (from memory) times a burst factor of 2.25 wants 17 mm at 30 MPa over 0.375 m; the helical layers about half again: 25 mm, as drawn. 25 mm at 1,580 kg/m3 over the vessel is 98.6 kg against the 97 kg from stored energy: the two agree. Height 0.83 m with the saddles' 30 mm under the bottle." }
  - { of: [built_of, making], rule: rule.first-design-parts }
  - { of: [life], rule: rule.life-ship-system }
