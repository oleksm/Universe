basis:
  - { of: [physical, needs, function, size_class], rule: rule.early-list }
  - { of: [built_of, making], tier: invented, review: true, note: "A first design: a frame of tube and plate with rails and locks. It holds about eleven to seventeen times its own weight." }
  - { of: [physical.length, physical.width, physical.height, physical.volume], tier: derived, review: true, note: "The room its load takes at 500 kg a m3, a middling cargo as stowed: 10,000 kg is 20 m3, twice as long as wide. The racks themselves are in it." }
  - { of: [identity.description, built_of.list, physical.mass], tier: derived, review: true, note: "Modeller's blockout v01 (2026-10-13) with my load case: the 10 t at 3 g (the mounts' design acceleration) on the two bottom long beams, simply supported over the 4.31 m between pads; 4340 at 1,300 MPa yield, quenched and tempered after welding, over a safety factor 1.5 (867 MPa). 140 x 80 x 5 gives 966 MPa and fails; 200 x 80 x 5 gives 567 MPa, sagging 49 mm (L/88). Frame 443 kg from the sections plus 39 kg for the deeper beams, 482 kg before weld unions. Decking and drives keep their first figures until measured. The stock named stays a proxy." }
  - { of: [function.capacity], tier: derived, review: true, note: "10 t is the mass it holds. The clear load space is 10.4 m3 of the 20 m3 box, so a full 10 t needs cargo of 965 kg/m3 or denser; at a middling 500 kg/m3 it fills at 5.2 t." }
  - { of: [life], rule: rule.life-ship-system }
