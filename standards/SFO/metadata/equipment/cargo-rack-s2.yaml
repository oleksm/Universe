identity:
  key: equipment.cargo.rack.s2
  name: "Cargo racks 10 T"
  maker: org.hadley
  revision: outdated
  slot: cargo
  description: "Racks that hold cargo in the hold, the 4 t racks' family made bigger. An open frame round a railed deck: 200 x 80 x 5 mm rectangular tube along the bottom, 100 x 100 x 4 mm uprights, 80 x 60 x 4 mm along the top; eight corner mount pads (four at the base, four on top), loaded from +X, its locks and drives recessed at rest; a clear load space of 3.6 x 1.6 x 1.8 m; drawn empty and still."
size_class: 2
fits: mount.cargo-s2
