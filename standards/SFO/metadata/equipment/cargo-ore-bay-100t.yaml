basis:
  - { of: [function.capacity, function.volume, function.fill_density], tier: derived, review: true, note: "Its volume is its capacity at 2,000 kg/m3, broken rock heaped (loose basalt about 1,600, iron ore 2,500: with denser ore it carries its capacity part full; with lighter it fills first and carries less)." }
  - { of: [physical.mass, built_of.list], tier: derived, review: true, note: "Worked out from its dimensions, loads and materials (tools/standards/ore_bays.py): ore at 2,000 kg/m3 at 3 g presses 159 kPa at the gate (as a liquid at the full clear depth; loose rock presses less). 8 mm A36 plate held by ribs every 0.35 m (stress p b2 / 2t2 within two thirds of yield), the ribs 8 mm webs 170 mm deep: shell 3.98 t, ribs 1.93; 3 mm 4340 liners over all it touches 1.50; 5 mm aluminium doors ribbed for a reverse 0.3 g 0.38; an 8 mm ribbed gate on two bearing strips 0.48; held at its corners, the loaded bay bends as a beam, 543 kN in each top chord: 4340 tube 80 x 3 mm with ties at every rib (buckling between ties 1.5 times the load or more), frame 0.53. 8.80 t, 0.09 of its capacity; drives, seals and fasteners not counted; the ribs' free edges unchecked for buckling. Review." }
  - { of: [size_class], tier: invented, review: true, note: "Its class by what it carries: 10 t and under class 1, 35 t class 2, 100 t class 3, above class 4." }
  - { of: [identity.description, physical.length, physical.width, physical.height, physical.volume, built_of.list], tier: derived, review: true, note: "Fitted round its 50 m3, at the modeller's request (the first box, 5.84 x 2.92 x 2.92 m, held only 49.8 m3 with no walls, frame or doors). Outer 3.15 m square, inside the class 3 mount's 3.21 m; frame, shell and liners take about 0.2 m a side, so 2.75 m clear inside; the doors take 0.15 m at the top and the gate and frame 0.3 m below, so 2.7 m clear high. A V bottom at 45 degrees (steeper than broken rock's 35 to 40 degree repose, so it empties under gravity) from 2.75 m down to a 0.5 m slot is 1.125 m deep, under 1.575 m of straight side: 6.16 m2 of section. 50 m3 needs 8.12 m of trough; with the 0.2 m end walls, 8.55 m long, inside the mount's 8.69. Chosen; review." }
  - { of: [visual], tier: derived, review: true, note: "The installed model was built of 20 mm plate without ribs and weighs 18.3 t (measured by the modeller); it is to be rebuilt to the worked-out 8 mm plate and ribs." }
  - { of: [life], rule: rule.life-ship-system }
