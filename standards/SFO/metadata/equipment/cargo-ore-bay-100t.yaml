identity:
  key: equipment.cargo.ore-bay.100t
  name: "Ore bay 100 t"
  maker: org.hadley
  revision: draft
  slot: cargo
  description: "A long trough hopper for 100 t of loose ore: straight sides above a V bottom sloped at 45 degrees to a slot gate the length of the floor, with a pair of top doors the length of the roof, all in a tube frame. The doors open to the excavator and shut for flight; the gate slides open at the dock to let the ore out. One of ten sizes, so a hull takes the bay that fits."
size_class: 3
fits: mount.cargo-s3
physical:
  mass: 10220
  volume: 84.8
  length: 8.55
  width: 3.15
  height: 3.15
built_of:
  parts: cargo-ore-bay-100t
  list:
    - { code: OBS07-01, name: "Shell", description: "The hopper's 8 mm plates, sloped to the gate.", mass: 3980, length: 6.244, width: 2.300, height: 2.300, item: stock.sta36-pl-8, quantity: 4577.0, module: module.welding-bay }
    - { code: OBS07-02, name: "Ribs", description: "8 mm webs welded round the shell every 0.35 m and up the end walls.", mass: 2310, length: 5.208, width: 1.919, height: 1.919, item: stock.sta36-pl-8, quantity: 2656.5, module: module.welding-bay }
    - { code: OBS07-03, name: "Wear liners", description: "Hard plates bolted inside where the rock lands and slides.", mass: 1500, length: 4.510, width: 1.662, height: 1.662, item: stock.st4340-pl-3, quantity: 1725.0, module: module.cutting-table }
    - { code: OBS07-04, name: "Top doors", description: "The pair, hinged at the sides, the length of the roof, that opens to the excavator and shuts for flight; ribbed beneath, the ribs falling between the roof ties.", mass: 640, length: 3.395, width: 1.251, height: 1.251, item: stock.al6061-pl-5, quantity: 736.0, module: module.welding-bay }
    - { code: OBS07-05, name: "Discharge gate", description: "A slot gate the length of the floor, ribbed beneath, sliding on bearing strips along both edges of the slot, that lets the ore out at the dock (its drive not counted); it runs below the shell's webs, the slot carried down to it by two skirts.", mass: 1260, length: 4.255, width: 1.568, height: 1.568, item: stock.sta36-pl-8, quantity: 1449.0, module: module.welding-bay }
    - { code: OBS07-06, name: "Frame", description: "Tube chords and end frames that carry the hopper to its mount, with a tie across the top at every rib.", mass: 530, length: 3.188, width: 1.175, height: 1.175, item: stock.st4340-tb-80x3, quantity: 609.5, module: module.welding-bay }
