# yaml-language-server: $schema=../../schema/equipment.schema.yaml
identity:
  key: equipment.cargo.ore-bay.50t
  name: "Ore bay 50 t"
  maker: org.hadley
  revision: draft
  slot: cargo
  description: "A short trough hopper for 50 t of loose ore, the 100 t bay's section cut short: straight sides above a V bottom sloped at 45 degrees to a slot gate the length of the floor, with a pair of top doors the length of the roof, all in a tube frame. The doors open to the excavator and shut for flight; the gate slides open at the dock to let the ore out. One of ten sizes, so a hull takes the bay that fits."
size_class: 3
fits: mount.cargo-s3
physical:
  mass: 5780
  volume: 44.6
  length: 4.49
  width: 3.15
  height: 3.15
built_of:
  parts: cargo-ore-bay-50t
  list:
    - { code: OBS05-01, name: "Shell", description: "The hopper's 8 mm plates, sloped to the gate.", mass: 2370, length: 3.336, width: 2.340, height: 2.340, item: stock.sta36-pl-8, quantity: 2725.5, module: module.welding-bay }
    - { code: OBS05-02, name: "Ribs", description: "8 mm webs welded round the shell every 0.35 m and up the end walls.", mass: 1320, length: 2.744, width: 1.925, height: 1.925, item: stock.sta36-pl-8, quantity: 1518.0, module: module.welding-bay }
    - { code: OBS05-03, name: "Wear liners", description: "Hard plates bolted inside where the rock lands and slides.", mass: 900, length: 2.416, width: 1.695, height: 1.695, item: stock.st4340-pl-3, quantity: 1035.0, module: module.cutting-table }
    - { code: OBS05-04, name: "Top doors", description: "The pair, hinged at the sides, the length of the roof, that opens to the excavator and shuts for flight; ribbed beneath, the ribs falling between the roof ties.", mass: 340, length: 1.746, width: 1.225, height: 1.225, item: stock.al6061-pl-5, quantity: 391.0, module: module.welding-bay }
    - { code: OBS05-05, name: "Discharge gate", description: "A slot gate the length of the floor, ribbed beneath, sliding on bearing strips along both edges of the slot, that lets the ore out at the dock (its drive not counted); it runs below the shell's webs, the slot carried down to it by two skirts.", mass: 630, length: 2.145, width: 1.505, height: 1.505, item: stock.sta36-pl-8, quantity: 724.5, module: module.welding-bay }
    - { code: OBS05-06, name: "Frame", description: "Tube chords and end frames that carry the hopper to its mount, with a tie across the top at every rib.", mass: 220, length: 1.510, width: 1.060, height: 1.060, item: stock.st4340-tb-60x2, quantity: 253.0, module: module.welding-bay }
making:
  module: module.assembly-shop
function:
  kind: ore_bay
  capacity: 50000
  volume: 25.0
  fill_density: 2000
