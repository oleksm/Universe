  path: "models/cargo-ore-bay-50t/v2"
  manifest_sha256: "3ef66cd9561a923324120ad7a9c1d526fbe15954e31bdec0b3692d632f6f51ee"
  version: 2
  triangles: 10804
life: 473364000
basis:
  - { of: [function.capacity, function.volume, function.fill_density], rule: rule.bin-volume-broken-rock }
  - { of: [physical.mass, built_of.list], tier: derived, review: true, note: "Worked out from its dimensions, loads and materials (tools/standards/ore_bays.py): ore at 2,000 kg/m3 at 3 g presses 159 kPa at the gate (as a liquid at the full clear depth; loose rock presses less). 8 mm A36 plate held by ribs every 0.35 m (stress p b2 / 2t2 within two thirds of yield), the ribs 8 mm webs 170 mm deep carried on down to the bottom chords: shell 2.37 t, ribs 1.32; 3 mm 4340 liners over all it touches 0.90; 5 mm aluminium doors ribbed for a reverse 0.3 g, with hinges, locks and the steel coaming they shut on 0.34; an 8 mm ribbed gate on two bearing strips, 110 mm below the shell on 8 mm skirts that carry the slot down past the webs, with the webs, seats and guides that carry it to the frame, 0.63; held at its corners, the loaded bay bends as a beam, 146 kN in each top chord: 4340 tube 60 x 2 mm with ties at every rib (buckling between ties 1.5 times the load or more), frame 0.22. Loaded by pouring through the open roof: the ties form a grate with 0.29 m gaps that screens off lumps too big for the 0.5 m gate slot (a slot passes lumps up to about a third of its width, 0.17 m), so ore is broken to that before loading; the door ribs, every 0.70 m, hang between the ties when shut. 5.78 t, 0.12 of its capacity; drives, seals and fasteners not counted; the ribs' free edges unchecked for buckling. Review." }
  - { of: [size_class], tier: invented, review: true, note: "Its class by what it carries: 10 t and under class 1, 35 t class 2, 100 t class 3, above class 4." }
  - { of: [identity.description, physical.length, physical.width, physical.height, physical.volume, built_of.list], tier: derived, review: true, note: "Fitted round its 25 m3 at the modeller's request (the first box, 4.64 x 2.32 x 2.32 m, held only 25.0 m3 with no walls, frame or doors). The 100 t bay's section unchanged (outer 3.15 m square, 2.75 m clear wide, 2.7 m clear high, a 45 degree V to a 0.5 m slot: 6.16 m2); 25 m3 needs 4.06 m of trough, 4.49 m long with end walls. Inside the class 3 mount (8.69 x 3.21 x 3.21 m). The modeller's proposal (25.01 m3 clear); review." }
  - { of: [visual], tier: derived, review: false, note: "The model (v2) is built to the worked-out design, 8 mm plate and ribs, and weighs 5,915 kg by its material volumes (measured by the modeller), 2% over the 5,780 kg worked out, most of it in the doors (395 against 344 kg) and the ribs (1,378 against 1,316)." }
  - { of: [life], rule: rule.life-ship-system }
