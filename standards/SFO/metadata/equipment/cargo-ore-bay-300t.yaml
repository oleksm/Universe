identity:
  key: equipment.cargo.ore-bay.300t
  name: "Ore bay 300 t"
  maker: org.hadley
  revision: draft
  slot: cargo
  description: "A long trough hopper for 300 t of loose ore, the 100 t bay's section made longer: straight sides above a V bottom sloped at 45 degrees to a slot gate the length of the floor, with a pair of top doors the length of the roof, all in a tube frame. The doors open to the excavator and shut for flight; the gate slides open at the dock to let the ore out. One of ten sizes, so a hull takes the bay that fits."
size_class: 4
fits: mount.cargo-s4
physical:
  mass: 35130
  volume: 262.7
  length: 24.87
  width: 3.23
  height: 3.27
built_of:
  parts: cargo-ore-bay-300t
  list:
    - { code: OBS10-01, name: "Shell", description: "The hopper's 8 mm plates, sloped to the gate.", mass: 10390, length: 16.570, width: 2.152, height: 2.179, item: stock.sta36-pl-8, quantity: 11948.5, module: module.welding-bay }
    - { code: OBS10-02, name: "Ribs", description: "8 mm webs welded round the shell every 0.35 m and up the end walls.", mass: 6130, length: 13.897, width: 1.805, height: 1.827, item: stock.sta36-pl-8, quantity: 7049.5, module: module.welding-bay }
    - { code: OBS10-03, name: "Wear liners", description: "Hard plates bolted inside where the rock lands and slides.", mass: 3920, length: 11.973, width: 1.555, height: 1.574, item: stock.st4340-pl-3, quantity: 4508.0, module: module.cutting-table }
    - { code: OBS10-04, name: "Top doors", description: "The pair, hinged at the sides, the length of the roof, that opens to the excavator and shuts for flight; ribbed beneath, the ribs falling between the roof ties.", mass: 1800, length: 9.237, width: 1.200, height: 1.215, item: stock.al6061-pl-5, quantity: 2070.0, module: module.welding-bay }
    - { code: OBS10-05, name: "Discharge gate", description: "A slot gate the length of the floor, ribbed beneath, sliding on bearing strips along both edges of the slot, that lets the ore out at the dock (its drive not counted); it runs below the shell's webs, the slot carried down to it by two skirts.", mass: 3760, length: 11.808, width: 1.534, height: 1.553, item: stock.sta36-pl-8, quantity: 4324.0, module: module.welding-bay }
    - { code: OBS10-06, name: "Frame", description: "Tube chords and end frames that carry the hopper to its mount, with a tie across the top at every rib.", mass: 9130, length: 15.871, width: 2.061, height: 2.087, item: stock.st4340-tb-200x15, quantity: 10499.5, module: module.welding-bay }
