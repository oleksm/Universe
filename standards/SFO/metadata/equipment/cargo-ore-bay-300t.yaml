identity:
  key: equipment.cargo.ore-bay.300t
  name: "Ore bay 300 t"
  maker: org.hadley
  revision: draft
  slot: cargo
  description: "A long trough hopper for 300 t of loose ore, the 100 t bay's section made longer: straight sides above a V bottom sloped at 45 degrees to a slot gate the length of the floor, with a pair of top doors the length of the roof, all in a tube frame. The doors open to the excavator and shut for flight; the gate slides open at the dock to let the ore out. One of ten sizes, so a hull takes the bay that fits."
size_class: 4
fits: mount.cargo-s4
physical:
  mass: 30960
  volume: 246.0
  length: 24.79
  width: 3.15
  height: 3.15
built_of:
  parts: cargo-ore-bay-300t
  list:
    - { code: OBS10-01, name: "Shell", description: "The hopper's 8 mm plates, sloped to the gate.", mass: 10390, length: 17.227, width: 2.189, height: 2.189, item: stock.sta36-pl-8, quantity: 11948.5, module: module.welding-bay }
    - { code: OBS10-02, name: "Ribs", description: "8 mm webs welded round the shell every 0.35 m and up the end walls.", mass: 5020, length: 13.518, width: 1.718, height: 1.718, item: stock.sta36-pl-8, quantity: 5773.0, module: module.welding-bay }
    - { code: OBS10-03, name: "Wear liners", description: "Hard plates bolted inside where the rock lands and slides.", mass: 3920, length: 12.448, width: 1.582, height: 1.582, item: stock.st4340-pl-3, quantity: 4508.0, module: module.cutting-table }
    - { code: OBS10-04, name: "Top doors", description: "The pair, hinged at the sides, the length of the roof, that opens to the excavator and shuts for flight.", mass: 1130, length: 8.223, width: 1.045, height: 1.045, item: stock.al6061-pl-5, quantity: 1299.5, module: module.welding-bay }
    - { code: OBS10-05, name: "Discharge gate", description: "A slot gate the length of the floor, ribbed beneath, sliding on bearing strips along both edges of the slot, that lets the ore out at the dock (its drive not counted).", mass: 1440, length: 8.915, width: 1.133, height: 1.133, item: stock.sta36-pl-8, quantity: 1656.0, module: module.welding-bay }
    - { code: OBS10-06, name: "Frame", description: "Tube chords and end frames that carry the hopper to its mount, with a tie across the top at every rib.", mass: 9060, length: 16.458, width: 2.091, height: 2.091, item: stock.st4340-tb-200x15, quantity: 10419.0, module: module.welding-bay }
