basis:
  - { of: [function.capacity, function.volume, function.fill_density], tier: derived, review: true, note: "Its volume is its capacity at 2,000 kg/m3, broken rock heaped (loose basalt about 1,600, iron ore 2,500: with denser ore it carries its capacity part full; with lighter it fills first and carries less)." }
  - { of: [physical.mass, built_of.list], tier: derived, review: true, note: "Worked out from its dimensions, loads and materials (tools/standards/ore_bays.py): ore at 2,000 kg/m3 at 3 g presses 159 kPa at the gate (as a liquid at the full clear depth; loose rock presses less). 8 mm A36 plate held by ribs every 0.35 m (stress p b2 / 2t2 within two thirds of yield), the ribs 8 mm webs 170 mm deep: shell 10.39 t, ribs 5.02; 3 mm 4340 liners over all it touches 3.92; 5 mm aluminium doors ribbed for a reverse 0.3 g 1.13; an 8 mm ribbed gate on two bearing strips 1.44; held at its corners, the loaded bay bends as a beam, 4789 kN in each top chord: 4340 tube 200 x 15 mm with ties at every rib (buckling between ties 1.5 times the load or more), frame 9.06. 30.96 t, 0.10 of its capacity; drives, seals and fasteners not counted; the ribs' free edges unchecked for buckling. Review." }
  - { of: [size_class], tier: invented, review: true, note: "Its class by what it carries: 10 t and under class 1, 35 t class 2, 100 t class 3, above class 4." }
  - { of: [identity.description, physical.length, physical.width, physical.height, physical.volume, built_of.list], tier: derived, review: true, note: "Fitted round its 150 m3 at the modeller's request (the first box, 8.44 x 4.22 x 4.22 m, held only 150.3 m3 with no walls, frame or doors). The 100 t bay's section unchanged (outer 3.15 m square, 2.75 m clear wide, 2.7 m clear high, a 45 degree V to a 0.5 m slot: 6.16 m2); 150 m3 needs 24.36 m of trough, 24.79 m long with end walls, with supports and hinges repeated along it. Inside the class 4 mount (29.6 x 5.84 x 5.84 m). The modeller's proposal (150.06 m3 clear); review." }
  - { of: [visual], tier: derived, review: true, note: "The installed model was built of 20 mm plate without ribs and weighs 48.7 t (measured by the modeller); it is to be rebuilt to the worked-out 8 mm plate and ribs." }
  - { of: [life], rule: rule.life-ship-system }
