    - { code: OSC1-02, name: "Liners", description: "3 mm hard plates on the faces the rock strikes: the rear of the taper and the lower faces, about half the inside.", mass: 47.3, length: 1.3, width: 1.6, height: 1.2, item: stock.st4340-pl-3, quantity: 54.4, module: module.cutting-table }
