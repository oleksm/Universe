  - { of: [function], tier: derived, note: "Loads: one atmosphere on the 0.8 by 1.7 m opening is about 138 kN, about 23 kN a dog. A leaf 60 mm deep with 3 mm 6061 skins spanning 0.8 m bends to about 45 MPa, well under its 276 MPa yield; skins and ribs about 30 kg, frame about 33 kg, as PDR1-01. Unqualified: no fatigue, seal or crash case yet." }
