identity:
  key: equipment.access.door.s1
  name: "Pressure door"
  maker: org.hadley
  revision: draft
  slot: access
  description: "A hatch that holds a cabin's pressure across it, either way, with a window: a hole vents one compartment, not the ship. The studio's doors between compartments are these. A frame 1.0 m wide, 1.9 m tall and 0.1 m deep around an 0.8 by 1.7 m clear opening; a hollow aluminium leaf (two skins on ribs) swings on three hinges and seats on a seal in the frame; six dogs round its edge drive out into the frame, so pressure on either face is held (from one side by the seat, from the other by the dogs). A small window, retained in the leaf. To open: retract the dogs, then swing. Rest pose: closed and dogged."
