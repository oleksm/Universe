identity:
  key: equipment.utility.compressor.s1
  name: "Compressor"
  maker: org.hadley
  revision: draft
  slot: utility
  description: "Compresses gas into a store or out of one: air, nitrogen and other inert gases, oil-free, to 30 MPa; not oxygen or hydrogen. Draws about 75 kW and gives nearly all of it to the ship's coolant loop."
size_class: 1
fits: mount.utility-s1
physical:
  mass: 528
  volume: 1.2
  length: 1.5
  width: 0.8
  height: 1.0
built_of:
  parts: utility-compressor-s1
  list:
    - { code: CMP0-01, name: "Stages", description: "Four dry-running piston stages (no oil in the gas) on one crankcase; the first two cylinders 120 mm bore.", mass: 300, length: 1.1, width: 0.6, height: 0.7, item: stock.st4340-bar-120, quantity: 450.0, module: module.machining-centre }
    - { code: CMP0-02, name: "Coolers and separators", description: "A cooler after each stage onto the coolant pair, and the condensate separators with their drain.", mass: 70, length: 0.9, width: 0.3, height: 0.5, item: stock.st304-pl-3, quantity: 80.5, module: module.welding-bay }
    - { code: CMP0-03, name: "Motor", description: "75 kW, covered.", mass: 75, length: 0.5, width: 0.35, height: 0.35, item: good.electric-motors, quantity: 75.0, module: module.assembly-shop }
    - { code: CMP0-04, name: "Controller", description: "The motor's drive and the compressor's controls.", mass: 15, length: 0.4, width: 0.3, height: 0.15, item: good.electronics, quantity: 15.0, module: module.electronics-works }
    - { code: CMP0-05, name: "Enclosure", description: "Closed covers over the stages and the motor; capped ports for the gas pair, the coolant pair, the condensate drain, power and data.", mass: 38, length: 1.5, width: 0.8, height: 0.95, item: stock.al6061-sh-2, quantity: 43.7, module: module.cutting-table }
    - { code: CMP0-06, name: "Skid and feet", description: "A frame on four feet, one per mount point.", mass: 30, length: 1.5, width: 0.8, height: 0.08, item: stock.al6061-pl-5, quantity: 34.5, module: module.welding-bay }
