identity:
  key: equipment.gear.strut.180kn
  name: Landing leg 180 kN
  maker: org.hadley
  revision: draft
  slot: gear
  description: 'A middle leg: 180 kN, a 0.4 m stroke, for craft of 20 to 40 t on four or six legs. Its size is the leg down and locked, 0.4 x 0.4 x 1.6 m from the mount face at the top to the sole of the pad: a titanium oleo strut on
    a trunnion at the mount, a 0.4 m square pad on a ball joint, and an enclosed geared retraction drive beside the trunnion that swings the leg up and locks it. Folded, it lies in the hull''s gear bay; the bay is the hull''s, not the
    leg''s.'
