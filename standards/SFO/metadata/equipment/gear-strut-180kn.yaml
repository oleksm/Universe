  tier: derived
  review: true
  note: 'A linear spring and damper standing for the oleo strut: the spring takes holds at the end of the stroke (1.8e+05 N / 0.4 m); the damper is 0.7 x holds at the design sink rate (3.0 m/s). 0.7 is chosen (invented): dropped at
    3.0 m/s with the mass whose touchdown fills the stroke at efficiency 0.8 (2 holds stroke eff / v^2), it peaks at 1.03 x holds and uses 0.87 of the stroke; at rest under holds/3 (an aircraft-like limit load factor of 3, from memory)
    it settles with a damping ratio about 0.48. A real oleo is nonlinear (gas spring, orifice damping).'
