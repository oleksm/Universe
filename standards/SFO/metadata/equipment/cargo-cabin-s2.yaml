basis:
  - { of: [physical, needs, function, size_class], rule: rule.early-list }
  - { of: [built_of, making], tier: invented, review: true, note: "A first design: a pressure shell of sheet with seats, its own small air plant and a cooler. An airliner's lightest seat is 10 kg; here a seat place, with its share of shell and air, is 130 to 150 kg." }
  - { of: [physical.length, physical.width, physical.height, physical.volume, identity.name, identity.description, function.seats], tier: derived, review: true, note: "Passenger cabin 6's section (2.16 x 2.18 m, 1.95 m clear, door and aisles as built, modeller 2026-10-13) made longer by whole rows at 0.79 m. 14 seats in five rows needs 5.53 m, past the class 2 cargo mount's 4.74 m; four wide (2+2) needs 2.62 m, past its 2.37 m. So four rows of 2+1: 3.16 + 2 x 0.79 = 4.74 m, the mount's length exactly. It was a 14-seat 3.95 x 1.85 x 2.0 m box that could not hold its seats." }
  - { of: [built_of.list, physical.mass, needs.power], tier: derived, review: true, note: "Shell as Passenger cabin 6's (101.3 kPa, 6061 at 110 MPa, 5 mm plate, 94 cm3 T-frames at 0.23 m): skin 50.6 m2, 683 kg; 20 girth frames of 8.68 m and 9 ribs on each end wall, 213 m, 830 kg; plus 20% for corner frames, door surround and doublers, the door's net 35 kg and a 25 kg reserve for undrawn fasteners and welds: 1,875 kg. Seats 18 kg each and linings 2.04 kg/m2 from cabin 6's measured model; air plant, cooler, lights and controls and power at cabin 6's per-seat figures (allowances). 1,875 kg shell by hand. Bound to the modeller's candidate v01 (2026-10-13), solid volumes times density: shell, deck and door 1,752 kg with the hardware drawn, plus the 25 kg reserve, 1,777 kg; seats 216 kg; linings 119 kg. 2,742 kg in all (it was 2,000): 229 kg a seat." }
  - { of: [life], rule: rule.life-ship-system }
