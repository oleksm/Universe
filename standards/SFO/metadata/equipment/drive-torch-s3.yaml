basis:
  - { of: [physical, needs, function, size_class], rule: rule.early-list }
  - { of: [built_of, making], tier: invented, review: true, note: "A first design of a main drive: the components of a fusion engine, in the shares of the one such engine designed in detail (NASA's Discovery II), brought to this product's weight. That engine makes 8.6 kW of jet for each kg; this one is asked for about a hundred thousand times that: the invented part." }
  - { of: [physical.length, physical.width, physical.height, physical.volume], tier: derived, review: true, source: "the game's model, assets/models/mc07.glb", note: "The S1 drive's engine block, as the MC-07's model has it, scaled by the square root of the thrust (1.49): a nozzle's area goes with its thrust at the same pressure." }
  - { of: [function.heat_to_hull], tier: invented, review: true, note: "A millionth of the jet's power comes aboard as heat: the share chosen in the equipment review so that a torch does not cook its ship. The physics behind it (an aneutronic burn, or the reaction far behind a magnetic nozzle) is the maker's claim, and a figure makers compete on." }
  - { of: [life], rule: rule.life-ship-system }
