basis:
  - { of: [physical, function, size_class], tier: invented, review: true, note: "The International Docking System Standard: an 0.8 m passage in a 1.4 m ring; NASA's IDA weighs 526 kg. From memory of the IDSS and the IDA. Not sourced." }
  - { of: [built_of, making], rule: rule.first-design-parts }
  - { of: [identity.description, built_of.list], tier: invented, review: true, note: "Geometry for the modeller (2026-10-12): the International Docking System Standard's layout, as an analogue at its primary sizes (the 0.8 m passage, three petals, twelve hooks, an androgynous face), not a copy of any real mechanism's drawings. Owned here: ring, tunnel, hooks, seals, soft-capture ring and petals, connectors, controls; the hull owns the pressure hatch, the structure round it and the mount's eight bolts. The rest pose is retracted (petals in, inside the 1.6 x 1.6 x 0.6 m); extending is motion, later. The dock's datum is the centre of the mating plane, its normal outward." }
  - { of: [life], rule: rule.life-ship-system }
