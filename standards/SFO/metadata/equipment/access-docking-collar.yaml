identity:
  key: equipment.access.docking.collar
  name: "Docking collar"
  maker: org.orbital
  revision: draft
  slot: access
  description: "An androgynous docking collar: any two of them mate. A ring 1.6 m across and 0.6 m deep round an open 0.8 m passage; three guide petals on a soft-capture ring catch the other collar, then twelve hooks pull the rings together on their seals. At rest the soft ring is retracted, ready to dock. The hull owns the pressure hatch behind it."
size_class: 1
fits: mount.access-s1
physical:
  mass: 530
  volume: 1.54
  length: 1.6
  width: 1.6
  height: 0.6
built_of:
  parts: access-docking-collar
  list:
    - { code: DCO0-01, name: "Ring and tunnel", description: "The mating ring and the open 0.8 m tunnel through it, bolted to the hull at eight mounts round its rear ring; power and data connectors on the mating face.", mass: 265, length: 1.27, width: 1.27, height: 0.476, item: stock.al6061-pl-5, quantity: 305.0, module: module.machining-centre }
    - { code: DCO0-02, name: "Latches and seals", description: "Twelve hard-capture hooks, recessed in the ring round the mating face, and the seal they close on.", mass: 159, length: 1.07, width: 1.07, height: 0.402, item: stock.st4340-bar-120, quantity: 183.0, module: module.machining-centre }
    - { code: DCO0-03, name: "Soft-capture and controls", description: "Three guide petals on a soft-capture ring that reaches out to catch and damps the contact, then draws back; and the controls.", mass: 106, length: 0.936, width: 0.936, height: 0.351, item: stock.cu-wire-2, quantity: 122.0, module: module.electronics-works }
