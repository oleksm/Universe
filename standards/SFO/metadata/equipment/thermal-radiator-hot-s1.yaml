  note: 'Its share of the engine''s heat (half its 233 m2 at 1500 K, both faces, emissivity 0.85): 57 MW. Twice as long as wide, as the other radiator panels. Lithium (material.lithium) about 4.2 kJ/kg K and 410 kg/m3 near 1,500 K (from
    memory), a 200 K drop, about 3.5 m/s in the headers.'
- of:
  - built_of.list
  tier: derived
  review: true
  note: 'Sized from its flow and its geometry (blender''s question, 2026-10-17): the tubes to carry 68 kg/s at about 3.5 m/s under 1 bar of loss (168 of 20 mm Mo), the root headers DN 250 Mo, a carbon-carbon backing frame, the sheet
    half the engine''s former panels; hinge, drive and joints a tenth more (invented). It weighs about two and a half times the engine''s former share: that budget left out the tubes the flow needs.'
