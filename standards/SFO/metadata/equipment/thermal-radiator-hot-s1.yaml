identity:
  key: equipment.thermal.radiator-hot.s1
  name: Hot radiator panel S1
  maker: org.kestrel
  revision: draft
  slot: thermal
  description: 'A deployable radiator panel for a fusion thermal engine S1, two to an engine: carbon-carbon with liquid lithium through it, stowed flat against the hull and swung out on its root hinge to stand edge-on to the jet, both
    faces to space, where it throws off 57 MW at 1500 K. Its coolant comes from the engine''s ports by a supply and a return header along the root edge, on the hinge line, each crossing the hinge in one molybdenum-rhenium bellows loop.
    It was part of the engine until 2026-10-17: a radiator this hot and large cannot fold inside an engine mount with its plumbing live (blender''s packing traces), so it is its own equipment on its own mount, and the ship must give
    it hull to lie against.'
size_class: 1
fits: mount.radiator-hot-s1
physical:
  mass: 4147
  volume: 6.5
  length: 16.76
  width: 9.64
  height: 2.349
built_of:
  parts: thermal-radiator-hot-s1
  list:
  - code: RAH1-01
    name: Panel
    description: 3 mm carbon-carbon, 117 m2, 15.3 m out from the hinge by 7.65 m along it; both faces dark; tubes 12 mm across (0.5 mm molybdenum) out from the root and back.
    mass: 616
    length: 15.3
    width: 7.65
    height: 0.03
    item: stock.cc-pl-3
    quantity: 707.8
    module: module.assembly-shop
  - code: RAH1-02
    name: Tubes
    description: '168 U-tubes of molybdenum, 20 mm across with a 0.5 mm wall, each 15.3 m out from the root header and back (30.6 m), on a 45.5 mm pitch along the 7.65 m root: 68 kg/s of lithium at about 3.5 m/s in their 19 mm bores,
      about 81 kPa lost across them; the 3 mm sheet bonded between them as fins. 5.1 km of tube.'
    mass: 1619
    length: 15.3
    width: 7.65
    height: 0.02
    item: stock.mo-tb-12x0p5
    quantity: 1861.8
    module: module.machining-centre
  - code: RAH1-04
    name: Root headers
    description: The supply and the return header along the root edge, DN 250 molybdenum, 5 mm wall, 7.65 m each, side by side (x 0.15 and 0.45, z 0.15), on the hinge line, swinging with the panel; their -y ends (y -3.825) each meet
      one molybdenum-rhenium bellows loop spanning 0.6 m to its fixed seat on the hull-side root bracket at y -4.425, where the ports are.
    mass: 630
    length: 7.65
    width: 0.6
    height: 0.27
    item: stock.mo-tb-12x0p5
    quantity: 724.5
    module: module.machining-centre
  - code: RAH1-05
    name: Backing frame
    description: 'Carbon-carbon box ribs 250 x 80 mm with a 3 mm wall, six running out from the root every 1.5 m, and a mid and a tip spar across: the 3 mm sheet cannot stand alone; within the panel''s 0.3 m.'
    mass: 382
    length: 15.3
    width: 7.65
    height: 0.25
    item: stock.cc-pl-3
    quantity: 439.3
    module: module.assembly-shop
  - code: RAH1-03
    name: Hinge, drive and root joints
    description: 'Root hinge brackets on the hull, the deploy drive, tip latches that hold it stowed, and the hinge crossings: each header splits at its moving -y end into three DN125 molybdenum-rhenium corrugated hoses (about 0.15
      m outside, 4.5 m/s of lithium), each wound about half a turn round the hinge axis in a plane across it, at a bend radius of at least 0.6 m (4 x its outside; deploys are few, under 1,000 in its life), so the 90 degree swing winds
      and unwinds them like a clock spring and stretches none; about 3.4 m of hose each (blender''s route study 2026-10-17: a 2.5 m planar loop fails past 30 degrees; a 3.4 m clock-spring holds R >= 0.6 m through the swing) from the
      moving end to its fixed seat. They stand in a root pod beyond the panel''s -y end the six hoses sweeping x -0.73 to 0.90, y -5.23 to -4.18, z -1.27 to 0.88 (the part below the hull line goes into a recess the hull gives), taller
      than the 0.3 m panel; the mount grows to the pod as measured.'
    mass: 325
    length: 7.65
    width: 0.5
    height: 0.3
    item: stock.mo-tb-12x0p5
    quantity: 373.7
    module: module.machining-centre
  - code: RAH1-06
    name: Fixed manifolds, drops and hose cuffs
    description: The fixed DN250 supply and return collectors beyond the hose pod (ports at y -5.5), each with three DN125 drops to the fixed hose cuffs at x -0.65; molybdenum. Mass as blender's analytic figure from the model (2026-10-17).
    mass: 575.33
    length: 1.46
    width: 1.0
    height: 1.0
    item: stock.mo-tb-12x0p5
    quantity: 661.4
    module: module.machining-centre
