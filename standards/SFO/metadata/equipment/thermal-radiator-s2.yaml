basis:
  - { of: [physical, function, size_class], tier: invented, review: true, note: "Throws off 8 MW at 1,000 K from 78 m2, both faces to deep space (Stefan-Boltzmann, emissivity 0.9): twice as long as wide. 12 kg/m2 chosen for a titanium panel with its headers." }
  - { of: [built_of, making], rule: rule.first-design-parts }
  - { of: [built_of.list, identity.description], tier: derived, review: true, note: "Geometry for the modeller (2026-10-10): the part boxes follow the panel (they were scaled stand-ins). Both faces radiating needs the panel clear of the hull, so it deploys: stowed flat inside the mount's envelope (13.8 x 6.89 x 1.65 m), held at the root by the two hinge brackets and at the tip by two latches, which are the mount's four corners; deployed it turns 90 degrees about the root edge. The model is exported stowed (its box is the record's 12.5 x 6.26 x 0.08 m); deploying is motion, later. The hull's view of the deployed panel is ignored (review)." }
  - { of: [physical.mass, built_of.list], tier: invented, review: true, note: "Open: titanium Ti-6Al-4V is not a 1,000 K material (its strength falls away above about 700 K, from memory); a panel this hot wants carbon-carbon fins on niobium-alloy or stainless headers, or a cooler panel 4 times larger (700 K: 326 m2). The registry has no service temperature for materials yet. The stock stays a mass proxy until that is settled." }
  - { of: [life], rule: rule.life-ship-system }
