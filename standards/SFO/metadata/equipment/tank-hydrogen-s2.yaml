basis:
  - { of: [built_of.list, physical], tier: derived, review: true, note: "Sized as the hydrogen S1 (2026-10-13, for the modeller): 6,500 kg at 70.8 kg/m3 with 3% ullage is 94.6 m3, 2.826 m inner radius. 0.35 MPa times 1.5 against 165 MPa for welded 6061-T6: 4.5 mm, taken as the 5 mm plate, 1,357 kg bare plus 20% for lands, bosses and doublers. Insulation 100 mm at 3.3 kg/m2. Saddles 280 kg as drawn on the modeller's blockout v01 (it had none); fittings 260 kg allowed (124 drawn so far). Total 2,501 kg, 38% of what it holds (it was 2,600 at an assumed 40%). Box from the blockout: 6.08 x 5.86 x 6.09 m, inside the mount's 7.25 m. Chosen; review." }
  - { of: [built_of.list], tier: invented, review: true, note: "Boil-off: about 1 W/m2 through the blanket from a 300 K hull (from memory), 108 W on the 108 m2, about 21 kg of hydrogen a day (0.3%), more in sunlight. The tank holds it to 0.35 MPa with its vent and relief valves; what is vented, burnt or cooled back is the hull's plant, not the tank's." }
