# yaml-language-server: $schema=../../schema/equipment.schema.yaml
identity:
  key: equipment.handling.transfer.arm
  name: "Bulk transfer arm"
  maker: org.cormorant
  revision: draft
  slot: handling
  description: "A rigid 15 m boom on a turret that passes bulk to a dock or another ship: a tubular drag conveyor whose two tubes are the boom's chords, ending in a sealed coupling that latches to the receiver's port. It works in free fall; nothing is let loose."
size_class: 2
fits: mount.handling-s2
physical:
  mass: 1304.7
  volume: 30.1
  length: 16.2
  width: 1.2
  height: 1.55
needs:
  power: 7000
built_of:
  parts: handling-transfer-arm
  list:
    - { code: TRA1-01, name: "Boom chords", description: "Two aluminium tubes, 200 mm, 5 mm wall, 15 m, one above the other 0.5 m apart: the conveyor's carrying and return runs and the boom's top and bottom chords.", mass: 236.4, length: 15, width: 0.2, height: 0.7, item: stock.al6061-tb-200x5, quantity: 271.9, module: module.welding-bay }
    - { code: TRA1-02, name: "Boom lattice", description: "60 mm tube verticals and diagonals every metre between the chords, one plane, coped to the chords.", mass: 20.2, length: 15, width: 0.06, height: 0.5, item: stock.al6061-tb-60x3, quantity: 23.2, module: module.welding-bay }
    - { code: TRA1-03, name: "Rope", description: "An endless 20 mm aramid rope, 31.6 m, through both chords and round the wheels.", mass: 8.8, length: 31.6, width: 0.02, height: 0.02, item: stock.aramid-fb, quantity: 10, module: module.textile-mill }
    - { code: TRA1-04, name: "Discs", description: "158 polyethylene discs, 180 mm across and 25 mm thick, every 0.2 m on the rope.", mass: 95, length: 0.18, width: 0.18, height: 0.025, item: good.polyethylene, quantity: 109, module: module.composites-works }
    - { code: TRA1-05, name: "Wheels and shafts", description: "Two pocketed steel wheels, 0.5 m: the tail one on the luff axis (Z 1.15), the head one at the tip on a screw take-up.", mass: 100, length: 0.5, width: 0.5, height: 0.2, item: stock.st4340-bar-120, quantity: 150, module: module.machining-centre }
    - { code: TRA1-06, name: "End housings", description: "Two sealed boxes of 5 mm plate, 0.6 x 0.6 x 0.8, round the wheels, with lids: the tail one takes the feed, the head one carries the coupling.", mass: 67.9, length: 0.6, width: 0.6, height: 0.8, item: stock.al6061-pl-5, quantity: 78.1, module: module.welding-bay }
    - { code: TRA1-07, name: "Tip coupling", description: "A 200 mm flange with a bellows and three latches that clamp it to the receiver's port; closed by a plate at rest.", mass: 27.2, length: 0.35, width: 0.35, height: 0.3, item: stock.st4340-bar-120, quantity: 40.8, module: module.machining-centre }
    - { code: TRA1-08, name: "Latch motors", description: "Three small geared motors on the coupling.", mass: 10, length: 0.15, width: 0.1, height: 0.1, item: good.electric-motors, quantity: 10, module: module.assembly-shop }
    - { code: TRA1-09, name: "Conveyor drive", description: "Gear motor with brake on the head wheel, in the head housing.", mass: 90, length: 0.6, width: 0.3, height: 0.3, item: good.electric-motors, quantity: 90, module: module.assembly-shop }
    - { code: TRA1-10, name: "Turret", description: "A box of 5 mm plate on a 12 mm drilled base, 1.2 x 1.2 x 0.8, with hinge webs and jack brackets, on the mount face, its top recessed at the centre for the tail housing's sweep; the feed rises through it on the slew axis by a 200 mm swivel joint and a rigid duct to the hollow left luff pin.", mass: 150.8, length: 1.2, width: 1.2, height: 0.8, item: stock.al6061-pl-5, quantity: 173.5, module: module.welding-bay }
    - { code: TRA1-11, name: "Slewing ring", description: "A 0.8 m slewing bearing between the turret and the mount face.", mass: 94.6, length: 0.8, width: 0.8, height: 0.1, item: stock.st4340-bar-120, quantity: 141.9, module: module.machining-centre }
    - { code: TRA1-12, name: "Luff hinge", description: "The right 60 mm pin and both lugs on top of the turret, Z 1.15, level with the tail wheel's centre between the chords (Z 0.9 and 1.4).", mass: 17.3, length: 0.6, width: 0.2, height: 0.2, item: stock.st4340-bar-120, quantity: 26, module: module.machining-centre }
    - { code: TRA1-13, name: "Slew drive", description: "Pinion gear motor on the slewing ring.", mass: 30, length: 0.3, width: 0.2, height: 0.2, item: good.electric-motors, quantity: 30, module: module.assembly-shop }
    - { code: TRA1-14, name: "Luff actuator", description: "An electric screw jack from the turret to the boom, 0.8 m from the hinge, rated 200 kN.", mass: 160, length: 1.2, width: 0.2, height: 0.2, item: good.electric-motors, quantity: 160, module: module.assembly-shop }
    - { code: TRA1-15, name: "Rest", description: "A cradle on the hull side under the boom tip, where it lies stowed.", mass: 24.5, length: 0.6, width: 0.4, height: 0.3, item: stock.al6061-pl-5, quantity: 28.2, module: module.welding-bay }
    - { code: TRA1-16, name: "Feed pin", description: "The left luff pin, hollow: 300 mm outside, 240 mm bore, 0.25 m long, turning in a fixed steel housing with end cap, the inlet swivel and flange: a sealed rotary union; the feed passes through it into the tail housing as the boom luffs.", mass: 155.5, length: 0.25, width: 0.3, height: 0.3, item: stock.st4340-tb-300x30, quantity: 202.2, module: module.machining-centre }
    - { code: TRA1-17, name: "Feed duct", description: "A rigid 200 mm duct inside the turret from the slew swivel up to the feed pin.", mass: 16.5, length: 1.5, width: 0.2, height: 0.2, item: stock.al6061-tb-200x5, quantity: 19, module: module.welding-bay }
making:
  module: module.assembly-shop
function:
  kind: "handling"
  throughput: 20
  reach: 15.0
  moment: 91000
visual:
  format: "freefall-model/1"
  path: "models/handling-transfer-arm/v1"
  manifest_sha256: "6a45f571303f5dcceee13946ad0044a1fb3fd57b97ed7bd33064cd4000208d9e"
  version: 1
  triangles: 16670
life: 473364000
basis:
  - { of: [function], tier: invented, review: true, note: "20 kg/s over 15 m to a dock or another ship. Slews +-170 degrees, luffs -5 to +60 degrees: from the rest it lifts before it slews, and dips below level only clear of the rest. Chosen." }
  - { of: [built_of.list, physical.mass, needs], tier: derived, review: true, note: "No telescope and no open belt: an open belt lets bulk float off in free fall, and the drag conveyor cannot slide. Capacity: 190 mm bore, 0.7 full, 0.7 m/s, 1,600 kg/m3: 22 kg/s. Boom held out level at 1 g (on the ground; the moment it puts on its mount) with 477 kg in the carrying run, 600 kg of boom and the coupling: 91 kN m at the hinge; chords 0.5 m apart carry 182 kN, 59 MPa in 200 x 5 aluminium; sag 0.2 m at the tip. Single-plane lattice: side loads are small (slewing slowly, no wind aboard). Feed: through the hollow left luff pin by a rotary union, as the modeller proposed; a hose would bend to 0.13 m radius or stretch a quarter over the luff. The pin carries half the hinge load, about 70 kN, easily. Luff jack: 91 kN m; the modeller's poses (blockout-v02) give a jack of 0.975 to 1.651 m with a lever no less than 0.396 m, a peak of 133 kN; rated 200 kN, half again. Turret, slewing ring, hinge, feed pin and union, duct, housings, chords, lattice, coupling and rest are the modeller's measured volumes (candidate-v01, final: 715 poses clear); rope, discs, wheels, latch motors, drives and jack are allowances (disc 0.6 kg, rope 0.28 kg/m). Drive: 2.3 kN of load friction at 1 g plus 2 kN of disc drag at 0.7 m/s, 3 kW; 5.5 kW for packed starts, with slew, luff and latches 7 kW." }
  - { of: [physical.volume, physical.length, physical.width, physical.height], tier: derived, review: true, note: "Stowed: 16.2 m with the tip coupling (the modeller's fit), the boom along +Y on its rest, the turret's centre at the origin on the mount face (Z 0), the luff axis at Z 1.15, the boom from Z 0.8 to 1.55, the tail housing 0.6 m behind the slew axis." }
  - { of: [built_of, making], rule: rule.first-design-parts }
  - { of: [life], rule: rule.life-ship-system }
