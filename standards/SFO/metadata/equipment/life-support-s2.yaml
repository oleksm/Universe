  cooling: 3000
life: 473364000
basis:
  - { of: [physical, needs, function, size_class], rule: rule.early-list }
  - { of: [built_of, making], tier: invented, review: true, note: "A first design, by the space station's plant. By the station's weights (293 kg a head for water and oxygen) 1,500 kg keeps about five people." }
  - { of: [physical.length, physical.width, physical.height, physical.volume], tier: derived, review: true, source: "standards/sources/research_people_needs.json", note: "3 racks of the space station's size (a rack is 1.57 m3: about 2.0 by 1.05 by 0.85 m), side by side: the station's water and oxygen plant is 2,061 kg in three racks, this 1,500 kg is 3. The rack's shape is from memory." }
  - { of: [function.water_recovery, function.air_recovery], tier: sourced, review: true, source: "standards/sources/research_people_needs.json", note: "The space station's figures: about 90% of water recovered, about half the oxygen from carbon dioxide (its Sabatier reactor), from memory of its ECLSS reports; the rest is made up from the tanks." }
  - { of: [life], rule: rule.life-ship-system }
  - { of: [function.persons, function.cooling], tier: derived, review: true, note: "By the space station's weights (about 270 kg of plant a head) 1,500 kg keeps about 6 people; it carries their heat and their equipment's, 500 W a head, and dries the air." }
