basis:
- of:
  - function.holds
  - size_class
  tier: invented
  review: true
  note: 'Sized for a 120 t ship on four legs: the MC-07 empty: the ship''s weight at 1.5 g on its legs, the airliner rule (14 CFR 25.473), with the lightest ship of the class on four legs.'
- of:
  - physical.mass
  tier: derived
  review: true
  note: '1.2 kg a kN of leg load: an A320''s main leg, about 700 kg for 574 kN (78 t at 1.5 g on two legs), from memory. Not sourced.'
- of:
  - function.stroke
  - function.efficiency
  - function.sink_rate
  tier: sourced
  source: https://www.ecfr.gov/current/title-14/section-25.473
  note: The sink rate is the airliner design case, 10 ft/s; the oleo's efficiency 0.8 (the hull's design.strut_efficiency); the stroke chosen longer with size.
- of:
  - physical.length
  - physical.width
  - physical.height
  - physical.volume
  - function.extended
  tier: invented
  review: true
  note: A leg about a third as wide as it is long, gear down; the MC-07's front leg stands 9 m (its model), between S2 and S3.
- of:
  - life
  rule: rule.life-ship-system
- of:
  - function.spring
  - function.damper
  tier: derived
  review: true
  note: 'A linear spring and damper standing for the oleo strut: the spring takes holds at the end of the stroke (1.2e+06 N / 0.8 m); the damper is 0.7 x holds at the design sink rate (3.05 m/s). 0.7 is chosen (invented): dropped at
    3.05 m/s with the mass whose touchdown fills the stroke at efficiency 0.8 (2 holds stroke eff / v^2), it peaks at 1.03 x holds and uses 0.87 of the stroke; at rest under holds/3 (an aircraft-like limit load factor of 3, from memory)
    it settles with a damping ratio about 0.48. A real oleo is nonlinear (gas spring, orifice damping).'
