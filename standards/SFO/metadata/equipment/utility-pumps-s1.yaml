identity:
  key: equipment.utility.pumps.s1
  name: "Pump set"
  maker: org.hadley
  revision: draft
  slot: utility
  description: "Two centrifugal pumps side by side on one skid, piped in parallel: together 20 kg/s of water or coolant against 1 MPa, 10 kg/s each; if one fails the other carries half. Each has its own motor and guarded coupling; one sealed control box serves both. Inlets and outlets 80 mm, capped until the hull connects them; power at the rear; four feet. For liquids near room temperature: water, coolant, storable fuels; not for cryogens."
size_class: 1
fits: mount.utility-s1
