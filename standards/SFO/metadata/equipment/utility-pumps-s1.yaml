  parts: utility-pumps-s1
  list:
    - { code: PMP0-01, name: "Pumps", description: "Two single-stage centrifugal pumps, about 6,000 rpm on a 0.2 m impeller, steel casings; 80 mm inlet and outlet each.", mass: 150, length: 0.843, width: 0.506, height: 0.506, item: stock.st4340-bar-120, quantity: 172.0, module: module.machining-centre }
    - { code: PMP0-02, name: "Motors and controls", description: "Two 16 kW motors with guarded couplings to the pumps, and one sealed control box with their drives.", mass: 100, length: 0.737, width: 0.442, height: 0.442, item: stock.cu-wire-2, quantity: 115.0, module: module.electronics-works }
