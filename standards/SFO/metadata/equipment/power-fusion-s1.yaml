basis:
  - { of: [physical, needs, function, size_class], rule: rule.early-list }
  - { of: [built_of, making], tier: invented, review: true, note: "A first design: a fusion reactor and the turbine set that turns its heat to power, in the shares of NASA's Discovery II, brought to this product's weight. Its registry cousin on the ground makes 22 W for each kg; this is asked for 2,200." }
  - { of: [physical.length, physical.width, physical.height, physical.volume], tier: derived, review: true, source: "docs/ships/mc-07-equipment-dimensions.md", note: "Its radiator sets the size: 7.4 MW of waste heat at 1,000 K and an emissivity of 0.9 wants 146 m2 of radiating surface (Stefan-Boltzmann, 51 kW for each m2 and side): one 12 by 6 m panel radiating both sides (the audit's 36 m2 was half; blender caught it, 2026-10-11). The reactor and turbine set sit in a closed 2 m bay under it, the panel hinged above, drawn stowed. The plant's weight is not sized: it is the invented part." }
  - { of: [built_of.list, physical], tier: derived, review: true, note: "Radiator and frame from material, size and load, as the Aurel plants (2026-10-13), the rest of the list as before: 2,511 kg (was 1,800). Built for airless places: the hot carbon plate would burn in air, and air carries heat off besides, so a plant for a world with air wants another radiator. Panel: 12 by 6.07 m of 3 mm carbon-carbon at 1,750 kg/m3, 382 kg; 72.8 m2 from both faces sheds the 7.43 MW the turbine cannot use (4 MW out at 35%) at 1,000 K and emissivity 0.9, standing up, on fused-silica stand-offs; it lies over the plant bay when stowed. Frame in carbon composite (1,580 kg/m3, 55 GPa, 300 MPa allowed for bonded joints; invented knock-down), the whole plant at the mount's 3 g: two side trusses 1.75 m deep in 6 bays of 2.0 m, chords 80 by 3 mm tube, diagonals 100 by 2; floor beams 120 by 3; top ties and stiffeners 80 by 3; radiator rails 120 by 3; chords 32 kN against 49 kN buckling over 1.5; diagonals 28 kN against 38 kN; floor beams 252 MPa; rails 230 MPa standing up at 1 g; plus 10% for joints and the hinge: 389 kg. 18.5 kN at each plan corner. Size: the bays, an outboard hinge, chords, rails, stand-offs and plate. Over the old power mounts, which were regenerated from it. Open, as the Aurel plants: the rails' temperature under the stand-offs, and the reactor parts, still mass proxies." }
  - { of: [life], rule: rule.life-ship-system }
