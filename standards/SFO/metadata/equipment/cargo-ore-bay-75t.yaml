identity:
  key: equipment.cargo.ore-bay.75t
  name: "Ore bay 75 t"
  maker: org.hadley
  revision: draft
  slot: cargo
  description: "A trough hopper for 75 t of loose ore, the 100 t bay's section cut shorter: straight sides above a V bottom sloped at 45 degrees to a slot gate the length of the floor, with a pair of top doors the length of the roof, all in a tube frame. The doors open to the excavator and shut for flight; the gate slides open at the dock to let the ore out. One of ten sizes, so a hull takes the bay that fits."
size_class: 3
fits: mount.cargo-s3
physical:
  mass: 6840
  volume: 64.7
  length: 6.52
  width: 3.15
  height: 3.15
built_of:
  parts: cargo-ore-bay-75t
  list:
    - { code: OBS06-01, name: "Shell", description: "The hopper's 8 mm plates, sloped to the gate.", mass: 3170, length: 5.046, width: 2.438, height: 2.438, item: stock.sta36-pl-8, quantity: 3645.5, module: module.welding-bay }
    - { code: OBS06-02, name: "Ribs", description: "8 mm webs welded round the shell every 0.35 m and up the end walls.", mass: 1530, length: 3.958, width: 1.912, height: 1.912, item: stock.sta36-pl-8, quantity: 1759.5, module: module.welding-bay }
    - { code: OBS06-03, name: "Wear liners", description: "Hard plates bolted inside where the rock lands and slides.", mass: 1200, length: 3.650, width: 1.763, height: 1.763, item: stock.st4340-pl-3, quantity: 1380.0, module: module.cutting-table }
    - { code: OBS06-04, name: "Top doors", description: "The pair, hinged at the sides, the length of the roof, that opens to the excavator and shuts for flight.", mass: 290, length: 2.273, width: 1.098, height: 1.098, item: stock.al6061-pl-5, quantity: 333.5, module: module.welding-bay }
    - { code: OBS06-05, name: "Discharge gate", description: "A slot gate the length of the floor, ribbed beneath, sliding on bearing strips along both edges of the slot, that lets the ore out at the dock (its drive not counted).", mass: 360, length: 2.443, width: 1.180, height: 1.180, item: stock.sta36-pl-8, quantity: 414.0, module: module.welding-bay }
    - { code: OBS06-06, name: "Frame", description: "Tube chords and end frames that carry the hopper to its mount, with a tie across the top at every rib.", mass: 290, length: 2.273, width: 1.098, height: 1.098, item: stock.st4340-tb-60x2, quantity: 333.5, module: module.welding-bay }
