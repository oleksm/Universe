identity:
  key: equipment.cargo.ore-bay.75t
  name: "Ore bay 75 t"
  maker: org.hadley
  revision: draft
  slot: cargo
  description: "A trough hopper for 75 t of loose ore, the 100 t bay's section cut shorter: straight sides above a V bottom sloped at 45 degrees to a slot gate the length of the floor, with a pair of top doors the length of the roof, all in a tube frame. The doors open to the excavator and shut for flight; the gate slides open at the dock to let the ore out. One of ten sizes, so a hull takes the bay that fits."
size_class: 3
fits: mount.cargo-s3
physical:
  mass: 7500
  volume: 64.7
  length: 6.52
  width: 3.15
  height: 3.15
built_of:
  parts: cargo-ore-bay-75t
  shares: rule.haul-truck-shares
  list:
    - { code: OBS06-01, name: "Shell", description: "The hopper's plates, sloped to the gate.", mass: 3000, length: 3.92, width: 1.96, height: 1.96, item: stock.sta36-pl-20, quantity: 3450.0, module: module.welding-bay }
    - { code: OBS06-02, name: "Wear liners", description: "Hard plates bolted inside where the rock lands and slides.", mass: 1500, length: 3.111, width: 1.556, height: 1.556, item: stock.st4340-pl-3, quantity: 1725.0, module: module.cutting-table }
    - { code: OBS06-03, name: "Top doors", description: "The pair, hinged at the sides, the length of the roof, that opens to the excavator and shuts for flight.", mass: 1125, length: 2.827, width: 1.413, height: 1.413, item: stock.al6061-pl-5, quantity: 1293.8, module: module.welding-bay }
    - { code: OBS06-04, name: "Discharge gate", description: "A slot gate the length of the floor, about 0.5 m wide, sliding on bearing beds ribbed to the shell along both edges of the slot (end guides alone cannot carry the loaded plate), and its drive, that lets the ore out at the dock.", mass: 750, length: 2.469, width: 1.235, height: 1.235, item: stock.st4340-bar-120, quantity: 862.5, module: module.machining-centre }
    - { code: OBS06-05, name: "Frame", description: "Tube chords and uprights that carry the hopper to its mount.", mass: 1125, length: 2.827, width: 1.413, height: 1.413, item: stock.st4340-tb-160x5, quantity: 1293.8, module: module.welding-bay }
