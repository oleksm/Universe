basis:
  - { of: [function.capacity, function.volume, function.fill_density], tier: derived, review: true, note: "Its volume is its capacity at 2,000 kg/m3, broken rock heaped (loose basalt about 1,600, iron ore 2,500: with denser ore it carries its capacity part full; with lighter it fills first and carries less)." }
  - { of: [physical.mass], tier: invented, review: true, note: "A tenth of its capacity: a haul truck's body is about 11% of its payload (a 363 t truck's 40 t body, from memory). Not sourced." }
  - { of: [size_class], tier: invented, review: true, note: "Its class by what it carries: 10 t and under class 1, 35 t class 2, 100 t class 3, above class 4." }
  - { of: [identity.description, physical.length, physical.width, physical.height, physical.volume, built_of.list], tier: derived, review: true, note: "Fitted round its 37.5 m3 at the modeller's request (the first box, 5.32 x 2.66 x 2.66 m, held only 37.6 m3 with no walls, frame or doors). The 100 t bay's section unchanged (outer 3.15 m square, 2.75 m clear wide, 2.7 m clear high, a 45 degree V to a 0.5 m slot: 6.16 m2); 37.5 m3 needs 6.09 m of trough, 6.52 m long with end walls. Inside the class 3 mount (8.69 x 3.21 x 3.21 m). The modeller's proposal (37.51 m3 clear); review." }
  - { of: [built_of.list], tier: derived, review: true, note: "Flagged, not thinned: measured on the modeller's candidate (blender cargo-ore-bay-75t/candidate-v01: 20 mm A36 shell, 3 mm liners, the gate on ribbed beds): shell 8.06 t (against the 3 t given), liners 1.20, frame 1.69, doors 1.05, gate, beds and ribs 2.76, 14.77 t against the 7.5 t recorded, before the hidden drives; loaded strength and ore flow unqualified. A thinner ribbed shell would cut it (see the 10 t bay's note). Left at 7.5 t until reviewed. Review." }
  - { of: [life], rule: rule.life-ship-system }
