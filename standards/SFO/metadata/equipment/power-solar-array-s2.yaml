basis:
  - { of: [size_class], tier: invented, review: true, note: "A 30 kW wing: one deployable wing's figures (the ISS wings ~ 1.1 t for 400 m2 at 14%). From memory. At Treistun's worlds sunlight is 0.23 to 1.07 of Earth's." }
  - { of: [function], tier: derived, review: true, note: "85 m2 of cells on the 100 m2 face (0.85 packed). Triple-junction cells at 0.30, less 6% hot (about 60 C at -0.2%/K), 2% wiring and 5% mismatch and wear, give 0.26 at the bus: 85 x 1,361 x 0.26 = 30.1 kW face on. Cell and loss figures from memory." }
  - { of: [physical, built_of], tier: derived, review: true, note: "Cells 0.14 mm germanium-based with 0.1 mm cover glass, about 1.05 kg/m2 on 85 m2: 89 kg. Face 0.5 mm carbon sheet (1,580 kg/m3) on 100 m2: 79 kg. Under it 4 longerons of 80 x 2 mm carbon tube along the 20 m (0.77 kg/m, 62 kg) and 21 ribs of 60 x 2 mm across the 5 m every metre (0.58 kg/m, 60 kg); 81 mm deep, inside the 0.1 m. Harness at 300 V and 100 A: two 6 mm2 trunks for 2% drop are 2.2 kg, with string leads, insulation and the root connector 12 kg (allowance invented). Two titanium root hinges 6 kg each, a 67 N m drive (8 kg), six latches 1.5 kg each. Total 331 kg, 3.3 kg/m2." }
  - { of: [physical], tier: derived, review: true, note: "Section EI about 2.0e5 N m2 (carbon at 60 GPa), 16 kg a metre. Out on its hinge, a cantilever of 20 m: the tip bends 1.6 m per m/s2 and the first mode is 0.16 Hz, so the wing is deployed only below 0.2 m/s2 (tip 0.3 m; operating limit invented). Stowed, it lies flat on the hull, held at the two root hinges and three pairs of latches at 6.7, 13.3 and 20 m: under 30 m/s2 the face stress is about 40 MPa, against 457 MPa if held at root and tip only. The 8 points: 2 hinges and 6 latches; the hull owns the pads, the wing owns the hinges, latches and drive. Hinge range 0 to 180 degrees from stowed, 90 degrees in 60 s (invented); one axis, the ship's attitude does the rest." }
  - { of: [built_of, making], rule: rule.first-design-parts }
  - { of: [life], rule: rule.life-ship-system }
