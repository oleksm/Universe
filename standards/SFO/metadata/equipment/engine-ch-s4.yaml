# yaml-language-server: $schema=../../schema/equipment.schema.yaml
identity:
  key: equipment.engine.ch.s4
  name: "Chemical engine S4 (methalox)"
  maker: org.kestrel
  revision: draft
  slot: engine
  description: "Methalox burnt and expanded: 2300 kN at 3.29 km/s in vacuum (2185 kN at 3.12 km/s at sea level), 3.8 GW of jet, 699 kg/s of propellant. Hovering a 156 t ship at 1 g takes 0.7 of these and 465 kg/s: a 60-second landing burns 28 t. The lander's engine: a full-flow staged-combustion chamber at 30 MPa with a short bell that fires at sea level."
size_class: 4
fits: mount.engine-s4
physical:
  mass: 1630
  volume: 5.24
  length: 3.1
  width: 1.3
  height: 1.3
built_of:
  parts: engine-ch-s4
  list:
    - { code: CHE4-01, name: "Thrust chamber and nozzle", description: "One piece, injector face to exit rim: 1.95 m long (chamber 0.5 m to the throat, bell 1.45 m to the exit), 1.3 m across the rim (exit 1.2 m inside, the 50 mm turnaround manifold outside it). A milled copper liner closed by a steel jacket, methane in its channels: two passes, down half the channels to the exit manifold and back up the others, so every line sits at the chamber end, forward of the throat, behind the hull's closure; no line runs to the rim. The engine owns its gimbal ring and thrust take-out; the mount's flange and struts are the hull's. Its stock is a mass proxy: copper liner stock and a channel-milling and brazing works are not in the registry yet.", mass: 734, length: 1.95, width: 1.3, height: 1.3, item: stock.st304-pl-3, quantity: 844.1, module: module.welding-bay }
    - { code: CHE4-02, name: "Turbopumps", mass: 489, length: 2.08, width: 0.87, height: 0.87, item: good.pumps, quantity: 489, module: module.assembly-shop }
    - { code: CHE4-03, name: "Valves, lines and injector", mass: 244, length: 1.65, width: 0.691, height: 0.691, item: stock.st304-pl-3, quantity: 280.6, module: module.machining-centre }
    - { code: CHE4-04, name: "Controller and gimbal actuators", mass: 163, length: 1.44, width: 0.603, height: 0.603, item: good.electric-motors, quantity: 163, module: module.assembly-shop }
making:
  module: module.assembly-shop
function:
  kind: engine
  cycle: chemical
  thrust: 2.3e+06
  exhaust: 3290
  efficiency: 0.54
  burns: material.methalox
  throttle: 0.4
  gimbal: 0.26
  isotropic_loss: 0
  shield_pass: 1
  reaction_offset: 1.55
  heat_to_hull: 0.0001
  chamber:
    feed: staged_combustion
    pressure: 30000000.0
    mixture_ratio: 3.6
    thrust_coefficient: 1.81
    throat_diameter: 0.232
    exit_diameter: 1.2
    expansion_ratio: 26.8
    chamber_diameter: 0.4
    chamber_length: 0.5
    nozzle_length: 1.45
    cooling: regenerative
    wall: material.copper
    construction: channels
    coolant_passes: 2
    coolant_pressure: 45000000.0
    hot_wall_temperature: 800
    coolant_in: 112
    coolant_out: 350
    exit_manifold: 0.05
    vacuum_only: false
visual:
  format: "freefall-model/1"
  path: "models/engine-ch-s4/v1"
  manifest_sha256: "6817e34cdc643c855a4e9322d8e1643caaf6daacd372a4fbf669e020be582d98"
  version: 1
  triangles: 15716
life: 473364000
basis:
  - { of: [function.thrust, physical.mass, function.throttle, function.gimbal], tier: invented, review: true, note: "a Raptor 2 class engine, from memory: about 230 tf, 1,630 kg, methane and oxygen, throttling to about 40%, gimbal about 15 degrees. No source looked up. Review" }
  - { of: [function.efficiency], tier: derived, review: true, note: "Half the exhaust speed squared (5.4 MJ/kg) over the blend's 10 MJ/kg: 0.54." }
  - { of: [function.heat_to_hull], tier: invented, review: true, note: "A chemical engine's heat is its own, carried off by its propellant; a ten-thousandth of the jet soaks back into the mount. Chosen." }
  - { of: [function.exhaust, function.chamber], tier: derived, review: true, note: "The earlier 3.6 km/s (invented) is out of reach: methalox would need an area ratio over 100 for it, an exit far wider than the 1.3 m engine. Derived instead for 2300 kN in vacuum at a Raptor-class 30 MPa and mixture 3.6 (from memory, no source looked up), gas ratio 1.2, c* 1,813 m/s (98% of an ideal 1,850), 98% of the ideal nozzle's momentum: the widest exit the 1.3 m width holds, 1.2 m inside a 50 mm manifold, gives an area ratio of 26.8, a thrust coefficient of 1.81 in vacuum and 1.72 at sea level, a throat of 0.0423 m2 (2.3 MN / (1.81 x 30 MPa)), 0.232 m across. Exhaust 3,290 m/s in vacuum, 3,120 at sea level (2,185 kN); 699 kg/s, 547 of oxygen and 152 of methane. An 80% bell, 1.45 m throat to exit. A chamber of 3 times the throat's area (0.4 m) and a characteristic length of 1 m: 0.5 m injector face to throat. Measured from the mount face: injector face 1.15 m, throat 1.65 m, exit 3.1 m." }
  - { of: [function.chamber.vacuum_only], tier: derived, review: true, note: "The exit gas is at 105 kPa at full thrust, about a sea-level atmosphere: no separation in air up to about 250 kPa (a bell separates when its exit pressure falls below about 0.4 of the air's, the Summerfield rule, from memory). At the 40% throttle the exit is at 42 kPa: still attached at sea level, the limit; deeper throttling in thick air would separate. A landed-atmosphere engine for worlds up to about Earth's air." }
  - { of: [function.chamber.construction, function.chamber.wall, function.chamber.coolant_pressure, function.chamber.hot_wall_temperature, function.chamber.coolant_in, function.chamber.coolant_out, function.chamber.coolant_passes], tier: invented, review: true, note: "At 30 MPa tubes cannot hold: a copper liner with milled channels under a steel jacket, as high-pressure engines are built (from memory). Methane enters at 112 K, leaves at about 350 K; the gas side of the liner runs at about 800 K; the coolant at 45 MPa, 1.5 times the chamber, for the preburner's and injector's drops. Two passes keep every line at the chamber end (the owner's rule). Chosen; review." }
  - { of: [built_of.list], tier: derived, review: true, note: "CHE4-01's box: 0.5 + 1.45 m long; the rim 1.2 + 2 x 0.05 m across. The engine's 3.1 m: 1.15 m of turbopumps, preburners, valves, injector and gimbal ahead of the injector face; the pivot 0.6 m behind the mount face (moved from 0.35 so the trunnion unions and duct jackets clear the mount frame; the modeller's packing study). The whole engine, pumps included, swings on the gimbal: 0.26 rad (15 degrees) in any direction, a cone. The rim, 2.5 m behind the pivot, swings 0.64 m to each side: the full sweep is about 2.54 m across at the rim. Measured (the modeller's blockout v13, 513 poses over the full cone): swept to 1.271 m either side of the axis and 3.183 m aft of the mount face, nothing forward of it: the same as the geometry gives (2.5 sin 0.26 + 0.65 cos 0.26 = 1.271; 0.6 + 2.5 cos 0.26 + 0.65 sin 0.26 = 3.183). The swept box the hull leaves: 2.542 x 2.542 m across, 3.183 m deep. Ahead of the pivot the moving parts swing the other way and toward the mount face: a moving part d ahead of the pivot at radius r stays aft of the face while d cos 0.26 + r sin 0.26 <= 0.6 m, room the hull leaves. 734 kg of plate is a mass proxy." }
  - { of: [physical.mass], tier: derived, review: true, note: "Mass screen (the modeller's candidate v01, measured visible volumes, titanium 4430 and steel 7850 kg/m3): 1,485 kg before the pump and turbine internals, with the chamber and nozzle counted as a solid copper envelope (556 kg, channels not hollowed, an upper bound), injector 85 kg, the four trunnion pins 206 kg. That leaves 145 kg of the 1,630 for impellers, turbines, shafts, preburner plumbing, seals and electronics. Pump work: 547 kg/s of oxygen and 152 kg/s of methane raised to about 45 MPa at 0.7 efficiency is about 55 MW of shaft. Flown turbopumps run roughly 100 to 200 kW per kg (invented, from memory), so 270 to 550 kg. A channel liner in a steel jacket (about 4.5 m2 of wall, 8 mm of copper, 3 mm of steel) weighs about 430 kg, not 556, which leaves about 270 kg: the low end. So the 1,630 kg holds only with light pumps and may be 0 to 400 kg short. Kept at 1,630 kg, not thinned; review once the internals are modelled. The parts list split (734, 489, 244, 163) is unchanged." }
  - { of: [built_of, making], rule: rule.first-design-parts }
  - { of: [life], rule: rule.life-ship-system }
