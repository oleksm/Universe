identity:
  key: equipment.engine.ft.s1
  name: "Fusion thermal engine S1"
  maker: org.kestrel
  revision: draft
  slot: engine
  description: "A fusion reactor (catalysed D-D, the deuterium the ports make) heating hydrogen through a magnetic nozzle: 1 kN at 347 km/s, 0.17 GW of jet. A cruise engine: 1 kN moves a 156 t ship at 0.0064 m/s2. Hydrogen is its propellant, deuterium its fuel; D-He3 would halve its neutron loss when helium-3 is mined. Its radiators are their own equipment (equipment.thermal.radiator-hot.s1, two to an engine) on the hull, fed from its four coolant ports (2026-10-17)."
size_class: 1
fits: mount.engine-s1
physical:
  mass: 30000
  volume: 54
  length: 6
  width: 3
  height: 3
built_of:
  parts: engine-ft-s1
  list:
