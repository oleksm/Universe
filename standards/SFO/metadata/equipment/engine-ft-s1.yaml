# yaml-language-server: $schema=../../schema/equipment.schema.yaml
identity:
  key: equipment.engine.ft.s1
  name: "Fusion thermal engine S1"
  maker: org.kestrel
  revision: draft
  slot: engine
  description: "A fusion reactor (catalysed D-D, the deuterium the ports make) heating hydrogen through a magnetic nozzle: 1 kN at 347 km/s, 0.17 GW of jet. A cruise engine: 1 kN moves a 156 t ship at 0.0064 m/s2. Hydrogen is its propellant, deuterium its fuel; D-He3 would halve its neutron loss when helium-3 is mined."
size_class: 1
fits: mount.engine-s1
physical:
  mass: 30000
  volume: 54
  length: 6
  width: 3
  height: 3
built_of:
  parts: engine-ft-s1
  list:
    - { code: FTE1-01, name: "Reactor coils and cases", description: "The toroidal and poloidal coils in their titanium strengtheners.", mass: 16500, length: 4.92, width: 2.46, height: 2.46, item: stock.ti64-pl-5, quantity: 18980.0, module: module.welding-bay }
    - { code: FTE1-02, name: "Shadow shield", description: "A nuclear-graphite disc between the mount and the reactor, 2.9 m across and 0.62 m thick.", mass: 7500, length: 2.9, width: 2.9, height: 0.62, item: good.carbon, quantity: 7500, module: module.assembly-shop }
    - { code: FTE1-03, name: "First wall and nozzle", description: "Silicon carbide first wall; the magnetic nozzle.", mass: 1500, length: 2.21, width: 1.11, height: 1.11, item: stock.sic-tl-10, quantity: 1725, module: module.machining-centre }
    - { code: FTE1-04, name: "Power conversion and heating", mass: 2700, length: 2.69, width: 1.34, height: 1.34, item: good.electronics, quantity: 2700, module: module.assembly-shop }
    - { code: FTE1-05, name: "Coolant and refrigeration", mass: 1200, length: 2.05, width: 1.03, height: 1.03, item: good.pumps, quantity: 1200, module: module.assembly-shop }
    - { code: FTE1-06, name: "Propellant feed", mass: 600, length: 1.63, width: 0.814, height: 0.814, item: stock.st304-pl-3, quantity: 690, module: module.machining-centre }
making:
  module: module.assembly-shop
function:
  kind: engine
  cycle: fusion_thermal
  thrust: 1000
  exhaust: 347000
  efficiency: 0.41
  burns: material.deuterium
  propellant: material.hydrogen
  throttle: 0.2
  gimbal: 0.05
  isotropic_loss: 0.5
  shield_pass: 0.01
  reaction_offset: 1.8
  heat_to_hull: 0.00071
life: 473364000
basis:
  - { of: [function.exhaust, function.efficiency, function.thrust], tier: sourced, review: true, source: "standards/sources/research_ship_equipment.json", note: "Discovery II (NASA/TM-2005-213559): exhaust 347 km/s at the nozzle exit, 4.83 GW of jet from 7.9 GW of fusion (0.61), 6,250 lbf = 27.8 kN, 0.08 kg/s. The S3 is that engine; the others scale." }
  - { of: [physical], tier: derived, review: true, source: "standards/sources/research_ship_equipment.json", note: "a tenth of a Discovery II's jet in a thirtieth of its mass: optimistic scaling (the Princeton Direct Fusion Drive, 2 MW, is 2.8 t: 0.7 kW/kg); review" }
  - { of: [function.isotropic_loss, function.shield_pass, function.heat_to_hull], tier: invented, review: true, note: "Catalysed D-D: about 38% of the fusion power leaves as neutrons and about 12% as X-rays, in every direction (D-He3, Discovery II's fuel, would be about a quarter in all; the registry has no helium-3 stock yet, so the engine burns the deuterium the ports make); a half-metre carbon-graphite shadow shield (Discovery II's 90 t) passes about a hundredth toward the ship. heat_to_hull = 0.5 / 0.41 x 0.05 x 0.01 + 1e-4 soak-back = 0.00071 of the jet, for a hull taking a twentieth of the sphere. From memory of the physics; the figures want a source. Review." }
  - { of: [function.efficiency], tier: derived, review: true, note: "Was 0.61, Discovery II's figure, but that engine burns D-He3, which loses about a quarter of its power in every direction; on D-D, which loses half, 0.61 plus 0.5 came to more than the fusion power (found by the modeller). Discovery II puts 0.61 / 0.75 = 0.81 of what is not lost into the jet; on D-D that is 0.5 x 0.81 = 0.41. The engine burns about half as much deuterium again for the same jet. Review." }
  - { of: [function.throttle, function.gimbal], tier: invented, review: true, note: "Deep throttling by fuel rate (a fifth); a magnetic nozzle steers the jet a few degrees. Chosen." }
  - { of: [built_of, making], rule: rule.first-design-parts }
  - { of: [built_of.list], tier: derived, review: true, note: "Layout, with the modeller's first blockout (v1): the mount face at the fore end, the jet aft. The shield is a shadow disc, not a wrap round the coils: nuclear graphite at 1,800 kg/m3, 2.9 m across and 0.62 m thick, 7.37 t, 7.5 t with its casing, filling the 0.75 m between the mount face and the reactor. The reactor is about 2.2 m across and 2.1 m long, centred 1.8 m aft of the mount face (reaction_offset is measured from that face to the plasma centre). The nozzle coils run aft to 6 m. Steering is by the nozzle field (gimbal 0.05 rad), with no moving parts. This is a simplified analogue: Discovery II (NASA/TM-2005-213559) wraps graphite round its reactor and nozzle coils and converges it forward into a 60 degree shadow. Those coil blankets are not counted; the 7.5 t is the disc alone. The other part boxes are cube-root placeholders, not shapes. Review." }
  - { of: [function.heat_to_hull, built_of.list], tier: derived, review: true, note: "Flag, not changed: the engine keeps heat that heat_to_hull does not count. Fusion power is jet / 0.41 = 0.42 GW, and half of it leaves in every direction. The X-rays, about 51 MW, stop in the first wall. The shield faces about a fifth of the sphere and stops about 32 MW of neutrons, and the coils take more. That is at least 83 MW, against 111 kW of mount cooling. At 1,000 K a two-sided radiator rejects about 100 kW/m2, so the engine needs about 830 m2 of its own radiators, roughly 4 t at 5 kg/m2, which are not in the parts or the envelope. The engine owns its coolant loop and pumps (FTE1-05); who owns the radiators is open. Review." }
  - { of: [life], rule: rule.life-ship-system }
