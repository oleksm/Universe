# yaml-language-server: $schema=../../schema/equipment.schema.yaml
identity:
  key: equipment.engine.swivel.s4
  name: "Engine swivel S4"
  maker: org.kestrel
  revision: draft
  slot: engine
  description: "A trunnion that turns an engine of up to 2,500 kN through 90 degrees in about 17 s: aft in flight, down to land. Vectored thrust; the price is 3.3 t a unit against a gimbal's nothing."
size_class: 4
fits: mount.engine-s4
physical:
  mass: 3265.6
  volume: 13.5
  length: 3
  width: 3
  height: 1.5
needs:
  power: 7000
built_of:
  parts: engine-swivel-s4
  list:
    - { code: SWV4-01, name: "Fixed frame", description: "Bolts to the mount face at Y 0: S3's frame at 5/3 the size in 35 mm plate (the stock gauge stands for it): a square flange of 300 mm angle with a centre relief in its lower return, two cheeks (YZ) at X +-1.0 built up to 150 mm round the bushings, and a tie plate on +Z. Open aft (-Y) and below (-Z) for the engine.", mass: 1706.2, length: 3, width: 3, height: 1.5, item: stock.al6061-pl-5, quantity: 1962.1, module: module.welding-bay }
    - { code: SWV4-02, name: "Adapter ring", description: "The moving part the engine bolts to: a welded 225 x 260 mm box ring of 25 mm plate (the stock gauge stands for it), 1.8 m across, 1.35 m bore, with sleeves for the pins at +-X.", mass: 527.6, length: 1.8, width: 1.8, height: 0.26, item: stock.ti64-pl-5, quantity: 606, module: module.welding-bay }
    - { code: SWV4-03, name: "Trunnion pins", description: "Two hollow 250 mm pins, 150 mm bore, 0.72 m long, on the X axis at Y -1.031; keyed to the ring, driven at their outer ends.", mass: 199.7, length: 0.72, width: 0.25, height: 0.25, item: stock.ti64-ingot, quantity: 299.5, module: module.machining-centre }
    - { code: SWV4-04, name: "Bushings", description: "Two bronze bushings, 280 mm outside, 250 mm bore, 340 mm long, in the cheeks.", mass: 72.1, length: 0.28, width: 0.28, height: 0.34, item: stock.brz932-bar-50, quantity: 430, module: module.machining-centre }
    - { code: SWV4-05, name: "Drive, +X", description: "Enclosed geared actuator with brake, outboard of the +X cheek, coaxial with the pin.", mass: 380, length: 0.37, width: 0.66, height: 0.66, item: good.electric-motors, quantity: 380, module: module.assembly-shop }
    - { code: SWV4-06, name: "Drive, -X", description: "The same, outboard of the -X cheek.", mass: 380, length: 0.37, width: 0.66, height: 0.66, item: good.electric-motors, quantity: 380, module: module.assembly-shop }
making:
  module: module.assembly-shop
function:
  kind: swivel
  turns: 1.571
  bears: 2.5e+06
  slew: 0.1
visual:
  format: "freefall-model/1"
  path: "models/engine-swivel-s4/v1"
  manifest_sha256: "f8c154312b3cadef7af7d1616d45de3808fe253527a20840d8aac93cbd9ff09b"
  version: 1
  triangles: 10260
life: 473364000
basis:
  - { of: [function], tier: invented, review: true, note: "A quarter turn in about seventeen seconds (0.1 rad/s, 1 s to speed up and to stop) under up to 2,500 kN. Chosen; no flown example at this scale. The engine it carries: up to 2,000 kg (CH-S4 is 1,630), centre of mass within 1.25 m of the pivot, no wider than 1.8 m for the first 225 mm behind the ring and 1.95 m on to 1.68 m from the pivot; confirmed clear by the modeller's 65-pose sweep (candidate-v01). Feed lines and wiring cross the turn as the engine's and hull's services, not the swivel's." }
  - { of: [built_of.list, physical, needs], tier: derived, review: true, note: "S3's layout at 5/3 (frame 3 x 3 x 1.5, pivot Y -1.031: at 1 m deep the modeller's sweep hit the flange), parts sized from 5 times S3's load. Pins: 1.25 MN each; 15 MPa on the bronze needs 250 mm x 340 mm; 250 kN m bending at 0.2 m needs 180 mm solid at half yield, so bearing governs and a 150 mm bore is taken out (187 MPa). Ring: 0.137 F R = 270 kN m out of plane; the 225 x 260 x 25 box holds 660 kN m. Cheeks: 30 MPa bearing needs 150 mm round a 280 mm bushing. Plates: same deflection per span as S3 needs 2.03 times the thickness (35 mm), so the frame is S3's measured 309.5 kg times 2.78 for area and 2.06 for gauge. Bushings are turned from solid bar, the only bronze stock. Drive torque: 2,000 kg at 1.25 m passing horizontal at 1.5 g is 36.8 kN m, 18.4 a drive, 22.8 peak; at S1's invented 60 N m a kilogram, 380 kg each. Power: 3.7 kW at the pivot, 0.6 efficient, plus brakes: 7 kW. Frame, ring, pin and bushing masses are the modeller's measured volumes (candidate-v01: 1,706.2, 527.6, 199.7, 72.1 kg, bosses included); drives stay at the 760 kg allowance." }
  - { of: [built_of, making], rule: rule.first-design-parts }
  - { of: [life], rule: rule.life-ship-system }
