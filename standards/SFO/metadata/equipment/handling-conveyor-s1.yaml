    - { code: CNV1-04, name: "Wheels and shafts", description: "Two pocketed steel wheels, 0.45 m, one at each end, on 50 mm shafts; the tail one on a screw take-up.", mass: 90, length: 0.45, width: 0.45, height: 0.6, item: stock.st4340-bar-120, quantity: 135, module: module.machining-centre }
