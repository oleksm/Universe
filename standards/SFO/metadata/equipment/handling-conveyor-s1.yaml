built_of:
  parts: handling-conveyor-s1
  list:
    - { code: CNV1-01, name: "Tubes", description: "Two steel tubes, 160 mm, 3 mm wall, 6.8 m between the housings: the carrying run above, the return below, at Z 0.10 and 0.55, with collars at the housings.", mass: 170.4, length: 6.8, width: 0.16, height: 0.61, item: stock.st4340-tb-160x3, quantity: 196, module: module.welding-bay }
    - { code: CNV1-02, name: "Rope", description: "An endless 16 mm aramid rope, 17 m, through both tubes and round the wheels.", mass: 3.4, length: 17, width: 0.016, height: 0.016, item: stock.aramid-fb, quantity: 4, module: module.textile-mill }
