identity:
  key: equipment.handling.conveyor.s1
  name: "Conveyor S1"
  maker: org.cormorant
  revision: draft
  slot: handling
  description: "A tubular drag conveyor: discs on an aramid rope drawn through two closed tubes, so it carries bulk under thrust or in free fall, at any angle. An open belt would let the load float off."
