basis:
  - { of: [function], tier: invented, review: true, note: "10 kg/s over 8 m: a small ore feed. Chosen." }
  - { of: [built_of.list, physical.mass, needs], tier: derived, review: true, note: "Tubular drag (disc) conveyor, as in powder plants: the load is packed between discs and pushed, so it needs no gravity. A pipe belt was rejected: it needs about 25 tube diameters to open flat at each end, 3.75 m, most of an 8 m run, open. Capacity: 150 mm bore, 0.7 full, 0.6 m/s, 1,600 kg/m3 bulk: 11.9 kg/s. Masses from sizes and densities, with the modeller's fit (candidate-v01): steel tube 11.6 kg/m over 2 x 6.8 m, aramid rope 0.2 kg/m, polyethylene disc 0.33 kg. Tubes, housings and supports are the modeller's measured volumes (candidate-v01: 170.4, 82, 21.7 kg). Drive: 158 kg of load on the carrying run at 1 g and 0.5 friction, 780 N, with disc drag 1 kN at 0.6 m/s, 0.6 kW; 1.5 kW for packed starts in free fall." }
  - { of: [physical.volume, physical.length, physical.width, physical.height], tier: invented, review: true, note: "The first envelope, refitted by the modeller: two 160 mm tubes at 0.45 m need 0.61 m before walls and feet, so 0.65 m high; the housings set the width." }
  - { of: [built_of, making], rule: rule.first-design-parts }
  - { of: [life], rule: rule.life-ship-system }
