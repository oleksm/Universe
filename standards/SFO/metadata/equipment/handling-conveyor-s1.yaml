    - { code: CNV1-06, name: "Supports", description: "Five tube brackets every 1.6 m and four corner feet; the feet stand at Z 0.", mass: 21.7, length: 8.0, width: 0.8, height: 0.65, item: stock.al6061-pl-5, quantity: 25, module: module.welding-bay }
