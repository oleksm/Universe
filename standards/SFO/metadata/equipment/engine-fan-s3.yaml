identity:
  key: equipment.engine.fan.s3
  name: "Ducted fan S3"
  maker: org.hadley
  revision: draft
  slot: engine
  description: "An electric fan in a 2.5 m duct: 60 kN in air of 1.2 kg/m3 for 5.7 MW, nothing burnt. Its thrust falls with the cube root of the air's density at the same power; below 0.3 kg/m3 it is not rated. A 2.7 m duct with a 2.5 m clear bore, 1.2 m deep, held by eight rim mounts; the motor sits at the centre on the downstream stators, the inverter in a covered pod on the duct. Air enters at the top and leaves at the bottom, along the duct's axis; the thrust is the opposite way."
size_class: 3
