basis:
  - { of: [function, physical, needs], tier: derived, review: true, note: "Momentum theory for a ducted fan whose exit is as wide as its disc (A = 4.91 m2, air 1.2 kg/m3): the wake does not contract, so T = rho A v2 and the air leaves the duct at v = sqrt(T / (rho A)), the exhaust given. This is the duct exit velocity, not an open rotor's disc (sqrt(T / 2 rho A)) or far-wake (twice that) velocity. Shaft power was taken as the open-rotor ideal T^1.5 / sqrt(2 rho A) / 0.75; see the flag. Mass at about 6 kg a kilonewton (electric VTOL fans of the 2020s, from memory). Chosen; review." }
  - { of: [needs.power, function.efficiency], tier: derived, review: true, note: "Flag: the ducted ideal jet power is T v / 2 = 3.03 MW, but the power (5.71 MW) used the open-rotor ideal (4.28 MW) / 0.75, so against the duct it is 0.53 efficient, not 0.75. Either power falls to 4.04 MW at 0.75, or efficiency is 0.53; heat_to_hull follows. Not changed." }
  - { of: [built_of, making], rule: rule.first-design-parts }
  - { of: [life], rule: rule.life-ship-system }
  - { of: [built_of.list], tier: derived, review: true, note: "Flag: the motor (FAN3-03) is 122 kg for 5.7 MW, 47 kW/kg, and the inverter (FAN3-04) 35 kg, 163 kW/kg; motors of the 2020s ran about 10 to 15 kW/kg continuous and SiC inverters about 50 to 100 kW/kg (from memory), which would make them about 400 to 570 kg and 60 to 115 kg, the fan about 700 to 900 kg. Either a better motor (label it invented) or the mass rises; for review, not changed." }
  - { of: [function.heat_to_hull], tier: derived, review: true, note: "The motor and inverter lose about 8% of the electrical power as heat in the hull (0.92 efficient); electrical power is jet power / 0.75, so that is 0.107 of the jet power, the share lib.jet_heat counts. The duct's own losses go to the air it moves, not the hull." }
