    - { code: ORC1-06, name: "Regulator, filter and isolation", description: "The pod regulator to 1.27 MPa, a 25 um filter and a latching isolation valve (docs/ships/explorer-rcs-feed-criteria.yaml); a reserved allowance, not drawn.", mass: 2, length: 0.08, width: 0.08, height: 0.1, item: stock.st304-pl-3, quantity: 2.3, module: module.machining-centre,
