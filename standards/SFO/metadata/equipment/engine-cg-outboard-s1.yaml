identity:
  key: equipment.engine.cg.outboard-s1
  name: "Outboard cold gas pod, 0.5 kN"
  maker: org.kestrel
  revision: draft
  slot: engine
  description: "The cold gas block's four nozzles, unscaled, canted 30 degrees out from the pod's axis, on an 8 mm base
    plate with its own regulator, valves and controller: for a wingtip, where the plumes clear the hull. 125 N a nozzle
    as a target, so about 433 N outward from all four. Pulsed, not throttled."
size_class: 1
fits: mount.engine-s1c
