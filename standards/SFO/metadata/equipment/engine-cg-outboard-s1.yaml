    - { code: ORC1-02, name: "Base, enclosure and service panel", description: "The 8 mm 6061 base with four 6.6 mm holes, the enclosure and the retained electrical panel.", mass: 10.325153942580924, length: 0.44, width: 0.44, height: 0.3338, item: stock.al6061-pl-5, quantity: 11.87, module: module.machining-centre }
