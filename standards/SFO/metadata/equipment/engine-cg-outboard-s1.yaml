    - { code: ORC1-04, name: "Contacts and seals", description: "Connector contacts (copper) and seals (EPDM), as drawn.", mass: 0.028940961, length: 0.05, width: 0.05, height: 0.05, item: good.electronics, quantity: 0.029, module: module.assembly-shop }
