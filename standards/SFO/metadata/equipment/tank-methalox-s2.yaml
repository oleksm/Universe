identity:
  key: equipment.tank.methalox.s2
  name: "Methalox tank S2"
  maker: org.hadley
  revision: draft
  slot: tank
  description: "One insulated sphere 5.6 m across, split by a common domed bulkhead: liquid oxygen aft (48.9 m3), liquid methane forward (36.7 m3), each its own circuit with its own outlet, pressurisation, vent and relief, capped. Holds 54,100 kg of oxygen and 15,000 kg of methane, 69,200 kg at the engines' 3.6 to 1, with 3% ullage in each. Runs at 0.45 MPa at most. Sits on four saddles."
size_class: 2
fits: mount.tank-s2
physical:
  mass: 3080
  volume: 196
  length: 6.006
  width: 5.6
  height: 5.817
built_of:
  parts: tank-methalox-s2
  list:
    - { code: TKML2-01, name: "Shell", description: "Welded aluminium sphere, 5.5 m across outside, 6 mm wall, with weld lands, bosses and saddle doublers.", mass: 1850, length: 5.5, width: 5.5, height: 5.5, item: stock.al6061-pl-5, quantity: 2128, module: module.welding-bay }
    - { code: TKML2-02, name: "Common bulkhead", description: "A 2:1 ellipsoidal dome, 5.35 m across at its rim, 1.34 m high, bulging forward into the methane: two aluminium skins on a 46 mm foam core, 50 mm in all, welded to the shell at a Y-ring. Its stock is a mass proxy: foam-core sandwich stock is not in the registry yet.", mass: 400, length: 5.35, width: 5.35, height: 1.39, item: stock.al6061-pl-5, quantity: 460, module: module.welding-bay }
    - { code: TKML2-03, name: "Insulation", description: "40 mm of foam on the shell under a multilayer blanket and closeout, 50 mm in all: the sphere is 5.6 m across over it.", mass: 200, length: 5.6, width: 5.6, height: 5.6, item: stock.mli-fl, quantity: 200, module: module.assembly-shop }
    - { code: TKML2-04, name: "Saddles", description: "Four, one at each mount attachment, below the equator, each taking 745 kN.", mass: 280, length: 1.0, width: 0.6, height: 0.8, item: stock.st304-pl-3, quantity: 322, module: module.machining-centre }
    - { code: TKML2-05, name: "Fittings and gauging", description: "For each circuit: an outlet with an anti-vortex screen, a pressurant diffuser, fill and drain, vent and relief valves, level gauging; slosh baffles. Every port is capped until the hull connects it.", mass: 350, length: 1.2, width: 0.8, height: 0.8, item: stock.st304-pl-3, quantity: 402.5, module: module.machining-centre }
making:
  module: module.assembly-shop
function:
  kind: tank
