identity:
  key: equipment.power.distribution.28v-16way
  name: Distribution board, 28 V DC, 16 ways
  maker: org.meridian
  revision: draft
  slot: power
  description: 'Where a ship''s 28 V DC bus branches: fed from its converter by a pole pair or a circular shell 33 or 25 (whichever the converter has, all three on one bus bar), 12 ways of shell 17 (15 A), 4 ways of shell 25 (55 A)
    out, each through its own solid-state breaker, and the control bus through. Up to 11.2 kW on its bus bar. The connectors'' mass is the routed harness''s, not the board''s.'
