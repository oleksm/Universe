basis:
  - { of: [physical, function, size_class], tier: invented, review: true, note: "A 3 m wide ramp for 20 t of wheeled cargo, about a C-130's rear ramp (a 20 t vehicle drives up it). From memory. Not sourced. One 8 m deck on beams beneath, 3 m clear and no rails, standing upright to shut the opening in flight (it holds no pressure; its locks hold it); its hinge and rams are its own, the hull gives the opening. Wheels climb it at 15 degrees at most, so its sill sits no more than 2.1 m up and its foot lands 7.7 m out (its reach, measured flat, as the boarding ramp's). (blender asked, 2026-10-11; the first draft's 4 m reach was 30 degrees.) Measured (candidate-v01): 7.75 m reach and a 2.08 m sill at 15 degrees; its walking surface stands 100 mm above the hinge, so the hull's opening gives a recessed threshold and the receivers for its locks." }
