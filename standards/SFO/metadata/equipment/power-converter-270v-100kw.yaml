  key: equipment.power.converter.270v-100kw
  name: DC converter, 3 kV to 270 V, 100 kW
  maker: org.meridian
  revision: draft
  slot: utility
  description: 'Steps the ship''s 3 kV DC bus down to its 270 V DC bus, up to 100 kW out, isolated: a sealed box on four feet, the 3 kV pair in at its -x end (two connector.hvdc-pole-150a receptacles, 34 A), the 270 V pair out (370
    A: two connector.hvdc-pole-400a receptacles) and data (connector.circular-shell-11) at its +x end, the coolant pair under it (connector.flat-face-dn13). The connectors'' mass is the routed harness''s (connector.schema physical),
    not the box''s. 97% efficient: at full load it draws 103.09 kW and gives 3.09 kW to the coolant loop.'
