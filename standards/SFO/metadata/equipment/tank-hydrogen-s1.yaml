basis:
  - { of: [built_of.list, physical], tier: derived, review: true, note: "Sized as the hydrolox S1 (2026-10-13, for the modeller): 3,500 kg at 70.8 kg/m3 is 49.4 m3, with 3% ullage 50.9 m3, 2.299 m inner radius. Pressure 0.35 MPa most in service, times 1.5, against 165 MPa for welded 6061-T6: 3.7 mm, taken as the 5 mm plate, 897 kg bare plus 20% for lands, bosses and doublers. Insulation 100 mm at 3.3 kg/m2 (the hydrolox family's), saddles 40 kg each as the hydrolox S1's, fittings 140 kg for one circuit. Total 1,596 kg, 46% of what it holds (it was 1,400 at an assumed 40%). Box from the modeller's layout (v01): 4.81 m sphere over the insulation, saddles and opposed service bosses, 5.16 x 4.81 x 5.0 m. Chosen; review." }
  - { of: [built_of.list], tier: invented, review: true, note: "Boil-off: a blanket in vacuum lets in about 1 W/m2 from a 300 K hull (from memory), 70 W on the 70 m2, about 14 kg of hydrogen a day (0.4%), more in sunlight. The tank holds it to 0.35 MPa with its vent and relief valves; what is vented, burnt or cooled back is the hull's plant (a vent burner or a cryocooler), not the tank's." }
  - { of: [built_of, making], rule: rule.first-design-parts }
  - { of: [life], rule: rule.life-ship-system }
