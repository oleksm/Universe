identity:
  key: equipment.engine.ft.s2
  name: "Fusion thermal engine S2"
  maker: org.kestrel
  revision: draft
  slot: engine
  description: "A fusion reactor (catalysed D-D, the deuterium the ports make) heating hydrogen through a magnetic nozzle: 5 kN at 347 km/s, 0.87 GW of jet. A cruise engine: 5 kN moves a 156 t ship at 0.032 m/s2. Hydrogen is its propellant, deuterium its fuel; D-He3 would halve its neutron loss when helium-3 is mined. Its radiators are their own equipment (equipment.thermal.radiator-hot.s2, two to an engine) on the hull, fed from its four coolant ports (2026-10-17)."
size_class: 2
