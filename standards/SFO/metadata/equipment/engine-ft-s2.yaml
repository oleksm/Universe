# yaml-language-server: $schema=../../schema/equipment.schema.yaml
identity:
  key: equipment.engine.ft.s2
  name: "Fusion thermal engine S2"
  maker: org.kestrel
  revision: draft
  slot: engine
  description: "A fusion reactor (catalysed D-D, the deuterium the ports make) heating hydrogen through a magnetic nozzle: 5 kN at 347 km/s, 0.87 GW of jet. A cruise engine: 5 kN moves a 156 t ship at 0.032 m/s2. Hydrogen is its propellant, deuterium its fuel; D-He3 would halve its neutron loss when helium-3 is mined."
size_class: 2
fits: mount.engine-s2
physical:
  mass: 90000
  volume: 160
  length: 10
  width: 4
  height: 4
built_of:
  parts: engine-ft-s2
  list:
    - { code: FTE2-01, name: "Reactor coils and cases", description: "The toroidal and poloidal coils in their titanium strengtheners.", mass: 49500, length: 8.19, width: 3.28, height: 3.28, item: stock.ti64-pl-5, quantity: 56920.0, module: module.welding-bay }
    - { code: FTE2-02, name: "Neutron and radiation shield", description: "Carbon-graphite round the coils.", mass: 22500, length: 6.3, width: 2.52, height: 2.52, item: good.carbon, quantity: 22500.0, module: module.assembly-shop }
    - { code: FTE2-03, name: "First wall and nozzle", description: "Silicon carbide first wall; the magnetic nozzle.", mass: 4500, length: 3.68, width: 1.47, height: 1.47, item: stock.sic-tl-10, quantity: 5175, module: module.machining-centre }
    - { code: FTE2-04, name: "Power conversion and heating", mass: 8100, length: 4.48, width: 1.79, height: 1.79, item: good.electronics, quantity: 8100, module: module.assembly-shop }
    - { code: FTE2-05, name: "Coolant and refrigeration", mass: 3600, length: 3.42, width: 1.37, height: 1.37, item: good.pumps, quantity: 3600, module: module.assembly-shop }
    - { code: FTE2-06, name: "Propellant feed", mass: 1800, length: 2.71, width: 1.09, height: 1.09, item: stock.st304-pl-3, quantity: 2070, module: module.machining-centre }
making:
  module: module.assembly-shop
function:
  kind: engine
  cycle: fusion_thermal
  thrust: 5000
  exhaust: 347000
  efficiency: 0.61
  burns: material.deuterium
  propellant: material.hydrogen
  throttle: 0.2
  gimbal: 0.05
  isotropic_loss: 0.5
  shield_pass: 0.01
  reaction_offset: 3
  heat_to_hull: 0.00051
life: 473364000
basis:
  - { of: [function.exhaust, function.efficiency, function.thrust], tier: sourced, review: true, source: "standards/sources/research_ship_equipment.json", note: "Discovery II (NASA/TM-2005-213559): exhaust 347 km/s at the nozzle exit, 4.83 GW of jet from 7.9 GW of fusion (0.61), 6,250 lbf = 27.8 kN, 0.08 kg/s. The S3 is that engine; the others scale." }
  - { of: [physical], tier: derived, review: true, source: "standards/sources/research_ship_equipment.json", note: "scaled from Discovery II at a little under its specific power; review" }
  - { of: [function.isotropic_loss, function.shield_pass, function.heat_to_hull], tier: invented, review: true, note: "Catalysed D-D: about 38% of the fusion power leaves as neutrons and about 12% as X-rays, in every direction (D-He3, Discovery II's fuel, would be about a quarter in all; the registry has no helium-3 stock yet, so the engine burns the deuterium the ports make); a half-metre carbon-graphite shadow shield (Discovery II's 90 t) passes about a hundredth toward the ship. heat_to_hull = 0.5 / 0.61 x 0.05 x 0.01 + 1e-4 soak-back = 0.00051 of the jet, for a hull taking a twentieth of the sphere. From memory of the physics; the figures want a source. Review." }
  - { of: [function.throttle, function.gimbal], tier: invented, review: true, note: "Deep throttling by fuel rate (a fifth); a magnetic nozzle steers the jet a few degrees. Chosen." }
  - { of: [built_of, making], rule: rule.first-design-parts }
  - { of: [life], rule: rule.life-ship-system }
