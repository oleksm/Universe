    name: Panel
    description: 3 mm carbon-carbon, 543 m2, 33.0 m out from the hinge by 16.5 m along it; both faces dark; bonded between the tube legs as 30 mm fins.
    mass: 2842
    length: 33.0
    width: 16.5
    height: 0.03
    item: stock.cc-pl-3
    quantity: 3268.3
    module: module.assembly-shop
  - code: RAH2-02
    name: Tubes
    description: '103 U-tubes of molybdenum, 50 mm across with a 0.5 mm wall, each 33 m out from the root header and back (66 m): 206 legs on an 80 mm leg pitch (160 mm a U) along the 16.5 m root, 30 mm of fin between legs (fin efficiency
      about 0.88): 315 kg/s of lithium at about 4.0 m/s in their 49 mm bores, about 0.6 bar lost across them (Blasius). 6.8 km of tube.'
    mass: 5337.6
    length: 33.0
    width: 16.5
    height: 0.05
    item: stock.mo-tb-12x0p5
    quantity: 6138.2
    module: module.machining-centre
  - code: RAH2-04
    name: Root headers
    description: The supply and the return header along the root edge, DN 600 molybdenum, 8 mm wall (hoop stress 19 MPa at 5 bar, kept low for creep at 1,600 K), 16.5 m each, on the hinge line, swinging with the panel.
    mass: 5153.6
    length: 16.5
    width: 1.3
    height: 0.62
    item: stock.mo-tb-12x0p5
    quantity: 5926.6
    module: module.machining-centre
  - code: RAH2-05
    name: Backing frame
    description: Carbon-carbon box ribs 550 x 120 mm with a 4 mm wall, twelve running out from the root every 1.5 m, and a mid and a tip spar across; within the panel's 0.65 m.
    mass: 3933.2
    length: 33.0
    width: 16.5
    height: 0.55
    item: stock.cc-pl-3
    quantity: 4523.2
    module: module.assembly-shop
  - code: RAH2-03
    name: Hinge, drive and root joints
    description: 'Root hinge brackets on the hull, the deploy drive, tip latches that hold it stowed, and the hinge crossings: each header splits at its moving end into six DN200 molybdenum-rhenium corrugated hoses (about 0.23 m outside,
      4.1 m/s of lithium), wound round the hinge axis like S1''s (clock-spring), bend radius at least 0.95 m (4 x outside), about 5.4 m of hose each, in a root pod beyond the panel''s -y end.'
    mass: 1500
    length: 16.5
    width: 0.5
    height: 0.65
    item: stock.mo-tb-12x0p5
    quantity: 1725.0
    module: module.machining-centre
  - code: RAH2-06
    name: Collectors, drops and hose cuffs
    description: The fixed DN600 supply and return collectors beyond the hose pod and the moving collectors at the header ends, each with six DN200 drops to their hose cuffs; molybdenum. Mass as blender's model gives it (2026-10-17).
    mass: 5497.8
    length: 2.5
    width: 2.0
    height: 2.0
    item: stock.mo-tb-12x0p5
    quantity: 6322.5
    module: module.machining-centre
