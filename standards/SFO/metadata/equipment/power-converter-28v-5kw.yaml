identity:
  key: equipment.power.converter.28v-5kw
  name: DC converter, 3 kV to 28 V, 5 kW
  maker: org.meridian
  revision: draft
  slot: utility
  description: 'Steps the ship''s 3 kV DC bus down to its 28 V DC bus, up to 5 kW out, isolated: a sealed box on four feet, the 3 kV pair in at its -x end (two connector.hvdc-pole-150a receptacles, 2 A), the 28 V pair out (179 A: two
    connector.hvdc-pole-400a receptacles) and data (connector.circular-shell-11) at its +x end, the coolant pair under it (connector.flat-face-dn6). The connectors'' mass is the routed harness''s (connector.schema physical), not the
    box''s. 93% efficient: at full load it draws 5.38 kW and gives 0.38 kW to the coolant loop.'
