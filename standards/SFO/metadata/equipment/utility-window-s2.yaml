model_requests:
- {work: keep, of_version: 1, asked: '2026-10-17', by: registry, because: "Blender's review (2026-10-17): the model already has the 54, 54 and 12 mm panes; the record only split its panes into named parts."}
life: 473364000
basis:
  - { of: [physical.volume, physical.length, physical.width, physical.height, function, size_class], tier: invented, review: true, note: "Two square metres: a bridge window. Chosen." }
  - { of: [built_of.list, physical.mass], tier: derived, review: true, note: "Panes as a square plate simply supported at its edges, 1.414 m across, at 101.3 kPa: stress = 0.287 x p x side^2 / t^2. The allowable stress for glass under load for years is set at 20 MPa (invented, of the order of the station cupola's panes). That gives 54 mm a pane. Modelled (candidate-v01: 1.417 m square clear opening with 100 mm corner radius; panes held over 2.205 m2), the three fused silica panes at 2,200 kg/m3 weigh 582 kg and the titanium frame with its seat rings, 8 bored compression sleeves and seal faces 139 kg: 721 kg in all. Bound at the model's figures (2026-10-13, was 250 kg): panes 582 kg (523.8 pressure, 58.2 debris), frame 139; fused silica plate stock (FS-PL-54, FS-PL-12) replaces the SiC stand-in." }
  - { of: [fits], tier: derived, review: true, note: "The window is part of the pressure wall. Air pushes on it with 101.3 kPa x 2.0 m2 = 203 kN, far past the mount's 8 x 11.5 kN. That load goes into a window ring the hull provides, around the frame's 6.4 m edge, about 32 kN per metre (the hull owns its openings). The utility mount gives only the place. Left for review; window S1 is the same." }
  - { of: [built_of, making], rule: rule.first-design-parts }
  - { of: [life], rule: rule.life-ship-system }
