  revision: draft
  slot: utility
  description: "A viewport in a pressure hull: a 1.41 m square clear opening with rounded corners in a 1.6 m titanium frame. Two fused silica pressure panes, either able to hold the cabin's pressure alone, and a thin outer pane against debris."
