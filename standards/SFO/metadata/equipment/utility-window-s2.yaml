    - { code: WIN2-02, name: "Frame", description: "Titanium, rounded square; clamps the panes and bolts all round to the hull's window ring.", mass: 125, length: 1.27, width: 1.27, height: 0.159, item: stock.ti64-pl-5, quantity: 144.0, module: module.machining-centre }
