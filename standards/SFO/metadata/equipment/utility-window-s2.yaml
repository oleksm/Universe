identity:
  key: equipment.utility.window.s2
  name: "Viewport S2"
  maker: org.halvard
  revision: draft
  slot: utility
  description: "A viewport in a pressure hull: a 1.41 m square clear opening with rounded corners in a 1.6 m titanium frame. Two fused silica pressure panes, either able to hold the cabin's pressure alone, and a thin outer pane against debris."
size_class: 2
fits: mount.utility-s2
physical:
  mass: 721
  volume: 0.512
  length: 1.6
  width: 1.6
  height: 0.2
built_of:
  parts: utility-window-s2
  list:
    - { code: WIN2-01, name: "Pressure panes", description: "Fused silica: two 54 mm panes, spaced apart, either able to hold the cabin's pressure alone.", mass: 523.8, length: 1.49, width: 1.49, height: 0.108, item: stock.fs-pl-54, quantity: 602.4, module: module.cutting-table }
    - { code: WIN2-02, name: "Frame", description: "Titanium, rounded square: seat rings, eight bored compression sleeves and seal faces; clamps the panes and bolts all round to the hull's window ring.", mass: 139, length: 1.6, width: 1.6, height: 0.2, item: stock.ti64-pl-5, quantity: 159.9, module: module.machining-centre }
    - { code: WIN2-03, name: "Debris pane", description: "Fused silica, 12 mm, outermost: takes the dust and grit so the pressure panes stay unscratched.", mass: 58.2, length: 1.49, width: 1.49, height: 0.012, item: stock.fs-pl-12, quantity: 66.9, module: module.cutting-table }
