# yaml-language-server: $schema=../../schema/equipment.schema.yaml
identity:
  key: equipment.engine.swivel.s1
  name: "Engine swivel S1"
  maker: org.kestrel
  revision: draft
  slot: engine
  description: "A trunnion that turns an engine of up to 30 kN through 90 degrees in about 16 s: aft in flight, down to land. Vectored thrust; the price is 46 kg a unit against a gimbal's nothing."
size_class: 1
fits: mount.engine-s1
physical:
  mass: 46.2
  volume: 0.256
  length: 0.8
  width: 0.8
  height: 0.4
needs:
  power: 200
built_of:
  parts: engine-swivel-s1
  list:
    - { code: SWV1-01, name: "Fixed frame", description: "Bolts to the mount face at Y 0: a square flange of 80 mm angle, two 5 mm cheeks (YZ) at X +-0.27 with doublers round the bushings, and a tie plate on +Z. Open aft (-Y) and below (-Z) for the engine.", mass: 17, length: 0.8, width: 0.8, height: 0.4, item: stock.al6061-pl-5, quantity: 19.55, module: module.welding-bay }
    - { code: SWV1-02, name: "Adapter ring", description: "The moving part the engine bolts to: a welded 60 x 30 mm box ring of 5 mm plate, 0.48 m across, 0.36 m bore, with sleeves for the pins at +-X.", mass: 6.5, length: 0.48, width: 0.48, height: 0.03, item: stock.ti64-pl-5, quantity: 7.48, module: module.welding-bay }
    - { code: SWV1-03, name: "Trunnion pins", description: "Two solid 40 mm pins, 0.11 m long, on the X axis at Y -0.25; keyed to the ring, driven at their outer ends.", mass: 1.2, length: 0.11, width: 0.04, height: 0.04, item: stock.ti64-ingot, quantity: 1.8, module: module.machining-centre }
    - { code: SWV1-04, name: "Bushings", description: "Two bronze bushings, 50 mm outside, 40 mm bore, 40 mm long, in the cheeks.", mass: 0.5, length: 0.05, width: 0.05, height: 0.04, item: stock.brz932-bar-50, quantity: 1.4, module: module.machining-centre }
    - { code: SWV1-05, name: "Drive, +X", description: "Enclosed harmonic-geared actuator with brake, outboard of the +X cheek, coaxial with the pin.", mass: 10.5, length: 0.11, width: 0.2, height: 0.2, item: good.electric-motors, quantity: 10.5, module: module.assembly-shop }
    - { code: SWV1-06, name: "Drive, -X", description: "The same, outboard of the -X cheek.", mass: 10.5, length: 0.11, width: 0.2, height: 0.2, item: good.electric-motors, quantity: 10.5, module: module.assembly-shop }
making:
  module: module.assembly-shop
function:
  kind: swivel
  turns: 1.571
  bears: 30000
  slew: 0.1
life: 473364000
basis:
  - { of: [function], tier: invented, review: true, note: "A quarter turn in about sixteen seconds (0.1 rad/s) under up to 30 kN. Chosen; no flown example at this scale. The engine it carries: up to 100 kg, centre of mass within 0.7 m of the pivot, no wider than 0.52 m within 0.45 m of the pivot (CH-S1 and CA-S1 fit; NT-S1 does not). Feed lines and wiring cross the turn as the engine's and hull's services, not the swivel's." }
  - { of: [built_of.list, physical, needs], tier: derived, review: true, note: "Sized from loads, with the modeller's layout (fixed frame 0.8 x 0.8 x 0.4, ring 0.48 m, pivot Y -0.25). The 30 kN thrust passes through the pivot in every position, 15 kN a pin. Pins: 450 N m bending at 30 mm needs 22 mm of Ti-6Al-4V at half its 880 MPa yield; 40 mm taken for the bushings, 9.4 MPa on bronze. Ring: about 900 N m out of plane; the 60 x 30 x 5 box holds 3 kN m. Cheeks: 30 MPa bearing on 10 mm round the bushing; plates sized by stiffness, not stress. Drive torque: 100 kg at 0.7 m passing horizontal at 1.5 g is 1,030 N m, 515 N m a drive, 640 N m peak with margin; at 60 N m a kilogram (invented class figure for a braked harmonic actuator) 10.5 kg each. Power: 103 W at the pivot, 0.6 efficient, plus brakes: 200 W. Pointed down, a landing shock runs along the engine through the pivot and puts no torque on the drives." }
  - { of: [built_of, making], rule: rule.first-design-parts }
  - { of: [life], rule: rule.life-ship-system }
