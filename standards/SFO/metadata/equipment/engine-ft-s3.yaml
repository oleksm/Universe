identity:
  key: equipment.engine.ft.s3
  name: "Fusion thermal engine S3"
  maker: org.kestrel
  revision: draft
  slot: engine
  description: "A fusion reactor (catalysed D-D, the deuterium the ports make) heating hydrogen through a magnetic nozzle: 27.8 kN at 347 km/s, 4.8 GW of jet. A cruise engine: 27.8 kN moves a 156 t ship at 0.18 m/s2. Hydrogen is its propellant, deuterium its fuel; D-He3 would halve its neutron loss when helium-3 is mined."
size_class: 3
fits: mount.engine-s3
physical:
  mass: 421861
  volume: 1.54e+03
  length: 24
  width: 8
  height: 8
built_of:
  parts: engine-ft-s3
  list:
    - { code: FTE3-01, name: "Reactor coils and cases", description: "The toroidal and poloidal coils in their titanium strengtheners.", mass: 198550, length: 19.7, width: 6.55, height: 6.55, item: stock.ti64-pl-5, quantity: 228300.0, module: module.welding-bay }
    - { code: FTE3-02, name: "Shadow shield", description: "A nuclear-graphite disc between the mount and the reactor, 7.73 m across and 1.05 m thick.", mass: 90250, length: 7.73, width: 7.73, height: 1.05, item: good.carbon, quantity: 90250.0, module: module.assembly-shop }
    - { code: FTE3-03, name: "First wall and nozzle", description: "Silicon carbide first wall; the magnetic nozzle.", mass: 18050, length: 8.84, width: 2.95, height: 2.95, item: stock.sic-tl-10, quantity: 20760.0, module: module.machining-centre }
    - { code: FTE3-04, name: "Power conversion and heating", mass: 32490, length: 10.8, width: 3.59, height: 3.59, item: good.electronics, quantity: 32490.0, module: module.assembly-shop }
    - { code: FTE3-05, name: "Coolant and refrigeration", mass: 14440, length: 8.21, width: 2.74, height: 2.74, item: good.pumps, quantity: 14440.0, module: module.assembly-shop }
    - { code: FTE3-06, name: "Propellant feed", mass: 7220, length: 6.51, width: 2.17, height: 2.17, item: stock.st304-pl-3, quantity: 8303, module: module.machining-centre }
    - { code: FTE3-07, name: "Radiator panels", description: "Two wings of 3 mm carbon-carbon, 5,533 m2 in all, stowed folded along the engine and swung out to stand edge-on to the jet; they shed the heat the reactor keeps from both faces at 1,500 K.", mass: 29047, length: 52.6, width: 52.6, height: 0.003, item: stock.cc-pl-3, quantity: 33404.0, module: module.assembly-shop }
    - { code: FTE3-08, name: "Heat pipes, manifolds and booms", description: "Lithium heat pipes in molybdenum along the panels, the manifolds that feed them from the coolant loop, and the hinged booms that hold the wings out.", mass: 31814, length: 52.6, width: 0.5, height: 0.5, item: stock.mo-tb-12x0p5, quantity: 36586.1, module: module.machining-centre }
