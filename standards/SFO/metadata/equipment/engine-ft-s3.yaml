# yaml-language-server: $schema=../../schema/equipment.schema.yaml
identity:
  key: equipment.engine.ft.s3
  name: "Fusion thermal engine S3"
  maker: org.kestrel
  revision: draft
  slot: engine
  description: "A fusion reactor (catalysed D-D, the deuterium the ports make) heating hydrogen through a magnetic nozzle: 27.8 kN at 347 km/s, 4.8 GW of jet. A cruise engine: 27.8 kN moves a 156 t ship at 0.18 m/s2. Hydrogen is its propellant, deuterium its fuel; D-He3 would halve its neutron loss when helium-3 is mined."
size_class: 3
fits: mount.engine-s3
physical:
  mass: 361000
  volume: 1.54e+03
  length: 24
  width: 8
  height: 8
built_of:
  parts: engine-ft-s3
  list:
    - { code: FTE3-01, name: "Reactor coils and cases", description: "The toroidal and poloidal coils in their titanium strengtheners.", mass: 198550, length: 19.7, width: 6.55, height: 6.55, item: stock.ti64-pl-5, quantity: 228300.0, module: module.welding-bay }
    - { code: FTE3-02, name: "Neutron and radiation shield", description: "Carbon-graphite round the coils.", mass: 90250, length: 15.1, width: 5.04, height: 5.04, item: good.carbon, quantity: 90250.0, module: module.assembly-shop }
    - { code: FTE3-03, name: "First wall and nozzle", description: "Silicon carbide first wall; the magnetic nozzle.", mass: 18050, length: 8.84, width: 2.95, height: 2.95, item: stock.sic-tl-10, quantity: 20760.0, module: module.machining-centre }
    - { code: FTE3-04, name: "Power conversion and heating", mass: 32490, length: 10.8, width: 3.59, height: 3.59, item: good.electronics, quantity: 32490.0, module: module.assembly-shop }
    - { code: FTE3-05, name: "Coolant and refrigeration", mass: 14440, length: 8.21, width: 2.74, height: 2.74, item: good.pumps, quantity: 14440.0, module: module.assembly-shop }
    - { code: FTE3-06, name: "Propellant feed", mass: 7220, length: 6.51, width: 2.17, height: 2.17, item: stock.st304-pl-3, quantity: 8303, module: module.machining-centre }
making:
  module: module.assembly-shop
function:
  kind: engine
  cycle: fusion_thermal
  thrust: 27800
  exhaust: 347000
  efficiency: 0.61
  burns: material.deuterium
  propellant: material.hydrogen
  throttle: 0.2
  gimbal: 0.05
  isotropic_loss: 0.5
  shield_pass: 0.01
  reaction_offset: 7.2
  heat_to_hull: 0.00051
life: 473364000
basis:
  - { of: [function.exhaust, function.efficiency, function.thrust], tier: sourced, review: true, source: "standards/sources/research_ship_equipment.json", note: "Discovery II (NASA/TM-2005-213559): exhaust 347 km/s at the nozzle exit, 4.83 GW of jet from 7.9 GW of fusion (0.61), 6,250 lbf = 27.8 kN, 0.08 kg/s. The S3 is that engine; the others scale." }
  - { of: [physical], tier: derived, review: true, source: "standards/sources/research_ship_equipment.json", note: "Discovery II itself: reactor 310 t (first wall 14, coils 206, shield 90), nozzle 3, power conversion 30, coolant 11, heating 5, refrigeration 2" }
  - { of: [function.isotropic_loss, function.shield_pass, function.heat_to_hull], tier: invented, review: true, note: "Catalysed D-D: about 38% of the fusion power leaves as neutrons and about 12% as X-rays, in every direction (D-He3, Discovery II's fuel, would be about a quarter in all; the registry has no helium-3 stock yet, so the engine burns the deuterium the ports make); a half-metre carbon-graphite shadow shield (Discovery II's 90 t) passes about a hundredth toward the ship. heat_to_hull = 0.5 / 0.61 x 0.05 x 0.01 + 1e-4 soak-back = 0.00051 of the jet, for a hull taking a twentieth of the sphere. From memory of the physics; the figures want a source. Review." }
  - { of: [function.throttle, function.gimbal], tier: invented, review: true, note: "Deep throttling by fuel rate (a fifth); a magnetic nozzle steers the jet a few degrees. Chosen." }
  - { of: [built_of, making], rule: rule.first-design-parts }
  - { of: [life], rule: rule.life-ship-system }
