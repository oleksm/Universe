identity:
  key: equipment.engine.ft.s3
  name: Fusion thermal engine S3
  maker: org.kestrel
  revision: draft
  slot: engine
  description: 'A fusion reactor (catalysed D-D, the deuterium the ports make) heating hydrogen through a magnetic nozzle: 27.8 kN at 347 km/s, 4.8 GW of jet. A cruise engine: 27.8 kN moves a 156 t ship at 0.18 m/s2. Hydrogen is its
    propellant, deuterium its fuel; D-He3 would halve its neutron loss when helium-3 is mined. Its radiators are ten S2 hot radiator panels (equipment.thermal.radiator-hot.s2), five a side on the hull, fed from its four coolant ports
    through the ship''s manifolds, each port to five panels (2026-10-17).'
