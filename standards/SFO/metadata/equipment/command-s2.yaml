identity:
  key: equipment.command.s2
  name: "Pilot and co-pilot's station"
  maker: org.hadley
  revision: draft
  slot: command
  description: "Where the ship is flown from: two seats side by side facing forward (2.2 m across, 1.2 m fore and aft), a shared pedestal between them and a console in front of each, entered from behind and the sides. On the bridge, inside the pressurised space."
size_class: 2
fits: mount.command-s2
physical:
  mass: 340
  volume: 3.96
  length: 2.2
  width: 1.2
  height: 1.5
needs:
  power: 2500
built_of:
  parts: command-s2
  list:
    - { code: CMD2-01, name: "Seats and harnesses", description: "Rated to the station's g.", mass: 75, length: 1.33, width: 0.724, height: 0.906, item: stock.al6061-pl-5, quantity: 86.25, module: module.machining-centre }
    - { code: CMD2-02, name: "Consoles and frame", description: "Controls, pedestal and the structure they stand on.", mass: 112, length: 1.52, width: 0.829, height: 1.04, item: stock.al6061-pl-5, quantity: 128.8, module: module.machining-centre }
    - { code: CMD2-03, name: "Displays and computers", mass: 119, length: 1.55, width: 0.846, height: 1.06, item: good.electronics, quantity: 119, module: module.assembly-shop }
    - { code: CMD2-04, name: "Internal wiring and linings", description: "The station's own looms between its seats, consoles, displays and computers, its terminal hardware, and the panel linings; not the ship's harness, which brings power and data to its ports (routed by the ship). One lump, its split between copper and lining not worked out: review.", mass: 34, length: 1.02, width: 0.557, height: 0.696, item: stock.mli-fl, quantity: 34, module: module.assembly-shop }
making:
  module: module.assembly-shop
function:
  kind: command_station
  persons: 2
  g_rating: 88.3
  facing: thrust
visual:
  format: "freefall-model/1"
  path: "models/command-s2/v2"
  manifest_sha256: "10934661807a7736464a1cf4779d403e9939c011dfbb938cacf6e3016f35b70c"
  version: 2
  triangles: 4876
life: 473364000
basis:
  - { of: [physical, needs, function, size_class], tier: invented, review: true, note: "Two seats side by side, each as the pilot's station, with a shared console between (an airliner's pedestal). From memory; chosen." }
  - { of: [fits], tier: derived, review: true, note: "At its 88.3 m/s2 (9 g) rating the station and two crew of 100 kg each, 540 kg, pull 48 kN on its mount: about 12 kN on each of 4 points, against the 3.13 kN they take. Mounts were set at 3 g (rule.mounts-margin); seats need the g they are rated to. Left for review." }
  - { of: [physical.mass], tier: invented, review: true, note: "Modelled (candidate-v02: 3 mm aluminium shells as stand-ins, solid deck and brackets, padding at 120 kg/m3, polymer at 1,200, a cold plate and the rear coolant pair; not engineered) the seats, consoles and frame are about 283 kg. With the listed displays and computers (119 kg) and wiring (34 kg), that is about 436 kg against 340, and past the mount's 425 kg; with its two crew, 56.1 kN on the mount at 9 g (14 kN a point). Uncertain; left for review." }
  - { of: [needs.power], tier: derived, review: true, note: "Its 2.5 kW all ends as heat. The life support's cabin cooler is sized for 500 W a head, a person's 137 W and the rest for displays, lights and fans (the three-person plant's 1.5 kW), so the computers cannot dump it all into the cabin air: they sit on cold plates on a capped coolant pair at the rear, to the ship's coolant loop, and only about a fifth (the screens' faces and the fans), 500 W, about 300 W a seat, reaches the cabin air. It takes power, data and coolant." }
  - { of: [built_of, making], rule: rule.first-design-parts }
  - { of: [life], rule: rule.life-ship-system }
