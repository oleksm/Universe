built_of:
  parts: lift-belly-s3
  shares: rule.discovery-ii-engine-shares
  list:
    - { code: LBS3-01, name: "First wall", description: "The lining that faces the burning plasma.", mass: 289, length: 13.3, width: 6.05, height: 2.05, item: stock.sic-tl-10, quantity: 332.3, module: module.machining-centre }
    - { code: LBS3-02, name: "Field coil cases", description: "The beams and cases that hold the field coils against their own force: most of the engine's weight.", mass: 2620, length: 27.8, width: 12.6, height: 4.27, item: stock.ti64-pl-5, quantity: 3013.0, module: module.welding-bay }
    - { code: LBS3-03, name: "Field coil windings", description: "The superconducting windings themselves: a few kilograms of tape, nearly all of it copper and steel around a film of superconductor.", mass: 31, length: 6.34, width: 2.87, height: 0.974, item: stock.cu-wire-2, quantity: 35.6, module: module.machining-centre }
    - { code: LBS3-04, name: "Shaping coils and bracing", description: "The coils that shape and hold the plasma, and the bracing between them.", mass: 1587, length: 23.5, width: 10.7, height: 3.62, item: stock.ti64-pl-5, quantity: 1825.0, module: module.welding-bay }
    - { code: LBS3-05, name: "Shield", description: "Half a metre of carbon between the plasma and the coils, to stop what would warm and spoil them.", mass: 1854, length: 24.8, width: 11.2, height: 3.81, item: good.carbon, quantity: 1854, module: module.assembly-shop }
    - { code: LBS3-06, name: "Magnetic nozzle", description: "The coils that open the field astern and turn the plasma's heat into a jet.", mass: 124, length: 10.1, width: 4.56, height: 1.55, item: stock.ti64-pl-5, quantity: 142.6, module: module.welding-bay }
    - { code: LBS3-07, name: "Fuel feed", description: "The injector and its lines from the tank.", mass: 124, length: 10.1, width: 4.56, height: 1.55, item: stock.st304-pl-3, quantity: 142.6, module: module.machining-centre }
    - { code: LBS3-08, name: "Plasma heater", description: "The radio-frequency source that brings the plasma to burning.", mass: 103, length: 9.46, width: 4.29, height: 1.45, item: good.electronics, quantity: 103, module: module.assembly-shop }
    - { code: LBS3-09, name: "Refrigerator", description: "Keeps the windings cold.", mass: 41, length: 6.96, width: 3.15, height: 1.07, item: good.heat-pumps, quantity: 41, module: module.assembly-shop }
    - { code: LBS3-10, name: "Coolant pumps", description: "Drive the coolant through wall and shield.", mass: 79, length: 8.66, width: 3.93, height: 1.33, item: good.pumps, quantity: 79, module: module.assembly-shop }
    - { code: LBS3-11, name: "Coolant lines", description: "Pipes and manifolds.", mass: 148, length: 10.7, width: 4.84, height: 1.64, item: stock.st304-pl-3, quantity: 170.2, module: module.welding-bay }
making:
