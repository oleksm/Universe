# yaml-language-server: $schema=../../schema/equipment.schema.yaml
identity:
  key: equipment.cargo.ore-bay.5t
  name: "Ore bay 5 t"
  maker: org.hadley
  revision: draft
  slot: cargo
  description: "A short trough hopper for 5 t of loose ore, the 10 t bay's section cut short: straight sides above a V bottom sloped at 45 degrees to a slot gate the length of the floor, with a pair of top doors the length of the roof, all in a tube frame. The doors open to the excavator and shut for flight; the gate slides open at the dock to let the ore out. One of ten sizes, so a hull takes the bay that fits."
size_class: 1
fits: mount.cargo-s1
physical:
  mass: 500
  volume: 5.37
  length: 1.814
  width: 1.72
  height: 1.72
built_of:
  parts: cargo-ore-bay-5t
  shares: rule.haul-truck-shares
  list:
    - { code: OBS01-01, name: "Shell", description: "The hopper's plates, sloped to the gate.", mass: 200, length: 1.592, width: 0.796, height: 0.796, item: stock.sta36-pl-20, quantity: 230.0, module: module.welding-bay }
    - { code: OBS01-02, name: "Wear liners", description: "Hard plates bolted inside where the rock lands and slides.", mass: 100, length: 1.263, width: 0.632, height: 0.632, item: stock.st4340-pl-3, quantity: 115.0, module: module.cutting-table }
    - { code: OBS01-03, name: "Top doors", description: "The pair, hinged at the sides, the length of the roof, that opens to the excavator and shuts for flight.", mass: 75, length: 1.148, width: 0.574, height: 0.574, item: stock.al6061-pl-5, quantity: 86.2, module: module.welding-bay }
    - { code: OBS01-04, name: "Discharge gate", description: "A slot gate the length of the floor, about 0.3 m wide, sliding on bearing beds ribbed to the shell along both edges of the slot (end guides alone cannot carry the loaded plate), and its drive, that lets the ore out at the dock.", mass: 50, length: 1.003, width: 0.501, height: 0.501, item: stock.st4340-bar-120, quantity: 57.5, module: module.machining-centre }
    - { code: OBS01-05, name: "Frame", description: "Tube chords and uprights that carry the hopper to its mount.", mass: 75, length: 1.148, width: 0.574, height: 0.574, item: stock.st4340-tb-160x5, quantity: 86.2, module: module.welding-bay }
making:
  module: module.assembly-shop
function:
  kind: ore_bay
  capacity: 5000
  volume: 2.5
  fill_density: 2000
life: 473364000
basis:
  - { of: [function.capacity, function.volume, function.fill_density], tier: derived, review: true, note: "Its volume is its capacity at 2,000 kg/m3, broken rock heaped (loose basalt about 1,600, iron ore 2,500: with denser ore it carries its capacity part full; with lighter it fills first and carries less)." }
  - { of: [physical.mass], tier: invented, review: true, note: "A tenth of its capacity: a haul truck's body is about 11% of its payload (a 363 t truck's 40 t body, from memory). Not sourced." }
  - { of: [size_class], tier: invented, review: true, note: "Its class by what it carries: 10 t and under class 1, 35 t class 2, 100 t class 3, above class 4." }
  - { of: [identity.description, physical.length, physical.width, physical.height, physical.volume, built_of.list], tier: derived, review: true, note: "Fitted round its 2.5 m3 at the modeller's request (the first box, 2.16 x 1.08 x 1.08 m, held only 2.5 m3 with no walls, frame or doors). The 10 t bay's section unchanged (outer 1.72 m square, 1.4 m clear wide, 1.42 m clear high, a 45 degree V to a 0.3 m slot: 1.69 m2); 2.5 m3 needs 1.48 m of trough, 1.81 m long with end walls. Inside the class 1 mount (3.49 x 2.2 x 2.2 m). The model's frame is 100 x 5 mm tube, as the 10 t bay's; the 160 mm tube stays as the allocation's stock. The modeller's proposal (2.501 m3 clear); review." }
  - { of: [built_of.list], tier: derived, review: true, note: "Flagged, not thinned: measured on the modeller's candidate (blender cargo-ore-bay-5t/candidate-v01: 20 mm A36 shell, 3 mm liners, 100 x 5 mm frame, the gate on ribbed beds): shell 1.33 t (against the 0.2 t given), liners 0.19, frame 0.38, doors 0.29, gate, beds and ribs 0.44, 2.65 t against the 0.5 t recorded, before the hidden drives; loaded strength and ore flow unqualified. A thinner ribbed shell would cut it (see the 10 t bay's note). Left at 0.5 t until reviewed. Review." }
  - { of: [life], rule: rule.life-ship-system }
