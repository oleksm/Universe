basis:
  - { of: [function.capacity, function.volume, function.fill_density], tier: derived, review: true, note: "Its volume is its capacity at 2,000 kg/m3, broken rock heaped (loose basalt about 1,600, iron ore 2,500: with denser ore it carries its capacity part full; with lighter it fills first and carries less)." }
  - { of: [physical.mass, built_of.list], tier: derived, review: true, note: "Worked out from its dimensions, loads and materials (tools/standards/ore_bays.py): ore at 2,000 kg/m3 at 3 g presses 84 kPa at the gate (as a liquid at the full clear depth; loose rock presses less). 8 mm A36 plate held by ribs every 0.50 m (stress p b2 / 2t2 within two thirds of yield), the ribs 8 mm webs 80 mm deep carried on down to the bottom chords: shell 0.52 t, ribs 0.08; 3 mm 4340 liners over all it touches 0.19; 5 mm aluminium doors ribbed for a reverse 0.3 g, with hinges, locks and the steel coaming they shut on 0.07; an 8 mm ribbed gate on two bearing strips, 45 mm below the shell on 8 mm skirts that carry the slot down past the webs, with the webs, seats and guides that carry it to the frame, 0.11; held at its corners, the loaded bay bends as a beam, 12 kN in each top chord: 4340 tube 60 x 2 mm with ties at every rib (buckling between ties 1.5 times the load or more), frame 0.07. Loaded by pouring through the open roof: the ties form a grate with 0.44 m gaps that screens off lumps too big for the 0.3 m gate slot (a slot passes lumps up to about a third of its width, 0.10 m), so ore is broken to that before loading; the door ribs, every 1.00 m, hang between the ties when shut. 1.04 t, 0.21 of its capacity; drives, seals and fasteners not counted; the ribs' free edges unchecked for buckling. Review." }
  - { of: [size_class], tier: invented, review: true, note: "Its class by what it carries: 10 t and under class 1, 35 t class 2, 100 t class 3, above class 4." }
  - { of: [identity.description, physical.length, physical.width, physical.height, physical.volume, built_of.list], tier: derived, review: true, note: "Fitted round its 2.5 m3 at the modeller's request (the first box, 2.16 x 1.08 x 1.08 m, held only 2.5 m3 with no walls, frame or doors). The 10 t bay's section unchanged (outer 1.72 m square, 1.4 m clear wide, 1.42 m clear high, a 45 degree V to a 0.3 m slot: 1.69 m2); 2.5 m3 needs 1.48 m of trough, 1.81 m long with end walls. Inside the class 1 mount (3.49 x 2.2 x 2.2 m). The model's frame is 100 x 5 mm tube, as the 10 t bay's; the 160 mm tube stays as the allocation's stock. The modeller's proposal (2.501 m3 clear); review." }
  - { of: [visual], tier: derived, review: true, note: "The model (v2) is built to the worked-out design, 8 mm plate and ribs, and weighs 1,148 kg by its material volumes (measured by the modeller), 10% over the 1,040 kg worked out: its doors 117 kg against 73 (the leaves match at 28 kg, but its coamings weigh 56 against 36 and its hinges, drives and their seats 33 against the 7 kg the quarter-of-the-leaves allowance gives a bay this small), its ribs 109 against 83 (end-wall webs and top seats) and its gate 130 against 114. As on the 10 t bay, the allowances are proportional and come out low on the smallest bays; the record keeps the worked-out mass until they are refined. Review." }
  - { of: [life], rule: rule.life-ship-system }
