identity:
  key: equipment.cargo.ore-bay.5t
  name: "Ore bay 5 t"
  maker: org.hadley
  revision: draft
  slot: cargo
  description: "A short trough hopper for 5 t of loose ore, the 10 t bay's section cut short: straight sides above a V bottom sloped at 45 degrees to a slot gate the length of the floor, with a pair of top doors the length of the roof, all in a tube frame. The doors open to the excavator and shut for flight; the gate slides open at the dock to let the ore out. One of ten sizes, so a hull takes the bay that fits."
size_class: 1
fits: mount.cargo-s1
physical:
  mass: 1040
  volume: 5.37
  length: 1.814
  width: 1.72
  height: 1.72
built_of:
  parts: cargo-ore-bay-5t
  list:
    - { code: OBS01-01, name: "Shell", description: "The hopper's 8 mm plates, sloped to the gate.", mass: 520, length: 1.440, width: 1.365, height: 1.365, item: stock.sta36-pl-8, quantity: 598.0, module: module.welding-bay }
    - { code: OBS01-02, name: "Ribs", description: "8 mm webs welded round the shell every 0.50 m and up the end walls.", mass: 80, length: 0.771, width: 0.731, height: 0.731, item: stock.sta36-pl-8, quantity: 92.0, module: module.welding-bay }
    - { code: OBS01-03, name: "Wear liners", description: "Hard plates bolted inside where the rock lands and slides.", mass: 190, length: 1.029, width: 0.976, height: 0.976, item: stock.st4340-pl-3, quantity: 218.5, module: module.cutting-table }
    - { code: OBS01-04, name: "Top doors", description: "The pair, hinged at the sides, the length of the roof, that opens to the excavator and shuts for flight; ribbed beneath, the ribs falling between the roof ties.", mass: 70, length: 0.738, width: 0.700, height: 0.700, item: stock.al6061-pl-5, quantity: 80.5, module: module.welding-bay }
    - { code: OBS01-05, name: "Discharge gate", description: "A slot gate the length of the floor, ribbed beneath, sliding on bearing strips along both edges of the slot, that lets the ore out at the dock (its drive not counted); it runs below the shell's webs, the slot carried down to it by two skirts.", mass: 110, length: 0.858, width: 0.813, height: 0.813, item: stock.sta36-pl-8, quantity: 126.5, module: module.welding-bay }
    - { code: OBS01-06, name: "Frame", description: "Tube chords and end frames that carry the hopper to its mount, with a tie across the top at every rib.", mass: 70, length: 0.738, width: 0.700, height: 0.700, item: stock.st4340-tb-60x2, quantity: 80.5, module: module.welding-bay }
