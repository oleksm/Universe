# yaml-language-server: $schema=../../schema/equipment.schema.yaml
identity:
  key: equipment.cargo.ore-bay.150t
  name: "Ore bay 150 t"
  maker: org.hadley
  revision: draft
  slot: cargo
  description: "A long trough hopper for 150 t of loose ore, the 100 t bay's section made longer: straight sides above a V bottom sloped at 45 degrees to a slot gate the length of the floor, with a pair of top doors the length of the roof, all in a tube frame. The doors open to the excavator and shut for flight; the gate slides open at the dock to let the ore out. One of ten sizes, so a hull takes the bay that fits."
size_class: 4
fits: mount.cargo-s4
physical:
  mass: 14880
  volume: 125.1
  length: 12.61
  width: 3.15
  height: 3.15
built_of:
  parts: cargo-ore-bay-150t
  list:
    - { code: OBS08-01, name: "Shell", description: "The hopper's 8 mm plates, sloped to the gate.", mass: 5580, length: 9.093, width: 2.272, height: 2.272, item: stock.sta36-pl-8, quantity: 6417.0, module: module.welding-bay }
    - { code: OBS08-02, name: "Ribs", description: "8 mm webs welded round the shell every 0.35 m and up the end walls.", mass: 3220, length: 7.571, width: 1.891, height: 1.891, item: stock.sta36-pl-8, quantity: 3703.0, module: module.welding-bay }
    - { code: OBS08-03, name: "Wear liners", description: "Hard plates bolted inside where the rock lands and slides.", mass: 2110, length: 6.576, width: 1.643, height: 1.643, item: stock.st4340-pl-3, quantity: 2426.5, module: module.cutting-table }
    - { code: OBS08-04, name: "Top doors", description: "The pair, hinged at the sides, the length of the roof, that opens to the excavator and shuts for flight; ribbed beneath, the ribs falling between the roof ties.", mass: 930, length: 5.004, width: 1.250, height: 1.250, item: stock.al6061-pl-5, quantity: 1069.5, module: module.welding-bay }
    - { code: OBS08-05, name: "Discharge gate", description: "A slot gate the length of the floor, ribbed beneath, sliding on bearing strips along both edges of the slot, that lets the ore out at the dock (its drive not counted); it runs below the shell's webs, the slot carried down to it by two skirts.", mass: 1880, length: 6.328, width: 1.581, height: 1.581, item: stock.sta36-pl-8, quantity: 2162.0, module: module.welding-bay }
    - { code: OBS08-06, name: "Frame", description: "Tube chords and end frames that carry the hopper to its mount, with a tie across the top at every rib.", mass: 1160, length: 5.387, width: 1.346, height: 1.346, item: stock.st4340-tb-100x5, quantity: 1334.0, module: module.welding-bay }
