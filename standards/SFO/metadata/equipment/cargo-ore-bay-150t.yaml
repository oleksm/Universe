basis:
  - { of: [function.capacity, function.volume, function.fill_density], tier: derived, review: true, note: "Its volume is its capacity at 2,000 kg/m3, broken rock heaped (loose basalt about 1,600, iron ore 2,500: with denser ore it carries its capacity part full; with lighter it fills first and carries less)." }
  - { of: [physical.mass, built_of.list], tier: derived, review: true, note: "Worked out from its dimensions, loads and materials (tools/standards/ore_bays.py): ore at 2,000 kg/m3 at 3 g presses 159 kPa at the gate (as a liquid at the full clear depth; loose rock presses less). 8 mm A36 plate held by ribs every 0.35 m (stress p b2 / 2t2 within two thirds of yield), the ribs 8 mm webs 170 mm deep carried on down to the bottom chords: shell 5.58 t, ribs 3.22; 3 mm 4340 liners over all it touches 2.11; 5 mm aluminium doors ribbed for a reverse 0.3 g, with hinges, locks and the steel coaming they shut on 0.93; an 8 mm ribbed gate on two bearing strips, 110 mm below the shell on 8 mm skirts that carry the slot down past the webs, with the webs, seats and guides that carry it to the frame, 1.88; held at its corners, the loaded bay bends as a beam, 1214 kN in each top chord: 4340 tube 100 x 5 mm with ties at every rib (buckling between ties 1.5 times the load or more), frame 1.16. Loaded by pouring through the open roof: the ties form a grate with 0.29 m gaps that screens off lumps too big for the 0.5 m gate slot (a slot passes lumps up to about a third of its width, 0.17 m), so ore is broken to that before loading; the door ribs, every 0.70 m, hang between the ties when shut. 14.88 t, 0.10 of its capacity; drives, seals and fasteners not counted; the ribs' free edges unchecked for buckling. Review." }
  - { of: [size_class], tier: invented, review: true, note: "Its class by what it carries: 10 t and under class 1, 35 t class 2, 100 t class 3, above class 4." }
  - { of: [identity.description, physical.length, physical.width, physical.height, physical.volume, built_of.list], tier: derived, review: true, note: "Fitted round its 75 m3 at the modeller's request (the first box, 6.7 x 3.35 x 3.35 m, held only 75.2 m3 with no walls, frame or doors). The 100 t bay's section unchanged (outer 3.15 m square, 2.75 m clear wide, 2.7 m clear high, a 45 degree V to a 0.5 m slot: 6.16 m2), so the family shares its doors, gate and frame details; 75 m3 needs 12.18 m of trough, 12.61 m long with end walls. Well inside the class 4 mount (29.6 x 5.84 x 5.84 m); a wider section would be shorter but differ from the 100 t. The modeller's proposal (75.03 m3 clear); review." }
  - { of: [visual], tier: derived, review: false, note: "The model (v2) is built to the worked-out design, 8 mm plate and ribs, and weighs 14,699 kg by its material volumes (measured by the modeller), against 14,880 kg worked out." }
  - { of: [life], rule: rule.life-ship-system }
