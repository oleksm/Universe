    - { code: RAD1-02, name: "Headers and tubes", description: "The coolant passages: a supply and a return header side by side along the root edge (80 mm across: the panel's full thickness there), U-tubes from them through the panel and back.", mass: 72, length: 3.13, width: 0.18, height: 0.08, item: stock.ti64-tb-60x1p5, quantity: 82.8, module: module.machining-centre }
