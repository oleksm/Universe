basis:
  - { of: [physical, function, size_class], tier: invented, review: true, note: "Throws off 2 MW at 1,000 K from 20 m2, both faces to deep space (Stefan-Boltzmann, emissivity 0.9): twice as long as wide. 12 kg/m2 chosen for a titanium panel with its headers." }
  - { of: [built_of, making], rule: rule.first-design-parts }
  - { of: [built_of.list, identity.description], tier: derived, review: true, note: "As the S2's (2026-10-10): the part boxes follow the panel (they were scaled stand-ins). Deployable, exported stowed (the record's 6.26 x 3.13 x 0.08 m, inside the mount's 6.89 x 3.44 x 1.1 m envelope); hinge brackets and tip latches are the mount's four corners; deployed it turns 90 degrees about the root edge (motion later). A 6 m cantilever at 12 kg/m2 is for free fall only: deploying or slewing under thrust loads its root, unchecked (review). The hull's view of the deployed panel is ignored (review)." }
  - { of: [physical.mass, built_of.list], tier: invented, review: true, note: "Open, as for the S2: titanium Ti-6Al-4V is not a 1,000 K material (its strength falls away above about 700 K, from memory); a panel this hot wants carbon-carbon fins on niobium-alloy or stainless headers, or a cooler panel 4 times larger. The stock stays a mass proxy until that is settled." }
