identity:
  key: equipment.cargo.head.s1
  name: "Head"
  maker: org.hadley
  revision: draft
  slot: cargo
  description: "A one-person privacy cubicle for a crew of six: a space toilet at the rear left with foot and thigh restraints and handholds; on the right a compact sealed wash dispenser and a lidded suction basin, the same free-fall scheme as the galley (water through a valve, air-driven drain), so it works coasting or under thrust. Thin panels, eight corner mounts. The door opens outward onto the hull corridor and closes when not in use; the hull owns the opening. Its water is the people's need; its waste water goes to life support's recovery or the waste tank."
