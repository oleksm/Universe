basis:
  - { of: [physical.length, physical.width, physical.height, physical.volume], tier: derived, note: "Measured from the model; its volume the box round it." }
  - { of: [physical.mass, built_of], tier: derived, note: "The sum of its measured parts, each its length in the stock it is cut from (the integrator's measuring, 2026-10-05)." }
  - { of: [function, size_class], tier: invented, review: true, note: "A heavy hydraulic breaker of this size class, from memory of excavator breakers in the 1.5-2 t class: about 4 kJ a blow at about 480 blows a minute (8 Hz): 32 kW in the blows, 53 kW of hydraulic power at 60%. The chisel's push-back: a 120 kg piston at 8.2 m/s (4 kJ) carries 980 N s a blow, 7.8 kN on average at 8 Hz, which the boom must feed against and the ship must take: in free fall it is clamped to the rock (MC-07's anchor clamps) or drifts away at 7.8 kN over its mass. Reach: the boom's telescoping extension, measured from the source rig (build_mining_ship.py BOOM_EXT: two stages of 0.74 m, 1.48 m; was 4.5 m, a guess); the chisel itself travels 0.16 m a blow." }
  - { of: [physical, built_of], tier: derived, review: true, note: "Measured from the earlier laser drawing; the hammer drawing is to be measured again (ships, blender, 2026-10-10)." }
  - { of: [physical.length, physical.width, physical.height, physical.volume, size_class], tier: derived, review: true, note: "The record's box is the thing stowed, as fitted and carried (registry convention 2026-10-10). Measured in its hatch by blender: 5.340 x 6.440 x 5.320 m with the lift-slide hatch, its lift rods and carriages (the hull's rails are the hull's; candidate-v01 extraction, 2026-10-10; was 4.845 m without them), over hardpoint-s2's 4.5 m width, so class 3 (ships' choice, 2026-10-10: larger slots, the source kept)." }
  - { of: [identity, built_of], tier: derived, review: true, note: "The right-hand twin of equipment.hardpoint.mining-hammer.mc07 (2026-10-10): the same product mirrored across the ship's centre plane (its model is the left's reflected, with rigid frames: blender handedness-v01). Same parts, mass and figures; the hull's fit picks the hand." }
  - { of: [life], rule: rule.life-ship-system }
