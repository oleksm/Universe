    - { code: PFS3-09, name: "Radiator panel", description: "Sheds the heat the turbine cannot use: one carbon-carbon plate beside the plant bay, hinged on its long edge to stand up and radiate from both faces.", mass: 1341, length: 15.98, width: 15.98, height: 0.003, item: stock.cc-pl-3, quantity: 1542.1, module: module.assembly-shop }
