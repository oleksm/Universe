model_requests:
- {work: rebuild, of_version: 1, asked: '2026-10-17', by: registry, because: "Blender's review (2026-10-17): the model shows 120 mm panel proxies on base slabs where the record has a 3 mm carbon-carbon radiator plate, hinged on its long edge, on carbon-fibre trusses. Remake the radiator as the record says, with its hinge."}
life: 473364000
basis:
  - { of: [physical, needs, function, size_class], rule: rule.early-list }
  - { of: [built_of, making], tier: invented, review: true, note: "A first design: a fusion reactor and the turbine set that turns its heat to power, in the shares of NASA's Discovery II, brought to this product's weight. What makes one maker's plant lighter or thriftier than another's is not yet in its parts." }
  - { of: [physical.length, physical.width, physical.height, physical.volume], tier: derived, review: true, source: "docs/ships/mc-07-equipment-dimensions.md", note: "As the S1 plant: its radiator for 26.0 MW of waste heat at 1,000 K, 255 m2 of panel radiating both sides (a 16 by 16 m panel), the plant in a closed 15.9 m bay beside it, as the S2 lays it out (blender, 2026-10-11)." }
  - { of: [built_of.list, physical], tier: derived, review: true, note: "Radiator and frame from material, size and load, as the Aurel plants (2026-10-13), the rest of the list as before: 9,416 kg (was 5,000). Built for airless places: the hot carbon plate would burn in air, and air carries heat off besides, so a plant for a world with air wants another radiator. Panel: 15.98 by 15.98 m of 3 mm carbon-carbon at 1,750 kg/m3, 1,341 kg; 255 m2 from both faces sheds the 26.0 MW the turbine cannot use (14 MW out at 35%) at 1,000 K and emissivity 0.9, standing up, on fused-silica stand-offs; it lies beside the plant bay when stowed. Frame in carbon composite (1,580 kg/m3, 55 GPa, 300 MPa allowed for bonded joints; invented knock-down), the whole plant at the mount's 3 g: two side trusses 1.75 m deep in 12 bays of 2.66 m, chords 160 by 5 mm tube, diagonals 160 by 3; floor beams 250 by 5; top ties and stiffeners 80 by 3; radiator rails 250 by 8; chords 316 kN against 375 kN; diagonals 126 kN against 163 kN; floor beams 184 MPa; rails 209 MPa; plus 10% for joints and the hinge: 3,243 kg. 69.3 kN at each plan corner. Size: the bays, an outboard hinge, chords, rails, stand-offs and plate. Over the old power mounts, which were regenerated from it. Open, as the Aurel plants: the rails' temperature under the stand-offs, and the reactor parts, still mass proxies." }
  - { of: [built_of.list], tier: derived, review: true, note: "Open (2026-10-13): the panel is taken at one temperature all over, but heat has to reach it. A 3 mm carbon-carbon fin at 1,000 K (k about 60 W/m K in the plane, invented) spreads heat only a few centimetres before radiating it, so the panel needs heat pipes or coolant channels a few centimetres apart, or a high-conductivity pitch-fibre plate. Their mass is not in the panel yet." }
  - { of: [life], rule: rule.life-ship-system }
