# yaml-language-server: $schema=../../schema/equipment.schema.yaml
# Measured from the model (assets/models/mc07.glb): assets/models/mc07.glb: LaserL_*, LaserR_*. Once an empty part of the hull (MC07-29); now the MC-07's own product,
# fitted to its hardpoint slot like any other, built of the parts measured from the model.
identity:
  key: equipment.hardpoint.mining-laser.mc07
  name: "MC-07 mining laser"
  maker: org.kestrel
  revision: draft
  slot: hardpoint
  description: "MC-07 mining laser, as the model draws it: a product the hull fits, not a part of it."
size_class: 2
fits: mount.hardpoint-s2
physical:
  mass: 1726
  volume: 140.6
  length: 6.39
  width: 4.09
  height: 5.38
built_of:
  parts: hardpoint-mining-laser-mc07
making:
  module: module.assembly-shop
function:
  kind: "laser"
  beam_power: 2000000
  focus: 2000
  range: 30000
  burn: 8
  cool: 4
  reset: 0.3
life: 473364000
basis:
  - { of: [physical.length, physical.width, physical.height, physical.volume], tier: derived, note: "Measured from the model; its volume the box round it." }
  - { of: [physical.mass, built_of], tier: derived, note: "The sum of its measured parts, each its length in the stock it is cut from (the integrator's measuring, 2026-10-05)." }
  - { of: [function, size_class], tier: invented, review: true, note: "The model's laser on its lift and gimbal under a hatch; its beam figures are the game's early pulse laser's (equipment.hardpoint.pulse-laser.s1), a stand-in until a mining laser is worked out." }
  - { of: [life], rule: rule.life-ship-system }
