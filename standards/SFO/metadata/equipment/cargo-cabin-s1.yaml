  - { of: [built_of, making], tier: invented, review: true, note: "A first design: a pressure shell of sheet with seats, its own small air plant and a cooler. An airliner's lightest seat is 10 kg; here a seat place, with its share of shell and air, is 130 to 150 kg." }
  - { of: [physical.length, physical.width, physical.height, physical.volume, identity.description], tier: derived, review: true, note: "Modeller's blockout v01 (2026-10-13): 2 rows of 2+1 at an airliner's 0.79 m pitch, 0.45 m cushions in 0.48 m armrests, 0.50 m aisle, 0.80 m front cross aisle to the door, 0.25 m rear service space; shell the full 3.16 x 2.16 x 2.18 m with the corner pads inset (100 mm frames inside a 2.10 m shell left 1.89 m, short of the 1.94 m of seats and aisle), in the mount's 3.49 x 2.2 x 2.2. The 1.58 x 1.85 first listed held the seats only. A cylinder would be the lighter vessel but cannot give the width at the floor and the height in 2.2 m, so it is a box. Clear between frames 1.95 m wide; floor 0.13 m up, ceiling 2.075 m, 1.945 m clear." }
  - { of: [built_of.list, physical.mass], tier: derived, review: true, note: "Shell at 101.3 kPa inside (as the windows), 6061 welded at 165 MPa over a safety factor 1.5 (110 MPa). Plate between frames as a long clamped strip, stress = p x b^2 / (2 t^2): 0.23 m spacing gives 4.9 mm, so 5 mm plate, 36.8 m2, 497 kg. Frames as fixed-ended beams over 2.18 m: 23.3 kN/m makes 9.2 kN m, an 84 cm3 section; 100 mm deep behind the skin in all, a 90 x 6 web with a 90 x 10 flange, the skin the other flange, gives 94 cm3 at 3.9 kg/m; 13 girth frames of 8.68 m and 9 ribs on each end wall, 152 m, 590 kg. Plus 20% for corner frames, door surround and doublers, plus 25 kg door hinges and latches: 1,330 kg. Door leaf (modeller's v02 section): 0.82 x 1.92 m, two 5 mm skins on 6 mm ribs 100 mm deep across the 0.82 m span at up to 0.23 m, closed by edge ribs; the plug seats on the frame, so the ribs are simply supported beams: 23.3 kN/m over 0.82 m makes 2.0 kN m, 16 MPa with the skins as flanges; the inner skin between ribs as a clamped strip, 107 MPa against 110. Leaf 62 kg (skins 42.5, ribs 19.5) less the 27 kg of skin and frames in the opening: +35 kg, shell 1,365 kg. Seats, linings, air plant, cooler and controls keep their first figures; power 12 kW is not worked out. 1,860 kg in all (it was 900): 310 kg a seat. Hull owns the corridor and the power, oxygen and coolant feeds; ports capped." }
