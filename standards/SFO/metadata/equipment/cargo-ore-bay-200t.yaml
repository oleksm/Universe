basis:
  - { of: [function.capacity, function.volume, function.fill_density], tier: derived, review: true, note: "Its volume is its capacity at 2,000 kg/m3, broken rock heaped (loose basalt about 1,600, iron ore 2,500: with denser ore it carries its capacity part full; with lighter it fills first and carries less)." }
  - { of: [physical.mass], tier: invented, review: true, note: "A tenth of its capacity: a haul truck's body is about 11% of its payload (a 363 t truck's 40 t body, from memory). Not sourced." }
  - { of: [size_class], tier: invented, review: true, note: "Its class by what it carries: 10 t and under class 1, 35 t class 2, 100 t class 3, above class 4." }
  - { of: [identity.description, physical.length, physical.width, physical.height, physical.volume, built_of.list], tier: derived, review: true, note: "Fitted round its 100 m3 at the modeller's request (the first box, 7.36 x 3.68 x 3.68 m, held only 99.7 m3 with no walls, frame or doors). The 100 t bay's section unchanged (outer 3.15 m square, 2.75 m clear wide, 2.7 m clear high, a 45 degree V to a 0.5 m slot: 6.16 m2); 100 m3 needs 16.24 m of trough, 16.67 m long with end walls, with supports and hinges repeated along it. Inside the class 4 mount (29.6 x 5.84 x 5.84 m). The modeller's proposal (100.04 m3 clear); review." }
  - { of: [built_of.list], tier: derived, review: true, note: "Flagged, not thinned: measured on the modeller's candidate (blender cargo-ore-bay-200t/candidate-v01: 20 mm A36 shell, 3 mm liners, the gate on ribbed beds): shell 18.19 t (against the 8 t given), liners 2.71, frame 3.26, doors 2.36, gate and beds 6.97, 33.5 t against the 20 t recorded, before the hidden drives; loaded strength and ore flow unqualified. A thinner ribbed shell would cut it (see the 10 t bay's note). Left at 20 t until reviewed. Review." }
  - { of: [life], rule: rule.life-ship-system }
