    - { code: OBS09-02, name: "Wear liners", description: "Hard plates bolted inside where the rock lands and slides.", mass: 4000, length: 4.304, width: 2.152, height: 2.152, item: stock.st4340-pl-3, quantity: 4600.0, module: module.cutting-table }
