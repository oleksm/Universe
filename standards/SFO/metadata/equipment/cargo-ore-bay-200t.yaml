identity:
  key: equipment.cargo.ore-bay.200t
  name: "Ore bay 200 t"
  maker: org.hadley
  revision: draft
  slot: cargo
  description: "A long trough hopper for 200 t of loose ore, the 100 t bay's section made longer: straight sides above a V bottom sloped at 45 degrees to a slot gate the length of the floor, with a pair of top doors the length of the roof, all in a tube frame. The doors open to the excavator and shut for flight; the gate slides open at the dock to let the ore out. One of ten sizes, so a hull takes the bay that fits."
size_class: 4
fits: mount.cargo-s4
physical:
  mass: 20000
  volume: 165.4
  length: 16.67
  width: 3.15
  height: 3.15
built_of:
  parts: cargo-ore-bay-200t
  shares: rule.haul-truck-shares
  list:
    - { code: OBS09-01, name: "Shell", description: "The hopper's plates, sloped to the gate.", mass: 8000, length: 5.423, width: 2.711, height: 2.711, item: stock.sta36-pl-20, quantity: 9200.0, module: module.welding-bay }
    - { code: OBS09-02, name: "Wear liners", description: "Hard plates bolted inside where the rock lands and slides.", mass: 4000, length: 4.304, width: 2.152, height: 2.152, item: stock.st4340-pl-3, quantity: 4600.0, module: module.cutting-table }
    - { code: OBS09-03, name: "Top doors", description: "The pair, hinged at the sides, the length of the roof, that opens to the excavator and shuts for flight.", mass: 3000, length: 3.911, width: 1.955, height: 1.955, item: stock.al6061-pl-5, quantity: 3450.0, module: module.welding-bay }
    - { code: OBS09-04, name: "Discharge gate", description: "A slot gate the length of the floor, about 0.5 m wide, sliding on bearing beds ribbed to the shell along both edges of the slot (end guides alone cannot carry the loaded plate), and its drive, that lets the ore out at the dock.", mass: 2000, length: 3.416, width: 1.708, height: 1.708, item: stock.st4340-bar-120, quantity: 2300.0, module: module.machining-centre }
    - { code: OBS09-05, name: "Frame", description: "Tube chords and uprights that carry the hopper to its mount.", mass: 3000, length: 3.911, width: 1.955, height: 1.955, item: stock.st4340-tb-160x5, quantity: 3450.0, module: module.welding-bay }
