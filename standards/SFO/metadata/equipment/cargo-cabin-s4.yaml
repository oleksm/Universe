  - { of: [built_of, making], tier: invented, review: true, note: "A first design: a pressure shell of sheet with seats, its own small air plant and a cooler. An airliner's lightest seat is 10 kg; here a seat place, with its share of shell and air, is 130 to 150 kg." }
  - { of: [physical.length, physical.width, physical.height, physical.volume, identity.description], tier: derived, review: true, note: "Modeller's blockout v01 (2026-10-13): 34 rows of 2+2+2 at 0.79 m, 0.48 m seat places, two 0.50 m aisles, 3.89 m clear between frames; cabin 6's front aisle and rear space: 3.16 + 32 x 0.79 = 28.44 m long, 3.89 + 2 x 0.23 frames = 4.36 m wide, floor 0.26 m, ceiling 2.205 m (1.945 m clear), 2.44 m high; inside the class 4 mount's 29.6 x 5.84 x 5.84. It was a 3.7 x 2.0 m section that could not hold six abreast, two aisles, frames and headroom. One 0.8 m door is the family's look; egress for 200 is not worked out." }
  - { of: [built_of.list, physical.mass], tier: derived, review: true, note: "Shell as cabin 6's (101.3 kPa, 6061 at 110 MPa, 5 mm plate between frames at 0.23 m). Frames as fixed-ended beams over the 4.36 m floor and roof: 23.3 kN/m makes 36.9 kN m, a 335 cm3 section; the modeller's 230 mm T (218 x 8 web, 180 x 12 flange, skin 0.23 m wide) gives 341 cm3 (108 MPa), 10.5 kg/m. Skin 408 m2, 5,509 kg; 123 girth frames of 13.6 m and 18 ribs on each end wall, 1,761 m, 18,557 kg; plus 20% for corner frames, door surround and doublers, the door's net 35 kg and a 25 kg reserve: 28,939 kg. A tie line down the middle would quarter the frame moment; not chosen. Seats 18 kg each and linings 2.48 kg/m2 from cabin 30's model; air plant, cooler, lights and controls at cabin 6's per-seat figures (allowances); power 400 kW as listed. 44,053 kg in all (it was 26,000): 220 kg a seat." }
