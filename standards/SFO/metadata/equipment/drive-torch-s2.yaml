identity:
  key: equipment.drive.torch.s2
  name: "Torch Drive S2"
  maker: org.kestrel
  revision: outdated
  slot: drive
  description: "A main drive: a fusion torch. Drawn, for now, as the broad shallow engine block its box describes (22.1 m across, 9.86 m fore and aft, 3.26 m deep): the burning plasma lies across it in its coils and shield, and one magnetic nozzle opens on its aft face; an 8-point mount ring on its forward face takes the thrust; only the aft face and nozzle are exposed, the rest sits inside the hull or a fairing."
size_class: 2
fits: mount.drive-s2
physical:
  mass: 6000
  volume: 710.0
  length: 22.1
  width: 9.86
  height: 3.26
needs:
  power: 1000000
built_of:
  parts: drive-torch-s2
  shares: rule.discovery-ii-engine-shares
  list:
    - { code: DTS2-01, name: "First wall", description: "The lining that faces the burning plasma.", mass: 247, length: 7.63, width: 3.4, height: 1.13, item: stock.sic-tl-10, quantity: 284.0, module: module.machining-centre }
    - { code: DTS2-02, name: "Field coil cases", description: "The beams and cases that hold the field coils against their own force: most of the engine's weight.", mass: 2246, length: 15.9, width: 7.11, height: 2.35, item: stock.ti64-pl-5, quantity: 2582.9, module: module.welding-bay }
    - { code: DTS2-03, name: "Field coil windings", description: "The superconducting windings themselves: a few kilograms of tape, nearly all of it copper and steel around a film of superconductor.", mass: 27, length: 3.65, width: 1.63, height: 0.538, item: stock.cu-wire-2, quantity: 31.0, module: module.machining-centre }
    - { code: DTS2-04, name: "Shaping coils and bracing", description: "The coils that shape and hold the plasma, and the bracing between them.", mass: 1360, length: 13.5, width: 6.01, height: 1.99, item: stock.ti64-pl-5, quantity: 1564.0, module: module.welding-bay }
    - { code: DTS2-05, name: "Shield", description: "Half a metre of carbon between the plasma and the coils, to stop what would warm and spoil them.", mass: 1591, length: 14.2, width: 6.33, height: 2.09, item: good.carbon, quantity: 1591, module: module.assembly-shop }
    - { code: DTS2-06, name: "Magnetic nozzle", description: "The coils that open the field astern and turn the plasma's heat into a jet.", mass: 106, length: 5.76, width: 2.57, height: 0.849, item: stock.ti64-pl-5, quantity: 121.9, module: module.welding-bay }
    - { code: DTS2-07, name: "Fuel feed", description: "The injector and its lines from the tank.", mass: 106, length: 5.76, width: 2.57, height: 0.849, item: stock.st304-pl-3, quantity: 121.9, module: module.machining-centre }
    - { code: DTS2-08, name: "Plasma heater", description: "The radio-frequency source that brings the plasma to burning.", mass: 88, length: 5.41, width: 2.41, height: 0.798, item: good.electronics, quantity: 88, module: module.assembly-shop }
    - { code: DTS2-09, name: "Refrigerator", description: "Keeps the windings cold.", mass: 35, length: 3.98, width: 1.77, height: 0.587, item: good.heat-pumps, quantity: 35, module: module.assembly-shop }
    - { code: DTS2-10, name: "Coolant pumps", description: "Drive the coolant through wall and shield.", mass: 68, length: 4.96, width: 2.21, height: 0.732, item: good.pumps, quantity: 68, module: module.assembly-shop }
    - { code: DTS2-11, name: "Coolant lines", description: "Pipes and manifolds.", mass: 126, length: 6.1, width: 2.72, height: 0.899, item: stock.st304-pl-3, quantity: 144.9, module: module.welding-bay }
