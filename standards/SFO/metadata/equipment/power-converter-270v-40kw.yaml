  maker: org.meridian
  revision: draft
  slot: power
  description: 'Steps the ship''s 3 kV DC bus down to its 270 V DC bus, up to 40 kW out, isolated: a sealed box on four feet, the 3 kV pair in at its -x end (two connector.hvdc-pole-150a receptacles, 14 A), the 270 V pair out (148 A:
