basis:
  - { of: [function.capacity, function.volume, function.fill_density], tier: derived, review: true, note: "Its volume is its capacity at 2,000 kg/m3, broken rock heaped (loose basalt about 1,600, iron ore 2,500: with denser ore it carries its capacity part full; with lighter it fills first and carries less)." }
  - { of: [physical.mass, built_of.list], tier: derived, review: true, note: "Worked out from its dimensions, loads and materials (tools/standards/ore_bays.py): ore at 2,000 kg/m3 at 3 g presses 115 kPa at the gate (as a liquid at the full clear depth; loose rock presses less). 8 mm A36 plate held by ribs every 0.40 m (stress p b2 / 2t2 within two thirds of yield), the ribs 8 mm webs 110 mm deep: shell 1.31 t, ribs 0.37; 3 mm 4340 liners over all it touches 0.49; 5 mm aluminium doors ribbed for a reverse 0.3 g 0.10; an 8 mm ribbed gate on two bearing strips 0.13; held at its corners, the loaded bay bends as a beam, 66 kN in each top chord: 4340 tube 60 x 2 mm with ties at every rib (buckling between ties 1.5 times the load or more), frame 0.14. Loaded by pouring through the open roof: the ties form a grate with 0.34 m gaps that screens off lumps too big for the 0.3 m gate slot (a slot passes lumps up to about a third of its width, 0.10 m), so ore is broken to that before loading; the door ribs, every 0.80 m, hang between the ties when shut. 2.54 t, 0.13 of its capacity; drives, seals and fasteners not counted; the ribs' free edges unchecked for buckling. Review." }
  - { of: [size_class], tier: invented, review: true, note: "Its class by what it carries: 10 t and under class 1, 35 t class 2, 100 t class 3, above class 4." }
  - { of: [identity.description, physical.length, physical.width, physical.height, physical.volume, built_of.list], tier: derived, review: true, note: "Fitted round its 10 m3 at the modeller's request (the first box, 3.42 x 1.71 x 1.71 m, held exactly 10 m3 with no walls, frame or doors). Outer 2.25 m square, inside the class 2 mount's 2.37 m; 1.93 m clear wide. A V bottom at 45 degrees from 1.93 m down to a 0.3 m slot is 0.815 m deep, under 1.135 m of straight side (1.95 m clear high): 3.10 m2 of section. 10 m3 needs 3.23 m of trough, 3.56 m long with end walls, inside the mount's 4.74. The modeller's proposal (10.01 m3 clear); review." }
  - { of: [visual], tier: derived, review: true, note: "The installed model was built of 20 mm plate without ribs and weighs 6.03 t (measured by the modeller); it is to be rebuilt to the worked-out 8 mm plate and ribs." }
  - { of: [life], rule: rule.life-ship-system }
