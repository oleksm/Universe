identity:
  key: equipment.cargo.ore-bay.20t
  name: "Ore bay 20 t"
  maker: org.hadley
  revision: draft
  slot: cargo
  description: "A short trough hopper for 20 t of loose ore: straight sides above a V bottom sloped at 45 degrees to a slot gate the length of the floor, with a pair of top doors the length of the roof, all in a tube frame. The doors open to the excavator and shut for flight; the gate slides open at the dock to let the ore out. One of ten sizes, so a hull takes the bay that fits."
size_class: 2
fits: mount.cargo-s2
physical:
  mass: 2540
  volume: 18.02
  length: 3.56
  width: 2.25
  height: 2.25
built_of:
  parts: cargo-ore-bay-20t
  list:
    - { code: OBS03-01, name: "Shell", description: "The hopper's 8 mm plates, sloped to the gate.", mass: 1310, length: 2.855, width: 1.804, height: 1.804, item: stock.sta36-pl-8, quantity: 1506.5, module: module.welding-bay }
    - { code: OBS03-02, name: "Ribs", description: "8 mm webs welded round the shell every 0.40 m and up the end walls.", mass: 370, length: 1.873, width: 1.184, height: 1.184, item: stock.sta36-pl-8, quantity: 425.5, module: module.welding-bay }
    - { code: OBS03-03, name: "Wear liners", description: "Hard plates bolted inside where the rock lands and slides.", mass: 490, length: 2.057, width: 1.300, height: 1.300, item: stock.st4340-pl-3, quantity: 563.5, module: module.cutting-table }
    - { code: OBS03-04, name: "Top doors", description: "The pair, hinged at the sides, the length of the roof, that opens to the excavator and shuts for flight; ribbed beneath, the ribs falling between the roof ties.", mass: 100, length: 1.211, width: 0.765, height: 0.765, item: stock.al6061-pl-5, quantity: 115.0, module: module.welding-bay }
    - { code: OBS03-05, name: "Discharge gate", description: "A slot gate the length of the floor, ribbed beneath, sliding on bearing strips along both edges of the slot, that lets the ore out at the dock (its drive not counted).", mass: 130, length: 1.322, width: 0.835, height: 0.835, item: stock.sta36-pl-8, quantity: 149.5, module: module.welding-bay }
    - { code: OBS03-06, name: "Frame", description: "Tube chords and end frames that carry the hopper to its mount, with a tie across the top at every rib.", mass: 140, length: 1.355, width: 0.856, height: 0.856, item: stock.st4340-tb-60x2, quantity: 161.0, module: module.welding-bay }
