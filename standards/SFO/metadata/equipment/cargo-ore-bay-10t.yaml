visual:
  format: "freefall-model/1"
  path: "models/cargo-ore-bay-10t/v1"
  manifest_sha256: "1ebe013333bf9fa1f719a06d88b6b7d89d3cfe7e15566477d68959531deee6f6"
  version: 1
  triangles: 6864
life: 473364000
basis:
  - { of: [function.capacity, function.volume, function.fill_density], tier: derived, review: true, note: "Its volume is its capacity at 2,000 kg/m3, broken rock heaped (loose basalt about 1,600, iron ore 2,500: with denser ore it carries its capacity part full; with lighter it fills first and carries less)." }
  - { of: [physical.mass, built_of.list], tier: derived, review: true, note: "Worked out from its dimensions, loads and materials (tools/standards/ore_bays.py): ore at 2,000 kg/m3 at 3 g presses 84 kPa at the gate (as a liquid at the full clear depth; loose rock presses less). 8 mm A36 plate held by ribs every 0.50 m (stress p b2 / 2t2 within two thirds of yield), the ribs 8 mm webs 80 mm deep: shell 0.82 t, ribs 0.12; 3 mm 4340 liners over all it touches 0.31; 5 mm aluminium doors ribbed for a reverse 0.3 g 0.06; an 8 mm ribbed gate on two bearing strips 0.12; held at its corners, the loaded bay bends as a beam, 41 kN in each top chord: 4340 tube 60 x 2 mm with ties at every rib (buckling between ties 1.5 times the load or more), frame 0.10. Loaded by pouring through the open roof: the ties form a grate with 0.44 m gaps that screens off lumps too big for the 0.3 m gate slot (a slot passes lumps up to about a third of its width, 0.10 m), so ore is broken to that before loading; the door ribs, every 1.00 m, hang between the ties when shut. 1.53 t, 0.15 of its capacity; drives, seals and fasteners not counted; the ribs' free edges unchecked for buckling. Review." }
  - { of: [size_class], tier: invented, review: true, note: "Its class by what it carries: 10 t and under class 1, 35 t class 2, 100 t class 3, above class 4." }
  - { of: [identity.description, physical.length, physical.width, physical.height, physical.volume, built_of.list], tier: derived, review: true, note: "Fitted round its 5 m3 at the modeller's request, as the 100 t bay was (the first box, 2.72 x 1.36 x 1.36 m, held only 5.03 m3 with no walls, frame or doors). Outer 1.72 m square, inside the class 1 mount's 2.2 m; 1.4 m clear wide and 1.42 m clear high. A V bottom at 45 degrees (steeper than broken rock's 35 to 40 degree repose) from 1.4 m down to a 0.3 m slot is 0.55 m deep, under 0.87 m of straight side: 1.69 m2 of section. 5 m3 needs 2.97 m of trough; with end walls, 3.3 m long, inside the mount's 3.49. The modeller's proposal (5.006 m3 clear); review." }
  - { of: [visual], tier: derived, review: true, note: "The installed model was built of 20 mm plate without ribs and weighs 4.22 t (measured by the modeller); it is to be rebuilt to the worked-out 8 mm plate and ribs." }
  - { of: [life], rule: rule.life-ship-system }
