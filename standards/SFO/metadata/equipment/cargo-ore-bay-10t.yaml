identity:
  key: equipment.cargo.ore-bay.10t
  name: "Ore bay 10 t"
  maker: org.hadley
  revision: draft
  slot: cargo
  description: "A short trough hopper for 10 t of loose ore: straight sides above a V bottom sloped at 45 degrees to a slot gate the length of the floor, with a pair of top doors the length of the roof, all in a tube frame. The doors open to the excavator and shut for flight; the gate slides open at the dock to let the ore out. One of ten sizes, so a hull takes the bay that fits."
size_class: 1
fits: mount.cargo-s1
physical:
  mass: 1530
  volume: 9.76
  length: 3.3
  width: 1.72
  height: 1.72
built_of:
  parts: cargo-ore-bay-10t
  list:
    - { code: OBS02-01, name: "Shell", description: "The hopper's 8 mm plates, sloped to the gate.", mass: 820, length: 2.681, width: 1.397, height: 1.397, item: stock.sta36-pl-8, quantity: 943.0, module: module.welding-bay }
    - { code: OBS02-02, name: "Ribs", description: "8 mm webs welded round the shell every 0.50 m and up the end walls.", mass: 120, length: 1.413, width: 0.736, height: 0.736, item: stock.sta36-pl-8, quantity: 138.0, module: module.welding-bay }
    - { code: OBS02-03, name: "Wear liners", description: "Hard plates bolted inside where the rock lands and slides.", mass: 310, length: 1.938, width: 1.010, height: 1.010, item: stock.st4340-pl-3, quantity: 356.5, module: module.cutting-table }
    - { code: OBS02-04, name: "Top doors", description: "The pair, hinged at the sides, the length of the roof, that opens to the excavator and shuts for flight; ribbed beneath, the ribs falling between the roof ties.", mass: 60, length: 1.121, width: 0.584, height: 0.584, item: stock.al6061-pl-5, quantity: 69.0, module: module.welding-bay }
    - { code: OBS02-05, name: "Discharge gate", description: "A slot gate the length of the floor, ribbed beneath, sliding on bearing strips along both edges of the slot, that lets the ore out at the dock (its drive not counted).", mass: 120, length: 1.413, width: 0.736, height: 0.736, item: stock.sta36-pl-8, quantity: 138.0, module: module.welding-bay }
    - { code: OBS02-06, name: "Frame", description: "Tube chords and end frames that carry the hopper to its mount, with a tie across the top at every rib.", mass: 100, length: 1.329, width: 0.693, height: 0.693, item: stock.st4340-tb-60x2, quantity: 115.0, module: module.welding-bay }
making:
