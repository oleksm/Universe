identity:
  key: equipment.cargo.berths.2
  name: "Crew berths 2"
  maker: org.hadley
  revision: draft
  slot: cargo
  description: "Two sleep pods, one above the other, each a 1.94 x 0.82 m bunk with a locker over the feet, a reading light and a fan. They open along one long face straight onto the hull's corridor: there is no aisle inside, and the corridor is the hull's. The pods are for sleeping only: you lie in a pod and stand, sit or dress in the corridor. A narrow fixed ladder at the foot end, 70 mm proud of the open face and outside the screens' sweep, reaches the upper pod. The walls and screens are for privacy, not pressure. In a cargo slot, as a cabin is."
size_class: 1
