  list:
    - { code: BRT2-01, name: "Bunks and lockers", description: "Two bunk trays, 1.94 x 0.82 m each, stacked; a mattress 0.1 m thick; above the feet of each, a locker 0.35 m long and 0.35 m high across the bunk, the feet sliding under it.", mass: 117, length: 1.53, width: 0.766, height: 1.53, item: stock.al6061-pl-5, quantity: 134.5, module: module.machining-centre }
    - { code: BRT2-02, name: "Partition and door", description: "The back, the ends, the shelf between the pods and the top; on the open face, a sliding screen a pod. No pressure door: the module's open face is the hull's corridor wall.", mass: 104, length: 1.47, width: 0.737, height: 1.47, item: stock.al6061-sh-2-panel, quantity: 119.6, module: module.welding-bay }
    - { code: BRT2-03, name: "Linings, bedding, lights", mass: 39, length: 1.06, width: 0.531, height: 1.06, item: stock.mli-fl, quantity: 39, module: module.assembly-shop }
