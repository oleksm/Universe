basis:
  - { of: [physical, needs, function, size_class], tier: invented, review: true, note: "130 kg a berth: a bunk and locker (40 kg, a ship's), its share of partition (60 kg) and fittings (30 kg); 1 m2 of deck a bunk at two high, 50 W a head of light. From memory of a ship's crew cabin; chosen." }
  - { of: [identity.description, built_of.list], tier: invented, review: true, note: "Fitting two people in 2 x 1 x 2 m (the modeller's layout, candidate v01): bunks 1.94 m long sleep a person up to about 1.85 m tall (most). Measured in the modeller's blockout: 0.85 m clear over the lower bed and 0.78 m over the upper, below seated height (about 0.9 m), so neither pod is a seat. End walls 30 mm thick give 1.94 m of bed. So the module is two sleep pods, not a cabin: no aisle, no room to stand or dress inside. The hull must give a corridor at least 0.8 m wide, measured from the ladder's face, and 2 m high along the open face. The fitted box is 2 x 1.07 x 2 m with the ladder (1 m without), inside the mount's 2.2 m. The opening is 1.9 x 0.75 m a pod, closed by a sliding privacy screen; no display, a reading light only. A fan a pod, from the hull's air, so breath does not pool round a face in free fall. Chosen; review." }
  - { of: [built_of, making], rule: rule.first-design-parts }
  - { of: [life], rule: rule.life-ship-system }
