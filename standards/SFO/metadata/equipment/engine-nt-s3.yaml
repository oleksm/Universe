  exhaust: 9000
  efficiency: 0.95
  burns: material.hydrogen
  propellant: material.hydrogen
  throttle: 0.3
  gimbal: 0.1
  isotropic_loss: 0.05
  shield_pass: 0.01
  reaction_offset: 2.8
  heat_to_hull: 0.000126
  chamber:
