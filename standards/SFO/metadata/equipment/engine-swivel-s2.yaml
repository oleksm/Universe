basis:
  - { of: [function], tier: invented, review: true, note: "A quarter turn in about seventeen seconds (0.1 rad/s, 1 s to speed up and to stop) under up to 120 kN. Chosen; no flown example at this scale. The engine it carries: up to 350 kg (CH-S2 is 300), centre of mass within 1.0 m of the pivot, no wider than 0.72 m for the first 90 mm behind the ring and 0.78 m on to 0.675 m from the pivot; confirmed clear by the modeller's 65-pose sweep (candidate-v01). Feed lines and wiring cross the turn as the engine's and hull's services, not the swivel's." }
  - { of: [built_of.list, physical, needs], tier: derived, review: true, note: "S1's layout at 1.5 times (frame 1.2 x 1.2 x 0.6, pivot Y -0.4125: at 0.5 m deep the modeller's sweep fouled the front flange), parts sized from four times the load. Pins: 60 kN each, 2,700 N m bending at 45 mm needs 40 mm of Ti-6Al-4V at half yield; 60 mm taken for 14 MPa on the bronze. Ring: 0.137 F R = 5.1 kN m out of plane; the 90 x 60 x 5 box holds 11.5 kN m. Cheeks: 30 MPa bearing needs 28 mm round a 72 mm bushing. Plates: same deflection per span as S1 needs 1.8 times the thickness, so the frame is S1's measured 18.8 kg times 2.25 for area and 1.8 for gauge. Drive torque: 350 kg at 1.0 m passing horizontal at 1.5 g is 5,150 N m, 2,575 a drive, 3,200 peak; at S1's invented 60 N m a kilogram, 53.3 kg each. Power: 515 W at the pivot, 0.6 efficient, plus brakes: 1,000 W. Frame, ring, pin and bushing masses are the modeller's measured volumes (candidate-v01: 78.7, 13.5, 4.0, 1.5 kg, bosses included); drives stay at the 106.6 kg allowance." }
  - { of: [built_of, making], rule: rule.first-design-parts }
  - { of: [life], rule: rule.life-ship-system }
