built_of:
  parts: engine-swivel-s2
  list:
    - { code: SWV2-01, name: "Fixed frame", description: "Bolts to the mount face at Y 0: S1's frame at 1.5 times the size in 9 mm plate (the stock gauge stands for it): a square flange of 120 mm angle with a centre relief in its lower return, two cheeks (YZ) at X +-0.40 built up to 28 mm round the bushings, and a tie plate on +Z. Open aft (-Y) and below (-Z) for the engine.", mass: 78.7, length: 1.2, width: 1.2, height: 0.6, item: stock.al6061-pl-5, quantity: 90.5, module: module.welding-bay }
    - { code: SWV2-02, name: "Adapter ring", description: "The moving part the engine bolts to: a welded 90 x 60 mm box ring of 5 mm plate, 0.72 m across, 0.54 m bore, with sleeves for the pins at +-X.", mass: 13.5, length: 0.72, width: 0.72, height: 0.06, item: stock.ti64-pl-5, quantity: 15.5, module: module.welding-bay }
    - { code: SWV2-03, name: "Trunnion pins", description: "Two solid 60 mm pins, 0.16 m long, on the X axis at Y -0.4125; keyed to the ring, driven at their outer ends.", mass: 4, length: 0.16, width: 0.06, height: 0.06, item: stock.ti64-ingot, quantity: 6, module: module.machining-centre }
    - { code: SWV2-04, name: "Bushings", description: "Two bronze bushings, 72 mm outside, 60 mm bore, 70 mm long, in the cheeks.", mass: 1.5, length: 0.072, width: 0.072, height: 0.07, item: stock.brz932-bar-50, quantity: 2.9, module: module.machining-centre }
    - { code: SWV2-05, name: "Drive, +X", description: "Enclosed harmonic-geared actuator with brake, outboard of the +X cheek, coaxial with the pin.", mass: 53.3, length: 0.19, width: 0.34, height: 0.34, item: good.electric-motors, quantity: 53.3, module: module.assembly-shop }
    - { code: SWV2-06, name: "Drive, -X", description: "The same, outboard of the -X cheek.", mass: 53.3, length: 0.19, width: 0.34, height: 0.34, item: good.electric-motors, quantity: 53.3, module: module.assembly-shop }
