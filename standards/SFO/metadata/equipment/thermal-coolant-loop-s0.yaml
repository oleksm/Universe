  description: "A pumped water-glycol loop carrying 20 kW from cold plates to a radiator or an air cooler: 0.53 kg/s at a 10 K rise. The box is the skid: an enclosed pump and reservoir, controls and short 20 mm lines on four bolted feet, with capped inlet and outlet ports and a power port. The lines and cold plates (12 kg) come as a loose kit, run through the ship where its fit puts them; the 30 kg is the whole loop, about 18 kg of it the skid."
