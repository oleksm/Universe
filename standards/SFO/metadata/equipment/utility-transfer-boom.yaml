identity:
  key: equipment.utility.transfer.boom
  name: "Fuel transfer boom"
  maker: org.hadley
  revision: draft
  slot: utility
  description: "Gives one liquid to another ship or takes it: a rigid 8 m boom on a slewing, luffing root, the liquid in a 125 mm pipe inside it, a 1 m telescoping tip with the same dry-break coupling as the refuelling port. No hose."
size_class: 2
fits: mount.utility-s2
physical:
  mass: 515
  volume: 2.99
  length: 8.3
  width: 0.6
  height: 0.6
built_of:
  parts: utility-transfer-boom
  list:
    - { code: TBM0-01, name: "Boom", description: "A 200 x 5 mm aluminium tube, 7 m, the vacuum jacket and the structure in one, with its bored tail casting at the root.", mass: 72.8, length: 7.0, width: 0.2, height: 0.2, item: stock.al6061-tb-200x5, quantity: 83.7, module: module.welding-bay }
    - { code: TBM0-02, name: "Product pipe", description: "125 mm stainless pipe, 3 mm wall (131 mm outside), inside the boom on spacers.", mass: 66.85, length: 7.0, width: 0.131, height: 0.131, item: stock.st304-pl-3, quantity: 76.9, module: module.welding-bay }
    - { code: TBM0-03, name: "Tip product sleeve", description: "The telescoping tip's inner wall: a ground stainless sleeve 138.4 mm outside, 132.4 inside, 1.5 m, sliding over the product pipe 1 m with at least 150 mm overlap, and its seal glands (product and jacket).", mass: 18.9, length: 1.5, width: 0.138, height: 0.138, item: stock.st304-pl-3, quantity: 28.4, module: module.machining-centre }
    - { code: TBM0-04, name: "Coupling and valve", description: "The refuelling port's 125 mm dry-break coupling half and isolation valve.", mass: 58, length: 0.45, width: 0.25, height: 0.25, item: stock.st304-pl-3, quantity: 87.0, module: module.machining-centre }
    - { code: TBM0-05, name: "Fluid swivels", description: "Two 125 mm rotary joints at the root, one on each axis, so the liquid passes the joints without a hose: an in-line swivel on the slew axis, a radial-entry annular union on the luff axis.", mass: 50, length: 0.4, width: 0.3, height: 0.3, item: stock.st304-pl-3, quantity: 75.0, module: module.machining-centre }
    - { code: TBM0-06, name: "Root turret", description: "Slew and luff bearings and the base frame on the four mount points at the root end; the root datum is the slew axis at the mount face, 0.3 m in from the box end.", mass: 88.9, length: 0.6, width: 0.6, height: 0.6, item: stock.st4340-bar-120, quantity: 133.4, module: module.machining-centre }
    - { code: TBM0-07, name: "Drives", description: "Slew and luff, 4 kN m each.", mass: 134, length: 0.4, width: 0.3, height: 0.3, item: good.electric-motors, quantity: 134.0, module: module.assembly-shop }
    - { code: TBM0-08, name: "Latches and controls", description: "A stow cradle and latch for the tip on the four mount points at the far end; the drives' controls, the tip camera and range sensors.", mass: 19, length: 0.3, width: 0.2, height: 0.1, item: good.electronics, quantity: 19.0, module: module.electronics-works }
    - { code: TBM0-09, name: "Tip jacket sleeve", description: "The telescoping tip's outer wall: a 180 x 3 mm aluminium sleeve, 1.5 m, sliding in the boom tube; keeps the vacuum jacket round the product sleeve.", mass: 6.7, length: 1.5, width: 0.18, height: 0.18, item: stock.al6061-sh-3, quantity: 7.7, module: module.welding-bay }
