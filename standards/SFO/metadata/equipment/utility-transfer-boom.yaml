  format: "freefall-model/1"
  path: "models/utility-transfer-boom/v1"
  manifest_sha256: "ca16cfd33caa151aafa156f280ce5945e387fbd2746067072423c8aeb748b21f"
  version: 1
  triangles: 8876
life: 473364000
basis:
  - { of: [function, size_class], tier: invented, review: true, note: "An 8 m boom giving 20 kg/s to another ship. Chosen." }
  - { of: [built_of.list, physical, identity.description], tier: derived, review: true, note: "Worked out 2026-10-13 for the modeller's blockout v01. Stowed it lies along the hull, 8 m from root to tip; deployed it swings out (slew 180 degrees, luff 0 to 90, chosen) and the coupling sits 8 m from the slew axis, 9 m with the tip run out. A hose would want a reel and a bend radius the box cannot hold, so the liquid runs in a rigid pipe and passes the root through two fluid swivels, as a dockside loading arm does. Same scope as the refuelling port S1: one liquid (water, liquid oxygen or liquid methane), 125 mm, 1 MPa, 90 to 370 K; the boom's annulus is the vacuum jacket. Design tip load 500 N (chosen, the two ships' drift caught by the tip): 4 kN m at the root, 25 MPa in the 200 x 5 tube, 80 mm tip deflection. Drives at 60 N m/kg (the swivels' invented density): 67 kg each. Total 480 kg (it was 900); 492 kg after blockout v03 split the tip into two coaxial sleeves, product 138.4/132.4 mm stainless 15.2 kg (1 MPa hoop 22 MPa) plus 5 kg glands, jacket 180 x 3 aluminium 6.8 kg (buckles at 0.7 MPa outside, vacuum is 0.1). Swivel seals at 90 K: LNG loading-arm swivels are rated to about 110 K, so liquid oxygen at 90 K is a stretch, invented, review. Candidate v01 (2026-10-13): boom 72.8 (tail casting), turret 88.9, tip sleeves 18.9 and 6.7 bound from the model, product pipe 66.85 analytic; coupling 58, swivels 50, drives 134 and controls 19 keep their allowances because the model draws only their outsides (50.5, 36.8, 4.6, 15.6 kg). Total 515 kg. Box 8.3 m: the root half of the 0.6 m base behind the slew axis, then 8 m to the coupling. Stowed, held at root and tip only: 25 kg a metre over 8 m at 30 m/s2 is 6 kN m, 38 MPa in the tube, so no latches between and no hull seats beyond the mount's eight." }
  - { of: [built_of, making], rule: rule.first-design-parts }
  - { of: [life], rule: rule.life-ship-system }
