basis:
  - { of: [physical, needs, function, size_class], tier: invented, review: true, note: "A 10 kg bottle of clean agent (as the station's portable extinguishers, from memory), detectors and the bottle's valve: 25 kg in all, covering 50 m3. Chosen." }
  - { of: [function.protects], tier: derived, review: true, note: "The agent is taken as a fluoroketone clean agent (FK-5-1-12 class), kept under nitrogen at 25 bar (invented). It floods a room at about 4.5% by volume, which takes roughly 0.6 kg per m3. So 10 kg covers only about 17 m3; 50 m3 would need about 30 kg. Left for review." }
