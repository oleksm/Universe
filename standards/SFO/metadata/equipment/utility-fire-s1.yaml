    - { code: FIR1-02, name: "Detectors and controller", description: "Smoke and heat detectors, the valve's electronics.", mass: 10, length: 0.368, width: 0.221, height: 0.221, item: good.electronics, quantity: 10, module: module.assembly-shop }
