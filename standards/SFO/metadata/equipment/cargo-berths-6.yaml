# yaml-language-server: $schema=../../schema/equipment.schema.yaml
identity:
  key: equipment.cargo.berths.6
  name: "Crew berths 6"
  maker: org.hadley
  revision: draft
  slot: cargo
  description: "Six sleep pods: three stacks of two, side by side, each stack 1 m wide and 2 m deep. Each pod is a 1.94 x 0.82 m bunk entered from its end: you slide in head first from the hull's corridor, along the bed. All six open on the one 3 m face, each with a sliding privacy screen, and a narrow fixed ladder by each stack, 70 mm proud, reaches its upper pod. The locker is at the far end of each pod, over the feet, clear of the entry. A reading light and a fan a pod. There is no aisle inside; you stand, sit or dress in the corridor. The walls and screens are for privacy, not pressure. In a cargo slot, as a cabin is."
size_class: 2
fits: mount.cargo-s2
physical:
  mass: 780
  volume: 12.42
  length: 3
  width: 2.07
  height: 2
needs:
  power: 300
built_of:
  parts: cargo-berths-6
  list:
    - { code: BRT6-01, name: "Bunks and lockers", description: "Six bunk trays, 1.94 x 0.82 m each, three stacks of two, end on to the open face; a mattress 0.1 m thick; a locker at the far (foot) end of each; three ladders.", mass: 351, length: 2.3, width: 1.53, height: 1.53, item: stock.al6061-pl-5, quantity: 403.6, module: module.machining-centre }
    - { code: BRT6-02, name: "Partition and screens", description: "The back, the two ends, the walls between the stacks, the shelves between the pods and the tops; on the open face, a sliding privacy screen a pod. No pressure door: the open face is the hull's corridor wall.", mass: 312, length: 2.21, width: 1.47, height: 1.47, item: stock.al6061-sh-2-panel, quantity: 358.8, module: module.welding-bay }
    - { code: BRT6-03, name: "Linings, bedding, lights", mass: 117, length: 1.59, width: 1.06, height: 1.06, item: stock.mli-fl, quantity: 117, module: module.assembly-shop }
making:
