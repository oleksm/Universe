basis:
  - { of: [physical, needs, function, size_class], tier: invented, review: true, note: "130 kg a berth: a bunk and locker (40 kg, a ship's), its share of partition (60 kg) and fittings (30 kg); 1 m2 of deck a bunk at two high, 50 W a head of light. From memory of a ship's crew cabin; chosen." }
  - { of: [identity.description, physical.width, physical.volume, built_of.list], tier: derived, review: true, note: "From the modeller's proposal: a 3 x 2 x 2 m body cannot open three side-entry stacks (each 2 x 1 m) onto one corridor, so the pods turn end on. Three stacks 1 m wide (about 0.94 m clear inside, over the 0.82 m bed) and 2 m deep give 1.94 m beds; 0.85 m clear over the lower bed and 0.78 m over the upper, as in Crew berths 2. Each end opening is about 0.94 x 0.8 m, but the pillow and the ladder's rungs take part of it: the modeller measured a clear lie-in path of only 0.54 x 0.60 m above the pillow, beside the ladder (candidate v01). You enter lying down: workable in free fall, cramped under gravity and too tight for a suited or bulky person. Fitted 3 x 2.07 x 2 m with the 70 mm ladders, inside the class 2 mount (4.74 x 2.37 x 2.37). The hull gives one corridor at least 0.8 m wide from the ladder face and 2 m high along the 3 m face. Mass 780 kg and 300 W unchanged (three of Crew berths 2). Chosen; review." }
  - { of: [built_of, making], rule: rule.first-design-parts }
  - { of: [life], rule: rule.life-ship-system }
