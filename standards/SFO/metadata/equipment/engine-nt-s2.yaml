identity:
  key: equipment.engine.nt.s2
  name: "Nuclear thermal engine S2"
  maker: org.kestrel
  revision: draft
  slot: engine
  description: "A fission reactor heating hydrogen: 110 kN at 9 km/s, 0.49 GW of jet, 12.2 kg/s of hydrogen. Hovering a 156 t ship at 1 g takes 13.9 of these. The fuel is the reactor's; the game draws the hydrogen."
size_class: 2
fits: mount.engine-s2
physical:
  mass: 9000
  volume: 16.2
  length: 5
  width: 1.8
  height: 1.8
built_of:
  parts: engine-nt-s2
  list:
    - { code: NTE2-01, name: "Reactor core and vessel", description: "Fuel elements in their pressure vessel.", mass: 3600, length: 3.68, width: 1.33, height: 1.33, item: stock.ti64-pl-5, quantity: 4140, module: module.welding-bay }
    - { code: NTE2-02, name: "Shadow shield", mass: 2250, length: 3.15, width: 1.13, height: 1.13, item: good.carbon, quantity: 2250, module: module.assembly-shop }
    - { code: NTE2-03, name: "Nozzle", description: "Regeneratively cooled.", mass: 1350, length: 2.66, width: 0.956, height: 0.956, item: stock.st304-pl-3, quantity: 1552, module: module.welding-bay }
    - { code: NTE2-04, name: "Turbopump and feed", mass: 1080, length: 2.47, width: 0.888, height: 0.888, item: good.pumps, quantity: 1080, module: module.assembly-shop }
    - { code: NTE2-05, name: "Controls", mass: 720, length: 2.15, width: 0.776, height: 0.776, item: good.electronics, quantity: 720, module: module.assembly-shop }
making:
  module: module.assembly-shop
function:
  kind: engine
  cycle: nuclear_thermal
  thrust: 110000
  exhaust: 9000
  efficiency: 0.95
  burns: material.hydrogen
  propellant: material.hydrogen
  throttle: 0.3
  gimbal: 0.1
  isotropic_loss: 0.05
  shield_pass: 0.01
  reaction_offset: 2
  heat_to_hull: 0.000126
life: 473364000
basis:
  - { of: [function.exhaust, function.thrust, physical.mass], tier: invented, review: true, note: "NERVA-class, from memory: the NERVA XE gave about 250 kN at 7 km/s from about 18 t with its shield; 9 km/s is the advanced solid-core figure (Isp about 900 s). The classes scale by thrust. No source looked up. Review." }
  - { of: [function.isotropic_loss, function.shield_pass, function.heat_to_hull], tier: invented, review: true, note: "About a twentieth of the reactor's power leaks as neutrons and gamma in every direction; a shadow shield passes a hundredth toward the ship: 0.000126 of the jet aboard at a twentieth of the sphere. From memory; review." }
  - { of: [function.throttle, function.gimbal], tier: invented, review: true, note: "A solid core throttles to about a third; a gimballed nozzle gives about six degrees. Chosen." }
  - { of: [built_of, making], rule: rule.first-design-parts }
  - { of: [life], rule: rule.life-ship-system }
