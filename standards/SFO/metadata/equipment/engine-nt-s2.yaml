identity:
  key: equipment.engine.nt.s2
  name: "Nuclear thermal engine S2"
  maker: org.kestrel
  revision: draft
  slot: engine
  description: "A fission reactor heating hydrogen: 110 kN at 9 km/s, 0.49 GW of jet, 12.2 kg/s of hydrogen. Hovering a 156 t ship at 1 g takes 13.9 of these. The fuel is the reactor's; the game draws the hydrogen."
size_class: 2
fits: mount.engine-s2
physical:
  mass: 9000
  volume: 16.2
  length: 5
  width: 1.8
  height: 1.8
built_of:
  parts: engine-nt-s2
  list:
    - { code: NTE2-01, name: "Reactor core and vessel", description: "Fuel elements in their pressure vessel.", mass: 3600, length: 3.68, width: 1.33, height: 1.33, item: stock.ti64-pl-5, quantity: 4140, module: module.welding-bay }
    - { code: NTE2-02, name: "Shadow shield", description: "A nuclear-graphite disc at the mount face, 1.65 m across and 0.55 m thick; it does not swing with the engine.", mass: 2250, length: 1.65, width: 1.65, height: 0.55, item: good.carbon, quantity: 2250, module: module.assembly-shop }
    - { code: NTE2-03, name: "Nozzle", description: "Regeneratively cooled.", mass: 1350, length: 2.66, width: 0.956, height: 0.956, item: stock.st304-pl-3, quantity: 1552, module: module.welding-bay }
    - { code: NTE2-04, name: "Turbopump and feed", mass: 1080, length: 2.47, width: 0.888, height: 0.888, item: good.pumps, quantity: 1080, module: module.assembly-shop }
    - { code: NTE2-05, name: "Controls", mass: 720, length: 2.15, width: 0.776, height: 0.776, item: good.electronics, quantity: 720, module: module.assembly-shop }
making:
  module: module.assembly-shop
function:
  kind: engine
  cycle: nuclear_thermal
  thrust: 110000
  exhaust: 9000
  efficiency: 0.95
  burns: material.hydrogen
  propellant: material.hydrogen
  throttle: 0.3
  gimbal: 0.1
  isotropic_loss: 0.05
  shield_pass: 0.01
  reaction_offset: 2
  heat_to_hull: 0.000126
  chamber:
    feed: expander
    pressure: 4000000.0
    thrust_coefficient: 1.73
    throat_diameter: 0.142
    exit_diameter: 1.0
    expansion_ratio: 50
    chamber_diameter: 1.33
    nozzle_length: 1.65
    cooling: regenerative
    wall: material.stainless-steel-304
visual:
  format: "freefall-model/1"
  path: "models/engine-nt-s2/v1"
  manifest_sha256: "dec4aa5bfe21b3718b585cbdd523bf38a822ff985017524f5899e19dfde4c0e4"
  version: 1
  triangles: 16244
life: 473364000
basis:
  - { of: [function.exhaust, function.thrust, physical.mass], tier: invented, review: true, note: "NERVA-class, from memory: the NERVA XE gave about 250 kN at 7 km/s from about 18 t with its shield; 9 km/s is the advanced solid-core figure (Isp about 900 s). The classes scale by thrust. No source looked up. Review." }
  - { of: [function.isotropic_loss, function.shield_pass, function.heat_to_hull], tier: invented, review: true, note: "About a twentieth of the reactor's power leaks as neutrons and gamma in every direction; a shadow shield passes a hundredth toward the ship: 0.000126 of the jet aboard at a twentieth of the sphere. From memory; review." }
  - { of: [function.throttle, function.gimbal], tier: invented, review: true, note: "A solid core throttles to about a third; a gimballed nozzle gives about six degrees. Chosen." }
  - { of: [built_of, making], rule: rule.first-design-parts }
  - { of: [built_of.list, function.gimbal], tier: derived, review: true, note: "Gimbal and feed, as the S1, from the modeller's S2 blockout (v01). Two powered trunnions at right angles, 1.25 m aft of the face on two side brackets, swing the reactor, nozzle and pump together; hydrogen comes in through coaxial rotary unions on the trunnion axes, before the pump, so they see tank pressure only. Checked: 12.2 kg/s of liquid hydrogen (70 kg/m3) in a 190 mm bore runs at 6.2 m/s. The hollow pins, 260 mm outside and 190 mm bore, have 0.0247 m2 of section: 110 kN of thrust shears one at 4.5 MPa, and 6 t swung at 5 g sideways at 12 MPa. Slewing about 12,000 kg m2 through 0.1 rad in 1 s takes about 5 kN m, taken to fit in the controls' 720 kg. Bearing, bending and the cryogenic seals are not checked. Review." }
  - { of: [function.chamber], tier: derived, review: true, note: "Same 4 MPa chamber as the S1. The 1.0 m exit is the most the 1.8 m width allows with the swing, so the expansion is 50, not the S1's 108, and the ideal vacuum thrust coefficient (gamma 1.4) is 1.73, not 1.75. The throat is 110 kN / (1.73 x 4 MPa) = 0.0159 m2, 142 mm across (the modeller's 141 mm used 1.75). Holding 9 km/s then needs c* of 5,200 m/s, about 3,070 K at the core exit, 70 K hotter than the S1. The bell is 1.65 m. chamber_diameter is the vessel's 1.33 m. Review." }
  - { of: [built_of.list, function.gimbal], tier: derived, review: true, note: "Layout, with the modeller's S2 blockout (v01). The shield is fixed at the face, Y -0.45 to -1.0: graphite at 1,800 kg/m3, 1.65 m across and 0.55 m thick, 2,117 kg, 2,250 kg cased. From the core centre 1 m behind it, it shades a cone of about 40 degrees half-angle. The core is centred 2 m aft (reaction_offset), the throat at about 3.35 m and the exit at 5 m. At 0.1 rad the exit edge reaches 0.886 m from the axis, inside the 0.9 m half-width with 14 mm to spare. The other part boxes are cube-root placeholders. Review." }
  - { of: [life], rule: rule.life-ship-system }
nozzles:
- {node: nozzle, share: 1.0}
