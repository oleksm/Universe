# yaml-language-server: $schema=../../schema/process.schema.yaml
identity:
  key: process.tube-making-4340
  name: Tube making 4340 steel
  kind: mechanical
  method: piercing
  description: "A hot round driven over a point to open it into a tube."
inputs:
  materials:
  - item: material.high-strength-steel-4340
    amount: 1.0
  form: ingot
outputs:
  products:
  - item: material.high-strength-steel-4340
    form: tube
rate:
  mode: continuous
equipment:
  facility: mill
  steps:
  - { module: module.reheat-furnace, does: "The ingot is heated through to the temperature it is worked at." }
  - { module: module.piercing-mill, does: "It is driven over a point to open it, and its wall is rolled even." }
