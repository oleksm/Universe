# yaml-language-server: $schema=../../schema/process.schema.yaml
identity:
  name: Bar rolling 4340 steel
  kind: mechanical
  method: rolling
  description: "A hot ingot drawn out between grooved rolls into round bar."
inputs:
  materials:
  - item: high-strength-steel-4340
    amount: 1.0
  form: ingot
outputs:
  products:
  - item: high-strength-steel-4340
    form: bar
rate:
  mode: continuous
equipment:
  facility: mill
  steps:
  - { module: reheat-furnace, does: "The ingot is heated through to the temperature it is worked at." }
  - { module: bar-mill, does: "It is drawn out between grooved rolls into round bar." }
