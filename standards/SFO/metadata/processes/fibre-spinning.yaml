# yaml-language-server: $schema=../../schema/process.schema.yaml
identity:
  key: process.fibre-spinning
  name: Fibre spinning
  kind: mechanical
  method: spinning
  description: A polymer solution or melt forced through fine holes and drawn into fibre.
inputs:
  materials:
  - name: aramid polymer
    amount: 1.0
  form: fluid
outputs:
  products:
  - item: material.aramid-fibre
    form: fibre
rate:
  mode: continuous
equipment:
  facility: mill
