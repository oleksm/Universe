# yaml-language-server: $schema=../../schema/process.schema.yaml
identity:
  key: process.alloying-4340
  name: Alloying 4340 steel
  kind: chemical
  method: alloying
  description: Made on a steel line, as steel is. At the ladle, nickel, chromium and molybdenum are added to the melt to bring it to the grade.
inputs:
  materials:
  - item: Fe
    amount: 0.957
  - item: Ni
    amount: 0.018
  - item: Cr
    amount: 0.008
  - item: Mn
    amount: 0.008
  - item: C
    amount: 0.004
  - item: Si
    amount: 0.0025
  - item: Mo
    amount: 0.0025
outputs:
  products:
  - item: high-strength-steel-4340
    form: ingot
rate:
  mode: batch
equipment:
  facility: foundry
  steps:
  - { module: ore-yard, does: "Ore, lime, carbon and the alloying metals arrive and are stockpiled." }
  - { module: pellet-plant, does: "The ore is crushed, ground, cleaned of waste rock and formed into pellets." }
  - { module: hydrogen-plant, does: "Water is split to make the hydrogen for the next step." }
  - { module: shaft-furnace, does: "Hot hydrogen takes the oxygen out of the pellets, leaving sponge iron." }
  - { module: arc-furnace, does: "The sponge iron is melted. Lime forms a slag that takes up the impurities." }
  - { module: ladle-station, does: "Nickel, chromium, manganese and molybdenum are added and the carbon trimmed, to the grade; dissolved gas is removed." }
  - { module: casting-bay, does: "The steel is poured into moulds and stripped out as ingots." }
  - { module: ingot-yard, does: "The ingots cool, a sample certifies the grade, and they are stacked." }
