# yaml-language-server: $schema=../../schema/process.schema.yaml
identity:
  key: process.glass-melting
  name: Glass melting
  kind: chemical
  method: melting
  description: Silicon and oxygen (as silica) melted into fused silica glass.
inputs:
  materials:
  - item: element.si
    amount: 0.467
  - item: element.o
    amount: 0.533
outputs:
  products:
  - item: material.fused-silica
    form: ingot
rate:
  mode: batch
equipment:
  facility: foundry
