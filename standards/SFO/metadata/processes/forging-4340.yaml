# yaml-language-server: $schema=../../schema/process.schema.yaml
identity:
  key: process.forging-4340
  name: Forging 4340 steel
  kind: mechanical
  method: forging
  description: "Hot steel pressed between dies into a rough shape, lining up its grain for strength."
inputs:
  materials:
  - item: material.high-strength-steel-4340
    amount: 1.0
  form: ingot
outputs:
  products:
  - item: material.high-strength-steel-4340
    form: forging
rate:
  mode: batch
equipment:
  facility: mill
  steps:
  - { module: module.reheat-furnace, does: "The ingot is heated through to the temperature it is worked at." }
  - { module: module.forging-press, does: "It is pressed between dies into the rough shape of the part." }
