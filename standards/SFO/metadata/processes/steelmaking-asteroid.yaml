# yaml-language-server: $schema=../../schema/process.schema.yaml
identity:
  key: process.steelmaking-asteroid
  name: Steelmaking from asteroid metal
  kind: chemical
  method: melting
  description: "Nickel-iron from asteroids is already metal: it is melted in an electric furnace, refined and cast as ingots. Nothing is reduced, so there is no pellet plant, shaft furnace or hydrogen. Asteroid metal carries about 8.5% nickel and the grade 1.8%: how the nickel is brought down is not yet said."
outputs:
  products:
  - item: high-strength-steel-4340
    form: ingot
conditions:
  gravity: needs gravity
rate:
  mode: batch
equipment:
  facility: foundry
  steps:
  - { module: ore-yard, does: "Asteroid metal, lime and the alloying metals arrive and are stockpiled." }
  - { module: arc-furnace-metal, does: "The metal is melted. Lime forms a slag that takes up the rock that came with it." }
  - { module: ladle-station, does: "The melt is trimmed to the grade, and dissolved gas is removed." }
  - { module: casting-bay, does: "The steel is poured into moulds and stripped out as ingots." }
  - { module: ingot-yard, does: "The ingots cool, a sample certifies the grade, and they are stacked." }
