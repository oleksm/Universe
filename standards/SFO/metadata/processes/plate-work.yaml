# yaml-language-server: $schema=../../schema/process.schema.yaml
identity:
  key: process.plate-work
  name: Plate work
  kind: mechanical
  method: cutting, forming and welding
  description: "Sheet and plate cut, bent and welded into a part of a hull."
rate:
  mode: batch
equipment:
  facility: yard
  steps:
  - { module: cutting-table, does: "Each panel's outline is cut from sheet or plate." }
  - { module: panel-former, does: "The flat blanks are bent to their curve." }
  - { module: welding-bay, does: "The panels are welded, in a jig, into the part." }
