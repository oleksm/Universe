# yaml-language-server: $schema=../../schema/process.schema.yaml
identity:
  key: process.quenching-and-tempering
  name: Quenching and tempering
  kind: thermal
  method: heat treatment
  description: Steel heated, cooled fast to harden it, then reheated a little to take off the brittleness.
inputs:
  materials:
  - item: high-strength-steel-4340
    amount: 1.0
outputs:
  products:
  - item: high-strength-steel-4340
    grade: quenched and tempered
rate:
  mode: batch
equipment:
  facility: foundry
quality:
  property_change: much stronger and harder, less ductile
