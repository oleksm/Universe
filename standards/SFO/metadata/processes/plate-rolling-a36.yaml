# yaml-language-server: $schema=../../schema/process.schema.yaml
identity:
  key: process.plate-rolling-a36
  name: Plate rolling A36 steel
  kind: mechanical
  method: rolling
  description: "A hot ingot of structural steel passed between rolls until it is plate."
inputs:
  materials:
  - item: structural-steel-a36
    amount: 1.0
  form: ingot
outputs:
  products:
  - item: structural-steel-a36
    form: plate
rate:
  mode: continuous
equipment:
  facility: mill
  steps:
  - { module: reheat-furnace, does: "The ingot is heated through to the temperature it rolls at." }
  - { module: hot-rolling-mill, does: "It is squeezed between rolls, pass after pass, down to plate." }
