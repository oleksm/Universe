# yaml-language-server: $schema=../../schema/process.schema.yaml
identity:
  key: process.rolling
  name: Rolling
  kind: mechanical
  method: rolling
  description: An ingot passed between rolls again and again until it is plate or sheet.
inputs:
  materials:
  - item: aluminium-alloy-6061
    amount: 1.0
  form: ingot
outputs:
  products:
  - item: aluminium-alloy-6061
    form: sheet
  - item: aluminium-alloy-6061
    form: plate
rate:
  mode: continuous
equipment:
  facility: mill
  steps:
  - { module: reheat-furnace, does: "The ingot is heated through to the temperature it rolls at." }
  - { module: hot-rolling-mill, does: "It is squeezed between rolls, pass after pass, into a long thick strip." }
  - { module: cold-rolling-mill, does: "The strip is rolled again cold, to its final thickness." }
  - { module: finishing-line, does: "It is levelled, brought to its temper and cut into sheets and plates." }
