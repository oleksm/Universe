# yaml-language-server: $schema=../../schema/process.schema.yaml
identity:
  key: process.plate-rolling-4340
  name: Plate rolling 4340 steel
  kind: mechanical
  method: rolling
  description: "A hot steel ingot passed between rolls until it is plate."
inputs:
  materials:
  - item: material.high-strength-steel-4340
    amount: 1.0
  form: ingot
outputs:
  products:
  - item: material.high-strength-steel-4340
    form: plate
rate:
  mode: continuous
equipment:
  facility: mill
  steps:
  - { module: module.reheat-furnace, does: "The ingot is heated through to the temperature it rolls at." }
  - { module: module.hot-rolling-mill, does: "It is squeezed between rolls, pass after pass, down to plate." }
