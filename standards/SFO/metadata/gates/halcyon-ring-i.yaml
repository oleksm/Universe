# yaml-language-server: $schema=../../schema/gate.schema.yaml
identity:
  name: Halcyon Ring I
  key: structure.ring.i
  maker: brand.halcyon
  class: 1
  description: "A gate ring, class I: the shortest throats, between close neighbours."
size:
  opening: 3000
  thickness: 120
performance:
  span: 5
  capture_speed: 300
built_of:
  parts: halcyon-ring
fit:
  - { item: throat-coil, count: 60 }
  - { item: relay-gate, count: 1 }
  - { item: relay-hyper, count: 1 }
  - { item: transceiver-beacon, count: 1 }
power:
  station: fusion-power-station
making:
  process: ring-assembly
basis:
  - { of: [fit], tier: invented, review: true, note: "The relays and the transceiver are what the game fits to a ring. The coils, one to a segment, are a guess, to be reviewed." }
  - { of: [size], tier: invented, source: "the game: content/base/sheet.ron (GATE_RADIUS, RING_TUBE)", note: "The game's figures, marked there as tuning. The opening is wide enough for capital ships, which are to come; it is not yet worked out from one." }
  - { of: [performance.span], tier: invented, note: "Chosen: 5, 10 and 25 light years for the three classes (2026-10-04)." }
  - { of: [performance.capture_speed], tier: invented, source: "the game: content/base/structures.ron", note: "The game's figure, chosen." }
