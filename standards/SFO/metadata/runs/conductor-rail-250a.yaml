  voltage: 690
  current: 250
per_m:
  mass: 4.3
  built_of:
  - what: Conductors
    item: material.copper
    mass: 2.15
    note: four poles of 60 mm2
  - what: Housing
    item: material.polyethylene-uhmw
    mass: 1.65
    note: PVC, as UHMW polyethylene here
  - what: Hangers' share
    item: material.structural-steel-a36
    mass: 0.5
support:
  spacing: 1.5
  mass: 1.2
  per_m_height: 2.0
  item: material.structural-steel-a36
