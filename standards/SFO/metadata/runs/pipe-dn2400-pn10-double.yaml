# yaml-language-server: $schema=../../schema/run.schema.yaml
identity: {key: run.pipe-dn2400-pn10-double, name: 'Pipe DN 2400 PN 10, double-sealed joints', description: 'Welded pipe, 2400 mm bore, for up to 10 bar; welded between the units'' flanges, so a run has a flange pair only at its ends.'}
kind: pipe
size: 2.4
bore: 2.4
outside: [2.43, 2.43]
rating: {pressure: 1000000.0, temperature: 573.15}
per_m:
  mass: 893.4
  built_of:
  - {what: Pipe, item: material.structural-steel-a36, mass: 893.4, note: '2400 mm bore, 15.0 mm wall (Barlow at 10 bar, 133 MPa, weld factor 0.85, 1.5 mm for corrosion)'}
elbow: {radius: 3.6, mass: 5052.1}
tee: {mass: 2130.8}
cap: {thickness: 0.092, mass: 3267.2}
support: {spacing: 12.0, mass: 155.8, per_m_height: 53.9, item: material.structural-steel-a36}
connector: connector.flange-dn2400-pn10-double
carries: gas
basis:
- of: [per_m]
  tier: derived
  note: Wall from pressure; mass from material and dimensions.
- of: [elbow, tee]
  tier: derived
  note: A long-radius elbow (1.5 bores) is its arc of straight; a tee is its branch stub over the straight it sits in, from the main's outside to 1.5 bores off its axis (checked on blender's DN 200 kit).
- of: [support]
  tier: derived
  review: true
  note: 'Spacing from the span it bears full at 1 g (2.5 mm sag, a third of yield), 3 to 12 m: 12.0 m. The stand''s head and its leg by the metre from memory.'
template: template.pipe
hold: {plant: 12.0, by: its stands (support), basis: rule.run-support}
