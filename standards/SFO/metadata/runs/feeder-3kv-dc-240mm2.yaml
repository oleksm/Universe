# yaml-language-server: $schema=../../schema/run.schema.yaml
identity:
  key: run.feeder-3kv-dc-240mm2
  name: Feeder, 3 kV DC, 240 mm2
  description: 'One pole of a ship''s high-voltage DC bus: a single stranded copper core in 2 mm of PTFE under an earthed braid and jacket, laid in pairs (plus and minus) along the frame. 600 A in vacuum, where only radiation cools
    it; 800 A alone in free air.'
kind: cable
size: 0.00023999999999999998
outside:
- 0.0251
- 0.0251
rating:
  voltage: 3000
  current: 600
  current_air: 800
  current_air_bundle: 560
conductors:
- id: '1'
  size: 0.00023999999999999998
per_m:
  mass: 2.553
  built_of:
  - what: Conductor
    item: material.copper
    mass: 2.15
    note: 240 mm2 stranded
  - what: Insulation, screen and jacket
    item: material.ptfe
    mass: 0.402
    note: 2 mm PTFE, a braid screen and a thin jacket (the braid's copper counted here)
elbow:
  radius: 0.201
  mass: 0.8052
connector: connector.hvdc-pole-650a
carries: power
template: template.feeder
basis:
- of:
  - per_m
  - outside
  rule: rule.cable-insulation-from-memory
- of:
  - rating.current
  rule: rule.cable-rating-vacuum
- of:
  - rating.current_air
  - rating.current_air_bundle
  rule: rule.cable-rating-air
hold:
  clip: connector.run-clip-d40
  ship: 0.6
  plant: 1.5
  basis: rule.run-support
