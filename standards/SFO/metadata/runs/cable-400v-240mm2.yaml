identity: {key: run.cable-400v-240mm2, name: 'Cable, 0.4 kV, 240 mm2', description: 'Three single-core cables of 240 mm2 at 0.4 kV on a ladder tray: 600 A a circuit on airless ground, where only radiation cools them.'}
