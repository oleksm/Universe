# yaml-language-server: $schema=../../schema/run.schema.yaml
identity:
  key: run.feeder-3kv-dc-25mm2
  name: Feeder, 3 kV DC, 25 mm2
  description: 'One pole of a ship''s high-voltage DC bus: a single stranded copper core in 2 mm of PTFE under an earthed braid and jacket, laid in pairs (plus and minus) along the frame. 62 A in vacuum, where only radiation cools it;
    195 A alone in free air.'
kind: cable
size: 2.4999999999999998e-05
outside:
- 0.0115
- 0.0115
rating:
  voltage: 3000
  current: 62
  current_air: 195
  current_air_bundle: 136
conductors:
- id: '1'
  size: 2.4999999999999998e-05
per_m:
  mass: 0.384
  built_of:
  - what: Conductor
    item: material.copper
    mass: 0.224
    note: 25 mm2 stranded
  - what: Insulation, screen and jacket
    item: material.ptfe
    mass: 0.16
    note: 2 mm PTFE, a braid screen and a thin jacket (the braid's copper counted here)
elbow:
  radius: 0.092
  mass: 0.0555
connector: connector.hvdc-pole-150a
carries: power
template: template.feeder
basis:
- of:
  - per_m
  - outside
  rule: rule.cable-insulation-from-memory
- of:
  - rating.current
  rule: rule.cable-rating-vacuum
- of:
  - rating.current_air
  - rating.current_air_bundle
  rule: rule.cable-rating-air
hold:
  clip: connector.run-clip-d16
  ship: 0.6
  plant: 1.5
  basis: rule.run-support
