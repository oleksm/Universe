identity: {key: run.pipe-dn450-pn10-ss-double, name: 'Pipe DN 450 PN 10, stainless, double-sealed joints', description: 'Welded pipe, 450 mm bore, for up to 10 bar; welded between the units'' flanges, so a run has a flange pair only at its ends.'}
