# yaml-language-server: $schema=../../schema/run.schema.yaml
identity:
  key: run.feeder-3kv-dc-al-400mm2
  name: Feeder, 3 kV DC, 400 mm2 aluminium
  description: 'One pole of a ship''s high-voltage DC bus: a single stranded aluminium core in 2 mm of PTFE under an earthed braid and jacket, laid in pairs (plus and minus) along the frame. 781 A in vacuum, where only radiation cools
    it; 860 A alone in free air. Half a copper feeder''s mass for the same amps, a size and a half fatter; its ends crimped on bimetallic contacts.'
kind: cable
size: 0.00039999999999999996
outside:
- 0.031
- 0.031
rating:
  voltage: 3000
  current: 781
  current_air: 860
  current_air_bundle: 602
conductors:
- id: '1'
  size: 0.00039999999999999996
per_m:
  mass: 1.586
  built_of:
  - what: Conductor
    item: material.aluminium-alloy-6061
    mass: 1.08
    note: 400 mm2 stranded, 1350 grade, as 6061 here
  - what: Insulation, screen and jacket
    item: material.ptfe
    mass: 0.506
    note: 2 mm PTFE, a braid screen and a thin jacket (the braid's copper counted here)
elbow:
  radius: 0.248
  mass: 0.6169
connector: connector.hvdc-pole-1000a
carries: power
template: template.feeder
basis:
- of:
  - per_m
  - outside
  rule: rule.cable-insulation-from-memory
- of:
  - rating.current
  rule: rule.cable-rating-vacuum
- of:
  - rating.current_air
  - rating.current_air_bundle
  rule: rule.cable-rating-air
hold:
  clip: connector.run-clip-d40
  ship: 0.6
  plant: 1.5
  basis: rule.run-support
