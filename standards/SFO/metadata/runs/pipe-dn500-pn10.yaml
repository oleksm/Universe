# yaml-language-server: $schema=../../schema/run.schema.yaml
identity: {key: run.pipe-dn500-pn10, name: Pipe DN 500 PN 10, description: 'Welded pipe, 500 mm bore, for up to 10 bar; welded between the units'' flanges, so a run has a flange pair only at its ends.'}
kind: pipe
size: 0.5
bore: 0.5
outside: [0.511, 0.511]
rating: {pressure: 1000000.0, temperature: 373.0}
per_m:
  mass: 68.6
  built_of:
  - {what: Pipe, item: material.structural-steel-a36, mass: 68.6, note: '500 mm bore, 5.5 mm wall (Barlow at 10 bar, 133 MPa, weld factor 0.85, 1.5 mm for corrosion)'}
elbow: {radius: 0.75, mass: 80.8}
tee: {mass: 33.9}
cap: {thickness: 0.02, mass: 30.8}
support: {spacing: 8.0, mass: 40.7, per_m_height: 23.7, item: material.structural-steel-a36}
connector: connector.flange-dn500-pn10
carries: liquid
basis:
- of: [per_m]
  tier: derived
  note: Wall from pressure; mass from material and dimensions.
- of: [elbow, tee]
  tier: derived
  note: A long-radius elbow (1.5 bores) is its arc of straight; a tee is its branch stub over the straight it sits in, from the main's outside to 1.5 bores off its axis (checked on blender's DN 200 kit).
- of: [support]
  tier: derived
  review: true
  note: 'Spacing from the span it bears full at 1 g (2.5 mm sag, a third of yield), 3 to 12 m: 8.0 m. The stand''s head and its leg by the metre from memory.'
template: template.pipe
hold: {plant: 8.0, by: its stands (support), basis: rule.run-support}
