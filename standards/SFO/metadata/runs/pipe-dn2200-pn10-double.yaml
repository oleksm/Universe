identity: {key: run.pipe-dn2200-pn10-double, name: 'Pipe DN 2200 PN 10, double-sealed joints', description: 'Welded pipe, 2200 mm bore, for up to 10 bar; welded between the units'' flanges, so a run has a flange pair only at its ends.'}
