identity:
  key: run.cable-dc-600v-3x1mm2
  name: Harness cable, 600 V DC, 3 x 1 mm2
  description: 'One low-voltage DC way in one jacket: 3 stranded, plated copper cores in PTFE (plus, minus, earth by colour) under a thin FEP jacket, a circular shell 11 at each end. 6 A in vacuum; 11 A in free air.'
kind: cable
size: 1.0e-06
outside:
- 0.0048
- 0.0048
rating:
  voltage: 600
  current: 6
  current_air: 11
  current_air_bundle: 8
conductors:
- id: plus
  role: plus
  size: 1.0e-06
- id: minus
  role: minus
  size: 1.0e-06
- id: earth
  role: earth
  size: 1.0e-06
per_m:
  mass: 0.0465
  built_of:
  - what: Conductors
    item: material.copper
    mass: 0.027
    note: 3 cores of 1 mm2
  - what: Insulation and jacket
    item: material.ptfe
    mass: 0.02
    note: 0.3 mm PTFE a core, 0.3 mm FEP jacket (as PTFE)
elbow:
  radius: 0.038
  mass: 0.00281
connector: connector.circular-shell-11
carries: power
template: template.wire
basis:
- of:
  - per_m
  - outside
  tier: derived
  note: 'Each core as the hook-up wire of its size, laid up in a circle, the jacket round them: calculated, not a single wire''s mass multiplied.'
- of:
  - rating
  tier: invented
  review: true
  note: A core at 0.8 of a single wire's amps in vacuum and at the bundle factor 0.7 in air (the cores share one jacket); From memory of makers' catalogues; to be sourced.
