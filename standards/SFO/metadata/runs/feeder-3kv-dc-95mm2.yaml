# yaml-language-server: $schema=../../schema/run.schema.yaml
identity:
  key: run.feeder-3kv-dc-95mm2
  name: Feeder, 3 kV DC, 95 mm2
  description: 'One pole of a ship''s high-voltage DC bus: a single stranded copper core in 2 mm of PTFE under an earthed braid and jacket, laid in pairs (plus and minus) along the frame. 237 A in vacuum, where only radiation cools
    it; 448 A alone in free air.'
kind: cable
size: 9.499999999999999e-05
outside:
- 0.0176
- 0.0176
rating:
  voltage: 3000
  current: 237
  current_air: 448
  current_air_bundle: 314
conductors:
- id: '1'
  size: 9.499999999999999e-05
per_m:
  mass: 1.121
  built_of:
  - what: Conductor
    item: material.copper
    mass: 0.851
    note: 95 mm2 stranded
  - what: Insulation, screen and jacket
    item: material.ptfe
    mass: 0.27
    note: 2 mm PTFE, a braid screen and a thin jacket (the braid's copper counted here)
elbow:
  radius: 0.141
  mass: 0.2486
connector: connector.hvdc-pole-400a
carries: power
template: template.feeder
basis:
- of:
  - per_m
  - outside
  rule: rule.cable-insulation-from-memory
- of:
  - rating.current
  rule: rule.cable-rating-vacuum
- of:
  - rating.current_air
  - rating.current_air_bundle
  rule: rule.cable-rating-air
hold:
  clip: connector.run-clip-d25
  ship: 0.6
  plant: 1.5
  basis: rule.run-support
