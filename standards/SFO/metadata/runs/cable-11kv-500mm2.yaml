# yaml-language-server: $schema=../../schema/run.schema.yaml
identity: {key: run.cable-11kv-500mm2, name: 'Cable, 11 kV, 500 mm2', description: 'Three single-core cables of 500 mm2 at 11 kV on a ladder tray: 1,250 A a circuit on airless ground, where only radiation cools them.'}
kind: cable
size: 0.0005
outside: [0.3, 0.144]
rating: {voltage: 11000, current: 1250.0}
per_m:
  mass: 20.1
  built_of:
  - {what: Conductors, item: material.copper, mass: 13.4, note: three cores of 500 mm2}
  - {what: Insulation and sheaths, item: material.polyethylene-uhmw, mass: 1.8, note: 3.4 mm of insulation and a 2.5 mm sheath on each core; UHMW polyethylene stands for XLPE}
  - {what: Screens, item: material.copper, mass: 0.9, note: a 35 mm2 copper screen on each core}
  - {what: Tray, item: material.aluminium-alloy-6061, mass: 4.0, note: 'its share of a ladder tray, with 4 mm bridges over the cores at each rung that hold them on risers'}
pitch: 0.06
elbow: {radius: 0.653, mass: 20.6}
riser: {radius: 0.593, mass: 18.7}
tee: {mass: 25.0}
support: {spacing: 3.0, mass: 8.0, per_m_height: 6.0, item: material.aluminium-alloy-6061}
repeat:
- {piece: rung, pitch: 0.3}
connector: connector.termination-11kv-500mm2
carries: power
basis:
- of: [per_m]
  rule: rule.cable-copper-and-insulation
- of: [support, tee, elbow, riser, pitch]
  rule: rule.cable-tray-posts
template: template.cable
hold: {clip: connector.run-clip-d400, ship: 0.6, plant: 3.0, by: its stands (support), basis: rule.run-support}
