# yaml-language-server: $schema=../../schema/run.schema.yaml
identity:
  key: run.feeder-3kv-dc-150mm2
  name: Feeder, 3 kV DC, 150 mm2
  description: 'One pole of a ship''s high-voltage DC bus: a single stranded copper core in 2 mm of PTFE under an earthed braid and jacket, laid in pairs (plus and minus) along the frame. 375 A in vacuum, where only radiation cools
    it; 596 A alone in free air.'
kind: cable
size: 0.00015
outside:
- 0.0209
- 0.0209
rating:
  voltage: 3000
  current: 375
  current_air: 596
  current_air_bundle: 417
conductors:
- id: '1'
  size: 0.00015
per_m:
  mass: 1.671
  built_of:
  - what: Conductor
    item: material.copper
    mass: 1.34
    note: 150 mm2 stranded
  - what: Insulation, screen and jacket
    item: material.ptfe
    mass: 0.327
    note: 2 mm PTFE, a braid screen and a thin jacket (the braid's copper counted here)
elbow:
  radius: 0.167
  mass: 0.4388
connector: connector.hvdc-pole-400a
carries: power
template: template.feeder
basis:
- of:
  - per_m
  - outside
  rule: rule.cable-insulation-from-memory
- of:
  - rating.current
  rule: rule.cable-rating-vacuum
- of:
  - rating.current_air
  - rating.current_air_bundle
  rule: rule.cable-rating-air
hold:
  clip: connector.run-clip-d25
  ship: 0.6
  plant: 1.5
  basis: rule.run-support
