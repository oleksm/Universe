# yaml-language-server: $schema=../../schema/run.schema.yaml
identity: {key: run.pipe-dn1000-pn1, name: Pipe DN 1000 PN 1, description: 'Welded pipe, 1000 mm bore, for up to 1 bar; welded between the units'' flanges, so a run has a flange pair only at its ends.'}
kind: pipe
size: 1.0
bore: 1.0
outside: [1.016, 1.016]
rating: {pressure: 100000.0, temperature: 473.0}
per_m:
  mass: 198.9
  built_of:
  - {what: Pipe, item: material.structural-steel-a36, mass: 198.9, note: '1000 mm bore, 8.0 mm wall (Barlow at 1 bar, 133 MPa, weld factor 0.85, 1.5 mm for corrosion)'}
elbow: {radius: 1.5, mass: 468.6}
tee: {mass: 197.3}
cap: {thickness: 0.012, mass: 74.0}
support: {spacing: 12.0, mass: 71.0, per_m_height: 31.7, item: material.structural-steel-a36}
connector: connector.flange-dn1000-pn1
carries: gas
basis:
- of: [per_m]
  tier: derived
  note: Wall from pressure; mass from material and dimensions.
- of: [elbow, tee]
  rule: rule.pipe-fitting-lengths
- of: [support]
  rule: rule.stand-spacing
template: template.pipe
hold: {plant: 12.0, by: its stands (support), basis: rule.run-support}
