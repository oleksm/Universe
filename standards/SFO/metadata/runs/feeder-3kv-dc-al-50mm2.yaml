# yaml-language-server: $schema=../../schema/run.schema.yaml
identity:
  key: run.feeder-3kv-dc-al-50mm2
  name: Feeder, 3 kV DC, 50 mm2 aluminium
  description: 'One pole of a ship''s high-voltage DC bus: a single stranded aluminium core in 2 mm of PTFE under an earthed braid and jacket, laid in pairs (plus and minus) along the frame. 98 A in vacuum, where only radiation cools
    it; 234 A alone in free air. Half a copper feeder''s mass for the same amps, a size and a half fatter; its ends crimped on bimetallic contacts.'
kind: cable
size: 4.9999999999999996e-05
outside:
- 0.0142
- 0.0142
rating:
  voltage: 3000
  current: 98
  current_air: 234
  current_air_bundle: 164
conductors:
- id: '1'
  size: 4.9999999999999996e-05
per_m:
  mass: 0.343
  built_of:
  - what: Conductor
    item: material.aluminium-alloy-6061
    mass: 0.135
    note: 50 mm2 stranded, 1350 grade, as 6061 here
  - what: Insulation, screen and jacket
    item: material.ptfe
    mass: 0.208
    note: 2 mm PTFE, a braid screen and a thin jacket (the braid's copper counted here)
elbow:
  radius: 0.113
  mass: 0.0611
connector: connector.hvdc-pole-150a
carries: power
template: template.feeder
basis:
- of:
  - per_m
  - outside
  rule: rule.cable-insulation-from-memory
- of:
  - rating.current
  rule: rule.cable-rating-vacuum
- of:
  - rating.current_air
  - rating.current_air_bundle
  rule: rule.cable-rating-air
hold:
  clip: connector.run-clip-d16
  ship: 0.6
  plant: 1.5
  basis: rule.run-support
