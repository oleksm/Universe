identity: {key: run.cable-6p6kv-50mm2, name: 'Cable, 6.6 kV, 50 mm2', description: 'Three single-core cables of 50 mm2 at 6.6 kV on a ladder tray: 125 A a circuit on airless ground, where only radiation cools them.'}
