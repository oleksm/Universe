# yaml-language-server: $schema=../../schema/run.schema.yaml
identity: {key: run.pipe-dn1200-pn10-double, name: 'Pipe DN 1200 PN 10, double-sealed joints', description: 'Welded pipe, 1200 mm bore, for up to 10 bar; welded between the units'' flanges, so a run has a flange pair only at its ends.'}
kind: pipe
size: 1.2
bore: 1.2
outside: [1.219, 1.219]
rating: {pressure: 1000000.0, temperature: 313.15}
per_m:
  mass: 283.4
  built_of:
  - {what: Pipe, item: material.structural-steel-a36, mass: 283.4, note: '1200 mm bore, 9.5 mm wall (Barlow at 10 bar, 133 MPa, weld factor 0.85, 1.5 mm for corrosion)'}
elbow: {radius: 1.8, mass: 801.3}
tee: {mass: 337.4}
cap: {thickness: 0.046, mass: 408.4}
support: {spacing: 12.0, mass: 83.1, per_m_height: 34.8, item: material.structural-steel-a36}
connector: connector.flange-dn1200-pn10-double
carries: gas
basis:
- of: [per_m]
  tier: derived
  note: Wall from pressure; mass from material and dimensions.
- of: [elbow, tee]
  rule: rule.pipe-fitting-lengths
- of: [support]
  rule: rule.stand-spacing
template: template.pipe
hold: {plant: 12.0, by: its stands (support), basis: rule.run-support}
