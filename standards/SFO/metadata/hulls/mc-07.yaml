  ask: docs/registry-ssot-request.md
life: 1262304000
basis:
  - { of: [slots, thrusters], tier: sourced, source: "the game: the MC-07 as it imports its model (crates/core/world/src/import.rs)", note: "Its slots are the standard set for a class 3 hull with two hardpoints; its nozzles are the model's, each at full share." }
  - { of: [flight.radius, flight.drag_area], tier: derived, source: "the game: crates/core/world/src/import.rs", note: "Worked out by the engine from the model's size: 0.3 of half its longest side and 6 m; 0.6 of its width by its height. Rough rules, the engine's." }
  - { of: [fit], tier: sourced, source: "the game: the fit it gives the MC-07 as imported", note: "The cheapest module for each of its slots, less the cargo racks: its hold is its ore bay. Fixed for now." }
  - { of: [physical.length, physical.width, physical.height, physical.volume], tier: sourced, source: "the game: the MC-07 model as imported", note: "Its collision shape's extent and volume." }
  - { of: [capacity.hold_volume], tier: invented, review: true, note: "A guess, to be reviewed: the ore bay under its two top doors. The opening is the doors' (9.95 by 8.4 m, measured from the model); its depth of 8 m is chosen, leaving the cargo deck below. The model's inside has not been measured." }
  - { of: [capacity.hold], tier: derived, review: true, note: "Its bay full of stony ore, the commonest inside the frost line, at 1.8 t for each m3. A denser ore fills it part way. To be reviewed with the bay." }
  - { of: [capacity.fuel], tier: sourced, source: "the game: its tank as fitted" }
  - { of: [design.main_thrust, design.lift_thrust], tier: sourced, source: "the game: the MC-07 as imported, with its standard fit" }
  - { of: [design.landing_speed], tier: sourced, source: "https://www.ecfr.gov/current/title-14/section-25.473", note: "14 CFR 25.473: gear is designed for a descent of 10 feet a second." }
  - { of: [design.safety_factor], tier: sourced, source: "https://www.ecfr.gov/current/title-14/section-25.303", note: "14 CFR 25.303: a factor of safety of 1.5." }
  - { of: [design.pressure_factor], tier: sourced, source: "https://www.ecfr.gov/current/title-14/section-25.365", note: "14 CFR 25.365: cabin pressure loads at 1.33 times." }
  - { of: [design.strut_efficiency], tier: sourced, source: "https://archive.aoe.vt.edu/mason/Mason_f/M96SC05.pdf", note: "An oleo strut does work over 0.8 to 0.9 of its stroke." }
  - { of: [design.cabin_pressure], tier: invented, note: "Sea-level air, chosen. Airliners hold 54 to 65 kPa above the outside." }
  - { of: [design.minimum_gauge], tier: invented, note: "Chosen. Airliner skin is about 1 mm." }
  - { of: [life], rule: rule.life-hull }
open_questions:
  - "Who makes it: it has no maker."
  - "How strong it is: what wrecks it is to be worked out from its parts (SFO 15); the game breaks nothing yet."
  - "Its ore bay: its depth is a guess, and so what it carries. The model's inside needs measuring."
  - "Its skin under the main drive's push: 2 mm sheet buckles unless it is stiffened closely or made thicker (see the structure report). No frames or stringers are parts yet, so their weight is not counted."
  - "The landing the game allows (30 m/s) against the one its legs are built for (3 m/s, failing near 8)."
  - "The main drive's heat: 5.4 MN at its exhaust speed is about 27 TW in the exhaust, and more as waste heat. How much of that reaches the ship is not said."
  - "Its power plant's heat: about 7 MW to shed, and no radiator on the model."
  - "What the rest of its 23,000 m3 is for. Its equipment, tank and ore bay take about 3%."
  - "Its fit is the game's early list: twelve records marked outdated (in service, not to be balanced against), among them a life support that keeps three for its six seats and a torch drive whose jet no pad stands (SFO 22, 23). A fit from the current families is the ships session's to design."
