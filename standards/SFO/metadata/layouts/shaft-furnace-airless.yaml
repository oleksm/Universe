  - {item: stock.al6061-tb-80x2-s3000, count: 281, where: tower roof}
  - {item: stock.al6061-tb-80x2-d3000, count: 234, where: tower roof}
  - {item: stock.st4340-node-110b, count: 932, where: nodes}
