frame:
  box: [-12.0, -12.0, 0.0, 12.0, 12.0, 45.0]
  cell: 3.0
  shape: An open braced tower 24 x 24 m and 45 m tall of aluminium kit struts round the shaft; six grating platforms at z 6, 12, 18, 24, 30 and 36, each a 24 m square with a 15.2 m square opening round the shaft (60% of the plan), 6 mm aluminium grating on a perimeter and eight radial 150 x 100 x 4 mm aluminium box beams, with guard rails; a caged ladder up the south-west corner between them; no cladding.
  openings:
  - [9.0, -3.0, 28.0, 12.0, 3.0, 42.0]
  - [-3.0, -12.0, 13.0, 3.0, -9.0, 19.0]
  - [-12.0, -3.0, 3.0, -9.0, 3.0, 9.0]
  - [-3.0, -3.0, 42.0, 6.0, 3.0, 48.0]
  members:
  - {item: stock.al6061-tb-80x2-s3000, count: 1991, where: tower walls}
  - {item: stock.al6061-tb-80x2-d3000, count: 1537, where: tower walls}
  - {item: stock.al6061-tb-80x2-s3000, count: 274, where: tower roof}
  - {item: stock.al6061-tb-80x2-d3000, count: 227, where: tower roof}
  - {item: stock.st4340-node-110b, count: 930, where: nodes}
  - {item: stock.st4340-box-300x300x20, count: 8, where: 'columns under the shaft''s ring girder, 12 m, braced to the tower every 6 m'}
  carries: [unit.shaft-furnace-200th-hp]
  mass: 84810.0
  sized: 'At 2 m/s2 the shaft with its burden, 4.9 MN, on 8 columns of 300 x 300 x 20 mm 4340 box: 27 MPa each. No wind: the lattice braces the columns and carries six aluminium grating platforms (6 mm, 60% of the plan), the kit''s lightest aluminium strut (al6061-tb-80x2). Footings not yet checked.'
ground:
- {what: Tower foundation, item: material.regolith-sintered, volume: 864.0, note: a mat of sintered regolith blocks 1.5 m thick (a fifth of the load of 1 g), mass: 2160000.0}
- {what: Unit pads, item: material.regolith-sintered, volume: 329.5, note: 0.5 m under each unit, mass: 823800.0}
- {what: Radiator legs' pads, item: material.regolith-sintered, volume: 124.9, mass: 312200.0}
- {what: Crew post berm, item: material.regolith, volume: 586.23, note: 'loose regolith at least 1 m over the post everywhere (its top 4 x 2 m, 5.3 m up), lying at 35 degrees, its foot about 19 x 17 m, a cavity for the post; measured on blender''s arc furnace shop; with openings for its windows (light wells on the north) and its airlock (a ramp cut on the west); with openings for its windows and airlock; at the airlock''s door a landing of packed regolith 2 x 2 m, its top at the threshold (1.35 m up), and a ramp down to the ground at about 1 in 3', mass: 879300.0}
- {what: Trestle footings, item: material.regolith-sintered, volume: 39.0, mass: 97500.0}
totals: {rate: 55.5555555555556, power: 127500000.0, heat: 62090000.0, water: 0.0, mass: 9522000.0, against_module: 'module.shaft-furnace: one box, 22 MW. The layout for air draws 152 MW and sends 130 MW up four towers. This layout: the same rate; 127 MW (heater 121, compressor 4.1: at 8 bar the compressor only makes up the loop''s pressure drop); 62 MW to 43 radiator fields at 345 K (10 ha), for the water must condense somewhere and only light can take the heat away; no cooling zone or loop (the sponge iron goes on hot); no water used up. 5,249 t of plant and frame, 4,273 t of sintered regolith.'}
