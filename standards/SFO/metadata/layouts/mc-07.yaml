  - { kind: door, between: [Crew corridor, Restroom], at: [21.5, 8.4, 1.0], width: 0.8, height: 2.1 }
  - { kind: door, between: [Crew corridor, Fore ladder], at: [23.75, 8.4, 1.0], width: 0.8, height: 2.1 }
  - { kind: door, between: [Fore ladder, Fore stores], at: [23.0, 3.9, 1.75], width: 0.8, height: 2.1 }
  - { kind: door, between: [Fore stores, Avionics bay], at: [13.1, 3.9, 0.0], width: 0.9, height: 2.1 }
  - { kind: pressure-door, between: [Crew corridor, Fore cross passage], at: [25.5, 8.4, 0.0], width: 1.0, height: 2.1, seals: true }
  # Section B.
