  - { kind: door, between: [Fore cross passage, Workshop], at: [27.0, 8.4, 8.0], width: 1.2, height: 2.1 }
  - { kind: door, between: [Port passage, Main ladder], at: [28.5, 8.4, -11.5], width: 0.8, height: 2.1 }
  - { kind: pressure-door, between: [Main ladder, Airlock], at: [28.5, 1.0, -11.5], width: 1.0, height: 2.1, seals: true }
  - { kind: pressure-door, between: [Airlock, Cargo hold], at: [28.5, 1.0, -9.0], width: 1.0, height: 2.1, seals: true }
  - { kind: pressure-door, between: [Main ladder, Fuel tank bay], at: [30.0, 4.6, -12.0], width: 0.8, height: 2.1, seals: true }
  - { kind: door, between: [Workshop, Starboard ladder], at: [27.75, 8.4, 11.0], width: 0.8, height: 2.1 }
  - { kind: door, between: [Starboard ladder, Life support], at: [28.5, 4.6, 11.75], width: 0.8, height: 2.1 }
