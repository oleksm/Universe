totals: {rate: 26.6666666666667, power: 73020000.0, heat: 13560000.0, water: 0.0, mass: 4599000.0, against_module: 'module.arc-furnace: one box, the same on every world. This layout: the same rate; 73.0 MW; 13.6 MW to 13 radiator fields (21.8 MW at lunar noon), 12 at 330 K for the panels, the transformer and the bus and 1 at 485 K for the off-gas cooler''s steam, in place of the tower; no water used up (closed loops); no hall, no baghouse (the furnace is sealed); 1,504 t of plant and 3,095 t of sintered regolith. The radiators cover 3.0 ha: the heat that went up a tower''s plume as steam must here leave as light, and at 330 K a panel in the noon sun sheds little. The sealed furnace''s gas is CO alone (1.37 kg/s), so its cooler takes 2.2 MW, not the 7.2 MW the shop for air''s duct does (that includes the gas burnt in the air drawn in); the hot field is used at 23%. A heat pump lifting the panels'' heat to 485 K (at half Carnot''s) would need about 7 MW more power and 3 hot fields in place
    of all 13 (not fitted); panels cooled by water at 20 bar and 485 K, as some furnaces'' are, would need about 2 (not fitted).'}
