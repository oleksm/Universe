basis:
- of: [bays, links, mobile]
  tier: invented
  review: true
  note: Laid out for airless ground from the yard for air.
- of: [ground]
  tier: derived
  review: true
  note: 'The cooling time from radiation alone: an ingot''s 2.0 m2 at emissivity 0.8, a fifth of its view to its neighbours, from 700 deg C to 150 (from memory, for the saws): 16.9 h, so 914 on the beds; sintered regolith at 2,500 kg/m3, cast iron 7,200.'
- of: [totals, physical]
  tier: derived
  note: Summed from the units, links and ground.
- of: [staff]
  tier: derived
  note: The module's watch, unchanged.
