totals: {rate: 0.0, power: 513000.0, heat: 0.0, water: 0.0, mass: 11920000.0, against_module: 'module.ingot-yard: one box, holding 50 kt. This layout: 28,403 steel crates four high (a moon''s gravity and the steel crate allow it) on a yard 98 x 114 m; no hall: 914 ingots stand 17 hours on 4 beds open to the sky, radiating 7.9 MW to it (with no air, light alone takes their heat; on a lunar day the sun adds about a tenth near the end); the saws cut dry, two sets; 0.51 MW; no water; one gantry makes about four moves an ingot (217 an hour), more than one crane can at a minute or so a move: its count is not yet worked out; 2,325 t of plant, 9,595 t of beds and ground.'}
