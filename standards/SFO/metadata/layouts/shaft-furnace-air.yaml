- {what: Compressor crane hardstanding, item: good.concrete, volume: 104.0, note: '26 x 10 m, 0.4 m, south of the compressor (x 47 to 73, y -14 to -4), for a mobile crane; measured on blender''s layout (candidate v01)', mass: 249600.0}
