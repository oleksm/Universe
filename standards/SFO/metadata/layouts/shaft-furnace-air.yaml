- {what: Cooling tower basins, item: good.concrete, volume: 1587.28, note: 'one under each tower, sunk as the furnace shop''s: 0.3 m walls, floor top at z -2; 6 m apart, no shared walls; measured on blender''s layout (candidate v01)', mass: 3809000.0}
- {what: Gallery trestle footings, item: good.concrete, volume: 92.0, note: '8 m3 under each of the pellet belt''s trestles, 4 m3 under the product belt''s; measured on blender''s layout (candidate v01)', mass: 220800.0}
