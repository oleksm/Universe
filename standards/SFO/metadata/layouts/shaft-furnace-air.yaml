  - {item: stock.st4340-box-400x400x25, count: 8, where: 'columns under the shaft''s ring girder, 22 m, on a circle of radius 4.1 m beside the cooling zone and cone, the first at 22.5 degrees off x so the product belt passes between; braced to the tower''s walls every 6 m'}
  carries: [unit.shaft-furnace-200th]
  mass: 392800.0
  sized: 'At 1 g the shaft with its burden, 31.7 MN, hangs from its ring girder at z 22 on 8 columns of 400 x 400 x 25 mm 4340 box: 106 MPa each, against 470 MPa with half again to spare; braced every 6 m their slenderness is 39. Wind of 1 kPa (invented) on a 24 x 54 m face makes 35 MN m at the base, 162 kN in each wall chord: st4340-tb-120x3 takes 424 kN, the kit''s lightest with half again to spare. Six grating platforms, 10 mm, 60% of the plan. Footings'' loads and the belt''s head house not yet checked.'
ground:
