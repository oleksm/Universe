  members:
  - {item: stock.st4340-tb-120x3-s3000, count: 2373, where: tower walls}
  - {item: stock.st4340-tb-120x3-d3000, count: 1795, where: tower walls}
  - {item: stock.st4340-tb-120x3-s3000, count: 255, where: tower roof}
  - {item: stock.st4340-tb-120x3-d3000, count: 210, where: tower roof}
