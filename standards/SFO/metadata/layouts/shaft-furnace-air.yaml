frame:
  box: [-12.0, -12.0, 0.0, 12.0, 12.0, 54.0]
  cell: 3.0
  shape: 'An open braced tower 24 x 24 m and 54 m tall round the shaft: walls one cell thick, a roof one cell deep carrying the belt''s head house, six grating platforms at z 9, 15, 24, 30, 36, 45 (the lock and feeders, the cooling zone''s ports, round the bustle, the reduction zone, 3 m under the top gas main, the seal leg), each 18 x 18 m inside the walls with a 10 m hole round the shaft, but at z 24 the tower''s full 24 x 24 m plan (out over the wall cells) with a 17 m hole round the bustle (about 15 m across); grating seated on the frame''s nodes; stairs in switchback flights 1.2 m wide inside the north-west corner of the walls (x -12 to -6, y 9 to 12; the members inside that prism left out, its faces'' posts and bracing kept), landing beams on the 3 m nodes, landing on each platform through a doorway 3 m wide and 3 m high in the stair''s inner face (x -9 to -6, y 9) and the roof at z 51; no cladding.'
  openings:
  - [9.0, -3.0, 38.0, 12.0, 3.0, 51.0]
  - [-3.0, -3.0, 45.0, 12.0, 3.0, 54.0]
