  members:
  - {item: stock.st4340-tb-120x3-s3000, count: 2725, where: wall}
  - {item: stock.st4340-tb-120x3-d3000, count: 2009, where: wall}
  - {item: stock.st4340-tb-100x3-s3000, count: 1957, where: roof}
