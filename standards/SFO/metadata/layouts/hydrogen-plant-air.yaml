frame:
  box: [-63.0, -15.0, 0.0, 63.0, 15.0, 18.0]
  cell: 3.0
  shape: Walls one cell thick, 15 m tall; a roof one cell deep over a 120 x 24 m floor, open along its ridge so hydrogen cannot gather (a vent 1.5 m wide over y 0.75 to 2.25, between the top chords at y 0 and 3, the top diagonals there left out; only the cross chords every 3 m span it); framed openings in the south wall for the DC busbars, in the east for the gas headers and a door, in the north for the cooling water.
  openings:
