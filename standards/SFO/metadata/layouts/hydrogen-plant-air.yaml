totals: {rate: 0.525, power: 99100000.0, heat: 25260000.0, water: 18.7, mass: 7897000.0, against_module: 'module.hydrogen-plant: one box 150 x 100 x 20 m, 100 MW. This layout: the same 1,890 kg of hydrogen an hour; 99.1 MW (the cells 95.5, at 1.9 V, 50.5 kWh a kg); 25.3 MW to the tower, 18.7 kg/s of water used and evaporated; 2,275 t of plant, frame and supports, 5,623 t of concrete; 1.5 ha, against the source''s 0.8 to 1.7 for 100 MW. It makes 0.525 kg/s; one shaft furnace at its full rate takes 3.00, about 5.7 of these.'}
