identity: {key: layout.ore-yard-airless, name: 'Ore yard, airless', description: 'Two stockpile beds of ore either side of the bucket wheel stacker-reclaimer''s rail, on airless ground at about a moon''s gravity: as the yard for air, with the same machines, but no water sprays (with no air, dust thrown up falls back at once instead of drifting) and sintered regolith for concrete. The machines'' bearings, lubricants and belts are of kinds rated for vacuum and the lunar night''s cold (rubber stiffens below about -50 deg C), not checked. Built separately from the yard for air.'}
