# yaml-language-server: $schema=../../schema/package.schema.yaml
identity:
  key: package.livestock-crate
  name: "Livestock crate"
  description: "A ventilated crate with a ramp door and a trough for live animals, watered on the way; no animals drawn (which and how many are the game's). Live fish travel in fish tanks."
physical:
  length: 2.4
  width: 1.2
  height: 1.8
  mass: 300
holds:
  volume: 4.0
  mass: 1500
handling: walk
stack: 1
keeps: ventilated
shows_contents: false
basis:
  - { of: [holds.volume], tier: derived, review: true, note: "The floor-to-roof space inside the frame, about 2.3 x 1.1 x 1.6 m: 4.0 m3 (was 5, the outside); blender's measured interior replaces it at install." }
  - { of: [physical, holds, handling, stack], tier: invented, review: true, note: "A standard unit as logistics uses them (pallet 1.2 x 1.0 m, 1 m3 bags and totes, 6 m bundles), sized by the registry (2026-10-10); not sourced figure by figure." }
