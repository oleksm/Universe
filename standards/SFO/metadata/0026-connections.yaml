identity:
  key: standard.sfo.26
title: Connections
parent: standard.sfo.25
purpose: "Everything that joins one made thing to another, a flange, a mains plug, a docking ring, a rail coupler or a container lock, is held in one shape: an interface (the standard), its two halves (a plug and its receiver, male and female, or two alike), the conduit between interfaces, the fittings along it and the supports under it. Any maker's half then fits any maker's other half built to the same interface. Sizes come from short preferred series, and each kind is one family, so the inventory stays small."
details:
  text:
    - "Ports (SFO 25) name the interface they are built to; the game draws the halves and the conduit at the port, and a unit's own model ends at the mating plane with no stub. A port moving is never a reason to remake a unit."
    - "Two halves mate only when they are built to the same interface, of opposite gender (or both androgynous), and the media and ratings agree. Where they don't, an adapter joins them: a reducer, a plug adapter, a flange adapter. An adapter is a made thing with its own mass and a fitting's place in the run."
    - "Draft, set 2026-10-17 from the survey in docs/proposals/connectables.md. What exists today is the connectors and runs of SFO 25, the mounts of SFO 19 and SFO 24 and the struts of SFO 13; the rest is to be added by family."
sections:
  - title: The shape of a connection
    table:
      columns: [Part, What it is, Example]
      rows:
        - ["Interface", "The standard: the mating geometry; its rating (size, pressure, temperature, voltage, current, flow, load); its sealing (air, vacuum, cryogenic); how it is made and broken (permanent, bolted, quick by hand, automatic)", "DN 200 PN 16 flange; 400 V 125 A 3P+E socket; a docking ring"]
        - ["Halves", "The two mating parts: male and female (a plug and its receiver), or androgynous (the same on both sides)", "A flange pair; a plug and socket; a nozzle and its receptacle; a twistlock and a corner casting"]
        - ["Conduit", "What carries the flow from one interface to another", "Pipe, hose, tube, cable, busbar, belt, rail, road"]
        - ["Fittings", "What changes the conduit along its way", "Bend, branch, reducer, valve, expansion joint, adapter, splice"]
        - ["Support", "What holds the conduit up", "Pipe stand, cable tray, idler, rail bed, hanger"]
