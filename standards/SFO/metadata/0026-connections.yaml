  - title: Preferred sizes
    text:
      - "A layout or a design rounds up to the next preferred size; it never asks for a size between them."
    table:
      columns: [Interface, Series]
      rows:
        - ["Pipe bore (DN, mm)", "25, 50, 100, 150, 200, 300, 400, 600, 800, 1000, 1200, 2000"]
        - ["Pressure class (PN, bar)", "1, 10, 25, 100"]
        - ["Voltage (kV)", "0.4, 6.6, 33, 132"]
        - ["Plug and socket current (A)", "16, 32, 63, 125, 250, 400, 630, 800 (IEC 60309)"]
        - ["Belt width (m)", "0.65, 0.8, 1.0, 1.2"]
  - title: Rules
    text:
      - "1. Families, not pieces: each kind of conduit, joint and fitting is one generator, modelled once; every size comes from its record's numbers, and records that look alike share a model (looks_as)."
      - "2. An interface record names its halves (male, female or androgynous), how it is made and broken, its rating and the media it takes; an adapter is a record too."
      - "3. The game draws the joint, not the unit: a unit's model ends at the mating plane."
      - "4. The interfaces a player handles by hand come first: plugs and sockets, quick couplings, refuelling nozzles, docking rings, container locks. Making and breaking them is an action in the game."
  - title: Order
    text:
      - "1. The interface record; the connectors of SFO 25 become interfaces with their halves."
      - "2. A chain checker: layouts' edge ports matched by interface and commodity, a chain's counts sized by rate, and unmet inputs, unused outputs and mismatched interfaces listed."
      - "3. The gaps, by family: valves and expansion joints; hose and quick couplings; festoons, cable reels and conductor rails; plugs and sockets; container locks; rail couplers; overhead lines; docking rings and refuelling; heat pipes; control cores."
      - "4. Rail and road ports at layouts' edges, with a trip's load and a cycle's time."
