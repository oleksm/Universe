identity:
  key: connector.run-clip-d25
  name: Run clip, up to 25 mm
  description: 'A cushioned 6061 loop clip holding one run up to 25 mm outside (a cable, a hose, a tube), its tab bolted by one M10 to a strut clamp''s lug: how a run is held on a ship''s frame (docs/proposals/physical-mounts.md). Origin
    at the tab''s 11 mm bore on the lug face, z 0, the tab along x, 26 mm long and two straps thick; the loop beyond the tab at -x, its axis across (y), its outside from z 0 up to z 0.032, the strap leaving it tangentially into the
    tab. Strap and cushion only: the bolt and nut are separate hardware.'
kind: run-clip
size: 0.025
