  review: true
  note: 'A P-clip by rule (mounting.py): strap a quarter of the band wide, 2% thick, at least the nut across flats plus 4 mm (M10: the smallest stocked bolt whose proof load carries the strap''s hold at the 1.5 factor); holds both legs
    at 6061''s yield pulled, friction 0.3 sliding. The bolt is separate hardware, as the shoe''s. Review-pending (docs/proposals/physical-mounts.md): chosen, not approved.'
