# yaml-language-server: $schema=../../schema/panel.schema.yaml
identity:
  key: panel.wall-hatch-3x3
  name: Pressure wall panel with a door, 3 x 3 m
  description: 'A pressure wall panel with a 1.0 x 2.0 m plug door that opens inward, so the air seats it: the outer door of an airlock (its chamber one cell, the inner door a pressure partition''s).'
kind: wall
site: airless
cell:
- 3.0
- 3.0
thickness: 0.225
opening:
  kind: pressure-door
  width: 1.0
  height: 2.0
  sill: 0.15
  people: true
u_value: 0.1
load: 101300.0
physical:
  length: 3.0
  width: 0.225
  height: 3.0
  mass: 480.4
built_of:
- what: Pressure skin
  item: material.aluminium-alloy-6061
  mass: 94.5
  note: 5 mm welded 6061
- what: Stiffeners
  item: material.aluminium-alloy-6061
  mass: 164.1
  note: 14 T-stiffeners 155 mm deep at 0.23 m
- what: Edge channel, seals and bolts
  item: material.aluminium-alloy-6061
  mass: 72.0
  note: a welded edge channel and two O-ring grooves on the frame's beams, 6 kg/m
- what: Multi-layer insulation
  item: material.polyimide-film
  mass: 4.2
  note: about twenty layers, outside the skin
- what: Pressure door leaf
  item: material.aluminium-alloy-6061
  mass: 44.5
  note: a 5 mm skin on 9 ribs 60 mm deep, opening inward
- what: Hinges, latches and seal frame
  item: material.structural-steel-a36
  mass: 60.0
  note: forged hinges, dogs all round, the door's seal land (invented)
- what: Door surround
  item: material.aluminium-alloy-6061
  mass: 40.0
  note: a welded doubler round the opening (invented)
- what: Leaf insulation
  item: material.polyimide-film
  mass: 1.2
  note: 'the blanket over the leaf''s vacuum face, its seal lands bare: blender''s model'
template: template.wall-hatch
basis:
- of:
  - built_of
  - physical
  - u_value
  - load
  rule: rule.pressure-hall-skin
