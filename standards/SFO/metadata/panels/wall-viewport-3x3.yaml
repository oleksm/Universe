# yaml-language-server: $schema=../../schema/panel.schema.yaml
identity:
  key: panel.wall-viewport-3x3
  name: Pressure wall panel with a viewport, 3 x 3 m
  description: 'A pressure wall panel with a 0.6 m round viewport of two fused silica panes: a look out where a world with air would have a window.'
kind: wall
site: airless
cell:
- 3.0
- 3.0
thickness: 0.19
opening:
  kind: viewport
  width: 0.6
  height: 0.6
  sill: 1.2
u_value: 0.1
load: 101300.0
physical:
  length: 3.0
  width: 0.19
  height: 3.0
  mass: 471.2
built_of:
- what: Pressure skin
  item: material.aluminium-alloy-6061
  mass: 117.7
  note: 5 mm welded 6061
- what: Stiffeners
  item: material.aluminium-alloy-6061
  mass: 204.3
  note: 14 T-stiffeners 155 mm deep at 0.23 m
- what: Edge channel, seals and bolts
  item: material.aluminium-alloy-6061
  mass: 72.0
  note: a welded edge channel and two O-ring grooves on the frame's beams, 6 kg/m
- what: Multi-layer insulation
  item: material.polyimide-film
  mass: 5.2
  note: about twenty layers, outside the skin
- what: Viewport panes
  item: material.fused-silica
  mass: 44.7
  note: 'two 32 mm panes 638 mm across on their seat lands, either holding the air alone: blender''s model (2026-10-18)'
- what: Viewport sleeve, collar and retainers
  item: material.aluminium-alloy-6061
  mass: 27.3
  note: 'a welded 640/680 mm sleeve through the wall''s depth, a 760 mm collar, retainers, 12 bolts and dual seals: blender''s model'
template: template.wall-viewport
basis:
- of:
  - built_of
  - physical
  - u_value
  - load
  rule: rule.pressure-hall-skin
