# yaml-language-server: $schema=../schema/standard.schema.yaml
identity:
  key: standard.sfo.12
title: Parts
parent: standard.sfo.8
records: parts
purpose: A part is one made thing that a hull is built of. A simple part is cut from mill stock; a larger one is made of other parts. Parts are filed by the hull they belong to.
details:
  text:
    - "Parts as a rule (2026-10-07): a part written as a share of its whole (its weight a share of the product's, its box the product's scaled by the cube root of that share, its stock cut with the cutting loss) is not filed; it is one line of its product's built_of.list (code, name, mass, box, item, quantity, module), and the build and the registry reader derive the part record from it through one template (tools/standards/lib.py part_yaml; crates/registry derived_part_yaml), its basis by the rules (shares, cut-loss, built-in-whole, fitted-within) unless the line says its own. A part measured from a model (identity.drawing), or made of parts of its own, keeps its file in the folder."
status: draft
