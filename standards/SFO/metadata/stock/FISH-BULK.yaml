# What is sold is stock. This is fish fillets as it lies in a store and is sold: in bulk, by weight.
identity:
  key: stock.fish-bulk
  traded_as: market.food
  code: FISH-BULK
  name: "Fish fillets, in bulk"
  form: bulk
package: package.cold-crate
tint: [0.75, 0.78, 0.8]
made_from:
  - item: good.fish
