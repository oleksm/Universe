# clamps and lasers stowed, bay doors shut. Its mass is its surface in the stock it is cut
# from; it is welded from panels cut and formed of that stock (the cutting table loses 15%, an invented allowance).
identity:
  key: part.mc07-12
  code: MC07-12
  name: "Main hull"
  revision: draft
  drawing: "assets/models/mc07.glb: Hull_Main"
physical:
  mass: 19874
  length: 25.09
  width: 26.09
  height: 15.09
  shock_limit: 98.0665
shape:
  surface_area: 3680.3
made_from:
  - item: stock.al6061-sh-2-panel
    quantity: 19874
making:
  module: module.welding-bay
fit:
  count: 1
  position: "Its centre is 36.1 m back from the nose and 8.0 m above the keel, on the centre line."
basis:
  - { of: [physical.length, physical.width, physical.height, shape, fit], tier: derived, note: "Measured from the model." }
  - { of: [physical.mass], tier: derived, note: "Its surface in the stock it is cut from." }
  - { of: [made_from], tier: invented, note: "The formed panel it is welded from, at its own weight. What is lost in cutting the panel from its stock (15%, chosen) is the cutting table's." }
