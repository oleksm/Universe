# yaml-language-server: $schema=../../../schema/part.schema.yaml
# Measured from the model (assets/models/mc07.glb), as it stands there: gear down, ramp lowered,
# clamps and lasers stowed, bay doors shut. Its mass is its surface in the stock it is cut
# from; the stock it takes is that surface and 15% more, lost in cutting (an invented allowance).
identity:
  code: MC07-07
  name: "Neck"
  revision: draft
  drawing: "assets/models/mc07.glb: Hull_Neck"
physical:
  mass: 16150
  length: 11.59
  width: 17.09
  height: 9.6
  shock_limit: 10
shape:
  surface_area: 1196.3
made_from:
  item: AL6061-PL-5
  quantity: 1375.7
making:
  processes: [plate-work]
fit:
  count: 1
  position: "Its centre is 18.9 m back from the nose and 8.3 m above the keel, on the centre line."
limits:
  load_case: pressure
basis:
  - { of: [physical.length, physical.width, physical.height, shape, fit], tier: derived, note: "Measured from the model." }
  - { of: [physical.mass], tier: derived, note: "Its surface in the stock it is cut from." }
  - { of: [made_from], tier: derived, note: "Its gauge from the cabin pressure it holds (see the structure report). The 15% lost in cutting was chosen." }
  - { of: [physical.shock_limit], tier: invented, review: true, note: "A guess, to be reviewed: no source was found for what a jolt does to it." }
