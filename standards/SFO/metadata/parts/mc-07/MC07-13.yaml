  key: part.mc07-13
  code: MC07-13
  name: "Keel"
  revision: draft
  drawing: "assets/models/mc07.glb: Hull_Keel"
physical:
  mass: 7250
  length: 16.63
  width: 18.8
  height: 0.64
  shock_limit: 20
shape:
  surface_area: 537.0
made_from:
  item: stock.al6061-pl-5
  quantity: 617.5
making:
  processes: [process.plate-work]
fit:
  count: 1
  position: "Its centre is 36.1 m back from the nose and 0.3 m above the keel, on the centre line."
basis:
  - { of: [physical.length, physical.width, physical.height, shape, fit], tier: derived, note: "Measured from the model." }
  - { of: [physical.mass], tier: derived, note: "Its surface in the stock it is cut from." }
  - { of: [made_from], tier: invented, note: "The allowance for what is cut or machined away was chosen." }
  - { of: [physical.shock_limit], tier: invented, review: true, note: "A guess, to be reviewed: no source was found for what a jolt does to it." }
