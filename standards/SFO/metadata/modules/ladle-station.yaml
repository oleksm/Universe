# yaml-language-server: $schema=../../schema/module.schema.yaml
identity:
  key: module.ladle-station
  name: Ladle station
  step: Refine
  description: "The melt, in its ladle, is trimmed to grade with alloying additions, stirred with argon and degassed."
size:
  length: 40
  width: 30
  height: 35
rate:
  throughput: 150
  batch: 80
  product: good.refined-steel
inputs:
  materials:
  - { item: good.liquid-steel, amount: 1.0 }
  - { item: element.ar, amount: 0.001 }
needs:
  power: 7.5
basis:
  - { of: [inputs], tier: sourced, source: "https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/IS_Adopted_03_2012.pdf", note: "0.3 to 1.45 m3 of argon for each tonne, about 0.5 to 2.6 kg; 1 kg taken." }
  - { of: [needs], tier: sourced, source: "https://escholarship.org/content/qt77n9d4sp/qt77n9d4sp.pdf", note: "65 kWh for each tonne for ladle refining and gas cleaning together; 50 taken for the ladle alone." }
  - { of: [rate, size], tier: invented, note: "Its rate and footprint were not found in a source: approximate, from memory." }
