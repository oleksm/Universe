# yaml-language-server: $schema=../../schema/module.schema.yaml
identity:
  key: module.acid-plant
  name: "Acid plant"
  step: "Make acid"
  description: "Burners, converters and absorbing towers. Set to sulphuric acid, from sulphur, or to nitric, from ammonia. Both give off more heat than they take."
physical:
  length: 150
  width: 100
  height: 40
staff:
  - { profession: profession.chemist, count: 2 }
  - { profession: profession.plant-operator, count: 4 }
  - { profession: profession.technician, count: 1 }
recipes:
  - makes: good.sulphuric-acid
    does: "Sulphur is burnt, the gas passed over a catalyst and taken up in water (the contact process)."
    inputs:
      - { item: element.s, quantity: 0.3269 }
      - { item: element.o, quantity: 0.4894 }
      - { item: good.water, quantity: 0.1837 }
    rate: 10.0
    power: 1530000
  - makes: good.nitric-acid
    does: "Ammonia is burnt over platinum gauze and the gas taken up in water (the Ostwald process)."
    inputs:
      - { item: good.fertiliser, quantity: 0.286 }
      - { item: element.o, quantity: 1.038 }
    outputs:
      - { item: good.water, quantity: 0.3108 }
      - { item: element.n, quantity: 0.01293 }
    rate: 5.0
    power: 162000
life: 788940000
basis:
  - { of: [recipes, recipes.inputs, recipes.outputs], tier: derived, source: "standards/sources/research_chemicals.json", note: "Sulphuric acid from the chemistry (0.327 t of sulphur a tonne). Nitric acid: 286 kg of ammonia a tonne as plants report; the water and the nitrogen lost are by balance." }
  - { of: [recipes.power], tier: sourced, source: "standards/sources/research_chemicals.json", note: "35 to 50 kWh a tonne of sulphuric acid, 9 a tonne of nitric. The heat they give off (6 GJ and 1.6 GJ a tonne) is not put to use here." }
  - { of: [physical, recipes.rate], tier: invented, review: true, note: "Its size and how much it puts through are chosen. To be reviewed." }
  - { of: [staff], tier: invented, review: true, note: "A chemical plant's watch: two chemists, four operators, a technician. Coarse: by the kind of plant, not this one; to be reviewed." }
  - { of: [life], tier: invented, review: true, note: "Twenty-five years for industrial plant, as plant is depreciated on Earth; then it is rebuilt. Chosen; the user's rule that everything made has a life." }
