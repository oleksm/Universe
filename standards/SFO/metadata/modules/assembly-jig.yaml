# yaml-language-server: $schema=../../schema/module.schema.yaml
identity:
  key: module.assembly-jig
  name: Assembly jig
  step: Assemble in orbit
  description: "A frame, carried by a rig, that holds a length of a ring while its frames are closed and its panels fixed to them, then passes it out to be joined to the last. Sized to hold one segment of a gate ring."
physical:
  length: 180
  width: 140
  height: 140
throughput:
  rate: 2.77777777777778
  power: 1000000
staff:
  - { profession: profession.fitter, count: 6 }
  - { profession: profession.technician, count: 1 }
life: 788940000
basis:
  - { of: [throughput.rate], tier: invented, review: true, note: "A guess, to be reviewed: it sets how fast a ring can be put together." }
  - { of: [physical, throughput.power], tier: invented, review: true, note: "Chosen: no source was looked up for plant of this kind." }
  - { of: [staff], tier: invented, review: true, note: "Six fitters and a technician. Coarse: by the kind of plant, not this one; to be reviewed." }
  - { of: [life], rule: rule.life-plant }
