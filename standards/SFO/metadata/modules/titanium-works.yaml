# yaml-language-server: $schema=../../schema/module.schema.yaml
identity:
  key: module.titanium-works
  name: "Titanium works"
  step: "Win titanium"
  description: "Furnaces that part ilmenite's iron from its titanium, chlorinators that carry the titanium off as a gas, and retorts where magnesium takes the chlorine back and leaves titanium as a sponge."
physical:
  length: 300
  width: 150
  height: 30
staff:
  - { profession: profession.plant-operator, count: 6 }
  - { profession: profession.metalworker, count: 2 }
  - { profession: profession.technician, count: 1 }
  - { profession: profession.engineer, count: 1 }
recipes:
  - makes: element.ti
    does: "Ilmenite is smelted to iron and a titanium slag; the slag is chlorinated with carbon; the chloride is reduced with magnesium, which is won back and used again (the Kroll process)."
    inputs:
      - { item: good.ilmenite, quantity: 3.407 }
      - { item: good.carbon, quantity: 0.6107 }
      - { item: element.cl, quantity: 0.3354 }
      - { item: element.o, quantity: 0.5503 }
    outputs:
      - { item: element.fe, quantity: 1.254 }
      - { item: good.carbon-dioxide, quantity: 2.238 }
      - { item: good.chemical-waste, quantity: 0.4118 }
    rate: 0.5
    power: 38700000
basis:
  - { of: [recipes.inputs], tier: sourced, review: true, source: "standards/sources/research_ore_processing.json", note: "For each tonne of titanium dioxide through the chloride route: 1.075 t of it in the feed, 366 kg of coke, 201 kg of chlorine made up. Ilmenite taken as the pure mineral." }
  - { of: [recipes.outputs], tier: derived, review: true, note: "By balance: the iron comes off as metal (smelting ilmenite gives pig iron), the oxygen as carbon dioxide, the chlorine and the titanium lost as waste." }
  - { of: [recipes.power], tier: sourced, review: true, source: "standards/sources/research_machines.json", note: "21.5 MWh a tonne of titanium sponge from its chloride, magnesium recovery and all. Smelting and chlorinating are not counted: no figure was found." }
  - { of: [physical, recipes.rate], tier: invented, review: true, note: "Its size and how much it puts through are chosen. To be reviewed." }
  - { of: [staff], tier: invented, review: true, note: "A furnace or works' watch: six operators, two metalworkers, a technician, an engineer. Coarse: by the kind of plant, not this one; to be reviewed." }
