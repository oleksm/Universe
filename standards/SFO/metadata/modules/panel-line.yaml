# yaml-language-server: $schema=../../schema/module.schema.yaml
identity:
  key: module.panel-line
  name: Panel line
  step: Make panels
  description: "A line that cuts, forms and finishes one kind of panel without stopping. Set up for one panel, it makes nothing else until it is set up again."
physical:
  length: 300
  width: 40
  height: 15
recipes:
  - makes: good.parts
    inputs:
      - { item: good.hot-rolled-strip, quantity: 1.15 }
    outputs:
      - { item: good.scrap, quantity: 0.15 }
    rate: 5.55555555555556
    power: 2000000
basis:
  - { of: [recipes.rate], tier: invented, review: true, note: "A guess, to be reviewed: ten times a yard's plate work, for panels all alike. It sets how fast a gate ring's skin can be made." }
  - { of: [recipes.inputs, recipes.outputs], tier: sourced, source: "https://www.craftsmenind.com/blog/how-to-minimize-waste-and-costs-in-metal-fabrication", note: "Software-nested sheet is 82 to 90% used; 85 taken. Seen only as a search excerpt, not on the page." }
  - { of: [physical, recipes.power], tier: invented, note: "Chosen: no source was looked up for plant of this kind." }
