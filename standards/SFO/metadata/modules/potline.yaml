# yaml-language-server: $schema=../../schema/module.schema.yaml
identity:
  key: module.potline
  name: Potline
  step: Smelt
  description: "A long row of pots in which a strong current, carried in by carbon anodes, takes the oxygen from molten alumina and leaves liquid aluminium."
physical:
  length: 1150
  width: 60
  height: 15
staff:
  - { profession: profession.plant-operator, count: 6 }
  - { profession: profession.metalworker, count: 2 }
  - { profession: profession.technician, count: 1 }
  - { profession: profession.engineer, count: 1 }
recipes:
  - makes: good.liquid-aluminium
    does: "Electric current takes the oxygen from the molten alumina, leaving liquid aluminium."
    inputs:
      - { item: good.alumina, quantity: 1.93 }
      - { item: good.carbon-anode, quantity: 0.45 }
      - { item: element.o, quantity: 0.14 }
    outputs:
      - { item: good.carbon-dioxide, quantity: 1.52 }
    rate: 10.2777777777778
    power: 536000000
basis:
  - { of: [recipes.makes, recipes.rate], tier: sourced, source: "https://en.wikipedia.org/wiki/Aluminium_Bahrain", note: "323,000 t a year for one line of 336 pots." }
  - { of: [recipes.inputs, recipes.outputs], tier: sourced, source: "https://www.energy.gov/sites/prod/files/2013/11/f4/al_theoretical.pdf", note: "1.93 t of alumina and 0.45 t of carbon anode for each tonne, giving 1.52 t of carbon dioxide. Part of the anode burns in air: that oxygen is set to balance." }
  - { of: [recipes.power], tier: sourced, source: "https://en.wikipedia.org/wiki/Aluminium_smelting", note: "13 to 16 MWh for each tonne; 14.5 taken." }
  - { of: [physical.length], tier: sourced, source: "https://en.wikipedia.org/wiki/Qatalum", note: "A potroom 1,150 m long." }
  - { of: [physical], tier: invented, review: true, note: "Its width and height were not found in a source." }
  - { of: [staff], tier: invented, review: true, note: "A furnace or works' watch: six operators, two metalworkers, a technician, an engineer. Coarse: by the kind of plant, not this one; to be reviewed." }
