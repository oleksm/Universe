identity:
  name: Potline
  step: Smelt
  description: "A long row of pots in which a strong current, carried in by carbon anodes, takes the oxygen from molten alumina and leaves liquid aluminium."
size:
  length: 1000
  width: 60
  height: 15
rate:
  throughput: 35
  product: liquid-aluminium
inputs:
  materials:
  - { item: alumina, amount: 1.89 }
  - { item: carbon-anode, amount: 0.334 }
outputs:
  by_products:
  - { item: carbon-dioxide, amount: 1.224 }
needs:
  power: 490
basis:
  - { of: [inputs, outputs], tier: derived, note: "From the chemistry." }
  - { of: [size, rate, needs], tier: invented, note: "Typical of real plant of this kind: approximate, from memory, not taken from a source." }
