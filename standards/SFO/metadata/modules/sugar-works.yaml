# yaml-language-server: $schema=../../schema/module.schema.yaml
identity:
  key: module.sugar-works
  name: "Sugar works"
  step: "Refine sugar"
  description: "Slices or crushes the crop, takes the sugar out in hot water, boils it down and dries the crystals."
physical:
  length: 150
  width: 80
  height: 30
staff:
  - { profession: profession.food-worker, count: 6 }
  - { profession: profession.plant-operator, count: 1 }
recipes:
  - makes: good.sugar
    does: "150 kg of sugar from a tonne of beet."
    inputs:
      - { item: good.sugar-beet, quantity: 6.667 }
    outputs:
      - { item: good.beet-pulp, quantity: 5.667 }
    rate: 2.778
    power: 2000000
  - makes: good.sugar
    does: "A tonne of sugar from nine of cane."
    inputs:
      - { item: good.sugarcane, quantity: 9.0 }
    outputs:
      - { item: good.bagasse, quantity: 8.0 }
    rate: 2.778
    power: 2000000
basis:
  - { of: [recipes, recipes.inputs, recipes.outputs], tier: sourced, source: "standards/sources/research_food_livestock.json", note: "150 kg of sugar a tonne of beet. A tonne of cane holds 135 kg of sucrose; 111 kg got out is a guess. What is left over is by balance." }
  - { of: [physical, recipes.rate, recipes.power], tier: invented, review: true, note: "Its size, how much it puts through and what it draws are chosen. To be reviewed." }
  - { of: [staff], tier: invented, review: true, note: "Six food workers and an operator. Coarse: by the kind of plant, not this one; to be reviewed." }
