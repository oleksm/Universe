# yaml-language-server: $schema=../../schema/module.schema.yaml
identity:
  key: module.hydrogen-plant
  name: Hydrogen plant
  step: Make hydrogen
  description: "Splits water into hydrogen and oxygen by electrolysis."
physical:
  length: 150
  width: 100
  height: 20
rate:
  throughput: 0.525
  product: element.h
inputs:
  materials:
  - { item: good.water, amount: 9 }
outputs:
  by_products:
  - { item: element.o, amount: 8 }
needs:
  power: 100000000
basis:
  - { of: [rate, needs], tier: sourced, source: "https://en.wikipedia.org/wiki/Electrolysis_of_water", note: "53 kWh for each kg of hydrogen, so 100 MW makes 1.89 t an hour." }
  - { of: [inputs, outputs], tier: derived, source: "https://www.rmi.org/hydrogen-reality-check-distilling-green-hydrogens-water-consumption/", note: "From the chemistry: 9 kg of water gives 1 kg of hydrogen and 8 of oxygen. A real plant draws 20 to 30 with its cooling." }
  - { of: [physical], tier: sourced, source: "https://ispt.eu/news/gigawatt-large-potential-for-production-of-green-hydrogen-in-five-dutch-industrial-regions/", note: "0.8 to 1.7 hectares for each 100 MW." }
