# yaml-language-server: $schema=../../schema/module.schema.yaml
identity:
  key: module.hydrogen-plant
  name: Hydrogen plant
  step: Make hydrogen
  description: "Splits water into hydrogen and oxygen by electrolysis."
physical:
  length: 150
  width: 100
  height: 20
staff:
  - { profession: profession.chemist, count: 2 }
  - { profession: profession.plant-operator, count: 4 }
  - { profession: profession.technician, count: 1 }
recipes:
  - makes: element.h
    does: "Water is split to make the hydrogen for the next step, and the water that step gives off comes back here."
    inputs:
      - { item: good.water, quantity: 9 }
    outputs:
      - { item: element.o, quantity: 8 }
    rate: 0.525
    power: 100000000
basis:
  - { of: [recipes.makes, recipes.rate, recipes.power], tier: sourced, source: "https://en.wikipedia.org/wiki/Electrolysis_of_water", note: "53 kWh for each kg of hydrogen, so 100 MW makes 1.89 t an hour." }
  - { of: [recipes.inputs, recipes.outputs], tier: derived, source: "https://www.rmi.org/hydrogen-reality-check-distilling-green-hydrogens-water-consumption/", note: "From the chemistry: 9 kg of water gives 1 kg of hydrogen and 8 of oxygen. A real plant draws 20 to 30 with its cooling." }
  - { of: [physical], tier: sourced, source: "https://ispt.eu/news/gigawatt-large-potential-for-production-of-green-hydrogen-in-five-dutch-industrial-regions/", note: "0.8 to 1.7 hectares for each 100 MW." }
  - { of: [staff], tier: invented, review: true, note: "A chemical plant's watch: two chemists, four operators, a technician. Coarse: by the kind of plant, not this one; to be reviewed." }
