# yaml-language-server: $schema=../../schema/module.schema.yaml
identity:
  key: module.machining-centre
  name: Machining centre
  step: Machine
  description: "Lathes and mills that cut tube, bar and forgings to a part's size. What it takes and cuts away depends on the part: each part's record says."
physical:
  length: 20
  width: 10
  height: 6
recipes:
  - makes: good.parts
    does: "Whatever part it is given to make: what goes in is the part's own (what it is made from), and what is cut away comes out as scrap of that metal."
    rate: 0.138888888888889
    power: 130000.0
basis:
  - { of: [recipes.power], tier: sourced, source: "https://www.makino.com/en-us/machine-technology/machines/horizontal-5-axis/mag3", note: "A large five-axis machining centre has a 130 kW spindle. The spindle only." }
  - { of: [physical, recipes.makes, recipes.rate, recipes.power], tier: invented, note: "Chosen: no source was looked up for plant of this kind." }
