# yaml-language-server: $schema=../../schema/module.schema.yaml
identity:
  key: module.film-works
  name: "Film works"
  step: "Make insulation film"
  description: "Draws plastic into film a few thousandths of a millimetre thick, lays aluminium on it as vapour in a vacuum, and stacks the layers into blankets."
physical:
  length: 120
  width: 40
  height: 10
recipes:
  - makes: stock.mli-fl
    does: "Plastic is drawn to film, coated with a tenth of a micron of aluminium in vacuum, crinkled and stacked."
    inputs:
      - { item: good.polyethylene, quantity: 0.97 }
      - { item: stock.al6061-sh-2, quantity: 0.031 }
    outputs:
      - { item: stock.al6061-scrap, quantity: 0.001 }
    rate: 0.05
    power: 500000
basis:
  - { of: [recipes.inputs], tier: derived, review: true, source: "standards/sources/research_ship_materials.json", note: "A layer of aluminised film weighs 9.3 g a m2, of which 0.27 g is aluminium (1,000 angstroms of it): 3%. Real blankets are of polyester or polyimide film, which the registry cannot make yet: taken as its one plastic." }
  - { of: [recipes.outputs, recipes.power], tier: invented, review: true, note: "Chosen. To be reviewed." }
  - { of: [physical, recipes.rate], tier: invented, review: true, note: "Its size and how much it puts through are chosen. To be reviewed." }
