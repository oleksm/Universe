# yaml-language-server: $schema=../../schema/module.schema.yaml
identity:
  key: module.soap-works
  name: "Soap works"
  step: "Boil soap"
  description: "Kettles where fat is boiled with caustic soda."
physical:
  length: 50
  width: 30
  height: 12
staff:
  - { profession: profession.food-worker, count: 6 }
  - { profession: profession.plant-operator, count: 1 }
recipes:
  - makes: good.soap
    does: "Tallow and caustic soda are boiled together; the soap is salted out and the glycerine run off."
    inputs:
      - { item: good.tallow, quantity: 0.9697 }
      - { item: good.caustic-soda, quantity: 0.1305 }
    outputs:
      - { item: good.glycerine, quantity: 0.1002 }
    rate: 0.5
    power: 500000
  - makes: good.soap
    does: "Wool grease from the scourings, saponified."
    inputs:
      - { item: good.wool-scourings, quantity: 2.0 }
      - { item: good.caustic-soda, quantity: 0.13 }
    outputs:
      - { item: good.glycerine, quantity: 0.1 }
      - { item: good.tailings, quantity: 0.9 }
    rate: 0.3
    power: 400000
life: 788940000
basis:
  - { of: [recipes.inputs, recipes.outputs], tier: derived, source: "standards/sources/research_chemicals.json", note: "From the chemistry, the fat taken as the commonest in tallow (tristearin): 135 g of caustic soda a kg of fat. Lard is reported to take 137 to 145." }
  - { of: [physical, recipes.rate, recipes.power], tier: invented, review: true, note: "Chosen. To be reviewed." }
  - { of: [staff], tier: invented, review: true, note: "Six food workers and an operator. Coarse: by the kind of plant, not this one; to be reviewed." }
  - { of: [recipes], tier: invented, review: true, note: "Scourings are half lanolin; the dirt goes out as tailings. Added 2026-10-06 so that nothing given off is left with no taker (the Takers report); the figures balance by mass and are chosen." }
  - { of: [life], rule: rule.life-plant }
