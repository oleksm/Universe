# yaml-language-server: $schema=../../schema/module.schema.yaml
identity:
  name: Cutting table
  step: Cut to shape
  description: "A flat bed where sheet and plate are cut to each panel's outline. What is left between the outlines is scrap."
size:
  length: 40
  width: 15
  height: 5
rate:
  throughput: 2
  product: cut-blanks
inputs:
  materials:
  - { item: sheet-and-plate, amount: 1.15 }
outputs:
  by_products:
  - { item: scrap, amount: 0.15 }
needs:
  power: 0.027
basis:
  - { of: [needs.power], tier: sourced, source: "https://www.trumpf.com/en_INT/products/machines-systems/2d-laser-cutting-machines/trulaser-3030-fiber-3040-fiber-3060-fiber-3080-fiber/", note: "A laser cutting machine with a 24 kW laser draws 27 kW on average; its largest bed is 8 by 2.5 m." }
  - { of: [inputs, outputs], tier: sourced, source: "https://www.craftsmenind.com/blog/how-to-minimize-waste-and-costs-in-metal-fabrication", note: "Software-nested sheet is 82 to 90% used; 85 taken. Seen only as a search excerpt, not on the page." }
  - { of: [size, rate, needs], tier: invented, note: "Chosen: no source was looked up for plant of this kind." }
