# yaml-language-server: $schema=../../schema/module.schema.yaml
# Its work is taken as part of the module that makes the part (cutting and forming are that module's
# preparation), so it has no recipe of its own. Kept: it is plant a yard has.
# What was sourced for its recipe, kept for when cutting is described again: power 27 kW, 15% of the stock lost.
#   https://www.trumpf.com/en_INT/products/machines-systems/2d-laser-cutting-machines/trulaser-3030-fiber-3040-fiber-3060-fiber-3080-fiber/: A laser cutting machine with a 24 kW laser draws 27 kW on average; its largest bed is 8 by 2.5 m.
#   https://www.craftsmenind.com/blog/how-to-minimize-waste-and-costs-in-metal-fabrication: Software-nested sheet is 82 to 90% used; 85 taken. Seen only as a search excerpt, not on the page.
identity:
  key: module.cutting-table
  name: Cutting table
  step: Cut to shape
  description: "A flat bed where sheet and plate are cut to each panel's outline. What is left between the outlines is scrap."
physical:
  length: 40
  width: 15
  height: 5
basis:
  - { of: [physical], tier: invented, note: "Chosen: no source was looked up for plant of this kind." }
