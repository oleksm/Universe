# yaml-language-server: $schema=../../schema/module.schema.yaml
# Its animals breathe the air and drink the water of the place it stands in: from: place. Sealed, it would take both from stores.
identity:
  key: module.livestock-barn
  name: "Livestock barn"
  step: "Raise animals"
  description: "Sheds, yards and feed stores for animals raised on feed and hay brought to them. Set to one kind of animal at a time."
physical:
  length: 200
  width: 50
  height: 8
staff:
  - { profession: profession.farmer, count: 2 }
recipes:
  - makes: good.live-pigs
    does: "About 5,000 pigs a year raised to 125 kg, on 3 kg of feed for each kg they gain by the time they are killed, and 9 litres of water a day each."
    inputs:
      - { item: good.animal-feed, quantity: 3.0 }
      - { item: good.water, quantity: 8.0, from: place }
      - { item: element.o, quantity: 1.2, from: place }
    outputs:
      - { item: good.carbon-dioxide, quantity: 1.65 }
      - { item: good.manure, quantity: 9.55 }
    rate: 0.01981
    power: 50000
  - makes: good.live-chickens
    does: "About 30,000 birds at a time, raised to 3 kg in 47 days, six and a half flocks a year, on 1.7 kg of feed for each kg."
    inputs:
      - { item: good.animal-feed, quantity: 1.7 }
      - { item: good.water, quantity: 4.4, from: place }
      - { item: element.o, quantity: 0.68, from: place }
    outputs:
      - { item: good.carbon-dioxide, quantity: 0.935 }
      - { item: good.manure, quantity: 4.845 }
    rate: 0.01854
    power: 50000
  - makes: good.eggs
    does: "About 30,000 laying hens, 330 eggs a year each (18.7 kg at 57 g an egg), on 2 kg of feed for each kg of eggs."
    inputs:
      - { item: good.animal-feed, quantity: 2.0 }
      - { item: good.water, quantity: 4.9, from: place }
      - { item: element.o, quantity: 0.8, from: place }
    outputs:
      - { item: good.carbon-dioxide, quantity: 1.1 }
      - { item: good.manure, quantity: 5.6 }
    rate: 0.01775
    power: 50000
  - makes: good.milk
    does: "About 200 cows giving 10 t of milk a year each (a high-yielding herd; the United States averages 9,954 kg), on 0.7 kg of dry feed for each kg of milk and 115 litres of water a day."
    inputs:
      - { item: good.hay, quantity: 0.45 }
      - { item: good.animal-feed, quantity: 0.35 }
      - { item: good.water, quantity: 4.2, from: place }
      - { item: element.o, quantity: 0.32, from: place }
    outputs:
      - { item: good.carbon-dioxide, quantity: 0.44 }
      - { item: good.manure, quantity: 3.88 }
    rate: 0.06306
    power: 50000
  - makes: good.live-cattle
    does: "About 1,000 head fattened a year, on 6.5 kg of hay and feed for each kg they gain (4.5 to 7.5 is usual) and 41 litres of water a day."
    inputs:
      - { item: good.hay, quantity: 4.5 }
      - { item: good.animal-feed, quantity: 2.0 }
      - { item: good.water, quantity: 29.0, from: place }
      - { item: element.o, quantity: 2.6, from: place }
    outputs:
      - { item: good.carbon-dioxide, quantity: 3.575 }
      - { item: good.manure, quantity: 33.52 }
    rate: 0.01584
    power: 50000
  - makes: good.live-sheep
    does: "A flock raised for meat, on 5.5 kg of hay and feed for each kg they gain (5 to 6 on good forage)."
    inputs:
      - { item: good.hay, quantity: 4.5 }
      - { item: good.animal-feed, quantity: 1.0 }
      - { item: good.water, quantity: 15.0, from: place }
      - { item: element.o, quantity: 2.2, from: place }
    outputs:
      - { item: good.carbon-dioxide, quantity: 3.025 }
      - { item: good.manure, quantity: 18.68 }
    rate: 0.004753
    power: 50000
  - makes: good.wool
    does: "About 2,000 sheep kept for their fleece: 4.5 kg of greasy wool a head a year (3 to 6 for a Merino), on about 1.2 kg of hay a day each. The hay and water are guesses."
    inputs:
      - { item: good.hay, quantity: 100.0 }
      - { item: good.water, quantity: 320.0, from: place }
      - { item: element.o, quantity: 40.0, from: place }
    outputs:
      - { item: good.carbon-dioxide, quantity: 55.0 }
      - { item: good.manure, quantity: 404.0 }
    rate: 0.0002852
    power: 50000
life: 788940000
basis:
  - { of: [recipes, recipes.rate, recipes.inputs], tier: sourced, source: "standards/sources/research_food_livestock.json", note: "Feed for each kg, water a head, eggs a hen, milk a cow, weights at slaughter: the file named. The herd and flock sizes, and so the barn's rate, are chosen. Sheep's water for each kg gained is worked out from a guess at how fast they gain." }
  - { of: [recipes.outputs], tier: derived, review: true, note: "By balance: what goes in and does not leave as the animal or its breath is manure. Breath is taken as 0.55 kg of carbon dioxide for each kg of feed, a guess." }
  - { of: [physical, recipes.power], tier: invented, review: true, note: "Chosen. To be reviewed." }
  - { of: [staff], tier: invented, review: true, note: "Two farmers to a unit of ground or barn, the family farm's measure. Coarse: by the kind of plant, not this one; to be reviewed." }
  - { of: [life], tier: invented, review: true, note: "Twenty-five years for industrial plant, as plant is depreciated on Earth; then it is rebuilt. Chosen; the user's rule that everything made has a life." }
