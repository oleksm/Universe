# yaml-language-server: $schema=../../schema/module.schema.yaml
identity:
  key: module.casting-bay
  name: Casting bay
  step: Cast
  description: "A crane pours the ladle into moulds. The steel solidifies and is stripped out as ingots."
physical:
  length: 100
  width: 40
  height: 35
staff:
  - { profession: profession.plant-operator, count: 6 }
  - { profession: profession.metalworker, count: 2 }
  - { profession: profession.technician, count: 1 }
  - { profession: profession.engineer, count: 1 }
recipes:
  - makes: stock.sta36-ingot
    does: "The steel is poured into moulds and stripped out as ingots."
    inputs:
      - { item: good.refined-steel-a36, quantity: 1.16 }
    outputs:
      - { item: stock.sta36-scrap, quantity: 0.16 }
    rate: 27.7777777777778
    batch: 80000
    power: 1000000
  - makes: stock.st4340-ingot
    does: "The steel is poured into moulds and stripped out as ingots."
    inputs:
      - { item: good.refined-steel-4340, quantity: 1.16 }
    outputs:
      - { item: stock.st4340-scrap, quantity: 0.16 }
    rate: 27.7777777777778
    batch: 80000
    power: 1000000
  - makes: stock.st304-ingot
    does: "The steel is poured into moulds and stripped out as ingots."
    inputs:
      - { item: good.refined-steel-304, quantity: 1.16 }
    outputs:
      - { item: stock.st304-scrap, quantity: 0.16 }
    rate: 27.7777777777778
    batch: 80000
    power: 1000000
basis:
  - { of: [recipes], tier: invented, review: true, note: "One set of figures (rate, power, what is lost), used for each metal it works: a guess, to be reviewed. Each metal has its own." }
  - { of: [recipes.inputs, recipes.outputs], tier: sourced, source: "https://www.britannica.com/technology/steel/Casting-procedures", note: "About 86% of the liquid steel becomes sound ingot; the head of each ingot is cut off as scrap. Read from a search excerpt, not the page itself." }
  - { of: [recipes.makes, recipes.rate, recipes.batch, physical, recipes.power], tier: invented, review: true, note: "Not found in a source: approximate, from memory." }
  - { of: [staff], tier: invented, review: true, note: "A furnace or works' watch: six operators, two metalworkers, a technician, an engineer. Coarse: by the kind of plant, not this one; to be reviewed." }
