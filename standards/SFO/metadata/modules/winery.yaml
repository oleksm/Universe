# yaml-language-server: $schema=../../schema/module.schema.yaml
identity:
  key: module.winery
  name: "Winery"
  step: "Make wine"
  description: "Crushes grapes, ferments the juice and keeps the wine."
physical:
  length: 60
  width: 40
  height: 10
staff:
  - { profession: profession.food-worker, count: 6 }
  - { profession: profession.plant-operator, count: 1 }
recipes:
  - makes: good.wine
    does: "1.3 to 1.6 kg of grapes to the litre."
    inputs:
      - { item: good.grapes, quantity: 1.4 }
    outputs:
      - { item: good.pomace, quantity: 0.4 }
    rate: 0.2778
    power: 100000
life: 788940000
basis:
  - { of: [recipes, recipes.inputs, recipes.outputs], tier: sourced, source: "standards/sources/research_food_livestock.json", note: "1.3 to 1.6 kg of grapes a litre. What is left over is by balance." }
  - { of: [physical, recipes.rate, recipes.power], tier: invented, review: true, note: "Its size, how much it puts through and what it draws are chosen. To be reviewed." }
  - { of: [staff], tier: invented, review: true, note: "Six food workers and an operator. Coarse: by the kind of plant, not this one; to be reviewed." }
  - { of: [life], rule: rule.life-plant }
