# yaml-language-server: $schema=../../schema/module.schema.yaml
identity:
  name: Shaft furnace
  step: Reduce
  description: "A tall furnace where hot hydrogen strips the oxygen out of ore pellets at 800 to 1,000 °C, leaving solid sponge iron."
size:
  length: 150
  width: 100
  height: 120
rate:
  throughput: 125
  product: sponge-iron
inputs:
  materials:
  - { item: iron-ore-pellets, amount: 1.43 }
  - { item: H, amount: 0.054 }
outputs:
  by_products:
  - { item: water, amount: 0.484 }
needs:
  power: 12
basis:
  note: "What goes in and comes out follows from the chemistry (iron oxide and hydrogen to iron and water), taking the pellets as pure iron oxide. Its size, rate and power are typical of real plant of this kind: approximate figures from memory, not taken from a source."
