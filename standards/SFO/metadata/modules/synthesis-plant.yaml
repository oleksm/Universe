# yaml-language-server: $schema=../../schema/module.schema.yaml
identity:
  key: module.synthesis-plant
  name: "Synthesis plant"
  step: "Make plastics"
  description: "Reactors that build carbon dioxide and hydrogen up into methanol, and methanol into plastics. Where there is no oil, this is where plastic comes from."
physical:
  length: 300
  width: 200
  height: 50
staff:
  - { profession: profession.chemist, count: 2 }
  - { profession: profession.plant-operator, count: 4 }
  - { profession: profession.technician, count: 1 }
recipes:
  - makes: good.methanol
    does: "Carbon dioxide and hydrogen over a copper catalyst give methanol and water."
    inputs:
      - { item: good.carbon-dioxide, quantity: 1.373 }
      - { item: element.h, quantity: 0.1888 }
    outputs:
      - { item: good.water, quantity: 0.5622 }
    rate: 3.0
    power: 10800000
  - makes: good.polyethylene
    does: "Methanol is turned to ethylene, and the ethylene joined into long chains."
    inputs:
      - { item: good.methanol, quantity: 2.325 }
    outputs:
      - { item: good.water, quantity: 1.307 }
      - { item: good.methane, quantity: 0.018 }
    rate: 3.0
    power: 21600000
  - makes: good.pvc
    does: "Methanol is turned to ethylene, chlorine is added, and the vinyl chloride joined into chains."
    inputs:
      - { item: good.methanol, quantity: 1.025 }
      - { item: element.cl, quantity: 0.5672 }
      - { item: element.o, quantity: 0.128 }
    outputs:
      - { item: good.water, quantity: 0.7206 }
    rate: 3.0
    power: 21600000
basis:
  - { of: [recipes, recipes.inputs, recipes.outputs], tier: derived, review: true, source: "standards/sources/research_chemicals.json", note: "From the chemistry (a plant in China takes 1.5 t of carbon dioxide and 0.2 t of hydrogen a tonne of methanol, a little over it). 2.28 t of methanol a tonne of ethylene is the chemistry's least; plants take more, and what they lose is taken here as 1.8% to gas, the polymer makers' loss alone. PVC is 57% chlorine." }
  - { of: [recipes.power], tier: invented, review: true, source: "standards/sources/research_chemicals.json", note: "1 kWh a kg of methanol and 2 a kg of plastic: guesses. Joining ethylene takes 1,075 kWh a tonne and vinyl chloride about 3.4 GJ; what turning methanol to ethylene takes was not found. To be reviewed." }
  - { of: [physical, recipes.rate], tier: invented, review: true, note: "Its size and how much it puts through are chosen. To be reviewed." }
  - { of: [staff], tier: invented, review: true, note: "A chemical plant's watch: two chemists, four operators, a technician. Coarse: by the kind of plant, not this one; to be reviewed." }
