size:
  length: 100
  width: 40
  height: 35
rate:
  throughput: 100
  batch: 100
  product: liquid steel
inputs:
  materials:
  - { name: "Sponge iron", amount: 1.1 }
  - { name: "Lime", amount: 0.05 }
  - { item: C, amount: 0.015 }
  - { name: "Graphite electrode", amount: 0.0015 }
outputs:
  by_products:
  - { name: "Slag", amount: 0.15 }
  - { name: "Dust", amount: 0.015 }
