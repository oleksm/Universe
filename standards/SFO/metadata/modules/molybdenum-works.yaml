# yaml-language-server: $schema=../../schema/module.schema.yaml
identity:
  key: module.molybdenum-works
  name: "Molybdenum works"
  step: "Win molybdenum"
  description: "Hoar furnaces that roast the sulphur out of molybdenite, and furnaces where hydrogen takes the oxygen from what is left."
physical:
  length: 100
  width: 50
  height: 25
staff:
  - { profession: profession.plant-operator, count: 6 }
  - { profession: profession.metalworker, count: 2 }
  - { profession: profession.technician, count: 1 }
  - { profession: profession.engineer, count: 1 }
recipes:
  - makes: element.mo
    does: "Concentrate is roasted at 700 C to the oxide, which burns of itself, and the oxide reduced."
    inputs:
      - { item: good.molybdenum-concentrate, quantity: 2.062 }
    outputs:
      - { item: element.s, quantity: 0.6887 }
      - { item: good.tailings, quantity: 0.3732 }
    rate: 0.2
    power: 1000000
life: 788940000
basis:
  - { of: [recipes, recipes.inputs, recipes.outputs, recipes.power], tier: invented, review: true, source: "standards/sources/research_ore_processing.json", note: "Molybdenite is 60% molybdenum and 40% sulphur; a concentrate of 50%, the 97% won and 5 MJ a kg are guesses (roasting gives its own heat). The oxygen that comes and goes is not counted. To be reviewed." }
  - { of: [physical, recipes.rate], tier: invented, review: true, note: "Its size and how much it puts through are chosen. To be reviewed." }
  - { of: [staff], tier: invented, review: true, note: "A furnace or works' watch: six operators, two metalworkers, a technician, an engineer. Coarse: by the kind of plant, not this one; to be reviewed." }
  - { of: [life], rule: rule.life-plant }
