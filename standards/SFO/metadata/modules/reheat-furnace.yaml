identity:
  key: module.reheat-furnace
  name: Reheat furnace
  step: Heat
  description: "Brings ingots up to the temperature they are worked at."
size:
  length: 60
  width: 20
  height: 12
rate:
  throughput: 120
  product: hot-ingot
inputs:
  materials:
  - { item: ingot, amount: 1.0 }
needs:
  power: 45
basis:
  - { of: [rate], tier: sourced, source: "https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2022-12/FMP%20BREF_Final%20Version.pdf", note: "100 to 420 t/h for one furnace." }
  - { of: [needs], tier: sourced, source: "https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2022-12/FMP%20BREF_Final%20Version.pdf", note: "1,200 to 1,500 MJ of heat for each tonne at best practice; 1,350 taken. Heat is counted as power: there is no fuel to burn." }
  - { of: [inputs, size], tier: invented, note: "No loss in heating is counted. Its footprint was not found in a source: approximate, from memory." }
