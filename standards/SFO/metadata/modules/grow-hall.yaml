# yaml-language-server: $schema=../../schema/module.schema.yaml
identity:
  key: module.grow-hall
  name: "Grow hall"
  step: "Grow under lamps"
  description: "A sealed hall with a hectare of growing beds in tiers under lamps, for where there is no sky to farm under. Everything a crop is made of has to be brought to it: carbon dioxide, water, nutrients, and above all light."
physical:
  length: 100
  width: 50
  height: 20
recipes:
  - makes: good.lettuce
    does: "Grown in tiers under lamps, sealed from outside. 80 to 120 kg a m2 a year in a vertical farm; the low end taken. 250 umol/m2/s for 16 hours."
    inputs:
      - { item: good.carbon-dioxide, quantity: 0.06892 }
      - { item: good.water, quantity: 0.9852 }
      - { item: good.fertiliser, quantity: 0.001439 }
    outputs:
      - { item: element.o, quantity: 0.05117 }
      - { item: good.crop-residue, quantity: 0.00436 }
    rate: 0.02535
    power: 890000.0
  - makes: good.spinach
    does: "Grown in tiers under lamps, sealed from outside. Taken as lettuce: no figure of its own was found. To be reviewed."
    inputs:
      - { item: good.carbon-dioxide, quantity: 0.1359 }
      - { item: good.water, quantity: 0.9708 }
      - { item: good.fertiliser, quantity: 0.002838 }
    outputs:
      - { item: element.o, quantity: 0.1009 }
      - { item: good.crop-residue, quantity: 0.0086 }
    rate: 0.02535
    power: 890000.0
  - makes: good.tomatoes
    does: "Grown in tiers under lamps, sealed from outside. 60 to 70 kg a m2 a year in a Dutch glasshouse; taken as reached under lamps alone at 750 umol/m2/s for 14 hours (a guess)."
    inputs:
      - { item: good.carbon-dioxide, quantity: 0.1369 }
      - { item: good.water, quantity: 1.002 }
      - { item: good.fertiliser, quantity: 0.002859 }
    outputs:
      - { item: element.o, quantity: 0.1017 }
      - { item: good.crop-residue, quantity: 0.0405 }
    rate: 0.0206
    power: 2340000.0
  - makes: good.peppers
    does: "Grown in tiers under lamps, sealed from outside. 25 to 36 kg a m2 a year under 160 to 280 W/m2 of lamps (a heated greenhouse in Iceland)."
    inputs:
      - { item: good.carbon-dioxide, quantity: 0.1405 }
      - { item: good.water, quantity: 0.9976 }
      - { item: good.fertiliser, quantity: 0.002933 }
    outputs:
      - { item: element.o, quantity: 0.1043 }
      - { item: good.crop-residue, quantity: 0.03666 }
    rate: 0.009506
    power: 2200000
  - makes: good.potatoes
    does: "Grown in tiers under lamps, sealed from outside. 20 g of dry tuber a m2 a day, the best of NASA's chamber crops (7.3 to 20), at 800 umol/m2/s for 12 hours."
    inputs:
      - { item: good.carbon-dioxide, quantity: 0.3975 }
      - { item: good.water, quantity: 0.9585 }
      - { item: good.fertiliser, quantity: 0.008298 }
    outputs:
      - { item: element.o, quantity: 0.2951 }
      - { item: good.crop-residue, quantity: 0.0691 }
    rate: 0.01115
    power: 2140000.0
  - makes: good.wheat
    does: "Grown in tiers under lamps, sealed from outside. 12.6 g of dry grain a m2 a day, the best of NASA's chamber crops (6.7 to 12.6), at 1,000 umol/m2/s for 22 hours. The record is 60."
    inputs:
      - { item: good.carbon-dioxide, quantity: 2.558 }
      - { item: good.water, quantity: 1.178 }
      - { item: good.fertiliser, quantity: 0.0534 }
    outputs:
      - { item: element.o, quantity: 1.899 }
      - { item: good.crop-residue, quantity: 0.89 }
    rate: 0.001639
    power: 4910000.0
  - makes: good.soybeans
    does: "Grown in tiers under lamps, sealed from outside. 6 g of dry seed a m2 a day, the best of NASA's chamber crops (3.4 to 6), at 700 umol/m2/s for 11 hours."
    inputs:
      - { item: good.carbon-dioxide, quantity: 4.054 }
      - { item: good.water, quantity: 1.783 }
      - { item: good.fertiliser, quantity: 0.08463 }
    outputs:
      - { item: element.o, quantity: 3.01 }
      - { item: good.crop-residue, quantity: 1.911 }
    rate: 0.000763
    power: 1720000.0
basis:
  - { of: [recipes, recipes.rate, recipes.power], tier: derived, review: true, source: "standards/sources/research_food_light.json", note: "Yields as measured under lamps or in high glasshouses (each recipe says which); spinach is taken as lettuce. Power: the light each crop was grown under, at 2.8 umol a joule (LED fixtures reach 2.5 to 3.0), and half as much again for cooling and pumps, which is a guess. To be reviewed." }
  - { of: [recipes.inputs, recipes.outputs], tier: derived, review: true, source: "standards/sources/research_food_crops.json", note: "As a field's, from what a plant is made of; all its nutrients are brought (3% of the dry plant, a guess)." }
  - { of: [physical], tier: invented, review: true, note: "Chosen: a hectare of beds in tiers." }
