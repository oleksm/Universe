# yaml-language-server: $schema=../../schema/module.schema.yaml
identity:
  key: module.grow-hall
  name: "Hydroponic hall"
  step: "Grow sealed, under lamps"
  description: "An airtight hall with a hectare of growing troughs in tiers under lamps. It needs no sky, no soil and no weather, so it can stand on any world, in orbit or underground. Everything a crop is made of is brought to it: carbon dioxide, water, nutrients, a medium for the roots, and above all light. All the power it takes in ends as heat, which has to be got out again: easily on a cold world, dearly on a hot one."
physical:
  length: 100
  width: 50
  height: 20
climate:
  holds: 295
  efficiency: 0.5
staff:
  - { profession: profession.farmer, count: 2 }
recipes:
