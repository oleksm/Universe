identity:
  key: module.filament-winder
  name: Filament winder
  step: Wind carbon tube
  description: "Lays resin-wet carbon tow round a turning mandrel at set angles, then cures the tube in an oven and draws the mandrel."
physical:
  length: 30
  width: 8
  height: 5
staff:
  - { profession: profession.machinist, count: 4 }
  - { profession: profession.plant-operator, count: 4 }
  - { profession: profession.technician, count: 1 }
