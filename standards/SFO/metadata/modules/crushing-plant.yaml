# yaml-language-server: $schema=../../schema/module.schema.yaml
identity:
  key: module.crushing-plant
  name: "Crushing plant"
  step: "Crush rock"
  description: "Jaws, cones and screens that break rock down and sort it by size. Any hard rock will do, and asteroid rock is hard."
physical:
  length: 80
  width: 40
  height: 20
staff:
  - { profession: profession.plant-operator, count: 4 }
  - { profession: profession.miner, count: 2 }
recipes:
  - makes: good.aggregate
    does: "Rock is crushed and screened; the fines are thrown out."
    inputs:
      - { item: good.stony-ore, quantity: 1.02 }
    outputs:
      - { item: good.tailings, quantity: 0.02 }
    rate: 50.0
    power: 351000
  - makes: good.aggregate
    does: "Furnace slag, cooled, is crushed and screened like rock."
    inputs:
      - { item: good.slag, quantity: 1.0 }
    rate: 50.0
    power: 351000
basis:
  - { of: [recipes.power], tier: sourced, source: "standards/sources/research_machines.json", note: "1.95 kWh a tonne: a crushed-stone quarry takes 1.7 to 2.2 (US Department of Energy)." }
  - { of: [physical, recipes, recipes.rate, recipes.inputs, recipes.outputs], tier: invented, review: true, note: "Its size and rate are chosen; the 2% lost as fines is a guess. To be reviewed." }
  - { of: [staff], tier: invented, review: true, note: "Operators and a couple of miners. Coarse: by the kind of plant, not this one; to be reviewed." }
