# yaml-language-server: $schema=../../schema/module.schema.yaml
identity:
  key: module.composites-works
  name: "Composites works"
  step: "Make carbon composite"
  description: "Ovens that bake plastic fibre to carbon, looms that lay it up with resin, and autoclaves that cure the sheets under heat and pressure."
physical:
  length: 200
  width: 60
  height: 15
staff:
  - { profession: profession.chemist, count: 2 }
  - { profession: profession.plant-operator, count: 4 }
  - { profession: profession.technician, count: 1 }
recipes:
  - makes: stock.cfc-pl-3
    does: "Plastic fibre is held at 300 C, then baked to carbon at up to 1,800 C, losing half its weight; the fibre is laid in resin and cured at 180 C under pressure."
    inputs:
      - { item: good.polyethylene, quantity: 1.617 }
    outputs:
      - { item: good.methane, quantity: 0.6175 }
    rate: 0.05
    power: 5500000
  - makes: stock.cfc-sh-0p5
    does: "Four plies of carbon laid up and cured to a half-millimetre sheet."
    inputs:
      - { item: good.polyethylene, quantity: 1.617 }
    outputs:
      - { item: good.methane, quantity: 0.6175 }
    rate: 0.05
    power: 5500000
  - makes: stock.aramid-fb
    does: "The aramid polymer spun from solution into fibre and wound: the carbon route's sister line."
    inputs:
      - { item: good.polyethylene, quantity: 1.3 }
    outputs:
      - { item: good.methane, quantity: 0.3 }
    rate: 0.05
    power: 3000000
life: 788940000
basis:
  - { of: [recipes.inputs, recipes.outputs], tier: sourced, review: true, source: "standards/sources/research_ship_materials.json", note: "1.95 kg of fibre for each kg of carbon fibre; a laminate is 57% fibre by volume, 65% by weight, the rest resin (Hexcel's aerospace sheet). Real fibre is polyacrylonitrile and the resin epoxy, neither of which the registry can make yet: both are taken as its one plastic, and what bakes off as gas." }
  - { of: [recipes.power], tier: sourced, review: true, source: "standards/sources/research_ship_materials.json", note: "170 MJ for each kg of carbon fibre, so 110 for each kg of sheet. Curing is not counted: no figure was found." }
  - { of: [physical, recipes.rate], tier: invented, review: true, note: "Its size and how much it puts through are chosen. To be reviewed." }
  - { of: [staff], tier: invented, review: true, note: "A chemical plant's watch: two chemists, four operators, a technician. Coarse: by the kind of plant, not this one; to be reviewed." }
  - { of: [life], tier: invented, review: true, note: "Twenty-five years for industrial plant, as plant is depreciated on Earth; then it is rebuilt. Chosen; the user's rule that everything made has a life." }
