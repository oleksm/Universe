# yaml-language-server: $schema=../../schema/module.schema.yaml
identity:
  key: module.bakery
  name: "Bakery"
  step: "Bake bread"
  description: "Mixes, proves and bakes."
physical:
  length: 50
  width: 30
  height: 10
recipes:
  - makes: good.bread
    does: "A kilogram of flour makes a kilogram and a half of bread; some water goes off in the oven."
    inputs:
      - { item: good.flour, quantity: 0.667 }
      - { item: good.water, quantity: 0.5 }
    outputs:
      - { item: good.water, quantity: 0.167 }
    rate: 0.5556
    power: 300000
basis:
  - { of: [recipes, recipes.inputs, recipes.outputs], tier: sourced, source: "standards/sources/research_food_livestock.json", note: "A kg of flour makes 1.5 kg of bread; the water that goes off is by balance. What is left over is by balance." }
  - { of: [physical, recipes.rate, recipes.power], tier: invented, review: true, note: "Its size, how much it puts through and what it draws are chosen. To be reviewed." }
