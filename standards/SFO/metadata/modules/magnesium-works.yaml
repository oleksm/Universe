# yaml-language-server: $schema=../../schema/module.schema.yaml
identity:
  key: module.magnesium-works
  name: "Magnesium works"
  step: "Win magnesium"
  description: "Kilns that burn magnesite to magnesia, chlorinators, and cells where current parts molten magnesium chloride. The chlorine goes round again."
physical:
  length: 200
  width: 100
  height: 25
staff:
  - { profession: profession.plant-operator, count: 6 }
  - { profession: profession.metalworker, count: 2 }
  - { profession: profession.technician, count: 1 }
  - { profession: profession.engineer, count: 1 }
recipes:
  - makes: element.mg
    does: "Magnesite is burnt to magnesia, made into the chloride and split by current."
    inputs:
      - { item: good.magnesite-ore, quantity: 4.094 }
    outputs:
      - { item: good.carbon-dioxide, quantity: 2.009 }
      - { item: element.o, quantity: 0.6583 }
      - { item: good.tailings, quantity: 0.427 }
    rate: 0.5
    power: 33300000
life: 788940000
basis:
  - { of: [recipes.power], tier: sourced, review: true, source: "standards/sources/research_ore_processing.json", note: "18 to 19 kWh a kg of magnesium in the cells (as from sea-water chloride)." }
  - { of: [recipes.inputs, recipes.outputs], tier: derived, review: true, note: "By the ore's grade (45% magnesia, as the simulation has it), nine tenths won: the carbon dioxide of the carbonate and the oxygen of the magnesia leave; the rest is tailings." }
  - { of: [physical, recipes.rate], tier: invented, review: true, note: "Its size and how much it puts through are chosen. To be reviewed." }
  - { of: [staff], tier: invented, review: true, note: "A furnace or works' watch: six operators, two metalworkers, a technician, an engineer. Coarse: by the kind of plant, not this one; to be reviewed." }
  - { of: [life], rule: rule.life-plant }
