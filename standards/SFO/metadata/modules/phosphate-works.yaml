# yaml-language-server: $schema=../../schema/module.schema.yaml
identity:
  key: module.phosphate-works
  name: "Phosphate works"
  step: "Make phosphate"
  description: "Tanks where sulphuric acid takes the phosphate out of ground rock, and filters that part the acid made from the gypsum left."
physical:
  length: 200
  width: 100
  height: 25
staff:
  - { profession: profession.plant-operator, count: 6 }
  - { profession: profession.metalworker, count: 2 }
  - { profession: profession.technician, count: 1 }
  - { profession: profession.engineer, count: 1 }
recipes:
  - makes: good.phosphate-fertiliser
    does: "Ground phosphate rock is digested in sulphuric acid; phosphoric acid is filtered from the gypsum."
    inputs:
      - { item: good.phosphate-rock, quantity: 3.05 }
      - { item: good.sulphuric-acid, quantity: 2.65 }
    outputs:
      - { item: good.gypsum, quantity: 4.5 }
      - { item: good.tailings, quantity: 0.2 }
    rate: 5.0
    power: 5000000
basis:
  - { of: [recipes.inputs, recipes.outputs], tier: sourced, review: true, source: "standards/sources/research_ore_processing.json", note: "For each tonne of phosphate (as P2O5): 2.6 to 3.5 t of rock, 2.4 to 2.9 t of sulphuric acid, 4 to 5 t of gypsum. The water in the gypsum is not counted apart." }
  - { of: [recipes.power], tier: invented, review: true, note: "1 MJ a kg: a guess. To be reviewed." }
  - { of: [physical, recipes.rate], tier: invented, review: true, note: "Its size and how much it puts through are chosen. To be reviewed." }
  - { of: [staff], tier: invented, review: true, note: "A furnace or works' watch: six operators, two metalworkers, a technician, an engineer. Coarse: by the kind of plant, not this one; to be reviewed." }
