basis:
  - { of: [recipes, recipes.rate], tier: sourced, source: "standards/sources/research_food_crops.json", note: "World-average yields for 2024 (FAOSTAT), over the module's 100 ha; tea is a guess (only fresh leaf is reported: 5.9 t/ha); almonds are in the shell; olives' dry share is a guess (what was found is for cured olives). Each figure and its page: the file named." }
  - { of: [recipes.inputs, recipes.outputs], tier: derived, review: true, source: "standards/sources/research_food_crops.json", note: "Worked out, not measured: a plant is made of carbon dioxide and water and gives off oxygen (1.47 kg and 0.6 kg in, 1.07 kg out, for each kg of dry plant), with the water the crop holds. Each crop's dry share is sourced. How much of the plant is crop, and so how much straw is left, is sourced for some and a guess for apples, oranges, lemons, bananas, grapes, mangoes, olives, almonds, coffee, tea, cocoa. Fertiliser is the world's average, 67.7 kg of nitrogen a hectare a year, as ammonia." }
  - { of: [physical, recipes.power], tier: invented, review: true, note: "Its size is chosen; what its machines draw is a guess. To be reviewed." }
