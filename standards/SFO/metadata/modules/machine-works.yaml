# yaml-language-server: $schema=../../schema/module.schema.yaml
identity:
  key: module.machine-works
  name: "Machine works"
  step: "Build machines"
  description: "Presses, winding machines, machining and assembly lines for things with moving parts. Set to one product at a time."
physical:
  length: 300
  width: 150
  height: 15
staff:
  - { profession: profession.machinist, count: 4 }
  - { profession: profession.plant-operator, count: 4 }
  - { profession: profession.technician, count: 1 }
recipes:
  - makes: good.electric-motors
    does: "Steel sheet is stamped and stacked, copper wound on, and the whole set in a frame."
    inputs:
      - { item: stock.sta36-pl-20, quantity: 0.83 }
      - { item: stock.al6061-pl-5, quantity: 0.125 }
      - { item: stock.cu-wire-2, quantity: 0.095 }
    outputs:
      - { item: stock.sta36-scrap, quantity: 0.05 }
    rate: 1.0
    power: 6600000
  - makes: good.pumps
    does: "A casing and an impeller are machined and put together."
    inputs:
      - { item: stock.sta36-pl-20, quantity: 0.97 }
      - { item: stock.st304-pl-3, quantity: 0.08 }
    outputs:
      - { item: stock.sta36-scrap, quantity: 0.05 }
    rate: 1.0
    power: 6600000
  - makes: good.heat-pumps
    does: "Compressors, coils of copper tube and fins of aluminium in a steel frame."
    inputs:
      - { item: stock.sta36-pl-20, quantity: 0.617 }
      - { item: stock.al6061-pl-5, quantity: 0.207 }
      - { item: stock.cu-wire-2, quantity: 0.172 }
      - { item: good.polyethylene, quantity: 0.054 }
    outputs:
      - { item: stock.sta36-scrap, quantity: 0.05 }
    rate: 1.0
    power: 6600000
  - makes: good.machine-tools
    does: "A heavy bed, slides, a spindle, motors and controls."
    inputs:
      - { item: stock.sta36-pl-20, quantity: 0.98 }
      - { item: good.electric-motors, quantity: 0.05 }
      - { item: good.electronics, quantity: 0.02 }
    outputs:
      - { item: stock.sta36-scrap, quantity: 0.05 }
    rate: 1.0
    power: 6600000
  - makes: good.tools
    does: "Bar is forged, ground and hardened."
    inputs:
      - { item: stock.st4340-bar-120, quantity: 1.25 }
    outputs:
      - { item: stock.st4340-scrap, quantity: 0.25 }
    rate: 1.0
    power: 6600000
life: 788940000
basis:
  - { of: [recipes, recipes.inputs], tier: derived, review: true, source: "standards/sources/research_machines.json", note: "Shares by weight of real machines: an 11 kW motor is 5.85 kg of steel and iron, 0.9 of aluminium and about 0.65 of copper for each kW; a pump is 14 parts cast iron to 1 of stainless; a 10 kW heat pump is 129 kg of steel, 47 of aluminium, 39 of copper. All iron and steel is taken as structural plate, copper as wire. Machine tools and tools are guesses." }
  - { of: [recipes.outputs], tier: invented, review: true, note: "5% lost as scrap (tools: 20%), all of it counted as steel: a guess. To be reviewed." }
  - { of: [recipes.power], tier: derived, review: true, source: "standards/sources/research_machines.json", note: "6.6 MJ a kg: a car plant takes 2.77 MWh to assemble a car, taken as 1.5 t. Standing in for all machines." }
  - { of: [physical, recipes.rate], tier: invented, review: true, note: "Its size and how much it puts through are chosen. To be reviewed." }
  - { of: [staff], tier: invented, review: true, note: "Machinists and operators. Coarse: by the kind of plant, not this one; to be reviewed." }
  - { of: [life], tier: invented, review: true, note: "Twenty-five years for industrial plant, as plant is depreciated on Earth; then it is rebuilt. Chosen; the user's rule that everything made has a life." }
