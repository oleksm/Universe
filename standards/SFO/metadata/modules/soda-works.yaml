# yaml-language-server: $schema=../../schema/module.schema.yaml
identity:
  key: module.soda-works
  name: "Soda works"
  step: "Make soda ash"
  description: "Towers where brine, ammonia and the gas from burning limestone make soda ash. The ammonia goes round and round; the calcium leaves as waste."
physical:
  length: 300
  width: 150
  height: 40
staff:
  - { profession: profession.chemist, count: 2 }
  - { profession: profession.plant-operator, count: 4 }
  - { profession: profession.technician, count: 1 }
recipes:
  - makes: good.soda-ash
    does: "Salt and limestone give soda ash and calcium chloride (the Solvay process)."
    inputs:
      - { item: good.salt, quantity: 1.66 }
      - { item: good.limestone, quantity: 1.4 }
    outputs:
      - { item: good.solvay-waste, quantity: 1.86 }
      - { item: good.carbon-dioxide, quantity: 0.2004 }
    rate: 5.0
    power: 58000000
life: 788940000
basis:
  - { of: [recipes.inputs, recipes.power], tier: sourced, source: "standards/sources/research_chemicals.json", note: "1.66 t of salt and 1.4 t of limestone a tonne (a 500,000 t a year plant; Europe's range is 1.53 to 1.8 and 1.05 to 1.6). 11.6 GJ a tonne: 7.5 to 10.8 for the works and 2.2 to 2.8 for its lime kiln, taken in the middle and as electric." }
  - { of: [recipes.outputs], tier: derived, review: true, note: "By balance: the carbon dioxide of the limestone that is more than the reaction needs; all the rest is waste. The water the waste runs off in is not counted." }
  - { of: [physical, recipes.rate], tier: invented, review: true, note: "Its size and how much it puts through are chosen. To be reviewed." }
  - { of: [staff], tier: invented, review: true, note: "A chemical plant's watch: two chemists, four operators, a technician. Coarse: by the kind of plant, not this one; to be reviewed." }
  - { of: [life], rule: rule.life-plant }
