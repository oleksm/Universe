  step: "Dig ore"
  description: "A pit, its shovels and trucks, or a shaft and its drifts: where ore is broken out of the ground and brought up. It is set to the ore that lies where it stands, and can dig no other."
physical:
  length: 1000
  width: 1000
  height: 200
site: open sky
