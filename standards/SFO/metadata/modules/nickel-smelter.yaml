# yaml-language-server: $schema=../../schema/module.schema.yaml
identity:
  key: module.nickel-smelter
  name: "Nickel smelter"
  step: "Smelt nickel"
  description: "A flash furnace that makes matte of concentrate, and a refinery that parts the nickel from it."
physical:
  length: 400
  width: 200
  height: 40
recipes:
  - makes: element.ni
    does: "Concentrate is flashed to matte and the matte refined to metal."
    inputs:
      - { item: good.nickel-concentrate, quantity: 6.579 }
      - { item: element.o, quantity: 0.6597 }
    outputs:
      - { item: element.s, quantity: 1.974 }
      - { item: good.slag, quantity: 4.265 }
    rate: 2.0
    power: 127000000
basis:
  - { of: [recipes.power], tier: sourced, review: true, source: "standards/sources/research_ore_processing.json", note: "25 to 65 GJ a tonne of nickel to matte, and 17 to 20 more to refine it." }
  - { of: [recipes.inputs, recipes.outputs], tier: invented, review: true, source: "standards/sources/research_ore_processing.json", note: "Concentrate of 16% nickel is sourced; its sulphur (30%) and iron (35%), and the 95% won, are guesses. Its copper, cobalt and platinum go to slag here. To be reviewed." }
  - { of: [physical, recipes.rate], tier: invented, review: true, note: "Its size and how much it puts through are chosen. To be reviewed." }
