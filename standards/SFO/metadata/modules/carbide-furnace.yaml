# yaml-language-server: $schema=../../schema/module.schema.yaml
identity:
  key: module.carbide-furnace
  name: "Carbide furnace"
  step: "Make silicon carbide"
  description: "A long bed of sand and carbon with a graphite core, heated by its own current for days until the middle has turned to silicon carbide; then presses that sinter the grain into tiles."
physical:
  length: 100
  width: 30
  height: 15
staff:
  - { profession: profession.plant-operator, count: 6 }
  - { profession: profession.metalworker, count: 2 }
  - { profession: profession.technician, count: 1 }
  - { profession: profession.engineer, count: 1 }
recipes:
  - makes: stock.sic-tl-10
    does: "Sand and carbon are baked at 2,400 C round a graphite core (the Acheson furnace); the carbide is ground and hot-pressed into tile."
    inputs:
      - { item: good.silica-sand, quantity: 1.782 }
      - { item: good.carbon, quantity: 1.068 }
      - { item: element.o, quantity: 1.25 }
    outputs:
      - { item: good.carbon-dioxide, quantity: 2.817 }
      - { item: good.dust, quantity: 0.2831 }
    rate: 0.2
    power: 5100000
life: 788940000
basis:
  - { of: [recipes.inputs, recipes.power], tier: sourced, review: true, source: "standards/sources/research_ship_materials.json", note: "2.8 to 2.9 kg of sand and coke for each kg of silicon carbide, and 6.2 to 8 MWh a tonne (Europe's furnaces). The split between sand and carbon is the chemistry's; what pressing the tile takes was not found and is not counted." }
  - { of: [recipes.outputs], tier: derived, note: "By balance: the carbon not held in the carbide burns to carbon dioxide; the sand left over is dust." }
  - { of: [physical, recipes.rate], tier: invented, review: true, note: "Its size and how much it puts through are chosen. To be reviewed." }
  - { of: [staff], tier: invented, review: true, note: "A furnace or works' watch: six operators, two metalworkers, a technician, an engineer. Coarse: by the kind of plant, not this one; to be reviewed." }
  - { of: [life], tier: invented, review: true, note: "Twenty-five years for industrial plant, as plant is depreciated on Earth; then it is rebuilt. Chosen; the user's rule that everything made has a life." }
