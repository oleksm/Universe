# yaml-language-server: $schema=../../schema/module.schema.yaml
identity:
  name: Casthouse
  step: Alloy and cast
  description: "Holding furnaces where the liquid metal is alloyed, skimmed and poured into ingots."
size:
  length: 150
  width: 60
  height: 15
rate:
  throughput: 40
  product: ingot
inputs:
  materials:
  - { item: liquid-aluminium, amount: 1.02 }
outputs:
  by_products:
  - { item: dross, amount: 0.02 }
needs:
  power: 40
basis:
  - { of: [rate], tier: sourced, source: "https://en.wikipedia.org/wiki/Qatalum", note: "About 73 t/h serves a smelter of two potlines; 40 for one." }
  - { of: [inputs, outputs], tier: sourced, source: "https://www.energy.gov/sites/prod/files/2013/11/f4/al_theoretical.pdf", note: "1,020 kg of metal from the pots for each tonne of ingot; 15 to 25 kg of dross." }
  - { of: [needs], tier: sourced, source: "https://www.energy.gov/sites/prod/files/2013/11/f4/al_theoretical.pdf", note: "1,010 kWh for each tonne of ingot, a fifth of it electricity. Heat is counted as power: there is no fuel to burn." }
  - { of: [size], tier: invented, note: "Its footprint was not found in a source: approximate, from memory." }
