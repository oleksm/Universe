# yaml-language-server: $schema=../../schema/module.schema.yaml
identity:
  key: module.bar-mill
  name: Bar mill
  step: Roll to bar
  description: "Roll stands with grooved rolls that draw a hot ingot out into round bar."
physical:
  length: 200
  width: 30
  height: 15
recipes:
  - makes: stock.st4340-bar-120
    does: "A hot ingot drawn out between grooved rolls into round bar."
    inputs:
      - { item: good.hot-ingot-4340, quantity: 1.1 }
    outputs:
      - { item: good.scrap, quantity: 0.1 }
    rate: 13.8888888888889
    power: 5600000.0
basis:
  - { of: [recipes.makes, recipes.rate], tier: sourced, source: "https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2022-12/FMP%20BREF_Final%20Version.pdf", note: "Bar mills average 39 t/h, medium section mills 53." }
  - { of: [recipes.inputs, recipes.outputs], tier: sourced, source: "https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2022-12/FMP%20BREF_Final%20Version.pdf", note: "7 to 15% is lost as scrap in hot rolling; 10 taken." }
  - { of: [recipes.power], tier: sourced, source: "https://www.energy.gov/sites/prod/files/2015/08/f26/iron_and_steel_bandwidth_report_0.pdf", note: "111 kWh of electricity for each tonne (the heat is the reheat furnace's)." }
  - { of: [physical], tier: invented, note: "Its footprint was not found in a source: approximate, from memory." }
