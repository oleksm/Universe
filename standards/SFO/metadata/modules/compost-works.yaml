# yaml-language-server: $schema=../../schema/module.schema.yaml
identity:
  key: module.compost-works
  name: "Compost works"
  step: "Rot down"
  description: "Rows of heaped dung, stalks and sludge, turned by machine as they rot. It also makes roots' growing medium, from straw and from medium that has been used."
physical:
  length: 200
  width: 100
  height: 5
staff:
  - { profession: profession.food-worker, count: 6 }
  - { profession: profession.plant-operator, count: 1 }
recipes:
  - makes: good.compost
    does: "Heaped, turned and left ten to fourteen weeks. About half the weight goes: some rots away to carbon dioxide and water, more dries off."
    inputs:
      - { item: good.manure, quantity: 1.923 }
      - { item: element.o, quantity: 0.3077 }
    outputs:
      - { item: good.carbon-dioxide, quantity: 0.4231 }
      - { item: good.water, quantity: 0.8077 }
    rate: 1.0
    power: 100000
  - makes: good.growing-medium
    does: "Used medium is steamed clean and the old roots sieved out."
    inputs:
      - { item: good.spent-medium, quantity: 1.1 }
    outputs:
      - { item: good.compost, quantity: 0.1 }
    rate: 0.2
    power: 100000
  - makes: good.growing-medium
    does: "Straw is shredded, heated and pressed into slabs."
    inputs:
      - { item: good.crop-residue, quantity: 1.25 }
    outputs:
      - { item: good.water, quantity: 0.25 }
    rate: 0.2
    power: 100000
  - makes: good.compost
    does: "Sewage sludge composted with crop residue."
    inputs:
      - { item: good.sewage-sludge, quantity: 1.5 }
      - { item: good.crop-residue, quantity: 0.5 }
      - { item: element.o, quantity: 0.3 }
    outputs:
      - { item: good.carbon-dioxide, quantity: 0.5 }
      - { item: good.water, quantity: 0.8 }
    rate: 1.0
    power: 100000
  - makes: good.compost
    does: "Textile waste of natural fibre and wool scourings composted."
    inputs:
      - { item: good.textile-waste, quantity: 1.2 }
      - { item: good.wool-scourings, quantity: 0.5 }
      - { item: element.o, quantity: 0.2 }
    outputs:
      - { item: good.carbon-dioxide, quantity: 0.4 }
      - { item: good.water, quantity: 0.5 }
    rate: 0.5
    power: 100000
  - makes: good.growing-medium
    does: "Compost blended with sand into a growing medium for the halls."
    inputs:
      - { item: good.compost, quantity: 0.6 }
      - { item: good.silica-sand, quantity: 0.4 }
    rate: 0.5
    power: 100000
life: 788940000
basis:
  - { of: [recipes, recipes.inputs, recipes.outputs], tier: sourced, review: true, source: "standards/sources/research_people_plant.json", note: "Compost: 48% of what goes in is lost (22 to 70%), in 10 to 14 weeks. How that loss is split between rotting and drying is a guess, as is everything about the growing medium." }
  - { of: [physical, recipes.rate, recipes.power], tier: invented, review: true, note: "Chosen. To be reviewed." }
  - { of: [staff], tier: invented, review: true, note: "Six food workers and an operator. Coarse: by the kind of plant, not this one; to be reviewed." }
  - { of: [recipes], tier: invented, review: true, note: "Sludge, textile waste and scourings compost; compost and sand make the halls' growing medium, so compost has a taker too. Added 2026-10-06 so that nothing given off is left with no taker (the Takers report); the figures balance by mass and are chosen." }
  - { of: [life], tier: invented, review: true, note: "Twenty-five years for industrial plant, as plant is depreciated on Earth; then it is rebuilt. Chosen; the user's rule that everything made has a life." }
