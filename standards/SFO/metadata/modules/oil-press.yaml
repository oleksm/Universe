# yaml-language-server: $schema=../../schema/module.schema.yaml
identity:
  key: module.oil-press
  name: "Oil press"
  step: "Press oil"
  description: "Crushes oilseeds and olives and takes off the oil."
physical:
  length: 60
  width: 40
  height: 15
staff:
  - { profession: profession.food-worker, count: 6 }
  - { profession: profession.plant-operator, count: 1 }
recipes:
  - makes: good.vegetable-oil
    does: "Rapeseed is 44% oil; pressing gets about 40% of the seed's weight."
    inputs:
      - { item: good.rapeseed, quantity: 2.5 }
    outputs:
      - { item: good.oilseed-meal, quantity: 1.5 }
    rate: 1.389
    power: 400000
  - makes: good.vegetable-oil
    does: "Sunflower seed is about 40% oil."
    inputs:
      - { item: good.sunflower-seed, quantity: 2.5 }
    outputs:
      - { item: good.oilseed-meal, quantity: 1.5 }
    rate: 1.389
    power: 400000
  - makes: good.vegetable-oil
    does: "Soybeans are 18 to 19% oil: most of what comes out is meal."
    inputs:
      - { item: good.soybeans, quantity: 5.4 }
    outputs:
      - { item: good.oilseed-meal, quantity: 4.4 }
    rate: 0.5556
    power: 400000
  - makes: good.olive-oil
    does: "Olives give about a fifth of their weight as oil."
    inputs:
      - { item: good.olives, quantity: 5.0 }
    outputs:
      - { item: good.pomace, quantity: 4.0 }
    rate: 0.5556
    power: 400000
basis:
  - { of: [recipes, recipes.inputs, recipes.outputs], tier: sourced, source: "standards/sources/research_food_livestock.json", note: "Rapeseed 44% oil (40% pressed out), sunflower 40%, soybeans 18 to 19%. Olives at a fifth of their weight is a guess: no figure was found. What is left over is by balance." }
  - { of: [physical, recipes.rate, recipes.power], tier: invented, review: true, note: "Its size, how much it puts through and what it draws are chosen. To be reviewed." }
  - { of: [staff], tier: invented, review: true, note: "Six food workers and an operator. Coarse: by the kind of plant, not this one; to be reviewed." }
