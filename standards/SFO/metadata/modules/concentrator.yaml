# yaml-language-server: $schema=../../schema/module.schema.yaml
identity:
  key: module.concentrator
  name: "Concentrator"
  step: "Grind and float"
  description: "Crushers, mills that grind the ore to powder, and cells where the ore mineral floats off on froth. Nine tenths and more of what goes in leaves as tailings."
physical:
  length: 300
  width: 150
  height: 30
recipes:
  - makes: good.copper-concentrate
    does: "Porphyry copper ore is crushed, ground to powder and floated; what does not float is tailings."
    inputs:
      - { item: good.porphyry-copper-ore, quantity: 72.73 }
    outputs:
      - { item: good.tailings, quantity: 71.73 }
    rate: 6.875
    power: 57600000
  - makes: good.copper-concentrate
    does: "Sediment copper ore is crushed, ground to powder and floated; what does not float is tailings."
    inputs:
      - { item: good.sediment-copper-ore, quantity: 15.24 }
    outputs:
      - { item: good.tailings, quantity: 14.24 }
    rate: 32.81
    power: 57600000
  - makes: good.zinc-concentrate
    does: "Carbonate zinc ore is crushed, ground to powder and floated; what does not float is tailings."
    inputs:
      - { item: good.carbonate-zinc-ore, quantity: 17.63 }
    outputs:
      - { item: good.tailings, quantity: 16.63 }
    rate: 28.36
    power: 57600000
  - makes: good.zinc-concentrate
    does: "Shale zinc ore is crushed, ground to powder and floated; what does not float is tailings."
    inputs:
      - { item: good.shale-zinc-ore, quantity: 11.02 }
    outputs:
      - { item: good.tailings, quantity: 10.02 }
    rate: 45.37
    power: 57600000
  - makes: good.zinc-concentrate
    does: "Massive sulphide ore is crushed, ground to powder and floated; what does not float is tailings."
    inputs:
      - { item: good.massive-sulphide-ore, quantity: 30.86 }
    outputs:
      - { item: good.tailings, quantity: 29.86 }
    rate: 16.2
    power: 57600000
  - makes: good.nickel-concentrate
    does: "Nickel sulphide ore is crushed, ground to powder and floated; what does not float is tailings."
    inputs:
      - { item: good.nickel-sulphide-ore, quantity: 22.86 }
    outputs:
      - { item: good.tailings, quantity: 21.86 }
    rate: 21.88
    power: 57600000
  - makes: good.tin-concentrate
    does: "Tin tungsten ore is crushed, ground to powder and floated; what does not float is tailings."
    inputs:
      - { item: good.tin-tungsten-ore, quantity: 209.0 }
    outputs:
      - { item: good.tailings, quantity: 208.0 }
    rate: 2.393
    power: 57600000
basis:
  - { of: [recipes, recipes.inputs, recipes.outputs], tier: derived, review: true, source: "standards/sources/research_ore_processing.json", note: "From each ore's grade (its deposit type's) and the concentrate's: copper 27 to 29%, zinc 47 to 56%, nickel 16%, tin 60 to 70% cassiterite. 87.5% of the metal is caught, the figure for copper, taken for all. The other metals an ore carries (the molybdenum and gold of a porphyry, the lead beside zinc, the tungsten beside tin) go to tailings here: to be put right." }
  - { of: [recipes.power], tier: sourced, review: true, source: "standards/sources/research_ore_processing.json", note: "32 kWh a tonne of ore, for crushing, grinding and floating (grinding alone is 18.7)." }
  - { of: [physical, recipes.rate], tier: invented, review: true, note: "Its size and how much it puts through are chosen. To be reviewed." }
