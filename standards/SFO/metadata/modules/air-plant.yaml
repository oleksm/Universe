# yaml-language-server: $schema=../../schema/module.schema.yaml
identity:
  key: module.air-plant
  name: "Air plant"
  step: "Clean air"
  description: "For a sealed place: takes the carbon dioxide people breathe out, joins it to hydrogen and gets water back, which a hydrogen plant splits for oxygen. With a hydrogen plant it closes the loop of breath without a single leaf."
physical:
  length: 30
  width: 20
  height: 10
recipes:
  - makes: good.water
    does: "Carbon dioxide and hydrogen over a hot catalyst give water and methane (the Sabatier reaction, as on the space station)."
    inputs:
      - { item: good.carbon-dioxide, quantity: 1.222 }
      - { item: element.h, quantity: 0.2238 }
    outputs:
      - { item: good.methane, quantity: 0.4453 }
    rate: 0.05
    power: 50000
basis:
  - { of: [recipes.inputs, recipes.outputs], tier: derived, source: "standards/sources/research_people_needs.json", note: "From the chemistry: 44 parts of carbon dioxide and 8 of hydrogen give 36 of water and 16 of methane. The hydrogen left from making one person's oxygen is enough for a little over half their carbon dioxide; the station's own plant turns half." }
  - { of: [recipes.power], tier: invented, review: true, note: "The reaction gives heat off; this is for fans, the scrubber and pumps. No figure was found. To be reviewed." }
  - { of: [physical, recipes.rate], tier: invented, review: true, note: "Its size and how much it puts through are chosen. To be reviewed." }
