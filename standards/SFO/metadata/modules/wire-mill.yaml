# yaml-language-server: $schema=../../schema/module.schema.yaml
identity:
  key: module.wire-mill
  name: "Wire mill"
  step: "Draw wire"
  description: "Rolls an ingot down to rod and pulls the rod through smaller and smaller dies."
physical:
  length: 200
  width: 30
  height: 10
recipes:
  - makes: stock.cu-wire-2
    does: "A copper ingot is rolled to rod and drawn to wire."
    inputs:
      - { item: stock.cu-ingot, quantity: 1.02 }
    outputs:
      - { item: stock.cu-scrap, quantity: 0.02 }
    rate: 2.0
    power: 14200000
basis:
  - { of: [recipes.power], tier: sourced, source: "standards/sources/research_machines.json", note: "7.1 MJ a kg to turn copper into wire (Argonne's model of vehicle making)." }
  - { of: [physical, recipes, recipes.rate, recipes.inputs, recipes.outputs], tier: invented, review: true, note: "Its size and rate are chosen; the 2% lost is a guess. To be reviewed." }
