# yaml-language-server: $schema=../../schema/module.schema.yaml
identity:
  key: module.glassworks
  name: "Glassworks"
  step: "Melt glass"
  description: "A furnace that melts sand, soda ash and limestone, and a bath of molten tin the glass floats out flat on."
physical:
  length: 400
  width: 60
  height: 15
staff:
  - { profession: profession.plant-operator, count: 6 }
  - { profession: profession.metalworker, count: 2 }
  - { profession: profession.technician, count: 1 }
  - { profession: profession.engineer, count: 1 }
does: "Pure quartz sand fused in an electric furnace into a clear ingot, sawn into plate, annealed, ground and polished."
recipes:
  - makes: good.glass
    does: "Sand, soda ash and limestone are melted at 1,500 C and floated out into a flat ribbon."
    inputs:
      - { item: good.silica-sand, quantity: 0.73 }
      - { item: good.soda-ash, quantity: 0.2394 }
      - { item: good.limestone, quantity: 0.232 }
    outputs:
      - { item: good.carbon-dioxide, quantity: 0.2014 }
    rate: 2.0
    power: 20500000
  - makes: stock.fs-pl-6
    inputs:
      - { item: good.silica-sand, quantity: 1.3 }
    rate: 0.05
    power: 2000000
  - makes: stock.fs-pl-12
    inputs:
      - { item: good.silica-sand, quantity: 1.3 }
    rate: 0.05
    power: 2000000
  - makes: stock.fs-pl-27
    inputs:
      - { item: good.silica-sand, quantity: 1.3 }
    rate: 0.05
    power: 2000000
  - makes: stock.fs-pl-54
    inputs:
      - { item: good.silica-sand, quantity: 1.3 }
    rate: 0.05
    power: 2000000
life: 788940000
basis:
  - { of: [recipes.inputs, recipes.outputs], tier: derived, review: true, source: "standards/sources/research_people_plant.json", note: "Worked back from what flat glass is made of (71% silica, 14% soda, 13% lime and magnesia, the rest alumina) to the rock that gives each; the magnesia is taken as lime." }
  - { of: [recipes.power], tier: sourced, source: "standards/sources/research_people_plant.json", note: "10.2 GJ a tonne: the average of flat-glass furnaces in the United States (8.8 million Btu a short ton)." }
  - { of: [physical, recipes.rate], rule: rule.module-size-chosen }
  - { of: [staff], rule: rule.staff-furnace-works }
  - { of: [recipes], tier: invented, review: true, note: "The fused silica plates (2026-10-13): sand of high purity fused electrically, about 40 MJ a kg, and 0.3 of it lost to sawing, grinding and polishing. Chosen; not looked up." }
  - { of: [life], rule: rule.life-plant }
