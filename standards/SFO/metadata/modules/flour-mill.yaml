# yaml-language-server: $schema=../../schema/module.schema.yaml
identity:
  key: module.flour-mill
  name: "Flour mill"
  step: "Mill flour"
  description: "Rollers and sieves that take wheat down to flour and take off the bran."
physical:
  length: 60
  width: 30
  height: 30
staff:
  - { profession: profession.food-worker, count: 6 }
  - { profession: profession.plant-operator, count: 1 }
recipes:
  - makes: good.flour
    does: "72% of the grain becomes white flour; the rest is bran."
    inputs:
      - { item: good.wheat, quantity: 1.389 }
    outputs:
      - { item: good.bran, quantity: 0.389 }
    rate: 2.778
    power: 500000
life: 788940000
basis:
  - { of: [recipes, recipes.inputs, recipes.outputs], tier: sourced, source: "standards/sources/research_food_livestock.json", note: "72% of wheat becomes white flour. What is left over is by balance." }
  - { of: [physical, recipes.rate, recipes.power], tier: invented, review: true, note: "Its size, how much it puts through and what it draws are chosen. To be reviewed." }
  - { of: [staff], tier: invented, review: true, note: "Six food workers and an operator. Coarse: by the kind of plant, not this one; to be reviewed." }
  - { of: [life], rule: rule.life-plant }
