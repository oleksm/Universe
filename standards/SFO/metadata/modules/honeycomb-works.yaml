basis:
  - { of: [physical, staff, recipes], tier: invented, review: true, note: "A core works of about a tonne a shift (0.3 kg/s) at 400 kW: the aramid core takes the fibre as paper with a resin dip (polyethylene standing in for the phenolic), the aluminium core 6061 sheet rolled to foil here, with a tenth lost. Typical, from memory; added 2026-10-06 for the deck panels." }
