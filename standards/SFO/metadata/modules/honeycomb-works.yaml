# yaml-language-server: $schema=../../schema/module.schema.yaml
identity:
  key: module.honeycomb-works
  name: "Honeycomb works"
  step: "Expand honeycomb core"
  description: "Rolls foil or dips aramid paper, prints the bond lines, stacks and bonds the sheets, pulls the block open into cells and slices it to depth: the core of a sandwich panel."
physical:
  length: 40
  width: 15
  height: 8
staff:
  - { profession: profession.technician, count: 4 }
  - { profession: profession.plant-operator, count: 2 }
recipes:
  - makes: stock.hc-al-12p7
    does: "Foil or paper rolled thin, printed with bond lines, stacked, bonded and pulled open into cells, then sliced to depth."
    inputs:
      - { item: stock.al6061-sh-2, quantity: 1.1 }
    outputs:
      - { item: stock.al6061-scrap, quantity: 0.1 }
    rate: 0.3
    power: 400000
