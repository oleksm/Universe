# yaml-language-server: $schema=../../schema/module.schema.yaml
identity:
  key: module.ice-melter
  name: "Ice melter"
  step: "Melt ice"
  description: "Melts ice brought from asteroids and comets, settles the dust out and filters the water."
physical:
  length: 40
  width: 30
  height: 15
staff:
  - { profession: profession.chemist, count: 2 }
  - { profession: profession.plant-operator, count: 4 }
  - { profession: profession.technician, count: 1 }
recipes:
  - makes: good.water
    does: "Ice is warmed from the cold of space, melted, and the dust settled out."
    inputs:
      - { item: good.asteroid-water-ice, quantity: 1.05 }
    outputs:
      - { item: good.tailings, quantity: 0.05 }
    rate: 10.0
    power: 7800000
basis:
  - { of: [recipes.power], tier: derived, source: "standards/sources/research_people_needs.json", note: "776 kJ for each kg of water: ice warmed from 100 K at 2,030 J/kg/K (its heat at -10 C; colder ice takes less), melted at 333.55 kJ/kg, and the water brought to 20 C at 4,184 J/kg/K." }
  - { of: [recipes.inputs, recipes.outputs], tier: invented, review: true, note: "One part of dust in twenty of ice: a guess. What asteroid ice holds waits on what the worlds are made of." }
  - { of: [physical, recipes.rate], tier: invented, review: true, note: "Its size and how much it puts through are chosen. To be reviewed." }
  - { of: [staff], tier: invented, review: true, note: "A chemical plant's watch: two chemists, four operators, a technician. Coarse: by the kind of plant, not this one; to be reviewed." }
