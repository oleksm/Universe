# yaml-language-server: $schema=../../schema/module.schema.yaml
identity:
  key: module.tin-smelter
  name: "Tin smelter"
  step: "Smelt tin"
  description: "Furnaces where carbon takes the oxygen from cassiterite, in two stages, the slag of the first being smelted again."
physical:
  length: 80
  width: 40
  height: 20
staff:
  - { profession: profession.plant-operator, count: 6 }
  - { profession: profession.metalworker, count: 2 }
  - { profession: profession.technician, count: 1 }
  - { profession: profession.engineer, count: 1 }
recipes:
  - makes: element.sn
    does: "Concentrate is smelted with carbon at 1,200 C and its slag again at 1,400 C."
    inputs:
      - { item: good.tin-concentrate, quantity: 2.056 }
      - { item: good.carbon, quantity: 0.15 }
      - { item: element.o, quantity: 0.1301 }
    outputs:
      - { item: good.carbon-dioxide, quantity: 0.5496 }
      - { item: good.slag, quantity: 0.7864 }
    rate: 0.5
    power: 5000000
life: 788940000
basis:
  - { of: [recipes.inputs, recipes.outputs], tier: derived, review: true, source: "standards/sources/research_ore_processing.json", note: "From the chemistry, with half as much carbon again as it needs and 95% of the tin won: guesses. The concentrate's grade is sourced." }
  - { of: [recipes.power], tier: invented, review: true, note: "10 MJ a kg: no figure was found. To be reviewed." }
  - { of: [physical, recipes.rate], tier: invented, review: true, note: "Its size and how much it puts through are chosen. To be reviewed." }
  - { of: [staff], tier: invented, review: true, note: "A furnace or works' watch: six operators, two metalworkers, a technician, an engineer. Coarse: by the kind of plant, not this one; to be reviewed." }
  - { of: [life], rule: rule.life-plant }
