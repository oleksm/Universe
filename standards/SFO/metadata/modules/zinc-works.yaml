# yaml-language-server: $schema=../../schema/module.schema.yaml
identity:
  key: module.zinc-works
  name: "Zinc works"
  step: "Win zinc"
  description: "Roasters that burn the sulphur out of concentrate, tanks of acid that take up the zinc, and cells where current lays it down."
physical:
  length: 300
  width: 200
  height: 25
staff:
  - { profession: profession.plant-operator, count: 6 }
  - { profession: profession.metalworker, count: 2 }
  - { profession: profession.technician, count: 1 }
  - { profession: profession.engineer, count: 1 }
recipes:
  - makes: element.zn
    does: "Concentrate is roasted, leached in acid and the zinc laid down on cathodes by current."
    inputs:
      - { item: good.zinc-concentrate, quantity: 1.929 }
      - { item: element.o, quantity: 0.06 }
    outputs:
      - { item: element.s, quantity: 0.6173 }
      - { item: good.tailings, quantity: 0.3717 }
    rate: 5.0
    power: 81500000
basis:
  - { of: [recipes.power], tier: sourced, review: true, source: "standards/sources/research_ore_processing.json", note: "3,850 to 4,905 kWh a tonne of zinc, and 0.48 GJ besides." }
  - { of: [recipes.inputs, recipes.outputs], tier: derived, review: true, source: "standards/sources/research_ore_processing.json", note: "Concentrate of 54% zinc and 32% sulphur; 96% of the zinc won. The iron residue (0.3 to 0.8 t a tonne of zinc) is put with tailings. The lead and cadmium in it are not counted." }
  - { of: [physical, recipes.rate], tier: invented, review: true, note: "Its size and how much it puts through are chosen. To be reviewed." }
  - { of: [staff], tier: invented, review: true, note: "A furnace or works' watch: six operators, two metalworkers, a technician, an engineer. Coarse: by the kind of plant, not this one; to be reviewed." }
