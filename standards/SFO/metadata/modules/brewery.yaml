# yaml-language-server: $schema=../../schema/module.schema.yaml
identity:
  key: module.brewery
  name: "Brewery"
  step: "Brew beer"
  description: "Malts barley, mashes it in hot water, ferments and conditions the beer."
physical:
  length: 60
  width: 40
  height: 15
staff:
  - { profession: profession.food-worker, count: 6 }
  - { profession: profession.plant-operator, count: 1 }
recipes:
  - makes: good.beer
    does: "11.3 kg of malt to the hectolitre; the barley to make that malt taken as a quarter more."
    inputs:
      - { item: good.barley, quantity: 0.14 }
      - { item: good.water, quantity: 1.0 }
    outputs:
      - { item: good.spent-grain, quantity: 0.14 }
    rate: 1.389
    power: 400000
life: 788940000
basis:
  - { of: [recipes, recipes.inputs, recipes.outputs], tier: sourced, source: "standards/sources/research_food_livestock.json", note: "11.3 kg of malt a hectolitre; the barley to make the malt is a guess. What is left over is by balance." }
  - { of: [physical, recipes.rate, recipes.power], tier: invented, review: true, note: "Its size, how much it puts through and what it draws are chosen. To be reviewed." }
  - { of: [staff], tier: invented, review: true, note: "Six food workers and an operator. Coarse: by the kind of plant, not this one; to be reviewed." }
  - { of: [life], rule: rule.life-plant }
