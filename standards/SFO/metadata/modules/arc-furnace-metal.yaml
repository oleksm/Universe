# yaml-language-server: $schema=../../schema/module.schema.yaml
identity:
  key: module.arc-furnace-metal
  name: Electric arc furnace, metal charge
  step: Melt
  description: "Melts metal that needs no reducing (asteroid nickel-iron, scrap) with electric arcs. Lime forms a slag that takes up what is not metal."
physical:
  length: 100
  width: 40
  height: 35
staff:
  - { profession: profession.plant-operator, count: 6 }
  - { profession: profession.metalworker, count: 2 }
  - { profession: profession.technician, count: 1 }
  - { profession: profession.engineer, count: 1 }
recipes:
  - makes: good.liquid-steel
    does: "The metal is melted. Lime forms a slag that takes up the rock that came with it."
    inputs:
      - { item: good.nickel-iron-ore, quantity: 1.08 }
      - { item: good.lime, quantity: 0.03 }
      - { item: good.graphite-electrode, quantity: 0.003 }
    outputs:
      - { item: good.slag, quantity: 0.1 }
      - { item: good.dust, quantity: 0.013 }
    rate: 26.6666666666667
    batch: 80000
    power: 42000000
  - makes: good.liquid-steel
    does: "Scrap of structural steel is melted again. Lime forms a slag that takes up the scale and dirt."
    inputs:
      - { item: stock.sta36-scrap, quantity: 1.05 }
      - { item: good.lime, quantity: 0.03 }
      - { item: good.graphite-electrode, quantity: 0.003 }
    outputs:
      - { item: good.slag, quantity: 0.07 }
      - { item: good.dust, quantity: 0.013 }
    rate: 26.6666666666667
    batch: 80000
    power: 42000000
  - makes: good.liquid-steel
    does: "Scrap of 4340 steel is melted again. Lime forms a slag that takes up the scale and dirt."
    inputs:
      - { item: stock.st4340-scrap, quantity: 1.05 }
      - { item: good.lime, quantity: 0.03 }
      - { item: good.graphite-electrode, quantity: 0.003 }
    outputs:
      - { item: good.slag, quantity: 0.07 }
      - { item: good.dust, quantity: 0.013 }
    rate: 26.6666666666667
    batch: 80000
    power: 42000000
  - makes: good.liquid-steel
    does: "Stainless scrap melted; its chromium and nickel carried into the melt."
    inputs:
      - { item: stock.st304-scrap, quantity: 1.05 }
      - { item: good.lime, quantity: 0.03 }
      - { item: good.graphite-electrode, quantity: 0.003 }
    outputs:
      - { item: good.slag, quantity: 0.07 }
      - { item: good.dust, quantity: 0.013 }
    rate: 26.6666666666667
    power: 42000000
life: 788940000
basis:
  - { of: [recipes.makes, recipes.rate, recipes.batch], tier: sourced, source: "https://en.wikipedia.org/wiki/Electric_arc_furnace", note: "80 t of steel in about 50 minutes." }
  - { of: [recipes.power], tier: sourced, source: "https://en.wikipedia.org/wiki/Electric_arc_furnace", note: "440 kWh for each tonne of steel from a charge of scrap, which is metal already, as asteroid nickel-iron is." }
  - { of: [recipes.inputs, recipes.outputs], tier: sourced, source: "https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/IS_Adopted_03_2012.pdf", note: "Inside the ranges the source gives for each tonne of steel: lime 25 to 140 kg, electrode 2 to 6, slag 60 to 270, dust 10 to 30. The metal charged is set to balance." }
  - { of: [physical], tier: invented, review: true, note: "Its footprint was not found in a source: approximate, from memory." }
  - { of: [recipes], tier: invented, review: true, note: "The two scrap charges: as the nickel-iron charge, with 5% of the scrap lost to slag as scale and dirt, a guess. The steel a scrap melts to is taken as one liquid steel, whatever grade it was. To be reviewed." }
  - { of: [staff], tier: invented, review: true, note: "A furnace or works' watch: six operators, two metalworkers, a technician, an engineer. Coarse: by the kind of plant, not this one; to be reviewed." }
  - { of: [recipes], tier: invented, review: true, note: "Stainless scrap goes back to the furnace as the carbon steels do. Added 2026-10-06 so that nothing given off is left with no taker (the Takers report); the figures balance by mass and are chosen." }
  - { of: [life], tier: invented, review: true, note: "Twenty-five years for industrial plant, as plant is depreciated on Earth; then it is rebuilt. Chosen; the user's rule that everything made has a life." }
