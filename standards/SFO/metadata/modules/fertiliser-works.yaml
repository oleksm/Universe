# yaml-language-server: $schema=../../schema/module.schema.yaml
# Its nitrogen is drawn from the air of the place it stands in (four fifths of any Earth-like air is nitrogen): from: place.
identity:
  key: module.fertiliser-works
  name: "Fertiliser works"
  step: "Fix nitrogen"
  description: "Joins nitrogen from the air to hydrogen, as ammonia, under heat and pressure."
physical:
  length: 150
  width: 100
  height: 40
staff:
  - { profession: profession.chemist, count: 2 }
  - { profession: profession.plant-operator, count: 4 }
  - { profession: profession.technician, count: 1 }
recipes:
  - makes: good.fertiliser
    does: "Fourteen parts of nitrogen to three of hydrogen."
    inputs:
      - { item: element.n, quantity: 0.82, from: place }
      - { item: element.h, quantity: 0.18 }
    rate: 5.556
    power: 15800000
life: 788940000
basis:
  - { of: [recipes.inputs], tier: derived, note: "Ammonia is 14 parts nitrogen to 3 of hydrogen by weight." }
  - { of: [recipes.power], tier: derived, review: true, source: "standards/sources/research_chemicals.json", note: "Making ammonia from power takes 38 GJ a tonne in all, of which the hydrogen is 90 to 95%; the rest, 7.5% taken, is this works' share: joining them and taking the nitrogen from the air." }
  - { of: [physical, recipes, recipes.rate], tier: invented, review: true, note: "Its size and rate are chosen. To be reviewed." }
  - { of: [staff], tier: invented, review: true, note: "A chemical plant's watch: two chemists, four operators, a technician. Coarse: by the kind of plant, not this one; to be reviewed." }
  - { of: [life], tier: invented, review: true, note: "Twenty-five years for industrial plant, as plant is depreciated on Earth; then it is rebuilt. Chosen; the user's rule that everything made has a life." }
