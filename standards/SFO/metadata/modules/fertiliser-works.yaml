# yaml-language-server: $schema=../../schema/module.schema.yaml
identity:
  key: module.fertiliser-works
  name: "Fertiliser works"
  step: "Fix nitrogen"
  description: "Joins nitrogen from the air to hydrogen, as ammonia, under heat and pressure."
physical:
  length: 150
  width: 100
  height: 40
recipes:
  - makes: good.fertiliser
    does: "Fourteen parts of nitrogen to three of hydrogen."
    inputs:
      - { item: element.n, quantity: 0.82 }
      - { item: element.h, quantity: 0.18 }
    rate: 5.556
    power: 12000000
basis:
  - { of: [recipes.inputs], tier: derived, note: "Ammonia is 14 parts nitrogen to 3 of hydrogen by weight." }
  - { of: [physical, recipes, recipes.rate, recipes.power], tier: invented, review: true, source: "standards/sources/research_food_livestock.json", note: "Chosen. Making ammonia from natural gas takes 28 to 41 GJ a tonne, most of it for the hydrogen; what joining them takes when the hydrogen is brought was not found. To be reviewed." }
