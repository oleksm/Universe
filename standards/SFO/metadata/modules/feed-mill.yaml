# yaml-language-server: $schema=../../schema/module.schema.yaml
identity:
  key: module.feed-mill
  name: "Feed mill"
  step: "Mill feed"
  description: "Grinds and mixes grain, oilseed meal and bran into feed for animals."
physical:
  length: 60
  width: 30
  height: 25
staff:
  - { profession: profession.food-worker, count: 6 }
  - { profession: profession.plant-operator, count: 1 }
recipes:
  - makes: good.animal-feed
    does: "Ground and mixed."
    inputs:
      - { item: good.maize, quantity: 0.55 }
      - { item: good.oilseed-meal, quantity: 0.25 }
      - { item: good.bran, quantity: 0.1 }
      - { item: good.barley, quantity: 0.1 }
    rate: 2.778
    power: 300000
  - makes: good.animal-feed
    does: "Spent grain, pulp, pomace, whey and seed cake dried and milled into feed."
    inputs:
      - { item: good.spent-grain, quantity: 0.5 }
      - { item: good.beet-pulp, quantity: 0.3 }
      - { item: good.pomace, quantity: 0.2 }
      - { item: good.whey, quantity: 0.5 }
    outputs:
      - { item: good.water, quantity: 0.5 }
    rate: 2.778
    power: 400000
  - makes: good.animal-feed
    does: "Bagasse and cottonseed with meat and bone meal, milled into feed."
    inputs:
      - { item: good.bagasse, quantity: 0.5 }
      - { item: good.cottonseed, quantity: 0.35 }
      - { item: good.meat-and-bone-meal, quantity: 0.15 }
    rate: 2.778
    power: 300000
life: 788940000
basis:
  - { of: [physical, recipes, recipes.rate, recipes.inputs, recipes.power], tier: invented, review: true, note: "A mix chosen, not a ration anyone has worked out. To be reviewed." }
  - { of: [staff], tier: invented, review: true, note: "Six food workers and an operator. Coarse: by the kind of plant, not this one; to be reviewed." }
  - { of: [recipes], tier: invented, review: true, note: "The by-products of sugar, brewing, wine, dairy, oil and textiles, and the rendering works' meal, are feed, as on Earth. Added 2026-10-06 so that nothing given off is left with no taker (the Takers report); the figures balance by mass and are chosen." }
  - { of: [life], rule: rule.life-plant }
