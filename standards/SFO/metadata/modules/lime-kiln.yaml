# yaml-language-server: $schema=../../schema/module.schema.yaml
identity:
  key: module.lime-kiln
  name: "Lime kiln"
  step: "Burn lime"
  description: "Burns limestone to lime, driving off its carbon dioxide."
physical:
  length: 60
  width: 20
  height: 30
staff:
  - { profession: profession.plant-operator, count: 6 }
  - { profession: profession.metalworker, count: 2 }
  - { profession: profession.technician, count: 1 }
  - { profession: profession.engineer, count: 1 }
recipes:
  - makes: good.lime
    does: "Limestone is heated to 900 C; nearly half its weight leaves as carbon dioxide."
    inputs:
      - { item: good.limestone, quantity: 1.785 }
    outputs:
      - { item: good.carbon-dioxide, quantity: 0.7848 }
    rate: 5.0
    power: 18500000
basis:
  - { of: [recipes.inputs, recipes.outputs], tier: derived, note: "From the chemistry: 100 parts of calcium carbonate give 56 of lime and 44 of carbon dioxide." }
  - { of: [recipes.power], tier: sourced, source: "standards/sources/research_machines.json", note: "3.7 GJ a tonne of lime: the best kilns take 3.2 to 4.2, of which 3.2 is what the reaction itself takes. Taken as electric." }
  - { of: [physical, recipes.rate], tier: invented, review: true, note: "Chosen. To be reviewed." }
  - { of: [staff], tier: invented, review: true, note: "A furnace or works' watch: six operators, two metalworkers, a technician, an engineer. Coarse: by the kind of plant, not this one; to be reviewed." }
