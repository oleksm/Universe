# yaml-language-server: $schema=../../schema/module.schema.yaml
identity:
  key: module.chlor-alkali-plant
  name: "Chlor-alkali plant"
  step: "Split brine"
  description: "Cells that pass a current through brine and get caustic soda, chlorine and hydrogen."
physical:
  length: 200
  width: 100
  height: 15
staff:
  - { profession: profession.chemist, count: 2 }
  - { profession: profession.plant-operator, count: 4 }
  - { profession: profession.technician, count: 1 }
recipes:
  - makes: good.caustic-soda
    does: "Salt and water are split by current across a membrane."
    inputs:
      - { item: good.salt, quantity: 1.461 }
      - { item: good.water, quantity: 0.4504 }
    outputs:
      - { item: element.cl, quantity: 0.8863 }
      - { item: element.h, quantity: 0.0252 }
    rate: 2.0
    power: 17900000
life: 788940000
basis:
  - { of: [recipes.inputs, recipes.outputs], tier: derived, source: "standards/sources/research_chemicals.json", note: "From the chemistry: 58.4 parts of salt and 18 of water give 40 of caustic soda, 35.5 of chlorine and 1 of hydrogen. Plants report 1.07 to 1.13 t of caustic soda and 28 kg of hydrogen a tonne of chlorine, which is this." }
  - { of: [recipes.power], tier: sourced, source: "standards/sources/research_chemicals.json", note: "2,800 kWh a tonne of chlorine, the middle of Europe's membrane plants, cells and the rest. The steam to thicken the caustic soda is not counted." }
  - { of: [physical, recipes.rate], tier: invented, review: true, note: "Its size and how much it puts through are chosen. To be reviewed." }
  - { of: [staff], tier: invented, review: true, note: "A chemical plant's watch: two chemists, four operators, a technician. Coarse: by the kind of plant, not this one; to be reviewed." }
  - { of: [life], rule: rule.life-plant }
