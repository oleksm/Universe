- of:
  - recipes
  tier: invented
  review: true
  source: standards/sources/production-chains.yaml
  note: Draft integrated recipes. Routes from the listed sources; ideal net balances or chosen recoveries, not measured industrial yields. Catalysts and
    circulating solvents are internal inventory; their makeup and detailed process equipment remain to qualify.
- of:
  - physical
  - recipes.rate
  - recipes.power
  - staff
  tier: invented
  review: true
  source: standards/sources/production-chains.yaml
  note: Chosen plant allocation, throughput, electric draw and watch. Construction is a coarse budget, not an engineered plant or an authorization to model
    one.
- of:
  - life
  rule: rule.life-plant
- of:
  - physical.mass
  tier: derived
  review: true
  source: standards/sources/production-chains.yaml
  note: Sum of the four construction parts, one of each. Their budgets remain invented and under review.
