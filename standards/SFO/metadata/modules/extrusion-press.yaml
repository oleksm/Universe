identity:
  key: module.extrusion-press
  name: Extrusion press
  step: Extrude to tube
  description: "A hydraulic press that pushes a heated billet through a die round a mandrel: a seamless tube in one stroke, then stretched straight and aged."
physical:
  length: 60
  width: 12
  height: 8
staff:
  - { profession: profession.machinist, count: 4 }
  - { profession: profession.plant-operator, count: 4 }
  - { profession: profession.technician, count: 1 }
