# yaml-language-server: $schema=../../schema/module.schema.yaml
# Its animals breathe the air and drink the water of the place it stands in: from: place. Sealed, it would take both from stores.
identity:
  key: module.fish-farm
  name: "Fish farm"
  step: "Raise fish"
  description: "Ponds or tanks where fish are raised on feed."
physical:
  length: 200
  width: 100
  height: 3
recipes:
  - makes: good.live-fish
    does: "Fish raised on 1.3 kg of feed for each kg they gain. The water they live in is kept, not used up."
    inputs:
      - { item: good.animal-feed, quantity: 1.3 }
      - { item: element.o, quantity: 0.52, from: place }
    outputs:
      - { item: good.carbon-dioxide, quantity: 0.715 }
      - { item: good.manure, quantity: 0.105 }
    rate: 0.009506
    power: 50000
basis:
  - { of: [recipes, recipes.rate, recipes.inputs], tier: sourced, source: "standards/sources/research_food_livestock.json", note: "1 to 1.5 kg of feed for each kg of fish, by its kind; 1.3 taken. The farm's size and rate are chosen." }
  - { of: [recipes.outputs], tier: derived, review: true, note: "By balance, as a barn's." }
  - { of: [physical, recipes.power], tier: invented, review: true, note: "Chosen. To be reviewed." }
