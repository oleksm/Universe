# yaml-language-server: $schema=../../schema/mount.schema.yaml
# SFO 19. Set round the equipment of this slot and class on the list today, with a quarter to spare.
identity:
  key: mount.cargo-s1
  name: "Cargo mount, class 1"
  slot: cargo
  size_class: 1
  description: "What a class 1 cargo slot offers, and what fits it."
envelope:
  length: 3.49
  width: 2.2
  height: 2.2
bears:
  mass: 13800.0
attachment:
  points: 8
  pattern: corners
  each:
    tension: 50600.0
    compression: 50600.0
    shear: 25300.0
# (holder and sockets: written by tools/standards/mounting.py)
