# yaml-language-server: $schema=../../schema/mount.schema.yaml
identity:
  key: mount.gear-s1
  name: "Landing gear mount, class 1"
  slot: gear
  size_class: 1
  description: "What a class 1 landing gear slot offers, and what fits it."
envelope:
  length: 0.968
  width: 0.968
  height: 2.75
bears:
  mass: 600.0
  landing: 500000.0
attachment:
  points: 3
  pattern: trunnion
  each:
    tension: 173000.0
    compression: 173000.0
    shear: 86300.0
mating:
  clocking: {kind: fixed}
  approach: {along: normal, clear: 2.75}
holder: adapter
sockets:
- id: s1
  at: [0.2178, -0.4356, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m30
  connector: stock.st4340-bolt-m30
- id: s2
  at: [0.2178, 0.4356, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m30
  connector: stock.st4340-bolt-m30
- id: s3
  at: [-0.4356, 0.0, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m30
  connector: stock.st4340-bolt-m30
feeds:
  power: 1000.0
basis:
  - { of: [mating], rule: rule.mount-mating }
  - { of: [envelope, bears, attachment, feeds], rule: rule.mounts-margin }
