# yaml-language-server: $schema=../../schema/mount.schema.yaml
identity:
  key: mount.gear-s2
  name: "Landing gear mount, class 2"
  slot: gear
  size_class: 2
  description: "What a class 2 landing gear slot offers, and what fits it."
envelope:
  length: 1.54
  width: 1.54
  height: 4.4
bears:
  mass: 1800.0
  landing: 1500000.0
attachment:
  points: 3
  pattern: trunnion
  each:
    tension: 518000.0
    compression: 518000.0
    shear: 259000.0
mating:
  clocking: {kind: fixed}
  approach: {along: normal, clear: 4.4}
holder: adapter
sockets:
- id: s1
  at: [0.3465, -0.693, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m42
  connector: stock.st4340-bolt-m42
- id: s2
  at: [0.3465, 0.693, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m42
  connector: stock.st4340-bolt-m42
- id: s3
  at: [-0.693, 0.0, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m42
  connector: stock.st4340-bolt-m42
basis:
  - { of: [mating], rule: rule.mount-mating }
  - { of: [envelope, bears, attachment], rule: rule.mounts-margin }
