# SFO 19. Set round the equipment of this slot and class on the list today, with a quarter to spare.
identity:
  key: mount.utility-s1
  name: "Utility mount, class 1"
  slot: utility
  size_class: 1
  description: "What a class 1 utility slot offers, and what fits it."
envelope:
  length: 1.65
  width: 0.88
  height: 2.2
bears:
  mass: 750.0
attachment:
  points: 4
  pattern: corners
  each:
    tension: 5520.0
    compression: 5520.0
    shear: 2760.0
