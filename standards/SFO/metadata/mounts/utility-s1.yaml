# yaml-language-server: $schema=../../schema/mount.schema.yaml
# SFO 19. Set round the equipment of this slot and class on the list today, with a quarter to spare.
identity:
  key: mount.utility-s1
  name: "Utility mount, class 1"
  slot: utility
  size_class: 1
  description: "What a class 1 utility slot offers, and what fits it."
envelope:
  length: 1.65
  width: 0.88
  height: 2.2
bears:
  mass: 750.0
attachment:
  points: 4
  pattern: corners
  each:
    tension: 5520.0
    compression: 5520.0
    shear: 2760.0
# (holder and sockets: written by tools/standards/mounting.py)
holder: deck
sockets:
- id: s1
  at: [-0.7366, -0.375, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.deck-track
- id: s2
  at: [0.7366, -0.375, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.deck-track
- id: s3
  at: [-0.7366, 0.375, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.deck-track
- id: s4
  at: [0.7366, 0.375, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.deck-track
# (end of mounting.py)
feeds:
  power: 125.0
basis:
  - { of: [envelope, bears, attachment, feeds], rule: rule.mounts-margin }
