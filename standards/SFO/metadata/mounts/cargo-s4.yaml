# SFO 19. Set round the equipment of this slot and class on the list today, with a quarter to spare.
identity:
  key: mount.cargo-s4
  name: "Cargo mount, class 4"
  slot: cargo
  size_class: 4
  description: "What a class 4 cargo slot offers, and what fits it."
envelope:
  length: 29.6
  width: 5.84
  height: 5.84
bears:
  mass: 37500.0
attachment:
  points: 8
  pattern: corners
  each:
    tension: 138000.0
    compression: 138000.0
    shear: 69000.0
feeds:
