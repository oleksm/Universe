# yaml-language-server: $schema=../../schema/mount.schema.yaml
# SFO 19. Set round the equipment of this slot and class on the list today, with a quarter to spare.
identity:
  key: mount.command-s3
  name: "Command station mount, class 3"
  slot: command
  size_class: 3
  description: "What a class 3 command station slot offers, and what fits it."
envelope:
  length: 3.85
  width: 3.3
  height: 2.42
bears:
  mass: 1120.0
attachment:
  points: 4
  pattern: corners
  each:
    tension: 8270.0
    compression: 8270.0
    shear: 4140.0
# (holder and sockets: written by tools/standards/mounting.py)
holder: adapter
sockets:
- id: s1
  at: [-1.7325, -1.485, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m10
  connector: stock.st4340-bolt-m10
- id: s2
  at: [1.7325, -1.485, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m10
  connector: stock.st4340-bolt-m10
- id: s3
  at: [1.7325, 1.485, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m10
  connector: stock.st4340-bolt-m10
- id: s4
  at: [-1.7325, 1.485, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m10
  connector: stock.st4340-bolt-m10
# (end of mounting.py)
feeds:
  power: 7500.0
basis:
  - { of: [envelope, bears, attachment, feeds], rule: rule.mounts-margin }
