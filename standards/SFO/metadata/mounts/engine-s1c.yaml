# yaml-language-server: $schema=../../schema/mount.schema.yaml
# SFO 19. Set round the compact class 1 equipment of this slot (at most 2 m a side, 250 kg) on the list today, with a quarter to spare.
identity:
  key: mount.engine-s1c
  name: "Engine mount, class 1 compact"
  slot: engine
  size_class: 1
  description: "What a compact class 1 engine slot offers (pieces at most 2 m a side and 250 kg), and what fits it."
envelope:
