# yaml-language-server: $schema=../../schema/mount.schema.yaml
# SFO 19. Set round the equipment of this slot and class on the list today, with a quarter to spare.
identity:
  key: mount.utility-s2
  name: "Utility mount, class 2"
  slot: utility
  size_class: 2
  description: "What a class 2 utility slot offers, and what fits it."
envelope:
