# yaml-language-server: $schema=../../schema/mount.schema.yaml
# SFO 19. Set round the compact class 1 equipment of this slot (at most 2 m a side, 250 kg) on the list today, with a quarter to spare.
identity:
  key: mount.cargo-s1c
  name: "Cargo mount, class 1 compact"
  slot: cargo
  size_class: 1
  description: "What a compact class 1 cargo slot offers (pieces at most 2 m a side and 250 kg), and what fits it."
envelope:
  length: 1.65
  width: 1.32
  height: 2.2
bears:
  mass: 1440.0
attachment:
  points: 4
  pattern: corners
  each:
    tension: 10600.0
    compression: 10600.0
    shear: 5290.0
# (holder and sockets: written by tools/standards/mounting.py)
holder: adapter
sockets:
- id: s1
  at: [-0.7425, -0.594, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m10
  connector: stock.st4340-bolt-m10
- id: s2
  at: [0.7425, -0.594, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m10
  connector: stock.st4340-bolt-m10
- id: s3
  at: [0.7425, 0.594, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m10
  connector: stock.st4340-bolt-m10
- id: s4
  at: [-0.7425, 0.594, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m10
  connector: stock.st4340-bolt-m10
# (end of mounting.py)
feeds:
  power: 3750.0
basis:
  - { of: [envelope, bears, attachment, feeds], rule: rule.mounts-margin }
