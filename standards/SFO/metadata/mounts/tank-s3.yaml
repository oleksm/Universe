# yaml-language-server: $schema=../../schema/mount.schema.yaml
# SFO 19. Set round the equipment of this slot and class on the list today, with a quarter to spare.
identity:
  key: mount.tank-s3
  name: "Tank mount, class 3"
  slot: tank
  size_class: 3
  description: "What a class 3 tank slot offers, and what fits it."
envelope:
  length: 9.14
  width: 9.14
  height: 9.14
bears:
  mass: 65600.0
attachment:
  points: 4
  pattern: saddles
  each:
    tension: 483000.0
    compression: 483000.0
    shear: 241000.0
# (holder and sockets: written by tools/standards/mounting.py)
holder: adapter
sockets:
- id: s1
  at: [-4.113, -4.113, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m42
  connector: stock.st4340-bolt-m42
- id: s2
  at: [4.113, -4.113, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m42
  connector: stock.st4340-bolt-m42
- id: s3
  at: [4.113, 4.113, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m42
  connector: stock.st4340-bolt-m42
- id: s4
  at: [-4.113, 4.113, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m42
  connector: stock.st4340-bolt-m42
# (end of mounting.py)
basis:
  - { of: [envelope, bears, attachment], rule: rule.mounts-margin }
