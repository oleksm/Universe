# yaml-language-server: $schema=../../schema/mount.schema.yaml
# SFO 19. Set round the equipment of this slot and class on the list today, with a quarter to spare.
identity:
  key: mount.drive-s3
  name: "Main drive mount, class 3"
  slot: drive
  size_class: 3
  description: "What a class 3 main drive slot offers, and what fits it."
envelope:
  length: 29.6
  width: 13.2
  height: 4.37
bears:
  mass: 17500.0
  thrust: 2500000.0
attachment:
  points: 8
  pattern: ring
  each:
    tension: 377000.0
    compression: 377000.0
    shear: 188000.0
# (holder and sockets: written by tools/standards/mounting.py)
holder: adapter
sockets:
- id: s1
  at: [5.94, 0.0, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m42
  connector: stock.st4340-bolt-m42
- id: s2
  at: [4.2002, 4.2002, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m42
  connector: stock.st4340-bolt-m42
- id: s3
  at: [0.0, 5.94, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m42
  connector: stock.st4340-bolt-m42
- id: s4
  at: [-4.2002, 4.2002, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m42
  connector: stock.st4340-bolt-m42
- id: s5
  at: [-5.94, 0.0, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m42
  connector: stock.st4340-bolt-m42
- id: s6
  at: [-4.2002, -4.2002, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m42
  connector: stock.st4340-bolt-m42
- id: s7
  at: [-0.0, -5.94, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m42
  connector: stock.st4340-bolt-m42
- id: s8
  at: [4.2002, -4.2002, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m42
  connector: stock.st4340-bolt-m42
# (end of mounting.py)
feeds:
  power: 2500000.0
  cooling: 12500000.0
  fuel: 0.25
nozzle:
  diameter: 9.6
basis:
  - { of: [envelope, bears, attachment, feeds, nozzle], rule: rule.mounts-margin }
