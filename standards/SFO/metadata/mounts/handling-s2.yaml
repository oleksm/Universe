  connector: stock.st4340-bolt-m16
- id: s2
  at: [8.01, -0.6345, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m16
  connector: stock.st4340-bolt-m16
- id: s3
  at: [8.01, 0.6345, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m16
  connector: stock.st4340-bolt-m16
- id: s4
  at: [-8.01, 0.6345, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m16
  connector: stock.st4340-bolt-m16
# (end of mounting.py)
feeds:
  power: 9380.0
basis:
  - { of: [envelope, bears, attachment, feeds], rule: rule.mounts-margin }
