# yaml-language-server: $schema=../../schema/mount.schema.yaml
# SFO 19. Set round the equipment of this slot and class on the list today, with a quarter to spare.
identity:
  key: mount.handling-s2
  name: "Handling mount, class 2"
  slot: handling
  size_class: 2
  description: "What a class 2 handling slot offers, and what fits it."
envelope:
  length: 17.8
  width: 1.41
  height: 1.71
bears:
  mass: 1630.0
  moment: 114000.0
