# yaml-language-server: $schema=../../schema/mount.schema.yaml
identity:
  key: mount.thrusters-s1
  name: "Thruster mount, class 1"
  slot: thrusters
  size_class: 1
  description: "What a class 1 thruster slot offers, and what fits it."
envelope:
  length: 1.25
  width: 1.25
  height: 1.25
bears:
  mass: 875.0
  thrust: 150000.0
attachment:
  points: 4
  pattern: ring
  each:
    tension: 43900.0
    compression: 43900.0
    shear: 37500.0
holder: adapter
sockets:
- id: s1
  at: [0.5625, 0.0, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m16
  connector: stock.st4340-bolt-m16
- id: s2
  at: [0.0, 0.5625, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m16
  connector: stock.st4340-bolt-m16
- id: s3
  at: [-0.5625, 0.0, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m16
  connector: stock.st4340-bolt-m16
- id: s4
  at: [-0.0, -0.5625, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m16
  connector: stock.st4340-bolt-m16
feeds:
  power: 125000.0
  cooling: 750000.0
  fuel: 0.015
nozzle:
  diameter: 0.912
basis:
  - { of: [envelope, bears, attachment, feeds, nozzle], rule: rule.mounts-margin }
