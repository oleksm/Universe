# yaml-language-server: $schema=../../schema/mount.schema.yaml
# SFO 19. Set round the equipment of this slot and class on the list today, with a quarter to spare.
identity:
  key: mount.comm-s1
  name: "Comm mount, class 1"
  slot: comm
  size_class: 1
  description: "What a class 1 comm slot offers, and what fits it."
envelope:
  length: 3.3
  width: 3.3
  height: 1.65
bears:
  mass: 375.0
attachment:
  points: 4
  pattern: corners
  each:
    tension: 2760.0
    compression: 2760.0
    shear: 1380.0
# (holder and sockets: written by tools/standards/mounting.py)
holder: adapter
sockets:
- id: s1
  at: [-1.485, -1.485, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m10
  connector: stock.st4340-bolt-m10
- id: s2
  at: [1.485, -1.485, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m10
  connector: stock.st4340-bolt-m10
- id: s3
  at: [1.485, 1.485, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m10
  connector: stock.st4340-bolt-m10
- id: s4
  at: [-1.485, 1.485, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m10
  connector: stock.st4340-bolt-m10
# (end of mounting.py)
feeds:
  power: 250000.0
basis:
  - { of: [envelope, bears, attachment, feeds], rule: rule.mounts-margin }
