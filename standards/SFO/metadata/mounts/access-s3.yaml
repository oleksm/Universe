# yaml-language-server: $schema=../../schema/mount.schema.yaml
# SFO 19. Set round the equipment of this slot and class on the list today, with a quarter to spare.
identity:
  key: mount.access-s3
  name: "Access mount, class 3"
  slot: access
  size_class: 3
  description: "What a class 3 access slot offers, and what fits it."
envelope:
  length: 13.2
  width: 8.8
  height: 4.08
bears:
