# yaml-language-server: $schema=../../schema/mount.schema.yaml
# SFO 19. Set round the equipment of this slot and class on the list today, with a quarter to spare.
identity:
  key: mount.tank-s4
  name: "Tank mount, class 4"
  slot: tank
  size_class: 4
  description: "What a class 4 tank slot offers, and what fits it."
envelope:
  length: 12.7
  width: 12.7
  height: 12.7
bears:
  mass: 131000.0
attachment:
  points: 4
  pattern: saddles
  each:
    tension: 965000.0
    compression: 965000.0
    shear: 483000.0
# (holder and sockets: written by tools/standards/mounting.py)
holder: adapter
sockets:
- id: s1
  at: [-5.715, -5.715, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m56
  connector: stock.st4340-bolt-m56
- id: s2
  at: [5.715, -5.715, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m56
  connector: stock.st4340-bolt-m56
- id: s3
  at: [5.715, 5.715, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m56
  connector: stock.st4340-bolt-m56
- id: s4
  at: [-5.715, 5.715, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m56
  connector: stock.st4340-bolt-m56
# (end of mounting.py)
basis:
  - { of: [envelope, bears, attachment], rule: rule.mounts-margin }
