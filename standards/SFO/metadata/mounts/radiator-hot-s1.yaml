# yaml-language-server: $schema=../../schema/mount.schema.yaml
# SFO 19. Set round the hot radiator panel of this class, with a quarter to spare.
identity:
  key: mount.radiator-hot-s1
  name: Hot radiator mount, class 1
  slot: thermal
  size_class: 1
  description: 'What a hull offers a hot radiator panel: the hull area it lies against stowed, the root hinge''s seats, and the engine''s coolant run to it.'
envelope:
  length: 18.44
  width: 10.6
  height: 2.58
bears:
  mass: 5184.0
attachment:
  points: 4
  pattern: corners
  each:
    tension: 38200.0
    compression: 38200.0
    shear: 19000.0
# (holder and sockets: written by tools/standards/mounting.py)
holder: adapter
sockets:
- id: s1
  at: [-8.298, -4.77, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m16
  connector: stock.st4340-bolt-m16
- id: s2
  at: [8.298, -4.77, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m16
  connector: stock.st4340-bolt-m16
- id: s3
  at: [8.298, 4.77, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m16
  connector: stock.st4340-bolt-m16
- id: s4
  at: [-8.298, 4.77, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m16
  connector: stock.st4340-bolt-m16
# (end of mounting.py)
basis:
- of:
  - envelope
  - bears
  - attachment
  rule: rule.mounts-margin
