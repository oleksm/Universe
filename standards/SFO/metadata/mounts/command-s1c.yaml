# yaml-language-server: $schema=../../schema/mount.schema.yaml
identity:
  key: mount.command-s1c
  name: "Command station mount, class 1 compact"
  slot: command
  size_class: 1
  description: "What a compact class 1 command station slot offers (pieces at most 2 m a side and 250 kg), and what fits it."
envelope:
  length: 1.32
  width: 1.1
  height: 1.65
bears:
  mass: 225.0
attachment:
  points: 4
  pattern: corners
  each:
    tension: 1650.0
    compression: 1650.0
    shear: 827.0
holder: adapter
sockets:
- id: s1
  at: [-0.594, -0.495, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m10
  connector: stock.st4340-bolt-m10
- id: s2
  at: [0.594, -0.495, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m10
  connector: stock.st4340-bolt-m10
- id: s3
  at: [0.594, 0.495, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m10
  connector: stock.st4340-bolt-m10
- id: s4
  at: [-0.594, 0.495, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m10
  connector: stock.st4340-bolt-m10
feeds:
  power: 1880.0
basis:
  - { of: [envelope, bears, attachment, feeds], rule: rule.mounts-margin }
