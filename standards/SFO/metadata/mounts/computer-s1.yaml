# yaml-language-server: $schema=../../schema/mount.schema.yaml
# SFO 19. Set round the equipment of this slot and class on the list today, with a quarter to spare.
identity:
  key: mount.computer-s1
  name: "Flight computer mount, class 1"
  slot: computer
  size_class: 1
  description: "What a class 1 flight computer slot offers, and what fits it."
envelope:
  length: 0.66
  width: 0.44
  height: 0.33
bears:
  mass: 56.2
attachment:
  points: 4
  pattern: corners
  each:
    tension: 414.0
    compression: 414.0
    shear: 207.0
# (holder and sockets: written by tools/standards/mounting.py)
holder: deck
sockets:
- id: s1
  at: [-0.2794, -0.125, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.deck-track
- id: s2
  at: [0.2794, -0.125, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.deck-track
- id: s3
  at: [-0.2794, 0.125, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.deck-track
- id: s4
  at: [0.2794, 0.125, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.deck-track
# (end of mounting.py)
feeds:
  power: 375.0
basis:
  - { of: [envelope, bears, attachment, feeds], rule: rule.mounts-margin }
