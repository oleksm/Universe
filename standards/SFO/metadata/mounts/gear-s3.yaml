# yaml-language-server: $schema=../../schema/mount.schema.yaml
# SFO 19. Set round the equipment of this slot and class on the list today, with a quarter to spare.
identity:
  key: mount.gear-s3
  name: "Landing gear mount, class 3"
  slot: gear
  size_class: 3
  description: "What a class 3 landing gear slot offers, and what fits it."
envelope:
  length: 7.11
  width: 3.67
  height: 6.6
bears:
  mass: 5250.0
  landing: 4380000.0
attachment:
  points: 3
  pattern: trunnion
  each:
    tension: 1510000.0
    compression: 1510000.0
    shear: 755000.0
# (holder and sockets: written by tools/standards/mounting.py)
holder: adapter
sockets:
- id: s1
  at: [1.5998, -1.6515, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m80
  connector: stock.st4340-bolt-m80
- id: s2
  at: [1.5998, 1.6515, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m80
  connector: stock.st4340-bolt-m80
- id: s3
  at: [-3.1995, 0.0, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m80
  connector: stock.st4340-bolt-m80
# (end of mounting.py)
basis:
  - { of: [envelope, bears, attachment], rule: rule.mounts-margin }
