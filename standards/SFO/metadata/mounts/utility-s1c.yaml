- id: s2
  at: [0.4826, -0.375, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.deck-track
- id: s3
  at: [-0.4826, 0.375, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.deck-track
- id: s4
  at: [0.4826, 0.375, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.deck-track
feeds:
  power: 38800.0
basis:
