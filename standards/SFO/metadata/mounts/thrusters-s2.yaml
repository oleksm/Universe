# yaml-language-server: $schema=../../schema/mount.schema.yaml
identity:
  key: mount.thrusters-s2
  name: "Thruster mount, class 2"
  slot: thrusters
  size_class: 2
  description: "What a class 2 thruster slot offers, and what fits it."
envelope:
  length: 1.58
  width: 1.58
  height: 1.58
bears:
  mass: 1880.0
  thrust: 338000.0
attachment:
  points: 4
  pattern: ring
  each:
    tension: 98200.0
    compression: 98200.0
    shear: 84400.0
mating:
  clocking: {kind: steps, step: 1.570796}
  approach: {along: normal, clear: 1.58}
holder: adapter
sockets:
- id: s1
  at: [0.711, 0.0, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m20
  connector: stock.st4340-bolt-m20
- id: s2
  at: [0.0, 0.711, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m20
  connector: stock.st4340-bolt-m20
- id: s3
  at: [-0.711, 0.0, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m20
  connector: stock.st4340-bolt-m20
- id: s4
  at: [-0.0, -0.711, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m20
  connector: stock.st4340-bolt-m20
feeds:
  power: 250000.0
  cooling: 1690000.0
  fuel: 0.0338
nozzle:
  diameter: 1.15
basis:
  - { of: [mating], rule: rule.mount-mating }
  - { of: [envelope, bears, attachment, feeds, nozzle], rule: rule.mounts-margin }
