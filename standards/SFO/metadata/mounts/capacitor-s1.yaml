# yaml-language-server: $schema=../../schema/mount.schema.yaml
# SFO 19. Set round the equipment of this slot and class on the list today, with a quarter to spare.
identity:
  key: mount.capacitor-s1
  name: "Capacitor mount, class 1"
  slot: capacitor
  size_class: 1
  description: "What a class 1 capacitor slot offers, and what fits it."
envelope:
  length: 1.65
  width: 1.1
  height: 1.1
bears:
  mass: 625.0
attachment:
  points: 4
  pattern: corners
  each:
    tension: 4600.0
    compression: 4600.0
    shear: 2300.0
# (holder and sockets: written by tools/standards/mounting.py)
holder: adapter
sockets:
- id: s1
  at: [-0.7425, -0.495, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m10
  connector: stock.st4340-bolt-m10
- id: s2
  at: [0.7425, -0.495, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m10
  connector: stock.st4340-bolt-m10
- id: s3
  at: [0.7425, 0.495, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m10
  connector: stock.st4340-bolt-m10
- id: s4
  at: [-0.7425, 0.495, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m10
  connector: stock.st4340-bolt-m10
# (end of mounting.py)
basis:
  - { of: [envelope, bears, attachment], rule: rule.mounts-margin }
