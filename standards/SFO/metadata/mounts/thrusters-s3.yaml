# yaml-language-server: $schema=../../schema/mount.schema.yaml
identity:
  key: mount.thrusters-s3
  name: "Thruster mount, class 3"
  slot: thrusters
  size_class: 3
  description: "What a class 3 thruster slot offers, and what fits it."
envelope:
  length: 2.29
  width: 2.29
  height: 2.29
bears:
  mass: 5620.0
  thrust: 1120000.0
attachment:
  points: 4
  pattern: ring
  each:
    tension: 323000.0
    compression: 323000.0
    shear: 281000.0
holder: adapter
sockets:
- id: s1
  at: [1.0305, 0.0, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m42
  connector: stock.st4340-bolt-m42
- id: s2
  at: [0.0, 1.0305, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m42
  connector: stock.st4340-bolt-m42
- id: s3
  at: [-1.0305, 0.0, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m42
  connector: stock.st4340-bolt-m42
- id: s4
  at: [-0.0, -1.0305, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m42
  connector: stock.st4340-bolt-m42
feeds:
  power: 625000.0
  cooling: 5620000.0
  fuel: 0.112
nozzle:
  diameter: 1.66
basis:
  - { of: [envelope, bears, attachment, feeds, nozzle], rule: rule.mounts-margin }
