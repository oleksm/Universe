# yaml-language-server: $schema=../../schema/mount.schema.yaml
# SFO 19. Set round the equipment of this slot and class on the list today, with a quarter to spare.
identity:
  key: mount.transponder-s1
  name: "Transponder mount, class 1"
  slot: transponder
  size_class: 1
  description: "What a class 1 transponder slot offers, and what fits it."
envelope:
  length: 0.22
  width: 0.165
  height: 0.187
bears:
  mass: 3.75
attachment:
  points: 4
  pattern: corners
  each:
    tension: 27.6
    compression: 27.6
    shear: 13.8
feeds:
  power: 25.0
basis:
  - { of: [envelope, bears, attachment, feeds], tier: invented, review: true, note: "The most of each among the equipment of this slot and class today, with a tenth more room and a quarter more weight, power and thrust. The cooling a propulsion mount gives is a millionth of the jet's loss (the share a ship takes of its plume: docs/ships/equipment-review.md). The nozzle opening is four fifths of the mount's width. A first standard: it describes what is, not what a hull should give. The attachment: its pattern by kind; each point takes the mount's weight at 3 g (a design acceleration, chosen) plus its thrust, landing or recoil load, with the margin; the same in tension for a reversal; shear half." }
