# yaml-language-server: $schema=../../schema/mount.schema.yaml
# SFO 19. Set round the equipment of this slot and class on the list today, with a quarter to spare.
identity:
  key: mount.transponder-s1
  name: "Transponder mount, class 1"
  slot: transponder
  size_class: 1
  description: "What a class 1 transponder slot offers, and what fits it."
envelope:
  length: 0.22
  width: 0.165
  height: 0.187
bears:
  mass: 3.75
attachment:
  points: 4
  pattern: corners
  each:
    tension: 27.6
    compression: 27.6
    shear: 13.8
# (holder and sockets: written by tools/standards/mounting.py)
holder: deck
sockets:
- id: s1
  at: [-0.0762, -0.125, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.deck-track
- id: s2
  at: [0.0762, -0.125, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.deck-track
- id: s3
  at: [-0.0762, 0.125, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.deck-track
- id: s4
  at: [0.0762, 0.125, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.deck-track
# (end of mounting.py)
feeds:
  power: 25.0
basis:
  - { of: [envelope, bears, attachment, feeds], rule: rule.mounts-margin }
