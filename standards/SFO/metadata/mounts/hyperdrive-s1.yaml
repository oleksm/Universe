# yaml-language-server: $schema=../../schema/mount.schema.yaml
# SFO 19. Set round the equipment of this slot and class on the list today, with a quarter to spare.
identity:
  key: mount.hyperdrive-s1
  name: "Hyperdrive mount, class 1"
  slot: hyperdrive
  size_class: 1
  description: "What a class 1 hyperdrive slot offers, and what fits it."
envelope:
  length: 2.62
  width: 1.75
  height: 1.75
bears:
  mass: 3250.0
attachment:
  points: 8
  pattern: corners
  each:
    tension: 12000.0
    compression: 12000.0
    shear: 5980.0
# (holder and sockets: written by tools/standards/mounting.py)
holder: adapter
sockets:
- id: s1
  at: [-1.179, -0.7875, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m10
  connector: stock.st4340-bolt-m10
- id: s2
  at: [1.179, -0.7875, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m10
  connector: stock.st4340-bolt-m10
- id: s3
  at: [1.179, 0.7875, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m10
  connector: stock.st4340-bolt-m10
- id: s4
  at: [-1.179, 0.7875, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m10
  connector: stock.st4340-bolt-m10
- id: s5
  at: [0.0, -0.7875, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m10
  connector: stock.st4340-bolt-m10
- id: s6
  at: [1.179, 0.0, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m10
  connector: stock.st4340-bolt-m10
- id: s7
  at: [0.0, 0.7875, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m10
  connector: stock.st4340-bolt-m10
- id: s8
  at: [-1.179, 0.0, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m10
  connector: stock.st4340-bolt-m10
# (end of mounting.py)
feeds:
  power: 1120000.0
basis:
  - { of: [envelope, bears, attachment, feeds], rule: rule.mounts-margin }
