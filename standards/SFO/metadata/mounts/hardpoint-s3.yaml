# yaml-language-server: $schema=../../schema/mount.schema.yaml
identity:
  key: mount.hardpoint-s3
  name: "Hardpoint mount, class 3"
  slot: hardpoint
  size_class: 3
  description: "What a class 3 hardpoint slot offers, and what fits it."
envelope:
  length: 7.08
  width: 5.87
  height: 5.85
bears:
  mass: 2160.0
  recoil: 9750.0
attachment:
  points: 4
  pattern: ring
  each:
    tension: 18300.0
    compression: 18300.0
    shear: 9150.0
holder: adapter
sockets:
- id: s1
  at: [2.6415, 0.0, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m10
  connector: stock.st4340-bolt-m10
- id: s2
  at: [0.0, 2.6415, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m10
  connector: stock.st4340-bolt-m10
- id: s3
  at: [-2.6415, 0.0, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m10
  connector: stock.st4340-bolt-m10
- id: s4
  at: [-0.0, -2.6415, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m10
  connector: stock.st4340-bolt-m10
basis:
  - { of: [envelope, bears, attachment], rule: rule.mounts-margin }
