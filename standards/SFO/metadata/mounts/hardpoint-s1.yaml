# yaml-language-server: $schema=../../schema/mount.schema.yaml
identity:
  key: mount.hardpoint-s1
  name: "Hardpoint mount, class 1"
  slot: hardpoint
  size_class: 1
  description: "What a class 1 hardpoint slot offers, and what fits it."
envelope:
  length: 11.0
  width: 4.4
  height: 2.2
bears:
  mass: 1500.0
  recoil: 18800.0
attachment:
  points: 4
  pattern: ring
  each:
    tension: 15700.0
    compression: 15700.0
    shear: 7860.0
mating:
  clocking: {kind: steps, step: 1.570796}
  approach: {along: normal, clear: 2.2}
holder: adapter
sockets:
- id: s1
  at: [1.98, 0.0, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m10
  connector: stock.st4340-bolt-m10
- id: s2
  at: [0.0, 1.98, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m10
  connector: stock.st4340-bolt-m10
- id: s3
  at: [-1.98, 0.0, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m10
  connector: stock.st4340-bolt-m10
- id: s4
  at: [-0.0, -1.98, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m10
  connector: stock.st4340-bolt-m10
feeds:
  power: 3120000.0
basis:
  - { of: [mating], rule: rule.mount-mating }
  - { of: [envelope, bears, attachment, feeds], rule: rule.mounts-margin }
