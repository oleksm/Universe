# yaml-language-server: $schema=../../schema/mount.schema.yaml
# SFO 19. Set round the equipment of this slot and class on the list today, with a quarter to spare.
identity:
  key: mount.life-support-s2
  name: "Life support mount, class 2"
  slot: life_support
  size_class: 2
  description: "What a class 2 life support slot offers, and what fits it."
envelope:
  length: 3.47
  width: 2.2
  height: 0.935
bears:
  mass: 1880.0
attachment:
  points: 4
  pattern: corners
  each:
    tension: 13800.0
    compression: 13800.0
    shear: 6900.0
# (holder and sockets: written by tools/standards/mounting.py)
holder: adapter
sockets:
- id: s1
  at: [-1.5615, -0.99, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m10
  connector: stock.st4340-bolt-m10
- id: s2
  at: [1.5615, -0.99, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m10
  connector: stock.st4340-bolt-m10
- id: s3
  at: [1.5615, 0.99, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m10
  connector: stock.st4340-bolt-m10
- id: s4
  at: [-1.5615, 0.99, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m10
  connector: stock.st4340-bolt-m10
# (end of mounting.py)
feeds:
  power: 250000.0
basis:
  - { of: [envelope, bears, attachment, feeds], rule: rule.mounts-margin }
