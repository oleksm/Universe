# SFO 19. Set round the equipment of this slot and class on the list today, with a quarter to spare.
identity:
  key: mount.access-s1
  name: "Access mount, class 1"
  slot: access
  size_class: 1
  description: "What a class 1 access slot offers, and what fits it."
envelope:
  length: 6.6
  width: 3.3
  height: 2.42
bears:
  mass: 1880.0
attachment:
  points: 8
  pattern: ring
  each:
    tension: 6900.0
    compression: 6900.0
    shear: 3450.0
basis:
  - { of: [envelope, bears, attachment], tier: invented, review: true, note: "The most of each among the equipment of this slot and class today, with a tenth more room and a quarter more weight, power and thrust. The cooling a propulsion mount gives is a millionth of the jet's loss (the share a ship takes of its plume: docs/ships/equipment-review.md). The nozzle opening is four fifths of the mount's width. A first standard: it describes what is, not what a hull should give. The attachment: its pattern by kind; each point takes the mount's weight at 3 g (a design acceleration, chosen) plus its thrust, landing or recoil load, with the margin; the same in tension for a reversal; shear half." }
