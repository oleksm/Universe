# yaml-language-server: $schema=../../schema/mount.schema.yaml
identity:
  key: mount.hardpoint-s2
  name: "Hardpoint mount, class 2"
  slot: hardpoint
  size_class: 2
  description: "What a class 2 hardpoint slot offers, and what fits it."
envelope:
  length: 7.03
  width: 4.5
  height: 5.92
bears:
  mass: 2160.0
attachment:
  points: 4
  pattern: ring
  each:
    tension: 15900.0
    compression: 15900.0
    shear: 7930.0
mating:
  clocking: {kind: steps, step: 1.570796}
  approach: {along: normal, clear: 5.92}
holder: adapter
sockets:
- id: s1
  at: [2.025, 0.0, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m10
  connector: stock.st4340-bolt-m10
- id: s2
  at: [0.0, 2.025, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m10
  connector: stock.st4340-bolt-m10
- id: s3
  at: [-2.025, 0.0, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m10
  connector: stock.st4340-bolt-m10
- id: s4
  at: [-0.0, -2.025, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m10
  connector: stock.st4340-bolt-m10
basis:
  - { of: [mating], rule: rule.mount-mating }
  - { of: [envelope, bears, attachment], rule: rule.mounts-margin }
