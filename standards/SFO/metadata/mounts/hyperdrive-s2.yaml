# yaml-language-server: $schema=../../schema/mount.schema.yaml
# SFO 19. Set round the equipment of this slot and class on the list today, with a quarter to spare.
identity:
  key: mount.hyperdrive-s2
  name: "Hyperdrive mount, class 2"
  slot: hyperdrive
  size_class: 2
  description: "What a class 2 hyperdrive slot offers, and what fits it."
envelope:
  length: 3.1
  width: 2.07
  height: 2.07
bears:
  mass: 5250.0
attachment:
  points: 8
  pattern: corners
  each:
    tension: 19300.0
    compression: 19300.0
    shear: 9650.0
# (holder and sockets: written by tools/standards/mounting.py)
holder: adapter
