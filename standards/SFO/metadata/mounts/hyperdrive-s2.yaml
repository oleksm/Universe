  interface: interface.insert-m10
  connector: stock.st4340-bolt-m10
- id: s4
  at: [-1.395, 0.9315, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m10
  connector: stock.st4340-bolt-m10
- id: s5
  at: [0.0, -0.9315, 0.0]
  facing: [0.0, 0.0, 1.0]
  interface: interface.insert-m10
  connector: stock.st4340-bolt-m10
- id: s6
  at: [1.395, 0.0, 0.0]
