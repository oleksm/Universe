key: standard.sfo.8
title: Stock
purpose: Stock is anything made, given a code and held to be used or sold. Every item of stock is made from items of the level below it, and can sit on a shelf, be counted and change hands.
details:
  table:
    columns: [Level, An item, Is made from, Counted in]
    rows:
      - [Mill stock, "6061 sheet 3 mm", "a material", "m2, metres or kilograms"]
      - [Part, "MC07-04-001", "mill stock", pieces]
      - [Assembly, "MC07-04 Landing leg", parts, pieces]
      - [Hull, "MC-07", assemblies, pieces]
sections:
  - title: One idea at every level
    text:
      - "Mill stock is sold by measure and cut up; a part or an assembly is counted in pieces and used whole. In everything else they are alike: a code, a specification, what it is made from, how it is made."
