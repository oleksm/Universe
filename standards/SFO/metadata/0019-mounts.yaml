identity:
  key: standard.sfo.19
title: Mounts
parent: standard.sfo.16
records: mounts
purpose: A mount is the agreement between a hull and what is fitted to it. A hull's slot offers a mount; a piece of equipment is built to one. The mount says the most the hull gives and bears there, so that any equipment within its figures fits any hull that offers it, and a maker builds to the mount and sells to every ship that has one, not to one hull.
details:
  text:
    - "What a mount says: the room (an envelope, length by width by height), the weight the structure bears, the thrust one nozzle may put through it and the opening it fires through, the recoil a weapon may kick against it, and what the hull brings to it: electric power, cooling, fuel."
    - "Each mount is of one kind of slot (SFO 16) and one size class, 1 to 4. A slot takes equipment of its class or any smaller: the smaller mounts of a kind are within the larger."
    - "A piece of equipment names the mount it fits (fits). Its own figures must lie within the mount's: its size within the envelope, its weight within what is borne, its draw within the power fed, its nozzles' thrust within the thrust borne."
    - "A hull names the mount each of its slots offers (slots[].mount). The hull's structure, lines and openings there are built to the mount's figures, whatever is fitted."
    - "How a mountable meets it (mating): the mating plane is z = 0 of the mount frame, on a hull its slot's mount_<slot> node with z out of the hull, on a product its model's root; the product lies on +z within the envelope and nothing of it below the plane. In the model files (glTF, docs/asset-contract.md): a hull's mount_<slot> node has its local +Z out of the hull, the mating normal; a product's root lies on its mating face and the product stands on glTF +Y (Blender +Z), so its frame turns into the mount frame by +90 deg about x: the mount frame's (x, y, z) is the product's (x, -z, y). The face is the exact flat area the hull gives at the plane (shape and size), centred on the mount frame's origin, x along. Clocking says the turns about the normal it may be installed at (fixed, in steps, or free); a slot may allow fewer, and so may a product. Approach says how it goes on and off (lowered along the normal, or slid along the plane) and how much of that path the holder keeps clear. Motion is the most a mounted product may move against the holder in service; without it the product is held rigid. The game snaps and checks by these; the registry only states them."
    - "The first mounts are set round the equipment of today, with a margin: a tenth more room, a quarter more weight, power and thrust. They describe what is. As hulls are sized from what they must do, the mounts are to follow, and equipment to be built to them."
status: draft
