identity:
  key: rule.mounts-margin
  name: "Mount margins"
  about: "How the first mounts (SFO 19) were set round the equipment."
statement: "The most of each among the equipment of this slot and class today, with a tenth more room and a quarter more weight, power and thrust. The cooling a propulsion mount gives follows the heat rule (lib.jet_heat, SFO 22). The nozzle opening is four fifths of the mount's width. A first standard: it describes what is, not what a hull should give. The attachment: its pattern by kind; each point takes the mount's weight at 3 g (a design acceleration, chosen) plus its thrust, landing or recoil load, with the margin; the same in tension for a reversal; shear half."
tier: invented
review: true
