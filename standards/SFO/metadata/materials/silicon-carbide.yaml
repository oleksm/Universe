# yaml-language-server: $schema=../../schema/material.schema.yaml
# Data: Wikipedia: Silicon carbide (6H). A range there is given as its middle.
identity:
  name: Silicon carbide
  class: ceramic
  composition:
  - part: Si
    share: 0.7
  - part: C
    share: 0.3
  form:
  - plate
  - tile
mass:
  density: 3210.0
mechanical:
  hardness: 9.25
thermal:
  melting_point: 3103.15
  thermal_conductivity: 325.0
  thermal_expansion: 2.25e-06
optical:
  refractive_index: 2.55
  colour: yellow to green to bluish-black
