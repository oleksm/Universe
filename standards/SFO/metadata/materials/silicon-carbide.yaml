# yaml-language-server: $schema=../../schema/material.schema.yaml
# Fracture toughness: Wikipedia, Fracture toughness (silicon carbide, 3 to 5; a range as its middle).
# Data: Wikipedia: Silicon carbide (6H). A range there is given as its middle.
identity:
  key: material.silicon-carbide
  name: Silicon carbide
  class: ceramic
  composition:
  - part: element.si
    share: 0.7
  - part: element.c
    share: 0.3
  form:
  - tile
mass:
  density: 3210.0
mechanical:
  fracture_toughness: 4000000
  hardness: 9.25
thermal:
  melting_point: 3103.15
  thermal_conductivity: 325.0
  thermal_expansion: 2.25e-06
optical:
  refractive_index: 2.55
  colour: yellow to green to bluish-black
