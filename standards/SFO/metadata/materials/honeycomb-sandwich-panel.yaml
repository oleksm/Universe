# yaml-language-server: $schema=../../schema/material.schema.yaml
# Data: Wikipedia: Honeycomb structure (no figures given there). A range there is given as its middle. Its stock (form sandwich)
# carries each panel's own faces, core and figures (mill-stock.sandwich); this record's density is a middling panel's.
identity:
  key: material.honeycomb-sandwich-panel
  name: Honeycomb sandwich panel
  class: composite
  form:
  - sandwich
mass:
  density: 150
basis:
  - { of: [mass.density], tier: invented, review: true, note: "Chosen: thin skins on a light core. It varies widely with the panel." }
