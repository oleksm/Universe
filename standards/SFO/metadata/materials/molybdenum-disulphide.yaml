# yaml-language-server: $schema=../../schema/material.schema.yaml
# Data: Wikipedia: Molybdenum disulfide. A range there is given as its middle.
identity:
  key: material.molybdenum-disulphide
  name: Molybdenum disulphide
  class: ceramic
  composition:
  - part: Mo
    share: 0.599
  - part: S
    share: 0.401
  form:
  - powder
  - film
mass:
  density: 5060.0
mechanical:
  friction_coefficient: 0.15
thermal:
  melting_point: 2648.15
optical:
  colour: black, lead-gray
environment:
  chemical_resistance: good
