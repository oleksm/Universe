# yaml-language-server: $schema=../../schema/material.schema.yaml
# Fracture toughness: Wikipedia, Fracture toughness (titanium alloy, 84 to 107; a range as its middle).
# Data: Wikipedia: Ti-6Al-4V. A range there is given as its middle.
identity:
  key: material.titanium-alloy-ti-6al-4v
  name: Titanium alloy Ti-6Al-4V
  class: alloy
  composition:
  - part: Ti
    share: 0.9
  - part: Al
    share: 0.06
  - part: V
    share: 0.04
  form:
  - sheet
  - plate
  - bar
  - forging
mass:
  density: 4470.0
mechanical:
  fracture_toughness: 95.5
  youngs_modulus: 108.5
  shear_modulus: 42.5
  poissons_ratio: 0.34
  yield_strength: 900.0
  tensile_strength: 925.0
  elongation_at_break: 0.115
thermal:
  thermal_conductivity: 7.1
making:
  machinability: poor
