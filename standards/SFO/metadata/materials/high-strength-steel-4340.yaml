# yaml-language-server: $schema=../../schema/material.schema.yaml
# Data: Wikipedia: 4340 steel. A range there is given as its middle. Its stiffness: Wikipedia, Young's
# modulus (steel, 200 GPa); its density the usual figure for carbon and low-alloy steel.
identity:
  name: High-strength steel 4340
  class: alloy
  composition:
  - part: Fe
    share: 0.957
  - part: Ni
    share: 0.018
  - part: Cr
    share: 0.008
  - part: Mn
    share: 0.008
  - part: C
    share: 0.004
  - part: Si
    share: 0.0025
  - part: Mo
    share: 0.0025
  form:
  - plate
  - bar
  - forging
  - tube
mass:
  density: 7850.0
mechanical:
  youngs_modulus: 200.0
  yield_strength: 1300.0
  tensile_strength: 1420.0
  elongation_at_break: 0.17
  fracture_toughness: 81.5
  creep_resistance: good
