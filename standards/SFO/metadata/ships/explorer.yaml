# yaml-language-server: $schema=../../schema/ship.schema.yaml
identity:
  key: ship.explorer
  name: Explorer
  description: "The Explorer study hull with its functional fit: two chemical main engines and two lift engines, four
    cold-gas attitude blocks, hydrolox and nitrogen tanks, fuel cell and battery, flight computer, avionics, transponder,
    comm, altimeter and camera, life support, radiators and air coolers. Owner order 2026-10-24; fit by ships."
hull: hull.explorer-study
fit:
  - { slot: main_port, item: equipment.engine.ch.s1 }
  - { slot: main_starboard, item: equipment.engine.ch.s1 }
  - { slot: lift_port, item: equipment.engine.ch.s1 }
  - { slot: lift_starboard, item: equipment.engine.ch.s1 }
  - { slot: rcs_fore_port, item: equipment.engine.cg.s2 }
  - { slot: rcs_fore_starboard, item: equipment.engine.cg.s2 }
  - { slot: rcs_aft_port, item: equipment.engine.cg.s2 }
  - { slot: rcs_aft_starboard, item: equipment.engine.cg.s2 }
  - { slot: tank_1, item: equipment.tank.hydrolox.0p5t }
  - { slot: tank_2, item: equipment.tank.nitrogen.100kg }
  - { slot: power_1, item: equipment.power.fuelcell.s1 }
  - { slot: power_2, item: equipment.power.battery.s0 }
  - { slot: computer, item: equipment.computer.fbw.s1 }
  - { slot: avionics, item: equipment.avionics.nav-basic.s1 }
  - { slot: transponder, item: equipment.transponder.s1 }
  - { slot: comm, item: equipment.comm.basic.s1 }
  - { slot: sensor_belly_1, item: equipment.sensors.altimeter.s1 }
  - { slot: sensor_belly_2, item: equipment.sensors.camera.s1 }
  - { slot: life_support, item: equipment.life-support.cartridge }
  - { slot: thermal_ext_1, item: equipment.thermal.radiator.s0 }
  - { slot: thermal_ext_2, item: equipment.thermal.radiator.s0 }
  - { slot: thermal_ext_3, item: equipment.thermal.radiator.s0 }
  - { slot: thermal_ext_4, item: equipment.thermal.radiator.s0 }
  - { slot: thermal_int_1, item: equipment.thermal.air-cooler.s0 }
  - { slot: thermal_int_2, item: equipment.thermal.air-cooler.s0 }
revision:
  status: draft
  owner: ships
  on_conflict: propose
  because: Owner order 2026-10-24 - a hull is just a hull, the workable fit is a ship; ships' explorer-fit-v2 (fso 98b0fba51 moved here)
