# yaml-language-server: $schema=../../schema/good.schema.yaml
# The game's own ore (content/base/ores.ron): its name and how it stows are the game's.
identity:
  key: good.nickel-iron-ore
  name: Nickel-Iron Ore
  kind: rock
  description: "Asteroid metal: iron with nickel in it, already metal and not an oxide."
physical:
  bulk_density: 4.5
source:
  occurs: asteroids
game:
  goods: goods.ores
  ore: ore.nickel_iron
composition:
  - { part: element.fe, share: 0.91 }
  - { part: element.ni, share: 0.085 }
  - { part: element.co, share: 0.005 }
basis:
  - { of: [physical], tier: sourced, source: "the game: content/base/ores.ron" }
  - { of: [composition], tier: sourced, source: "https://en.wikipedia.org/wiki/Iron_meteorite", note: "Iron meteorites: iron, nickel and cobalt together over 95%; nickel 5 to 25%, 7 to 10.5% in the commonest group. The cobalt share was not found and is set." }
