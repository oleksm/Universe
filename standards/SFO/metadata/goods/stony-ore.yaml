# The game's own ore (content/base/ores.ron): its name and how it stows are the game's.
identity:
  key: good.stony-ore
  name: Stony Ore
  kind: rock
  description: "Common asteroid rock: silicates holding iron, magnesium and calcium as oxides."
physical:
  bulk_density: 1.8
source:
  occurs: asteroids
game:
  goods: goods.ores
  ore: ore.stony
composition:
  - { part: element.o, share: 0.357 }
  - { part: element.fe, share: 0.275 }
  - { part: element.si, share: 0.169 }
  - { part: element.mg, share: 0.14 }
  - { part: element.ni, share: 0.017 }
  - { part: element.ca, share: 0.0125 }
  - { part: element.al, share: 0.0113 }
basis:
  - { of: [physical], tier: sourced, source: "the game: content/base/ores.ron" }
  - { of: [composition], tier: sourced, source: "https://arxiv.org/pdf/1802.04699", note: "The average of H ordinary chondrites that fell. Of the 27.5% iron, 16.7 is metal grains with the nickel in them, 3.4 is in iron sulphide and 7.4 is bound in the silicates as oxide." }
