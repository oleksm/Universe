identity: {key: unit.offgas-filter-sealed, name: 'Off-gas filter, sealed', description: 'Takes the furnace''s 1.4 kg/s of CO with its dust from the steam-cooled duct at about 1 bar and 250 deg C, through ceramic candle filters in a closed vessel, and lets it out past the valve that holds the furnace''s pressure, up a short stack: on an airless world the gas simply leaves (or a later unit can compress it as fuel). The dust is let out through a lock into sealed bins. Gas in at local (-6, 0, 8). Two inlets (SFO 25), each blinded when unused: a DN 1200 flange at (-6, 0, 8) for an arc furnace''s gas and a DN 200 nozzle at (-6, 1.4, 8) for a ladle furnace''s fume; its 400 V box at (5, 0, 1), facing +x.'}
