identity: {key: unit.ingot-crane-10t, name: 'Ingot crane, 10 t', description: 'A double-girder ingot crane on the hall''s runways: it lifts hot ingots off the ingot car, one at a time, onto the cooling racks; later lays each cooled ingot on a crop saw''s table and the cropped ingot onto the crating line''s roller table. Its scissor tongs hang from the single hook by their bail: closed 0.8 m along x, 0.4 m across and 1.8 m tall under the hook; their jaws, 0.4 m long, open from 0.35 to 0.7 m across y and grip an ingot by two opposite faces, standing (below its head) or lying, so a cropped ingot with no eye left is held the same way; parked, the tongs hang closed. Hangs on the frame; names no bay. It travels along its x, its wheels at y -11.4 and +11.4 (22.8 m between the rails), its ends 0.3 m beyond; its origin on the runway''s rail plane; the trolley, with scissor ingot tongs, about 1.5 t of the trolley''s, runs 9 m either way along y, the hook raised to 0.1 m under the rail plane. Parked
    at the hall''s centre. Its box runs from the closed tongs'' jaws, 1.9 m under the rail plane when parked, to the trolley''s top.'}
