identity: {key: unit.dri-cooling-loop, name: Sponge iron cooling loop, description: 'Cools the sponge iron in the shaft''s cooling zone from 850 to 50 deg C: 3.9 kg/s of hydrogen blown up through the zone, out at about 600 deg C, Ports to the shaft on the +y face, 2 m up: hot back by a 2.0 m flange at (2, 4, 2), insulated, cold out by a 1.2 m flange at (-2, 4, 2). The hot gas rises to the top of a vertical shell-and-tube cooler (2.6 m across, z 3 to 12, on legs, at (0, -2.1)), gas in the tubes, water in the shell, down to 60 deg C; out at its bottom by a 1.2 m pipe into the bottom of a small packed scrubber (3 m across, 14 m tall, 12 mm plate, at (-3, 0)) that washes out the dust with recirculated spray and trims the gas to 40 deg C; from its top down to a compressor at x 3 (motor on its -y side) and back to the cold flange. The cooler''s and the scrubber''s water, 784 kg/s at a 10 K rise, by a pair of 0.63 m flanges on the -x face at z 1 (flow y -1, return y 1); the scrubber''s blowdown
    (dust slurry) by a 100 mm drain to (-6, -3, 0.5); the motor''s 6.6 kV supply into its terminal box, cable entry on the -y face at (3, -4, 1).'}
