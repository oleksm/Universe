identity: {key: unit.top-gas-scrubber, name: Top gas scrubber, description: 'A packed tower 8.5 m across and 22 m tall: the top gas up through it against sprayed water, which cools it to 40 deg C, condenses the 26.9 kg/s of water the reduction made and washes out the dust. Gas in at the bottom on -x by a 2.7 m flange at (-6, 0, 2), out at the top by a 2.2 m flange at (0, 0, 23) to the compressor. The condensate and spray water drain from its sump to a skid along x at y 5.3 (7 x 1.4 m, x -3.5 to 3.5): plate exchangers and spray pumps, the cooled water back up a riser to the sprays. The exchangers give the heat to the tower loop, 1,819 kg/s at a 10 K rise, by a pair of 1.0 m flanges on the +y face at z 1 (flow x 2.75, return x 4.25); the condensate overflows by a 200 mm pipe from the skid''s +x end to a flange on the +x face at (6, 5.3, 0.5), to the hydrogen plant. Its ports (SFO 25): gas in DN 2800, out DN 2200; the tower loop''s flanges DN 1000; the pumps'' 400 V at (-6, 5, 1), facing -x.'}
