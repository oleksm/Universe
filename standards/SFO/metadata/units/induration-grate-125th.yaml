identity: {key: unit.induration-grate-125th, name: 'Induration grate, 125 t an hour', description: 'A straight grate 4 m wide with 28 m under its hood: a chain of 51 pallet cars carries a bed of green balls on a layer of fired ones along +x through drying, preheating, firing at about 1,300 deg C, and cooling; the cooling zone''s hot air goes back over the bed to the firing zone, so it needs only 500 kJ of new heat a kilogram, here 17.4 MW from 12 electric plasma torches in the hood (there is no fuel to burn). The chain''s loop: a straight top run 33 m long (x -16.5 to 16.5, the grate''s top 8.5 m up), round sprockets of 1.6 m pitch radius at each end, and back underneath at 5.3 m, 51 cars of 1.5 m filling its 76.1 m; the hood (inside 4 m wide, 28 m long over x -14 to 14, its walls'' lower edge 8.75 m up, clear of the cars'' wheels, with sliding seals down to the cars'' side walls, 4.75 m clear inside, its outer roof 13.8 m up) leaves 2.5 m open at each end to load and tip; the hot-air recycle
    ducts over it reach 17.8 m. Wind boxes between the runs (6 to 8.3 m up), in four groups along the hood: updraft drying x -14 to -10, downdraft drying and preheat -10 to -2, firing and after-firing -2 to 6 (the torches in the hood''s walls there), cooling 6 to 14. Four fan skids on the +y side at x -9, -3, 3 and 9 (y 4.5, centres 3 m up): at x 9 the cooling fan blows outside air up through the cooling boxes; the hot air off the bed there goes back by a duct over the hood''s roof from x 11 to the firing zone at x -3 (direct recuperation); at x 3 the recuperation fan draws the firing boxes'' gas and blows it up through the updraft drying boxes; at x -3 the hood exhaust fan draws the updraft drying hood, and at x -9 the waste gas fan the downdraft drying and preheat boxes, both into one waste header to the layout''s duct. Gas: the cooling fan 38 kg/s of air, the recuperation duct over the roof the same at about 1,000 deg C (2.9 m inside 0.3 m of lining), the recuperation fan 49 kg/s at about
    350 deg C (2.4 m mains), the two waste fans as much again at about 120 deg C (1.9 m mains); each box group''s down-legs 1.0 to 1.2 m, one every 4 m. Green balls in on a roller feeder at local (-20, 0, 9) over the loading end; fired pellets tip off the +x sprocket into a chute to (21, 0, 2); waste gas out to the layout''s duct at (0, 6, 3); the torches'' cooling water (a tenth of their power) by a pair of 171 mm flanges on the -y face at (0, -6, 1) flow and (0.6, -6, 1) return, a ring main along the hood''s walls to each torch.'}
