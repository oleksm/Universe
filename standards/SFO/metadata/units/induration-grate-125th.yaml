identity: {key: unit.induration-grate-125th, name: 'Induration grate, 125 t an hour', description: 'A straight grate 4 m wide with 28 m under its hood: a chain of 44 pallet cars carries a bed of green balls on a layer of fired ones along +x through drying, preheating, firing at about 1,300 deg C, and cooling; the cooling zone''s hot air goes back over the bed to the firing zone, so it needs only 500 kJ of new heat a kilogram, here 17.4 MW from 12 electric plasma torches in the hood (there is no fuel to burn). Wind boxes under the grate, 5 m up on the machine''s frame, draw the gas down through the bed to four process fans. Green balls in on a roller feeder at local (-20, 0, 9); fired pellets off its +x end at (21, 0, 2); waste gas out to the layout''s duct at (0, 6, 3).'}
