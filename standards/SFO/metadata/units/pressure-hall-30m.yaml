identity: {key: unit.pressure-hall-30m, name: 'Pressure hall section, 30 m', description: 'A 30 m length of a steel tube 30 m across lying on its side, flanged at both ends to the next section or a head, for a hall held at 20 kPa of nitrogen on airless ground (water stays liquid in it to about 60 deg C). Its 6 mm shell carries the pressure in hoop (50 MPa); 10 T rings 400 mm deep every 3 m stiffen it and carry the deck and the crane runways; the outside is wrapped in multilayer insulation against the lunar day and night. Local frame: the axis along x at z 15, the ends at x -15 and 15, its bottom on the cradle at z 0. A steel deck at z 7.5, 25.0 m wide (clear of the rings), on posts down to the shell, the gaps to the shell between rings closed by edge plates; the crane runways'' rail plane at z 24, y -11.4 and 11.4, the runway boxes under it hung from the rings. Each end has an outward flange ring 300 x 30 mm welded to the shell, its bolt holes at 150 mm; the bolts and the double O-rings
    between two rings are the layout''s (the hall''s joints), not the section''s. The section stands on a cradle of sintered regolith that is the layout''s ground, grooved where the flange rings reach 0.3 m below the tube''s bottom (z -0.3 to 30.3). Fan coils under the deck take 173 kW of the machines'' heat out of the gas into the layout''s radiator loop, by a pair of 150 mm stubs rising through the deck at local (-14, -12) and (-13.2, -12) (clear of the ring at x -13.5), and their fans'' 400 V entry at (-12.4, -12), their faces facing up at the deck''s plane, z 7.5; the hall''s inner pipes run along the deck''s south edge to them. The section holds 4,875 kg of nitrogen.'}
