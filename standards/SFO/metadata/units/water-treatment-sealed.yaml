identity: {key: unit.water-treatment-sealed, name: 'Water treatment, sealed', description: 'Makes the 4.7 kg/s (17.0 m3/h) of demineralised water the cells split, below 1 uS/cm, from 20.3 m3/h of the shaft furnace''s condensate and melted ice, in a closed house of insulated sandwich panels under multi-layer insulation, unpressurised (the crews work in suits), every tank sealed under a nitrogen blanket with no vent to the vacuum, trace heaters for the night. A service aisle along x at y -1.2 to 1.2. In order: two sand filters east (1.7 m across, 2.5 m straight with dished heads, 7 mm plate rubber-lined, on 0.5 m legs, centres (4.6, -2.2) and (4.6, 2.2)), one backwashing while the other runs; a cartridge filter (0.4 m across, 1.5 m, at (2.6, 1.6)) and the antiscalant dosing; the reverse osmosis bank north, 5 pressure tubes 0.21 m across and 6.7 m long in stainless, horizontal along x from x -3.6 to 3.1, in a rack y 1.8 to 3.6, z 0.4 to 2.6 (3 first stage, 2 second, 30 elements, 10 bar, 85%
    recovery); a closed cabinet west for the electrodeionisation stage (x -5.8 to -4.2, y -2.2 to 2.2, 2.2 m tall: 6 modules and their DC supplies); the pump skid south (x -3.6 to 3.4, y -3.8 to -1.6): the feed booster, high-pressure, product, backwash and cleaning pumps, the cleaning tank (1 m3) and the permeate break tank (2 m across, 1.6 m tall, at (-2.4, -2.7)). Raw water in at local (6, -1.6, 0.5), beside the crew door at the aisle''s east end (y -0.6 to 0.6, at grade), clean water out at (-6, 0, 0.5); reject and backwash out by a 150 mm flange at (6, 3.4, 0.3) (3.3 m3/h of concentrate, 81 m3/h while a filter backwashes). Its reject is kept: back with the raw water''s return, beyond the layout, to the ice plant''s evaporator. 400 V supply at (-6, -3.4, 0.5).'}
