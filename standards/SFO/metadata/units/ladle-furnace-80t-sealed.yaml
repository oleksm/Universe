- {what: Electrode masts, item: material.structural-steel-a36, mass: 7830.0, note: 'three box masts 0.5 m, 25 mm wall, 7 m'}
- {what: Current-conducting arms, item: material.aluminium-1350, mass: 843.0, note: 'three box arms 0.5 x 0.35 m, 20 mm wall, trimmed at their insulated carriages: measured on blender''s model (candidate v01)'}
- {what: Secondary cables, item: material.copper, mass: 1366.0, note: 'two water-cooled copper cables a phase, each 2630 mm2 for half of 26 kA at 5 A/mm2, run behind the steel and over the top on six insulators: measured on blender''s model (1,414 kg for 10 m each); v2: their lower tails moved to the bus joint''s phases at 0.6 m, -162.3 kg on blender''s model v2 (2026-10-16)'}
- {what: Roof lift and mast hydraulics, item: good.pumps, mass: 6000.0, note: from memory}
- {what: Electrode glands, item: material.structural-steel-a36, mass: 368.7, note: insulated water-cooled glands round the electrodes; measured on blender's model v1}
- {what: Rim seal and gland packing, item: material.silicon-carbide, mass: 150.0, note: 'a soft ring of ceramic fibre rope on the roof''s skirt (a hot rim burns elastomers), which leaks some argon that the feed makes up, and the glands'' packing; silicon carbide stands for the ceramic fibre, from memory'}
- {what: Roof locks, item: material.structural-steel-a36, mass: 1023.0, note: '50 kPa under the roof over the ladle''s 2.9 m mouth lifts it with about 330 kN; the roof''s own weight (about 5.8 t, 9 kN at 1.6 m/s2) barely counts against it, so lock collars on the two lift rods take about 165 kN each through twin 40 x 100 mm straps (about 21 MPa) to the cylinders'' fixed heads on the gantry; measured on model v1'}
