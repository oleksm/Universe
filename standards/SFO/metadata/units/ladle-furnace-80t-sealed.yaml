- {what: Lock drives, item: good.electric-motors, mass: 500.0, note: 'the locks'' actuators, from memory'}
- {what: Fume riser and argon piping, item: material.stainless-steel-304, mass: 92.75, note: the DN 200 fume riser to its flange and the argon feed to the roof; measured on blender's model v2 (2026-10-16)}
- {what: Bus insulators, item: material.silicon-carbide, mass: 111.5, note: 'the bus pads'' insulators, alumina at 3,000 kg/m3 (silicon carbide stands for it); measured on blender''s model v2 (2026-10-16)'}
