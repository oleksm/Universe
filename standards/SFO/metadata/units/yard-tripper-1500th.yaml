identity: {key: unit.yard-tripper-1500th, name: 'Yard belt tripper, 1,500 t an hour', description: 'A car on the stacker-reclaimer''s rails, coupled behind it by a drawbar, that lifts the yard belt out of its run: the belt climbs over the tripper at 15 degrees (31.7 m to rise 8.5 m, from 1 m up to its head pulley''s top at 9.5 m), turns down round the head and back to the yard under the car. Stacking, the ore leaves over the head down a covered chute at 45 degrees into a feed hopper on the slewing axis, carried by the head''s frame, its outlet at (0, 0, 8.5) over the boom''s tail, which turns under it; reclaiming, a flap closes the chute and the ore the machine sends down its central chute lands on the belt beyond the tripper. Its origin on the running plane under the head''s chute, at the machine''s slewing centre when coupled; it reaches back to local x -33.7, its tail at 1 m. Four bogies on the 10 m gauge, two travel drives that follow the machine''s; two fixed drawbars, the tripper''s,
    from its front bogies'' ends (x -8.75) by cross pins to brackets, also the tripper''s, bolted flush to the machine''s rear bogies'' end faces (x -7.2, y -5.06 and 5.06, 1 m up), for the belt''s pull on the head (about 10 kN lifting the ore, a few times that in start-up tension, from memory) and the car''s own rolling.'}
