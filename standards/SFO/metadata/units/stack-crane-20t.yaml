identity: {key: unit.stack-crane-20t, name: 'Stack crane, 20 t', description: 'A double-girder stack crane on the hall''s runways: it lifts an electrolyser stack''s end plates and cell packs out for refurbishment and sets in new ones. Hangs on the frame; names no bay. It travels along its x, its wheels at y -11.4 and +11.4 (22.8 m between the rails), its ends 0.3 m beyond; its origin on the runway''s rail plane; the trolley, with a main hoist, runs 9 m either way along y, the hook raised to 0.1 m under the rail plane. Parked at the hall''s centre.'}
size_class: 2
physical: {length: 8.0, width: 23.4, height: 3.0, mass: 28190.0}
built_of:
- {what: Bridge girders, item: material.structural-steel-a36, mass: 19190.0, note: 'two box girders 1.4 x 0.8 m, 12 mm wall, 23.4 m long over a 22.8 m span, the lightest that meet span/800 under the load (8.2 mm, span/2791) and 150 MPa with every load on (48 MPa)'}
- {what: Trolley and hoist, item: material.structural-steel-a36, mass: 6000.0, note: 'with a main hoist: 30% of the load, from memory'}
- {what: End carriages and drives, item: good.electric-motors, mass: 3000.0, note: '15% of the load, from memory'}
needs: {power: 40000.0}
product: product.overhead-crane
motion:
- id: travel
  kind: travel
  direction: [1.0, 0.0, 0.0]
  moves: [the whole crane]
  note: along its rails or runways; its range is the layout's
- id: traverse
  kind: travel
  direction: [0.0, 1.0, 0.0]
  distance: [-9.0, 9.0]
  moves: [the trolley and its hook]
  note: 'across the bridge, 9 m either way as the description says (at most 1.5 m short of each end), its end stops there (invented; blender''s sweep of the 150 t moon gantry, 2026-10-18: at 10.7 m its wheels met the stops)'
- id: hoist
  kind: lift
  direction: [0.0, 0.0, 1.0]
  moves: [the hook and what it carries]
  note: from parked down to the floor or the load; its depth is the layout's
