identity: {key: unit.filter-press-2, name: 'Filter presses, 2', description: 'Two membrane plate presses back to back take the water out of the mill''s slurry (70% solids) down to 9%, pushing it through cloth at 6 bar, which works the same at the hall''s 20 kPa as in air (a vacuum filter would pull against a fifth of an atmosphere): each has 13 chambers between 2.5 m polypropylene plates, filled, squeezed by its membranes at 15 bar and opened every 10 minutes, the two in turn, so the cake falls in slabs about every 5. Their fixed heads stand back to back at local x 0, their plate packs from x 0.5 to 3.5 each way, their closing cylinders (9.5 MN) at the outer ends (x ±6), all on a stand whose top is 8 m up, the presses'' axis at z 10 (the plates'' bottoms 8.75), so the cake drops through a 0.6 m hopper and a 0.4 m breaker; the cake drops through a lump breaker in the stand onto the layout''s cake belt along x at y 0, local z 7.6 (x -6 to 6). Slurry in by a 150 mm flange on the -y face at
    (0, -3.25, 9.5), split in the stand to both presses'' feed eyes between the heads; each press''s cake leaves its own breaker through a 1.5 x 1.1 m opening at (-1.2, 0, 7.775) and (1.2, 0, 7.775), facing down onto the same belt; the filtrate (10.9 kg/s) collects in a tank in the stand and is pumped through a plate cooler, which takes the mill''s and presses'' heat out of the water (2.3 MW: the grinding''s power all ends as warm slurry) into the radiator loop, so the water stays under 50 deg C; every service on the -y face, 0.5 m up, facing -y: filtrate out (100 mm, stainless) at (5, -3.25, 0.5) to the mill, the radiator loop''s 200 mm pair at (-5, -3.25, 0.5) in and (-4.4, -3.25, 0.5) out, the condensate from the shafts in (50 mm, stainless) at (4, -3.25, 0.5), the 400 V supply (95 mm2) at (2.5, -3.25, 0.5).'}
