identity: {key: unit.disc-filter-2, name: 'Disc filters, 2', description: 'Two vacuum disc filters end to end take the water out of the mill''s slurry (70% solids, 33.2 kg/s of ore) down to 9%: each has 4 discs 3.15 m across on a 0.6 m hollow shaft (60 m2, both faces), both shafts on one line along x at y 0, 3.7 m up, turning about once a minute in open U troughs (3.40 m wide, 4 m long: x -5 to -1 and 1 to 5) with agitators, each driven from its outer end (x -6 to -5, 5 to 6). The discs rise on the +y side and fall on the -y side, where the cake is blown off into a short steep chute beside each disc, straight down onto the layout''s cake belt, which runs along x under them all at y -2.4, 1 m up (x -6 to 6); no transfer inside the unit. Slurry in by a distribution box between the troughs (local 0, 0, 3) that splits it between them; on the +y side two filtrate receivers (1.6 m across, 3 m tall, at (-3, 3) and (3, 3)), the vacuum pumps between them (288 kW, x -1.5 to 1.5, y 2.5 to 4) and the
    filtrate pump; the filtrate (10.9 kg/s) out at (-6, 3, 0.5) back to the mill; the pumps'' air out of a vent at (0, 3.5, 5.5); 400 V supply at (6, 3.5, 0.5). Its ports (SFO 25): slurry in at the box''s top, DN 150; the filtrate out at (-6, 3, 0.5), DN 100, facing -x; the cake at the chutes'' feet over the belt, (-3, -2.4, 1) and (3, -2.4, 1) (blender''s measure: the chutes end at z 1.0); the 400 V box facing +x. Its parts span y -2.55 to 4 about the local origin (the chutes to the pump skid): its width is that extent, not centred.'}
