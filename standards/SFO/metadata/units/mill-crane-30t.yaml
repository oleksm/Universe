identity: {key: unit.mill-crane-30t, name: 'Maintenance crane, 30 t', description: 'A double-girder maintenance crane on the hall''s runways: it lifts the mill''s liners and the grate''s pallet cars and fans for their change. Hangs on the frame; names no bay. It travels along its x, its wheels at y -11.4 and +11.4 (22.8 m between the rails), its ends 0.3 m beyond; its origin on the runway''s rail plane; the trolley, with a main hoist, runs 9 m either way along y, the hook raised to 0.1 m under the rail plane. Parked at the hall''s centre.'}
size_class: 2
physical: {length: 8.0, width: 23.4, height: 3.0, mass: 32690.0}
built_of:
- {what: Bridge girders, item: material.structural-steel-a36, mass: 19190.0, note: 'two box girders 1.4 x 0.8 m, 12 mm wall, 23.4 m long over a 22.8 m span, the lightest that meet span/800 under the load (12.3 mm, span/1860) and 150 MPa with every load on (65 MPa)'}
- {what: Trolley and hoist, item: material.structural-steel-a36, mass: 9000.0, note: 'with a main hoist: 30% of the load, from memory'}
