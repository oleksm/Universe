identity: {key: unit.radiator-field-330k, name: 'Radiator field, 1.0 MW at 330 K', description: '32 aluminium panels 5.5 x 11 m (4 along x by 8 along y), each on a frame of 100 x 50 mm channel rails round its edge, raised 3 m on four legs and laid flat edge to edge over 44 x 44 m, carrying the panels'' and transformer''s loop''s water at about 330 K through tubes bonded between their two face sheets; the top face, white, radiates to the sky, the underside to the shaded ground. 525 W a m2 of panel at lunar noon, the worst case: the sun overhead on the top (0.2 of 1361 W/m2 absorbed), the ground under it at 300 K; more at night. The loop''s flow and return headers (150 mm) run round the edge in the 2 m margin, a branch to each row of panels; its ports on its south-west corner facing -y, at local (-23, -24, 1) flow and (-22.4, -24, 1) return, its pump''s power entry at (-21.8, -24, 0.3), so a layout''s mains run in an aisle beside the field, not under it.  For airless ground only: on a world
    with air a tower is lighter. Kept clean of dust, which darkens the white.'}
