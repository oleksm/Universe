identity: {key: unit.recycle-compressor, name: 'Recycle compressor, 20 MW', description: 'Raises 14.3 kg/s of hydrogen (the recycle with the hydrogen plant''s make-up) from 1.3 to 2.8 bar: 14 centrifugal stages, about 80 kJ/kg each at the impellers'' tip speed limit, in three casings on one line along x (centres x -4.5, 0, 4.5, shaft at z 2.3, 3.3 m across), driven by an electric motor at the -x end (x -11 to -6.5). The gas runs from +x to -x: suction by a 2.45 m flange on the +y face at (8, 4, 1.5), the recycle with the make-up (the make-up tees into the suction duct before it); each casing''s outlet up to a cooler overhead (three shell-and-tube coolers along x at z 5.4, 2.6 m across and 3.6 m long: two intercoolers, between casings at 1.68 and 2.17 bar by 2.16 and 1.90 m pipes, and an aftercooler), discharge from the aftercooler by a 1.67 m flange on the -y face at (-10, -4, 1.5). The coolers'' water, 476 kg/s at a 10 K rise, by a pair of 0.5 m flanges on the -y face at z 1 (flow x 5.5,
    return x 7). The motor''s 11 kV supply into its terminal box on the +y face, cable entry at (-8.75, 4, 1). The coolers'' frame is the unit''s own.'}
