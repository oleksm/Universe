identity: {key: unit.ladle-furnace-80t, name: 'Ladle furnace, 80 t', description: 'Reheats and trims an 80 t heat in its ladle, the ladle standing on its car under the furnace: a steel gantry straddles the ladle rail (a lane 5 m wide left clear under it along x), carrying a water-cooled roof 4.6 m across that is lowered onto the ladle, three graphite electrodes on masts with their arms, and an alloy chute through the roof. Its arc, about 10.9 MW at full heat, comes from its own transformer by a bus on its -y side (local 0, -5, 6); its cooling water by a manifold at local (-4.5, -4.5, 1); the alloys by a chute whose top stands at local (0, 3, 9); its fume leaves by an elbow on the roof at local (2, 0, 7.5). Argon is blown through the ladle''s porous plug from the car.'}
