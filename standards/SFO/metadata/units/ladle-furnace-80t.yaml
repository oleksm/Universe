identity: {key: unit.ladle-furnace-80t, name: 'Ladle furnace, 80 t', description: 'Reheats and trims an 80 t heat in its ladle, the ladle standing on its car under the furnace: a steel gantry straddles the ladle rail (a lane 5 m wide left clear under it along x), carrying a water-cooled roof 4.6 m across that is lowered onto the ladle (an annular seat skirt, radius 1.45 to 1.70 m, sits on its rim), three graphite electrodes on masts with their arms, and an alloy chute through the roof. Its arc, about 10.9 MW at full heat, comes from its own transformer by a bus on its -y side (local 0, -5, 6); its cooling water by a manifold at local (-4.5, -4.5, 1); the alloys by a chute whose top stands at local (0, 3, 9); its fume leaves by an elbow on the roof at local (2, 0, 7.5). Argon is blown through the ladle''s porous plug from the car. At rest: the roof''s rim on the ladle''s lip (z 4.4), its crown at 5.2; three 300 mm graphite electrodes on a 0.35 m pitch radius through the roof''s delta; the
    masts at the rear (y -3.8), their arms fanning forward, the centre arm 0.6 m higher; the gantry''s columns at x -5 and 5, y -4.4 and 4.4, 12 m tall, its two cross beams on top. Its ports (SFO 25): the bus joint at the cables'' hanger, (0, -5.34, 6), facing -y; the manifold''s water, DN 150 facing -y, out at (-4.8, -4.85, 1) and in at (-4.2, -4.85, 1); the alloy chute''s mouth at (0, 3, 9), a belt''s head over it; the fume out of the roof''s elbow at (2, 0, 7.5), facing up, DN 1000, a sleeve in the duct taking the roof''s lift. Argon comes through the ladle''s plug from its car.'}
