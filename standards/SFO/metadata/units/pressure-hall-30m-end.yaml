identity: {key: unit.pressure-hall-30m-end, name: 'Pressure hall head, 30 m', description: 'Closes a 30 m pressure hall: a 2:1 ellipsoidal head 7.5 m deep in 6 mm plate, flanged to the last section, with a crew airlock (a 2.5 m cylinder, 4 m long, for two in suits) and a vehicle lock (a 7.2 m cylinder, 12 m long, its doors 5 m square, whose corners need 7.07 m) through it at deck level, a 3 m belt nozzle whose bottom is at the deck, and a second, high nozzle near its crown, each blinded where a layout leaves it unused. Local frame: the flange plane at x 0, its bottom at z 0, the head bulging to +x (its crown at x 7.5); the belt nozzle''s face at (7.9, 0, 9), the high nozzle''s at (8.0, 0, 14.5); the locks'' axes along x: the crew lock centred at (7, -6, 8.4), a flat floor across it at the deck''s z 7.5 (1.7 m wide, 2.15 m under its crown), the vehicle lock centred at (8, 8, 10) reaching x 14, its doors'' sills at the deck''s z 7.5;  a service panel for pipes and cables at (6.5, -9, 10):
    a boxed plate whose pass-throughs'' outer faces are at x 6.5 facing +x and inner faces at x 5.0 facing -x, at y -10.2 and -9.6 (200 mm water), -9.0 (50 mm stainless), z 10, and the cables'' glands at y -10.2 (6.6 kV) and -9.4 (400 V), z 10.8; the hall''s nitrogen make-up in at (6.5, -8.4, 10) and the lock pumps'' 400 V supply at (6.5, -8.6, 10.8), outer only. Each lock''s doors are pressure plugs, seated on their frames by the higher pressure: the inner door opens into the hall, the outer into the lock; drawn closed. The locks'' gas is pumped back into the hall before their outer doors open. Its flange ring as a section''s, 300 x 30 mm drilled for M24 at 150 mm, reaching 0.3 m outside the shell; the bolts and seals are the layout''s.'}
