identity: {key: unit.hydrogen-purifier-10bar, name: 'Hydrogen purifier, 10 bar', description: 'Takes the last oxygen out of the electrolysers'' hydrogen and dries it to a dew point near -60 deg C, at 10 bar (rated 14). For airless ground: its loop water comes back from the radiators at about 72 deg C, so the after-cooler only takes the gas to 80 deg C and the chiller lifts all the rest to its condenser at about 85 deg C, at half the air plant''s COP. In order: a feed/effluent exchanger (0.9 m across, 3.5 m long, horizontal along x at y 0, z 6, x -5.6 to -2.1, on a stand) warms the wet gas a little against the hot outlet; the deoxidiser (1.6 m across, 3.5 m tall, on 1 m legs, centre (-4, -2)) burns the 0.5% of oxygen to water over 3.0 m3 of palladium catalyst, 83 K warmer; a water-cooled after-cooler (0.8 m across, 3.2 m long, along x at y 0.8, z 1.2, x -3.6 to -0.4) to 80 deg C and a knockout drum (1 m across, 2.5 m, centre (0.4, 0.8)); a chiller package (x -2 to 1.6, y -3.8 to -1.4, 2.2
    m tall) to 5 deg C with its cold separator; two dryers (1.9 m across, 4 m straight with dished heads, 13 mm wall, on skirts, centres (4, -2.2) and (4, 2.2)), one adsorbing for 8 hours while the other is heated 4 hours by a slip of dry gas and cooled; a regeneration heater cabinet (x -1.5 to 1.5, y 2.4 to 3.6, 2.2 m tall), its cooler (0.5 m across, 2 m, along x on the cabinet''s roof) and a knockout pot (0.6 m across, 2 m, centre (2, 3.4)); a dust filter (0.5 m, 2 m, centre (5.5, 0)) before the outlet. Gas in at local (-6, 0, 6), out at (6, 0, 2); the cooling water''s pair of 193 mm flanges on the -y face at (0, -4, 1) flow and (0.6, -4, 1) return (59 kg/s at a 10 K rise); condensate 50 mm out at (-6, 3, 0.3); 400 V supply at (6, -3.5, 0.5).'}
