identity: {key: unit.stacker-reclaimer-1500th, name: 'Bucket wheel stacker-reclaimer, 1,500 t an hour', description: 'Runs on its rail between two stockpile beds: stacking, its boom (29 m from its luff pivot at x 2.5 to the wheel''s axle at 31.5, slewing either side) drops ore from the yard belt''s tripper onto a bed; reclaiming, the bucket wheel at the boom''s end cuts into the pile''s face and sends the ore back down the boom onto the yard belt, which then runs the other way. Stacks 1,500 t an hour (a ship''s load landed at the port in a day), reclaims 500. Travels along its x on 10 m gauge, its origin on the running plane at the slewing centre. Stacking, its tripper (unit.yard-tripper-1500th, a separate car on the same rails, coupled behind it on -x) drops the ore into a feed hopper over the slewing centre at local (0, 0, 8.5), onto the boom''s belt. Its counterweight arm reaches back to x -16, its underside 11.8 m up, clear of the tripper''s head; the ballast, 152 t of cast iron blocks
    centred at x -14, balances the boom horizontal and stacking about the slewing centre. The machinery house sits on transverse seats above the counterweight arm, centre (-4, 0, 12.9), seats at z 12.55 across y -1.6 to 1.6. An open reclaim catch hopper lies below the boom tail''s sweep and tapers to the central chute at z 6.0, retaining its output datum. The boom reaches x 34.75 with the wheel. It slews 95 degrees either way from along +x, enough to reach both beds as it travels, but not further, so its tripper can stand behind it: between z 7 and 11.8, no part of the slewing frame may enter the tripper''s corridor (y -1.8 to 1.8, from x -0.8 back) anywhere in that range, as checked by sweeping it (a point r from the axis enters it after slewing to about 180 - asin(1.8 / r) degrees, so near the axis only parts close to the boom''s line pass); its counterweight arm and supports hang from the mast above z 11.8; the mast stands at x 3, the luff pivot''s towers at x 2.5, y -1.6 and 1.6, outside
    the boom''s belt. The feed hopper is the tripper''s, not the machine''s, and the boom''s tail turns under it at the axis. It runs on four bogies, two to a rail with their centres at x -4.5 and 4.5, each 5.4 m long with four wheels of 1.2 m: sixteen wheels, about 290 kN each at 1 g.'}
