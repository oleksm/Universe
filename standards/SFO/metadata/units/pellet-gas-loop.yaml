identity: {key: unit.pellet-gas-loop, name: 'Pellet shaft gas loop, 4 bar', description: 'Cleans, dries and drives one pellet shaft''s 20.7 kg/s of nitrogen at 4 bar: the top gas (120 deg C, about 0.7 m pipe) through a cyclone and a candle filter kept above its dew point (about 90 deg C), then down through a condenser that keeps the 1.6 kg/s of water the green balls brought (to the presses, and on to the mill: on a moon every kilogram comes back), the gas out at 65 deg C still carrying 0.9 kg/s of vapour round the loop; then a fan (260 kW, for the bed''s 23 kPa and the loop''s 15) back to the shaft''s bottom and its torch chambers. Oxygen make-up joins before the fan. Local frame: the cyclone at x -9, the filter at x -3, the condenser''s two shells at x 3 and 6, the fan at x 10; Its connections, all plain stubs: the top gas in by a 700 mm lagged flange on the cyclone''s top at (-9, 0, 13) facing up (its tangential entry inside the barrel), the cold gas out by a 600 mm flange at (12, 0, 1.5)
    facing +x, the shafts'' bore; the condensate out (50 mm, stainless) at (6, 6, 0.3) facing +y, the oxygen in (50 mm, stainless, double seal) at (9, 6, 1) facing +y; the radiator loop''s 300 mm pair at (-12, -2, 1) in and (-12, -1.4, 1) out, facing -x; the fan''s 400 V supply (185 mm2) at (10, -6, 0.5) facing -y. The dust: the cyclone''s cone and the filter''s hopper each end in a rotary lock, the unit''s, which holds the loop''s 4 bar and lets the dust into a dust-tight 2 m3 bin on the slab under it (5 mm plate, fork runners, a small filtered vent to the vacuum for the lock''s pocket gas), the loop''s, changed by forklift about once a shift.'}
