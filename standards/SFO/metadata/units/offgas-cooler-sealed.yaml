identity: {key: unit.offgas-cooler-sealed, name: 'Off-gas cooler, evaporative, 2.2 MW', description: 'Cools the sealed arc furnace''s 1.37 kg/s of CO from about 1600 to 250 deg C, 2.2 MW, so its filter''s candles last: the gas comes down a shaft 1.6 m across whose walls are 66 boiler tubes 60 mm across welded edge to edge (8 m of them, z 9 to 17, about 55 kW a m2), then through a plain collecting section of 10 mm plate, the shaft''s size, z 7 to 9, out of whose side it leaves; the water in them boiling at about 485 K (20 bar) and rising to a steam drum 1 m across and 3 m long along y on the -x side (axis at local x -2, z 16.5). The steam goes to a radiator field and comes back as water by the field''s pump. Gas in on top at (0, 0, 18) from the furnace''s lined duct; out of the collecting section''s side at (3, 0, 8), straight, to the filter; steam out of the drum at (-3, 0.4, 16.5) and water back at (-3, -0.4, 16.5), both facing -x; the dust falls through a lock under the hopper into a closed
    bin, emptied by forklift; the lock''s drives fed at (2, -2, 1). Its bare walls radiate about 109 kW to the sky as well, not counted. On four box legs. For airless ground: on a world with air the shop''s duct burns the gas instead.'}
