identity: {key: unit.ingot-tipper, name: Ingot tipper, description: 'Lays a standing ingot down for the saws: an L-shaped cradle whose pivot runs along y at local (0, 0, 1.0), on two pedestals at y -0.8 and 0.8. At rest its base plate is level at z 1.0 from x -0.5 to 0 and its back plate stands at x 0 from z 1.0 to 2.1; the ingot crane sets a cooled ingot, big end up, on the base against the back (its centre at (-0.24, 0)). A hydraulic cylinder turns the cradle 90 degrees toward +x about the pivot: the back plate comes down level at z 1.0, the ingot lies on it along x (x 0 to 1, its big end toward +x, its top at about 1.48), the base plate now an end stop at x 0, the laid back plate (x 0 to 1.1) carrying it; the crane takes it from there to a saw, or rolls it on to rollers from x 1.2 to 2 (tops at 1.0) to wait. The cylinder works from the side, at y -1.25, clear of the ingot''s sweep. About a minute a turn; 1,847 kg with its head. Drawn at rest.'}
