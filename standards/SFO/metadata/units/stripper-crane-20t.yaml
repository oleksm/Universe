identity: {key: unit.stripper-crane-20t, name: 'Stripper crane, 20 t', description: 'A double-girder stripper crane on the hall''s runways: it lifts each frozen ingot up out of its mould by the hot top, the arms of its tongs holding the mould down by its lugs (a big-end-up mould frees its ingot only upward), and sets the ingots on the ingot car. Hangs on the frame; names no bay. It travels along its x, its wheels at y -11.4 and +11.4 (22.8 m between the rails), its ends 0.3 m beyond; its origin on the runway''s rail plane; the trolley, with ingot tongs whose arms hold the mould down, runs 9 m either way along y, the hook raised to 0.1 m under the rail plane. Parked at the hall''s centre. Its stripping tool hangs from the trolley, raised to 1.6 m under the rail plane when parked: the box runs from there to the trolley''s top.'}
