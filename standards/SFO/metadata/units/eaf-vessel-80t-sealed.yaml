  review: true
  note: The water-cooled panels and roof take about 15% of the arc's power, from memory.
- of: [needs.gravity]
  tier: invented
  review: true
  note: Slag floats off the steel and the tap pours by gravity. Settling goes as g (Stokes), a sixth as fast at 1.6 m/s2; below that not checked.
- of: [identity.description]
  tier: invented
  review: true
  note: Sealed as closed ferroalloy furnaces are; not a design that has been built for vacuum.
