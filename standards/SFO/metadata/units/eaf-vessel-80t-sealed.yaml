identity: {key: unit.eaf-vessel-80t-sealed, name: 'Arc furnace vessel, 80 t, sealed', description: 'The 80 t arc furnace closed for airless ground: its roof sealed to the shell, glands round the three electrodes, the sponge iron fed through a lock in the fifth hole, and the off-gas taken by the furnace''s horizontal elbow (the same as the furnace for air''s, v4) to a sealed clamp coupling: so the furnace holds its own gas (the CO its charge gives off, started with argon) at about 1 bar: the arc burns as in air, the melt neither boils nor loses its manganese to the vacuum, and the slag foams. It tilts only a few degrees to tap and 15 to deslag, through the bellows. Otherwise as unit.eaf-vessel-80t: An AC arc furnace that taps 80 t: a refractory hearth 6.6 m across, water-cooled upper shell and roof, three graphite electrodes on masts, a tilting cradle and an eccentric bottom tap. Fed sponge iron through a fifth hole in the roof. Stands on a platform 5 m up so a ladle car runs under its tap.
    Its cooling water comes by rigid 300 mm pipes on the vessel out on its slag side (-x) to x -6.8, then two flexible hoses of its own (it tilts), 18 m each in loops beside the platform at y 1.0 and 1.7 (bent no tighter than 2.2 m), kept above local z -3.3 so they clear the cooling loop''s mains under them and inside y 5.3 so they clear the gantry crane''s legs, down to fixed pipes back to a manifold on the deck whose two ports face up. Its six secondary cables are flexible water-cooled leads, 13 m each (bent no tighter than 2.75 m over the tilt), from the cradle to a fixed bus support standing on the platform behind it, which carries the bus joint. Two single-stage tilt cylinders, one each side (x -4.05 and 4.05, y 2), their rod ends on the rocker girder 1.3 m up and their feet in pockets in the platform at z -3.1: the rockers carry the weight, the cylinders the tilt. Its box is not centred across: the arms'' tails and the secondary cables reach 6.25 m behind the furnace''s axis (toward
    the transformer), its water hoses'' couplings at the deck manifold 5.49 m in front (the manifold is the unit''s: two DN 400 barrels standing on the deck, each taking its hose from the side); 14 m tall with the masts at rest. Its ports (SFO 25): sponge iron in at the feed lock''s top, local (0, 1.8, 10.1), a belt''s head over it; off-gas out at the elbow''s mouth past the roof''s edge, (3, 4.5, 8.5), facing +y, where the sealing kit narrows it to 1.2 m with a slide gate before a clamp coupling (the tilt sweep, 2026-10-16: a bellows joint would have to take 2.3 m at 15 degrees, so the gate shuts, the clamp opens and the furnace''s mouth slides across the duct''s face to tilt); the secondary bus''s joint at the flexible cables'' fixed ends, (0, -6.2, 2.3), facing -y; the deck manifold''s water flanges, DN 400 facing up, in at (-4.2, 4.95, 0.5) and out at (-3.4, 4.95, 0.5), side by side 0.8 m apart so their flanges clear, and in front of the cradle''s deck, which tilts over them (v4: the
    manifold reduces from the hoses'' 300 mm, and keeps inside local y 5.3, clear of the airless shop''s gantry crane''s legs, whose inner faces pass at y 5.43).'}
