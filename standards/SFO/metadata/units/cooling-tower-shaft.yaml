identity: {key: unit.cooling-tower-shaft, name: 'Cooling tower, 4 cells', description: 'An induced-draught wet tower: the shaft furnace''s (one of 4) closed water loop gives up its heat through a plate exchanger to tower water, which sprays down through fill against a fan''s draught and evaporates. The loop''s pumps and exchanger stand on a skid inside its footprint; its loop leaves by two pairs of DN 500 flanges on its east end (local x +24, 1 m up), facing +x: out at y -0.6 and 3.9, back at 0.6 and 5.1; its make-up water at (-20, -6, 1) and its 400 V at (-18, -6, 1), facing -y, and the layout''s pipes and concrete basin are not the unit''s. On a world with air only; airless ground needs radiators instead.'}
