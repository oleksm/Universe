identity: {key: unit.pellet-shaft-63th, name: 'Pellet shaft furnace, 62 t an hour, sealed', description: 'A vertical shaft 4.7 m across inside, sealed, that dries, fires and cools green balls in one bed as they sink through it against a closed loop of nitrogen at 4 bar (with the 4.5% oxygen the recipe takes, from the hydrogen plant''s): the oldest way of firing pellets, here with no air to draw and none to vent. From the bottom: cooling 6 m (the loop''s cold gas comes in under it and leaves it at about 1,150 deg C), soaking 1, firing 3 at about 1300 deg C, preheat 2, drying 2; about 510 t in the bed, some 8 hours from top to bottom. Two torch chambers on its ±x sides at the firing zone, 7 plasma torches of 1.5 MW between them, heat a share of the loop''s gas (5.9 of its 20.7 kg/s) to about 1,350 deg C and blow it in through ports round the shaft; the gas that cooled the pellets carries their heat up into the firing zone, so the new heat is only the module''s 0.5 GJ a tonne. Why 4 bar: at
    1.6 m/s2 the bed weighs 3.4 kPa a metre, and at 1.2 bar the gas''s drag through it would be 5.4 (the bed would lift and hang); at 4 bar the gas is denser and slower and its drag 1.61. The shell holds the loop (55 MPa in 20 mm plate) and the charge and discharge go through lock hoppers. Local frame: the axis at (0, 0), its foot on the pit floor at z 0; the discharge lock and table feeder z 0 to 6, its outlet at (0, 0, 0.8); the bed z 6 to 20; the gas space and top gas outlet (0.7 m) at (0, -3.3, 21.5); the charge lock hopper z 23 to 29.5, its inlet at (0, 0, 29.5); the cooling gas in at (0, -3.3, 7), the firing gas into each torch chamber at (±5.55, 0, 12) on its outboard face; the torches'' cooling water by a pair of flanges at (-0.6, -3.3, 13) and (0.6, -3.3, 13); the shaft stands on eight columns under a ring girder at z 6. The torch chambers stand upright, centred at x -4.3 and 4.3 from z 11 to 15, a hot duct from each into the firing band. The shell runs from a discharge cone (z
    4 to 6, the shell''s, over the table feeder and lock at z 0.8 to 4) up the bed to its roof (z 22 to 23). Its connections, plain stubs: the cooling gas 600 mm and each chamber''s firing gas 250 mm, facing out; the top gas 700 mm lagged in 25 mm of foil, facing -y (the gas loop''s inlet); the torches'' water a 150 mm pair facing -y; the charge at the lock hopper''s rim (0, 0, 29.5) facing up, where a belt''s head drops in; the discharge out at (0, 0, 0.8) through an 800 mm chute facing down; the torches'' 6.6 kV supply (400 mm2) into a terminal box at (0, 5.5, 8) facing +y.'}
