identity: {key: unit.gas-heater-122mw, name: 'Hydrogen heater, 122 MW', description: 'Heats 14.3 kg/s of hydrogen from 300 to 900 deg C with electric resistance elements: 4 lined vessels 4 m across and 16 m tall (z 0.5 to 16.5) in a row along x at 6 m (x -9, -3, 3, 9), on the unit''s centre line. The gas in at the bottom of each from a cold header (2.26 m bore, 12 mm wall) along x at y -3.3, z 2, whose inlet flange is on its -x end at the unit''s face (x -12); out at the top of each into a lined hot header (3.23 m bore inside 200 mm of refractory, 16 mm shell, 3.67 m outside) along x at y 4, z 15, from x -10.25 to 10.25, whose outlet is a stub up from its middle (x 0) to a flange at z 18, the unit''s top. Its power by cables from its transformer to a terminal house at its -x end, on the +y side (clear of the cold header''s flange), x -12 to -11.1, y 0.3 to 2.6, z 0.15 to 3, the cables entering the middle of its +y face at (-11.55, 2.6, 1.575). The headers'' supports are the unit''s own.'}
