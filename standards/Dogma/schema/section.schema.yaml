$schema: http://json-schema.org/draft-07/schema#
title: Dogma section
description: 'standards/Dogma/metadata/<name>.yaml: one section of Dogma, the laws everything runs on. Its laws are the records in the folder of the same name.'
type: object
additionalProperties: false
required: [identity]
properties:
  identity:
    type: object
    additionalProperties: false
    required: [key, name, about]
    properties:
      key: { $ref: "../../common.schema.yaml#/definitions/key" }
      name: { type: string }
      order: { type: integer, minimum: 1, description: "Its place among Dogma's sections." }
      about: { type: string, description: "What its laws are, and the formula they stand in, where there is one." }
      see: { type: array, items: { type: string }, description: "Where it is written up: files in the repository." }
