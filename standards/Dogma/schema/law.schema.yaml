$schema: http://json-schema.org/draft-07/schema#
title: Law
x-kind: [law]
description: 'standards/Dogma/metadata/<section>/<name>.yaml: one law of Dogma: a constant of nature, a named reference value, or a constant of a law the world runs on. The same everywhere; nothing here is a device''s, a material''s or a design''s.'
type: object
additionalProperties: false
required: [identity, value, kind, note]
properties:
  identity:
    type: object
    additionalProperties: false
    required: [key, name, label, section]
    properties:
      key: { $ref: "../../common.schema.yaml#/definitions/key" }
      name: { type: string }
      symbol: { type: string, description: "The letter it goes by in a formula." }
      label: { type: string, pattern: "^[A-Z][A-Z0-9_]*$", description: "Its label: the constant's name, as code and formulas write it (SPEED_OF_LIGHT). No two alike. The engine makes its constant under this name: do not change one without the engine." }
      section: { type: string, x-ref: [dogma] }
  value: { type: number }
  unit: { type: string, description: "Its unit, in SI: checked by the build as an x-unit is. Left out: a pure number (an exponent, a share, a count of scale heights)." }
  kind: { enum: [real, simplified, invented, reference], description: "real: measured nature. reference: a value fixed by definition or convention (the Measures: a light year, a standard gravity). simplified: an approximation of the real, to refine. invented: this world's own (the hyper layer), by written rule." }
  note: { type: string, description: "What it is for; for an invented one, the target it was chosen to meet." }
  basis: { $ref: "../../common.schema.yaml#/definitions/basis" }
