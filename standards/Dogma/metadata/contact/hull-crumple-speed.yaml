  note: 'Sourced as an order: road-vehicle bumper standards ask for no damage at 2.5 mph, 1.1 m/s (US 49 CFR 581, from memory); a ship''s skin is not a bumper, so 1.0 m/s is the round figure, to be set per skin from its strength.'
