[package]
name = "universe"
edition.workspace = true
version.workspace = true
default-run = "freefall"

# The game: Freefall (by Plurence). The library holds it; two binaries ship: the game, and the studio
# on its own (it is part of the game: the same code, opened alone).
[lib]
name = "game"
path = "src/lib.rs"

[[bin]]
name = "freefall"
path = "src/bin/freefall.rs"

[[bin]]
name = "freefall-studio"
path = "src/bin/freefall-studio.rs"

[[bin]]
name = "freefall-planet"
path = "src/bin/freefall-planet.rs"

# The developer's kit (scenarios, the observer port): on by default; a player build is
# `--no-default-features`.
[features]
default = ["dev"]
dev = []

[dependencies]
universe-terrain-contact = { path = "../terrain-contact" }
universe-ship-design = { path = "../core/ship-design" }
rayon.workspace = true
universe-prof = { path = "../core/prof" }
universe-engine = { path = "../engine" }
universe-terrain = { path = "../terrain" }
glam.workspace = true
log.workspace = true
env_logger.workspace = true
universe-sim = { path = "../core/sim" }
serde.workspace = true
serde_json.workspace = true
serde_norway = "0.9"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
