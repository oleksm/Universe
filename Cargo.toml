[workspace]
resolver = "3"
members = ["crates/engine", "crates/physics", "crates/world", "crates/sim", "crates/game"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
wgpu = "30"
winit = "0.30"
glam = { version = "0.33", features = ["bytemuck", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
bytemuck = { version = "1", features = ["derive"] }
pollster = "1"
log = "0.4"
env_logger = "0.11"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
