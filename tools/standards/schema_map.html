<title>Freefall Registry Map</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen tool - toolbar, graph canvas, detail panel right (below on phones). Engineering drawing palette: cool paper, ink, area hues. */
:root {
  --bg: #f3f5f7; --panel: #ffffff; --fg: #17202a; --muted: #5a6775; --line: #d3dae1; --soft: #e9edf1;
  --accent: #1f6feb; --root: #17202a; --root-fg: #ffffff; --def: #7b8794; --hl: #d9480f; --hl2: #1f6feb;
  --a0: #2f6db5; --a1: #c46a12; --a2: #3f8f4a; --a3: #c23b3b; --a4: #2a8f8a; --a5: #a88a12; --a6: #8b5a9e; --a7: #c9577a; --a8: #7a5a43; --a9: #6b7680;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1418; --panel: #161d23; --fg: #e3e9ef; --muted: #93a1ae; --line: #2a343d; --soft: #1d262e;
  --accent: #5b9dff; --root: #e3e9ef; --root-fg: #0f1418; --def: #8794a1; --hl: #ff8a4c; --hl2: #5b9dff;
  --a0: #6aa3ea; --a1: #eb9a4b; --a2: #73c27d; --a3: #ef7474; --a4: #5cc5bf; --a5: #d9bd4a; --a6: #bb8dd0; --a7: #ec8db0; --a8: #c09a7d; --a9: #9aa6b1;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1418; --panel: #161d23; --fg: #e3e9ef; --muted: #93a1ae; --line: #2a343d; --soft: #1d262e;
  --accent: #5b9dff; --root: #e3e9ef; --root-fg: #0f1418; --def: #8794a1; --hl: #ff8a4c; --hl2: #5b9dff;
  --a0: #6aa3ea; --a1: #eb9a4b; --a2: #73c27d; --a3: #ef7474; --a4: #5cc5bf; --a5: #d9bd4a; --a6: #bb8dd0; --a7: #ec8db0; --a8: #c09a7d; --a9: #9aa6b1;
  color-scheme: dark; }
html, body { height: 100%; }
@media (min-width: 761px) { body { overflow: hidden; } }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 14px; display: flex; flex-direction: column; }
header { display: flex; flex-direction: column; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
h1 { font-size: 15px; font-weight: 600; margin: 0; }
h1 small { font-weight: 400; color: var(--muted); font-family: var(--mono); font-size: 12px; margin-left: 6px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { font: 500 12px var(--sans); background: transparent; color: var(--muted); border: 0; padding: 5px 10px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.lbl { font: 600 10.5px var(--sans); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
input[type=search] { font: 13px var(--mono); padding: 5px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); width: 15rem; max-width: 100%; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.tog { font: 500 12px var(--sans); display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--fg); cursor: pointer; }
.tog svg { flex: none; }
.tog[aria-pressed="false"] { color: var(--muted); }
.tog[aria-pressed="false"] svg { opacity: .35; }
.chip { font: 500 11.5px var(--sans); display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border: 1px solid var(--line); border-radius: 999px; background: transparent; color: var(--fg); cursor: pointer; }
.chip i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.chip[aria-pressed="false"] { opacity: .4; }
.chip span { color: var(--muted); font-variant-numeric: tabular-nums; }
main { flex: 1; display: flex; min-height: 0; }
nav#tree { width: 400px; flex: none; border-right: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 14px 14px 24px; display: flex; flex-direction: column; gap: 8px; }
nav#tree[hidden] { display: none; }
.treehead { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.treehead h2 { font: 600 15px var(--mono); margin: 0; word-break: break-word; }
.treehead button, .treetools button { font: 500 11.5px var(--sans); color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 5px; padding: 3px 8px; cursor: pointer; }
.treetools { display: flex; gap: 6px; flex-wrap: wrap; }
.treetools input { flex: 1; min-width: 8rem; font: 12px var(--mono); padding: 4px 8px; border: 1px solid var(--line); border-radius: 5px; background: var(--bg); color: var(--fg); }
#tree-body { font: 12px var(--mono); }
#tree-body details { margin-left: 12px; border-left: 1px solid var(--soft); padding-left: 6px; }
#tree-body > details { margin-left: 0; border-left: 0; padding-left: 0; }
#tree-body summary { cursor: pointer; padding: 2px 0; list-style: none; display: flex; flex-wrap: wrap; gap: 2px 6px; align-items: baseline; }
#tree-body summary::-webkit-details-marker { display: none; }
#tree-body summary::before { content: "▸"; color: var(--muted); width: 10px; flex: none; }
#tree-body details[open] > summary::before { content: "▾"; }
#tree-body details.leaf > summary::before { content: "·"; }
.pn { font-weight: 500; color: var(--fg); }
.pn.req::after { content: "*"; color: var(--hl); margin-left: 1px; }
.pt { color: var(--muted); }
.pu { color: var(--a2); }
.ps { color: var(--def); border: 1px dashed var(--def); border-radius: 4px; padding: 0 4px; font-size: 10.5px; }
.px button { font: inherit; font-size: 11px; color: var(--root-fg); background: var(--accent); border: 0; border-radius: 4px; padding: 0 5px; cursor: pointer; }
.pd { color: var(--muted); font-family: var(--sans); font-size: 12px; line-height: 1.45; margin: 2px 0 4px 16px; }
.pe { margin: 2px 0 4px 16px; color: var(--fg); font-size: 11px; line-height: 1.5; word-break: break-word; }
.pm { color: var(--muted); font-size: 11px; }
.hidden-by-filter { display: none; }
mark { background: color-mix(in srgb, var(--hl) 25%, transparent); color: inherit; }

#cy { flex: 1; min-width: 0; position: relative; }
#tip { position: absolute; pointer-events: none; background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font: 11.5px var(--mono); max-width: 360px; box-shadow: 0 4px 14px rgb(0 0 0 / .12); z-index: 5; }
aside { width: 360px; flex: none; border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
aside h2 { font: 600 16px var(--mono); margin: 0; word-break: break-word; }
.meta { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: 12.5px; margin: 0; }
.meta dt { color: var(--muted); }
.meta dd { margin: 0; font-family: var(--mono); font-size: 12px; word-break: break-all; }
.about { color: var(--muted); font-size: 13px; line-height: 1.5; margin: 0; }
h3 { font: 600 11px var(--sans); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 6px; display: flex; justify-content: space-between; gap: 8px; }
h3 button { font: 500 11px var(--sans); text-transform: none; letter-spacing: 0; color: var(--accent); background: none; border: 1px solid var(--line); border-radius: 5px; padding: 1px 7px; cursor: pointer; }
table.dep { width: 100%; border-collapse: collapse; font: 12px var(--mono); }
table.dep td { padding: 3px 0; vertical-align: top; border-top: 1px solid var(--soft); }
table.dep td:first-child { width: 42%; padding-right: 8px; }
table.dep td.f { color: var(--muted); word-break: break-all; }
table.dep button { font: inherit; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; text-align: left; word-break: break-all; }
.fields { font: 12px var(--mono); line-height: 1.6; }
.fields b { font-weight: 500; }
.hint { color: var(--muted); font-size: 13px; line-height: 1.5; margin: 0; }
.trace { font-size: 12.5px; padding: 8px 10px; border-radius: 6px; background: var(--soft); line-height: 1.5; }
.trace code { font-family: var(--mono); font-size: 11.5px; }
.none { color: var(--muted); font: 12px var(--mono); }
@media (max-width: 760px) {
  main { flex-direction: column; }
  #cy { min-height: 62vh; }
  aside { width: auto; border-left: 0; border-top: 1px solid var(--line); }
  nav#tree { width: auto; border-right: 0; border-bottom: 1px solid var(--line); max-height: 60vh; order: 2; }
  aside { order: 3; }
}
</style>

<header>
  <div class="row">
    <h1>Freefall Registry Map <small id="count"></small></h1>
    <input type="search" id="q" placeholder="Find a kind: hull, mount, planet-field" aria-label="Find a kind">
    <span class="lbl">Arrange</span>
    <div class="seg" role="group" aria-label="Arrange">
      <button id="lay-links" aria-pressed="true">By links</button>
      <button id="lay-area" aria-pressed="false">By area</button>
    </div>
  </div>
  <div class="row">
    <span class="lbl">Show</span>
    <button class="tog" id="e-ref" aria-pressed="true"><svg width="22" height="8"><line x1="0" y1="4" x2="16" y2="4" stroke="var(--a0)" stroke-width="2"/><path d="M16 0 L22 4 L16 8 z" fill="var(--a0)"/></svg>References</button>
    <button class="tog" id="e-derive" aria-pressed="true"><svg width="22" height="8"><line x1="0" y1="4" x2="16" y2="4" stroke="var(--root)" stroke-width="2.5"/><path d="M16 0 L22 4 L16 8 z" fill="none" stroke="var(--root)"/></svg>Derives from</button>
    <button class="tog" id="e-use" aria-pressed="false"><svg width="22" height="8"><line x1="0" y1="4" x2="16" y2="4" stroke="var(--def)" stroke-width="1.5" stroke-dasharray="3 2"/><circle cx="19" cy="4" r="3" fill="var(--def)"/></svg>Uses shared structures</button>
    <button class="tog" id="e-book" aria-pressed="false"><svg width="22" height="8"><line x1="0" y1="4" x2="22" y2="4" stroke="var(--muted)" stroke-width="1" stroke-dasharray="1 2"/></svg>Bookkeeping links</button>
    <button class="tog" id="e-lab" aria-pressed="false"><svg width="22" height="8"><text x="0" y="8" font-size="9" fill="var(--fg)" font-family="monospace">a.b</text></svg>Field names</button>
  </div>
  <div class="row" id="areas" aria-label="Areas"><span class="lbl">Areas</span></div>
</header>
<main>
  <nav id="tree" aria-label="Schema of the selected kind" hidden>
    <div class="treehead"><h2 id="tree-title"></h2><button id="tree-close" aria-label="Close schema">Close</button></div>
    <p class="hint" id="tree-file"></p>
    <div class="treetools"><input type="search" id="tree-q" placeholder="Filter fields" aria-label="Filter fields"><button id="tree-open">Expand all</button><button id="tree-shut">Collapse</button></div>
    <div id="tree-body"></div>
  </nav>
  <div id="cy" role="img" aria-label="Graph of record kinds and the references between them"><div id="tip" hidden></div></div>
  <aside id="panel"></aside>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/layout-base@2.0.1/layout-base.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cose-base@2.2.0/cose-base.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cytoscape-fcose@2.2.0/cytoscape-fcose.js"></script>
<script>
const DATA = /*DATA*/null;
const BOOK = /^(basis|revision|identity\.revision|said_as|model_requests)\b|\.basis\b|\.revision\b/;   // provenance and bookkeeping, not structure
const PLUMB = new Set(["common.key", "common.basis", "common.record_revision", "common.revision", "common.said_as", "common.provenance", "common.label"]);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const areas = [...new Set(DATA.kinds.map(k => k.area))].sort();
const areaVar = Object.fromEntries(areas.map((a, i) => [a, `--a${i % 10}`]));
const byKey = Object.fromEntries(DATA.kinds.map(k => [k.key, k]));
const refs = DATA.refs.map(r => ({ ...r, real: r.fields.filter(f => !BOOK.test(f)), book: r.fields.filter(f => BOOK.test(f)) }));
const out = {}, inn = {};
refs.forEach(r => { (out[r.from] ||= []).push(r); (inn[r.to] ||= []).push(r); });
const defs = {};
DATA.kinds.forEach(k => Object.entries(k.uses).forEach(([d, ps]) => { (defs[d] ||= []).push({ kind: k.key, paths: ps }); }));
let show = { ref: true, derive: true, use: false, book: false, lab: false }, arrange = "links", shown = new Set(areas), selected = null;
try { Object.assign(show, JSON.parse(localStorage.getItem("registry-map-show") || "{}")); arrange = localStorage.getItem("registry-map-arrange") || arrange; } catch (e) {}
const hasFcose = typeof cytoscapeFcose !== "undefined";
if (hasFcose) cytoscape.use(cytoscapeFcose);

const nFields = refs.reduce((s, r) => s + r.real.length, 0);
document.getElementById("count").textContent = `${DATA.kinds.length} kinds · ${refs.filter(r => r.real.length).length} links · ${nFields} reference fields · ${Object.keys(defs).length} shared structures`;

function elements() {
  const els = [];
  areas.forEach(a => els.push({ data: { id: "area:" + a, label: a, area: a }, classes: "area" }));
  els.push({ data: { id: "area:shared", label: "shared structures" }, classes: "area shared" });
  Object.entries(DATA.roots).forEach(([r, ks]) => els.push({ data: { id: "root:" + r, label: r }, classes: "root" }));
  DATA.kinds.forEach(k => {
    const deg = (out[k.key] || []).filter(r => r.real.length).length + (inn[k.key] || []).filter(r => r.real.length).length;
    els.push({ data: { id: k.key, label: k.key, parent: "area:" + k.area, area: k.area, deg }, classes: "kind" + (k.root ? " rooted" : "") });
  });
  Object.keys(defs).forEach(d => els.push({ data: { id: "def:" + d, label: d.replace(/^common\./, ""), parent: "area:shared", plumb: PLUMB.has(d) }, classes: "def" }));
  Object.entries(DATA.roots).forEach(([r, ks]) => ks.forEach(k => els.push({ data: { id: `d:${r}:${k}`, source: "root:" + r, target: k }, classes: "derive" })));
  refs.forEach(r => {
    if (r.real.length) els.push({ data: { id: `r:${r.from}>${r.to}`, source: r.from, target: r.to, n: r.real.length, area: byKey[r.from].area, label: r.real.join("\n") }, classes: "ref" + (r.from === r.to ? " self" : "") });
    if (r.book.length) els.push({ data: { id: `b:${r.from}>${r.to}`, source: r.from, target: r.to, n: r.book.length, label: r.book.join("\n") }, classes: "book" });
  });
  DATA.kinds.forEach(k => Object.entries(k.uses).forEach(([d, ps]) => {
    if (!DATA.roots[d.replace(/^common\./, "")]) els.push({ data: { id: `u:${k.key}>${d}`, source: k.key, target: "def:" + d, label: ps.join("\n"), plumb: PLUMB.has(d) }, classes: "use" });
  }));
  return els;
}

function style() {
  const A = e => css(areaVar[e.data("area")] || "--a9");
  return [
    { selector: "node.kind", style: { "label": "data(label)", "font-family": css("--mono"), "font-size": 10.5, "color": css("--fg"), "text-valign": "center", "text-halign": "center",
      "shape": "round-rectangle", "width": "label", "height": e => 20 + Math.min(e.data("deg"), 30) * 0.5, "padding": "7px", "background-color": css("--panel"),
      "border-width": e => 1 + Math.min(e.data("deg"), 30) / 12, "border-color": A } },
    { selector: "node.area", style: { "label": "data(label)", "font-family": css("--sans"), "font-weight": 600, "font-size": 13, "text-valign": "top", "text-halign": "center",
      "color": A, "background-opacity": 0.05, "background-color": A, "border-width": 1, "border-color": A, "border-opacity": 0.5, "shape": "round-rectangle", "padding": "14px" } },
    { selector: "node.area.shared", style: { "color": css("--def"), "background-color": css("--def"), "border-color": css("--def"), "border-style": "dashed" } },
    { selector: "node.root", style: { "label": "data(label)", "font-family": css("--mono"), "font-size": 11, "color": css("--root-fg"), "background-color": css("--root"),
      "shape": "round-rectangle", "width": "label", "height": 24, "padding": "9px", "text-valign": "center", "text-halign": "center" } },
    { selector: "node.def", style: { "label": "data(label)", "font-family": css("--mono"), "font-size": 9.5, "color": css("--def"), "shape": "ellipse", "width": "label", "height": 18,
      "padding": "6px", "background-color": css("--soft"), "border-width": 1, "border-color": css("--def"), "text-valign": "center", "text-halign": "center" } },
    { selector: "edge", style: { "font-family": css("--mono"), "font-size": 9, "color": css("--fg"), "text-background-color": css("--panel"), "text-background-opacity": 0.92,
      "text-background-padding": "2px", "text-wrap": "wrap", "text-rotation": "autorotate", "curve-style": "bezier" } },
    { selector: "edge.ref", style: { "width": e => Math.min(1 + 0.5 * e.data("n"), 4), "line-color": A, "target-arrow-color": A, "target-arrow-shape": "triangle", "arrow-scale": 0.8, "opacity": 0.55 } },
    { selector: "edge.self", style: { "loop-direction": "-45deg", "loop-sweep": "-60deg", "control-point-step-size": 40 } },
    { selector: "edge.derive", style: { "width": 2.5, "line-color": css("--root"), "target-arrow-color": css("--root"), "target-arrow-shape": "triangle", "target-arrow-fill": "hollow", "opacity": 0.5 } },
    { selector: "edge.use", style: { "width": 1, "line-color": css("--def"), "line-style": "dashed", "target-arrow-shape": "circle", "target-arrow-color": css("--def"), "arrow-scale": 0.6, "opacity": 0.45 } },
    { selector: "edge.book", style: { "width": 1, "line-color": css("--muted"), "line-style": "dotted", "target-arrow-shape": "vee", "target-arrow-color": css("--muted"), "arrow-scale": 0.6, "opacity": 0.4 } },
    { selector: "edge.lab", style: { "label": "data(label)" } },
    { selector: ".faded", style: { "opacity": 0.08 } },
    { selector: "node.kind.sel", style: { "border-color": css("--hl"), "border-width": 4 } },
    { selector: "node.up", style: { "border-color": css("--hl2"), "border-width": 3 } },
    { selector: "edge.hit", style: { "opacity": 1, "z-index": 9 } },
    { selector: "edge.ref.hit", style: { "line-color": css("--hl"), "target-arrow-color": css("--hl") } },
    { selector: "edge.ref.hitin", style: { "opacity": 1, "z-index": 9, "line-color": css("--hl2"), "target-arrow-color": css("--hl2") } },
  ];
}

const cy = cytoscape({ container: document.getElementById("cy"), elements: elements(), style: style(), wheelSensitivity: 0.25, minZoom: 0.05, maxZoom: 3 });

function visible(e) {
  if (e.isNode()) {
    if (e.hasClass("area")) return e.hasClass("shared") ? show.use : shown.has(e.data("area"));
    if (e.hasClass("kind")) return shown.has(e.data("area"));
    if (e.hasClass("root")) return show.derive;
    if (e.hasClass("def")) return show.use && (show.book || !e.data("plumb"));
  }
  const ends = e.source().hasClass("kind") || e.source().hasClass("root") ? [e.source(), e.target()].filter(n => n.hasClass("kind")).every(n => shown.has(n.data("area"))) : true;
  if (e.hasClass("ref")) return show.ref && ends;
  if (e.hasClass("derive")) return show.derive && ends;
  if (e.hasClass("use")) return show.use && (show.book || !e.data("plumb")) && ends;
  if (e.hasClass("book")) return show.book && ends;
  return true;
}

function apply(relayout) {
  cy.batch(() => {
    cy.elements().forEach(e => e.style("display", visible(e) ? "element" : "none"));
    cy.edges().toggleClass("lab", show.lab);
  });
  if (relayout) layout();
  if (selected) focus(selected, false);
}

function layout() {
  const vis = cy.elements().filter(e => e.style("display") === "element");
  if (arrange === "links" && hasFcose) {
    vis.layout({ name: "fcose", quality: "proof", randomize: true, animate: false, nodeDimensionsIncludeLabels: true, packComponents: true,
      nodeRepulsion: 9000, idealEdgeLength: e => e.hasClass("derive") ? 70 : e.hasClass("use") ? 80 : 130, edgeElasticity: 0.35, nestingFactor: 0.25,
      gravity: 0.2, gravityRangeCompound: 1.4, gravityCompound: 1.2, numIter: 4000, tile: true, tilingPaddingVertical: 14, tilingPaddingHorizontal: 14 }).run();
  } else {
    gridLayout();
  }
  cy.fit(vis, 30);
}

function gridLayout() {
  const CW = 190, CH = 42, GAP = 80, ROW = 1700, pos = {}, boxes = {};
  const groups = areas.filter(a => shown.has(a)).map(a => [a, DATA.kinds.filter(k => k.area === a).map(k => k.key)]);
  if (show.use) groups.push(["shared", Object.keys(defs).filter(d => show.book || !PLUMB.has(d)).map(d => "def:" + d)]);
  groups.sort((a, b) => b[1].length - a[1].length);
  let x = 0, y = 130, rowH = 0;
  groups.forEach(([a, ids]) => {
    ids.sort();
    const cols = Math.max(1, Math.min(ids.length, Math.ceil(Math.sqrt(ids.length * 1.6))));
    const w = cols * CW, h = Math.ceil(ids.length / cols) * CH;
    if (x > 0 && x + w > ROW) { x = 0; y += rowH + GAP + 120; rowH = 0; }
    ids.forEach((id, i) => pos[id] = { x: x + (i % cols) * CW + CW / 2, y: y + Math.floor(i / cols) * CH });
    boxes[a] = { x: x + w / 2, top: y };
    x += w + GAP; rowH = Math.max(rowH, h);
  });
  Object.entries(DATA.roots).forEach(([r, ks]) => {
    const t = {};
    ks.forEach(k => { if (shown.has(byKey[k].area)) t[byKey[k].area] = (t[byKey[k].area] || 0) + 1; });
    const home = Object.keys(t).sort((a, b) => t[b] - t[a])[0];
    if (home) pos["root:" + r] = { x: boxes[home].x, y: boxes[home].top - 100 };
  });
  cy.nodes().not(".area").forEach(n => { if (pos[n.id()]) n.position(pos[n.id()]); });
}

function closure(key, dir) {
  const seen = new Set([key]), q = [key];
  while (q.length) {
    const k = q.shift();
    ((dir === "down" ? out[k] : inn[k]) || []).filter(r => r.real.length).forEach(r => {
      const n = dir === "down" ? r.to : r.from;
      if (!seen.has(n)) { seen.add(n); q.push(n); }
    });
  }
  seen.delete(key);
  return seen;
}

function focus(key, move = true, trace = null) {
  const n = cy.getElementById(key);
  if (!n.length || !byKey[key]) return;
  selected = key;
  cy.batch(() => {
    cy.elements().removeClass("faded sel up hit hitin");
    cy.elements().addClass("faded");
    let keep = n.union(n.parents());
    if (trace) {
      const set = closure(key, trace);
      const nodes = cy.collection([...set].map(k => cy.getElementById(k)));
      const edges = cy.edges(".ref").filter(e => e.style("display") === "element" && (set.has(e.source().id()) || e.source().id() === key) && (set.has(e.target().id()) || e.target().id() === key));
      nodes.addClass("up"); edges.addClass(trace === "down" ? "hit" : "hitin").addClass("lab");
      keep = keep.union(nodes).union(nodes.parents()).union(edges);
    } else {
      const outE = n.outgoers("edge").filter(e => e.style("display") === "element"), inE = n.incomers("edge").filter(e => e.style("display") === "element");
      outE.addClass("hit lab"); inE.addClass("hitin lab");
      const near = outE.targets().union(inE.sources());
      keep = keep.union(outE).union(inE).union(near).union(near.parents());
    }
    keep.removeClass("faded"); n.addClass("sel");
  });
  panel(byKey[key], trace);
  showTree(byKey[key]);
  if (move) cy.animate({ fit: { eles: cy.elements().not(".faded").not(".area"), padding: 50 }, duration: 250 });
}

function clear() {
  selected = null;
  cy.elements().removeClass("faded sel up hit hitin");
  cy.edges().toggleClass("lab", show.lab);
  intro();
}

function depRows(list, dir) {
  if (!list.length) return `<p class="none">none</p>`;
  return `<table class="dep">${list.map(r => {
    const other = dir === "out" ? r.to : r.from;
    return `<tr><td><button data-k="${esc(other)}">${esc(other)}</button></td><td class="f">${r.real.map(esc).join("<br>")}</td></tr>`;
  }).join("")}</table>`;
}

function panel(k, trace) {
  const o = (out[k.key] || []).filter(r => r.real.length), i = (inn[k.key] || []).filter(r => r.real.length);
  const down = closure(k.key, "down"), up = closure(k.key, "up");
  const uses = Object.entries(k.uses).filter(([d]) => !PLUMB.has(d));
  const tr = trace ? `<div class="trace">${trace === "down" ? `<b>${esc(k.key)}</b> depends on ${down.size} kinds, directly or through others:` : `${up.size} kinds depend on <b>${esc(k.key)}</b>, directly or through others:`}<br><code>${[...(trace === "down" ? down : up)].sort().map(esc).join(", ") || "none"}</code></div>` : "";
  document.getElementById("panel").innerHTML = `
    <h2>${esc(k.key)}</h2>
    <dl class="meta"><dt>Area</dt><dd>${esc(k.area)}</dd><dt>Derives from</dt><dd>${k.root ? esc(k.root) : "none"}</dd><dt>Schema</dt><dd>standards/${esc(k.file)}</dd>${k.also.length ? `<dt>Also</dt><dd>${k.also.map(esc).join(", ")}</dd>` : ""}</dl>
    ${k.about ? `<p class="about">${esc(k.about)}</p>` : ""}
    ${tr}
    <div><h3><span>Depends on · ${o.length} kinds</span><button data-trace="down">Trace all ${down.size}</button></h3>${depRows(o, "out")}</div>
    <div><h3><span>Depended on by · ${i.length} kinds</span><button data-trace="up">Trace all ${up.size}</button></h3>${depRows(i, "in")}</div>
    <div><h3><span>Shared structures · ${uses.length}</span></h3>${uses.length ? `<table class="dep">${uses.map(([d, ps]) => `<tr><td>${esc(d)}</td><td class="f">${ps.map(esc).join("<br>")}</td></tr>`).join("")}</table>` : `<p class="none">none</p>`}</div>
    <div><h3><span>Fields · ${k.fields.length}</span></h3><div class="fields">${k.fields.map(f => k.required.includes(f) ? `<b>${esc(f)}</b>` : esc(f)).join(" · ") || "—"}</div></div>`;
}

function intro() {
  const top = DATA.kinds.map(k => [k.key, (inn[k.key] || []).filter(r => r.real.length).length]).sort((a, b) => b[1] - a[1]).slice(0, 8);
  document.getElementById("panel").innerHTML = `
    <div><h3><span>How to read it</span></h3><p class="hint">Each box is a record kind, grouped by its area. An arrow is a <b>reference</b>: a field of one kind that names another kind's record by key. Thicker arrows carry more fields. Click a kind to see what it depends on (orange) and what depends on it (blue), with the field names; trace either all the way through. Click empty space to clear.</p></div>
    <div><h3><span>Most depended on</span></h3><table class="dep">${top.map(([k, n]) => `<tr><td><button data-k="${esc(k)}">${esc(k)}</button></td><td class="f">${n} kinds name it</td></tr>`).join("")}</table></div>`;
}

document.getElementById("panel").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.k) focus(b.dataset.k);
  if (b.dataset.trace && selected) focus(selected, false, b.dataset.trace);
});

const tip = document.getElementById("tip");
cy.on("mouseover", "edge", e => {
  const ed = e.target, kind = ed.hasClass("ref") ? "references" : ed.hasClass("derive") ? "derives from" : ed.hasClass("use") ? "uses" : "bookkeeping";
  tip.innerHTML = `<b>${esc(ed.source().data("label"))}</b> ${kind} <b>${esc(ed.target().data("label"))}</b>${ed.data("label") ? "<br>" + esc(ed.data("label")).replace(/\n/g, "<br>") : ""}`;
  tip.hidden = false;
});
cy.on("mousemove", e => { if (!tip.hidden) { tip.style.left = (e.renderedPosition.x + 14) + "px"; tip.style.top = (e.renderedPosition.y + 10) + "px"; } });
cy.on("mouseout", "edge", () => { tip.hidden = true; });
cy.on("tap", "node.kind", e => focus(e.target.id(), false));
cy.on("tap", e => { if (e.target === cy) clear(); });

const ar = document.getElementById("areas");
areas.forEach(a => {
  const b = document.createElement("button");
  b.className = "chip"; b.setAttribute("aria-pressed", "true"); b.id = "area-" + a.replace(/\W/g, "");
  b.innerHTML = `<i style="background:var(${areaVar[a]})"></i>${esc(a)} <span>${DATA.kinds.filter(k => k.area === a).length}</span>`;
  b.onclick = () => { shown.has(a) ? shown.delete(a) : shown.add(a); b.setAttribute("aria-pressed", shown.has(a)); apply(true); };
  ar.appendChild(b);
});

function save() { try { localStorage.setItem("registry-map-show", JSON.stringify(show)); localStorage.setItem("registry-map-arrange", arrange); } catch (e) {} }
[["e-ref", "ref", true], ["e-derive", "derive", true], ["e-use", "use", true], ["e-book", "book", false], ["e-lab", "lab", false]].forEach(([id, key, re]) => {
  const b = document.getElementById(id);
  b.setAttribute("aria-pressed", show[key]);
  b.onclick = () => { show[key] = !show[key]; b.setAttribute("aria-pressed", show[key]); save(); apply(re); };
});
function setArrange(a) {
  arrange = a;
  document.getElementById("lay-links").setAttribute("aria-pressed", a === "links");
  document.getElementById("lay-area").setAttribute("aria-pressed", a === "area");
  save(); apply(true);
}
document.getElementById("lay-links").onclick = () => setArrange("links");
document.getElementById("lay-area").onclick = () => setArrange("area");

document.getElementById("q").addEventListener("input", e => {
  const q = e.target.value.trim().toLowerCase();
  if (!q) return clear();
  const hit = DATA.kinds.find(k => k.key === q) || DATA.kinds.find(k => k.key.startsWith(q)) || DATA.kinds.find(k => k.key.includes(q) || k.title.toLowerCase().includes(q));
  if (hit) { if (!shown.has(hit.area)) document.getElementById("area-" + hit.area.replace(/\W/g, "")).click(); focus(hit.key); }
});


function treeHTML(n, depth) {
  const kids = n.c || [];
  const bits = [`<span class="pn${n.r ? " req" : ""}">${esc(n.n)}</span>`];
  if (n.t) bits.push(`<span class="pt">${esc(n.t)}</span>`);
  if (n.u) bits.push(`<span class="pu">${esc(n.u)}</span>`);
  if (n.k !== undefined) bits.push(`<span class="pt">= ${esc(n.k)}</span>`);
  if (n.s) bits.push(`<span class="ps">${esc(n.s)}</span>`);
  if (n.from) bits.push(`<span class="ps">derives ${n.from.map(esc).join(", ")}</span>`);
  if (n.x) bits.push(`<span class="px">→ ${n.x.map(t => byKey[t] ? `<button data-k="${esc(t)}">${esc(t)}</button>` : esc(t)).join(" ")}</span>`);
  if (n.m) bits.push(`<span class="pm">${Object.entries(n.m).map(([k, v]) => `${esc(k)} ${esc(v)}`).join(", ")}</span>`);
  const body = (n.d ? `<div class="pd">${esc(n.d)}</div>` : "") + (n.e ? `<div class="pe">one of: ${n.e.map(esc).join(" · ")}</div>` : "") + kids.map(c => treeHTML(c, depth + 1)).join("");
  const open = depth < 1 ? " open" : "";
  return `<details class="${kids.length ? "" : "leaf"}"${open} data-name="${esc(n.n.toLowerCase())}"><summary>${bits.join("")}</summary>${body}</details>`;
}

function showTree(k) {
  const nav = document.getElementById("tree");
  document.getElementById("tree-title").textContent = k.key;
  document.getElementById("tree-file").textContent = `standards/${k.file} · * required · → names another kind's record · dashed: a shared structure`;
  document.getElementById("tree-body").innerHTML = (k.tree.c || []).map(c => treeHTML(c, 0)).join("") || `<p class="none">no properties</p>`;
  document.getElementById("tree-q").value = "";
  const was = nav.hidden;
  nav.hidden = false;
  if (was) cy.resize();
}
document.getElementById("tree-body").addEventListener("click", e => { const b = e.target.closest("button[data-k]"); if (b) { e.preventDefault(); focus(b.dataset.k); } });
document.getElementById("tree-close").onclick = () => { document.getElementById("tree").hidden = true; cy.resize(); };
document.getElementById("tree-open").onclick = () => document.querySelectorAll("#tree-body details").forEach(d => d.open = true);
document.getElementById("tree-shut").onclick = () => document.querySelectorAll("#tree-body details").forEach(d => d.open = false);
document.getElementById("tree-q").addEventListener("input", e => {
  const q = e.target.value.trim().toLowerCase(), all = [...document.querySelectorAll("#tree-body details")];
  all.forEach(d => d.classList.remove("hidden-by-filter"));
  if (!q) return;
  all.forEach(d => d.classList.add("hidden-by-filter"));
  all.filter(d => d.dataset.name.includes(q)).forEach(d => {
    for (let p = d; p && p.tagName === "DETAILS"; p = p.parentElement.closest("details")) { p.classList.remove("hidden-by-filter"); if (p !== d) p.open = true; }
    d.querySelectorAll("details").forEach(c => c.classList.remove("hidden-by-filter"));
  });
});

const restyle = () => cy.style(style());
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", restyle);
new MutationObserver(restyle).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

intro();
setArrange(arrange);
const hash = location.hash.slice(1);
if (hash && byKey[hash]) focus(hash);
</script>
