<title>Freefall Registry Map</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen tool - toolbar; schema tree (left), the view (matrix overview or routed diagram), details (right). Engineering-drawing palette. */
:root {
  --bg: #f3f5f7; --panel: #ffffff; --fg: #17202a; --muted: #5a6775; --line: #d3dae1; --soft: #e9edf1; --grid: #e3e8ed;
  --accent: #1f6feb; --root-fg: #ffffff; --def: #7b8794; --hl: #d9480f; --hl2: #1f6feb;
  --a0: #2f6db5; --a1: #c46a12; --a2: #3f8f4a; --a3: #c23b3b; --a4: #2a8f8a; --a5: #a88a12; --a6: #8b5a9e; --a7: #c9577a; --a8: #7a5a43; --a9: #6b7680;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1418; --panel: #161d23; --fg: #e3e9ef; --muted: #93a1ae; --line: #2a343d; --soft: #1d262e; --grid: #222c35;
  --accent: #5b9dff; --root-fg: #0f1418; --def: #8794a1; --hl: #ff8a4c; --hl2: #5b9dff;
  --a0: #6aa3ea; --a1: #eb9a4b; --a2: #73c27d; --a3: #ef7474; --a4: #5cc5bf; --a5: #d9bd4a; --a6: #bb8dd0; --a7: #ec8db0; --a8: #c09a7d; --a9: #9aa6b1;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1418; --panel: #161d23; --fg: #e3e9ef; --muted: #93a1ae; --line: #2a343d; --soft: #1d262e; --grid: #222c35;
  --accent: #5b9dff; --root-fg: #0f1418; --def: #8794a1; --hl: #ff8a4c; --hl2: #5b9dff;
  --a0: #6aa3ea; --a1: #eb9a4b; --a2: #73c27d; --a3: #ef7474; --a4: #5cc5bf; --a5: #d9bd4a; --a6: #bb8dd0; --a7: #ec8db0; --a8: #c09a7d; --a9: #9aa6b1;
  color-scheme: dark; }
html, body { height: 100%; }
@media (min-width: 761px) { body { overflow: hidden; } }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 14px; display: flex; flex-direction: column; }
header { display: flex; flex-direction: column; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
h1 { font-size: 15px; font-weight: 600; margin: 0; }
h1 small { font-weight: 400; color: var(--muted); font-family: var(--mono); font-size: 12px; margin-left: 6px; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { font: 500 12px var(--sans); background: transparent; color: var(--muted); border: 0; padding: 5px 10px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.lbl { font: 600 10.5px var(--sans); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
input[type=search] { font: 13px var(--mono); padding: 5px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); width: 15rem; max-width: 100%; }
button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.tog { font: 500 12px var(--sans); padding: 4px 9px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--fg); cursor: pointer; }
.tog[aria-pressed="false"] { color: var(--muted); }
.chip { font: 500 11.5px var(--sans); display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border: 1px solid var(--line); border-radius: 999px; background: transparent; color: var(--fg); cursor: pointer; }
.chip i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.chip[aria-pressed="false"] { opacity: .4; }
.chip span { color: var(--muted); font-variant-numeric: tabular-nums; }
main { flex: 1; display: flex; min-height: 0; }
#stage { flex: 1; min-width: 0; position: relative; overflow: hidden; }
#tip { position: fixed; pointer-events: none; background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font: 11.5px var(--mono); max-width: 380px; box-shadow: 0 4px 14px rgb(0 0 0 / .14); z-index: 20; line-height: 1.45; }

/* Matrix: rows name columns. */
#matrix { position: absolute; inset: 0; overflow: auto; }
#matrix[hidden], #focus[hidden] { display: none; }
table.dsm { border-collapse: separate; border-spacing: 0; font: 10.5px var(--mono); }
.dsm th, .dsm td { padding: 0; }
.dsm thead th { position: sticky; top: 0; background: var(--panel); z-index: 2; }
.dsm thead tr.areas th { height: 20px; font: 600 10.5px var(--sans); text-align: left; padding-left: 4px; border-bottom: 2px solid; white-space: nowrap; overflow: hidden; max-width: 0; }
.dsm thead tr.cols th { top: 22px; height: 150px; vertical-align: bottom; border-bottom: 1px solid var(--line); }
.dsm thead tr.cols th div { writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap; padding: 4px 0; width: 20px; text-align: left; cursor: pointer; color: var(--fg); }
.dsm th.corner { position: sticky; left: 0; top: 0; z-index: 4; background: var(--panel); min-width: 210px; max-width: 210px; text-align: left; font: 400 11px/1.45 var(--sans); color: var(--muted); padding: 8px; vertical-align: bottom; white-space: normal; }
.dsm thead tr.areas th.corner { white-space: normal; overflow: visible; max-width: 210px; border-bottom: 1px solid var(--line); }
.dsm tbody th { position: sticky; left: 0; z-index: 1; background: var(--panel); text-align: left; white-space: nowrap; padding: 0 8px 0 6px; height: 20px; border-left: 4px solid; cursor: pointer; font-weight: 400; color: var(--fg); }
.dsm td { width: 20px; height: 20px; min-width: 20px; text-align: center; border-right: 1px solid var(--grid); border-bottom: 1px solid var(--grid); color: var(--fg); font-variant-numeric: tabular-nums; }
.dsm td.n { cursor: pointer; font-weight: 500; }
.dsm td.diag { background: var(--soft); }
.dsm .ab { border-left: 2px solid var(--muted) !important; }
.dsm tr.at td, .dsm tr.at th { border-top: 2px solid var(--muted); }
.dsm tr.sel th { background: var(--soft); font-weight: 600; }
.dsm tr.sel td { box-shadow: inset 0 0 0 999px color-mix(in srgb, var(--hl) 10%, transparent); }
.dsm td.colsel { box-shadow: inset 0 0 0 999px color-mix(in srgb, var(--hl2) 10%, transparent); }
.dsm thead th.colsel div { font-weight: 600; color: var(--hl2); }

/* Routed diagram */
#focus { position: absolute; inset: 0; cursor: grab; touch-action: none; }
#focus.drag { cursor: grabbing; }
#focus svg { width: 100%; height: 100%; display: block; }
.card rect.body { fill: var(--panel); stroke-width: 1.2; }
.card text { font-family: var(--mono); font-size: 11px; fill: var(--fg); }
.card text.title { font-weight: 600; font-size: 12px; fill: var(--root-fg); cursor: pointer; }
.card text.sub { font-size: 9.5px; font-family: var(--sans); fill: var(--root-fg); opacity: .85; }
.card text.to { fill: var(--muted); }
.card text.more { fill: var(--muted); font-family: var(--sans); font-size: 10px; }
.card .frow { cursor: pointer; }
.card .frow rect { fill: transparent; }
.card .frow:hover rect, .card .frow.on rect { fill: var(--soft); }
.card.sel rect.body { stroke: var(--hl); stroke-width: 3; }
.card.dim { opacity: .22; }
path.edge { fill: none; stroke-width: 1.4; opacity: .75; stroke-linejoin: round; }
path.edge.on { stroke: var(--hl) !important; stroke-width: 2.6; opacity: 1; }
path.edge.dim { opacity: .08; }
path.edge.book { stroke-dasharray: 2 3; }
#focus .empty[hidden] { display: none; }
#focus .empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 13px; padding: 24px; text-align: center; }
.zoom { position: absolute; right: 12px; bottom: 12px; display: flex; gap: 4px; }
.zoom button { font: 500 12px var(--sans); width: 30px; height: 28px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--fg); cursor: pointer; }
.zoom button.wide { width: auto; padding: 0 9px; }

/* Left: all kinds (browse) and the schema of the selected one */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: -4px -14px 6px; padding: 0 14px; }
.tabs [role=tab] { font: 600 12px var(--sans); background: none; border: 0; border-bottom: 2px solid transparent; color: var(--muted); padding: 8px 8px 7px; cursor: pointer; }
.tabs [role=tab][aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.tabs [role=tab]:disabled { opacity: .4; cursor: default; }
.tabs .hide { margin-left: auto; font: 500 11.5px var(--sans); background: none; border: 0; color: var(--muted); cursor: pointer; }
#pane-list, #pane-schema { display: flex; flex-direction: column; gap: 8px; }
#pane-list[hidden], #pane-schema[hidden] { display: none; }
.listbar { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--muted); }
.listbar button, .grp summary button { font: 500 11px var(--sans); color: var(--accent); background: none; border: 1px solid var(--line); border-radius: 5px; padding: 2px 7px; cursor: pointer; }
.grp { border-top: 1px solid var(--soft); }
.grp summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 7px 0; font: 600 12px var(--sans); }
.grp summary::-webkit-details-marker { display: none; }
.grp summary::before { content: "▸"; color: var(--muted); width: 10px; }
.grp[open] summary::before { content: "▾"; }
.grp summary .n { color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }
.grp summary button { margin-left: auto; }
.grp summary i, .krow i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.krow { display: grid; grid-template-columns: 10px 1fr auto; gap: 8px; align-items: center; width: 100%; text-align: left; background: none; border: 0; border-radius: 5px; padding: 4px 6px; cursor: pointer; color: var(--fg); font: 12px var(--mono); }
.krow:hover, .krow.sel { background: var(--soft); }
.krow .c { color: var(--muted); font-size: 10.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.krow .m { grid-column: 2 / 4; color: var(--muted); font-size: 10.5px; word-break: break-all; }
.reopen { position: absolute; left: 8px; top: 8px; z-index: 6; font: 500 12px var(--sans); background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
main { position: relative; }

nav#tree { width: 380px; flex: none; border-right: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 14px 14px 24px; display: flex; flex-direction: column; gap: 8px; }
nav#tree[hidden], .reopen[hidden] { display: none; }
.treehead { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.treehead h2 { font: 600 15px var(--mono); margin: 0; word-break: break-word; }
.treehead button, .treetools button { font: 500 11.5px var(--sans); color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 5px; padding: 3px 8px; cursor: pointer; }
.treetools { display: flex; gap: 6px; flex-wrap: wrap; }
.treetools input { flex: 1; min-width: 8rem; font: 12px var(--mono); padding: 4px 8px; border: 1px solid var(--line); border-radius: 5px; background: var(--bg); color: var(--fg); }
#tree-body { font: 12px var(--mono); }
#tree-body details { margin-left: 12px; border-left: 1px solid var(--soft); padding-left: 6px; }
#tree-body > details { margin-left: 0; border-left: 0; padding-left: 0; }
#tree-body summary { cursor: pointer; padding: 2px 0; list-style: none; display: flex; flex-wrap: wrap; gap: 2px 6px; align-items: baseline; }
#tree-body summary::-webkit-details-marker { display: none; }
#tree-body summary::before { content: "▸"; color: var(--muted); width: 10px; flex: none; }
#tree-body details[open] > summary::before { content: "▾"; }
#tree-body details.leaf > summary::before { content: "·"; }
.pn { font-weight: 500; color: var(--fg); }
.pn.req::after { content: "*"; color: var(--hl); margin-left: 1px; }
.pt { color: var(--muted); }
.pu { color: var(--a2); }
.ps { color: var(--def); border: 1px dashed var(--def); border-radius: 4px; padding: 0 4px; font-size: 10.5px; }
.px button { font: inherit; font-size: 11px; color: var(--root-fg); background: var(--accent); border: 0; border-radius: 4px; padding: 0 5px; cursor: pointer; }
.pd { color: var(--muted); font-family: var(--sans); font-size: 12px; line-height: 1.45; margin: 2px 0 4px 16px; }
.pe { margin: 2px 0 4px 16px; color: var(--fg); font-size: 11px; line-height: 1.5; word-break: break-word; }
.pm { color: var(--muted); font-size: 11px; }
.hidden-by-filter { display: none; }

/* Details (right) */
aside { width: 350px; flex: none; border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
aside h2 { font: 600 16px var(--mono); margin: 0; word-break: break-word; }
.meta { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: 12.5px; margin: 0; }
.meta dt { color: var(--muted); }
.meta dd { margin: 0; font-family: var(--mono); font-size: 12px; word-break: break-all; }
.about { color: var(--muted); font-size: 13px; line-height: 1.5; margin: 0; }
h3 { font: 600 11px var(--sans); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 6px; }
.acts { display: flex; gap: 6px; flex-wrap: wrap; }
.acts button { font: 500 11.5px var(--sans); color: var(--accent); background: none; border: 1px solid var(--line); border-radius: 5px; padding: 3px 8px; cursor: pointer; }
table.dep { width: 100%; border-collapse: collapse; font: 12px var(--mono); }
table.dep td { padding: 3px 0; vertical-align: top; border-top: 1px solid var(--soft); }
table.dep td:first-child { width: 42%; padding-right: 8px; }
table.dep td.f { color: var(--muted); word-break: break-all; }
table.dep button { font: inherit; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; text-align: left; word-break: break-all; }
.hint { color: var(--muted); font-size: 13px; line-height: 1.5; margin: 0; }
.none { color: var(--muted); font: 12px var(--mono); margin: 0; }
@media (max-width: 760px) {
  main { flex-direction: column; }
  #stage { min-height: 65vh; }
  nav#tree { width: auto; border-right: 0; border-bottom: 1px solid var(--line); max-height: 60vh; order: 2; }
  aside { width: auto; border-left: 0; border-top: 1px solid var(--line); order: 3; }
}
</style>

<header>
  <div class="row">
    <h1>Freefall Registry Map <small id="count"></small></h1>
    <input type="search" id="q" placeholder="Find a kind: hull, mount, planet-field" aria-label="Find a kind">
    <span class="lbl">View</span>
    <div class="seg" role="group" aria-label="View">
      <button id="v-matrix" aria-pressed="true">Matrix</button>
      <button id="v-focus" aria-pressed="false">Diagram</button>
    </div>
    <span class="lbl">Diagram shows</span>
    <div class="seg" role="group" aria-label="Diagram scope">
      <button id="m-near1" aria-pressed="true">1 step</button>
      <button id="m-near2" aria-pressed="false">2 steps</button>
      <button id="m-down" aria-pressed="false">All it depends on</button>
      <button id="m-up" aria-pressed="false">All that depend on it</button>
      <button id="m-area" aria-pressed="false">Its area</button>
    </div>
    <button class="tog" id="t-among" aria-pressed="false">Links between neighbours</button>
    <button class="tog" id="t-book" aria-pressed="false">Bookkeeping links</button>
  </div>
  <div class="row" id="areas" aria-label="Areas"><span class="lbl">Areas</span></div>
</header>
<main>
  <nav id="tree" aria-label="Kinds and schema">
    <div class="tabs" role="tablist"><button role="tab" id="tab-list" aria-selected="true">All kinds</button><button role="tab" id="tab-schema" aria-selected="false" disabled>Schema</button><button id="tree-close" aria-label="Hide this panel" class="hide">Hide</button></div>
    <section id="pane-list">
      <div class="treetools"><input type="search" id="list-q" placeholder="Filter: name, area, root or field" aria-label="Filter kinds"></div>
      <div class="row"><span class="lbl">Group by</span><div class="seg" role="group" aria-label="Group by"><button id="g-root" aria-pressed="true">Root</button><button id="g-area" aria-pressed="false">Area</button><button id="g-none" aria-pressed="false">None</button></div></div>
      <div class="listbar"><span id="list-count"></span><button id="list-draw">Draw these</button></div>
      <div id="list-body"></div>
    </section>
    <section id="pane-schema" hidden>
      <div class="treehead"><h2 id="tree-title"></h2></div>
      <p class="hint" id="tree-file"></p>
      <div class="treetools"><input type="search" id="tree-q" placeholder="Filter fields" aria-label="Filter fields"><button id="tree-open">Expand all</button><button id="tree-shut">Collapse</button></div>
      <div id="tree-body"></div>
    </section>
  </nav>
  <button id="tree-show" class="reopen" hidden>Kinds</button>
  <div id="stage">
    <div id="matrix"></div>
    <div id="focus" hidden>
      <svg id="svg" aria-label="Diagram of the selected kind and its references"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker></defs><g id="vp"></g></svg>
      <div class="empty" id="focus-empty">Pick a kind (click a row in the matrix, or search) to draw it with its references.</div>
      <div class="zoom"><button id="z-in" aria-label="Zoom in">+</button><button id="z-out" aria-label="Zoom out">−</button><button id="z-fit" class="wide">Fit</button></div>
    </div>
  </div>
  <aside id="panel"></aside>
</main>
<div id="tip" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/elkjs@0.9.3/lib/elk.bundled.js"></script>
<script>
const DATA = /*DATA*/null;
const BOOK = /^(basis|revision|identity\.revision|said_as|model_requests)\b|\.basis\b|\.revision\b/;   // provenance and bookkeeping, not structure
const PLUMB = new Set(["common.key", "common.basis", "common.record_revision", "common.revision", "common.said_as", "common.provenance", "common.label"]);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const areas = [...new Set(DATA.kinds.map(k => k.area))].sort();
const areaVar = Object.fromEntries(areas.map((a, i) => [a, `--a${i % 10}`]));
const byKey = Object.fromEntries(DATA.kinds.map(k => [k.key, k]));
const refs = DATA.refs.map(r => ({ ...r, real: r.fields.filter(f => !BOOK.test(f)), book: r.fields.filter(f => BOOK.test(f)) }));
const out = {}, inn = {};
refs.forEach(r => { (out[r.from] ||= []).push(r); (inn[r.to] ||= []).push(r); });
const st = { view: "matrix", mode: "near1", book: false, among: false, selected: null, other: null, custom: null };
try { Object.assign(st, JSON.parse(localStorage.getItem("registry-map") || "{}")); } catch (e) {}
st.selected = null; st.other = null; st.custom = null;
const shown = new Set(areas);
const fieldsOf = r => st.book ? r.fields : r.real;
const links = () => refs.filter(r => fieldsOf(r).length);
const nFields = refs.reduce((s, r) => s + r.real.length, 0);
document.getElementById("count").textContent = `${DATA.kinds.length} kinds · ${refs.filter(r => r.real.length).length} links · ${nFields} reference fields`;
const save = () => { try { localStorage.setItem("registry-map", JSON.stringify({ view: st.view, mode: st.mode, book: st.book, among: st.among })); } catch (e) {} };
const tip = document.getElementById("tip");
function showTip(html, ev) { tip.innerHTML = html; tip.hidden = false; tip.style.left = Math.max(8, Math.min(ev.clientX + 14, innerWidth - 390)) + "px"; tip.style.top = (ev.clientY + 12) + "px"; }
const hideTip = () => { tip.hidden = true; };

/* ---------- Matrix: every reference at once ---------- */
function ordered() { return DATA.kinds.filter(k => shown.has(k.area)).sort((a, b) => a.area.localeCompare(b.area) || a.key.localeCompare(b.key)); }
function matrix() {
  const ks = ordered(), cell = {};
  links().forEach(r => { cell[r.from + ">" + r.to] = r; });
  let h = `<table class="dsm"><thead><tr class="areas"><th class="corner" rowspan="2">Rows name columns: the number is how many of the row's fields hold a record key of the column's kind. Click a row or column to pick a kind; a number to draw the pair.</th>`;
  let prev = null;
  ks.forEach(k => { if (k.area !== prev) { const n = ks.filter(x => x.area === k.area).length; h += `<th colspan="${n}" class="ab" style="color:var(${areaVar[k.area]});border-bottom-color:var(${areaVar[k.area]})" title="${esc(k.area)}">${esc(k.area)}</th>`; prev = k.area; } });
  h += `</tr><tr class="cols">`;
  prev = null;
  ks.forEach(k => { h += `<th data-col="${esc(k.key)}" class="${k.area !== prev ? "ab" : ""}"><div>${esc(k.key)}</div></th>`; prev = k.area; });
  h += `</tr></thead><tbody>`;
  let prevRow = null;
  ks.forEach(r => {
    h += `<tr data-row="${esc(r.key)}" class="${r.area !== prevRow ? "at" : ""}"><th style="border-left-color:var(${areaVar[r.area]})">${esc(r.key)}</th>`;
    let pc = null;
    ks.forEach(c => {
      const x = cell[r.key + ">" + c.key], n = x ? fieldsOf(x).length : 0;
      const cls = [c.area !== pc ? "ab" : "", r.key === c.key ? "diag" : "", n ? "n" : ""].join(" ").trim();

  if (!st.selected || !st.custom.has(st.selected)) { st.selected = keys[0]; panel(byKey[keys[0]]); markMatrix(); }
  ["near1", "near2", "down", "up", "area"].forEach(x => document.getElementById("m-" + x).setAttribute("aria-pressed", false));
  st.view === "focus" ? draw() : setView("focus");
}
document.getElementById("tree-body").addEventListener("click", e => { const b = e.target.closest("button[data-k]"); if (b) { e.preventDefault(); select(b.dataset.k); } });
document.getElementById("tree-close").onclick = () => { document.getElementById("tree").hidden = true; document.getElementById("tree-show").hidden = false; if (st.view === "focus") fit(); };
document.getElementById("tree-show").onclick = () => { document.getElementById("tree").hidden = false; document.getElementById("tree-show").hidden = true; if (st.view === "focus") fit(); };
document.getElementById("tree-open").onclick = () => document.querySelectorAll("#tree-body details").forEach(d => d.open = true);
document.getElementById("tree-shut").onclick = () => document.querySelectorAll("#tree-body details").forEach(d => d.open = false);
document.getElementById("tree-q").addEventListener("input", e => {
  const q = e.target.value.trim().toLowerCase(), all = [...document.querySelectorAll("#tree-body details")];
  all.forEach(d => d.classList.remove("hidden-by-filter"));
  if (!q) return;
  all.forEach(d => d.classList.add("hidden-by-filter"));
  all.filter(d => d.dataset.name.includes(q)).forEach(d => {
    for (let p = d; p && p.tagName === "DETAILS"; p = p.parentElement.closest("details")) { p.classList.remove("hidden-by-filter"); if (p !== d) p.open = true; }
    d.querySelectorAll("details").forEach(c => c.classList.remove("hidden-by-filter"));
  });
});

/* ---------- State ---------- */
function select(key, redraw = true) {
  if (!byKey[key]) return;
  st.selected = key;
  panel(byKey[key]);
  const opened = showTree(byKey[key]);
  tab("schema");
  if (st.custom && !st.custom.has(key)) { st.custom = null; setMode(st.mode, false); }
  markMatrix(); renderList();
  if (st.view === "focus" && (redraw || opened)) draw();
  if (st.view === "matrix") mx.querySelector(`tr[data-row="${CSS.escape(key)}"] th`)?.scrollIntoView({ block: "nearest", inline: "nearest" });
}
function setView(v) {
  st.view = v; save();
  document.getElementById("v-matrix").setAttribute("aria-pressed", v === "matrix");
  document.getElementById("v-focus").setAttribute("aria-pressed", v === "focus");
  document.getElementById("matrix").hidden = v !== "matrix";
  document.getElementById("focus").hidden = v !== "focus";
  hideTip();
  if (v === "focus") draw();
}
function setMode(m, redraw = true) {
  st.mode = m; st.custom = null; save();
  ["near1", "near2", "down", "up", "area"].forEach(x => document.getElementById("m-" + x).setAttribute("aria-pressed", x === m));
  if (redraw && st.view === "focus") draw();
}
document.getElementById("v-matrix").onclick = () => setView("matrix");
document.getElementById("v-focus").onclick = () => setView("focus");
["near1", "near2", "down", "up", "area"].forEach(x => document.getElementById("m-" + x).onclick = () => { setMode(x, st.view === "focus"); if (st.view !== "focus") setView("focus"); });
const ta = document.getElementById("t-among");
ta.onclick = () => { st.among = !st.among; ta.setAttribute("aria-pressed", st.among); save(); if (st.view === "focus") draw(); };
ta.setAttribute("aria-pressed", st.among);
const tb = document.getElementById("t-book");
tb.onclick = () => { st.book = !st.book; tb.setAttribute("aria-pressed", st.book); save(); matrix(); renderList(); if (st.selected) panel(byKey[st.selected]); if (st.view === "focus") draw(); };
const ar = document.getElementById("areas");
areas.forEach(a => {
  const b = document.createElement("button");
  b.className = "chip"; b.setAttribute("aria-pressed", "true"); b.id = "area-" + a.replace(/\W/g, "");
  b.innerHTML = `<i style="background:var(${areaVar[a]})"></i>${esc(a)} <span>${DATA.kinds.filter(k => k.area === a).length}</span>`;
  b.onclick = () => { shown.has(a) ? shown.delete(a) : shown.add(a); b.setAttribute("aria-pressed", shown.has(a)); matrix(); renderList(); if (st.view === "focus") draw(); };
  ar.appendChild(b);
});
document.getElementById("q").addEventListener("input", e => {
  const q = e.target.value.trim().toLowerCase();
  if (!q) return;
  const hit = DATA.kinds.find(k => k.key === q) || DATA.kinds.find(k => k.key.startsWith(q)) || DATA.kinds.find(k => k.key.includes(q) || k.title.toLowerCase().includes(q));
  if (hit) { if (!shown.has(hit.area)) document.getElementById("area-" + hit.area.replace(/\W/g, "")).click(); select(hit.key); }
});
addEventListener("resize", () => { if (st.view === "focus") fit(); });

tb.setAttribute("aria-pressed", st.book);
matrix(); intro(); setGroup(groupBy); tab("list"); setMode(st.mode, false); setView(st.view);
const hash = location.hash.slice(1);
if (hash && byKey[hash]) select(hash);
</script>
