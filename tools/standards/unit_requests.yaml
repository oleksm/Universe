# Work the registry asks of plant units' installed models (common.schema.yaml model_request), written onto the unit
# records by plants.py. A request is open until a version above of_version is installed (model_spec.py, next_asset.py --rework).
unit.truck-dump-hopper:
- {do: measure, of_version: 2, asked: "2026-10-17", by: registry, because: "Measure its envelope boxes from v2: its east half's underside is open for the hopper belt through the east portal (your yard belt fit, candidate v02, found it clear), but the registry's boxes were cut by hand (y -1.45 to 1.45 under z -1.2) for the fit check. Send the boxes the belt's way really has."}
unit.disc-filter-2:
- {do: measure, of_version: 1, asked: "2026-10-17", by: registry, because: "Measure its envelope boxes from v1: the cake belt runs along x under the chutes at y -2.4, its top 1.4 m up, and the boxes were cut by hand to leave it a channel (y -2.55 to -1.6 below the chutes' feet at 1.9 m). Say where the trough legs and chutes really stand."}
unit.ladle-furnace-80t:
- {do: measure, of_version: 1, asked: "2026-10-17", by: registry, because: "Measure its own envelope boxes from v1: it carries the sealed furnace's measured boxes for now (the same gantry), but the air furnace's roof elbow and chute differ. The fume duct leaves the roof elbow at (2, 0, 7.5) up to z 10 and north out of the open side."}
