# How the registry's page reads a value the records hold in SI: the unit it is shown in. For each schema
# and property: `per`, how many of the record's unit make one of the unit read; `reads`, the property's
# description in that unit. Used by build.py only, until the page converts for itself.
Celestial/schema/body.schema.yaml:
  atmosphere.scale_height:
    per: 1000.0
    reads: km, the height over which the air thins by 2.7 times
  atmosphere.surface_pressure:
    per: 1000.0
    reads: 'kPa at its surface (Earth: 101.3)'
  atmosphere.top:
    per: 1000.0
    reads: km, where it is taken to end
  crust.surface_age:
    per: 3.15576e+16
    reads: 'billion years since its surface was last remade: old ground is heavily cratered'
  interior.core_radius:
    per: 1000.0
    reads: km
  interior.crust_thickness:
    per: 1000.0
    reads: km, on average
  magnetic.field:
    per: 1.0e-06
    reads: 'microtesla at its surface, at the equator (Earth: about 30)'
  orbit.period:
    per: 86400.0
    reads: days (of 86,400 s) to go round once
  orbit.semi_major_axis:
    per: 1000.0
    reads: km, half the long axis of its orbit
  physical.age:
    per: 3.15576e+16
    reads: billion years since it formed
  physical.day:
    per: 3600.0
    reads: hours to turn once
  physical.radius:
    per: 1000.0
    reads: km
  physical.rings:
    per: 1000.0
    reads: km, the inner and outer radius of its rings
  star.luminosity:
    per: 3.828e+26
    reads: times the Sun's
  water.ocean_depth:
    per: 1000.0
    reads: km, on average
  water.salinity:
    per: 0.001
    reads: 'g of salt in each kg of its sea water (Earth: 35)'
