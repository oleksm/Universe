<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Freefall Facts</title>
<style>
:root {
  color-scheme: dark;
  /* The game's HUD: near-black panels on dark slate, pale text, amber, cyan, green. */
  --bg: #2b3138; --panel: #20262c; --line: #3a4652; --text: #dcebf2; --dim: #8fa3b0;
  --head: #60ffb0; --id: #ffb040; --link: #5cc8f0; --sel: #1f4a3d; --bad: #ff5a4a; --code: #2e363e;
  --th: #48505a; --tbl: #383e46; --tline: #535c67;
  --nav: #20262c;
  --k-chemical: #60ffb0; --k-thermal: #ffb040; --k-mechanical: #5cc8f0;
  --m-metal: #e6c15a; --m-alloy: #9cc4e6; --m-ceramic: #f09a6a; --m-glass: #9be3e8; --m-polymer: #cfa3f5; --m-composite: #7ed29a; --m-fluid: #6aa8ff;
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #ffffff; --panel: #ffffff; --line: #b9c4cd; --text: #0a1117; --dim: #3d4f5c;
  --head: #04683b; --id: #0a58b8; --link: #0a58b8; --sel: #cdeedd; --bad: #b0281a; --code: #e9eef2;
  --th: #dceaf3; --tbl: #f3f8fb; --tline: #b7cbd8;
  --nav: #f4f6f8;
  --k-chemical: #04683b; --k-thermal: #a85a00; --k-mechanical: #0a58b8;
  --m-metal: #8a6a00; --m-alloy: #2f5f8a; --m-ceramic: #a8481c; --m-glass: #1b7f86; --m-polymer: #7a3fb0; --m-composite: #1f7a3f; --m-fluid: #1f55b8;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; letter-spacing: .06em; }
header { display: flex; gap: 12px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 2; }
header { text-transform: none; }
header h1 { font-size: 15px; margin: 0; color: var(--head); letter-spacing: .05em; white-space: nowrap; }
header input { flex: 1; min-width: 0; max-width: 420px; padding: 6px 10px; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 4px; font: inherit; }
header .count { color: var(--dim); white-space: nowrap; }
header button { margin-left: auto; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 4px 10px; font: inherit; cursor: pointer; }
main { display: grid; grid-template-columns: var(--nav-w, 400px) 6px 1fr; height: calc(100vh - 49px); }
#grip { cursor: col-resize; background: var(--line); opacity: .5; }
#grip:hover, #grip.drag { opacity: 1; background: var(--head); }
nav { overflow: auto; padding: 8px 0; background: var(--nav); }
article { overflow: auto; padding: 16px 24px 48px; }
article > * { max-width: 110ch; }
.row { padding: 2px 12px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row:hover { background: var(--code); }
.row.sel { background: var(--sel); box-shadow: inset 3px 0 0 var(--head); font-weight: 600; }
.row .tw { display: inline-block; width: 1.2em; color: var(--dim); }
.row.body { color: var(--head); font-weight: bold; }
.row.empty { color: var(--dim); }
.row .n { color: var(--dim); }
.row .sid { color: var(--id); }
h2 { color: var(--head); font-size: 17px; margin: 0 0 4px; }
h3 { color: var(--dim); font-weight: 700 !important; font-size: 12px; letter-spacing: .08em; margin: 22px 0 6px; font-weight: normal; text-transform: uppercase; }
.meta { color: var(--dim); }
a { color: var(--link); text-decoration: none; cursor: pointer; }
a:hover { text-decoration: underline; }
table { border-collapse: collapse; margin: 4px 0; }
th, td { text-align: left; padding: 3px 14px 3px 0; vertical-align: top; }
th { color: var(--dim); font-weight: 700; border-bottom: 1px solid var(--line); text-transform: uppercase; font-size: 12px; background: var(--th); color: var(--text); border-bottom-color: var(--tline); }
tr + tr td { border-top: 1px solid var(--tline); }
table { background: var(--tbl); border: 1px solid var(--tline); }
th, td { padding: 4px 14px 4px 8px; }
th:first-child, td:first-child { padding-left: 4px; }
td.num { text-align: right; }
.problems { border: 1px solid var(--bad); color: var(--bad); padding: 8px 12px; margin: 8px 12px; border-radius: 4px; }
.problems li { margin: 2px 0; }
.file { color: var(--dim); font-size: 12px; }
p { margin: 4px 0 8px; max-width: 80ch; }
.ico { display: inline-block; vertical-align: middle; line-height: 0; color: var(--head); }
.ico svg { width: 18px; height: 18px; }
.ico.big svg { width: 44px; height: 44px; }
.ico.mid svg { width: 26px; height: 26px; }
.row .ico { margin-right: 6px; }
.logo { --logo-cut: var(--bg); display: inline-block; vertical-align: middle; line-height: 0; }
.logo svg { width: 18px; height: 18px; }
.logo.big svg { width: 96px; height: 96px; }
.landmap { display: block; width: 100%; max-width: 760px; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; margin: 6px 0 12px; }
.landmap .zone { stroke-width: 6; fill-opacity: .22; }
.landmap .u-port { fill: #4c9bd9; stroke: #4c9bd9; } .landmap .u-industrial { fill: #d98a3d; stroke: #d98a3d; } .landmap .u-commercial { fill: #9b8cf0; stroke: #9b8cf0; }
.landmap .u-civic { fill: #5fbf8f; stroke: #5fbf8f; } .landmap .u-residential { fill: #d9c84a; stroke: #d9c84a; }
.landmap .reach { fill: none; stroke: var(--dim); stroke-width: 3; stroke-dasharray: 14 12; }
.landmap .padc { fill: none; stroke: var(--text); stroke-width: 5; }
.landmap .plot { fill: var(--bg); fill-opacity: .55; stroke: var(--text); stroke-width: 6; cursor: pointer; } .landmap .plot.lit { stroke: var(--head); fill: var(--head); fill-opacity: .25; }
.landmap .zl { fill: var(--dim); letter-spacing: .08em; } .landmap .pl { fill: var(--text); font-weight: 700; cursor: pointer; }
.landmap .scale { fill: none; stroke: var(--text); stroke-width: 6; }
.row .logo { --logo-cut: var(--nav); margin-right: 6px; }
.row.sel .logo { --logo-cut: var(--sel); }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; max-width: none; margin: 6px 0 12px; }
.gallery a { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 6px; background: var(--tbl); border: 1px solid var(--tline); border-radius: 4px; text-align: center; color: var(--text); font-size: 12px; letter-spacing: 0; }
.gallery a:hover { border-color: var(--head); text-decoration: none; }
.ico.k-chemical { color: var(--k-chemical); } .ico.k-thermal { color: var(--k-thermal); } .ico.k-mechanical { color: var(--k-mechanical); }
.ico.m-metal { color: var(--m-metal); } .ico.m-alloy { color: var(--m-alloy); } .ico.m-ceramic { color: var(--m-ceramic); } .ico.m-glass { color: var(--m-glass); }
.ico.m-polymer { color: var(--m-polymer); } .ico.m-composite { color: var(--m-composite); } .ico.m-fluid { color: var(--m-fluid); }
.badges { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 10px; max-width: none; }
.badge { padding: 3px 12px; border: 1px solid var(--tline); border-radius: 12px; cursor: pointer; font-size: 12px; color: var(--dim); background: transparent; user-select: none; }
.badge:hover { color: var(--text); }
.badge.on { color: var(--bg); background: var(--text); border-color: var(--text); font-weight: 700; }
.badge.k-chemical.on { background: var(--k-chemical); border-color: var(--k-chemical); }
.badge.k-thermal.on { background: var(--k-thermal); border-color: var(--k-thermal); }
.badge.k-mechanical.on { background: var(--k-mechanical); border-color: var(--k-mechanical); }
.badge.k-chemical { border-color: var(--k-chemical); } .badge.k-thermal { border-color: var(--k-thermal); } .badge.k-mechanical { border-color: var(--k-mechanical); }
/* The periodic table: 18 groups across (a column of period numbers first), the f-block below. */
.ptable { display: grid; grid-template-columns: 22px repeat(18, 46px); gap: 3px; margin: 8px 0 12px; max-width: none; letter-spacing: 0; }
.ptable .hd { color: var(--dim); font-size: 11px; text-align: center; align-self: center; }
.ptable .el { height: 46px; padding: 2px 4px; border-radius: 3px; cursor: pointer; color: #eef3f6; line-height: 1.15; overflow: hidden; }
.ptable .el:hover { outline: 2px solid var(--head); }
.ptable .el .z { font-size: 10px; opacity: .8; display: block; }
.ptable .el .sy { font-size: 16px; font-weight: 700; }
.ptable .ph { height: 46px; font-size: 10px; color: var(--dim); display: flex; align-items: center; justify-content: center; border: 1px dashed var(--line); border-radius: 3px; }
/* An element's icon: its tile from the periodic table. */
.tile { display: inline-flex; flex-direction: column; justify-content: center; width: 46px; height: 46px; padding: 2px 4px; border-radius: 3px; color: #eef3f6; line-height: 1.15; vertical-align: middle; letter-spacing: 0; margin-right: 10px; }
.tile .z { font-size: 10px; opacity: .8; font-weight: 400; }
.tile .sy { font-size: 16px; font-weight: 700; }
.tile.small { width: 22px; height: 18px; padding: 0; margin-right: 6px; align-items: center; }
.tile.small .sy { font-size: 10px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; max-width: none; font-size: 12px; }
.legend span i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; }
.c-alkali-metal { background: #8a3f3f; } .c-alkaline-earth-metal { background: #8a643a; } .c-transition-metal { background: #3d5f86; }
.c-post-transition-metal { background: #357a70; } .c-metalloid { background: #5f7d35; } .c-non-metal { background: #2f7a48; }
.c-halogen { background: #74408a; } .c-noble-gas { background: #4c4496; } .c-lanthanide { background: #8a3c68; } .c-actinide { background: #8a5236; }
.c-unknown { background: #48505a; }
@media (max-width: 720px) {
  main { grid-template-columns: 1fr; height: auto; }
  #grip { display: none; }
  nav { max-height: 45vh; border-right: 0; border-bottom: 1px solid var(--line); }
  header { flex-wrap: wrap; }
}
</style>
</head>
<body>
<header>
  <h1>FREEFALL FACTS</h1>
  <input id="q" type="search" placeholder="Search ids, titles, text, parameters…" autocomplete="off">
  <span class="count" id="count"></span>
  <button id="theme" title="Light or dark">◐</button>
</header>
<main>
  <nav id="tree"></nav>
  <div id="grip" title="Drag to resize"></div>
  <article id="detail"></article>
</main>
<script>
const DATA = /*DATA*/null;
// The game's dark by default; light if chosen (kept, if storage works).
try { if (localStorage.getItem("standards-theme") === "light") document.documentElement.dataset.theme = "light"; } catch (e) {}
document.getElementById("theme").addEventListener("click", () => {
  const light = document.documentElement.dataset.theme !== "light";
  if (light) document.documentElement.dataset.theme = "light"; else delete document.documentElement.dataset.theme;
  try { localStorage.setItem("standards-theme", light ? "light" : "dark"); } catch (e) {}
});
const byId = Object.fromEntries(DATA.standards.map(s => [s.id, s]));
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
// A body's topics (tags on its standards), and its standards under one.
const topicsOf = body => [...new Set(DATA.standards.filter(s => s.body === body.key).flatMap(s => s.topics || []))].sort();
const under = (body, topic, q) => DATA.standards.filter(s => s.body === body.key && (s.topics || []).includes(topic) && matches(s, q));
// The elements under a record (its `records`), those matching `q`.
const elMatches = (e, q) => !q || q.split(/\s+/).every(w => `${e.identity.name} ${e.identity.symbol} ${e.identity.atomic_number} ${e.identity.category || ""}`.toLowerCase().includes(w));
const elementsUnder = (id, q) => DATA.elements.filter(e => e.under === id && elMatches(e, q));
const elBySymbol = Object.fromEntries(DATA.elements.map(e => [e.identity.symbol, e]));
// Likewise the materials under a record.
const matMatches = (m, q) => !q || q.split(/\s+/).every(w => `${m.identity.name} ${m.identity.class} ${m.identity.grade || ""}`.toLowerCase().includes(w));
const materialsUnder = (id, q) => DATA.materials.filter(m => m.under === id && matMatches(m, q));
const matBySlug = Object.fromEntries(DATA.materials.map(m => [m.slug, m]));
// And the processes.
const procMatches = (p, q) => !q || q.split(/\s+/).every(w => `${p.identity.name} ${p.identity.kind} ${p.identity.method || ""} ${p.identity.description || ""}`.toLowerCase().includes(w));
const processesUnder = (id, q) => DATA.processes.filter(p => p.under === id && procMatches(p, q));
const procBySlug = Object.fromEntries(DATA.processes.map(p => [p.slug, p]));
const recordsUnder = id => elementsUnder(id, "").length + materialsUnder(id, "").length + processesUnder(id, "").length;
// An element or material named in a process: a link to it.
const elTile = (e, small) => { const i = e.identity; const c = "c-" + (i.category || "unknown").replace(/[^a-z]+/g, "-"); return small ? `<span class="tile small ${c}"><span class="sy">${esc(i.symbol)}</span></span>` : `<span class="tile ${c}"><span class="z">${i.atomic_number}</span><span class="sy">${esc(i.symbol)}</span></span>`; };
const logo = (slug, cls) => DATA.logos[slug] ? `<span class="logo ${cls || ""}">${DATA.logos[slug]}</span>` : "";
const icon = (slug, cls) => DATA.icons[slug] ? `<span class="ico ${cls || ""} ${procBySlug[slug] ? "k-" + procBySlug[slug].identity.kind : matBySlug[slug] ? "m-" + matBySlug[slug].identity.class : ""}">${DATA.icons[slug]}</span>` : "";
// The kind of process shown in a record's gallery and table (all, or one kind).
let kindShown = "all";
const itemLink = x => {
  const e = elBySymbol[x.item], m = matBySlug[x.item];
  const label = e ? e.identity.name : m ? m.identity.name : (x.name || x.item);
  const k = e ? "el:" + x.item : m ? "mat:" + x.item : null;
  const extra = [x.amount !== undefined ? `${x.amount} t/t` : "", x.form || "", x.grade || ""].filter(Boolean).join(", ");
  return (k ? `<a data-k="${esc(k)}">${esc(label)}</a>` : esc(label)) + (extra ? ` <span class="meta">${esc(extra)}</span>` : "");
};
const ofBody = (body, q) => DATA.standards.filter(s => s.body === body.key && matches(s, q));

// What's open, kept between visits (if storage works).
let open = new Set();
try { open = new Set(JSON.parse(localStorage.getItem("standards-open2") || "[]")); } catch (e) {}
const keepOpen = () => { try { localStorage.setItem("standards-open2", JSON.stringify([...open])); } catch (e) {} };
if (!open.size) DATA.bodies.forEach(b => open.add("b:" + b.key));
// (Seen before there were expanders on standards with standards under them: those start open.)
try { if (!localStorage.getItem("standards-expanders")) { DATA.standards.forEach(s => { if (s.parent) open.add("x:" + s.parent); }); localStorage.setItem("standards-expanders", "1"); } } catch (e) {}

function matches(s, q) {
  if (!q) return true;
  const hay = [s.id, s.title, s.scope, s.text, ...(s.topics || []), ...(s.params || []).map(p => `${p.key} ${p.value} ${p.unit || ""} ${p.note || ""}`)].join(" ").toLowerCase();
  return q.split(/\s+/).every(w => hay.includes(w));
}

// Everyone with an address (SFO 9): standards bodies and makers.
const ORGS_ALL = [...DATA.bodies.map(o => ({ key: o.key, name: o.name, to: "b:" + o.key })), ...DATA.makers.map(m => ({ key: m.key, name: m.name, to: "mk:" + m.key }))];
const ORGS = [...DATA.bodies.map(o => ({ key: o.key, name: o.name, tag: o.prefix, to: "b:" + o.key, address: o.address })), ...DATA.makers.map(m => ({ key: m.key, name: m.name, tag: m.ticker, to: "mk:" + m.key, address: m.address, slug: m.slug })), ...DATA.administrations.map(a => ({ key: "adm." + a.slug, name: `Administration of ${a.name}`, tag: "", to: "ad:" + a.slug, address: a.address }))].filter(o => o.address && o.address.at);
const placeOf = o => { const [sy, at] = o.address.at.split("/"); const a = DATA.administrations.find(x => x.slug === sy); const x = a && a.bodies.find(y => y.slug === at); return x ? { sy, at, a, x } : null; };
const inside = ad => [ad.unit && `Unit ${ad.unit}`, ad.section && `Section ${ad.section}`, ad.deck && `Deck ${ad.deck}`, ad.tower].filter(Boolean);
const addressText = o => { const p = placeOf(o); return p ? [...inside(o.address), p.x.name, p.x.at, p.a.name].filter(Boolean).join(", ") : ""; };
const addressHtml = o => { const p = placeOf(o); if (!p) return ""; const ad = o.address;
  return [...inside(ad).map(esc), `<a data-k="${esc(`bd:${p.sy}:${p.at}`)}">${esc(p.x.name)}</a>`, p.x.at && esc(p.x.at), `<a data-k="${esc("ad:" + p.sy)}">${esc(p.a.name)}</a>`].filter(Boolean).join(", "); };
const orgsAt = (sy, at) => ORGS.filter(o => o.address.at === `${sy}/${at}`).sort((p, r) => String(p.address.tower || "").localeCompare(String(r.address.tower || "")) || (p.address.deck || 0) - (r.address.deck || 0) || String(p.address.section || "").localeCompare(String(r.address.section || "")) || (p.address.unit || 0) - (r.address.unit || 0));

// A parcel's owner, and its address: parcel, zone, settlement, what that is at, system.
const ownerOf = k => ORGS_ALL.find(o => o.key === k) || { name: k, to: "" };
const ownerLink = k => { const o = ownerOf(k); return o.to ? `<a data-k="${esc(o.to)}">${esc(o.name)}</a>` : esc(o.name); };
const parcelKey = (a, x, p) => `pc:${a.slug}:${x.slug}:${p.number}`;
const parcelAddress = (a, x, p) => [`Parcel ${p.number}`, x.name, x.at, a.name].filter(Boolean).join(", ");
const facKey = (a, x, f) => `fc:${a.slug}:${x.slug}:${f.slug}`;
const allFacilities = () => DATA.administrations.flatMap(a => a.bodies.flatMap(x => (x.facilities || []).map(f => ({ a, x, f }))));
const allParcels = () => DATA.administrations.flatMap(a => a.bodies.flatMap(x => (x.parcels || []).map(p => ({ a, x, p }))));

// The tree as shown: each body, its standards under it.
function rows(q) {
  const out = [];
  for (const body of DATA.bodies) {
    const bk = "b:" + body.key;
    out.push({ k: bk, depth: 0, kind: "body", label: `${body.name} (${body.prefix})`, title: body.name });
    if (!open.has(bk) && !q) continue;
    // (Records under their parent: a record with none sits under the body.)
    const all = ofBody(body, "");
    const shown = new Set(ofBody(body, q).map(s => s.id));
    const kids = id => all.filter(s => (s.parent || null) === id);
    const visible = s => shown.has(s.id) || kids(s.id).some(visible) || (q && (elementsUnder(s.id, q).length > 0 || materialsUnder(s.id, q).length > 0 || processesUnder(s.id, q).length > 0));
    const walk = (id, depth) => {
      for (const s of kids(id)) {
        if (q && !visible(s)) continue;
        const n = recordsUnder(s.id);
        const isOpen = open.has("x:" + s.id) || !!q;
        out.push({ k: "s:" + s.id, depth, kind: "std", std: s, n: n || undefined, has: n > 0 || kids(s.id).length > 0, isOpen });
        if (isOpen) walk(s.id, depth + 1);
        // (Its elements, when it's open: by atomic number.)
        if (n && isOpen) {
          for (const e of elementsUnder(s.id, q)) out.push({ k: "el:" + e.identity.symbol, depth: depth + 1, kind: "el", el: e });
          for (const m of materialsUnder(s.id, q)) out.push({ k: "mat:" + m.slug, depth: depth + 1, kind: "mat", mat: m });
          for (const p of processesUnder(s.id, q)) out.push({ k: "proc:" + p.slug, depth: depth + 1, kind: "proc", proc: p });
        }
      }
    };
    walk(null, 1);
  }
  // Maker House: the makers under it.
  const mq = m => !q || q.split(/\s+/).every(w => `${m.name} ${m.ticker} ${m.note} ${m.who || ""} ${m.what || ""}`.toLowerCase().includes(w));
  out.push({ k: "mh", depth: 0, kind: "body", label: DATA.house.name, n: DATA.makers.length });
  if (open.has("mh") || q) for (const m of DATA.makers.filter(mq)) out.push({ k: "mk:" + m.key, depth: 1, kind: "maker", label: m.name, ticker: m.ticker, slug: m.slug });
  // Local Administration: the administrations under it.
  const aq = a => !q || q.split(/\s+/).every(w => a.name.toLowerCase().includes(w));
  out.push({ k: "la", depth: 0, kind: "body", label: DATA.local.name, n: DATA.administrations.length });
  if (open.has("la") || q) for (const a of DATA.administrations) {
    const bodies = a.bodies || [];
    const hit = x => !q || q.split(/\s+/).every(w => `${x.name} ${x.kind}`.toLowerCase().includes(w));
    if (q && !aq(a) && !bodies.some(hit)) continue;
    out.push({ k: "ad:" + a.slug, depth: 1, kind: "adm", label: a.name, n: bodies.length });
    if (!open.has("ad:" + a.slug) && !q) continue;
    // (Its bodies: each under the body it is at, and under each what has its address there.)
    const known = n => bodies.some(y => y.name === n);
    const under = (at, depth) => {
      for (const x of bodies.filter(x => (known(x.at) ? x.at : null) === at)) {
        const k = `bd:${a.slug}:${x.slug}`;
        const orgs = orgsAt(a.slug, x.slug);
        const plots = x.parcels || [];
        const has = orgs.length > 0 || plots.length > 0 || bodies.some(y => y.at === x.name);
        if (q && !hit(x) && !has) continue;
        out.push({ k, depth, kind: "maker", label: x.name, ticker: x.at && !known(x.at) ? x.at : x.kind, leaf: !has });
        if (!has || !(open.has(k) || q)) continue;
        for (const o of orgs) out.push({ k: "at:" + o.key, depth: depth + 1, kind: "maker", label: o.name, ticker: o.tag, leaf: true });
        // (Its parcels. Its zones are on its map, not in the tree.)
        for (const p of plots) {
          const on = (x.facilities || []).filter(f => f.parcel === p.number);
          out.push({ k: parcelKey(a, x, p), depth: depth + 1, kind: "maker", label: `Parcel ${p.number}`, ticker: ownerOf(p.owner).name, leaf: !on.length });
          if (open.has(parcelKey(a, x, p)) || q) for (const f of on) out.push({ k: facKey(a, x, f), depth: depth + 2, kind: "maker", label: f.name, ticker: f.kind, leaf: true });
        }
        under(x.name, depth + 1);
      }
    };
    under(null, 2);
  }
  // The Address Registry: no records of its own, a reference to everything that has an address.
  const listed = addressed().filter(r => !q || q.split(/\s+/).every(w => `${r.who} ${r.address}`.toLowerCase().includes(w)));
  out.push({ k: "ar", depth: 0, kind: "body", label: "Address Registry", n: addressed().length });
  if (open.has("ar") || q) for (const r of listed) out.push({ k: r.org ? "ra:" + r.key : "rp:" + r.key, depth: 1, kind: "maker", label: r.who, ticker: r.org ? r.tag : r.address.split(", ").slice(0, 3).join(", ") });

}
// Everything with an address, spelled out.
function addressed() {
  const land = allParcels().map(({ a, x, p }) => ({ key: parcelKey(a, x, p).slice(3), who: ownerOf(p.owner).name, tag: "", to: parcelKey(a, x, p), html: `<a data-k="${esc(parcelKey(a, x, p))}">${esc(parcelAddress(a, x, p))}</a>`, whoTo: ownerOf(p.owner).to, address: parcelAddress(a, x, p) }));

function reveal(k) {
  if (k.startsWith("el:") || k.startsWith("mat:") || k.startsWith("proc:")) {
    const e = k.startsWith("el:") ? elBySymbol[k.slice(3)] : k.startsWith("mat:") ? matBySlug[k.slice(4)] : procBySlug[k.slice(5)]; if (!e) return;
    open.add("x:" + e.under);

    for (let s = up; s && s.parent; s = byId[s.parent]) open.add("x:" + s.parent);
    keepOpen();
    return;
  }
  if (k.startsWith("mk:")) { open.add("mh"); keepOpen(); return; }
  if (k.startsWith("ra:") || k.startsWith("rp:")) { open.add("ar"); keepOpen(); return; }
  if (k.startsWith("ad:")) { open.add("la"); keepOpen(); return; }
  if (k.startsWith("bd:") || k.startsWith("at:") || k.startsWith("pc:") || k.startsWith("fc:")) {
    const org = k.startsWith("at:") ? ORGS.find(o => o.key === k.slice(3)) : null;
    const [sy, slug] = org ? org.address.at.split("/") : k.split(":").slice(1);
    const a = DATA.administrations.find(x => x.slug === sy); if (!a) return;
    open.add("la"); open.add("ad:" + sy);
    // (Open the bodies above it; and itself and its tower, for what has its address there.)
    let x = a.bodies.find(y => y.slug === slug);
    if (x && (org || k.startsWith("pc:") || k.startsWith("fc:"))) open.add(`bd:${sy}:${x.slug}`);
    if (x && k.startsWith("fc:")) { const f = (x.facilities || []).find(y => y.slug === k.split(":")[3]); if (f) open.add(`pc:${sy}:${x.slug}:${f.parcel}`); }
    for (x = x && a.bodies.find(y => y.name === x.at); x; x = a.bodies.find(y => y.name === x.at)) open.add(`bd:${sy}:${x.slug}`);
    keepOpen(); return;
  }
  const s = stdOf(k); if (!s) return;
  open.add("b:" + s.body);
  for (let u = s; u && u.parent; u = byId[u.parent]) open.add("x:" + u.parent);

}

// The periodic table: groups 1-18 across, periods 1-7 down; the lanthanides (57-71) and
// actinides (89-103) in two rows below, under where they belong (group 3).
function periodicTable(els) {
  const slug = c => "c-" + (c || "unknown").replace(/[^a-z]+/g, "-");
  let h = `<h3>The periodic table</h3><div class="ptable">`;
  h += `<div class="hd" style="grid-row:1;grid-column:1"></div>`;
  for (let g = 1; g <= 18; g++) h += `<div class="hd" style="grid-row:1;grid-column:${g + 1}">${g}</div>`;
  for (let p = 1; p <= 7; p++) h += `<div class="hd" style="grid-row:${p + 1};grid-column:1">${p}</div>`;
  h += `<div class="ph" style="grid-row:7;grid-column:4">57-71</div><div class="ph" style="grid-row:8;grid-column:4">89-103</div>`;
  h += `<div class="hd" style="grid-row:9;grid-column:1 / span 19;height:10px"></div>`;
  for (const e of els) {
    const i = e.identity, z = i.atomic_number;
    let row, col;
    if (z >= 57 && z <= 71) { row = 10; col = z - 57 + 4; }
    else if (z >= 89 && z <= 103) { row = 11; col = z - 89 + 4; }
    else { row = i.period + 1; col = i.group + 1; }
    h += `<div class="el ${slug(i.category)}" style="grid-row:${row};grid-column:${col}" data-k="${esc("el:" + i.symbol)}" title="${esc(`${i.name} (${i.category || ""})`)}"><span class="z">${z}</span><span class="sy">${esc(i.symbol)}</span></div>`;
  }
  h += `</div><div class="legend">`;
  for (const c of [...new Set(els.map(e => e.identity.category).filter(Boolean))]) h += `<span><i class="${slug(c)}"></i>${esc(c)}</span>`;
  return h + `</div>`;
}

  }
  if (kind === "pc") {
    const a = DATA.administrations.find(y => y.slug === rest[0]); const x = a && a.bodies.find(y => y.slug === rest[1]); const p = x && (x.parcels || []).find(y => String(y.number) === rest[2]); if (!p) return "";
    const z = (x.zones || []).find(y => y.slug === p.zone);
    const where = `<a data-k="${esc(`bd:${a.slug}:${x.slug}`)}">${esc(x.name)}</a>${x.at ? ", " + esc(x.at) : ""}, <a data-k="${esc("ad:" + a.slug)}">${esc(a.name)}</a>`;
    return `<h2>Parcel ${p.number}</h2><div class="meta">parcel</div><h3>Address</h3><p>Parcel ${p.number}, ${where}</p><table><tr><th>Owner</th><th>Zone</th><th>Area</th></tr><tr><td>${ownerLink(p.owner)}</td><td>${z ? esc(z.name) + ` <span class="meta">${esc(z.use)}</span>` : ""}</td><td>${hectares(p.area)}</td></tr></table>` + ((x.facilities || []).some(f => f.parcel === p.number) ? `<h3>On it</h3>` + x.facilities.filter(f => f.parcel === p.number).map(f => `<div><a data-k="${esc(facKey(a, x, f))}">${esc(f.name)}</a> <span class="meta">${esc(f.kind)}</span></div>`).join("") : "") + landMap(a, x, p.number) + `<div class="file" style="margin-top:24px">standards/${esc(p.file)}</div>`;
  }
  if (kind === "mk") {
    const m = DATA.makers.find(x => x.key === rest.join(":")); if (!m) return "";
    return `${logo(m.slug, "big")}<h2>${esc(m.name)}</h2><div class="meta">${esc(m.ticker)}</div><p>${esc(m.note)}</p>` + (ORGS.find(o => o.key === m.key) ? `<h3>Address</h3><p>${addressHtml(ORGS.find(o => o.key === m.key))}</p>` : "") + (allFacilities().some(r => r.f.owner === m.key) ? `<h3>Facilities</h3><table><tr><th>Facility</th><th>Kind</th><th>Where</th></tr>` + allFacilities().filter(r => r.f.owner === m.key).map(({ a, x, f }) => `<tr><td><a data-k="${esc(facKey(a, x, f))}">${esc(f.name)}</a></td><td>${esc(f.kind)}</td><td>Parcel ${f.parcel}, ${esc(x.name)}, ${esc(a.name)}</td></tr>`).join("") + `</table>` : "") + (m.who ? `<h3>Who they are</h3><p>${esc(m.who)}</p>` : "") + (allFacilities().some(r => r.f.owner === m.key) ? `<h3>Facilities</h3><table><tr><th>Facility</th><th>Kind</th><th>Where</th></tr>` + allFacilities().filter(r => r.f.owner === m.key).map(({ a, x, f }) => `<tr><td><a data-k="${esc(facKey(a, x, f))}">${esc(f.name)}</a></td><td>${esc(f.kind)}</td><td>Parcel ${f.parcel}, ${esc(x.name)}, ${esc(a.name)}</td></tr>`).join("") + `</table>` : "") + (m.what ? `<h3>What they do</h3><p>${esc(m.what)}</p>` : "") + (allFacilities().some(r => r.f.owner === m.key) ? `<h3>Facilities</h3><table><tr><th>Facility</th><th>Kind</th><th>Where</th></tr>` + allFacilities().filter(r => r.f.owner === m.key).map(({ a, x, f }) => `<tr><td><a data-k="${esc(facKey(a, x, f))}">${esc(f.name)}</a></td><td>${esc(f.kind)}</td><td>Parcel ${f.parcel}, ${esc(x.name)}, ${esc(a.name)}</td></tr>`).join("") + `</table>` : "") + ((m.story || []).length ? `<h3>Story</h3>` + m.story.map(p => `<p>${esc(p)}</p>`).join("") : "") + `<div class="file" style="margin-top:24px">standards/${esc(m.file)}</div>`;
  }
  if (kind === "g") {
    const b = DATA.bodies.find(x => x.key === rest[0]); if (!b) return "";
    if (rest[1] === "number") return `<h2>${esc(b.prefix)} by number</h2>` + list(ofBody(b, ""));
    return `<h2>${esc(b.prefix)} by topic</h2>` + topicsOf(b).map(t => `<div><a data-k="${esc(`t:${b.key}:${t}`)}">${esc(t)}</a> <span class="meta">(${under(b, t, "").length})</span></div>`).join("") || `<p class="meta">No topics yet: they come from the standards' tags.</p>`;
  }
  if (kind === "t") {
    const b = DATA.bodies.find(x => x.key === rest[0]); if (!b) return "";
    const t = rest.slice(1).join(":");
    const stds = under(b, t, "");
    const near = [...new Set(stds.flatMap(s => s.topics || []))].filter(x => x !== t).sort();
    let h = `<h2>${esc(t)}</h2><div class="meta">${esc(b.prefix)} · ${stds.length} standards</div><h3>Standards</h3>` + list(stds);
    if (near.length) h += `<h3>Tagged with it too</h3>` + near.map(x => `<a data-k="${esc(`t:${b.key}:${x}`)}">${esc(x)}</a>`).join(" · ");
    return h;
  }
  if (kind === "el" || kind === "mat" || kind === "proc") {
    const e = kind === "el" ? elBySymbol[rest[0]] : kind === "mat" ? matBySlug[rest.join(":")] : procBySlug[rest.join(":")]; if (!e) return "";
    const i = e.identity, up = byId[e.under];
    let h = kind === "el" ? `<h2>${elTile(e)}${esc(i.name)}</h2>` : `<h2>${icon(e.slug, "big")} ${esc(i.name)}</h2>`;
    if (up) h += `<div class="meta">in <a data-k="${esc("s:" + up.id)}">${esc(up.title)}</a></div>`;
    const show = v => v === null ? "–" : Array.isArray(v) && !v.length ? "–" : Array.isArray(v) && v[0] && v[0].mass_number ? v.map(x => `${x.mass_number}: ${+(x.abundance * 100).toPrecision(5)}%`).join(", ") : Array.isArray(v) && v[0] && v[0].part ? v.map(x => `${x.part} ${+(x.share * 100).toPrecision(3)}%`).join(", ") : Array.isArray(v) ? v.map(x => typeof x === "object" ? Object.entries(x).map(([a, b]) => `${a} ${b}`).join(", ") : x).join(v.some(x => typeof x === "object") ? "; " : ", ") : typeof v === "object" ? Object.entries(v).map(([a, b]) => `${a}: ${b}`).join(", ") : v;
    for (const [g, props] of Object.entries(kind === "el" ? DATA.element_groups : kind === "mat" ? DATA.material_groups : DATA.process_groups)) {
      if (!e[g]) continue;
      h += `<h3>${esc(g.replace(/_/g, " "))}</h3><table><tr><th>Property</th><th>Value</th><th>Unit or note</th></tr>`;
      for (const [key, note] of Object.entries(props)) if (key in e[g]) h += `<tr><td>${esc(key.replace(/_/g, " "))}</td><td>${Array.isArray(e[g][key]) && e[g][key][0] && (e[g][key][0].item || e[g][key][0].name) ? e[g][key].map(itemLink).join("<br>") : esc(show(e[g][key]))}</td><td class="meta">${esc(note)}</td></tr>`;
      h += `</table>`;
    }
    if (kind === "proc") {
      const at = allFacilities().filter(r => (r.f.processes || []).includes(e.slug));
      if (at.length) h += `<h3>Run at</h3><table><tr><th>Facility</th><th>Owner</th><th>Where</th></tr>` + at.map(({ a, x, f }) => `<tr><td><a data-k="${esc(facKey(a, x, f))}">${esc(f.name)}</a></td><td>${ownerLink(f.owner)}</td><td>${esc(x.name)}, ${esc(a.name)}</td></tr>`).join("") + `</table>`;
    }
    h += `<div class="file" style="margin-top:24px">standards/${esc(e.file)}</div>`;
    return h;
  }
  const s = stdOf(k); if (!s) return "";
  const body = DATA.bodies.find(x => x.key === s.body);
  let h = `<h2><span style="color:var(--id)">${esc(s.id)}</span> ${esc(s.title)}</h2>`;
  if (s.purpose) h += `<h3>Purpose</h3><p>${esc(s.purpose)}</p>`;
  if (s.details) {
    h += `<h3>Details</h3>`;
    const paras = Array.isArray(s.details.text) ? s.details.text : (s.details.text ? [s.details.text] : []);
    // (A line starting "- " is a list item.)
    h += paras.map(p => p.startsWith("- ") ? `<li>${esc(p.slice(2))}</li>` : `<p>${esc(p)}</p>`).join("").replace(/((?:<li>.*?<\/li>)+)/g, "<ul>$1</ul>");
    if (s.details.table) h += `<table><tr>${s.details.table.columns.map(c => `<th>${esc(c)}</th>`).join("")}</tr>${s.details.table.rows.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</table>`;
  }
  const els = elementsUnder(s.id, "");
  if (els.length) h += periodicTable(els);
  const mats = materialsUnder(s.id, "");
  if (mats.length) h += `<h3>Materials</h3><table><tr><th>Material</th><th>Class</th><th>Density (kg/m3)</th><th>Made of</th></tr>${mats.map(m => `<tr><td>${icon(m.slug)} <a data-k="${esc("mat:" + m.slug)}">${esc(m.identity.name)}</a></td><td>${esc(m.identity.class)}</td><td class="num">${(m.mass || {}).density ?? ""}</td><td>${esc((m.identity.composition || []).slice(0, 3).map(x => x.part).join(", "))}</td></tr>`).join("")}</table>`;
  const allProcs = processesUnder(s.id, "");
  const procs = allProcs.filter(p => kindShown === "all" || p.identity.kind === kindShown);
  if (allProcs.length) {
    const kinds = [...new Set(allProcs.map(p => p.identity.kind))];
    h += `<h3>Processes</h3><div class="badges"><span class="badge${kindShown === "all" ? " on" : ""}" data-kind="all">all (${allProcs.length})</span>${kinds.map(k => `<span class="badge k-${esc(k)}${kindShown === k ? " on" : ""}" data-kind="${esc(k)}">${esc(k)} (${allProcs.filter(p => p.identity.kind === k).length})</span>`).join("")}</div>`;
  }
  if (allProcs.length) h += `<div class="gallery">${procs.map(p => `<a data-k="${esc("proc:" + p.slug)}">${icon(p.slug, "big")}<span>${esc(p.identity.name)}</span></a>`).join("")}</div><table><tr><th>Process</th><th>Kind</th><th>Goes in</th><th>Comes out</th></tr>${procs.map(p => `<tr><td>${icon(p.slug)} <a data-k="${esc("proc:" + p.slug)}">${esc(p.identity.name)}</a></td><td>${esc(p.identity.kind)}</td><td>${(((p.inputs || {}).materials) || []).map(x => esc((elBySymbol[x.item] || matBySlug[x.item] || {identity: {name: x.name || x.item}}).identity.name)).join(", ")}</td><td>${(((p.outputs || {}).products) || []).map(x => esc((matBySlug[x.item] || {identity: {name: x.name || x.item}}).identity.name) + (x.form ? ` (${esc(x.form)})` : x.grade ? ` (${esc(x.grade)})` : "")).join(", ")}</td></tr>`).join("")}</table>`;
  if (s.scope) h += `<h3>Scope</h3><p>${esc(s.scope)}</p>`;
  for (const sec of s.sections || []) {
    if (sec.title) h += `<h3>${esc(sec.title)}</h3>`;
    const paras = Array.isArray(sec.text) ? sec.text : (sec.text ? [sec.text] : []);
    h += paras.map(p => `<p>${esc(p)}</p>`).join("");
    if (sec.table) h += `<table><tr>${sec.table.columns.map(c => `<th>${esc(c)}</th>`).join("")}</tr>${sec.table.rows.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</table>`;
  }
  if ((s.refs || []).length) h += `<h3>Builds on</h3>` + s.refs.map(r => `<div><a data-k="s:${r}">${esc(r)}</a> ${esc(byId[r] ? byId[r].title : "?")}</div>`).join("");
  const cited = DATA.cited[s.id] || [];
  if (cited.length) h += `<h3>Built on by</h3>` + cited.map(r => `<div><a data-k="s:${r}">${esc(r)}</a> ${esc(byId[r] ? byId[r].title : "?")}</div>`).join("");
  const params = s.params || [];
  const table = params.filter(p => String(p.key).includes("."));
  const plain = params.filter(p => !String(p.key).includes("."));
  if (table.length) {
    const rowsK = [...new Set(table.map(p => String(p.key).split(".")[0]))];
    const cols = [...new Set(table.map(p => String(p.key).split(".")[1]))];
    const unit = c => (table.find(p => String(p.key).endsWith("." + c)) || {}).unit;
    h += `<h3>Parameters by class or size</h3><table><tr><th></th>${cols.map(c => `<th>${esc(c)}${unit(c) ? ` (${esc(unit(c))})` : ""}</th>`).join("")}</tr>`;
    for (const r of rowsK) h += `<tr><td><b>${esc(r)}</b></td>${cols.map(c => { const p = table.find(x => x.key === `${r}.${c}`); return `<td class="${p && typeof p.value === "number" ? "num" : ""}">${p ? value(p.value) : "–"}</td>`; }).join("")}</tr>`;
    h += `</table>`;
  }
  if (plain.length) h += `<h3>Parameters</h3><table><tr><th>Parameter</th><th>Value</th><th>Unit</th></tr>${plain.map(p => `<tr><td>${esc(p.key)}</td><td>${value(p.value)}</td><td>${esc(p.unit || "")}</td></tr>`).join("")}</table>`;
  const notes = params.filter(p => p.note);
  if (notes.length) h += `<h3>Notes</h3><table><tr><th>Parameter</th><th>Note</th></tr>${notes.map(p => `<tr><td>${esc(p.key)}</td><td>${esc(p.note)}</td></tr>`).join("")}</table>`;
  if ((s.requires || []).length) h += `<h3>Requires</h3><table><tr><th>Subject</th><th>Check</th><th>Against</th><th>Per</th></tr>${s.requires.map(r => `<tr><td>${esc(r.subject)}</td><td>${esc(String(r.check).replace(/_/g, " "))}</td><td>${esc(r.param)}</td><td>${esc(r.per || "")}</td></tr>`).join("")}</table>`;
  if (s.text) h += `<h3>Why</h3><p>${esc(s.text)}</p>`;
  h += `<div class="file" style="margin-top:24px">standards/${esc(s.file)}</div>`;
  return h;
}

document.addEventListener("click", e => {
  const badge = e.target.closest("[data-kind]");
  if (badge) { kindShown = badge.dataset.kind; render(); return; }
  const el = e.target.closest("[data-k]"); if (!el) return;
  const k = el.dataset.k;
  if (el.classList.contains("row") && !k.startsWith("s:") && !k.startsWith("el:") && !k.startsWith("mat:") && !k.startsWith("proc:")) {
    if (open.has(k) && k === current) open.delete(k); else open.add(k);
    keepOpen();
  }
  // (A record with elements under it: its list opens, and closes on a second click.)
  if (el.classList.contains("row") && k.startsWith("s:") && (recordsUnder(k.slice(2)) || DATA.standards.some(x => x.parent === k.slice(2)))) {
    const x = "x:" + k.slice(2);
    if (open.has(x) && k === current) open.delete(x); else open.add(x);
    keepOpen();
  }
  reveal(k);
  select(k);
});
document.getElementById("q").addEventListener("input", render);
// The tree's width: dragged, and kept.
{
  const main = document.querySelector("main"), grip = document.getElementById("grip");
  const setW = w => main.style.setProperty("--nav-w", Math.max(180, Math.min(w, window.innerWidth - 300)) + "px");
  try { const w = +localStorage.getItem("standards-nav-w"); if (w) setW(w); } catch (e) {}
  grip.addEventListener("pointerdown", e => {
    grip.classList.add("drag"); grip.setPointerCapture(e.pointerId);
    const move = ev => setW(ev.clientX);
    const up = ev => {
      grip.classList.remove("drag"); grip.removeEventListener("pointermove", move); grip.removeEventListener("pointerup", up);
      try { localStorage.setItem("standards-nav-w", Math.round(ev.clientX)); } catch (e2) {}
    };
    grip.addEventListener("pointermove", move); grip.addEventListener("pointerup", up);
  });
}
window.addEventListener("hashchange", () => { current = decodeURIComponent(location.hash.slice(1)); reveal(current); render(); });
render();
</script>
