<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Standards Registry</title>
<style>
:root {
  color-scheme: dark;
  /* The game's HUD: near-black panels on dark slate, pale text, amber, cyan, green. */
  --bg: #2b3138; --panel: #20262c; --line: #3a4652; --text: #dcebf2; --dim: #8fa3b0;
  --head: #60ffb0; --id: #ffb040; --link: #5cc8f0; --sel: #1f4a3d; --bad: #ff5a4a; --code: #2e363e;
  --th: #48505a; --tbl: #383e46; --tline: #535c67;
  --nav: #20262c;
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #ffffff; --panel: #ffffff; --line: #b9c4cd; --text: #0a1117; --dim: #3d4f5c;
  --head: #04683b; --id: #0a58b8; --link: #0a58b8; --sel: #cdeedd; --bad: #b0281a; --code: #e9eef2;
  --th: #dceaf3; --tbl: #f3f8fb; --tline: #b7cbd8;
  --nav: #f4f6f8;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; letter-spacing: .06em; }
header { display: flex; gap: 12px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 2; }
header { text-transform: none; }
header h1 { font-size: 15px; margin: 0; color: var(--head); letter-spacing: .05em; white-space: nowrap; }
header input { flex: 1; min-width: 0; max-width: 420px; padding: 6px 10px; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 4px; font: inherit; }
header .count { color: var(--dim); white-space: nowrap; }
header button { margin-left: auto; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 4px 10px; font: inherit; cursor: pointer; }
main { display: grid; grid-template-columns: var(--nav-w, 400px) 6px 1fr; height: calc(100vh - 49px); }
#grip { cursor: col-resize; background: var(--line); opacity: .5; }
#grip:hover, #grip.drag { opacity: 1; background: var(--head); }
nav { overflow: auto; padding: 8px 0; background: var(--nav); }
article { overflow: auto; padding: 16px 24px 48px; }
article > * { max-width: 110ch; }
.row { padding: 2px 12px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row:hover { background: var(--code); }
.row.sel { background: var(--sel); box-shadow: inset 3px 0 0 var(--head); font-weight: 600; }
.row .tw { display: inline-block; width: 1.2em; color: var(--dim); }
.row.body { color: var(--head); font-weight: bold; }
.row.empty { color: var(--dim); }
.row .n { color: var(--dim); }
.row .sid { color: var(--id); }
h2 { color: var(--head); font-size: 17px; margin: 0 0 4px; }
h3 { color: var(--dim); font-weight: 700 !important; font-size: 12px; letter-spacing: .08em; margin: 22px 0 6px; font-weight: normal; text-transform: uppercase; }
.meta { color: var(--dim); }
a { color: var(--link); text-decoration: none; cursor: pointer; }
a:hover { text-decoration: underline; }
table { border-collapse: collapse; margin: 4px 0; }
th, td { text-align: left; padding: 3px 14px 3px 0; vertical-align: top; }
th { color: var(--dim); font-weight: 700; border-bottom: 1px solid var(--line); text-transform: uppercase; font-size: 12px; background: var(--th); color: var(--text); border-bottom-color: var(--tline); }
tr + tr td { border-top: 1px solid var(--tline); }
table { background: var(--tbl); border: 1px solid var(--tline); }
th, td { padding: 4px 14px 4px 8px; }
th:first-child, td:first-child { padding-left: 4px; }
td.num { text-align: right; }
.problems { border: 1px solid var(--bad); color: var(--bad); padding: 8px 12px; margin: 8px 12px; border-radius: 4px; }
.problems li { margin: 2px 0; }
.file { color: var(--dim); font-size: 12px; }
p { margin: 4px 0 8px; max-width: 80ch; }
@media (max-width: 720px) {
  main { grid-template-columns: 1fr; height: auto; }
  #grip { display: none; }
  nav { max-height: 45vh; border-right: 0; border-bottom: 1px solid var(--line); }
  header { flex-wrap: wrap; }
}
</style>
</head>
<body>
<header>
  <h1>STANDARDS REGISTRY</h1>
  <input id="q" type="search" placeholder="Search ids, titles, text, parameters…" autocomplete="off">
  <span class="count" id="count"></span>
  <button id="theme" title="Light or dark">◐</button>
</header>
<main>
  <nav id="tree"></nav>
  <div id="grip" title="Drag to resize"></div>
  <article id="detail"></article>
</main>
<script>
const DATA = /*DATA*/null;
// The game's dark by default; light if chosen (kept, if storage works).
try { if (localStorage.getItem("standards-theme") === "light") document.documentElement.dataset.theme = "light"; } catch (e) {}
document.getElementById("theme").addEventListener("click", () => {
  const light = document.documentElement.dataset.theme !== "light";
  if (light) document.documentElement.dataset.theme = "light"; else delete document.documentElement.dataset.theme;
  try { localStorage.setItem("standards-theme", light ? "light" : "dark"); } catch (e) {}
});
const byId = Object.fromEntries(DATA.standards.map(s => [s.id, s]));
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
// A body's topics (tags on its standards), and its standards under one.
const topicsOf = body => [...new Set(DATA.standards.filter(s => s.body === body.key).flatMap(s => s.topics || []))].sort();
const under = (body, topic, q) => DATA.standards.filter(s => s.body === body.key && (s.topics || []).includes(topic) && matches(s, q));
const ofBody = (body, q) => DATA.standards.filter(s => s.body === body.key && matches(s, q));

// What's open, kept between visits (if storage works).
let open = new Set();
try { open = new Set(JSON.parse(localStorage.getItem("standards-open2") || "[]")); } catch (e) {}
const keepOpen = () => { try { localStorage.setItem("standards-open2", JSON.stringify([...open])); } catch (e) {} };
if (!open.size) DATA.bodies.forEach(b => open.add("b:" + b.key));

function matches(s, q) {
  if (!q) return true;
  const hay = [s.id, s.title, s.scope, s.text, ...(s.topics || []), ...(s.params || []).map(p => `${p.key} ${p.value} ${p.unit || ""} ${p.note || ""}`)].join(" ").toLowerCase();
  return q.split(/\s+/).every(w => hay.includes(w));
}

// The tree as shown: each body, its standards under it.
function rows(q) {
  const out = [];
  for (const body of DATA.bodies) {
    const bk = "b:" + body.key;
    out.push({ k: bk, depth: 0, kind: "body", label: `${body.name} (${body.prefix})`, title: body.name });
    if (!open.has(bk) && !q) continue;
    // (Records under their parent: a record with none sits under the body.)
    const all = ofBody(body, "");
    const shown = new Set(ofBody(body, q).map(s => s.id));
    const kids = id => all.filter(s => (s.parent || null) === id);
    const visible = s => shown.has(s.id) || kids(s.id).some(visible);
    const walk = (id, depth) => {
      for (const s of kids(id)) {
        if (q && !visible(s)) continue;
        out.push({ k: "s:" + s.id, depth, kind: "std", std: s });
        walk(s.id, depth + 1);
      }
    };
    walk(null, 1);
  }
  return out;
}

let current = decodeURIComponent(location.hash.slice(1));
const stdOf = k => k.startsWith("s:") ? byId[k.slice(2).split("@")[0]] : null;
// (Open the way to a standard: its body.)
function reveal(k) {
  const s = stdOf(k); if (!s) return;
  open.add("b:" + s.body);
  keepOpen();
}
reveal(current);
function select(key) { current = key; location.hash = encodeURIComponent(key); render(); }

function render() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const list = rows(q);
  let html = DATA.problems.length ? `<div class="problems"><b>${DATA.problems.length} problem(s)</b> (the game's content isn't updated until they're fixed):<ul>${DATA.problems.map(p => `<li>${esc(p)}</li>`).join("")}</ul></div>` : "";
  for (const n of list) {
    const pad = `padding-left:${12 + n.depth * 18}px`;
    const sel = n.k === current ? " sel" : "";
    const tw = n.kind === "std" ? "" : (open.has(n.k) || q ? "▾" : "▸");
    if (n.kind === "std") {
      html += `<div class="row${sel}" style="${pad}" data-k="${esc(n.k)}" title="${esc(n.std.id + " " + n.std.title)}"><span class="tw"></span>${esc(n.std.title)} <span class="n">${esc(n.std.id)}</span></div>`;
    } else {
      const cls = n.kind === "body" ? " body" : "";
      const count = n.n !== undefined ? ` <span class="n">(${n.n})</span>` : "";
      html += `<div class="row${cls}${sel}" style="${pad}" data-k="${esc(n.k)}" title="${esc(n.title || n.label)}"><span class="tw">${tw}</span>${esc(n.label)}${count}</div>`;
    }
  }
  document.getElementById("tree").innerHTML = html;
  const topics = new Set(DATA.standards.flatMap(s => s.topics || []));
  document.getElementById("count").textContent = `${DATA.standards.length} standards`;
  document.getElementById("detail").innerHTML = detail(current);
}

function value(v) { return Array.isArray(v) ? `${v[0]} – ${v[1]}` : esc(v); }

function detail(k) {
  if (!k) return `<h2>The standards registry</h2><p class="meta">Pick a body or standard on the left. Edit the YAML under <code>standards/</code>, rerun <code>python3 tools/standards/build.py</code>, refresh.</p>`;
  const [kind, ...rest] = k.split(":");
  const list = stds => stds.map(s => `<div><a data-k="${esc("s:" + s.id)}">${esc(s.id)}</a> ${esc(s.title)} </div>`).join("") || `<p class="meta">None yet.</p>`;
  if (kind === "b") {
    const b = DATA.bodies.find(x => x.key === rest[0]); if (!b) return "";
    const n = DATA.standards.filter(s => s.body === b.key).length;
    const seat = b.seat === "home" ? "the home station" : b.seat;
    let h = `<h2>${esc(b.name)}</h2><div class="meta">${esc(b.kind || "")} · prefix ${esc(b.prefix)} · seated at ${esc(seat)} · ${n} standards</div><p>${esc(b.note)}</p>`;
    if ((b.founded_by || []).length) h += `<h3>Founded by</h3>` + b.founded_by.map(m => `<div>${esc(DATA.brands[m] || m)}</div>`).join("");
    if ((b.about || []).length) h += `<h3>About</h3>` + b.about.map(p => `<p>${esc(p)}</p>`).join("");
    return h;
  }
  if (kind === "g") {
    const b = DATA.bodies.find(x => x.key === rest[0]); if (!b) return "";
    if (rest[1] === "number") return `<h2>${esc(b.prefix)} by number</h2>` + list(ofBody(b, ""));
    return `<h2>${esc(b.prefix)} by topic</h2>` + topicsOf(b).map(t => `<div><a data-k="${esc(`t:${b.key}:${t}`)}">${esc(t)}</a> <span class="meta">(${under(b, t, "").length})</span></div>`).join("") || `<p class="meta">No topics yet: they come from the standards' tags.</p>`;
  }
  if (kind === "t") {
    const b = DATA.bodies.find(x => x.key === rest[0]); if (!b) return "";
    const t = rest.slice(1).join(":");
    const stds = under(b, t, "");
    const near = [...new Set(stds.flatMap(s => s.topics || []))].filter(x => x !== t).sort();
    let h = `<h2>${esc(t)}</h2><div class="meta">${esc(b.prefix)} · ${stds.length} standards</div><h3>Standards</h3>` + list(stds);
    if (near.length) h += `<h3>Tagged with it too</h3>` + near.map(x => `<a data-k="${esc(`t:${b.key}:${x}`)}">${esc(x)}</a>`).join(" · ");
    return h;
  }
  const s = stdOf(k); if (!s) return "";
  const body = DATA.bodies.find(x => x.key === s.body);
  let h = `<h2><span style="color:var(--id)">${esc(s.id)}</span> ${esc(s.title)}</h2>`;
  if (s.purpose) h += `<h3>Purpose</h3><p>${esc(s.purpose)}</p>`;
  if (s.details) {
    h += `<h3>Details</h3>`;
    const paras = Array.isArray(s.details.text) ? s.details.text : (s.details.text ? [s.details.text] : []);
    // (A line starting "- " is a list item.)
    h += paras.map(p => p.startsWith("- ") ? `<li>${esc(p.slice(2))}</li>` : `<p>${esc(p)}</p>`).join("").replace(/((?:<li>.*?<\/li>)+)/g, "<ul>$1</ul>");
    if (s.details.table) h += `<table><tr>${s.details.table.columns.map(c => `<th>${esc(c)}</th>`).join("")}</tr>${s.details.table.rows.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</table>`;
  }
  if (s.scope) h += `<h3>Scope</h3><p>${esc(s.scope)}</p>`;
  for (const sec of s.sections || []) {
    if (sec.title) h += `<h3>${esc(sec.title)}</h3>`;
    const paras = Array.isArray(sec.text) ? sec.text : (sec.text ? [sec.text] : []);
    h += paras.map(p => `<p>${esc(p)}</p>`).join("");
    if (sec.table) h += `<table><tr>${sec.table.columns.map(c => `<th>${esc(c)}</th>`).join("")}</tr>${sec.table.rows.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</table>`;
  }
  if ((s.refs || []).length) h += `<h3>Builds on</h3>` + s.refs.map(r => `<div><a data-k="s:${r}">${esc(r)}</a> ${esc(byId[r] ? byId[r].title : "?")}</div>`).join("");
  const cited = DATA.cited[s.id] || [];
  if (cited.length) h += `<h3>Built on by</h3>` + cited.map(r => `<div><a data-k="s:${r}">${esc(r)}</a> ${esc(byId[r] ? byId[r].title : "?")}</div>`).join("");
  const params = s.params || [];
  const table = params.filter(p => String(p.key).includes("."));
  const plain = params.filter(p => !String(p.key).includes("."));
  if (table.length) {
    const rowsK = [...new Set(table.map(p => String(p.key).split(".")[0]))];
    const cols = [...new Set(table.map(p => String(p.key).split(".")[1]))];
    const unit = c => (table.find(p => String(p.key).endsWith("." + c)) || {}).unit;
    h += `<h3>Parameters by class or size</h3><table><tr><th></th>${cols.map(c => `<th>${esc(c)}${unit(c) ? ` (${esc(unit(c))})` : ""}</th>`).join("")}</tr>`;
    for (const r of rowsK) h += `<tr><td><b>${esc(r)}</b></td>${cols.map(c => { const p = table.find(x => x.key === `${r}.${c}`); return `<td class="${p && typeof p.value === "number" ? "num" : ""}">${p ? value(p.value) : "–"}</td>`; }).join("")}</tr>`;
    h += `</table>`;
  }
  if (plain.length) h += `<h3>Parameters</h3><table><tr><th>Parameter</th><th>Value</th><th>Unit</th></tr>${plain.map(p => `<tr><td>${esc(p.key)}</td><td>${value(p.value)}</td><td>${esc(p.unit || "")}</td></tr>`).join("")}</table>`;
  const notes = params.filter(p => p.note);
  if (notes.length) h += `<h3>Notes</h3><table><tr><th>Parameter</th><th>Note</th></tr>${notes.map(p => `<tr><td>${esc(p.key)}</td><td>${esc(p.note)}</td></tr>`).join("")}</table>`;
  if ((s.requires || []).length) h += `<h3>Requires</h3><table><tr><th>Subject</th><th>Check</th><th>Against</th><th>Per</th></tr>${s.requires.map(r => `<tr><td>${esc(r.subject)}</td><td>${esc(String(r.check).replace(/_/g, " "))}</td><td>${esc(r.param)}</td><td>${esc(r.per || "")}</td></tr>`).join("")}</table>`;
  if (s.text) h += `<h3>Why</h3><p>${esc(s.text)}</p>`;
  h += `<div class="file" style="margin-top:24px">standards/${esc(s.file)}</div>`;
  return h;
}

document.addEventListener("click", e => {
  const el = e.target.closest("[data-k]"); if (!el) return;
  const k = el.dataset.k;
  if (el.classList.contains("row") && !k.startsWith("s:")) {
    if (open.has(k) && k === current) open.delete(k); else open.add(k);
    keepOpen();
  }
  reveal(k);
  select(k);
});
document.getElementById("q").addEventListener("input", render);
// The tree's width: dragged, and kept.
{
  const main = document.querySelector("main"), grip = document.getElementById("grip");
  const setW = w => main.style.setProperty("--nav-w", Math.max(180, Math.min(w, window.innerWidth - 300)) + "px");
  try { const w = +localStorage.getItem("standards-nav-w"); if (w) setW(w); } catch (e) {}
  grip.addEventListener("pointerdown", e => {
    grip.classList.add("drag"); grip.setPointerCapture(e.pointerId);
    const move = ev => setW(ev.clientX);
    const up = ev => {
      grip.classList.remove("drag"); grip.removeEventListener("pointermove", move); grip.removeEventListener("pointerup", up);
      try { localStorage.setItem("standards-nav-w", Math.round(ev.clientX)); } catch (e2) {}
    };
    grip.addEventListener("pointermove", move); grip.addEventListener("pointerup", up);
  });
}
window.addEventListener("hashchange", () => { current = decodeURIComponent(location.hash.slice(1)); reveal(current); render(); });
render();
</script>
</body>
</html>
